- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/etc/sysctl.d
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/home/ansible
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ ''automate.chef.lab'' }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl configuration file
    ansible.builtin.copy:
      content: '# Kernel parameters for Chef Automate

        vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        '
      dest: /tmp/molecule_test/home/ansible/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        (mock key content)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/ansible/jtonello.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        (mock key content)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/ansible/lab-validator.pem
      mode: '0600'
  - name: Create mock Chef Server status file
    ansible.builtin.copy:
      content: 'run: postgresql: running

        run: elasticsearch: running

        run: chef-server: running

        run: automate-cs-oc-erchef: running

        run: automate-cs-nginx: running

        '
      dest: /tmp/molecule_test/home/ansible/chef-server-status.txt
      mode: '0644'
  - name: Create mock Chef Automate status file
    ansible.builtin.copy:
      content: 'Service Name: automate-gateway

        Status: running

        Service Name: automate-postgresql

        Status: running

        Service Name: automate-elasticsearch

        Status: running

        '
      dest: /tmp/molecule_test/home/ansible/chef-automate-status.txt
      mode: '0644'
  - name: Create mock user list output
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/home/ansible/chef-user-list.txt
      mode: '0644'
  - name: Create mock org list output
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/home/ansible/chef-org-list.txt
      mode: '0644'
