---
controller_credentials:
- name: Chef Automate User Credentials - chef_automate_deployment
  description: User credentials for Chef Automate and Chef Infra Server
  organization: Default
  credential_type: Chef Automate User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
    password: '{{ vault_password }}'
- name: Chef Organization Credentials - chef_automate_deployment
  description: Organization configuration for Chef Infra Server
  organization: Default
  credential_type: Chef Organization Credentials
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
    validator_key: '{{ vault_validator_key }}'
