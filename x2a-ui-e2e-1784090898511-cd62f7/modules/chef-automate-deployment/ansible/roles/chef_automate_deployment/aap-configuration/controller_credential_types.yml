---
controller_credential_types:
- name: Chef Automate User Credentials
  description: User credentials for Chef Automate and Chef Infra Server
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Automate/Infra Server
    - id: full_name
      type: string
      label: Full Name
      help_text: User's full name
    - id: email
      type: string
      label: Email Address
      help_text: User's email address
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Automate/Infra Server authentication
    required:
    - username
    - password
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
      password: !unsafe '{{ password }}'
- name: Chef Organization Credentials
  description: Organization configuration for Chef Infra Server
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name for the Chef organization
    - id: validator_key
      type: string
      label: Validator Key
      secret: true
      help_text: PEM file content for organization validation
    required:
    - org_name
    - org_full_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
      validator_key: !unsafe '{{ validator_key }}'
