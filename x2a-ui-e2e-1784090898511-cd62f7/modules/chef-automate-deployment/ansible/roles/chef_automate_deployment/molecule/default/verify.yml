- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate CLI in usr/local/bin
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/local/bin/chef-automate
    register: chef_automate_cli_bin
  - name: Assert Chef Automate CLI in usr/local/bin
    ansible.builtin.assert:
      that:
      - chef_automate_cli_bin.stat.exists
      - chef_automate_cli_bin.stat.executable
      fail_msg: Chef Automate CLI not found in /usr/local/bin or not executable
      success_msg: Chef Automate CLI exists in /usr/local/bin and is executable
  - name: Check chef-server-ctl exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/chef-server-ctl
    register: chef_server_ctl
  - name: Assert chef-server-ctl exists
    ansible.builtin.assert:
      that:
      - chef_server_ctl.stat.exists
      - chef_server_ctl.stat.executable
      fail_msg: chef-server-ctl not found or not executable
      success_msg: chef-server-ctl exists and is executable
  - name: Check /hab directory exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert /hab directory exists
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: /hab directory not found
      success_msg: /hab directory exists
  - name: Check user PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/testuser/testuser.pem
    register: user_pem
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.size > 0
      fail_msg: User PEM file not found or empty
      success_msg: User PEM file exists
  - name: Check organization validator PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/testuser/testorg-validator.pem
    register: org_pem
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_pem.stat.exists
      - org_pem.stat.size > 0
      fail_msg: Organization validator PEM file not found or empty
      success_msg: Organization validator PEM file exists
  - name: Check vm.max_map_count kernel parameter
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - (max_map_count.content | b64decode | trim) == "262144"
      fail_msg: vm.max_map_count not set correctly
      success_msg: vm.max_map_count set correctly
  - name: Check vm.dirty_expire_centisecs kernel parameter
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - (dirty_expire_centisecs.content | b64decode | trim) == "20000"
      fail_msg: vm.dirty_expire_centisecs not set correctly
      success_msg: vm.dirty_expire_centisecs set correctly
  - name: Check hostname file
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_file.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
  - name: Check Chef Automate service is running
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      - ansible_facts.services['chef-automate.service'].state == 'running'
      fail_msg: Chef Automate service not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check Chef Infra Server service is running
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Infra Server service is running
    ansible.builtin.assert:
      that:
      - '''chef-server.service'' in ansible_facts.services'
      - ansible_facts.services['chef-server.service'].state == 'running'
      fail_msg: Chef Infra Server service not running
      success_msg: Chef Infra Server service is running
    tags: molecule-notest
  - name: Check Chef Automate web UI is accessible
    ansible.builtin.uri:
      url: https://{{ chef_automate_hostname }}
      validate_certs: false
      status_code: 200
    tags: molecule-notest
  - name: Check Chef Infra Server API is accessible
    ansible.builtin.uri:
      url: https://{{ chef_automate_hostname }}/organizations/{{ org_name }}
      validate_certs: false
      status_code: 200
    tags: molecule-notest
