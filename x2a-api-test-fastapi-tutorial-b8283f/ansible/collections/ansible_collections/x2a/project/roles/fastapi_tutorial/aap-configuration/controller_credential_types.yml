---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the FastAPI application's PostgreSQL role and database. The password is currently hardcoded in the Chef recipe and should be
      migrated to protected AAP credential storage.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL role; currently hardcoded as fastapi_password.
        - id: db_name
          type: string
          label: Database Name
          help_text: "PostgreSQL database used by the FastAPI application: fastapi_db."
        - id: db_host
          type: string
          label: Database Host
          help_text: "PostgreSQL host used by the application connection string: localhost."
        - id: db_port
          type: string
          label: Database Port
          help_text: PostgreSQL service port; the plan verifies the default port 5432.
      required:
        - db_username
        - db_password
        - db_name
        - db_host
        - db_port
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_name: !unsafe "{{ db_name }}"
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
