---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials for the FastAPI application's PostgreSQL role and database. The password is currently hardcoded in the Chef recipe and should be 
      migrated to protected AAP credential storage.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      db_name: "{{ db_name }}"
      db_host: "{{ db_host }}"
      db_port: "{{ db_port }}"
