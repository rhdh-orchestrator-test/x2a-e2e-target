---
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_automate_username | default(username) }} {{ chef_automate_longusername | default(full_name) }} {{ chef_automate_useremail
      | default(email) }} "{{ chef_automate_userpassword | default(password) }}" --filename {{ chef_automate_user_key_path }}

      '
  args:
    creates: "{{ chef_automate_user_key_path }}"
  register: create_user
  changed_when: create_user.rc == 0
  failed_when: create_user.rc != 0
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_orgname }} "{{ chef_automate_longorgname }}" --association_user {{ chef_automate_username | default(username)
      }} --filename {{ chef_automate_org_key_path }}

      '
  args:
    creates: "{{ chef_automate_org_key_path }}"
  register: create_org
  changed_when: create_org.rc == 0
  failed_when: create_org.rc != 0
  become: true
- name: Set proper permissions on key files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  loop:
    - "{{ chef_automate_user_key_path }}"
    - "{{ chef_automate_org_key_path }}"
  when: create_user.changed or create_org.changed
