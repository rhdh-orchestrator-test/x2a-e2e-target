- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check hosts file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hosts/hosts
    register: hosts_file
  - name: Assert hosts file exists
    ansible.builtin.assert:
      that:
      - hosts_file.stat.exists
      - hosts_file.stat.size > 0
      fail_msg: Hosts file not found
      success_msg: Hosts file exists
  - name: Get hosts file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hosts/hosts
    register: hosts_content
    when: hosts_file.stat.exists
  - name: Assert hosts file contains hostname entry
    ansible.builtin.assert:
      that:
      - (hosts_content.content | b64decode) is search("127.0.1.1 automate.chef.lab")
      fail_msg: Hosts file does not contain hostname entry
      success_msg: Hosts file contains hostname entry
    when: hosts_file.stat.exists
  - name: Check sysctl configuration file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Sysctl configuration file not found
      success_msg: Sysctl configuration file exists
  - name: Get sysctl file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - (sysctl_content.content | b64decode) is search("vm.max_map_count = 262144")
      fail_msg: vm.max_map_count not set correctly
      success_msg: vm.max_map_count set correctly
    when: sysctl_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - (sysctl_content.content | b64decode) is search("vm.dirty_expire_centisecs = 20000")
      fail_msg: vm.dirty_expire_centisecs not set correctly
      success_msg: vm.dirty_expire_centisecs set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: cli_file
  - name: Assert Chef Automate CLI file exists
    ansible.builtin.assert:
      that:
      - cli_file.stat.exists
      - cli_file.stat.size > 0
      - cli_file.stat.executable
      fail_msg: Chef Automate CLI file not found or not executable
      success_msg: Chef Automate CLI file exists and is executable
  - name: Check Chef Automate deployment marker
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert Chef Automate deployment marker exists
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef Automate deployment marker not found
      success_msg: Chef Automate deployment marker exists
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/jtonello.pem
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.size > 0
      - user_key_file.stat.mode == "0600"
      fail_msg: User key file not found or incorrect permissions
      success_msg: User key file exists with correct permissions
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/lab-validator.pem
    register: org_key_file
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.size > 0
      - org_key_file.stat.mode == "0600"
      fail_msg: Organization validator key file not found or incorrect permissions
      success_msg: Organization validator key file exists with correct permissions
  - name: Check Redis configuration file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/redis/redis.conf
    register: redis_conf_file
  - name: Assert Redis configuration file exists
    ansible.builtin.assert:
      that:
      - redis_conf_file.stat.exists
      - redis_conf_file.stat.size > 0
      fail_msg: Redis configuration file not found
      success_msg: Redis configuration file exists
  - name: Get Redis configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/redis/redis.conf
    register: redis_conf_content
    when: redis_conf_file.stat.exists
  - name: Assert Redis configuration parameters
    ansible.builtin.assert:
      that:
      - (redis_conf_content.content | b64decode) is search("port 6379")
      - (redis_conf_content.content | b64decode) is search("requirepass password")
      - (redis_conf_content.content | b64decode) is search("maxmemory 2gb")
      - (redis_conf_content.content | b64decode) is search("maxmemory-policy allkeys-lru")
      - (redis_conf_content.content | b64decode) is search("appendonly yes")
      fail_msg: Redis configuration parameters not set correctly
      success_msg: Redis configuration parameters set correctly
    when: redis_conf_file.stat.exists
  - name: Check Chef Automate service status
    ansible.builtin.command:
      cmd: chef-automate status
    register: automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - automate_status.rc == 0
      fail_msg: Chef Automate service is not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check Chef Infra Server service status
    ansible.builtin.command:
      cmd: chef-server-ctl status
    register: server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server service is running
    ansible.builtin.assert:
      that:
      - server_status.rc == 0
      fail_msg: Chef Infra Server service is not running
      success_msg: Chef Infra Server service is running
    tags: molecule-notest
  - name: Check Chef Automate API access
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
    register: automate_api
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate API is accessible
    ansible.builtin.assert:
      that:
      - automate_api.status == 200
      fail_msg: Chef Automate API is not accessible
      success_msg: Chef Automate API is accessible
    tags: molecule-notest
  - name: Check Chef Infra Server API access
    ansible.builtin.uri:
      url: https://localhost/organizations
      validate_certs: false
    register: server_api
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server API is accessible
    ansible.builtin.assert:
      that:
      - server_api.status == 200
      fail_msg: Chef Infra Server API is not accessible
      success_msg: Chef Infra Server API is accessible
    tags: molecule-notest
  - name: Check Chef user list
    ansible.builtin.command:
      cmd: chef-server-ctl user-list
    register: user_list
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef user exists
    ansible.builtin.assert:
      that:
      - '''jtonello'' in user_list.stdout'
      fail_msg: Chef user jtonello not found
      success_msg: Chef user jtonello exists
    tags: molecule-notest
  - name: Check Chef organization list
    ansible.builtin.command:
      cmd: chef-server-ctl org-list
    register: org_list
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef organization exists
    ansible.builtin.assert:
      that:
      - '''lab'' in org_list.stdout'
      fail_msg: Chef organization lab not found
      success_msg: Chef organization lab exists
    tags: molecule-notest
  - name: Check network listening ports
    ansible.builtin.command:
      cmd: ss -tlnp | grep ':443'
    register: network_ports
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - network_ports.rc == 0
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
