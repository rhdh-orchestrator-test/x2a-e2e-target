---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache
    description:
      - Configures Apache SSL settings to disable vulnerable SSL protocols and enforce TLS 1.2 only.
      - Addresses POODLE vulnerability (CVE-2014-3566) by updating Apache SSL configuration.
      - Installs Apache if not present and enables SSL module.
      - Optionally restarts SSH service after configuration changes.
    options:
      apache_package_name:
        type: str
        required: false
        default: apache2
        description: Name of Apache package (varies by distribution).
      apache_ssl_config_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file.
      ssl_protocol_setting:
        type: str
        required: false
        default: SSLProtocol -all +TLSv1.2
        description: SSL protocol configuration string to fix POODLE vulnerability.
      apache_service_name:
        type: str
        required: false
        default: apache2
        description: Name of Apache service (may vary by distribution).
      restart_ssh:
        type: bool
        required: false
        default: true
        description: Whether to restart SSH service after changes.
