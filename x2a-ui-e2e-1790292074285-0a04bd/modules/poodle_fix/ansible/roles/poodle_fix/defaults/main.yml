---
# Apache package name (varies by distribution)
apache_package_name: apache2
# Apache SSL configuration file path
apache_ssl_config_path: /etc/apache2/mods-available/ssl.conf
# SSL protocol configuration string to fix POODLE vulnerability
ssl_protocol_setting: SSLProtocol -all +TLSv1.2
# Apache service name (may vary by distribution)
apache_service_name: apache2
# Whether to restart SSH service after changes
restart_ssh: true
