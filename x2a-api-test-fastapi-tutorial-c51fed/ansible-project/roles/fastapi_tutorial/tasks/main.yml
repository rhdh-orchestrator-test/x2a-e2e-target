- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install required system packages
  ansible.builtin.package:
    name: '{{ fastapi_tutorial_system_packages }}'
    state: present
- name: Create application user
  ansible.builtin.user:
    name: '{{ fastapi_tutorial_app_user }}'
    group: '{{ fastapi_tutorial_app_group }}'
    system: true
    shell: /bin/bash
    home: '{{ fastapi_tutorial_app_dir }}'
    create_home: false
  when: fastapi_tutorial_app_user != "root"
- name: Create application group
  ansible.builtin.group:
    name: '{{ fastapi_tutorial_app_group }}'
    system: true
  when: fastapi_tutorial_app_group != "root"
- name: Create application directory
  ansible.builtin.file:
    path: '{{ fastapi_tutorial_app_dir }}'
    state: directory
    owner: '{{ fastapi_tutorial_app_user }}'
    group: '{{ fastapi_tutorial_app_group }}'
    mode: '0755'
- name: Clone FastAPI tutorial repository
  ansible.builtin.git:
    repo: '{{ fastapi_tutorial_git_repo }}'
    dest: '{{ fastapi_tutorial_app_dir }}'
    version: '{{ fastapi_tutorial_git_branch }}'
    force: true
- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: '{{ fastapi_tutorial_python_executable }} -m venv {{ fastapi_tutorial_venv_path }}'
    creates: '{{ fastapi_tutorial_venv_path }}'
- name: Install Python dependencies from requirements.txt
  ansible.builtin.pip:
    requirements: '{{ fastapi_tutorial_app_dir }}/requirements.txt'
    virtualenv: '{{ fastapi_tutorial_venv_path }}'
- name: Enable and start PostgreSQL service
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
- name: Check if PostgreSQL database user exists
  ansible.builtin.shell: sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ fastapi_tutorial_db_user }}'"
  register: db_user_exists
  changed_when: false
  failed_when: false
- name: Create PostgreSQL database user
  ansible.builtin.shell: sudo -u postgres psql -c "CREATE USER {{ fastapi_tutorial_db_user }} WITH PASSWORD '{{ db_password }}';"
  when: db_user_exists.stdout != "1"
- name: Check if PostgreSQL database exists
  ansible.builtin.shell: sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ fastapi_tutorial_db_name }}'"
  register: db_exists
  changed_when: false
  failed_when: false
- name: Create PostgreSQL database
  ansible.builtin.shell: sudo -u postgres psql -c "CREATE DATABASE {{ fastapi_tutorial_db_name }} OWNER {{ fastapi_tutorial_db_user }};"
  when: db_exists.stdout != "1"
- name: Grant database privileges
  ansible.builtin.shell: sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ fastapi_tutorial_db_name }} TO {{ fastapi_tutorial_db_user }};"
  changed_when: false
- name: Create environment configuration file
  ansible.builtin.copy:
    content: 'PROJECT_NAME="{{ fastapi_tutorial_project_name }}"

      API_VERSION={{ fastapi_tutorial_api_version }}

      DATABASE_URL=postgresql://{{ fastapi_tutorial_db_user }}:{{ db_password }}@{{ fastapi_tutorial_db_host }}/{{ fastapi_tutorial_db_name }}

      '
    dest: '{{ fastapi_tutorial_app_dir }}/.env'
    mode: '0644'
    owner: '{{ fastapi_tutorial_app_user }}'
    group: '{{ fastapi_tutorial_app_group }}'
    backup: true
- name: Create systemd service file
  ansible.builtin.copy:
    content: '[Unit]

      Description=FastAPI Tutorial Service

      After=network.target postgresql.service


      [Service]

      Type=simple

      User={{ fastapi_tutorial_app_user }}

      WorkingDirectory={{ fastapi_tutorial_app_dir }}

      Environment="PATH={{ fastapi_tutorial_venv_path }}/bin"

      ExecStart={{ fastapi_tutorial_venv_path }}/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_app_port }}

      Restart={{ fastapi_tutorial_service_restart_policy }}


      [Install]

      WantedBy=multi-user.target

      '
    dest: /etc/systemd/system/{{ fastapi_tutorial_service_name }}.service
    mode: '0644'
    owner: root
    group: root
    backup: true
  notify: Reload systemd daemon
- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: '{{ fastapi_tutorial_service_name }}'
    state: started
    enabled: true
