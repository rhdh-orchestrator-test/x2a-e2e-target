---
controller_credential_types:
- name: FastAPI PostgreSQL Database
  description: PostgreSQL database credentials for FastAPI application
  kind: cloud
  inputs:
    fields:
    - id: db_password
      type: string
      label: Database Password
      secret: true
      help_text: Password for the PostgreSQL fastapi user
    required:
    - db_password
  injectors:
    extra_vars:
      db_password: !unsafe '{{ db_password }}'
