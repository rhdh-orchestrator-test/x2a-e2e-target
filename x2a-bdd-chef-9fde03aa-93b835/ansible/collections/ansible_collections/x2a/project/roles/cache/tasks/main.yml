---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install and configure Memcached
  ansible.builtin.include_tasks: memcached.yml

- name: Configure Redis with the Private Hub role # noqa: L038 - role is provided by the eloy.redis collection declared in requirements.yml
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: "{{ cache_redis_log_owner }}"
    group: "{{ cache_redis_log_group }}"
    mode: "{{ cache_redis_log_mode }}"
    recurse: true

- name: Create Redis PID directory
  ansible.builtin.file:
    path: "{{ cache_redis_pid_directory }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Remove replication directives from Redis configuration
  ansible.builtin.replace:
    path: /etc/redis/6379.conf
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$
    replace: ""
  failed_when: false
  no_log: "{{ cache_secure_logging }}"

- name: Enable Redis service
  ansible.builtin.service:
    name: redis
    enabled: true
    state: started
