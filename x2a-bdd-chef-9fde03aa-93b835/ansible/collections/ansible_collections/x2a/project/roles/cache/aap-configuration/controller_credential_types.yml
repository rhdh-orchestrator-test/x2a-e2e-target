---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis instance listening on port 6379. The source currently hardcodes this value and the migration
      plan requires storing it in Ansible Vault or an external secret manager.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password configured as Redis requirepass for client authentication.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
