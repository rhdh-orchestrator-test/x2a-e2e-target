---
argument_specs:
  main:
    short_description: Deploy and configure the FastAPI tutorial application
    description:
      - Installs PostgreSQL and Python dependencies, deploys the FastAPI repository, and manages its systemd service.
    options:
      fastapi_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application installation directory.
      fastapi_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_service_port:
        type: int
        required: false
        default: 8000
        description: Port on which the FastAPI service listens.
      fastapi_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_db_user:
        type: str
        required: false
        default: fastapi
        description: Default database user name.
      fastapi_db_name:
        type: str
        required: false
        default: fastapi_db
        description: Default database name.
      fastapi_db_host:
        type: str
        required: false
        default: localhost
        description: Default database host.
      fastapi_db_port:
        type: int
        required: false
        default: 5432
        description: Default database port.
      fastapi_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide tasks that process database credentials from logs.
      db_username:
        type: str
        required: true
        description: Database username injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: Database password injected by an AAP credential type.
      db_host:
        type: str
        required: true
        description: Database host injected by an AAP credential type.
      db_port:
        type: str
        required: true
        description: Database port injected by an AAP credential type.
      db_name:
        type: str
        required: true
        description: Database name injected by an AAP credential type.
