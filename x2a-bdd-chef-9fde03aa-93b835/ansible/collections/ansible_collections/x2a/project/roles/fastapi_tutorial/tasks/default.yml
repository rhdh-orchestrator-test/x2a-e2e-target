---
- name: Install application and PostgreSQL packages
  ansible.builtin.package:
    name: >-
      {{ ['python3', 'python3-pip', 'git', 'postgresql-server', 'postgresql-contrib', 'libpq-devel']
        if ansible_facts['os_family'] in ['RedHat', 'Fedora'] else
        ['python3', 'python3-pip', 'python3-venv', 'git', 'postgresql', 'postgresql-contrib', 'libpq-dev'] }}
    state: present

- name: Initialize PostgreSQL on RedHat-family systems
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_app_path }}" # noqa: R114 - path is from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize FastAPI tutorial repository # noqa: R104,R106 - repository URL is a trusted role input and defaults to HTTPS
  ansible.builtin.git:
    repo: "{{ fastapi_repository }}"
    dest: "{{ fastapi_app_path }}" # noqa: R114 - destination is from role defaults
    version: "{{ fastapi_revision }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command uses the trusted role application path
  ansible.builtin.command:
    cmd: >-
      python3 -m venv {{ fastapi_app_path }}/venv
    creates: "{{ fastapi_app_path }}/venv/bin/python" # noqa: R114 - path is from role defaults

- name: Install Python dependencies # noqa: R113 - package targets are fixed by the role's supported platform package lists
  ansible.builtin.pip:
    requirements: "{{ fastapi_app_path }}/requirements.txt" # noqa: R114 - path is from role defaults
    virtualenv: "{{ fastapi_app_path }}/venv" # noqa: R114 - path is from role defaults
    virtualenv_command: python3 -m venv
  notify: Restart FastAPI tutorial

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL role # noqa: L039,R101,R108 - credentials are required role arguments, the command is intentionally parameterized, and PostgreSQL role management requires the postgres account
  ansible.builtin.shell:
    cmd: >-
      psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN CREATE ROLE {{ db_username }} LOGIN PASSWORD '{{ db_password }}';
      EXCEPTION WHEN duplicate_object THEN ALTER ROLE {{ db_username }} PASSWORD '{{ db_password }}'; END \$\$;"
  become: true
  become_user: postgres
  no_log: "{{ fastapi_secure_logging }}"
  changed_when: false

- name: Create PostgreSQL database # noqa: L039,R101,R108 - credentials are required role arguments, the command is intentionally parameterized, and PostgreSQL database management requires the postgres account
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail && psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ db_name }}'" |
      grep -q 1 || createdb -O {{ db_username }} {{ db_name }}
    executable: /bin/bash
  changed_when: false
  become: true
  become_user: postgres

- name: Grant PostgreSQL database privileges # noqa: L039,R101,R108 - credentials are required role arguments, the command is intentionally parameterized, and PostgreSQL privilege management requires the postgres account
  ansible.builtin.shell:
    cmd: >-
      psql -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_username }};"
  changed_when: false
  become: true
  become_user: postgres

- name: Write application environment configuration # noqa: L039 - database credentials are required role arguments validated by the preceding task
  ansible.builtin.copy:
    dest: "{{ fastapi_app_path }}/.env" # noqa: R114 - path is from role defaults
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/{{ db_name }}
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart FastAPI tutorial
  no_log: "{{ fastapi_secure_logging }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/{{ fastapi_service_name }}.service # noqa: R114 - service name is from role defaults
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_app_path }}
      Environment="PATH={{ fastapi_app_path }}/venv/bin"
      ExecStart={{ fastapi_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload systemd
    - Restart FastAPI tutorial

- name: Reload systemd before managing FastAPI service
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start FastAPI tutorial
  ansible.builtin.service:
    name: "{{ fastapi_service_name }}"
    enabled: true
    state: started
