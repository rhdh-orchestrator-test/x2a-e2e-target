---
- name: Restart sshd
  ansible.builtin.service:
    name: "{{ nginx_multisite_ssh_service_name }}"
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: "{{ nginx_multisite_service_name }}"
    state: reloaded

- name: Reload sysctl
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: true
