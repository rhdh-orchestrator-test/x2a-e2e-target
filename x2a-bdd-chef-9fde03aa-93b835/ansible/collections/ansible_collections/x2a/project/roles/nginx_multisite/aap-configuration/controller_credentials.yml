---
controller_credentials:
  - name: Chef Encrypted Data Bag Nginx Site Token - nginx_multisite
    description: Secret token loaded from the Chef encrypted data bag nginx_secrets/site and written to the nginx secret file.
    organization: Default
    credential_type: Chef Encrypted Data Bag Nginx Site Token
    update_secrets: true
    inputs:
      site_token: "{{ vault_site_token }}"
  - name: Nginx TLS Private Key - nginx_multisite
    description: Runtime-generated private key material used by nginx for HTTPS termination.
    organization: Default
    credential_type: Nginx TLS Private Key
    update_secrets: true
    inputs:
      key_file: "{{ vault_key_file }}"
