---
argument_specs:
  main:
    short_description: Configures nginx with multiple SSL-enabled subdomains.
    description:
      - Installs and configures nginx, fail2ban, UFW, SSH hardening, TLS certificates, and virtual sites.
    options:
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for SSL certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for SSL private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW rules are enabled.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Disable SSH root login.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide sensitive task output.
      nginx_multisite_sites:
        type: dict
        required: false
        default: {}
        description: Site definitions keyed by site name.
      nginx_multisite_site_token:
        type: str
        required: false
        default: "{{ site_token }}"
        description: Internal path to the site token credential.
      nginx_multisite_key_file:
        type: str
        required: false
        default: "{{ key_file }}"
        description: Internal path to the key-file credential.
      nginx_multisite_service_name:
        type: str
        required: false
        default: nginx
        description: Name of the nginx service.
      nginx_multisite_ssh_service_name:
        type: str
        required: false
        default: ssh
        description: Name of the SSH service.
      site_token:
        type: str
        required: true
        description: Token injected by an AAP credential type.
      key_file:
        type: str
        required: true
        description: Private key credential injected by an AAP credential type.
