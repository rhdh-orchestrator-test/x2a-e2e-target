---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - procps
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled

- name: Deploy fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled
  notify: Restart fail2ban

- name: Check UFW current status
  ansible.builtin.command:
    argv: [ufw, status, verbose]
  register: nginx_multisite_ufw_status
  changed_when: false
  failed_when: false
  when: nginx_multisite_ufw_enabled

- name: Set UFW default incoming policy
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
      - incoming
  changed_when: true
  when:
    - nginx_multisite_ufw_enabled
    - "'Default: deny (incoming)' not in nginx_multisite_ufw_status.stdout"

- name: Allow SSH through UFW
  ansible.builtin.command:
    argv: [ufw, allow, ssh]
  changed_when: true
  when:
    - nginx_multisite_ufw_enabled
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTP through UFW
  ansible.builtin.command:
    argv: [ufw, allow, http]
  changed_when: true
  when:
    - nginx_multisite_ufw_enabled
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    argv: [ufw, allow, https]
  changed_when: true
  when:
    - nginx_multisite_ufw_enabled
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Enable UFW
  ansible.builtin.command:
    argv: [ufw, --force, enable]
  changed_when: true
  when:
    - nginx_multisite_ufw_enabled
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"

- name: Deploy kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload sysctl

- name: Check whether SSH daemon configuration exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    create: false
  when:
    - nginx_multisite_ssh_disable_root
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    create: false
  when:
    - not nginx_multisite_ssh_password_auth
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd
