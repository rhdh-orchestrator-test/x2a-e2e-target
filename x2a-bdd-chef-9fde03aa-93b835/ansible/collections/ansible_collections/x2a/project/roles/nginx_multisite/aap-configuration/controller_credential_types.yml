---
controller_credential_types:
  - name: Chef Encrypted Data Bag Nginx Site Token
    description: Secret token loaded from the Chef encrypted data bag nginx_secrets/site and written to the nginx secret file.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Nginx Site Token
          secret: true
          help_text: Token stored in the encrypted data bag and deployed to /etc/nginx/secrets/site_token.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
  - name: Nginx TLS Private Key
    description: Runtime-generated private key material used by nginx for HTTPS termination.
    kind: cloud
    inputs:
      fields:
        - id: key_file
          type: string
          label: TLS Private Key
          secret: true
          help_text: Generated RSA private key material for an SSL-enabled nginx site, corresponding to /etc/ssl/private/<site_name>.key.
      required:
        - key_file
    injectors:
      extra_vars:
        key_file: !unsafe "{{ key_file }}"
