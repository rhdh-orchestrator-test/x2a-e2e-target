---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Ensure FastAPI runtime group exists
  ansible.builtin.group:
    name: "{{ fastapi_tutorial_runtime_group }}"
    state: present

- name: Ensure FastAPI runtime user exists
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_runtime_user }}"
    group: "{{ fastapi_tutorial_runtime_group }}"
    state: present

- name: Install FastAPI system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: "{{ fastapi_tutorial_runtime_user }}"
    group: "{{ fastapi_tutorial_runtime_group }}"
    mode: "0755"
    recurse: true

- name: Synchronize FastAPI tutorial repository # noqa: R104 - repository URL is an HTTPS role default controlled by the operator # noqa: R106 - repository source is intentionally a role parameter for selecting the tutorial revision
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - destination is the role-defined application path
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command arguments use trusted role-default paths
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_virtualenv_path }}"
    creates: "{{ fastapi_tutorial_virtualenv_path }}" # noqa: R114 - path is a role-defined virtualenv location

- name: Install Python dependencies # noqa: R113 - requirements target is the role-defined application requirements file
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt" # noqa: R114 - requirements file is in the role-defined application path
    virtualenv: "{{ fastapi_tutorial_virtualenv_path }}" # noqa: R114 - virtualenv path is a role default

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL role, database, and privileges # noqa: L039 - database credentials are validated by the preceding task and supplied by the attached AAP credential # noqa: R101 - shell arguments use validated database credentials and the task suppresses sensitive output # noqa: R108 - PostgreSQL role and database administration requires the postgres user
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ database_username }}'" | grep -q 1; then
        psql -c "CREATE USER {{ database_username }} WITH PASSWORD '{{ database_password }}';"
      fi
      if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'" | grep -q 1; then
        createdb -O "{{ database_username }}" "{{ database_name }}"
      fi
      psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ database_username }};"
    executable: /bin/bash
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"
  changed_when: false

- name: Write FastAPI environment file # noqa: L039 - database credentials and host are validated by the preceding task and supplied by the attached AAP credential
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - destination is a role-defined application path
    content: |
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL=postgresql://{{ database_username }}:{{ database_password }}@{{ database_host }}/{{ database_name }}
    owner: "{{ fastapi_tutorial_runtime_user }}"
    group: "{{ fastapi_tutorial_runtime_group }}"
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI systemd unit
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - service file path is a role default
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User={{ fastapi_tutorial_runtime_user }}
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_virtualenv_path }}/bin"
      ExecStart={{ fastapi_tutorial_virtualenv_path }}/bin/uvicorn app.main:app --host {{ fastapi_tutorial_host }} --port {{ fastapi_tutorial_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd manager

- name: Apply pending systemd unit reload before starting FastAPI
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
