---
argument_specs:
  main:
    short_description: Install and configure a secure Nginx multisite deployment
    description:
      - Installs Nginx, Fail2ban, UFW, and TLS tooling.
      - Configures three HTTPS virtual hosts with locally generated self-signed certificates.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of site names to document roots and SSL settings.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory where site certificates are stored.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory where site private keys are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and start Fail2ban.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and enable UFW.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to disable root SSH login.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
