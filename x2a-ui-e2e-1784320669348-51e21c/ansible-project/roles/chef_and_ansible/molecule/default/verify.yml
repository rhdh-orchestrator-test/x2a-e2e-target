---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check directory structure
    - name: Check if Apache certs directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/certs
      register: certs_dir

    - name: Assert Apache certs directory exists
      ansible.builtin.assert:
        that:
          - certs_dir.stat.exists
          - certs_dir.stat.isdir
        fail_msg: "Apache certs directory not found"
        success_msg: "Apache certs directory exists"

    # Check SSL certificate files
    - name: Check if SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: ssl_files
      loop:
        - /tmp/molecule_test/etc/apache2/certs/apache.key
        - /tmp/molecule_test/etc/apache2/certs/apache.csr
        - /tmp/molecule_test/etc/apache2/certs/apache.crt

    - name: Assert SSL certificate files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "SSL certificate file not found"
        success_msg: "SSL certificate file exists"
      loop: "{{ ssl_files.results }}"

    # Check virtual host configuration
    - name: Check if virtual host configuration exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      register: vhost_config

    - name: Assert virtual host configuration exists
      ansible.builtin.assert:
        that:
          - vhost_config.stat.exists
        fail_msg: "Virtual host configuration not found"
        success_msg: "Virtual host configuration exists"

    - name: Get virtual host configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      register: vhost_content
      when: vhost_config.stat.exists

    - name: Assert virtual host configuration contains expected content
      ansible.builtin.assert:
        that:
          - (vhost_content.content | b64decode) is search('SSLEngine on')
          - (vhost_content.content | b64decode) is search('SSLCertificateFile')
          - (vhost_content.content | b64decode) is search('SSLCertificateKeyFile')
        fail_msg: "Virtual host configuration does not contain expected SSL settings"
        success_msg: "Virtual host configuration contains expected SSL settings"
      when: vhost_config.stat.exists

    # Check website content
    - name: Check if website content exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/www/helloworld/index.html
      register: website_content

    - name: Assert website content exists
      ansible.builtin.assert:
        that:
          - website_content.stat.exists
        fail_msg: "Website content not found"
        success_msg: "Website content exists"

    - name: Get website content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/www/helloworld/index.html
      register: html_content
      when: website_content.stat.exists

    - name: Assert website content contains expected text
      ansible.builtin.assert:
        that:
          - (html_content.content | b64decode) is search('Hello, world!')
        fail_msg: "Website content does not contain expected text"
        success_msg: "Website content contains expected text"
      when: website_content.stat.exists

    # Check SSL configuration (POODLE fix)
    - name: Check if SSL configuration exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_conf

    - name: Assert SSL configuration exists
      ansible.builtin.assert:
        that:
          - ssl_conf.stat.exists
        fail_msg: "SSL configuration not found"
        success_msg: "SSL configuration exists"

    - name: Get SSL configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_conf_content
      when: ssl_conf.stat.exists

    - name: Assert SSL configuration contains POODLE fix
      ansible.builtin.assert:
        that:
          - (ssl_conf_content.content | b64decode) is search('SSLProtocol -all \+TLSv1.2')
        fail_msg: "SSL configuration does not contain POODLE fix"
        success_msg: "SSL configuration contains POODLE fix"
      when: ssl_conf.stat.exists

    # Service checks (tagged to skip in container)
    - name: Check if Apache service is running
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    # HTTPS connectivity check (tagged to skip in container)
    - name: Check HTTPS connectivity
      ansible.builtin.uri:
        url: https://localhost/
        validate_certs: false
        return_content: true
      register: https_result
      tags: molecule-notest

    - name: Assert HTTPS site is accessible
      ansible.builtin.assert:
        that:
          - https_result.status == 200
          - "'Hello, world!' in https_result.content"
        fail_msg: "HTTPS site is not accessible or does not contain expected content"
        success_msg: "HTTPS site is accessible and contains expected content"
      tags: molecule-notest