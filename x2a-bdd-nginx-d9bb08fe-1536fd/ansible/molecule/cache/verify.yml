# Unsupported pre-flight checks: authenticated redis-cli checks require a securely retrieved
# password that is not provided here; journalctl requires a confirmed service name; and the
# missing dependency confirmation items are informational rather than verifiable outcomes.
---
- name: Verify Redis cache instance on port 6379
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_stat

    - name: Assert Redis configuration file exists
      ansible.builtin.assert:
        that:
          - redis_config_stat['stat']['exists']
          - redis_config_stat['stat']['isreg']
        fail_msg: Redis configuration file is missing or is not a regular file.

    - name: Read Redis configuration for directive checks
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content

    - name: Assert selected replication directives are absent
      ansible.builtin.assert:
        that:
          - >-
            (redis_config_content['content'] | b64decode) is not
            regex('
            ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)'
            , multiline=True)
        fail_msg: A selected replication directive is present in the Redis configuration.

    - name: Assert core Redis configuration is configured
      ansible.builtin.assert:
        that:
          - >-
            (redis_config_content['content'] | b64decode) is
            regex('(?m)^port\\s+6379(?:\\s|$)')
          - >-
            (redis_config_content['content'] | b64decode) is
            regex('(?m)^requirepass\\s+\\S+')
        fail_msg: Redis port 6379 or requirepass is not configured as expected.

    - name: Inspect Redis log directory
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory attributes
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['exists']
          - redis_log_dir_stat['stat']['isdir']
          - redis_log_dir_stat['stat']['mode'] == '0755'
          - redis_log_dir_stat['stat']['pw_name'] == 'redis'
          - redis_log_dir_stat['stat']['gr_name'] == 'redis'
        fail_msg: Redis log directory is missing or has unexpected attributes.

    - name: Wait for Redis listener on TCP port 6379
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 5

    - name: Check unauthenticated Redis behavior
      ansible.builtin.command:
        argv:
          - redis-cli
          - -p
          - '6379'
          - PING
      register: redis_unauthenticated_ping
      changed_when: false

    - name: Assert unauthenticated Redis access requires authentication
      ansible.builtin.assert:
        that:
          - >-
            (redis_unauthenticated_ping['stdout'] ~ redis_unauthenticated_ping['stderr'])
            is search('NOAUTH Authentication required')
        fail_msg: Unauthenticated Redis PING did not report that authentication is required.
