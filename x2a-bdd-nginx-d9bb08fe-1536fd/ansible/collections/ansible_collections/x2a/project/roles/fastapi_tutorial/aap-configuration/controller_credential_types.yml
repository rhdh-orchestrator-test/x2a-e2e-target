---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and database identity used by the FastAPI application to connect to PostgreSQL.
    kind: cloud
    inputs:
      fields:
        - id: db_user
          type: string
          label: Database User
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL application user; migrate this value to an AAP-managed secret.
      required:
        - db_user
        - db_name
        - db_password
    injectors:
      extra_vars:
        db_user: !unsafe "{{ db_user }}"
        db_name: !unsafe "{{ db_name }}"
        db_password: !unsafe "{{ db_password }}"
