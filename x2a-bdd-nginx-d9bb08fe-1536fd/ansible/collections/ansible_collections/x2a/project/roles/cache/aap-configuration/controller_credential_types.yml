---
controller_credential_types:
  - name: Redis Authentication
    description: Authentication credential for the Redis instance listening on TCP port 6379. The current password is hardcoded in the Chef recipe and must be 
      moved to Ansible Vault or an approved secret manager.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password used by Redis requirepass authentication; store and render it securely without exposing it in logs.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
