---
argument_specs:
  main:
    short_description: Configure a Redis cache service
    description:
      - Installs and configures a standalone Redis cache using the eloy.redis collection.
      - Uses the AAP-injected Redis password for authenticated access.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations that handle the Redis password.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port used by the Redis instance.
      cache_redis_version:
        type: str
        required: false
        default: "7.2"
        description: Redis version requested from the Redis collection role.
      cache_redis_requirepass:
        type: str
        required: false
        default: "{{ redis_password }}"
        description: Redis authentication password supplied by the AAP credential.
      cache_redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis cluster mode is enabled.
      cache_redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis Sentinel mode is enabled.
      cache_redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis replication is enabled.
      cache_redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Whether RDB persistence is enabled.
      cache_redis_aof_enabled:
        type: bool
        required: false
        default: false
        description: Whether AOF persistence is enabled.
      redis_password:
        type: str
        required: true
        description: Redis password injected by the AAP credential type.
