---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: PostgreSQL application database credential for the FastAPI tutorial service. The password is hardcoded in the Chef recipe and must be rotated 
      and stored as an AAP-injected secret or Ansible Vault value.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL role; currently hardcoded as fastapi_password and repeated in the application .env file.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application, currently fastapi_db.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL connection, currently localhost.
      required:
        - database_username
        - database_password
        - database_name
        - database_host
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
