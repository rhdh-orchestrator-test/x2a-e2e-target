---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload sysctl settings
  ansible.builtin.command:
    cmd: /sbin/sysctl -p /etc/sysctl.d/99-security.conf
  changed_when: true

- name: Restart sshd
  ansible.builtin.service:
    name: "{{ nginx_multisite_sshd_service | default('sshd') }}"  # noqa: L039 - variable comes from role parameters with a safe default
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
