---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - "{{ 'procps-ng' if ansible_facts.os_family == 'RedHat' else 'procps' }}"
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started

- name: Render fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  notify: Restart fail2ban

- name: Read UFW status
  ansible.builtin.command:
    cmd: ufw status verbose
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false
  register: nginx_multisite_ufw_status
  check_mode: false

- name: Set UFW default policy  # noqa: L039 - registered by the preceding UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  when:
    - nginx_multisite_ufw_enabled
    - "'Default: deny (incoming)' not in nginx_multisite_ufw_status.stdout"

- name: Allow SSH through UFW  # noqa: L039 - registered by the preceding UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - ssh
  when:
    - nginx_multisite_ufw_enabled
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTP through UFW  # noqa: L039 - registered by the preceding UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - http
  when:
    - nginx_multisite_ufw_enabled
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTPS through UFW  # noqa: L039 - registered by the preceding UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - https
  when:
    - nginx_multisite_ufw_enabled
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Enable UFW  # noqa: L039 - registered by the preceding UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - enable
  when:
    - nginx_multisite_ufw_enabled
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"

- name: Create sysctl configuration directory
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render sysctl security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload sysctl settings

- name: Check SSH daemon configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable root SSH login  # noqa: L039 - registered by the preceding SSH configuration stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    backup: true
    create: false
  when:
    - nginx_multisite_disable_root_ssh
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd

- name: Disable SSH password authentication  # noqa: L039 - registered by the preceding SSH configuration stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    backup: true
    create: false
  when:
    - not nginx_multisite_password_auth
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd
