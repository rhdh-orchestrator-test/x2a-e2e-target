---
controller_credentials:
  - name: Chef Encrypted Data Bag Site Token - nginx_multisite
    description: Token stored in the encrypted Chef data bag item nginx_secrets/site and deployed to /etc/nginx/secrets/site_token for downstream use by the 
      Nginx web tier.
    organization: Default
    credential_type: Chef Encrypted Data Bag Site Token
    update_secrets: true
    inputs:
      site_token: "{{ vault_site_token }}"
