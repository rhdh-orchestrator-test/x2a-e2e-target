---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Render nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Render nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create nginx secrets directory
  ansible.builtin.file:
    path: /etc/nginx/secrets
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write nginx site token
  ansible.builtin.copy:
    content: "{{ site_token }}"  # noqa: L039 - variable is a required role credential
    dest: /etc/nginx/secrets/site_token
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Create site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_site.document_root }}"  # noqa: R114 - path comes from trusted role-defined site data
    state: directory
    owner: "{{ nginx_multisite_user }}"
    group: "{{ nginx_multisite_user }}"
    mode: "0755"
    recurse: true
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_nginx_site

- name: Deploy static site index files
  ansible.builtin.copy:
    src: "{{ item_nginx_site.name.split('.')[0] }}/index.html"
    dest: "{{ item_nginx_site.document_root }}/index.html"  # noqa: R114 - path comes from trusted role-defined site data
    owner: "{{ nginx_multisite_user }}"
    group: "{{ nginx_multisite_user }}"
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_nginx_site
