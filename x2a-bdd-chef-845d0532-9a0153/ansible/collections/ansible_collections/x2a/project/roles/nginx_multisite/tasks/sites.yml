---
- name: Create sites-available directory
  ansible.builtin.file:
    path: /etc/nginx/sites-available
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create sites-enabled directory
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render nginx virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item_nginx_site.name }}"  # noqa: R114 - path comes from trusted role-defined site data
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_nginx_site
  notify: Reload nginx
  vars:
    server_name: "{{ item_nginx_site.name }}"
    document_root: "{{ item_nginx_site.document_root }}"
    ssl_enabled: "{{ item_nginx_site.ssl_enabled | default(false) }}"
    cert_file: "{{ nginx_multisite_certificate_path }}/{{ item_nginx_site.name }}.crt"
    key_file: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_site.name }}.key"

- name: Enable nginx virtual host configurations
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item_nginx_site.name }}"
    dest: "/etc/nginx/sites-enabled/{{ item_nginx_site.name }}"  # noqa: R114 - path comes from trusted role-defined site data
    state: link
    owner: root
    group: root
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_nginx_site
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
