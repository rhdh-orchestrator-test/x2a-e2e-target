---
argument_specs:
  main:
    short_description: Configure nginx multisite hosting with security hardening, TLS, and fail2ban.
    description:
      - Deploys nginx virtual hosts and optional self-signed TLS certificates.
      - Configures fail2ban, firewall, sysctl, and SSH hardening settings.
    options:
      nginx_multisite_sites:
        type: list
        elements: dict
        required: false
        default: []
        description: Virtual hosts to configure, including name, document_root, and ssl_enabled.
        options:
          name:
            type: str
            required: true
            description: Hostname for the virtual host.
          document_root:
            type: str
            required: true
            description: Absolute document root path.
          ssl_enabled:
            type: bool
            required: false
            default: false
            description: Whether to configure HTTPS and redirect HTTP.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the site token credential.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated site certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban protection is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW is configured and enabled.
      nginx_multisite_disable_root_ssh:
        type: bool
        required: false
        default: true
        description: Whether root SSH login is disabled.
      nginx_multisite_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      site_token:
        type: str
        required: true
        description: Site token injected by an AAP credential type.
