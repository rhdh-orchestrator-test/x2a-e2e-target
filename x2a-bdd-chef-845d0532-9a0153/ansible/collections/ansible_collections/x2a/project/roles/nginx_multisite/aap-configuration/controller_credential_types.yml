---
controller_credential_types:
  - name: Chef Encrypted Data Bag Site Token
    description: Token stored in the encrypted Chef data bag item nginx_secrets/site and deployed to /etc/nginx/secrets/site_token for downstream use by the 
      Nginx web tier.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Site Token
          secret: true
          help_text: Secret token extracted from the nginx_secrets/site encrypted Chef data bag item and written to /etc/nginx/secrets/site_token.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
