---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install and configure standalone Redis cache  # noqa: L038 - eloy.redis.redis is an external role dependency resolved by the deployment environment
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: "{{ cache_redis_cluster_enabled }}"
    redis_sentinel_enabled: "{{ cache_redis_sentinel_enabled }}"
    redis_replication_enabled: "{{ cache_redis_replication_enabled }}"
    redis_aof_enabled: "{{ cache_redis_aof_enabled }}"
    redis_rdb_enabled: "{{ cache_redis_rdb_enabled }}"

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is a trusted role default
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Check whether the Redis configuration exists
  ansible.builtin.stat:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a trusted role default
  register: cache_redis_config_stat

- name: Remove replica serve stale data directive  # noqa: R115 - Redis configuration path is a trusted role default and only a known directive is removed
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a trusted role default
    regexp: ^replica-serve-stale-data.*$
    state: absent
    create: false
  when: cache_redis_config_stat.stat.exists  # noqa: L039 - registered by the preceding stat task

- name: Remove replica read only directive  # noqa: R115 - Redis configuration path is a trusted role default and only a known directive is removed
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a trusted role default
    regexp: ^replica-read-only.*$
    state: absent
    create: false
  when: cache_redis_config_stat.stat.exists  # noqa: L039 - registered by the preceding stat task

- name: Remove replica ping period directive  # noqa: R115 - Redis configuration path is a trusted role default and only a known directive is removed
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a trusted role default
    regexp: ^repl-ping-replica-period.*$
    state: absent
    create: false
  when: cache_redis_config_stat.stat.exists  # noqa: L039 - registered by the preceding stat task

- name: Remove client output buffer limit directive  # noqa: R115 - Redis configuration path is a trusted role default and only a known directive is removed
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a trusted role default
    regexp: ^client-output-buffer-limit.*$
    state: absent
    create: false
  when: cache_redis_config_stat.stat.exists  # noqa: L039 - registered by the preceding stat task

- name: Remove replica priority directive  # noqa: R115 - Redis configuration path is a trusted role default and only a known directive is removed
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a trusted role default
    regexp: ^replica-priority.*$
    state: absent
    create: false
  when: cache_redis_config_stat.stat.exists  # noqa: L039 - registered by the preceding stat task
