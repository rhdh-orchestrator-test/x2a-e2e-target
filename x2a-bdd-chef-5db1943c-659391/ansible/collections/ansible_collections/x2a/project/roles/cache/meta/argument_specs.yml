---
argument_specs:
  main:
    short_description: Configure a standalone Redis cache service
    description:
      - Installs and configures Redis for the cache role using the eloy.redis collection.
      - Configures Redis authentication from an AAP credential variable.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the Redis password.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for the Redis cache service.
      cache_redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis cluster mode is enabled.
      cache_redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis Sentinel mode is enabled.
      cache_redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis replication is enabled.
      cache_redis_aof_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis append-only persistence is enabled.
      cache_redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Whether Redis RDB persistence is enabled.
      cache_redis_pid_directory:
        type: str
        required: false
        default: /run/redis
        description: Directory used for Redis PID files.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Directory used for Redis logs.
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration file path.
