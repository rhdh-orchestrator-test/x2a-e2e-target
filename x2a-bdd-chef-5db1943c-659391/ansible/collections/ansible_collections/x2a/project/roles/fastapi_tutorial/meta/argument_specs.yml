---
argument_specs:
  main:
    short_description: Deploy the FastAPI tutorial application with PostgreSQL.
    description:
      - Installs the FastAPI tutorial application and its Python dependencies.
      - Configures PostgreSQL and manages the FastAPI systemd service.
    options:
      fastapi_tutorial_repo_url:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI tutorial application.
      fastapi_tutorial_repo_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application installation directory.
      fastapi_tutorial_venv_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_app_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which the FastAPI application listens.
      fastapi_tutorial_app_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Listen address for the FastAPI application.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks handling credential variables.
      db_username:
        type: str
        required: true
        description: Database username injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: Database password injected by an AAP credential type.
      database_name:
        type: str
        required: true
        description: Database name injected by an AAP credential type.
      database_url:
        type: str
        required: true
        description: Database connection URL injected by an AAP credential type.
