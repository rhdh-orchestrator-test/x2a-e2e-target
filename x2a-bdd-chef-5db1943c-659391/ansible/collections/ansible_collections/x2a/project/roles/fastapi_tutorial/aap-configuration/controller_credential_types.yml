---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection configuration for the FastAPI application's PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; store in Ansible Vault.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_url
          type: string
          label: Database URL
          secret: true
          help_text: Application PostgreSQL connection string containing the database credentials and connection details.
      required:
        - db_username
        - db_password
        - database_name
        - database_url
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_url: !unsafe "{{ database_url }}"
