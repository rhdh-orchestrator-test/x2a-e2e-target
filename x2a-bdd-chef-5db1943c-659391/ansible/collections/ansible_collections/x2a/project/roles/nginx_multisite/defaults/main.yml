---
# defaults file for x2a.project.nginx_multisite
nginx_multisite_my_variable: default_value

# Sites served by nginx.  The source paths are role-local files.
nginx_multisite_sites:
  test.cluster.local:
    document_root: /var/www/test.cluster.local
    source: test/index.html
    certificate: /etc/ssl/certs/test.cluster.local.crt
    key: /etc/ssl/private/test.cluster.local.key
  ci.cluster.local:
    document_root: /var/www/ci.cluster.local
    source: ci/index.html
    certificate: /etc/ssl/certs/ci.cluster.local.crt
    key: /etc/ssl/private/ci.cluster.local.key
  status.cluster.local:
    document_root: /var/www/status.cluster.local
    source: status/index.html
    certificate: /etc/ssl/certs/status.cluster.local.crt
    key: /etc/ssl/private/status.cluster.local.key

nginx_multisite_web_user: "{{ 'nginx' if ansible_facts.os_family == 'RedHat' else 'www-data' }}"
nginx_multisite_web_group: "{{ 'nginx' if ansible_facts.os_family == 'RedHat' else 'www-data' }}"
nginx_multisite_ssh_service: "{{ 'sshd' if ansible_facts.os_family == 'RedHat' else 'ssh' }}"
