---
- name: Install TLS packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create SSL certificate directory
  ansible.builtin.file:
    path: /etc/ssl/certs
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create SSL private key directory
  ansible.builtin.file:
    path: /etc/ssl/private
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Generate self-signed certificates # noqa: R101 - command arguments use role-defined certificate data
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -newkey
      - rsa:2048
      - -days
      - "365"
      - -keyout
      - "{{ item_nginx_certificate['key_path'] }}"
      - -out
      - "{{ item_nginx_certificate['cert_path'] }}"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/emailAddress=admin@example.com/CN={{ item_nginx_certificate['name'] }}
    creates: "{{ item_nginx_certificate['cert_path'] }}"
  loop:
    - name: test.cluster.local
      cert_path: /etc/ssl/certs/test.cluster.local.crt
      key_path: /etc/ssl/private/test.cluster.local.key
    - name: ci.cluster.local
      cert_path: /etc/ssl/certs/ci.cluster.local.crt
      key_path: /etc/ssl/private/ci.cluster.local.key
    - name: status.cluster.local
      cert_path: /etc/ssl/certs/status.cluster.local.crt
      key_path: /etc/ssl/private/status.cluster.local.key
  loop_control:
    loop_var: item_nginx_certificate
  notify: Reload nginx
  no_log: true

- name: Set private key ownership and permissions
  ansible.builtin.file:
    path: "{{ item_nginx_key['key_path'] }}" # noqa: R114 - loop over role-defined certificate paths
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  loop:
    - name: test.cluster.local
      key_path: /etc/ssl/private/test.cluster.local.key
    - name: ci.cluster.local
      key_path: /etc/ssl/private/ci.cluster.local.key
    - name: status.cluster.local
      key_path: /etc/ssl/private/status.cluster.local.key
  loop_control:
    loop_var: item_nginx_key
