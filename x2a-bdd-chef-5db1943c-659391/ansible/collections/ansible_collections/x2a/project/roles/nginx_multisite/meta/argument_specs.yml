---
# argument spec file for x2a.project.nginx_multisite
argument_specs:
  main:
    short_description: Configure nginx with multiple HTTPS sites and security hardening.
    options:
      nginx_multisite_my_variable:
        type: str
        description: A simple string argument for demonstration.
        default: default_value
      nginx_multisite_sites:
        type: dict
        description: Mapping of site names to document roots, source files, and TLS paths.
        default:
          test.cluster.local:
            document_root: /var/www/test.cluster.local
            source: test/index.html
            certificate: /etc/ssl/certs/test.cluster.local.crt
            key: /etc/ssl/private/test.cluster.local.key
          ci.cluster.local:
            document_root: /var/www/ci.cluster.local
            source: ci/index.html
            certificate: /etc/ssl/certs/ci.cluster.local.crt
            key: /etc/ssl/private/ci.cluster.local.key
          status.cluster.local:
            document_root: /var/www/status.cluster.local
            source: status/index.html
            certificate: /etc/ssl/certs/status.cluster.local.crt
            key: /etc/ssl/private/status.cluster.local.key
      nginx_multisite_web_user:
        type: str
        description: User owning nginx document roots and content.
        default: "{{ 'nginx' if ansible_facts.os_family == 'RedHat' else 'www-data' }}"
      nginx_multisite_web_group:
        type: str
        description: Group owning nginx document roots and content.
        default: "{{ 'nginx' if ansible_facts.os_family == 'RedHat' else 'www-data' }}"
      nginx_multisite_ssh_service:
        type: str
        description: SSH daemon service name.
        default: "{{ 'sshd' if ansible_facts.os_family == 'RedHat' else 'ssh' }}"
