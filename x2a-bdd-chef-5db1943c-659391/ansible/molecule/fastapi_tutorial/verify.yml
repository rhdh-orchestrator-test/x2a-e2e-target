---
# Unsupported pre-flight diagnostics: git remote/branch/revision, Python and pip version/list
# output, .env ownership/mode and contents, PostgreSQL password login and privilege listing,
# systemctl/journal output, and the full process/socket diagnostic output. Their commands do
# not state a directly assertable result or would expose sensitive or diagnostic output.
- name: Verify fastapi-tutorial
  hosts: all
  gather_facts: true
  tasks:
    - name: Check application paths
      ansible.builtin.stat:
        path: "{{ item_fastapi_path['path'] }}"
      register: fastapi_paths
      loop:
        - path: /opt/fastapi-tutorial
        - path: /opt/fastapi-tutorial/requirements.txt
        - path: /opt/fastapi-tutorial/venv
        - path: /opt/fastapi-tutorial/venv/bin/python
        - path: /opt/fastapi-tutorial/venv/bin/pip
      loop_control:
        loop_var: item_fastapi_path

    - name: Assert application paths have the required types
      ansible.builtin.assert:
        that:
          - item_fastapi_path_result.stat.exists
          - (not item_fastapi_path_result.item.path.endswith('/python') and
            not item_fastapi_path_result.item.path.endswith('/pip') and
            item_fastapi_path_result.stat.isdir) or
            (item_fastapi_path_result.item.path.endswith('/python') or
            item_fastapi_path_result.item.path.endswith('/pip')) and
            item_fastapi_path_result.stat.executable
        fail_msg: "An application path is missing or has the wrong type"
      loop: "{{ fastapi_paths.results }}"
      loop_control:
        loop_var: item_fastapi_path_result

    - name: Check required .env settings without displaying values
      ansible.builtin.command:
        argv:
          - grep
          - -qE
          - "{{ item_fastapi_setting['pattern'] }}"
          - /opt/fastapi-tutorial/.env
      register: fastapi_env_settings
      changed_when: false
      loop:
        - pattern: '^PROJECT_NAME='
        - pattern: '^API_VERSION='
        - pattern: '^DATABASE_URL='
      loop_control:
        loop_var: item_fastapi_setting

    - name: Assert required .env settings are present
      ansible.builtin.assert:
        that:
          - item_fastapi_setting_result.rc == 0
        fail_msg: "A required application setting is missing from /opt/fastapi-tutorial/.env"
      loop: "{{ fastapi_env_settings.results }}"
      loop_control:
        loop_var: item_fastapi_setting_result

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert PostgreSQL is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['postgresql.service']['status'] == 'enabled'
          - ansible_facts.services['postgresql.service']['state'] == 'running'
        fail_msg: "The postgresql service must be enabled and active"

    - name: Assert fastapi-tutorial is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['fastapi-tutorial.service']['status'] == 'enabled'
          - ansible_facts.services['fastapi-tutorial.service']['state'] == 'running'
        fail_msg: "The fastapi-tutorial service must be enabled and active"

    - name: Read fastapi-tutorial systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit

    - name: Assert exact fastapi-tutorial systemd settings
      ansible.builtin.assert:
        that:
          - "'WorkingDirectory=/opt/fastapi-tutorial' in (fastapi_unit.content | b64decode)"
          - "'Environment=\"PATH=/opt/fastapi-tutorial/venv/bin\"' in (fastapi_unit.content | b64decode)"
          - "'ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000' in (fastapi_unit.content | b64decode)"
          - "'Restart=always' in (fastapi_unit.content | b64decode)"
          - "'After=network.target postgresql.service' in (fastapi_unit.content | b64decode)"
        fail_msg: "The fastapi-tutorial systemd unit is missing a required setting"

    - name: Verify systemd unit syntax
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit_verify
      changed_when: false

    - name: Assert systemd unit syntax is valid
      ansible.builtin.assert:
        that:
          - fastapi_unit_verify.rc == 0
        fail_msg: "systemd-analyze verify reported an invalid unit"

    - name: Check FastAPI process
      ansible.builtin.command:
        argv:
          - pgrep
          - -af
          - /opt/fastapi-tutorial/venv/bin/uvicorn app.main:app
      register: fastapi_process
      changed_when: false

    - name: Assert FastAPI process is running
      ansible.builtin.assert:
        that:
          - fastapi_process.rc == 0
        fail_msg: "The FastAPI uvicorn process must be running"

    - name: Wait for FastAPI port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8000
        state: started
        timeout: 10

    - name: Request FastAPI endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/
        method: HEAD
        status_code: "{{ range(100, 600) | list }}"
      register: fastapi_http

    - name: Assert FastAPI endpoint returns an HTTP response
      ansible.builtin.assert:
        that:
          - fastapi_http.status | int >= 100
          - fastapi_http.status | int < 600
        fail_msg: "The FastAPI endpoint must return an HTTP response"

    - name: Check PostgreSQL role
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT rolname FROM pg_roles WHERE rolname = 'fastapi';
      register: fastapi_role
      changed_when: false

    - name: Assert PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - fastapi_role.rc == 0
          - fastapi_role.stdout | trim == 'fastapi'
        fail_msg: "The PostgreSQL fastapi role must exist"

    - name: Check database owner
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT datname, pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'fastapi_db';
      register: fastapi_database
      changed_when: false

    - name: Assert database owner
      ansible.builtin.assert:
        that:
          - fastapi_database.rc == 0
          - fastapi_database.stdout | trim == 'fastapi_db | fastapi'
        fail_msg: "The fastapi_db database must be owned by fastapi"

    - name: Check database privileges
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT has_database_privilege('fastapi', 'fastapi_db', 'CONNECT,CREATE,TEMPORARY');
      register: fastapi_privileges
      changed_when: false

    - name: Assert database privileges
      ansible.builtin.assert:
        that:
          - fastapi_privileges.rc == 0
          - fastapi_privileges.stdout | trim == 't'
        fail_msg: "The fastapi role must have the required database privileges"

    - name: Check Fedora or RHEL PostgreSQL initialization marker
      ansible.builtin.stat:
        path: /var/lib/pgsql/data/PG_VERSION
      register: fastapi_pg_marker
      when: ansible_facts.os_family == 'RedHat'

    - name: Assert Fedora or RHEL PostgreSQL initialization marker
      ansible.builtin.assert:
        that:
          - fastapi_pg_marker.stat.exists
          - fastapi_pg_marker.stat.isreg
        fail_msg: "The PostgreSQL initialization marker must exist on Fedora or RHEL"
      when: ansible_facts.os_family == 'RedHat'
