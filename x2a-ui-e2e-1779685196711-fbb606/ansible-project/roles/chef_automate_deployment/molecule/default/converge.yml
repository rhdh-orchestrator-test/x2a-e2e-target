---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/etc/sysctl.d
        - /tmp/molecule_test/var/log/chef-automate

    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    - name: Create sysctl parameter files
      ansible.builtin.copy:
        content: "{{ item.key }} = {{ item.value }}"
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate-{{ item.key | replace('.', '-') }}.conf"
        mode: "0644"
      loop:
        - key: vm.max_map_count
          value: 262144
        - key: vm.dirty_expire_centisecs
          value: 20000

    - name: Create Chef Automate CLI file
      ansible.builtin.file:
        path: "/tmp/molecule_test/chef-automate"
        state: touch
        mode: "0755"

    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA...\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/admin.pem"
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA...\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/lab-validator.pem"
        mode: "0600"

    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-postgresql.default
            Status: running
          Service: automate-elasticsearch.default
            Status: running
          Service: automate-gateway.default
            Status: running
        dest: "/tmp/molecule_test/chef-automate-status.txt"
        mode: "0644"

    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          run: postgresql: (pid 12345) 123s; run: log: (pid 12346) 123s
          run: bookshelf: (pid 12347) 123s; run: log: (pid 12348) 123s
          run: oc_bifrost: (pid 12349) 123s; run: log: (pid 12350) 123s
          run: oc_id: (pid 12351) 123s; run: log: (pid 12352) 123s
          run: opscode-erchef: (pid 12353) 123s; run: log: (pid 12354) 123s
        dest: "/tmp/molecule_test/chef-server-status.txt"
        mode: "0644"

    - name: Create user list file
      ansible.builtin.copy:
        content: "admin\n"
        dest: "/tmp/molecule_test/chef-server-user-list.txt"
        mode: "0644"

    - name: Create organization list file
      ansible.builtin.copy:
        content: "lab\n"
        dest: "/tmp/molecule_test/chef-server-org-list.txt"
        mode: "0644"