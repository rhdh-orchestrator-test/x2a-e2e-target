---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters for Chef Infra Server
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  become: true
  loop:
    - name: vm.max_map_count
      value: "{{ chef_automate_vm_max_map_count }}"
    - name: vm.dirty_expire_centisecs
      value: "{{ chef_automate_vm_dirty_expire_centisecs }}"
- name: Ensure directory exists for Chef Automate CLI
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path | dirname }}"
    state: directory
    mode: "0755"
  when: chef_automate_cli_path | dirname != '.'
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c "{{ chef_automate_cli_path }}.zip" > "{{ chef_automate_cli_path }}"
    creates: "{{ chef_automate_cli_path }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }} "
  become: true
  args:
    creates: /hab
- name: Ensure directory exists for Chef user key
  ansible.builtin.file:
    path: "{{ chef_user_key_path | dirname }}"
    state: directory
    mode: "0755"
  when: chef_user_key_path | dirname != '.'
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_user_key_path }}

      '
  become: true
  args:
    creates: "{{ chef_user_key_path }}"
- name: Ensure directory exists for Chef organization validator key
  ansible.builtin.file:
    path: "{{ chef_org_validator_key_path | dirname }}"
    state: directory
    mode: "0755"
  when: chef_org_validator_key_path | dirname != '.'
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}" --association_user {{ username }} --filename {{ chef_org_validator_key_path }}

      '
  become: true
  args:
    creates: "{{ chef_org_validator_key_path }}"
