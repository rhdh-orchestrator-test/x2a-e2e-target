---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    chef_org_name: lab
    chef_user_key_path: "{{ username }}.pem"
    chef_org_validator_key_path: "{{ chef_org_name }}-validator.pem"
  tasks:
    # System configuration checks
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_file.stat.exists

    # Sysctl configuration checks
    - name: Check sysctl configuration files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: sysctl_files
      loop:
        - /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        - /tmp/molecule_test/etc/sysctl.d/98-chef-automate.conf

    - name: Assert sysctl files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Sysctl file {{ item.item }} not found"
        success_msg: "Sysctl file {{ item.item }} exists"
      loop: "{{ sysctl_files.results }}"

    # Chef Automate CLI check
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # User key file check
    - name: Check user key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/{{ chef_user_key_path }}
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.size > 0
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    # Organization validator key file check
    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/{{ chef_org_validator_key_path }}
      register: org_validator_key_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_validator_key_file.stat.exists
          - org_validator_key_file.stat.size > 0
        fail_msg: "Organization validator key file not found"
        success_msg: "Organization validator key file exists"

    # Chef Automate status check (would be run with chef-automate status)
    - name: Check Chef Automate status file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate-status
      register: chef_automate_status_file

    - name: Assert Chef Automate status file exists
      ansible.builtin.assert:
        that:
          - chef_automate_status_file.stat.exists
        fail_msg: "Chef Automate status file not found"
        success_msg: "Chef Automate status file exists"

    # Chef Infra Server status check (would be run with chef-server-ctl status)
    - name: Check Chef Infra Server status file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-server-status
      register: chef_server_status_file

    - name: Assert Chef Infra Server status file exists
      ansible.builtin.assert:
        that:
          - chef_server_status_file.stat.exists
        fail_msg: "Chef Infra Server status file not found"
        success_msg: "Chef Infra Server status file exists"

    # User verification check (would be run with chef-server-ctl user-list)
    - name: Check Chef user list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-user-list
      register: chef_user_list_file

    - name: Assert Chef user list file exists
      ansible.builtin.assert:
        that:
          - chef_user_list_file.stat.exists
        fail_msg: "Chef user list file not found"
        success_msg: "Chef user list file exists"

    - name: Get Chef user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/chef-user-list
      register: chef_user_list_content
      when: chef_user_list_file.stat.exists

    - name: Assert user exists in Chef user list
      ansible.builtin.assert:
        that:
          - "'jtonello' in (chef_user_list_content.content | b64decode)"
        fail_msg: "User jtonello not found in Chef user list"
        success_msg: "User jtonello found in Chef user list"
      when: chef_user_list_file.stat.exists

    # Organization verification check (would be run with chef-server-ctl org-list)
    - name: Check Chef organization list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-org-list
      register: chef_org_list_file

    - name: Assert Chef organization list file exists
      ansible.builtin.assert:
        that:
          - chef_org_list_file.stat.exists
        fail_msg: "Chef organization list file not found"
        success_msg: "Chef organization list file exists"

    - name: Get Chef organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/chef-org-list
      register: chef_org_list_content
      when: chef_org_list_file.stat.exists

    - name: Assert organization exists in Chef organization list
      ansible.builtin.assert:
        that:
          - "'lab' in (chef_org_list_content.content | b64decode)"
        fail_msg: "Organization lab not found in Chef organization list"
        success_msg: "Organization lab found in Chef organization list"
      when: chef_org_list_file.stat.exists

    # Web UI accessibility check (would be run with curl)
    - name: Check web UI accessibility
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
      register: web_ui_result
      ignore_errors: true
      tags: molecule-notest

    - name: Assert web UI is accessible
      ansible.builtin.assert:
        that:
          - web_ui_result.status == 200
        fail_msg: "Web UI is not accessible"
        success_msg: "Web UI is accessible"
      when: web_ui_result is defined
      tags: molecule-notest

    # Network listening check (would be run with netstat or ss)
    - name: Check network listening ports
      ansible.builtin.command:
        cmd: ss -tlnp | grep 443
      register: network_listening_result
      ignore_errors: true
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - network_listening_result.rc == 0
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      when: network_listening_result is defined
      tags: molecule-notest

    # Service logs check (would be run with journalctl)
    - name: Check service logs
      ansible.builtin.command:
        cmd: journalctl -u chef-automate -n 50
      register: service_logs_result
      ignore_errors: true
      tags: molecule-notest

    - name: Assert service logs are available
      ansible.builtin.assert:
        that:
          - service_logs_result.rc == 0
        fail_msg: "Service logs are not available"
        success_msg: "Service logs are available"
      when: service_logs_result is defined
      tags: molecule-notest