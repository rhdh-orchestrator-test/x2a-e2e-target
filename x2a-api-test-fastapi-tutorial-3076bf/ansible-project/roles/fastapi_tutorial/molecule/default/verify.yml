---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Application directory and files verification
    - name: Check application directory and files exist
      ansible.builtin.stat:
        path: "{{ item_path }}"
      loop:
        - /tmp/molecule_test/opt/fastapi-tutorial
        - /tmp/molecule_test/opt/fastapi-tutorial/venv
        - /tmp/molecule_test/opt/fastapi-tutorial/.env
        - /tmp/molecule_test/opt/fastapi-tutorial/requirements.txt
        - /tmp/molecule_test/opt/fastapi-tutorial/app/main.py
        - /tmp/molecule_test/etc/systemd/system/fastapi-tutorial.service
      loop_control:
        loop_var: item_path
      register: file_stat_results

    - name: Assert application files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: "Expected application file not found"
      loop: "{{ file_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Python virtual environment verification
    - name: Check Python virtual environment executables exist
      ansible.builtin.stat:
        path: "{{ item_venv_exec }}"
      loop:
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/python
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/pip
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_venv_exec
      register: venv_stat_results

    - name: Assert virtual environment executables exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['executable']
        fail_msg: "Expected virtual environment executable not found"
      loop: "{{ venv_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Environment configuration verification
    - name: Read environment configuration file
      ansible.builtin.slurp:
        src: /tmp/molecule_test/opt/fastapi-tutorial/.env
      register: env_file_content

    - name: Assert environment configuration contains required variables
      ansible.builtin.assert:
        that:
          - "'PROJECT_NAME=' in env_content"
          - "'API_VERSION=' in env_content"
          - "'DATABASE_URL=' in env_content"
          - "'postgresql://fastapi:' in env_content"
          - "'fastapi_db' in env_content"
        fail_msg: "Environment configuration missing required variables"
      vars:
        env_content: "{{ env_file_content['content'] | b64decode }}"

    # Systemd service unit verification
    - name: Read systemd service unit file
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/systemd/system/fastapi-tutorial.service
      register: service_file_content

    - name: Assert systemd service unit contains required configuration
      ansible.builtin.assert:
        that:
          - "'Description=FastAPI Tutorial Service' in service_content"
          - "'After=network.target postgresql.service' in service_content"
          - "'WorkingDirectory=/opt/fastapi-tutorial' in service_content"
          - "'uvicorn app.main:app' in service_content"
          - "'--host 0.0.0.0 --port 8000' in service_content"
          - "'WantedBy=multi-user.target' in service_content"
        fail_msg: "Systemd service unit missing required configuration"
      vars:
        service_content: "{{ service_file_content['content'] | b64decode }}"

    # Git repository verification
    - name: Check git repository files exist
      ansible.builtin.stat:
        path: "{{ item_git_path }}"
      loop:
        - /tmp/molecule_test/opt/fastapi-tutorial/.git
        - /tmp/molecule_test/opt/fastapi-tutorial/.git/HEAD
        - /tmp/molecule_test/opt/fastapi-tutorial/.git/config
      loop_control:
        loop_var: item_git_path
      register: git_stat_results

    - name: Assert git repository files exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: "Expected git repository file not found"
      loop: "{{ git_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read git config file
      ansible.builtin.slurp:
        src: /tmp/molecule_test/opt/fastapi-tutorial/.git/config
      register: git_config_content

    - name: Assert git repository is configured correctly
      ansible.builtin.assert:
        that:
          - "'https://github.com/dibanez/fastapi_tutorial.git' in git_config"
          - "'origin' in git_config"
          - "'main' in git_config"
        fail_msg: "Git repository not configured correctly"
      vars:
        git_config: "{{ git_config_content['content'] | b64decode }}"

    # Application code verification
    - name: Read requirements.txt file
      ansible.builtin.slurp:
        src: /tmp/molecule_test/opt/fastapi-tutorial/requirements.txt
      register: requirements_content

    - name: Assert requirements.txt contains expected dependencies
      ansible.builtin.assert:
        that:
          - "'fastapi' in requirements_text"
          - "'uvicorn' in requirements_text"
          - "'sqlalchemy' in requirements_text"
          - "'psycopg2' in requirements_text"
        fail_msg: "Requirements file missing expected dependencies"
      vars:
        requirements_text: "{{ requirements_content['content'] | b64decode }}"

    - name: Read main application file
      ansible.builtin.slurp:
        src: /tmp/molecule_test/opt/fastapi-tutorial/app/main.py
      register: main_app_content

    - name: Assert main application file contains FastAPI app
      ansible.builtin.assert:
        that:
          - "'from fastapi import FastAPI' in main_app_text"
          - "'app = FastAPI()' in main_app_text"
          - "'def read_root' in main_app_text"
          - "'def health_check' in main_app_text"
        fail_msg: "Main application file missing expected FastAPI code"
      vars:
        main_app_text: "{{ main_app_content['content'] | b64decode }}"

# Service and network checks that cannot run in container environment
- name: Verify services (container-incompatible)
  hosts: all
  gather_facts: false
  tasks:
    - name: Check PostgreSQL service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert PostgreSQL service is available
      ansible.builtin.assert:
        that:
          - "'postgresql.service' in ansible_facts.services"
        fail_msg: "PostgreSQL service not found"
      tags: molecule-notest

    - name: Check FastAPI service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert FastAPI service is configured
      ansible.builtin.assert:
        that:
          - "'fastapi-tutorial.service' in ansible_facts.services"
        fail_msg: "FastAPI tutorial service not found"
      tags: molecule-notest

    - name: Check FastAPI application health endpoint
      ansible.builtin.uri:
        url: http://localhost:8000/health
        method: GET
        status_code: 200
      tags: molecule-notest

    - name: Check FastAPI application root endpoint
      ansible.builtin.uri:
        url: http://localhost:8000/
        method: GET
        status_code: 200
      tags: molecule-notest

    - name: Check FastAPI docs endpoint
      ansible.builtin.uri:
        url: http://localhost:8000/docs
        method: GET
        status_code: 200
      tags: molecule-notest

    - name: Check port 8000 is listening
      ansible.builtin.wait_for:
        port: 8000
        host: localhost
        timeout: 5
      tags: molecule-notest