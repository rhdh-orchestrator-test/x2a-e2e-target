---
- name: Check if Chef user already exists
  ansible.builtin.command:
    cmd: chef-server-ctl user-list
  become: true
  register: chef_user_list
  changed_when: false
  check_mode: false
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_automate_username }} {{ chef_automate_longusername }} {{ chef_automate_useremail }} "{{ chef_automate_userpassword }}"
      --filename {{ chef_automate_user_key_path }}

      '
  become: true
  when: chef_automate_username not in chef_user_list.stdout
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  no_log: true
- name: Check if Chef organization already exists
  ansible.builtin.command:
    cmd: chef-server-ctl org-list
  become: true
  register: chef_org_list
  changed_when: false
  check_mode: false
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_orgname }} "{{ chef_automate_longorgname }}" --association_user {{ chef_automate_username }} --filename {{ chef_automate_org_key_path
      }}

      '
  become: true
  when: chef_automate_orgname not in chef_org_list.stdout
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
