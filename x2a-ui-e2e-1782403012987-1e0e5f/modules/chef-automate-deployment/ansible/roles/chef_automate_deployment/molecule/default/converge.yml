---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/var/opt/chef-automate/cert
        - /tmp/molecule_test/home/ansible
        - /tmp/molecule_test/var/opt/chef-server

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration
      ansible.builtin.copy:
        content: |
          vm.max_map_count = {{ chef_automate_vm_max_map_count }}
          vm.dirty_expire_centisecs = {{ chef_automate_vm_dirty_expire_centisecs }}
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Simulate Chef Automate CLI download and extraction
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: /tmp/molecule_test/chef-automate
        mode: "0755"

    # Simulate Chef Automate config
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          [global]
            v1 = true
          
          [deployment]
            products = ["automate", "infra-server"]
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"

    # Simulate Chef Automate certificate
    - name: Create Chef Automate certificate
      ansible.builtin.copy:
        content: |
          -----BEGIN CERTIFICATE-----
          MIIDMTCCAhmgAwIBAgIUJTUwNjM5MDI5Nzc3NzQ2NjM5NDMwDQYJKoZIhvcNAQEL
          BQAwKDELMAkGA1UEBhMCVVMxGTAXBgNVBAMMEGF1dG9tYXRlLmNoZWYubGFiMB4X
          DTIzMDEwMTAwMDAwMFoXDTI0MDEwMTAwMDAwMFowKDELMAkGA1UEBhMCVVMxGTAX
          BgNVBAMMEGF1dG9tYXRlLmNoZWYubGFiMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A
          MIIBCgKCAQEAvVH+GRSQLGMUZlgX1GvYkzwZIPlgr5F9tIeQoJ4UcIhv6m+bWEOA
          -----END CERTIFICATE-----
        dest: /tmp/molecule_test/var/opt/chef-automate/cert/automate.cert
        mode: "0644"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAvVH+GRSQLGMUZlgX1GvYkzwZIPlgr5F9tIeQoJ4UcIhv6m+b
          WEOAuTCgOT1LL7IHHWH7TE7oDxV+HkCQRZcXRhVBgfIJvhVY2gh0pHQXqpnw1rDt
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/ansible/{{ chef_automate_username }}.pem"
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0n7Zcz+0QXtXYYFHVQePYZm3lj+JYYYCeJJX9qbnUUWcCKFY
          XgHEPWXt7x5vwFRf5J9/hKP96Y9a/oFbP3wjJDDPBpIY7Q==
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/ansible/{{ chef_automate_orgname }}-validator.pem"
        mode: "0600"

    # Simulate Chef server user list output
    - name: Create Chef server user list file
      ansible.builtin.copy:
        content: |
          {{ chef_automate_username }}
          pivotal
          admin
        dest: /tmp/molecule_test/var/opt/chef-server/user-list.txt
        mode: "0644"

    # Simulate Chef server organization list output
    - name: Create Chef server organization list file
      ansible.builtin.copy:
        content: |
          {{ chef_automate_orgname }}
        dest: /tmp/molecule_test/var/opt/chef-server/org-list.txt
        mode: "0644"

    # Simulate Chef server user details
    - name: Create Chef server user details file
      ansible.builtin.copy:
        content: |
          username: {{ chef_automate_username }}
          display_name: {{ chef_automate_longusername }}
          email: {{ chef_automate_useremail }}
        dest: "/tmp/molecule_test/var/opt/chef-server/user-{{ chef_automate_username }}.txt"
        mode: "0644"

    # Simulate Chef server organization details
    - name: Create Chef server organization details file
      ansible.builtin.copy:
        content: |
          name: {{ chef_automate_orgname }}
          full_name: {{ chef_automate_longorgname }}
          associated_users: {{ chef_automate_username }}
        dest: "/tmp/molecule_test/var/opt/chef-server/org-{{ chef_automate_orgname }}.txt"
        mode: "0644"