---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    chef_org_name: lab
    chef_user_pem_file: jtonello.pem
    chef_org_validator_pem_file: lab-validator.pem
  tasks:
    # System configuration checks
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_file.stat.exists

    # Kernel parameter checks
    - name: Check vm.max_map_count file
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_file

    - name: Assert vm.max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
          - max_map_count_file.stat.isreg
        fail_msg: "vm.max_map_count file not found"
        success_msg: "vm.max_map_count file exists"

    - name: Get vm.max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "262144"
        fail_msg: "vm.max_map_count is not set correctly"
        success_msg: "vm.max_map_count is set correctly"
      when: max_map_count_file.stat.exists

    - name: Check vm.dirty_expire_centisecs file
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_file

    - name: Assert vm.dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_centisecs_file.stat.exists
          - dirty_expire_centisecs_file.stat.isreg
        fail_msg: "vm.dirty_expire_centisecs file not found"
        success_msg: "vm.dirty_expire_centisecs file exists"

    - name: Get vm.dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_content
      when: dirty_expire_centisecs_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
        fail_msg: "vm.dirty_expire_centisecs is not set correctly"
        success_msg: "vm.dirty_expire_centisecs is set correctly"
      when: dirty_expire_centisecs_file.stat.exists

    # Chef Automate CLI check
    - name: Check Chef Automate CLI file
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI file exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI file not found or not executable"
        success_msg: "Chef Automate CLI file exists and is executable"

    # Chef deployment directory checks
    - name: Check Chef deployment directories
      ansible.builtin.stat:
        path: "/tmp/molecule_test/hab"
      register: chef_hab_dir

    - name: Assert Chef deployment directory exists
      ansible.builtin.assert:
        that:
          - chef_hab_dir.stat.exists
          - chef_hab_dir.stat.isdir
        fail_msg: "Chef deployment directory not found"
        success_msg: "Chef deployment directory exists"

    # PEM file checks
    - name: Check user PEM file
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_user_pem_file }}"
      register: user_pem_file

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem_file.stat.exists
          - user_pem_file.stat.isreg
          - user_pem_file.stat.size > 0
        fail_msg: "User PEM file not found"
        success_msg: "User PEM file exists"

    - name: Check organization validator PEM file
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_org_validator_pem_file }}"
      register: org_validator_pem_file

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_validator_pem_file.stat.exists
          - org_validator_pem_file.stat.isreg
          - org_validator_pem_file.stat.size > 0
        fail_msg: "Organization validator PEM file not found"
        success_msg: "Organization validator PEM file exists"

    # Chef Automate status check
    - name: Check Chef Automate status file
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/sup/chef-automate-status
      register: chef_automate_status_file

    - name: Get Chef Automate status content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/sup/chef-automate-status
      register: chef_automate_status_content
      when: chef_automate_status_file.stat.exists

    - name: Assert Chef Automate services are running
      ansible.builtin.assert:
        that:
          - chef_automate_status_content.content | b64decode | string | regex_search('Status: running')
        fail_msg: "Chef Automate services are not running"
        success_msg: "Chef Automate services are running"
      when: chef_automate_status_file.stat.exists
      tags: molecule-notest

    # Chef Infra Server status check
    - name: Check Chef Infra Server status file
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/sup/chef-server-status
      register: chef_server_status_file

    - name: Get Chef Infra Server status content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/sup/chef-server-status
      register: chef_server_status_content
      when: chef_server_status_file.stat.exists

    - name: Assert Chef Infra Server services are running
      ansible.builtin.assert:
        that:
          - chef_server_status_content.content | b64decode | string | regex_search('run: chef-server')
        fail_msg: "Chef Infra Server services are not running"
        success_msg: "Chef Infra Server services are running"
      when: chef_server_status_file.stat.exists
      tags: molecule-notest

    # User and organization list checks
    - name: Check user list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/sup/chef-server-user-list
      register: user_list_file

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/sup/chef-server-user-list
      register: user_list_content
      when: user_list_file.stat.exists

    - name: Assert user exists in user list
      ansible.builtin.assert:
        that:
          - user_list_content.content | b64decode | string | regex_search(username)
        fail_msg: "User not found in user list"
        success_msg: "User found in user list"
      when: user_list_file.stat.exists
      tags: molecule-notest

    - name: Check organization list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/sup/chef-server-org-list
      register: org_list_file

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/sup/chef-server-org-list
      register: org_list_content
      when: org_list_file.stat.exists

    - name: Assert organization exists in organization list
      ansible.builtin.assert:
        that:
          - org_list_content.content | b64decode | string | regex_search(chef_org_name)
        fail_msg: "Organization not found in organization list"
        success_msg: "Organization found in organization list"
      when: org_list_file.stat.exists
      tags: molecule-notest

    # Network port check
    - name: Check netstat output file
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/sup/netstat-output
      register: netstat_file

    - name: Get netstat output content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/sup/netstat-output
      register: netstat_content
      when: netstat_file.stat.exists

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - netstat_content.content | b64decode | string | regex_search('0.0.0.0:443')
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      when: netstat_file.stat.exists
      tags: molecule-notest

    # Process check
    - name: Check process list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/sup/process-list
      register: process_list_file

    - name: Get process list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/sup/process-list
      register: process_list_content
      when: process_list_file.stat.exists

    - name: Assert Chef processes are running
      ansible.builtin.assert:
        that:
          - process_list_content.content | b64decode | string | regex_search('chef-automate')
          - process_list_content.content | b64decode | string | regex_search('chef-server-ctl')
        fail_msg: "Chef processes are not running"
        success_msg: "Chef processes are running"
      when: process_list_file.stat.exists
      tags: molecule-notest

    # Web UI access check
    - name: Check web UI access
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
      register: web_ui_result
      failed_when: false
      tags: molecule-notest

    - name: Assert web UI is accessible
      ansible.builtin.assert:
        that:
          - web_ui_result.status == 200
        fail_msg: "Web UI is not accessible"
        success_msg: "Web UI is accessible"
      when: web_ui_result is defined
      tags: molecule-notest