---
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ chef_user_longname }} {{ chef_user_email }}  "{{ password }}" --filename {{ chef_user_pem_file }}
  become: true
  no_log: true
  args:
    creates: /etc/chef/{{ chef_user_pem_file }}
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_longname }}"  --association_user {{ username }} --filename {{ chef_org_validator_pem_file
      }}
  become: true
  args:
    creates: /etc/chef/{{ chef_org_validator_pem_file }}
