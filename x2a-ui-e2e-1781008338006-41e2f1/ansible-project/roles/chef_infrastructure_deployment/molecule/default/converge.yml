- name: Converge
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    password: testpassword
    chef_hostname: automate.chef.lab
    chef_vm_max_map_count: 262144
    chef_vm_dirty_expire_centisecs: 20000
    chef_org_name: lab
    chef_user_pem_file: jtonello.pem
    chef_org_validator_pem_file: lab-validator.pem
  tasks:
  - name: Create expected directory structure
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '{{ chef_vm_max_map_count }}'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '{{ chef_vm_dirty_expire_centisecs }}'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Mock'''
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef deployment directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/hab/sup
    - /tmp/molecule_test/hab/svc
    - /tmp/molecule_test/hab/pkgs
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5NhYMoj56/TLQCj4lY3q5XIWM4MVkGR9kTyZF5hQ5JFZGNA

        MOCK_PEM_CONTENT_FOR_USER

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_user_pem_file }}
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5NhYMoj56/TLQCj4lY3q5XIWM4MVkGR9kTyZF5hQ5JFZGNA

        MOCK_PEM_CONTENT_FOR_ORG_VALIDATOR

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_org_validator_pem_file }}
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: chef-automate-postgresql.default

        Status: running

        Service: chef-automate-elasticsearch.default

        Status: running

        Service: chef-automate-ui.default

        Status: running

        '
      dest: /tmp/molecule_test/hab/sup/chef-automate-status
      mode: '0644'
  - name: Create Chef Infra Server status file
    ansible.builtin.copy:
      content: 'run: chef-server-nginx: (pid 12345) 123s; run: log: (pid 12346) 123s

        run: chef-server-bookshelf: (pid 12347) 123s; run: log: (pid 12348) 123s

        run: chef-server-oc_bifrost: (pid 12349) 123s; run: log: (pid 12350) 123s

        run: chef-server-oc_id: (pid 12351) 123s; run: log: (pid 12352) 123s

        run: chef-server-opscode-erchef: (pid 12353) 123s; run: log: (pid 12354) 123s

        '
      dest: /tmp/molecule_test/hab/sup/chef-server-status
      mode: '0644'
  - name: Create user list file
    ansible.builtin.copy:
      content: '{{ username }}'
      dest: /tmp/molecule_test/hab/sup/chef-server-user-list
      mode: '0644'
  - name: Create organization list file
    ansible.builtin.copy:
      content: '{{ chef_org_name }}'
      dest: /tmp/molecule_test/hab/sup/chef-server-org-list
      mode: '0644'
  - name: Create netstat output file
    ansible.builtin.copy:
      content: 'tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      12345/nginx

        '
      dest: /tmp/molecule_test/hab/sup/netstat-output
      mode: '0644'
  - name: Create process list file
    ansible.builtin.copy:
      content: 'root     12345  0.0  0.5 123456 54321 ?        Ss   10:00   0:01 /hab/pkgs/chef/automate/1.0.0/bin/chef-automate

        root     12346  0.0  0.5 123456 54321 ?        Ss   10:00   0:01 /hab/pkgs/chef/infra-server/14.0.0/bin/chef-server-ctl

        '
      dest: /tmp/molecule_test/hab/sup/process-list
      mode: '0644'
