---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true
- name: Install Apache web server
  ansible.builtin.apt:
    name: apache2={{ apache_version }}
  become: true
- name: Install curl, openssl, PyOpenSSL
  ansible.builtin.apt:
    pkg:
      - curl
      - openssl
      - python3-openssl
  become: true
- name: Create a directory for SSL certificates
  ansible.builtin.file:
    path: "{{ ssl_cert_path }}"
    state: directory
    mode: "0750"
  become: true
- name: Generate an OpenSSL private key
  community.crypto.openssl_privatekey:
    path: "{{ ssl_cert_path }}/apache.key"
  become: true
- name: Generate an OpenSSL CSR
  community.crypto.openssl_csr:
    path: "{{ ssl_cert_path }}/apache.csr"
    privatekey_path: "{{ ssl_cert_path }}/apache.key"
    common_name: "{{ website_domain }}"
  become: true
- name: Generate a self-signed OpenSSL certificate
  community.crypto.openssl_certificate:
    path: "{{ ssl_cert_path }}/apache.crt"
    privatekey_path: "{{ ssl_cert_path }}/apache.key"
    csr_path: "{{ ssl_cert_path }}/apache.csr"
    provider: selfsigned
  become: true
- name: Configure Hello World virtual host
  ansible.builtin.template:
    src: helloworld.conf.j2
    dest: /etc/apache2/sites-available/helloworld.conf
    mode: "0640"
  become: true
- name: Create the website root directory
  ansible.builtin.file:
    path: "{{ website_root }}"
    state: directory
    mode: "0755"
  become: true
- name: Deploy the Hello World website
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ website_root }}/index.html"
    owner: root
    group: root
    mode: "0644"
  become: true
- name: Deactivate the default virtualhost
  ansible.builtin.command:
    cmd: a2dissite 000-default
  register: dissite_result
  changed_when: "'already disabled' not in dissite_result.stdout"
  become: true
- name: Activate the virtualhost
  ansible.builtin.command:
    cmd: a2ensite helloworld
  register: ensite_result
  changed_when: "'already enabled' not in ensite_result.stdout"
  notify:
    - Restart apache
  become: true
- name: Activate SSL on Apache
  community.general.apache2_module:
    name: ssl
    state: present
  notify:
    - Restart apache
  become: true
