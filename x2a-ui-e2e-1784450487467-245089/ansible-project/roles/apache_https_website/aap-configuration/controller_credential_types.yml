---
controller_credential_types:
- name: Chef Automate Deployment
  description: Hardcoded credentials in setup-automate scripts
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Automate/Infra Server
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Automate/Infra Server
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
