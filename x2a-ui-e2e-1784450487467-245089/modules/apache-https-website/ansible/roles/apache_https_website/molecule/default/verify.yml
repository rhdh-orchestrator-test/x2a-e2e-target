---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: cert_files
      loop:
        - /tmp/molecule_test/etc/apache2/certs/apache.key
        - /tmp/molecule_test/etc/apache2/certs/apache.csr
        - /tmp/molecule_test/etc/apache2/certs/apache.crt

    - name: Assert SSL certificate files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
        fail_msg: "SSL certificate file {{ item.item }} not found or empty"
        success_msg: "SSL certificate file {{ item.item }} exists"
      loop: "{{ cert_files.results }}"

    - name: Check virtual host configuration exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      register: vhost_config

    - name: Assert virtual host configuration exists
      ansible.builtin.assert:
        that:
          - vhost_config.stat.exists
          - vhost_config.stat.size > 0
        fail_msg: "Virtual host configuration not found or empty"
        success_msg: "Virtual host configuration exists"

    - name: Check virtual host is enabled (symlink exists)
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
      register: vhost_enabled

    - name: Assert virtual host is enabled
      ansible.builtin.assert:
        that:
          - vhost_enabled.stat.exists
          - vhost_enabled.stat.islnk
        fail_msg: "Virtual host is not enabled"
        success_msg: "Virtual host is enabled"

    - name: Check website content exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/www/helloworld/index.html
      register: website_content

    - name: Assert website content exists
      ansible.builtin.assert:
        that:
          - website_content.stat.exists
          - website_content.stat.size > 0
        fail_msg: "Website content not found or empty"
        success_msg: "Website content exists"

    - name: Get website content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/www/helloworld/index.html
      register: website_content_data

    - name: Assert website content is correct
      ansible.builtin.assert:
        that:
          - "'Test Site' in (website_content_data.content | b64decode)"
          - "'Hello, world!' in (website_content_data.content | b64decode)"
          - "'The site is up and running' in (website_content_data.content | b64decode)"
        fail_msg: "Website content does not contain expected text"
        success_msg: "Website content contains expected text"

    - name: Check SSL module is enabled
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.load
      register: ssl_module

    - name: Assert SSL module is enabled
      ansible.builtin.assert:
        that:
          - ssl_module.stat.exists
          - ssl_module.stat.islnk
        fail_msg: "SSL module is not enabled"
        success_msg: "SSL module is enabled"

    # The following checks cannot run in a container environment
    # They are tagged with molecule-notest to be skipped during molecule tests

    - name: Check Apache service is running
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Check website is accessible via HTTPS
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
        return_content: true
      register: website_response
      tags: molecule-notest

    - name: Assert website is accessible
      ansible.builtin.assert:
        that:
          - website_response.status == 200
          - "'Hello, world!' in website_response.content"
        fail_msg: "Website is not accessible via HTTPS"
        success_msg: "Website is accessible via HTTPS"
      tags: molecule-notest

    - name: Validate Apache configuration
      ansible.builtin.command:
        cmd: apache2ctl configtest
      register: apache_config_test
      changed_when: false
      tags: molecule-notest

    - name: Assert Apache configuration is valid
      ansible.builtin.assert:
        that:
          - apache_config_test.rc == 0
          - "'Syntax OK' in apache_config_test.stdout"
        fail_msg: "Apache configuration is invalid"
        success_msg: "Apache configuration is valid"
      tags: molecule-notest