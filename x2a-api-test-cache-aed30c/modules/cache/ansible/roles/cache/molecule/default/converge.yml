---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis/6379
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file for port 6379
          # Generated by Ansible

          # Network
          port 6379
          bind 127.0.0.1

          # Authentication
          requirepass redis_secure_password_123

          # Logging
          logfile /var/log/redis/redis_6379.log
          loglevel notice

          # General
          daemonize yes
          pidfile /var/run/redis/redis_6379.pid
          timeout 0
          tcp-keepalive 0

          # Memory management
          maxmemory-policy allkeys-lru

          # Persistence
          save 900 1
          save 300 10
          save 60 10000
          stop-writes-on-bgsave-error yes
          rdbcompression yes
          rdbchecksum yes
          dbfilename dump_6379.rdb
          dir /var/lib/redis/6379

          # Append only file
          appendonly no
          appendfilename "appendonly_6379.aof"
          appendfsync everysec
          no-appendfsync-on-rewrite no
          auto-aof-rewrite-percentage 100
          auto-aof-rewrite-min-size 64mb

          # Slow log
          slowlog-log-slower-than 10000
          slowlog-max-len 128

          # Client output buffer limits
          client-output-buffer-limit normal 0 0 0
          client-output-buffer-limit slave 256mb 64mb 60
          client-output-buffer-limit pubsub 32mb 8mb 60
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create Redis log file
      ansible.builtin.copy:
        content: |
          # Redis log file placeholder
          [1] 01 Jan 00:00:00.000 # Server started, Redis version 6.0.0
          [1] 01 Jan 00:00:00.000 # Ready to accept connections
        dest: /tmp/molecule_test/var/log/redis/redis_6379.log
        mode: "0644"
        backup: true

    - name: Create memcached configuration placeholder
      ansible.builtin.copy:
        content: |
          # Memcached configuration placeholder
          -p 11211
          -U 11211
          -u memcache
          -m 64
          -c 1024
          -v
        dest: /tmp/molecule_test/etc/memcached.conf
        mode: "0644"
        backup: true