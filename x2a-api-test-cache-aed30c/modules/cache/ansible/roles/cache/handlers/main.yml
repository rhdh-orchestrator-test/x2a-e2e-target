---
- name: Restart Redis
  ansible.builtin.service:
    name: redis_{{ cache_redis_port }}
    state: restarted
- name: Restart Memcached
  ansible.builtin.service:
    name: memcached
    state: restarted
- name: Reload Redis
  ansible.builtin.service:
    name: redis_{{ cache_redis_port }}
    state: reloaded
