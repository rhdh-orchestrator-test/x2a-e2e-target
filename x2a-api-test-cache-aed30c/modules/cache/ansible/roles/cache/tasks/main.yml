---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install memcached and redis packages
  ansible.builtin.package:
    name:
      - memcached
      - redis-server
    state: present
- name: Create redis user
  ansible.builtin.user:
    name: redis
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present
- name: Create redis group
  ansible.builtin.group:
    name: redis
    system: true
    state: present
- name: Create Redis configuration directory
  ansible.builtin.file:
    path: /etc/redis
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}"
    state: directory
    owner: "{{ cache_redis_log_dir_owner }}"
    group: "{{ cache_redis_log_dir_group }}"
    mode: "{{ cache_redis_log_dir_mode }}"
    recurse: true
- name: Create Redis runtime directory
  ansible.builtin.file:
    path: /var/run/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
- name: Create Redis data directory
  ansible.builtin.file:
    path: /var/lib/redis/{{ cache_redis_port }}
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true
- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}"
    owner: redis
    group: redis
    mode: "0640"
    backup: true
  notify: Restart Redis
- name: Remove deprecated Redis configuration lines
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}"
    regexp: ^{{ item_cache }}.*$
    state: absent
  loop: "{{ cache_redis_deprecated_settings }}"
  loop_control:
    loop_var: item_cache
  notify: Restart Redis
- name: Start and enable memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
- name: Start and enable Redis service
  ansible.builtin.service:
    name: redis_{{ cache_redis_port }}
    state: started
    enabled: true
