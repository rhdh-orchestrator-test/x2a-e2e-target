---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for Chef Automate and Chef Infra Server
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/opscode
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/opscode
        - /tmp/molecule_test/tmp

    # Simulate system configuration
    - name: Create mock hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    - name: Create mock sysctl settings
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate Chef Automate CLI download and installation
    - name: Create mock Chef Automate CLI
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI mock"
        dest: "/tmp/molecule_test/tmp/chef-automate"
        mode: "0755"

    # Simulate Chef Automate configuration
    - name: Create mock Chef Automate config
      ansible.builtin.copy:
        content: |
          [global]
            v1 = true
          [automate]
            enable = true
          [infra-server]
            enable = true
        dest: "/tmp/molecule_test/etc/chef-automate/config.toml"
        mode: "0644"

    # Simulate Chef Infra Server configuration
    - name: Create mock Chef Infra Server config
      ansible.builtin.copy:
        content: |
          # Chef Infra Server configuration
          nginx['enable'] = true
          nginx['ssl_port'] = 443
        dest: "/tmp/molecule_test/etc/opscode/chef-server.rb"
        mode: "0644"

    # Simulate user and organization creation
    - name: Create mock user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA...MOCK_KEY...
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/jtonello.pem"
        mode: "0600"

    - name: Create mock organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA...MOCK_ORG_KEY...
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/lab-validator.pem"
        mode: "0600"

    # Simulate Chef server user and org lists
    - name: Create mock user list file
      ansible.builtin.copy:
        content: |
          pivotal
          jtonello
        dest: "/tmp/molecule_test/etc/opscode/user-list.txt"
        mode: "0644"

    - name: Create mock organization list file
      ansible.builtin.copy:
        content: |
          lab
        dest: "/tmp/molecule_test/etc/opscode/org-list.txt"
        mode: "0644"

    # Simulate service status files
    - name: Create mock Chef Automate service status
      ansible.builtin.copy:
        content: |
          chef-automate-postgresql.service: active
          chef-automate-elasticsearch.service: active
          chef-automate-nginx.service: active
        dest: "/tmp/molecule_test/etc/chef-automate/service-status.txt"
        mode: "0644"

    - name: Create mock Chef Infra Server service status
      ansible.builtin.copy:
        content: |
          chef-server-nginx: run: /opt/opscode/service/chef-server-nginx: (pid 12345) 3600s
          chef-solr: run: /opt/opscode/service/chef-solr: (pid 12346) 3600s
          postgresql: run: /opt/opscode/service/postgresql: (pid 12347) 3600s
        dest: "/tmp/molecule_test/etc/opscode/service-status.txt"
        mode: "0644"

    # Simulate network listening ports
    - name: Create mock network ports file
      ansible.builtin.copy:
        content: |
          tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/nginx
          tcp        0      0 0.0.0.0:9631            0.0.0.0:*               LISTEN      5678/hab-sup
        dest: "/tmp/molecule_test/etc/netstat-output.txt"
        mode: "0644"