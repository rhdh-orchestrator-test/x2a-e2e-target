---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration verification
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Verify hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check sysctl configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file was created
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Verify sysctl parameters are set correctly
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count = 262144' in (sysctl_content.content | b64decode)"
          - "'vm.dirty_expire_centisecs = 20000' in (sysctl_content.content | b64decode)"
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI verification
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI was created
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate configuration verification
    - name: Check Chef Automate config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config

    - name: Assert Chef Automate config file was created
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
          - chef_automate_config.stat.size > 0
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    - name: Get Chef Automate config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config_content
      when: chef_automate_config.stat.exists

    - name: Verify Chef Automate config contains required settings
      ansible.builtin.assert:
        that:
          - "'[automate]' in (chef_automate_config_content.content | b64decode)"
          - "'[infra-server]' in (chef_automate_config_content.content | b64decode)"
        fail_msg: "Chef Automate config missing required settings"
        success_msg: "Chef Automate config contains required settings"
      when: chef_automate_config.stat.exists

    # Chef Infra Server configuration verification
    - name: Check Chef Infra Server config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/opscode/chef-server.rb
      register: chef_server_config

    - name: Assert Chef Infra Server config file was created
      ansible.builtin.assert:
        that:
          - chef_server_config.stat.exists
          - chef_server_config.stat.size > 0
        fail_msg: "Chef Infra Server config file not found"
        success_msg: "Chef Infra Server config file exists"

    # User and organization verification
    - name: Check user key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_key_file

    - name: Assert user key file was created
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.size > 0
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_key_file

    - name: Assert organization validator key file was created
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.size > 0
        fail_msg: "Organization validator key file not found"
        success_msg: "Organization validator key file exists"

    - name: Check user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/opscode/user-list.txt
      register: user_list_file

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/opscode/user-list.txt
      register: user_list_content
      when: user_list_file.stat.exists

    - name: Verify user exists in user list
      ansible.builtin.assert:
        that:
          - "'jtonello' in (user_list_content.content | b64decode)"
        fail_msg: "User 'jtonello' not found in user list"
        success_msg: "User 'jtonello' found in user list"
      when: user_list_file.stat.exists

    - name: Check organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/opscode/org-list.txt
      register: org_list_file

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/opscode/org-list.txt
      register: org_list_content
      when: org_list_file.stat.exists

    - name: Verify organization exists in organization list
      ansible.builtin.assert:
        that:
          - "'lab' in (org_list_content.content | b64decode)"
        fail_msg: "Organization 'lab' not found in organization list"
        success_msg: "Organization 'lab' found in organization list"
      when: org_list_file.stat.exists

    # Service status verification (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/service-status.txt
      register: chef_automate_service_status
      tags: molecule-notest

    - name: Get Chef Automate service status content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-automate/service-status.txt
      register: chef_automate_service_content
      when: chef_automate_service_status.stat.exists
      tags: molecule-notest

    - name: Verify Chef Automate services are active
      ansible.builtin.assert:
        that:
          - "'active' in (chef_automate_service_content.content | b64decode)"
        fail_msg: "Chef Automate services not active"
        success_msg: "Chef Automate services are active"
      when: chef_automate_service_status.stat.exists
      tags: molecule-notest

    - name: Check Chef Infra Server service status
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/opscode/service-status.txt
      register: chef_server_service_status
      tags: molecule-notest

    - name: Get Chef Infra Server service status content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/opscode/service-status.txt
      register: chef_server_service_content
      when: chef_server_service_status.stat.exists
      tags: molecule-notest

    - name: Verify Chef Infra Server services are running
      ansible.builtin.assert:
        that:
          - "'run:' in (chef_server_service_content.content | b64decode)"
        fail_msg: "Chef Infra Server services not running"
        success_msg: "Chef Infra Server services are running"
      when: chef_server_service_status.stat.exists
      tags: molecule-notest

    # Network port verification (tagged for skipping in container)
    - name: Check network ports file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/netstat-output.txt
      register: netstat_file
      tags: molecule-notest

    - name: Get network ports content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/netstat-output.txt
      register: netstat_content
      when: netstat_file.stat.exists
      tags: molecule-notest

    - name: Verify required ports are listening
      ansible.builtin.assert:
        that:
          - "'0.0.0.0:443' in (netstat_content.content | b64decode)"
          - "'0.0.0.0:9631' in (netstat_content.content | b64decode)"
        fail_msg: "Required ports not listening"
        success_msg: "Required ports are listening"
      when: netstat_file.stat.exists
      tags: molecule-notest