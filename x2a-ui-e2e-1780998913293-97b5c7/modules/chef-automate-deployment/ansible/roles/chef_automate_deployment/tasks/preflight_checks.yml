---
- name: Check system memory
  ansible.builtin.command:
    cmd: free -m
  register: memory_check
  changed_when: false
  tags: molecule-notest
- name: Verify system has enough memory
  ansible.builtin.assert:
    that:
      - (memory_check.stdout_lines[1].split()[1] | int) >= 8192
    fail_msg: System requires at least 8GB of RAM for Chef Automate
    success_msg: System has sufficient memory for Chef Automate
  tags: molecule-notest
- name: Check disk space
  ansible.builtin.command:
    cmd: df -h /
  register: disk_check
  changed_when: false
  tags: molecule-notest
- name: Verify system has enough disk space
  ansible.builtin.assert:
    that:
      - disk_check.stdout is regex('.*[0-9]+G.*')
    fail_msg: System requires at least 40GB of free disk space for Chef Automate
    success_msg: System has sufficient disk space for Chef Automate
  tags: molecule-notest
- name: Check if ports 443 and 9631 are available
  ansible.builtin.wait_for:
    port: "{{ item }}"
    state: stopped
    timeout: 5
  loop:
    - 443
    - 9631
  register: port_check
  ignore_errors: true
  tags: molecule-notest
- name: Verify required ports are available
  ansible.builtin.assert:
    that:
      - port_check is succeeded
    fail_msg: Required ports (443, 9631) are not available
    success_msg: Required ports are available for Chef Automate
  tags: molecule-notest
- name: Check if Chef Automate is already installed
  ansible.builtin.stat:
    path: /etc/chef-automate/config.toml
  register: chef_automate_config
- name: Check if Chef Infra Server is already installed
  ansible.builtin.stat:
    path: /etc/opscode
  register: chef_server_config
- name: Display installation status
  ansible.builtin.debug:
    msg: Chef Automate is {{ 'already installed' if chef_automate_config.stat.exists else 'not installed' }}. Chef Infra Server is {{ 'already installed' if
      chef_server_config.stat.exists else 'not installed' }}.
