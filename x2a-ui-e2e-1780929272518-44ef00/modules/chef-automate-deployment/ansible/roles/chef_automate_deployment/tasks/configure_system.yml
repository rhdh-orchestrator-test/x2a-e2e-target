---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - unzip
      - tar
      - jq
    state: present
  become: true
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Update /etc/hosts with hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ^127.0.0.1\s+{{ chef_automate_hostname }}$
    line: 127.0.0.1 {{ chef_automate_hostname }}
    state: present
  become: true
- name: Configure kernel parameters for Chef Automate
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: false
    reload: false
  loop: "{{ chef_automate_sysctl | dict2items }}"
  become: true
  notify: Apply sysctl settings
