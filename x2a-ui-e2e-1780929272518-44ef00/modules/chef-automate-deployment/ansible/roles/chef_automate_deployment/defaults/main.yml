---
chef_automate_hostname: automate.chef.lab
chef_automate_sysctl:
  vm.max_map_count: 262144
  vm.dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: "{{ ansible_env.PWD }}/chef-automate"
chef_automate_accept_terms: true
chef_automate_org_name: "{{ organization | default('lab') }}"
chef_automate_org_full_name: Chef Lab
chef_automate_user_name: "{{ username | default('admin') }}"
chef_automate_user_full_name: Administrator
chef_automate_user_email: admin@example.com
chef_automate_user_password: "{{ password | default('password') }}"
chef_automate_user_key_file: "{{ chef_automate_user_name }}.pem"
chef_automate_org_validator_key_file: "{{ chef_automate_org_name }}-validator.pem"
chef_automate_deployment_type: automate_and_server
