---
controller_credential_types:
- name: Chef Admin User
  description: Credential type for Chef Admin User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Admin Username
      help_text: Username for the Chef Automate/Infra Server admin user
    - id: password
      type: string
      label: Admin Password
      secret: true
      help_text: Password for the Chef Automate/Infra Server admin user
    - id: organization
      type: string
      label: Organization Name
      help_text: Name of the Chef organization to create
    required:
    - username
    - password
    - organization
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      organization: !unsafe '{{ organization }}'
