---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check hosts file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hosts
      register: hosts_file

    - name: Assert hosts file was created
      ansible.builtin.assert:
        that:
          - hosts_file.stat.exists
          - hosts_file.stat.isreg
        fail_msg: "Hosts file not found"
        success_msg: "Hosts file exists"

    - name: Get hosts file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hosts
      register: hosts_content
      when: hosts_file.stat.exists

    - name: Assert hosts file contains hostname entry
      ansible.builtin.assert:
        that:
          - (hosts_content.content | b64decode) is search('automate.chef.lab')
        fail_msg: "Hosts file does not contain hostname entry"
        success_msg: "Hosts file contains hostname entry"
      when: hosts_file.stat.exists

    - name: Check sysctl configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl configuration file was created
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl configuration file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl configuration contains required settings
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
          - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "Sysctl configuration does not contain required settings"
        success_msg: "Sysctl configuration contains required settings"
      when: sysctl_file.stat.exists

    # Chef Automate CLI checks
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/usr/local/bin/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI was created
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # User and organization verification
    - name: Check user key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/admin.pem
      register: user_key_file

    - name: Assert user key file was created
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.isreg
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_validator_key_file

    - name: Assert organization validator key file was created
      ansible.builtin.assert:
        that:
          - org_validator_key_file.stat.exists
          - org_validator_key_file.stat.isreg
        fail_msg: "Organization validator key file not found"
        success_msg: "Organization validator key file exists"

    # Service status checks (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: chef-automate status
      register: chef_automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check Chef Server service status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: chef_server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Server service is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Server service is not running"
        success_msg: "Chef Server service is running"
      tags: molecule-notest

    # Web UI accessibility checks (tagged for skipping in container)
    - name: Check Chef Automate web UI accessibility
      ansible.builtin.uri:
        url: https://automate.chef.lab/_status
        validate_certs: false
      register: chef_automate_web_ui
      tags: molecule-notest

    - name: Assert Chef Automate web UI is accessible
      ansible.builtin.assert:
        that:
          - chef_automate_web_ui.status == 200
        fail_msg: "Chef Automate web UI is not accessible"
        success_msg: "Chef Automate web UI is accessible"
      tags: molecule-notest

    - name: Check Chef Automate API accessibility
      ansible.builtin.uri:
        url: https://automate.chef.lab/api/v0/auth/version
        validate_certs: false
      register: chef_automate_api
      tags: molecule-notest

    - name: Assert Chef Automate API is accessible
      ansible.builtin.assert:
        that:
          - chef_automate_api.status == 200
        fail_msg: "Chef Automate API is not accessible"
        success_msg: "Chef Automate API is accessible"
      tags: molecule-notest

    # Network listening checks (tagged for skipping in container)
    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      register: port_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # Chef server API check (tagged for skipping in container)
    - name: Check Chef server API
      ansible.builtin.command:
        cmd: knife user list -s https://automate.chef.lab/organizations/lab -u admin -k admin.pem --ssl-verify=false
      register: chef_server_api
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef server API is accessible
      ansible.builtin.assert:
        that:
          - chef_server_api.rc == 0
        fail_msg: "Chef server API is not accessible"
        success_msg: "Chef server API is accessible"
      tags: molecule-notest

    # Chef organization check (tagged for skipping in container)
    - name: Check Chef organization
      ansible.builtin.command:
        cmd: knife org list -s https://automate.chef.lab -u admin -k admin.pem --ssl-verify=false
      register: chef_org
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef organization exists
      ansible.builtin.assert:
        that:
          - chef_org.rc == 0
          - "'lab' in chef_org.stdout"
        fail_msg: "Chef organization does not exist"
        success_msg: "Chef organization exists"
      tags: molecule-notest

    # Chef Automate API health check (tagged for skipping in container)
    - name: Check Chef Automate API health
      ansible.builtin.uri:
        url: https://automate.chef.lab/api/v0/health
        validate_certs: false
      register: chef_automate_health
      tags: molecule-notest

    - name: Assert Chef Automate API is healthy
      ansible.builtin.assert:
        that:
          - chef_automate_health.status == 200
        fail_msg: "Chef Automate API is not healthy"
        success_msg: "Chef Automate API is healthy"
      tags: molecule-notest