---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/usr/local/bin

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname | default('automate.chef.lab') }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate /etc/hosts entry
    - name: Create hosts file with hostname entry
      ansible.builtin.copy:
        content: |
          127.0.0.1 localhost
          127.0.0.1 {{ chef_automate_hostname | default('automate.chef.lab') }}
        dest: /tmp/molecule_test/etc/hosts
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: |
          # Chef Automate sysctl settings
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # Mock Chef Automate CLI
          echo "Chef Automate CLI v1.0.0"
          echo "This is a mock file for testing"
        dest: /tmp/molecule_test/usr/local/bin/chef-automate
        mode: "0755"

    # Simulate Chef Server CTL
    - name: Create Chef Server CTL file
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # Mock Chef Server CTL
          echo "Chef Server CTL v1.0.0"
          echo "This is a mock file for testing"
        dest: /tmp/molecule_test/usr/local/bin/chef-server-ctl
        mode: "0755"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          ... mock key content ...
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/{{ chef_automate_user_name | default('admin') }}.pem"
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          ... mock key content ...
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/{{ chef_automate_org_name | default('lab') }}-validator.pem"
        mode: "0600"

    # Simulate Chef Automate status file
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          {
            "status": "running",
            "services": {
              "automate-gateway": "running",
              "automate-postgresql": "running",
              "automate-elasticsearch": "running"
            }
          }
        dest: /tmp/molecule_test/hab/sup/default/status/chef-automate.json
        mode: "0644"

    # Simulate Chef Server status file
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          {
            "status": "running",
            "services": {
              "bookshelf": "running",
              "oc_bifrost": "running",
              "oc_erchef": "running",
              "postgresql": "running"
            }
          }
        dest: /tmp/molecule_test/hab/sup/default/status/chef-server.json
        mode: "0644"