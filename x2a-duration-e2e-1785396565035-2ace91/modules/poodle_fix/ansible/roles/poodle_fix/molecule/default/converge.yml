---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create directory structure for Apache config
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/apache2/mods-available

    - name: Create mock Apache SSL config file
      ansible.builtin.copy:
        content: |
          # Mock Apache SSL configuration file
          # This simulates the original file before the POODLE fix
          SSLEngine on
          SSLProtocol all -SSLv2
          SSLCipherSuite HIGH:MEDIUM:!aNULL:!MD5
        dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
        mode: "0644"

    - name: Apply POODLE fix to Apache SSL config
      ansible.builtin.replace:
        dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
        regexp: ^SSLProtocol.*$
        replace: SSLProtocol -all +TLSv1.2