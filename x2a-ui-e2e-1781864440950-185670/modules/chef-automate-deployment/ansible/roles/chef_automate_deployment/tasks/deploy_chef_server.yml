---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure vm.max_map_count kernel parameter
  ansible.builtin.command:
    cmd: sysctl -w vm.max_map_count={{ chef_automate_vm_max_map_count }}
  become: true
  changed_when: true
- name: Configure vm.dirty_expire_centisecs kernel parameter
  ansible.builtin.command:
    cmd: sysctl -w vm.dirty_expire_centisecs={{ chef_automate_vm_dirty_expire_centisecs }}
  become: true
  changed_when: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ ansible_env.HOME }}/chef-automate.zip"
    mode: "0644"
  register: download_result
  changed_when: download_result.changed
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: "set -o pipefail\ngunzip < chef-automate.zip > chef-automate && chmod +x chef-automate\n"
    executable: /bin/bash
  args:
    chdir: "{{ ansible_env.HOME }}"
    creates: "{{ ansible_env.HOME }}/chef-automate"
  register: extract_result
  changed_when: extract_result.rc == 0
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}\n"
  args:
    chdir: "{{ ansible_env.HOME }}"
    creates: /etc/chef-automate/config.toml
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
  timeout: 3600
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ username | default(chef_automate_username) }}  "{{ full_name | default(chef_automate_longusername) }}"  {{ email | default(chef_automate_useremail)
      }}  "{{ password }}"  --filename {{ chef_automate_userfilename }}

      '
  args:
    creates: "{{ chef_automate_userfilename }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_automate_orgname }}  "{{ chef_automate_longorgname }}"  --association_user {{ username | default(chef_automate_username)
      }}  --filename {{ chef_automate_orgfilename }}

      '
  args:
    creates: "{{ chef_automate_orgfilename }}"
  become: true
