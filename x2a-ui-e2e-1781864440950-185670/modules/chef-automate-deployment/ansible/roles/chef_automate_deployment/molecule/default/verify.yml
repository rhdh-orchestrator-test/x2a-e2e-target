---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists and has content
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found or empty"
        success_msg: "Hostname file exists and has content"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_file.stat.exists

    # Kernel parameter checks
    - name: Check vm.max_map_count file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_file

    - name: Assert vm.max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
        fail_msg: "vm.max_map_count file not found"
        success_msg: "vm.max_map_count file exists"

    - name: Get vm.max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "262144"
        fail_msg: "vm.max_map_count is not set correctly"
        success_msg: "vm.max_map_count is set correctly"
      when: max_map_count_file.stat.exists

    - name: Check vm.dirty_expire_centisecs file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_file

    - name: Assert vm.dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_centisecs_file.stat.exists
        fail_msg: "vm.dirty_expire_centisecs file not found"
        success_msg: "vm.dirty_expire_centisecs file exists"

    - name: Get vm.dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_content
      when: dirty_expire_centisecs_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
        fail_msg: "vm.dirty_expire_centisecs is not set correctly"
        success_msg: "vm.dirty_expire_centisecs is set correctly"
      when: dirty_expire_centisecs_file.stat.exists

    # Chef Automate CLI check
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate configuration check
    - name: Check Chef Automate config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config

    - name: Assert Chef Automate config file exists
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
          - chef_automate_config.stat.size > 0
        fail_msg: "Chef Automate config file not found or empty"
        success_msg: "Chef Automate config file exists"

    # Chef user and organization key checks
    - name: Check user key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/jtonello.pem
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.size > 0
        fail_msg: "User key file not found or empty"
        success_msg: "User key file exists"

    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/lab-validator.pem
      register: org_key_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.size > 0
        fail_msg: "Organization validator key file not found or empty"
        success_msg: "Organization validator key file exists"

    # Chef Automate status check
    - name: Check Chef Automate status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/chef-automate-status.log
      register: chef_automate_status_file

    - name: Assert Chef Automate status file exists
      ansible.builtin.assert:
        that:
          - chef_automate_status_file.stat.exists
          - chef_automate_status_file.stat.size > 0
        fail_msg: "Chef Automate status file not found or empty"
        success_msg: "Chef Automate status file exists"

    # Chef Server status check
    - name: Check Chef Server status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/chef-server-status.log
      register: chef_server_status_file

    - name: Assert Chef Server status file exists
      ansible.builtin.assert:
        that:
          - chef_server_status_file.stat.exists
          - chef_server_status_file.stat.size > 0
        fail_msg: "Chef Server status file not found or empty"
        success_msg: "Chef Server status file exists"

    # User and organization verification
    - name: Check user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/chef-server-user-list.log
      register: user_list_file

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/log/chef-server-user-list.log
      register: user_list_content
      when: user_list_file.stat.exists

    - name: Assert user exists in user list
      ansible.builtin.assert:
        that:
          - "'jtonello' in (user_list_content.content | b64decode)"
        fail_msg: "User jtonello not found in user list"
        success_msg: "User jtonello found in user list"
      when: user_list_file.stat.exists

    - name: Check organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/chef-server-org-list.log
      register: org_list_file

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/log/chef-server-org-list.log
      register: org_list_content
      when: org_list_file.stat.exists

    - name: Assert organization exists in organization list
      ansible.builtin.assert:
        that:
          - "'lab' in (org_list_content.content | b64decode)"
        fail_msg: "Organization lab not found in organization list"
        success_msg: "Organization lab found in organization list"
      when: org_list_file.stat.exists

    # Service status checks - these would normally run on a real system but can't in a container
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: systemctl status chef-automate
      register: chef_automate_service
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - chef_automate_service.rc == 0
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    # Network checks - these would normally run on a real system but can't in a container
    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # API health checks - these would normally run on a real system but can't in a container
    - name: Check Chef Automate API health
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
      register: api_health
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate API is healthy
      ansible.builtin.assert:
        that:
          - api_health is succeeded
        fail_msg: "Chef Automate API is not healthy"
        success_msg: "Chef Automate API is healthy"
      tags: molecule-notest