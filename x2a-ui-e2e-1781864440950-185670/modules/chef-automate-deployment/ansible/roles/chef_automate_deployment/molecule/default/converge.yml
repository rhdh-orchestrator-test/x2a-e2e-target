---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    password: password
    full_name: John Tonello
    email: jtonello@chef.lab
  tasks:
    # Create directory structure
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/hostname
        - /tmp/molecule_test/home/ansible

    # Simulate system configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate kernel parameters
    - name: Create sysctl output files
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "/tmp/molecule_test/{{ item.path }}"
        mode: "0644"
      loop:
        - { path: "proc/sys/vm/max_map_count", value: "262144" }
        - { path: "proc/sys/vm/dirty_expire_centisecs", value: "20000" }

    # Simulate Chef Automate CLI download and extraction
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\n# Mock Chef Automate CLI\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/home/ansible/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          # Mock Chef Automate config
          [global]
            v1 = true
          [deployment]
            automate = true
            infra-server = true
        dest: "/tmp/molecule_test/etc/chef-automate/config.toml"
        mode: "0644"

    # Simulate Chef user and organization creation
    - name: Create Chef user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAx4UbaDzY5xjW6hc9jwN0mX33XpTDVW9WqHp5AKaRbtAC3DqX
          IXFMPgw3K45jxRb93f8tv9vL3rD9CUG1Gv4FM+o7ds7FRES5RTjv2RT/JVNJCoqF
          ol8+ngLqRZCyBtQN7zYByWMRirPGoDUqdPYrj2yq+ObBBNhg5N+hOwKjjpzdj2Ud
          1l7R+wxIqmJo1IYyy16xS8WsjyQuyC0lL456qkd5BDZ0Ag8j2X9H9D5220Ln7s9i
          oezTipXipS7p7Jekf3Ywx6abJwOmB0rX79dV4qiNcGgzATnG1PkXxqt76VhcGa0W
          DDVHEEYGbSQ6hIGSh0I7BQun0aLRZojfE3gqHQIDAQABAoIBAQCW3I4sKN5B9jOe
          ZG+C6L0TgTYK
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/ansible/jtonello.pem"
        mode: "0600"

    - name: Create Chef organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAx4UbaDzY5xjW6hc9jwN0mX33XpTDVW9WqHp5AKaRbtAC3DqX
          IXFMPgw3K45jxRb93f8tv9vL3rD9CUG1Gv4FM+o7ds7FRES5RTjv2RT/JVNJCoqF
          ol8+ngLqRZCyBtQN7zYByWMRirPGoDUqdPYrj2yq+ObBBNhg5N+hOwKjjpzdj2Ud
          1l7R+wxIqmJo1IYyy16xS8WsjyQuyC0lL456qkd5BDZ0Ag8j2X9H9D5220Ln7s9i
          oezTipXipS7p7Jekf3Ywx6abJwOmB0rX79dV4qiNcGgzATnG1PkXxqt76VhcGa0W
          DDVHEEYGbSQ6hIGSh0I7BQun0aLRZojfE3gqHQIDAQABAoIBAQCW3I4sKN5B9jOe
          ZG+C6L0TgTYK
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/ansible/lab-validator.pem"
        mode: "0600"

    # Simulate Chef server status files
    - name: Create Chef server status files
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "/tmp/molecule_test/{{ item.path }}"
        mode: "0644"
      loop:
        - path: "var/log/chef-automate-status.log"
          content: "Service: automate-gateway\nStatus: running\n\nService: automate-cs-nginx\nStatus: running\n"
        - path: "var/log/chef-server-status.log"
          content: "Service: chef-server-nginx\nStatus: running\n\nService: chef-server-ctl\nStatus: running\n"
        - path: "var/log/chef-server-user-list.log"
          content: "jtonello"
        - path: "var/log/chef-server-org-list.log"
          content: "lab"