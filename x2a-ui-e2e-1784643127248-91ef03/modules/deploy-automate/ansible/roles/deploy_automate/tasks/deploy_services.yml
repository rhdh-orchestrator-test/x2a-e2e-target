---
- name: Check if Chef Infra Server is already installed
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_installed
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: sudo ./chef-automate deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{
      chef_automate_accept_terms | lower }}
  args:
    chdir: "{{ ansible_env.HOME }}"
    creates: /usr/bin/chef-server-ctl
  register: deploy_result
  changed_when: deploy_result.rc == 0
  async: 3600
  poll: 30
  when: not chef_server_installed.stat.exists
