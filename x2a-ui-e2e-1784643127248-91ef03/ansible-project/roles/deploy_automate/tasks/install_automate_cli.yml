---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - gzip
      - unzip
    state: present
  become: true
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: cli_stat
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
  register: download_result
  when: not cli_stat.stat.exists
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: set -o pipefail && gunzip < /tmp/chef-automate_linux_amd64.zip > {{ chef_automate_cli_path }}
    executable: /bin/bash
    creates: "{{ chef_automate_cli_path }}"
  args:
    chdir: "{{ ansible_env.HOME }}"
  register: extract_result
  changed_when: extract_result.rc == 0
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
