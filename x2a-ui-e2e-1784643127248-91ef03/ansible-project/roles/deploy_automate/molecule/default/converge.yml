- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: chefuser
    password: changeme
    email: chef@example.com
    full_name: Chef User
    chef_automate_hostname: automate.chef.lab
    ansible_env:
      HOME: /tmp/molecule_test/home/molecule
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/usr/bin
    - /tmp/molecule_test/home/molecule
    - /tmp/molecule_test/proc/sys/vm
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname | default(''automate.chef.lab'') }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create mock Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI v1.0.0"

        echo "This is a mock file for molecule testing"

        '
      dest: /tmp/molecule_test/home/molecule/chef-automate
      mode: '0755'
  - name: Create mock chef-server-ctl
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Server Control v1.0.0"

        echo "This is a mock file for molecule testing"

        '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create mock user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        MOCK_KEY_CONTENT_FOR_MOLECULE_TESTING_ONLY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/molecule/chefuser.pem
      mode: '0600'
  - name: Create mock organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        MOCK_ORG_VALIDATOR_KEY_CONTENT_FOR_MOLECULE_TESTING_ONLY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/molecule/lab-validator.pem
      mode: '0600'
  - name: Create mock sysctl files
    ansible.builtin.file:
      path: /tmp/molecule_test/proc/sys/{{ item.path }}
      state: directory
      mode: '0755'
    loop:
    - path: vm
  - name: Create mock sysctl values
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/{{ item.path }}
      mode: '0644'
    loop:
    - path: vm/max_map_count
      value: '262144'
    - path: vm/dirty_expire_centisecs
      value: '20000'
