---
argument_specs:
  main:
    short_description: Simple cache cookbook - local dependency for testing
    description:
      - Installs and configures Redis server as a simple cache solution.
    options:
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Package name for Redis server.
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Service name for Redis server.
