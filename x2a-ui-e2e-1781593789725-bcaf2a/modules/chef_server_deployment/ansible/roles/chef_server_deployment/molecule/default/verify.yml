- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hosts file configuration
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hosts
    register: hosts_file
  - name: Assert hosts file exists
    ansible.builtin.assert:
      that:
      - hosts_file.stat.exists
      fail_msg: Hosts file not found
      success_msg: Hosts file exists
  - name: Get hosts file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hosts
    register: hosts_content
    when: hosts_file.stat.exists
  - name: Assert hostname is configured in hosts file
    ansible.builtin.assert:
      that:
      - '''automate.chef.lab'' in (hosts_content[''content''] | b64decode)'
      fail_msg: Hostname not configured in hosts file
      success_msg: Hostname properly configured in hosts file
    when: hosts_content is defined
  - name: Check vm.max_map_count configuration
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_file
  - name: Assert vm.max_map_count file exists
    ansible.builtin.assert:
      that:
      - max_map_count_file.stat.exists
      fail_msg: vm.max_map_count file not found
      success_msg: vm.max_map_count file exists
  - name: Get vm.max_map_count content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_content
    when: max_map_count_file.stat.exists
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - (max_map_count_content['content'] | b64decode | trim) == "262144"
      fail_msg: vm.max_map_count not set to 262144
      success_msg: vm.max_map_count set to 262144
    when: max_map_count_content is defined
  - name: Check vm.dirty_expire_centisecs configuration
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_file
  - name: Assert vm.dirty_expire_centisecs file exists
    ansible.builtin.assert:
      that:
      - dirty_expire_file.stat.exists
      fail_msg: vm.dirty_expire_centisecs file not found
      success_msg: vm.dirty_expire_centisecs file exists
  - name: Get vm.dirty_expire_centisecs content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_content
    when: dirty_expire_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - (dirty_expire_content['content'] | b64decode | trim) == "20000"
      fail_msg: vm.dirty_expire_centisecs not set to 20000
      success_msg: vm.dirty_expire_centisecs set to 20000
    when: dirty_expire_content is defined
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef deployment directory
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert Chef deployment directory exists
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef deployment directory not found
      success_msg: Chef deployment directory exists
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/molecule/chef-keys/admin.pem
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.size > 0
      fail_msg: User key file not found
      success_msg: User key file exists
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/molecule/chef-keys/lab-validator.pem
    register: org_key_file
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.size > 0
      fail_msg: Organization validator key file not found
      success_msg: Organization validator key file exists
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: chef-automate status
    register: automate_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - automate_status.rc == 0
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: chef-server-ctl status
    register: server_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - server_status.rc == 0
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Check user creation
    ansible.builtin.command:
      cmd: chef-server-ctl user-list
    register: user_list
    changed_when: false
    tags: molecule-notest
  - name: Assert user was created
    ansible.builtin.assert:
      that:
      - '''admin'' in user_list.stdout'
      fail_msg: User not found in Chef server
      success_msg: User found in Chef server
    tags: molecule-notest
  - name: Check organization creation
    ansible.builtin.command:
      cmd: chef-server-ctl org-list
    register: org_list
    changed_when: false
    tags: molecule-notest
  - name: Assert organization was created
    ansible.builtin.assert:
      that:
      - '''lab'' in org_list.stdout'
      fail_msg: Organization not found in Chef server
      success_msg: Organization found in Chef server
    tags: molecule-notest
  - name: Check HTTPS port is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
  - name: Check Chef Automate API health
    ansible.builtin.uri:
      url: https://localhost/api/v0/health
      validate_certs: false
      status_code: 200
    tags: molecule-notest
