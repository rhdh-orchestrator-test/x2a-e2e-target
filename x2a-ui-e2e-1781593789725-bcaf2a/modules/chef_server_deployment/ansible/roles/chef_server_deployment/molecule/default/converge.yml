- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create base directories for testing
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/home/molecule/chef-keys
  - name: Create hosts file
    ansible.builtin.copy:
      content: '127.0.0.1 localhost

        127.0.0.1 automate.chef.lab

        '
      dest: /tmp/molecule_test/etc/hosts
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '262144'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '20000'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create chef-automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/sh echo ''Chef Automate CLI Mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create hab directory to simulate deployment
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK USER KEY CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/home/molecule/chef-keys/admin.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK VALIDATOR KEY CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/home/molecule/chef-keys/lab-validator.pem
      mode: '0600'
  - name: Create chef-automate status output file
    ansible.builtin.copy:
      content: 'Service: automate-cs-bookshelf      Status: running

        Service: automate-cs-oc-bifrost     Status: running

        Service: automate-cs-oc-erchef      Status: running

        Service: automate-cs-nginx          Status: running

        Service: automate-cs-postgresql     Status: running

        '
      dest: /tmp/molecule_test/chef-automate-status.txt
      mode: '0644'
  - name: Create chef-server-ctl status output file
    ansible.builtin.copy:
      content: 'run: bookshelf: (pid 12345) 123 s; run: log: (pid 12346) 123 s

        run: oc_bifrost: (pid 12347) 123 s; run: log: (pid 12348) 123 s

        run: oc_erchef: (pid 12349) 123 s; run: log: (pid 12350) 123 s

        run: nginx: (pid 12351) 123 s; run: log: (pid 12352) 123 s

        run: postgresql: (pid 12353) 123 s; run: log: (pid 12354) 123 s

        '
      dest: /tmp/molecule_test/chef-server-ctl-status.txt
      mode: '0644'
  - name: Create chef-server-ctl user-list output file
    ansible.builtin.copy:
      content: 'admin '
      dest: /tmp/molecule_test/chef-server-ctl-user-list.txt
      mode: '0644'
  - name: Create chef-server-ctl org-list output file
    ansible.builtin.copy:
      content: 'lab '
      dest: /tmp/molecule_test/chef-server-ctl-org-list.txt
      mode: '0644'
