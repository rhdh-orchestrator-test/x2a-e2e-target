---
controller_credentials:
- name: Chef Admin User - chef_server_deployment
  description: Credential for chef_server_deployment
  organization: Default
  credential_type: Chef Admin User
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
