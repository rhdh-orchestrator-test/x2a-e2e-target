---
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product infra-server --accept-terms-and-mlsa=true
  args:
    creates: /hab
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
- name: Wait for Chef Infra Server services to start
  ansible.builtin.pause:
    seconds: 30
  when: deploy_result is changed
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  ignore_errors: true
  become: true
- name: Check Chef Infra Server status
  ansible.builtin.command:
    cmd: chef-server-ctl status
  register: server_status
  changed_when: false
  ignore_errors: true
  become: true
  when: chef_server_ctl_check.rc == 0
- name: Display Chef Infra Server status
  ansible.builtin.debug:
    var: server_status.stdout_lines
  when: server_status is defined and server_status.stdout is defined
