---
- name: Ensure key directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/chef-keys"
    state: directory
    mode: "0750"
  become: false
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_server_username }} "{{ chef_server_full_name }}" {{ chef_server_email }} "{{ chef_server_password }}" --filename {{
      ansible_env.HOME }}/chef-keys/{{ chef_server_user_key_file }}
  args:
    creates: "{{ ansible_env.HOME }}/chef-keys/{{ chef_server_user_key_file }}"
  become: true
  register: user_create_result
  changed_when: user_create_result.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_server_org_name }} "{{ chef_server_org_full_name }}" --association_user {{ chef_server_username }} --filename {{
      ansible_env.HOME }}/chef-keys/{{ chef_server_org_key_file }}
  args:
    creates: "{{ ansible_env.HOME }}/chef-keys/{{ chef_server_org_key_file }}"
  become: true
  register: org_create_result
  changed_when: org_create_result.rc == 0
- name: Verify user creation
  ansible.builtin.command:
    cmd: chef-server-ctl user-list
  register: user_list
  changed_when: false
  become: true
- name: Verify organization creation
  ansible.builtin.command:
    cmd: chef-server-ctl org-list
  register: org_list
  changed_when: false
  become: true
- name: Display created user and organization
  ansible.builtin.debug:
    msg:
      - "Created user: {{ chef_server_username }}"
      - "Created organization: {{ chef_server_org_name }}"
  when: user_create_result is changed or org_create_result is changed
