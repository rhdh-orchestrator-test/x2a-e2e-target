---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    chef_server_org_name: lab
  tasks:
    # System configuration verification
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Kernel parameters verification
    - name: Check vm.max_map_count sysctl file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-max_map_count.conf
      register: max_map_count_file

    - name: Assert vm.max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
        fail_msg: "vm.max_map_count sysctl file not found"
        success_msg: "vm.max_map_count sysctl file exists"

    - name: Get vm.max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-max_map_count.conf
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == 'vm.max_map_count = 262144'
        fail_msg: "vm.max_map_count not set correctly"
        success_msg: "vm.max_map_count set correctly"
      when: max_map_count_file.stat.exists

    - name: Check vm.dirty_expire_centisecs sysctl file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-dirty_expire_centisecs.conf
      register: dirty_expire_file

    - name: Assert vm.dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_file.stat.exists
        fail_msg: "vm.dirty_expire_centisecs sysctl file not found"
        success_msg: "vm.dirty_expire_centisecs sysctl file exists"

    - name: Get vm.dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-dirty_expire_centisecs.conf
      register: dirty_expire_content
      when: dirty_expire_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_content.content | b64decode | trim) == 'vm.dirty_expire_centisecs = 20000'
        fail_msg: "vm.dirty_expire_centisecs not set correctly"
        success_msg: "vm.dirty_expire_centisecs set correctly"
      when: dirty_expire_file.stat.exists

    # Chef Automate CLI verification
    - name: Check Chef Automate CLI file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate configuration verification
    - name: Check Chef Automate config file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.json
      register: chef_automate_config

    - name: Assert Chef Automate config exists
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    # Chef Server configuration verification
    - name: Check Chef Server config file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server/chef-server.rb
      register: chef_server_config

    - name: Assert Chef Server config exists
      ansible.builtin.assert:
        that:
          - chef_server_config.stat.exists
        fail_msg: "Chef Server config file not found"
        success_msg: "Chef Server config file exists"

    # User and organization verification
    - name: Check user key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.size > 0
        fail_msg: "User key file not found or empty"
        success_msg: "User key file exists"

    - name: Check organization validator key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_key_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.size > 0
        fail_msg: "Organization validator key file not found or empty"
        success_msg: "Organization validator key file exists"

    # Chef Automate status verification (would require service_facts in real environment)
    - name: Check Chef Automate status file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate-status.txt
      register: automate_status_file

    - name: Assert Chef Automate status file exists
      ansible.builtin.assert:
        that:
          - automate_status_file.stat.exists
        fail_msg: "Chef Automate status file not found"
        success_msg: "Chef Automate status file exists"

    # Chef Server status verification (would require service_facts in real environment)
    - name: Check Chef Server status file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-server-status.txt
      register: server_status_file

    - name: Assert Chef Server status file exists
      ansible.builtin.assert:
        that:
          - server_status_file.stat.exists
        fail_msg: "Chef Server status file not found"
        success_msg: "Chef Server status file exists"

    # The following tests would run in a real environment but are tagged to be skipped in molecule
    - name: Check Chef Automate service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate services are running
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "'chef-server.service' in ansible_facts.services"
        fail_msg: "Chef Automate or Chef Server services not running"
        success_msg: "Chef Automate and Chef Server services are running"
      tags: molecule-notest

    - name: Check Chef Automate API endpoint
      ansible.builtin.uri:
        url: https://localhost/api/_status
        validate_certs: false
        status_code: 200
      tags: molecule-notest

    - name: Check Chef Server API endpoint
      ansible.builtin.uri:
        url: https://localhost/organizations/lab
        validate_certs: false
        status_code: 200
      tags: molecule-notest

    - name: Check Chef Automate UI endpoint
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
        status_code: 200
      tags: molecule-notest

    - name: Check network ports
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      tags: molecule-notest