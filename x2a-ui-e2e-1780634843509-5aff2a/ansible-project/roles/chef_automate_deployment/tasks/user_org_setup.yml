---
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Fail if chef-server-ctl is not available
  ansible.builtin.fail:
    msg: chef-server-ctl command not found. Ensure Chef Infra Server is properly installed.
  when: chef_server_ctl_check.rc != 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_server_user_key_path }}
  become: true
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  failed_when: chef_user_create.rc != 0
  args:
    creates: "{{ chef_server_user_key_path }}"
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_server_org_name }} "{{ chef_server_org_long_name }}" --association_user {{ username }} --filename {{
      chef_server_org_key_path }}
  become: true
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
  failed_when: chef_org_create.rc != 0
  args:
    creates: "{{ chef_server_org_key_path }}"
