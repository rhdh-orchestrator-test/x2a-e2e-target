---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    password: password
    full_name: John Tonello
    email: jtonello@chef.lab
    chef_automate_hostname: automate.chef.lab
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
    chef_server_user_key_path: /tmp/molecule_test/jtonello.pem
    chef_server_org_key_path: /tmp/molecule_test/lab-validator.pem
    chef_automate_products:
      - automate
      - infra-server
    chef_server_org_name: lab
    chef_server_org_long_name: Chef Lab
  tasks:
    - name: Create necessary directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test
        - /tmp/molecule_test/etc/sysctl.d
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/etc/chef-server
        - /tmp/molecule_test/etc/chef-automate

    # Simulate system configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: "{{ item.key }} = {{ item.value }}"
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate-{{ item.key | replace('.', '-') }}.conf"
        mode: "0644"
      loop:
        - key: vm.max_map_count
          value: 262144
        - key: vm.dirty_expire_centisecs
          value: 20000

    # Simulate Chef Automate CLI download and extraction
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI Mock'\n"
        dest: "{{ chef_automate_cli_path }}"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate configuration file
      ansible.builtin.copy:
        content: |
          {
            "products": ["automate", "infra-server"],
            "accept_terms": true,
            "deployment_id": "molecule-test-deployment"
          }
        dest: /tmp/molecule_test/etc/chef-automate/config.json
        mode: "0644"

    # Simulate Chef Server deployment
    - name: Create Chef Server configuration file
      ansible.builtin.copy:
        content: |
          {
            "chef_server": {
              "api_fqdn": "{{ chef_automate_hostname }}",
              "configuration": {}
            }
          }
        dest: /tmp/molecule_test/etc/chef-server/chef-server.rb
        mode: "0644"

    # Simulate user and organization creation
    - name: Create user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAwU1RpGV5SHfY5XXTBw8QcP8P72M+LW9hZ4MfHJsJhvOJWPt6
          MOCK_KEY_CONTENT_FOR_USER
          -----END RSA PRIVATE KEY-----
        dest: "{{ chef_server_user_key_path }}"
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA6NF8iallvQVp22WDkTkyrtvp9eWW6A8YVr+kz4TjGYe7gHzI
          MOCK_KEY_CONTENT_FOR_ORG
          -----END RSA PRIVATE KEY-----
        dest: "{{ chef_server_org_key_path }}"
        mode: "0600"

    # Simulate Chef Server user list output
    - name: Create user list file
      ansible.builtin.copy:
        content: |
          pivotal
          {{ username }}
        dest: /tmp/molecule_test/chef-server-user-list.txt
        mode: "0644"

    # Simulate Chef Server org list output
    - name: Create org list file
      ansible.builtin.copy:
        content: |
          {{ chef_server_org_name }}
        dest: /tmp/molecule_test/chef-server-org-list.txt
        mode: "0644"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-gateway
          Status: running
          Service: automate-ui
          Status: running
          Service: chef-server
          Status: running
        dest: /tmp/molecule_test/chef-automate-status.txt
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          run: postgresql: (pid 12345) 300s; run: log: (pid 12346) 300s
          run: nginx: (pid 12347) 300s; run: log: (pid 12348) 300s
          run: bookshelf: (pid 12349) 300s; run: log: (pid 12350) 300s
        dest: /tmp/molecule_test/chef-server-status.txt
        mode: "0644"