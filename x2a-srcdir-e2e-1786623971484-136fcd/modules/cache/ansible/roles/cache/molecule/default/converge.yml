- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected Redis directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/run/redis
  - name: Simulate Redis package installation
    ansible.builtin.set_fact:
      redis_package_installed: true
  - name: Create Redis configuration file
    ansible.builtin.copy:
      content: '# Redis configuration file

        port 6379

        bind 127.0.0.1

        daemonize yes

        pidfile /var/run/redis/redis-server.pid

        logfile /var/log/redis/redis-server.log

        dir /var/lib/redis

        '
      dest: /tmp/molecule_test/etc/redis/redis.conf
      mode: '0644'
  - name: Create mock Redis log file
    ansible.builtin.copy:
      content: '# Redis server log file '
      dest: /tmp/molecule_test/var/log/redis/redis-server.log
      mode: '0644'
  - name: Create mock Redis PID file
    ansible.builtin.copy:
      content: '12345 '
      dest: /tmp/molecule_test/var/run/redis/redis-server.pid
      mode: '0644'
