---
- name: Install nginx package
  ansible.builtin.package:
    name: nginx
    state: present
- name: Ensure www-data user exists
  ansible.builtin.user:
    name: www-data
    system: true
    shell: /usr/sbin/nologin
    home: /var/www
    create_home: false
    state: present
- name: Ensure www-data group exists
  ansible.builtin.group:
    name: www-data
    system: true
    state: present
- name: Create server root directory
  ansible.builtin.file:
    path: /opt/server
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Deploy nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx
- name: Deploy nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx
- name: Enable and start nginx service
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
- name: Create document root directories for sites
  ansible.builtin.file:
    path: "{{ item_site['value']['document_root'] }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
- name: Deploy site index files
  ansible.builtin.copy:
    src: "{{ item_site['key'].split('.')[0] }}/index.html"
    dest: "{{ item_site['value']['document_root'] }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
