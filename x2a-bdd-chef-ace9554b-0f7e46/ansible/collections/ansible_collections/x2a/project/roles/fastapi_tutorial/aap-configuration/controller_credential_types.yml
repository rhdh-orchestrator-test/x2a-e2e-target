---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the PostgreSQL role and database used by the FastAPI application. The password is currently hardcoded in the Chef recipe and 
      must be rotated and stored securely during migration.
    kind: cloud
    inputs:
      fields:
        - id: username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database to which the FastAPI application connects.
        - id: password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL user fastapi; this value is currently hardcoded and must be rotated.
      required:
        - username
        - database_name
        - password
    injectors:
      extra_vars:
        username: !unsafe "{{ username }}"
        database_name: !unsafe "{{ database_name }}"
        password: !unsafe "{{ password }}"
