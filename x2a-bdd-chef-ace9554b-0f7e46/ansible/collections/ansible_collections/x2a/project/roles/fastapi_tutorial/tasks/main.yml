---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI system dependencies
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: /opt/fastapi-tutorial
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize FastAPI tutorial repository
  ansible.builtin.git:
    repo: https://github.com/dibanez/fastapi_tutorial.git
    dest: /opt/fastapi-tutorial
    version: main
    update: true

- name: Create Python virtual environment
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - /opt/fastapi-tutorial/venv
    creates: /opt/fastapi-tutorial/venv

- name: Install Python application dependencies
  ansible.builtin.pip:
    requirements: /opt/fastapi-tutorial/requirements.txt
    virtualenv: /opt/fastapi-tutorial/venv

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the FastAPI PostgreSQL role exists  # noqa: L039,R101,R108 - credentials are declared role arguments; command input is trusted credential data; PostgreSQL role inspection requires the postgres account
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = '{{ username }}'
  register: fastapi_tutorial_role_check
  changed_when: false
  failed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the FastAPI PostgreSQL database exists  # noqa: L039,R101,R108 - credentials are declared role arguments; command input is trusted credential data; PostgreSQL database inspection requires the postgres account
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'
  register: fastapi_tutorial_database_check
  changed_when: false
  failed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create FastAPI PostgreSQL role and database  # noqa: L039,R101,R108 - credentials and database name are declared role arguments and checks are registered above; command input is trusted credential data; PostgreSQL administration requires the postgres account
  ansible.builtin.shell:
    cmd: |
      psql -v ON_ERROR_STOP=1 -c "DO $$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '{{ username }}') THEN
        CREATE ROLE {{ username }} LOGIN PASSWORD '{{ password }}';
      ELSE
        ALTER ROLE {{ username }} WITH PASSWORD '{{ password }}';
      END IF;
      END $$;"
      psql -v ON_ERROR_STOP=1 -tc "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'" | grep -q 1 || \
        createdb -O '{{ username }}' '{{ database_name }}'
      psql -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ username }};"
    executable: /bin/bash
  changed_when: true
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"
  when:
    - fastapi_tutorial_role_check.rc != 0 or fastapi_tutorial_role_check.stdout | trim != '1' or fastapi_tutorial_database_check.rc != 0 or fastapi_tutorial_database_check.stdout | trim != '1'

- name: Write FastAPI environment configuration  # noqa: L039 - credential variables are declared required role arguments
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ username }}:{{ password }}@localhost/{{ database_name }}
    dest: /opt/fastapi-tutorial/.env
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/fastapi-tutorial
      Environment="PATH=/opt/fastapi-tutorial/venv/bin"
      ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before starting FastAPI
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
