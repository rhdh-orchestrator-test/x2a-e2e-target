---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials for the PostgreSQL role and database used by the FastAPI application. The password is currently hardcoded in the Chef recipe and 
      must be rotated and stored securely during migration.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      username: "{{ username }}"
      database_name: "{{ database_name }}"
      password: "{{ vault_password }}"
