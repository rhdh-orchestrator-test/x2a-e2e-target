---
argument_specs:
  main:
    short_description: Install and configure a standalone Redis cache
    description:
      - Configures Redis through the eloy.redis.redis Private Hub role.
      - Creates the Redis log directory used by the migrated cache cookbook.
    options:
      cache_redis_password:
        type: str
        required: false
        default: ""
        description: Redis authentication password; provide through Ansible Vault or an approved secret backend.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port on which Redis listens.
      cache_redis_version:
        type: str
        required: false
        default: "7.2"
        description: Redis version requested from the Private Hub role.
      cache_redis_install_method:
        type: str
        required: false
        default: package
        description: Installation method used by the Redis role.
      cache_redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Whether Redis RDB persistence is enabled.
      cache_redis_aof_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis AOF persistence is enabled.
      cache_redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis cluster mode is enabled.
      cache_redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis Sentinel mode is enabled.
      cache_redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis replication is enabled.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the Redis password.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Directory created for Redis logs.
