- name: Set system hostname
  ansible.builtin.hostname:
    name: '{{ chef_automate_hostname }}'
  become: true
- name: Set vm.max_map_count
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: '{{ chef_automate_vm_max_map_count }}'
    state: present
    reload: true
  become: true
- name: Set vm.dirty_expire_centisecs
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: '{{ chef_automate_vm_dirty_expire_centisecs }}'
    state: present
    reload: true
  become: true
- name: Download and extract Chef Automate CLI
  ansible.builtin.get_url:
    url: '{{ chef_automate_cli_url }}'
    dest: /tmp/chef-automate.zip
    mode: '0644'
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > chef-automate && chmod +x chef-automate
    stdin: '{{ lookup(''file'', ''/tmp/chef-automate.zip'') }}'
    chdir: /tmp
    creates: /tmp/chef-automate
  args:
    executable: /bin/bash
- name: Check if Chef Automate is already deployed
  ansible.builtin.stat:
    path: /var/opt/chef-automate
  register: chef_automate_dir
  become: true
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product automate --product infra-server --accept-terms-and-mlsa=true
    chdir: /tmp
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
  failed_when: deploy_result.rc != 0
  when: not chef_automate_dir.stat.exists
- name: Check if Chef user already exists
  ansible.builtin.command:
    cmd: chef-server-ctl user-list
  become: true
  register: chef_user_list
  changed_when: false
  failed_when: false
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_automate_username }}  {{ chef_automate_longusername }}  {{ chef_automate_useremail }}  "{{ password }}"  --filename
      {{ chef_automate_userfilename }}

      '
  become: true
  register: user_create_result
  changed_when: user_create_result.rc == 0
  failed_when: user_create_result.rc != 0
  when: chef_user_list.stdout is not defined or chef_automate_username not in chef_user_list.stdout
- name: Check if Chef organization already exists
  ansible.builtin.command:
    cmd: chef-server-ctl org-list
  become: true
  register: chef_org_list
  changed_when: false
  failed_when: false
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_automate_orgname }}  "{{ chef_automate_longorgname }}"  --association_user {{ chef_automate_username }}  --filename
      {{ chef_automate_orgfilename }}

      '
  become: true
  register: org_create_result
  changed_when: org_create_result.rc == 0
  failed_when: org_create_result.rc != 0
  when: chef_org_list.stdout is not defined or chef_automate_orgname not in chef_org_list.stdout
