---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    # Mock credential variables that would be provided by AAP
    username: jtonello
    password: molecule_test_password
    # Set deploy type for testing
    chef_automate_deploy_type: full
    # Override file paths for container-safe testing
    chef_automate_userfilename: /tmp/molecule_test/jtonello.pem
    chef_automate_orgfilename: /tmp/molecule_test/lab-validator.pem
  tasks:
    # Create directory structure to simulate the filesystem state
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/opscode

    # Simulate system configuration files
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    - name: Create vm.max_map_count file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_max_map_count }}"
        dest: /tmp/molecule_test/proc/sys/vm/max_map_count
        mode: "0644"

    - name: Create vm.dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_dirty_expire_centisecs }}"
        dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create mock Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Mock Chef Automate CLI'"
        dest: /tmp/molecule_test/chef-automate
        mode: "0755"

    # Simulate user PEM file
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAzMOKchwJ1s9xIyMbXJ3ePOIYwNj2YLEiJPKCwgcbaq1YIZ4q
          MOCK_KEY_CONTENT_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/jtonello.pem
        mode: "0600"

    # Simulate organization validator PEM file
    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAzMOKchwJ1s9xIyMbXJ3ePOIYwNj2YLEiJPKCwgcbaq1YIZ4q
          MOCK_ORG_VALIDATOR_KEY_CONTENT_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/lab-validator.pem
        mode: "0600"

    # Simulate Chef Automate status output
    - name: Create mock Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-postgresql      OK
          Service: automate-elasticsearch   OK
          Service: automate-es-gateway      OK
          Service: automate-ui              OK
          Service: automate-load-balancer   OK
          Service: automate-cs-nginx        OK
          Service: automate-cs-bookshelf    OK
          Service: automate-cs-oc-erchef    OK
        dest: /tmp/molecule_test/chef-automate-status
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create mock Chef Server status file
      ansible.builtin.copy:
        content: |
          run: bookshelf: running
          run: nginx: running
          run: oc_bifrost: running
          run: oc_id: running
          run: opscode-erchef: running
          run: opscode-expander: running
          run: opscode-solr4: running
          run: postgresql: running
          run: redis_lb: running
        dest: /tmp/molecule_test/chef-server-status
        mode: "0644"

    # Simulate user list output
    - name: Create mock user list file
      ansible.builtin.copy:
        content: "jtonello"
        dest: /tmp/molecule_test/chef-server-user-list
        mode: "0644"

    # Simulate organization list output
    - name: Create mock organization list file
      ansible.builtin.copy:
        content: "lab"
        dest: /tmp/molecule_test/chef-server-org-list
        mode: "0644"