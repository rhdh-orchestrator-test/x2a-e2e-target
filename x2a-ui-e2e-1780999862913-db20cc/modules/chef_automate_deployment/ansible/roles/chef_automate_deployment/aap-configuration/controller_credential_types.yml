---
controller_credential_types:
- name: Chef Automate Admin User
  description: Credential type for Chef Automate Admin User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Admin username for Chef Automate and Chef Infra Server
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the admin user in Chef Automate and Chef Infra Server
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
