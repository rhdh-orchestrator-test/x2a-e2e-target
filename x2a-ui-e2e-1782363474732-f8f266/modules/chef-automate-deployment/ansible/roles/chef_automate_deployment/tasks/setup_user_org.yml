---
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create  {{ chef_user_name }}  {{ chef_user_fullname | quote }}  {{ chef_user_email | quote }}  {{ chef_user_password | quote }}
      --filename {{ chef_user_key_file }}
  args:
    creates: "{{ chef_user_key_file }}"
  become: true
  when: chef_server_ctl_check.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create  {{ chef_org_name }}  {{ chef_org_fullname | quote }}  --association_user {{ chef_user_name }}  --filename {{
      chef_org_validator_file }}
  args:
    creates: "{{ chef_org_validator_file }}"
  become: true
  when: chef_server_ctl_check.rc == 0
