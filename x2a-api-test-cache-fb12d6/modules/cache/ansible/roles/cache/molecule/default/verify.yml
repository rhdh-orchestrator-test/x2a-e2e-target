---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    redis_password: redis_secure_password_123
  tasks:
    - name: Check service status
      ansible.builtin.service_facts:

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
        fail_msg: "Redis service is not running"

    - name: Assert memcached service is running
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - "ansible_facts.services['memcached.service']['state'] == 'running'"
        fail_msg: "Memcached service is not running"

    - name: Check Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_stat

    - name: Assert Redis configuration file exists
      ansible.builtin.assert:
        that:
          - redis_config_stat['stat']['exists']
          - redis_config_stat['stat']['size'] > 0
        fail_msg: "Redis configuration file not found"

    - name: Check Redis log directory
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory exists with correct permissions
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['exists']
          - redis_log_dir_stat['stat']['isdir']
          - redis_log_dir_stat['stat']['pw_name'] == 'redis'
          - redis_log_dir_stat['stat']['gr_name'] == 'redis'
          - redis_log_dir_stat['stat']['mode'] == '0755'
        fail_msg: "Redis log directory not found or incorrect permissions"

    - name: Read Redis configuration file
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis password is configured
      ansible.builtin.assert:
        that:
          - "'requirepass' in redis_config_content['content'] | b64decode"
        fail_msg: "Redis password not configured"

    - name: Assert problematic Redis configuration lines are removed
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in redis_config_content['content'] | b64decode"
          - "'replica-read-only' not in redis_config_content['content'] | b64decode"
          - "'repl-ping-replica-period' not in redis_config_content['content'] | b64decode"
          - "'client-output-buffer-limit' not in redis_config_content['content'] | b64decode"
          - "'replica-priority' not in redis_config_content['content'] | b64decode"
        fail_msg: "Problematic Redis configuration lines still present"

    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 10

    - name: Check memcached port is listening
      ansible.builtin.wait_for:
        port: 11211
        host: 127.0.0.1
        timeout: 10

- name: Verify Redis connectivity and authentication
  hosts: all
  gather_facts: false
  vars:
    redis_password: redis_secure_password_123
  tasks:
    - name: Test Redis ping without authentication (should fail)
      ansible.builtin.command:
        cmd: redis-cli -p 6379 ping
      register: redis_ping_no_auth
      failed_when: false
      changed_when: false

    - name: Assert Redis ping without auth fails
      ansible.builtin.assert:
        that:
          - redis_ping_no_auth['rc'] != 0
        fail_msg: "Redis should require authentication"

    - name: Test Redis ping with authentication
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a {{ redis_password }} ping
      register: redis_ping_with_auth
      changed_when: false

    - name: Assert Redis ping with auth succeeds
      ansible.builtin.assert:
        that:
          - redis_ping_with_auth['rc'] == 0
          - "'PONG' in redis_ping_with_auth['stdout']"
        fail_msg: "Redis authentication failed"

    - name: Test Redis basic operations
      ansible.builtin.command:
        cmd: "{{ item_redis_test }}"
      loop:
        - redis-cli -p 6379 -a {{ redis_password }} set test_key "test_value"
        - redis-cli -p 6379 -a {{ redis_password }} get test_key
        - redis-cli -p 6379 -a {{ redis_password }} del test_key
      loop_control:
        loop_var: item_redis_test
      register: redis_operations
      changed_when: false

    - name: Assert Redis operations work correctly
      ansible.builtin.assert:
        that:
          - redis_operations['results'][0]['rc'] == 0
          - redis_operations['results'][1]['rc'] == 0
          - "'test_value' in redis_operations['results'][1]['stdout']"
          - redis_operations['results'][2]['rc'] == 0
        fail_msg: "Redis basic operations failed"

- name: Verify memcached connectivity
  hosts: all
  gather_facts: false
  tasks:
    - name: Test memcached stats
      ansible.builtin.command:
        cmd: |
          echo "stats" | nc localhost 11211
      register: memcached_stats
      changed_when: false

    - name: Assert memcached responds to stats command
      ansible.builtin.assert:
        that:
          - memcached_stats['rc'] == 0
          - "'STAT' in memcached_stats['stdout']"
        fail_msg: "Memcached stats command failed"

    - name: Test memcached basic operations
      ansible.builtin.shell: |
        echo -e "set test_key 0 60 10\r\ntest_value\r\nquit" | nc localhost 11211
      register: memcached_set
      changed_when: false

    - name: Test memcached get operation
      ansible.builtin.shell: |
        echo -e "get test_key\r\nquit" | nc localhost 11211
      register: memcached_get
      changed_when: false

    - name: Test memcached delete operation
      ansible.builtin.shell: |
        echo -e "delete test_key\r\nquit" | nc localhost 11211
      register: memcached_delete
      changed_when: false

    - name: Assert memcached operations work correctly
      ansible.builtin.assert:
        that:
          - memcached_set['rc'] == 0
          - "'STORED' in memcached_set['stdout']"
          - memcached_get['rc'] == 0
          - "'test_value' in memcached_get['stdout']"
          - memcached_delete['rc'] == 0
        fail_msg: "Memcached basic operations failed"