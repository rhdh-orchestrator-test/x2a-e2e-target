---
cache_redis_port: 6379
cache_redis_bind: 127.0.0.1
cache_redis_timeout: 0
cache_redis_tcp_keepalive: 300
cache_redis_loglevel: notice
cache_redis_logfile: /var/log/redis/redis-server.log
cache_redis_databases: 16
cache_redis_save:
  - 900 1
  - 300 10
  - 60 10000
cache_redis_stop_writes_on_bgsave_error: true
cache_redis_rdbcompression: true
cache_redis_rdbchecksum: true
cache_redis_dbfilename: dump.rdb
cache_redis_dir: /var/lib/redis
cache_redis_maxmemory_policy: noeviction
cache_memcached_memory: 64
cache_memcached_port: 11211
cache_memcached_user: memcache
cache_memcached_listen: 127.0.0.1
cache_memcached_maxconn: 1024
