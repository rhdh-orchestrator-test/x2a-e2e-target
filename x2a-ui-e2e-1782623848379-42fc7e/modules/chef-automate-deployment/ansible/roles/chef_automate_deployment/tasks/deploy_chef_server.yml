---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Check if Chef Automate CLI exists
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/{{ chef_automate_cli_binary }}"
  register: automate_cli_stat
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate_linux_amd64.zip > {{ ansible_env.HOME }}/{{ chef_automate_cli_binary }}
  args:
    creates: "{{ ansible_env.HOME }}/{{ chef_automate_cli_binary }}"
  when: not automate_cli_stat.stat.exists
  changed_when: true
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ chef_automate_cli_binary }}"
    mode: "0755"
    state: file
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: ./{{ chef_automate_cli_binary }} deploy --product infra-server --accept-terms-and-mlsa=true
  args:
    chdir: "{{ ansible_env.HOME }}"
    creates: /etc/chef-automate/config.toml
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
  notify: restart chef server
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_user_name }}  {{ chef_user_fullname }}  {{ chef_user_email }}  "{{ user_password }}"  --filename {{ chef_user_key_file
      }}

      '
  args:
    chdir: "{{ ansible_env.HOME }}"
    creates: "{{ ansible_env.HOME }}/{{ chef_user_key_file }}"
  become: true
  no_log: true
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_org_name }}  "{{ chef_org_fullname }}"  --association_user {{ chef_user_name }}  --filename {{ chef_org_validator_key_file
      }}

      '
  args:
    chdir: "{{ ansible_env.HOME }}"
    creates: "{{ ansible_env.HOME }}/{{ chef_org_validator_key_file }}"
  become: true
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
