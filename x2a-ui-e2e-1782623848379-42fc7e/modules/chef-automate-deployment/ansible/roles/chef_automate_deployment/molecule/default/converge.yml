---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for Chef Automate and Chef Infra Server
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/opscode
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/opscode
        - /tmp/molecule_test/var/log/chef-automate
        - /tmp/molecule_test/var/log/opscode
        - /tmp/molecule_test/home/molecule

    # Create Chef Automate config file
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          [global]
            v1 = {}
          [global.v1]
            fqdn = "automate.chef.lab"
          [deployment]
            v1 = {}
          [deployment.v1]
            svc = []
          [deployment.v1.svc]
            products = ["automate", "infra-server"]
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"

    # Create Chef user key file
    - name: Create Chef user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          EXAMPLE_KEY_CONTENT_PLACEHOLDER
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/home/molecule/jtonello.pem
        mode: "0600"

    # Create Chef organization validator key file
    - name: Create Chef organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          EXAMPLE_VALIDATOR_KEY_CONTENT_PLACEHOLDER
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/home/molecule/lab-validator.pem
        mode: "0600"

    # Create Chef server configuration file
    - name: Create Chef server configuration file
      ansible.builtin.copy:
        content: |
          # Chef Server Configuration
          nginx['ssl_certificate'] = "/var/opt/opscode/nginx/ca/automate.chef.lab.crt"
          nginx['ssl_certificate_key'] = "/var/opt/opscode/nginx/ca/automate.chef.lab.key"
          nginx['server_name'] = "automate.chef.lab"
          bookshelf['vip'] = "automate.chef.lab"
          lb['api_fqdn'] = "automate.chef.lab"
          lb['web_ui_fqdn'] = "automate.chef.lab"
        dest: /tmp/molecule_test/etc/opscode/chef-server.rb
        mode: "0644"

    # Create Chef Automate CLI binary placeholder
    - name: Create Chef Automate CLI binary placeholder
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI mock binary"
          echo "This is a placeholder for the actual chef-automate binary"
        dest: /tmp/molecule_test/home/molecule/chef-automate
        mode: "0755"

    # Create mock sysctl configuration files
    - name: Create mock sysctl configuration files
      ansible.builtin.copy:
        content: |
          # Kernel parameters set by Chef Automate deployment
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Create mock user list output file
    - name: Create mock user list output file
      ansible.builtin.copy:
        content: |
          jtonello
        dest: /tmp/molecule_test/var/opt/opscode/user-list.txt
        mode: "0644"

    # Create mock organization list output file
    - name: Create mock organization list output file
      ansible.builtin.copy:
        content: |
          lab
        dest: /tmp/molecule_test/var/opt/opscode/org-list.txt
        mode: "0644"