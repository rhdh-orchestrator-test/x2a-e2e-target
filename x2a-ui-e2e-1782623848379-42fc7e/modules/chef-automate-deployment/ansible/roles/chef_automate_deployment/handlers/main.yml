---
- name: Restart Chef Automate
  ansible.builtin.command:
    cmd: sudo ./{{ chef_automate_cli_binary }} restart
  args:
    chdir: "{{ ansible_env.HOME }}"
  listen: restart chef automate
  register: restart_automate
  changed_when: restart_automate.rc == 0
  when: chef_automate_deploy is defined and chef_automate_deploy.rc == 0
- name: Restart Chef Infra Server
  ansible.builtin.command:
    cmd: sudo chef-server-ctl restart
  listen: restart chef server
  register: restart_server
  changed_when: restart_server.rc == 0
  when: (chef_automate_deploy is defined and chef_automate_deploy.rc == 0) or (chef_server_deploy is defined and chef_server_deploy.rc == 0)
