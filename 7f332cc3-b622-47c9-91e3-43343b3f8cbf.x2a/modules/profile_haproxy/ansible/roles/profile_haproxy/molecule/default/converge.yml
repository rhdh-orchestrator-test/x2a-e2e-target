---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected HAProxy directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/haproxy
        - /tmp/molecule_test/etc/haproxy/conf.d
        - /tmp/molecule_test/etc/haproxy/errors
        - /tmp/molecule_test/var/lib/haproxy
        - /tmp/molecule_test/etc/systemd/system/haproxy.service.d
        - /tmp/molecule_test/etc/logrotate.d
      loop_control:
        loop_var: item_dir

    - name: Create HAProxy main configuration file
      ansible.builtin.copy:
        content: |
          global
              log         127.0.0.1 local0 info
              chroot      /var/lib/haproxy
              stats socket /run/haproxy/admin.sock mode 660 level admin
              stats timeout 30s
              user        haproxy
              group       haproxy
              daemon
              maxconn     4000

          defaults
              mode                    http
              log                     global
              option                  httplog
              option                  dontlognull
              option                  http-server-close
              option                  forwardfor       except 127.0.0.0/8
              option                  redispatch
              retries                 3
              timeout http-request    10s
              timeout queue           1m
              timeout connect         5000ms
              timeout client          50000ms
              timeout server          50000ms
              timeout http-keep-alive 10s
              timeout check           10s
              maxconn                 3000

          frontend main
              bind *:80
              default_backend servers

          backend servers
              balance     roundrobin
              server      web1 127.0.0.1:8080 check

          listen stats
              bind *:9000
              stats enable
              stats uri /stats
              stats refresh 30s
              stats admin if TRUE
        dest: /tmp/molecule_test/etc/haproxy/haproxy.cfg
        mode: "0640"
        backup: true

    - name: Create HAProxy error pages
      ansible.builtin.copy:
        content: |
          HTTP/1.0 {{ item_error['code'] }} {{ item_error['message'] }}
          Cache-Control: no-cache
          Connection: close
          Content-Type: text/html

          <html><body><h1>{{ item_error['code'] }} {{ item_error['message'] }}</h1>
          <p>The server is temporarily unavailable. Please try again later.</p>
          </body></html>
        dest: "/tmp/molecule_test/etc/haproxy/errors/{{ item_error['code'] }}.http"
        mode: "0644"
        backup: true
      loop:
        - code: "503"
          message: "Service Unavailable"
        - code: "408"
          message: "Request Timeout"
      loop_control:
        loop_var: item_error

    - name: Create systemd service override
      ansible.builtin.copy:
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/sbin/haproxy -Ws -f /etc/haproxy/haproxy.cfg -f /etc/haproxy/conf.d/ -p /run/haproxy.pid -S /run/haproxy-master.sock
        dest: /tmp/molecule_test/etc/systemd/system/haproxy.service.d/override.conf
        mode: "0644"
        backup: true

    - name: Create HAProxy logrotate configuration
      ansible.builtin.copy:
        content: |
          /var/log/haproxy/*.log {
              daily
              rotate 14
              missingok
              notifempty
              compress
              delaycompress
              sharedscripts
              postrotate
                  /bin/kill -HUP $(cat /var/run/haproxy.pid 2>/dev/null) 2>/dev/null || true
              endscript
          }
        dest: /tmp/molecule_test/etc/logrotate.d/haproxy
        mode: "0644"
        backup: true

    - name: Create sample backend configuration
      ansible.builtin.copy:
        content: |
          backend webservers
              balance roundrobin
              option httpchk GET /health
              server web1 192.168.1.10:8080 check inter 10s
              server web2 192.168.1.11:8080 check inter 10s
        dest: /tmp/molecule_test/etc/haproxy/conf.d/webservers.cfg
        mode: "0640"
        backup: true

    - name: Create HAProxy runtime directory structure
      ansible.builtin.file:
        path: "{{ item_runtime_dir }}"
        state: directory
        mode: "0750"
      loop:
        - /tmp/molecule_test/var/lib/haproxy
        - /tmp/molecule_test/run/haproxy
      loop_control:
        loop_var: item_runtime_dir