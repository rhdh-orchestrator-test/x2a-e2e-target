---
- name: Install HAProxy package
  ansible.builtin.package:
    name: "{{ profile_haproxy_package_name }}"
    state: present
- name: Install OS-specific HAProxy packages
  ansible.builtin.package:
    name: "{{ profile_haproxy_extra_packages }}"
    state: present
  when: profile_haproxy_extra_packages | length > 0
- name: Create HAProxy group
  ansible.builtin.group:
    name: "{{ profile_haproxy_group }}"
    state: present
    system: true
- name: Create HAProxy user
  ansible.builtin.user:
    name: "{{ profile_haproxy_user }}"
    group: "{{ profile_haproxy_group }}"
    home: /var/lib/haproxy
    shell: /sbin/nologin
    system: true
    state: present
- name: Create HAProxy configuration directories
  ansible.builtin.file:
    path: "{{ item_dir }}"
    state: directory
    owner: root
    group: "{{ profile_haproxy_group }}"
    mode: "0755"
  loop:
    - "{{ profile_haproxy_config_dir }}"
    - "{{ profile_haproxy_config_dir }}/conf.d"
  loop_control:
    loop_var: item_dir
- name: Create HAProxy runtime directory
  ansible.builtin.file:
    path: /var/lib/haproxy
    state: directory
    owner: "{{ profile_haproxy_user }}"
    group: "{{ profile_haproxy_group }}"
    mode: "0750"
- name: Check if SELinux boolean is already set
  ansible.builtin.command:
    cmd: getsebool haproxy_connect_any
  register: selinux_boolean_check
  changed_when: false
  failed_when: false
  when: profile_haproxy_selinux_enabled | default(false)
- name: Configure SELinux for HAProxy
  ansible.builtin.command:
    cmd: setsebool -P haproxy_connect_any 1
  when:
    - profile_haproxy_selinux_enabled | default(false)
    - selinux_boolean_check.rc == 0
    - "'haproxy_connect_any --> off' in selinux_boolean_check.stdout"
