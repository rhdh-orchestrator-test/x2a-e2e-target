---
profile_haproxy_package_name: haproxy
profile_haproxy_config_dir: /etc/haproxy
profile_haproxy_config_file: /etc/haproxy/haproxy.cfg
profile_haproxy_service_name: haproxy
profile_haproxy_user: haproxy
profile_haproxy_group: haproxy
profile_haproxy_stats_enabled: true
profile_haproxy_stats_port: 9000
profile_haproxy_stats_uri: /stats
profile_haproxy_global_maxconn: 4000
profile_haproxy_client_timeout: 50000ms
profile_haproxy_server_timeout: 50000ms
profile_haproxy_connect_timeout: 5000ms
profile_haproxy_retries: 3
profile_haproxy_ssl_enabled: false
profile_haproxy_ssl_cert_path: /etc/ssl/certs
profile_haproxy_ssl_key_path: /etc/ssl/private
profile_haproxy_ssl_ciphers: ECDHE+AESGCM:ECDHE+AES256:ECDHE+AES128:!aNULL:!MD5:!DSS
profile_haproxy_ssl_min_version: TLSv1.2
profile_haproxy_log_server: 127.0.0.1
profile_haproxy_log_facility: local0
profile_haproxy_log_level: info
profile_haproxy_backends: {}
profile_haproxy_firewall_provider: "{{ 'firewalld' if ansible_os_family == 'RedHat' else 'ufw' }}"
profile_haproxy_extra_packages: "{{ ['haproxy-selinux'] if ansible_os_family == 'RedHat' else ['haproxy-doc'] }}"
profile_haproxy_selinux_enabled: "{{ true if ansible_os_family == 'RedHat' else false }}"
profile_haproxy_firewall_zone: public
profile_haproxy_discovery_enabled: false
profile_haproxy_stick_table_enabled: false
