---
controller_credential_types:
- name: HAProxy Statistics Authentication
  description: Authentication credentials for HAProxy statistics dashboard access
  kind: cloud
  inputs:
    fields:
    - id: stats_user
      type: string
      label: Statistics Username
      help_text: Username for HAProxy statistics dashboard authentication
    - id: stats_password
      type: string
      label: Statistics Password
      secret: true
      help_text: Password for HAProxy statistics dashboard authentication
    required:
    - stats_user
    - stats_password
  injectors:
    extra_vars:
      stats_user: !unsafe '{{ stats_user }}'
      stats_password: !unsafe '{{ stats_password }}'
