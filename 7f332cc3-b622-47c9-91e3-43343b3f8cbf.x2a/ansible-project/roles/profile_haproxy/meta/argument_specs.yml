---
argument_specs:
  main:
    short_description: Install and configure HAProxy load balancer with SSL termination and service discovery
    description:
      - Deploys HAProxy load balancer with comprehensive configuration including SSL termination, statistics interface, dynamic service discovery, and
        OS-specific firewall management.
      - Supports both static backend configuration through variables and dynamic discovery of application servers from Ansible inventory.
      - Provides cross-platform compatibility with firewalld (RedHat) and ufw (Debian) firewall providers.
    options:
      profile_haproxy_package_name:
        type: str
        required: false
        default: haproxy
        description: Name of the HAProxy package to install.
      profile_haproxy_config_dir:
        type: str
        required: false
        default: /etc/haproxy
        description: Directory path for HAProxy configuration files.
      profile_haproxy_config_file:
        type: str
        required: false
        default: /etc/haproxy/haproxy.cfg
        description: Full path to the main HAProxy configuration file.
      profile_haproxy_service_name:
        type: str
        required: false
        default: haproxy
        description: Name of the HAProxy systemd service.
      profile_haproxy_user:
        type: str
        required: false
        default: haproxy
        description: System user account for running HAProxy service.
      profile_haproxy_group:
        type: str
        required: false
        default: haproxy
        description: System group for HAProxy service and file ownership.
      profile_haproxy_stats_enabled:
        type: bool
        required: false
        default: true
        description: Whether to enable HAProxy statistics interface.
      profile_haproxy_stats_port:
        type: int
        required: false
        default: 9000
        description: TCP port for HAProxy statistics interface.
      profile_haproxy_stats_uri:
        type: str
        required: false
        default: /stats
        description: URI path for accessing HAProxy statistics interface.
      profile_haproxy_global_maxconn:
        type: int
        required: false
        default: 4000
        description: Maximum number of concurrent connections in HAProxy global section.
      profile_haproxy_client_timeout:
        type: str
        required: false
        default: 50000ms
        description: Client connection timeout value.
      profile_haproxy_server_timeout:
        type: str
        required: false
        default: 50000ms
        description: Server connection timeout value.
      profile_haproxy_connect_timeout:
        type: str
        required: false
        default: 5000ms
        description: Connection establishment timeout value.
      profile_haproxy_retries:
        type: int
        required: false
        default: 3
        description: Number of connection retry attempts.
      profile_haproxy_ssl_enabled:
        type: bool
        required: false
        default: false
        description: Whether to enable SSL/TLS termination in HAProxy.
      profile_haproxy_ssl_cert_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory path for SSL certificate files.
      profile_haproxy_ssl_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory path for SSL private key files.
      profile_haproxy_ssl_ciphers:
        type: str
        required: false
        default: ECDHE+AESGCM:ECDHE+AES256:ECDHE+AES128:!aNULL:!MD5:!DSS
        description: SSL cipher suite configuration for secure connections.
      profile_haproxy_ssl_min_version:
        type: str
        required: false
        default: TLSv1.2
        description: Minimum SSL/TLS protocol version to accept.
      profile_haproxy_log_server:
        type: str
        required: false
        default: 127.0.0.1
        description: Syslog server address for HAProxy logging.
      profile_haproxy_log_facility:
        type: str
        required: false
        default: local0
        description: Syslog facility for HAProxy log messages.
      profile_haproxy_log_level:
        type: str
        required: false
        default: info
        description: Log level for HAProxy messages (debug, info, warning, error).
      profile_haproxy_backends:
        type: dict
        required: false
        default: {}
        description: Dictionary of backend server configurations. Each key is a backend name, and the value contains server definitions, health checks, and load
          balancing options.
      profile_haproxy_firewall_provider:
        type: str
        required: false
        default: firewalld
        description: Firewall management provider (firewalld, ufw, or none).
      profile_haproxy_extra_packages:
        type: list
        elements: str
        required: false
        default: []
        description: Additional OS-specific packages to install (e.g., haproxy-selinux on RedHat).
      profile_haproxy_selinux_enabled:
        type: bool
        required: false
        default: false
        description: Whether to configure SELinux policies for HAProxy.
      profile_haproxy_firewall_zone:
        type: str
        required: false
        default: public
        description: Firewall zone for opening HAProxy ports (firewalld only).
      profile_haproxy_discovery_enabled:
        type: bool
        required: false
        default: false
        description: Whether to enable dynamic service discovery from Ansible inventory.
      profile_haproxy_stick_table_enabled:
        type: bool
        required: false
        default: false
        description: Whether to enable HAProxy stick tables for session persistence.
      profile_haproxy_include_base:
        type: bool
        required: false
        default: true
        description: Whether to include base profile tasks when using role composition.
      profile_haproxy_environment_name:
        type: str
        required: false
        description: Environment name for configuration context (auto-detected from facts if not provided).
      stats_user:
        type: str
        required: true
        description: Username for HAProxy statistics interface authentication (injected by AAP credential type).
      stats_password:
        type: str
        required: true
        description: Password for HAProxy statistics interface authentication (injected by AAP credential type).
