---
automate_hostname: automate.chef.lab
automate_vm_max_map_count: 262144
automate_vm_dirty_expire_centisecs: 20000
automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
automate_cli_path: ./chef-automate
automate_products:
  - automate
  - infra-server
automate_accept_terms: true
chef_username: "{{ username | default('jtonello') }}"
chef_full_name: "{{ full_name | default('John Tonello') }}"
chef_email: "{{ email | default('jtonello@chef.lab') }}"
chef_password: "{{ password | default('password') }}"
chef_org_name: lab
chef_org_full_name: Chef Lab
chef_user_key_file: "{{ chef_username }}.pem"
chef_org_validator_file: "{{ chef_org_name }}-validator.pem"
