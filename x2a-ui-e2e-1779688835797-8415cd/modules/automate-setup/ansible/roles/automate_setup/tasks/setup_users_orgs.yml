---
- name: Check if chef-server-ctl is available
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl
  become: true
- name: Ensure directory for key files exists
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_key_file }}"
    - "{{ chef_org_validator_file }}"
  when: chef_server_ctl.stat.exists
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_username }} {{ chef_full_name }} {{ chef_email }} "{{ chef_password }}" --filename {{ chef_user_key_file }}

      '
  args:
    creates: "{{ chef_user_key_file }}"
  become: true
  no_log: true
  when: chef_server_ctl.stat.exists
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_full_name }}" --association_user {{ chef_username }} --filename {{ chef_org_validator_file }}

      '
  args:
    creates: "{{ chef_org_validator_file }}"
  become: true
  when: chef_server_ctl.stat.exists
