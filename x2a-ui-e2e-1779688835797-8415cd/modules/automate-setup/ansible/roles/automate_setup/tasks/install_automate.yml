---
- name: Ensure gzip package is installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ automate_cli_url }}"
    dest: "{{ automate_cli_path }}"
    mode: "0755"
    force: true
  register: automate_cli_download
- name: Extract Chef Automate CLI (if compressed)
  ansible.builtin.shell:
    cmd: gunzip - > {{ automate_cli_path }} && chmod +x {{ automate_cli_path }}
  args:
    executable: /bin/bash
    creates: "{{ automate_cli_path }}"
  when: automate_cli_download.changed
  register: automate_cli_extract
  failed_when: automate_cli_extract.rc != 0 and not automate_cli_extract.rc == 124
  changed_when: automate_cli_extract.rc == 0
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ automate_cli_path }} deploy {% for product in automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{ automate_accept_terms
      | lower }} "
  args:
    creates: /hab
  become: true
  register: automate_deploy
  failed_when: automate_deploy.rc != 0 and not automate_deploy.rc == 124
