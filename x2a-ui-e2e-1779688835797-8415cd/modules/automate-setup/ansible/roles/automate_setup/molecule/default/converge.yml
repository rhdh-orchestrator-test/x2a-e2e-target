---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/usr/bin

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ automate_hostname | default('automate.chef.lab') }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: "{{ item.key }} = {{ item.value }}"
        dest: "/tmp/molecule_test/etc/{{ item.key | replace('.', '_') }}"
        mode: "0644"
      loop:
        - key: vm.max_map_count
          value: "{{ automate_vm_max_map_count | default(262144) }}"
        - key: vm.dirty_expire_centisecs
          value: "{{ automate_vm_dirty_expire_centisecs | default(20000) }}"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI Mock'\n"
        dest: "/tmp/molecule_test/usr/bin/chef-automate"
        mode: "0755"

    # Simulate Chef Server CLI
    - name: Create Chef Server CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Server CLI Mock'\n"
        dest: "/tmp/molecule_test/usr/bin/chef-server-ctl"
        mode: "0755"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY CONTENT\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/{{ chef_user_key_file | default('jtonello.pem') }}"
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORGANIZATION VALIDATOR KEY CONTENT\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/{{ chef_org_validator_file | default('lab-validator.pem') }}"
        mode: "0600"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-postgresql       Status: running
          Service: automate-elasticsearch    Status: running
          Service: automate-es-gateway       Status: running
          Service: automate-ui               Status: running
          Service: automate-load-balancer    Status: running
          Service: automate-cs-nginx         Status: running
          Service: automate-cs-bookshelf     Status: running
          Service: automate-cs-oc-erchef     Status: running
        dest: "/tmp/molecule_test/hab/chef-automate-status"
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          run: bookshelf: (pid 12345) 99s; run: log: (pid 12346) 99s
          run: nginx: (pid 12347) 99s; run: log: (pid 12348) 99s
          run: oc_bifrost: (pid 12349) 99s; run: log: (pid 12350) 99s
          run: oc_id: (pid 12351) 99s; run: log: (pid 12352) 99s
          run: opscode-erchef: (pid 12353) 99s; run: log: (pid 12354) 99s
          run: postgresql: (pid 12355) 99s; run: log: (pid 12356) 99s
          run: redis_lb: (pid 12357) 99s; run: log: (pid 12358) 99s
        dest: "/tmp/molecule_test/hab/chef-server-status"
        mode: "0644"

    # Simulate user list output
    - name: Create user list file
      ansible.builtin.copy:
        content: "{{ chef_username | default('jtonello') }}\n"
        dest: "/tmp/molecule_test/hab/chef-user-list"
        mode: "0644"

    # Simulate organization list output
    - name: Create organization list file
      ansible.builtin.copy:
        content: "{{ chef_org_name | default('lab') }}\n"
        dest: "/tmp/molecule_test/hab/chef-org-list"
        mode: "0644"