- name: Verify
  hosts: all
  gather_facts: false
  vars:
    automate_hostname: automate.chef.lab
    chef_username: jtonello
    chef_org_name: lab
    chef_user_key_file: jtonello.pem
    chef_org_validator_file: lab-validator.pem
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == automate_hostname
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check vm.max_map_count file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/vm_max_map_count
    register: max_map_count_file
  - name: Assert vm.max_map_count file exists
    ansible.builtin.assert:
      that:
      - max_map_count_file.stat.exists
      - max_map_count_file.stat.isreg
      fail_msg: vm.max_map_count file not found
      success_msg: vm.max_map_count file exists
  - name: Get vm.max_map_count content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/vm_max_map_count
    register: max_map_count_content
    when: max_map_count_file.stat.exists
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - (max_map_count_content.content | b64decode | trim) == "vm.max_map_count = 262144"
      fail_msg: vm.max_map_count not set correctly
      success_msg: vm.max_map_count set correctly
    when: max_map_count_file.stat.exists
  - name: Check vm.dirty_expire_centisecs file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/vm_dirty_expire_centisecs
    register: dirty_expire_file
  - name: Assert vm.dirty_expire_centisecs file exists
    ansible.builtin.assert:
      that:
      - dirty_expire_file.stat.exists
      - dirty_expire_file.stat.isreg
      fail_msg: vm.dirty_expire_centisecs file not found
      success_msg: vm.dirty_expire_centisecs file exists
  - name: Get vm.dirty_expire_centisecs content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/vm_dirty_expire_centisecs
    register: dirty_expire_content
    when: dirty_expire_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - (dirty_expire_content.content | b64decode | trim) == "vm.dirty_expire_centisecs = 20000"
      fail_msg: vm.dirty_expire_centisecs not set correctly
      success_msg: vm.dirty_expire_centisecs set correctly
    when: dirty_expire_file.stat.exists
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/chef-automate
    register: automate_cli_file
  - name: Assert Chef Automate CLI file exists
    ansible.builtin.assert:
      that:
      - automate_cli_file.stat.exists
      - automate_cli_file.stat.isreg
      - automate_cli_file.stat.executable
      fail_msg: Chef Automate CLI file not found or not executable
      success_msg: Chef Automate CLI file exists and is executable
  - name: Check Chef Server CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/chef-server-ctl
    register: server_cli_file
  - name: Assert Chef Server CLI file exists
    ansible.builtin.assert:
      that:
      - server_cli_file.stat.exists
      - server_cli_file.stat.isreg
      - server_cli_file.stat.executable
      fail_msg: Chef Server CLI file not found or not executable
      success_msg: Chef Server CLI file exists and is executable
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ chef_user_key_file }}
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.isreg
      fail_msg: User key file not found
      success_msg: User key file exists
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ chef_org_validator_file }}
    register: org_validator_file
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_validator_file.stat.exists
      - org_validator_file.stat.isreg
      fail_msg: Organization validator key file not found
      success_msg: Organization validator key file exists
  - name: Check Chef Automate status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-automate-status
    register: automate_status_file
  - name: Assert Chef Automate status file exists
    ansible.builtin.assert:
      that:
      - automate_status_file.stat.exists
      - automate_status_file.stat.isreg
      fail_msg: Chef Automate status file not found
      success_msg: Chef Automate status file exists
  - name: Check Chef Server status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-server-status
    register: server_status_file
  - name: Assert Chef Server status file exists
    ansible.builtin.assert:
      that:
      - server_status_file.stat.exists
      - server_status_file.stat.isreg
      fail_msg: Chef Server status file not found
      success_msg: Chef Server status file exists
  - name: Check Chef Automate service status
    ansible.builtin.command:
      cmd: chef-automate status
    register: automate_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate services are running
    ansible.builtin.assert:
      that:
      - '''Status: running'' in automate_status.stdout'
      fail_msg: Chef Automate services are not running
      success_msg: Chef Automate services are running
    tags: molecule-notest
  - name: Check Chef Server service status
    ansible.builtin.command:
      cmd: chef-server-ctl status
    register: server_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Server services are running
    ansible.builtin.assert:
      that:
      - '''run:'' in server_status.stdout'
      fail_msg: Chef Server services are not running
      success_msg: Chef Server services are running
    tags: molecule-notest
  - name: Check Chef user list
    ansible.builtin.command:
      cmd: chef-server-ctl user-list
    register: user_list
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef user exists
    ansible.builtin.assert:
      that:
      - chef_username in user_list.stdout
      fail_msg: Chef user not found
      success_msg: Chef user exists
    tags: molecule-notest
  - name: Check Chef organization list
    ansible.builtin.command:
      cmd: chef-server-ctl org-list
    register: org_list
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef organization exists
    ansible.builtin.assert:
      that:
      - chef_org_name in org_list.stdout
      fail_msg: Chef organization not found
      success_msg: Chef organization exists
    tags: molecule-notest
  - name: Check HTTPS port
    ansible.builtin.wait_for:
      port: 443
      timeout: 5
    register: https_port
    ignore_errors: true
    tags: molecule-notest
  - name: Assert HTTPS port is open
    ansible.builtin.assert:
      that:
      - https_port is succeeded
      fail_msg: HTTPS port is not open
      success_msg: HTTPS port is open
    tags: molecule-notest
