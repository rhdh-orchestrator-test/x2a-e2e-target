---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file
      
    - name: Check kernel parameters
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/settings
      register: sysctl_file
      
    - name: Verify kernel parameters content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/settings
      register: sysctl_content
      when: sysctl_file.stat.exists
      
    - name: Assert kernel parameters are set correctly
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - "'vm.max_map_count = 262144' in (sysctl_content['content'] | b64decode)"
          - "'vm.dirty_expire_centisecs = 20000' in (sysctl_content['content'] | b64decode)"
        fail_msg: "Kernel parameters not set correctly"
        success_msg: "Kernel parameters set correctly"
      when: sysctl_file.stat.exists
      
    # Chef Automate CLI installation check
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: cli_file
      
    - name: Assert Chef Automate CLI is executable
      ansible.builtin.assert:
        that:
          - cli_file.stat.exists
          - cli_file.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI installed correctly"
      when: cli_file.stat.exists
      
    # Chef Automate configuration check
    - name: Check Chef Automate config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: automate_config
      
    - name: Verify Chef Automate config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-automate/config.toml
      register: automate_config_content
      when: automate_config.stat.exists
      
    - name: Assert Chef Automate config is correct
      ansible.builtin.assert:
        that:
          - automate_config.stat.exists
          - "'automate = \"true\"' in (automate_config_content['content'] | b64decode)"
          - "'infra_server = \"true\"' in (automate_config_content['content'] | b64decode)"
        fail_msg: "Chef Automate config not found or incorrect"
        success_msg: "Chef Automate config is correct"
      when: automate_config.stat.exists
      
    # Chef Infra Server configuration check
    - name: Check Chef Infra Server config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/opscode/chef-server.rb
      register: infra_config
      
    - name: Verify Chef Infra Server config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/opscode/chef-server.rb
      register: infra_config_content
      when: infra_config.stat.exists
      
    - name: Assert Chef Infra Server config is correct
      ansible.builtin.assert:
        that:
          - infra_config.stat.exists
          - "'api_fqdn' in (infra_config_content['content'] | b64decode)"
        fail_msg: "Chef Infra Server config not found or incorrect"
        success_msg: "Chef Infra Server config is correct"
      when: infra_config.stat.exists
      
    # User and organization PEM files check
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_pem
      
    - name: Assert user PEM file is correct
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.size > 0
        fail_msg: "User PEM file not found or empty"
        success_msg: "User PEM file exists"
      when: user_pem.stat.exists
      
    - name: Check organization validator PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_pem
      
    - name: Assert organization validator PEM file is correct
      ansible.builtin.assert:
        that:
          - org_pem.stat.exists
          - org_pem.stat.size > 0
        fail_msg: "Organization validator PEM file not found or empty"
        success_msg: "Organization validator PEM file exists"
      when: org_pem.stat.exists
      
    # Service status checks (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/chef-automate/service-status
      register: automate_service
      
    - name: Verify Chef Automate service status content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/log/chef-automate/service-status
      register: automate_service_content
      when: automate_service.stat.exists
      
    - name: Assert Chef Automate services are active
      ansible.builtin.assert:
        that:
          - automate_service.stat.exists
          - "'active' in (automate_service_content['content'] | b64decode)"
        fail_msg: "Chef Automate services not active"
        success_msg: "Chef Automate services are active"
      when: automate_service.stat.exists
      
    # Real service checks (tagged to be skipped in container)
    - name: Check Chef Automate service status (real)
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest
      
    - name: Check Chef Infra Server service status (real)
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest
      
    - name: Check Chef Automate API health (real)
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
      register: automate_health
      failed_when: false
      tags: molecule-notest
      
    - name: Check Chef Infra Server API health (real)
      ansible.builtin.uri:
        url: https://localhost/organizations
        validate_certs: false
      register: server_health
      failed_when: false
      tags: molecule-notest
      
    - name: Check network ports (real)
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest