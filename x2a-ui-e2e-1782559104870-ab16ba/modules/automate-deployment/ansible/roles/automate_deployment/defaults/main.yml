---
automate_hostname: automate.chef.lab
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: ./chef-automate
chef_org_name: lab
chef_org_long_name: Chef Lab
user_pem_filename: "{{ username }}.pem"
org_validator_pem_filename: "{{ chef_org_name }}-validator.pem"
kernel_params:
  vm.max_map_count: 262144
  vm.dirty_expire_centisecs: 20000
deploy_automate: true
accept_terms_and_mlsa: true
