---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ automate_hostname }}"
  become: true
- name: Configure kernel parameters for optimal performance
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ kernel_params | dict2items }}"
  become: true
