---
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: sudo ./chef-automate deploy {% for product in chef_products.infra_only %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{
      accept_terms_and_mlsa | lower }}
  args:
    creates: /etc/opscode/chef-server.rb
  register: deploy_result
  changed_when: deploy_result.rc == 0
  failed_when: deploy_result.rc != 0
  become: true
- name: Wait for Chef Infra Server services to be fully available
  ansible.builtin.wait_for:
    host: localhost
    port: 443
    state: started
    delay: 10
    timeout: 300
  when: deploy_result.changed
  tags: molecule-notest
