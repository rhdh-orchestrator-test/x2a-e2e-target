---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Configure system settings
  ansible.builtin.include_tasks: system_configuration.yml
- name: Install Chef Automate CLI
  ansible.builtin.include_tasks: install_cli.yml
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.include_tasks: deploy_automate.yml
  when: deploy_automate | bool
- name: Deploy Chef Infra Server only
  ansible.builtin.include_tasks: deploy_chef_server.yml
  when: not deploy_automate | bool
- name: Setup Chef users and organizations
  ansible.builtin.include_tasks: setup_users.yml
