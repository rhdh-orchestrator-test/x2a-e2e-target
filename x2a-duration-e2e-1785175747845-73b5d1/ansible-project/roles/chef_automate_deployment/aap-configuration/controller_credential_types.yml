---
controller_credential_types:
- name: HashiCorp Vault User Password
  description: Credential type for HashiCorp Vault User Password
  kind: cloud
  inputs:
    fields:
    - id: user_password
      type: string
      label: User Password
      secret: true
      help_text: Password used for creating the initial Chef user account
    - id: username
      type: string
      label: Username
      help_text: Username for the Chef user account
    - id: organization
      type: string
      label: Organization
      help_text: Organization name for Chef Infra Server
    required:
    - user_password
    - username
    - organization
  injectors:
    extra_vars:
      user_password: !unsafe '{{ user_password }}'
      username: !unsafe '{{ username }}'
      organization: !unsafe '{{ organization }}'
