---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # SSH Security Test Verification
    - name: Check if SSH config file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/ssh/sshd_config"
      register: ssh_config_file

    - name: Assert SSH config file exists
      ansible.builtin.assert:
        that:
          - ssh_config_file.stat.exists
          - ssh_config_file.stat.isreg
        fail_msg: "SSH config file not found"
        success_msg: "SSH config file exists"

    - name: Get SSH config file content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/ssh/sshd_config"
      register: ssh_config_content
      when: ssh_config_file.stat.exists

    - name: Check PermitRootLogin setting in sshd_config
      ansible.builtin.shell:
        cmd: set -o pipefail && grep -i '^PermitRootLogin' /tmp/molecule_test/etc/ssh/sshd_config | awk '{print $2}'
        executable: /bin/bash
      register: permit_root_login
      changed_when: false
      failed_when: false
      check_mode: false
      when: ssh_config_file.stat.exists

    - name: Assert PermitRootLogin is not set to 'yes'
      ansible.builtin.assert:
        that:
          - permit_root_login.stdout != 'yes'
        fail_msg: "SSH root login is enabled. PermitRootLogin should not be set to 'yes'"
        success_msg: "SSH root login is properly disabled"
      when: ssh_config_file.stat.exists and permit_root_login.stdout is defined

    # HTTPS Website Test Verification
    - name: Check if HTML file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/var/www/html/index.html"
      register: html_file

    - name: Assert HTML file exists
      ansible.builtin.assert:
        that:
          - html_file.stat.exists
          - html_file.stat.isreg
        fail_msg: "HTML file not found"
        success_msg: "HTML file exists"

    - name: Get HTML file content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/var/www/html/index.html"
      register: html_content
      when: html_file.stat.exists

    - name: Assert HTML content contains expected text
      ansible.builtin.assert:
        that:
          - "'Hello, world!' in (html_content.content | b64decode)"
        fail_msg: "HTML content does not contain expected text 'Hello, world!'"
        success_msg: "HTML content contains expected text"
      when: html_file.stat.exists and html_content.content is defined

    - name: Check if SSL configuration file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/ssl/openssl.cnf"
      register: ssl_config_file

    - name: Assert SSL configuration file exists
      ansible.builtin.assert:
        that:
          - ssl_config_file.stat.exists
          - ssl_config_file.stat.isreg
        fail_msg: "SSL configuration file not found"
        success_msg: "SSL configuration file exists"

    - name: Get SSL configuration file content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/ssl/openssl.cnf"
      register: ssl_config_content
      when: ssl_config_file.stat.exists

    - name: Assert TLS 1.2 is enabled in SSL configuration
      ansible.builtin.assert:
        that:
          - "'TLSv1.2' in (ssl_config_content.content | b64decode)"
        fail_msg: "TLS 1.2 is not enabled in SSL configuration"
        success_msg: "TLS 1.2 is enabled in SSL configuration"
      when: ssl_config_file.stat.exists and ssl_config_content.content is defined

    - name: Assert SSL3 is not enabled in SSL configuration
      ansible.builtin.assert:
        that:
          - "'SSLv3' not in (ssl_config_content.content | b64decode)"
        fail_msg: "SSL3 is enabled in SSL configuration"
        success_msg: "SSL3 is not enabled in SSL configuration"
      when: ssl_config_file.stat.exists and ssl_config_content.content is defined

    # The following tests can't run in a container environment
    # Check if port 443 is listening
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    # Verify HTTPS response
    - name: Verify HTTPS response status is 200
      ansible.builtin.uri:
        url: https://localhost/
        validate_certs: false
        return_content: true
      register: https_response
      failed_when: false
      tags: molecule-notest

    # Check SSL/TLS protocols
    - name: Check if SSL3 is disabled
      ansible.builtin.shell:
        cmd: openssl s_client -connect localhost:443 -ssl3 < /dev/null 2>&1
      register: ssl3_check
      failed_when: false
      changed_when: false
      check_mode: false
      tags: molecule-notest

    - name: Check if TLS 1.2 is enabled
      ansible.builtin.shell:
        cmd: openssl s_client -connect localhost:443 -tls1_2 < /dev/null 2>&1
      register: tls12_check
      failed_when: false
      changed_when: false
      check_mode: false
      tags: molecule-notest