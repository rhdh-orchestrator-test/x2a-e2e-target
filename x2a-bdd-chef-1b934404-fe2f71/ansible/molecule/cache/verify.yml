---
# Unsupported: approved-secret-store Redis authentication; platform-specific configuration/log files,
# journal output, Memcached thread value, and UDP listening lack portable native expectations.
- name: Verify cache services
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify Memcached is enabled and running
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts['services']"
          - ansible_facts['services']['memcached.service']['state'] == 'running'
          - ansible_facts['services']['memcached.service']['status'] == 'enabled'
        fail_msg: Memcached is not enabled and running.

    - name: Confirm the Memcached process is present
      ansible.builtin.command:
        argv: [pgrep, -a, memcached]
      register: item_memcached_process
      changed_when: false
      failed_when: false

    - name: Verify the Memcached process is present
      ansible.builtin.assert:
        that: item_memcached_process['rc'] == 0
        fail_msg: The Memcached process is not present.

    - name: Confirm TCP port 11211 is listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 11211
        state: started
        timeout: 5

    - name: Confirm UDP port 11211 is listening
      ansible.builtin.command:
        argv: [ss, -lunp]
      register: item_memcached_udp_socket
      changed_when: false
      failed_when: false

    - name: Verify UDP port 11211 is listening
      ansible.builtin.assert:
        that:
          - item_memcached_udp_socket['rc'] == 0
          - item_memcached_udp_socket['stdout'] is search(':(11211)\\b')
        fail_msg: UDP port 11211 is not listening.

    - name: Verify Memcached responds to the version request
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - "printf 'version\\r\\nquit\\r\\n' | nc -w 2 127.0.0.1 11211"
      register: item_memcached_version
      changed_when: false
      failed_when: false

    - name: Assert Memcached returned a version
      ansible.builtin.assert:
        that:
          - item_memcached_version['rc'] == 0
          - item_memcached_version['stdout'] is search('VERSION')
        fail_msg: Memcached did not respond to the version request.

    - name: Verify Memcached responds to the stats request
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - "printf 'stats\\r\\nquit\\r\\n' | nc -w 2 127.0.0.1 11211"
      register: item_memcached_stats
      changed_when: false
      failed_when: false

    - name: Assert Memcached returned statistics
      ansible.builtin.assert:
        that:
          - item_memcached_stats['rc'] == 0
          - item_memcached_stats['stdout'] is search('STAT')
        fail_msg: Memcached did not return statistics.

    - name: Identify Redis service units
      ansible.builtin.set_fact:
        item_redis_services: >-
          {{ ansible_facts['services'] | dict2items
             | selectattr('key', 'search', '(?i)redis.*(6379)?|6379.*redis') | list }}

    - name: Verify a Redis service for port 6379 is enabled and running
      ansible.builtin.assert:
        that:
          - item_redis_services | length > 0
          - "item_redis_services | selectattr('value', 'equalto', {'state': 'running', 'status': 'enabled'}) | list | length > 0"
        fail_msg: No enabled and running Redis service for port 6379 was found.

    - name: Confirm a Redis process is present
      ansible.builtin.command:
        argv: [pgrep, -a, redis]
      register: item_redis_process
      changed_when: false
      failed_when: false

    - name: Verify the Redis process is present
      ansible.builtin.assert:
        that: item_redis_process['rc'] == 0
        fail_msg: The Redis process is not present.

    - name: Confirm TCP port 6379 is listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 5

    - name: Verify the Redis PID directory exists
      ansible.builtin.stat:
        path: /run/redis
      register: item_redis_pid_directory

    - name: Assert the Redis PID directory exists
      ansible.builtin.assert:
        that:
          - item_redis_pid_directory['stat']['exists']
          - item_redis_pid_directory['stat']['isdir']
        fail_msg: The Redis PID directory does not exist.

    - name: Verify Redis log directory ownership and mode
      ansible.builtin.stat:
        path: /var/log/redis
      register: item_redis_log_directory

    - name: Assert Redis log directory ownership and mode
      ansible.builtin.assert:
        that:
          - item_redis_log_directory['stat']['exists']
          - item_redis_log_directory['stat']['isdir']
          - item_redis_log_directory['stat']['pw_name'] == 'redis'
          - item_redis_log_directory['stat']['gr_name'] == 'redis'
          - item_redis_log_directory['stat']['mode'] == '0755'
        fail_msg: The Redis log directory does not have the expected ownership and mode.

    - name: Read the Redis 6379 configuration
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: item_redis_configuration

    - name: Verify removed Redis directives are absent
      ansible.builtin.assert:
        that:
          - "(item_redis_configuration['content'] | b64decode) is not search('(?m)^replica-serve-stale-data')"
          - "(item_redis_configuration['content'] | b64decode) is not search('(?m)^replica-read-only')"
          - "(item_redis_configuration['content'] | b64decode) is not search('(?m)^repl-ping-replica-period')"
          - "(item_redis_configuration['content'] | b64decode) is not search('(?m)^client-output-buffer-limit')"
          - "(item_redis_configuration['content'] | b64decode) is not search('(?m)^replica-priority')"
        fail_msg: One or more removed Redis directives remain in the configuration.
