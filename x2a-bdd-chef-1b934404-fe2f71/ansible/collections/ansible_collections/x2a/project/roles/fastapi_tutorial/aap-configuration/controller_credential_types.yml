---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Database connection credential currently hardcoded in the Chef recipe and slated for storage in Ansible Vault or another approved 
      secret-management system.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL role; currently hardcoded as fastapi_password.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL connection.
        - id: database_port
          type: string
          label: Database Port
          help_text: TCP port for the PostgreSQL connection.
      required:
        - database_username
        - database_password
        - database_name
        - database_host
        - database_port
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
        database_port: !unsafe "{{ database_port }}"
