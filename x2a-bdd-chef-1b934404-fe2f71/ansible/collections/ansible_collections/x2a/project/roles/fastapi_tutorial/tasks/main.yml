---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install RHEL-family packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
      - python3-psycopg2
    state: present
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Install Debian-family packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
      - python3-psycopg2
    state: present
  when: ansible_facts['os_family'] not in ['RedHat', 'Fedora']

- name: Initialize PostgreSQL on RHEL-family systems
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path from role default
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository  # noqa: R104 - repository default uses HTTPS but is parameterized by trusted role design
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R106 - repository source comes from trusted role defaults
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - destination from role defaults
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - command arguments are derived from the trusted role default application path
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_app_path }}/venv"
    creates: "{{ fastapi_tutorial_app_path }}/venv" # noqa: R114 - path derived from role default

- name: Install Python dependencies  # noqa: R113 - requirements target is the fixed requirements file in the trusted role repository
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt" # noqa: R114 - requirements path derived from role default
    virtualenv: "{{ fastapi_tutorial_app_path }}/venv" # noqa: R114 - virtualenv path derived from role default

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create PostgreSQL application user  # noqa: L039 - variables are validated by the preceding credential validation task
  community.postgresql.postgresql_user:
    name: "{{ database_username }}"
    password: "{{ database_password }}"
    role_attr_flags: CREATEDB
    state: present
  become: true  # noqa: R108 - PostgreSQL user creation requires becoming the postgres OS account
  become_user: postgres
  no_log: true

- name: Set PostgreSQL application user password  # noqa: L039 - variables are validated by the preceding credential validation task
  community.postgresql.postgresql_user:
    name: "{{ database_username }}"
    password: "{{ database_password }}"
    state: present
  become: true  # noqa: R108 - PostgreSQL password management requires becoming the postgres OS account
  become_user: postgres
  no_log: true

- name: Create PostgreSQL application database  # noqa: L039 - variables are validated by the preceding credential validation task
  community.postgresql.postgresql_db:
    name: "{{ database_name }}"
    owner: "{{ database_username }}"
    state: present
  become: true  # noqa: R108 - PostgreSQL database creation requires becoming the postgres OS account
  become_user: postgres

- name: Render application environment
  ansible.builtin.template:
    src: fastapi_tutorial.env.j2
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - path derived from role default
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Render systemd service unit
  ansible.builtin.template:
    src: fastapi-tutorial.service.j2
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart fastapi tutorial

- name: Enable and start FastAPI tutorial service
  ansible.builtin.systemd:
    name: fastapi-tutorial
    state: started
    enabled: true
    daemon_reload: true
