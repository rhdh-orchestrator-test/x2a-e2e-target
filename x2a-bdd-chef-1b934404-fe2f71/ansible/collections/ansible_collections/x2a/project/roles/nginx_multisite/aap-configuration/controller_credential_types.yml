---
controller_credential_types:
  - name: Encrypted Data Bag Nginx Site Token
    description: Secret token stored in the Chef encrypted data bag nginx_secrets, item site, and deployed to nginx for site-related use.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Site Token
          secret: true
          help_text: Token extracted from the encrypted nginx_secrets/site data-bag item and written to /etc/nginx/secrets/site_token.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
