---
controller_credentials:
  - name: Encrypted Data Bag Nginx Site Token - nginx_multisite
    description: Secret token stored in the Chef encrypted data bag nginx_secrets, item site, and deployed to nginx for site-related use.
    organization: Default
    credential_type: Encrypted Data Bag Nginx Site Token
    update_secrets: true
    inputs:
      site_token: "{{ vault_site_token }}"
