---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_ssl_certificate_path }}" # noqa: R114 - path from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_ssl_private_key_path }}" # noqa: R114 - path from role defaults
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Generate self-signed certificates # noqa: R101 - openssl arguments use trusted role-defined certificate paths and site identifiers
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_ssl_private_key_path }}/{{ item_nginx_ssl['value']['id'] }}.key"
      - -out
      - "{{ nginx_ssl_certificate_path }}/{{ item_nginx_ssl['value']['id'] }}.crt"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_ssl['value']['id'] }}/emailAddress=admin@example.com
    creates: "{{ nginx_ssl_certificate_path }}/{{ item_nginx_ssl['value']['id'] }}.crt" # noqa: R114 - path from role-defined sites
  when: item_nginx_ssl['value']['ssl_enabled'] | bool
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_ssl
  notify: Reload nginx

- name: Set private key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx_ssl_private_key_path }}/{{ item_nginx_key['value']['id'] }}.key" # noqa: R114 - path from role-defined sites
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  when: item_nginx_key['value']['ssl_enabled'] | bool
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_key
