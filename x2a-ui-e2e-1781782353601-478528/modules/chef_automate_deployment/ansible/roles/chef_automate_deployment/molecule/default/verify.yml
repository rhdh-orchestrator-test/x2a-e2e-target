---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check sysctl configuration file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl configuration file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are set correctly
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search("vm.max_map_count = 262144")
          - (sysctl_content.content | b64decode) is search("vm.dirty_expire_centisecs = 20000")
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate and Chef Server configuration checks
    - name: Check Chef Server configuration file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server/chef-server.rb
      register: chef_server_config

    - name: Assert Chef Server configuration file exists
      ansible.builtin.assert:
        that:
          - chef_server_config.stat.exists
          - chef_server_config.stat.isreg
        fail_msg: "Chef Server configuration file not found"
        success_msg: "Chef Server configuration file exists"

    - name: Check Chef Automate configuration file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config

    - name: Assert Chef Automate configuration file exists
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
          - chef_automate_config.stat.isreg
        fail_msg: "Chef Automate configuration file not found"
        success_msg: "Chef Automate configuration file exists"

    # User and organization key checks
    - name: Check user key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_key

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key.stat.exists
          - user_key.stat.isreg
          - user_key.stat.mode == "0600"
        fail_msg: "User key file not found or has incorrect permissions"
        success_msg: "User key file exists with correct permissions"

    - name: Check organization validator key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_key

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_key.stat.exists
          - org_key.stat.isreg
          - org_key.stat.mode == "0600"
        fail_msg: "Organization validator key file not found or has incorrect permissions"
        success_msg: "Organization validator key file exists with correct permissions"

    # Mock CLI checks
    - name: Check Chef Automate CLI
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Service checks (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "ansible_facts.services['chef-automate.service'].state == 'running'"
        fail_msg: "Chef Automate service not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Assert Chef Server service is running
      ansible.builtin.assert:
        that:
          - "'chef-server.service' in ansible_facts.services"
          - "ansible_facts.services['chef-server.service'].state == 'running'"
        fail_msg: "Chef Server service not running"
        success_msg: "Chef Server service is running"
      tags: molecule-notest

    # Network checks (tagged for skipping in container)
    - name: Check Chef Automate UI port
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      ignore_errors: true
      register: port_check
      tags: molecule-notest

    - name: Assert Chef Automate UI port is listening
      ansible.builtin.assert:
        that:
          - port_check is success
        fail_msg: "Chef Automate UI port not listening"
        success_msg: "Chef Automate UI port is listening"
      tags: molecule-notest

    # API checks (tagged for skipping in container)
    - name: Check Chef Automate API
      ansible.builtin.uri:
        url: https://localhost/api/v0/auth/version
        validate_certs: false
      register: api_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Automate API is accessible
      ansible.builtin.assert:
        that:
          - api_check is success
        fail_msg: "Chef Automate API not accessible"
        success_msg: "Chef Automate API is accessible"
      tags: molecule-notest

    - name: Check Chef Server API
      ansible.builtin.uri:
        url: https://localhost/organizations
        validate_certs: false
      register: server_api_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Server API is accessible
      ansible.builtin.assert:
        that:
          - server_api_check is success
        fail_msg: "Chef Server API not accessible"
        success_msg: "Chef Server API is accessible"
      tags: molecule-notest