---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Include system configuration tasks
  ansible.builtin.include_tasks:
    file: system_config.yml
- name: Set deployment type to full (Automate + Infra Server)
  ansible.builtin.set_fact:
    chef_automate_deployment_type: full
  when: chef_automate_deployment_type is not defined or chef_automate_deployment_type == 'full'
- name: Include Chef Automate CLI installation tasks
  ansible.builtin.include_tasks:
    file: install_automate.yml
- name: Include user and organization setup tasks
  ansible.builtin.include_tasks:
    file: setup_users_orgs.yml
