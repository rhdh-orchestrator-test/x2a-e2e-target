---
- name: Check if Chef Automate is already installed
  ansible.builtin.stat:
    path: /hab
  register: hab_dir
- name: Check if Chef Automate CLI is already installed
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: chef_automate_cli
- name: Check if user key file already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_user_key_path }}"
  register: user_key_file
- name: Check if organization key file already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_org_key_path }}"
  register: org_key_file
- name: Check system memory
  ansible.builtin.command:
    cmd: free -m
  register: system_memory
  changed_when: false
- name: Check disk space
  ansible.builtin.command:
    cmd: df -h
  register: disk_space
  changed_when: false
- name: Check system CPU
  ansible.builtin.command:
    cmd: grep -c processor /proc/cpuinfo
  register: cpu_count
  changed_when: false
- name: Display preflight check results
  ansible.builtin.debug:
    msg:
      - "Chef Automate already installed: {{ hab_dir.stat.exists }}"
      - "Chef Automate CLI already installed: {{ chef_automate_cli.stat.exists }}"
      - "User key file already exists: {{ user_key_file.stat.exists }}"
      - "Organization key file already exists: {{ org_key_file.stat.exists }}"
      - "System memory: {{ system_memory.stdout_lines }}"
      - "Disk space: {{ disk_space.stdout_lines }}"
      - "CPU count: {{ cpu_count.stdout }}"
- name: Verify minimum system requirements
  ansible.builtin.assert:
    that:
      - cpu_count.stdout | int >= 2
    fail_msg: System does not meet minimum CPU requirements (2 cores)
    success_msg: System meets minimum CPU requirements
