---
- name: Set hostname for Chef Automate server
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  register: hostname_result
- name: Configure kernel parameters for Chef Automate
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ chef_automate_sysctl_params | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
