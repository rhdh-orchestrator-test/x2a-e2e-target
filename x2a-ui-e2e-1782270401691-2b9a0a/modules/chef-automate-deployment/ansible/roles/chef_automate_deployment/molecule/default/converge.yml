- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/etc/sysctl.d
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '{{ item.key }} = {{ item.value }}'
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-{{ item.key | replace('.', '-') }}.conf
      mode: '0644'
    loop: '{{ chef_automate_sysctl_params | dict2items }}'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        EXAMPLE_KEY_CONTENT_FOR_TESTING_ONLY_NOT_A_REAL_KEY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test{{ chef_automate_user_key_path }}
      mode: '0600'
  - name: Create organization key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        EXAMPLE_ORG_KEY_CONTENT_FOR_TESTING_ONLY_NOT_A_REAL_KEY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test{{ chef_automate_org_key_path }}
      mode: '0600'
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_sysctl_params:
      vm.max_map_count: 262144
      vm.dirty_expire_centisecs: 20000
    chef_automate_username: admin
    chef_automate_org_name: lab
    chef_automate_user_key_path: /etc/chef/admin.pem
    chef_automate_org_key_path: /etc/chef/lab-validator.pem
