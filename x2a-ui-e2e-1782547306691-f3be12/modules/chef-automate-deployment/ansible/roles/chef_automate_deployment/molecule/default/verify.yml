---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname configuration file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: config_file

    - name: Assert config file exists
      ansible.builtin.assert:
        that:
          - config_file.stat.exists
          - config_file.stat.isreg
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    - name: Get config file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-automate/config.toml
      register: config_content
      when: config_file.stat.exists

    - name: Assert config file contains hostname
      ansible.builtin.assert:
        that:
          - config_content.content | b64decode | regex_search('hostname = "automate.chef.lab"')
        fail_msg: "Config file does not contain expected hostname"
        success_msg: "Config file contains expected hostname"
      when: config_file.stat.exists

    # Service file check
    - name: Check Chef Automate service file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      register: service_file

    - name: Assert service file exists
      ansible.builtin.assert:
        that:
          - service_file.stat.exists
          - service_file.stat.isreg
        fail_msg: "Chef Automate service file not found"
        success_msg: "Chef Automate service file exists"

    # PEM file checks
    - name: Check user PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_pem

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.isreg
          - user_pem.stat.mode == "0600"
        fail_msg: "User PEM file not found or has incorrect permissions"
        success_msg: "User PEM file exists with correct permissions"

    - name: Check organization validator PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_pem

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_pem.stat.exists
          - org_pem.stat.isreg
          - org_pem.stat.mode == "0600"
        fail_msg: "Organization validator PEM file not found or has incorrect permissions"
        success_msg: "Organization validator PEM file exists with correct permissions"

    # Chef Server CLI check
    - name: Check chef-server-ctl exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/usr/bin/chef-server-ctl
      register: chef_server_ctl

    - name: Assert chef-server-ctl exists
      ansible.builtin.assert:
        that:
          - chef_server_ctl.stat.exists
          - chef_server_ctl.stat.isreg
          - chef_server_ctl.stat.executable
        fail_msg: "chef-server-ctl not found or not executable"
        success_msg: "chef-server-ctl exists and is executable"

    # Service status checks (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "ansible_facts.services['chef-automate.service'].state == 'running'"
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    # Network checks (tagged for skipping in container)
    - name: Check Chef Automate web UI port
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      tags: molecule-notest

    - name: Check Chef Automate API connectivity
      ansible.builtin.uri:
        url: https://localhost/api/v0/auth/version
        validate_certs: false
        status_code: 200
      tags: molecule-notest

    - name: Check Chef Automate web UI accessibility
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
        method: HEAD
        status_code: 200
      tags: molecule-notest