---
- name: Ensure directory exists for PEM files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user.pem_file }}"
    - "{{ chef_automate_org.pem_file }}"
  become: true
- name: Create Chef Automate admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_automate_user.name }} "{{ chef_automate_user.full_name }}" {{ chef_automate_user.email }} "{{ chef_automate_user.password
      }}" --filename {{ chef_automate_user.pem_file }}

      '
    creates: "{{ chef_automate_user.pem_file }}"
  become: true
- name: Create Chef Automate organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_org.name }} "{{ chef_automate_org.full_name }}" --association_user {{ chef_automate_user.name }} --filename
      {{ chef_automate_org.pem_file }}

      '
    creates: "{{ chef_automate_org.pem_file }}"
  become: true
