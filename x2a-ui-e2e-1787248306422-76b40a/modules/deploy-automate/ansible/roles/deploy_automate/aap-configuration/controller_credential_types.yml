---
controller_credential_types:
- name: Chef Admin User
  description: Credential type for Chef Admin User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef admin username for initial user creation
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef admin user
    - id: first_name
      type: string
      label: First Name
      help_text: First name of the Chef admin user
    - id: last_name
      type: string
      label: Last Name
      help_text: Last name of the Chef admin user
    - id: email
      type: string
      label: Email
      help_text: Email address of the Chef admin user
    required:
    - username
    - password
    - first_name
    - last_name
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      first_name: !unsafe '{{ first_name }}'
      last_name: !unsafe '{{ last_name }}'
      email: !unsafe '{{ email }}'
- name: Chef User PEM
  description: Credential type for Chef User PEM
  kind: cloud
  inputs:
    fields:
    - id: user_pem
      type: string
      label: User PEM File
      secret: true
      help_text: Authentication key for the Chef user
    required:
    - user_pem
  injectors:
    extra_vars:
      user_pem: !unsafe '{{ user_pem }}'
- name: Chef Organization Validator
  description: Credential type for Chef Organization Validator
  kind: cloud
  inputs:
    fields:
    - id: organization_name
      type: string
      label: Organization Name
      help_text: Name of the Chef organization
    - id: organization_full_name
      type: string
      label: Organization Full Name
      help_text: Full name of the Chef organization
    - id: organization_validator_pem
      type: string
      label: Organization Validator PEM
      secret: true
      help_text: Authentication key for the Chef organization
    required:
    - organization_name
    - organization_validator_pem
  injectors:
    extra_vars:
      organization_name: !unsafe '{{ organization_name }}'
      organization_full_name: !unsafe '{{ organization_full_name }}'
      organization_validator_pem: !unsafe '{{ organization_validator_pem }}'
- name: Chef Automate Admin
  description: Credential type for Chef Automate Admin
  kind: cloud
  inputs:
    fields:
    - id: admin_username
      type: string
      label: Admin Username
      help_text: Default admin username for Chef Automate web UI
    - id: admin_password
      type: string
      label: Admin Password
      secret: true
      help_text: Default admin password for Chef Automate web UI
    required:
    - admin_username
    - admin_password
  injectors:
    extra_vars:
      admin_username: !unsafe '{{ admin_username }}'
      admin_password: !unsafe '{{ admin_password }}'
