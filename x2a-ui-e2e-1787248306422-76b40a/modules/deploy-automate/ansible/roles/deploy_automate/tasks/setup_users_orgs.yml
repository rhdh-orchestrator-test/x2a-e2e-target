---
- name: Ensure Chef Server CLI is available
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl
  become: true
- name: Fail if Chef Server CLI is not available
  ansible.builtin.fail:
    msg: Chef Server CLI (chef-server-ctl) is not available. Make sure Chef Infra Server is installed.
  when: not chef_server_ctl.stat.exists
- name: Check if Chef user already exists
  ansible.builtin.command:
    cmd: chef-server-ctl user-list
  become: true
  register: user_list
  changed_when: false
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ first_name }} {{ last_name }}" {{ email }} "{{ password }}" --filename /tmp/{{ username }}.pem
  become: true
  register: create_user
  failed_when:
    - create_user.rc != 0
    - "'already exists' not in create_user.stderr"
  changed_when: create_user.rc == 0
  when: username not in user_list.stdout
- name: Check if Chef organization already exists
  ansible.builtin.command:
    cmd: chef-server-ctl org-list
  become: true
  register: org_list
  changed_when: false
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ organization_name }} "{{ organization_full_name }}" --association_user {{ username }} --filename /tmp/{{
      organization_name }}-validator.pem
  become: true
  register: create_org
  failed_when:
    - create_org.rc != 0
    - "'already exists' not in create_org.stderr"
  changed_when: create_org.rc == 0
  when: organization_name not in org_list.stdout
- name: Save user PEM file content
  ansible.builtin.copy:
    content: "{{ user_pem }}"
    dest: /tmp/{{ username }}.pem
    mode: "0600"
  when: user_pem is defined and user_pem | length > 0
- name: Save organization validator PEM file content
  ansible.builtin.copy:
    content: "{{ organization_validator_pem }}"
    dest: /tmp/{{ organization_name }}-validator.pem
    mode: "0600"
  when: organization_validator_pem is defined and organization_validator_pem | length > 0
