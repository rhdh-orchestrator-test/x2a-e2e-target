---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.command:
    cmd: gunzip -c /tmp/chef-automate.zip > {{ chef_automate_cli_path }}
    creates: "{{ chef_automate_cli_path }}"
  become: true
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
  become: true
- name: Build product list for deployment
  ansible.builtin.set_fact:
    chef_automate_product_args: "{% for product in chef_automate_products %} --product {{ product }} {% endfor %}"
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy {{ chef_automate_product_args }} --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}"
    creates: /hab
  become: true
  register: chef_automate_deploy_result
  async: 3600
  poll: 30
- name: Display Chef Automate deployment result
  ansible.builtin.debug:
    var: chef_automate_deploy_result.stdout_lines
  when: chef_automate_deploy_result.stdout_lines is defined
