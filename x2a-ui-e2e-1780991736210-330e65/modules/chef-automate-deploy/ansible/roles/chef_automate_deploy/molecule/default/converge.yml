- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/root
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/usr/bin
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_max_map_count }}'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_dirty_expire_centisecs }}'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/sh echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create chef-server-ctl mock
    ansible.builtin.copy:
      content: "#!/bin/sh\necho \"Chef Server Control mock\"\ncase \"$1\" in\n  \"user-create\")\n    echo \"Creating user $2\"\n    touch \"/tmp/molecule_test/root/$2.pem\"\n
        \   ;;\n  \"org-create\")\n    echo \"Creating organization $2\"\n    touch \"/tmp/molecule_test/root/$2-validator.pem\"\n    ;;\n  *)\n    echo \"Unknown
        command: $1\"\n    ;;\nesac\n"
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create symlink to chef-server-ctl in PATH
    ansible.builtin.file:
      src: /tmp/molecule_test/usr/bin/chef-server-ctl
      dest: /usr/bin/chef-server-ctl
      state: link
    failed_when: false
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock Chef user key -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/root/{{ chef_automate_username }}.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock Chef organization validator key -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/root/{{ chef_automate_org_name }}-validator.pem
      mode: '0600'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_username: jtonello
    chef_automate_org_name: lab
