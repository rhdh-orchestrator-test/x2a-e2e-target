---
argument_specs:
  main:
    short_description: Install and configure FastAPI Tutorial application with PostgreSQL backend
    description:
      - Deploys a FastAPI tutorial application with PostgreSQL database backend.
      - Installs system dependencies, clones the application from GitHub, sets up Python virtual environment.
      - Configures PostgreSQL with dedicated database and user, runs FastAPI as systemd service.
    options:
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Directory where the FastAPI application will be installed.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name used in environment configuration.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version used in environment configuration.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port the FastAPI application listens on.
      fastapi_tutorial_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Host address the FastAPI application binds to.
      fastapi_tutorial_repo_url:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the FastAPI tutorial application.
      fastapi_tutorial_repo_branch:
        type: str
        required: false
        default: main
        description: Git branch to checkout from the repository.
      fastapi_tutorial_system_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
          - python3-psycopg2
        description: List of system packages required for the application.
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: System user to run the FastAPI service as.
      fastapi_tutorial_service_group:
        type: str
        required: false
        default: root
        description: System group for the FastAPI service.
      fastapi_tutorial_dir_mode:
        type: str
        required: false
        default: "0755"
        description: File permissions for application directory.
      fastapi_tutorial_file_mode:
        type: str
        required: false
        default: "0644"
        description: File permissions for configuration files.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: "{{ fastapi_tutorial_app_dir }}/venv"
        description: Path to Python virtual environment.
      db_host:
        type: str
        required: true
        description: Database host address (injected by AAP credential type).
      db_name:
        type: str
        required: true
        description: Database name (injected by AAP credential type).
      db_username:
        type: str
        required: true
        description: Database username (injected by AAP credential type).
      db_password:
        type: str
        required: true
        description: Database password (injected by AAP credential type).
