- name: Verify
  hosts: all
  gather_facts: true
  tasks:
  - name: Check hostname configuration
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Check sysctl parameters
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/settings
    register: sysctl_file
  - name: Verify sysctl parameters
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/settings
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl parameters are correctly set
    ansible.builtin.assert:
      that:
      - sysctl_content.content | b64decode is search('vm.max_map_count = 262144')
      - sysctl_content.content | b64decode is search('vm.dirty_expire_centisecs = 20000')
      fail_msg: Sysctl parameters are not correctly set
      success_msg: Sysctl parameters are correctly set
    when: sysctl_file.stat.exists
  - name: Check Chef Automate config file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: automate_config
  - name: Assert Chef Automate config exists
    ansible.builtin.assert:
      that:
      - automate_config.stat.exists
      - automate_config.stat.size > 0
      fail_msg: Chef Automate config file not found or empty
      success_msg: Chef Automate config file exists
  - name: Check Chef Server config file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-server/chef-server.rb
    register: chef_server_config
  - name: Assert Chef Server config exists
    ansible.builtin.assert:
      that:
      - chef_server_config.stat.exists
      - chef_server_config.stat.size > 0
      fail_msg: Chef Server config file not found or empty
      success_msg: Chef Server config file exists
  - name: Check user PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_pem
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.size > 0
      fail_msg: User PEM file not found or empty
      success_msg: User PEM file exists
  - name: Check organization validator PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_validator_pem
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_validator_pem.stat.exists
      - org_validator_pem.stat.size > 0
      fail_msg: Organization validator PEM file not found or empty
      success_msg: Organization validator PEM file exists
  - name: Check user list
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/opt/chef-server/user-list.txt
    register: user_list
  - name: Verify user list
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/opt/chef-server/user-list.txt
    register: user_list_content
    when: user_list.stat.exists
  - name: Assert user exists
    ansible.builtin.assert:
      that:
      - user_list_content.content | b64decode is search('jtonello')
      fail_msg: User jtonello not found in user list
      success_msg: User jtonello found in user list
    when: user_list.stat.exists
  - name: Check organization list
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/opt/chef-server/org-list.txt
    register: org_list
  - name: Verify organization list
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/opt/chef-server/org-list.txt
    register: org_list_content
    when: org_list.stat.exists
  - name: Assert organization exists
    ansible.builtin.assert:
      that:
      - org_list_content.content | b64decode is search('lab')
      fail_msg: Organization lab not found in organization list
      success_msg: Organization lab found in organization list
    when: org_list.stat.exists
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - automate_status.rc == 0
      - '''running'' in automate_status.stdout'
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Server status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: chef_server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Server is running
    ansible.builtin.assert:
      that:
      - chef_server_status.rc == 0
      - '''run'' in chef_server_status.stdout'
      fail_msg: Chef Server is not running
      success_msg: Chef Server is running
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is success
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
  - name: Check Chef Automate API accessibility
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
    register: api_check
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate API is accessible
    ansible.builtin.assert:
      that:
      - api_check is success
      fail_msg: Chef Automate API is not accessible
      success_msg: Chef Automate API is accessible
    tags: molecule-notest
  - name: Check Chef Server API accessibility
    ansible.builtin.uri:
      url: https://localhost/organizations/lab
      validate_certs: false
    register: server_api_check
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Server API is accessible
    ansible.builtin.assert:
      that:
      - server_api_check is success
      fail_msg: Chef Server API is not accessible
      success_msg: Chef Server API is accessible
    tags: molecule-notest
