---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Configure Fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny
  when: nginx_multisite_ufw_enabled | bool

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    name: OpenSSH
  when: nginx_multisite_ufw_enabled | bool

- name: Allow HTTP through UFW
  community.general.ufw:
    rule: allow
    name: WWW
  when: nginx_multisite_ufw_enabled | bool

- name: Allow HTTPS through UFW
  community.general.ufw:
    rule: allow
    name: WWW Full
  when: nginx_multisite_ufw_enabled | bool

- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: nginx_multisite_ufw_enabled | bool

- name: Create sysctl configuration directory
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render security sysctl configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    state: present
    create: false
    backup: true
  when: nginx_multisite_disable_root_login | bool
  notify: Restart ssh

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    state: present
    create: false
    backup: true
  when: nginx_multisite_disable_password_auth | bool
  notify: Restart ssh
