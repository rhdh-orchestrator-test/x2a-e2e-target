---
controller_credential_types:
  - name: PostgreSQL Application Database
    description: Credentials for the local PostgreSQL database used by the FastAPI application.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role name used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password assigned to the PostgreSQL fastapi role and used for application authentication.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_url
          type: string
          label: Database URL
          help_text: Connection string used by the application to connect to PostgreSQL; it contains the database password and should be rendered securely.
      required:
        - db_username
        - db_password
        - database_name
        - database_url
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_url: !unsafe "{{ database_url }}"
