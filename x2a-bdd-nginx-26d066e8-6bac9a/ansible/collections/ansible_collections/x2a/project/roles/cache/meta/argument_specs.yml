---
argument_specs:
  main:
    short_description: Configure a Redis cache service.
    description:
      - Installs and configures a standalone Redis cache on port 6379.
      - Uses the AAP-injected Redis password and disables replication-related features.
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port used by the Redis cache instance.
      cache_redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis cluster mode is enabled.
      cache_redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis Sentinel mode is enabled.
      cache_redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis replication is enabled.
      cache_redis_aof_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis append-only file persistence is enabled.
      cache_redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Whether Redis RDB persistence is enabled.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether tasks handling the Redis password hide their output.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
