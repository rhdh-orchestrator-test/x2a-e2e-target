---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install Memcached
  ansible.builtin.package:
    name:
      - memcached
    state: present

- name: Enable and start Memcached
  ansible.builtin.service:
    name: memcached
    enabled: true
    state: started

- name: Configure Redis cache  # noqa: L038 - external eloy.redis.redis role is a required runtime dependency
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: "{{ cache_redis_cluster_enabled }}"
    redis_sentinel_enabled: "{{ cache_redis_sentinel_enabled }}"
    redis_replication_enabled: "{{ cache_redis_replication_enabled }}"
    redis_aof_enabled: "{{ cache_redis_aof_enabled }}"
    redis_rdb_enabled: "{{ cache_redis_rdb_enabled }}"

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    owner: redis
    group: redis
    mode: "0755"
    state: directory
    recurse: true

- name: Check whether the Redis configuration exists
  ansible.builtin.stat:
    path: /etc/redis/6379.conf
  register: redis_configuration

- name: Remove unwanted replication directives from Redis configuration  # noqa: L039 - redis_configuration is registered by the preceding stat task
  ansible.builtin.replace:
    path: /etc/redis/6379.conf
    regexp: ^((replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*)$
    replace: ""
    create: false
  when: redis_configuration.stat.exists
  notify: Restart Redis after configuration changes
