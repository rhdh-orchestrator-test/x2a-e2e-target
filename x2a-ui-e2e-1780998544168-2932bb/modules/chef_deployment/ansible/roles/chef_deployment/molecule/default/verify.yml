- name: Verify
  hosts: all
  gather_facts: false
  vars:
    chef_hostname: automate.chef.lab
    username: jtonello
    org_name: lab
    chef_user_pem_file: /tmp/molecule_test/jtonello.pem
    chef_org_validator_pem_file: /tmp/molecule_test/lab-validator.pem
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is correctly set
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == chef_hostname
      fail_msg: Hostname is not set correctly
      success_msg: Hostname is set correctly
    when: hostname_file.stat.exists
  - name: Check hosts file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hosts
    register: hosts_file
  - name: Assert hosts file exists
    ansible.builtin.assert:
      that:
      - hosts_file.stat.exists
      - hosts_file.stat.isreg
      fail_msg: Hosts file not found
      success_msg: Hosts file exists
  - name: Get hosts file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hosts
    register: hosts_content
    when: hosts_file.stat.exists
  - name: Assert hostname is in hosts file
    ansible.builtin.assert:
      that:
      - (hosts_content.content | b64decode) is search(chef_hostname)
      fail_msg: Hostname not found in hosts file
      success_msg: Hostname found in hosts file
    when: hosts_file.stat.exists
  - name: Check Chef Automate config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: chef_config
  - name: Assert Chef Automate config file exists
    ansible.builtin.assert:
      that:
      - chef_config.stat.exists
      - chef_config.stat.isreg
      fail_msg: Chef Automate config file not found
      success_msg: Chef Automate config file exists
  - name: Check user PEM file exists
    ansible.builtin.stat:
      path: '{{ chef_user_pem_file }}'
    register: user_pem
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.isreg
      - user_pem.stat.mode == '0600'
      fail_msg: User PEM file not found or has incorrect permissions
      success_msg: User PEM file exists with correct permissions
  - name: Check organization validator PEM file exists
    ansible.builtin.stat:
      path: '{{ chef_org_validator_pem_file }}'
    register: org_pem
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_pem.stat.exists
      - org_pem.stat.isreg
      - org_pem.stat.mode == '0600'
      fail_msg: Organization validator PEM file not found or has incorrect permissions
      success_msg: Organization validator PEM file exists with correct permissions
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: chef_automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - chef_automate_status.rc == 0
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: chef_server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - chef_server_status.rc == 0
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Check Chef user list
    ansible.builtin.command:
      cmd: sudo chef-server-ctl user-list
    register: chef_user_list
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert user exists in Chef
    ansible.builtin.assert:
      that:
      - chef_user_list.stdout is search(username)
      fail_msg: User not found in Chef user list
      success_msg: User found in Chef user list
    tags: molecule-notest
  - name: Check Chef organization list
    ansible.builtin.command:
      cmd: sudo chef-server-ctl org-list
    register: chef_org_list
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert organization exists in Chef
    ansible.builtin.assert:
      that:
      - chef_org_list.stdout is search(org_name)
      fail_msg: Organization not found in Chef org list
      success_msg: Organization found in Chef org list
    tags: molecule-notest
  - name: Check HTTPS port is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    register: https_port
    failed_when: false
    tags: molecule-notest
  - name: Assert HTTPS port is listening
    ansible.builtin.assert:
      that:
      - https_port is succeeded
      fail_msg: HTTPS port is not listening
      success_msg: HTTPS port is listening
    tags: molecule-notest
  - name: Check Chef Automate service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - '''chef-automate'' in ansible_facts.services'
      - ansible_facts.services['chef-automate'].state == 'running'
      fail_msg: Chef Automate service is not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
