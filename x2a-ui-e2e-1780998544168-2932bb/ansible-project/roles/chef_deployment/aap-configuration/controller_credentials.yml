---
controller_credentials:
- name: Chef Admin User - chef_deployment
  description: Credential for chef_deployment
  organization: Default
  credential_type: Chef Admin User
  update_secrets: true
  inputs:
    username: '{{ username }}'
    user_password: '{{ vault_user_password }}'
    long_username: '{{ long_username }}'
    user_email: '{{ user_email }}'
    org_name: '{{ org_name }}'
    long_org_name: '{{ long_org_name }}'
