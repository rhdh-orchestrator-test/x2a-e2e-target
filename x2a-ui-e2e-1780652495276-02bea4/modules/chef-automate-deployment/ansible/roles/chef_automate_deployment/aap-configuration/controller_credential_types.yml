---
controller_credential_types:
- name: Chef Admin User
  description: Credential type for Chef Admin User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef admin username for Chef Infra Server
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef admin user
    - id: email
      type: string
      label: Email
      help_text: Email address for the Chef admin user
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the Chef admin user
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
      full_name: !unsafe '{{ full_name }}'
- name: Chef Organization
  description: Credential type for Chef Organization
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full name of the Chef organization
    required:
    - org_name
    - org_full_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
