---
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_username }} {{ chef_automate_longusername }} {{ chef_automate_useremail }} "{{ chef_automate_userpassword
      }}" --filename {{ chef_automate_userfilename }}
  args:
    creates: "{{ chef_automate_userfilename }}"
  register: user_create_result
  changed_when: user_create_result.rc == 0
  failed_when: user_create_result.rc != 0
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_orgname }} "{{ chef_automate_longorgname }}" --association_user {{ chef_automate_username }} --filename {{
      chef_automate_orgfilename }}
  args:
    creates: "{{ chef_automate_orgfilename }}"
  register: org_create_result
  changed_when: org_create_result.rc == 0
  failed_when: org_create_result.rc != 0
  become: true
- name: Set permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_automate_userfilename }}"
    mode: "0600"
    state: file
  when: user_create_result.changed
- name: Set permissions on organization validator key file
  ansible.builtin.file:
    path: "{{ chef_automate_orgfilename }}"
    mode: "0600"
    state: file
  when: org_create_result.changed
