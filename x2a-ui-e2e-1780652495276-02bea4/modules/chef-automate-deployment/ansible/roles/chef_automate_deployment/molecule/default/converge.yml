- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/opscode
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/opscode
    - /tmp/molecule_test/proc/sys/vm
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "# Chef Automate configuration\n[global]\n  v1 = true\n[deployment]\n  hostname = \"automate.chef.lab\"\n[gateway]\n  port = 443\n[load_balancer]\n
        \ v1 = true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create Chef Server config file
    ansible.builtin.copy:
      content: '# Chef Server configuration

        api_fqdn "automate.chef.lab"

        nginx[''ssl_protocols''] = "TLSv1.2 TLSv1.3"

        nginx[''ssl_ciphers''] = "HIGH:!aNULL:!MD5:!RC4"

        nginx[''enable''] = true

        nginx[''non_ssl_port''] = false

        '
      dest: /tmp/molecule_test/etc/opscode/chef-server.rb
      mode: '0644'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefghijklmnopq

        rstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefgh

        ijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        ZYXWVUTSRQPONMLKJIHGFEDCBA0987654321zyxwvutsrqponmlk

        jihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA0987654321zyxwvu

        tsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA0987654321

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create sysctl files to simulate kernel parameters
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/vm/{{ item.name }}
      mode: '0644'
    loop:
    - name: max_map_count
      value: '262144'
    - name: dirty_expire_centisecs
      value: '20000'
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: postgresql        running

        Service: elasticsearch     running

        Service: automate-gateway  running

        Service: automate-ui       running

        Service: chef-server       running

        '
      dest: /tmp/molecule_test/var/opt/chef-automate/status.txt
      mode: '0644'
  - name: Create Chef Server status file
    ansible.builtin.copy:
      content: 'run: postgresql: (pid 12345) 300s; run: log: (pid 12346) 300s

        run: bookshelf: (pid 12347) 300s; run: log: (pid 12348) 300s

        run: oc_bifrost: (pid 12349) 300s; run: log: (pid 12350) 300s

        run: oc_id: (pid 12351) 300s; run: log: (pid 12352) 300s

        run: opscode-erchef: (pid 12353) 300s; run: log: (pid 12354) 300s

        run: nginx: (pid 12355) 300s; run: log: (pid 12356) 300s

        '
      dest: /tmp/molecule_test/var/opt/opscode/status.txt
      mode: '0644'
  - name: Create user list file
    ansible.builtin.copy:
      content: 'jtonello

        pivotal

        '
      dest: /tmp/molecule_test/var/opt/opscode/user-list.txt
      mode: '0644'
  - name: Create organization list file
    ansible.builtin.copy:
      content: 'lab

        chef

        '
      dest: /tmp/molecule_test/var/opt/opscode/org-list.txt
      mode: '0644'
  - name: Create systemd service files
    ansible.builtin.copy:
      content: '[Unit]

        Description={{ item }}


        [Service]

        Type=simple


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/{{ item }}.service
      mode: '0644'
    loop:
    - chef-automate
    - chef-server
