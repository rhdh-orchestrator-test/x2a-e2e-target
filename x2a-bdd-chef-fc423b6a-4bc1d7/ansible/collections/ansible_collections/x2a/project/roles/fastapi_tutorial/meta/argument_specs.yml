---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application and PostgreSQL database.
    description:
      - Deploys the FastAPI tutorial repository in a Python virtual environment.
      - Installs and configures PostgreSQL and manages the FastAPI systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_service_port:
        type: int
        required: false
        default: 8000
        description: Port on which Uvicorn listens.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_database_username:
        type: str
        required: false
        default: "{{ database_username }}"
        description: PostgreSQL application username supplied by the AAP credential.
      fastapi_tutorial_database_password:
        type: str
        required: false
        default: "{{ database_password }}"
        description: PostgreSQL application password supplied by the AAP credential.
      fastapi_tutorial_database_name:
        type: str
        required: false
        default: "{{ database_name }}"
        description: PostgreSQL application database name supplied by the AAP credential.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: "{{ database_host }}"
        description: PostgreSQL database host supplied by the AAP credential.
      fastapi_tutorial_database_port:
        type: str
        required: false
        default: "{{ database_port }}"
        description: PostgreSQL database port supplied by the AAP credential.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether tasks handling the database password suppress output.
