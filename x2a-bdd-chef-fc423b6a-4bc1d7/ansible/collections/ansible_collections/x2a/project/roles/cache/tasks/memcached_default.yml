---
- name: Install Memcached package
  ansible.builtin.package:
    name: memcached
    state: present

- name: Ensure Memcached service is enabled and started
  ansible.builtin.service:
    name: "{{ cache_memcached_service_name }}" # noqa: R114 - service name is a role-defined platform variable
    enabled: true
    state: started
