---
controller_credential_types:
  - name: Redis Authentication
    description: Authentication password for the Redis instance on port 6379, currently hardcoded in the Chef recipe and requiring migration to Ansible Vault or
      an approved external secret manager.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required to authenticate clients to the Redis instance on port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
