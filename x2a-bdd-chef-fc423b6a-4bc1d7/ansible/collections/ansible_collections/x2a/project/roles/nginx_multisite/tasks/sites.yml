---
- name: Create nginx sites-available directory
  ansible.builtin.file:
    path: /etc/nginx/sites-available
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create nginx sites-enabled directory
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Render nginx virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_nginx_site['value']['id'] }} # noqa: R114 - destination is derived from the role-defined nginx_sites mapping
    mode: "0644"
    backup: true
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site
  notify: Reload nginx
  vars:
    server_name: "{{ item_nginx_site['value']['id'] }}"
    document_root: "{{ item_nginx_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_nginx_site['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_certificate_path }}/{{ item_nginx_site['value']['id'] }}.crt"
    key_file: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_site['value']['id'] }}.key"

- name: Enable nginx virtual host configurations
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_nginx_site['value']['id'] }} # noqa: R114 - link source is derived from the role-defined nginx_sites mapping
    dest: /etc/nginx/sites-enabled/{{ item_nginx_site['value']['id'] }} # noqa: R114 - link destination is derived from the role-defined nginx_sites mapping
    state: link
    force: true
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site
  notify: Reload nginx

- name: Remove default nginx virtual host
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
