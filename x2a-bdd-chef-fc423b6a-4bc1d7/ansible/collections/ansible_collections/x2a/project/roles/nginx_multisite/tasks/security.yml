---
- name: Install security packages
  ansible.builtin.package:
    name: "{{ (['fail2ban'] if nginx_multisite_fail2ban_enabled else []) + (['ufw'] if nginx_multisite_ufw_enabled else []) }}"
    state: present
  when: nginx_multisite_fail2ban_enabled | bool or nginx_multisite_ufw_enabled | bool

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Deploy Fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Read UFW status
  ansible.builtin.command:
    cmd: ufw status verbose
  changed_when: false
  register: nginx_multisite_ufw_status
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default deny policy # noqa: L039 - nginx_multisite_ufw_status is registered by the prior UFW status task
  ansible.builtin.command:
    cmd: ufw --force default deny
  when:
    - nginx_multisite_ufw_enabled
    - "'Default: deny' not in nginx_multisite_ufw_status.stdout"

- name: Allow SSH through UFW # noqa: L039 - nginx_multisite_ufw_status is registered by the prior UFW status task
  ansible.builtin.command:
    cmd: ufw allow ssh
  when:
    - nginx_multisite_ufw_enabled
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTP through UFW # noqa: L039 - nginx_multisite_ufw_status is registered by the prior UFW status task
  ansible.builtin.command:
    cmd: ufw allow http
  when:
    - nginx_multisite_ufw_enabled
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTPS through UFW # noqa: L039 - nginx_multisite_ufw_status is registered by the prior UFW status task
  ansible.builtin.command:
    cmd: ufw allow https
  when:
    - nginx_multisite_ufw_enabled
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Enable UFW # noqa: L039 - nginx_multisite_ufw_status is registered by the prior UFW status task
  ansible.builtin.command:
    cmd: ufw --force enable
  when:
    - nginx_multisite_ufw_enabled
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"

- name: Deploy kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Check SSH daemon configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    backup: true
    create: false
  when:
    - nginx_multisite_disable_root_login
    - nginx_multisite_sshd_config.stat.exists # noqa: L039 - nginx_multisite_sshd_config is registered by the prior SSH stat task
  notify: Restart sshd

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    backup: true
    create: false
  when:
    - not nginx_multisite_password_authentication
    - nginx_multisite_sshd_config.stat.exists # noqa: L039 - nginx_multisite_sshd_config is registered by the prior SSH stat task
  notify: Restart sshd
