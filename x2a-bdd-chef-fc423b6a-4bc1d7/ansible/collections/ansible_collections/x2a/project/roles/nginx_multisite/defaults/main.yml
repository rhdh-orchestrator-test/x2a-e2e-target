---
# Role-defined virtual hosts. Each value requires id, document_root, and ssl_enabled.
nginx_sites: {}
# Paths used for generated nginx TLS material.
nginx_multisite_certificate_path: /etc/ssl/certs
nginx_multisite_private_key_path: /etc/ssl/private
nginx_multisite_fail2ban_enabled: true
nginx_multisite_ufw_enabled: true
nginx_multisite_disable_root_login: true
nginx_multisite_password_authentication: false
nginx_multisite_secure_logging: true
