---
controller_credential_types:
  - name: Chef Encrypted Data Bag Nginx Site Token
    description: Token stored in the encrypted Chef data bag nginx_secrets, item site, and deployed to /etc/nginx/secrets/site_token for nginx-related use.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Nginx Site Token
          secret: true
          help_text: Secret token from the nginx_secrets encrypted data bag item site; deployed to /etc/nginx/secrets/site_token.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
