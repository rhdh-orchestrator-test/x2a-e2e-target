---
argument_specs:
  main:
    short_description: Install and configure a secure nginx multisite web server.
    description:
      - Installs nginx, Fail2ban, UFW, OpenSSL, and CA certificates.
      - Configures security settings, self-signed TLS certificates, and dynamically defined nginx virtual hosts.
    options:
      nginx_sites:
        type: dict
        required: false
        default: {}
        description: Mapping of site identifiers to virtual host configuration dictionaries.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory where generated TLS certificates are stored.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory where generated TLS private keys are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban protection is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the AAP-provided site token.
      site_token:
        type: str
        required: true
        description: Secret nginx site token injected by an AAP credential type.
