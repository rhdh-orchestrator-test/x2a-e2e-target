---
# Unsupported pre-flight checks: Memcached version/stats output, wildcard log listing,
# platform-specific Memcached configuration inspection, authenticated Redis PING,
# Redis journal output, and Redis log-file listing have no safe, stated outcome here.
- name: Verify cache services and configuration
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather service facts for Memcached and Redis checks
      ansible.builtin.service_facts:

    - name: Verify Memcached is active and enabled
      ansible.builtin.assert:
        that:
          - "ansible_facts.services['memcached.service']['state'] == 'running'"
          - "ansible_facts.services['memcached.service']['status'] == 'enabled'"
        fail_msg: Memcached must be running and enabled.

    - name: Identify Redis service units
      ansible.builtin.set_fact:
        item_redis_services: >-
          {{ ansible_facts.services | dict2items |
             selectattr('key', 'match', '^redis') | list }}

    - name: Verify a Redis service is active and enabled
      ansible.builtin.assert:
        that:
          - item_redis_services | length > 0
          - >-
            item_redis_services |
            selectattr('value.state', 'equalto', 'running') | list | length > 0
          - >-
            item_redis_services |
            selectattr('value.status', 'equalto', 'enabled') | list | length > 0
        fail_msg: A Redis service unit must exist, be running, and be enabled.

    - name: Verify Memcached TCP port 11211 is listening
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: item_memcached_tcp_socket
      changed_when: false

    - name: Assert Memcached TCP listener
      ansible.builtin.assert:
        that:
          - item_memcached_tcp_socket.stdout is search(':11211\\b')
        fail_msg: Memcached TCP port 11211 must be listening.

    - name: Verify Memcached UDP port 11211 is listening
      ansible.builtin.command:
        argv:
          - ss
          - -ulnp
      register: item_memcached_udp_socket
      changed_when: false

    - name: Assert Memcached UDP listener
      ansible.builtin.assert:
        that:
          - item_memcached_udp_socket.stdout is search(':11211\\b')
        fail_msg: Memcached UDP port 11211 must be listening.

    - name: Verify Redis TCP port 6379 is listening
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: item_redis_tcp_socket
      changed_when: false

    - name: Assert Redis TCP listener
      ansible.builtin.assert:
        that:
          - item_redis_tcp_socket.stdout is search(':6379\\b')
        fail_msg: Redis TCP port 6379 must be listening.

    - name: Verify Memcached log directory
      ansible.builtin.stat:
        path: /var/log/memcached
      register: item_memcached_log_directory

    - name: Assert Memcached log directory exists
      ansible.builtin.assert:
        that:
          - item_memcached_log_directory.stat.exists
          - item_memcached_log_directory.stat.isdir
        fail_msg: /var/log/memcached must exist as a directory.

    - name: Verify Redis configuration file
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: item_redis_configuration

    - name: Assert Redis configuration directives
      ansible.builtin.assert:
        that:
          - item_redis_configuration.content | b64decode is search('(?m)^port\\s+6379\\s*$')
          - item_redis_configuration.content | b64decode is search('(?m)^pidfile\\s+/run/redis/')
          - item_redis_configuration.content | b64decode is search('(?m)^requirepass\\s+\\S+')
          - item_redis_configuration.content | b64decode is not search('(?m)^replica-serve-stale-data\\b')
          - item_redis_configuration.content | b64decode is not search('(?m)^replica-read-only\\b')
          - item_redis_configuration.content | b64decode is not search('(?m)^repl-ping-replica-period\\b')
          - item_redis_configuration.content | b64decode is not search('(?m)^client-output-buffer-limit\\b')
          - item_redis_configuration.content | b64decode is not search('(?m)^replica-priority\\b')
        fail_msg: Redis configuration must contain the required port, pidfile, and password directives.

    - name: Verify Redis log directory metadata
      ansible.builtin.stat:
        path: /var/log/redis
      register: item_redis_log_directory

    - name: Assert Redis log directory metadata
      ansible.builtin.assert:
        that:
          - item_redis_log_directory.stat.exists
          - item_redis_log_directory.stat.isdir
          - item_redis_log_directory.stat.mode == '0755'
          - item_redis_log_directory.stat.pw_name == 'redis'
          - item_redis_log_directory.stat.gr_name == 'redis'
        fail_msg: /var/log/redis must be mode 0755 and owned by redis:redis.

    - name: Verify Redis PID directory metadata
      ansible.builtin.stat:
        path: /run/redis
      register: item_redis_pid_directory

    - name: Assert Redis PID directory exists and is owner-writable
      ansible.builtin.assert:
        that:
          - item_redis_pid_directory.stat.exists
          - item_redis_pid_directory.stat.isdir
          - item_redis_pid_directory.stat.pw_name == 'redis'
          - item_redis_pid_directory.stat.mode[1] in ['2', '3', '6', '7']
        fail_msg: /run/redis must exist and be writable by the Redis service account.

    - name: Verify unauthenticated Redis access is rejected
      ansible.builtin.command:
        argv:
          - redis-cli
          - -h
          - 127.0.0.1
          - -p
          - '6379'
          - PING
      register: item_redis_unauthenticated_ping
      changed_when: false
      failed_when: false

    - name: Assert unauthenticated Redis access requires authentication
      ansible.builtin.assert:
        that:
          - >-
            item_redis_unauthenticated_ping.stdout is search('(?i)authentication required') or
            item_redis_unauthenticated_ping.stderr is search('(?i)authentication required')
        fail_msg: Unauthenticated Redis PING must be rejected with an authentication-required error.
