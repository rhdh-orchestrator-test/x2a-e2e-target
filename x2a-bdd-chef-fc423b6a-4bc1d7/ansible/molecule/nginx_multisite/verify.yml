---
# Unsupported pre-flight checks: service status output, UFW policy/allowed services,
# SSH setting values and active state, Fail2ban status/content, sysctl value checks,
# secret-file metadata, lsof listener checks, and per-site checks require explicit
# expected values or site names that are not supplied by the migration plan.
- name: Verify nginx multisite pre-flight checks
  hosts: all
  gather_facts: true
  tasks:
    - name: Confirm required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are present
      ansible.builtin.assert:
        that:
          - item_required_package in ansible_facts['packages']
        fail_msg: "A required package is not installed."
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_required_package

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_config_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_config_test['rc'] == 0
        fail_msg: "The nginx configuration validation failed."

    - name: Inspect nginx effective configuration includes
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      register: nginx_effective_config
      changed_when: false

    - name: Assert nginx includes conf.d and sites-enabled
      ansible.builtin.assert:
        that:
          - nginx_effective_config['rc'] == 0
          - nginx_effective_config['stdout'] is search('include /etc/nginx/(conf.d|sites-enabled)')
        fail_msg: "The nginx effective configuration does not show the required include paths."

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      register: sshd_config_test
      changed_when: false

    - name: Assert SSH configuration is valid
      ansible.builtin.assert:
        that:
          - sshd_config_test['rc'] == 0
        fail_msg: "The SSH configuration validation failed."

    - name: Inspect TCP listeners for the requested ports
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: tcp_listeners
      changed_when: false

    - name: Assert a requested TCP listener is present
      ansible.builtin.assert:
        that:
          - tcp_listeners['rc'] == 0
          - tcp_listeners['stdout'] is search(':(22|80|443)\\b')
        fail_msg: "No listener for TCP port 22, 80, or 443 was found."
