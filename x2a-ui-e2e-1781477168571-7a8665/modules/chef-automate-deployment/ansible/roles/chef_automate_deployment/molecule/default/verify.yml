---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == chef_automate_hostname | default('automate.chef.lab')
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Sysctl parameter checks
    - name: Check sysctl vm.max_map_count file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/vm_max_map_count
      register: max_map_count_file

    - name: Assert vm.max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
        fail_msg: "vm.max_map_count file not found"
        success_msg: "vm.max_map_count file exists"

    - name: Get vm.max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/vm_max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "vm.max_map_count = 262144"
        fail_msg: "vm.max_map_count not set correctly"
        success_msg: "vm.max_map_count set correctly"
      when: max_map_count_file.stat.exists

    - name: Check sysctl vm.dirty_expire_centisecs file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/vm_dirty_expire_centisecs
      register: dirty_expire_file

    - name: Assert vm.dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_file.stat.exists
        fail_msg: "vm.dirty_expire_centisecs file not found"
        success_msg: "vm.dirty_expire_centisecs file exists"

    - name: Get vm.dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/vm_dirty_expire_centisecs
      register: dirty_expire_content
      when: dirty_expire_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_content.content | b64decode | trim) == "vm.dirty_expire_centisecs = 20000"
        fail_msg: "vm.dirty_expire_centisecs not set correctly"
        success_msg: "vm.dirty_expire_centisecs set correctly"
      when: dirty_expire_file.stat.exists

    # Chef Automate CLI checks
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # User and organization key file checks
    - name: Check user key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/home/molecule/{{ chef_user_name | default('admin') }}.pem"
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.isreg
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/home/molecule/{{ chef_org_name | default('lab') }}-validator.pem"
      register: org_validator_key_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_validator_key_file.stat.exists
          - org_validator_key_file.stat.isreg
        fail_msg: "Organization validator key file not found"
        success_msg: "Organization validator key file exists"

    # Chef Server user and organization list checks
    - name: Check Chef Server user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server-user-list
      register: user_list_file

    - name: Assert Chef Server user list file exists
      ansible.builtin.assert:
        that:
          - user_list_file.stat.exists
        fail_msg: "Chef Server user list file not found"
        success_msg: "Chef Server user list file exists"

    - name: Get Chef Server user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-server-user-list
      register: user_list_content
      when: user_list_file.stat.exists

    - name: Assert user is in Chef Server user list
      ansible.builtin.assert:
        that:
          - (user_list_content.content | b64decode | trim) == chef_user_name | default('admin')
        fail_msg: "User not found in Chef Server user list"
        success_msg: "User found in Chef Server user list"
      when: user_list_file.stat.exists

    - name: Check Chef Server org list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server-org-list
      register: org_list_file

    - name: Assert Chef Server org list file exists
      ansible.builtin.assert:
        that:
          - org_list_file.stat.exists
        fail_msg: "Chef Server org list file not found"
        success_msg: "Chef Server org list file exists"

    - name: Get Chef Server org list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-server-org-list
      register: org_list_content
      when: org_list_file.stat.exists

    - name: Assert organization is in Chef Server org list
      ansible.builtin.assert:
        that:
          - (org_list_content.content | b64decode | trim) == chef_org_name | default('lab')
        fail_msg: "Organization not found in Chef Server org list"
        success_msg: "Organization found in Chef Server org list"
      when: org_list_file.stat.exists

    # Service status checks (tagged with molecule-notest as they can't run in container)
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Server is not running"
        success_msg: "Chef Server is running"
      tags: molecule-notest

    # Network port checks (tagged with molecule-notest as they can't run in container)
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # API health check (tagged with molecule-notest as it can't run in container)
    - name: Check Chef Automate API health
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
        status_code: 200
      register: api_health
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate API is healthy
      ansible.builtin.assert:
        that:
          - api_health is succeeded
        fail_msg: "Chef Automate API is not healthy"
        success_msg: "Chef Automate API is healthy"
      tags: molecule-notest