---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/molecule

    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname | default('automate.chef.lab') }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    - name: Create sysctl settings files
      ansible.builtin.copy:
        content: "{{ item.key }} = {{ item.value }}"
        dest: "/tmp/molecule_test/etc/{{ item.key | replace('.', '_') }}"
        mode: "0644"
      loop:
        - key: vm.max_map_count
          value: 262144
        - key: vm.dirty_expire_centisecs
          value: 20000

    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI Mock'"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    - name: Create Chef Server user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK_USER_KEY_CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/home/molecule/{{ chef_user_name | default('admin') }}.pem"
        mode: "0600"

    - name: Create Chef Server organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK_ORG_VALIDATOR_KEY_CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/home/molecule/{{ chef_org_name | default('lab') }}-validator.pem"
        mode: "0600"

    - name: Create Chef Server user list file
      ansible.builtin.copy:
        content: "{{ chef_user_name | default('admin') }}"
        dest: "/tmp/molecule_test/etc/chef-server-user-list"
        mode: "0644"

    - name: Create Chef Server org list file
      ansible.builtin.copy:
        content: "{{ chef_org_name | default('lab') }}"
        dest: "/tmp/molecule_test/etc/chef-server-org-list"
        mode: "0644"

    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: "Service: running\nStatus: ok"
        dest: "/tmp/molecule_test/etc/chef-automate-status"
        mode: "0644"

    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: "Service: running\nStatus: ok"
        dest: "/tmp/molecule_test/etc/chef-server-status"
        mode: "0644"