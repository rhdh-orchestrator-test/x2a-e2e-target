---
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Wait for Chef Server to be fully operational
  ansible.builtin.wait_for:
    path: /hab/svc/chef-server-ctl/hooks/run
    state: present
    timeout: 300
  when: chef_server_ctl_check.rc == 0
  become: true
- name: Create Chef Server admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_user_name }} "{{ chef_user_fullname }}" {{ chef_user_email }} "{{ chef_user_password }}" --filename {{
      chef_user_key_file }}
  args:
    creates: "{{ chef_user_key_file }}"
  become: true
  no_log: true
  when: chef_server_ctl_check.rc == 0
- name: Create Chef Server organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_fullname }}" --association_user {{ chef_user_name }} --filename {{
      chef_org_validator_key_file }}
  args:
    creates: "{{ chef_org_validator_key_file }}"
  become: true
  when: chef_server_ctl_check.rc == 0
