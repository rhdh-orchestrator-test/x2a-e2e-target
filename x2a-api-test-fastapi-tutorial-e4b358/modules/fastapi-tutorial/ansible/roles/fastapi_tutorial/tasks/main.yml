---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install required system packages (Debian/Ubuntu)
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
      - python3-psycopg2
    state: present
  when: ansible_os_family == "Debian"
- name: Install required system packages (RedHat/CentOS)
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - postgresql-devel
      - python3-psycopg2
    state: present
  when: ansible_os_family == "RedHat"
- name: Initialize PostgreSQL database (RedHat/CentOS)
  ansible.builtin.command:
    cmd: postgresql-setup initdb
    creates: /var/lib/pgsql/data/postgresql.conf
  when: ansible_os_family == "RedHat"
- name: Enable and start PostgreSQL service
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
- name: Create application directory
  ansible.builtin.file:
    path: /opt/fastapi-tutorial
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Clone FastAPI tutorial repository
  ansible.builtin.git:
    repo: https://github.com/dibanez/fastapi_tutorial.git
    dest: /opt/fastapi-tutorial
    version: main
    force: true
  become: true
- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv /opt/fastapi-tutorial/venv
    creates: /opt/fastapi-tutorial/venv
- name: Install Python dependencies
  ansible.builtin.pip:
    requirements: /opt/fastapi-tutorial/requirements.txt
    virtualenv: /opt/fastapi-tutorial/venv
- name: Create database user
  community.postgresql.postgresql_user:
    name: "{{ db_username }}"
    password: "{{ db_password }}"
    state: present
  become: true
  become_user: postgres
- name: Create database
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_username }}"
    state: present
  become: true
  become_user: postgres
- name: Create environment configuration file
  ansible.builtin.copy:
    dest: /opt/fastapi-tutorial/.env
    content: 'PROJECT_NAME="FastAPI Tutorial"

      API_VERSION=1.0.0

      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}/{{ db_name }}

      '
    mode: "0644"
    owner: root
    group: root
    backup: true
- name: Create systemd service file
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: '[Unit]

      Description=FastAPI Tutorial Service

      After=network.target postgresql.service


      [Service]

      Type=simple

      User=root

      WorkingDirectory=/opt/fastapi-tutorial

      Environment="PATH=/opt/fastapi-tutorial/venv/bin"

      ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000

      Restart=always


      [Install]

      WantedBy=multi-user.target

      '
    mode: "0644"
    owner: root
    group: root
    backup: true
  notify: Reload systemd daemon
- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: fastapi-tutorial
    state: started
    enabled: true
