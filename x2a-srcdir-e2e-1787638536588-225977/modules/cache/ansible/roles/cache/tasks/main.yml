---
- name: Install Redis server package
  ansible.builtin.package:
    name: redis-server
    state: present
- name: Ensure Redis configuration directory exists
  ansible.builtin.file:
    path: /etc/redis
    state: directory
    mode: "0755"
- name: Configure Redis server
  ansible.builtin.copy:
    src: /etc/redis/redis.conf
    dest: /etc/redis/redis.conf
    mode: "0644"
    remote_src: true
    backup: true
  register: redis_config
  notify: Restart Redis server
- name: Enable and start Redis server service
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
