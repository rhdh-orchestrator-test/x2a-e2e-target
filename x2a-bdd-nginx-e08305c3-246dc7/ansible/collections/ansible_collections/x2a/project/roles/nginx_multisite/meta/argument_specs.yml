---
argument_specs:
  main:
    short_description: Configure a secure multi-site nginx web server
    description:
      - Installs and configures nginx, TLS, Fail2ban, UFW, SSH hardening, and kernel security settings.
      - Deploys HTTPS virtual hosts for the configured sites.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Site names and their document-root and TLS settings.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated TLS certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated TLS private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban configuration is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW configuration is enabled.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is enabled.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide sensitive certificate-generation task output.
