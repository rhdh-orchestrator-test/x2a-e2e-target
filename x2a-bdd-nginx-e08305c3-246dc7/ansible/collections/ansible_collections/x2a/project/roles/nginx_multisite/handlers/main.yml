---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload nginx multisite
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Reload nginx multisite sysctl
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.rp_filter
    value: "1"
    sysctl_file: /etc/sysctl.d/99-security.conf
    sysctl_set: true
    reload: true
    state: present

- name: Restart nginx multisite SSH
  ansible.builtin.service:
    name: "{{ nginx_multisite_service_name }}"
    state: restarted
