---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install Memcached
  ansible.builtin.package:
    name: memcached
    state: present

- name: Ensure Memcached service is enabled and running
  ansible.builtin.service:
    name: memcached
    enabled: true
    state: started

- name: Configure Redis cache server with the collection role  # noqa: L038 - external eloy.redis.redis role is supplied by the execution environment
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"

- name: Ensure Redis log directory exists
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Check for the Redis configuration file
  ansible.builtin.stat:
    path: "/etc/redis/{{ redis_port }}.conf"
  register: redis_config

- name: Remove unsupported replication directives from Redis configuration  # noqa: L039 - redis_config is registered by the preceding stat task
  ansible.builtin.replace:  # noqa: R114 - redis_port is defined in role defaults and is trusted configuration
    path: "/etc/redis/{{ redis_port }}.conf"
    regexp: (?m)^\s*(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*?
    replace: ""
  when: redis_config.stat.exists
