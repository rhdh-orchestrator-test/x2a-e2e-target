---
argument_specs:
  main:
    short_description: Configure an authenticated standalone Redis cache
    description:
      - Installs and configures Redis for the cache role using the eloy.redis collection.
      - Configures a standalone authenticated Redis instance on the selected TCP port.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output for tasks that handle the Redis authentication password.
      redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port used by the standalone Redis instance.
      redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis clustering is enabled.
      redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis Sentinel is enabled.
      redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis replication is enabled.
      redis_aof_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis append-only persistence is enabled.
      redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Whether Redis RDB persistence is enabled.
      redis_requirepass:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
