---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the local PostgreSQL database used by the FastAPI application.
    kind: cloud
    inputs:
      fields:
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server; the source uses localhost.
        - id: db_port
          type: string
          label: Database Port
          help_text: PostgreSQL listener port; the source expects the standard port 5432.
        - id: database_name
          type: string
          label: Database Name
          help_text: Name of the PostgreSQL database used by the FastAPI application.
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL role; currently hardcoded and must be rotated and stored securely.
        - id: database_url
          type: string
          label: Database Connection URL
          secret: true
          help_text: Application connection string for PostgreSQL; it contains the database password and should be constructed from secure credential fields.
      required:
        - db_host
        - db_port
        - database_name
        - db_username
        - db_password
        - database_url
    injectors:
      extra_vars:
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
        database_name: !unsafe "{{ database_name }}"
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_url: !unsafe "{{ database_url }}"
