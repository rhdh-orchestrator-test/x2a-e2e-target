---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials and connection settings for the local PostgreSQL database used by the FastAPI application.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      db_host: "{{ db_host }}"
      db_port: "{{ db_port }}"
      database_name: "{{ database_name }}"
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      database_url: "{{ vault_database_url }}"
