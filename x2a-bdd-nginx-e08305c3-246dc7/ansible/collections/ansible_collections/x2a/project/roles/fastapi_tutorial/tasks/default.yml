---
- name: Install FastAPI tutorial system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create FastAPI tutorial application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}"  # noqa: R114 - path comes from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize FastAPI tutorial repository
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"  # noqa: R104 - repository URL comes from role defaults and uses HTTPS
    dest: "{{ fastapi_tutorial_app_path }}"
    version: "{{ fastapi_tutorial_revision }}"
    update: true
    # noqa: R106 - repository URL is a trusted role default

- name: Create Python virtual environment  # noqa: R101 - command uses a fixed executable and a path from role defaults
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_app_path }}/venv"
    creates: "{{ fastapi_tutorial_app_path }}/venv"

- name: Install FastAPI tutorial Python dependencies
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt"  # noqa: R113 - requirements path comes from role defaults
    virtualenv: "{{ fastapi_tutorial_app_path }}/venv"
    virtualenv_command: python3 -m venv

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create FastAPI PostgreSQL role and database  # noqa: L039 - credentials are required role parameters validated by the prior task; R101 - database commands are fixed and required for role provisioning
  ansible.builtin.shell:  # noqa: R101 - database commands are fixed and required for role provisioning
    cmd: |
      set -e
      set -o pipefail
      psql -v ON_ERROR_STOP=1 -c "DO $do$ BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ db_username }}') THEN
          CREATE ROLE {{ db_username }} LOGIN PASSWORD '{{ db_password }}';
        ELSE
          ALTER ROLE {{ db_username }} WITH LOGIN PASSWORD '{{ db_password }}';
        END IF;
      END $do$;"
      psql -v ON_ERROR_STOP=1 -tc "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'" | grep -q 1 || \
        createdb -O '{{ db_username }}' '{{ database_name }}'
      psql -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ db_username }};"
    executable: /bin/bash
  changed_when: false
  become: true  # noqa: R108 - PostgreSQL role and database management requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI environment configuration  # noqa: L039 - database URL is a required role parameter validated by the prior task
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL={{ database_url }}
    dest: "{{ fastapi_tutorial_app_path }}/.env"  # noqa: R114 - path comes from role defaults
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_app_path }}/venv/bin"
      ExecStart={{ fastapi_tutorial_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: "/etc/systemd/system/{{ fastapi_tutorial_service_name }}.service"  # noqa: R114 - service name comes from role defaults
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before starting the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
