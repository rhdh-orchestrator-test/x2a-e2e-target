---
argument_specs:
  main:
    short_description: Deploy the FastAPI tutorial application with PostgreSQL.
    description:
      - Installs the application prerequisites, repository, Python virtual environment, database configuration, and systemd service.
    options:
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle database credentials.
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Filesystem path where the FastAPI application is deployed.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Name of the systemd service.
      fastapi_tutorial_app_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by the FastAPI application.
      db_host:
        type: str
        required: true
        description: Database host injected by the AAP credential type.
      db_port:
        type: str
        required: true
        description: Database port injected by the AAP credential type.
      database_name:
        type: str
        required: true
        description: Database name injected by the AAP credential type.
      db_username:
        type: str
        required: true
        description: Database username injected by the AAP credential type.
      db_password:
        type: str
        required: true
        description: Database password injected by the AAP credential type.
      database_url:
        type: str
        required: true
        description: Secret database connection URL injected by the AAP credential type.
