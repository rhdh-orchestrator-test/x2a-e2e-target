# Unsupported pre-flight checks: confirmed service names and credentials are unavailable; Memcached details,
# journal output expectations, and multi-run idempotence require execution context not represented by this playbook.
---
- name: Verify Redis cache deployment
  hosts: all
  gather_facts: false
  tasks:
    - name: Confirm Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_stat

    - name: Assert Redis configuration file exists
      ansible.builtin.assert:
        that:
          - redis_config_stat.stat.exists
          - redis_config_stat.stat.isreg
        fail_msg: Redis configuration file /etc/redis/6379.conf is missing.
        success_msg: Redis configuration file exists.

    - name: Read Redis configuration for directive checks
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis is listening on TCP port 6379
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 5

    - name: Assert configured Redis port is 6379
      ansible.builtin.assert:
        that:
          - >-
            (redis_config_content.content | b64decode) is search('(?m)^[[:space:]]*port[[:space:]]+6379([[:space:]]|$)')
        fail_msg: Redis configuration does not set port 6379.
        success_msg: Redis configuration sets port 6379.

    - name: Assert Redis authentication is configured
      ansible.builtin.assert:
        that:
          - >-
            (redis_config_content.content | b64decode) is search('(?m)^[[:space:]]*requirepass[[:space:]]+')
        fail_msg: Redis authentication directive is missing.
        success_msg: Redis authentication directive is configured.

    - name: Assert unwanted Redis replication directives are absent
      ansible.builtin.assert:
        that:
          - >-
            (redis_config_content.content | b64decode) is not search('(?m)^[[:space:]]*(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)')
        fail_msg: An unwanted Redis replication directive remains in the configuration.
        success_msg: Unwanted Redis replication directives are absent.

    - name: Confirm Redis log directory attributes
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_directory_stat

    - name: Assert Redis log directory has expected attributes
      ansible.builtin.assert:
        that:
          - redis_log_directory_stat.stat.exists
          - redis_log_directory_stat.stat.isdir
          - redis_log_directory_stat.stat.pw_name == 'redis'
          - redis_log_directory_stat.stat.gr_name == 'redis'
          - redis_log_directory_stat.stat.mode == '0755'
        fail_msg: Redis log directory does not have the expected path, owner, group, and mode.
        success_msg: Redis log directory has the expected attributes.
