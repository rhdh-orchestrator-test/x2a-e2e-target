---
controller_credentials:
- name: Chef User Credentials - chef_automate_deploy
  description: Credentials for creating the initial Chef user account
  organization: Default
  credential_type: Chef User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    email: '{{ email }}'
    full_name: '{{ full_name }}'
