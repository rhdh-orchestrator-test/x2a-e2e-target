---
- name: Ensure gzip is installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
    creates: "{{ chef_automate_cli_path }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Build Chef Automate deploy command
  ansible.builtin.set_fact:
    chef_automate_deploy_cmd: "{{ chef_automate_cli_path }} deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{
      chef_automate_accept_terms | lower }}"
- name: Deploy Chef Automate
  ansible.builtin.command:
    cmd: "{{ chef_automate_deploy_cmd }}"
    creates: /hab
  become: true
  register: chef_automate_deploy_result
  async: 3600
  poll: 30
- name: Display Chef Automate deployment result
  ansible.builtin.debug:
    var: chef_automate_deploy_result.stdout_lines
  when: chef_automate_deploy_result.stdout_lines is defined
