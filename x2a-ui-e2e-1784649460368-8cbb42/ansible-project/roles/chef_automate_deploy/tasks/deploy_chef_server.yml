---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters for Chef Server
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ chef_automate_sysctl_settings | dict2items }}"
  become: true
- name: Ensure gzip is installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
    creates: "{{ chef_automate_cli_path }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}"
    creates: /hab
  become: true
  register: chef_server_deploy_result
  async: 3600
  poll: 30
- name: Display Chef Server deployment result
  ansible.builtin.debug:
    var: chef_server_deploy_result.stdout_lines
  when: chef_server_deploy_result.stdout_lines is defined
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_username }} {{ chef_automate_full_name }} {{ chef_automate_email }} "{{ chef_automate_password }}"
      --filename {{ chef_automate_user_key_path }}
  args:
    creates: "{{ chef_automate_user_key_path }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_full_name }}" --association_user {{ chef_automate_username }} --filename
      {{ chef_automate_org_key_path }}
  args:
    creates: "{{ chef_automate_org_key_path }}"
  become: true
- name: Set proper permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_automate_user_key_path }}"
    mode: "0600"
    owner: "{{ ansible_user_id }}"
  become: true
- name: Set proper permissions on organization key file
  ansible.builtin.file:
    path: "{{ chef_automate_org_key_path }}"
    mode: "0600"
    owner: "{{ ansible_user_id }}"
  become: true
