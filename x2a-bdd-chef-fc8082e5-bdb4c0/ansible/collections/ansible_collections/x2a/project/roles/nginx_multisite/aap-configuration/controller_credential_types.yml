---
controller_credential_types:
  - name: Encrypted Data Bag Nginx Site Token
    description: Secret token stored in the Chef encrypted data bag nginx_secrets/site and written to /etc/nginx/secrets/site_token for nginx or site 
      configuration.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Nginx Site Token
          secret: true
          help_text: Secret token retrieved from the encrypted nginx_secrets/site data-bag item and written to the nginx site token file.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
