---
# Standalone Redis configuration migrated from profile_redis_cluster.
redis_cluster_secure_logging: true
redis_cluster_port: 6379
redis_cluster_maxmemory_mb: 256
redis_cluster_maxmemory_policy: allkeys-lru
redis_cluster_bind:
  - 0.0.0.0
redis_cluster_appendonly: true
redis_cluster_appendfsync: everysec
redis_cluster_service_name: redis-server
redis_cluster_ulimit: 65536
redis_cluster_unixsocket: /var/run/redis/redis.sock
redis_cluster_config_mode: "0640"
redis_cluster_cluster_enabled: false
redis_cluster_sentinel_enabled: false
redis_cluster_replication_enabled: false
redis_cluster_aof_enabled: true
redis_cluster_rdb_enabled: true
