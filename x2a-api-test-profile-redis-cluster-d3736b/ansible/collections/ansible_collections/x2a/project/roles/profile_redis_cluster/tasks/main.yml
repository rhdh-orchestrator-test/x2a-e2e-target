---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure standalone Redis with the Private Hub role  # noqa: L038 - eloy.redis.redis is a required Private Hub role declared in this role's requirements.yml
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ redis_cluster_secure_logging }}"
  vars:
    redis_install_method: package
    redis_version: "7.2"
    redis_port: "{{ redis_cluster_port }}"
    redis_bind: "{{ redis_cluster_bind }}"
    redis_requirepass: "{{ redis_password }}"
    redis_maxmemory: "{{ redis_cluster_maxmemory_mb }}mb"
    redis_maxmemory_policy: "{{ redis_cluster_maxmemory_policy }}"
    redis_cluster_enabled: "{{ redis_cluster_cluster_enabled }}"
    redis_sentinel_enabled: "{{ redis_cluster_sentinel_enabled }}"
    redis_replication_enabled: "{{ redis_cluster_replication_enabled }}"
    redis_aof_enabled: "{{ redis_cluster_aof_enabled }}"
    redis_aof_fsync: "{{ redis_cluster_appendfsync }}"
    redis_rdb_enabled: "{{ redis_cluster_rdb_enabled }}"
    redis_unixsocket: "{{ redis_cluster_unixsocket }}"
    redis_service_name: "{{ redis_cluster_service_name }}"
    redis_open_files_limit: "{{ redis_cluster_ulimit }}"
