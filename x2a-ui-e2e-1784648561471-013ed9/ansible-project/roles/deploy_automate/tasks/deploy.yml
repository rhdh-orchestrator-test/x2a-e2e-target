---
- name: Check if Chef Automate is already deployed
  ansible.builtin.stat:
    path: /hab/sup/default/specs/chef-automate-deployment.default@0.1.0.spec
  register: automate_deployed
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ deploy_automate_cli_path }} deploy {% for product in deploy_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{ deploy_automate_accept_terms
      | lower }} "
  args:
    creates: /hab/sup/default/specs/chef-automate-deployment.default@0.1.0.spec
  register: deploy_result
  changed_when: deploy_result.rc == 0
  when: not automate_deployed.stat.exists
  become: true
- name: Wait for Chef Automate services to be fully available
  ansible.builtin.uri:
    url: https://localhost/api/v0/health
    validate_certs: false
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: 60
  delay: 10
  when: not automate_deployed.stat.exists
  failed_when: false
  tags:
    - molecule-notest
