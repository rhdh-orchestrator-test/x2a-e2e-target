---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ deploy_automate_hostname }}"
  register: hostname_changed
  notify: Update hosts file
- name: Configure kernel parameters for Chef Automate
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ deploy_automate_sysctl_settings | dict2items }}"
