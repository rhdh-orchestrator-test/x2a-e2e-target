- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/root
    - /tmp/molecule_test/hab/sup/default/specs
    - /tmp/molecule_test/etc
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ deploy_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
    vars:
      deploy_automate_hostname: automate.chef.lab
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Mock'' echo ''Version: 1.0.0'' '
      dest: /tmp/molecule_test/root/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment spec file
    ansible.builtin.copy:
      content: '# Chef Automate deployment spec file version: 0.1.0 '
      dest: /tmp/molecule_test/hab/sup/default/specs/chef-automate-deployment.default@0.1.0.spec
      mode: '0644'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_KEY_CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/root/admin.pem
      mode: '0600'
  - name: Create organization key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_ORG_KEY_CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/root/lab-validator.pem
      mode: '0600'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
