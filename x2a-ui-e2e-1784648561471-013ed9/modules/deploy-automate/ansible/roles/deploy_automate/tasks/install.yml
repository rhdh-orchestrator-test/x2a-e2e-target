---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - gzip
    state: present
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ deploy_automate_cli_url }}"
    dest: "{{ deploy_automate_cli_path }}.zip"
    mode: "0644"
  register: download_result
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ deploy_automate_cli_path }}.zip > {{ deploy_automate_cli_path }} && chmod +x {{ deploy_automate_cli_path }}
    executable: /bin/bash
    creates: "{{ deploy_automate_cli_path }}"
  register: extract_result
  changed_when: extract_result.rc == 0
- name: Verify Chef Automate CLI is executable
  ansible.builtin.file:
    path: "{{ deploy_automate_cli_path }}"
    mode: "0755"
    state: file
