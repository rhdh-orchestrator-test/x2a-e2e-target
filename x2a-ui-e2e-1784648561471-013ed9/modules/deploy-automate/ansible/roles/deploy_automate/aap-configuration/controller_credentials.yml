---
controller_credentials:
- name: Chef Admin User Credentials - deploy_automate
  description: Authentication credentials for the Chef Automate and Chef Infra Server
    admin user
  organization: Default
  credential_type: Chef Admin User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
