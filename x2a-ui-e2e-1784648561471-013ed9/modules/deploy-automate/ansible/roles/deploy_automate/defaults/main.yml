---
deploy_automate_hostname: automate.chef.lab
deploy_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
deploy_automate_cli_path: /root/chef-automate
deploy_automate_sysctl_settings:
  vm.max_map_count: 262144
  vm.dirty_expire_centisecs: 20000
deploy_automate_accept_terms: true
deploy_automate_products:
  - automate
  - infra-server
deploy_automate_username: "{{ username | default('admin') }}"
deploy_automate_full_name: "{{ full_name | default('Administrator') }}"
deploy_automate_email: "{{ email | default('admin@example.com') }}"
deploy_automate_password: "{{ password | default('changeme') }}"
deploy_automate_org_name: lab
deploy_automate_org_full_name: Chef Lab
deploy_automate_user_key_path: /root/{{ deploy_automate_username }}.pem
deploy_automate_org_key_path: /root/{{ deploy_automate_org_name }}-validator.pem
