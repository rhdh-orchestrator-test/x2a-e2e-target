---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ automate_cli_url }}"
    dest: "{{ automate_cli_path }}.zip"
    mode: "0644"
  become: true
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: "{{ automate_cli_path }}"
  register: automate_cli_stat
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ automate_cli_path }}.zip > {{ automate_cli_path }}
  become: true
  register: extract_result
  changed_when: extract_result.rc == 0
  when: not automate_cli_stat.stat.exists
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ automate_cli_path }}"
    mode: "0755"
  become: true
- name: Check if Chef Automate is already deployed
  ansible.builtin.command:
    cmd: "{{ automate_cli_path }} status"
  become: true
  register: automate_status
  changed_when: false
  failed_when: false
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ automate_cli_path }} deploy --product automate --product infra-server --accept-terms-and-mlsa={{ automate_accept_terms | lower }}"
  become: true
  register: automate_deploy
  changed_when: automate_deploy.rc == 0
  failed_when: automate_deploy.rc != 0
  when: automate_status.rc != 0
