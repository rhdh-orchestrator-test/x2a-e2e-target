---
controller_credentials:
- name: Chef Infra Server User - deploy_automate
  description: Credential for deploy_automate
  organization: Default
  credential_type: Chef Infra Server User
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
