---
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_key_path }}"
    - "{{ chef_automate_org_key_path }}"
  become: true
  when: chef_automate_user_key_path | dirname != '.' or chef_automate_org_key_path | dirname != '.'
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_username }} {{ chef_automate_user_fullname }} {{ chef_automate_user_email }} "{{
      chef_automate_user_password }}" --filename {{ chef_automate_user_key_path }}
  args:
    creates: "{{ chef_automate_user_key_path }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_fullname }}" --association_user {{ chef_automate_username }} --filename
      {{ chef_automate_org_key_path }}
  args:
    creates: "{{ chef_automate_org_key_path }}"
  become: true
