---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml

- name: Configure Redis with the Private Hub role
  ansible.builtin.include_role:
    name: eloy.redis.redis # noqa: L038 - role is provided by the declared eloy.redis collection
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true
    redis_base_piddir: "{{ cache_redis_pid_directory }}"

- name: Ensure Redis log directory exists
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is a role default
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Remove obsolete Redis replication directives
  ansible.builtin.replace:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)\\b.*$
    replace: ""
    backup: true
  notify: Restart Redis
