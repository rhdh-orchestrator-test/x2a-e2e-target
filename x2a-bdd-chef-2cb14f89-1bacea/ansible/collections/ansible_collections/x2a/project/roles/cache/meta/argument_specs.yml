---
argument_specs:
  main:
    short_description: Install and configure Memcached and Redis cache services
    description:
      - Deploys Memcached with the migrated cookbook settings and configures a standalone Redis instance.
    options:
      cache_memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory allocation in megabytes.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      cache_memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      cache_memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      cache_memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached connections.
      cache_memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      cache_memcached_experimental_options:
        type: list
        required: false
        default: []
        description: Additional Memcached experimental options.
      cache_memcached_extra_cli_options:
        type: list
        required: false
        default: []
        description: Additional Memcached command-line options.
      cache_memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file descriptor limit.
      cache_memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log path.
      cache_memcached_service_user:
        type: str
        required: false
        default: memcached
        description: Memcached service account.
      cache_memcached_service_group:
        type: str
        required: false
        default: memcached
        description: Memcached service group.
      cache_memcached_threads:
        type: int
        required: false
        default: 4
        description: Memcached worker thread count.
      cache_memcached_log_directory:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log directory.
      cache_memcached_run_directory:
        type: str
        required: false
        default: /var/run/memcached
        description: Memcached runtime directory.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: Redis TCP port.
      cache_redis_pid_directory:
        type: str
        required: false
        default: /run/redis
        description: Redis PID directory.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      cache_redis_config_path:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration path.
      cache_redis_service_name:
        type: str
        required: false
        default: redis
        description: Redis service unit name.
      cache_redis_package_name:
        type: str
        required: false
        default: redis
        description: Redis package name.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide tasks that handle the Redis password from logs.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
