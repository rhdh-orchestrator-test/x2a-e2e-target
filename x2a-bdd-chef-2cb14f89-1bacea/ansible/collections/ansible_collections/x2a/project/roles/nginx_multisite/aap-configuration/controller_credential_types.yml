---
controller_credential_types:
  - name: Nginx Site Token
    description: Encrypted Chef data bag token used by the Nginx site configuration.
    kind: cloud
    inputs:
      fields:
        - id: token
          type: string
          label: Nginx Site Token
          secret: true
          help_text: Secret token from the Chef encrypted data bag item nginx_secrets/site.
      required:
        - token
    injectors:
      extra_vars:
        token: !unsafe "{{ token }}"
