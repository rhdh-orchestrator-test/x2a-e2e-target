---
argument_specs:
  main:
    short_description: Configure Nginx as a secure multisite web server
    description:
      - Installs and configures Nginx, security services, TLS certificates, and virtual hosts.
    options:
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for site certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban protection is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_ssh_service:
        type: str
        required: false
        default: sshd
        description: SSH service name to restart after configuration changes.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Disable SSH root login.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Allow SSH password authentication.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks handling the site token.
      nginx_multisite_sites:
        type: dict
        required: false
        default: {}
        description: Site definitions keyed by site name.
