---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Restart ssh service
  ansible.builtin.service:
    name: "{{ nginx_multisite_ssh_service }}"
    state: restarted
