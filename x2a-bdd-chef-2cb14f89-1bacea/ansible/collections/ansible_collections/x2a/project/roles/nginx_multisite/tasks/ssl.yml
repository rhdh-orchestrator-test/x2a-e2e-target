---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_certificate_path }}" # noqa: R114 - path from role default
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}" # noqa: R114 - path from role default
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Generate self-signed site certificates  # noqa: R101 - command paths come from role defaults and role-defined site data
  ansible.builtin.shell:  # noqa: L039 - wantlist is a lookup keyword, not an undefined variable
    cmd: |
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        -keyout "{{ nginx_multisite_private_key_path }}/{{ item_ssl['key'] }}.key" \
        -out "{{ nginx_multisite_certificate_path }}/{{ item_ssl['key'] }}.crt" \
        -subj "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl['key'] }}/emailAddress=admin@example.com"
      chmod 640 "{{ nginx_multisite_private_key_path }}/{{ item_ssl['key'] }}.key"
      chown root:ssl-cert "{{ nginx_multisite_private_key_path }}/{{ item_ssl['key'] }}.key"
    creates: "{{ nginx_multisite_certificate_path }}/{{ item_ssl['key'] }}.crt"
  when:
    - item_ssl['value']['ssl_enabled'] | bool
    - not (lookup('ansible.builtin.fileglob', nginx_multisite_certificate_path ~ '/' ~ item_ssl['key'] ~ '.crt', wantlist=true) | length > 0 and
      lookup('ansible.builtin.fileglob', nginx_multisite_private_key_path ~ '/' ~ item_ssl['key'] ~ '.key', wantlist=true) | length > 0)
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl
  notify: Reload nginx
