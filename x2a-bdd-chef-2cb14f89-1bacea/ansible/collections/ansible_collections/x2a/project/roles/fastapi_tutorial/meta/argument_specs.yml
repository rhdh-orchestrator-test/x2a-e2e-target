---
argument_specs:
  main:
    short_description: Deploy and configure the FastAPI tutorial application
    description:
      - Installs PostgreSQL and Python dependencies.
      - Clones the application, creates its virtual environment, and manages its systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Filesystem path where the application is deployed.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_service_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by the FastAPI service.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the database password.
      database_username:
        type: str
        required: true
        description: Database username injected by an AAP credential type.
      database_password:
        type: str
        required: true
        description: Database password injected by an AAP credential type.
      database_name:
        type: str
        required: true
        description: Database name injected by an AAP credential type.
      database_host:
        type: str
        required: true
        description: Database host injected by an AAP credential type.
