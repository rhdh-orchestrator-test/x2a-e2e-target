---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Database credential currently hardcoded in the Chef recipe and written to the application environment file; migrate the password to an AAP 
      credential or Ansible Vault.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL user used by the FastAPI application.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi user; used to create the database user and authenticate the application.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_host
          type: string
          label: Database Host
          help_text: PostgreSQL host used in the application connection URL.
      required:
        - database_username
        - database_password
        - database_name
        - database_host
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
