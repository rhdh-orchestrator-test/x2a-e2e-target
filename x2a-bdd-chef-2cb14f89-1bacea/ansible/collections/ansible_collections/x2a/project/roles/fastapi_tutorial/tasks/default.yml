---
- name: Install Fedora and RHEL system packages
  ansible.builtin.package:
    name: [python3, python3-pip, git, postgresql-server, postgresql-contrib, libpq-devel]
    state: present
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Install Debian and other system packages
  ansible.builtin.package:
    name: [python3, python3-pip, python3-venv, git, postgresql, postgresql-contrib, libpq-dev]
    state: present
  when: ansible_facts['os_family'] not in ['RedHat', 'Fedora']

- name: Initialize PostgreSQL on Fedora and RHEL
  ansible.builtin.command:
    argv: [postgresql-setup, --initdb]
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Create application directory  # noqa: R114 - path comes from role defaults, not user input
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize FastAPI tutorial repository  # noqa: R104 - repository URL is trusted role configuration and uses HTTPS by default; R106 - source is a trusted role default
  ansible.builtin.git:  # noqa: R106 - source is a trusted role default
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_path }}"
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - command path comes from role defaults, not user input
  ansible.builtin.command:
    argv: [python3, -m, venv, "{{ fastapi_tutorial_app_path }}/venv"]
    creates: "{{ fastapi_tutorial_app_path }}/venv/bin/python"

- name: Install Python dependencies  # noqa: R113 - requirements path and virtualenv come from role defaults, not user input
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_app_path }}/venv"

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the PostgreSQL role and database exist  # noqa: L039 - database variables are role parameters
  ansible.builtin.shell:  # noqa: R101 - command values come from trusted role parameters
    cmd: >-
      runuser -u postgres -- psql -v ON_ERROR_STOP=1 -tAc
      "SELECT (EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ database_username }}'))
      AND (EXISTS (SELECT FROM pg_database WHERE datname = '{{ database_name }}'));"
  register: fastapi_tutorial_postgresql_ready
  changed_when: false
  failed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL user and database  # noqa: L039 - database variables and the registered readiness result are role parameters or registered by the prior task
  ansible.builtin.shell:  # noqa: R101 - command values come from trusted role parameters
    cmd: |
      runuser -u postgres -- psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ database_username }}') THEN
        CREATE ROLE {{ database_username }} LOGIN PASSWORD '{{ database_password }}';
      ELSE
        ALTER ROLE {{ database_username }} WITH LOGIN PASSWORD '{{ database_password }}';
      END IF;
      END \$\$;"
      runuser -u postgres -- psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'" | grep -q 1 || runuser -u postgres -- createdb -O '{{ database_username }}' '{{ database_name }}'
      runuser -u postgres -- psql -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ database_username }};"
  when: fastapi_tutorial_postgresql_ready.stdout | trim != 't'
  changed_when: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Render application environment file  # noqa: L039 - database variables are role parameters
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_path }}/.env"  # noqa: R114 - destination path comes from role defaults, not user input
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ database_username }}:{{ database_password }}@{{ database_host }}/{{ database_name }}
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Render FastAPI systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_app_path }}/venv/bin"
      ExecStart={{ fastapi_tutorial_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before starting FastAPI
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
