---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for Chef Automate and Chef Infra Server
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/chef-server
        - /tmp/molecule_test/etc/systemd/system

    # Create mock config.toml file
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          # Chef Automate configuration file
          [global]
            v1 = true
          [deployment]
            automate = true
            infra_server = true
          [load_balancer]
            v1 = true
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"

