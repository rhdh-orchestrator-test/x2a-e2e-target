---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
  register: download_result
- name: Ensure directory for Chef Automate CLI exists
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path | dirname }}"
    state: directory
    mode: "0755"
  when: chef_automate_cli_path | dirname != '.'
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: "{{ download_result.dest }}"
    dest: "{{ chef_automate_cli_path | dirname }}"
    remote_src: true
    creates: "{{ chef_automate_cli_path }}"
  when: download_result.changed
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
  when: download_result.changed
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product automate --product infra-server --accept-terms-and-mlsa={{ accept_terms_and_mlsa | lower }}"
  become: true
  args:
    creates: /etc/chef-automate/config.toml
