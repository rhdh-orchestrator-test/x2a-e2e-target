---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Database authentication credential currently hardcoded in the Chef recipe and rendered into the FastAPI environment file; migrate the password 
      to Ansible Vault or an approved external secret provider.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL user used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi user; store in protected AAP credential storage and do not expose in logs.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname of the PostgreSQL service, currently localhost.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application, currently fastapi_db.
      required:
        - db_username
        - db_password
        - db_host
        - db_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_host: !unsafe "{{ db_host }}"
        db_name: !unsafe "{{ db_name }}"
