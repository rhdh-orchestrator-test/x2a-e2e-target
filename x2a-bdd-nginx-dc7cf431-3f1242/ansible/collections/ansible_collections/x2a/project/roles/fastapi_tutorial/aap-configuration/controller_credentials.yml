---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Database authentication credential currently hardcoded in the Chef recipe and rendered into the FastAPI environment file; migrate the password 
      to Ansible Vault or an approved external secret provider.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      db_host: "{{ db_host }}"
      db_name: "{{ db_name }}"
