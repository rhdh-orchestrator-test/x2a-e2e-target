---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Check whether the SSH daemon configuration exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Render fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Set UFW default policy
  ansible.builtin.command:
    cmd: ufw --force default deny
    creates: /etc/ufw/user.rules
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Allow required UFW services  # noqa: R101 - service names come from the role-defined allowlist
  ansible.builtin.command:
    cmd: "ufw allow {{ item_nginx_multisite['service'] }}"
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Skipping' not in ufw_allow_result.stdout"
  register: ufw_allow_result
  loop:
    - service: ssh
    - service: http
    - service: https
  loop_control:
    loop_var: item_nginx_multisite

- name: Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false

- name: Render sysctl security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Apply nginx multisite sysctl settings

- name: Apply kernel security settings
  ansible.posix.sysctl:
    name: "{{ item_nginx_multisite['name'] }}"
    value: "{{ item_nginx_multisite['value'] }}"
    sysctl_file: /etc/sysctl.d/99-security.conf
    sysctl_set: true
    reload: false
    state: present
  loop:
    - name: net.ipv4.conf.default.rp_filter
      value: "1"
    - name: net.ipv4.conf.all.rp_filter
      value: "1"
    - name: net.ipv4.conf.all.accept_redirects
      value: "0"
    - name: net.ipv6.conf.all.accept_redirects
      value: "0"
    - name: net.ipv4.conf.default.accept_redirects
      value: "0"
    - name: net.ipv6.conf.default.accept_redirects
      value: "0"
    - name: net.ipv4.conf.all.send_redirects
      value: "0"
    - name: net.ipv4.conf.default.send_redirects
      value: "0"
    - name: net.ipv4.conf.all.accept_source_route
      value: "0"
    - name: net.ipv6.conf.all.accept_source_route
      value: "0"
    - name: net.ipv4.conf.default.accept_source_route
      value: "0"
    - name: net.ipv6.conf.default.accept_source_route
      value: "0"
    - name: net.ipv4.conf.all.log_martians
      value: "1"
    - name: net.ipv4.conf.default.log_martians
      value: "1"
    - name: net.ipv4.icmp_echo_ignore_all
      value: "1"
    - name: net.ipv4.icmp_echo_ignore_broadcasts
      value: "1"
    - name: net.ipv6.conf.all.disable_ipv6
      value: "1"
    - name: net.ipv6.conf.default.disable_ipv6
      value: "1"
    - name: net.ipv6.conf.lo.disable_ipv6
      value: "1"
    - name: net.ipv4.tcp_syncookies
      value: "1"
    - name: net.ipv4.tcp_max_syn_backlog
      value: "2048"
    - name: net.ipv4.tcp_synack_retries
      value: "2"
    - name: net.ipv4.tcp_syn_retries
      value: "5"
  loop_control:
    loop_var: item_nginx_multisite
  notify: Apply nginx multisite sysctl settings

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    create: false
    backup: true
  when:
    - nginx_multisite_ssh_disable_root | bool
    - nginx_multisite_sshd_config.stat.exists # noqa: L039 - registered by the preceding stat task
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    create: false
    backup: true
  when:
    - not nginx_multisite_ssh_password_auth | bool
    - nginx_multisite_sshd_config.stat.exists # noqa: L039 - registered by the preceding stat task
  notify: Restart SSH
