---
controller_credential_types:
  - name: Redis Authentication
    description: Credential used to authenticate clients to the Redis server listening on TCP port 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis for authenticated client connections; store it in Ansible Vault and use it when rendering the Redis 
            configuration.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
