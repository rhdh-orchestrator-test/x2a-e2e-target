---
# Unsupported pre-flight checks: firewall rule output, SSH/fail2ban configuration values,
# kernel sysctl values, and socket listings have no explicit expected result in the plan.
- name: Verify nginx multisite pre-flight checks
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert pre-flight packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        loop:
          - nginx
          - fail2ban
          - ufw
          - openssl
          - ca-certificates
        loop_control:
          loop_var: item_package
        fail_msg: Required pre-flight package is not installed

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are running
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts['services'].get(item_service, ansible_facts['services'].get(item_service ~ '.service', {})).get('state')
            == 'running'
        loop:
          - nginx
          - fail2ban
        loop_control:
          loop_var: item_service
        fail_msg: Required service is not running

    - name: Assert an SSH service is running
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts['services'].get('ssh.service', {}).get('state') == 'running') or
            (ansible_facts['services'].get('sshd.service', {}).get('state') == 'running')
        fail_msg: Neither ssh nor sshd is running

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - item_nginx_test['rc'] == 0
        fail_msg: nginx configuration validation failed

    - name: Check paths from the pre-flight file checks
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      loop:
        - {path: /etc/nginx/nginx.conf, kind: file}
        - {path: /etc/nginx/conf.d/security.conf, kind: file}
        - {path: /etc/nginx/sites-available/test.cluster.local, kind: file}
        - {path: /etc/nginx/sites-available/ci.cluster.local, kind: file}
        - {path: /etc/nginx/sites-available/status.cluster.local, kind: file}
        - {path: /etc/nginx/sites-enabled/test.cluster.local, kind: link}
        - {path: /etc/nginx/sites-enabled/ci.cluster.local, kind: link}
        - {path: /etc/nginx/sites-enabled/status.cluster.local, kind: link}
        - {path: /opt/server/test, kind: directory}
        - {path: /opt/server/test/index.html, kind: file}
        - {path: /opt/server/ci, kind: directory}
        - {path: /opt/server/ci/index.html, kind: file}
        - {path: /opt/server/status, kind: directory}
        - {path: /opt/server/status/index.html, kind: file}
        - {path: /etc/ssl/certs/test.cluster.local.crt, kind: file}
        - {path: /etc/ssl/private/test.cluster.local.key, kind: file}
        - {path: /etc/ssl/certs/ci.cluster.local.crt, kind: file}
        - {path: /etc/ssl/private/ci.cluster.local.key, kind: file}
        - {path: /etc/ssl/certs/status.cluster.local.crt, kind: file}
        - {path: /etc/ssl/private/status.cluster.local.key, kind: file}
        - {path: /etc/fail2ban/jail.local, kind: file}
        - {path: /etc/sysctl.d/99-security.conf, kind: file}
        - {path: /etc/ssh/sshd_config, kind: file}
        - {path: /var/log/nginx/access.log, kind: file}
        - {path: /var/log/nginx/error.log, kind: file}
        - {path: /var/log/nginx/test.cluster.local_access.log, kind: file}
        - {path: /var/log/nginx/test.cluster.local_error.log, kind: file}
        - {path: /var/log/nginx/ci.cluster.local_access.log, kind: file}
        - {path: /var/log/nginx/ci.cluster.local_error.log, kind: file}
        - {path: /var/log/nginx/status.cluster.local_access.log, kind: file}
        - {path: /var/log/nginx/status.cluster.local_error.log, kind: file}
        - {path: /var/log/auth.log, kind: file}
      loop_control:
        loop_var: item_path
      register: item_path_checks

    - name: Assert pre-flight paths exist with the requested type
      ansible.builtin.assert:
        that:
          - item_path_check['stat']['exists']
          - >-
            (item_path_check['item']['kind'] == 'file' and item_path_check['stat']['isreg']) or
            (item_path_check['item']['kind'] == 'directory' and item_path_check['stat']['isdir']) or
            (item_path_check['item']['kind'] == 'link' and item_path_check['stat']['islnk'])
        loop: "{{ item_path_checks['results'] }}"
        loop_control:
          loop_var: item_path_check
        fail_msg: A pre-flight path is missing or has the wrong type

    - name: Check that the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_site

    - name: Assert that the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_site['stat']['exists']
        fail_msg: The default nginx site exists

    - name: Check TLS private-key metadata
      ansible.builtin.stat:
        path: "{{ item_key_path }}"
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key_path
      register: item_key_stats

    - name: Assert TLS private keys have the expected metadata
      ansible.builtin.assert:
        that:
          - item_key_stat['stat']['pw_name'] == 'root'
          - item_key_stat['stat']['gr_name'] == 'ssl-cert'
          - item_key_stat['stat']['mode'] == '0640'
        loop: "{{ item_key_stats['results'] }}"
        loop_control:
          loop_var: item_key_stat
        fail_msg: A TLS private key has unexpected ownership or mode

    - name: Check HTTP and HTTPS behavior for each site
      ansible.builtin.uri:
        url: "{{ item_endpoint['url'] }}"
        headers:
          Host: "{{ item_endpoint['host'] }}"
        validate_certs: false
        follow_redirects: none
        return_content: false
        status_code: "{{ item_endpoint['status'] }}"
      loop:
        - {url: http://127.0.0.1/, host: test.cluster.local, status: 301}
        - {url: https://127.0.0.1/, host: test.cluster.local, status: 200}
        - {url: http://127.0.0.1/, host: ci.cluster.local, status: 301}
        - {url: https://127.0.0.1/, host: ci.cluster.local, status: 200}
        - {url: http://127.0.0.1/, host: status.cluster.local, status: 301}
        - {url: https://127.0.0.1/, host: status.cluster.local, status: 200}
      loop_control:
        loop_var: item_endpoint

    - name: Inspect certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
      loop:
        - {path: /etc/ssl/certs/test.cluster.local.crt, name: test.cluster.local}
        - {path: /etc/ssl/certs/ci.cluster.local.crt, name: ci.cluster.local}
        - {path: /etc/ssl/certs/status.cluster.local.crt, name: status.cluster.local}
      loop_control:
        loop_var: item_certificate
      register: item_certificate_subjects
      changed_when: false

    - name: Assert certificate subjects contain exact site names
      ansible.builtin.assert:
        that:
          - item_certificate_subject['stdout'] is search(item_certificate_subject['item']['name'])
        loop: "{{ item_certificate_subjects['results'] }}"
        loop_control:
          loop_var: item_certificate_subject
        fail_msg: A certificate subject does not contain its site name
