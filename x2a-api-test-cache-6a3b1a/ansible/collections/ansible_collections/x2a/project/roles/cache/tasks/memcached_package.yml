---
- name: Install Memcached package
  ansible.builtin.package:
    name: "{{ cache_memcached_package_name }}"
    state: present

- name: Create Memcached system group
  ansible.builtin.group:
    name: "{{ cache_memcached_group }}"
    system: true
    state: present

- name: Create locked Memcached system user
  ansible.builtin.user:
    name: "{{ cache_memcached_user }}"
    system: true
    create_home: false
    group: "{{ cache_memcached_group }}"
    home: /nonexistent
    comment: Memcached
    shell: /bin/false
    password_lock: true
    state: present

- name: Create Memcached log directory
  ansible.builtin.file:
    path: "{{ cache_memcached_log_directory }}" # noqa: R114 - path is a role-defined default
    owner: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_group }}"
    mode: "0755"
    state: directory

- name: Create Memcached runtime directory
  ansible.builtin.file:
    path: /var/run/memcached
    owner: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_group }}"
    mode: "0755"
    state: directory
