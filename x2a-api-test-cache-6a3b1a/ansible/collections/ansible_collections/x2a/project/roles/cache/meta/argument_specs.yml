---
argument_specs:
  main:
    short_description: Install and configure Memcached and Redis cache services
    description:
      - Configures a Memcached instance and delegates Redis deployment to the eloy.redis collection role.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to hide Redis credential handling task output.
      cache_memcached_package_name:
        type: str
        required: false
        default: memcached
        description: Memcached package name.
      cache_memcached_service_name:
        type: str
        required: false
        default: memcached
        description: Memcached systemd service name.
      cache_memcached_user:
        type: str
        required: false
        default: memcached
        description: Memcached service account.
      cache_memcached_group:
        type: str
        required: false
        default: memcached
        description: Memcached service group.
      cache_memcached_version:
        type: str
        required: false
        default:
        description: Optional Memcached package version.
      cache_memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory allocation in megabytes.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      cache_memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      cache_memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      cache_memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached connections.
      cache_memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      cache_memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Experimental Memcached command-line options.
      cache_memcached_extra_cli_options:
        type: str
        required: false
        default: ""
        description: Additional Memcached command-line options.
      cache_memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached open-file limit.
      cache_memcached_threads:
        type: int
        required: false
        default: 4
        description: Number of Memcached worker threads.
      cache_memcached_log_directory:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log directory.
      cache_memcached_binary:
        type: str
        required: false
        default: /usr/bin/memcached
        description: Memcached executable path.
      cache_memcached_systemd_unit:
        type: str
        required: false
        default: /etc/systemd/system/memcached.service
        description: Memcached systemd unit path.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      cache_redis_pid_directory:
        type: str
        required: false
        default: /run/redis
        description: Redis PID directory.
