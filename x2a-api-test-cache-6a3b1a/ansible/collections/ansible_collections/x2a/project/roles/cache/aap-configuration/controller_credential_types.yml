---
controller_credential_types:
  - name: Redis Authentication
    description: Hardcoded Redis password used to require authentication for the Redis server.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis clients to authenticate with the Redis server.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
