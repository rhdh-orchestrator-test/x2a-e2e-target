---
controller_credential_types:
  - name: Redis Authentication Password
    description: Redis server authentication credential for port 6379
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Authentication password for Redis server on port 6379. Clients must use this password with the AUTH command to connect.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
