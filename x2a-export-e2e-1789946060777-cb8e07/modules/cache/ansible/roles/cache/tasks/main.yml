---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install memcached packages
  ansible.builtin.package:
    name: "{{ cache_memcached_packages }}"
    state: present
- name: Install Redis packages
  ansible.builtin.package:
    name: "{{ cache_redis_packages }}"
    state: present
- name: Ensure Redis group exists
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    state: present
- name: Ensure Redis user exists
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present
- name: Create Redis configuration directory
  ansible.builtin.file:
    path: "{{ cache_redis_config_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Create Redis data directory
  ansible.builtin.file:
    path: /var/lib/redis
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
- name: Create Redis runtime directory
  ansible.builtin.file:
    path: /var/run/redis
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}"
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    recurse: true
- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}"
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0640"
    backup: true
  notify: Restart redis
- name: Remove deprecated Redis configuration settings
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}"
    regexp: ^{{ item_cache }}.*$
    state: absent
  loop: "{{ cache_redis_deprecated_settings }}"
  loop_control:
    loop_var: item_cache
  notify: Restart redis
- name: Start and enable memcached service
  ansible.builtin.service:
    name: "{{ cache_memcached_service_name }}"
    state: started
    enabled: true
- name: Start and enable Redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service_name }}"
    state: started
    enabled: true
