- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create required directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/home/ansible
    - /tmp/molecule_test/etc/chef-automate
    - '{{ ''/tmp/molecule_test'' + (chef_automate_user_key_file | expanduser | dirname) }}'
    - '{{ ''/tmp/molecule_test'' + (chef_automate_org_validator_file | expanduser | dirname) }}'
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create vm.max_map_count file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_max_map_count }}'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create vm.dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_dirty_expire_centisecs }}'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI binary
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI v1.0.0"

        echo "This is a mock Chef Automate CLI for testing"

        '
      dest: /tmp/molecule_test/home/ansible/chef-automate
      mode: '0755'
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "# Mock Chef Automate config file\n[global]\n  v1 = true\n[automate]\n  enabled = true\n[infra-server]\n  enabled = true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create mock chef-server-ctl command
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Server Control v1.0.0"

        echo "This is a mock chef-server-ctl for testing"

        '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAv8Jkl5uUDEcqOlHjc+JIW/n095+mGnC7MYdkgD0xSZQeOHTP

        [... mock key content ...]

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/ansible/admin.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAv8Jkl5uUDEcqOlHjc+JIW/n095+mGnC7MYdkgD0xSZQeOHTP

        [... mock key content ...]

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/ansible/lab-validator.pem
      mode: '0600'
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_username: admin
    chef_automate_org_name: lab
    chef_automate_user_key_file: ~/admin.pem
    chef_automate_org_validator_file: ~/lab-validator.pem
