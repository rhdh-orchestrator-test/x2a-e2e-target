- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is correctly set
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname is not set correctly
      success_msg: Hostname is set correctly
    when: hostname_file.stat.exists
  - name: Check vm.max_map_count file
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_file
  - name: Assert vm.max_map_count file exists
    ansible.builtin.assert:
      that:
      - max_map_count_file.stat.exists
      - max_map_count_file.stat.isreg
      fail_msg: vm.max_map_count file not found
      success_msg: vm.max_map_count file exists
  - name: Get vm.max_map_count content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_content
    when: max_map_count_file.stat.exists
  - name: Assert vm.max_map_count is correctly set
    ansible.builtin.assert:
      that:
      - (max_map_count_content.content | b64decode | trim) == "262144"
      fail_msg: vm.max_map_count is not set correctly
      success_msg: vm.max_map_count is set correctly
    when: max_map_count_file.stat.exists
  - name: Check vm.dirty_expire_centisecs file
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_file
  - name: Assert vm.dirty_expire_centisecs file exists
    ansible.builtin.assert:
      that:
      - dirty_expire_centisecs_file.stat.exists
      - dirty_expire_centisecs_file.stat.isreg
      fail_msg: vm.dirty_expire_centisecs file not found
      success_msg: vm.dirty_expire_centisecs file exists
  - name: Get vm.dirty_expire_centisecs content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_content
    when: dirty_expire_centisecs_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is correctly set
    ansible.builtin.assert:
      that:
      - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
      fail_msg: vm.dirty_expire_centisecs is not set correctly
      success_msg: vm.dirty_expire_centisecs is set correctly
    when: dirty_expire_centisecs_file.stat.exists
  - name: Check Chef Automate CLI
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check chef-server-ctl
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/chef-server-ctl
    register: chef_server_ctl
  - name: Assert chef-server-ctl exists and is executable
    ansible.builtin.assert:
      that:
      - chef_server_ctl.stat.exists
      - chef_server_ctl.stat.executable
      fail_msg: chef-server-ctl not found or not executable
      success_msg: chef-server-ctl exists and is executable
  - name: Check Chef Automate config file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: chef_automate_config
  - name: Assert Chef Automate config file exists
    ansible.builtin.assert:
      that:
      - chef_automate_config.stat.exists
      - chef_automate_config.stat.isreg
      fail_msg: Chef Automate config file not found
      success_msg: Chef Automate config file exists
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/admin.pem
    register: user_key_file
  - name: Assert user key file exists with correct permissions
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.isreg
      - user_key_file.stat.mode == "0600"
      fail_msg: User key file not found or has incorrect permissions
      success_msg: User key file exists with correct permissions
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/lab-validator.pem
    register: org_validator_file
  - name: Assert organization validator key file exists with correct permissions
    ansible.builtin.assert:
      that:
      - org_validator_file.stat.exists
      - org_validator_file.stat.isreg
      - org_validator_file.stat.mode == "0600"
      fail_msg: Organization validator key file not found or has incorrect permissions
      success_msg: Organization validator key file exists with correct permissions
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: chef-automate status
    register: chef_automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate services are running
    ansible.builtin.assert:
      that:
      - chef_automate_status.rc == 0
      fail_msg: Chef Automate services are not running
      success_msg: Chef Automate services are running
    tags: molecule-notest
  - name: Check if port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is succeeded
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
  - name: Check Chef Automate API
    ansible.builtin.uri:
      url: https://localhost/api/v0/status
      validate_certs: false
    register: api_check
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate API is accessible
    ansible.builtin.assert:
      that:
      - api_check is succeeded
      fail_msg: Chef Automate API is not accessible
      success_msg: Chef Automate API is accessible
    tags: molecule-notest
