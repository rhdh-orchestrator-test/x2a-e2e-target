---
- name: Ensure key file directories exist
  ansible.builtin.file:
    path: "{{ item | expanduser | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_key_file }}"
    - "{{ chef_automate_org_validator_file }}"
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Fail if chef-server-ctl is not available
  ansible.builtin.fail:
    msg: chef-server-ctl command not found. Ensure Chef Infra Server is properly installed.
  when: chef_server_ctl_check.rc != 0
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_username }} {{ chef_automate_full_name | quote }} {{ chef_automate_email | quote }} {{
      chef_automate_password | quote }} --filename {{ chef_automate_user_key_file | expanduser }}
    creates: "{{ chef_automate_user_key_file | expanduser }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org_name }} {{ chef_automate_org_full_name | quote }} --association_user {{ chef_automate_username }}
      --filename {{ chef_automate_org_validator_file | expanduser }}
    creates: "{{ chef_automate_org_validator_file | expanduser }}"
  become: true
- name: Set proper permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_automate_user_key_file | expanduser }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  become: true
- name: Set proper permissions on organization validator key file
  ansible.builtin.file:
    path: "{{ chef_automate_org_validator_file | expanduser }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  become: true
