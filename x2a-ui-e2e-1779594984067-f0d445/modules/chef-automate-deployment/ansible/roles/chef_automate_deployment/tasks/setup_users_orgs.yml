---
- name: Ensure directory exists for PEM files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_pem_file }}"
    - "{{ chef_automate_org_pem_file }}"
  when: chef_automate_user_pem_file | dirname != '.' or chef_automate_org_pem_file | dirname != '.'
- name: Create Chef Infra Server user
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl user-create {{ username }} {{ first_name }} {{ last_name }}  {{ email }} "{{ password }}" --filename {{ chef_automate_user_pem_file
      }}

      '
  args:
    creates: "{{ chef_automate_user_pem_file }}"
  register: user_create_result
  changed_when: user_create_result.rc == 0
  no_log: true
- name: Create Chef Infra Server organization
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl org-create {{ chef_automate_org_name }}  "{{ chef_automate_org_long_name }}" --association_user {{ username }}  --filename {{ chef_automate_org_pem_file
      }}

      '
  args:
    creates: "{{ chef_automate_org_pem_file }}"
  register: org_create_result
  changed_when: org_create_result.rc == 0
- name: Set permissions on PEM files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "{{ chef_automate_pem_file_mode }}"
    state: file
  loop:
    - "{{ chef_automate_user_pem_file }}"
    - "{{ chef_automate_org_pem_file }}"
  when: user_create_result.changed or org_create_result.changed
