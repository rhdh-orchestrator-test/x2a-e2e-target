---
- name: Check if Chef Infra Server is already deployed
  ansible.builtin.stat:
    path: /etc/chef-server/chef-server.rb
  register: chef_server_config
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: sudo {{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }}
  register: deploy_result
  changed_when: deploy_result.rc == 0
  when: not chef_server_config.stat.exists
- name: Display deployment output
  ansible.builtin.debug:
    var: deploy_result.stdout_lines
  when: deploy_result.stdout_lines is defined
