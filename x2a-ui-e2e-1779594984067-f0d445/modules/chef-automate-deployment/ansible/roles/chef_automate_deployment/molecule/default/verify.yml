- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    chef_automate_org_name: lab
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found or empty
      success_msg: Hostname file exists and has content
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname is not set correctly
      success_msg: Hostname is set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl configuration file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Sysctl configuration file not found or empty
      success_msg: Sysctl configuration file exists and has content
  - name: Get sysctl content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl parameters are set correctly
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: Sysctl parameters are not set correctly
      success_msg: Sysctl parameters are set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate config file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: chef_automate_config
  - name: Assert Chef Automate config exists
    ansible.builtin.assert:
      that:
      - chef_automate_config.stat.exists
      - chef_automate_config.stat.size > 0
      fail_msg: Chef Automate config file not found or empty
      success_msg: Chef Automate config file exists and has content
  - name: Check Chef Server config file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-server/chef-server.rb
    register: chef_server_config
  - name: Assert Chef Server config exists
    ansible.builtin.assert:
      that:
      - chef_server_config.stat.exists
      - chef_server_config.stat.size > 0
      fail_msg: Chef Server config file not found or empty
      success_msg: Chef Server config file exists and has content
  - name: Check user PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ username }}.pem
    register: user_pem
  - name: Assert user PEM file exists with correct permissions
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.size > 0
      - user_pem.stat.mode == "0600"
      fail_msg: User PEM file not found, empty, or has incorrect permissions
      success_msg: User PEM file exists with correct content and permissions
  - name: Check organization validator PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ chef_automate_org_name }}-validator.pem
    register: org_pem
  - name: Assert organization validator PEM file exists with correct permissions
    ansible.builtin.assert:
      that:
      - org_pem.stat.exists
      - org_pem.stat.size > 0
      - org_pem.stat.mode == "0600"
      fail_msg: Organization validator PEM file not found, empty, or has incorrect permissions
      success_msg: Organization validator PEM file exists with correct content and permissions
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: chef_automate_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - chef_automate_status.rc == 0
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Server status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: chef_server_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Server is running
    ansible.builtin.assert:
      that:
      - chef_server_status.rc == 0
      fail_msg: Chef Server is not running
      success_msg: Chef Server is running
    tags: molecule-notest
  - name: Check user creation
    ansible.builtin.command:
      cmd: sudo chef-server-ctl user-list
    register: user_list
    changed_when: false
    tags: molecule-notest
  - name: Assert user was created
    ansible.builtin.assert:
      that:
      - '''{{ username }}'' in user_list.stdout'
      fail_msg: User {{ username }} not found
      success_msg: User {{ username }} exists
    tags: molecule-notest
  - name: Check organization creation
    ansible.builtin.command:
      cmd: sudo chef-server-ctl org-list
    register: org_list
    changed_when: false
    tags: molecule-notest
  - name: Assert organization was created
    ansible.builtin.assert:
      that:
      - '''{{ chef_automate_org_name }}'' in org_list.stdout'
      fail_msg: Organization {{ chef_automate_org_name }} not found
      success_msg: Organization {{ chef_automate_org_name }} exists
    tags: molecule-notest
  - name: Check Chef Automate web UI
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
    register: automate_api
    tags: molecule-notest
  - name: Assert Chef Automate API is accessible
    ansible.builtin.assert:
      that:
      - automate_api.status == 200
      fail_msg: Chef Automate API is not accessible
      success_msg: Chef Automate API is accessible
    tags: molecule-notest
  - name: Check Chef Infra Server API
    ansible.builtin.uri:
      url: https://localhost/organizations
      validate_certs: false
    register: infra_api
    tags: molecule-notest
  - name: Assert Chef Infra Server API is accessible
    ansible.builtin.assert:
      that:
      - infra_api.status == 200
      fail_msg: Chef Infra Server API is not accessible
      success_msg: Chef Infra Server API is accessible
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
