---
argument_specs:
  main:
    short_description: Configure a secure nginx multisite installation
    description:
      - Installs nginx, fail2ban, UFW, and TLS support for three HTTPS virtual hosts.
      - Applies SSH and kernel hardening and deploys static site content.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            content_source: test/index.html
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            content_source: ci/index.html
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            content_source: status/index.html
            ssl_enabled: true
        description: Site definitions including document roots, content sources, and TLS settings.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory in which site certificates are stored.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory in which site private keys are stored.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login.
      nginx_multisite_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
