---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload security sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-security.conf
  changed_when: true

- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
