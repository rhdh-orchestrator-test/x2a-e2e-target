---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Ensure fail2ban is enabled and started
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started

- name: Configure fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  notify: Restart fail2ban

- name: Check UFW status
  ansible.builtin.command: ufw status
  changed_when: false
  register: nginx_multisite_ufw_status

- name: Set UFW default incoming policy
  ansible.builtin.command: ufw --force default deny
  when: "'Default: deny' not in nginx_multisite_ufw_status.stdout"

- name: Allow SSH through UFW
  ansible.builtin.command: ufw allow ssh
  when: "'22/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTP through UFW
  ansible.builtin.command: ufw allow http
  when: "'80/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTPS through UFW
  ansible.builtin.command: ufw allow https
  when: "'443/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Enable UFW
  ansible.builtin.command: ufw --force enable
  when: "'Status: active' not in nginx_multisite_ufw_status.stdout"

- name: Render kernel security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Check SSH daemon configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    state: present
    create: false
    backup: true
  when:
    - nginx_multisite_disable_root_login
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    state: present
    create: false
    backup: true
  when:
    - not nginx_multisite_password_auth
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd
