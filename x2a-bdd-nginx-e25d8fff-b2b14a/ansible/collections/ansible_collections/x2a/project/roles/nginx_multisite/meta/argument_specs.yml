---
argument_specs:
  main:
    short_description: Install and configure a secure Nginx multisite server
    description:
      - Deploys Nginx, Fail2ban, firewall rules, SSH hardening, self-signed certificates, and HTTPS virtual hosts.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Nginx sites and their document-root and SSL settings.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for site certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and enable Fail2ban.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and enable UFW.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_certificate_email:
        type: str
        required: false
        default: admin@example.com
        description: Email address embedded in generated certificate subjects.
