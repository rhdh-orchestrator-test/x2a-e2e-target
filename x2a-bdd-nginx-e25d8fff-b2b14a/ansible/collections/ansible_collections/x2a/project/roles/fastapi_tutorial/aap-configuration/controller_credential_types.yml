---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the local PostgreSQL database used by the FastAPI application.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; used to authenticate the application and must be rotated from the hardcoded source value.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database owned and accessed by the application.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL connection; the source uses localhost.
        - id: database_port
          type: string
          label: Database Port
          help_text: PostgreSQL connection port; the source uses the default port 5432.
      required:
        - db_username
        - db_password
        - database_name
        - database_host
        - database_port
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
        database_port: !unsafe "{{ database_port }}"
