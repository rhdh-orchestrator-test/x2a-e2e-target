---
argument_specs:
  main:
    short_description: Deploy and configure the FastAPI tutorial application
    description:
      - Installs the FastAPI tutorial application and its system dependencies.
      - Configures PostgreSQL, the application environment, and a systemd service.
    options:
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress task output when handling the database password.
      fastapi_tutorial_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
        description: System packages required by the application.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_db_user:
        type: str
        required: false
        default: fastapi
        description: Default PostgreSQL application role name.
      fastapi_tutorial_db_name:
        type: str
        required: false
        default: fastapi_db
        description: Default PostgreSQL database name.
      fastapi_tutorial_app_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by Uvicorn.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_service_file:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Path to the systemd unit file.
      db_username:
        type: str
        required: true
        description: PostgreSQL username injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: PostgreSQL password injected by an AAP credential type.
      database_name:
        type: str
        required: true
        description: PostgreSQL database name injected by an AAP credential type.
      database_host:
        type: str
        required: true
        description: PostgreSQL host injected by an AAP credential type.
      database_port:
        type: str
        required: true
        description: PostgreSQL port injected by an AAP credential type.
