---
argument_specs:
  main:
    short_description: Configure Redis cache service
    description:
      - Installs and configures a standalone Redis cache service using the approved Redis collection.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks that handle the Redis password.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port used by Redis.
      cache_redis_version:
        type: str
        required: false
        default: "7.2"
        description: Redis version to install.
      cache_redis_install_method:
        type: str
        required: false
        default: package
        description: Redis installation method.
      cache_redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis replication is enabled.
      cache_redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis clustering is enabled.
      cache_redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis Sentinel is enabled.
      cache_redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Whether Redis RDB persistence is enabled.
