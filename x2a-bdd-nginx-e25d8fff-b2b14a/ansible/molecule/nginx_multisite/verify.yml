# Unsupported pre-flight checks: dpkg-query package output, readlink targets, and journalctl log review
# have no explicit expected result in the migration plan; certificate validity details are not
# safely asserted here beyond the explicitly stated successful certificate inspection.
---
- name: Verify nginx multisite pre-flight checks
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Gather service facts for nginx and fail2ban checks
      ansible.builtin.service_facts:

    - name: Assert nginx is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts['services']['nginx.service']['status'] == 'enabled'"
          - "ansible_facts['services']['nginx.service']['state'] == 'running'"
        fail_msg: Nginx must be enabled and active.

    - name: Assert fail2ban is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts['services']['fail2ban.service']['status'] == 'enabled'"
          - "ansible_facts['services']['fail2ban.service']['state'] == 'running'"
        fail_msg: Fail2ban must be enabled and active.

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Check HTTP and HTTPS listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listener['port'] }}"
        state: started
        timeout: 5
      loop:
        - port: 80
        - port: 443
      loop_control:
        loop_var: item_listener

    - name: Check SSH listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 22
        state: started
        timeout: 5

    - name: Check UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: ufw_status
      changed_when: false

    - name: Assert UFW is active with a deny incoming policy
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status.stdout"
          - "'Default: deny (incoming)' in ufw_status.stdout"
        fail_msg: UFW must be active and deny incoming traffic by default.

    - name: Check UFW numbered rules
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - numbered
      register: ufw_rules
      changed_when: false

    - name: Assert UFW allows SSH, HTTP, and HTTPS
      ansible.builtin.assert:
        that:
          - "'22' in ufw_rules.stdout"
          - "'80' in ufw_rules.stdout"
          - "'443' in ufw_rules.stdout"
        fail_msg: UFW must allow SSH, HTTP, and HTTPS.

    - name: Check fail2ban jail file
      ansible.builtin.stat:
        path: /etc/fail2ban/jail.local
      register: fail2ban_jail

    - name: Assert fail2ban jail file exists
      ansible.builtin.assert:
        that:
          - fail2ban_jail.stat.exists
          - fail2ban_jail.stat.isreg
        fail_msg: The fail2ban jail file must exist.

    - name: Check fail2ban status
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
      changed_when: false

    - name: Check SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config

    - name: Assert SSH root login and password authentication are disabled
      ansible.builtin.assert:
        that:
          - "(sshd_config.content | b64decode) is regex('(?m)^[[:space:]]*PermitRootLogin[[:space:]]+no')"
          - "(sshd_config.content | b64decode) is regex('(?m)^[[:space:]]*PasswordAuthentication[[:space:]]+no')"
        fail_msg: SSH must disable root login and password authentication.

    - name: Validate SSH daemon configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false

    - name: Check sysctl security configuration
      ansible.builtin.stat:
        path: /etc/sysctl.d/99-security.conf
      register: sysctl_security

    - name: Assert sysctl security configuration exists
      ansible.builtin.assert:
        that:
          - sysctl_security.stat.exists
          - sysctl_security.stat.isreg
        fail_msg: The sysctl security configuration must exist.

    - name: Apply the explicit sysctl pre-flight diagnostic
      ansible.builtin.command:
        argv:
          - sysctl
          - --system
      changed_when: false

    - name: Check required multisite files and directories
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      register: multisite_paths
      loop:
        - path: /etc/nginx/nginx.conf
        - path: /etc/nginx/conf.d/security.conf
        - path: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-available/status.cluster.local
        - path: /etc/nginx/sites-enabled/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
        - path: /opt/server/test
        - path: /opt/server/test/index.html
        - path: /opt/server/ci
        - path: /opt/server/ci/index.html
        - path: /opt/server/status
        - path: /opt/server/status/index.html
      loop_control:
        loop_var: item_path

    - name: Assert required multisite files and directories exist
      ansible.builtin.assert:
        that:
          - item_path_result.stat.exists
        fail_msg: A required multisite path must exist.
      loop: "{{ multisite_paths['results'] }}"
      loop_control:
        loop_var: item_path_result

    - name: Assert the default nginx site does not exist
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Verify the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site.stat.exists
        fail_msg: The default nginx site must not exist.

    - name: Check certificate and key files
      ansible.builtin.stat:
        path: "{{ item_tls['certificate'] }}"
      register: certificate_files
      loop:
        - certificate: /etc/ssl/certs/test.cluster.local.crt
          key: /etc/ssl/private/test.cluster.local.key
        - certificate: /etc/ssl/certs/ci.cluster.local.crt
          key: /etc/ssl/private/ci.cluster.local.key
        - certificate: /etc/ssl/certs/status.cluster.local.crt
          key: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_tls

    - name: Assert certificate files exist
      ansible.builtin.assert:
        that:
          - item_certificate.stat.exists
          - item_certificate.stat.isreg
        fail_msg: A required certificate file must exist.
      loop: "{{ certificate_files['results'] }}"
      loop_control:
        loop_var: item_certificate

    - name: Check TLS private key metadata
      ansible.builtin.stat:
        path: "{{ item_tls_key['key'] }}"
        get_checksum: false
      register: private_key_files
      loop:
        - key: /etc/ssl/private/test.cluster.local.key
        - key: /etc/ssl/private/ci.cluster.local.key
        - key: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_tls_key

    - name: Assert TLS private key ownership and mode
      ansible.builtin.assert:
        that:
          - item_private_key.stat.exists
          - item_private_key.stat.mode == '0640'
          - item_private_key.stat.pw_name == 'root'
          - item_private_key.stat.gr_name == 'ssl-cert'
        fail_msg: TLS private keys must be root-owned by ssl-cert with mode 0640.
      loop: "{{ private_key_files['results'] }}"
      loop_control:
        loop_var: item_private_key

    - name: Check HTTPS endpoints
      ansible.builtin.command:
        argv:
          - curl
          - -k
          - -I
          - --resolve
          - "{{ item_https['host'] }}:443:127.0.0.1"
          - "https://{{ item_https['host'] }}/"
      changed_when: false
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_https

    - name: Check HTTP endpoints
      ansible.builtin.command:
        argv:
          - curl
          - -I
          - -H
          - "Host: {{ item_http['host'] }}"
          - http://127.0.0.1/
      changed_when: false
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_http
