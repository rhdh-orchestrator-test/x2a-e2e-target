---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install cache service packages
  ansible.builtin.package:
    name:
      - "{{ cache_redis_package }}"
      - "{{ cache_memcached_package }}"
    state: present

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Ensure Redis configuration file exists
  ansible.builtin.file:
    path: "{{ cache_redis_config }}" # noqa: R114 - path is a role default, not user input
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Configure Redis authentication and port # noqa: L039 - redis_password is validated by the preceding credentials task
  ansible.builtin.blockinfile:
    path: "{{ cache_redis_config }}" # noqa: R114 - path is a role default, not user input
    marker: "# {mark} ANSIBLE MANAGED CACHE SETTINGS"
    block: |
      port {{ cache_redis_port }}
      requirepass {{ redis_password }}
  no_log: "{{ cache_secure_logging }}"

- name: Remove Redis replication directives # noqa: R115 - path is a role default and is required to remove directives from the configured Redis file
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config }}" # noqa: R114 - path is a role default, not user input
    regexp: "{{ item_cache_directive }}"
    state: absent
  loop:
    - ^replica-serve-stale-data.*$
    - ^replica-read-only.*$
    - ^repl-ping-replica-period.*$
    - ^client-output-buffer-limit.*$
    - ^replica-priority.*$
  loop_control:
    loop_var: item_cache_directive

- name: Enable and start Redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    enabled: true
    state: started

- name: Enable and start Memcached service
  ansible.builtin.service:
    name: "{{ cache_memcached_service }}"
    enabled: true
    state: started
