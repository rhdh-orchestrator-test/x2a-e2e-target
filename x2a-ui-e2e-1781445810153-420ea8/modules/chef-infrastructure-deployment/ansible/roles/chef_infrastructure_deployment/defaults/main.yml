---
chef_hostname: automate.chef.lab
chef_sysctl_params:
  vm.max_map_count: 262144
  vm.dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: ./chef-automate
chef_accept_terms_and_mlsa: true
chef_username: "{{ username | default('admin') }}"
chef_longusername: "{{ username | default('Admin User') }}"
chef_useremail: "{{ username | default('admin') }}@example.com"
chef_password: "{{ password | default('changeme') }}"
chef_orgname: "{{ organization | default('default') }}"
chef_longorgname: "{{ organization | default('Default Organization') }}"
chef_user_key_path: ~/{{ chef_username }}.pem
chef_org_key_path: ~/{{ chef_orgname }}-validator.pem
