---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_hostname }}"
  become: true
- name: Update /etc/hosts with hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: 127.0.0.1 {{ chef_hostname }}
    regexp: ^127.0.0.1
    state: present
  become: true
- name: Configure sysctl parameters for Chef
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ chef_sysctl_params | dict2items }}"
  become: true
- name: Install required packages
  ansible.builtin.package:
    name:
      - curl
      - gzip
      - sudo
    state: present
  become: true
