---
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_username }} {{ chef_longusername }} {{ chef_useremail }} "{{ chef_password }}" --filename {{ chef_user_key_path }}
  args:
    creates: "{{ chef_user_key_path }}"
  become: true
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_orgname }} "{{ chef_longorgname }}" --association_user {{ chef_username }} --filename {{ chef_org_key_path }}
  args:
    creates: "{{ chef_org_key_path }}"
  become: true
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
- name: Set proper permissions on key files
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  loop:
    - "{{ chef_user_key_path }}"
    - "{{ chef_org_key_path }}"
  when: chef_user_create.changed or chef_org_create.changed
  failed_when: false
