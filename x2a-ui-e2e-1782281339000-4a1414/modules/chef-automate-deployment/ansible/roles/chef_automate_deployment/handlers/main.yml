---
- name: Restart Chef Automate
  ansible.builtin.command:
    cmd: chef-automate restart
  become: true
  listen: restart chef-automate
  register: restart_automate_result
  changed_when: restart_automate_result.rc == 0
- name: Restart Chef Infra Server
  ansible.builtin.command:
    cmd: chef-server-ctl restart
  become: true
  listen: restart chef-server
  register: restart_server_result
  changed_when: restart_server_result.rc == 0
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_path }}
    stdin: "{{ download_result.dest }}"
  args:
    creates: "{{ chef_automate_cli_path }}"
  changed_when: true
  listen: Extract Chef Automate CLI
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
  changed_when: true
  listen: Make Chef Automate CLI executable
