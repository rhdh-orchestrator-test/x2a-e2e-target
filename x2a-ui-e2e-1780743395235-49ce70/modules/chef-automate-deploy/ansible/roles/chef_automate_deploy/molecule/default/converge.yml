- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    full_name: John Tonello
    email: jtonello@example.com
    password: molecule_test_password
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/usr/bin
  - name: Simulate unzip package installation
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/bin/unzip
      state: touch
      mode: '0755'
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/sh echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create chef-server-ctl command
    ansible.builtin.copy:
      content: '#!/bin/sh echo ''Chef Server CTL mock'' '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK USER KEY CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/tmp/jtonello.pem
      mode: '0600'
  - name: Create organization key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK ORG VALIDATOR KEY CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/tmp/lab-validator.pem
      mode: '0600'
  - name: Create Chef user list output
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/tmp/chef-user-list.txt
      mode: '0644'
  - name: Create Chef org list output
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/tmp/chef-org-list.txt
      mode: '0644'
