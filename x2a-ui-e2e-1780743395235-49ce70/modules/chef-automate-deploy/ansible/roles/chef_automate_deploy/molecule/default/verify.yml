- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check unzip executable
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/unzip
    register: unzip_executable
  - name: Assert unzip is installed
    ansible.builtin.assert:
      that:
      - unzip_executable.stat.exists
      - unzip_executable.stat.executable
      fail_msg: Unzip executable not found
      success_msg: Unzip executable found
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl config file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl configuration file not found
      success_msg: Sysctl configuration file exists
  - name: Get sysctl content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl settings are correct
    ansible.builtin.assert:
      that:
      - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
      - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = 20000')
      fail_msg: Sysctl settings not configured correctly
      success_msg: Sysctl settings configured correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.isreg
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Server CTL
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/chef-server-ctl
    register: chef_server_ctl
  - name: Assert Chef Server CTL exists and is executable
    ansible.builtin.assert:
      that:
      - chef_server_ctl.stat.exists
      - chef_server_ctl.stat.isreg
      - chef_server_ctl.stat.executable
      fail_msg: Chef Server CTL not found or not executable
      success_msg: Chef Server CTL exists and is executable
  - name: Check Chef Automate deployment marker
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert Chef Automate was deployed
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef Automate deployment marker not found
      success_msg: Chef Automate deployment marker exists
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/jtonello.pem
    register: user_key_file
  - name: Assert user key file exists with proper permissions
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.isreg
      - user_key_file.stat.mode == "0600"
      fail_msg: User key file not found or has incorrect permissions
      success_msg: User key file exists with proper permissions
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/lab-validator.pem
    register: org_key_file
  - name: Assert organization validator key exists with proper permissions
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.isreg
      - org_key_file.stat.mode == "0600"
      fail_msg: Organization validator key not found or has incorrect permissions
      success_msg: Organization validator key exists with proper permissions
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: chef_automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - chef_automate_status.rc == 0
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: chef_server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - chef_server_status.rc == 0
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Check if port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is succeeded
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
  - name: Check Chef Automate web UI
    ansible.builtin.uri:
      url: https://localhost
      validate_certs: false
      status_code: 200
    register: web_check
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate web UI is accessible
    ansible.builtin.assert:
      that:
      - web_check is succeeded
      fail_msg: Chef Automate web UI is not accessible
      success_msg: Chef Automate web UI is accessible
    tags: molecule-notest
