---
- name: Ensure directories exist for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_key_path }}"
    - "{{ chef_org_key_path }}"
  become: true
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Fail if chef-server-ctl is not available
  ansible.builtin.fail:
    msg: chef-server-ctl command not found. Ensure Chef Infra Server is installed.
  when: chef_server_ctl_check.rc != 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}"  --filename {{ chef_user_key_path }}

      '
  args:
    creates: "{{ chef_user_key_path }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}"  --association_user {{ username }} --filename {{ chef_org_key_path }}

      '
  args:
    creates: "{{ chef_org_key_path }}"
  become: true
- name: Set permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_user_key_path }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  become: true
- name: Set permissions on organization key file
  ansible.builtin.file:
    path: "{{ chef_org_key_path }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  become: true
