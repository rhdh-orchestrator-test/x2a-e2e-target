---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Verify hostname configuration
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Verify hostname content
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Verify sysctl parameters
    - name: Check sysctl file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file was created
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Sysctl file not found"
        success_msg: "Sysctl file exists"

    - name: Get sysctl content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Verify sysctl content
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search("vm.max_map_count = 262144")
          - (sysctl_content.content | b64decode) is search("vm.dirty_expire_centisecs = 20000")
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Verify Chef Automate CLI
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI was downloaded
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Verify Chef Automate deployment
    - name: Check Chef Automate deployment marker
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: hab_dir

    - name: Assert Chef Automate was deployed
      ansible.builtin.assert:
        that:
          - hab_dir.stat.exists
          - hab_dir.stat.isdir
        fail_msg: "Chef Automate deployment marker not found"
        success_msg: "Chef Automate deployment marker exists"

    # Verify user PEM file
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/jtonello.pem
      register: user_pem

    - name: Assert user PEM file was created
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.size > 0
        fail_msg: "User PEM file not found"
        success_msg: "User PEM file exists"

    # Verify organization validator PEM file
    - name: Check organization validator PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/lab-validator.pem
      register: org_pem

    - name: Assert organization validator PEM file was created
      ansible.builtin.assert:
        that:
          - org_pem.stat.exists
          - org_pem.stat.size > 0
        fail_msg: "Organization validator PEM file not found"
        success_msg: "Organization validator PEM file exists"

    # The following checks would normally run on a real system but can't run in a container
    # They are tagged with molecule-notest to be skipped during molecule testing

    # Check Chef Automate status
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    # Check Chef Infra Server status
    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server is not running"
        success_msg: "Chef Infra Server is running"
      tags: molecule-notest

    # Check user and organization
    - name: Check user exists
      ansible.builtin.command:
        cmd: sudo chef-server-ctl user-list
      register: user_list
      changed_when: false
      tags: molecule-notest

    - name: Assert user was created
      ansible.builtin.assert:
        that:
          - "'jtonello' in user_list.stdout"
        fail_msg: "User not found"
        success_msg: "User exists"
      tags: molecule-notest

    - name: Check organization exists
      ansible.builtin.command:
        cmd: sudo chef-server-ctl org-list
      register: org_list
      changed_when: false
      tags: molecule-notest

    - name: Assert organization was created
      ansible.builtin.assert:
        that:
          - "'lab' in org_list.stdout"
        fail_msg: "Organization not found"
        success_msg: "Organization exists"
      tags: molecule-notest

    # Check web UI accessibility
    - name: Check web UI accessibility
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
      register: web_ui
      tags: molecule-notest

    - name: Assert web UI is accessible
      ansible.builtin.assert:
        that:
          - web_ui.status == 200
        fail_msg: "Web UI is not accessible"
        success_msg: "Web UI is accessible"
      tags: molecule-notest

    # Check port 443 is listening
    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      tags: molecule-notest