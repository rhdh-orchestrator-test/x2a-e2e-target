- name: Converge
  hosts: all
  gather_facts: true
  vars:
    user_password: molecule_test_password
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/home/ansible
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl parameters file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI'''
      dest: /tmp/molecule_test/home/ansible/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA...

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/ansible/jtonello.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA...

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/ansible/lab-validator.pem
      mode: '0600'
  - name: Create Chef Server status file
    ansible.builtin.copy:
      content: 'run: postgresql: running

        run: nginx: running

        run: oc_bifrost: running

        run: oc_id: running

        run: bookshelf: running

        run: opscode-erchef: running

        '
      dest: /tmp/molecule_test/home/ansible/chef-server-status.txt
      mode: '0644'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: automate-cs-bookshelf      Status: running

        Service: automate-cs-oc-bifrost     Status: running

        Service: automate-cs-oc-erchef      Status: running

        Service: automate-cs-nginx          Status: running

        Service: automate-cs-postgresql     Status: running

        '
      dest: /tmp/molecule_test/home/ansible/chef-automate-status.txt
      mode: '0644'
  - name: Create user list file
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/home/ansible/chef-user-list.txt
      mode: '0644'
  - name: Create organization list file
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/home/ansible/chef-org-list.txt
      mode: '0644'
