---
- name: Install cache service packages
  ansible.builtin.package:
    name:
      - "{{ cache_memcached_package }}"
      - "{{ cache_redis_package }}"
    state: present

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    recurse: true

- name: Configure Redis authentication
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default controlled by the operator
    regexp: ^requirepass\s+
    line: requirepass {{ cache_redis_password }}
    create: false
    backup: true
  when: cache_redis_password | length > 0
  no_log: "{{ cache_secure_logging }}"

- name: Remove unsupported Redis replica directives  # noqa: R115 - deletion is restricted to the operator-configured Redis file and only removes known replica directives
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default controlled by the operator; required to edit the configured Redis file
    regexp: ^{{ item_cache_directive }}.*$
    state: absent
    backup: true
  loop:
    - replica-serve-stale-data
    - replica-read-only
    - repl-ping-replica-period
    - client-output-buffer-limit
    - replica-priority
  loop_control:
    loop_var: item_cache_directive

- name: Enable and start Memcached
  ansible.builtin.service:
    name: "{{ cache_memcached_service }}"
    state: started
    enabled: true

- name: Enable and start Redis
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    state: started
    enabled: true
