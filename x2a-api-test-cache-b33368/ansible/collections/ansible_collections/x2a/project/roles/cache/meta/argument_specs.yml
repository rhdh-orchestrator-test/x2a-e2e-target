---
argument_specs:
  main:
    short_description: Install and configure Redis and Memcached cache services
    description:
      - Installs Redis and Memcached, creates the Redis log directory, and configures Redis authentication.
      - Removes unsupported replica configuration directives from the Redis configuration file.
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: Redis listener port.
      cache_redis_config_path:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration file to maintain.
      cache_redis_password:
        type: str
        required: false
        default: ""
        description: Redis authentication password. Store non-empty values securely.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations handling the Redis password.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Directory used for Redis logs.
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: Redis service account owner.
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: Redis service account group.
      cache_memcached_package:
        type: str
        required: false
        default: memcached
        description: Memcached package name.
      cache_memcached_service:
        type: str
        required: false
        default: memcached
        description: Memcached service name.
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Redis package name.
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Redis service name.
