---
# Unsupported pre-flight checks: the Redis service name is unspecified; authenticated and
# unauthenticated redis-cli checks require a password variable that is not provided here;
# INFO, journal, and conditional Memcached checks have no asserted expected outcome.
- name: Verify cache pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Check that the Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: item_redis_config_stat

    - name: Assert that the Redis configuration file exists
      ansible.builtin.assert:
        that:
          - item_redis_config_stat['stat']['exists']
          - item_redis_config_stat['stat']['isreg']
        fail_msg: Redis configuration file is missing or is not a regular file.

    - name: Read the Redis configuration for read-only verification
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: item_redis_config

    - name: Assert the Redis port and password configuration are present
      ansible.builtin.assert:
        that:
          - item_redis_config['content'] | b64decode is search('(?m)^port\\s+6379(?:\\s|$)')
          - item_redis_config['content'] | b64decode is search('(?m)^requirepass\\s+\\S+')
        fail_msg: Redis port 6379 or password authentication configuration is missing.

    - name: Assert removed Redis replication directives are absent
      ansible.builtin.assert:
        that:
          - not (item_redis_config['content'] | b64decode is search('(?m)^replica-serve-stale-data'))
          - not (item_redis_config['content'] | b64decode is search('(?m)^replica-read-only'))
          - not (item_redis_config['content'] | b64decode is search('(?m)^repl-ping-replica-period'))
          - not (item_redis_config['content'] | b64decode is search('(?m)^client-output-buffer-limit'))
          - not (item_redis_config['content'] | b64decode is search('(?m)^replica-priority'))
        fail_msg: A removed Redis replication directive is still present.

    - name: Wait for the Redis TCP listener on port 6379
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 10
      register: item_redis_listener

    - name: Assert the Redis TCP listener is available on port 6379
      ansible.builtin.assert:
        that:
          - item_redis_listener['state'] == 'started'
        fail_msg: Redis is not listening on TCP port 6379.

    - name: Check the Redis log directory
      ansible.builtin.stat:
        path: /var/log/redis
      register: item_redis_log_directory

    - name: Assert Redis log directory ownership and mode
      ansible.builtin.assert:
        that:
          - item_redis_log_directory['stat']['exists']
          - item_redis_log_directory['stat']['isdir']
          - item_redis_log_directory['stat']['pw_name'] == 'redis'
          - item_redis_log_directory['stat']['gr_name'] == 'redis'
          - item_redis_log_directory['stat']['mode'] == '0755'
        fail_msg: Redis log directory does not have the expected ownership or mode.
