---
# Unsupported pre-flight checks: SSH port/listener, sysctl and Fail2ban contents/status,
# certificate details, site-config grep output, curl responses, socket listings, and logs
# have no stated expected outcome in the pre-flight section.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Confirm required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        loop:
          - nginx
          - fail2ban
          - ufw
          - openssl
          - ca-certificates
        loop_control:
          loop_var: item_package
        fail_msg: "A required package is not installed."

    - name: Check nginx is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - nginx
      changed_when: false
      register: nginx_enabled

    - name: Assert nginx is enabled
      ansible.builtin.assert:
        that:
          - nginx_enabled['rc'] == 0
          - nginx_enabled['stdout'] | trim == 'enabled'
        fail_msg: "The nginx service is not enabled."

    - name: Check nginx is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - nginx
      changed_when: false
      register: nginx_active

    - name: Assert nginx is active
      ansible.builtin.assert:
        that:
          - nginx_active['rc'] == 0
          - nginx_active['stdout'] | trim == 'active'
        fail_msg: "The nginx service is not active."

    - name: Check fail2ban is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - fail2ban
      changed_when: false
      register: fail2ban_enabled

    - name: Assert fail2ban is enabled
      ansible.builtin.assert:
        that:
          - fail2ban_enabled['rc'] == 0
          - fail2ban_enabled['stdout'] | trim == 'enabled'
        fail_msg: "The fail2ban service is not enabled."

    - name: Check fail2ban is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - fail2ban
      changed_when: false
      register: fail2ban_active

    - name: Assert fail2ban is active
      ansible.builtin.assert:
        that:
          - fail2ban_active['rc'] == 0
          - fail2ban_active['stdout'] | trim == 'active'
        fail_msg: "The fail2ban service is not active."

    - name: Check UFW status and rules
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      changed_when: false
      register: ufw_status

    - name: Assert UFW has the expected default and allowed services
      ansible.builtin.assert:
        that:
          - ufw_status['rc'] == 0
          - ufw_status['stdout'] is search('Default: deny \\(incoming\\)')
          - ufw_status['stdout'] is search('22/tcp.*ALLOW')
          - ufw_status['stdout'] is search('80/tcp.*ALLOW')
          - ufw_status['stdout'] is search('443/tcp.*ALLOW')
        fail_msg: "UFW does not have the expected default or service rules."

    - name: Read SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config

    - name: Assert SSH hardening settings
      ansible.builtin.assert:
        that:
          - sshd_config['content'] | b64decode is search('(?m)^PermitRootLogin no$')
          - sshd_config['content'] | b64decode is search('(?m)^PasswordAuthentication no$')
        fail_msg: "The expected SSH hardening settings are missing."

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      register: nginx_config_test

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_config_test['rc'] == 0
        fail_msg: "nginx configuration validation failed."

    - name: Check expected deployment paths
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      loop:
        - name: test document root
          path: /opt/server/test
        - name: test index
          path: /opt/server/test/index.html
        - name: ci document root
          path: /opt/server/ci
        - name: ci index
          path: /opt/server/ci/index.html
        - name: status document root
          path: /opt/server/status
        - name: status index
          path: /opt/server/status/index.html
        - name: test available site
          path: /etc/nginx/sites-available/test.cluster.local
        - name: ci available site
          path: /etc/nginx/sites-available/ci.cluster.local
        - name: status available site
          path: /etc/nginx/sites-available/status.cluster.local
        - name: test certificate
          path: /etc/ssl/certs/test.cluster.local.crt
        - name: test private key
          path: /etc/ssl/private/test.cluster.local.key
        - name: ci certificate
          path: /etc/ssl/certs/ci.cluster.local.crt
        - name: ci private key
          path: /etc/ssl/private/ci.cluster.local.key
        - name: status certificate
          path: /etc/ssl/certs/status.cluster.local.crt
        - name: status private key
          path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_path
      register: path_checks

    - name: Assert expected deployment paths exist
      ansible.builtin.assert:
        that:
          - item_path_check['stat']['exists']
        loop: "{{ path_checks['results'] }}"
        loop_control:
          loop_var: item_path_check
        fail_msg: "An expected deployment path is missing."

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_link['path'] }}"
        follow: false
      loop:
        - name: test enabled site
          path: /etc/nginx/sites-enabled/test.cluster.local
        - name: ci enabled site
          path: /etc/nginx/sites-enabled/ci.cluster.local
        - name: status enabled site
          path: /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_link
      register: enabled_site_checks

    - name: Assert enabled site links exist
      ansible.builtin.assert:
        that:
          - item_enabled['stat']['islnk']
        loop: "{{ enabled_site_checks['results'] }}"
        loop_control:
          loop_var: item_enabled
        fail_msg: "An expected enabled nginx site link is missing."

    - name: Check the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
        follow: false
      register: default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']
        fail_msg: "The default nginx site still exists."
