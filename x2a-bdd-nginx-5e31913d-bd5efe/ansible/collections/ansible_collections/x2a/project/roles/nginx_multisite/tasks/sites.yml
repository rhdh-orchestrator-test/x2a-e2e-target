---
- name: Create available site configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_sites['key'] }} # noqa: R114 - site names come from role-defined sites dictionary
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_sites
  notify: Reload nginx
  vars:
    server_name: "{{ item_sites['key'] }}"
    document_root: "{{ item_sites['value']['document_root'] }}"
    ssl_enabled: "{{ item_sites['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_certificate_path }}/{{ item_sites['key'] }}.crt"
    key_file: "{{ nginx_multisite_private_key_path }}/{{ item_sites['key'] }}.key"

- name: Enable site configurations
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_sites['key'] }} # noqa: R114 - site names come from role-defined sites dictionary
    dest: /etc/nginx/sites-enabled/{{ item_sites['key'] }} # noqa: R114 - site names come from role-defined sites dictionary
    state: link
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_sites
  notify: Reload nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
