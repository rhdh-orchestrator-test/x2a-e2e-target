---
controller_credential_types:
  - name: PostgreSQL Database
    description: Credentials and connection settings for the FastAPI application's PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role, used during role creation and in the application DATABASE_URL.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname used by the application to connect to PostgreSQL.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
      required:
        - database_username
        - database_password
        - database_host
        - database_name
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_host: !unsafe "{{ database_host }}"
        database_name: !unsafe "{{ database_name }}"
