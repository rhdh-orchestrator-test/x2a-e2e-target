---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Select operating system package names # noqa: L073 - existing folded package expression requires this YAML indentation
  ansible.builtin.set_fact:
    fastapi_tutorial_packages: >-
      {{ ['python3', 'python3-pip', 'python3-venv', 'git', 'postgresql',
        'postgresql-contrib', 'libpq-dev'] if ansible_facts['os_family'] == 'Debian'
        else ['python3', 'python3-pip', 'python3-virtualenv', 'git', 'postgresql-server',
        'postgresql-contrib', 'libpq-devel'] }}

- name: Install required system packages
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_packages }}" # noqa: R113 - package list is selected from fixed role-defined OS package names
    state: present

- name: Ensure application service user exists
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_service_user }}"
    state: present
  when: fastapi_tutorial_service_user != 'root'

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path comes from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize application repository # noqa: R104,R106 - repository URL is HTTPS and comes from role defaults
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - destination comes from role defaults
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command arguments come from role defaults
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}/bin/python" # noqa: R114 - path comes from role defaults

- name: Install Python dependencies # noqa: R113 - requirements file is a fixed role-defined dependency source
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - path comes from role defaults
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path comes from role defaults
    state: present

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the application database role exists # noqa: L039,R101,R108 - credentials are validated by the preceding task and PostgreSQL queries require the postgres user
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ database_username }}';
  changed_when: false
  register: fastapi_tutorial_role_check
  become: true
  become_user: postgres

- name: Create application database role # noqa: L039,R101,R108 - validated credentials are used in the query and PostgreSQL role creation requires the postgres user
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - CREATE USER {{ database_username }} WITH PASSWORD '{{ database_password }}';
  when: fastapi_tutorial_role_check.stdout | trim != '1'
  changed_when: true
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the application database exists # noqa: L039,R101,R108 - validated credentials are used in the query and PostgreSQL queries require the postgres user
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}';
  changed_when: false
  register: fastapi_tutorial_database_check
  become: true
  become_user: postgres

- name: Create application database # noqa: L039,R101,R108 - validated database credentials are used and PostgreSQL database creation requires the postgres user
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - CREATE DATABASE {{ database_name }} OWNER {{ database_username }};
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  changed_when: true
  become: true
  become_user: postgres

- name: Grant application database privileges # noqa: L039,R101,R108 - validated database credentials are used and PostgreSQL privilege management requires the postgres user
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ database_username }};
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  changed_when: false
  become: true
  become_user: postgres

- name: Write application environment configuration # noqa: L039 - credential variables are validated by the preceding task
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL=postgresql://{{ database_username }}:{{ database_password }}@{{ database_host }}/{{ database_name }}
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path comes from role defaults
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User={{ fastapi_tutorial_service_user }}
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn {{ fastapi_tutorial_app_module }} --host {{ fastapi_tutorial_bind_address }} --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/{{ fastapi_tutorial_service_name }}.service # noqa: R114 - service name comes from role defaults
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd manager configuration

- name: Enable and start FastAPI service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
