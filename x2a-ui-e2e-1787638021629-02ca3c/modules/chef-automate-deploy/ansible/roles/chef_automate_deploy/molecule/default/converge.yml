- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create test directories
    ansible.builtin.file:
      path: '{{ item_dir }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/sysctl.d
    - /tmp/molecule_test/etc/hostname
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/home/molecule
    - /tmp/molecule_test/usr/bin
    - /tmp/molecule_test/etc/systemd/system
    loop_control:
      loop_var: item_dir
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
      backup: true
  - name: Create kernel parameter files
    ansible.builtin.copy:
      content: '{{ item_param[''value''] }}'
      dest: /tmp/molecule_test/proc/sys/vm/{{ item_param['name'] | regex_replace('^vm\.', '') }}
      mode: '0644'
      backup: true
    loop:
    - name: vm.max_map_count
      value: '262144'
    - name: vm.dirty_expire_centisecs
      value: '20000'
    loop_control:
      loop_var: item_param
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' exit 0'
      dest: /tmp/molecule_test/home/molecule/chef-automate
      mode: '0755'
      backup: true
  - name: Create chef-server-ctl mock
    ansible.builtin.copy:
      content: "#!/bin/bash\necho 'Chef Server CTL mock'\nif [[ \"$1\" == \"user-create\" ]]; then\n  echo \"Creating user $2\"\n  touch \"$7\"\nelif [[ \"$1\" ==
        \"org-create\" ]]; then\n  echo \"Creating organization $2\"\n  touch \"$6\"\nelif [[ \"$1\" == \"user-list\" ]]; then\n  echo \"jtonello\"\nelif [[ \"$1\"
        == \"org-list\" ]]; then\n  echo \"lab\"\nfi\nexit 0\n"
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
      backup: true
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK USER KEY CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
      backup: true
  - name: Create validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK VALIDATOR KEY CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
      backup: true
  - name: Create Chef Automate service file
    ansible.builtin.copy:
      content: '[Unit] Description=Chef Automate

        [Service] ExecStart=/bin/true

        [Install] WantedBy=multi-user.target'
      dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      mode: '0644'
      backup: true
