---
controller_credentials:
- name: Chef Admin User Password - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef Admin User Password
  update_secrets: true
  inputs:
    admin_password: '{{ vault_admin_password }}'
- name: Chef User Authentication Key - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef User Authentication Key
  update_secrets: true
  inputs:
    user_key: '{{ vault_user_key }}'
    user_key_path: '{{ user_key_path }}'
- name: Chef Organization Validator Key - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef Organization Validator Key
  update_secrets: true
  inputs:
    validator_key: '{{ vault_validator_key }}'
    validator_key_path: '{{ validator_key_path }}'
