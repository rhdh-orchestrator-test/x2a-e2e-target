---
controller_credential_types:
- name: Chef Admin User Password
  description: Credential type for Chef Admin User Password
  kind: cloud
  inputs:
    fields:
    - id: admin_password
      type: string
      label: Admin Password
      secret: true
      help_text: Password for the initial admin user for Chef Infra Server
    required:
    - admin_password
  injectors:
    extra_vars:
      admin_password: !unsafe '{{ admin_password }}'
- name: Chef User Authentication Key
  description: Credential type for Chef User Authentication Key
  kind: cloud
  inputs:
    fields:
    - id: user_key
      type: string
      label: User Authentication Key
      secret: true
      help_text: PEM file content for Chef Infra Server API access
    - id: user_key_path
      type: string
      label: User Key Path
      help_text: Path where the user authentication key PEM file is stored
    required:
    - user_key
  injectors:
    extra_vars:
      user_key: !unsafe '{{ user_key }}'
      user_key_path: !unsafe '{{ user_key_path }}'
- name: Chef Organization Validator Key
  description: Credential type for Chef Organization Validator Key
  kind: cloud
  inputs:
    fields:
    - id: validator_key
      type: string
      label: Organization Validator Key
      secret: true
      help_text: PEM file content for Chef organization validator
    - id: validator_key_path
      type: string
      label: Validator Key Path
      help_text: Path where the organization validator PEM file is stored
    required:
    - validator_key
  injectors:
    extra_vars:
      validator_key: !unsafe '{{ validator_key }}'
      validator_key_path: !unsafe '{{ validator_key_path }}'
