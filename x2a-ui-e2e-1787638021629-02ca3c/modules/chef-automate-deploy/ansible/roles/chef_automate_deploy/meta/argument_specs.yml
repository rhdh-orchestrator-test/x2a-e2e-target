---
argument_specs:
  main:
    short_description: Deploy and configure Chef Automate and Chef Infra Server
    description:
      - This role deploys Chef Automate and Chef Infra Server on a target system
      - Configures system parameters, installs the Chef Automate CLI, deploys the products
      - Sets up initial users and organizations
    options:
      chef_automate_hostname:
        type: str
        required: false
        default: automate.chef.lab
        description: Hostname to set for the Chef Automate server
      chef_automate_cli_url:
        type: str
        required: false
        default: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
        description: URL to download the Chef Automate CLI
      chef_automate_vm_max_map_count:
        type: int
        required: false
        default: 262144
        description: Value for vm.max_map_count kernel parameter
      chef_automate_vm_dirty_expire_centisecs:
        type: int
        required: false
        default: 20000
        description: Value for vm.dirty_expire_centisecs kernel parameter
      chef_automate_username:
        type: str
        required: false
        default: jtonello
        description: Username for the Chef Infra Server admin user
      chef_automate_longusername:
        type: str
        required: false
        default: John Tonello
        description: Full name for the Chef Infra Server admin user
      chef_automate_useremail:
        type: str
        required: false
        default: jtonello@chef.lab
        description: Email address for the Chef Infra Server admin user
      chef_automate_orgname:
        type: str
        required: false
        default: lab
        description: Organization name for Chef Infra Server
      chef_automate_longorgname:
        type: str
        required: false
        default: Chef Lab
        description: Full organization name for Chef Infra Server
      chef_automate_user_key_path:
        type: str
        required: false
        default: "{{ user_key_path | default(chef_automate_username + '.pem') }}"
        description: Path to save the user PEM file
      chef_automate_validator_key_path:
        type: str
        required: false
        default: "{{ validator_key_path | default(chef_automate_orgname + '-validator.pem') }}"
        description: Path to save the organization validator PEM file
      chef_automate_accept_terms:
        type: bool
        required: false
        default: true
        description: Whether to accept Chef's terms and MLSA
      chef_automate_deploy_automate:
        type: bool
        required: false
        default: true
        description: Whether to deploy Chef Automate
      chef_automate_deploy_infra_server:
        type: bool
        required: false
        default: true
        description: Whether to deploy Chef Infra Server
      admin_password:
        type: str
        required: true
        description: Password for the Chef Infra Server admin user (injected by AAP credential)
      user_key:
        type: str
        required: false
        description: Content of the user PEM file (injected by AAP credential)
      user_key_path:
        type: str
        required: false
        description: Path to save the user PEM file (injected by AAP credential)
      validator_key:
        type: str
        required: false
        description: Content of the organization validator PEM file (injected by AAP credential)
      validator_key_path:
        type: str
        required: false
        description: Path to save the organization validator PEM file (injected by AAP credential)
