---
argument_specs:
  main:
    short_description: Harden Apache SSL configuration to mitigate POODLE vulnerability
    description:
      - Modifies Apache SSL configuration to disable vulnerable SSL protocols
      - Enforces TLS 1.2 only protocol usage to mitigate POODLE vulnerability
      - Restarts Apache2 service after configuration changes
    options:
      apache_ssl_conf_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file
      ssl_protocols:
        type: str
        required: false
        default: SSLProtocol -all +TLSv1.2
        description: SSL protocol configuration string to mitigate POODLE vulnerability
