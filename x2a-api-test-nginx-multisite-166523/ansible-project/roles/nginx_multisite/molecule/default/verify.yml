---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Service status verification
    - name: Check service facts
      ansible.builtin.service_facts:

    - name: Assert nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
        fail_msg: "Nginx service is not running"

    - name: Assert fail2ban service is running
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
        fail_msg: "Fail2ban service is not running"

    # Configuration file verification
    - name: Check nginx configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_config
      register: nginx_config_stat_results

    - name: Assert nginx configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected nginx configuration file not found"
      loop: "{{ nginx_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Site enablement verification
    - name: Check nginx sites are enabled
      ansible.builtin.stat:
        path: "{{ item_site }}"
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_site
      register: nginx_sites_enabled_stat_results

    - name: Assert nginx sites are enabled
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['islnk']
        fail_msg: "Expected nginx site symlink not found"
      loop: "{{ nginx_sites_enabled_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Document root verification
    - name: Check document root directories and index files exist
      ansible.builtin.stat:
        path: "{{ item_docroot }}"
      loop:
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_docroot
      register: docroot_stat_results

    - name: Assert document root files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected document root file not found"
      loop: "{{ docroot_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # SSL certificate verification
    - name: Check SSL certificates exist
      ansible.builtin.stat:
        path: "{{ item_cert }}"
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_cert
      register: ssl_cert_stat_results

    - name: Assert SSL certificates were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate not found"
      loop: "{{ ssl_cert_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # SSL private key verification
    - name: Check SSL private keys exist with correct permissions
      ansible.builtin.stat:
        path: "{{ item_key }}"
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: ssl_key_stat_results

    - name: Assert SSL private keys have correct permissions
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
          - item_result['stat']['mode'] == '0640'
          - item_result['stat']['pw_name'] == 'root'
          - item_result['stat']['gr_name'] == 'ssl-cert'
        fail_msg: "SSL private key missing or has incorrect permissions"
      loop: "{{ ssl_key_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Security configuration verification
    - name: Check security configuration files exist
      ansible.builtin.stat:
        path: "{{ item_security }}"
      loop:
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
      loop_control:
        loop_var: item_security
      register: security_config_stat_results

    - name: Assert security configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected security configuration file not found"
      loop: "{{ security_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Network port verification
    - name: Check HTTP port is listening
      ansible.builtin.wait_for:
        port: 80
        host: 0.0.0.0
        timeout: 10

    - name: Check HTTPS port is listening
      ansible.builtin.wait_for:
        port: 443
        host: 0.0.0.0
        timeout: 10

    - name: Check SSH port is listening
      ansible.builtin.wait_for:
        port: 22
        host: 0.0.0.0
        timeout: 10

    # Nginx configuration validation
    - name: Test nginx configuration syntax
      ansible.builtin.command:
        cmd: nginx -t
      register: nginx_test_result
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_test_result['rc'] == 0
        fail_msg: "Nginx configuration test failed"

    # Content verification for each site
    - name: Read index.html content for each site
      ansible.builtin.slurp:
        src: "{{ item_content['path'] }}"
      loop:
        - path: /opt/server/test/index.html
          expected: test.cluster.local
        - path: /opt/server/ci/index.html
          expected: ci.cluster.local
        - path: /opt/server/status/index.html
          expected: status.cluster.local
      loop_control:
        loop_var: item_content
      register: index_content_results

    - name: Assert index.html files contain expected site names
      ansible.builtin.assert:
        that:
          - "item_result['item']['expected'] in (item_result['content'] | b64decode)"
        fail_msg: "Index file does not contain expected site name"
      loop: "{{ index_content_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Verify site configuration content
    - name: Read nginx site configuration files
      ansible.builtin.slurp:
        src: "{{ item_site_config['path'] }}"
      loop:
        - path: /etc/nginx/sites-available/test.cluster.local
          server_name: test.cluster.local
          document_root: /opt/server/test
        - path: /etc/nginx/sites-available/ci.cluster.local
          server_name: ci.cluster.local
          document_root: /opt/server/ci
        - path: /etc/nginx/sites-available/status.cluster.local
          server_name: status.cluster.local
          document_root: /opt/server/status
      loop_control:
        loop_var: item_site_config
      register: site_config_results

    - name: Assert site configurations contain expected values
      ansible.builtin.assert:
        that:
          - "item_result['item']['server_name'] in (item_result['content'] | b64decode)"
          - "item_result['item']['document_root'] in (item_result['content'] | b64decode)"
          - "'ssl_certificate' in (item_result['content'] | b64decode)"
        fail_msg: "Site configuration missing expected values"
      loop: "{{ site_config_results['results'] }}"
      loop_control:
        loop_var: item_result
