---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Redis cache  # noqa: L038 - external Redis role is a required deployment dependency and is resolved by the consuming Ansible environment
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_requirepass: "{{ redis_password }}"

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    owner: redis
    group: redis
    mode: "0755"
    state: directory
    recurse: true

- name: Check whether Redis configuration exists
  ansible.builtin.stat:
    path: "/etc/redis/{{ redis_port }}.conf"
  register: cache_redis_config_file_stat

- name: Remove unsupported Redis replication directives  # noqa: L039 - variable is registered by the preceding stat task
  ansible.builtin.replace:
    path: "/etc/redis/{{ redis_port }}.conf"  # noqa: R114 - path is constructed from the role default redis_port
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$
    replace: ""
    backup: true
  when: cache_redis_config_file_stat.stat.exists
