---
- name: Ensure unzip is installed
  ansible.builtin.package:
    name: unzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_path }}
    stdin: "{{ lookup('ansible.builtin.file', '/tmp/chef-automate_linux_amd64.zip') }}"
    creates: "{{ chef_automate_cli_path }}"
  args:
    executable: /bin/bash
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "./chef-automate deploy {% if chef_deploy_automate %}--product automate{% endif %} {% if chef_deploy_infra_server %}--product infra-server{% endif %} --accept-terms-and-mlsa={{
      chef_automate_accept_terms | lower }} "
  become: true
  args:
    creates: /hab
  register: chef_automate_deploy
  changed_when: chef_automate_deploy.rc == 0
