---
- name: Ensure /etc/chef directory exists
  ansible.builtin.file:
    path: /etc/chef
    state: directory
    mode: "0755"
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_user_pem_filename }}

      '
  become: true
  args:
    creates: /etc/chef/{{ chef_user_pem_filename }}
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_full_name }}" --association_user {{ username }} --filename {{ chef_org_validator_pem_filename
      }}

      '
  become: true
  args:
    creates: /etc/chef/{{ chef_org_validator_pem_filename }}
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
