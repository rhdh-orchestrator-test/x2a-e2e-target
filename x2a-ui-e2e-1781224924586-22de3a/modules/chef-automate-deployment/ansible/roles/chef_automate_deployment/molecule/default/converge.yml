- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/etc/systemd/system
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = {{ chef_vm_max_map_count }}

        vm.dirty_expire_centisecs = {{ chef_vm_dirty_expire_centisecs }}

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'''
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: "{\n  \"status\": \"running\",\n  \"services\": [\n    {\"name\": \"automate-gateway\", \"status\": \"running\"},\n    {\"name\": \"automate-postgresql\",
        \"status\": \"running\"},\n    {\"name\": \"automate-elasticsearch\", \"status\": \"running\"}\n  ]\n}\n"
      dest: /tmp/molecule_test/hab/chef-automate-status.json
      mode: '0644'
  - name: Create Chef Server status file
    ansible.builtin.copy:
      content: "{\n  \"status\": \"running\",\n  \"services\": [\n    {\"name\": \"bookshelf\", \"status\": \"running\"},\n    {\"name\": \"oc_bifrost\", \"status\":
        \"running\"},\n    {\"name\": \"oc_erchef\", \"status\": \"running\"},\n    {\"name\": \"postgresql\", \"status\": \"running\"}\n  ]\n}\n"
      dest: /tmp/molecule_test/hab/chef-server-status.json
      mode: '0644'
  - name: Create Chef Automate service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Automate

        After=network.target


        [Service]

        Type=simple

        ExecStart=/hab/bin/chef-automate-ctl start

        ExecStop=/hab/bin/chef-automate-ctl stop


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      mode: '0644'
  - name: Create Chef Server service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Infra Server

        After=network.target


        [Service]

        Type=simple

        ExecStart=/hab/bin/chef-server-ctl start

        ExecStop=/hab/bin/chef-server-ctl stop


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-server.service
      mode: '0644'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        ... (mock key content) ...

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/etc/chef/{{ chef_user_pem_filename }}
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        ... (mock key content) ...

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/etc/chef/{{ chef_org_validator_pem_filename }}
      mode: '0600'
  - name: Create user list file
    ansible.builtin.copy:
      content: '{{ username }}'
      dest: /tmp/molecule_test/etc/chef/user-list.txt
      mode: '0644'
  - name: Create organization list file
    ansible.builtin.copy:
      content: '{{ chef_org_name }}'
      dest: /tmp/molecule_test/etc/chef/org-list.txt
      mode: '0644'
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_vm_max_map_count: 262144
    chef_vm_dirty_expire_centisecs: 20000
    username: jtonello
    chef_org_name: lab
    chef_user_pem_filename: '{{ username }}.pem'
    chef_org_validator_pem_filename: '{{ chef_org_name }}-validator.pem'
