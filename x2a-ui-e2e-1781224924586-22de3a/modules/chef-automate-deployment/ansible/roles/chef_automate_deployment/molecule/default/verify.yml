- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl settings file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl settings file not found
      success_msg: Sysctl settings file exists
  - name: Get sysctl content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl settings are correct
    ansible.builtin.assert:
      that:
      - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
      - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = 20000')
      fail_msg: Sysctl settings not configured correctly
      success_msg: Sysctl settings configured correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.isreg
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-automate-status.json
    register: chef_automate_status_file
  - name: Assert Chef Automate status file exists
    ansible.builtin.assert:
      that:
      - chef_automate_status_file.stat.exists
      - chef_automate_status_file.stat.isreg
      fail_msg: Chef Automate status file not found
      success_msg: Chef Automate status file exists
  - name: Check Chef Server status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-server-status.json
    register: chef_server_status_file
  - name: Assert Chef Server status file exists
    ansible.builtin.assert:
      that:
      - chef_server_status_file.stat.exists
      - chef_server_status_file.stat.isreg
      fail_msg: Chef Server status file not found
      success_msg: Chef Server status file exists
  - name: Check Chef Automate service file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/systemd/system/chef-automate.service
    register: chef_automate_service_file
  - name: Assert Chef Automate service file exists
    ansible.builtin.assert:
      that:
      - chef_automate_service_file.stat.exists
      - chef_automate_service_file.stat.isreg
      fail_msg: Chef Automate service file not found
      success_msg: Chef Automate service file exists
  - name: Check Chef Server service file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/systemd/system/chef-server.service
    register: chef_server_service_file
  - name: Assert Chef Server service file exists
    ansible.builtin.assert:
      that:
      - chef_server_service_file.stat.exists
      - chef_server_service_file.stat.isreg
      fail_msg: Chef Server service file not found
      success_msg: Chef Server service file exists
  - name: Check user PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/jtonello.pem
    register: user_pem_file
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem_file.stat.exists
      - user_pem_file.stat.isreg
      fail_msg: User PEM file not found
      success_msg: User PEM file exists
  - name: Check organization validator PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/lab-validator.pem
    register: org_validator_pem_file
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_validator_pem_file.stat.exists
      - org_validator_pem_file.stat.isreg
      fail_msg: Organization validator PEM file not found
      success_msg: Organization validator PEM file exists
  - name: Check user list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/user-list.txt
    register: user_list_file
  - name: Assert user list file exists
    ansible.builtin.assert:
      that:
      - user_list_file.stat.exists
      - user_list_file.stat.isreg
      fail_msg: User list file not found
      success_msg: User list file exists
  - name: Get user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/chef/user-list.txt
    register: user_list_content
    when: user_list_file.stat.exists
  - name: Assert user is in user list
    ansible.builtin.assert:
      that:
      - (user_list_content.content | b64decode | trim) == "jtonello"
      fail_msg: User not found in user list
      success_msg: User found in user list
    when: user_list_file.stat.exists
  - name: Check organization list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/org-list.txt
    register: org_list_file
  - name: Assert organization list file exists
    ansible.builtin.assert:
      that:
      - org_list_file.stat.exists
      - org_list_file.stat.isreg
      fail_msg: Organization list file not found
      success_msg: Organization list file exists
  - name: Get organization list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/chef/org-list.txt
    register: org_list_content
    when: org_list_file.stat.exists
  - name: Assert organization is in organization list
    ansible.builtin.assert:
      that:
      - (org_list_content.content | b64decode | trim) == "lab"
      fail_msg: Organization not found in organization list
      success_msg: Organization found in organization list
    when: org_list_file.stat.exists
  - name: Check Chef Automate service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      - ansible_facts.services['chef-automate.service'].state == 'running'
      fail_msg: Chef Automate service not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Assert Chef Server service is running
    ansible.builtin.assert:
      that:
      - '''chef-server.service'' in ansible_facts.services'
      - ansible_facts.services['chef-server.service'].state == 'running'
      fail_msg: Chef Server service not running
      success_msg: Chef Server service is running
    tags: molecule-notest
  - name: Check Chef Automate port
    ansible.builtin.wait_for:
      port: 443
      timeout: 1
    register: port_check
    ignore_errors: true
    tags: molecule-notest
  - name: Assert Chef Automate port is listening
    ansible.builtin.assert:
      that:
      - port_check is success
      fail_msg: Chef Automate port 443 not listening
      success_msg: Chef Automate port 443 is listening
    tags: molecule-notest
  - name: Check Chef Automate API
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
    register: api_check
    ignore_errors: true
    tags: molecule-notest
  - name: Assert Chef Automate API is accessible
    ansible.builtin.assert:
      that:
      - api_check is success
      fail_msg: Chef Automate API not accessible
      success_msg: Chef Automate API is accessible
    tags: molecule-notest
