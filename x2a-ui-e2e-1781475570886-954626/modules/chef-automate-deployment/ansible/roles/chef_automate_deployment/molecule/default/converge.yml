---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/chef-automate-dir

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate kernel parameters
    - name: Create max_map_count file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_max_map_count }}"
        dest: "/tmp/molecule_test/proc/sys/vm/max_map_count"
        mode: "0644"

    - name: Create dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_dirty_expire_centisecs }}"
        dest: "/tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs"
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\n# Simulated Chef Automate CLI"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create hab directory to simulate successful deployment
      ansible.builtin.file:
        path: "/tmp/molecule_test/hab"
        state: directory
        mode: "0755"

    # Simulate user and organization key files
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nSimulated user key content\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/{{ chef_server_user_key_file }}"
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nSimulated organization validator key content\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/{{ chef_server_org_validator_file }}"
        mode: "0600"

  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_cli_path: ./chef-automate
    chef_server_username: jtonello
    chef_server_org_name: lab
    chef_server_user_key_file: jtonello.pem
    chef_server_org_validator_file: lab-validator.pem