---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure vm.max_map_count kernel parameter
  ansible.builtin.sysctl:
    name: vm.max_map_count
    value: "{{ chef_automate_vm_max_map_count }}"
    state: present
    reload: true
  become: true
- name: Configure vm.dirty_expire_centisecs kernel parameter
  ansible.builtin.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ chef_automate_vm_dirty_expire_centisecs }}"
    state: present
    reload: true
  become: true
- name: Ensure curl is installed
  ansible.builtin.package:
    name: curl
    state: present
  become: true
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: automate_cli_stat
- name: Download and extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: curl {{ chef_automate_cli_url }} | gunzip - > {{ chef_automate_cli_path }}
  args:
    warn: false
  when: not automate_cli_stat.stat.exists
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }} "
    creates: /hab
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
- name: Create Chef Server user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_server_username }} {{ chef_server_full_name }} {{ chef_server_email }} "{{ chef_server_password }}" --filename {{
      chef_server_user_key_file }}
  args:
    creates: "{{ chef_server_user_key_file }}"
  become: true
  no_log: true
- name: Create Chef Server organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_server_org_name }} "{{ chef_server_org_full_name }}" --association_user {{ chef_server_username }} --filename {{
      chef_server_org_validator_file }}
  args:
    creates: "{{ chef_server_org_validator_file }}"
  become: true
