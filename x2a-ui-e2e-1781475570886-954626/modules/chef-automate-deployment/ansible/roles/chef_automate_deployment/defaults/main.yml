---
chef_automate_hostname: automate.chef.lab
chef_automate_vm_max_map_count: 262144
chef_automate_vm_dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: ./chef-automate
chef_automate_accept_terms_and_mlsa: true
chef_automate_products:
  - automate
  - infra-server
chef_server_username: "{{ username | default('jtonello') }}"
chef_server_full_name: "{{ full_name | default('John Tonello') }}"
chef_server_email: "{{ email | default('jtonello@chef.lab') }}"
chef_server_password: "{{ password | default('password') }}"
chef_server_org_name: lab
chef_server_org_full_name: Chef Lab
chef_server_user_key_file: "{{ chef_server_username }}.pem"
chef_server_org_validator_file: "{{ chef_server_org_name }}-validator.pem"
