- name: Ensure Chef Server is installed
  ansible.builtin.package:
    name: chef-server-core
    state: present
  become: true
- name: Check if Chef user already exists
  ansible.builtin.stat:
    path: '{{ chef_automate_user_key_path }}'
  register: user_key_file
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_username }} "{{ chef_automate_full_name }}" {{ chef_automate_email }} "{{ chef_automate_password }}" --filename
      {{ chef_automate_user_key_path }}
  args:
    creates: '{{ chef_automate_user_key_path }}'
  become: true
  no_log: true
  when: not user_key_file.stat.exists
- name: Check if Chef organization already exists
  ansible.builtin.stat:
    path: '{{ chef_automate_org_key_path }}'
  register: org_key_file
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_full_name }}" --association_user {{ chef_automate_username }} --filename {{
      chef_automate_org_key_path }}
  args:
    creates: '{{ chef_automate_org_key_path }}'
  become: true
  when: not org_key_file.stat.exists
