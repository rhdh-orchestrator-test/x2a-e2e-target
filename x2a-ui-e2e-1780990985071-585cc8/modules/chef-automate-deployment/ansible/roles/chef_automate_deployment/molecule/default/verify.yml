---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_username: admin
    chef_automate_org_name: lab
  tasks:
    # System configuration verification
    - name: Check hostname configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == chef_automate_hostname
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check sysctl configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are set correctly
      ansible.builtin.assert:
        that:
          - sysctl_content.content | b64decode | string | regex_search('vm.max_map_count = 262144')
          - sysctl_content.content | b64decode | string | regex_search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate installation verification
    - name: Check Chef Automate CLI
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - automate_cli.stat.exists
          - automate_cli.stat.isreg
          - automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    - name: Check Chef Automate configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: automate_config

    - name: Assert Chef Automate config exists
      ansible.builtin.assert:
        that:
          - automate_config.stat.exists
          - automate_config.stat.isreg
        fail_msg: "Chef Automate configuration not found"
        success_msg: "Chef Automate configuration exists"

    # User and organization verification
    - name: Check user key file
      ansible.builtin.stat:
        path: "/tmp/molecule_test/tmp/{{ chef_automate_username }}.pem"
      register: user_key

    - name: Assert user key exists
      ansible.builtin.assert:
        that:
          - user_key.stat.exists
          - user_key.stat.isreg
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    - name: Check organization key file
      ansible.builtin.stat:
        path: "/tmp/molecule_test/tmp/{{ chef_automate_org_name }}-validator.pem"
      register: org_key

    - name: Assert organization key exists
      ansible.builtin.assert:
        that:
          - org_key.stat.exists
          - org_key.stat.isreg
        fail_msg: "Organization key file not found"
        success_msg: "Organization key file exists"

    - name: Check user list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/opscode/user_list
      register: user_list

    - name: Assert user list exists
      ansible.builtin.assert:
        that:
          - user_list.stat.exists
          - user_list.stat.isreg
        fail_msg: "User list file not found"
        success_msg: "User list file exists"

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/opscode/user_list
      register: user_list_content
      when: user_list.stat.exists

    - name: Assert user is in user list
      ansible.builtin.assert:
        that:
          - user_list_content.content | b64decode | string | regex_search(chef_automate_username)
        fail_msg: "User not found in user list"
        success_msg: "User found in user list"
      when: user_list.stat.exists

    - name: Check organization list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/opscode/org_list
      register: org_list

    - name: Assert organization list exists
      ansible.builtin.assert:
        that:
          - org_list.stat.exists
          - org_list.stat.isreg
        fail_msg: "Organization list file not found"
        success_msg: "Organization list file exists"

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/opscode/org_list
      register: org_list_content
      when: org_list.stat.exists

    - name: Assert organization is in organization list
      ansible.builtin.assert:
        that:
          - org_list_content.content | b64decode | string | regex_search(chef_automate_org_name)
        fail_msg: "Organization not found in organization list"
        success_msg: "Organization found in organization list"
      when: org_list.stat.exists

    # Service verification (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is active
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "ansible_facts.services['chef-automate.service'].state == 'running'"
        fail_msg: "Chef Automate service not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Assert Chef Server service is active
      ansible.builtin.assert:
        that:
          - "'chef-server.service' in ansible_facts.services"
          - "ansible_facts.services['chef-server.service'].state == 'running'"
        fail_msg: "Chef Server service not running"
        success_msg: "Chef Server service is running"
      tags: molecule-notest

    # Network verification (tagged for skipping in container)
    - name: Check Chef Automate port
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      tags: molecule-notest

    # Web UI accessibility (tagged for skipping in container)
    - name: Check Chef Automate API
      ansible.builtin.uri:
        url: https://localhost/api/v0/auth/version
        validate_certs: false
        status_code: 200
      tags: molecule-notest

    - name: Check Chef Server organization API
      ansible.builtin.uri:
        url: "https://localhost/organizations/{{ chef_automate_org_name }}"
        validate_certs: false
        status_code: 200
      tags: molecule-notest