---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # File existence checks
    - name: Check nginx configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/nginx/nginx.conf
        - /tmp/molecule_test/etc/nginx/conf.d/security.conf
        - /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_config
      register: nginx_config_stat_results

    - name: Assert nginx configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected nginx configuration file not found"
      loop: "{{ nginx_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check document root files exist
      ansible.builtin.stat:
        path: "{{ item_doc }}"
      loop:
        - /tmp/molecule_test/opt/server/test/index.html
        - /tmp/molecule_test/opt/server/ci/index.html
        - /tmp/molecule_test/opt/server/status/index.html
      loop_control:
        loop_var: item_doc
      register: document_stat_results

    - name: Assert document root files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected document root file not found"
      loop: "{{ document_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ item_ssl }}"
      loop:
        - /tmp/molecule_test/etc/ssl/certs/test.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/ci.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/status.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/private/test.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/ci.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_ssl
      register: ssl_stat_results

    - name: Assert SSL certificate files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate file not found"
      loop: "{{ ssl_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check security configuration files exist
      ansible.builtin.stat:
        path: "{{ item_security }}"
      loop:
        - /tmp/molecule_test/etc/fail2ban/jail.local
        - /tmp/molecule_test/etc/sysctl.d/99-security.conf
        - /tmp/molecule_test/etc/ssh/sshd_config
      loop_control:
        loop_var: item_security
      register: security_stat_results

    - name: Assert security configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected security configuration file not found"
      loop: "{{ security_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Content validation checks
    - name: Read nginx main configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/nginx.conf
      register: nginx_conf_content

    - name: Assert nginx configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'user www-data' in nginx_conf_decoded"
          - "'worker_processes auto' in nginx_conf_decoded"
          - "'ssl_protocols TLSv1.2 TLSv1.3' in nginx_conf_decoded"
          - "'gzip on' in nginx_conf_decoded"
          - "'server_tokens off' in nginx_conf_decoded"
        fail_msg: "Nginx configuration missing expected settings"
      vars:
        nginx_conf_decoded: "{{ nginx_conf_content['content'] | b64decode }}"

    - name: Read nginx security configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/conf.d/security.conf
      register: security_conf_content

    - name: Assert nginx security configuration contains expected headers
      ansible.builtin.assert:
        that:
          - "'X-Frame-Options DENY' in security_conf_decoded"
          - "'X-Content-Type-Options nosniff' in security_conf_decoded"
          - "'X-XSS-Protection' in security_conf_decoded"
          - "'Referrer-Policy' in security_conf_decoded"
          - "'client_max_body_size' in security_conf_decoded"
        fail_msg: "Security configuration missing expected headers"
      vars:
        security_conf_decoded: "{{ security_conf_content['content'] | b64decode }}"

    - name: Read site configurations
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/sites-available/{{ item_site }}
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site
      register: site_config_results

    - name: Assert site configurations contain expected settings
      ansible.builtin.assert:
        that:
          - "'listen 80' in site_conf_decoded"
          - "'listen 443 ssl http2' in site_conf_decoded"
          - "'return 301 https://' in site_conf_decoded"
          - "'ssl_certificate /etc/ssl/certs/' in site_conf_decoded"
          - "'ssl_certificate_key /etc/ssl/private/' in site_conf_decoded"
          - "'Strict-Transport-Security' in site_conf_decoded"
          - "'ssl_protocols TLSv1.2 TLSv1.3' in site_conf_decoded"
        fail_msg: "Site configuration missing expected SSL/security settings"
      vars:
        site_conf_decoded: "{{ item_result['content'] | b64decode }}"
      loop: "{{ site_config_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read document root index files
      ansible.builtin.slurp:
        src: /tmp/molecule_test/opt/server/{{ item_site }}/index.html
      loop:
        - test
        - ci
        - status
      loop_control:
        loop_var: item_site
      register: index_file_results

    - name: Assert index files contain expected content
      ansible.builtin.assert:
        that:
          - "'<!DOCTYPE html>' in index_content_decoded"
          - "'Environment' in index_content_decoded"
          - "'cluster.local' in index_content_decoded"
          - "'Document Root:' in index_content_decoded"
          - "'SSL: Enabled' in index_content_decoded"
        fail_msg: "Index file missing expected content"
      vars:
        index_content_decoded: "{{ item_result['content'] | b64decode }}"
      loop: "{{ index_file_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read fail2ban jail configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/fail2ban/jail.local
      register: fail2ban_conf_content

    - name: Assert fail2ban configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'[DEFAULT]' in fail2ban_conf_decoded"
          - "'bantime = 3600' in fail2ban_conf_decoded"
          - "'[nginx-http-auth]' in fail2ban_conf_decoded"
          - "'enabled = true' in fail2ban_conf_decoded"
          - "'[nginx-noscript]' in fail2ban_conf_decoded"
          - "'[nginx-badbots]' in fail2ban_conf_decoded"
          - "'[nginx-noproxy]' in fail2ban_conf_decoded"
        fail_msg: "Fail2ban configuration missing expected jails"
      vars:
        fail2ban_conf_decoded: "{{ fail2ban_conf_content['content'] | b64decode }}"

    - name: Read sysctl security configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-security.conf
      register: sysctl_conf_content

    - name: Assert sysctl configuration contains expected security settings
      ansible.builtin.assert:
        that:
          - "'net.ipv4.conf.all.rp_filter = 1' in sysctl_conf_decoded"
          - "'net.ipv4.conf.all.accept_redirects = 0' in sysctl_conf_decoded"
          - "'net.ipv4.conf.all.send_redirects = 0' in sysctl_conf_decoded"
          - "'net.ipv4.tcp_syncookies = 1' in sysctl_conf_decoded"
          - "'net.ipv4.icmp_echo_ignore_all = 1' in sysctl_conf_decoded"
        fail_msg: "Sysctl configuration missing expected security settings"
      vars:
        sysctl_conf_decoded: "{{ sysctl_conf_content['content'] | b64decode }}"

    - name: Read SSH configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_conf_content

    - name: Assert SSH configuration contains expected security settings
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in ssh_conf_decoded"
          - "'PasswordAuthentication no' in ssh_conf_decoded"
          - "'PubkeyAuthentication yes' in ssh_conf_decoded"
          - "'PermitEmptyPasswords no' in ssh_conf_decoded"
          - "'MaxAuthTries 3' in ssh_conf_decoded"
          - "'X11Forwarding no' in ssh_conf_decoded"
        fail_msg: "SSH configuration missing expected security settings"
      vars:
        ssh_conf_decoded: "{{ ssh_conf_content['content'] | b64decode }}"

    # SSL certificate validation
    - name: Check SSL private key permissions
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/ssl/private/{{ item_site }}.key
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site
      register: ssl_key_perms_results

    - name: Assert SSL private keys have correct permissions
      ansible.builtin.assert:
        that:
          - item_result['stat']['mode'] == '0640'
        fail_msg: "SSL private key does not have correct permissions (640)"
      loop: "{{ ssl_key_perms_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Symlink validation
    - name: Check nginx sites-enabled symlinks
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/nginx/sites-enabled/{{ item_site }}
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site
      register: symlink_stat_results

    - name: Assert nginx sites are properly enabled via symlinks
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['islnk']
        fail_msg: "Expected nginx site symlink not found or not a symlink"
      loop: "{{ symlink_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Directory structure validation
    - name: Check expected directories exist
      ansible.builtin.stat:
        path: "{{ item_dir }}"
      loop:
        - /tmp/molecule_test/etc/nginx
        - /tmp/molecule_test/etc/nginx/conf.d
        - /tmp/molecule_test/etc/nginx/sites-available
        - /tmp/molecule_test/etc/nginx/sites-enabled
        - /tmp/molecule_test/etc/ssl/certs
        - /tmp/molecule_test/etc/ssl/private
        - /tmp/molecule_test/opt/server/test
        - /tmp/molecule_test/opt/server/ci
        - /tmp/molecule_test/opt/server/status
      loop_control:
        loop_var: item_dir
      register: directory_stat_results

    - name: Assert expected directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected directory not found or not a directory"
      loop: "{{ directory_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Service checks that cannot run in container environment
    - name: Check nginx service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
        fail_msg: "Nginx service is not running"
      tags: molecule-notest

    - name: Check fail2ban service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert fail2ban service is running
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
        fail_msg: "Fail2ban service is not running"
      tags: molecule-notest

    # Network port checks that cannot run in container environment
    - name: Check HTTP port is listening
      ansible.builtin.wait_for:
        port: 80
        host: 0.0.0.0
        timeout: 5
      tags: molecule-notest

    - name: Check HTTPS port is listening
      ansible.builtin.wait_for:
        port: 443
        host: 0.0.0.0
        timeout: 5
      tags: molecule-notest

    # HTTP/HTTPS checks that cannot run in container environment
    - name: Check HTTP redirect to HTTPS for test site
      ansible.builtin.uri:
        url: http://test.cluster.local
        method: GET
        follow_redirects: none
        status_code: 301
      tags: molecule-notest

    - name: Check HTTPS response for test site
      ansible.builtin.uri:
        url: https://test.cluster.local
        method: GET
        validate_certs: false
        status_code: 200
      tags: molecule-notest

    - name: Check HTTP redirect to HTTPS for ci site
      ansible.builtin.uri:
        url: http://ci.cluster.local
        method: GET
        follow_redirects: none
        status_code: 301
      tags: molecule-notest

    - name: Check HTTPS response for ci site
      ansible.builtin.uri:
        url: https://ci.cluster.local
        method: GET
        validate_certs: false
        status_code: 200
      tags: molecule-notest

    - name: Check HTTP redirect to HTTPS for status site
      ansible.builtin.uri:
        url: http://status.cluster.local
        method: GET
        follow_redirects: none
        status_code: 301
      tags: molecule-notest

    - name: Check HTTPS response for status site
      ansible.builtin.uri:
        url: https://status.cluster.local
        method: GET
        validate_certs: false
        status_code: 200
      tags: molecule-notest