---
controller_credential_types:
- name: Chef Admin User
  description: Credential type for Chef Admin User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Admin username for Chef Infra Server
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Admin password for Chef Infra Server
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name for the Chef admin user
    - id: email
      type: string
      label: Email
      help_text: Email address for the Chef admin user
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
- name: SSL Certificates
  description: Credential type for SSL Certificates
  kind: cloud
  inputs:
    fields:
    - id: certificate
      type: string
      label: SSL Certificate
      secret: true
      help_text: Self-signed SSL certificate for web server
    - id: private_key
      type: string
      label: SSL Private Key
      secret: true
      help_text: Private key for the SSL certificate
    required:
    - certificate
    - private_key
  injectors:
    extra_vars:
      certificate: !unsafe '{{ certificate }}'
      private_key: !unsafe '{{ private_key }}'
