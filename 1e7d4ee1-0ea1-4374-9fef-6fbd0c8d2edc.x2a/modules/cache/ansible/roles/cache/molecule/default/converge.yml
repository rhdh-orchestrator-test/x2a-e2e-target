- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/run/redis
  - name: Create expected Redis configuration file
    ansible.builtin.copy:
      content: '# Redis configuration file sample

        port 6379

        bind 127.0.0.1

        daemonize yes

        pidfile /var/run/redis/redis-server.pid

        logfile /var/log/redis/redis-server.log

        dir /var/lib/redis

        '
      dest: /tmp/molecule_test/etc/redis/redis.conf
      mode: '0644'
  - name: Create Redis log file
    ansible.builtin.copy:
      content: '# Redis server log file '
      dest: /tmp/molecule_test/var/log/redis/redis-server.log
      mode: '0644'
  - name: Create Redis PID file
    ansible.builtin.copy:
      content: '12345 '
      dest: /tmp/molecule_test/var/run/redis/redis-server.pid
      mode: '0644'
  - name: Create Redis data directory with sample file
    ansible.builtin.copy:
      content: '# Redis data directory '
      dest: /tmp/molecule_test/var/lib/redis/dump.rdb
      mode: '0644'
  - name: Create Redis socket file
    ansible.builtin.copy:
      content: ''
      dest: /tmp/molecule_test/var/run/redis/redis-server.sock
      mode: '0644'
