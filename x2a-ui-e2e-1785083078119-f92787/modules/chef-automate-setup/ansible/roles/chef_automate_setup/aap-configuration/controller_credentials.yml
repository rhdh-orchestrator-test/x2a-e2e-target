---
controller_credentials:
- name: Chef Server User - chef_automate_setup
  description: User credentials for Chef Server authentication
  organization: Default
  credential_type: Chef Server User
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    email: '{{ email }}'
- name: Chef Organization - chef_automate_setup
  description: Organization details for Chef Server
  organization: Default
  credential_type: Chef Organization
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
