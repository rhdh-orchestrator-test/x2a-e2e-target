---
# Cache role main tasks

- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install memcached
  ansible.builtin.package:
    name: memcached
    state: present

- name: Install Redis server
  ansible.builtin.package:
    name: redis-server
    state: present

- name: Create Redis system group
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    state: present
    system: true

- name: Create Redis system user
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    state: present
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false

- name: Create Redis configuration directory
  ansible.builtin.file:
    path: "{{ cache_redis_config_file | dirname }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Redis data directory
  ansible.builtin.file:
    path: /var/lib/redis
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"

- name: Create Redis PID directory
  ansible.builtin.file:
    path: /var/run/redis
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"

- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults, not user input
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0640"
    backup: true
  notify: Restart redis

- name: Remove replica-related configuration lines from Redis config
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults, not user input
    regexp: "{{ item_config_line }}" # noqa: R115 - loop over role-defined config lines list
    state: absent
  loop: "{{ cache_redis_config_lines_to_remove }}"
  loop_control:
    loop_var: item_config_line
  notify: Restart redis

- name: Start and enable memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true

- name: Start and enable Redis service
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
