---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis and memcached services are running
      ansible.builtin.service_facts:

    - name: Assert Redis service is active
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
        fail_msg: "Redis service is not running"

    - name: Assert memcached service is active
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - "ansible_facts.services['memcached.service']['state'] == 'running'"
        fail_msg: "Memcached service is not running"

    - name: Check Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_stat

    - name: Assert Redis configuration file exists
      ansible.builtin.assert:
        that:
          - redis_config_stat['stat']['exists']
          - redis_config_stat['stat']['size'] > 0
        fail_msg: "Redis configuration file not found or empty"

    - name: Check Redis log directory exists
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory exists with correct ownership
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['exists']
          - redis_log_dir_stat['stat']['isdir']
          - redis_log_dir_stat['stat']['pw_name'] == 'redis'
          - redis_log_dir_stat['stat']['gr_name'] == 'redis'
        fail_msg: "Redis log directory not found or incorrect ownership"

    - name: Check Redis configuration for requirepass
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis requirepass is configured
      ansible.builtin.assert:
        that:
          - "'requirepass' in (redis_config_content['content'] | b64decode)"
        fail_msg: "Redis requirepass not configured"

    - name: Check Redis configuration for removed replica settings
      ansible.builtin.shell:
        cmd: |
          grep -c "replica-serve-stale-data" /etc/redis/6379.conf || echo "0"
      register: replica_stale_data_count
      changed_when: false

    - name: Check Redis configuration for removed replica-read-only settings
      ansible.builtin.shell:
        cmd: |
          grep -c "replica-read-only" /etc/redis/6379.conf || echo "0"
      register: replica_read_only_count
      changed_when: false

    - name: Check Redis configuration for removed repl-ping-replica-period settings
      ansible.builtin.shell:
        cmd: |
          grep -c "repl-ping-replica-period" /etc/redis/6379.conf || echo "0"
      register: repl_ping_replica_count
      changed_when: false

    - name: Check Redis configuration for removed client-output-buffer-limit settings
      ansible.builtin.shell:
        cmd: |
          grep -c "client-output-buffer-limit" /etc/redis/6379.conf || echo "0"
      register: client_output_buffer_count
      changed_when: false

    - name: Check Redis configuration for removed replica-priority settings
      ansible.builtin.shell:
        cmd: |
          grep -c "replica-priority" /etc/redis/6379.conf || echo "0"
      register: replica_priority_count
      changed_when: false

    - name: Assert replica-related settings were removed
      ansible.builtin.assert:
        that:
          - replica_stale_data_count['stdout'] == '0'
          - replica_read_only_count['stdout'] == '0'
          - repl_ping_replica_count['stdout'] == '0'
          - client_output_buffer_count['stdout'] == '0'
          - replica_priority_count['stdout'] == '0'
        fail_msg: "Replica-related configuration lines not properly removed"

    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: localhost
        timeout: 10

    - name: Check memcached port is listening
      ansible.builtin.wait_for:
        port: 11211
        host: localhost
        timeout: 10

    - name: Test Redis connectivity with authentication
      ansible.builtin.shell:
        cmd: |
          redis-cli -p 6379 -a redis_secure_password_123 ping
      register: redis_ping_result
      changed_when: false
      no_log: true

    - name: Assert Redis responds to ping
      ansible.builtin.assert:
        that:
          - redis_ping_result['stdout'] == 'PONG'
        fail_msg: "Redis ping test failed"

    - name: Test Redis data operations
      ansible.builtin.shell:
        cmd: |
          redis-cli -p 6379 -a redis_secure_password_123 set test_key "test_value" &&
          redis-cli -p 6379 -a redis_secure_password_123 get test_key &&
          redis-cli -p 6379 -a redis_secure_password_123 del test_key
      register: redis_data_test
      changed_when: false
      no_log: true

    - name: Assert Redis data operations work
      ansible.builtin.assert:
        that:
          - "'test_value' in redis_data_test['stdout']"
        fail_msg: "Redis data operations test failed"

    - name: Test memcached connectivity
      ansible.builtin.shell:
        cmd: |
          echo "stats" | nc localhost 11211
      register: memcached_stats
      changed_when: false

    - name: Assert memcached responds to stats command
      ansible.builtin.assert:
        that:
          - "'STAT' in memcached_stats['stdout']"
        fail_msg: "Memcached stats test failed"
