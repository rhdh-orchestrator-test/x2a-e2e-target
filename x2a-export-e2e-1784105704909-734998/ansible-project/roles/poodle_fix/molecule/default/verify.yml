---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check if the Apache SSL config file exists
    - name: Check if Apache SSL config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_conf_file

    - name: Assert SSL config file exists
      ansible.builtin.assert:
        that:
          - ssl_conf_file.stat.exists
          - ssl_conf_file.stat.isreg
        fail_msg: "Apache SSL config file does not exist"
        success_msg: "Apache SSL config file exists"

    # Check if the SSL protocol settings are correct
    - name: Get SSL config file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_conf_content

    - name: Assert SSL protocol settings are correct
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in ssl_conf_content.content | b64decode"
        fail_msg: "SSL protocol settings are not correctly configured for POODLE mitigation"
        success_msg: "SSL protocol settings are correctly configured for POODLE mitigation"

    # The following checks would be performed on a real system but can't run in the molecule container
    # They are tagged with molecule-notest so they won't run during molecule testing

    - name: Check Apache SSL module
      ansible.builtin.command: apache2ctl -M
      register: apache_modules
      changed_when: false
      tags: molecule-notest

    - name: Assert SSL module is enabled
      ansible.builtin.assert:
        that:
          - "'ssl_module' in apache_modules.stdout"
        fail_msg: "Apache SSL module is not enabled"
        success_msg: "Apache SSL module is enabled"
      tags: molecule-notest

    - name: Validate Apache configuration
      ansible.builtin.command: apache2ctl configtest
      register: apache_configtest
      changed_when: false
      tags: molecule-notest

    - name: Assert Apache configuration is valid
      ansible.builtin.assert:
        that:
          - apache_configtest.rc == 0
        fail_msg: "Apache configuration is invalid"
        success_msg: "Apache configuration is valid"
      tags: molecule-notest

    - name: Check Apache service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Check SSH service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert SSH service is running
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
          - "ansible_facts.services['sshd.service'].state == 'running'"
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"
      tags: molecule-notest

    - name: Test for SSLv3 support (should fail, indicating POODLE mitigation)
      ansible.builtin.command: openssl s_client -connect localhost:443 -ssl3
      register: ssl3_test
      failed_when: ssl3_test.rc == 0
      changed_when: false
      tags: molecule-notest

    - name: Assert SSLv3 is disabled
      ansible.builtin.assert:
        that:
          - ssl3_test.rc != 0
        fail_msg: "SSLv3 is still enabled (POODLE vulnerability not mitigated)"
        success_msg: "SSLv3 is disabled (POODLE vulnerability mitigated)"
      tags: molecule-notest