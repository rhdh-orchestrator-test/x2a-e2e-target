---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: apache2
    state: present
  become: true
- name: Ensure Apache SSL module is enabled
  ansible.builtin.command: a2enmod ssl
  register: a2enmod_result
  changed_when: "'already enabled' not in a2enmod_result.stdout"
  failed_when: false
  become: true
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: /etc/apache2/mods-available/ssl.conf
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol -all +TLSv1.2
  notify:
    - Restart apache2
    - Restart sshd
  become: true
