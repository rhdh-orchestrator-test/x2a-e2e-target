---
- name: Ensure gzip is installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
    force: false
- name: Ensure directory for Chef Automate CLI exists
  ansible.builtin.file:
    path: "{{ chef_automate_cli_binary | dirname }}"
    state: directory
    mode: "0755"
  when: chef_automate_cli_binary | dirname != '.'
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c /tmp/chef-automate_linux_amd64.zip > {{ chef_automate_cli_binary }}
    creates: "{{ chef_automate_cli_binary }}"
  args:
    chdir: "{{ ansible_env.PWD }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_binary }}"
    mode: "0755"
    state: file
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: "sudo {{ chef_automate_cli_binary }} deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{ chef_automate_accept_terms
      | lower }} "
  args:
    creates: /hab
  register: chef_automate_deploy
  changed_when: chef_automate_deploy.rc == 0
  become: true
