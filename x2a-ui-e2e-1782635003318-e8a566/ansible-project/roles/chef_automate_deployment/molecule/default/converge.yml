---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create test directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/tmp

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname | default('automate.chef.lab') }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate kernel parameters
    - name: Create max_map_count file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_max_map_count | default('262144') }}"
        dest: /tmp/molecule_test/proc/sys/vm/max_map_count
        mode: "0644"

    - name: Create dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_dirty_expire_centisecs | default('20000') }}"
        dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: /tmp/molecule_test/tmp/chef-automate
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.file:
        path: /tmp/molecule_test/hab
        state: directory
        mode: "0755"

    # Simulate user and organization key files
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/{{ chef_user_key_path | default('jtonello.pem') }}"
        mode: "0600"

    - name: Create organization key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORG KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/{{ chef_org_key_path | default('lab-validator.pem') }}"
        mode: "0600"

    # Simulate Chef server status files
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: "Service: chef-automate\nStatus: running\n"
        dest: /tmp/molecule_test/chef-automate-status
        mode: "0644"

    - name: Create Chef Infra Server status file
      ansible.builtin.copy:
        content: "Service: chef-server\nStatus: running\n"
        dest: /tmp/molecule_test/chef-server-status
        mode: "0644"

    # Simulate user and organization lists
    - name: Create user list file
      ansible.builtin.copy:
        content: "jtonello\n"
        dest: /tmp/molecule_test/chef-user-list
        mode: "0644"

    - name: Create organization list file
      ansible.builtin.copy:
        content: "lab\n"
        dest: /tmp/molecule_test/chef-org-list
        mode: "0644"