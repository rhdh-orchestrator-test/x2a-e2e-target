---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/tmp

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: "{{ item.key }} = {{ item.value }}"
        dest: "/tmp/molecule_test/etc/{{ item.key | replace('.', '_') }}.conf"
        mode: "0644"
      loop: "{{ chef_automate_sysctl | dict2items }}"

    # Simulate Chef Automate CLI download and extraction
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test{{ chef_automate_cli_path }}"
        mode: "0755"

    # Simulate Chef Automate config file
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          [global]
            # Mock Chef Automate config file
            fqdn = "{{ chef_automate_hostname }}"
          [products]
            automate = true
            infra-server = true
        dest: "/tmp/molecule_test/etc/chef-automate/config.toml"
        mode: "0644"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAx4UbaDzY5xjW6hc9jwN0mX33XpTDVW9WqHp5AKaRbtAC3DqX
          IXFMPgw3K45jxRb93f8tv9vL3rD9CUG1Gv4FM+o7ds7FRES5RTjv2RT/JVNJCoqF
          ol8+ngVQRKFJSGQMEPNEm8HlBfCBONq5BBZEV5zPCjtLsHW3xkUwm9RiPUisZDQS
          iZQohCZNyZGC3sKSJ9N6IW5tn8rTTzPNEHkQunq1gpiLLQVci/Vwq3CwMiuJu1sj
          qjuEm5J/9HMTKleNHbkCJJCJQu6JrUQGEf/X3QFNm1/RGnRaUYKVEMWxk7oRnrNS
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test{{ chef_infra_key_file }}"
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAx4UbaDzY5xjW6hc9jwN0mX33XpTDVW9WqHp5AKaRbtAC3DqX
          IXFMPgw3K45jxRb93f8tv9vL3rD9CUG1Gv4FM+o7ds7FRES5RTjv2RT/JVNJCoqF
          ol8+ngVQRKFJSGQMEPNEm8HlBfCBONq5BBZEV5zPCjtLsHW3xkUwm9RiPUisZDQS
          iZQohCZNyZGC3sKSJ9N6IW5tn8rTTzPNEHkQunq1gpiLLQVci/Vwq3CwMiuJu1sj
          qjuEm5J/9HMTKleNHbkCJJCJQu6JrUQGEf/X3QFNm1/RGnRaUYKVEMWxk7oRnrNS
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test{{ chef_infra_org_validator_file }}"
        mode: "0600"

    # Simulate Chef Server CLI tools
    - name: Create chef-server-ctl mock
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Server CLI mock"
          echo "Command: $@"
          if [[ "$1" == "user-list" ]]; then
            echo "{{ chef_infra_username }}"
          elif [[ "$1" == "org-list" ]]; then
            echo "{{ chef_infra_org_name }}"
          fi
        dest: "/tmp/molecule_test/usr/bin/chef-server-ctl"
        mode: "0755"

    # Simulate Chef Automate CLI tools
    - name: Create chef-automate mock
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI mock"
          echo "Command: $@"
          if [[ "$1" == "status" ]]; then
            echo "Chef Automate running"
          elif [[ "$1" == "journal" ]]; then
            echo "Chef Automate logs"
          fi
        dest: "/tmp/molecule_test/usr/bin/chef-automate"
        mode: "0755"