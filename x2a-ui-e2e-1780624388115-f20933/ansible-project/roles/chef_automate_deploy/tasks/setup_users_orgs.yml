---
- name: Create Chef Infra Server user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_infra_username }} {{ chef_infra_fullname }} {{ chef_infra_email }} "{{ chef_infra_password }}" --filename {{ chef_infra_key_file
      }}

      '
  args:
    creates: "{{ chef_infra_key_file }}"
  become: true
  no_log: true
- name: Create Chef Infra Server organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_infra_org_name }} "{{ chef_infra_org_fullname }}" --association_user {{ chef_infra_username }} --filename {{ chef_infra_org_validator_file
      }}

      '
  args:
    creates: "{{ chef_infra_org_validator_file }}"
  become: true
