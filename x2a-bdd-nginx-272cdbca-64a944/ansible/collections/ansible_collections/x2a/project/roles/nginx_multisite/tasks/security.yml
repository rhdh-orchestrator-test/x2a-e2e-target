---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present
  when: nginx_multisite_security_fail2ban_enabled or nginx_multisite_security_ufw_enabled or nginx_multisite_security_disable_root or not nginx_multisite_security_password_auth

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_security_fail2ban_enabled | bool

- name: Configure Fail2ban jails
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_security_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Check UFW status
  ansible.builtin.command:
    cmd: ufw status
  changed_when: false
  register: nginx_multisite_ufw_status
  when: nginx_multisite_security_ufw_enabled | bool

- name: Set UFW default incoming policy # noqa: L039 - registered by the prior UFW status task
  ansible.builtin.command:
    cmd: ufw --force default deny
  changed_when: true
  when:
    - nginx_multisite_security_ufw_enabled
    - "'Default: deny' not in nginx_multisite_ufw_status.stdout"

- name: Allow SSH through UFW # noqa: L039 - registered by the prior UFW status task
  ansible.builtin.command:
    cmd: ufw allow ssh
  changed_when: true
  when:
    - nginx_multisite_security_ufw_enabled
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTP through UFW # noqa: L039 - registered by the prior UFW status task
  ansible.builtin.command:
    cmd: ufw allow http
  changed_when: true
  when:
    - nginx_multisite_security_ufw_enabled
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTPS through UFW # noqa: L039 - registered by the prior UFW status task
  ansible.builtin.command:
    cmd: ufw allow https
  changed_when: true
  when:
    - nginx_multisite_security_ufw_enabled
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Enable UFW # noqa: L039 - registered by the prior UFW status task
  ansible.builtin.command:
    cmd: ufw --force enable
  changed_when: true
  when:
    - nginx_multisite_security_ufw_enabled
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"

- name: Configure kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx_multisite sysctl

- name: Apply kernel security settings
  ansible.posix.sysctl:
    name: "{{ item_nginx_multisite_sysctl['key'] }}"
    value: "{{ item_nginx_multisite_sysctl['value'] }}"
    sysctl_file: /etc/sysctl.d/99-security.conf
    state: present
    reload: true
  loop:
    - key: net.ipv4.conf.default.rp_filter
      value: "1"
    - key: net.ipv4.conf.all.rp_filter
      value: "1"
    - key: net.ipv4.conf.all.accept_redirects
      value: "0"
    - key: net.ipv6.conf.all.accept_redirects
      value: "0"
    - key: net.ipv4.conf.all.accept_source_route
      value: "0"
    - key: net.ipv6.conf.all.accept_source_route
      value: "0"
    - key: net.ipv4.conf.all.log_martians
      value: "1"
    - key: net.ipv4.icmp_echo_ignore_all
      value: "1"
    - key: net.ipv4.icmp_echo_ignore_broadcasts
      value: "1"
    - key: net.ipv6.conf.all.disable_ipv6
      value: "1"
    - key: net.ipv4.tcp_syncookies
      value: "1"
    - key: net.ipv4.tcp_max_syn_backlog
      value: "2048"
    - key: net.ipv4.tcp_synack_retries
      value: "2"
    - key: net.ipv4.tcp_syn_retries
      value: "5"
  loop_control:
    loop_var: item_nginx_multisite_sysctl

- name: Check whether SSH daemon configuration exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable SSH root login # noqa: L039 - registered by the prior SSH stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    create: false
    backup: true
  when:
    - nginx_multisite_security_disable_root
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart ssh

- name: Disable SSH password authentication # noqa: L039 - registered by the prior SSH stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    create: false
    backup: true
  when:
    - not nginx_multisite_security_password_auth
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart ssh
