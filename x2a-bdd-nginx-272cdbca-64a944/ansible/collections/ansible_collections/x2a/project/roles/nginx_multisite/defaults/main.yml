---
nginx_multisite_sites:
  test.cluster.local:
    document_root: /opt/server/test
    source: test/index.html
    ssl_enabled: true
    certificate: /etc/ssl/certs/test.cluster.local.crt
    key: /etc/ssl/private/test.cluster.local.key
  ci.cluster.local:
    document_root: /opt/server/ci
    source: ci/index.html
    ssl_enabled: true
    certificate: /etc/ssl/certs/ci.cluster.local.crt
    key: /etc/ssl/private/ci.cluster.local.key
  status.cluster.local:
    document_root: /opt/server/status
    source: status/index.html
    ssl_enabled: true
    certificate: /etc/ssl/certs/status.cluster.local.crt
    key: /etc/ssl/private/status.cluster.local.key
nginx_multisite_certificate_path: /etc/ssl/certs
nginx_multisite_private_key_path: /etc/ssl/private
nginx_multisite_security_fail2ban_enabled: true
nginx_multisite_security_ufw_enabled: true
nginx_multisite_security_disable_root: true
nginx_multisite_security_password_auth: false
