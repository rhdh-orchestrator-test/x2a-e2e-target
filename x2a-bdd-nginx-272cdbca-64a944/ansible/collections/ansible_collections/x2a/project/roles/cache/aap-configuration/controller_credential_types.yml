---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the reported Redis instance.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password configured for Redis requirepass authentication; store this value securely in AAP rather than as plaintext.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
