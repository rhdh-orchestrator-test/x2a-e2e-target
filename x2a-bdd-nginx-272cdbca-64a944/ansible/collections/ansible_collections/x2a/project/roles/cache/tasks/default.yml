---
- name: Configure Redis through the supported collection role  # noqa: L038 - required external Redis role is not available in this codebase
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_requirepass: "{{ redis_password }}"

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Check whether the Redis configuration exists
  ansible.builtin.stat:
    path: "/etc/redis/{{ redis_port }}.conf"
  register: redis_config

- name: Remove obsolete replication directives from Redis configuration  # noqa: L039 - redis_config is registered by the preceding stat task
  ansible.builtin.lineinfile:  # noqa: R115 - deletion is restricted to the role-default Redis configuration path
    path: "/etc/redis/{{ redis_port }}.conf"  # noqa: R114 - path uses redis_port from role defaults
    regexp: ^{{ item_cache_directive }}.*$
    state: absent
    create: false
  when:
    - ansible_facts['os_family'] is defined
    - redis_config.stat.exists
  loop:
    - replica-serve-stale-data
    - replica-read-only
    - repl-ping-replica-period
    - client-output-buffer-limit
    - replica-priority
  loop_control:
    loop_var: item_cache_directive
