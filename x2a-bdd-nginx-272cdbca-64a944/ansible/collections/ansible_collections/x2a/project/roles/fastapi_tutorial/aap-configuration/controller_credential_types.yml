---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the FastAPI application PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: database_user
          type: string
          label: Database User
          help_text: PostgreSQL role used by the FastAPI application and database provisioning tasks.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role, used during role creation and application database connections.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server.
        - id: database_port
          type: string
          label: Database Port
          help_text: TCP port for the PostgreSQL server.
      required:
        - database_user
        - db_password
        - database_name
        - database_host
        - database_port
    injectors:
      extra_vars:
        database_user: !unsafe "{{ database_user }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
        database_port: !unsafe "{{ database_port }}"
