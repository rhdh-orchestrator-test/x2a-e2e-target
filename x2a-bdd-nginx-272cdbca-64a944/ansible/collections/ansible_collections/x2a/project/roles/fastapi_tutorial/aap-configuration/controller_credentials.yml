---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials and connection settings for the FastAPI application PostgreSQL database.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      database_user: "{{ database_user }}"
      db_password: "{{ vault_db_password }}"
      database_name: "{{ database_name }}"
      database_host: "{{ database_host }}"
      database_port: "{{ database_port }}"
