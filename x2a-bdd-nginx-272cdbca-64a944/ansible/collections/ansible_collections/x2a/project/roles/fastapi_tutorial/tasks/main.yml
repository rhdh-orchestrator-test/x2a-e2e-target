---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install application and database packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize application repository # noqa: R104,R106 - trusted role-default repository uses HTTPS
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - destination is a role default
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command argument uses a role-default path
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path is a role default

- name: Install Python application dependencies # noqa: R113 - requirements target is under the role-defined application directory
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - requirements path is under role-defined app directory
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - virtualenv path is a role default

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether PostgreSQL application role exists # noqa: L039,R101 - variables are validated by the prior task; command uses validated role input
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ database_user }}';
  register: fastapi_tutorial_role_check
  changed_when: false
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL application role # noqa: L039,R101 - variables are validated by the prior task; command uses validated inputs and a prior check
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - CREATE ROLE {{ database_user }} LOGIN PASSWORD '{{ db_password }}';
  when: fastapi_tutorial_role_check.stdout | trim != '1'
  changed_when: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether application database exists # noqa: L039,R101 - variables are validated by the prior task; command uses validated database input
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}';
  register: fastapi_tutorial_database_check
  changed_when: false
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create application database # noqa: L039,R101 - variables are validated by the prior task; command uses validated inputs and a prior check
  ansible.builtin.command:
    argv:
      - createdb
      - -O
      - "{{ database_user }}"
      - "{{ database_name }}"
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  changed_when: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant database privileges to application role # noqa: L039,R101 - variables are validated by the prior task; command uses validated database inputs
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ database_user }};
  changed_when: false
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy application environment file # noqa: L039 - credential and connection variables are validated by the prior task
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ database_user }}:{{ db_password }}@{{ database_host }}:{{ database_port }}/{{ database_name }}
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path is under role-defined app directory
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - service path is a role default
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd manager configuration

- name: Enable and start FastAPI tutorial service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    daemon_reload: true
    enabled: true
    state: started
