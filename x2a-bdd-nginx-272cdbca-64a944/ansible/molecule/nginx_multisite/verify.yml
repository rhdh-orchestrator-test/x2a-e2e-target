---
# Unsupported: exact UFW rule output, ownership/modes, individual sysctl values,
# and Fail2ban jail counters have no stated expected values in the pre-flight checks.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: true
  vars:
    nginx_multisite_sites:
      - name: test.cluster.local
        root: /opt/server/test
        config: /etc/nginx/sites-available/test.cluster.local
        enabled: /etc/nginx/sites-enabled/test.cluster.local
        certificate: /etc/ssl/certs/test.cluster.local.crt
        key: /etc/ssl/private/test.cluster.local.key
        index: /opt/server/test/index.html
      - name: ci.cluster.local
        root: /opt/server/ci
        config: /etc/nginx/sites-available/ci.cluster.local
        enabled: /etc/nginx/sites-enabled/ci.cluster.local
        certificate: /etc/ssl/certs/ci.cluster.local.crt
        key: /etc/ssl/private/ci.cluster.local.key
        index: /opt/server/ci/index.html
      - name: status.cluster.local
        root: /opt/server/status
        config: /etc/nginx/sites-available/status.cluster.local
        enabled: /etc/nginx/sites-enabled/status.cluster.local
        certificate: /etc/ssl/certs/status.cluster.local.crt
        key: /etc/ssl/private/status.cluster.local.key
        index: /opt/server/status/index.html

  tasks:
    - name: Check packages from the pre-flight package command
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert pre-flight packages are installed
      ansible.builtin.assert:
        that: item_package in ansible_facts.packages
        fail_msg: A required pre-flight package is not installed.
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Check pre-flight services
      ansible.builtin.service_facts:

    - name: Assert nginx, Fail2ban, and SSH are running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['nginx.service']['state'] == 'running'
          - ansible_facts.services['fail2ban.service']['state'] == 'running'
          - >-
            (ansible_facts.services['ssh.service']['state'] | default('')) == 'running' or
            (ansible_facts.services['sshd.service']['state'] | default('')) == 'running'
        fail_msg: A required pre-flight service is not running.

    - name: Validate nginx configuration from the pre-flight command
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Check common pre-flight paths
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      loop:
        - path: /etc/nginx/nginx.conf
        - path: /etc/nginx/conf.d/security.conf
        - path: /etc/fail2ban/jail.local
        - path: /etc/sysctl.d/99-security.conf
        - path: /etc/ssh/sshd_config
        - path: /etc/ssl/certs
        - path: /etc/ssl/private
        - path: /opt/server/test
        - path: /opt/server/ci
        - path: /opt/server/status
        - path: /var/log/nginx/access.log
        - path: /var/log/nginx/error.log
        - path: /var/log/auth.log
      loop_control:
        loop_var: item_path
      register: nginx_multisite_common_paths

    - name: Assert common pre-flight paths exist
      ansible.builtin.assert:
        that: item_path_result['stat']['exists']
        fail_msg: A required pre-flight path is missing.
      loop: "{{ nginx_multisite_common_paths['results'] }}"
      loop_control:
        loop_var: item_path_result

    - name: Check that the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: nginx_multisite_default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that: not nginx_multisite_default_site['stat']['exists']
        fail_msg: The default nginx site is present.

    - name: Check site roots, content, configurations, links, and TLS files
      ansible.builtin.stat:
        path: "{{ item_site_path['path'] }}"
        follow: false
      loop:
        - path: /opt/server/test
        - path: /opt/server/test/index.html
        - path: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/test.cluster.local
          symlink: true
        - path: /etc/ssl/certs/test.cluster.local.crt
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /opt/server/ci
        - path: /opt/server/ci/index.html
        - path: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          symlink: true
        - path: /etc/ssl/certs/ci.cluster.local.crt
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /opt/server/status
        - path: /opt/server/status/index.html
        - path: /etc/nginx/sites-available/status.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
          symlink: true
        - path: /etc/ssl/certs/status.cluster.local.crt
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_site_path
      register: nginx_multisite_site_paths

    - name: Assert site artifacts and enabled links exist
      ansible.builtin.assert:
        that:
          - item_site_result['stat']['exists']
          - >-
            (not (item_site_result['item']['symlink'] | default(false))) or
            item_site_result['stat']['islnk']
        fail_msg: A required site artifact is missing or is not a symbolic link.
      loop: "{{ nginx_multisite_site_paths['results'] }}"
      loop_control:
        loop_var: item_site_result

    - name: Read global nginx configurations
      ansible.builtin.slurp:
        src: "{{ item_global_file['path'] }}"
      loop:
        - path: /etc/nginx/nginx.conf
          pattern: '(worker_processes|worker_connections|access_log|error_log|gzip)'
        - path: /etc/nginx/conf.d/security.conf
          pattern: '(server_tokens|limit_req_zone|client_max_body_size|ssl_protocols|ssl_ciphers)'
      loop_control:
        loop_var: item_global_file
      register: nginx_multisite_global_configs

    - name: Assert global nginx pre-flight directives are present
      ansible.builtin.assert:
        that: (item_global_result['content'] | b64decode) is search(item_global_result['item']['pattern'])
        fail_msg: A required global nginx directive is missing.
      loop: "{{ nginx_multisite_global_configs['results'] }}"
      loop_control:
        loop_var: item_global_result

    - name: Read each site configuration
      ansible.builtin.slurp:
        src: "{{ item_site['config'] }}"
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site
      register: nginx_multisite_site_configs

    - name: Assert each site configuration has the pre-flight directives
      ansible.builtin.assert:
        that:
          - (item_site_config['content'] | b64decode) is search('listen 80')
          - (item_site_config['content'] | b64decode) is search('listen 443 ssl http2')
          - (item_site_config['content'] | b64decode) is search(item_site_config['item']['name'])
          - (item_site_config['content'] | b64decode) is search(item_site_config['item']['root'])
          - (item_site_config['content'] | b64decode) is search(item_site_config['item']['certificate'])
          - (item_site_config['content'] | b64decode) is search(item_site_config['item']['key'])
        fail_msg: A required site configuration directive is missing.
      loop: "{{ nginx_multisite_site_configs['results'] }}"
      loop_control:
        loop_var: item_site_config

    - name: Check certificate subjects from the pre-flight command
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['certificate'] }}"
          - -noout
          - -subject
          - -dates
      changed_when: false
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_certificate
      register: nginx_multisite_certificates

    - name: Assert each certificate subject contains its hostname
      ansible.builtin.assert:
        that: item_certificate_result['item']['name'] in item_certificate_result['stdout']
        fail_msg: A certificate subject does not contain its hostname.
      loop: "{{ nginx_multisite_certificates['results'] }}"
      loop_control:
        loop_var: item_certificate_result

    - name: Check HTTP and HTTPS pre-flight endpoints
      ansible.builtin.uri:
        url: "{{ item_endpoint['url'] }}"
        headers:
          Host: "{{ item_endpoint['host'] }}"
        follow_redirects: none
        return_content: true
        validate_certs: false
        status_code: "{{ item_endpoint['status'] }}"
      loop:
        - host: test.cluster.local
          url: http://127.0.0.1/
          status: 301
        - host: test.cluster.local
          url: https://127.0.0.1/
          status: 200
          content: test|html
        - host: ci.cluster.local
          url: http://127.0.0.1/
          status: 301
        - host: ci.cluster.local
          url: https://127.0.0.1/
          status: 200
          content: ci|html
        - host: status.cluster.local
          url: http://127.0.0.1/
          status: 301
        - host: status.cluster.local
          url: https://127.0.0.1/
          status: 200
          content: status|html
      loop_control:
        loop_var: item_endpoint
      register: nginx_multisite_endpoints

    - name: Assert HTTPS content and security headers
      ansible.builtin.assert:
        that:
          - item_response['content'] is search(item_response['item']['content'])
          - "'strict-transport-security' in (item_response['headers'] | string | lower)"
          - "'x-frame-options' in (item_response['headers'] | string | lower)"
          - "'x-content-type-options' in (item_response['headers'] | string | lower)"
          - "'x-xss-protection' in (item_response['headers'] | string | lower)"
          - "'referrer-policy' in (item_response['headers'] | string | lower)"
          - "'content-security-policy' in (item_response['headers'] | string | lower)"
        fail_msg: An HTTPS endpoint did not meet the explicit pre-flight expectations.
      loop: "{{ nginx_multisite_endpoints['results'] }}"
      loop_control:
        loop_var: item_response
      when: item_response['item']['url'] is search('^https:')
