---
argument_specs:
  main:
    short_description: Configures FastAPI tutorial application with PostgreSQL
    description:
      - Deploys a FastAPI tutorial web application with PostgreSQL database backend
      - Installs Python dependencies, clones the application from GitHub
      - Sets up a virtual environment, configures PostgreSQL with dedicated database and user
      - Runs the FastAPI app as a systemd service on port 8000
      - Uses community.postgresql collection for proper database management
    options:
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Directory where the FastAPI application will be installed
      fastapi_tutorial_repo_url:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the FastAPI tutorial application
      fastapi_tutorial_repo_branch:
        type: str
        required: false
        default: main
        description: Git branch to checkout from the repository
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Name of the systemd service for the FastAPI application
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port the FastAPI application listens on
      fastapi_tutorial_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Host address the FastAPI application binds to
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name used in the environment configuration
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version used in the environment configuration
      fastapi_tutorial_system_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - "{{ 'libpq-dev' if ansible_os_family == 'Debian' else 'postgresql-devel' }}"
        description: List of system packages required for the FastAPI application (includes distribution-specific PostgreSQL client libraries)
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: User account under which the FastAPI service runs
      fastapi_tutorial_service_group:
        type: str
        required: false
        default: root
        description: Group account under which the FastAPI service runs
      fastapi_tutorial_working_directory:
        type: str
        required: false
        default: "{{ fastapi_tutorial_app_dir }}"
        description: Working directory for the FastAPI service
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: "{{ fastapi_tutorial_app_dir }}/venv"
        description: Path to the Python virtual environment
      fastapi_tutorial_requirements_file:
        type: str
        required: false
        default: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
        description: Path to the Python requirements file
      fastapi_tutorial_dir_mode:
        type: str
        required: false
        default: "0755"
        description: File permissions for directories created by the role
      fastapi_tutorial_file_mode:
        type: str
        required: false
        default: "0644"
        description: File permissions for files created by the role
      fastapi_tutorial_env_file:
        type: str
        required: false
        default: "{{ fastapi_tutorial_app_dir }}/.env"
        description: Path to the environment configuration file
      fastapi_tutorial_systemd_service_file:
        type: str
        required: false
        default: /etc/systemd/system/{{ fastapi_tutorial_service_name }}.service
        description: Path to the systemd service file
      db_username:
        type: str
        required: true
        description: Database username injected by AAP credential type
      db_password:
        type: str
        required: true
        description: Database password injected by AAP credential type
      db_name:
        type: str
        required: true
        description: Database name injected by AAP credential type
      db_host:
        type: str
        required: true
        description: Database host injected by AAP credential type
      db_port:
        type: str
        required: true
        description: Database port injected by AAP credential type
