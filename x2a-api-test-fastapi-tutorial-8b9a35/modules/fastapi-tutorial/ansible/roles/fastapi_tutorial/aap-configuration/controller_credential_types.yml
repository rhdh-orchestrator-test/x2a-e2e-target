---
controller_credential_types:
- name: PostgreSQL Database Credential
  description: Database credentials for FastAPI application to connect to PostgreSQL
    backend
  kind: cloud
  inputs:
    fields:
    - id: db_password
      type: string
      label: Database Password
      secret: true
      help_text: Password for the PostgreSQL fastapi user
    - id: db_username
      type: string
      label: Database Username
      help_text: Username for PostgreSQL database connection
    - id: db_name
      type: string
      label: Database Name
      help_text: Name of the PostgreSQL database
    - id: db_host
      type: string
      label: Database Host
      help_text: PostgreSQL server hostname or IP address
    - id: db_port
      type: string
      label: Database Port
      help_text: PostgreSQL server port number
    required:
    - db_password
    - db_username
    - db_name
  injectors:
    extra_vars:
      db_password: !unsafe '{{ db_password }}'
      db_username: !unsafe '{{ db_username }}'
      db_name: !unsafe '{{ db_name }}'
      db_host: !unsafe '{{ db_host }}'
      db_port: !unsafe '{{ db_port }}'
