---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: "{{ apache_service_name }}"
    state: present
  become: true
- name: Check if Apache SSL config file exists
  ansible.builtin.stat:
    path: "{{ apache_ssl_conf_path }}"
  register: ssl_conf_stat
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: "{{ apache_ssl_conf_path }}"
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol {{ ssl_protocol }}
  notify:
    - Restart apache
    - Restart sshd
  when: ssl_conf_stat.stat.exists
