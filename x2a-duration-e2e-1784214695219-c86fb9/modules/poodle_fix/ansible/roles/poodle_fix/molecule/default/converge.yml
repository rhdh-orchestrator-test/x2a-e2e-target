---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create directory structure for Apache SSL config
      ansible.builtin.file:
        path: "/tmp/molecule_test/etc/apache2/mods-available"
        state: directory
        mode: "0755"

    - name: Create sample Apache SSL config file with vulnerable configuration
      ansible.builtin.copy:
        content: |
          # Sample SSL configuration file for testing
          # This contains a vulnerable SSL protocol configuration that will be fixed by the role
          SSLProtocol all -SSLv2
          SSLCipherSuite HIGH:MEDIUM:!aNULL:!MD5
          SSLHonorCipherOrder on
        dest: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
        mode: "0644"

    # Override default variables for testing
    - name: Set test variables
      ansible.builtin.set_fact:
        apache_ssl_conf_path: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
        # Keep the original protocol setting
        ssl_protocol: "-all +TLSv1.2"
        # No need to actually restart services in molecule tests
        apache_service_name: "apache2"
        ssh_service_name: "sshd"

    # Include the role tasks directly instead of using include_role
    # This avoids actual service restarts in the container
    - name: Include role tasks
      ansible.builtin.include_tasks: "../../tasks/main.yml"