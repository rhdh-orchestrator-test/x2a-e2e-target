---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check if Apache SSL config file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_conf_file

    - name: Assert SSL config file exists
      ansible.builtin.assert:
        that:
          - ssl_conf_file.stat.exists
          - ssl_conf_file.stat.isreg
        fail_msg: "Apache SSL configuration file not found"
        success_msg: "Apache SSL configuration file exists"

    - name: Get SSL configuration content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_conf_content
      when: ssl_conf_file.stat.exists

    - name: Assert SSL protocol is properly configured (POODLE fix applied)
      ansible.builtin.assert:
        that:
          - ssl_conf_content.content | b64decode | regex_search('SSLProtocol -all \+TLSv1\.2')
        fail_msg: "SSL protocol configuration was not properly updated to mitigate POODLE vulnerability"
        success_msg: "SSL protocol configuration was properly updated to mitigate POODLE vulnerability"
      when: ssl_conf_file.stat.exists

    # Service checks that can't run in container - tagged with molecule-notest
    - name: Check if Apache service is running
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2' in ansible_facts.services"
          - "ansible_facts.services['apache2'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Assert SSH service is running
      ansible.builtin.assert:
        that:
          - "'sshd' in ansible_facts.services"
          - "ansible_facts.services['sshd'].state == 'running'"
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"
      tags: molecule-notest

    # SSL connection tests that can't run in container - tagged with molecule-notest
    - name: Test TLSv1.2 connection
      ansible.builtin.command: openssl s_client -connect localhost:443 -tls1_2
      register: tls_test
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert TLSv1.2 connection works
      ansible.builtin.assert:
        that:
          - tls_test.rc == 0
        fail_msg: "TLSv1.2 connection failed"
        success_msg: "TLSv1.2 connection successful"
      tags: molecule-notest

    - name: Test SSLv3 connection (should fail)
      ansible.builtin.command: openssl s_client -connect localhost:443 -ssl3
      register: ssl3_test
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert SSLv3 connection fails (POODLE mitigation)
      ansible.builtin.assert:
        that:
          - ssl3_test.rc != 0
        fail_msg: "SSLv3 connection succeeded - POODLE vulnerability may still exist"
        success_msg: "SSLv3 connection failed - POODLE vulnerability mitigated"
      tags: molecule-notest