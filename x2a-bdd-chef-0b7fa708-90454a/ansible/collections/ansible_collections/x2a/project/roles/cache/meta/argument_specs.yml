---
argument_specs:
  main:
    short_description: Install and configure Memcached and Redis cache services
    description:
      - Deploys Memcached with the migrated cookbook limits and configures a standalone Redis instance.
    options:
      memcached_version:
        type: str
        required: false
        default:
        description: Optional Memcached package version.
      memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory limit in megabytes.
      memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached connections.
      memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      memcached_threads:
        type: int
        required: false
        default:
        description: Optional Memcached worker thread count.
      memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Experimental Memcached options.
      memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional Memcached command-line options.
      memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached process file descriptor limit.
      memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log path.
      memcached_user:
        type: str
        required: false
        default: service_user
        description: Memcached service user.
      redis_version:
        type: str
        required: false
        default: "7.2"
        description: Redis package version.
      redis_port:
        type: int
        required: false
        default: 6379
        description: Redis TCP port.
      redis_pid_directory:
        type: str
        required: false
        default: /run/redis
        description: Redis PID directory.
      redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide tasks that handle the Redis credential from logs.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
