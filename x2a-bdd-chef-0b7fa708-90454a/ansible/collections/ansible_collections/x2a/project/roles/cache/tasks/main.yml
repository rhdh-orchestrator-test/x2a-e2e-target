---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Redis cache service
  ansible.builtin.include_role:
    name: eloy.redis.redis # noqa: L038 - external role is declared in this role's requirements.yml and cannot be resolved locally
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_install_method: package
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ redis_log_directory }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Remove replication directives from Redis configuration
  ansible.builtin.lineinfile:
    path: /etc/redis/{{ redis_port }}.conf # noqa: R114 - port is a role default, not user input
    regexp: ^{{ item_cache_directive }}.*$
    state: absent # noqa: R115 - port is a role default, not user input
  loop:
    - replica-serve-stale-data
    - replica-read-only
    - repl-ping-replica-period
    - client-output-buffer-limit
    - replica-priority
  loop_control:
    loop_var: item_cache_directive

- name: Include Memcached configuration
  ansible.builtin.include_tasks: memcached.yml
