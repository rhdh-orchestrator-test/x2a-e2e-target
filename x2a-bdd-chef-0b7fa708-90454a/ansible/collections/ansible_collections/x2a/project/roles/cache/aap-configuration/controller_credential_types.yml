---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis instance listening on port 6379; the source value is hardcoded in the Chef recipe and should
      be migrated to protected AAP credential storage.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required to authenticate to the Redis instance on port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
