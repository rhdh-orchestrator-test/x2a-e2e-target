---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Ensure sysctl configuration directory exists
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure fail2ban jail
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Read UFW status
  ansible.builtin.command:
    cmd: ufw status
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false
  register: nginx_multisite_ufw_status

- name: Set UFW default policy # noqa: L039 - nginx_multisite_ufw_status is registered by the preceding UFW status task
  ansible.builtin.shell:
    cmd: ufw --force default deny
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Default: deny' not in nginx_multisite_ufw_status.stdout"
  args:
    executable: /bin/sh

- name: Allow SSH through UFW
  ansible.builtin.command:
    cmd: ufw allow ssh
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout" # noqa: L039 - registered by the preceding UFW status task
  changed_when: true

- name: Allow HTTP through UFW
  ansible.builtin.command:
    cmd: ufw allow http
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout" # noqa: L039 - registered by the preceding UFW status task
  changed_when: true

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    cmd: ufw allow https
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout" # noqa: L039 - registered by the preceding UFW status task
  changed_when: true

- name: Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Status: active' not in nginx_multisite_ufw_status.stdout" # noqa: L039 - registered by the preceding UFW status task
  changed_when: true

- name: Render sysctl security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Apply sysctl security settings
  ansible.posix.sysctl:
    name: "{{ item_nginx_multisite_sysctl['key'] }}"
    value: "{{ item_nginx_multisite_sysctl['value'] }}"
    sysctl_file: /etc/sysctl.d/99-security.conf
    state: present
    reload: true
  loop:
    - { key: net.ipv4.conf.default.rp_filter, value: "1" }
    - { key: net.ipv4.conf.all.rp_filter, value: "1" }
    - { key: net.ipv4.conf.all.accept_redirects, value: "0" }
    - { key: net.ipv6.conf.all.accept_redirects, value: "0" }
    - { key: net.ipv4.conf.default.accept_redirects, value: "0" }
    - { key: net.ipv6.conf.default.accept_redirects, value: "0" }
    - { key: net.ipv4.conf.all.send_redirects, value: "0" }
    - { key: net.ipv6.conf.all.send_redirects, value: "0" }
    - { key: net.ipv4.conf.all.accept_source_route, value: "0" }
    - { key: net.ipv6.conf.all.accept_source_route, value: "0" }
    - { key: net.ipv4.conf.default.accept_source_route, value: "0" }
    - { key: net.ipv6.conf.default.accept_source_route, value: "0" }
    - { key: net.ipv4.conf.all.log_martians, value: "1" }
    - { key: net.ipv4.conf.default.log_martians, value: "1" }
    - { key: net.ipv4.icmp_echo_ignore_all, value: "1" }
    - { key: net.ipv4.icmp_echo_ignore_broadcasts, value: "1" }
    - { key: net.ipv6.conf.all.disable_ipv6, value: "1" }
    - { key: net.ipv6.conf.default.disable_ipv6, value: "1" }
    - { key: net.ipv6.conf.lo.disable_ipv6, value: "1" }
    - { key: net.ipv4.tcp_syncookies, value: "1" }
    - { key: net.ipv4.tcp_max_syn_backlog, value: "2048" }
    - { key: net.ipv4.tcp_synack_retries, value: "2" }
    - { key: net.ipv4.tcp_syn_retries, value: "5" }
  loop_control:
    loop_var: item_nginx_multisite_sysctl

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    backup: true
  when: nginx_multisite_ssh_disable_root | bool
  notify: Restart sshd

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    backup: true
  when: not nginx_multisite_ssh_password_auth | bool
  notify: Restart sshd
