---
- name: Create nginx sites directories
  ansible.builtin.file:
    path: "{{ item_nginx_multisite_sites_dir }}" # noqa: R114 - loop values are fixed role-defined nginx site directories
    owner: root
    group: root
    mode: "0755"
    state: directory
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
  loop_control:
    loop_var: item_nginx_multisite_sites_dir

- name: Render nginx site configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_nginx_multisite_site['value']['id'] }} # noqa: R114 - site IDs are role-defined
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site
  notify: Reload nginx
  vars:
    server_name: "{{ item_nginx_multisite_site['value']['id'] }}"
    document_root: "{{ item_nginx_multisite_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_nginx_multisite_site['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_multisite_site['value']['id'] }}.crt"
    key_file: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_multisite_site['value']['id'] }}.key"

- name: Enable nginx sites
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_nginx_multisite_enabled['value']['id'] }} # noqa: R114 - site IDs are role-defined
    dest: /etc/nginx/sites-enabled/{{ item_nginx_multisite_enabled['value']['id'] }} # noqa: R114 - site IDs are role-defined
    state: link
    owner: root
    group: root
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_enabled
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
