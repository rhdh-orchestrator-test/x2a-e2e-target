---
argument_specs:
  main:
    short_description: Install and configure a secure nginx multisite server
    description:
      - Installs nginx, fail2ban, UFW, and SSL dependencies.
      - Configures security settings and dynamically renders nginx virtual hosts.
    options:
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for site certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and enable fail2ban.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and enable UFW.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_sites:
        type: dict
        required: false
        default: {}
        description: Site definitions keyed by site identifier.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the site token.
      nginx_multisite_site_token:
        type: str
        required: false
        description: Secret site token injected by an approved credential source.
