---
controller_credential_types:
  - name: PostgreSQL Application Credentials
    description: Hardcoded PostgreSQL application credentials used to create the FastAPI database role and connect the application to its database.
    kind: cloud
    inputs:
      fields:
        - id: username
          type: string
          label: Database Username
          help_text: PostgreSQL role name used by the FastAPI application and as the database owner.
        - id: password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL application role, used in the role definition and DATABASE_URL.
      required:
        - username
        - password
    injectors:
      extra_vars:
        username: !unsafe "{{ username }}"
        password: !unsafe "{{ password }}"
