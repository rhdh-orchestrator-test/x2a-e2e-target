---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application with PostgreSQL.
    description:
      - Deploys the FastAPI tutorial repository, Python virtual environment, PostgreSQL database, and systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_service_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by the FastAPI service.
      fastapi_tutorial_db_name:
        type: str
        required: false
        default: fastapi_db
        description: PostgreSQL database name.
      fastapi_tutorial_db_host:
        type: str
        required: false
        default: localhost
        description: PostgreSQL database host.
      fastapi_tutorial_db_port:
        type: int
        required: false
        default: 5432
        description: PostgreSQL database port.
      fastapi_tutorial_db_user:
        type: str
        required: false
        default: "{{ username }}"
        description: PostgreSQL application role name, supplied by the AAP credential username.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations that handle the database password.
      username:
        type: str
        required: true
        description: PostgreSQL application role name injected by the AAP credential type.
      password:
        type: str
        required: true
        description: PostgreSQL application password injected by the AAP credential type.
