---
- name: Check if Chef admin user exists
  ansible.builtin.command:
    cmd: chef-server-ctl user-list
  become: true
  register: chef_user_list
  changed_when: false
  check_mode: false
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username | default(chef_automate_username) }} {{ full_name | default(chef_automate_longusername) }} {{ email |
      default(chef_automate_useremail) }} "{{ password }}" --filename {{ chef_automate_user_key_path }}
  become: true
  register: chef_user_create_result
  changed_when: chef_user_create_result.rc == 0
  failed_when: chef_user_create_result.rc != 0 and "already exists" not in chef_user_create_result.stderr
  no_log: true
  when: username | default(chef_automate_username) not in chef_user_list.stdout
- name: Check if Chef organization exists
  ansible.builtin.command:
    cmd: chef-server-ctl org-list
  become: true
  register: chef_org_list
  changed_when: false
  check_mode: false
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_orgname }} "{{ chef_automate_longorgname }}" --association_user {{ username |
      default(chef_automate_username) }} --filename {{ chef_automate_org_key_path }}
  become: true
  register: chef_org_create_result
  changed_when: chef_org_create_result.rc == 0
  failed_when: chef_org_create_result.rc != 0 and "already exists" not in chef_org_create_result.stderr
  when: chef_automate_orgname not in chef_org_list.stdout
