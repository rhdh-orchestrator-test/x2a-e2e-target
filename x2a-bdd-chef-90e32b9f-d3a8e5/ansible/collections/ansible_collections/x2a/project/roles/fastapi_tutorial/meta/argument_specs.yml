---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application
    description:
      - Deploys the FastAPI tutorial application from Git and configures its PostgreSQL dependency.
      - Creates a Python virtual environment and manages the FastAPI systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Filesystem path where the FastAPI application is checked out.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_service_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which Uvicorn listens.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations that process the database password.
      db_username:
        type: str
        required: true
        description: PostgreSQL username injected by the AAP credential type.
      db_password:
        type: str
        required: true
        description: PostgreSQL password injected by the AAP credential type.
      db_name:
        type: str
        required: true
        description: PostgreSQL database name injected by the AAP credential type.
      db_host:
        type: str
        required: true
        description: PostgreSQL host injected by the AAP credential type.
