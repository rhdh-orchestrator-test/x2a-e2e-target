---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install required packages on RedHat-family systems
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Install required packages on Debian-family systems
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Initialize PostgreSQL on RedHat-family systems
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository  # noqa: R104 - repository URL comes from a trusted role default
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R106 - repository URL is a trusted role default controlled by the operator
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - destination is a role default controlled by the operator
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment
  ansible.builtin.command:  # noqa: R101 - command path is constructed from a trusted role default
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_app_path }}/venv"
    creates: "{{ fastapi_tutorial_app_path }}/venv" # noqa: R114 - path is derived from a role default

- name: Install Python dependencies  # noqa: R113 - requirements path is derived from a trusted role default
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_app_path }}/venv"

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create FastAPI PostgreSQL role and database  # noqa: L039 - credential variables are validated by the preceding include task
  ansible.builtin.shell:  # noqa: R101 - validated credential variables are intentionally passed to the PostgreSQL command
    cmd: |
      psql -v ON_ERROR_STOP=1 -v username={{ db_username | quote }} -v password={{ db_password | quote }} -v dbname={{ db_name | quote }} --dbname=postgres <<'SQL'
      DO $do$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'username') THEN
          EXECUTE format('CREATE ROLE %I LOGIN PASSWORD %L', :'username', :'password');
        END IF;
      END
      $do$;
      SELECT format('CREATE DATABASE %I OWNER %I', :'dbname', :'username')
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'dbname')\gexec
      SELECT format('GRANT ALL PRIVILEGES ON DATABASE %I TO %I', :'dbname', :'username')\gexec
      SQL
  become: true  # noqa: R108 - PostgreSQL role and database management requires the postgres account
  become_user: postgres
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write application environment file  # noqa: L039 - credential variables are validated by the preceding include task
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}/{{ db_name }}
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - path is derived from a role default
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_app_path }}/venv/bin"
      ExecStart={{ fastapi_tutorial_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Reload systemd after installing FastAPI unit
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
