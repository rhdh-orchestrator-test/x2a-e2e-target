---
controller_credential_types:
  - name: Chef Encrypted Data Bag Nginx Site Token
    description: Encrypted site token loaded from the Chef nginx_secrets/site data bag item and deployed for Nginx site use.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Nginx Site Token
          secret: true
          help_text: Secret token loaded from the Chef encrypted data bag nginx_secrets/site and written for Nginx site use.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
