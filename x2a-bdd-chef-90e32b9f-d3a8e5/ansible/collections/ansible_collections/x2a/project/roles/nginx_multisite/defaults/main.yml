---
# defaults file for x2a.project.nginx_multisite
nginx_multisite_my_variable: default_value

# SSL locations
nginx_ssl_certificate_path: /etc/ssl/certs
nginx_ssl_private_key_path: /etc/ssl/private

# Security settings
security_fail2ban_enabled: true
security_ufw_enabled: true
security_ssh_disable_root: true
security_ssh_password_auth: false
nginx_multisite_secure_logging: true

# Site definitions and the credential supplied by AAP
nginx_sites: []
