---
- name: Install Nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Render Nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Render Nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create Nginx secrets directory
  ansible.builtin.file:
    path: /etc/nginx/secrets
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write Nginx site token  # noqa: L039 - site_token is validated by the preceding credential validation task
  ansible.builtin.copy:
    content: "{{ site_token }}"
    dest: /etc/nginx/secrets/site_token
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Create site document roots
  ansible.builtin.file:
    path: "{{ item_site['document_root'] }}"  # noqa: R114 - loop over role-defined nginx_sites data
    state: directory
    owner: nginx
    group: nginx
    mode: "0755"
    recurse: true
  loop: "{{ nginx_sites }}"
  loop_control:
    loop_var: item_site

- name: Deploy site index files
  ansible.builtin.copy:
    src: "{{ item_site['id'].split('.')[0] }}/index.html"  # noqa: R114 - source is derived from role-defined nginx_sites data
    dest: "{{ item_site['document_root'] }}/index.html"  # noqa: R114 - destination is derived from role-defined nginx_sites data
    owner: nginx
    group: nginx
    mode: "0644"
    backup: true
  loop: "{{ nginx_sites }}"
  loop_control:
    loop_var: item_site
