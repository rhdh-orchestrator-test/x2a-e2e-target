---
argument_specs:
  main:
    short_description: Install and configure Memcached and Redis cache services.
    description:
      - Configures the Memcached cache instance and delegates Redis configuration to the eloy.redis collection role.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output for tasks handling cache credentials.
      memcached_version:
        type: str
        required: false
        default:
        description: Memcached package version, when specified.
      memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory allocation in megabytes.
      memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      memcached_max_connections:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached connections.
      memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional experimental Memcached options.
      memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional Memcached command-line options.
      memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file descriptor limit.
      memcached_log_path:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log path.
      memcached_threads:
        type: int
        required: false
        default: 4
        description: Number of Memcached worker threads.
      memcached_service_user:
        type: str
        required: false
        default: memcached
        description: Memcached service account.
      memcached_service_group:
        type: str
        required: false
        default: memcached
        description: Memcached service group.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
