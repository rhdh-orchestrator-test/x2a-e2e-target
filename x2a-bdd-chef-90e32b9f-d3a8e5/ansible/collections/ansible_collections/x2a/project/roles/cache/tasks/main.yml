---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached cache server
  ansible.builtin.include_tasks: memcached.yml

- name: Configure Redis cache server
  ansible.builtin.include_role:
    name: eloy.redis.redis
  # noqa: L038 - external eloy.redis.redis role is declared in this role's requirements.yml and resolved at dependency installation time
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: 6379
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Remove obsolete Redis replication directives
  ansible.builtin.replace:
    path: /etc/redis/6379.conf
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)\\s+.*$
    replace: ""
  notify: Restart Redis
