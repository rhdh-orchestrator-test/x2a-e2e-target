---
controller_credential_types:
  - name: Redis Cache Authentication
    description: Hardcoded Redis authentication password that must be migrated to Ansible Vault or an approved AAP secret mechanism.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password used by Redis requirepass authentication on port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
