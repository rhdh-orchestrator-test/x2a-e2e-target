---
# Unsupported pre-flight checks: exact Memcached service account and file-descriptor
# values are not supplied; Redis authentication requires the vaulted password; and
# vault storage/plaintext-source-control checks cannot be performed by this play.
# Redis journal-content checks are also omitted because the valid unit name varies
# by distribution and the plan does not define stable log text to assert.

- name: Verify cache services and files
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather service facts for cache services
      ansible.builtin.service_facts:

    - name: Assert the Memcached service is active and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['memcached.service']['state'] == 'running'
          - ansible_facts.services['memcached.service']['status'] == 'enabled'
        fail_msg: Memcached must be active and enabled.

    - name: Check that a Memcached process is running
      ansible.builtin.command:
        argv:
          - ps
          - aux
      register: cache_memcached_process
      changed_when: false

    - name: Assert a Memcached process is running
      ansible.builtin.assert:
        that:
          - cache_memcached_process.stdout is search('(?m)^.*[m]emcached.*$')
        fail_msg: A Memcached process must be running.

    - name: Check the Memcached TCP listener
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: cache_memcached_tcp
      changed_when: false

    - name: Assert Memcached listens on TCP port 11211
      ansible.builtin.assert:
        that:
          - cache_memcached_tcp.stdout is search(':11211\\b')
        fail_msg: Memcached must listen on TCP port 11211.

    - name: Check the Memcached UDP listener
      ansible.builtin.command:
        argv:
          - ss
          - -ulnp
      register: cache_memcached_udp
      changed_when: false

    - name: Assert Memcached listens on UDP port 11211
      ansible.builtin.assert:
        that:
          - cache_memcached_udp.stdout is search(':11211\\b')
        fail_msg: Memcached must listen on UDP port 11211.

    - name: Query the Memcached version endpoint
      ansible.builtin.command:
        argv:
          - nc
          - -w
          - '2'
          - 127.0.0.1
          - '11211'
        stdin: "version\r\nquit\r\n"
      register: cache_memcached_version
      changed_when: false

    - name: Assert Memcached returns a VERSION response
      ansible.builtin.assert:
        that:
          - cache_memcached_version.stdout is search('(?m)^VERSION\\s+')
        fail_msg: Memcached must return a VERSION response.

    - name: Inspect the Memcached log directory
      ansible.builtin.stat:
        path: /var/log/memcached
      register: cache_memcached_log_dir

    - name: Assert the Memcached log directory exists with mode 0755
      ansible.builtin.assert:
        that:
          - cache_memcached_log_dir.stat.exists
          - cache_memcached_log_dir.stat.mode == '0755'
        fail_msg: /var/log/memcached must exist with mode 0755.

    - name: Inspect the Memcached runtime directory
      ansible.builtin.stat:
        path: /var/run/memcached
      register: cache_memcached_run_dir

    - name: Assert the Memcached runtime directory exists with mode 0755
      ansible.builtin.assert:
        that:
          - cache_memcached_run_dir.stat.exists
          - cache_memcached_run_dir.stat.mode == '0755'
        fail_msg: /var/run/memcached must exist with mode 0755.

    - name: Assert the Redis service for port 6379 is active and enabled
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts.services['redis.service'] is defined and
            ansible_facts.services['redis.service']['state'] == 'running' and
            ansible_facts.services['redis.service']['status'] == 'enabled') or
            (ansible_facts.services['redis-server.service'] is defined and
            ansible_facts.services['redis-server.service']['state'] == 'running' and
            ansible_facts.services['redis-server.service']['status'] == 'enabled')
        fail_msg: The Redis service for port 6379 must be active and enabled.

    - name: Check that a Redis process is running
      ansible.builtin.command:
        argv:
          - ps
          - aux
      register: cache_redis_process
      changed_when: false

    - name: Assert a Redis process is running
      ansible.builtin.assert:
        that:
          - cache_redis_process.stdout is search('(?m)^.*[r]edis-server.*$')
        fail_msg: A Redis server process must be running.

    - name: Check the Redis TCP listener
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: cache_redis_tcp
      changed_when: false

    - name: Assert Redis listens on TCP port 6379
      ansible.builtin.assert:
        that:
          - cache_redis_tcp.stdout is search(':6379\\b')
        fail_msg: Redis must listen on TCP port 6379.

    - name: Inspect the Redis configuration directives
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - '^(port|requirepass|pidfile|dir|logfile)'
          - /etc/redis/6379.conf
      register: cache_redis_config
      changed_when: false
      failed_when: false

    - name: Assert the Redis configuration contains the required directives
      ansible.builtin.assert:
        that:
          - cache_redis_config.stdout is search('(?m)^port\\s+6379\\s*$')
          - cache_redis_config.stdout is search('(?m)^requirepass\\s+\\S+')
          - cache_redis_config.stdout is search('(?m)^pidfile\\s+\\S+')
          - cache_redis_config.stdout is search('(?m)^dir\\s+\\S+')
          - cache_redis_config.stdout is search('(?m)^logfile\\s+\\S+')
        fail_msg: Redis configuration must contain port, password, PID, directory, and log settings.

    - name: Check that replication directives were removed from Redis configuration
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - '^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)'
          - /etc/redis/6379.conf
      register: cache_redis_cleanup
      changed_when: false
      failed_when: false

    - name: Assert replication directives are absent from Redis configuration
      ansible.builtin.assert:
        that:
          - cache_redis_cleanup.rc != 0
        fail_msg: Redis replication-related directives must be absent.

    - name: Inspect the Redis log directory
      ansible.builtin.stat:
        path: /var/log/redis
      register: cache_redis_log_dir

    - name: Assert the Redis log directory has the expected ownership and mode
      ansible.builtin.assert:
        that:
          - cache_redis_log_dir.stat.exists
          - cache_redis_log_dir.stat.pw_name == 'redis'
          - cache_redis_log_dir.stat.gr_name == 'redis'
          - cache_redis_log_dir.stat.mode == '0755'
        fail_msg: /var/log/redis must be owned by redis:redis with mode 0755.

    - name: Inspect the Redis runtime directory
      ansible.builtin.stat:
        path: /run/redis
      register: cache_redis_run_dir

    - name: Assert the Redis runtime directory exists
      ansible.builtin.assert:
        that:
          - cache_redis_run_dir.stat.exists
        fail_msg: /run/redis must exist.
