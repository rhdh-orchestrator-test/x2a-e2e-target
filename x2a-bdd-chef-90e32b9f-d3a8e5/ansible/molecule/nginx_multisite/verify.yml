---
# Unsupported: fail2ban-client detail output, UFW output/rules, listener diagnostics,
# sysctl values, nginx -T output, log tails, and certificate dates/issuer have no
# concrete expected result in the pre-flight checks.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Collect service facts for fail2ban, nginx, and sshd
      ansible.builtin.service_facts:

    - name: Verify fail2ban is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['fail2ban.service']['status'] == 'enabled'
          - ansible_facts.services['fail2ban.service']['state'] == 'running'
        fail_msg: fail2ban is not enabled and running

    - name: Verify nginx is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['nginx.service']['status'] == 'enabled'
          - ansible_facts.services['nginx.service']['state'] == 'running'
        fail_msg: nginx is not enabled and running

    - name: Verify sshd is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['sshd.service']['status'] == 'enabled'
          - ansible_facts.services['sshd.service']['state'] == 'running'
        fail_msg: sshd is not enabled and running

    - name: Read sshd configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_sshd_config

    - name: Verify required SSH settings
      ansible.builtin.assert:
        that:
          - item_sshd_config['content'] | b64decode is search('(?m)^\\s*PermitRootLogin\\s+no\\s*$')
          - item_sshd_config['content'] | b64decode is search('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')
        fail_msg: sshd_config is missing a required security setting

    - name: Validate sshd configuration syntax
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false

    - name: Validate nginx configuration syntax
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Read nginx main configuration
      ansible.builtin.slurp:
        src: /etc/nginx/nginx.conf
      register: item_nginx_config

    - name: Verify required nginx main settings
      ansible.builtin.assert:
        that:
          - item_nginx_config['content'] | b64decode is search('(?m)^\\s*user\\s+nginx\\s*;')
          - item_nginx_config['content'] | b64decode is search('(?m)^\\s*worker_processes\\s+auto\\s*;')
          - item_nginx_config['content'] | b64decode is search('(?m)^\\s*worker_connections\\s+768\\s*;')
          - item_nginx_config['content'] | b64decode is search('(?m)^\\s*gzip\\s+on\\s*;')
        fail_msg: nginx.conf is missing a required setting

    - name: Read nginx security configuration
      ansible.builtin.slurp:
        src: /etc/nginx/conf.d/security.conf
      register: item_nginx_security_config

    - name: Verify required nginx security settings
      ansible.builtin.assert:
        that:
          - item_nginx_security_config['content'] | b64decode is search('(?m)^\\s*server_tokens\\s+off\\s*;')
          - item_nginx_security_config['content'] | b64decode is search('(?m)^\\s*ssl_protocols\\s+TLSv1\\.2\\s+TLSv1\\.3\\s*;')
          - item_nginx_security_config['content'] | b64decode is search('(?m)^\\s*ssl_session_cache\\s+shared:SSL:10m\\s*;')
        fail_msg: security.conf is missing a required setting

    - name: Verify the site token exists and is non-empty without displaying it
      ansible.builtin.stat:
        path: /etc/nginx/secrets/site_token
      register: item_site_token

    - name: Assert the site token is a non-empty regular file
      ansible.builtin.assert:
        that:
          - item_site_token['stat']['isreg']
          - item_site_token['stat']['size'] | int > 0
        fail_msg: The nginx site token is missing or empty

    - name: Verify the default nginx site was removed
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_site['stat']['exists']
        fail_msg: The default nginx site is still present

    - name: Verify configured site document roots
      ansible.builtin.stat:
        path: "{{ item_site['document_root'] }}"
      loop: "{{ nginx_sites | default([]) }}"
      loop_control:
        loop_var: item_site
      register: item_site_roots

    - name: Assert configured site document roots exist
      ansible.builtin.assert:
        that:
          - item_site_root['stat']['isdir']
        fail_msg: A configured site document root is missing
      loop: "{{ item_site_roots['results'] }}"
      loop_control:
        loop_var: item_site_root

    - name: Verify configured site index files
      ansible.builtin.stat:
        path: "{{ item_site['document_root'] }}/index.html"
      loop: "{{ nginx_sites | default([]) }}"
      loop_control:
        loop_var: item_site
      register: item_site_indexes

    - name: Assert configured site index files exist
      ansible.builtin.assert:
        that:
          - item_site_index['stat']['isreg']
        fail_msg: A configured site index file is missing
      loop: "{{ item_site_indexes['results'] }}"
      loop_control:
        loop_var: item_site_index

    - name: Verify configured site files
      ansible.builtin.stat:
        path: "/etc/nginx/sites-available/{{ item_site['id'] }}"
      loop: "{{ nginx_sites | default([]) }}"
      loop_control:
        loop_var: item_site
      register: item_site_configs

    - name: Assert configured site files exist
      ansible.builtin.assert:
        that:
          - item_site_config['stat']['isreg']
        fail_msg: A configured nginx site file is missing
      loop: "{{ item_site_configs['results'] }}"
      loop_control:
        loop_var: item_site_config

    - name: Verify configured site links
      ansible.builtin.stat:
        path: "/etc/nginx/sites-enabled/{{ item_site['id'] }}"
        follow: false
      loop: "{{ nginx_sites | default([]) }}"
      loop_control:
        loop_var: item_site
      register: item_site_links

    - name: Assert configured sites are enabled as links
      ansible.builtin.assert:
        that:
          - item_site_link['stat']['islnk']
          - item_site_link['stat']['lnk_source'] == '/etc/nginx/sites-available/' ~ item_site_link['item']['id']
        fail_msg: A configured nginx site is not linked from sites-enabled
      loop: "{{ item_site_links['results'] }}"
      loop_control:
        loop_var: item_site_link

    - name: Read configured site files
      ansible.builtin.slurp:
        src: "/etc/nginx/sites-available/{{ item_site['id'] }}"
      loop: "{{ nginx_sites | default([]) }}"
      loop_control:
        loop_var: item_site
      register: item_site_contents

    - name: Verify configured site names and roots
      ansible.builtin.assert:
        that:
          - (item_site_content['content'] | b64decode) is search('server_name\\s+' ~ (item_site_content['item']['id'] | regex_escape))
          - (item_site_content['content'] | b64decode) is search('root\\s+' ~ (item_site_content['item']['document_root'] | regex_escape))
        fail_msg: A configured nginx site has an unexpected name or root
      loop: "{{ item_site_contents['results'] }}"
      loop_control:
        loop_var: item_site_content

    - name: Verify non-SSL sites respond over HTTP
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_site['id'] }}"
        follow_redirects: none
        return_content: false
        status_code: 200
      when: not (item_site['ssl_enabled'] | bool)
      loop: "{{ nginx_sites | default([]) }}"
      loop_control:
        loop_var: item_site

    - name: Verify SSL sites redirect HTTP to HTTPS
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_site['id'] }}"
        follow_redirects: none
        return_content: false
        status_code: 301
      when: item_site['ssl_enabled'] | bool
      loop: "{{ nginx_sites | default([]) }}"
      loop_control:
        loop_var: item_site

    - name: Verify SSL sites respond over HTTPS
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_site['id'] }}"
        validate_certs: false
        return_content: false
        status_code: 200
      when: item_site['ssl_enabled'] | bool
      loop: "{{ nginx_sites | default([]) }}"
      loop_control:
        loop_var: item_site
