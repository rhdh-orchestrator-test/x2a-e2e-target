---
- name: Create HAProxy systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/haproxy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install HAProxy systemd override
  ansible.builtin.copy:
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/sbin/haproxy -Ws -f {{ haproxy_config_file }} -f {{ haproxy_config_dir }}/conf.d/ -p /run/haproxy.pid -S /run/haproxy-master.sock
    dest: /etc/systemd/system/haproxy.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload systemd manager
    - Restart HAProxy

- name: Validate HAProxy configuration # noqa: R101 - HAProxy validation requires executing the fixed system binary with role-defined configuration paths
  ansible.builtin.command:
    argv:
      - /usr/sbin/haproxy
      - -c
      - -f
      - "{{ haproxy_config_file }}"
      - -f
      - "{{ haproxy_config_dir }}/conf.d/"
  changed_when: false

- name: Ensure HAProxy service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ haproxy_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Install HAProxy logrotate configuration
  ansible.builtin.copy:
    content: |
      /var/log/haproxy/*.log {
          daily
          rotate 14
          missingok
          notifempty
          compress
          delaycompress
          sharedscripts
          postrotate
              /bin/kill -HUP $(cat /var/run/haproxy.pid 2>/dev/null) 2>/dev/null || true
          endscript
      }
    dest: /etc/logrotate.d/haproxy
    owner: root
    group: root
    mode: "0644"
    backup: true
