---
controller_credential_types:
  - name: HAProxy Statistics Authentication
    description: Credentials used to authenticate users to the HAProxy statistics interface.
    kind: cloud
    inputs:
      fields:
        - id: stats_user
          type: string
          label: Statistics Username
          help_text: Username permitted to access the HAProxy statistics interface; the configured value is admin.
        - id: stats_password
          type: string
          label: Statistics Password
          secret: true
          help_text: Password for HAProxy statistics authentication; migrate the EYAML/plaintext source value into Ansible Vault or an approved external secret 
            manager.
      required:
        - stats_user
        - stats_password
    injectors:
      extra_vars:
        stats_user: !unsafe "{{ stats_user }}"
        stats_password: !unsafe "{{ stats_password }}"
