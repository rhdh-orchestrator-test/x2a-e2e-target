---
- name: Create HAProxy error directory
  ansible.builtin.file:
    path: "{{ haproxy_config_dir }}/errors" # noqa: R114 - path is derived from a role-defined configuration directory
    state: directory
    owner: root
    group: "{{ haproxy_group }}"
    mode: "0755"

- name: Install HAProxy 503 error page
  ansible.builtin.copy:
    content: "503 Service Unavailable "
    dest: "{{ haproxy_config_dir }}/errors/503.http" # noqa: R114 - path is derived from a role-defined configuration directory
    owner: root
    group: "{{ haproxy_group }}"
    mode: "0644"
    backup: true

- name: Install HAProxy 408 error page
  ansible.builtin.copy:
    content: "408 Request Timeout "
    dest: "{{ haproxy_config_dir }}/errors/408.http" # noqa: R114 - path is derived from a role-defined configuration directory
    owner: root
    group: "{{ haproxy_group }}"
    mode: "0644"
    backup: true

- name: Render HAProxy main configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ haproxy_config_file }}" # noqa: R114 - destination is a role-defined configuration file
    owner: root
    group: "{{ haproxy_group }}"
    mode: "0640"
    backup: true
  no_log: "{{ profile_haproxy_secure_logging }}"
  notify: Restart HAProxy
  vars:
    log_server: "{{ haproxy_log_server }}"
    log_facility: "{{ haproxy_log_facility }}"
    log_level: "{{ haproxy_log_level }}"
    global_maxconn: "{{ haproxy_global_maxconn }}"
    haproxy_user: "{{ haproxy_user }}"
    haproxy_group: "{{ haproxy_group }}"
    ssl_enabled: "{{ haproxy_ssl_enabled }}"
    ssl_ciphers: "{{ haproxy_ssl_ciphers }}"
    ssl_cert_path: "{{ haproxy_ssl_cert_path }}"
    haproxy_config_dir: "{{ haproxy_config_dir }}"
    connect_timeout: "{{ haproxy_connect_timeout }}"
    client_timeout: "{{ haproxy_client_timeout }}"
    server_timeout: "{{ haproxy_server_timeout }}"
    retries: "{{ haproxy_retries }}"
    stats_enabled: "{{ haproxy_stats_enabled }}"
    stats_port: "{{ haproxy_stats_port }}"
    stats_uri: "{{ haproxy_stats_uri }}"
    stats_user: "{{ stats_user }}"
    stats_password: "{{ stats_password }}"
    backends: "{{ haproxy_backends }}"

- name: Render HAProxy backend configuration fragments
  ansible.builtin.template:
    src: backend.conf.j2
    dest: "{{ haproxy_config_dir }}/conf.d/{{ item_backend['key'] }}.cfg" # noqa: R114 - filename comes from the role-defined backends map
    owner: root
    group: "{{ haproxy_group }}"
    mode: "0640"
    backup: true
  loop: "{{ haproxy_backends | dict2items }}"
  loop_control:
    loop_var: item_backend
  no_log: "{{ profile_haproxy_secure_logging }}"
  notify: Restart HAProxy
  vars:
    backend_name: "{{ item_backend['key'] }}"
    balance: "{{ item_backend['value']['balance'] }}"
    port: "{{ item_backend['value']['port'] }}"
    servers: "{{ item_backend['value']['servers'] }}"
    health_check: "{{ item_backend['value'].get('health_check', '') }}"
    health_interval: "{{ item_backend['value'].get('health_interval', '') }}"
    ssl_enabled: "{{ haproxy_ssl_enabled }}"

- name: Render HAProxy stick-table configuration
  ansible.builtin.copy:
    content: "# Managed by Ansible stick-table type ip size {{ haproxy_stick_table_size }} expire {{ haproxy_stick_table_expire }} "
    dest: "{{ haproxy_config_dir }}/conf.d/stick-tables.cfg" # noqa: R114 - path is derived from a role-defined configuration directory
    owner: root
    group: "{{ haproxy_group }}"
    mode: "0640"
    backup: true
  when: haproxy_stick_table_enabled | bool
  notify: Restart HAProxy
