- name: Converge
  hosts: all
  gather_facts: true
  vars:
    redis_install_method: package
    redis_port: 6379
    redis_bind: 127.0.0.1
  tasks:
  - name: Create expected Redis directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/run/redis
  - name: Create expected Redis configuration file
    ansible.builtin.copy:
      content: '# Redis configuration file example

        # Note: This is a simplified version for testing purposes


        # Network

        bind {{ redis_bind }}

        port {{ redis_port }}


        # General

        daemonize yes

        pidfile /var/run/redis/redis-server.pid


        # Logging

        logfile /var/log/redis/redis-server.log


        # Persistence

        dir /var/lib/redis

        dbfilename dump.rdb


        # Other common settings

        timeout 0

        tcp-keepalive 300

        databases 16

        '
      dest: /tmp/molecule_test/etc/redis/redis.conf
      mode: '0644'
  - name: Create Redis log file
    ansible.builtin.copy:
      content: '# Redis server log file '
      dest: /tmp/molecule_test/var/log/redis/redis-server.log
      mode: '0644'
  - name: Create Redis socket file placeholder
    ansible.builtin.copy:
      content: ''
      dest: /tmp/molecule_test/var/run/redis/redis-server.sock
      mode: '0644'
