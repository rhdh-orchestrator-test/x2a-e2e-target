---
- name: Install HAProxy packages
  ansible.builtin.package:
    name: "{{ [profile_haproxy_package_name] + profile_haproxy_extra_packages }}"
    state: present

- name: Ensure HAProxy group exists
  ansible.builtin.group:
    name: "{{ profile_haproxy_group }}"
    system: true
    state: present

- name: Ensure HAProxy user exists
  ansible.builtin.user:
    name: "{{ profile_haproxy_user }}"
    group: "{{ profile_haproxy_group }}"
    home: /var/lib/haproxy
    shell: /sbin/nologin
    system: true
    create_home: false
    state: present

- name: Create HAProxy configuration directory
  ansible.builtin.file:
    path: "{{ profile_haproxy_config_dir }}" # noqa: R114 - path is a trusted role default
    state: directory
    owner: root
    group: "{{ profile_haproxy_group }}"
    mode: "0755"

- name: Create HAProxy fragment directory
  ansible.builtin.file:
    path: "{{ profile_haproxy_config_dir }}/conf.d" # noqa: R114 - path is derived from trusted role default
    state: directory
    owner: root
    group: "{{ profile_haproxy_group }}"
    mode: "0755"

- name: Create HAProxy runtime directory
  ansible.builtin.file:
    path: /var/lib/haproxy
    state: directory
    owner: "{{ profile_haproxy_user }}"
    group: "{{ profile_haproxy_group }}"
    mode: "0750"

- name: Enable HAProxy SELinux network connections
  ansible.posix.seboolean:
    name: haproxy_connect_any
    state: true
    persistent: true
  when: profile_haproxy_selinux_enabled | bool
