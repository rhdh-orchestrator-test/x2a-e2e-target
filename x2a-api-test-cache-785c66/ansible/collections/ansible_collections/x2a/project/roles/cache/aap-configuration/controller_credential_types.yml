---
controller_credential_types:
  - name: Redis Authentication
    description: Authentication password for the Redis server configured on port 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password used to authenticate clients to the Redis server; store it in Ansible Vault or an AAP secret integration.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
