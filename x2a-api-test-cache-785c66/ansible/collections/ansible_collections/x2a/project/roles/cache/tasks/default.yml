---
- name: Install and configure Redis from Private Hub collection  # noqa: L038 - external Private Hub role is not available in this collection
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_install_method: package
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Ensure Redis PID directory exists
  ansible.builtin.file:
    path: "{{ cache_redis_pid_dir }}" # noqa: R114 - path is a role default
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Ensure Redis log directory exists
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}" # noqa: R114 - path is a role default
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Check Redis configuration
  ansible.builtin.stat:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role default
  register: cache_redis_config

- name: Remove obsolete Redis directives  # noqa: L039 - cache_redis_config is registered by the preceding stat task
  ansible.builtin.replace:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role default
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$
    replace: ""
    backup: true
  when: cache_redis_config.stat.exists
  notify: Restart Redis
