---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create SSL certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create SSL private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Generate self-signed SSL certificates for sites
  ansible.builtin.shell: # noqa: R101 - openssl command uses role-defined paths and site names, not user input
    cmd: |
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        -keyout {{ nginx_multisite_ssl_private_key_path }}/{{ item_site['key'] }}.key \
        -out {{ nginx_multisite_ssl_certificate_path }}/{{ item_site['key'] }}.crt \
        -subj "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_site['key'] }}/emailAddress=admin@example.com"
      chmod 640 {{ nginx_multisite_ssl_private_key_path }}/{{ item_site['key'] }}.key
      chown root:ssl-cert {{ nginx_multisite_ssl_private_key_path }}/{{ item_site['key'] }}.key
    creates: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_site['key'] }}.crt"
  when: item_site['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Reload nginx
