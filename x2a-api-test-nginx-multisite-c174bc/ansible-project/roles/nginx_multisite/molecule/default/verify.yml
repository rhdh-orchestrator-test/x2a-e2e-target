---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Service status verification
    - name: Check service facts
      ansible.builtin.service_facts:

    - name: Assert nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
        fail_msg: "Nginx service is not running"

    - name: Assert fail2ban service is running
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
        fail_msg: "Fail2ban service is not running"

    # Configuration files verification
    - name: Check nginx configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_config
      register: nginx_config_stat_results

    - name: Assert nginx configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected nginx configuration file not found"
      loop: "{{ nginx_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Document root and content verification
    - name: Check site document roots and content files exist
      ansible.builtin.stat:
        path: "{{ item_content }}"
      loop:
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_content
      register: site_content_stat_results

    - name: Assert site content files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected site content file not found"
      loop: "{{ site_content_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # SSL certificate verification
    - name: Check SSL certificates exist
      ansible.builtin.stat:
        path: "{{ item_ssl }}"
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_ssl
      register: ssl_cert_stat_results

    - name: Assert SSL certificates were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate file not found"
      loop: "{{ ssl_cert_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Security configuration verification
    - name: Check security configuration files exist
      ansible.builtin.stat:
        path: "{{ item_security }}"
      loop:
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
      loop_control:
        loop_var: item_security
      register: security_config_stat_results

    - name: Assert security configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected security configuration file not found"
      loop: "{{ security_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Network port verification
    - name: Check HTTP port 80 is listening
      ansible.builtin.wait_for:
        port: 80
        host: 0.0.0.0
        timeout: 10

    - name: Check HTTPS port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        host: 0.0.0.0
        timeout: 10

    # Nginx configuration syntax validation
    - name: Test nginx configuration syntax
      ansible.builtin.command:
        cmd: nginx -t
      register: nginx_syntax_test
      changed_when: false

    - name: Assert nginx configuration syntax is valid
      ansible.builtin.assert:
        that:
          - nginx_syntax_test['rc'] == 0
          - "'syntax is ok' in nginx_syntax_test['stderr']"
          - "'test is successful' in nginx_syntax_test['stderr']"
        fail_msg: "Nginx configuration syntax test failed"

    # Site content verification
    - name: Read site content files
      ansible.builtin.slurp:
        src: "{{ item_site_file }}"
      loop:
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_site_file
      register: site_content_results

    - name: Assert site content contains expected site names
      ansible.builtin.assert:
        that:
          - "'test.cluster.local' in (site_content_results['results'][0]['content'] | b64decode)"
          - "'ci.cluster.local' in (site_content_results['results'][1]['content'] | b64decode)"
          - "'status.cluster.local' in (site_content_results['results'][2]['content'] | b64decode)"
        fail_msg: "Site content does not contain expected site names"

    # SSL private key permissions verification
    - name: Check SSL private key permissions and ownership
      ansible.builtin.stat:
        path: "{{ item_key }}"
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: ssl_key_perms_results

    - name: Assert SSL private keys have correct permissions
      ansible.builtin.assert:
        that:
          - item_result['stat']['pw_name'] == 'root'
          - item_result['stat']['gr_name'] == 'ssl-cert'
          - item_result['stat']['mode'] == '0640'
        fail_msg: "SSL private key does not have correct permissions or ownership"
      loop: "{{ ssl_key_perms_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Fail2ban status verification
    - name: Check fail2ban status
      ansible.builtin.command:
        cmd: fail2ban-client status
      register: fail2ban_status
      changed_when: false

    - name: Assert fail2ban is active with jails
      ansible.builtin.assert:
        that:
          - fail2ban_status['rc'] == 0
          - "'Status' in fail2ban_status['stdout']"
        fail_msg: "Fail2ban is not active or has no jails configured"

    # UFW firewall status verification
    - name: Check UFW firewall status
      ansible.builtin.command:
        cmd: ufw status
      register: ufw_status_check
      changed_when: false

    - name: Assert UFW firewall is active
      ansible.builtin.assert:
        that:
          - ufw_status_check['rc'] == 0
          - "'Status: active' in ufw_status_check['stdout']"
        fail_msg: "UFW firewall is not active"

    # Sysctl security parameters verification
    - name: Check sysctl security parameters
      ansible.builtin.command:
        cmd: "sysctl {{ item_sysctl }}" # noqa: R101 - sysctl parameter names from test loop, not user input
      loop:
        - net.ipv4.conf.all.accept_redirects
        - net.ipv4.conf.all.send_redirects
      loop_control:
        loop_var: item_sysctl
      register: sysctl_results
      changed_when: false

    - name: Assert sysctl security parameters are set correctly
      ansible.builtin.assert:
        that:
          - "'= 0' in sysctl_results['results'][0]['stdout']"
          - "'= 0' in sysctl_results['results'][1]['stdout']"
        fail_msg: "Sysctl security parameters are not set correctly"
