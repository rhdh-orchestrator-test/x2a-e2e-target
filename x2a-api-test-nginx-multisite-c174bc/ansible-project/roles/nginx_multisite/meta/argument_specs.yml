---
argument_specs:
  main:
    short_description: Multi-site nginx web server with SSL termination and security hardening
    description:
      - Deploys nginx with multiple virtual hosts serving static websites
      - Configures SSL certificates for each site with HTTPS redirection
      - Implements comprehensive security hardening including fail2ban, UFW firewall, SSH hardening, and kernel security parameters
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: >-
          Dictionary of nginx sites to configure. Each key is the server name (FQDN),
          and each value contains document_root path and ssl_enabled boolean.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory path where SSL certificates will be stored.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory path where SSL private keys will be stored.
      nginx_multisite_security_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and configure fail2ban for intrusion prevention.
      nginx_multisite_security_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure UFW firewall with default deny and allow SSH/HTTP/HTTPS.
      nginx_multisite_security_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login for security hardening.
      nginx_multisite_security_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether to allow SSH password authentication (false = disable for security).
