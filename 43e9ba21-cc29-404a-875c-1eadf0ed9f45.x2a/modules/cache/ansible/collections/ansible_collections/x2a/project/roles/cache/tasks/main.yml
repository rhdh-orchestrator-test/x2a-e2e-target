---
- name: Install Redis package
  ansible.builtin.package:
    name:
      - "{{ 'redis-server' if ansible_facts['os_family'] == 'Debian' else 'redis' }}"
    state: present

- name: Enable and start Redis service
  ansible.builtin.service:
    name: "{{ 'redis-server' if ansible_facts['os_family'] == 'Debian' else 'redis' }}"
    enabled: true
    state: started
