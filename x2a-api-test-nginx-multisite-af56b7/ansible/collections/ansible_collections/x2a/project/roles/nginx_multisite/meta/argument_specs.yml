---
argument_specs:
  main:
    short_description: Install and configure a secure multi-site nginx server
    description:
      - Deploys nginx virtual hosts with HTTPS, self-signed certificates, security headers, and host hardening.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of virtual host names to document roots and SSL settings.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated TLS certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated TLS private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and configure Fail2ban.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and enable UFW.
      nginx_multisite_disable_root_ssh:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login.
      nginx_multisite_disable_ssh_password_auth:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH password authentication.
