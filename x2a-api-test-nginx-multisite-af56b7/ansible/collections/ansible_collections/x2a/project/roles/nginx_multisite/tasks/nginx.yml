---
- name: Create nginx group
  ansible.builtin.group:
    name: nginx
    system: true
    state: present

- name: Create nginx user
  ansible.builtin.user:
    name: nginx
    group: nginx
    system: true
    state: present

- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Render nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Render nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dictionary
    owner: nginx
    group: nginx
    mode: "0755"
    state: directory
    recurse: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site

- name: Create site index files
  ansible.builtin.copy:
    content: "<html><head><title>{{ item_nginx_site['key'] }}</title></head><body><h1>{{ item_nginx_site['key'] }}</h1></body></html> "
    dest: "{{ item_nginx_site['value']['document_root'] }}/index.html" # noqa: R114 - path from role-defined sites dictionary
    owner: nginx
    group: nginx
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site
