---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
    state: present

- name: Configure fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Set UFW default incoming policy
  ansible.builtin.command:
    cmd: ufw --force default deny
  register: nginx_multisite_ufw_default
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Default incoming policy changed to' in nginx_multisite_ufw_default.stdout"

- name: Allow SSH through UFW
  ansible.builtin.command:
    cmd: ufw allow ssh
  register: nginx_multisite_ufw_ssh
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Skipping adding existing rule' not in nginx_multisite_ufw_ssh.stdout"

- name: Allow HTTP through UFW
  ansible.builtin.command:
    cmd: ufw allow http
  register: nginx_multisite_ufw_http
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Skipping adding existing rule' not in nginx_multisite_ufw_http.stdout"

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    cmd: ufw allow https
  register: nginx_multisite_ufw_https
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Skipping adding existing rule' not in nginx_multisite_ufw_https.stdout"

- name: Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  register: nginx_multisite_ufw_enable
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Firewall is active and enabled on system startup' in nginx_multisite_ufw_enable.stdout"

- name: Render kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true

- name: Apply kernel security settings
  ansible.posix.sysctl:
    name: "{{ item_nginx_sysctl['name'] }}"
    value: "{{ item_nginx_sysctl['value'] }}"
    sysctl_file: /etc/sysctl.d/99-security.conf
    sysctl_set: true
    reload: true
    state: present
  loop:
    - name: net.ipv4.conf.default.rp_filter
      value: "1"
    - name: net.ipv4.conf.all.rp_filter
      value: "1"
    - name: net.ipv4.conf.all.accept_redirects
      value: "0"
    - name: net.ipv6.conf.all.accept_redirects
      value: "0"
    - name: net.ipv4.conf.default.accept_redirects
      value: "0"
    - name: net.ipv6.conf.default.accept_redirects
      value: "0"
    - name: net.ipv4.conf.all.send_redirects
      value: "0"
    - name: net.ipv4.conf.default.send_redirects
      value: "0"
    - name: net.ipv4.conf.all.accept_source_route
      value: "0"
    - name: net.ipv6.conf.all.accept_source_route
      value: "0"
    - name: net.ipv4.conf.default.accept_source_route
      value: "0"
    - name: net.ipv6.conf.default.accept_source_route
      value: "0"
    - name: net.ipv4.conf.all.log_martians
      value: "1"
    - name: net.ipv4.conf.default.log_martians
      value: "1"
    - name: net.ipv4.icmp_echo_ignore_all
      value: "1"
    - name: net.ipv4.icmp_echo_ignore_broadcasts
      value: "1"
    - name: net.ipv6.conf.all.disable_ipv6
      value: "1"
    - name: net.ipv6.conf.default.disable_ipv6
      value: "1"
    - name: net.ipv6.conf.lo.disable_ipv6
      value: "1"
    - name: net.ipv4.tcp_syncookies
      value: "1"
    - name: net.ipv4.tcp_max_syn_backlog
      value: "2048"
    - name: net.ipv4.tcp_synack_retries
      value: "2"
    - name: net.ipv4.tcp_syn_retries
      value: "5"
  loop_control:
    loop_var: item_nginx_sysctl

- name: Check whether SSH daemon configuration exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable root SSH login  # noqa: L039 - variable is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    state: present
    create: false
    backup: true
  when:
    - nginx_multisite_disable_root_ssh
    - nginx_multisite_sshd_config.stat.exists

- name: Disable SSH password authentication  # noqa: L039 - variable is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    state: present
    create: false
    backup: true
  when:
    - nginx_multisite_disable_ssh_password_auth
    - nginx_multisite_sshd_config.stat.exists
