---
# Unsupported without inventing values or semantics: exact sysctl values, certificate
# validity duration, and the absence of errors in arbitrary historical log output.
- name: Verify nginx-multisite pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Collect service facts for nginx and fail2ban status checks
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are active and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['nginx.service']['state'] == 'running'
          - ansible_facts['services']['nginx.service']['status'] == 'enabled'
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'
          - ansible_facts['services']['fail2ban.service']['status'] == 'enabled'
        fail_msg: nginx and fail2ban must be active and enabled.

    - name: Validate nginx configuration syntax
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_syntax
      changed_when: false

    - name: Assert nginx configuration syntax succeeds
      ansible.builtin.assert:
        that: item_nginx_syntax['rc'] == 0
        fail_msg: nginx configuration syntax validation failed.

    - name: Inspect the complete nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      register: item_nginx_dump
      changed_when: false

    - name: Assert configured server names and listeners are present
      ansible.builtin.assert:
        that:
          - "'test.cluster.local' in item_nginx_dump['stdout']"
          - "'ci.cluster.local' in item_nginx_dump['stdout']"
          - "'status.cluster.local' in item_nginx_dump['stdout']"
          - item_nginx_dump['stdout'] is regex('listen\\s+80')
          - item_nginx_dump['stdout'] is regex('listen\\s+443[^;]*ssl')
        fail_msg: nginx configuration is missing an expected site name or listener.

    - name: Check expected nginx files, directories, certificates, keys, and logs
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      register: item_path_stat
      loop:
        - { name: nginx_config, path: /etc/nginx/nginx.conf }
        - { name: security_config, path: /etc/nginx/conf.d/security.conf }
        - { name: test_site, path: /etc/nginx/sites-available/test.cluster.local }
        - { name: ci_site, path: /etc/nginx/sites-available/ci.cluster.local }
        - { name: status_site, path: /etc/nginx/sites-available/status.cluster.local }
        - { name: test_index, path: /opt/server/test/index.html }
        - { name: ci_index, path: /opt/server/ci/index.html }
        - { name: status_index, path: /opt/server/status/index.html }
        - { name: test_cert, path: /etc/ssl/certs/test.cluster.local.crt }
        - { name: ci_cert, path: /etc/ssl/certs/ci.cluster.local.crt }
        - { name: status_cert, path: /etc/ssl/certs/status.cluster.local.crt }
        - { name: test_key, path: /etc/ssl/private/test.cluster.local.key }
        - { name: ci_key, path: /etc/ssl/private/ci.cluster.local.key }
        - { name: status_key, path: /etc/ssl/private/status.cluster.local.key }
        - { name: jail, path: /etc/fail2ban/jail.local }
        - { name: sysctl_config, path: /etc/sysctl.d/99-security.conf }
        - { name: ssh_config, path: /etc/ssh/sshd_config }
        - { name: nginx_access_log, path: /var/log/nginx/access.log }
        - { name: nginx_error_log, path: /var/log/nginx/error.log }
        - { name: test_access_log, path: /var/log/nginx/test.cluster.local_access.log }
        - { name: test_error_log, path: /var/log/nginx/test.cluster.local_error.log }
        - { name: ci_access_log, path: /var/log/nginx/ci.cluster.local_access.log }
        - { name: ci_error_log, path: /var/log/nginx/ci.cluster.local_error.log }
        - { name: status_access_log, path: /var/log/nginx/status.cluster.local_access.log }
        - { name: status_error_log, path: /var/log/nginx/status.cluster.local_error.log }
        - { name: auth_log, path: /var/log/auth.log }
      loop_control:
        loop_var: item_path

    - name: Assert expected nginx, site, content, TLS, and configuration files exist
      ansible.builtin.assert:
        that: item_path_stat['results'][index_path]['stat']['exists']
        fail_msg: An expected pre-flight path is absent.
      loop: "{{ range(0, item_path_stat['results'] | length) | list }}"
      loop_control:
        loop_var: item_path_index
      vars:
        index_path: "{{ item_path_index }}"

    - name: Check enabled site links and the removed default site
      ansible.builtin.stat:
        path: "{{ item_link['path'] }}"
        follow: false
      register: item_link_stat
      loop:
        - { path: /etc/nginx/sites-enabled/test.cluster.local, expected: true }
        - { path: /etc/nginx/sites-enabled/ci.cluster.local, expected: true }
        - { path: /etc/nginx/sites-enabled/status.cluster.local, expected: true }
        - { path: /etc/nginx/sites-enabled/default, expected: false }
      loop_control:
        loop_var: item_link

    - name: Assert enabled sites are symlinks and default site is absent
      ansible.builtin.assert:
        that:
          - item_link_stat['results'][item_link_index]['stat']['exists'] == item_link['expected']
          - (not item_link['expected']) or item_link_stat['results'][item_link_index]['stat']['islnk']
        fail_msg: An nginx enabled-site link does not match the pre-flight expectation.
      loop: "{{ item_link_stat['results'] }}"
      loop_control:
        loop_var: item_link_result
      vars:
        item_link_index: "{{ ansible_loop.index0 }}"
        item_link: "{{ item_link_result['item'] }}"

    - name: Check HTTP redirects and HTTPS responses for each site
      ansible.builtin.uri:
        url: "{{ item_site['http_url'] }}"
        headers:
          Host: "{{ item_site['host'] }}"
        follow_redirects: none
        status_code: 301
      register: item_http_response
      loop:
        - { host: test.cluster.local, http_url: http://127.0.0.1/ }
        - { host: ci.cluster.local, http_url: http://127.0.0.1/ }
        - { host: status.cluster.local, http_url: http://127.0.0.1/ }
      loop_control:
        loop_var: item_site

    - name: Assert HTTP responses redirect to HTTPS
      ansible.builtin.assert:
        that: item_http_response['results'][item_http_index]['redirected'] or
          item_http_response['results'][item_http_index]['location'] is match('https://')
        fail_msg: An HTTP site response did not redirect to HTTPS.
      loop: "{{ item_http_response['results'] }}"
      loop_control:
        loop_var: item_http_result
      vars:
        item_http_index: "{{ ansible_loop.index0 }}"

    - name: Check HTTPS sites return successful responses
      ansible.builtin.uri:
        url: "https://{{ item_https['host'] }}/"
        headers:
          Host: "{{ item_https['host'] }}"
        validate_certs: false
        status_code: 200
      register: item_https_response
      loop:
        - { host: test.cluster.local }
        - { host: ci.cluster.local }
        - { host: status.cluster.local }
      loop_control:
        loop_var: item_https

    - name: Check TLS key ownership and mode
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
      register: item_key_stat
      loop:
        - { path: /etc/ssl/private/test.cluster.local.key }
        - { path: /etc/ssl/private/ci.cluster.local.key }
        - { path: /etc/ssl/private/status.cluster.local.key }
      loop_control:
        loop_var: item_key

    - name: Assert TLS private-key permissions
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['pw_name'] == 'root'
          - item_key_result['stat']['gr_name'] == 'ssl-cert'
          - item_key_result['stat']['mode'] == '0640'
        fail_msg: A TLS private key does not have the expected ownership or mode.
      loop: "{{ item_key_stat['results'] }}"
      loop_control:
        loop_var: item_key_result

    - name: Inspect TLS certificate subjects and issuers
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_cert['path'] }}"
          - -noout
          - -subject
          - -issuer
          - -dates
      register: item_certificate_info
      changed_when: false
      loop:
        - { host: test.cluster.local, path: /etc/ssl/certs/test.cluster.local.crt }
        - { host: ci.cluster.local, path: /etc/ssl/certs/ci.cluster.local.crt }
        - { host: status.cluster.local, path: /etc/ssl/certs/status.cluster.local.crt }
      loop_control:
        loop_var: item_cert

    - name: Assert certificates match their site names and are self-signed
      ansible.builtin.assert:
        that:
          - item_certificate_result['stdout'] is search('subject=.*CN[ =]{{ item_certificate_result["item"]["host"] }}')
          - item_certificate_result['stdout'] is search('issuer=.*CN[ =]{{ item_certificate_result["item"]["host"] }}')
          - item_certificate_result['stdout'] is search('notBefore=')
          - item_certificate_result['stdout'] is search('notAfter=')
        fail_msg: A site certificate does not match its expected hostname or self-signed status.
      loop: "{{ item_certificate_info['results'] }}"
      loop_control:
        loop_var: item_certificate_result

    - name: Check UFW policy and required allowances
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: item_ufw_status
      changed_when: false

    - name: Assert UFW denies incoming traffic and allows SSH, HTTP, and HTTPS
      ansible.builtin.assert:
        that:
          - item_ufw_status['stdout'] is search('Default:.*deny \(incoming\)')
          - item_ufw_status['stdout'] is search('22|ssh')
          - item_ufw_status['stdout'] is search('80|http')
          - item_ufw_status['stdout'] is search('443|https')
        fail_msg: UFW does not have the expected default policy and allowances.

    - name: Read SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_sshd_config

    - name: Assert SSH hardening directives
      ansible.builtin.assert:
        that:
          - item_sshd_config['content'] | b64decode is regex('(?m)^\\s*PermitRootLogin\\s+no\\s*$')
          - item_sshd_config['content'] | b64decode is regex('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')
        fail_msg: SSH hardening directives are not configured as expected.

    - name: Validate sshd configuration syntax
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      register: item_sshd_syntax
      changed_when: false

    - name: Assert sshd configuration syntax succeeds
      ansible.builtin.assert:
        that: item_sshd_syntax['rc'] == 0
        fail_msg: sshd configuration syntax validation failed.

    - name: Check required fail2ban jails
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
          - "{{ item_jail }}"
      register: item_jail_status
      changed_when: false
      loop:
        - sshd
        - nginx-http-auth
        - nginx-limit-req
        - nginx-botsearch
      loop_control:
        loop_var: item_jail

    - name: Check nginx, HTTPS, and SSH listeners
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: item_listener_status
      changed_when: false

    - name: Assert nginx and SSH listeners are present
      ansible.builtin.assert:
        that:
          - item_listener_status['stdout'] is regex(':80\\b')
          - item_listener_status['stdout'] is regex(':443\\b')
          - item_listener_status['stdout'] is regex(':22\\b')
        fail_msg: An expected nginx or SSH network listener is absent.
