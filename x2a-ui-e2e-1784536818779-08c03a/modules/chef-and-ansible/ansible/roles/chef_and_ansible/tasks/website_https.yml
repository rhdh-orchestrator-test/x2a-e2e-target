---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
- name: Install necessary packages
  ansible.builtin.apt:
    name: apache2=2.4.41-4ubuntu3.10
- name: Install curl, openssl, PyOpenSSL
  ansible.builtin.apt:
    pkg:
      - curl
      - openssl
      - python3-openssl
- name: Create a directory for certs
  ansible.builtin.file:
    path: /etc/apache2/certs
    state: directory
    mode: "0640"
- name: Generate an openssl key
  community.crypto.openssl_privatekey:
    path: /etc/apache2/certs/apache.key
- name: Generate an openssl csr
  community.crypto.openssl_csr:
    path: /etc/apache2/certs/apache.csr
    privatekey_path: /etc/apache2/certs/apache.key
    common_name: myhost
- name: Generate a self-signed openssl certificate
  community.crypto.openssl_certificate:
    path: /etc/apache2/certs/apache.crt
    privatekey_path: /etc/apache2/certs/apache.key
    csr_path: /etc/apache2/certs/apache.csr
    provider: selfsigned
- name: Configure Hello World virtual host
  ansible.builtin.copy:
    content: "{{ conftext }}"
    dest: /etc/apache2/sites-available/helloworld.conf
    mode: "0640"
    force: true
  vars:
    conftext: '<VirtualHost *:443> DocumentRoot "/var/www/helloworld" SSLEngine on SSLCertificateFile /etc/apache2/certs/apache.crt SSLCertificateKeyFile /etc/apache2/certs/apache.key
      <Directory "/var/www/helloworld"> allow from all Options None Require all granted </Directory> </VirtualHost> '
- name: Create the helloworld directory
  ansible.builtin.file:
    path: /var/www/helloworld
    state: directory
    mode: "0755"
- name: Deploy the Hello World website
  ansible.builtin.copy:
    content: "{{ webtext }}"
    dest: /var/www/helloworld/index.html
    owner: root
    group: root
    mode: "0644"
    force: true
  vars:
    webtext: "<html> <head><title>Test Site</title>/head> <body> <h1>Hello, world!</h1> <p>The site is up and running</p> </body> </html> "
- name: Check if default site is enabled
  ansible.builtin.stat:
    path: /etc/apache2/sites-enabled/000-default.conf
  register: default_site_enabled
- name: Deactivate the default virtualhost
  ansible.builtin.command: a2dissite 000-default
  changed_when: true
  when: default_site_enabled.stat.exists
- name: Check if helloworld site is enabled
  ansible.builtin.stat:
    path: /etc/apache2/sites-enabled/helloworld.conf
  register: helloworld_site_enabled
- name: Activate the virtualhost
  ansible.builtin.command: a2ensite helloworld
  notify:
    - Restart apache
  changed_when: true
  when: not helloworld_site_enabled.stat.exists
- name: Check if SSL module is enabled
  ansible.builtin.stat:
    path: /etc/apache2/mods-enabled/ssl.load
  register: ssl_module_enabled
- name: Activate SSL on Apache
  ansible.builtin.command: a2enmod ssl
  notify:
    - Restart apache
  changed_when: true
  when: not ssl_module_enabled.stat.exists
