- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/home/ansible
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname | default(''automate.chef.lab'') }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '{{ item.name }} = {{ item.value }}'
      dest: /tmp/molecule_test/etc/{{ item.name | replace('.', '_') }}
      mode: '0644'
    loop:
    - name: vm.max_map_count
      value: '{{ chef_automate_vm_max_map_count | default(''262144'') }}'
    - name: vm.dirty_expire_centisecs
      value: '{{ chef_automate_vm_dirty_expire_centisecs | default(''20000'') }}'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Simulator'' '
      dest: /tmp/molecule_test{{ chef_automate_cli_path | default('/tmp/chef-automate') }}
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create directories for key files
    ansible.builtin.file:
      path: /tmp/molecule_test/home/ansible
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/home/ansible/{{ chef_automate_user_key_file | default(chef_automate_username ~ '.pem') | default('jtonello.pem') }}
      mode: '0600'
  - name: Create organization key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/home/ansible/{{ chef_automate_org_key_file | default(chef_automate_org_name ~ '-validator.pem') | default('lab-validator.pem') }}
      mode: '0600'
  - name: Create Chef server user list file
    ansible.builtin.copy:
      content: '{{ chef_automate_username | default(''jtonello'') }} '
      dest: /tmp/molecule_test/etc/chef-server-user-list
      mode: '0644'
  - name: Create Chef server org list file
    ansible.builtin.copy:
      content: '{{ chef_automate_org_name | default(''lab'') }} '
      dest: /tmp/molecule_test/etc/chef-server-org-list
      mode: '0644'
