- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found or empty
      success_msg: Hostname file exists and has content
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == chef_automate_hostname | default('automate.chef.lab')
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check vm.max_map_count file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/vm_max_map_count
    register: max_map_count_file
  - name: Assert vm.max_map_count file exists
    ansible.builtin.assert:
      that:
      - max_map_count_file.stat.exists
      fail_msg: vm.max_map_count file not found
      success_msg: vm.max_map_count file exists
  - name: Get vm.max_map_count content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/vm_max_map_count
    register: max_map_count_content
    when: max_map_count_file.stat.exists
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - (max_map_count_content.content | b64decode | trim) == "vm.max_map_count = " + (chef_automate_vm_max_map_count | default('262144') | string)
      fail_msg: vm.max_map_count not set correctly
      success_msg: vm.max_map_count set correctly
    when: max_map_count_file.stat.exists
  - name: Check vm.dirty_expire_centisecs file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/vm_dirty_expire_centisecs
    register: dirty_expire_file
  - name: Assert vm.dirty_expire_centisecs file exists
    ansible.builtin.assert:
      that:
      - dirty_expire_file.stat.exists
      fail_msg: vm.dirty_expire_centisecs file not found
      success_msg: vm.dirty_expire_centisecs file exists
  - name: Get vm.dirty_expire_centisecs content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/vm_dirty_expire_centisecs
    register: dirty_expire_content
    when: dirty_expire_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - (dirty_expire_content.content | b64decode | trim) == "vm.dirty_expire_centisecs = " + (chef_automate_vm_dirty_expire_centisecs | default('20000') | string)
      fail_msg: vm.dirty_expire_centisecs not set correctly
      success_msg: vm.dirty_expire_centisecs set correctly
    when: dirty_expire_file.stat.exists
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test{{ chef_automate_cli_path | default('/tmp/chef-automate') }}
    register: automate_cli_file
  - name: Assert Chef Automate CLI file exists
    ansible.builtin.assert:
      that:
      - automate_cli_file.stat.exists
      - automate_cli_file.stat.executable
      fail_msg: Chef Automate CLI file not found or not executable
      success_msg: Chef Automate CLI file exists and is executable
  - name: Check Chef Automate deployment marker
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert Chef Automate deployment marker exists
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef Automate deployment marker not found
      success_msg: Chef Automate deployment marker exists
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/{{ chef_automate_user_key_file | default(chef_automate_username ~ '.pem') | default('jtonello.pem') }}
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.size > 0
      fail_msg: User key file not found or empty
      success_msg: User key file exists and has content
  - name: Check organization key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/{{ chef_automate_org_key_file | default(chef_automate_org_name ~ '-validator.pem') | default('lab-validator.pem') }}
    register: org_key_file
  - name: Assert organization key file exists
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.size > 0
      fail_msg: Organization key file not found or empty
      success_msg: Organization key file exists and has content
  - name: Check Chef server user list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-server-user-list
    register: user_list_file
  - name: Get user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/chef-server-user-list
    register: user_list_content
    when: user_list_file.stat.exists
  - name: Assert user list contains expected user
    ansible.builtin.assert:
      that:
      - (user_list_content.content | b64decode | trim) == chef_automate_username | default('jtonello')
      fail_msg: User list does not contain expected user
      success_msg: User list contains expected user
    when: user_list_file.stat.exists
  - name: Check Chef server org list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-server-org-list
    register: org_list_file
  - name: Get org list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/chef-server-org-list
    register: org_list_content
    when: org_list_file.stat.exists
  - name: Assert org list contains expected organization
    ansible.builtin.assert:
      that:
      - (org_list_content.content | b64decode | trim) == chef_automate_org_name | default('lab')
      fail_msg: Org list does not contain expected organization
      success_msg: Org list contains expected organization
    when: org_list_file.stat.exists
  - name: Check Chef Automate service status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - automate_status.rc == 0
      fail_msg: Chef Automate service is not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check Chef Infra Server service status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server service is running
    ansible.builtin.assert:
      that:
      - server_status.rc == 0
      fail_msg: Chef Infra Server service is not running
      success_msg: Chef Infra Server service is running
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is succeeded
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
  - name: Check Chef Automate web UI access
    ansible.builtin.uri:
      url: https://localhost
      validate_certs: false
      status_code: 200
    register: web_ui_check
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate web UI is accessible
    ansible.builtin.assert:
      that:
      - web_ui_check is succeeded
      fail_msg: Chef Automate web UI is not accessible
      success_msg: Chef Automate web UI is accessible
    tags: molecule-notest
