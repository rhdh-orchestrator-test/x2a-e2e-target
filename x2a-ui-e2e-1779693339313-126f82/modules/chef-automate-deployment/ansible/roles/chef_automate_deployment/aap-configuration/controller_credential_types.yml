---
controller_credential_types:
- name: Chef User Authentication
  description: Credential type for Chef User Authentication
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Chef Username
      help_text: Username for the initial Chef user account
    - id: password
      type: string
      label: Chef Password
      secret: true
      help_text: Password for the initial Chef user account
    - id: user_key_file
      type: string
      label: User Key File Path
      help_text: Path where the user's PEM key file will be stored
    - id: organization_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: organization_key_file
      type: string
      label: Organization Key File Path
      help_text: Path where the organization validator PEM key file will be stored
    required:
    - username
    - password
    - organization_name
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      user_key_file: !unsafe '{{ user_key_file }}'
      organization_name: !unsafe '{{ organization_name }}'
      organization_key_file: !unsafe '{{ organization_key_file }}'
