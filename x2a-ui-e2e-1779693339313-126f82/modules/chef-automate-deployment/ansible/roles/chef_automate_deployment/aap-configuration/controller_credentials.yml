---
controller_credentials:
- name: Chef User Authentication - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User Authentication
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    user_key_file: '{{ user_key_file }}'
    organization_name: '{{ organization_name }}'
    organization_key_file: '{{ organization_key_file }}'
