---
controller_credential_types:
- name: Chef Admin User Password
  description: Credentials for the initial admin user created during Chef Infra Server
    deployment
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Admin Username
      help_text: Username for the initial admin user created in Chef Infra Server
    - id: password
      type: string
      label: Admin Password
      secret: true
      help_text: Password for the initial admin user created in Chef Infra Server
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
