---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_file.stat.exists

    - name: Check hosts file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hosts
      register: hosts_file

    - name: Assert hosts file exists
      ansible.builtin.assert:
        that:
          - hosts_file.stat.exists
          - hosts_file.stat.isreg
        fail_msg: "Hosts file not found"
        success_msg: "Hosts file exists"

    - name: Get hosts file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hosts
      register: hosts_content
      when: hosts_file.stat.exists

    - name: Assert hosts file contains hostname entry
      ansible.builtin.assert:
        that:
          - (hosts_content.content | b64decode) is search("automate.chef.lab")
        fail_msg: "Hosts file does not contain hostname entry"
        success_msg: "Hosts file contains hostname entry"
      when: hosts_file.stat.exists

    # Kernel parameter checks
    - name: Check sysctl config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl config file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl config file not found"
        success_msg: "Sysctl config file exists"

    - name: Get sysctl config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search("vm.max_map_count = 262144")
        fail_msg: "vm.max_map_count is not set correctly"
        success_msg: "vm.max_map_count is set correctly"
      when: sysctl_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search("vm.dirty_expire_centisecs = 20000")
        fail_msg: "vm.dirty_expire_centisecs is not set correctly"
        success_msg: "vm.dirty_expire_centisecs is set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate configuration checks
    - name: Check Chef Automate config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: automate_config_file

    - name: Assert Chef Automate config file exists
      ansible.builtin.assert:
        that:
          - automate_config_file.stat.exists
          - automate_config_file.stat.isreg
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    # PEM file checks
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_pem_file

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem_file.stat.exists
          - user_pem_file.stat.isreg
          - user_pem_file.stat.mode == "0600"
        fail_msg: "User PEM file not found or has incorrect permissions"
        success_msg: "User PEM file exists with correct permissions"

    - name: Check organization validator PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_pem_file

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_pem_file.stat.exists
          - org_pem_file.stat.isreg
          - org_pem_file.stat.mode == "0600"
        fail_msg: "Organization validator PEM file not found or has incorrect permissions"
        success_msg: "Organization validator PEM file exists with correct permissions"

    # Chef Server directory checks
    - name: Check Chef Server configuration directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server
      register: chef_server_config_dir

    - name: Assert Chef Server configuration directory exists
      ansible.builtin.assert:
        that:
          - chef_server_config_dir.stat.exists
          - chef_server_config_dir.stat.isdir
        fail_msg: "Chef Server configuration directory not found"
        success_msg: "Chef Server configuration directory exists"

    - name: Check Chef Server data directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server
      register: chef_server_data_dir

    - name: Assert Chef Server data directory exists
      ansible.builtin.assert:
        that:
          - chef_server_data_dir.stat.exists
          - chef_server_data_dir.stat.isdir
        fail_msg: "Chef Server data directory not found"
        success_msg: "Chef Server data directory exists"

    - name: Check Chef Server logs directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/chef-server
      register: chef_server_logs_dir

    - name: Assert Chef Server logs directory exists
      ansible.builtin.assert:
        that:
          - chef_server_logs_dir.stat.exists
          - chef_server_logs_dir.stat.isdir
        fail_msg: "Chef Server logs directory not found"
        success_msg: "Chef Server logs directory exists"

    # The following checks would normally be run on a real system but can't be run in a container
    # They are tagged with molecule-notest so they'll be skipped during molecule testing

    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Server is running
      ansible.builtin.assert:
        that:
          - server_status.rc == 0
        fail_msg: "Chef Server is not running"
        success_msg: "Chef Server is running"
      tags: molecule-notest

    - name: Check user list
      ansible.builtin.command:
        cmd: sudo chef-server-ctl user-list
      register: user_list
      changed_when: false
      tags: molecule-notest

    - name: Assert user exists
      ansible.builtin.assert:
        that:
          - "'jtonello' in user_list.stdout"
        fail_msg: "User jtonello not found"
        success_msg: "User jtonello exists"
      tags: molecule-notest

    - name: Check organization list
      ansible.builtin.command:
        cmd: sudo chef-server-ctl org-list
      register: org_list
      changed_when: false
      tags: molecule-notest

    - name: Assert organization exists
      ansible.builtin.assert:
        that:
          - "'lab' in org_list.stdout"
        fail_msg: "Organization lab not found"
        success_msg: "Organization lab exists"
      tags: molecule-notest

    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      tags: molecule-notest

    - name: Check API health
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
      register: health_check
      tags: molecule-notest

    - name: Assert API health check is successful
      ansible.builtin.assert:
        that:
          - health_check.status == 200
        fail_msg: "API health check failed"
        success_msg: "API health check successful"
      tags: molecule-notest