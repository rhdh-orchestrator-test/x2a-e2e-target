---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
        - /tmp/molecule_test/etc/memcached
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          # Generated by Ansible for testing

          # Network
          bind 127.0.0.1
          port 6379
          timeout 0
          tcp-keepalive 60

          # General
          daemonize yes
          supervised systemd
          pidfile /var/run/redis/redis-server.pid
          loglevel notice
          logfile /var/log/redis/redis-server.log

          # Snapshotting
          save 900 1
          save 300 10
          save 60 10000
          stop-writes-on-bgsave-error yes
          rdbcompression yes
          rdbchecksum yes
          dbfilename dump.rdb
          dir /var/lib/redis

          # Security
          requirepass redis_secure_password_123

          # Limits
          maxclients 10000

          # Memory management
          maxmemory-policy allkeys-lru

          # Append only file
          appendonly no
          appendfilename "appendonly.aof"
          appendfsync everysec
          no-appendfsync-on-rewrite no
          auto-aof-rewrite-percentage 100
          auto-aof-rewrite-min-size 64mb

          # Slow log
          slowlog-log-slower-than 10000
          slowlog-max-len 128

          # Event notification
          notify-keyspace-events ""

          # Advanced config
          hash-max-ziplist-entries 512
          hash-max-ziplist-value 64
          list-max-ziplist-size -2
          list-compress-depth 0
          set-max-intset-entries 512
          zset-max-ziplist-entries 128
          zset-max-ziplist-value 64
          hll-sparse-max-bytes 3000
          activerehashing yes
          client-output-buffer-limit normal 0 0 0
          client-output-buffer-limit slave 256mb 64mb 60
          client-output-buffer-limit pubsub 32mb 8mb 60
          hz 10
          aof-rewrite-incremental-fsync yes
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create memcached configuration file
      ansible.builtin.copy:
        content: |
          # memcached default config file
          # Run memcached as a daemon
          -d
          # Log memcached's output to /var/log/memcached
          logfile /var/log/memcached.log
          # Be verbose
          # -v
          # Be even more verbose (print client commands as well)
          # -vv
          # Start with a cap of 64 megs of memory. It's reasonable, and the daemon default
          # Note that the daemon will grow to this size, but does not start out holding this much
          # memory
          -m 64
          # Default connection port is 11211
          -p 11211
          # Run the daemon as root. The start-memcached will default to running as root if no
          # -u command is present in this config file
          -u memcache
          # Specify which IP address to listen on. The default is to listen on all IP addresses
          # This parameter is one of the only security measures that memcached has, so make sure
          # it's listening on a firewalled interface.
          -l 127.0.0.1
          # Limit the number of simultaneous incoming connections. The daemon default is 1024
          -c 1024
          # Lock down all paged memory. Consult with the README and homepage before you do this
          # -k
          # Return error when memory is exhausted (rather than removing items)
          # -M
          # Maximize core file limit
          # -r
        dest: /tmp/molecule_test/etc/memcached.conf
        mode: "0644"
        backup: true

    - name: Create Redis log file
      ansible.builtin.copy:
        content: |
          # Redis log file placeholder for testing
          1:M 01 Jan 2024 00:00:00.000 # Server initialized
          1:M 01 Jan 2024 00:00:00.001 # Ready to accept connections
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"
        backup: true

    - name: Create Redis PID file
      ansible.builtin.copy:
        content: "12345"
        dest: /tmp/molecule_test/var/run/redis/redis-server.pid
        mode: "0644"
        backup: true

    - name: Create Redis dump file
      ansible.builtin.copy:
        content: "REDIS0009"
        dest: /tmp/molecule_test/var/lib/redis/dump.rdb
        mode: "0644"
        backup: true