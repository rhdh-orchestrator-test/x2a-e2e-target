---
argument_specs:
  main:
    short_description: Install and configure Redis and Memcached caching services
    description:
      - Installs and configures Redis server with authentication on port 6379
      - Installs and configures Memcached service on port 11211
      - Creates necessary directories and users for Redis operation
      - Removes deprecated Redis replica configuration settings
    options:
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by AAP credential type. Used for requirepass configuration in Redis.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for Redis server to listen on.
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to Redis configuration file.
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory for Redis log files.
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: System user for Redis service.
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: System group for Redis service.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: TCP port for Memcached service to listen on.
      cache_redis_service_name:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis systemd service.
      cache_memcached_service_name:
        type: str
        required: false
        default: memcached
        description: Name of the Memcached systemd service.
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis package to install.
      cache_memcached_package:
        type: str
        required: false
        default: memcached
        description: Name of the Memcached package to install.
