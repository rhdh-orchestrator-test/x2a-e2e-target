---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI and PostgreSQL packages  # noqa: R113 - package names are a fixed OS-specific list in the role
  ansible.builtin.package:
    name: >-
      {{ (['python3', 'python3-pip', 'git', 'postgresql-server', 'postgresql-contrib', 'libpq-devel']
          if ansible_facts['os_family'] == 'RedHat' else
          ['python3', 'python3-pip', 'python3-venv', 'git', 'postgresql', 'postgresql-contrib', 'libpq-dev']) }}
    state: present

- name: Initialize PostgreSQL on RedHat systems
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] == 'RedHat'

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository  # noqa: R104 - repository role default is an HTTPS URL
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"  # noqa: R106 - source is the trusted repository role default
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - destination is a role default, not user input
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - command uses the role-default application path
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_app_path }}/venv"
    creates: "{{ fastapi_tutorial_app_path }}/venv" # noqa: R114 - path is derived from a role default

- name: Install Python dependencies  # noqa: R113 - dependency paths are fixed locations derived from role defaults
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_app_path }}/venv"
    virtualenv_command: python3 -m venv
  # noqa: R114 - application paths are role defaults

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL role and database  # noqa: R101 - database command values come from validated role inputs
  ansible.builtin.shell:
    cmd: |
      if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ fastapi_tutorial_db_user }}'" | grep -q 1; then
        psql -c "CREATE ROLE {{ fastapi_tutorial_db_user }} LOGIN PASSWORD '{{ db_password }}'"
        echo CREATED_ROLE
      fi
      if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ fastapi_tutorial_db_name }}'" | grep -q 1; then
        psql -c "CREATE DATABASE {{ fastapi_tutorial_db_name }} OWNER {{ fastapi_tutorial_db_user }}"
        echo CREATED_DATABASE
      fi
      psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ fastapi_tutorial_db_name }} TO {{ fastapi_tutorial_db_user }}"
    executable: /bin/bash
  become: true  # noqa: R108 - PostgreSQL role management requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"
  register: fastapi_tutorial_database_result
  changed_when: >-
    'CREATED_ROLE' in fastapi_tutorial_database_result.stdout or
    'CREATED_DATABASE' in fastapi_tutorial_database_result.stdout
  # noqa: L039 - db_password is validated by the preceding credential validation task

- name: Write application environment configuration  # noqa: L039 - db_password is validated by the preceding credential validation task
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ fastapi_tutorial_db_user }}:{{ db_password | urlencode }}@{{ fastapi_tutorial_db_host }}/{{ fastapi_tutorial_db_name }}
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - path is derived from a role default
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_app_path }}/venv/bin"
      ExecStart={{ fastapi_tutorial_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart fastapi tutorial

- name: Enable and start FastAPI service
  ansible.builtin.systemd:
    name: fastapi-tutorial
    enabled: true
    state: started
    daemon_reload: true
