---
controller_credential_types:
  - name: PostgreSQL FastAPI Application Database
    description: Password for the FastAPI PostgreSQL role, migrated from the hardcoded Chef value to the Ansible variable fastapi_db_password and stored in 
      Ansible Vault or an approved AAP credential mechanism.
    kind: cloud
    inputs:
      fields:
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL role fastapi, used to create the role and render the FastAPI DATABASE_URL connection string.
      required:
        - db_password
    injectors:
      extra_vars:
        db_password: !unsafe "{{ db_password }}"
