---
controller_credentials:
  - name: PostgreSQL FastAPI Application Database - fastapi_tutorial
    description: Password for the FastAPI PostgreSQL role, migrated from the hardcoded Chef value to the Ansible variable fastapi_db_password and stored in 
      Ansible Vault or an approved AAP credential mechanism.
    organization: Default
    credential_type: PostgreSQL FastAPI Application Database
    update_secrets: true
    inputs:
      db_password: "{{ vault_db_password }}"
