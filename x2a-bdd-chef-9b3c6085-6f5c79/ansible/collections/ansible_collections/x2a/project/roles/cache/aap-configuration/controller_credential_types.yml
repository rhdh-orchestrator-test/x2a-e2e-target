---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis server configured on port 6379; currently hardcoded in the Chef recipe and must be migrated 
      to protected AAP secret storage.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required for clients to authenticate to the Redis server on port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
