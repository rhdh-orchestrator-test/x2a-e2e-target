---
argument_specs:
  main:
    short_description: Configure nginx as a secure multi-site web server.
    description:
      - Installs and configures nginx, security controls, TLS certificates, and named virtual hosts.
    options:
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory containing site certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory containing site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban security is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide sensitive task output by default.
      nginx_multisite_sites:
        type: dict
        required: false
        default: {}
        description: Mapping of site names to document roots and SSL settings.
