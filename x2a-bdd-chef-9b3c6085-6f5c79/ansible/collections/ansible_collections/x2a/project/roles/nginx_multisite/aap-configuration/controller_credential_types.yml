---
controller_credential_types:
  - name: Chef Encrypted Data Bag Nginx Site Token
    description: Token loaded from the Chef encrypted data bag nginx_secrets/site and written for local nginx consumption.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Nginx Site Token
          secret: true
          help_text: Secret token from the nginx_secrets/site encrypted data-bag item, used by nginx-related local processing.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
