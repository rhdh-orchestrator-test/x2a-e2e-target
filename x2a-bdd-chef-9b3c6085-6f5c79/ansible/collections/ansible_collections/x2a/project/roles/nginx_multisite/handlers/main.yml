---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload nginx_multisite sysctl
  ansible.builtin.command:
    argv:
      - sysctl
      - -p
      - /etc/sysctl.d/99-security.conf
  changed_when: true

- name: Restart sshd
  ansible.builtin.service:
    name: "{{ 'sshd' if ansible_facts.os_family == 'RedHat' else 'ssh' }}"
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
