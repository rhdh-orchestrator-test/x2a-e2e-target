---
# Unsupported pre-flight checks: package inventory; fail2ban configuration contents;
# conditional SSH hardening; kernel values; conditional HTTPS/site checks; curl response
# contents; reload/idempotence checks; and site-specific checks without named instances.
- name: Verify nginx-multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify nginx service is active and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services.get('nginx.service', {}).get('state') == 'running'
          - ansible_facts.services.get('nginx.service', {}).get('status') == 'enabled'
        fail_msg: nginx must be active and enabled

    - name: Verify Fail2ban service is active
      ansible.builtin.assert:
        that:
          - ansible_facts.services.get('fail2ban.service', {}).get('state') == 'running'
        fail_msg: Fail2ban must be active

    - name: Validate nginx configuration syntax
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      register: verify_nginx_test
      failed_when: verify_nginx_test.rc != 0

    - name: Inspect the active nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      changed_when: false
      register: verify_nginx_dump
      failed_when: verify_nginx_dump.rc != 0

    - name: Verify required nginx configuration directives are present
      ansible.builtin.assert:
        that:
          - "'include /etc/nginx/conf.d' in verify_nginx_dump.stdout"
          - "'include /etc/nginx/sites-enabled' in verify_nginx_dump.stdout"
          - "'worker_processes' in verify_nginx_dump.stdout"
          - "'worker_connections' in verify_nginx_dump.stdout"
          - "'gzip' in verify_nginx_dump.stdout"
        fail_msg: Required nginx configuration directives are missing

    - name: Verify nginx listens on HTTP
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 80
        state: started
        timeout: 5

    - name: Inspect UFW status and rules
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      changed_when: false
      register: verify_ufw_status
      failed_when: verify_ufw_status.rc != 0

    - name: Verify UFW policy and required allowed ports
      ansible.builtin.assert:
        that:
          - "'Status: active' in verify_ufw_status.stdout"
          - "'Default: deny (incoming)' in verify_ufw_status.stdout"
          - verify_ufw_status.stdout is search('22/tcp\\s+ALLOW')
          - verify_ufw_status.stdout is search('80/tcp\\s+ALLOW')
          - verify_ufw_status.stdout is search('443/tcp\\s+ALLOW')
        fail_msg: UFW must be active with denied incoming traffic and ports 22, 80, and 443 allowed

    - name: Verify nginx site token metadata without reading the token
      ansible.builtin.stat:
        path: /etc/nginx/secrets/site_token
      register: verify_site_token

    - name: Assert nginx site token ownership and permissions
      ansible.builtin.assert:
        that:
          - verify_site_token.stat.exists
          - verify_site_token.stat.pw_name == 'root'
          - verify_site_token.stat.gr_name == 'root'
          - verify_site_token.stat.mode == '0600'
        fail_msg: The nginx site token must be root-owned with mode 0600

    - name: Verify the nginx default site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: verify_default_site

    - name: Assert the nginx default site is absent
      ansible.builtin.assert:
        that:
          - not verify_default_site.stat.exists
        fail_msg: The nginx default site must be absent
