---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml

- name: Configure Redis cache server  # noqa: L038 - external eloy.redis role is declared in requirements.yml but cannot be resolved by static validation
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: 6379
    redis_requirepass: "{{ redis_password }}"
    redis_install_method: package
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Remove unsupported Redis directives
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^{{ item_cache_directive }}.*$
    state: absent
  loop:
    - replica-serve-stale-data
    - replica-read-only
    - repl-ping-replica-period
    - client-output-buffer-limit
    - replica-priority
  loop_control:
    loop_var: item_cache_directive
