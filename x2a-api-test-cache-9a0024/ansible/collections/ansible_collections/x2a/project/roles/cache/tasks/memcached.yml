---
- name: Install Memcached package
  ansible.builtin.package:
    name: memcached
    state: present

- name: Create Memcached service group
  ansible.builtin.group:
    name: "{{ cache_memcached_group }}"
    state: present

- name: Create Memcached service user
  ansible.builtin.user:
    name: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_group }}"
    system: true
    create_home: false
    state: present

- name: Create Memcached log directory
  ansible.builtin.file:
    path: /var/log/memcached
    state: directory
    owner: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_group }}"
    mode: "0755"

- name: Create Memcached runtime directory
  ansible.builtin.file:
    path: /var/run/memcached
    state: directory
    owner: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_group }}"
    mode: "0755"

- name: Configure Memcached service arguments
  ansible.builtin.template:
    src: memcached.conf.j2
    dest: /etc/memcached.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart memcached

- name: Start and enable Memcached
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
