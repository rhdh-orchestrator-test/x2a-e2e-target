- name: Install Redis server package
  ansible.builtin.package:
    name: '{{ cache_redis_package }}'
    state: present
- name: Create Redis data directory
  ansible.builtin.file:
    path: '{{ cache_redis_data_dir }}'
    state: directory
    owner: redis
    group: redis
    mode: '0755'
- name: Create Redis log directory
  ansible.builtin.file:
    path: '{{ cache_redis_log_file | dirname }}'
    state: directory
    owner: redis
    group: redis
    mode: '0755'
- name: Create Redis PID directory
  ansible.builtin.file:
    path: '{{ cache_redis_pid_file | dirname }}'
    state: directory
    owner: redis
    group: redis
    mode: '0755'
- name: Enable and start Redis service
  ansible.builtin.service:
    name: '{{ cache_redis_service }}'
    enabled: '{{ cache_redis_enabled }}'
    state: '{{ cache_redis_state }}'
