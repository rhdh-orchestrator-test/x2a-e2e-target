---
- name: Check if chef-server-ctl command exists
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ userfilename }}
  args:
    creates: "{{ ansible_env.PWD }}/{{ userfilename }}"
  become: true
  when: create_user | bool and chef_server_ctl_check.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ orgname }} "{{ longorgname }}" --association_user {{ username }} --filename {{ orgfilename }}
  args:
    creates: "{{ ansible_env.PWD }}/{{ orgfilename }}"
  become: true
  when: create_organization | bool and chef_server_ctl_check.rc == 0
