- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/opscode
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/opscode
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "# Mock Chef Automate config.toml\n[global]\n  v1 = true\n[deployment]\n  automate = \"enabled\"\n  infra_server = \"enabled\"\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
    when: deploy_automate | default(true) | bool
  - name: Create Chef Server config file
    ansible.builtin.copy:
      content: '# Mock Chef Server config

        nginx[''enable''] = true

        nginx[''ssl_port''] = 443

        bookshelf[''vip''] = ''automate.chef.lab''

        '
      dest: /tmp/molecule_test/etc/opscode/chef-server.rb
      mode: '0644'
    when: deploy_infra_server | default(true) | bool
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefghijklmnopq

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ username | default('jtonello') }}.pem
      mode: '0600'
    when: create_user | default(true) | bool
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        ZYXWVUTSRQPONMLKJIHGFEDCBA0987654321zyxwvutsrqponmlk

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ orgname | default('lab') }}-validator.pem
      mode: '0600'
    when: create_organization | default(true) | bool
  - name: Create mock system configuration files
    ansible.builtin.copy:
      content: '# Mock system configuration

        vm.max_map_count = {{ vm_max_map_count | default(262144) }}

        vm.dirty_expire_centisecs = {{ vm_dirty_expire_centisecs | default(20000) }}

        HOSTNAME={{ hostname | default(''automate.chef.lab'') }}

        '
      dest: /tmp/molecule_test/system_config
      mode: '0644'
