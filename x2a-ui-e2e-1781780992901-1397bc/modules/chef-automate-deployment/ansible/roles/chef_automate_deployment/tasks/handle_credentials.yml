---
- name: Ensure PEM files have proper permissions
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
    state: file
  loop:
    - "{{ chef_automate_user_pem_path }}"
    - "{{ chef_automate_org_validator_pem_path }}"
  when:
    - item is defined
    - item | length > 0
- name: Display information about generated credentials
  ansible.builtin.debug:
    msg: "Chef Automate deployment completed successfully.\n\nUser PEM file: {{ chef_automate_user_pem_path }}\nOrganization validator PEM file: {{ chef_automate_org_validator_pem_path
      }}\n\nYou can now access the Chef Automate UI at https://{{ chef_automate_hostname }}\n\nTo use knife commands, configure your knife.rb with:\n- node_name:
      {{ username }}\n- client_key: {{ chef_automate_user_pem_path }}\n- chef_server_url: https://{{ chef_automate_hostname }}/organizations/{{ chef_automate_org_name
      }}"
