---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    chef_automate_hostname: automate.chef.lab
    chef_automate_org_name: lab
    chef_automate_user_pem_path: /tmp/molecule_test/jtonello.pem
    chef_automate_org_validator_pem_path: /tmp/molecule_test/lab-validator.pem
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
  tasks:
    # Verify hostname configuration
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is correctly set
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == chef_automate_hostname
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_file.stat.exists

    # Verify system parameters
    - name: Check max_map_count file
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_file

    - name: Assert max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
          - max_map_count_file.stat.isreg
        fail_msg: "max_map_count file not found"
        success_msg: "max_map_count file exists"

    - name: Get max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert max_map_count is correctly set
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "262144"
        fail_msg: "max_map_count is not set correctly"
        success_msg: "max_map_count is set correctly"
      when: max_map_count_file.stat.exists

    - name: Check dirty_expire_centisecs file
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_file

    - name: Assert dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_centisecs_file.stat.exists
          - dirty_expire_centisecs_file.stat.isreg
        fail_msg: "dirty_expire_centisecs file not found"
        success_msg: "dirty_expire_centisecs file exists"

    - name: Get dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_content
      when: dirty_expire_centisecs_file.stat.exists

    - name: Assert dirty_expire_centisecs is correctly set
      ansible.builtin.assert:
        that:
          - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
        fail_msg: "dirty_expire_centisecs is not set correctly"
        success_msg: "dirty_expire_centisecs is set correctly"
      when: dirty_expire_centisecs_file.stat.exists

    # Verify Chef Automate CLI
    - name: Check Chef Automate CLI file
      ansible.builtin.stat:
        path: "{{ chef_automate_cli_path }}"
      register: chef_automate_cli_file

    - name: Assert Chef Automate CLI file exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli_file.stat.exists
          - chef_automate_cli_file.stat.isreg
          - chef_automate_cli_file.stat.executable
        fail_msg: "Chef Automate CLI file not found or not executable"
        success_msg: "Chef Automate CLI file exists and is executable"

    # Verify Chef Automate status
    - name: Check Chef Automate status file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate-status.txt
      register: chef_automate_status_file

    - name: Assert Chef Automate status file exists
      ansible.builtin.assert:
        that:
          - chef_automate_status_file.stat.exists
          - chef_automate_status_file.stat.isreg
        fail_msg: "Chef Automate status file not found"
        success_msg: "Chef Automate status file exists"

    # Verify user and organization PEM files
    - name: Check user PEM file
      ansible.builtin.stat:
        path: "{{ chef_automate_user_pem_path }}"
      register: user_pem_file

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem_file.stat.exists
          - user_pem_file.stat.isreg
          - user_pem_file.stat.mode == "0600"
        fail_msg: "User PEM file not found or has incorrect permissions"
        success_msg: "User PEM file exists with correct permissions"

    - name: Check organization validator PEM file
      ansible.builtin.stat:
        path: "{{ chef_automate_org_validator_pem_path }}"
      register: org_validator_pem_file

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_validator_pem_file.stat.exists
          - org_validator_pem_file.stat.isreg
          - org_validator_pem_file.stat.mode == "0600"
        fail_msg: "Organization validator PEM file not found or has incorrect permissions"
        success_msg: "Organization validator PEM file exists with correct permissions"

    # The following checks would normally run on a real system but can't run in a container
    # They are tagged with molecule-notest to be skipped during molecule testing

    - name: Check network listening on port 443
      ansible.builtin.command:
        cmd: ss -tlnp | grep 443
      changed_when: false
      tags: molecule-notest

    - name: Check Chef Automate service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - ansible_facts.services['chef-automate.service'].state == 'running'
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check Chef Server service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Server service is running
      ansible.builtin.assert:
        that:
          - "'chef-server.service' in ansible_facts.services"
          - ansible_facts.services['chef-server.service'].state == 'running'
        fail_msg: "Chef Server service is not running"
        success_msg: "Chef Server service is running"
      tags: molecule-notest

    - name: Check API status
      ansible.builtin.uri:
        url: https://localhost/api/_status
        validate_certs: false
      register: api_status
      tags: molecule-notest

    - name: Assert API is responding
      ansible.builtin.assert:
        that:
          - api_status.status == 200
        fail_msg: "API is not responding"
        success_msg: "API is responding"
      tags: molecule-notest

    - name: Check organization API
      ansible.builtin.uri:
        url: "https://localhost/organizations/{{ chef_automate_org_name }}"
        validate_certs: false
      register: org_api
      tags: molecule-notest

    - name: Assert organization API is responding
      ansible.builtin.assert:
        that:
          - org_api.status == 200
        fail_msg: "Organization API is not responding"
        success_msg: "Organization API is responding"
      tags: molecule-notest