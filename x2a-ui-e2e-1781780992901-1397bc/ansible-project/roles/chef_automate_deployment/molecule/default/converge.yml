---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    name: John Tonello
    email: jtonello@example.com
    password: molecule_test_password
    chef_automate_hostname: automate.chef.lab
    chef_automate_org_name: lab
    chef_automate_org_long_name: Chef Lab
    chef_automate_user_pem_path: /tmp/molecule_test/jtonello.pem
    chef_automate_org_validator_pem_path: /tmp/molecule_test/lab-validator.pem
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
    chef_automate_deployment_type: full
  tasks:
    # Create directory structure
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/chef-server
        - /tmp/molecule_test/hab

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl parameters
    - name: Create sysctl parameter files
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "/tmp/molecule_test/proc/sys/vm/{{ item.key | regex_replace('^vm\\.', '') }}"
        mode: "0644"
      loop:
        - key: vm.max_map_count
          value: "262144"
        - key: vm.dirty_expire_centisecs
          value: "20000"

    # Simulate Chef Automate CLI download and extraction
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI v1.0.0'\n"
        dest: "{{ chef_automate_cli_path }}"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Chef Automate deployment status:
          - automate: running
          - infra-server: running
        dest: /tmp/molecule_test/chef-automate-status.txt
        mode: "0644"

    # Simulate Chef Server CLI
    - name: Create Chef Server CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Server CLI v14.0.0'\n"
        dest: /tmp/molecule_test/chef-server-ctl
        mode: "0755"

    # Simulate user and organization creation
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAx4UbaPrYw4L4WYsd0dH9yPJ8q4vS+Kc4MegaTWWgFBJJnpP0
          -----END RSA PRIVATE KEY-----
        dest: "{{ chef_automate_user_pem_path }}"
        mode: "0600"

    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpQIBAAKCAQEA6NF8iallvQVp22WDkTkyrtvp9eWW6A8YVr+kz4TjGYe7g
          -----END RSA PRIVATE KEY-----
        dest: "{{ chef_automate_org_validator_pem_path }}"
        mode: "0600"

    # Simulate service listening on port 443
    - name: Create netstat output file
      ansible.builtin.copy:
        content: |
          tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/nginx
        dest: /tmp/molecule_test/netstat-output.txt
        mode: "0644"

    # Simulate service status
    - name: Create service status files
      ansible.builtin.copy:
        content: |
          ● chef-automate.service - Chef Automate
             Loaded: loaded (/etc/systemd/system/chef-automate.service; enabled; vendor preset: enabled)
             Active: active (running) since Mon 2023-01-01 00:00:00 UTC; 1h ago
        dest: /tmp/molecule_test/chef-automate-service-status.txt
        mode: "0644"

    - name: Create Chef Server service status file
      ansible.builtin.copy:
        content: |
          ● chef-server.service - Chef Infra Server
             Loaded: loaded (/etc/systemd/system/chef-server.service; enabled; vendor preset: enabled)
             Active: active (running) since Mon 2023-01-01 00:00:00 UTC; 1h ago
        dest: /tmp/molecule_test/chef-server-service-status.txt
        mode: "0644"

    # Simulate API status response
    - name: Create API status response file
      ansible.builtin.copy:
        content: |
          {
            "status": "ok",
            "uptime": "1h 30m",
            "services": [
              {"name": "automate", "status": "running"},
              {"name": "infra-server", "status": "running"}
            ]
          }
        dest: /tmp/molecule_test/api-status-response.json
        mode: "0644"

    # Simulate organization API response
    - name: Create organization API response file
      ansible.builtin.copy:
        content: |
          {
            "name": "lab",
            "full_name": "Chef Lab",
            "guid": "12345678-1234-1234-1234-123456789012"
          }
        dest: /tmp/molecule_test/org-api-response.json
        mode: "0644"