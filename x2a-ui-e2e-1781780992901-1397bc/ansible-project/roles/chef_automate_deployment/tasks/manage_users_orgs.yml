---
- name: Wait for Chef Server CLI to be available
  ansible.builtin.wait_for:
    path: /usr/bin/chef-server-ctl
    timeout: 300
  become: true
  tags: molecule-notest
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ name }} {{ email }} "{{ password }}" --filename {{ chef_automate_user_pem_path }}
  args:
    creates: "{{ chef_automate_user_pem_path }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_long_name }}" --association_user {{ username }} --filename {{
      chef_automate_org_validator_pem_path }}
  args:
    creates: "{{ chef_automate_org_validator_pem_path }}"
  become: true
