---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/nginx/nginx.conf
        - /tmp/molecule_test/etc/nginx/conf.d/security.conf
        - /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_config
      register: nginx_config_stat_results

    - name: Assert nginx configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected nginx config file not found"
      loop: "{{ nginx_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check nginx sites-enabled symbolic links exist
      ansible.builtin.stat:
        path: "{{ item_link }}"
      loop:
        - /tmp/molecule_test/etc/nginx/sites-enabled/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_link
      register: nginx_links_stat_results

    - name: Assert nginx sites-enabled links were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['islnk']
        fail_msg: "Expected nginx sites-enabled symlink not found"
      loop: "{{ nginx_links_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ item_ssl }}"
      loop:
        - /tmp/molecule_test/etc/ssl/certs/test.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/ci.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/status.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/private/test.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/ci.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_ssl
      register: ssl_files_stat_results

    - name: Assert SSL certificate files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate file not found"
      loop: "{{ ssl_files_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check site document root directories exist
      ansible.builtin.stat:
        path: "{{ item_docroot }}"
      loop:
        - /tmp/molecule_test/opt/server/test
        - /tmp/molecule_test/opt/server/ci
        - /tmp/molecule_test/opt/server/status
      loop_control:
        loop_var: item_docroot
      register: docroot_stat_results

    - name: Assert document root directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected document root directory not found"
      loop: "{{ docroot_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check site index.html files exist
      ansible.builtin.stat:
        path: "{{ item_index }}"
      loop:
        - /tmp/molecule_test/opt/server/test/index.html
        - /tmp/molecule_test/opt/server/ci/index.html
        - /tmp/molecule_test/opt/server/status/index.html
      loop_control:
        loop_var: item_index
      register: index_files_stat_results

    - name: Assert index.html files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected index.html file not found"
      loop: "{{ index_files_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read site index.html content
      ansible.builtin.slurp:
        src: "{{ item_content }}"
      loop:
        - /tmp/molecule_test/opt/server/test/index.html
        - /tmp/molecule_test/opt/server/ci/index.html
        - /tmp/molecule_test/opt/server/status/index.html
      loop_control:
        loop_var: item_content
      register: index_content_results

    - name: Assert site-specific content in index.html files
      ansible.builtin.assert:
        that:
          - "'Test Environment' in (item_result['content'] | b64decode)"
        fail_msg: "Test site content not found in index.html"
      loop: "{{ index_content_results['results'] }}"
      loop_control:
        loop_var: item_result
      when: "'test' in item_result['item']"

    - name: Assert CI site content in index.html
      ansible.builtin.assert:
        that:
          - "'CI Environment' in (item_result['content'] | b64decode)"
        fail_msg: "CI site content not found in index.html"
      loop: "{{ index_content_results['results'] }}"
      loop_control:
        loop_var: item_result
      when: "'ci' in item_result['item']"

    - name: Assert status site content in index.html
      ansible.builtin.assert:
        that:
          - "'Status Environment' in (item_result['content'] | b64decode)"
        fail_msg: "Status site content not found in index.html"
      loop: "{{ index_content_results['results'] }}"
      loop_control:
        loop_var: item_result
      when: "'status' in item_result['item']"

    - name: Check security configuration files exist
      ansible.builtin.stat:
        path: "{{ item_security }}"
      loop:
        - /tmp/molecule_test/etc/fail2ban/jail.local
        - /tmp/molecule_test/etc/sysctl.d/99-security.conf
        - /tmp/molecule_test/etc/ssh/sshd_config
      loop_control:
        loop_var: item_security
      register: security_files_stat_results

    - name: Assert security configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected security config file not found"
      loop: "{{ security_files_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read nginx main configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/nginx.conf
      register: nginx_conf_content

    - name: Assert nginx configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'user www-data' in (nginx_conf_content['content'] | b64decode)"
          - "'worker_processes auto' in (nginx_conf_content['content'] | b64decode)"
          - "'gzip on' in (nginx_conf_content['content'] | b64decode)"
          - "'ssl_protocols TLSv1.2 TLSv1.3' in (nginx_conf_content['content'] | b64decode)"
        fail_msg: "Nginx configuration missing expected settings"

    - name: Read nginx security configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/conf.d/security.conf
      register: nginx_security_content

    - name: Assert nginx security configuration contains expected headers
      ansible.builtin.assert:
        that:
          - "'X-Frame-Options' in (nginx_security_content['content'] | b64decode)"
          - "'X-Content-Type-Options' in (nginx_security_content['content'] | b64decode)"
          - "'X-XSS-Protection' in (nginx_security_content['content'] | b64decode)"
          - "'Strict-Transport-Security' in (nginx_security_content['content'] | b64decode)"
        fail_msg: "Nginx security configuration missing expected headers"

    - name: Read site configuration content
      ansible.builtin.slurp:
        src: "{{ item_site_config }}"
      loop:
        - /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site_config
      register: site_config_content_results

    - name: Assert site configurations contain SSL and redirect settings
      ansible.builtin.assert:
        that:
          - "'listen 80' in (item_result['content'] | b64decode)"
          - "'listen 443 ssl http2' in (item_result['content'] | b64decode)"
          - "'ssl_certificate /etc/ssl/certs/' in (item_result['content'] | b64decode)"
          - "'ssl_certificate_key /etc/ssl/private/' in (item_result['content'] | b64decode)"
          - "'return 301 https://' in (item_result['content'] | b64decode)"
        fail_msg: "Site configuration missing expected SSL settings"
      loop: "{{ site_config_content_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read fail2ban configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/fail2ban/jail.local
      register: fail2ban_content

    - name: Assert fail2ban configuration contains expected jails
      ansible.builtin.assert:
        that:
          - "'[sshd]' in (fail2ban_content['content'] | b64decode)"
          - "'[nginx-http-auth]' in (fail2ban_content['content'] | b64decode)"
          - "'[nginx-limit-req]' in (fail2ban_content['content'] | b64decode)"
          - "'[nginx-botsearch]' in (fail2ban_content['content'] | b64decode)"
          - "'enabled = true' in (fail2ban_content['content'] | b64decode)"
        fail_msg: "Fail2ban configuration missing expected jails"

    - name: Read sysctl security configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-security.conf
      register: sysctl_content

    - name: Assert sysctl configuration contains security parameters
      ansible.builtin.assert:
        that:
          - "'net.ipv4.conf.default.rp_filter = 1' in (sysctl_content['content'] | b64decode)"
          - "'net.ipv4.conf.all.accept_redirects = 0' in (sysctl_content['content'] | b64decode)"
          - "'net.ipv4.conf.all.send_redirects = 0' in (sysctl_content['content'] | b64decode)"
          - "'net.ipv4.conf.all.log_martians = 1' in (sysctl_content['content'] | b64decode)"
        fail_msg: "Sysctl security configuration missing expected parameters"

    - name: Read SSH configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_config_content

    - name: Assert SSH configuration contains security settings
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (ssh_config_content['content'] | b64decode)"
          - "'PasswordAuthentication no' in (ssh_config_content['content'] | b64decode)"
          - "'Protocol 2' in (ssh_config_content['content'] | b64decode)"
        fail_msg: "SSH configuration missing expected security settings"

# Container-incompatible checks - these would run on real systems but not in molecule container
- name: Verify services (container-incompatible)
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
        fail_msg: "Nginx service not running"
      tags: molecule-notest

    - name: Check fail2ban service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert fail2ban service is running
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
        fail_msg: "Fail2ban service not running"
      tags: molecule-notest

    - name: Check if ports are listening
      ansible.builtin.wait_for:
        port: "{{ item_port }}"
        host: "0.0.0.0"
        timeout: 5
      loop:
        - 80
        - 443
        - 22
      loop_control:
        loop_var: item_port
      tags: molecule-notest

    - name: Test HTTP to HTTPS redirect
      ansible.builtin.uri:
        url: "http://test.cluster.local"
        method: GET
        follow_redirects: none
        status_code: 301
      tags: molecule-notest

    - name: Test HTTPS site accessibility
      ansible.builtin.uri:
        url: "https://{{ item_site }}"
        method: GET
        validate_certs: false
        return_content: true
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site
      register: https_responses
      tags: molecule-notest

    - name: Assert HTTPS responses contain expected content
      ansible.builtin.assert:
        that:
          - "item_response['status'] == 200"
          - "'Environment' in item_response['content']"
        fail_msg: "HTTPS site not responding correctly"
      loop: "{{ https_responses['results'] }}"
      loop_control:
        loop_var: item_response
      tags: molecule-notest