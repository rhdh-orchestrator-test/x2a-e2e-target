---
argument_specs:
  main:
    short_description: Configure Nginx with multiple SSL-enabled sites
    description:
      - Installs and configures Nginx, Fail2ban, UFW, SSL certificates, and security hardening.
    options:
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for site certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for site private keys.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is enabled.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW is enabled.
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
            cert_file: /etc/ssl/certs/test.cluster.local.crt
            key_file: /etc/ssl/private/test.cluster.local.key
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
            cert_file: /etc/ssl/certs/ci.cluster.local.crt
            key_file: /etc/ssl/private/ci.cluster.local.key
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
            cert_file: /etc/ssl/certs/status.cluster.local.crt
            key_file: /etc/ssl/private/status.cluster.local.key
        description: Mapping of site names to document roots and TLS settings.
