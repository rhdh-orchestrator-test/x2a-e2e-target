---
# Unsupported: exact response bodies, complete nginx -T output, detailed Fail2ban
# settings, certificate dates, and unqualified diagnostic grep output.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Collect package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify required packages
      ansible.builtin.assert:
        that: item_package in ansible_facts.packages
        fail_msg: A required package is not installed
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Verify nginx and Fail2ban are enabled and running
      ansible.builtin.assert:
        that:
          - ansible_facts.services[item_service]['status'] == 'enabled'
          - ansible_facts.services[item_service]['state'] == 'running'
        fail_msg: A required service is not enabled and running
      loop:
        - nginx.service
        - fail2ban.service
      loop_control:
        loop_var: item_service

    - name: Verify SSH is running
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts.services['sshd.service'] is defined and
            ansible_facts.services['sshd.service']['state'] == 'running') or
            (ansible_facts.services['ssh.service'] is defined and
            ansible_facts.services['ssh.service']['state'] == 'running')
        fail_msg: SSH is not running

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_test
      changed_when: false

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      register: item_sshd_test
      changed_when: false

    - name: Verify configuration validation succeeded
      ansible.builtin.assert:
        that:
          - item_nginx_test['rc'] == 0
          - item_sshd_test['rc'] == 0
        fail_msg: A configuration validation command failed

    - name: Collect nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      register: item_nginx_dump
      changed_when: false

    - name: Verify named sites and listeners
      ansible.builtin.assert:
        that:
          - item_nginx_dump['stdout'] is search(item_site)
          - item_nginx_dump['stdout'] is search('listen 80')
          - item_nginx_dump['stdout'] is search('listen 443 ssl http2')
        fail_msg: Expected nginx site or listener is absent
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site

    - name: Check required paths
      ansible.builtin.stat:
        path: "{{ item_path }}"
        follow: false
      register: item_paths
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
      loop_control:
        loop_var: item_path

    - name: Verify required paths exist
      ansible.builtin.assert:
        that: item_path_result['stat']['exists']
        fail_msg: An expected path is missing
      loop: "{{ item_paths['results'] }}"
      loop_control:
        loop_var: item_path_result

    - name: Check default site
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_site

    - name: Verify default site is absent
      ansible.builtin.assert:
        that: not item_default_site['stat']['exists']
        fail_msg: The default nginx site exists

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_link['path'] }}"
        follow: false
      register: item_links
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_link

    - name: Verify enabled site links
      ansible.builtin.assert:
        that:
          - item_link_result['stat']['islnk']
          - item_link_result['stat']['lnk_source'] == item_link_result['item']['target']
        fail_msg: An enabled site link is incorrect
      loop: "{{ item_links['results'] }}"
      loop_control:
        loop_var: item_link_result

    - name: Check HTTP and HTTPS behavior
      ansible.builtin.uri:
        url: "{{ item_endpoint['scheme'] }}://127.0.0.1:{{ item_endpoint['port'] }}/"
        headers:
          Host: "{{ item_endpoint['host'] }}"
        validate_certs: false
        return_content: true
        status_code: "{{ item_endpoint['status'] }}"
      register: item_endpoints
      loop:
        - host: test.cluster.local
          scheme: http
          port: 80
          status: 301
        - host: test.cluster.local
          scheme: https
          port: 443
          status: 200
        - host: ci.cluster.local
          scheme: http
          port: 80
          status: 301
        - host: ci.cluster.local
          scheme: https
          port: 443
          status: 200
        - host: status.cluster.local
          scheme: http
          port: 80
          status: 301
        - host: status.cluster.local
          scheme: https
          port: 443
          status: 200
      loop_control:
        loop_var: item_endpoint

    - name: Verify HTTP redirects to HTTPS
      ansible.builtin.assert:
        that:
          - item_endpoint_result['status'] == 301
          - item_endpoint_result['location'] is search('https://')
        fail_msg: HTTP did not redirect to HTTPS
      loop: "{{ item_endpoints['results'] }}"
      when: item_endpoint_result['item']['scheme'] == 'http'
      loop_control:
        loop_var: item_endpoint_result

    - name: Check HTTPS security headers
      ansible.builtin.uri:
        url: "https://127.0.0.1:443/"
        headers:
          Host: "{{ item_header_site }}"
        validate_certs: false
        status_code: 200
      register: item_headers
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_header_site

    - name: Verify security headers
      ansible.builtin.assert:
        that:
          - item_header_result['headers'] | lower is search('strict-transport-security')
          - item_header_result['headers'] | lower is search('x-frame-options')
          - item_header_result['headers'] | lower is search('x-content-type-options')
          - item_header_result['headers'] | lower is search('content-security-policy')
        fail_msg: An expected security header is missing
      loop: "{{ item_headers['results'] }}"
      loop_control:
        loop_var: item_header_result

    - name: Check certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
          - -issuer
          - -dates
      register: item_certificates
      changed_when: false
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          name: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          name: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          name: status.cluster.local
      loop_control:
        loop_var: item_certificate

    - name: Verify certificate subjects
      ansible.builtin.assert:
        that:
          - item_certificate_result['rc'] == 0
          - item_certificate_result['stdout'] is search(item_certificate_result['item']['name'])
        fail_msg: A certificate is invalid or has the wrong subject
      loop: "{{ item_certificates['results'] }}"
      loop_control:
        loop_var: item_certificate_result

    - name: Check private-key metadata
      ansible.builtin.stat:
        path: "{{ item_key }}"
      register: item_keys
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key

    - name: Verify private-key metadata
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['pw_name'] == 'root'
          - item_key_result['stat']['gr_name'] == 'ssl-cert'
          - item_key_result['stat']['mode'] == '0640'
        fail_msg: A private key has incorrect metadata
      loop: "{{ item_keys['results'] }}"
      loop_control:
        loop_var: item_key_result

    - name: Check expected Fail2ban jails
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
          - "{{ item_jail }}"
      register: item_jails
      changed_when: false
      loop:
        - sshd
        - nginx-http-auth
        - nginx-limit-req
        - nginx-botsearch
      loop_control:
        loop_var: item_jail

    - name: Verify expected Fail2ban jails
      ansible.builtin.assert:
        that: item_jail_result['rc'] == 0
        fail_msg: An expected Fail2ban jail is unavailable
      loop: "{{ item_jails['results'] }}"
      loop_control:
        loop_var: item_jail_result

    - name: Check UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: item_ufw
      changed_when: false

    - name: Verify UFW policy and ports
      ansible.builtin.assert:
        that:
          - item_ufw['stdout'] is search('Status: active')
          - item_ufw['stdout'] is search('Default: deny (incoming)')
          - item_ufw['stdout'] is search('22/tcp')
          - item_ufw['stdout'] is search('80/tcp')
          - item_ufw['stdout'] is search('443/tcp')
        fail_msg: UFW is not configured as expected

    - name: Read SSH configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_ssh_config

    - name: Verify SSH hardening
      ansible.builtin.assert:
        that:
          - item_ssh_config['content'] | b64decode is search('PermitRootLogin no')
          - item_ssh_config['content'] | b64decode is search('PasswordAuthentication no')
        fail_msg: SSH hardening settings are absent
