- name: Converge
  hosts: all
  gather_facts: false
  tasks:
  - name: Create required directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/keys
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create kernel parameter files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/vm/{{ item.key }}
      mode: '0644'
    loop: '{{ chef_automate_sysctl_params | dict2items }}'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK USER KEY CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/keys/{{ chef_automate_username }}.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK ORG VALIDATOR KEY CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/keys/{{ chef_automate_orgname }}-validator.pem
      mode: '0600'
  - name: Create Chef server user list file
    ansible.builtin.copy:
      content: '{{ chef_automate_username }} pivotal '
      dest: /tmp/molecule_test/chef-server-user-list
      mode: '0644'
  - name: Create Chef server organization list file
    ansible.builtin.copy:
      content: '{{ chef_automate_orgname }} '
      dest: /tmp/molecule_test/chef-server-org-list
      mode: '0644'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: "Service: automate-gateway\n  Status: running\nService: automate-postgresql\n  Status: running\nService: chef-server\n  Status: running\nService: elasticsearch\n
        \ Status: running\n"
      dest: /tmp/molecule_test/chef-automate-status
      mode: '0644'
  - name: Create Chef Server status file
    ansible.builtin.copy:
      content: 'run: chef-server: (pid 12345) 12345s; run: log: (pid 12346) 12346s

        run: chef-solr: (pid 12347) 12347s; run: log: (pid 12348) 12348s

        run: postgresql: (pid 12349) 12349s; run: log: (pid 12350) 12350s

        '
      dest: /tmp/molecule_test/chef-server-status
      mode: '0644'
  - name: Create web UI response file
    ansible.builtin.copy:
      content: <html><body>Chef Automate</body></html>
      dest: /tmp/molecule_test/chef-automate-web-response
      mode: '0644'
  - name: Create network listening ports file
    ansible.builtin.copy:
      content: tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/nginx
      dest: /tmp/molecule_test/network-ports
      mode: '0644'
