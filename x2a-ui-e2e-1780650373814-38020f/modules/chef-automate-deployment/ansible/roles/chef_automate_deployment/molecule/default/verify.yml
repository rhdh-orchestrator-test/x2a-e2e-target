---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Verify hostname configuration
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Verify hostname content
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == chef_automate_hostname
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Verify kernel parameters
    - name: Check kernel parameter files exist
      ansible.builtin.stat:
        path: "/tmp/molecule_test/proc/sys/vm/{{ item.key }}"
      register: kernel_param_files
      loop: "{{ chef_automate_sysctl_params | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Assert kernel parameter files were created
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Kernel parameter file {{ item.item.key }} not found"
        success_msg: "Kernel parameter file {{ item.item.key }} exists"
      loop: "{{ kernel_param_files.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Get kernel parameter content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/proc/sys/vm/{{ item.key }}"
      register: kernel_param_content
      loop: "{{ chef_automate_sysctl_params | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: kernel_param_files.results | selectattr('stat.exists', 'equalto', true) | list | length > 0

    - name: Verify kernel parameter content
      ansible.builtin.assert:
        that:
          - (item.content | b64decode | trim) == (item.item.value | string)
        fail_msg: "Kernel parameter {{ item.item.key }} not set correctly"
        success_msg: "Kernel parameter {{ item.item.key }} set correctly"
      loop: "{{ kernel_param_content.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: kernel_param_content.results | length > 0

    # Verify Chef Automate CLI
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI was created
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Verify Chef Automate deployment
    - name: Check Chef Automate deployment marker exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: chef_automate_deployment

    - name: Assert Chef Automate was deployed
      ansible.builtin.assert:
        that:
          - chef_automate_deployment.stat.exists
          - chef_automate_deployment.stat.isdir
        fail_msg: "Chef Automate deployment marker not found"
        success_msg: "Chef Automate deployment marker exists"

    # Verify user and organization key files
    - name: Check user key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/keys/{{ chef_automate_username }}.pem"
      register: user_key_file

    - name: Assert user key file was created
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.isreg
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/keys/{{ chef_automate_orgname }}-validator.pem"
      register: org_key_file

    - name: Assert organization validator key file was created
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.isreg
        fail_msg: "Organization validator key file not found"
        success_msg: "Organization validator key file exists"

    # The following checks would normally run on a real system but can't run in a container
    # They are tagged with molecule-notest so they're skipped during molecule testing

    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: chef_automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - "'Status: running' in chef_automate_status.stdout"
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Server is running
      ansible.builtin.assert:
        that:
          - "'run: chef-server' in chef_server_status.stdout"
        fail_msg: "Chef Server is not running"
        success_msg: "Chef Server is running"
      tags: molecule-notest

    - name: Check user exists
      ansible.builtin.command:
        cmd: "sudo chef-server-ctl user-list"
      register: user_list
      changed_when: false
      tags: molecule-notest

    - name: Assert user was created
      ansible.builtin.assert:
        that:
          - chef_automate_username in user_list.stdout
        fail_msg: "User {{ chef_automate_username }} not found"
        success_msg: "User {{ chef_automate_username }} exists"
      tags: molecule-notest

    - name: Check organization exists
      ansible.builtin.command:
        cmd: "sudo chef-server-ctl org-list"
      register: org_list
      changed_when: false
      tags: molecule-notest

    - name: Assert organization was created
      ansible.builtin.assert:
        that:
          - chef_automate_orgname in org_list.stdout
        fail_msg: "Organization {{ chef_automate_orgname }} not found"
        success_msg: "Organization {{ chef_automate_orgname }} exists"
      tags: molecule-notest

    - name: Check web UI access
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
        return_content: true
      register: web_ui
      tags: molecule-notest

    - name: Assert web UI is accessible
      ansible.builtin.assert:
        that:
          - web_ui.status == 200
          - "'Chef' in web_ui.content"
        fail_msg: "Web UI is not accessible"
        success_msg: "Web UI is accessible"
      tags: molecule-notest

    - name: Check network listening
      ansible.builtin.command:
        cmd: ss -tlnp | grep 443
      register: network_listening
      changed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - network_listening.rc == 0
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest