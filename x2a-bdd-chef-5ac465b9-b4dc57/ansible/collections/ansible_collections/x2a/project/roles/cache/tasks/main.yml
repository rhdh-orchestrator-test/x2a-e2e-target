---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml

- name: Configure Redis with the Private Hub role
  ansible.builtin.include_role:
    name: eloy.redis.redis # noqa: L038 - role is provided by the eloy.redis collection declared in requirements.yml
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is from role defaults
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Remove obsolete replication directives from Redis configuration
  ansible.builtin.replace:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is from role defaults
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$
    replace: ""
  notify: Restart Redis
  no_log: "{{ cache_secure_logging }}"

- name: Ensure Redis service is enabled and started
  ansible.builtin.service:
    name: "{{ cache_redis_service_name }}" # noqa: R114 - service name is from role defaults
    enabled: true
    state: started
