---
- name: Install Memcached package
  ansible.builtin.package:
    name: memcached
    state: present

- name: Create Memcached service user
  ansible.builtin.user:
    name: "{{ cache_memcached_service_user }}"
    system: true
    state: present

- name: Configure Memcached service options
  ansible.builtin.template:
    src: memcached.conf.j2
    dest: /etc/memcached.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart Memcached

- name: Ensure Memcached service is enabled and started
  ansible.builtin.service:
    name: "{{ cache_memcached_service_name }}" # noqa: R114 - service name is from role defaults
    enabled: true
    state: started
