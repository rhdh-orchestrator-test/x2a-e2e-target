---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Load operating system package variables
  ansible.builtin.set_fact:
    fastapi_tutorial_packages: >-
      {{ ['python3', 'python3-pip', 'git', 'postgresql-server', 'postgresql-contrib', 'libpq-devel', 'systemd']
        if ansible_facts['os_family'] in ['RedHat', 'Fedora'] else
        ['python3', 'python3-pip', 'python3-venv', 'git', 'postgresql', 'postgresql-contrib', 'libpq-dev', 'systemd'] }}

- name: Run FastAPI tutorial tasks
  ansible.builtin.include_tasks: default.yml
