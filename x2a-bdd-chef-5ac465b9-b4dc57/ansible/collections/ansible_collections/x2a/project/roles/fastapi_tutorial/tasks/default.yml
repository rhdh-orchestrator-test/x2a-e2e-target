---
- name: Install required packages  # noqa: R113 - package list is constructed from trusted role OS-family mappings
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_packages }}"  # noqa: R113 - package list is constructed from trusted role OS-family mappings
    state: present

- name: Initialize PostgreSQL on RedHat-family systems
  ansible.builtin.command:
    argv:
      - postgresql-setup
      - --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository  # noqa: R104 - repository URL is the trusted HTTPS role default
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"  # noqa: R106 - repository source is the trusted role default
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is a role default, not user input
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment
  ansible.builtin.command:  # noqa: R101 - command arguments come from trusted role defaults
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_app_path }}/venv"
    creates: "{{ fastapi_tutorial_app_path }}/venv" # noqa: R114 - path is a role default, not user input

- name: Install application dependencies  # noqa: R113 - virtualenv dependency installation uses the trusted role application path
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_app_path }}/venv"
    state: present

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the PostgreSQL role exists  # noqa: L039 - credential variable is validated by the preceding task
  ansible.builtin.command:  # noqa: R101 - SQL command uses validated credential input
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}';
  changed_when: false
  register: fastapi_tutorial_role_check
  become: true  # noqa: R108 - PostgreSQL role check must run as the postgres system user
  become_user: postgres

- name: Create the PostgreSQL application role  # noqa: L039 - credential variables are validated by the preceding task and the check result is registered above
  ansible.builtin.command:  # noqa: R101 - SQL command uses validated credential input; noqa: no-changed-when - command is conditionally run only when the role is absent
    argv:
      - psql
      - -c
      - CREATE USER {{ db_username }} WITH PASSWORD '{{ db_password }}';
  when: fastapi_tutorial_role_check.stdout | trim != '1'
  become: true  # noqa: R108 - PostgreSQL role creation must run as the postgres system user
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the application database exists  # noqa: L039 - credential variable is validated by the preceding task
  ansible.builtin.command:  # noqa: R101 - SQL command uses validated credential input
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}';
  changed_when: false
  register: fastapi_tutorial_database_check
  become: true  # noqa: R108 - PostgreSQL database check must run as the postgres system user
  become_user: postgres

- name: Create the application database  # noqa: L039 - credential variables are validated by the preceding task and the check result is registered above
  ansible.builtin.command:  # noqa: R101 - SQL command uses validated credential input; noqa: no-changed-when - command is conditionally run only when the database is absent
    argv:
      - psql
      - -c
      - CREATE DATABASE {{ database_name }} OWNER {{ db_username }};
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  become: true  # noqa: R108 - PostgreSQL database creation must run as the postgres system user
  become_user: postgres

- name: Grant database privileges to the application role  # noqa: L039 - credential variables are validated by the preceding task
  ansible.builtin.command:  # noqa: R101 - SQL command uses validated credential input
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ db_username }};
  changed_when: false
  become: true  # noqa: R108 - PostgreSQL privilege grant must run as the postgres system user
  become_user: postgres

- name: Write application environment configuration  # noqa: L039 - credential variables are validated by the preceding task
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - path is a role default, not user input
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}/{{ database_name }}
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_app_path }}/venv/bin"
      ExecStart={{ fastapi_tutorial_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before starting FastAPI
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
