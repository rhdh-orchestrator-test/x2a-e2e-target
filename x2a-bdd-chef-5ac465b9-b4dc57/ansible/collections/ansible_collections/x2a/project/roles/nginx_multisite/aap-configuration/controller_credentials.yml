---
controller_credentials:
  - name: Nginx Site Token - nginx_multisite
    description: Secret token written to /etc/nginx/secrets/site_token; the source plan does not confirm whether it comes from a Chef data bag, Chef Vault, 
      encrypted attributes, or another secret provider.
    organization: Default
    credential_type: Nginx Site Token
    update_secrets: true
    inputs:
      site_token: "{{ vault_site_token }}"
  - name: Nginx TLS Private Keys - nginx_multisite
    description: TLS private keys generated locally for SSL-enabled Nginx sites. The plan identifies these as generated credentials rather than credentials 
      retrieved from a confirmed external provider.
    organization: Default
    credential_type: Nginx TLS Private Keys
    update_secrets: true
    inputs:
      tls_private_key: "{{ vault_tls_private_key }}"
