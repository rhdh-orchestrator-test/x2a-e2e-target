---
argument_specs:
  main:
    short_description: Install and configure a hardened Nginx multisite server.
    description:
      - Installs Nginx and security services, configures host hardening, and deploys virtual sites.
      - Site definitions are supplied through the nginx_sites role parameter.
    options:
      nginx_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for site TLS certificates.
      nginx_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for site TLS private keys.
      security_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban security configuration is enabled.
      security_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      security_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      security_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_sites:
        type: dict
        required: false
        default: {}
        description: Mapping of site names to document roots and SSL settings.
      site_token:
        type: str
        required: false
        default: ""
        description: Site token injected by an AAP credential type.
      tls_private_key:
        type: str
        required: false
        default: ""
        description: TLS private key injected by an AAP credential type.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output when handling credential values.
