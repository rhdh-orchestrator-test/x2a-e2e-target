---
- name: Install Fail2ban package
  ansible.builtin.package:
    name: fail2ban
    state: present
  when: security_fail2ban_enabled | bool

- name: Install UFW package
  ansible.builtin.package:
    name: ufw
    state: present
  when: security_ufw_enabled | bool

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: security_fail2ban_enabled | bool

- name: Render Fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: security_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Read UFW status
  ansible.builtin.command:
    cmd: ufw status verbose
  changed_when: false
  register: nginx_multisite_ufw_status
  when: security_ufw_enabled | bool

- name: Set UFW default incoming policy # noqa: L039 - registered by prior task when UFW is enabled
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  when:
    - security_ufw_enabled
    - "'Default: deny' not in nginx_multisite_ufw_status.stdout"

- name: Allow SSH through UFW # noqa: L039 - registered by prior task when UFW is enabled
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - ssh
  when:
    - security_ufw_enabled
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTP through UFW # noqa: L039 - registered by prior task when UFW is enabled
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - http
  when:
    - security_ufw_enabled
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTPS through UFW # noqa: L039 - registered by prior task when UFW is enabled
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - https
  when:
    - security_ufw_enabled
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Enable UFW # noqa: L039 - registered by prior task when UFW is enabled
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - enable
  when:
    - security_ufw_enabled
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"

- name: Render sysctl security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx multisite sysctl

- name: Check SSH daemon configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable SSH root login # noqa: L039 - registered by prior task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    state: present
    create: false
    backup: true
  when:
    - security_ssh_disable_root
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd

- name: Disable SSH password authentication # noqa: L039 - registered by prior task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    state: present
    create: false
    backup: true
  when:
    - not security_ssh_password_auth
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd
