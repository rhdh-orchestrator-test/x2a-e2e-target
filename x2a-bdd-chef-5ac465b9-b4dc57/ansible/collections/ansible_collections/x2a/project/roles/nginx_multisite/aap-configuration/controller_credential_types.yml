---
controller_credential_types:
  - name: Nginx Site Token
    description: Secret token written to /etc/nginx/secrets/site_token; the source plan does not confirm whether it comes from a Chef data bag, Chef Vault, 
      encrypted attributes, or another secret provider.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Nginx Site Token
          secret: true
          help_text: Secret token used by the Nginx multisite deployment and stored with root-only permissions.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
  - name: Nginx TLS Private Keys
    description: TLS private keys generated locally for SSL-enabled Nginx sites. The plan identifies these as generated credentials rather than credentials 
      retrieved from a confirmed external provider.
    kind: cloud
    inputs:
      fields:
        - id: tls_private_key
          type: string
          label: TLS Private Key
          secret: true
          help_text: Private RSA key for an SSL-enabled Nginx site; deploy with restrictive permissions.
      required:
        - tls_private_key
    injectors:
      extra_vars:
        tls_private_key: !unsafe "{{ tls_private_key }}"
