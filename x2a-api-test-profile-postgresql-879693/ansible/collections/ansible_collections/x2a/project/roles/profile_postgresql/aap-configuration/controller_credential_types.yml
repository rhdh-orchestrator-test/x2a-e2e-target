---
controller_credential_types:
  - name: PostgreSQL Application Database
    description: Credentials and connection settings for the application database initialized by the PostgreSQL profile.
    kind: cloud
    inputs:
      fields:
        - id: app_db_host
          type: string
          label: Database Host
          help_text: Hostname or address of the application PostgreSQL database.
        - id: app_db_port
          type: string
          label: Database Port
          help_text: TCP port used to connect to the application PostgreSQL database.
        - id: app_db_name
          type: string
          label: Database Name
          help_text: Name of the application database to create and use.
        - id: app_db_user
          type: string
          label: Database Username
          help_text: Database user used by the application and database initialization tasks.
        - id: app_db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the application PostgreSQL database user.
      required:
        - app_db_host
        - app_db_port
        - app_db_name
        - app_db_user
        - app_db_password
    injectors:
      extra_vars:
        app_db_host: !unsafe "{{ app_db_host }}"
        app_db_port: !unsafe "{{ app_db_port }}"
        app_db_name: !unsafe "{{ app_db_name }}"
        app_db_user: !unsafe "{{ app_db_user }}"
        app_db_password: !unsafe "{{ app_db_password }}"
  - name: Application Secret Key
    description: Secret key used by the surrounding application stack and rendered into the application environment.
    kind: cloud
    inputs:
      fields:
        - id: app_secret_key
          type: string
          label: Application Secret Key
          secret: true
          help_text: Sensitive application key used for application security functions such as signing or encryption.
      required:
        - app_secret_key
    injectors:
      extra_vars:
        app_secret_key: !unsafe "{{ app_secret_key }}"
