---
controller_credentials:
  - name: PostgreSQL Application Database - profile_postgresql
    description: Credentials and connection settings for the application database initialized by the PostgreSQL profile.
    organization: Default
    credential_type: PostgreSQL Application Database
    update_secrets: true
    inputs:
      app_db_host: "{{ app_db_host }}"
      app_db_port: "{{ app_db_port }}"
      app_db_name: "{{ app_db_name }}"
      app_db_user: "{{ app_db_user }}"
      app_db_password: "{{ vault_app_db_password }}"
  - name: Application Secret Key - profile_postgresql
    description: Secret key used by the surrounding application stack and rendered into the application environment.
    organization: Default
    credential_type: Application Secret Key
    update_secrets: true
    inputs:
      app_secret_key: "{{ vault_app_secret_key }}"
