- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Set Redis variables
    ansible.builtin.set_fact:
      redis_port: 6379
      redis_bind_address: 127.0.0.1
      redis_service_name: redis-server
      redis_package_name: redis-server
  - name: Create expected Redis directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/run/redis
  - name: Create mock Redis configuration file
    ansible.builtin.copy:
      content: '# Redis configuration file example

        port {{ redis_port }}

        bind {{ redis_bind_address }}

        daemonize yes

        logfile /var/log/redis/{{ redis_service_name }}.log

        dir /var/lib/redis

        pidfile /var/run/redis/{{ redis_service_name }}.pid

        '
      dest: /tmp/molecule_test/etc/redis/redis.conf
      mode: '0644'
  - name: Create mock Redis log file
    ansible.builtin.copy:
      content: '# Redis server log

        1:M 01 Jan 2023 00:00:00.000 # Server initialized

        1:M 01 Jan 2023 00:00:00.000 * Ready to accept connections

        '
      dest: /tmp/molecule_test/var/log/redis/{{ redis_service_name }}.log
      mode: '0644'
  - name: Create mock Redis socket file
    ansible.builtin.file:
      path: /tmp/molecule_test/var/run/redis/{{ redis_service_name }}.sock
      state: touch
      mode: '0644'
  - name: Create mock Redis data file
    ansible.builtin.file:
      path: /tmp/molecule_test/var/lib/redis/dump.rdb
      state: touch
      mode: '0644'
