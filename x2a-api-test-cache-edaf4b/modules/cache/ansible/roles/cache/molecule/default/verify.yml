---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check that services are running
      ansible.builtin.service_facts:

    - name: Assert memcached service is active
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - "ansible_facts.services['memcached.service']['state'] == 'running'"
        fail_msg: "Memcached service is not running"

    - name: Assert redis-server service is active
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
        fail_msg: "Redis server service is not running"

    - name: Check Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_stat

    - name: Assert Redis configuration file was created
      ansible.builtin.assert:
        that:
          - redis_config_stat['stat']['exists']
          - redis_config_stat['stat']['size'] > 0
        fail_msg: "Redis configuration file not found or empty"

    - name: Check Redis log directory exists
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory was created with correct permissions
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['exists']
          - redis_log_dir_stat['stat']['isdir']
          - redis_log_dir_stat['stat']['pw_name'] == 'redis'
          - redis_log_dir_stat['stat']['gr_name'] == 'redis'
          - redis_log_dir_stat['stat']['mode'] == '0755'
        fail_msg: "Redis log directory not found or incorrect permissions"

    - name: Check Redis configuration content
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis password authentication is configured
      ansible.builtin.assert:
        that:
          - "'requirepass' in (redis_config_content['content'] | b64decode)"
        fail_msg: "Redis password authentication not configured"

    - name: Assert Redis cleanup patterns were removed
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in (redis_config_content['content'] | b64decode)"
          - "'replica-read-only' not in (redis_config_content['content'] | b64decode)"
          - "'repl-ping-replica-period' not in (redis_config_content['content'] | b64decode)"
          - "'client-output-buffer-limit' not in (redis_config_content['content'] | b64decode)"
          - "'replica-priority' not in (redis_config_content['content'] | b64decode)"
        fail_msg: "Redis configuration cleanup patterns not removed"

    - name: Test memcached connectivity
      ansible.builtin.wait_for:
        port: 11211
        host: localhost
        timeout: 10

    - name: Test Redis connectivity
      ansible.builtin.wait_for:
        port: 6379
        host: localhost
        timeout: 10

    - name: Test Redis authentication (ping without password should fail)
      ansible.builtin.command:
        cmd: redis-cli -p 6379 ping
      register: redis_ping_no_auth
      failed_when: false
      changed_when: false

    - name: Assert Redis requires authentication
      ansible.builtin.assert:
        that:
          - redis_ping_no_auth['rc'] != 0
        fail_msg: "Redis should require authentication but ping succeeded without password"

    - name: Test Redis authentication with correct password
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 ping
      register: redis_ping_with_auth
      changed_when: false

    - name: Assert Redis authentication works with correct password
      ansible.builtin.assert:
        that:
          - redis_ping_with_auth['rc'] == 0
          - "'PONG' in redis_ping_with_auth['stdout']"
        fail_msg: "Redis authentication failed with correct password"

    - name: Test Redis set/get operations
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 set test_key test_value
      register: redis_set_result
      changed_when: false

    - name: Test Redis get operation
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 get test_key
      register: redis_get_result
      changed_when: false

    - name: Assert Redis operations work correctly
      ansible.builtin.assert:
        that:
          - redis_set_result['rc'] == 0
          - redis_get_result['rc'] == 0
          - "'test_value' in redis_get_result['stdout']"
        fail_msg: "Redis set/get operations failed"

    - name: Clean up Redis test key
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 del test_key
      changed_when: false

    - name: Test memcached basic operations
      ansible.builtin.shell: |
        echo -e "set test_key 0 60 10\r\ntest_value\r\nget test_key\r\nquit\r" | nc localhost 11211
      register: memcached_test_result
      changed_when: false

    - name: Assert memcached operations work correctly
      ansible.builtin.assert:
        that:
          - memcached_test_result['rc'] == 0
          - "'STORED' in memcached_test_result['stdout']"
          - "'test_value' in memcached_test_result['stdout']"
        fail_msg: "Memcached operations failed"