---
argument_specs:
  main:
    short_description: Install and configure memcached and Redis caching services
    description:
      - Installs and configures memcached and Redis server with authentication
      - Sets up Redis with password authentication and proper logging
      - Configures both services to start automatically
      - Cleans up Redis configuration to remove unwanted replica settings
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for Redis server to listen on
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory for Redis log files
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to Redis configuration file
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: System user for Redis service
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: System group for Redis service
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: TCP port for memcached service to listen on
      cache_redis_cleanup_patterns:
        type: list
        elements: str
        required: false
        default:
          - ^replica-serve-stale-data.*$
          - ^replica-read-only.*$
          - ^repl-ping-replica-period.*$
          - ^client-output-buffer-limit.*$
          - ^replica-priority.*$
        description: Regular expression patterns for Redis config lines to remove
      redis_password:
        type: str
        required: true
        description: Redis authentication password (injected by AAP credential type)
