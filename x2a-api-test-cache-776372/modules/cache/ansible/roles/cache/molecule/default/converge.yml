---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories for Redis
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file for port 6379
          # Generated by Ansible
          
          # Network
          bind 127.0.0.1
          port 6379
          timeout 0
          tcp-keepalive 60
          
          # General
          daemonize yes
          supervised systemd
          pidfile /var/run/redis/redis-server.pid
          loglevel notice
          logfile /var/log/redis/redis_6379.log
          
          # Snapshotting
          save 900 1
          save 300 10
          save 60 10000
          stop-writes-on-bgsave-error yes
          rdbcompression yes
          rdbchecksum yes
          dbfilename dump.rdb
          dir /var/lib/redis
          
          # Security
          requirepass redis_secure_password_123
          
          # Clients
          maxclients 10000
          
          # Memory Management
          maxmemory-policy noeviction
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create Redis log file
      ansible.builtin.copy:
        content: |
          # Redis log file placeholder
          # This would contain Redis server logs
        dest: /tmp/molecule_test/var/log/redis/redis_6379.log
        mode: "0644"
        backup: true

    - name: Create Redis data directory structure
      ansible.builtin.file:
        path: "{{ item_data_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/var/lib/redis
      loop_control:
        loop_var: item_data_dir

    - name: Create Redis PID file placeholder
      ansible.builtin.copy:
        content: "12345"
        dest: /tmp/molecule_test/var/run/redis/redis-server.pid
        mode: "0644"
        backup: true

    - name: Create memcached configuration placeholder (if enabled)
      ansible.builtin.copy:
        content: |
          # Memcached configuration placeholder
          # This would contain memcached settings
          -p 11211
          -U 11211
          -u memcache
          -m 64
          -c 1024
        dest: /tmp/molecule_test/etc/memcached.conf
        mode: "0644"
        backup: true