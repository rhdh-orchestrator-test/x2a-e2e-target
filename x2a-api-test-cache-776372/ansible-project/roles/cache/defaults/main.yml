---
cache_redis_port: 6379
cache_redis_password: "{{ redis_password }}"
cache_redis_user: redis
cache_redis_group: redis
cache_redis_log_dir: /var/log/redis
cache_redis_config_file: /etc/redis/{{ cache_redis_port }}.conf
cache_memcached_enabled: true
cache_redis_packages:
  - redis-server
cache_memcached_packages:
  - memcached
cache_redis_service: redis-server
cache_memcached_service: memcached
