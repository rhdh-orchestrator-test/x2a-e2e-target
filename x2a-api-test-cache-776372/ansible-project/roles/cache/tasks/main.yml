---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install Redis packages
  ansible.builtin.package:
    name: "{{ cache_redis_packages }}"
    state: present
- name: Install Memcached packages
  ansible.builtin.package:
    name: "{{ cache_memcached_packages }}"
    state: present
  when: cache_memcached_enabled
- name: Create Redis group
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    system: true
    state: present
- name: Create Redis user
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present
- name: Create Redis configuration directory
  ansible.builtin.file:
    path: /etc/redis
    owner: root
    group: root
    mode: "0755"
    state: directory
- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}"
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory
- name: Create Redis data directory
  ansible.builtin.file:
    path: /var/lib/redis
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory
- name: Create Redis run directory
  ansible.builtin.file:
    path: /var/run/redis
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory
- name: Deploy Redis configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}"
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0640"
    backup: true
  notify: Restart Redis
- name: Start and enable Redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    state: started
    enabled: true
- name: Start and enable Memcached service
  ansible.builtin.service:
    name: "{{ cache_memcached_service }}"
    state: started
    enabled: true
  when: cache_memcached_enabled
