---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/redis/6379.conf
        - /tmp/molecule_test/var/log/redis/redis_6379.log
        - /tmp/molecule_test/var/run/redis/redis-server.pid
      loop_control:
        loop_var: item_config
      register: redis_config_stat_results

    - name: Assert Redis configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected Redis configuration file not found"
      loop: "{{ redis_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check Redis directories exist
      ansible.builtin.stat:
        path: "{{ item_dir }}"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir
      register: redis_dir_stat_results

    - name: Assert Redis directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected Redis directory not found"
      loop: "{{ redis_dir_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read Redis configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis configuration contains required settings
      ansible.builtin.assert:
        that:
          - "'port 6379' in redis_config_decoded"
          - "'requirepass redis_secure_password_123' in redis_config_decoded"
          - "'bind 127.0.0.1' in redis_config_decoded"
          - "'logfile /var/log/redis/redis_6379.log' in redis_config_decoded"
          - "'dir /var/lib/redis' in redis_config_decoded"
        fail_msg: "Redis configuration missing required settings"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

    - name: Assert Redis configuration excludes cleaned-up settings
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in redis_config_decoded"
          - "'replica-read-only' not in redis_config_decoded"
          - "'repl-ping-replica-period' not in redis_config_decoded"
          - "'replica-priority' not in redis_config_decoded"
        fail_msg: "Redis configuration contains settings that should be cleaned up"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

    - name: Check memcached configuration exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/memcached.conf
      register: memcached_config_stat

    - name: Assert memcached configuration was created
      ansible.builtin.assert:
        that:
          - memcached_config_stat['stat']['exists']
          - memcached_config_stat['stat']['size'] > 0
        fail_msg: "Expected memcached configuration file not found"

    - name: Read memcached configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/memcached.conf
      register: memcached_config_content

    - name: Assert memcached configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'-p 11211' in memcached_config_decoded"
          - "'-U 11211' in memcached_config_decoded"
        fail_msg: "Memcached configuration missing expected settings"
      vars:
        memcached_config_decoded: "{{ memcached_config_content['content'] | b64decode }}"

- name: Verify Services (Container-unsafe checks)
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Redis service is active
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
        fail_msg: "Redis service not found"
      tags: molecule-notest

    - name: Check memcached service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert memcached service is active
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
        fail_msg: "Memcached service not found"
      tags: molecule-notest

    - name: Check Redis port connectivity
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 5
      tags: molecule-notest

    - name: Check memcached port connectivity
      ansible.builtin.wait_for:
        port: 11211
        host: 127.0.0.1
        timeout: 5
      tags: molecule-notest

    - name: Test Redis authentication
      ansible.builtin.uri:
        url: "redis://redis_secure_password_123@127.0.0.1:6379"
        method: GET
      tags: molecule-notest

    - name: Test memcached connectivity
      ansible.builtin.uri:
        url: "http://127.0.0.1:11211"
        method: GET
      tags: molecule-notest