---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Verify hostname configuration
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is correctly set
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Verify sysctl parameters
    - name: Check sysctl parameter files exist
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/{{ item.key | replace('.', '_') }}.conf"
      register: sysctl_files
      loop:
        - key: vm.max_map_count
          value: 262144
        - key: vm.dirty_expire_centisecs
          value: 20000
      loop_control:
        label: "{{ item.key }}"

    - name: Assert sysctl parameter files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Sysctl parameter file {{ item.item.key }} not found"
        success_msg: "Sysctl parameter file {{ item.item.key }} exists"
      loop: "{{ sysctl_files.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Get sysctl parameter file contents
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/{{ item.item.key | replace('.', '_') }}.conf"
      register: sysctl_contents
      loop: "{{ sysctl_files.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: item.stat.exists

    - name: Assert sysctl parameters are correctly set
      ansible.builtin.assert:
        that:
          - (item.content | b64decode | trim) == (item.item.key + ' = ' + item.item.value | string)
        fail_msg: "Sysctl parameter {{ item.item.key }} not set correctly"
        success_msg: "Sysctl parameter {{ item.item.key }} set correctly"
      loop: "{{ sysctl_contents.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: item.content is defined

    # Verify Chef Automate CLI
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Verify Chef Automate deployment
    - name: Check Chef Automate deployment status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/opt/chef-automate/deployment-status.txt
      register: deployment_status_file

    - name: Assert Chef Automate deployment status file exists
      ansible.builtin.assert:
        that:
          - deployment_status_file.stat.exists
          - deployment_status_file.stat.isreg
        fail_msg: "Chef Automate deployment status file not found"
        success_msg: "Chef Automate deployment status file exists"

    # Verify Chef user key file
    - name: Check Chef user key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_key_file

    - name: Assert Chef user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.isreg
          - user_key_file.stat.mode == '0600'
        fail_msg: "Chef user key file not found or has incorrect permissions"
        success_msg: "Chef user key file exists with correct permissions"

    # Verify Chef organization validator key file
    - name: Check Chef organization validator key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_validator_key_file

    - name: Assert Chef organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_validator_key_file.stat.exists
          - org_validator_key_file.stat.isreg
          - org_validator_key_file.stat.mode == '0600'
        fail_msg: "Chef organization validator key file not found or has incorrect permissions"
        success_msg: "Chef organization validator key file exists with correct permissions"

    # Verify Chef server status files
    - name: Check Chef server status files exist
      ansible.builtin.stat:
        path: "/tmp/molecule_test/var/opt/chef-server/{{ item }}-status.txt"
      register: server_status_files
      loop:
        - nginx
        - postgresql
        - bookshelf
        - oc_bifrost
        - oc_id
        - opscode-erchef
        - opscode-solr4

    - name: Assert Chef server status files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Chef server status file for {{ item.item }} not found"
        success_msg: "Chef server status file for {{ item.item }} exists"
      loop: "{{ server_status_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Verify Chef user and organization list files
    - name: Check Chef user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server/user-list.txt
      register: user_list_file

    - name: Assert Chef user list file exists
      ansible.builtin.assert:
        that:
          - user_list_file.stat.exists
          - user_list_file.stat.isreg
        fail_msg: "Chef user list file not found"
        success_msg: "Chef user list file exists"

    - name: Get Chef user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef-server/user-list.txt
      register: user_list_content
      when: user_list_file.stat.exists

    - name: Assert Chef user list contains expected user
      ansible.builtin.assert:
        that:
          - (user_list_content.content | b64decode | trim) == 'jtonello'
        fail_msg: "Chef user list does not contain expected user"
        success_msg: "Chef user list contains expected user"
      when: user_list_file.stat.exists

    - name: Check Chef organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server/org-list.txt
      register: org_list_file

    - name: Assert Chef organization list file exists
      ansible.builtin.assert:
        that:
          - org_list_file.stat.exists
          - org_list_file.stat.isreg
        fail_msg: "Chef organization list file not found"
        success_msg: "Chef organization list file exists"

    - name: Get Chef organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef-server/org-list.txt
      register: org_list_content
      when: org_list_file.stat.exists

    - name: Assert Chef organization list contains expected organization
      ansible.builtin.assert:
        that:
          - (org_list_content.content | b64decode | trim) == 'lab'
        fail_msg: "Chef organization list does not contain expected organization"
        success_msg: "Chef organization list contains expected organization"
      when: org_list_file.stat.exists

    # The following checks would be performed on a real system but can't be run in a container
    # They are tagged with molecule-notest to be skipped during molecule testing

    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server is not running"
        success_msg: "Chef Infra Server is running"
      tags: molecule-notest

    - name: Check network listening on port 443
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    - name: Check web UI access
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
        status_code: 200
      register: web_ui_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert web UI is accessible
      ansible.builtin.assert:
        that:
          - web_ui_check is succeeded
        fail_msg: "Web UI is not accessible"
        success_msg: "Web UI is accessible"
      tags: molecule-notest