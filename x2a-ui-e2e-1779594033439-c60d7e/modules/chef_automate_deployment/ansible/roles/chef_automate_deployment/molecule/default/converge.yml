---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create directory structure for Chef Automate
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/opt/chef-automate
        - /tmp/molecule_test/var/log/chef-automate
        - /tmp/molecule_test/var/opt/chef-server

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: "{{ item.key }} = {{ item.value }}"
        dest: "/tmp/molecule_test/etc/{{ item.key | replace('.', '_') }}.conf"
        mode: "0644"
      loop: "{{ chef_automate_sysctl_params | dict2items }}"

    # Simulate Chef Automate CLI download and extraction
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: /tmp/molecule_test/chef-automate
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment status file
      ansible.builtin.copy:
        content: |
          Chef Automate deployed with products:
          {% for product in chef_automate_products %}
          - {{ product }}
          {% endfor %}
          Terms and MLSA accepted: {{ chef_automate_accept_terms }}
        dest: /tmp/molecule_test/opt/chef-automate/deployment-status.txt
        mode: "0644"

