        dest: "/tmp/molecule_test/{{ chef_org_validator_key_file }}"
        mode: "0600"

    # Simulate Chef server status files
    - name: Create Chef server status files
      ansible.builtin.copy:
        content: "Service running"
        dest: "/tmp/molecule_test/var/opt/chef-server/{{ item }}-status.txt"
        mode: "0644"
      loop:
        - nginx
        - postgresql
        - bookshelf
        - oc_bifrost
        - oc_id
        - opscode-erchef
        - opscode-solr4

    # Simulate Chef user and organization list files
    - name: Create Chef user list file
      ansible.builtin.copy:
        content: "{{ chef_user_name }}"
        dest: /tmp/molecule_test/var/opt/chef-server/user-list.txt
        mode: "0644"

    - name: Create Chef organization list file
      ansible.builtin.copy:
        content: "{{ chef_org_name }}"
        dest: /tmp/molecule_test/var/opt/chef-server/org-list.txt
        mode: "0644"

  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_sysctl_params:
      vm.max_map_count: 262144
      vm.dirty_expire_centisecs: 20000
    chef_automate_accept_terms: true
    chef_automate_products:
      - automate
      - infra-server
    chef_user_name: jtonello
    chef_user_fullname: John Tonello
    chef_user_email: jtonello@chef.lab
    chef_user_password: password
    chef_org_name: lab
    chef_org_fullname: Chef Lab
    chef_user_key_file: "{{ chef_user_name }}.pem"
    chef_org_validator_key_file: "{{ chef_org_name }}-validator.pem"