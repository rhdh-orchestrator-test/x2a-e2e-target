- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/usr/bin
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/chef-server
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'''
      dest: /tmp/molecule_test/usr/bin/chef-automate
      mode: '0755'
  - name: Create Chef Server CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Server CLI mock'''
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAx4UbaDzY5xjW6hc9jwN0mX33XpTDVW9WqHp5AKaRbtAC3DqX

        IXFMPgw3K45jxRb93f8tv9vL3rD9CUG1Gv4FM+o7ds7FRES5RTjv2RT/JVNJCoqF

        ol8+ngVcAcXu5ihJtMfbLxqxbHwHzBHxpE7Xjf+kcWuZyXQThrW6BE9tQtY6phxQ

        dj1PSopcq3Cd2O+qEk5tXsp5vNI+Xy1L78VHOBXsGAFpkqh3/+LMsqkBcmSOYExW

        J8LRnZykcyX6vKQ9CdXtWVttB8WpQPOFGM72mzqBbSO/zZsFs9hyqzHlcqKi5RTk

        iDtgqpEEZd+tlUhExDq+MscfkiTUvVTYMzqziwIDAQABAoIBAQCxNPjzH9jvkOiP

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAx4UbaDzY5xjW6hc9jwN0mX33XpTDVW9WqHp5AKaRbtAC3DqX

        IXFMPgw3K45jxRb93f8tv9vL3rD9CUG1Gv4FM+o7ds7FRES5RTjv2RT/JVNJCoqF

        ol8+ngVcAcXu5ihJtMfbLxqxbHwHzBHxpE7Xjf+kcWuZyXQThrW6BE9tQtY6phxQ

        dj1PSopcq3Cd2O+qEk5tXsp5vNI+Xy1L78VHOBXsGAFpkqh3/+LMsqkBcmSOYExW

        J8LRnZykcyX6vKQ9CdXtWVttB8WpQPOFGM72mzqBbSO/zZsFs9hyqzHlcqKi5RTk

        iDtgqpEEZd+tlUhExDq+MscfkiTUvVTYMzqziwIDAQABAoIBAQCxNPjzH9jvkOiP

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: automate-postgresql       OK

        Service: automate-elasticsearch    OK

        Service: automate-es-gateway       OK

        Service: automate-ui               OK

        Service: automate-load-balancer    OK

        Service: automate-cs-nginx         OK

        Service: automate-cs-bookshelf     OK

        Service: automate-cs-oc-erchef     OK

        '
      dest: /tmp/molecule_test/var/opt/chef-automate/status.txt
      mode: '0644'
  - name: Create Chef Server status file
    ansible.builtin.copy:
      content: 'run: bookshelf: (pid 12345) 1s; run: log: (pid 12346) 1s

        run: nginx: (pid 12347) 1s; run: log: (pid 12348) 1s

        run: oc_bifrost: (pid 12349) 1s; run: log: (pid 12350) 1s

        run: oc_id: (pid 12351) 1s; run: log: (pid 12352) 1s

        run: opscode-erchef: (pid 12353) 1s; run: log: (pid 12354) 1s

        run: postgresql: (pid 12355) 1s; run: log: (pid 12356) 1s

        run: redis_lb: (pid 12357) 1s; run: log: (pid 12358) 1s

        '
      dest: /tmp/molecule_test/var/opt/chef-server/status.txt
      mode: '0644'
  - name: Create user list file
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/var/opt/chef-server/user-list.txt
      mode: '0644'
  - name: Create organization list file
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/var/opt/chef-server/org-list.txt
      mode: '0644'
  - name: Create Chef Automate service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Automate

        After=network.target


        [Service]

        Type=simple

        ExecStart=/usr/bin/chef-automate start

        ExecStop=/usr/bin/chef-automate stop

        Restart=on-failure


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      mode: '0644'
