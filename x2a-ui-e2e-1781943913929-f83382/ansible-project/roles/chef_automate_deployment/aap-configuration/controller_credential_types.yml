---
controller_credential_types:
- name: Chef User Password
  description: Credential type for Chef User Password
  kind: cloud
  inputs:
    fields:
    - id: user_password
      type: string
      label: Chef User Password
      secret: true
      help_text: Password for the initial Chef user account
    - id: username
      type: string
      label: Chef Username
      help_text: Username for the Chef user account
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name for the Chef user account
    - id: email
      type: string
      label: Email Address
      help_text: Email address for the Chef user account
    required:
    - user_password
    - username
  injectors:
    extra_vars:
      user_password: !unsafe '{{ user_password }}'
      username: !unsafe '{{ username }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
