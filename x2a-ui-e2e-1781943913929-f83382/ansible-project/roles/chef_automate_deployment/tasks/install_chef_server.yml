---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
  args:
    creates: "{{ chef_automate_cli_path }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Check if Chef Server is already deployed
  ansible.builtin.stat:
    path: /var/opt/chef-server
  register: chef_server_dir
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy {% for product in chef_server_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={% if chef_automate_accept_terms
      %}true{% else %}false{% endif %} "
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
  failed_when: chef_server_deploy.rc != 0
  async: 3600
  poll: 30
  when: not chef_server_dir.stat.exists
