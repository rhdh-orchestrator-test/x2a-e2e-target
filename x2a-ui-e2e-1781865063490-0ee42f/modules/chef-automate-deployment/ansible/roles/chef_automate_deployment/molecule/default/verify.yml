- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check required package binaries
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/{{ item }}
    register: package_binaries
    loop:
    - unzip
    - gzip
  - name: Assert required package binaries exist
    ansible.builtin.assert:
      that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.executable
      fail_msg: Required package binary not found or not executable
      success_msg: Required package binary exists and is executable
    loop: '{{ package_binaries.results }}'
    loop_control:
      label: '{{ item.item }}'
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == (chef_automate_hostname | default('automate.chef.lab'))
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check vm.max_map_count file
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_file
  - name: Assert vm.max_map_count file exists
    ansible.builtin.assert:
      that:
      - max_map_count_file.stat.exists
      - max_map_count_file.stat.isreg
      fail_msg: vm.max_map_count file not found
      success_msg: vm.max_map_count file exists
  - name: Get vm.max_map_count content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_content
    when: max_map_count_file.stat.exists
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - (max_map_count_content.content | b64decode | trim) == (chef_automate_vm_max_map_count | default('262144') | string)
      fail_msg: vm.max_map_count not set correctly
      success_msg: vm.max_map_count set correctly
    when: max_map_count_file.stat.exists
  - name: Check vm.dirty_expire_centisecs file
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_file
  - name: Assert vm.dirty_expire_centisecs file exists
    ansible.builtin.assert:
      that:
      - dirty_expire_centisecs_file.stat.exists
      - dirty_expire_centisecs_file.stat.isreg
      fail_msg: vm.dirty_expire_centisecs file not found
      success_msg: vm.dirty_expire_centisecs file exists
  - name: Get vm.dirty_expire_centisecs content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_content
    when: dirty_expire_centisecs_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - (dirty_expire_centisecs_content.content | b64decode | trim) == (chef_automate_vm_dirty_expire_centisecs | default('20000') | string)
      fail_msg: vm.dirty_expire_centisecs not set correctly
      success_msg: vm.dirty_expire_centisecs set correctly
    when: dirty_expire_centisecs_file.stat.exists
  - name: Check Chef Automate CLI
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.isreg
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check hab directory
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert hab directory exists
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: hab directory not found, Chef Automate/Infra Server not deployed
      success_msg: hab directory exists, Chef Automate/Infra Server deployed
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/{{ ansible_user }}/{{ chef_automate_username | default('admin') }}.pem
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.isreg
      - user_key_file.stat.mode == '0600'
      fail_msg: User key file not found or incorrect permissions
      success_msg: User key file exists with correct permissions
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/{{ ansible_user }}/{{ chef_automate_org_name | default('lab') }}-validator.pem
    register: org_key_file
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.isreg
      - org_key_file.stat.mode == '0600'
      fail_msg: Organization validator key file not found or incorrect permissions
      success_msg: Organization validator key file exists with correct permissions
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: chef-automate status
    changed_when: false
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: chef-server-ctl status
    changed_when: false
    tags: molecule-notest
  - name: Check user list
    ansible.builtin.command:
      cmd: chef-server-ctl user-list
    register: user_list
    changed_when: false
    tags: molecule-notest
  - name: Assert user exists
    ansible.builtin.assert:
      that:
      - chef_automate_username | default('admin') in user_list.stdout
      fail_msg: User not found in Chef Infra Server
      success_msg: User exists in Chef Infra Server
    tags: molecule-notest
  - name: Check organization list
    ansible.builtin.command:
      cmd: chef-server-ctl org-list
    register: org_list
    changed_when: false
    tags: molecule-notest
  - name: Assert organization exists
    ansible.builtin.assert:
      that:
      - chef_automate_org_name | default('lab') in org_list.stdout
      fail_msg: Organization not found in Chef Infra Server
      success_msg: Organization exists in Chef Infra Server
    tags: molecule-notest
  - name: Check network listening on port 443
    ansible.builtin.wait_for:
      port: 443
      timeout: 5
    ignore_errors: true
    register: port_check
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is succeeded
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
  - name: Check Chef Automate service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - '''chef-automate'' in ansible_facts.services'
      - ansible_facts.services['chef-automate'].state == 'running'
      fail_msg: Chef Automate service is not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check Chef Automate API accessibility
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
    register: api_check
    ignore_errors: true
    tags: molecule-notest
  - name: Assert Chef Automate API is accessible
    ansible.builtin.assert:
      that:
      - api_check is succeeded
      fail_msg: Chef Automate API is not accessible
      success_msg: Chef Automate API is accessible
    tags: molecule-notest
