- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/home/{{ ansible_user }}
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/usr/bin
  - name: Create mock binaries for required packages
    ansible.builtin.copy:
      content: '#!/bin/sh echo ''Mock binary'' '
      dest: /tmp/molecule_test/usr/bin/{{ item }}
      mode: '0755'
    loop:
    - unzip
    - gzip
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname | default(''automate.chef.lab'') }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create vm.max_map_count file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_max_map_count | default(''262144'') }}'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create vm.dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_dirty_expire_centisecs | default(''20000'') }}'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/sh echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK USER KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/home/{{ ansible_user }}/{{ chef_automate_username | default('admin') }}.pem
      mode: '0600'
  - name: Create org validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK ORG VALIDATOR KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/home/{{ ansible_user }}/{{ chef_automate_org_name | default('lab') }}-validator.pem
      mode: '0600'
  - name: Create hab directory to simulate installation
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create chef-server-ctl mock
    ansible.builtin.copy:
      content: "#!/bin/sh\ncase \"$1\" in\n  \"user-list\")\n    echo \"{{ chef_automate_username | default('admin') }}\"\n    ;;\n  \"org-list\")\n    echo \"{{
        chef_automate_org_name | default('lab') }}\"\n    ;;\n  *)\n    echo \"Mock chef-server-ctl: $@\"\n    ;;\nesac\n"
      dest: /tmp/molecule_test/tmp/chef-server-ctl
      mode: '0755'
