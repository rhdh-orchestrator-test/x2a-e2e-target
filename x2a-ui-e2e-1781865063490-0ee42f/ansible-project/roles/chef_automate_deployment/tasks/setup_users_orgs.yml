---
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: "chef-server-ctl user-create  {{ chef_automate_username }}  {{ chef_automate_full_name | quote }}  {{ chef_automate_email | quote }}  {{ chef_automate_password
      | quote }}  --filename {{ chef_automate_user_key_path }}\n"
  args:
    creates: "{{ chef_automate_user_key_path }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: "chef-server-ctl org-create  {{ chef_automate_org_name }}  {{ chef_automate_org_full_name | quote }}  --association_user {{ chef_automate_username }}  --filename
      {{ chef_automate_org_key_path }}\n"
  args:
    creates: "{{ chef_automate_org_key_path }}"
  become: true
