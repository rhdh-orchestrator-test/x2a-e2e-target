---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache
    description:
      - Fixes the POODLE SSL vulnerability (CVE-2014-3566) in Apache web server
      - Updates SSL protocol configuration to disable vulnerable protocols
      - Enables only TLSv1.2 protocol for secure connections
    options:
      apache_ssl_conf_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file
      ssl_protocols:
        type: str
        required: false
        default: -all +TLSv1.2
        description: SSL protocols to enable/disable (fixes POODLE vulnerability)
      ssl_protocol_regex:
        type: str
        required: false
        default: ^SSLProtocol.*$
        description: Regex pattern to match SSL protocol lines in configuration
