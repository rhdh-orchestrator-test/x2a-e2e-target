---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for Chef Automate and Chef Infra Server
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/opscode
        - /tmp/molecule_test/usr/bin
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/opscode

    # Create Chef Automate config file
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          # Chef Automate configuration
          [global]
            v1 = true
          [deployment]
            hostname = "automate.chef.lab"
          [products]
            automate = true
            infra-server = true
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"

    # Create Chef Automate CLI binary placeholder
    - name: Create Chef Automate CLI binary placeholder
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: /tmp/molecule_test/usr/bin/chef-automate
        mode: "0755"

    # Create Chef Server CTL binary placeholder
    - name: Create Chef Server CTL binary placeholder
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Server CTL mock'\n"
        dest: /tmp/molecule_test/usr/bin/chef-server-ctl
        mode: "0755"

    # Create user PEM file
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          EXAMPLE_PEM_CONTENT_FOR_USER
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/jtonello.pem
        mode: "0600"

    # Create organization validator PEM file
    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          EXAMPLE_PEM_CONTENT_FOR_ORG_VALIDATOR
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/lab-validator.pem
        mode: "0600"

    # Create mock sysctl configuration
    - name: Create mock sysctl configuration
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Create mock hostname file
    - name: Create mock hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Create mock service files
    - name: Create mock service files
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef {{ item }} Service
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/{{ item }}
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: "/tmp/molecule_test/etc/systemd/system/{{ item }}.service"
        mode: "0644"
      loop:
        - chef-automate
        - chef-server