---
chef_automate_hostname: automate.chef.lab
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: ./chef-automate
chef_automate_accept_terms: true
chef_automate_products:
  - automate
  - infra-server
chef_automate_user_name: "{{ username | default('jtonello') }}"
chef_automate_user_full_name: "{{ full_name | default('John Tonello') }}"
chef_automate_user_email: "{{ email | default('jtonello@chef.lab') }}"
chef_automate_user_password: "{{ password | default('password') }}"
chef_automate_org_name: "{{ org_short_name | default('lab') }}"
chef_automate_org_full_name: "{{ org_full_name | default('Chef Lab') }}"
chef_automate_user_pem_file: "{{ chef_automate_user_name }}.pem"
chef_automate_org_pem_file: "{{ chef_automate_org_name }}-validator.pem"
chef_automate_sysctl_params:
  vm.max_map_count: 262144
  vm.dirty_expire_centisecs: 20000
