- name: Set system hostname
  ansible.builtin.hostname:
    name: '{{ chef_automate_hostname }}'
  become: true
- name: Set vm.max_map_count kernel parameter
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: '{{ chef_automate_vm_max_map_count }}'
    state: present
    sysctl_set: true
  become: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: '{{ chef_automate_vm_dirty_expire_centisecs }}'
    state: present
    sysctl_set: true
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: '{{ chef_automate_cli_url }}'
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: '0644'
  become: true
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: '{{ chef_automate_cli_path }}'
  register: chef_automate_cli_stat
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.shell: gunzip < /tmp/chef-automate_linux_amd64.zip > {{ chef_automate_cli_path }}
  args:
    creates: '{{ chef_automate_cli_path }}'
  become: true
  when: not chef_automate_cli_stat.stat.exists
- name: Set execute permissions on Chef Automate CLI
  ansible.builtin.file:
    path: '{{ chef_automate_cli_path }}'
    mode: '0755'
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command: '{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }}'
  args:
    creates: /hab
  become: true
- name: Create Chef user
  ansible.builtin.command: 'chef-server-ctl user-create {{ username }} {{ long_username }} {{ user_email }} "{{ user_password }}" --filename {{ chef_automate_user_filename
    }} '
  args:
    creates: '{{ chef_automate_user_filename }}'
  become: true
- name: Create Chef organization
  ansible.builtin.command: 'chef-server-ctl org-create {{ org_name }} "{{ long_org_name }}" --association_user {{ username }} --filename {{ chef_automate_org_filename
    }} '
  args:
    creates: '{{ chef_automate_org_filename }}'
  become: true
