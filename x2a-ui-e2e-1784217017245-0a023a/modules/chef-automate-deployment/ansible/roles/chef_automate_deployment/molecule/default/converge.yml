---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: "test_user"
    long_username: "Test User"
    user_email: "test@example.com"
    user_password: "testpassword"
    org_name: "test_org"
    long_org_name: "Test Organization"
    chef_automate_hostname: "automate.chef.lab"
    chef_automate_cli_path: "/tmp/molecule_test/chef-automate"
    chef_automate_user_filename: "/tmp/molecule_test/test_user.pem"
    chef_automate_org_filename: "/tmp/molecule_test/test_org-validator.pem"
  tasks:
    - name: Create directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/etc/sysctl.d

    # Simulate the sysctl files that would be created
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: |
          # Managed by Ansible
          vm.max_map_count = 262144
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate the Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI mock"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate the user PEM file
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAu5NhSgpKHVJLKCfMgJ4H9yUJAn8KS2TkDQCnVVjQpZOG8xLm
          MOCK_KEY_CONTENT_FOR_USER
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/test_user.pem"
        mode: "0600"

    # Simulate the organization validator PEM file
    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAu5NhSgpKHVJLKCfMgJ4H9yUJAn8KS2TkDQCnVVjQpZOG8xLm
          MOCK_KEY_CONTENT_FOR_ORG
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/test_org-validator.pem"
        mode: "0600"

    # Simulate the /hab directory that would be created by Chef Automate deployment
    - name: Create hab directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/hab/sup
        - /tmp/molecule_test/hab/pkgs
        - /tmp/molecule_test/hab/cache

    # Create mock files to simulate Chef Automate and Chef Infra Server installation
    - name: Create mock Chef Automate service files
      ansible.builtin.copy:
        content: "# Mock Chef Automate service file"
        dest: "/tmp/molecule_test/hab/sup/automate-service"
        mode: "0644"

    - name: Create mock Chef Infra Server service files
      ansible.builtin.copy:
        content: "# Mock Chef Infra Server service file"
        dest: "/tmp/molecule_test/hab/sup/infra-server-service"
        mode: "0644"