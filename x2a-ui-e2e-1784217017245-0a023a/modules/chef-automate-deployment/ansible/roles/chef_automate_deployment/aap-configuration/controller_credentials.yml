---
controller_credentials:
- name: Chef Automation User - chef_automate_deployment
  description: User credentials for Chef Automation deployment
  organization: Default
  credential_type: Chef Automation User
  update_secrets: true
  inputs:
    username: '{{ username }}'
    long_username: '{{ long_username }}'
    user_email: '{{ user_email }}'
    user_password: '{{ vault_user_password }}'
- name: Chef Organization - chef_automate_deployment
  description: Organization details for Chef deployment
  organization: Default
  credential_type: Chef Organization
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    long_org_name: '{{ long_org_name }}'
