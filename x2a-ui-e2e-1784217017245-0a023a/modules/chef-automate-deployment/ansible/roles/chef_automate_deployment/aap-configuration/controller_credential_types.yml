---
controller_credential_types:
- name: Chef Automation User
  description: User credentials for Chef Automation deployment
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef user account
    - id: long_username
      type: string
      label: Full Name
      help_text: Full name of the Chef user
    - id: user_email
      type: string
      label: Email Address
      help_text: Email address for the Chef user account
    - id: user_password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef user account
    required:
    - username
    - user_password
    - user_email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      long_username: !unsafe '{{ long_username }}'
      user_email: !unsafe '{{ user_email }}'
      user_password: !unsafe '{{ user_password }}'
- name: Chef Organization
  description: Organization details for Chef deployment
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: long_org_name
      type: string
      label: Full Organization Name
      help_text: Full name of the Chef organization
    required:
    - org_name
    - long_org_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      long_org_name: !unsafe '{{ long_org_name }}'
