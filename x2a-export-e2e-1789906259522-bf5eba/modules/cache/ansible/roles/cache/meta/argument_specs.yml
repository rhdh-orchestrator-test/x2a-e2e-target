---
argument_specs:
  main:
    short_description: Install and configure Redis and Memcached caching services
    description:
      - Installs and configures Redis server with authentication
      - Installs and configures Memcached service
      - Creates necessary log directories and sets up service management
      - Cleans up problematic Redis configuration entries
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for Redis server to listen on
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory path for Redis log files
      cache_redis_log_dir_owner:
        type: str
        required: false
        default: redis
        description: Owner of the Redis log directory
      cache_redis_log_dir_group:
        type: str
        required: false
        default: redis
        description: Group owner of the Redis log directory
      cache_redis_log_dir_mode:
        type: str
        required: false
        default: "0755"
        description: File permissions for Redis log directory
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: TCP port for Memcached service to listen on
      cache_redis_servers:
        type: list
        elements: dict
        required: false
        default:
          - port: "{{ cache_redis_port }}"
            requirepass: "{{ redis_password }}"
            replicaservestaledata: false
        description: List of Redis server configurations
        options:
          port:
            type: str
            description: Redis server port
          requirepass:
            type: str
            description: Redis authentication password
          replicaservestaledata:
            type: bool
            description: Whether replica serves stale data
      cache_redis_packages:
        type: list
        elements: str
        required: false
        default:
          - redis-server
        description: List of Redis packages to install
      cache_memcached_packages:
        type: list
        elements: str
        required: false
        default:
          - memcached
        description: List of Memcached packages to install
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis systemd service
      cache_memcached_service:
        type: str
        required: false
        default: memcached
        description: Name of the Memcached systemd service
      redis_password:
        type: str
        required: true
        description: Redis authentication password (injected by AAP credential type)
