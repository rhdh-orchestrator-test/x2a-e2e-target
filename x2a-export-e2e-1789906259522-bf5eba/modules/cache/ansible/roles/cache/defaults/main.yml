---
cache_redis_port: 6379
cache_redis_log_dir: /var/log/redis
cache_redis_log_dir_owner: redis
cache_redis_log_dir_group: redis
cache_redis_log_dir_mode: "0755"
cache_memcached_port: 11211
cache_redis_servers:
  - port: "{{ cache_redis_port }}"
    requirepass: "{{ redis_password }}"
    replicaservestaledata: false
cache_redis_packages:
  - redis-server
cache_memcached_packages:
  - memcached
cache_redis_service: redis-server
cache_memcached_service: memcached
