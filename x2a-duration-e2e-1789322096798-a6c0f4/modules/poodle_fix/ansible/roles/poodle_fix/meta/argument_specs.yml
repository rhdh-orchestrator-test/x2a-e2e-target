---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache web server
    description:
      - Fixes the POODLE SSL vulnerability by configuring Apache to use only TLS 1.2
      - Installs Apache, enables SSL module, and modifies SSL configuration
      - Provides security hardening for web servers against SSL/TLS vulnerabilities
    options:
      apache_ssl_conf_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file to modify
      ssl_protocol_config:
        type: str
        required: false
        default: SSLProtocol -all +TLSv1.2
        description: SSL protocol configuration string to fix POODLE vulnerability
      restart_apache:
        type: bool
        required: false
        default: true
        description: Whether to restart Apache after configuration change
