---
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Wait for Chef Infra Server to be fully operational
  ansible.builtin.command:
    cmd: chef-server-ctl status
  register: chef_server_status
  until: chef_server_status.rc == 0
  retries: 10
  delay: 30
  changed_when: false
  failed_when: false
  become: true
  when: chef_server_ctl_check.rc == 0
- name: Create directory for Chef key files
  ansible.builtin.file:
    path: /root/chef-keys
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: true
  when: chef_server_ctl_check.rc == 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create  {{ chef_user_name }}  "{{ chef_user_fullname }}"  {{ chef_user_email }}  "{{ chef_user_password }}"  --filename
      /root/chef-keys/{{ chef_user_key_file }}
  become: true
  args:
    creates: /root/chef-keys/{{ chef_user_key_file }}
  register: create_user
  changed_when: create_user.rc == 0
  no_log: true
  when: chef_server_ctl_check.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create  {{ chef_org_name }}  "{{ chef_org_fullname }}"  --association_user {{ chef_user_name }}  --filename /root/chef-keys/{{
      chef_org_validator_key }}
  become: true
  args:
    creates: /root/chef-keys/{{ chef_org_validator_key }}
  register: create_org
  changed_when: create_org.rc == 0
  when: chef_server_ctl_check.rc == 0
