- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create required directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/root
    - /tmp/molecule_test/root/chef-keys
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/usr/bin
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '{{ item.name }} = {{ item.value }}'
      dest: /tmp/molecule_test/etc/{{ item.name | replace('.', '_') }}
      mode: '0644'
    loop:
    - name: vm.max_map_count
      value: '{{ chef_automate_vm_max_map_count }}'
    - name: vm.dirty_expire_centisecs
      value: '{{ chef_automate_vm_dirty_expire_centisecs }}'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/root/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab/sup
      state: directory
      mode: '0755'
  - name: Create Chef user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_KEY_CONTENT_FOR_{{ chef_user_name }} -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/root/chef-keys/{{ chef_user_key_file }}
      mode: '0600'
  - name: Create Chef organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_KEY_CONTENT_FOR_{{ chef_org_name }}-validator -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/root/chef-keys/{{ chef_org_validator_key }}
      mode: '0600'
  - name: Create chef-server-ctl mock
    ansible.builtin.copy:
      content: "#!/bin/bash\necho \"Chef Server Control mock\"\necho \"Command: $@\"\nif [[ \"$1\" == \"user-list\" ]]; then\n  echo \"{{ chef_user_name }}\"\nelif
        [[ \"$1\" == \"org-list\" ]]; then\n  echo \"{{ chef_org_name }}\"\nfi\nexit 0\n"
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create chef-automate mock
    ansible.builtin.copy:
      content: "#!/bin/bash\necho \"Chef Automate mock\"\necho \"Command: $@\"\nif [[ \"$1\" == \"status\" ]]; then\n  echo \"Chef Automate services are running\"\nelif
        [[ \"$1\" == \"system-logs\" ]]; then\n  echo \"Chef Automate logs are available\"\nfi\nexit 0\n"
      dest: /tmp/molecule_test/usr/bin/chef-automate
      mode: '0755'
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_cli_path: /root/chef-automate
    chef_user_name: jtonello
    chef_org_name: lab
    chef_user_key_file: jtonello.pem
    chef_org_validator_key: lab-validator.pem
