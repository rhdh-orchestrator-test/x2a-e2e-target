---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
  register: download_result
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > /tmp/chef-automate
    stdin: "{{ lookup('file', '/tmp/chef-automate.zip') }}"
  args:
    creates: /tmp/chef-automate
  when: download_result.changed
- name: Set executable permissions on Chef Automate CLI
  ansible.builtin.file:
    path: /tmp/chef-automate
    mode: "0755"
  when: download_result.changed
- name: Deploy standalone Chef Infra Server
  ansible.builtin.command:
    cmd: /tmp/chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ 'true' if chef_automate_accept_terms else 'false' }}
    creates: /etc/chef-automate/config.toml
  become: true
  register: deploy_result
- name: Create Chef Infra Server user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_automate_username }}  {{ chef_automate_longusername }}  {{ chef_automate_useremail }}  "{{ chef_automate_userpassword
      }}"  --filename {{ chef_automate_userfilename }}

      '
    creates: /etc/chef/{{ chef_automate_userfilename }}
  become: true
  when: deploy_result.changed
- name: Create Chef Infra Server organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_automate_orgname }}  "{{ chef_automate_longorgname }}"  --association_user {{ chef_automate_username }}  --filename
      {{ chef_automate_orgfilename }}

      '
    creates: /etc/chef/{{ chef_automate_orgfilename }}
  become: true
  when: deploy_result.changed
