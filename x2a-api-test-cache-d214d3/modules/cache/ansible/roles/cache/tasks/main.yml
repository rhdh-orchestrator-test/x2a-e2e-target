---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install memcached
  ansible.builtin.package:
    name: memcached
    state: present
- name: Install redis-server
  ansible.builtin.package:
    name: redis-server
    state: present
- name: Create redis user
  ansible.builtin.user:
    name: redis
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present
- name: Create memcache user
  ansible.builtin.user:
    name: "{{ cache_memcached_user }}"
    system: true
    shell: /bin/false
    home: /nonexistent
    create_home: false
    state: present
- name: Create Redis working directory
  ansible.builtin.file:
    path: "{{ cache_redis_dir }}"
    owner: redis
    group: redis
    mode: "0755"
    state: directory
- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    owner: redis
    group: redis
    mode: "0755"
    state: directory
- name: Create systemd tmpfiles.d configuration for Redis PID directory
  ansible.builtin.copy:
    content: "# Redis PID directory\nd /var/run/redis 0755 redis redis -\n"
    dest: /etc/tmpfiles.d/redis.conf
    owner: root
    group: root
    mode: "0644"
- name: Create Redis PID directory
  ansible.builtin.file:
    path: /var/run/redis
    owner: redis
    group: redis
    mode: "0755"
    state: directory
- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/6379.conf
    owner: redis
    group: redis
    mode: "0640"
    backup: true
  notify: Restart Redis
- name: Remove replica-related directives from Redis config
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: "{{ item_cache }}"
    state: absent
  loop:
    - ^replica-serve-stale-data.*$
    - ^replica-read-only.*$
    - ^repl-ping-replica-period.*$
    - ^client-output-buffer-limit.*$
    - ^replica-priority.*$
  loop_control:
    loop_var: item_cache
  notify: Restart Redis
- name: Start and enable memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
- name: Start and enable redis service
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
