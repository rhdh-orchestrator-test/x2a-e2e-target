- name: Converge
  hosts: all
  gather_facts: true
  vars:
    apache_ssl_conf_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    apache_service_name: apache2
    ssh_service_name: sshd
  tasks:
  - name: Create directory structure for Apache SSL config
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create sample Apache SSL config file with vulnerable SSL protocol setting
    ansible.builtin.copy:
      content: '# This is a sample ssl.conf file for molecule testing

        # It contains a vulnerable SSLProtocol setting that will be fixed by the role


        SSLEngine on

        SSLProtocol all -SSLv3

        SSLHonorCipherOrder on

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Simulate package installation (no-op in container)
    ansible.builtin.debug:
      msg: Would install {{ apache_service_name }} and {{ ssh_service_name }} packages
  - name: Fix SSL in Apache (direct task execution)
    ansible.builtin.replace:
      dest: '{{ apache_ssl_conf_path }}'
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
