---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check if Apache SSL config file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_conf_file

    - name: Assert SSL config file exists
      ansible.builtin.assert:
        that:
          - ssl_conf_file.stat.exists
          - ssl_conf_file.stat.isreg
        fail_msg: "Apache SSL config file not found"
        success_msg: "Apache SSL config file exists"

    - name: Get SSL config file content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_conf_content
      when: ssl_conf_file.stat.exists

    - name: Assert SSL protocol is properly configured
      ansible.builtin.assert:
        that:
          - ssl_conf_content.content | b64decode | regex_search('SSLProtocol -all \+TLSv1\.2')
        fail_msg: "SSL protocol not properly configured to disable vulnerable protocols"
        success_msg: "SSL protocol properly configured to only allow TLSv1.2"
      when: ssl_conf_file.stat.exists

    # The following checks would be performed in a real environment but can't run in the container
    # They are tagged with molecule-notest so they're skipped during molecule testing

    - name: Check Apache service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2' in ansible_facts.services"
          - "ansible_facts.services['apache2'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Assert SSH service is running
      ansible.builtin.assert:
        that:
          - "'sshd' in ansible_facts.services"
          - "ansible_facts.services['sshd'].state == 'running'"
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"
      tags: molecule-notest

    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      tags: molecule-notest

    - name: Verify HTTPS site is accessible
      ansible.builtin.uri:
        url: https://localhost/
        validate_certs: false
        status_code: 200
      tags: molecule-notest