- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache config
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create mock Apache SSL config file with vulnerable settings
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file for testing

        SSLEngine on

        SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem

        SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

        SSLProtocol all -SSLv3

        SSLCipherSuite HIGH:!aNULL:!MD5

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Set test path for Apache config
    ansible.builtin.set_fact:
      poodle_fix_apache_config_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      poodle_fix_ssl_protocol: -all +TLSv1.2
  - name: Mock Apache package check
    ansible.builtin.debug:
      msg: Mocking Apache package installation
  - name: Fix SSL in Apache
    ansible.builtin.replace:
      dest: '{{ poodle_fix_apache_config_path }}'
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol {{ poodle_fix_ssl_protocol }}
      mode: '0644'
