---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install memcached package
  ansible.builtin.package:
    name: memcached
    state: present
- name: Install Redis packages
  ansible.builtin.package:
    name:
      - redis-server
      - redis-tools
    state: present
- name: Create Redis group
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    system: true
    state: present
- name: Create Redis user
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present
- name: Create Redis data directory
  ansible.builtin.file:
    path: /var/lib/redis
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory
- name: Create Redis run directory
  ansible.builtin.file:
    path: /var/run/redis
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory
- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}"
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory
- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}"
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0640"
    backup: true
  notify: Restart Redis
- name: Fix Redis configuration - remove replica settings
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}"
    regexp: "{{ item_pattern }}"
    state: absent
  loop: "{{ cache_redis_config_patterns_to_remove }}"
  loop_control:
    loop_var: item_pattern
  notify: Restart Redis
- name: Start and enable memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
- name: Start and enable Redis service
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
