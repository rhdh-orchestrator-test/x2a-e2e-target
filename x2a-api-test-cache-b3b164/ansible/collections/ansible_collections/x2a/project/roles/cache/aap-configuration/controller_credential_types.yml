---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis instance on TCP port 6379; the source value is hardcoded and must be migrated to a protected
      Ansible Vault variable.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis clients for authentication; store it in Ansible Vault and do not expose it in logs or templates.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
