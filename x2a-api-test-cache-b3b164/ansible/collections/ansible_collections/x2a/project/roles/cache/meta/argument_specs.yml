---
argument_specs:
  main:
    short_description: Configure Memcached and Redis caching services
    description:
      - Installs and configures Memcached and Redis with a Redis authentication password.
      - Creates the Redis log directory and removes unwanted replication directives.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks handling the Redis password.
      cache_memcached_package:
        type: str
        required: false
        default: memcached
        description: Package name for Memcached.
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Package name for Redis.
      cache_memcached_service:
        type: str
        required: false
        default: memcached
        description: Memcached service name.
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Redis service name.
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: Redis system user.
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: Redis system group.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration file path.
      cache_redis_data_directory:
        type: str
        required: false
        default: /var/lib/redis
        description: Redis data directory.
      cache_redis_log_file:
        type: str
        required: false
        default: /var/log/redis/redis-server.log
        description: Redis log file path.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: Redis TCP port.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
