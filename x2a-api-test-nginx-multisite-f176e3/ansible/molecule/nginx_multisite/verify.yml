---
# Unsupported: service enablement, SSH status/hardening, nginx grep diagnostics, listener inspection,
# fail2ban-client status diagnostics, and individual sysctl values have no stated outcome.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service status
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['nginx.service']['state'] == 'running'
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'
        fail_msg: Nginx and fail2ban must be active.

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      register: item_nginx_test

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - item_nginx_test['rc'] == 0
        fail_msg: Nginx configuration validation failed.

    - name: Check required paths
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      loop:
        - {path: /etc/nginx/nginx.conf, kind: file}
        - {path: /etc/nginx/conf.d/security.conf, kind: file}
        - {path: /etc/nginx/sites-available/test.cluster.local, kind: file}
        - {path: /etc/nginx/sites-available/ci.cluster.local, kind: file}
        - {path: /etc/nginx/sites-available/status.cluster.local, kind: file}
        - {path: /etc/nginx/sites-enabled/test.cluster.local, kind: link}
        - {path: /etc/nginx/sites-enabled/ci.cluster.local, kind: link}
        - {path: /etc/nginx/sites-enabled/status.cluster.local, kind: link}
        - {path: /opt/server/test, kind: directory}
        - {path: /opt/server/test/index.html, kind: file}
        - {path: /opt/server/ci, kind: directory}
        - {path: /opt/server/ci/index.html, kind: file}
        - {path: /opt/server/status, kind: directory}
        - {path: /opt/server/status/index.html, kind: file}
        - {path: /etc/ssl/certs/test.cluster.local.crt, kind: file}
        - {path: /etc/ssl/private/test.cluster.local.key, kind: file}
        - {path: /etc/ssl/certs/ci.cluster.local.crt, kind: file}
        - {path: /etc/ssl/private/ci.cluster.local.key, kind: file}
        - {path: /etc/ssl/certs/status.cluster.local.crt, kind: file}
        - {path: /etc/ssl/private/status.cluster.local.key, kind: file}
        - {path: /etc/fail2ban/jail.local, kind: file}
        - {path: /etc/sysctl.d/99-security.conf, kind: file}
        - {path: /etc/nginx/sites-available, kind: directory}
        - {path: /etc/nginx/sites-enabled, kind: directory}
        - {path: /etc/ssl/certs, kind: directory}
        - {path: /etc/ssl/private, kind: directory}
      loop_control:
        loop_var: item_path
      register: item_paths

    - name: Assert required paths have expected types
      ansible.builtin.assert:
        that:
          - item_path_result['stat']['exists']
          - (item_path_result['item']['kind'] != 'file') or item_path_result['stat']['isreg']
          - (item_path_result['item']['kind'] != 'directory') or item_path_result['stat']['isdir']
          - (item_path_result['item']['kind'] != 'link') or item_path_result['stat']['islnk']
        fail_msg: A required nginx multisite path is missing or has the wrong type.
      loop: "{{ item_paths['results'] }}"
      loop_control:
        loop_var: item_path_result

    - name: Check default nginx site
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_site

    - name: Assert default nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_site['stat']['exists']
        fail_msg: The default nginx site must be absent.

    - name: Check private key metadata
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
      loop:
        - {path: /etc/ssl/private/test.cluster.local.key}
        - {path: /etc/ssl/private/ci.cluster.local.key}
        - {path: /etc/ssl/private/status.cluster.local.key}
      loop_control:
        loop_var: item_key
      register: item_private_keys

    - name: Assert private keys use root ssl-cert 0640
      ansible.builtin.assert:
        that:
          - item_private_key['stat']['pw_name'] == 'root'
          - item_private_key['stat']['gr_name'] == 'ssl-cert'
          - item_private_key['stat']['mode'] == '0640'
        fail_msg: A site private key has incorrect ownership or mode.
      loop: "{{ item_private_keys['results'] }}"
      loop_control:
        loop_var: item_private_key

    - name: Inspect certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
          - -dates
      changed_when: false
      loop:
        - {path: /etc/ssl/certs/test.cluster.local.crt, common_name: test.cluster.local}
        - {path: /etc/ssl/certs/ci.cluster.local.crt, common_name: ci.cluster.local}
        - {path: /etc/ssl/certs/status.cluster.local.crt, common_name: status.cluster.local}
      loop_control:
        loop_var: item_certificate
      register: item_certificate_details

    - name: Assert certificates contain expected common names
      ansible.builtin.assert:
        that:
          - "('CN=' ~ item_certificate_detail['item']['common_name']) in item_certificate_detail['stdout']"
        fail_msg: A site certificate does not contain its expected common name.
      loop: "{{ item_certificate_details['results'] }}"
      loop_control:
        loop_var: item_certificate_detail

    - name: Check HTTP redirects
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_site['host'] }}"
        follow_redirects: none
        status_code: 301
      loop:
        - {host: test.cluster.local}
        - {host: ci.cluster.local}
        - {host: status.cluster.local}
      loop_control:
        loop_var: item_site

    - name: Check HTTPS responses
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_https['host'] }}"
        validate_certs: false
        status_code: 200
      loop:
        - {host: test.cluster.local}
        - {host: ci.cluster.local}
        - {host: status.cluster.local}
      loop_control:
        loop_var: item_https

    - name: Inspect UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      changed_when: false
      register: item_ufw_status

    - name: Assert UFW policy and required ports
      ansible.builtin.assert:
        that:
          - "'Status: active' in item_ufw_status['stdout']"
          - "'Default: deny (incoming)' in item_ufw_status['stdout']"
          - "'22/tcp' in item_ufw_status['stdout']"
          - "'80/tcp' in item_ufw_status['stdout']"
          - "'443/tcp' in item_ufw_status['stdout']"
        fail_msg: UFW must be active with default deny and ports 22, 80, and 443 allowed.

    - name: Read fail2ban jail configuration
      ansible.builtin.slurp:
        src: /etc/fail2ban/jail.local
      register: item_fail2ban_config

    - name: Assert required fail2ban jails are configured
      ansible.builtin.assert:
        that:
          - "'[sshd]' in (item_fail2ban_config['content'] | b64decode)"
          - "'[nginx-http-auth]' in (item_fail2ban_config['content'] | b64decode)"
          - "'[nginx-limit-req]' in (item_fail2ban_config['content'] | b64decode)"
          - "'[nginx-botsearch]' in (item_fail2ban_config['content'] | b64decode)"
        fail_msg: Required fail2ban jails are not configured.
