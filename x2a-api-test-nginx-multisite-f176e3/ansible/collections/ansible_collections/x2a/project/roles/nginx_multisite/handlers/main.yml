---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload nginx multisite sysctl
  ansible.builtin.command:
    argv:
      - sysctl
      - -p
      - /etc/sysctl.d/99-security.conf
  changed_when: true

- name: Restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Validate and reload nginx
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  notify: Reload nginx

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
