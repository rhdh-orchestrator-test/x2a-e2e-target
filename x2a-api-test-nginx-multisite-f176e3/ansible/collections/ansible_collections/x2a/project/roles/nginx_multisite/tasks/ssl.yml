---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
      - "{{ 'procps' if ansible_facts.os_family == 'Debian' else 'procps-ng' }}"
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}" # noqa: R114 - path is a role default
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}" # noqa: R114 - path is a role default
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Check existing site certificate
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_ssl_stat['key'] }}.crt"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_ssl_stat
  register: nginx_multisite_ssl_certificates

- name: Check existing site private key
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_key_stat['key'] }}.key"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_key_stat
  register: nginx_multisite_ssl_private_keys

- name: Generate self-signed certificates # noqa: L039, R101 - paths and command inputs come from role defaults and role-defined sites
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_ssl['key'] }}.key"
      - -out
      - "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_ssl['key'] }}.crt"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_ssl['key'] }}/emailAddress=admin@example.com
  when:
    - item_nginx_ssl['value']['ssl_enabled']
    - not (nginx_multisite_ssl_certificates.results[ansible_loop_index].stat.exists and nginx_multisite_ssl_private_keys.results[ansible_loop_index].stat.exists)
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_ssl
    index_var: ansible_loop_index
  notify: Validate and reload nginx

- name: Set private key ownership and permissions # noqa: L039 - registered by prior task
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_key['key'] }}.key" # noqa: R114 - path from role-defined sites dictionary
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  when:
    - item_nginx_key['value']['ssl_enabled']
    - nginx_multisite_ssl_private_keys.results[ansible_loop_index].stat.exists
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_key
    index_var: ansible_loop_index
