---
argument_specs:
  main:
    short_description: Simple cache cookbook - local dependency for testing
    description:
      - Installs and configures Redis server as a caching solution.
      - Ensures the Redis service is enabled and running.
    options:
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Redis server package name to install.
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Redis server service name to manage.
      cache_redis_enabled:
        type: bool
        required: false
        default: true
        description: Whether to enable the Redis service at boot time.
      cache_redis_state:
        type: str
        required: false
        default: started
        description: Desired state of the Redis service (started, stopped).
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port Redis server listens on.
      cache_redis_bind:
        type: str
        required: false
        default: 127.0.0.1
        description: IP address Redis server binds to.
