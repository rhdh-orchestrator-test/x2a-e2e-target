- name: Converge
  hosts: all
  gather_facts: true
  vars:
    cache_redis_port: 6379
    cache_redis_bind: 127.0.0.1
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item_dir }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/run/redis
    loop_control:
      loop_var: item_dir
  - name: Create expected config file
    ansible.builtin.copy:
      content: '# Redis configuration file example

        port {{ cache_redis_port }}

        bind {{ cache_redis_bind }}

        maxmemory 256mb

        maxmemory-policy allkeys-lru

        daemonize yes

        pidfile /var/run/redis/redis-server.pid

        logfile /var/log/redis/redis-server.log

        dir /var/lib/redis

        '
      dest: /tmp/molecule_test/etc/redis/redis.conf
      mode: '0644'
      backup: true
  - name: Create expected log file
    ansible.builtin.copy:
      content: '# Redis server log

        1:M 01 Jan 2023 00:00:00.000 # Server initialized

        1:M 01 Jan 2023 00:00:00.000 * Ready to accept connections

        '
      dest: /tmp/molecule_test/var/log/redis/redis-server.log
      mode: '0644'
      backup: true
  - name: Create expected socket file (placeholder)
    ansible.builtin.copy:
      content: ''
      dest: /tmp/molecule_test/var/run/redis/redis-server.sock
      mode: '0644'
      backup: true
