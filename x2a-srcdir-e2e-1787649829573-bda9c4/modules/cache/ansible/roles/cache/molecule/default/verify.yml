---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check config files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/redis/redis.conf
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/log/redis/redis-server.log
        - /tmp/molecule_test/var/run/redis/redis-server.sock
      loop_control:
        loop_var: item_config
      register: config_stat_results

    - name: Assert config files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: "Expected file or directory not found"
      loop: "{{ config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Get Redis configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/redis/redis.conf
      register: redis_conf_content

    - name: Assert Redis configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'port 6379' in (redis_conf_content['content'] | b64decode)"
          - "'bind 127.0.0.1' in (redis_conf_content['content'] | b64decode)"
          - "'maxmemory' in (redis_conf_content['content'] | b64decode)"
        fail_msg: "Redis configuration does not contain expected settings"

    # The following checks would run on a real system but not in the molecule container
    # They are tagged with molecule-notest to be skipped during molecule testing

    - name: Check Redis service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Redis service is active
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
          - "ansible_facts.services['redis-server.service']['status'] == 'enabled'"
        fail_msg: "Redis service is not running or not enabled"
      tags: molecule-notest

    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        state: started
        timeout: 5
      tags: molecule-notest

    - name: Check Redis memory usage
      ansible.builtin.command:
        cmd: redis-cli info memory
      register: redis_memory
      changed_when: false
      tags: molecule-notest

    - name: Assert Redis is using memory
      ansible.builtin.assert:
        that:
          - "'used_memory' in redis_memory.stdout"
        fail_msg: "Redis memory information not available"
      tags: molecule-notest

    - name: Check Redis connectivity
      ansible.builtin.command:
        cmd: redis-cli ping
      register: redis_ping
      changed_when: false
      tags: molecule-notest

    - name: Assert Redis responds to ping
      ansible.builtin.assert:
        that:
          - "redis_ping.stdout == 'PONG'"
        fail_msg: "Redis did not respond to ping command"
      tags: molecule-notest