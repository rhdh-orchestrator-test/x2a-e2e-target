---
controller_credential_types:
  - name: Redis Cache Authentication
    description: Password required to authenticate to the Redis cache instance on port 6379. The source stores it as a hardcoded Chef recipe value; migration 
      recommends Ansible Vault.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password used to authenticate clients to the Redis instance on port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
