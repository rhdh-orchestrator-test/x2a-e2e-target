---
controller_credentials:
  - name: Redis Cache Authentication - cache
    description: Password required to authenticate to the Redis cache instance on port 6379. The source stores it as a hardcoded Chef recipe value; migration 
      recommends Ansible Vault.
    organization: Default
    credential_type: Redis Cache Authentication
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
