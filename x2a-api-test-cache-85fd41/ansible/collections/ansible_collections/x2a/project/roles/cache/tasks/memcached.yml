---
- name: Install Memcached package
  ansible.builtin.package:
    name: memcached
    state: present

- name: Ensure Memcached log directory exists
  ansible.builtin.file:
    path: "{{ memcached_logfilepath }}" # noqa: R114 - path comes from role defaults
    state: directory
    owner: "{{ memcached_service_user }}"
    group: "{{ memcached_service_user }}"
    mode: "0755"

- name: Ensure Memcached runtime directory exists
  ansible.builtin.file:
    path: "{{ memcached_rundir }}" # noqa: R114 - path comes from role defaults
    state: directory
    owner: "{{ memcached_service_user }}"
    group: "{{ memcached_service_user }}"
    mode: "0755"

- name: Configure Memcached on RedHat systems
  ansible.builtin.copy:
    dest: /etc/sysconfig/memcached
    content: |
      PORT="{{ memcached_port }}"
      USER="{{ memcached_service_user }}"
      MAXCONN="{{ memcached_maxconn }}"
      CACHESIZE="{{ memcached_memory }}"
      OPTIONS="-l {{ memcached_listen }} -U {{ memcached_udp_port }} -I {{ memcached_max_object_size }} -u {{ memcached_ulimit }}{% if memcached_threads is not none %} -t {{ memcached_threads }}{% endif %}"
    mode: "0644"
    backup: true
  when: ansible_facts['os_family'] == 'RedHat'
  notify: Restart memcached

- name: Configure Memcached on Debian systems
  ansible.builtin.copy:
    dest: /etc/memcached.conf
    content: |
      -m {{ memcached_memory }}
      -p {{ memcached_port }}
      -U {{ memcached_udp_port }}
      -l {{ memcached_listen }}
      -c {{ memcached_maxconn }}
      -I {{ memcached_max_object_size }}
      -u {{ memcached_service_user }}
      {% if memcached_threads is not none %}-t {{ memcached_threads }}{% endif %}
    mode: "0644"
    backup: true
  when: ansible_facts['os_family'] == 'Debian'
  notify: Restart memcached

- name: Enable and start Memcached
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
