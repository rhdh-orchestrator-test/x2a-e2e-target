---
argument_specs:
  main:
    short_description: Install and configure Memcached and Redis cache services
    description:
      - Configures Memcached and a standalone authenticated Redis instance.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the Redis password.
      memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached cache size in megabytes.
      memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached client connections.
      memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Experimental Memcached options.
      memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional Memcached command-line options.
      memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file descriptor limit.
      memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log directory.
      memcached_rundir:
        type: str
        required: false
        default: /var/run/memcached
        description: Memcached runtime directory.
      memcached_threads:
        type: raw
        required: false
        default: null
        description: Optional number of Memcached worker threads.
      memcached_service_user:
        type: str
        required: false
        default: memcached
        description: Account used by the Memcached service.
      redis_port:
        type: int
        required: false
        default: 6379
        description: Redis TCP port.
      redis_password:
        type: str
        required: false
        default: "{{ vault_redis_password | default('') }}"
        description: Redis password, normally injected by an AAP credential type.
      redis_pid_dir:
        type: str
        required: false
        default: /run/redis
        description: Redis PID directory.
      redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration file to adjust.
      redis_version:
        type: str
        required: false
        default: "7.2"
        description: Redis version requested from the collection role.
      redis_install_method:
        type: str
        required: false
        default: package
        description: Redis installation method.
      redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Enable Redis cluster mode.
      redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Enable Redis Sentinel.
      redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Enable Redis replication.
      redis_aof_enabled:
        type: bool
        required: false
        default: false
        description: Enable Redis append-only persistence.
      redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Enable Redis RDB persistence.
