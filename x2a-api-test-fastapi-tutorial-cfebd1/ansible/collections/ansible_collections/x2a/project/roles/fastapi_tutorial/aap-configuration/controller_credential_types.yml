---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the FastAPI application's PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi user; currently hardcoded as fastapi_password and written to the application environment file.
        - id: db_host
          type: string
          label: Database Host
          help_text: PostgreSQL server hostname used by the application.
        - id: db_port
          type: string
          label: Database Port
          help_text: PostgreSQL TCP port used by the application.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database accessed by the FastAPI application.
      required:
        - db_username
        - db_password
        - db_host
        - db_port
        - db_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
        db_name: !unsafe "{{ db_name }}"
