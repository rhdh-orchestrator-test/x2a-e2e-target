---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: /opt/fastapi-tutorial
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize FastAPI tutorial repository
  ansible.builtin.git:
    repo: https://github.com/dibanez/fastapi_tutorial.git
    dest: /opt/fastapi-tutorial
    version: main
    update: true

- name: Create Python virtual environment
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - /opt/fastapi-tutorial/venv
    creates: /opt/fastapi-tutorial/venv

- name: Install application dependencies
  ansible.builtin.pip:
    requirements: /opt/fastapi-tutorial/requirements.txt
    virtualenv: /opt/fastapi-tutorial/venv
    virtualenv_command: /usr/bin/python3 -m venv

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the FastAPI database role exists  # noqa: L039,R101,R108 - credentials come from the attached AAP credential; SQL uses trusted role input; PostgreSQL checks must run as postgres
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}';
  changed_when: false
  register: fastapi_tutorial_role_check
  become: true
  become_user: postgres

- name: Create the FastAPI database role  # noqa: L039,R101,R108 - credentials come from the attached AAP credential and the check is registered above; SQL uses trusted role input; PostgreSQL administration must run as postgres
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - CREATE USER {{ db_username }} WITH PASSWORD '{{ db_password }}';
  when: fastapi_tutorial_role_check.stdout | trim != '1'
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging | default(true) }}"

- name: Check whether the FastAPI database exists  # noqa: L039,R101,R108 - database name comes from the attached AAP credential; SQL uses trusted database input; PostgreSQL checks must run as postgres
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ db_name }}';
  changed_when: false
  register: fastapi_tutorial_database_check
  become: true
  become_user: postgres

- name: Create the FastAPI database  # noqa: L039,R101,R108 - credentials come from the attached AAP credential and the check is registered above; SQL uses trusted database input; PostgreSQL administration must run as postgres
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - CREATE DATABASE {{ db_name }} OWNER {{ db_username }};
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  become: true
  become_user: postgres

- name: Grant all privileges on the FastAPI database  # noqa: L039,R101,R108 - credentials come from the attached AAP credential; SQL uses trusted database input; PostgreSQL administration must run as postgres
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_username }};
  changed_when: false
  become: true
  become_user: postgres

- name: Write FastAPI environment configuration  # noqa: L039 - database credentials come from the attached AAP credential
  ansible.builtin.copy:
    dest: /opt/fastapi-tutorial/.env
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/{{ db_name }}
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging | default(true) }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/fastapi-tutorial
      Environment="PATH=/opt/fastapi-tutorial/venv/bin"
      ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Enable and start FastAPI service
  ansible.builtin.systemd:
    name: fastapi-tutorial
    enabled: true
    state: started
    daemon_reload: true
