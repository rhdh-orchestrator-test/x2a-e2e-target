---
# Unsupported pre-flight checks: repository log output; the database connection includes a
# secret password; the exact HTTP response and application logs have no stated expected value;
# PostgreSQL's listening port is distribution-dependent; and the lsof/ss diagnostics have no
# additional expectation beyond the checks below.
- name: Verify fastapi-tutorial pre-flight checks
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are present
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        fail_msg: "A required package is not installed."
      loop:
        - python3
        - python3-pip
        - python3-venv
        - git
        - postgresql
        - postgresql-contrib
        - libpq-dev
      loop_control:
        loop_var: item_package

    - name: Verify application files and executable entry points
      ansible.builtin.stat:
        path: "{{ item_app_path }}"
      loop:
        - /opt/fastapi-tutorial
        - /opt/fastapi-tutorial/venv
        - /opt/fastapi-tutorial/requirements.txt
        - /opt/fastapi-tutorial/venv/bin/python
        - /opt/fastapi-tutorial/venv/bin/pip
        - /opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_app_path
      register: fastapi_app_paths

    - name: Assert application files and executables exist
      ansible.builtin.assert:
        that:
          - item_app_result['stat']['exists']
          - >-
            (not item_app_result['item'].endswith('/python') and
            not item_app_result['item'].endswith('/pip') and
            not item_app_result['item'].endswith('/uvicorn')) or
            item_app_result['stat']['executable']
        fail_msg: "An application path or executable is missing."
      loop: "{{ fastapi_app_paths['results'] }}"
      loop_control:
        loop_var: item_app_result

    - name: Read repository remote and branch
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - remote
          - -v
      changed_when: false
      register: fastapi_git_remote

    - name: Assert repository remote is the expected repository
      ansible.builtin.assert:
        that:
          - "'https://github.com/dibanez/fastapi_tutorial.git' in fastapi_git_remote['stdout']"
        fail_msg: "The application repository remote is not the expected repository."

    - name: Read repository checked-out revision
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - rev-parse
          - --abbrev-ref
          - HEAD
      changed_when: false
      register: fastapi_git_branch

    - name: Assert repository is checked out at main
      ansible.builtin.assert:
        that:
          - fastapi_git_branch['stdout'] | trim == 'main'
        fail_msg: "The application repository is not checked out at main."

    - name: Check PostgreSQL service status
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - postgresql
      changed_when: false
      register: postgresql_active

    - name: Check PostgreSQL service enablement
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - postgresql
      changed_when: false
      register: postgresql_enabled

    - name: Assert PostgreSQL is enabled and active
      ansible.builtin.assert:
        that:
          - postgresql_active['stdout'] | trim == 'active'
          - postgresql_enabled['stdout'] | trim == 'enabled'
        fail_msg: "PostgreSQL is not enabled and active."

    - name: Verify PostgreSQL role exists
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - "SELECT rolname FROM pg_roles WHERE rolname = 'fastapi';"
      changed_when: false
      register: fastapi_pg_role

    - name: Assert PostgreSQL role fastapi exists
      ansible.builtin.assert:
        that:
          - fastapi_pg_role['stdout'] | trim == 'fastapi'
        fail_msg: "The PostgreSQL role fastapi does not exist."

    - name: Verify PostgreSQL database exists
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - "SELECT datname FROM pg_database WHERE datname = 'fastapi_db';"
      changed_when: false
      register: fastapi_pg_database

    - name: Assert PostgreSQL database fastapi_db exists
      ansible.builtin.assert:
        that:
          - fastapi_pg_database['stdout'] | trim == 'fastapi_db'
        fail_msg: "The PostgreSQL database fastapi_db does not exist."

    - name: Verify environment file metadata
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/.env
      register: fastapi_env_stat

    - name: Assert environment file ownership and mode
      ansible.builtin.assert:
        that:
          - fastapi_env_stat['stat']['exists']
          - fastapi_env_stat['stat']['pw_name'] == 'root'
          - fastapi_env_stat['stat']['gr_name'] == 'root'
          - fastapi_env_stat['stat']['mode'] == '0644'
        fail_msg: "The application environment file metadata is incorrect."

    - name: Read environment file
      ansible.builtin.slurp:
        src: /opt/fastapi-tutorial/.env
      register: fastapi_env_content

    - name: Assert non-secret environment configuration
      ansible.builtin.assert:
        that:
          - "'PROJECT_NAME=\"FastAPI Tutorial\"' in (fastapi_env_content['content'] | b64decode)"
          - "'API_VERSION=1.0.0' in (fastapi_env_content['content'] | b64decode)"
        fail_msg: "The non-secret application environment configuration is incorrect."

    - name: Verify systemd unit metadata
      ansible.builtin.stat:
        path: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit_stat

    - name: Assert systemd unit ownership and mode
      ansible.builtin.assert:
        that:
          - fastapi_unit_stat['stat']['exists']
          - fastapi_unit_stat['stat']['pw_name'] == 'root'
          - fastapi_unit_stat['stat']['gr_name'] == 'root'
          - fastapi_unit_stat['stat']['mode'] == '0644'
        fail_msg: "The FastAPI systemd unit metadata is incorrect."

    - name: Read FastAPI systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit_content

    - name: Assert FastAPI systemd unit configuration
      ansible.builtin.assert:
        that:
          - "'User=root' in (fastapi_unit_content['content'] | b64decode)"
          - "'WorkingDirectory=/opt/fastapi-tutorial' in (fastapi_unit_content['content'] | b64decode)"
          - "'Environment=\"PATH=/opt/fastapi-tutorial/venv/bin\"' in (fastapi_unit_content['content'] | b64decode)"
          - "'ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000' in (fastapi_unit_content['content'] | b64decode)"
          - "'Restart=always' in (fastapi_unit_content['content'] | b64decode)"
          - "'After=network.target postgresql.service' in (fastapi_unit_content['content'] | b64decode)"
        fail_msg: "The FastAPI systemd unit configuration is incorrect."

    - name: Verify FastAPI systemd unit syntax
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/fastapi-tutorial.service
      changed_when: false

    - name: Check FastAPI service status
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - fastapi-tutorial
      changed_when: false
      register: fastapi_active

    - name: Check FastAPI service enablement
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - fastapi-tutorial
      changed_when: false
      register: fastapi_enabled

    - name: Assert FastAPI service is enabled and active
      ansible.builtin.assert:
        that:
          - fastapi_active['stdout'] | trim == 'active'
          - fastapi_enabled['stdout'] | trim == 'enabled'
        fail_msg: "The fastapi-tutorial service is not enabled and active."

    - name: Wait for FastAPI TCP endpoint
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8000
        state: started
        timeout: 30

    - name: Verify Uvicorn process command
      ansible.builtin.command:
        argv:
          - pgrep
          - -af
          - /opt/fastapi-tutorial/venv/bin/uvicorn
      changed_when: false
      register: fastapi_process

    - name: Assert Uvicorn is running from the application virtual environment
      ansible.builtin.assert:
        that:
          - "'/opt/fastapi-tutorial/venv/bin/uvicorn' in fastapi_process['stdout']"
        fail_msg: "The expected Uvicorn process is not running."
