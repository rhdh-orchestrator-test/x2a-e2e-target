---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI system packages
  become: true # noqa: R108 - package installation requires root privileges
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
      - libpq-dev
    state: present

- name: Create FastAPI application directory
  become: true # noqa: R108 - creating the root-owned application directory requires root privileges
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize FastAPI tutorial repository # noqa: R104,R106 - repository URL defaults to HTTPS and its operator-configurable source is trusted
  become: true # noqa: R108 - synchronizing the root-owned application directory requires root privileges
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - destination is a role default controlled by the operator
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command path comes from a trusted role default
  become: true # noqa: R108 - the role creates the application environment under a root-owned directory
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path is a role default controlled by the operator

- name: Install Python dependencies # noqa: R113 - dependency installation uses the role's fixed requirements file
  become: true # noqa: R108 - installing dependencies into the root-owned virtual environment requires root
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path is a role default controlled by the operator
    state: present

- name: Enable and start PostgreSQL
  become: true # noqa: R108 - managing the system service requires root privileges
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_database_service }}"
    state: started
    enabled: true

- name: Provision FastAPI PostgreSQL role and database # noqa: L039 - username and password are supplied as validated role credential inputs
  become: true # noqa: R108 - PostgreSQL role provisioning runs as the postgres system user
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ username }}"
    password: "{{ password }}"
    state: present
  no_log: true

- name: Provision FastAPI PostgreSQL database # noqa: L039 - database and username are supplied as validated role credential inputs
  become: true # noqa: R108 - PostgreSQL database provisioning runs as the postgres system user
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ database }}"
    owner: "{{ username }}"
    state: present
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant FastAPI PostgreSQL database privileges # noqa: L039 - database and username are supplied as validated role credential inputs
  become: true # noqa: R108 - PostgreSQL privilege management runs as the postgres system user
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ database }}"
    type: database
    objs: "{{ database }}"
    roles: "{{ username }}"
    privs: ALL
    state: present
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy FastAPI environment file
  become: true # noqa: R108 - deploying the root-owned environment file requires root privileges
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - destination is a role default controlled by the operator
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL={{ fastapi_tutorial_database_url }}
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy FastAPI systemd unit
  become: true # noqa: R108 - deploying the systemd unit under /etc requires root privileges
  ansible.builtin.copy:
    dest: /etc/systemd/system/{{ fastapi_tutorial_service_name }}.service # noqa: R114 - service name is a role default
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_api_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit before starting FastAPI
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI service
  become: true # noqa: R108 - managing the system service requires root privileges
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    state: started
    enabled: true
