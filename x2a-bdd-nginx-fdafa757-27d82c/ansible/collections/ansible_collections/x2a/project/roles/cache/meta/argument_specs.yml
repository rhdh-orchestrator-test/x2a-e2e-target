---
argument_specs:
  main:
    short_description: Configure a standalone authenticated Redis cache
    description:
      - Installs and configures Redis on port 6379 through the eloy.redis collection.
      - Creates the Redis log directory and removes replication directives from the generated configuration.
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for the Redis cache instance.
      cache_redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis replication is enabled.
      cache_redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis cluster mode is enabled.
      cache_redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis Sentinel mode is enabled.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the injected Redis password.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
