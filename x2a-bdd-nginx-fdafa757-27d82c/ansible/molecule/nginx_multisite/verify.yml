---
# Unsupported: the pre-flight diagnostics for log tails and response bodies have no
# concrete expected value, so those diagnostics are not asserted here.
- name: Verify nginx multisite pre-flight checks
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service state
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['nginx.service']['state'] == 'running'
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'

    - name: Check services are enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item_enabled_service }}"
      changed_when: false
      loop:
        - nginx
        - fail2ban
      loop_control:
        loop_var: item_enabled_service
      register: enabled_services

    - name: Assert services are enabled
      ansible.builtin.assert:
        that: item_enabled['stdout'] | trim == 'enabled'
      loop: "{{ enabled_services['results'] }}"
      loop_control:
        loop_var: item_enabled

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv: [nginx, -t]
      changed_when: false

    - name: Inspect expanded nginx configuration
      ansible.builtin.command:
        argv: [nginx, -T]
      changed_when: false
      register: nginx_config

    - name: Assert all server names appear in expanded configuration
      ansible.builtin.assert:
        that:
          - "'test.cluster.local' in nginx_config['stdout']"
          - "'ci.cluster.local' in nginx_config['stdout']"
          - "'status.cluster.local' in nginx_config['stdout']"

    - name: Inspect listening TCP sockets
      ansible.builtin.command:
        argv: [ss, -tlnp]
      changed_when: false
      register: listeners

    - name: Assert nginx listens on ports 80 and 443
      ansible.builtin.assert:
        that:
          - listeners['stdout'] is search('(:|\\])80\\b')
          - listeners['stdout'] is search('(:|\\])443\\b')

    - name: Inspect UFW verbose status
      ansible.builtin.command:
        argv: [ufw, status, verbose]
      changed_when: false
      register: ufw_verbose

    - name: Inspect UFW numbered status
      ansible.builtin.command:
        argv: [ufw, status, numbered]
      changed_when: false
      register: ufw_numbered

    - name: Assert UFW policy and allowed services
      ansible.builtin.assert:
        that:
          - ufw_verbose['stdout'] is search('(?i)deny')
          - ufw_verbose['stdout'] is search('(?i)ssh')
          - ufw_verbose['stdout'] is search('(?i)http')
          - ufw_verbose['stdout'] is search('(?i)https')
          - ufw_numbered['stdout'] is search('(?i)ssh')
          - ufw_numbered['stdout'] is search('(?i)http')
          - ufw_numbered['stdout'] is search('(?i)https')

    - name: Verify nginx security directives
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - server_tokens|limit_req_zone|client_max_body_size|ssl_protocols
          - /etc/nginx/conf.d/security.conf
      changed_when: false

    - name: Verify kernel security directives
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - rp_filter|accept_redirects|accept_source_route|log_martians|disable_ipv6|tcp_syncookies
          - /etc/sysctl.d/99-security.conf
      changed_when: false

    - name: Read SSH authentication policy
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - ^PermitRootLogin|^PasswordAuthentication
          - /etc/ssh/sshd_config
      changed_when: false
      register: ssh_policy

    - name: Assert SSH authentication is disabled
      ansible.builtin.assert:
        that:
          - ssh_policy['stdout'] is search('(?m)^PermitRootLogin\\s+no\\s*$')
          - ssh_policy['stdout'] is search('(?m)^PasswordAuthentication\\s+no\\s*$')

    - name: Verify fail2ban is operational
      ansible.builtin.command:
        argv: [fail2ban-client, "{{ item_fail2ban_action }}"]
      changed_when: false
      loop:
        - ping
        - status
      loop_control:
        loop_var: item_fail2ban_action

    - name: Verify each fail2ban jail is operational
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
          - "{{ item_fail2ban_jail }}"
      changed_when: false
      loop:
        - sshd
        - nginx-http-auth
        - nginx-limit-req
        - nginx-botsearch
      loop_control:
        loop_var: item_fail2ban_jail

    - name: Check required files and site links
      ansible.builtin.stat:
        path: "{{ item_required_path['path'] }}"
        follow: false
      loop:
        - {path: /etc/nginx/nginx.conf, kind: file}
        - {path: /etc/nginx/conf.d/security.conf, kind: file}
        - {path: /etc/nginx/sites-available/test.cluster.local, kind: file}
        - {path: /etc/nginx/sites-available/ci.cluster.local, kind: file}
        - {path: /etc/nginx/sites-available/status.cluster.local, kind: file}
        - {path: /etc/nginx/sites-enabled/test.cluster.local, kind: link}
        - {path: /etc/nginx/sites-enabled/ci.cluster.local, kind: link}
        - {path: /etc/nginx/sites-enabled/status.cluster.local, kind: link}
        - {path: /opt/server/test/index.html, kind: file}
        - {path: /opt/server/ci/index.html, kind: file}
        - {path: /opt/server/status/index.html, kind: file}
        - {path: /etc/ssl/certs/test.cluster.local.crt, kind: file}
        - {path: /etc/ssl/certs/ci.cluster.local.crt, kind: file}
        - {path: /etc/ssl/certs/status.cluster.local.crt, kind: file}
        - {path: /etc/ssl/private/test.cluster.local.key, kind: file}
        - {path: /etc/ssl/private/ci.cluster.local.key, kind: file}
        - {path: /etc/ssl/private/status.cluster.local.key, kind: file}
        - {path: /etc/fail2ban/jail.local, kind: file}
        - {path: /etc/sysctl.d/99-security.conf, kind: file}
        - {path: /etc/ssh/sshd_config, kind: file}
      loop_control:
        loop_var: item_required_path
      register: required_paths

    - name: Assert required files and links exist
      ansible.builtin.assert:
        that:
          - item_required['stat']['exists']
          - >-
            (item_required['item']['kind'] == 'link' and item_required['stat']['islnk']) or
            (item_required['item']['kind'] == 'file' and item_required['stat']['isreg'])
      loop: "{{ required_paths['results'] }}"
      loop_control:
        loop_var: item_required

    - name: Assert the default enabled site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Verify default enabled site is absent
      ansible.builtin.assert:
        that: not default_site['stat']['exists']

    - name: Validate each certificate
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate }}"
          - -noout
          - -subject
          - -dates
      changed_when: false
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_certificate

    - name: Check private-key metadata
      ansible.builtin.stat:
        path: "{{ item_key_path }}"
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key_path
      register: private_keys

    - name: Assert private keys are 0640 root ssl-cert
      ansible.builtin.assert:
        that:
          - item_key['stat']['mode'] == '0640'
          - item_key['stat']['pw_name'] == 'root'
          - item_key['stat']['gr_name'] == 'ssl-cert'
      loop: "{{ private_keys['results'] }}"
      loop_control:
        loop_var: item_key

    - name: Verify HTTP redirects and successful HTTPS responses
      ansible.builtin.uri:
        url: "{{ item_site['url'] }}"
        headers:
          Host: "{{ item_site['name'] }}"
        follow_redirects: none
        validate_certs: "{{ item_site['https'] | bool | ternary(false, omit) }}"
        return_content: false
        status_code: "{{ item_site['status'] }}"
      loop:
        - {name: test.cluster.local, url: http://127.0.0.1/, https: false, status: 301}
        - {name: ci.cluster.local, url: http://127.0.0.1/, https: false, status: 301}
        - {name: status.cluster.local, url: http://127.0.0.1/, https: false, status: 301}
        - {name: test.cluster.local, url: https://127.0.0.1/, https: true, status: 200}
        - {name: ci.cluster.local, url: https://127.0.0.1/, https: true, status: 200}
        - {name: status.cluster.local, url: https://127.0.0.1/, https: true, status: 200}
      loop_control:
        loop_var: item_site
