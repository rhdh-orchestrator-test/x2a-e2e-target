---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure standalone Redis cache service # noqa: L038 - role is provided by the eloy.redis collection declared in requirements.yml
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: "{{ cache_redis_cluster_enabled }}"
    redis_sentinel_enabled: "{{ cache_redis_sentinel_enabled }}"
    redis_replication_enabled: "{{ cache_redis_replication_enabled }}"

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is a role default for the fixed Redis log directory
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Remove replica serve stale data directive # noqa: R115 - the path is a role default for the fixed Redis configuration file
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role default for the fixed Redis configuration file
    regexp: ^replica-serve-stale-data.*$
    state: absent
  notify: Restart Redis after cache configuration changes

- name: Remove replica read only directive # noqa: R115 - the path is a role default for the fixed Redis configuration file
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role default for the fixed Redis configuration file
    regexp: ^replica-read-only.*$
    state: absent
  notify: Restart Redis after cache configuration changes

- name: Remove replica ping period directive # noqa: R115 - the path is a role default for the fixed Redis configuration file
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role default for the fixed Redis configuration file
    regexp: ^repl-ping-replica-period.*$
    state: absent
  notify: Restart Redis after cache configuration changes

- name: Remove client output buffer limit directive # noqa: R115 - the path is a role default for the fixed Redis configuration file
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role default for the fixed Redis configuration file
    regexp: ^client-output-buffer-limit.*$
    state: absent
  notify: Restart Redis after cache configuration changes

- name: Remove replica priority directive # noqa: R115 - the path is a role default for the fixed Redis configuration file
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role default for the fixed Redis configuration file
    regexp: ^replica-priority.*$
    state: absent
  notify: Restart Redis after cache configuration changes
