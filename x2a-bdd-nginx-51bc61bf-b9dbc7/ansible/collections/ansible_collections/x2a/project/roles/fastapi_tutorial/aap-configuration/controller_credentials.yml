---
controller_credentials:
  - name: PostgreSQL Database Credentials - fastapi_tutorial
    description: Credentials for the PostgreSQL user used by the FastAPI application to access the fastapi_db database.
    organization: Default
    credential_type: PostgreSQL Database Credentials
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
