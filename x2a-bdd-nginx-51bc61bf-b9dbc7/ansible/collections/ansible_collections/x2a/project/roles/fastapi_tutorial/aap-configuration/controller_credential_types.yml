---
controller_credential_types:
  - name: PostgreSQL Database Credentials
    description: Credentials for the PostgreSQL user used by the FastAPI application to access the fastapi_db database.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; currently hardcoded in the Chef database-creation command and must be vaulted or rotated.
      required:
        - db_username
        - db_password
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
