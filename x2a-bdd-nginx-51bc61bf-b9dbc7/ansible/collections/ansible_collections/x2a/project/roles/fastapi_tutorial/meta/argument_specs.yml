---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application with PostgreSQL.
    description:
      - Deploys the FastAPI tutorial repository, Python virtual environment, dependencies, PostgreSQL database, and systemd service.
    options:
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the database password.
      fastapi_tutorial_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
        description: System packages required by the application.
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to check out.
      fastapi_tutorial_venv_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_requirements_file:
        type: str
        required: false
        default: /opt/fastapi-tutorial/requirements.txt
        description: Python dependency requirements file.
      fastapi_tutorial_env_file:
        type: str
        required: false
        default: /opt/fastapi-tutorial/.env
        description: Application environment file path.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_service_file:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Systemd unit file path.
      fastapi_tutorial_database_name:
        type: str
        required: false
        default: fastapi_db
        description: PostgreSQL database name.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: localhost
        description: PostgreSQL host used in the application connection string.
      fastapi_tutorial_database_port:
        type: int
        required: false
        default: 5432
        description: PostgreSQL port.
      fastapi_tutorial_database_url:
        type: str
        required: false
        default: postgresql://{{ db_username }}:{{ db_password }}@{{ fastapi_tutorial_database_host }}:{{ fastapi_tutorial_database_port }}/{{ fastapi_tutorial_database_name }}
        description: Database URL written to the application environment file.
      fastapi_tutorial_app_port:
        type: int
        required: false
        default: 8000
        description: Port on which Uvicorn listens.
      db_username:
        type: str
        required: true
        description: AAP-injected PostgreSQL username.
      db_password:
        type: str
        required: true
        description: AAP-injected PostgreSQL password.
