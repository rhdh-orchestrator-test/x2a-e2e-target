# Unsupported pre-flight checks: package/service status, file listings, certificate details,
# Fail2ban jail status, listening sockets, and diagnostics without a stated expected result.
---
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx configuration syntax
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_syntax
      changed_when: false

    - name: Assert nginx configuration syntax is valid
      ansible.builtin.assert:
        that:
          - item_nginx_syntax['rc'] == 0
        fail_msg: Nginx configuration syntax check failed.

    - name: Inspect loaded nginx virtual hosts
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      register: item_nginx_dump
      changed_when: false

    - name: Assert all expected virtual hosts are loaded
      ansible.builtin.assert:
        that:
          - "'test.cluster.local' in item_nginx_dump['stdout']"
          - "'ci.cluster.local' in item_nginx_dump['stdout']"
          - "'status.cluster.local' in item_nginx_dump['stdout']"
        fail_msg: Expected nginx virtual hosts were not found in the loaded configuration.

    - name: Read nginx main configuration
      ansible.builtin.slurp:
        src: /etc/nginx/nginx.conf
      register: item_nginx_config

    - name: Assert expected nginx main configuration settings
      ansible.builtin.assert:
        that:
          - "item_nginx_config['content'] | b64decode is regex('(?m)^user\\s+www-data\\s*;')"
          - "item_nginx_config['content'] | b64decode is regex('(?m)^worker_processes\\s+auto\\s*;')"
          - "item_nginx_config['content'] | b64decode is regex('(?m)^\\s*worker_connections\\s+768\\s*;')"
          - "item_nginx_config['content'] | b64decode is regex('(?m)^\\s*gzip\\s+on\\s*;')"
        fail_msg: Expected nginx main configuration settings are missing.

    - name: Read nginx security configuration
      ansible.builtin.slurp:
        src: /etc/nginx/conf.d/security.conf
      register: item_nginx_security

    - name: Assert expected nginx security configuration settings
      ansible.builtin.assert:
        that:
          - "item_nginx_security['content'] | b64decode is regex('server_tokens\\s+off')"
          - "item_nginx_security['content'] | b64decode is regex('limit_req_zone')"
          - "item_nginx_security['content'] | b64decode is regex('client_max_body_size')"
          - "'TLSv1.2' in (item_nginx_security['content'] | b64decode)"
          - "'TLSv1.3' in (item_nginx_security['content'] | b64decode)"
        fail_msg: Expected nginx security configuration settings are missing.

    - name: Check HTTP endpoints redirect to HTTPS
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_site['host'] }}"
        follow_redirects: none
        return_content: false
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_site
      register: item_http_endpoint

    - name: Assert HTTP endpoints return HTTPS redirects
      ansible.builtin.assert:
        that:
          - item_http_result['status'] == 301
          - item_http_result['headers']['location'] is match('^https://')
        loop: "{{ item_http_endpoint['results'] }}"
        loop_control:
          loop_var: item_http_result
        fail_msg: An HTTP endpoint did not return the expected HTTPS redirect.

    - name: Check HTTPS endpoints
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_https_site['host'] }}"
        validate_certs: false
        return_content: false
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_https_site
      register: item_https_endpoint

    - name: Assert HTTPS endpoints return success
      ansible.builtin.assert:
        that:
          - item_https_result['status'] == 200
        loop: "{{ item_https_endpoint['results'] }}"
        loop_control:
          loop_var: item_https_result
        fail_msg: An HTTPS endpoint did not return HTTP 200.

    - name: Check UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: item_ufw_status
      changed_when: false

    - name: Assert UFW is active with the expected policy and allowed ports
      ansible.builtin.assert:
        that:
          - "'Status: active' in item_ufw_status['stdout']"
          - "item_ufw_status['stdout'] is regex('Default: deny \\(incoming\\)')"
          - "item_ufw_status['stdout'] is regex('22/tcp\\s+ALLOW')"
          - "item_ufw_status['stdout'] is regex('80/tcp\\s+ALLOW')"
          - "item_ufw_status['stdout'] is regex('443/tcp\\s+ALLOW')"
        fail_msg: UFW does not have the expected active policy and allowed ports.

    - name: Read SSH daemon configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_sshd_config

    - name: Assert SSH hardening settings
      ansible.builtin.assert:
        that:
          - "item_sshd_config['content'] | b64decode is regex('(?m)^PermitRootLogin no$')"
          - "item_sshd_config['content'] | b64decode is regex('(?m)^PasswordAuthentication no$')"
        fail_msg: Expected SSH hardening settings are missing.

    - name: Read expected kernel security settings
      ansible.builtin.command:
        argv:
          - sysctl
          - "{{ item_sysctl['name'] }}"
      loop:
        - name: net.ipv4.conf.default.rp_filter
          value: '1'
        - name: net.ipv4.conf.all.rp_filter
          value: '1'
        - name: net.ipv4.conf.all.accept_redirects
          value: '0'
        - name: net.ipv6.conf.all.disable_ipv6
          value: '1'
        - name: net.ipv4.tcp_syncookies
          value: '1'
        - name: net.ipv4.tcp_max_syn_backlog
          value: '2048'
      loop_control:
        loop_var: item_sysctl
      register: item_sysctl_result
      changed_when: false

    - name: Assert expected kernel security settings
      ansible.builtin.assert:
        that:
          - item_sysctl_check['stdout'] is search('=\\s*' ~ item_sysctl_check['item']['value'] ~ '\\s*$')
        loop: "{{ item_sysctl_result['results'] }}"
        loop_control:
          loop_var: item_sysctl_check
        fail_msg: An expected kernel security setting is not applied.
