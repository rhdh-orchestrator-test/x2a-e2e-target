- name: Install redis server
  ansible.builtin.package:
    name: '{{ redis_package }}'
    state: present
- name: Configure redis
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart redis
- name: Enable and start redis server
  ansible.builtin.service:
    name: '{{ redis_service }}'
    state: started
    enabled: true
