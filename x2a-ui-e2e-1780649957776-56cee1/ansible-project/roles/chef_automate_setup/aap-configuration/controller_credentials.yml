---
controller_credentials:
- name: Chef User Credentials - chef_automate_setup
  description: Credential for chef_automate_setup
  organization: Default
  credential_type: Chef User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
