---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install cache packages
  ansible.builtin.package:
    name: "{{ cache_packages }}"
    state: present
- name: Ensure Redis group exists
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    system: true
    state: present
- name: Ensure Redis user exists
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present
- name: Create Redis configuration directory
  ansible.builtin.file:
    path: "{{ cache_redis_config_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}"
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    recurse: true
- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}"
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0640"
    backup: true
  notify: Restart redis
- name: Clean up deprecated Redis configuration settings
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}"
    regexp: "{{ item_redis_cleanup }}"
    state: absent
  loop:
    - ^replica-serve-stale-data.*$
    - ^replica-read-only.*$
    - ^repl-ping-replica-period.*$
    - ^client-output-buffer-limit.*$
    - ^replica-priority.*$
  loop_control:
    loop_var: item_redis_cleanup
  notify: Restart redis
- name: Start and enable memcached service
  ansible.builtin.service:
    name: "{{ cache_memcached_service }}"
    state: started
    enabled: true
- name: Start and enable Redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    state: started
    enabled: true
