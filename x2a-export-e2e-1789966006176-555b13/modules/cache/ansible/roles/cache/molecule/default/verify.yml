---
- name: Verify cache services and configuration
  hosts: all
  gather_facts: false
  vars:
    redis_password: redis_secure_password_123
  tasks:
    - name: Check cache packages are installed
      ansible.builtin.package_facts:

    - name: Assert cache packages are installed
      ansible.builtin.assert:
        that:
          - "'memcached' in ansible_facts.packages"
          - "'redis-server' in ansible_facts.packages"
        fail_msg: "Required cache packages not installed"

    - name: Check Redis log directory exists
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory was created
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['exists']
          - redis_log_dir_stat['stat']['isdir']
          - redis_log_dir_stat['stat']['pw_name'] == 'redis'
          - redis_log_dir_stat['stat']['gr_name'] == 'redis'
          - redis_log_dir_stat['stat']['mode'] == '0755'
        fail_msg: "Redis log directory not properly configured"

    - name: Check Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_stat

    - name: Assert Redis configuration file was created
      ansible.builtin.assert:
        that:
          - redis_config_stat['stat']['exists']
          - redis_config_stat['stat']['size'] > 0
          - redis_config_stat['stat']['pw_name'] == 'redis'
          - redis_config_stat['stat']['gr_name'] == 'redis'
          - redis_config_stat['stat']['mode'] == '0640'
        fail_msg: "Redis configuration file not properly configured"

    - name: Read Redis configuration file
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis configuration contains required settings
      ansible.builtin.assert:
        that:
          - "'requirepass redis_secure_password_123' in redis_config_content['content'] | b64decode"
          - "'port 6379' in redis_config_content['content'] | b64decode"
        fail_msg: "Redis configuration missing required settings"

    - name: Assert deprecated Redis settings are removed
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in redis_config_content['content'] | b64decode"
          - "'replica-read-only' not in redis_config_content['content'] | b64decode"
          - "'repl-ping-replica-period' not in redis_config_content['content'] | b64decode"
          - "'client-output-buffer-limit' not in redis_config_content['content'] | b64decode"
          - "'replica-priority' not in redis_config_content['content'] | b64decode"
        fail_msg: "Deprecated Redis settings still present in configuration"

    - name: Check service status
      ansible.builtin.service_facts:

    - name: Assert memcached service is running
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - ansible_facts.services['memcached.service']['state'] == 'running'
          - ansible_facts.services['memcached.service']['status'] == 'enabled'
        fail_msg: "Memcached service not running or enabled"

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - ansible_facts.services['redis-server.service']['state'] == 'running'
          - ansible_facts.services['redis-server.service']['status'] == 'enabled'
        fail_msg: "Redis service not running or enabled"

    - name: Check memcached port is listening
      ansible.builtin.wait_for:
        port: 11211
        host: localhost
        timeout: 10

    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: localhost
        timeout: 10

    - name: Test memcached connectivity
      ansible.builtin.command:
        cmd: echo "stats"
        stdin: true
      register: memcached_test
      changed_when: false
      failed_when: false

    - name: Test Redis connectivity with authentication
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 ping
      register: redis_auth_test
      changed_when: false
      failed_when: false

    - name: Assert Redis authentication works
      ansible.builtin.assert:
        that:
          - redis_auth_test['rc'] == 0
          - "'PONG' in redis_auth_test['stdout']"
        fail_msg: "Redis authentication test failed"

    - name: Test Redis without authentication should fail
      ansible.builtin.command:
        cmd: redis-cli -p 6379 ping
      register: redis_no_auth_test
      changed_when: false
      failed_when: false

    - name: Assert Redis requires authentication
      ansible.builtin.assert:
        that:
          - redis_no_auth_test['rc'] != 0
        fail_msg: "Redis should require authentication but doesn't"