- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache SSL config
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/apache2/mods-available
  - name: Create mock Apache SSL config file with vulnerable configuration
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        # This simulates the vulnerable configuration before the role is applied

        SSLProtocol all -SSLv3

        SSLCipherSuite HIGH:!aNULL:!MD5

        SSLHonorCipherOrder on

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Fix SSL in Apache (simulating role)
    ansible.builtin.replace:
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
