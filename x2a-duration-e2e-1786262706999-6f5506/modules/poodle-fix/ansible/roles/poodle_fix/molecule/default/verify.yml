---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check if the SSL config file exists
    - name: Check if Apache SSL config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_conf_file

    - name: Assert SSL config file exists
      ansible.builtin.assert:
        that:
          - ssl_conf_file.stat.exists
          - ssl_conf_file.stat.isreg
        fail_msg: "Apache SSL config file does not exist"
        success_msg: "Apache SSL config file exists"

    # Check the content of the SSL config file
    - name: Get SSL config file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_conf_content

    - name: Decode SSL config file content
      ansible.builtin.set_fact:
        ssl_conf_decoded: "{{ ssl_conf_content.content | b64decode }}"

    - name: Assert SSL protocol is properly configured
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in ssl_conf_decoded"
          - "'SSLProtocol all -SSLv3' not in ssl_conf_decoded"
        fail_msg: "SSL protocol configuration was not updated correctly"
        success_msg: "SSL protocol configuration was updated correctly to mitigate POODLE vulnerability"

    # The following checks would be performed in a real environment but can't run in a container
    # They are tagged with molecule-notest to be skipped during molecule testing

    - name: Check if Apache is installed
      ansible.builtin.command: systemctl status apache2
      register: apache_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Apache is running
      ansible.builtin.assert:
        that:
          - apache_status.rc == 0
        fail_msg: "Apache is not running"
        success_msg: "Apache is running"
      tags: molecule-notest

    - name: Check if SSH is installed
      ansible.builtin.command: systemctl status sshd
      register: ssh_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert SSH is running
      ansible.builtin.assert:
        that:
          - ssh_status.rc == 0
        fail_msg: "SSH is not running"
        success_msg: "SSH is running"
      tags: molecule-notest

    - name: Check if SSL module is enabled in Apache
      ansible.builtin.command: apache2ctl -M
      register: apache_modules
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert SSL module is enabled
      ansible.builtin.assert:
        that:
          - "'ssl_module' in apache_modules.stdout"
        fail_msg: "SSL module is not enabled in Apache"
        success_msg: "SSL module is enabled in Apache"
      tags: molecule-notest

    - name: Test SSL connection security
      ansible.builtin.command: nmap --script ssl-enum-ciphers -p 443 localhost
      register: nmap_result
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert no vulnerable SSL protocols are enabled
      ansible.builtin.assert:
        that:
          - "'SSLv3' not in nmap_result.stdout"
          - "'TLSv1.0' not in nmap_result.stdout"
          - "'TLSv1.1' not in nmap_result.stdout"
        fail_msg: "Vulnerable SSL protocols are still enabled"
        success_msg: "No vulnerable SSL protocols are enabled"
      tags: molecule-notest