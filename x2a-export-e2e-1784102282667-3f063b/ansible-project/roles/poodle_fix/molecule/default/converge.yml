---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create directory structure for Apache mods-available
      ansible.builtin.file:
        path: "/tmp/molecule_test/etc/apache2/mods-available"
        state: directory
        mode: "0755"

    - name: Create sample Apache SSL configuration file
      ansible.builtin.copy:
        content: |
          # Sample Apache SSL configuration file
          # This represents the file before the role makes changes
          SSLProtocol all -SSLv3
          SSLCipherSuite HIGH:!aNULL:!MD5
        dest: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
        mode: "0644"
        
    # Simulate what the role would do
    - name: Fix SSL in Apache (simulate role action)
      ansible.builtin.replace:
        dest: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
        regexp: ^SSLProtocol.*$
        replace: SSLProtocol -all +TLSv1.2