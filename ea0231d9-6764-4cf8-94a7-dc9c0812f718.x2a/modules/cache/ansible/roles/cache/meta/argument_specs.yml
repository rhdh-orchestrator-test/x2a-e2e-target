---
argument_specs:
  main:
    short_description: Install and configure Redis cache server
    description:
      - Installs Redis server package and ensures the service is running and enabled.
      - Provides a simple Redis cache instance with default configuration.
    options:
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Package name for Redis server installation.
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Service name for Redis server management.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port Redis server listens on.
      cache_redis_bind:
        type: str
        required: false
        default: 127.0.0.1
        description: IP address Redis server binds to.
      cache_redis_data_dir:
        type: str
        required: false
        default: /var/lib/redis
        description: Directory where Redis stores data files.
      cache_redis_log_file:
        type: str
        required: false
        default: /var/log/redis/redis-server.log
        description: Path to Redis server log file.
