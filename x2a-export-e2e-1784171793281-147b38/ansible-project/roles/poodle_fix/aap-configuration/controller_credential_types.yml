---
controller_credential_types:
- name: Chef Deployment Credentials
  description: Credentials used in Chef Automate and Chef Infra Server deployment
    scripts
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Automate/Infra Server authentication
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Automate/Infra Server authentication
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
