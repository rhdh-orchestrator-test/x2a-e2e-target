---
- name: Verify nginx configuration files
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/nginx/nginx.conf
        - /tmp/molecule_test/etc/nginx/conf.d/security.conf
        - /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_config
      register: nginx_config_stat_results

    - name: Assert nginx configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected nginx configuration file not found"
      loop: "{{ nginx_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

- name: Verify nginx site symbolic links
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx site symbolic links exist
      ansible.builtin.stat:
        path: "{{ item_link }}"
      loop:
        - /tmp/molecule_test/etc/nginx/sites-enabled/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_link
      register: nginx_link_stat_results

    - name: Assert nginx site symbolic links were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['islnk']
        fail_msg: "Expected nginx site symbolic link not found"
      loop: "{{ nginx_link_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

- name: Verify static HTML content
  hosts: all
  gather_facts: false
  tasks:
    - name: Check static HTML files exist
      ansible.builtin.stat:
        path: "{{ item_html }}"
      loop:
        - /tmp/molecule_test/opt/server/test/index.html
        - /tmp/molecule_test/opt/server/ci/index.html
        - /tmp/molecule_test/opt/server/status/index.html
      loop_control:
        loop_var: item_html
      register: html_stat_results

    - name: Assert static HTML files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected HTML file not found"
      loop: "{{ html_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read HTML content for verification
      ansible.builtin.slurp:
        src: "{{ item_html_content }}"
      loop:
        - /tmp/molecule_test/opt/server/test/index.html
        - /tmp/molecule_test/opt/server/ci/index.html
        - /tmp/molecule_test/opt/server/status/index.html
      loop_control:
        loop_var: item_html_content
      register: html_content_results

    - name: Assert HTML content contains expected text
      ansible.builtin.assert:
        that:
          - "'test.cluster.local' in (item_content['content'] | b64decode)" 
        fail_msg: "HTML content does not contain expected domain"
      loop: "{{ html_content_results['results'] }}"
      loop_control:
        loop_var: item_content
      when: "'test' in item_content['item']"

    - name: Assert CI HTML content contains expected text
      ansible.builtin.assert:
        that:
          - "'ci.cluster.local' in (item_content['content'] | b64decode)"
        fail_msg: "CI HTML content does not contain expected domain"
      loop: "{{ html_content_results['results'] }}"
      loop_control:
        loop_var: item_content
      when: "'ci' in item_content['item']"

    - name: Assert status HTML content contains expected text
      ansible.builtin.assert:
        that:
          - "'status.cluster.local' in (item_content['content'] | b64decode)"
        fail_msg: "Status HTML content does not contain expected domain"
      loop: "{{ html_content_results['results'] }}"
      loop_control:
        loop_var: item_content
      when: "'status' in item_content['item']"

- name: Verify SSL certificates
  hosts: all
  gather_facts: false
  tasks:
    - name: Check SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ item_cert }}"
      loop:
        - /tmp/molecule_test/etc/ssl/certs/test.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/ci.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_cert
      register: cert_stat_results

    - name: Assert SSL certificate files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate file not found"
      loop: "{{ cert_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check SSL private key files exist
      ansible.builtin.stat:
        path: "{{ item_key }}"
      loop:
        - /tmp/molecule_test/etc/ssl/private/test.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/ci.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: key_stat_results

    - name: Assert SSL private key files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
          - item_result['stat']['mode'] == '0640'
        fail_msg: "Expected SSL private key file not found or incorrect permissions"
      loop: "{{ key_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

- name: Verify security configuration files
  hosts: all
  gather_facts: false
  tasks:
    - name: Check security configuration files exist
      ansible.builtin.stat:
        path: "{{ item_security }}"
      loop:
        - /tmp/molecule_test/etc/fail2ban/jail.local
        - /tmp/molecule_test/etc/sysctl.d/99-security.conf
        - /tmp/molecule_test/etc/ssh/sshd_config
      loop_control:
        loop_var: item_security
      register: security_stat_results

    - name: Assert security configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected security configuration file not found"
      loop: "{{ security_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read fail2ban configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/fail2ban/jail.local
      register: fail2ban_config

    - name: Assert fail2ban configuration contains expected jails
      ansible.builtin.assert:
        that:
          - "'[sshd]' in (fail2ban_config['content'] | b64decode)"
          - "'[nginx-http-auth]' in (fail2ban_config['content'] | b64decode)"
          - "'enabled = true' in (fail2ban_config['content'] | b64decode)"
        fail_msg: "fail2ban configuration missing expected jails"

    - name: Read sysctl security configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-security.conf
      register: sysctl_config

    - name: Assert sysctl configuration contains security settings
      ansible.builtin.assert:
        that:
          - "'net.ipv4.conf.default.rp_filter = 1' in (sysctl_config['content'] | b64decode)"
          - "'net.ipv4.conf.all.accept_redirects = 0' in (sysctl_config['content'] | b64decode)"
          - "'net.ipv4.icmp_echo_ignore_all = 1' in (sysctl_config['content'] | b64decode)"
        fail_msg: "sysctl configuration missing expected security settings"

    - name: Read SSH configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_config

    - name: Assert SSH configuration has security settings
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (ssh_config['content'] | b64decode)"
          - "'PasswordAuthentication no' in (ssh_config['content'] | b64decode)"
        fail_msg: "SSH configuration missing expected security settings"

- name: Verify nginx site configurations contain expected directives
  hosts: all
  gather_facts: false
  tasks:
    - name: Read nginx site configurations
      ansible.builtin.slurp:
        src: "{{ item_site_config }}"
      loop:
        - /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site_config
      register: site_config_results

    - name: Assert site configurations contain SSL and server directives
      ansible.builtin.assert:
        that:
          - "'listen 443 ssl http2' in (item_site_result['content'] | b64decode)"
          - "'ssl_certificate /etc/ssl/certs/' in (item_site_result['content'] | b64decode)"
          - "'ssl_certificate_key /etc/ssl/private/' in (item_site_result['content'] | b64decode)"
          - "'return 301 https://' in (item_site_result['content'] | b64decode)"
        fail_msg: "Site configuration missing expected SSL directives"
      loop: "{{ site_config_results['results'] }}"
      loop_control:
        loop_var: item_site_result

- name: Verify service checks that cannot run in container
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx service would be running
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert nginx service is active
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
        fail_msg: "nginx service not running"
      tags: molecule-notest

    - name: Check fail2ban service would be running
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert fail2ban service is active
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
        fail_msg: "fail2ban service not running"
      tags: molecule-notest

    - name: Check HTTP port would be listening
      ansible.builtin.wait_for:
        port: 80
        host: 0.0.0.0
        timeout: 5
      tags: molecule-notest

    - name: Check HTTPS port would be listening
      ansible.builtin.wait_for:
        port: 443
        host: 0.0.0.0
        timeout: 5
      tags: molecule-notest

    - name: Test HTTP to HTTPS redirect
      ansible.builtin.uri:
        url: http://test.cluster.local/
        method: GET
        follow_redirects: none
        status_code: 301
      tags: molecule-notest

    - name: Test HTTPS response
      ansible.builtin.uri:
        url: https://test.cluster.local/
        method: GET
        validate_certs: false
        status_code: 200
      tags: molecule-notest