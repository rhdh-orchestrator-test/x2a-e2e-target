---
- name: Check if openssl is installed
  ansible.builtin.command:
    cmd: which openssl
  register: openssl_installed
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - molecule-notest
- name: Check if port 443 is listening
  ansible.builtin.wait_for:
    port: "{{ https_port }}"
    state: started
    timeout: 5
  register: port_check
  ignore_errors: true
  tags:
    - molecule-notest
- name: Verify port 443 is listening
  ansible.builtin.assert:
    that:
      - port_check is success
    fail_msg: Port {{ https_port }} is not listening
    success_msg: Port {{ https_port }} is listening
  tags:
    - https
    - security
    - compliance
    - molecule-notest
- name: Test HTTPS connectivity and status code
  ansible.builtin.uri:
    url: https://{{ https_host }}/
    validate_certs: false
    return_content: true
  register: https_response
  ignore_errors: true
  tags:
    - molecule-notest
- name: Verify HTTPS status code is 200
  ansible.builtin.assert:
    that:
      - https_response.status == https_expected_status
    fail_msg: HTTPS status code is not {{ https_expected_status }}
    success_msg: HTTPS status code is {{ https_expected_status }}
  when: https_response is success
  tags:
    - https
    - security
    - compliance
    - molecule-notest
- name: Verify HTTPS response contains expected content
  ansible.builtin.assert:
    that:
      - https_expected_content in https_response.content
    fail_msg: HTTPS response does not contain '{{ https_expected_content }}'
    success_msg: HTTPS response contains expected content
  when: https_response is success
  tags:
    - https
    - security
    - compliance
    - molecule-notest
- name: Check SSL3 protocol status
  ansible.builtin.shell:
    cmd: set -o pipefail && echo | openssl s_client -connect {{ https_host }}:{{ https_port }} -ssl3 2>&1 || echo 'SSL3 disabled'
    executable: /bin/bash
  register: ssl3_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: openssl_installed.rc == 0
  tags:
    - molecule-notest
- name: Verify SSL3 is disabled
  ansible.builtin.assert:
    that:
      - "'SSL3 disabled' in ssl3_check.stdout or 'ssl handshake failure' in ssl3_check.stdout"
    fail_msg: SSL3 protocol is enabled (security risk)
    success_msg: SSL3 protocol is properly disabled
  when: openssl_installed.rc == 0
  tags:
    - https
    - security
    - compliance
    - molecule-notest
- name: Check TLS 1.2 protocol status
  ansible.builtin.shell:
    cmd: set -o pipefail && echo | openssl s_client -connect {{ https_host }}:{{ https_port }} -tls1_2 2>&1
    executable: /bin/bash
  register: tls12_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: openssl_installed.rc == 0
  tags:
    - molecule-notest
- name: Verify TLS 1.2 is enabled
  ansible.builtin.assert:
    that:
      - tls12_check.rc == 0
      - "'Protocol  : TLSv1.2' in tls12_check.stdout"
    fail_msg: TLS 1.2 protocol is not enabled
    success_msg: TLS 1.2 protocol is properly enabled
  when: openssl_installed.rc == 0
  tags:
    - https
    - security
    - compliance
    - molecule-notest
- name: Display HTTPS security test results
  ansible.builtin.debug:
    msg: "HTTPS Security Tests: {{ 'All tests PASSED' if (port_check is success and https_response is success and https_response.status == https_expected_status and
      https_expected_content in https_response.content and (openssl_installed.rc != 0 or ('SSL3 disabled' in ssl3_check.stdout or 'ssl handshake failure' in ssl3_check.stdout))
      and (openssl_installed.rc != 0 or tls12_check.rc == 0)) else 'Some tests FAILED' }}"
  tags:
    - molecule-notest
