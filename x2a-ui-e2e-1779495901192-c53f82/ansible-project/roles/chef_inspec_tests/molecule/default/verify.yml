---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    ssh_config_path: /tmp/molecule_test/etc/ssh/sshd_config
    https_host: localhost
    https_port: 443
    https_expected_content: Hello, world!
    https_expected_status: 200
  tasks:
    # SSH Security Tests
    - name: Check if SSH config file exists
      ansible.builtin.stat:
        path: "{{ ssh_config_path }}"
      register: ssh_config_file

    - name: Assert SSH config file exists
      ansible.builtin.assert:
        that:
          - ssh_config_file.stat.exists
          - ssh_config_file.stat.isreg
        fail_msg: "SSH config file not found"
        success_msg: "SSH config file exists"

    - name: Get SSH config file content
      ansible.builtin.slurp:
        src: "{{ ssh_config_path }}"
      register: ssh_config_content
      when: ssh_config_file.stat.exists

    - name: Check PermitRootLogin setting
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (ssh_config_content.content | b64decode)"
        fail_msg: "SSH root login is not properly disabled"
        success_msg: "SSH root login is properly disabled"
      when: ssh_config_file.stat.exists

    # HTTPS Website Tests
    - name: Check if HTML file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/www/html/index.html
      register: html_file

    - name: Assert HTML file exists
      ansible.builtin.assert:
        that:
          - html_file.stat.exists
          - html_file.stat.isreg
        fail_msg: "HTML file not found"
        success_msg: "HTML file exists"

    - name: Get HTML file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/www/html/index.html
      register: html_content
      when: html_file.stat.exists

    - name: Check HTML content
      ansible.builtin.assert:
        that:
          - "'Hello, world!' in (html_content.content | b64decode)"
        fail_msg: "HTML content does not contain expected text"
        success_msg: "HTML content contains expected text"
      when: html_file.stat.exists

    # SSL/TLS Tests
    - name: Check if SSL3 test result file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/ssl3_test_result.txt
      register: ssl3_file

    - name: Assert SSL3 test result file exists
      ansible.builtin.assert:
        that:
          - ssl3_file.stat.exists
          - ssl3_file.stat.isreg
        fail_msg: "SSL3 test result file not found"
        success_msg: "SSL3 test result file exists"

    - name: Get SSL3 test result content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/ssl3_test_result.txt
      register: ssl3_content
      when: ssl3_file.stat.exists

    - name: Check SSL3 is disabled
      ansible.builtin.assert:
        that:
          - "'SSL3 disabled' in (ssl3_content.content | b64decode) or 'ssl handshake failure' in (ssl3_content.content | b64decode)"
        fail_msg: "SSL3 is not properly disabled"
        success_msg: "SSL3 is properly disabled"
      when: ssl3_file.stat.exists

    - name: Check if TLS 1.2 test result file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tls12_test_result.txt
      register: tls12_file

    - name: Assert TLS 1.2 test result file exists
      ansible.builtin.assert:
        that:
          - tls12_file.stat.exists
          - tls12_file.stat.isreg
        fail_msg: "TLS 1.2 test result file not found"
        success_msg: "TLS 1.2 test result file exists"

    - name: Get TLS 1.2 test result content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/tls12_test_result.txt
      register: tls12_content
      when: tls12_file.stat.exists

    - name: Check TLS 1.2 is enabled
      ansible.builtin.assert:
        that:
          - "'Protocol  : TLSv1.2' in (tls12_content.content | b64decode)"
        fail_msg: "TLS 1.2 is not properly enabled"
        success_msg: "TLS 1.2 is properly enabled"
      when: tls12_file.stat.exists

    # The following tests cannot run in a container environment
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: "{{ https_port }}"
        state: started
        timeout: 5
      register: port_check
      ignore_errors: true
      tags: molecule-notest

    - name: Verify port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is success
        fail_msg: "Port {{ https_port }} is not listening"
        success_msg: "Port {{ https_port }} is listening"
      tags: molecule-notest

    - name: Test HTTPS connectivity and status code
      ansible.builtin.uri:
        url: "https://{{ https_host }}/"
        validate_certs: false
        return_content: true
      register: https_response
      ignore_errors: true
      tags: molecule-notest

    - name: Verify HTTPS status code is 200
      ansible.builtin.assert:
        that:
          - https_response.status == https_expected_status
        fail_msg: "HTTPS status code is not {{ https_expected_status }}"
        success_msg: "HTTPS status code is {{ https_expected_status }}"
      when: https_response is success
      tags: molecule-notest