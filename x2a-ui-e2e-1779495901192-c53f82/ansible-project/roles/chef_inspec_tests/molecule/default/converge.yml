---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/ssh
        - /tmp/molecule_test/var/www/html

    - name: Create mock SSH config file
      ansible.builtin.copy:
        content: |
          # Mock sshd_config file for testing
          Protocol 2
          PermitRootLogin no
          PasswordAuthentication yes
          ChallengeResponseAuthentication no
          UsePAM yes
          X11Forwarding yes
          PrintMotd no
        dest: /tmp/molecule_test/etc/ssh/sshd_config
        mode: "0644"

    - name: Create mock HTML file
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>Test Page</title>
          </head>
          <body>
            <h1>Hello, world!</h1>
            <p>This is a test page for molecule testing.</p>
          </body>
          </html>
        dest: /tmp/molecule_test/var/www/html/index.html
        mode: "0644"

    # Create mock SSL test results
    - name: Create mock SSL3 test result file
      ansible.builtin.copy:
        content: |
          140111513181696:error:1409E0E5:SSL routines:ssl3_write_bytes:ssl handshake failure:s3_pkt.c:659:
          SSL3 disabled
        dest: /tmp/molecule_test/ssl3_test_result.txt
        mode: "0644"

    - name: Create mock TLS 1.2 test result file
      ansible.builtin.copy:
        content: |
          depth=0 CN = localhost
          verify error:num=18:self signed certificate
          verify return:1
          depth=0 CN = localhost
          verify return:1
          Protocol  : TLSv1.2
          Cipher    : ECDHE-RSA-AES256-GCM-SHA384
        dest: /tmp/molecule_test/tls12_test_result.txt
        mode: "0644"