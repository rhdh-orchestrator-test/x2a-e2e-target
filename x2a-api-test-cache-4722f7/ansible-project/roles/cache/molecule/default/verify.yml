---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    redis_password: redis_secure_password_123
  tasks:
    - name: Check Redis and memcached packages are installed
      ansible.builtin.package_facts:

    - name: Assert Redis and memcached packages are installed
      ansible.builtin.assert:
        that:
          - "'redis-server' in ansible_facts.packages"
          - "'memcached' in ansible_facts.packages"
        fail_msg: "Required cache packages not installed"

    - name: Check Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_stat

    - name: Assert Redis configuration file exists
      ansible.builtin.assert:
        that:
          - redis_config_stat['stat']['exists']
          - redis_config_stat['stat']['size'] > 0
        fail_msg: "Redis configuration file not found or empty"

    - name: Check Redis log directory exists
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory exists with correct permissions
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['exists']
          - redis_log_dir_stat['stat']['isdir']
          - redis_log_dir_stat['stat']['pw_name'] == 'redis'
          - redis_log_dir_stat['stat']['gr_name'] == 'redis'
          - redis_log_dir_stat['stat']['mode'] == '0755'
        fail_msg: "Redis log directory not found or incorrect permissions"

    - name: Check Redis configuration content
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis password is configured
      ansible.builtin.assert:
        that:
          - "'requirepass redis_secure_password_123' in redis_config_content['content'] | b64decode"
        fail_msg: "Redis password not configured correctly"

    - name: Assert replica settings are cleaned up
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in redis_config_content['content'] | b64decode"
          - "'replica-read-only' not in redis_config_content['content'] | b64decode"
          - "'repl-ping-replica-period' not in redis_config_content['content'] | b64decode"
          - "'client-output-buffer-limit' not in redis_config_content['content'] | b64decode"
          - "'replica-priority' not in redis_config_content['content'] | b64decode"
        fail_msg: "Replica settings not properly cleaned up from Redis config"

    - name: Check service facts
      ansible.builtin.service_facts:

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
          - "ansible_facts.services['redis-server.service']['status'] == 'enabled'"
        fail_msg: "Redis service not running or not enabled"

    - name: Assert memcached service is running
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - "ansible_facts.services['memcached.service']['state'] == 'running'"
          - "ansible_facts.services['memcached.service']['status'] == 'enabled'"
        fail_msg: "Memcached service not running or not enabled"

    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: localhost
        timeout: 10

    - name: Check memcached port is listening
      ansible.builtin.wait_for:
        port: 11211
        host: localhost
        timeout: 10

    - name: Test Redis connectivity and authentication
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 ping
      register: redis_ping_result
      changed_when: false

    - name: Assert Redis responds to ping
      ansible.builtin.assert:
        that:
          - redis_ping_result['stdout'] == 'PONG'
        fail_msg: "Redis not responding to ping command"

    - name: Test Redis set/get operations
      ansible.builtin.command:
        cmd: "{{ item_redis_cmd }}" # noqa: R101 - loop over hardcoded test commands in same task
      loop:
        - redis-cli -p 6379 -a redis_secure_password_123 set molecule_test_key "molecule_test_value"
        - redis-cli -p 6379 -a redis_secure_password_123 get molecule_test_key
        - redis-cli -p 6379 -a redis_secure_password_123 del molecule_test_key
      loop_control:
        loop_var: item_redis_cmd
      register: redis_ops_results
      changed_when: false

    - name: Assert Redis operations work correctly
      ansible.builtin.assert:
        that:
          - redis_ops_results['results'][0]['stdout'] == 'OK'
          - redis_ops_results['results'][1]['stdout'] == 'molecule_test_value'
          - redis_ops_results['results'][2]['stdout'] == '1'
        fail_msg: "Redis set/get/del operations failed"

    - name: Test memcached connectivity
      ansible.builtin.command:
        cmd: echo "stats" | nc localhost 11211
      register: memcached_stats_result
      changed_when: false

    - name: Assert memcached responds to stats command
      ansible.builtin.assert:
        that:
          - "'STAT version' in memcached_stats_result['stdout']"
          - "'END' in memcached_stats_result['stdout']"
        fail_msg: "Memcached not responding to stats command"
