---
controller_credential_types:
  - name: API Configuration
    description: Credential type for API Configuration
    kind: cloud
    inputs:
      fields:
        - id: endpoint
          type: string
          label: API Endpoint URL
          help_text: URL for the API service endpoint
        - id: username
          type: string
          label: API Username
          help_text: Username for API authentication
        - id: api_token
          type: string
          label: API Token
          secret: true
          help_text: Authentication token for API access
      required:
        - endpoint
        - username
        - api_token
    injectors:
      extra_vars:
        endpoint: !unsafe "{{ endpoint }}"
        username: !unsafe "{{ username }}"
        api_token: !unsafe "{{ api_token }}"
