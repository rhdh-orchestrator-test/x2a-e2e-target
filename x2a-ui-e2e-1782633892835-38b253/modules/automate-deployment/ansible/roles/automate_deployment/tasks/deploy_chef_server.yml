---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Check if zip file exists
  ansible.builtin.stat:
    path: /tmp/chef-automate_linux_amd64.zip
  register: zip_file
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c /tmp/chef-automate_linux_amd64.zip > {{ automate_cli_path }}
  args:
    creates: "{{ automate_cli_path }}"
  when: zip_file.stat.exists
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ automate_accept_terms_and_mlsa | lower }} "
  become: true
  args:
    creates: /hab
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
- name: Wait for Chef Infra Server services to be ready
  ansible.builtin.command:
    cmd: chef-server-ctl status
  become: true
  register: chef_server_status
  until: chef_server_status.rc == 0
  retries: 30
  delay: 10
  changed_when: false
