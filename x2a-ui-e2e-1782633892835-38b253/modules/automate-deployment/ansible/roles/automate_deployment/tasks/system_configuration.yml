---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ automate_hostname }}"
  become: true
- name: Ensure hostname is in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ^127\.0\.0\.1[ \t]+{{ automate_hostname }}$
    line: 127.0.0.1 {{ automate_hostname }}
    state: present
  become: true
- name: Set vm.max_map_count kernel parameter
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ automate_vm_max_map_count }}"
    state: present
    reload: true
  become: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ automate_vm_dirty_expire_centisecs }}"
    state: present
    reload: true
  become: true
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - gzip
    state: present
  become: true
