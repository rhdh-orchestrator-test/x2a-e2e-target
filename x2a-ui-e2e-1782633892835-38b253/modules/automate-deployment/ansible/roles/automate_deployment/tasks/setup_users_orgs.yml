---
- name: Ensure Chef Server is installed
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl_check
  become: true
- name: Fail if Chef Server is not installed
  ansible.builtin.fail:
    msg: Chef Server is not installed. Please run the deploy_chef_server.yml tasks first.
  when: not chef_server_ctl_check.stat.exists
- name: Ensure directory exists for PEM files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_pem_path }}"
    - "{{ chef_org_validator_pem_path }}"
  when: chef_user_pem_path | dirname != '.' or chef_org_validator_pem_path | dirname != '.'
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ chef_user_pem_path }}

      '
  become: true
  args:
    creates: "{{ chef_user_pem_path }}"
  register: create_user
  changed_when: create_user.rc == 0
  notify: Set permissions on user PEM file
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}" --association_user {{ username }} --filename {{ chef_org_validator_pem_path }}

      '
  become: true
  args:
    creates: "{{ chef_org_validator_pem_path }}"
  register: create_org
  changed_when: create_org.rc == 0
  notify: Set permissions on organization validator PEM file
