---
- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl -p
  become: true
  changed_when: false
- name: Check if user PEM file exists
  ansible.builtin.stat:
    path: "{{ chef_user_pem_path }}"
  register: user_pem_file
  listen: Set permissions on user PEM file
- name: Set permissions on user PEM file
  ansible.builtin.file:
    path: "{{ chef_user_pem_path }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true
  when: user_pem_file.stat.exists
  listen: Set permissions on user PEM file
- name: Check if organization validator PEM file exists
  ansible.builtin.stat:
    path: "{{ chef_org_validator_pem_path }}"
  register: org_pem_file
  listen: Set permissions on organization validator PEM file
- name: Set permissions on organization validator PEM file
  ansible.builtin.file:
    path: "{{ chef_org_validator_pem_path }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true
  when: org_pem_file.stat.exists
  listen: Set permissions on organization validator PEM file
