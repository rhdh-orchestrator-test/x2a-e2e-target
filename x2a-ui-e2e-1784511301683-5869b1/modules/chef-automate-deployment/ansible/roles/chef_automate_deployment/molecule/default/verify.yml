- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check if hosts file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hosts
    register: hosts_file
  - name: Assert hosts file exists
    ansible.builtin.assert:
      that:
      - hosts_file.stat.exists
      - hosts_file.stat.isreg
      fail_msg: Hosts file not found
      success_msg: Hosts file exists
  - name: Get hosts file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hosts
    register: hosts_content
    when: hosts_file.stat.exists
  - name: Assert hostname is configured in hosts file
    ansible.builtin.assert:
      that:
      - hosts_content.content | b64decode is search('automate.chef.lab')
      fail_msg: Hostname not properly configured in hosts file
      success_msg: Hostname properly configured in hosts file
    when: hosts_file.stat.exists
  - name: Check if procps package is installed
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/lib/dpkg/info/procps.list
    register: procps_installed
  - name: Assert procps package is installed
    ansible.builtin.assert:
      that:
      - procps_installed.stat.exists
      fail_msg: procps package not installed
      success_msg: procps package is installed
  - name: Check if sysctl configuration exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.conf
    register: sysctl_file
  - name: Assert sysctl configuration exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl configuration file not found
      success_msg: Sysctl configuration file exists
  - name: Get sysctl configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert vm.max_map_count is configured
    ansible.builtin.assert:
      that:
      - sysctl_content.content | b64decode is search('vm.max_map_count = 262144')
      fail_msg: vm.max_map_count not properly configured
      success_msg: vm.max_map_count properly configured
    when: sysctl_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is configured
    ansible.builtin.assert:
      that:
      - sysctl_content.content | b64decode is search('vm.dirty_expire_centisecs = 20000')
      fail_msg: vm.dirty_expire_centisecs not properly configured
      success_msg: vm.dirty_expire_centisecs properly configured
    when: sysctl_file.stat.exists
  - name: Check if Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/local/bin/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.isreg
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check if Chef Automate is deployed
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/sup
    register: hab_dir
  - name: Assert Chef Automate is deployed
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef Automate deployment directory not found
      success_msg: Chef Automate deployment directory exists
  - name: Check if Chef user PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/admin.pem
    register: user_pem
  - name: Assert Chef user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.isreg
      fail_msg: Chef user PEM file not found
      success_msg: Chef user PEM file exists
  - name: Check if Chef organization validator PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/default-validator.pem
    register: org_pem
  - name: Assert Chef organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_pem.stat.exists
      - org_pem.stat.isreg
      fail_msg: Chef organization validator PEM file not found
      success_msg: Chef organization validator PEM file exists
  - name: Check if Chef Automate is running
    ansible.builtin.uri:
      url: https://localhost/api/v0/status
      validate_certs: false
    register: chef_automate_status
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - chef_automate_status.status == 200
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check if Chef Infra Server is running
    ansible.builtin.command:
      cmd: chef-server-ctl status
    register: chef_server_status
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - chef_server_status.rc == 0
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Verify user creation
    ansible.builtin.command:
      cmd: chef-server-ctl user-list
    register: chef_user_list
    failed_when: false
    tags: molecule-notest
  - name: Assert user was created
    ansible.builtin.assert:
      that:
      - '''admin'' in chef_user_list.stdout'
      fail_msg: Chef user not found
      success_msg: Chef user exists
    tags: molecule-notest
  - name: Verify organization creation
    ansible.builtin.command:
      cmd: chef-server-ctl org-list
    register: chef_org_list
    failed_when: false
    tags: molecule-notest
  - name: Assert organization was created
    ansible.builtin.assert:
      that:
      - '''default'' in chef_org_list.stdout'
      fail_msg: Chef organization not found
      success_msg: Chef organization exists
    tags: molecule-notest
