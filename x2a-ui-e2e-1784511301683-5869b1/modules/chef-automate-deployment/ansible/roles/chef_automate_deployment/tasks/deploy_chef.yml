---
- name: Check if Chef Automate is already deployed
  ansible.builtin.stat:
    path: /hab
  register: hab_dir
  become: true
- name: Ensure /etc/chef directory exists
  ansible.builtin.file:
    path: /etc/chef
    state: directory
    mode: "0755"
  become: true
  when: not hab_dir.stat.exists
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy  {% for product in chef_automate_products %} --product {{ product }}  {% endfor %} --accept-terms-and-mlsa={{ chef_automate_accept_terms
      | lower }} "
  args:
    creates: /hab
  become: true
  when: not hab_dir.stat.exists
  register: chef_automate_deploy
  failed_when: chef_automate_deploy.rc != 0
  notify: Wait for Chef Automate services
