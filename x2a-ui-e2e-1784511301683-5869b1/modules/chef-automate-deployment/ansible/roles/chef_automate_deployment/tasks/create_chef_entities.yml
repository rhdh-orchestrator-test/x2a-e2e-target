---
- name: Create directory for PEM files
  ansible.builtin.file:
    path: "{{ chef_server_pem_dir }}"
    state: directory
    mode: "0755"
  become: true
- name: Check if Chef user already exists
  ansible.builtin.stat:
    path: "{{ chef_server_pem_dir }}/{{ chef_server_userfilename }}"
  register: user_pem
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_server_username }}  {{ chef_server_longusername }}  {{ chef_server_useremail }}  "{{ chef_server_userpassword }}"  --filename
      {{ chef_server_pem_dir }}/{{ chef_server_userfilename }}

      '
  args:
    creates: "{{ chef_server_pem_dir }}/{{ chef_server_userfilename }}"
  become: true
  when: not user_pem.stat.exists
  no_log: true
- name: Check if Chef organization already exists
  ansible.builtin.stat:
    path: "{{ chef_server_pem_dir }}/{{ chef_server_orgfilename }}"
  register: org_pem
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_server_orgname }}  "{{ chef_server_longorgname }}"  --association_user {{ chef_server_username }}  --filename {{ chef_server_pem_dir
      }}/{{ chef_server_orgfilename }}

      '
  args:
    creates: "{{ chef_server_pem_dir }}/{{ chef_server_orgfilename }}"
  become: true
  when: not org_pem.stat.exists
