---
- name: Create temporary directory for Chef Automate CLI download
  ansible.builtin.tempfile:
    state: directory
    suffix: chef-automate
  register: chef_automate_temp_dir
  become: false
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_temp_dir.path }}/chef-automate.zip"
    mode: "0644"
  become: false
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: "{{ chef_automate_temp_dir.path }}/chef-automate.zip"
    dest: "{{ chef_automate_temp_dir.path }}"
    remote_src: true
    creates: "{{ chef_automate_temp_dir.path }}/chef-automate"
  become: false
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_temp_dir.path }}/chef-automate"
    mode: "0755"
  become: false
- name: Copy Chef Automate CLI to system path
  ansible.builtin.copy:
    src: "{{ chef_automate_temp_dir.path }}/chef-automate"
    dest: "{{ chef_automate_cli_path }}"
    remote_src: true
    mode: "0755"
  become: true
