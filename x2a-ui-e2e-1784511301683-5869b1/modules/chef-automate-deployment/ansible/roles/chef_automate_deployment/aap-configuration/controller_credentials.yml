---
controller_credentials:
- name: Chef Server User Credentials - chef_automate_deployment
  description: Credentials used for creating a user in Chef Server
  organization: Default
  credential_type: Chef Server User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    email: '{{ email }}'
- name: Chef Organization Credentials - chef_automate_deployment
  description: Credentials used for creating an organization in Chef Server
  organization: Default
  credential_type: Chef Organization Credentials
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
