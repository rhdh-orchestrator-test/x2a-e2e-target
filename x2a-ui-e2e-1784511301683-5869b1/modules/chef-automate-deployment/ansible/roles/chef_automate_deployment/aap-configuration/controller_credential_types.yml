---
controller_credential_types:
- name: Chef Server User Credentials
  description: Credentials used for creating a user in Chef Server
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Server authentication
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Server authentication
    - id: email
      type: string
      label: Email
      help_text: Email address associated with the Chef Server user
    required:
    - username
    - password
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
- name: Chef Organization Credentials
  description: Credentials used for creating an organization in Chef Server
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name for the Chef organization
    required:
    - org_name
    - org_full_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
