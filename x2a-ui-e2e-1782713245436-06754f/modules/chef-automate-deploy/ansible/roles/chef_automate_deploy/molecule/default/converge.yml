---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/chef

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname | default('automate.chef.lab') }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate kernel parameters
    - name: Create max_map_count file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_max_map_count | default('262144') }}"
        dest: /tmp/molecule_test/proc/sys/vm/max_map_count
        mode: "0644"

    - name: Create dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_dirty_expire_centisecs | default('20000') }}"
        dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: /tmp/molecule_test/chef/chef-automate
        mode: "0755"

    # Simulate user and organization key files
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/chef/{{ chef_automate_userfilename | default('jtonello.pem') }}"
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORGANIZATION VALIDATOR KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/chef/{{ chef_automate_orgfilename | default('lab-validator.pem') }}"
        mode: "0600"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-postgresql
            Status: running
          Service: automate-elasticsearch
            Status: running
          Service: automate-gateway
            Status: running
        dest: /tmp/molecule_test/chef/automate-status.txt
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          run: chef-server-nginx: (pid 12345) 1234s; run: log: (pid 12346) 1234s
          run: chef-server-postgresql: (pid 12347) 1234s; run: log: (pid 12348) 1234s
          run: chef-server-bookshelf: (pid 12349) 1234s; run: log: (pid 12350) 1234s
        dest: /tmp/molecule_test/chef/chef-server-status.txt
        mode: "0644"

    # Simulate user list output
    - name: Create user list file
      ansible.builtin.copy:
        content: "{{ chef_automate_username | default('jtonello') }}\n"
        dest: /tmp/molecule_test/chef/user-list.txt
        mode: "0644"

    # Simulate organization list output
    - name: Create organization list file
      ansible.builtin.copy:
        content: "{{ chef_automate_orgname | default('lab') }}\n"
        dest: /tmp/molecule_test/chef/org-list.txt
        mode: "0644"

    # Simulate network listening ports
    - name: Create netstat output file
      ansible.builtin.copy:
        content: "tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/nginx\n"
        dest: /tmp/molecule_test/chef/netstat-output.txt
        mode: "0644"

    # Simulate API endpoint responses
    - name: Create API version response file
      ansible.builtin.copy:
        content: '{"api_version":"v0"}'
        dest: /tmp/molecule_test/chef/api-version-response.json
        mode: "0644"

    - name: Create status endpoint response file
      ansible.builtin.copy:
        content: '{"status":"ok"}'
        dest: /tmp/molecule_test/chef/status-response.json
        mode: "0644"