---
controller_credentials:
- name: Chef Admin User - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef Admin User
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
- name: SSL Certificates - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: SSL Certificates
  update_secrets: true
  inputs:
    certificate: '{{ certificate }}'
    private_key: '{{ vault_private_key }}'
