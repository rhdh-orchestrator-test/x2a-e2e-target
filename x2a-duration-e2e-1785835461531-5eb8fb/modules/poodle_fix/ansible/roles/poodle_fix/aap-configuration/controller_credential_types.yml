---
controller_credential_types:
- name: Chef Automate Deployment Credentials
  description: Credential type for Chef Automate Deployment Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Automate/Infra Server deployment
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Automate/Infra Server deployment
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
