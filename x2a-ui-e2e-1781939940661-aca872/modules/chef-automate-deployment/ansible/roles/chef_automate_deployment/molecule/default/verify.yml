---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_file.stat.exists

    # Kernel parameter checks
    - name: Check max_map_count file
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_file

    - name: Assert max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
          - max_map_count_file.stat.isreg
        fail_msg: "max_map_count file not found"
        success_msg: "max_map_count file exists"

    - name: Get max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == '262144'
        fail_msg: "max_map_count is not set correctly"
        success_msg: "max_map_count is set correctly"
      when: max_map_count_file.stat.exists

    - name: Check dirty_expire_centisecs file
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_file

    - name: Assert dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_centisecs_file.stat.exists
          - dirty_expire_centisecs_file.stat.isreg
        fail_msg: "dirty_expire_centisecs file not found"
        success_msg: "dirty_expire_centisecs file exists"

    - name: Get dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_content
      when: dirty_expire_centisecs_file.stat.exists

    - name: Assert dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_centisecs_content.content | b64decode | trim) == '20000'
        fail_msg: "dirty_expire_centisecs is not set correctly"
        success_msg: "dirty_expire_centisecs is set correctly"
      when: dirty_expire_centisecs_file.stat.exists

    # Chef Automate CLI checks
    - name: Check Chef Automate CLI
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate config checks
    - name: Check Chef Automate config file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config

    - name: Assert Chef Automate config exists
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
          - chef_automate_config.stat.isreg
        fail_msg: "Chef Automate config not found"
        success_msg: "Chef Automate config exists"

    # User and organization key checks
    - name: Check user key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/jtonello.pem
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.isreg
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    - name: Check organization validator key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/lab-validator.pem
      register: org_validator_key_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_validator_key_file.stat.exists
          - org_validator_key_file.stat.isreg
        fail_msg: "Organization validator key file not found"
        success_msg: "Organization validator key file exists"

    # Certificate checks
    - name: Check Chef Automate certificate
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-automate/cert/automate.chef.lab.crt
      register: chef_automate_cert

    - name: Assert Chef Automate certificate exists
      ansible.builtin.assert:
        that:
          - chef_automate_cert.stat.exists
          - chef_automate_cert.stat.isreg
        fail_msg: "Chef Automate certificate not found"
        success_msg: "Chef Automate certificate exists"

    # Service status checks (tagged to skip in container)
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo ./chef-automate status
      register: chef_automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server is not running"
        success_msg: "Chef Infra Server is running"
      tags: molecule-notest

    # Network listening checks (tagged to skip in container)
    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # Web UI access checks (tagged to skip in container)
    - name: Check Chef Automate API
      ansible.builtin.uri:
        url: https://localhost/api/v0/auth/version
        validate_certs: false
      register: api_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Automate API is accessible
      ansible.builtin.assert:
        that:
          - api_check is succeeded
        fail_msg: "Chef Automate API is not accessible"
        success_msg: "Chef Automate API is accessible"
      tags: molecule-notest

    - name: Check Chef Infra Server organizations
      ansible.builtin.uri:
        url: https://localhost/organizations
        validate_certs: false
      register: orgs_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Infra Server organizations are accessible
      ansible.builtin.assert:
        that:
          - orgs_check is succeeded
        fail_msg: "Chef Infra Server organizations are not accessible"
        success_msg: "Chef Infra Server organizations are accessible"
      tags: molecule-notest