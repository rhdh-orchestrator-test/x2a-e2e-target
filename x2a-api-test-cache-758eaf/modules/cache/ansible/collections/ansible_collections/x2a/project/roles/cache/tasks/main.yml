---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Determine Redis platform settings
  ansible.builtin.set_fact:
    cache_redis_package: "{{ 'redis-server' if ansible_facts.os_family == 'Debian' else 'redis' }}"
    cache_redis_service: "{{ 'redis-server' if ansible_facts.os_family == 'Debian' else 'redis' }}"
    cache_redis_config: "{{ '/etc/redis/6379.conf' if ansible_facts.os_family == 'Debian' else '/etc/redis.conf' }}"

- name: Install Redis server
  ansible.builtin.package:
    name: "{{ cache_redis_package }}"
    state: present

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Ensure Redis instance configuration exists  # noqa: R114 - path is derived from fixed role logic based on the OS family
  ansible.builtin.file:
    path: "{{ cache_redis_config }}"
    state: touch
    access_time: preserve
    modification_time: preserve
    owner: redis
    group: redis
    mode: "0640"

- name: Configure Redis port  # noqa: R114 - path is derived from fixed role logic based on the OS family
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config }}"
    regexp: ^\s*port\s+
    line: port 6379
    create: true
    owner: redis
    group: redis
    mode: "0640"
  notify: Restart Redis

- name: Configure Redis authentication  # noqa: L039, R114 - password is validated by the preceding credential-validation task; path is derived from fixed role logic based on the OS family
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config }}"
    regexp: ^\s*requirepass\s+
    line: requirepass {{ redis_password }}
    create: true
    owner: redis
    group: redis
    mode: "0640"
  notify: Restart Redis
  no_log: "{{ cache_secure_logging | default(true) }}"

- name: Remove unsupported Redis replication directives  # noqa: R114, R115 - path is derived from fixed role logic based on the OS family and deletion is limited to that known Redis configuration file
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config }}"
    regexp: ^{{ item_cache_directive }}.*$
    state: absent
  loop:
    - replica-serve-stale-data
    - replica-read-only
    - repl-ping-replica-period
    - client-output-buffer-limit
    - replica-priority
  loop_control:
    loop_var: item_cache_directive
  notify: Restart Redis

- name: Enable and start Redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    state: started
    enabled: true
