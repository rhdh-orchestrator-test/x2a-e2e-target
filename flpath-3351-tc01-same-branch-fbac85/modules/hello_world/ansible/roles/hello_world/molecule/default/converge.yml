- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Ensure molecule test directory exists
    ansible.builtin.file:
      path: /tmp/molecule_test
      state: directory
      mode: '0755'
  - name: Create a file to verify the role execution
    ansible.builtin.copy:
      content: Hello, world!
      dest: /tmp/molecule_test/hello_world_message.txt
      mode: '0644'
      backup: true
  - name: Include hello_world role
    ansible.builtin.include_role:
      name: hello_world
