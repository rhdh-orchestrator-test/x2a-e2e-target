---
- name: Check if Chef Infra Server is installed
  ansible.builtin.stat:
    path: /hab
  register: chef_server_installed
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_username }} {{ chef_automate_longusername }} {{ chef_automate_useremail }} "{{ user_password }}"
      --filename {{ chef_automate_user_pem_file }}
  args:
    creates: "{{ chef_automate_user_pem_file }}"
  become: true
  when: chef_server_installed.stat.exists
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_orgname }} "{{ chef_automate_longorgname }}" --association_user {{ chef_automate_username }} --filename {{
      chef_automate_org_pem_file }}
  args:
    creates: "{{ chef_automate_org_pem_file }}"
  become: true
  when: chef_server_installed.stat.exists
