- name: Converge
  hosts: all
  gather_facts: true
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_username: jtonello
    chef_automate_longusername: John Tonello
    chef_automate_useremail: jtonello@chef.lab
    chef_automate_orgname: lab
    chef_automate_longorgname: Chef Lab
    chef_automate_user_pem_file: jtonello.pem
    chef_automate_org_pem_file: lab-validator.pem
    user_password: molecule_test_password
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/proc/sys/vm
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl files for kernel parameters
    ansible.builtin.copy:
      content: '262144

        '
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create sysctl files for dirty expire centisecs
    ansible.builtin.copy:
      content: '20000

        '
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/sh

        echo "Chef Automate CLI mock"

        exit 0

        '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        (mock PEM content for molecule testing)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_automate_user_pem_file }}
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        (mock PEM content for molecule testing)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_automate_org_pem_file }}
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: chef-automate

        Status: running

        '
      dest: /tmp/molecule_test/chef-automate-status
      mode: '0644'
  - name: Create Chef Infra Server status file
    ansible.builtin.copy:
      content: 'Service: chef-server

        Status: running

        '
      dest: /tmp/molecule_test/chef-server-status
      mode: '0644'
  - name: Create user list file
    ansible.builtin.copy:
      content: 'jtonello

        '
      dest: /tmp/molecule_test/chef-server-user-list
      mode: '0644'
  - name: Create organization list file
    ansible.builtin.copy:
      content: 'lab

        '
      dest: /tmp/molecule_test/chef-server-org-list
      mode: '0644'
  - name: Create netstat output file
    ansible.builtin.copy:
      content: 'tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/chef-server

        '
      dest: /tmp/molecule_test/netstat-output
      mode: '0644'
  - name: Create systemd service files
    ansible.builtin.copy:
      content: '[Unit]

        Description={{ item }}


        [Service]

        ExecStart=/bin/true


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/{{ item }}.service
      mode: '0644'
    loop:
    - chef-automate
    - chef-server
