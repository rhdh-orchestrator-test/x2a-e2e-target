- name: Converge
  hosts: all
  gather_facts: true
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_username: admin
    chef_automate_org_name: lab
    username: admin
    password: changeme
    email: admin@example.com
    full_name: Administrator
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_USER_KEY_CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/admin.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_ORG_VALIDATOR_KEY_CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: chef-automate-postgresql - running

        Service: chef-automate-elasticsearch - running

        Service: chef-automate-nginx - running

        Service: chef-infra-server - running

        '
      dest: /tmp/molecule_test/hab/chef-automate-status.txt
      mode: '0644'
  - name: Create Chef Server user list file
    ansible.builtin.copy:
      content: 'admin '
      dest: /tmp/molecule_test/hab/chef-server-user-list.txt
      mode: '0644'
  - name: Create Chef Server organization list file
    ansible.builtin.copy:
      content: 'lab '
      dest: /tmp/molecule_test/hab/chef-server-org-list.txt
      mode: '0644'
