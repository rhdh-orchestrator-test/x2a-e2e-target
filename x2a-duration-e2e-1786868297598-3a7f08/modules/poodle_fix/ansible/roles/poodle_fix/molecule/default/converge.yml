- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache mods-available
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create sample Apache SSL configuration file
    ansible.builtin.copy:
      content: '# This is a sample Apache SSL configuration file for testing

        # Original SSL Protocol configuration

        SSLProtocol all -SSLv3


        # Other SSL configuration options

        SSLHonorCipherOrder on

        SSLCipherSuite HIGH:!aNULL:!MD5

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Apply the poodle_fix role tasks directly
    ansible.builtin.include_tasks: ../../tasks/main.yml
    vars:
      apache2_ssl_conf_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
