---
cache_secure_logging: true
cache_redis_port: 6379
cache_redis_config_file: /etc/redis/6379.conf
cache_redis_log_directory: /var/log/redis
cache_redis_package_name: redis-server
cache_redis_service_name: redis-server
cache_memcached_package_name: memcached
cache_memcached_service_name: memcached
cache_memcached_enabled: true
cache_redis_enabled: true
cache_redis_replication_directives:
  - replica-serve-stale-data
  - replica-read-only
  - repl-ping-replica-period
  - client-output-buffer-limit
  - replica-priority
