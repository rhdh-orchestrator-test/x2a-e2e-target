---
controller_credential_types:
  - name: FastAPI PostgreSQL Database
    description: PostgreSQL database credentials for FastAPI application connection
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL username for FastAPI application database connection
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: PostgreSQL password for FastAPI application database authentication
        - id: db_host
          type: string
          label: Database Host
          help_text: PostgreSQL server hostname or IP address
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database name for the FastAPI application
      required:
        - db_username
        - db_password
        - db_host
        - db_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_host: !unsafe "{{ db_host }}"
        db_name: !unsafe "{{ db_name }}"
