---
argument_specs:
  main:
    short_description: Deploy FastAPI tutorial web application with PostgreSQL backend
    description:
      - Installs Python 3 and system dependencies for FastAPI application
      - Clones FastAPI tutorial repository from GitHub
      - Sets up Python virtual environment and installs dependencies
      - Configures PostgreSQL database with dedicated user and database
      - Deploys application as systemd service running on configurable port
    options:
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Directory where the FastAPI application will be installed
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name used in environment configuration
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version used in environment configuration
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port the FastAPI application listens on
      fastapi_tutorial_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Host address the FastAPI application binds to
      fastapi_tutorial_git_repo:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the FastAPI tutorial application
      fastapi_tutorial_git_branch:
        type: str
        required: false
        default: main
        description: Git branch to checkout from the repository
      fastapi_tutorial_system_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
        description: List of system packages required for the application
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: System user to run the FastAPI service as
      fastapi_tutorial_service_group:
        type: str
        required: false
        default: root
        description: System group to run the FastAPI service as
      fastapi_tutorial_database_url:
        type: str
        required: false
        default: postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}/{{ db_name }}
        description: PostgreSQL database connection URL constructed from AAP credential variables
      db_username:
        type: str
        required: true
        description: Database username injected by AAP credential type
      db_password:
        type: str
        required: true
        description: Database password injected by AAP credential type
      db_host:
        type: str
        required: true
        description: Database host injected by AAP credential type
      db_name:
        type: str
        required: true
        description: Database name injected by AAP credential type
