---
# FastAPI Tutorial Role Tasks

- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install required system packages
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_system_packages }}" # noqa: R113 - package list from role defaults, not user input
    state: present

- name: Create service user
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    system: true
    shell: /bin/bash
    home: "{{ fastapi_tutorial_app_dir }}"
    create_home: false
    state: present
  when: fastapi_tutorial_service_user != "root"

- name: Create service group
  ansible.builtin.group:
    name: "{{ fastapi_tutorial_service_group }}"
    system: true
    state: present
  when: fastapi_tutorial_service_group != "root"

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    mode: "0755"

- name: Clone FastAPI tutorial repository # noqa: R106 - repo URL from role defaults, not user input
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_git_repo }}" # noqa: R104,R401 - internal repository URL, R106 - repo URL from role defaults, R401 - audit rule for inbound sources
    dest: "{{ fastapi_tutorial_app_dir }}"
    version: "{{ fastapi_tutorial_git_branch }}"
  become_user: "{{ fastapi_tutorial_service_user }}"

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv "{{ fastapi_tutorial_app_dir }}/venv" # noqa: R101 - path from role defaults, not user input
    creates: "{{ fastapi_tutorial_app_dir }}/venv"
  become_user: "{{ fastapi_tutorial_service_user }}"

- name: Install Python dependencies from requirements.txt # noqa: R113 - requirements file path from role defaults, not user input
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_app_dir }}/venv"
  become_user: "{{ fastapi_tutorial_service_user }}"

- name: Enable and start PostgreSQL service
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Check if PostgreSQL database user exists # noqa: L039 - db_username from AAP credential store
  ansible.builtin.command:
    cmd: sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ db_username }}'" # noqa: R101 - db_username from AAP credentials, L039 - variable from AAP credential store
  register: user_exists
  changed_when: false
  failed_when: false

- name: Create PostgreSQL database user # noqa: L039 - db_password, db_username, user_exists from AAP credential store and prior task
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "CREATE USER {{ db_username }} WITH PASSWORD '{{ db_password }}';" # noqa: R101 - db credentials from AAP credential store, L039 - variables from AAP credential store
  when: user_exists.stdout != "1"

- name: Check if PostgreSQL database exists # noqa: L039 - db_name from AAP credential store
  ansible.builtin.command:
    cmd: sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ db_name }}'" # noqa: R101 - db_name from AAP credentials, L039 - variable from AAP credential store
  register: db_exists
  changed_when: false
  failed_when: false

- name: Create PostgreSQL database # noqa: L039 - db_exists, db_name, db_username from AAP credential store and prior task
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "CREATE DATABASE {{ db_name }} OWNER {{ db_username }};" # noqa: R101 - db credentials from AAP credential store, L039 - variables from AAP credential store
  when: db_exists.stdout != "1"

- name: Grant privileges on database # noqa: L039 - db_exists, db_name, db_username from AAP credential store and prior task
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_username }};" # noqa: R101 - db credentials from AAP credential store, L039 - variables from AAP credential store
  when: db_exists.stdout != "1"

- name: Deploy environment configuration file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path from role defaults, not user input
    mode: "0644"
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    backup: true

- name: Deploy systemd service file
  ansible.builtin.template:
    src: fastapi-tutorial.service.j2
    dest: /etc/systemd/system/fastapi-tutorial.service
    mode: "0644"
    owner: root
    group: root
    backup: true
  notify:
    - Reload systemd daemon

- name: Flush handlers to reload systemd
  ansible.builtin.meta: flush_handlers

- name: Enable and start fastapi-tutorial service
  ansible.builtin.service:
    name: fastapi-tutorial
    state: started
    enabled: true
