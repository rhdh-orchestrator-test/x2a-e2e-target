---
apache_package: apache2
apache_version: 2.4.41-4ubuntu3.10
additional_packages:
  - curl
  - openssl
  - python3-openssl
ssl_protocol: -all +TLSv1.2
ssl_cert_dir: /etc/apache2/certs
ssl_key_path: "{{ ssl_cert_dir }}/apache.key"
ssl_csr_path: "{{ ssl_cert_dir }}/apache.csr"
ssl_cert_path: "{{ ssl_cert_dir }}/apache.crt"
website_name: helloworld
website_doc_root: /var/www/helloworld
website_port: 443
