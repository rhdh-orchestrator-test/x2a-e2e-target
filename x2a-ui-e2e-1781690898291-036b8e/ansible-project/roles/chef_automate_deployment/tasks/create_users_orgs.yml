---
- name: Ensure directory for PEM files exists
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_pem_file }}"
    - "{{ chef_automate_org_pem_file }}"
  become: true
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username | default(chef_automate_username) }} {{ full_name | default(chef_automate_full_name) }} {{ email |
      default(chef_automate_email) }} "{{ password | default(chef_automate_password) }}" --filename {{ chef_automate_user_pem_file }}
  args:
    creates: "{{ chef_automate_user_pem_file }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_full_name }}" --association_user {{ username |
      default(chef_automate_username) }} --filename {{ chef_automate_org_pem_file }}
  args:
    creates: "{{ chef_automate_org_pem_file }}"
  become: true
