---
chef_automate_hostname: automate.chef.lab
chef_automate_sysctl_settings:
  vm.max_map_count: 262144
  vm.dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: "{{ ansible_env.PWD }}/chef-automate"
chef_automate_products:
  - automate
  - infra-server
chef_automate_accept_terms: true
chef_automate_username: jtonello
chef_automate_full_name: John Tonello
chef_automate_email: jtonello@chef.lab
chef_automate_password: password
chef_automate_org_name: lab
chef_automate_org_full_name: Chef Lab
chef_automate_user_pem_file: "{{ chef_automate_username }}.pem"
chef_automate_org_pem_file: "{{ chef_automate_org_name }}-validator.pem"
