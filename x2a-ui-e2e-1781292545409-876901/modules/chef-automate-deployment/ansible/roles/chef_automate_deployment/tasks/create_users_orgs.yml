---
- name: Ensure sudo is installed
  ansible.builtin.package:
    name: sudo
    state: present
  become: true
- name: Set absolute paths for PEM files
  ansible.builtin.set_fact:
    user_pem_absolute_path: "{{ ansible_env.PWD }}/{{ chef_user_pem_file }}"
    org_validator_pem_absolute_path: "{{ ansible_env.PWD }}/{{ chef_org_validator_pem_file }}"
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: sudo chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ user_pem_absolute_path }}
    creates: "{{ user_pem_absolute_path }}"
  register: user_create_result
  changed_when: user_create_result.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: sudo chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}" --association_user {{ username }} --filename {{
      org_validator_pem_absolute_path }}
    creates: "{{ org_validator_pem_absolute_path }}"
  register: org_create_result
  changed_when: org_create_result.rc == 0
