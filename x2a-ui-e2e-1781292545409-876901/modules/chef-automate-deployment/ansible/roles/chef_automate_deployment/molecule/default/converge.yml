---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure that would be created by the role
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/chef-server
        - /tmp/molecule_test/etc/chef

    # Create config files that would be created by Chef Automate deployment
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          # Chef Automate configuration
          [global]
            v1 = true
          [deployment]
            hostname = "automate.chef.lab"
          [gateway]
            port = 443
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"

    # Create Chef CLI binary placeholder
    - name: Create Chef Automate CLI placeholder
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: /tmp/molecule_test/chef-automate
        mode: "0755"

    # Create PEM files that would be created by user/org creation
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          EXAMPLE_PEM_CONTENT_FOR_USER
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/jtonello.pem
        mode: "0600"

    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          EXAMPLE_PEM_CONTENT_FOR_ORG_VALIDATOR
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/lab-validator.pem
        mode: "0600"

    # Create sysctl configuration files
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: |
          # Chef Automate sysctl settings
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Create hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"