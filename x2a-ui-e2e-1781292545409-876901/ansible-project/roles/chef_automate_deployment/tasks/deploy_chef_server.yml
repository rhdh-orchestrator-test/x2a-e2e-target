---
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: sudo ./chef-automate deploy --product {{ chef_infra_server_products | join(' --product ') }} --accept-terms-and-mlsa=true
    creates: /etc/chef-server/chef-server.rb
  register: deploy_result
  changed_when: deploy_result.rc == 0
- name: Display deployment result
  ansible.builtin.debug:
    msg: "{{ deploy_result.stdout_lines }}"
  when: deploy_result.changed
