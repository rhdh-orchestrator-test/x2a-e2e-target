---
controller_credential_types:
- name: Chef Server User Credentials
  description: Credentials used for creating and managing Chef Server users
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef Server admin username
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Chef Server admin password
    - id: email
      type: string
      label: Email
      help_text: Email address for Chef Server admin user
    required:
    - username
    - password
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
- name: Chef Organization Validator
  description: Credentials used for Chef Server organization creation and validation
  kind: cloud
  inputs:
    fields:
    - id: organization_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: full_organization_name
      type: string
      label: Full Organization Name
      help_text: Full descriptive name for the Chef organization
    - id: validator_key
      type: string
      label: Validator Key
      secret: true
      help_text: PEM file content for organization validation
    required:
    - organization_name
    - validator_key
  injectors:
    extra_vars:
      organization_name: !unsafe '{{ organization_name }}'
      full_organization_name: !unsafe '{{ full_organization_name }}'
      validator_key: !unsafe '{{ validator_key }}'
