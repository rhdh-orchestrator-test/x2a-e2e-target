---
- name: Ensure unzip/gzip packages are installed
  ansible.builtin.package:
    name:
      - gzip
      - unzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: set -o pipefail && gunzip -c /tmp/chef-automate.zip > {{ chef_automate_cli_path }}
    executable: /bin/bash
  args:
    creates: "{{ chef_automate_cli_path }}"
  become: true
  changed_when: false
- name: Set execute permissions on Chef Automate CLI
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
  become: true
