- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    organization_name: lab
    chef_automate_user_pem_path: '{{ username }}.pem'
    chef_automate_org_validator_pem_path: '{{ organization_name }}-validator.pem'
  tasks:
  - name: Check if hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file was created
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check if sysctl config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file was created
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl config file not found
      success_msg: Sysctl config file exists
  - name: Get sysctl file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl settings are correct
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: Sysctl settings not configured correctly
      success_msg: Sysctl settings configured correctly
    when: sysctl_file.stat.exists
  - name: Check if Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI was downloaded
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.isreg
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check if Chef Automate deployment marker exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert Chef Automate was deployed
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef Automate deployment marker not found
      success_msg: Chef Automate deployment marker exists
  - name: Check if user PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ chef_automate_user_pem_path }}
    register: user_pem
  - name: Assert user PEM file was created
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.isreg
      - user_pem.stat.mode == "0600"
      fail_msg: User PEM file not found or has incorrect permissions
      success_msg: User PEM file exists with correct permissions
  - name: Check if organization validator PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ chef_automate_org_validator_pem_path }}
    register: org_validator_pem
  - name: Assert organization validator PEM file was created
    ansible.builtin.assert:
      that:
      - org_validator_pem.stat.exists
      - org_validator_pem.stat.isreg
      - org_validator_pem.stat.mode == "0600"
      fail_msg: Organization validator PEM file not found or has incorrect permissions
      success_msg: Organization validator PEM file exists with correct permissions
  - name: Check if Chef Automate is running
    ansible.builtin.uri:
      url: https://localhost/api/v0/health
      validate_certs: false
      status_code: 200
    register: chef_automate_health
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - chef_automate_health.status == 200
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check if Chef Infra Server is running
    ansible.builtin.command:
      cmd: chef-server-ctl status
    register: chef_server_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - chef_server_status.rc == 0
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Verify user creation
    ansible.builtin.command:
      cmd: chef-server-ctl user-list
    register: chef_server_users
    changed_when: false
    tags: molecule-notest
  - name: Assert user was created
    ansible.builtin.assert:
      that:
      - '''{{ username }}'' in chef_server_users.stdout'
      fail_msg: User not found in Chef Server
      success_msg: User exists in Chef Server
    tags: molecule-notest
  - name: Verify organization creation
    ansible.builtin.command:
      cmd: chef-server-ctl org-list
    register: chef_server_orgs
    changed_when: false
    tags: molecule-notest
  - name: Assert organization was created
    ansible.builtin.assert:
      that:
      - '''{{ organization_name }}'' in chef_server_orgs.stdout'
      fail_msg: Organization not found in Chef Server
      success_msg: Organization exists in Chef Server
    tags: molecule-notest
