---
- name: Extract username from email
  ansible.builtin.set_fact:
    user_first_name: "{{ email.split('@')[0] | capitalize }}"
- name: Ensure directory exists for PEM files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_pem_path }}"
    - "{{ chef_automate_org_validator_pem_path }}"
  become: true
  when: chef_automate_user_pem_path | dirname != '.' or chef_automate_org_validator_pem_path | dirname != '.'
- name: Create user in Chef Server
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ user_first_name }} {{ email }} "{{ password }}" --filename {{ chef_automate_user_pem_path }}
  args:
    creates: "{{ chef_automate_user_pem_path }}"
  become: true
- name: Create organization in Chef Server
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ organization_name }} "{{ full_organization_name }}" --association_user {{ username }} --filename {{
      chef_automate_org_validator_pem_path }}
  args:
    creates: "{{ chef_automate_org_validator_pem_path }}"
  become: true
