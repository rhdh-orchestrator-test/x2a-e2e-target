---
- name: Install Memcached package
  ansible.builtin.package:
    name:
      - memcached
    state: present

- name: Create Memcached service group
  ansible.builtin.group:
    name: service_group
    system: true
    state: present

- name: Create locked Memcached service user
  ansible.builtin.user:
    name: service_user
    group: service_group
    system: true
    create_home: false
    home: /nonexistent
    comment: Memcached
    shell: /bin/false
    password_lock: true
    state: present

- name: Create Memcached log directory
  ansible.builtin.file:
    path: "{{ cache_memcached_logfilepath }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: service_user
    group: service_group
    mode: "0755"

- name: Create Memcached runtime directory
  ansible.builtin.file:
    path: /var/run/memcached
    state: directory
    owner: service_user
    group: service_group
    mode: "0755"
