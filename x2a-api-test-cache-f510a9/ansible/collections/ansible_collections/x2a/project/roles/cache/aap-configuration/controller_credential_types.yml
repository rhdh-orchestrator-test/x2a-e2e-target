---
controller_credential_types:
  - name: Redis Authentication
    description: Hardcoded Redis authentication credential migrated from the Chef node attribute configuration.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required to authenticate clients to the Redis instance.
        - id: redis_port
          type: string
          label: Redis Port
          help_text: TCP port of the authenticated Redis instance; configured as 6379.
      required:
        - redis_password
        - redis_port
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
        redis_port: !unsafe "{{ redis_port }}"
