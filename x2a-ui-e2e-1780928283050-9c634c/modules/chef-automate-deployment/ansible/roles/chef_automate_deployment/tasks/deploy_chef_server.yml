---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters for Chef Server
  community.general.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ chef_automate_sysctl_params | dict2items }}"
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: /tmp/chef-automate_linux_amd64.zip
    dest: "{{ chef_automate_cli_path | dirname }}"
    remote_src: true
    creates: "{{ chef_automate_cli_path }}"
    mode: "0755"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }} "
  become: true
  args:
    creates: /hab
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
- name: Wait for Chef Infra Server services to be ready
  ansible.builtin.pause:
    seconds: 30
  when: chef_server_deploy.changed
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ user_key_path }}

      '
  become: true
  args:
    creates: "{{ user_key_path }}"
  register: create_user
  changed_when: create_user.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ org_short_name }} "{{ org_full_name }}" --association_user {{ username }} --filename {{ org_validator_path }}

      '
  become: true
  args:
    creates: "{{ org_validator_path }}"
  register: create_org
  changed_when: create_org.rc == 0
- name: Set permissions on user key file
  ansible.builtin.file:
    path: "{{ user_key_path }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: create_user.changed
- name: Set permissions on organization validator key file
  ansible.builtin.file:
    path: "{{ org_validator_path }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: create_org.changed
