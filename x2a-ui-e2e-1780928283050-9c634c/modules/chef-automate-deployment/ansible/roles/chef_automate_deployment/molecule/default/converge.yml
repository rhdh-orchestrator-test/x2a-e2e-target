      dest: /tmp/molecule_test/home/ansible/lab-validator.pem
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: chef-automate

        Status: running

        Chef Infra Server: running

        '
      dest: /tmp/molecule_test/hab/chef-automate-status.txt
      mode: '0644'
  - name: Create Chef Server user list file
    ansible.builtin.copy:
      content: 'jtonello

