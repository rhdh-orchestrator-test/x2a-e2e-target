---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists and has content
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found or empty"
        success_msg: "Hostname file exists and has content"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check sysctl settings file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Sysctl settings file not found or empty"
        success_msg: "Sysctl settings file exists"

    - name: Get sysctl settings content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl settings are correct
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
          - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "Sysctl settings not configured correctly"
        success_msg: "Sysctl settings configured correctly"
      when: sysctl_file.stat.exists

    # Chef Automate installation checks
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # User and organization checks
    - name: Check user key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/jtonello.pem
      register: user_key_file

    - name: Assert user key file exists and has correct permissions
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.size > 0
          - user_key_file.stat.mode == "0600"
        fail_msg: "User key file not found or has incorrect permissions"
        success_msg: "User key file exists with correct permissions"

    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/lab-validator.pem
      register: org_validator_file

    - name: Assert organization validator key file exists and has correct permissions
      ansible.builtin.assert:
        that:
          - org_validator_file.stat.exists
          - org_validator_file.stat.size > 0
          - org_validator_file.stat.mode == "0600"
        fail_msg: "Organization validator key file not found or has incorrect permissions"
        success_msg: "Organization validator key file exists with correct permissions"

    # Chef Automate status check
    - name: Check Chef Automate status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-automate-status.txt
      register: chef_automate_status_file

    - name: Assert Chef Automate status file exists
      ansible.builtin.assert:
        that:
          - chef_automate_status_file.stat.exists
          - chef_automate_status_file.stat.size > 0
        fail_msg: "Chef Automate status file not found or empty"
        success_msg: "Chef Automate status file exists"

    # Chef Server user and organization checks
    - name: Check Chef Server user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-users.txt
      register: chef_server_users_file

    - name: Assert Chef Server user list file exists
      ansible.builtin.assert:
        that:
          - chef_server_users_file.stat.exists
          - chef_server_users_file.stat.size > 0
        fail_msg: "Chef Server user list file not found or empty"
        success_msg: "Chef Server user list file exists"

    - name: Get Chef Server user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-server-users.txt
      register: chef_server_users_content
      when: chef_server_users_file.stat.exists

    - name: Assert Chef admin user exists
      ansible.builtin.assert:
        that:
          - (chef_server_users_content.content | b64decode) is search('jtonello')
        fail_msg: "Chef admin user not found"
        success_msg: "Chef admin user exists"
      when: chef_server_users_file.stat.exists

    - name: Check Chef Server org list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-orgs.txt
      register: chef_server_orgs_file

    - name: Assert Chef Server org list file exists
      ansible.builtin.assert:
        that:
          - chef_server_orgs_file.stat.exists
          - chef_server_orgs_file.stat.size > 0
        fail_msg: "Chef Server org list file not found or empty"
        success_msg: "Chef Server org list file exists"

    - name: Get Chef Server org list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-server-orgs.txt
      register: chef_server_orgs_content
      when: chef_server_orgs_file.stat.exists

    - name: Assert Chef organization exists
      ansible.builtin.assert:
        that:
          - (chef_server_orgs_content.content | b64decode) is search('lab')
        fail_msg: "Chef organization not found"
        success_msg: "Chef organization exists"
      when: chef_server_orgs_file.stat.exists

    # Service status checks (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: chef-automate status
      register: automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - automate_status.rc == 0
          - automate_status.stdout is search('running')
        fail_msg: "Chef Automate service not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check Chef Infra Server service status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: chef_server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server service is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
          - chef_server_status.stdout is search('run')
        fail_msg: "Chef Infra Server service not running"
        success_msg: "Chef Infra Server service is running"
      tags: molecule-notest

    # Network port checks (tagged for skipping in container)
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # API access test (tagged for skipping in container)
    - name: Test API access
      ansible.builtin.uri:
        url: https://localhost/api/_status
        validate_certs: false
        status_code: 200
      register: api_check
      failed_when: false
      tags: molecule-notest

    - name: Assert API is accessible
      ansible.builtin.assert:
        that:
          - api_check is succeeded
        fail_msg: "API is not accessible"
        success_msg: "API is accessible"
      tags: molecule-notest