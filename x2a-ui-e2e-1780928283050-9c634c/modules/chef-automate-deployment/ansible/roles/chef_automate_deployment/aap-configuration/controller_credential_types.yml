---
controller_credential_types:
- name: Chef Admin User Credentials
  description: Credential type for Chef Admin User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Admin Username
      help_text: Username for the Chef Automate and Chef Infra Server admin user
    - id: password
      type: string
      label: Admin Password
      secret: true
      help_text: Password for the Chef Automate and Chef Infra Server admin user
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the Chef admin user
    - id: email
      type: string
      label: Email Address
      help_text: Email address of the Chef admin user
    required:
    - username
    - password
    - full_name
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
- name: Chef Organization Details
  description: Credential type for Chef Organization Details
  kind: cloud
  inputs:
    fields:
    - id: org_short_name
      type: string
      label: Organization Short Name
      help_text: Short name identifier for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name for the Chef organization
    required:
    - org_short_name
    - org_full_name
  injectors:
    extra_vars:
      org_short_name: !unsafe '{{ org_short_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
- name: Chef User Key
  description: Credential type for Chef User Key
  kind: cloud
  inputs:
    fields:
    - id: user_key_path
      type: string
      label: User Key Path
      help_text: File path where the admin user's PEM key will be stored
    - id: user_key_content
      type: string
      label: User Key Content
      secret: true
      help_text: PEM key content for Chef admin user authentication
    required:
    - user_key_path
  injectors:
    extra_vars:
      user_key_path: !unsafe '{{ user_key_path }}'
      user_key_content: !unsafe '{{ user_key_content }}'
- name: Chef Organization Validator Key
  description: Credential type for Chef Organization Validator Key
  kind: cloud
  inputs:
    fields:
    - id: org_validator_path
      type: string
      label: Organization Validator Path
      help_text: File path where the organization validator PEM key will be stored
    - id: org_validator_content
      type: string
      label: Organization Validator Content
      secret: true
      help_text: PEM key content for Chef organization validation
    required:
    - org_validator_path
  injectors:
    extra_vars:
      org_validator_path: !unsafe '{{ org_validator_path }}'
      org_validator_content: !unsafe '{{ org_validator_content }}'
