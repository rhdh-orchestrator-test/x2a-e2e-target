- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/chef
    - /tmp/molecule_test/var/log/chef-automate
    - /tmp/molecule_test/var/log/chef
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "# Chef Automate configuration file\n[global]\n  v1 = true\n[deployment]\n  products = [\"automate\", \"infra-server\"]\n[load_balancer]\n  v1 = true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create Chef Automate CLI binary placeholder
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        EXAMPLE_KEY_CONTENT_PLACEHOLDER

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/admin.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        EXAMPLE_ORG_KEY_CONTENT_PLACEHOLDER

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create Chef server configuration files
    ansible.builtin.copy:
      content: '# Chef server configuration

        nginx[''ssl_certificate''] = ''/var/opt/chef/ssl/cert.pem''

        nginx[''ssl_certificate_key''] = ''/var/opt/chef/ssl/key.pem''

        nginx[''ssl_protocols''] = ''TLSv1.2''

        bookshelf[''storage_type''] = ''filesystem''

        '
      dest: /tmp/molecule_test/etc/chef/chef-server.rb
      mode: '0644'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: "{\n  \"status\": \"running\",\n  \"services\": [\n    {\"name\": \"automate-gateway\", \"status\": \"running\"},\n    {\"name\": \"automate-postgresql\",
        \"status\": \"running\"},\n    {\"name\": \"automate-elasticsearch\", \"status\": \"running\"},\n    {\"name\": \"automate-ui\", \"status\": \"running\"},\n
        \   {\"name\": \"infra-server\", \"status\": \"running\"}\n  ]\n}\n"
      dest: /tmp/molecule_test/var/opt/chef-automate/status.json
      mode: '0644'
  - name: Create Chef server user list file
    ansible.builtin.copy:
      content: 'admin

        pivotal

        '
      dest: /tmp/molecule_test/var/opt/chef/user-list.txt
      mode: '0644'
  - name: Create Chef server organization list file
    ansible.builtin.copy:
      content: 'lab

        '
      dest: /tmp/molecule_test/var/opt/chef/org-list.txt
      mode: '0644'
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '# Kernel parameters for Chef Automate

        vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create hostname file
    ansible.builtin.copy:
      content: 'automate.chef.lab '
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
