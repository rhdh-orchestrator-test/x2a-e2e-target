---
controller_credentials:
- name: Chef Admin User Credentials - chef_deployment
  description: Credentials for the initial Chef admin user
  organization: Default
  credential_type: Chef Admin User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    email: '{{ email }}'
    full_name: '{{ full_name }}'
