- name: Verify
  hosts: all
  gather_facts: false
  vars:
    chef_hostname: automate.chef.lab
    chef_user_pem_file: jtonello.pem
    chef_org_validator_pem: lab-validator.pem
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file was created
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Verify hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == chef_hostname
      fail_msg: Hostname is not set correctly
      success_msg: Hostname is set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl configuration file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-deployment.conf
    register: sysctl_file
  - name: Assert sysctl file was created
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl configuration file not found
      success_msg: Sysctl configuration file exists
  - name: Get sysctl file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-deployment.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Verify kernel parameters are set correctly
    ansible.builtin.assert:
      that:
      - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
      - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = 20000')
      fail_msg: Kernel parameters are not set correctly
      success_msg: Kernel parameters are set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI was downloaded
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate installation directory
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-automate
    register: chef_automate_dir
  - name: Assert Chef Automate was installed
    ansible.builtin.assert:
      that:
      - chef_automate_dir.stat.exists
      - chef_automate_dir.stat.isdir
      fail_msg: Chef Automate installation directory not found
      success_msg: Chef Automate installation directory exists
  - name: Check user PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/root/{{ chef_user_pem_file }}
    register: user_pem
  - name: Assert user PEM file was created
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.isreg
      - user_pem.stat.mode == '0600'
      fail_msg: User PEM file not found or has incorrect permissions
      success_msg: User PEM file exists with correct permissions
  - name: Check organization validator PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/root/{{ chef_org_validator_pem }}
    register: org_pem
  - name: Assert organization validator PEM file was created
    ansible.builtin.assert:
      that:
      - org_pem.stat.exists
      - org_pem.stat.isreg
      - org_pem.stat.mode == '0600'
      fail_msg: Organization validator PEM file not found or has incorrect permissions
      success_msg: Organization validator PEM file exists with correct permissions
  - name: Check Chef Automate service file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/systemd/system/chef-automate.service
    register: chef_automate_service
  - name: Assert Chef Automate service file was created
    ansible.builtin.assert:
      that:
      - chef_automate_service.stat.exists
      - chef_automate_service.stat.isreg
      fail_msg: Chef Automate service file not found
      success_msg: Chef Automate service file exists
  - name: Check Chef Server service file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/systemd/system/chef-server.service
    register: chef_server_service
  - name: Assert Chef Server service file was created
    ansible.builtin.assert:
      that:
      - chef_server_service.stat.exists
      - chef_server_service.stat.isreg
      fail_msg: Chef Server service file not found
      success_msg: Chef Server service file exists
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: chef_automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Check Chef Automate health API
    ansible.builtin.uri:
      url: https://localhost/api/v0/health
      validate_certs: false
    register: chef_automate_health
    failed_when: false
    tags: molecule-notest
  - name: Check Chef Server status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: chef_server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Check Chef Server test
    ansible.builtin.command:
      cmd: sudo chef-server-ctl test
    register: chef_server_test
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Check service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is active
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      - ansible_facts.services['chef-automate.service'].state == 'running'
      fail_msg: Chef Automate service is not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Assert Chef Server service is active
    ansible.builtin.assert:
      that:
      - '''chef-server.service'' in ansible_facts.services'
      - ansible_facts.services['chef-server.service'].state == 'running'
      fail_msg: Chef Server service is not running
      success_msg: Chef Server service is running
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
