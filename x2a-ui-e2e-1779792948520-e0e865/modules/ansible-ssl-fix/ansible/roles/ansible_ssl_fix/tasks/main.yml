---
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: apache2
    state: present
- name: Ensure SSH server is installed
  ansible.builtin.package:
    name: openssh-server
    state: present
- name: Check if Apache SSL config file exists
  ansible.builtin.stat:
    path: "{{ apache_ssl_config_path }}"
  register: ssl_config_file
- name: Fix SSL in Apache
  ansible.builtin.replace:
    path: "{{ apache_ssl_config_path }}"
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol {{ ssl_protocol_string }}
    mode: "0644"
  when: ssl_config_file.stat.exists
  notify:
    - Restart apache
    - Restart sshd
