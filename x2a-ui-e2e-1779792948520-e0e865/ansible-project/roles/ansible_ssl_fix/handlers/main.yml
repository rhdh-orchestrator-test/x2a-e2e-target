---
- name: Restart apache
  ansible.builtin.service:
    name: apache2
    state: restarted
  when: ansible_facts.services is defined and 'apache2' in ansible_facts.services
- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
  when: ansible_facts.services is defined and 'sshd' in ansible_facts.services
