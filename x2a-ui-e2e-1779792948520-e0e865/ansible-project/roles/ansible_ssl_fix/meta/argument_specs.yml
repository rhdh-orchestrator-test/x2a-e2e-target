---
argument_specs:
  main:
    short_description: Role to mitigate POODLE vulnerability by disabling SSLv3
    description:
      - This role configures Apache and SSH servers to mitigate the POODLE vulnerability
      - Disables SSLv3 and enables only TLSv1.2 in Apache configuration
      - Restarts Apache and SSH services after configuration changes
    options:
      apache_ssl_config_path:
        type: str
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file
      ssl_protocol_string:
        type: str
        default: -all +TLSv1.2
        description: SSL protocol string to configure in Apache
