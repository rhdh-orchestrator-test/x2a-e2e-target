- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/apache2/mods-available
    - /tmp/molecule_test/etc/ssh
  - name: Create mock Apache SSL config file
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        SSLEngine on

        SSLProtocol all -SSLv3

        SSLHonorCipherOrder on

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Set variables for testing
    ansible.builtin.set_fact:
      apache_ssl_config_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
  - name: Include ansible_ssl_fix role
    ansible.builtin.include_role:
      name: ansible_ssl_fix
    vars:
      apache_ssl_config_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
