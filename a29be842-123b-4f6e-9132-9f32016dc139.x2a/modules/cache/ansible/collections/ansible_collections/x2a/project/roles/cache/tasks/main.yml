---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install Redis package
  ansible.builtin.package:
    name:
      - redis-server
      - memcached
    state: present

- name: Ensure Redis group exists
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    state: present

- name: Ensure Redis user exists
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    system: true
    state: present

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    recurse: true

- name: Ensure Redis configuration exists
  ansible.builtin.file:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    state: file
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0640"

- name: Configure Redis port
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    regexp: "^\\s*port\\s+"
    line: "port {{ cache_redis_port }}"
    state: present
    create: false
    backup: true
  notify: Restart Redis

- name: Configure Redis password # noqa: L039 - redis_password is validated by the preceding credential validation task
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    regexp: "^\\s*requirepass\\s+"
    line: "requirepass {{ redis_password }}"
    state: present
    create: false
    backup: true
  notify: Restart Redis
  no_log: "{{ cache_secure_logging }}"

- name: Remove replica-serve-stale-data directive # noqa: R115 - config path is a fixed role default
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    regexp: "^replica-serve-stale-data.*$"
    state: absent
    create: false
    backup: true
  notify: Restart Redis

- name: Remove replica-read-only directive # noqa: R115 - config path is a fixed role default
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    regexp: "^replica-read-only.*$"
    state: absent
    create: false
    backup: true
  notify: Restart Redis

- name: Remove repl-ping-replica-period directive # noqa: R115 - config path is a fixed role default
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    regexp: "^repl-ping-replica-period.*$"
    state: absent
    create: false
    backup: true
  notify: Restart Redis

- name: Remove client-output-buffer-limit directive # noqa: R115 - config path is a fixed role default
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    regexp: "^client-output-buffer-limit.*$"
    state: absent
    create: false
    backup: true
  notify: Restart Redis

- name: Remove replica-priority directive # noqa: R115 - config path is a fixed role default
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    regexp: "^replica-priority.*$"
    state: absent
    create: false
    backup: true
  notify: Restart Redis

- name: Enable and start Redis
  ansible.builtin.service:
    name: "{{ cache_redis_service_name }}"
    enabled: true
    state: started

- name: Enable and start Memcached
  ansible.builtin.service:
    name: memcached
    enabled: true
    state: started
