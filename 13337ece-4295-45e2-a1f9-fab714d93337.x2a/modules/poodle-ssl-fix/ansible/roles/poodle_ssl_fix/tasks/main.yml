---
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: apache2
    state: present
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: "{{ poodle_ssl_fix_apache_config_path }}"
    regexp: ^SSLProtocol.*$
    replace: "{{ poodle_ssl_fix_apache_ssl_protocol }}"
    backup: true
  notify:
    - Restart apache2
    - Restart sshd
