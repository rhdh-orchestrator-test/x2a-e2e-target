---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache
    description:
      - Configures Apache SSL settings to disable vulnerable SSL protocols
      - Replaces SSLProtocol configuration to use only TLS 1.2
      - Addresses POODLE (Padding Oracle On Downgraded Legacy Encryption) vulnerability
    options:
      poodle_ssl_fix_apache_config_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file
      poodle_ssl_fix_apache_ssl_protocol:
        type: str
        required: false
        default: SSLProtocol -all +TLSv1.2
        description: SSL protocol configuration for Apache
      poodle_ssl_fix_restart_services:
        type: bool
        required: false
        default: true
        description: Whether to restart services after configuration changes
