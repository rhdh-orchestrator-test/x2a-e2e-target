---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application
    description:
      - Installs the FastAPI tutorial application, PostgreSQL dependencies, and systemd service.
      - Configures the application database and environment using the injected AAP database password.
    options:
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks that handle the database password.
      fastapi_tutorial_app_directory:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Installation directory for the FastAPI tutorial application.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI tutorial application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_venv_directory:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_database_user:
        type: str
        required: false
        default: fastapi
        description: PostgreSQL role used by the application.
      fastapi_tutorial_database_name:
        type: str
        required: false
        default: fastapi_db
        description: PostgreSQL database used by the application.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: localhost
        description: PostgreSQL hostname used in the application connection URL.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name for the application.
      fastapi_tutorial_service_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which the FastAPI service listens.
      fastapi_tutorial_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - python3-psycopg2
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
        description: System packages required by the application.
      db_password:
        type: str
        required: true
        description: PostgreSQL password injected by an AAP credential type.
