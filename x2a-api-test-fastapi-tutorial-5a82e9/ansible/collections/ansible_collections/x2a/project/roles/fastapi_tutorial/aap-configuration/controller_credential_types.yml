---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Password for the PostgreSQL role used by the FastAPI application.
    kind: cloud
    inputs:
      fields:
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role, used in the application DATABASE_URL and database user creation.
      required:
        - db_password
    injectors:
      extra_vars:
        db_password: !unsafe "{{ db_password }}"
