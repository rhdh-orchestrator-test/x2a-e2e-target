---
- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/haproxy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Deploy systemd service override
  ansible.builtin.copy:
    content: "[Service] ExecStart= ExecStart=/usr/sbin/haproxy -Ws -f {{ config_file }} -f {{ config_dir }}/conf.d/ -p /run/haproxy.pid -S /run/haproxy-master.sock "
    dest: /etc/systemd/system/haproxy.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload systemd
    - Restart haproxy
- name: Flush handlers to ensure configuration is deployed
  ansible.builtin.meta: flush_handlers
- name: Validate HAProxy configuration
  ansible.builtin.command:
    cmd: haproxy -c -f {{ config_file }} -f {{ config_dir }}/conf.d/
  changed_when: false
  check_mode: false
- name: Start and enable HAProxy service
  ansible.builtin.service:
    name: "{{ service_name }}"
    state: started
    enabled: true
- name: Deploy logrotate configuration
  ansible.builtin.copy:
    content: "/var/log/haproxy/*.log { daily rotate 14 missingok notifempty compress delaycompress sharedscripts postrotate /bin/kill -HUP $(cat /var/run/haproxy.pid
      2>/dev/null) 2>/dev/null || true endscript } "
    dest: /etc/logrotate.d/haproxy
    owner: root
    group: root
    mode: "0644"
    backup: true
