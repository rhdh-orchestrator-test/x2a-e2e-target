---
- name: Set HAProxy configuration variables
  ansible.builtin.set_fact:
    haproxy_package_name: "{{ package_name }}"
    haproxy_config_dir: "{{ config_dir }}"
    haproxy_config_file: "{{ config_file }}"
    haproxy_service_name: "{{ service_name }}"
    haproxy_user: "{{ user }}"
    haproxy_group: "{{ group }}"
    haproxy_stats_enabled: "{{ stats_enabled }}"
    haproxy_stats_port: "{{ stats_port }}"
    haproxy_stats_uri: "{{ stats_uri }}"
    haproxy_global_maxconn: "{{ global_maxconn }}"
    haproxy_client_timeout: "{{ client_timeout }}"
    haproxy_server_timeout: "{{ server_timeout }}"
    haproxy_connect_timeout: "{{ connect_timeout }}"
    haproxy_retries: "{{ haproxy_retries }}"
    haproxy_ssl_enabled: "{{ ssl_enabled }}"
    haproxy_ssl_cert_path: "{{ ssl_cert_path }}"
    haproxy_ssl_key_path: "{{ ssl_key_path }}"
    haproxy_ssl_ciphers: "{{ ssl_ciphers }}"
    haproxy_ssl_min_version: "{{ ssl_min_version }}"
    haproxy_log_server: "{{ log_server }}"
    haproxy_log_facility: "{{ log_facility }}"
    haproxy_log_level: "{{ log_level }}"
    haproxy_backends: "{{ backends }}"
    haproxy_discovery_enabled: "{{ discovery_enabled }}"
- name: Display HAProxy configuration summary
  ansible.builtin.debug:
    msg:
      - "HAProxy Configuration Summary:"
      - "Package: {{ haproxy_package_name }}"
      - "Service: {{ haproxy_service_name }}"
      - "Config file: {{ haproxy_config_file }}"
      - "SSL enabled: {{ haproxy_ssl_enabled }}"
      - "Stats enabled: {{ haproxy_stats_enabled }}"
      - "Discovery enabled: {{ haproxy_discovery_enabled }}"
      - "Backend count: {{ haproxy_backends | length }}"
