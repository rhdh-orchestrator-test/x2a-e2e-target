---
argument_specs:
  main:
    short_description: Deploy FastAPI tutorial web application with PostgreSQL backend
    description:
      - Installs Python 3 and required system packages
      - Clones FastAPI tutorial repository from GitHub
      - Sets up Python virtual environment and installs dependencies
      - Configures PostgreSQL database with dedicated user and database
      - Creates systemd service for the FastAPI application
      - Runs the application on configurable port using uvicorn ASGI server
    options:
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Directory where the FastAPI application will be installed
      fastapi_tutorial_app_user:
        type: str
        required: false
        default: root
        description: System user that will own the application files and run the service
      fastapi_tutorial_app_group:
        type: str
        required: false
        default: root
        description: System group that will own the application files
      fastapi_tutorial_app_port:
        type: int
        required: false
        default: 8000
        description: TCP port the FastAPI application will listen on
      fastapi_tutorial_app_host:
        type: str
        required: false
        default: 0.0.0.0
        description: IP address the FastAPI application will bind to
      fastapi_tutorial_git_repo:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the FastAPI tutorial application
      fastapi_tutorial_git_branch:
        type: str
        required: false
        default: main
        description: Git branch to checkout from the repository
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: "{{ fastapi_tutorial_app_dir }}/venv"
        description: Path where the Python virtual environment will be created
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name used in the application configuration
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version used in the application configuration
      fastapi_tutorial_db_host:
        type: str
        required: false
        default: "{{ db_host | default('localhost') }}"
        description: PostgreSQL database host (uses AAP credential variable db_host)
      fastapi_tutorial_db_name:
        type: str
        required: false
        default: "{{ db_name | default('fastapi_db') }}"
        description: PostgreSQL database name (uses AAP credential variable db_name)
      fastapi_tutorial_db_user:
        type: str
        required: false
        default: "{{ db_username | default('fastapi') }}"
        description: PostgreSQL database username (uses AAP credential variable db_username)
      fastapi_tutorial_db_password:
        type: str
        required: false
        default: "{{ db_password | default('fastapi_password') }}"
        description: PostgreSQL database password (uses AAP credential variable db_password)
      fastapi_tutorial_system_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
        description: List of system packages required for the FastAPI application
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Name of the systemd service for the FastAPI application
      fastapi_tutorial_service_description:
        type: str
        required: false
        default: FastAPI Tutorial Service
        description: Description for the systemd service
      fastapi_tutorial_service_after:
        type: list
        elements: str
        required: false
        default:
          - network.target
          - postgresql.service
        description: List of systemd units that must be started before this service
      db_username:
        type: str
        required: true
        description: Database username injected by AAP credential type at runtime
      db_password:
        type: str
        required: true
        description: Database password injected by AAP credential type at runtime
      db_host:
        type: str
        required: true
        description: Database host injected by AAP credential type at runtime
      db_name:
        type: str
        required: true
        description: Database name injected by AAP credential type at runtime
