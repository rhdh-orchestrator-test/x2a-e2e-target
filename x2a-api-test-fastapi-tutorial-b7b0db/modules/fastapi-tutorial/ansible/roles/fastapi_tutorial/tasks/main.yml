---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install required system packages
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_system_packages }}"
    state: present
- name: Create application user
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_app_user }}"
    group: "{{ fastapi_tutorial_app_group }}"
    system: true
    shell: /bin/bash
    home: "{{ fastapi_tutorial_app_dir }}"
    create_home: false
  when: fastapi_tutorial_app_user != 'root'
- name: Create application group
  ansible.builtin.group:
    name: "{{ fastapi_tutorial_app_group }}"
    system: true
  when: fastapi_tutorial_app_group != 'root'
- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}"
    state: directory
    owner: "{{ fastapi_tutorial_app_user }}"
    group: "{{ fastapi_tutorial_app_group }}"
    mode: "0755"
- name: Clone FastAPI tutorial repository
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_git_repo }}"
    dest: "{{ fastapi_tutorial_app_dir }}"
    version: "{{ fastapi_tutorial_git_branch }}"
    force: true
  become_user: "{{ fastapi_tutorial_app_user }}"
- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv {{ fastapi_tutorial_venv_path }}
    creates: "{{ fastapi_tutorial_venv_path }}/bin/python"
  become_user: "{{ fastapi_tutorial_app_user }}"
- name: Install Python dependencies from requirements.txt
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_venv_path }}"
  become_user: "{{ fastapi_tutorial_app_user }}"
- name: Enable and start PostgreSQL service
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started
- name: Check if PostgreSQL database user exists
  ansible.builtin.command:
    cmd: sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ fastapi_tutorial_db_user }}'"
  register: db_user_exists
  changed_when: false
  failed_when: false
- name: Create PostgreSQL database user
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "CREATE USER {{ fastapi_tutorial_db_user }} WITH PASSWORD '{{ fastapi_tutorial_db_password }}';"
  when: db_user_exists.stdout != '1'
- name: Check if PostgreSQL database exists
  ansible.builtin.command:
    cmd: sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ fastapi_tutorial_db_name }}'"
  register: db_exists
  changed_when: false
  failed_when: false
- name: Create PostgreSQL database
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "CREATE DATABASE {{ fastapi_tutorial_db_name }} OWNER {{ fastapi_tutorial_db_user }};"
  when: db_exists.stdout != '1'
- name: Grant privileges on database
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ fastapi_tutorial_db_name }} TO {{ fastapi_tutorial_db_user }};"
  when: db_exists.stdout != '1'
- name: Create environment configuration file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ fastapi_tutorial_app_dir }}/.env"
    mode: "0644"
    owner: "{{ fastapi_tutorial_app_user }}"
    group: "{{ fastapi_tutorial_app_group }}"
    backup: true
- name: Create systemd service file
  ansible.builtin.template:
    src: fastapi-tutorial.service.j2
    dest: /etc/systemd/system/{{ fastapi_tutorial_service_name }}.service
    mode: "0644"
    owner: root
    group: root
    backup: true
  notify:
    - Reload systemd daemon
    - Restart fastapi tutorial service
- name: Enable and start FastAPI tutorial service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
