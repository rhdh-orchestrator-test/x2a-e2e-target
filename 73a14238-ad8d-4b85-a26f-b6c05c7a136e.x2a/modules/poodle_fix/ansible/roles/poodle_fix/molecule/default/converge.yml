- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache mods-available
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create mock ssl.conf file with vulnerable configuration
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        # This file contains a vulnerable SSLProtocol setting that will be fixed by the role

        SSLEngine on

        SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem

        SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

        SSLProtocol all -SSLv3

        SSLHonorCipherOrder on

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Fix SSL in Apache (simulating role task)
    ansible.builtin.replace:
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
