---
- name: Wait for Chef Server to be fully operational
  ansible.builtin.wait_for:
    path: /var/opt/opscode/bootstrapped
    state: present
    timeout: 300
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_username }} {{ chef_longusername }} {{ chef_useremail }} "{{ password }}" --filename {{ chef_user_pem_path }}
  args:
    creates: "{{ chef_user_pem_path }}"
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_orgname }} "{{ chef_longorgname }}" --association_user {{ chef_username }} --filename {{ chef_org_pem_path }}
  args:
    creates: "{{ chef_org_pem_path }}"
  become: true
