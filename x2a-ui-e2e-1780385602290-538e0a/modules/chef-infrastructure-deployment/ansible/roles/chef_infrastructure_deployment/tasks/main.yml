---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Set system hostname
  ansible.builtin.include_tasks: set_hostname.yml
- name: Configure kernel parameters
  ansible.builtin.include_tasks: configure_kernel.yml
- name: Deploy Chef Automate with Chef Infra Server
  ansible.builtin.include_tasks: deploy_automate.yml
  when: chef_deployment_type == 'automate_and_server'
- name: Deploy Chef Infra Server only
  ansible.builtin.include_tasks: deploy_chef_server.yml
  when: chef_deployment_type == 'server_only'
- name: Create Chef user and organization
  ansible.builtin.include_tasks: create_chef_user_org.yml
