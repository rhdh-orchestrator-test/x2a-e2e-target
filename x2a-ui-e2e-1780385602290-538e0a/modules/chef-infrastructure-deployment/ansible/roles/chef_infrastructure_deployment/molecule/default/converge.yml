---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create directory structure for testing
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/home/{{ ansible_user }}
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/opscode

    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    - name: Create mock kernel parameter files
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "/tmp/molecule_test/proc/sys/vm/{{ item.name }}"
        mode: "0644"
      loop:
        - name: max_map_count
          value: "262144"
        - name: dirty_expire_centisecs
          value: "20000"

    - name: Create mock Chef user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          MOCK_PEM_CONTENT_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/{{ ansible_user }}/jtonello.pem"
        mode: "0600"

    - name: Create mock Chef organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          MOCK_ORG_PEM_CONTENT_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/{{ ansible_user }}/lab-validator.pem"
        mode: "0600"

    - name: Create mock Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-postgresql       running (PID: 12345)
          Service: automate-elasticsearch    running (PID: 12346)
          Service: automate-gateway          running (PID: 12347)
          Service: chef-server               running (PID: 12348)
        dest: /tmp/molecule_test/var/opt/chef-automate/status.txt
        mode: "0644"

    - name: Create mock Chef Server status file
      ansible.builtin.copy:
        content: |
          run: postgresql: (pid 12345) 123 days, 12:34:56
          run: bookshelf: (pid 12346) 123 days, 12:34:56
          run: oc_bifrost: (pid 12347) 123 days, 12:34:56
          run: oc_id: (pid 12348) 123 days, 12:34:56
          run: opscode-erchef: (pid 12349) 123 days, 12:34:56
        dest: /tmp/molecule_test/var/opt/opscode/status.txt
        mode: "0644"

    - name: Create mock Chef user list file
      ansible.builtin.copy:
        content: |
          jtonello
          admin
        dest: /tmp/molecule_test/var/opt/opscode/user-list.txt
        mode: "0644"

    - name: Create mock Chef organization list file
      ansible.builtin.copy:
        content: |
          lab
        dest: /tmp/molecule_test/var/opt/opscode/org-list.txt
        mode: "0644"

    - name: Create mock network listening file
      ansible.builtin.copy:
        content: |
          tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      12345/nginx
        dest: /tmp/molecule_test/var/opt/chef-automate/netstat.txt
        mode: "0644"

    - name: Create mock process list file
      ansible.builtin.copy:
        content: |
          root     12345  0.0  0.2 123456 12345 ?        Ss   Jun01   0:00 /usr/bin/chef-server
          root     12346  0.0  0.2 123456 12345 ?        Ss   Jun01   0:00 /usr/bin/automate
        dest: /tmp/molecule_test/var/opt/chef-automate/processes.txt
        mode: "0644"