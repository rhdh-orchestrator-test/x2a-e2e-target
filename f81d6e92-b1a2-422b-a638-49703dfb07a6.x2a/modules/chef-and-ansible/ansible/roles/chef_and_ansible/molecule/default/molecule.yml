dependency:
  name: galaxy
driver:
  name: vagrant
platforms:
- name: ubuntu-20.04
  box: ubuntu/focal64
provisioner:
  name: ansible
  playbooks:
    converge: ../../tasks/website_https.yml
verifier:
  name: ansible
  playbooks:
    verify: ../../tests/website_https_verify.yml
scenario:
  name: default
  test_sequence:
  - dependency
  - lint
  - cleanup
  - destroy
  - syntax
  - create
  - prepare
  - converge
  - idempotence
  - verify
  - cleanup
  - destroy
