---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the PostgreSQL role and database used by the FastAPI tutorial application; the password is currently hardcoded in the Chef 
      recipe and should be stored in Ansible Vault.
    kind: cloud
    inputs:
      fields:
        - id: database_user
          type: string
          label: Database User
          help_text: PostgreSQL role used by the FastAPI application.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL role; currently hardcoded as fastapi_password and should be rotated and stored securely.
      required:
        - database_user
        - database_name
        - db_password
    injectors:
      extra_vars:
        database_user: !unsafe "{{ database_user }}"
        database_name: !unsafe "{{ database_name }}"
        db_password: !unsafe "{{ db_password }}"
