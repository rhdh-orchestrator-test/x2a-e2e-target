---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application
    description:
      - Deploys the FastAPI tutorial source, Python virtual environment, PostgreSQL dependency, environment file, and systemd service.
    options:
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks handling the database password.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the application source.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git branch, tag, or revision to deploy.
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_venv_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_env_file:
        type: str
        required: false
        default: /opt/fastapi-tutorial/.env
        description: Application environment file path.
      fastapi_tutorial_service_unit:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Systemd unit file path.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name written to the application environment.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version written to the application environment.
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: User running the FastAPI systemd service.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: FastAPI systemd service name.
      fastapi_tutorial_bind_address:
        type: str
        required: false
        default: 0.0.0.0
        description: Address on which Uvicorn listens.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which Uvicorn listens.
      database_user:
        type: str
        required: true
        description: PostgreSQL role name injected by an AAP credential type.
      database_name:
        type: str
        required: true
        description: PostgreSQL database name injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: PostgreSQL password injected by an AAP credential type.
