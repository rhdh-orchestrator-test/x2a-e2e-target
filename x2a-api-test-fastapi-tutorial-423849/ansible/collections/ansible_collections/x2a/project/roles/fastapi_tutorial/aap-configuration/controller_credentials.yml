---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials for the PostgreSQL role and database used by the FastAPI tutorial application; the password is currently hardcoded in the Chef 
      recipe and should be stored in Ansible Vault.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      database_user: "{{ database_user }}"
      database_name: "{{ database_name }}"
      db_password: "{{ vault_db_password }}"
