---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters for Chef Automate
  ansible.builtin.command:
    cmd: sysctl -w {{ item.key }}={{ item.value }}
  loop: "{{ chef_automate_sysctl_params | dict2items }}"
  become: true
  changed_when: false
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate_linux_amd64.zip > {{ chef_automate_cli_path }} && chmod +x {{ chef_automate_cli_path }}
    creates: "{{ chef_automate_cli_path | regex_replace('^\\.\\/(.*)$', '/\\1') if chef_automate_cli_path.startswith('./') else chef_automate_cli_path }}"
- name: Deploy Chef Automate with Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product automate --product infra-server --accept-terms-and-mlsa=true"
    creates: /etc/chef-automate/config.toml
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}"  --filename {{ chef_automate_user_pem_path }}
    creates: "{{ chef_automate_user_pem_path }}"
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_orgname }} "{{ chef_automate_longorgname }}"  --association_user {{ username }}  --filename {{
      chef_automate_org_pem_path }}
    creates: "{{ chef_automate_org_pem_path }}"
  become: true
