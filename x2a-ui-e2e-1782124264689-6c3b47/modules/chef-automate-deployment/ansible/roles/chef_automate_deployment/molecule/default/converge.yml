- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    password: testpassword
    email: jtonello@example.com
    full_name: John Tonello
    chef_automate_hostname: automate.chef.lab
    chef_automate_orgname: lab
    chef_automate_longorgname: Chef Lab
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
    chef_automate_user_pem_path: /tmp/molecule_test/jtonello.pem
    chef_automate_org_pem_path: /tmp/molecule_test/lab-validator.pem
    chef_automate_deploy_type: automate_with_infra
  tasks:
  - name: Create required directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/hostname
    - /tmp/molecule_test/proc/sys/vm
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl parameter files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/vm/{{ item.key | regex_replace('^vm\.', '') }}
      mode: '0644'
    loop:
    - key: vm.max_map_count
      value: '262144'
    - key: vm.dirty_expire_centisecs
      value: '20000'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Mock'' '
      dest: '{{ chef_automate_cli_path }}'
      mode: '0755'
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "# Mock Chef Automate config file\n[global]\n  v1 = true\n[deployment]\n  automate = true\n  infra_server = true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAzMock_pem_content_for_testing

        -----END RSA PRIVATE KEY-----

        '
      dest: '{{ chef_automate_user_pem_path }}'
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAzMock_org_validator_pem_content

        -----END RSA PRIVATE KEY-----

        '
      dest: '{{ chef_automate_org_pem_path }}'
      mode: '0600'
