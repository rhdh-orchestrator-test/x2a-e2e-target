---
- name: Ensure directory exists for PEM files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_pem_path }}"
    - "{{ chef_automate_org_validator_pem_path }}"
  become: true
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_automate_user_pem_path }}

      '
  args:
    creates: "{{ chef_automate_user_pem_path }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ org_name }} "{{ org_full_name }}" --association_user {{ username }} --filename {{ chef_automate_org_validator_pem_path }}

      '
  args:
    creates: "{{ chef_automate_org_validator_pem_path }}"
  become: true
- name: Store user PEM content
  ansible.builtin.copy:
    content: "{{ user_pem }}"
    dest: "{{ chef_automate_user_pem_path }}"
    mode: "0600"
  when: user_pem is defined and user_pem | length > 0
  no_log: true
- name: Store organization validator PEM content
  ansible.builtin.copy:
    content: "{{ org_validator_pem }}"
    dest: "{{ chef_automate_org_validator_pem_path }}"
    mode: "0600"
  when: org_validator_pem is defined and org_validator_pem | length > 0
  no_log: true
