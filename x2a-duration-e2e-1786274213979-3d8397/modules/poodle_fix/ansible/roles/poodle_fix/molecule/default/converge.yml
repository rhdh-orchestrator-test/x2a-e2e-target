- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create mock Apache SSL config file
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        SSLProtocol all -SSLv3

        # Other SSL settings would go here

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Mock Apache installation (package tasks can't run in container)
    ansible.builtin.debug:
      msg: Simulating Apache installation
  - name: Fix SSL in Apache (from role)
    ansible.builtin.replace:
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
