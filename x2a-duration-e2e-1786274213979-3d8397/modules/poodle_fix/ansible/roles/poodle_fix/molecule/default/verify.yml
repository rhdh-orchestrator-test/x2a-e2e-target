---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check if Apache SSL config file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_config_file

    - name: Assert SSL config file exists
      ansible.builtin.assert:
        that:
          - ssl_config_file.stat.exists
          - ssl_config_file.stat.isreg
        fail_msg: "Apache SSL config file does not exist"
        success_msg: "Apache SSL config file exists"

    - name: Get SSL config file content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_config_content
      when: ssl_config_file.stat.exists

    - name: Assert SSL protocol is properly configured
      ansible.builtin.assert:
        that:
          - ssl_config_content.content | b64decode | regex_search('SSLProtocol -all \+TLSv1\.2')
        fail_msg: "SSL protocol is not properly configured to mitigate POODLE vulnerability"
        success_msg: "SSL protocol is properly configured to mitigate POODLE vulnerability"
      when: ssl_config_file.stat.exists

    # The following checks would be performed in a real environment but can't run in a container
    # They are tagged with molecule-notest to be skipped during molecule testing

    - name: Check Apache service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2' in ansible_facts.services"
          - "ansible_facts.services['apache2'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Check SSH service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert SSH service is running
      ansible.builtin.assert:
        that:
          - "'sshd' in ansible_facts.services"
          - "ansible_facts.services['sshd'].state == 'running'"
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"
      tags: molecule-notest

    - name: Check Apache config syntax
      ansible.builtin.command: apache2ctl configtest
      register: apache_config_test
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Apache config syntax is valid
      ansible.builtin.assert:
        that:
          - apache_config_test.rc == 0
        fail_msg: "Apache config syntax is invalid"
        success_msg: "Apache config syntax is valid"
      tags: molecule-notest

    - name: Test HTTPS connectivity
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
      register: https_test
      failed_when: false
      tags: molecule-notest

    - name: Assert HTTPS connectivity works
      ansible.builtin.assert:
        that:
          - https_test.status == 200
        fail_msg: "HTTPS connectivity test failed"
        success_msg: "HTTPS connectivity test passed"
      tags: molecule-notest