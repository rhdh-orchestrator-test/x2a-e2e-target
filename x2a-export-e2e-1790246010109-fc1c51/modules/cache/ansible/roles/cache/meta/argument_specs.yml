---
argument_specs:
  main:
    short_description: Install and configure cache services (Redis and memcached)
    description:
      - Installs and configures Redis server with authentication
      - Installs and configures memcached service
      - Creates necessary directories and applies security configurations
      - Removes unwanted Redis replica configuration settings
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port Redis server listens on
      cache_redis_password:
        type: str
        required: true
        description: Redis authentication password (injected by AAP credential type)
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory for Redis log files
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to Redis configuration file
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: System user for Redis service
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: System group for Redis service
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: TCP port memcached service listens on
      cache_packages:
        type: list
        elements: str
        required: false
        default:
          - redis-server
          - memcached
        description: List of cache packages to install
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis system service
      cache_memcached_service:
        type: str
        required: false
        default: memcached
        description: Name of the memcached system service
