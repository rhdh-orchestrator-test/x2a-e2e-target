---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
        - /tmp/molecule_test/var/log
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          # Generated by Ansible

          # Network
          bind 127.0.0.1
          port 6379

          # General
          daemonize yes
          supervised systemd
          pidfile /var/run/redis/redis-server.pid

          # Logging
          loglevel notice
          logfile /var/log/redis/redis-server.log

          # Snapshotting
          save 900 1
          save 300 10
          save 60 10000

          # Database
          dir /var/lib/redis
          dbfilename dump.rdb

          # Security
          requirepass redis_secure_password_123

          # Memory management
          maxmemory-policy allkeys-lru

          # Append only file
          appendonly yes
          appendfilename "appendonly.aof"
          appendfsync everysec
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create Redis log file
      ansible.builtin.copy:
        content: |
          # Redis server log
          # This file would contain Redis server logs
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"
        backup: true

    - name: Create memcached log file
      ansible.builtin.copy:
        content: |
          # Memcached log
          # This file would contain memcached logs
        dest: /tmp/molecule_test/var/log/memcached.log
        mode: "0644"
        backup: true

    - name: Create Redis data files
      ansible.builtin.copy:
        content: |
          # Redis database dump file placeholder
        dest: "{{ item_redis_file }}"
        mode: "0644"
        backup: true
      loop:
        - /tmp/molecule_test/var/lib/redis/dump.rdb
        - /tmp/molecule_test/var/lib/redis/appendonly.aof
      loop_control:
        loop_var: item_redis_file