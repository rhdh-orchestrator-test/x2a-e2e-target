---
controller_credential_types:
- name: Redis Authentication Password
  description: Authentication credential for Redis cache server access
  kind: cloud
  inputs:
    fields:
    - id: redis_password
      type: string
      label: Redis Password
      secret: true
      help_text: Password for Redis server authentication on port 6379
    required:
    - redis_password
  injectors:
    extra_vars:
      redis_password: !unsafe '{{ redis_password }}'
