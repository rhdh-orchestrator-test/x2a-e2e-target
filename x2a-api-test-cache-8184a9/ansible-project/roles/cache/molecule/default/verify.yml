---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check service status
      ansible.builtin.service_facts:

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
        fail_msg: "Redis service is not running"

    - name: Assert memcached service is running
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - "ansible_facts.services['memcached.service']['state'] == 'running'"
        fail_msg: "Memcached service is not running"

    - name: Check Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_stat

    - name: Assert Redis configuration file exists
      ansible.builtin.assert:
        that:
          - redis_config_stat['stat']['exists']
          - redis_config_stat['stat']['size'] > 0
        fail_msg: "Redis configuration file not found"

    - name: Check Redis log directory
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory exists with correct permissions
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['exists']
          - redis_log_dir_stat['stat']['isdir']
          - redis_log_dir_stat['stat']['pw_name'] == 'redis'
          - redis_log_dir_stat['stat']['gr_name'] == 'redis'
          - redis_log_dir_stat['stat']['mode'] == '0755'
        fail_msg: "Redis log directory not configured correctly"

    - name: Read Redis configuration file
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis password authentication is configured
      ansible.builtin.assert:
        that:
          - "'requirepass' in redis_config_content['content'] | b64decode"
        fail_msg: "Redis password authentication not configured"

    - name: Assert Redis port is configured
      ansible.builtin.assert:
        that:
          - "'port 6379' in redis_config_content['content'] | b64decode"
        fail_msg: "Redis port not configured correctly"

    - name: Assert replica settings are removed
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in redis_config_content['content'] | b64decode"
          - "'replica-read-only' not in redis_config_content['content'] | b64decode"
          - "'repl-ping-replica-period' not in redis_config_content['content'] | b64decode"
          - "'client-output-buffer-limit' not in redis_config_content['content'] | b64decode"
          - "'replica-priority' not in redis_config_content['content'] | b64decode"
        fail_msg: "Replica settings not properly removed from Redis config"

    - name: Check Redis port connectivity
      ansible.builtin.wait_for:
        port: 6379
        host: localhost
        timeout: 10
      register: redis_port_check

    - name: Check memcached port connectivity
      ansible.builtin.wait_for:
        port: 11211
        host: localhost
        timeout: 10
      register: memcached_port_check

    - name: Test Redis connectivity with authentication
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a {{ redis_password }} ping
      register: redis_auth_test
      changed_when: false
      failed_when: redis_auth_test.stdout != "PONG"

    - name: Test Redis set/get functionality
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a {{ redis_password }} set molecule_test_key "molecule_test_value"
      register: redis_set_test
      changed_when: false

    - name: Test Redis get functionality
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a {{ redis_password }} get molecule_test_key
      register: redis_get_test
      changed_when: false
      failed_when: redis_get_test.stdout != "molecule_test_value"

    - name: Clean up Redis test key
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a {{ redis_password }} del molecule_test_key
      changed_when: false

    - name: Test memcached connectivity
      ansible.builtin.shell: |
        echo "stats" | nc localhost 11211 | head -1
      register: memcached_stats_test
      changed_when: false
      failed_when: "'STAT' not in memcached_stats_test.stdout"