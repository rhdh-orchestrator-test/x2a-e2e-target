---
# Repository-wide test overrides for profile_app_stack.
app_stack_app_name: test-app
app_stack_app_repo: 'file:///tmp/test-app-repo'
app_stack_app_revision: master
app_stack_app_port: 8000
app_stack_app_dir: /opt/test-app
app_stack_app_user: appuser
app_stack_app_group: appuser
app_stack_db_host: localhost
app_stack_db_port: 5432
app_stack_db_name: testdb
app_stack_db_user: testuser
app_stack_worker_count: 2
app_stack_worker_class: sync
app_stack_max_requests: 1000
app_stack_graceful_timeout: 30
app_stack_log_dir: /var/log/test-app
app_stack_log_level: info
app_stack_python_version: python3
app_stack_pip_packages: []
app_stack_secret_key: "{{ secret_key }}"
