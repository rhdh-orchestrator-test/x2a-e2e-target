---
- name: Render application systemd unit
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/{{ app_stack_app_name }}.service # noqa: R114 - unit name is from role defaults
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload systemd

- name: Apply systemd unit changes before starting service
  ansible.builtin.meta: flush_handlers

- name: Enable and start application service
  ansible.builtin.service:
    name: "{{ app_stack_app_name }}"
    enabled: true
    state: started
