---
controller_credentials:
  - name: HashiCorp Vault Database Credential - profile_app_stack
    description: Vault-backed credentials used by the application to connect to PostgreSQL.
    organization: Default
    credential_type: HashiCorp Vault Database Credential
    update_secrets: true
    inputs:
      db_host: "{{ db_host }}"
      db_port: "{{ db_port }}"
      db_name: "{{ db_name }}"
      db_user: "{{ db_user }}"
      db_password: "{{ vault_db_password }}"
  - name: HashiCorp Vault Application Secret Key - profile_app_stack
    description: Vault-backed application signing or encryption secret, including environment-specific overrides.
    organization: Default
    credential_type: HashiCorp Vault Application Secret Key
    update_secrets: true
    inputs:
      secret_key: "{{ vault_secret_key }}"
      production_secret_key: "{{ vault_production_secret_key }}"
      staging_secret_key: "{{ vault_staging_secret_key }}"
