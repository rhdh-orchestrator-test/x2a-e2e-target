---
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - db_host is defined
      - db_port is defined
      - db_name is defined
      - db_user is defined
      - db_password is defined
      - secret_key is defined
      - "deployment_environment | default('') != 'production' or production_secret_key is defined"
      - "deployment_environment | default('') != 'staging' or staging_secret_key is defined"
    fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template.
    quiet: true
