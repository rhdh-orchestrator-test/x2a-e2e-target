---
controller_credential_types:
  - name: HashiCorp Vault Database Credential
    description: Vault-backed credentials used by the application to connect to PostgreSQL.
    kind: cloud
    inputs:
      fields:
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname or address of the PostgreSQL database.
        - id: db_port
          type: string
          label: Database Port
          help_text: Port on which PostgreSQL accepts connections.
        - id: db_name
          type: string
          label: Database Name
          help_text: Name of the application PostgreSQL database.
        - id: db_user
          type: string
          label: Database User
          help_text: Username used by the application to authenticate to PostgreSQL.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Vault-backed PostgreSQL password referenced as vault_app_stack_db_password.
      required:
        - db_host
        - db_port
        - db_name
        - db_user
        - db_password
    injectors:
      extra_vars:
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
        db_name: !unsafe "{{ db_name }}"
        db_user: !unsafe "{{ db_user }}"
        db_password: !unsafe "{{ db_password }}"
  - name: HashiCorp Vault Application Secret Key
    description: Vault-backed application signing or encryption secret, including environment-specific overrides.
    kind: cloud
    inputs:
      fields:
        - id: secret_key
          type: string
          label: Application Secret Key
          secret: true
          help_text: Default Vault-backed application secret key referenced as vault_app_stack_secret_key.
        - id: production_secret_key
          type: string
          label: Production Application Secret Key
          secret: true
          help_text: Production override referenced as vault_app_stack_production_secret_key.
        - id: staging_secret_key
          type: string
          label: Staging Application Secret Key
          secret: true
          help_text: Staging override referenced as vault_app_stack_staging_secret_key.
      required:
        - secret_key
    injectors:
      extra_vars:
        secret_key: !unsafe "{{ secret_key }}"
        production_secret_key: !unsafe "{{ production_secret_key }}"
        staging_secret_key: !unsafe "{{ staging_secret_key }}"
