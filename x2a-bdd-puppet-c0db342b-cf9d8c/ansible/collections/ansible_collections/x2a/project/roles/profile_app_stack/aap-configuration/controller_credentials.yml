---
controller_credentials:
  - name: PostgreSQL Application Database - profile_app_stack
    description: Credentials for the profile_app_stack PostgreSQL database connection and provisioning.
    organization: Default
    credential_type: PostgreSQL Application Database
    update_secrets: true
    inputs:
      db_host: "{{ db_host }}"
      db_port: "{{ db_port }}"
      db_name: "{{ db_name }}"
      db_user: "{{ db_user }}"
      db_password: "{{ vault_db_password }}"
  - name: Python Application Secret Key - profile_app_stack
    description: Secret key used by the deployed Python application.
    organization: Default
    credential_type: Python Application Secret Key
    update_secrets: true
    inputs:
      secret_key: "{{ vault_secret_key }}"
