---
controller_credential_types:
  - name: PostgreSQL Application Database
    description: Credentials for the profile_app_stack PostgreSQL database connection and provisioning.
    kind: cloud
    inputs:
      fields:
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname or address of the PostgreSQL server.
        - id: db_port
          type: string
          label: Database Port
          help_text: TCP port used by the PostgreSQL server.
        - id: db_name
          type: string
          label: Database Name
          help_text: Name of the application database.
        - id: db_user
          type: string
          label: Database User
          help_text: PostgreSQL role used by the application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the application PostgreSQL role; replace the reported plaintext or encrypted Hiera value with a protected secret.
      required:
        - db_host
        - db_port
        - db_name
        - db_user
        - db_password
    injectors:
      extra_vars:
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
        db_name: !unsafe "{{ db_name }}"
        db_user: !unsafe "{{ db_user }}"
        db_password: !unsafe "{{ db_password }}"
  - name: Python Application Secret Key
    description: Secret key used by the deployed Python application.
    kind: cloud
    inputs:
      fields:
        - id: secret_key
          type: string
          label: Application Secret Key
          secret: true
          help_text: Sensitive application secret key; replace the reported plaintext or encrypted Hiera value with an environment-specific protected secret.
      required:
        - secret_key
    injectors:
      extra_vars:
        secret_key: !unsafe "{{ secret_key }}"
