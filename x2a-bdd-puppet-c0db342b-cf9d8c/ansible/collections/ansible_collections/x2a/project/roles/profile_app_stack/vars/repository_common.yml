---
# Repository common values are retained as role variable overrides.
profile_app_stack_app_name: test-app
profile_app_stack_app_repo: file:///tmp/test-app-repo
profile_app_stack_app_revision: master
profile_app_stack_app_port: 8000
profile_app_stack_app_dir: /opt/test-app
profile_app_stack_app_user: appuser
profile_app_stack_app_group: appuser
profile_app_stack_db_host: localhost
profile_app_stack_db_port: 5432
profile_app_stack_db_name: testdb
profile_app_stack_db_user: testuser
profile_app_stack_worker_count: 2
profile_app_stack_worker_class: sync
profile_app_stack_max_requests: 1000
profile_app_stack_graceful_timeout: 30
profile_app_stack_log_dir: /var/log/test-app
profile_app_stack_log_level: info
profile_app_stack_python_version: python3
profile_app_stack_pip_packages: []
