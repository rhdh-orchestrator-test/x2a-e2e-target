---
argument_specs:
  main:
    short_description: Install and configure a Python application stack
    description:
      - Deploys a Python application from Git with a virtual environment, PostgreSQL integration, systemd service, backups, and monitoring.
    options:
      profile_app_stack_app_name:
        type: str
        required: false
        default: myapp-api
        description: Application and systemd service name.
      profile_app_stack_app_repo:
        type: str
        required: false
        default: https://github.com/example-org/myapp-api.git
        description: Git repository URL.
      profile_app_stack_app_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      profile_app_stack_app_port:
        type: int
        required: false
        default: 8000
        description: Application listening port.
      profile_app_stack_app_dir:
        type: str
        required: false
        default: /opt/myapp-api
        description: Application checkout directory.
      profile_app_stack_app_user:
        type: str
        required: false
        default: myapp
        description: Application runtime user.
      profile_app_stack_app_group:
        type: str
        required: false
        default: myapp
        description: Application runtime group.
      profile_app_stack_python_version:
        type: str
        required: false
        default: python3
        description: Python executable used for the virtual environment.
      profile_app_stack_pip_packages:
        type: list
        elements: str
        required: false
        default:
          - uvicorn
          - gunicorn
          - psycopg2-binary
        description: Additional packages installed into the virtual environment.
      profile_app_stack_db_host:
        type: str
        required: false
        default: localhost
        description: PostgreSQL host.
      profile_app_stack_db_port:
        type: int
        required: false
        default: 5432
        description: PostgreSQL port.
      profile_app_stack_db_name:
        type: str
        required: false
        default: myapp_db
        description: Application database name.
      profile_app_stack_db_user:
        type: str
        required: false
        default: myapp_app
        description: Application database user.
      profile_app_stack_worker_count:
        type: int
        required: false
        default: 2
        description: Gunicorn worker count.
      profile_app_stack_worker_class:
        type: str
        required: false
        default: uvicorn.workers.UvicornWorker
        description: Gunicorn worker class.
      profile_app_stack_max_requests:
        type: int
        required: false
        default: 1000
        description: Maximum requests per worker.
      profile_app_stack_graceful_timeout:
        type: int
        required: false
        default: 30
        description: Graceful shutdown timeout in seconds.
      profile_app_stack_log_dir:
        type: str
        required: false
        default: /var/log/myapp-api
        description: Application log directory.
      profile_app_stack_log_level:
        type: str
        required: false
        default: info
        description: Application log level.
      profile_app_stack_log_max_size:
        type: str
        required: false
        default: 100M
        description: Maximum log size before rotation.
      profile_app_stack_log_rotate_count:
        type: int
        required: false
        default: 7
        description: Number of rotated logs to retain.
      profile_app_stack_environment_name:
        type: str
        required: false
        default: staging
        description: Deployment environment name.
      profile_app_stack_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output when handling credentials.
      db_host:
        type: str
        required: true
        description: PostgreSQL host injected by an AAP credential type.
      db_port:
        type: int
        required: true
        description: PostgreSQL port injected by an AAP credential type.
      db_name:
        type: str
        required: true
        description: PostgreSQL database injected by an AAP credential type.
      db_user:
        type: str
        required: true
        description: PostgreSQL user injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: PostgreSQL password injected by an AAP credential type.
      secret_key:
        type: str
        required: true
        description: Application secret injected by an AAP credential type.
