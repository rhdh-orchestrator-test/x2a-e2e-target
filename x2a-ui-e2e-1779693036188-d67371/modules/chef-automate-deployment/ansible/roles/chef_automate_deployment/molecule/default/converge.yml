---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/ansible

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl files
    - name: Create sysctl files
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "/tmp/molecule_test/proc/sys/vm/{{ item.key | regex_replace('^vm\\.', '') }}"
        mode: "0644"
      loop:
        - key: vm.max_map_count
          value: "262144"
        - key: vm.dirty_expire_centisecs
          value: "20000"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: /tmp/molecule_test/chef-automate
        mode: "0755"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          EXAMPLE_KEY_CONTENT_PLACEHOLDER
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/home/ansible/jtonello.pem
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          EXAMPLE_ORG_KEY_CONTENT_PLACEHOLDER
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/home/ansible/lab-validator.pem
        mode: "0600"

    # Simulate Chef Automate status output file
    - name: Create Chef Automate status output file
      ansible.builtin.copy:
        content: |
          Service: automate-load-balancer
            Status: running
          Service: automate-cs-bookshelf
            Status: running
          Service: automate-cs-oc-bifrost
            Status: running
          Service: automate-cs-oc-erchef
            Status: running
          Service: automate-postgresql
            Status: running
        dest: /tmp/molecule_test/chef-automate-status.txt
        mode: "0644"

    # Simulate Chef Server status output file
    - name: Create Chef Server status output file
      ansible.builtin.copy:
        content: |
          run: bookshelf: (pid 12345) 99s; run: log: (pid 12346) 99s
          run: oc_bifrost: (pid 12347) 99s; run: log: (pid 12348) 99s
          run: oc_id: (pid 12349) 99s; run: log: (pid 12350) 99s
          run: opscode-erchef: (pid 12351) 99s; run: log: (pid 12352) 99s
          run: opscode-expander: (pid 12353) 99s; run: log: (pid 12354) 99s
          run: opscode-solr4: (pid 12355) 99s; run: log: (pid 12356) 99s
          run: postgresql: (pid 12357) 99s; run: log: (pid 12358) 99s
          run: rabbitmq: (pid 12359) 99s; run: log: (pid 12360) 99s
          run: redis_lb: (pid 12361) 99s; run: log: (pid 12362) 99s
        dest: /tmp/molecule_test/chef-server-status.txt
        mode: "0644"

    # Simulate user list output
    - name: Create user list output file
      ansible.builtin.copy:
        content: |
          jtonello
          admin
        dest: /tmp/molecule_test/chef-server-user-list.txt
        mode: "0644"

    # Simulate organization list output
    - name: Create organization list output file
      ansible.builtin.copy:
        content: |
          lab
        dest: /tmp/molecule_test/chef-server-org-list.txt
        mode: "0644"

    # Simulate health API response
    - name: Create health API response file
      ansible.builtin.copy:
        content: |
          {"status":"ok"}
        dest: /tmp/molecule_test/health-api-response.json
        mode: "0644"