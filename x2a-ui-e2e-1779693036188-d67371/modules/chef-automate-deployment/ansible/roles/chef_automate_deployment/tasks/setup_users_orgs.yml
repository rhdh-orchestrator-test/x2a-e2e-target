---
- name: Ensure home directory exists for key files
  ansible.builtin.file:
    path: "{{ chef_server_user_key_path | dirname | expanduser }}"
    state: directory
    mode: "0700"
  become: true
  become_user: "{{ ansible_user }}"
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Ensure Chef Server is properly installed
  ansible.builtin.assert:
    that:
      - chef_server_ctl_check.rc == 0
    fail_msg: chef-server-ctl command not found. Ensure Chef Server is properly installed.
    quiet: true
- name: Create Chef Server user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_server_user_key_path | expanduser }}

      '
  become: true
  args:
    creates: "{{ chef_server_user_key_path | expanduser }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
- name: Create Chef Server organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_server_org_name }} "{{ chef_server_org_full_name }}" --association_user {{ username }} --filename {{ chef_server_org_key_path
      | expanduser }}

      '
  become: true
  args:
    creates: "{{ chef_server_org_key_path | expanduser }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
