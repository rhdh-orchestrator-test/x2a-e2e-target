---
controller_credential_types:
- name: Chef Server User Password
  description: Credential type for Chef Server User Password
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef server admin username
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef server admin user
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the Chef server admin user
    - id: email
      type: string
      label: Email
      help_text: Email address of the Chef server admin user
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
