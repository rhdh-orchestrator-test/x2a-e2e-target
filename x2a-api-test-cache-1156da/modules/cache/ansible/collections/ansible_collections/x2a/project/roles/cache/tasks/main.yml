---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install Redis package
  ansible.builtin.package:
    name:
      - "{{ cache_redis_package_name }}"
    state: present

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is a role-defined default
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    recurse: true

- name: Ensure Redis configuration file exists
  ansible.builtin.file:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role-defined default
    state: touch
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0644"
    access_time: preserve
    modification_time: preserve

- name: Configure Redis listener port
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role-defined default
    regexp: ^port\s+
    line: port {{ cache_redis_port }}
    create: false
    mode: "0644"

- name: Configure Redis authentication
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role-defined default
    regexp: ^requirepass\s+
    line: requirepass {{ cache_redis_password }}
    create: false
    mode: "0644"
  no_log: "{{ cache_secure_logging }}"

- name: Remove replica-serve-stale-data directive
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114,R115 - path is a role-defined default and not externally controlled
    regexp: ^replica-serve-stale-data.*$
    state: absent
  when: ansible_facts['filesystems'] is defined

- name: Remove replica-read-only directive
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114,R115 - path is a role-defined default and not externally controlled
    regexp: ^replica-read-only.*$
    state: absent
  when: ansible_facts['filesystems'] is defined

- name: Remove repl-ping-replica-period directive
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114,R115 - path is a role-defined default and not externally controlled
    regexp: ^repl-ping-replica-period.*$
    state: absent
  when: ansible_facts['filesystems'] is defined

- name: Remove client-output-buffer-limit directive
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114,R115 - path is a role-defined default and not externally controlled
    regexp: ^client-output-buffer-limit.*$
    state: absent
  when: ansible_facts['filesystems'] is defined

- name: Remove replica-priority directive
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114,R115 - path is a role-defined default and not externally controlled
    regexp: ^replica-priority.*$
    state: absent
  when: ansible_facts['filesystems'] is defined

- name: Enable and start Redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service_name }}"
    enabled: true
    state: started
