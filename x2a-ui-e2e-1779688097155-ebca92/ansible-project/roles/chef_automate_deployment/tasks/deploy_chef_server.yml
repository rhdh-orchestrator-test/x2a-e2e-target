---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters for optimal performance
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ chef_automate_kernel_params | dict2items }}"
  become: true
- name: Check if Chef Automate CLI tool exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: cli_tool_stat
- name: Download Chef Automate CLI tool
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.gz"
    mode: "0755"
    force: false
  register: download_result
  when: not cli_tool_stat.stat.exists
- name: Extract Chef Automate CLI tool
  ansible.builtin.command:
    cmd: gunzip -c {{ chef_automate_cli_path }}.gz > {{ chef_automate_cli_path }} && chmod +x {{ chef_automate_cli_path }}
  args:
    creates: "{{ chef_automate_cli_path }}"
  when: download_result.changed | default(false)
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa=true"
  args:
    creates: /etc/chef-server/chef-server.rb
  become: true
- name: Create admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ longusername }} {{ useremail }}  "{{ userpassword }}" --filename {{ chef_automate_user_key_file }}
  args:
    creates: "{{ chef_automate_user_key_file }}"
  become: true
- name: Create organization and associate admin user
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ orgname }} "{{ chef_automate_org_long_name }}"  --association_user {{ username }} --filename {{
      chef_automate_org_validator_file }}
  args:
    creates: "{{ chef_automate_org_validator_file }}"
  become: true
