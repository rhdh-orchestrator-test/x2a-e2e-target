---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: testuser
    orgname: testorg
  tasks:
    # Check for Chef Automate CLI tool
    - name: Check Chef Automate CLI tool exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: cli_tool

    - name: Assert Chef Automate CLI tool exists
      ansible.builtin.assert:
        that:
          - cli_tool.stat.exists
          - cli_tool.stat.executable
        fail_msg: "Chef Automate CLI tool not found or not executable"
        success_msg: "Chef Automate CLI tool exists and is executable"

    # Check for Chef Automate config file
    - name: Check Chef Automate config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: automate_config

    - name: Assert Chef Automate config file exists
      ansible.builtin.assert:
        that:
          - automate_config.stat.exists
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    # Check for Chef Server config file
    - name: Check Chef Server config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server/chef-server.rb
      register: server_config

    - name: Assert Chef Server config file exists
      ansible.builtin.assert:
        that:
          - server_config.stat.exists
        fail_msg: "Chef Server config file not found"
        success_msg: "Chef Server config file exists"

    # Check for user key file
    - name: Check user key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ username }}.pem"
      register: user_key

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key.stat.exists
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    # Check for organization validator key file
    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ orgname }}-validator.pem"
      register: org_validator

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_validator.stat.exists
        fail_msg: "Organization validator key file not found"
        success_msg: "Organization validator key file exists"

    # Check for sysctl settings
    - name: Check sysctl settings file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl settings file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
        fail_msg: "Sysctl settings file not found"
        success_msg: "Sysctl settings file exists"

    # Check sysctl file content
    - name: Get sysctl file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl settings are correct
      ansible.builtin.assert:
        that:
          - sysctl_content.content | b64decode is search('vm.max_map_count = 262144')
          - sysctl_content.content | b64decode is search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "Sysctl settings are incorrect"
        success_msg: "Sysctl settings are correct"
      when: sysctl_file.stat.exists

    # The following checks would normally be performed but can't run in a container
    # Adding them with molecule-notest tag

    # Check Chef Automate status
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: chef-automate status
      register: automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    # Check Chef Server status
    - name: Check Chef Server status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Server is running
      ansible.builtin.assert:
        that:
          - server_status.rc == 0
        fail_msg: "Chef Server is not running"
        success_msg: "Chef Server is running"
      tags: molecule-notest

    # Check user list
    - name: Check user list
      ansible.builtin.command:
        cmd: "chef-server-ctl user-list"
      register: user_list
      changed_when: false
      tags: molecule-notest

    - name: Assert user exists
      ansible.builtin.assert:
        that:
          - username in user_list.stdout
        fail_msg: "User not found in Chef Server"
        success_msg: "User exists in Chef Server"
      tags: molecule-notest

    # Check organization list
    - name: Check organization list
      ansible.builtin.command:
        cmd: "chef-server-ctl org-list"
      register: org_list
      changed_when: false
      tags: molecule-notest

    - name: Assert organization exists
      ansible.builtin.assert:
        that:
          - orgname in org_list.stdout
        fail_msg: "Organization not found in Chef Server"
        success_msg: "Organization exists in Chef Server"
      tags: molecule-notest

    # Check network listening
    - name: Check network listening on port 443
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # Check web interface accessibility
    - name: Check web interface accessibility
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
      register: health_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert web interface is accessible
      ansible.builtin.assert:
        that:
          - health_check is succeeded
        fail_msg: "Web interface is not accessible"
        success_msg: "Web interface is accessible"
      tags: molecule-notest