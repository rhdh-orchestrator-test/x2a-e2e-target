---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: testuser
    longusername: Test User
    useremail: test@example.com
    userpassword: testpassword
    orgname: testorg
    chef_deploy_type: automate
    chef_automate_hostname: automate.chef.lab
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
    chef_automate_user_key_file: /tmp/molecule_test/testuser.pem
    chef_automate_org_validator_file: /tmp/molecule_test/testorg-validator.pem
    chef_automate_org_long_name: Test Organization
  tasks:
    # Create directory structure that would be created by the role
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/chef-server
        - /tmp/molecule_test

    # Create mock Chef Automate CLI tool
    - name: Create mock Chef Automate CLI tool
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI mock"
          echo "Version: 1.0.0"
          echo "This is a mock file for testing"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Create mock config files
    - name: Create mock Chef Automate config file
      ansible.builtin.copy:
        content: |
          # Mock Chef Automate config file
          [global]
          hostname = "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/chef-automate/config.toml"
        mode: "0644"

    - name: Create mock Chef Server config file
      ansible.builtin.copy:
        content: |
          # Mock Chef Server config file
          nginx['server_name'] = "automate.chef.lab"
          nginx['ssl_certificate'] = "/var/opt/chef-server/ssl/certs/automate.chef.lab.crt"
          nginx['ssl_certificate_key'] = "/var/opt/chef-server/ssl/private/automate.chef.lab.key"
        dest: "/tmp/molecule_test/etc/chef-server/chef-server.rb"
        mode: "0644"

    # Create mock user and organization key files
    - name: Create mock user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAv8MoCHvAK+K9VVsQQvJJc9FrMcgmzN3DD9a1PoUvwJKNGg==
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/testuser.pem"
        mode: "0600"

    - name: Create mock organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAv8MoCHvAK+K9VVsQQvJJc9FrMcgmzN3DD9a1PoUvwJKNGg==
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/testorg-validator.pem"
        mode: "0600"

    # Create mock sysctl settings file
    - name: Create mock sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"