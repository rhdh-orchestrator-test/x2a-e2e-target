---
controller_credential_types:
- name: Chef Server Admin User
  description: Credential type for Chef Server Admin User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Admin username for Chef Automate and Chef Infra Server
    - id: longusername
      type: string
      label: Full Name
      help_text: Full name of the admin user
    - id: useremail
      type: string
      label: Email Address
      help_text: Email address for the admin user
    - id: userpassword
      type: string
      label: Password
      secret: true
      help_text: Password for the admin user account
    - id: orgname
      type: string
      label: Organization Name
      help_text: Name of the Chef organization to create
    required:
    - username
    - userpassword
    - orgname
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      longusername: !unsafe '{{ longusername }}'
      useremail: !unsafe '{{ useremail }}'
      userpassword: !unsafe '{{ userpassword }}'
      orgname: !unsafe '{{ orgname }}'
