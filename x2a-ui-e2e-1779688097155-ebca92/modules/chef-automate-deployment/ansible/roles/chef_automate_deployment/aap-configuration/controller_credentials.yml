---
controller_credentials:
- name: Chef Server Admin User - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Server Admin User
  update_secrets: true
  inputs:
    username: '{{ username }}'
    longusername: '{{ longusername }}'
    useremail: '{{ useremail }}'
    userpassword: '{{ vault_userpassword }}'
    orgname: '{{ orgname }}'
