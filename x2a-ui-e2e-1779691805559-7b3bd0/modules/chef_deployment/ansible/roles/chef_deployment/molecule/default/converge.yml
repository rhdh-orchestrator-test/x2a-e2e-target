- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    full_name: John Tonello
    email: jtonello@example.com
    password: molecule_test_password
    chef_hostname: automate.chef.lab
    chef_org_name: lab
    chef_org_long_name: Chef Lab
    chef_user_pem_filename: jtonello.pem
    chef_org_validator_filename: lab-validator.pem
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/home/molecule
    - /tmp/molecule_test/var/log
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create hosts file
    ansible.builtin.copy:
      content: '127.0.0.1 localhost

        127.0.1.1 {{ chef_hostname }}

        '
      dest: /tmp/molecule_test/etc/hosts
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-deployment.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI v1.0.0'' '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: chef-automate-postgresql.default - running

        Service: chef-automate-elasticsearch.default - running

        Service: chef-automate-nginx.default - running

        Service: chef-automate-load-balancer.default - running

        '
      dest: /tmp/molecule_test/hab/chef-automate-status.txt
      mode: '0644'
  - name: Create Chef Server status file
    ansible.builtin.copy:
      content: 'run: postgresql: (pid 12345) 300s; run: log: (pid 12346) 300s

        run: bookshelf: (pid 12347) 300s; run: log: (pid 12348) 300s

        run: oc_bifrost: (pid 12349) 300s; run: log: (pid 12350) 300s

        run: oc_id: (pid 12351) 300s; run: log: (pid 12352) 300s

        run: opscode-erchef: (pid 12353) 300s; run: log: (pid 12354) 300s

        run: nginx: (pid 12355) 300s; run: log: (pid 12356) 300s

        '
      dest: /tmp/molecule_test/hab/chef-server-status.txt
      mode: '0644'
  - name: Create user list file
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/hab/chef-server-user-list.txt
      mode: '0644'
  - name: Create organization list file
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/hab/chef-server-org-list.txt
      mode: '0644'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5mSQGHG8dQACmUjJ5k6YpjQzSF+YCzKB5PE9Hf3ZGzvYS7m

        MOLECULE_TEST_PEM_FILE

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/molecule/jtonello.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5mSQGHG8dQACmUjJ5k6YpjQzSF+YCzKB5PE9Hf3ZGzvYS7m

        MOLECULE_TEST_VALIDATOR_PEM_FILE

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/molecule/lab-validator.pem
      mode: '0600'
  - name: Create netstat output file
    ansible.builtin.copy:
      content: 'tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      12345/nginx

        '
      dest: /tmp/molecule_test/tmp/netstat-output.txt
      mode: '0644'
  - name: Create health API response file
    ansible.builtin.copy:
      content: '{"status":"ok","service_status":[{"service":"postgresql","status":"ok"},{"service":"elasticsearch","status":"ok"}]}

        '
      dest: /tmp/molecule_test/tmp/health-api-response.json
      mode: '0644'
  - name: Create Chef Server API response file
    ansible.builtin.copy:
      content: 'jtonello

        '
      dest: /tmp/molecule_test/tmp/chef-server-api-response.txt
      mode: '0644'
  - name: Create Chef Automate log file
    ansible.builtin.copy:
      content: '[2023-05-01T12:00:00Z] INFO: Chef Automate started successfully

        [2023-05-01T12:00:01Z] INFO: All services running

        '
      dest: /tmp/molecule_test/var/log/chef-automate.log
      mode: '0644'
  - name: Create Chef Server log file
    ansible.builtin.copy:
      content: '[2023-05-01T12:00:00Z] INFO: Chef Server started successfully

        [2023-05-01T12:00:01Z] INFO: All services running

        '
      dest: /tmp/molecule_test/var/log/chef-server.log
      mode: '0644'
