---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Hostname verification
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # System parameters verification
    - name: Check sysctl settings file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-deployment.conf
      register: sysctl_file

    - name: Assert sysctl file was created
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Sysctl settings file not found"
        success_msg: "Sysctl settings file exists"

    - name: Get sysctl content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-deployment.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl settings are correct
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
          - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "Sysctl settings not configured correctly"
        success_msg: "Sysctl settings configured correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI verification
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI was created
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate status verification
    - name: Check Chef Automate status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-automate-status.txt
      register: chef_automate_status_file

    - name: Assert Chef Automate status file was created
      ansible.builtin.assert:
        that:
          - chef_automate_status_file.stat.exists
          - chef_automate_status_file.stat.size > 0
        fail_msg: "Chef Automate status file not found"
        success_msg: "Chef Automate status file exists"

    # Chef Server status verification
    - name: Check Chef Server status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-status.txt
      register: chef_server_status_file

    - name: Assert Chef Server status file was created
      ansible.builtin.assert:
        that:
          - chef_server_status_file.stat.exists
          - chef_server_status_file.stat.size > 0
        fail_msg: "Chef Server status file not found"
        success_msg: "Chef Server status file exists"

    # User verification
    - name: Check user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-user-list.txt
      register: user_list_file

    - name: Assert user list file was created
      ansible.builtin.assert:
        that:
          - user_list_file.stat.exists
          - user_list_file.stat.size > 0
        fail_msg: "User list file not found"
        success_msg: "User list file exists"

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-server-user-list.txt
      register: user_list_content
      when: user_list_file.stat.exists

    - name: Assert user was created
      ansible.builtin.assert:
        that:
          - (user_list_content.content | b64decode) is search('jtonello')
        fail_msg: "User jtonello not found in user list"
        success_msg: "User jtonello found in user list"
      when: user_list_file.stat.exists

    # Organization verification
    - name: Check organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-org-list.txt
      register: org_list_file

    - name: Assert organization list file was created
      ansible.builtin.assert:
        that:
          - org_list_file.stat.exists
          - org_list_file.stat.size > 0
        fail_msg: "Organization list file not found"
        success_msg: "Organization list file exists"

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-server-org-list.txt
      register: org_list_content
      when: org_list_file.stat.exists

    - name: Assert organization was created
      ansible.builtin.assert:
        that:
          - (org_list_content.content | b64decode) is search('lab')
        fail_msg: "Organization lab not found in organization list"
        success_msg: "Organization lab found in organization list"
      when: org_list_file.stat.exists

    # PEM files verification
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/molecule/jtonello.pem
      register: user_pem_file

    - name: Assert user PEM file was created
      ansible.builtin.assert:
        that:
          - user_pem_file.stat.exists
          - user_pem_file.stat.size > 0
        fail_msg: "User PEM file not found"
        success_msg: "User PEM file exists"

    - name: Check organization validator PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/molecule/lab-validator.pem
      register: org_validator_pem_file

    - name: Assert organization validator PEM file was created
      ansible.builtin.assert:
        that:
          - org_validator_pem_file.stat.exists
          - org_validator_pem_file.stat.size > 0
        fail_msg: "Organization validator PEM file not found"
        success_msg: "Organization validator PEM file exists"

    # Network listening verification - can't run in container
    - name: Check network listening
      ansible.builtin.command:
        cmd: netstat -tulpn | grep 443
      register: netstat_result
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert service is listening on port 443
      ansible.builtin.assert:
        that:
          - netstat_result.rc == 0
          - netstat_result.stdout is search('443')
        fail_msg: "Service not listening on port 443"
        success_msg: "Service is listening on port 443"
      tags: molecule-notest

    # Web UI accessibility - can't run in container
    - name: Check Web UI accessibility
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
      register: health_check
      failed_when: false
      tags: molecule-notest

    - name: Assert Web UI is accessible
      ansible.builtin.assert:
        that:
          - health_check.status == 200
        fail_msg: "Web UI not accessible"
        success_msg: "Web UI is accessible"
      tags: molecule-notest

    # Chef Server API accessibility - can't run in container
    - name: Check Chef Server API accessibility
      ansible.builtin.command:
        cmd: knife user list -s https://localhost/organizations/lab -k jtonello.pem -u jtonello
      register: knife_result
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Server API is accessible
      ansible.builtin.assert:
        that:
          - knife_result.rc == 0
          - knife_result.stdout is search('jtonello')
        fail_msg: "Chef Server API not accessible"
        success_msg: "Chef Server API is accessible"
      tags: molecule-notest