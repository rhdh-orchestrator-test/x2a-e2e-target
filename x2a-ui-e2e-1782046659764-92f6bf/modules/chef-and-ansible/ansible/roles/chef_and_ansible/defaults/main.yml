---
apache_package: apache2
apache_version: 2.4.41-4ubuntu3.10
apache_service: apache2
apache_ssl_dir: /etc/apache2/certs
apache_sites_available: /etc/apache2/sites-available
apache_sites_enabled: /etc/apache2/sites-enabled
apache_mods_available: /etc/apache2/mods-available
apache_mods_enabled: /etc/apache2/mods-enabled
website_name: helloworld
website_docroot: /var/www/helloworld
website_port: 443
ssl_protocol: -all +TLSv1.2
ssl_cert_file: "{{ apache_ssl_dir }}/apache.crt"
ssl_key_file: "{{ apache_ssl_dir }}/apache.key"
ssl_csr_file: "{{ apache_ssl_dir }}/apache.csr"
ssl_common_name: myhost
