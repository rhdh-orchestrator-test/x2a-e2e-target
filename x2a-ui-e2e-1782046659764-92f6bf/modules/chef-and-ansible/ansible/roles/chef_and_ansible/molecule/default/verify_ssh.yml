- name: Verify SSH Configuration
  hosts: all
  gather_facts: false
  tasks:
  - name: Create mock SSH config directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/ssh
      state: directory
      mode: '0755'
  - name: Create mock SSH config file
    ansible.builtin.copy:
      content: '# Mock sshd_config file

        # Security settings

        PermitRootLogin no

        PasswordAuthentication yes

        X11Forwarding no

        '
      dest: /tmp/molecule_test/etc/ssh/sshd_config
      mode: '0644'
  - name: Check SSH config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/ssh/sshd_config
    register: ssh_config
  - name: Assert SSH config file exists
    ansible.builtin.assert:
      that:
      - ssh_config.stat.exists
      - ssh_config.stat.size > 0
      fail_msg: SSH config file not found
      success_msg: SSH config file exists
  - name: Get SSH config content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/ssh/sshd_config
    register: ssh_config_content
  - name: Assert root login is disabled
    ansible.builtin.assert:
      that:
      - '''PermitRootLogin no'' in ssh_config_content[''content''] | b64decode'
      - '''PermitRootLogin yes'' not in ssh_config_content[''content''] | b64decode'
      fail_msg: SSH root login is not properly disabled
      success_msg: SSH root login is properly disabled
  - name: Check SSH service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert SSH service is running
    ansible.builtin.assert:
      that:
      - '''sshd.service'' in ansible_facts.services'
      - ansible_facts.services['sshd.service'].state == 'running'
      fail_msg: SSH service is not running
      success_msg: SSH service is running
    tags: molecule-notest
