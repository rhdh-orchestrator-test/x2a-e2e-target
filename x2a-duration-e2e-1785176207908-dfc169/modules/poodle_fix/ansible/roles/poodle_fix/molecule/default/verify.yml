- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check if Apache SSL configuration file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_conf_file
  - name: Assert SSL configuration file exists
    ansible.builtin.assert:
      that:
      - ssl_conf_file.stat.exists
      - ssl_conf_file.stat.isreg
      fail_msg: SSL configuration file not found
      success_msg: SSL configuration file exists
  - name: Get SSL configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_conf_content
  - name: Assert SSL configuration has been updated to fix POODLE vulnerability
    ansible.builtin.assert:
      that:
      - '''SSLProtocol -all +TLSv1.2'' in (ssl_conf_content.content | b64decode)'
      fail_msg: SSL configuration was not properly updated to fix POODLE vulnerability
      success_msg: SSL configuration was properly updated to fix POODLE vulnerability
  - name: Check if Apache service is running
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Apache service is active
    ansible.builtin.assert:
      that:
      - '''apache2.service'' in ansible_facts.services'
      - ansible_facts.services['apache2.service'].state == 'running'
      fail_msg: Apache service is not running
      success_msg: Apache service is running
    tags: molecule-notest
  - name: Check if SSH service is running
    ansible.builtin.assert:
      that:
      - '''sshd.service'' in ansible_facts.services'
      - ansible_facts.services['sshd.service'].state == 'running'
      fail_msg: SSH service is not running
      success_msg: SSH service is running
    tags: molecule-notest
  - name: Test TLS 1.2 connection
    ansible.builtin.uri:
      url: https://localhost:443
      validate_certs: false
    register: tls_connection
    failed_when: false
    tags: molecule-notest
  - name: Assert TLS 1.2 connection works
    ansible.builtin.assert:
      that:
      - tls_connection is success
      fail_msg: TLS 1.2 connection failed
      success_msg: TLS 1.2 connection successful
    tags: molecule-notest
