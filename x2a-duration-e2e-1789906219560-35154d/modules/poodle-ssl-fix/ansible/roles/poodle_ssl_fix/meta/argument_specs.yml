---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache
    description:
      - Configures Apache to disable vulnerable SSL protocols and use only TLS 1.2
      - Addresses the POODLE (Padding Oracle On Downgraded Legacy Encryption) vulnerability
      - Installs Apache if not present and enables SSL module
      - Restarts Apache service after configuration changes
    options:
      apache_ssl_config_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file
      ssl_protocols:
        type: str
        required: false
        default: -all +TLSv1.2
        description: SSL protocols to enable/disable for POODLE vulnerability fix
