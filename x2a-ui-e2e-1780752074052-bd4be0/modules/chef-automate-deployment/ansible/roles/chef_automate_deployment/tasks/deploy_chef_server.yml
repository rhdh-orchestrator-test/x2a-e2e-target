---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ chef_automate_kernel_params }}"
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_path }}
    stdin: "{{ lookup('ansible.builtin.file', '/tmp/chef-automate_linux_amd64.zip') }}"
    creates: "{{ chef_automate_cli_path }}"
  args:
    chdir: "{{ ansible_env.PWD }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "./chef-automate deploy {% for product in chef_server_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{ chef_automate_accept_terms
      | lower }} "
  become: true
  args:
    creates: /hab
- name: Ensure directory exists for user key file
  ansible.builtin.file:
    path: "{{ chef_user_key_filename | dirname }}"
    state: directory
    mode: "0755"
  when: chef_user_key_filename | dirname != '.'
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_user_key_filename }}

      '
  become: true
  args:
    creates: "{{ chef_user_key_filename }}"
- name: Ensure directory exists for organization validator key file
  ansible.builtin.file:
    path: "{{ chef_org_validator_filename | dirname }}"
    state: directory
    mode: "0755"
  when: chef_org_validator_filename | dirname != '.'
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_full_name }}" --association_user {{ username }} --filename {{ chef_org_validator_filename }}

      '
  become: true
  args:
    creates: "{{ chef_org_validator_filename }}"
