---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/opt/fastapi-tutorial
        - /tmp/molecule_test/opt/fastapi-tutorial/venv
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin
        - /tmp/molecule_test/opt/fastapi-tutorial/app
        - /tmp/molecule_test/etc/systemd/system
      loop_control:
        loop_var: item_dir

    - name: Create mock Python virtual environment files
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Python 3.9.2"
        dest: "{{ item_venv_file }}"
        mode: "0755"
        backup: true
      loop:
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/python
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/python3
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/pip
        - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_venv_file

    - name: Create mock requirements.txt file
      ansible.builtin.copy:
        content: |
          fastapi==0.104.1
          uvicorn[standard]==0.24.0
          psycopg2-binary==2.9.7
          python-dotenv==1.0.0
          sqlalchemy==2.0.23
        dest: /tmp/molecule_test/opt/fastapi-tutorial/requirements.txt
        mode: "0644"
        backup: true

    - name: Create mock FastAPI application files
      ansible.builtin.copy:
        content: |
          from fastapi import FastAPI
          
          app = FastAPI(title="FastAPI Tutorial")
          
          @app.get("/")
          def read_root():
              return {"message": "Hello World"}
          
          @app.get("/health")
          def health_check():
              return {"status": "healthy"}
        dest: /tmp/molecule_test/opt/fastapi-tutorial/app/main.py
        mode: "0644"
        backup: true

    - name: Create mock Git repository files
      ansible.builtin.copy:
        content: |
          ref: refs/heads/main
        dest: /tmp/molecule_test/opt/fastapi-tutorial/.git/HEAD
        mode: "0644"
        backup: true

    - name: Create Git directory structure
      ansible.builtin.file:
        path: /tmp/molecule_test/opt/fastapi-tutorial/.git
        state: directory
        mode: "0755"

    - name: Create environment configuration file
      ansible.builtin.copy:
        content: |
          PROJECT_NAME="FastAPI Tutorial"
          API_VERSION=1.0.0
          DATABASE_URL=postgresql://fastapi:fastapi_password@localhost:5432/fastapi_db
        dest: /tmp/molecule_test/opt/fastapi-tutorial/.env
        mode: "0644"
        backup: true

    - name: Create systemd service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=FastAPI Tutorial Service
          After=network.target postgresql.service
          
          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/fastapi-tutorial
          Environment="PATH=/opt/fastapi-tutorial/venv/bin"
          ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
          Restart=always
          
          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/etc/systemd/system/fastapi-tutorial.service
        mode: "0644"
        backup: true

    - name: Create mock pip list output file
      ansible.builtin.copy:
        content: |
          Package           Version
          ----------------- -------
          fastapi           0.104.1
          uvicorn           0.24.0
          psycopg2-binary   2.9.7
          python-dotenv     1.0.0
          sqlalchemy        2.0.23
        dest: /tmp/molecule_test/opt/fastapi-tutorial/venv/pip-list.txt
        mode: "0644"
        backup: true