---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install cache packages
  ansible.builtin.package:
    name: "{{ cache_packages }}"
    state: present
- name: Create Redis group
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    state: present
- name: Create Redis user
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present
- name: Create Redis runtime directory
  ansible.builtin.file:
    path: /var/run/redis
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory
- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}"
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory
    recurse: true
- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart redis
- name: Remove deprecated Redis replica settings from config
  ansible.builtin.replace:
    path: "{{ cache_redis_config_file }}"
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$
    replace: ""
  notify: Reload redis
- name: Start and enable memcached service
  ansible.builtin.service:
    name: "{{ cache_memcached_service }}"
    state: started
    enabled: true
- name: Start and enable Redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    state: started
    enabled: true
