---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/redis/6379.conf
      register: redis_config_stat

    - name: Assert Redis configuration file was created
      ansible.builtin.assert:
        that:
          - redis_config_stat['stat']['exists']
          - redis_config_stat['stat']['size'] > 0
        fail_msg: "Redis configuration file not found"

    - name: Check memcached configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/memcached.conf
      register: memcached_config_stat

    - name: Assert memcached configuration file was created
      ansible.builtin.assert:
        that:
          - memcached_config_stat['stat']['exists']
          - memcached_config_stat['stat']['size'] > 0
        fail_msg: "Memcached configuration file not found"

    - name: Check Redis log directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory was created
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['exists']
          - redis_log_dir_stat['stat']['isdir']
        fail_msg: "Redis log directory not found"

    - name: Read Redis configuration file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis configuration contains required settings
      ansible.builtin.assert:
        that:
          - "'requirepass redis_secure_password_123' in redis_config_content['content'] | b64decode"
          - "'port 6379' in redis_config_content['content'] | b64decode"
          - "'bind 127.0.0.1' in redis_config_content['content'] | b64decode"
          - "'logfile /var/log/redis/redis-server.log' in redis_config_content['content'] | b64decode"
        fail_msg: "Redis configuration missing required settings"

    - name: Check Redis configuration does not contain deprecated replica settings
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in redis_config_content['content'] | b64decode"
          - "'replica-read-only' not in redis_config_content['content'] | b64decode"
          - "'repl-ping-replica-period' not in redis_config_content['content'] | b64decode"
          - "'replica-priority' not in redis_config_content['content'] | b64decode"
        fail_msg: "Redis configuration contains deprecated replica settings"

    - name: Read memcached configuration file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/memcached.conf
      register: memcached_config_content

    - name: Assert memcached configuration contains required settings
      ansible.builtin.assert:
        that:
          - "'-p 11211' in memcached_config_content['content'] | b64decode"
          - "'-l 127.0.0.1' in memcached_config_content['content'] | b64decode"
          - "'-m 64' in memcached_config_content['content'] | b64decode"
        fail_msg: "Memcached configuration missing required settings"

    - name: Check Redis data files exist
      ansible.builtin.stat:
        path: "{{ item_redis_file }}"
      loop:
        - /tmp/molecule_test/var/lib/redis/dump.rdb
        - /tmp/molecule_test/var/run/redis/redis-server.pid
        - /tmp/molecule_test/var/log/redis/redis-server.log
      loop_control:
        loop_var: item_redis_file
      register: redis_files_stat

    - name: Assert Redis data files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: "Redis data file not found"
      loop: "{{ redis_files_stat['results'] }}"
      loop_control:
        loop_var: item_result

- name: Verify Services (Container-incompatible checks)
  hosts: all
  gather_facts: false
  tasks:
    - name: Check memcached service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert memcached service is running
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
        fail_msg: "Memcached service not found"
      tags: molecule-notest

    - name: Check Redis service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
        fail_msg: "Redis service not found"
      tags: molecule-notest

    - name: Check memcached port connectivity
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 11211
        timeout: 5
      tags: molecule-notest

    - name: Check Redis port connectivity
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        timeout: 5
      tags: molecule-notest

    - name: Test Redis authentication
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 ping
      register: redis_auth_test
      changed_when: false
      tags: molecule-notest

    - name: Assert Redis authentication works
      ansible.builtin.assert:
        that:
          - redis_auth_test['stdout'] == 'PONG'
        fail_msg: "Redis authentication failed"
      tags: molecule-notest

    - name: Test memcached basic operations
      ansible.builtin.shell: |
        echo -e "set test_key 0 60 10\r\ntest_value\r\nquit\r" | nc localhost 11211
      register: memcached_set_test
      changed_when: false
      tags: molecule-notest

    - name: Test Redis basic operations
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 set test_key "test_value"
      register: redis_set_test
      changed_when: false
      tags: molecule-notest

    - name: Assert Redis set operation succeeded
      ansible.builtin.assert:
        that:
          - redis_set_test['stdout'] == 'OK'
        fail_msg: "Redis set operation failed"
      tags: molecule-notest