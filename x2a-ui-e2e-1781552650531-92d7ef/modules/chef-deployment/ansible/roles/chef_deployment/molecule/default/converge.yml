---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/home/ansible
        - /tmp/molecule_test/usr/bin

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate Chef Automate config file
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          [global]
            # Chef Automate configuration
            fqdn = "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/chef-automate/config.toml"
        mode: "0644"

    # Simulate Chef user PEM file
    - name: Create Chef user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          EXAMPLE_PEM_CONTENT_FOR_USER_KEY
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/ansible/jtonello.pem"
        mode: "0600"

    # Simulate Chef organization validator PEM file
    - name: Create Chef organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          EXAMPLE_PEM_CONTENT_FOR_ORG_VALIDATOR_KEY
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/ansible/lab-validator.pem"
        mode: "0600"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI mock"
          exit 0
        dest: "/tmp/molecule_test/usr/bin/chef-automate"
        mode: "0755"

    # Simulate Chef Server CLI
    - name: Create Chef Server CLI file
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Server CLI mock"
          exit 0
        dest: "/tmp/molecule_test/usr/bin/chef-server-ctl"
        mode: "0755"

    # Simulate sysctl settings
    - name: Create sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-settings.conf"
        mode: "0644"

    # Simulate user and organization list output files
    - name: Create user list output file
      ansible.builtin.copy:
        content: "jtonello"
        dest: "/tmp/molecule_test/etc/chef-server/user-list.txt"
        mode: "0644"

    - name: Create organization list output file
      ansible.builtin.copy:
        content: "lab"
        dest: "/tmp/molecule_test/etc/chef-server/org-list.txt"
        mode: "0644"