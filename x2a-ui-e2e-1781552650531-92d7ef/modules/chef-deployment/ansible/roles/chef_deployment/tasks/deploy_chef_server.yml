---
- name: Ensure gzip package is installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }} && chmod +x {{ chef_automate_cli_path }}
  args:
    creates: "{{ chef_automate_cli_path }}"
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_accept_terms_and_mlsa | lower }}"
  args:
    creates: /etc/chef-automate/config.toml
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
