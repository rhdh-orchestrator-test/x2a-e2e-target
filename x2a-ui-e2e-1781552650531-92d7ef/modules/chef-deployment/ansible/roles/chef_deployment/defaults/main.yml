---
chef_hostname: automate.chef.lab
chef_sysctl_settings:
  vm.max_map_count: 262144
  vm.dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: ./chef-automate
chef_accept_terms_and_mlsa: true
chef_username: "{{ username | default('jtonello') }}"
chef_long_username: "{{ long_username | default('John Tonello') }}"
chef_user_email: "{{ user_email | default('jtonello@chef.lab') }}"
chef_user_password: "{{ user_password | default('password') }}"
chef_org_name: "{{ org_name | default('lab') }}"
chef_long_org_name: "{{ long_org_name | default('Chef Lab') }}"
chef_user_pem_path: /home/{{ ansible_user }}/{{ chef_username }}.pem
chef_org_validator_pem_path: /home/{{ ansible_user }}/{{ chef_org_name }}-validator.pem
