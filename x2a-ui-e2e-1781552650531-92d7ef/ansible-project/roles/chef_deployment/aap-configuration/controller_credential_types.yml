---
controller_credential_types:
- name: Chef User Credentials
  description: Credential type for Chef User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef user's username for authentication
    - id: user_password
      type: string
      label: User Password
      secret: true
      help_text: Password for the Chef user account
    - id: user_email
      type: string
      label: User Email
      help_text: Email address for the Chef user account
    - id: long_username
      type: string
      label: Full Name
      help_text: Chef user's full name
    required:
    - username
    - user_password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      user_password: !unsafe '{{ user_password }}'
      user_email: !unsafe '{{ user_email }}'
      long_username: !unsafe '{{ long_username }}'
- name: Chef Organization Configuration
  description: Credential type for Chef Organization Configuration
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: long_org_name
      type: string
      label: Organization Full Name
      help_text: Full name of the Chef organization
    required:
    - org_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      long_org_name: !unsafe '{{ long_org_name }}'
