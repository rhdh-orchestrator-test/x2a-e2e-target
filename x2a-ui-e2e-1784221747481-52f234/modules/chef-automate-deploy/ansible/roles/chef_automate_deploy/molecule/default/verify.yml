---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == (chef_automate_hostname | default('automate.chef.lab'))
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check sysctl configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl configuration file was created
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are set correctly
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('vm.max_map_count = ' ~ (chef_automate_vm_max_map_count | default(262144)))
          - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = ' ~ (chef_automate_vm_dirty_expire_centisecs | default(20000)))
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI checks
    - name: Check Chef Automate CLI file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI file was created
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.size > 0
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI file not found or not executable"
        success_msg: "Chef Automate CLI file exists and is executable"

    # User and organization key checks
    - name: Check user key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_automate_userfilename | default('admin.pem') }}"
      register: user_key_file

    - name: Assert user key file was created
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.size > 0
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_automate_orgfilename | default('lab-validator.pem') }}"
      register: org_key_file

    - name: Assert organization validator key file was created
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.size > 0
        fail_msg: "Organization validator key file not found"
        success_msg: "Organization validator key file exists"

    # Chef Automate status checks
    - name: Check Chef Automate status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-automate-status.txt
      register: chef_automate_status_file

    - name: Assert Chef Automate status file was created
      ansible.builtin.assert:
        that:
          - chef_automate_status_file.stat.exists
          - chef_automate_status_file.stat.size > 0
        fail_msg: "Chef Automate status file not found"
        success_msg: "Chef Automate status file exists"

    - name: Get Chef Automate status content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-automate-status.txt
      register: chef_automate_status_content
      when: chef_automate_status_file.stat.exists

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - (chef_automate_status_content.content | b64decode) is search('Status: running')
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      when: chef_automate_status_file.stat.exists

    # Chef Server status checks
    - name: Check Chef Server status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-status.txt
      register: chef_server_status_file

    - name: Assert Chef Server status file was created
      ansible.builtin.assert:
        that:
          - chef_server_status_file.stat.exists
          - chef_server_status_file.stat.size > 0
        fail_msg: "Chef Server status file not found"
        success_msg: "Chef Server status file exists"

    - name: Get Chef Server status content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-server-status.txt
      register: chef_server_status_content
      when: chef_server_status_file.stat.exists

    - name: Assert Chef Server is running
      ansible.builtin.assert:
        that:
          - (chef_server_status_content.content | b64decode) is search('Status: running')
        fail_msg: "Chef Server is not running"
        success_msg: "Chef Server is running"
      when: chef_server_status_file.stat.exists

    # User and organization list checks
    - name: Check Chef Server user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-user-list.txt
      register: chef_server_user_list_file

    - name: Assert Chef Server user list file was created
      ansible.builtin.assert:
        that:
          - chef_server_user_list_file.stat.exists
          - chef_server_user_list_file.stat.size > 0
        fail_msg: "Chef Server user list file not found"
        success_msg: "Chef Server user list file exists"

    - name: Get Chef Server user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-server-user-list.txt
      register: chef_server_user_list_content
      when: chef_server_user_list_file.stat.exists

    - name: Assert user was created
      ansible.builtin.assert:
        that:
          - (chef_server_user_list_content.content | b64decode | trim) == (chef_automate_username | default('admin'))
        fail_msg: "User not found in Chef Server user list"
        success_msg: "User found in Chef Server user list"
      when: chef_server_user_list_file.stat.exists

    - name: Check Chef Server org list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-org-list.txt
      register: chef_server_org_list_file

    - name: Assert Chef Server org list file was created
      ansible.builtin.assert:
        that:
          - chef_server_org_list_file.stat.exists
          - chef_server_org_list_file.stat.size > 0
        fail_msg: "Chef Server org list file not found"
        success_msg: "Chef Server org list file exists"

    - name: Get Chef Server org list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-server-org-list.txt
      register: chef_server_org_list_content
      when: chef_server_org_list_file.stat.exists

    - name: Assert organization was created
      ansible.builtin.assert:
        that:
          - (chef_server_org_list_content.content | b64decode | trim) == (chef_automate_orgname | default('lab'))
        fail_msg: "Organization not found in Chef Server org list"
        success_msg: "Organization found in Chef Server org list"
      when: chef_server_org_list_file.stat.exists

    # Service checks that can't run in container
    - name: Check Chef Automate service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "ansible_facts.services['chef-automate.service'].state == 'running'"
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check Chef Server service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Server service is running
      ansible.builtin.assert:
        that:
          - "'chef-server.service' in ansible_facts.services"
          - "ansible_facts.services['chef-server.service'].state == 'running'"
        fail_msg: "Chef Server service is not running"
        success_msg: "Chef Server service is running"
      tags: molecule-notest

    # Network checks that can't run in container
    - name: Check Chef Automate port
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      ignore_errors: true
      register: port_check
      tags: molecule-notest

    - name: Assert Chef Automate port is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Chef Automate port 443 is not listening"
        success_msg: "Chef Automate port 443 is listening"
      tags: molecule-notest

    # API health check that can't run in container
    - name: Check Chef Automate API health
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
      register: api_health
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Automate API is healthy
      ansible.builtin.assert:
        that:
          - api_health is succeeded
        fail_msg: "Chef Automate API health check failed"
        success_msg: "Chef Automate API is healthy"
      tags: molecule-notest