---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/tmp

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname | default('automate.chef.lab') }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: |
          # Simulated sysctl configuration for Chef Automate
          vm.max_map_count = {{ chef_automate_vm_max_map_count | default(262144) }}
          vm.dirty_expire_centisecs = {{ chef_automate_vm_dirty_expire_centisecs | default(20000) }}
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # Simulated Chef Automate CLI
          echo "Chef Automate CLI v1.0.0"
        dest: /tmp/molecule_test/tmp/chef-automate
        mode: "0755"

