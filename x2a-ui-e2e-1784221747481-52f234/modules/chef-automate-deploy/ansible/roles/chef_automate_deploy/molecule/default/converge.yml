    # Simulate Chef Automate status file
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: chef-automate
          Status: running
          Version: 4.2.1
        dest: /tmp/molecule_test/hab/chef-automate-status.txt
        mode: "0644"

    # Simulate Chef Server status file
