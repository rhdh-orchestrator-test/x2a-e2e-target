---
- name: Check if Chef Infra Server is installed
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl
  become: true
- name: Fail if Chef Infra Server is not installed
  ansible.builtin.fail:
    msg: Chef Infra Server is not installed. Please ensure the Chef Automate deployment with infra-server product was successful.
  when: not chef_server_ctl.stat.exists
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_automate_username }} {{ chef_automate_longusername }} {{ chef_automate_useremail }} "{{ chef_automate_userpassword }}"
      --filename {{ chef_automate_userfilename }}

      '
  become: true
  args:
    creates: "{{ chef_automate_userfilename }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_orgname }} "{{ chef_automate_longorgname }}" --association_user {{ chef_automate_username }} --filename {{ chef_automate_orgfilename
      }}

      '
  become: true
  args:
    creates: "{{ chef_automate_orgfilename }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
