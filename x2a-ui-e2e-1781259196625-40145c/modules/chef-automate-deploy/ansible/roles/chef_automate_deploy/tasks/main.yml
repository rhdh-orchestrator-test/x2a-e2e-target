---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters for Chef Automate
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ chef_automate_kernel_params }}"
  become: true
- name: Ensure directory exists for Chef Automate CLI
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path | dirname }}"
    state: directory
    mode: "0755"
  when: chef_automate_cli_path | dirname != '.'
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
    force: false
  register: chef_automate_cli_download
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
  when: chef_automate_cli_download.changed
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "./chef-automate deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{ chef_automate_accept_terms
      | lower }} "
  become: true
  args:
    creates: /etc/chef-automate/config.toml
  register: chef_automate_deploy_result
  changed_when: chef_automate_deploy_result.rc == 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_user_pem_filename }}
  become: true
  args:
    creates: "{{ chef_user_pem_filename }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}" --association_user {{ username }} --filename {{
      chef_org_validator_pem_filename }}
  become: true
  args:
    creates: "{{ chef_org_validator_pem_filename }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
