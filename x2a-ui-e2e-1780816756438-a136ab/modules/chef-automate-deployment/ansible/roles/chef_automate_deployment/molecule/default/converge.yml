- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/usr/bin
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = {{ chef_automate_vm_max_map_count }}

        vm.dirty_expire_centisecs = {{ chef_automate_vm_dirty_expire_centisecs }}

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create mock package files
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/bin/{{ item }}
      state: touch
      mode: '0755'
    loop:
    - gzip
    - gunzip
    - unzip
    - chef-server-ctl
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_KEY_CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/{{ chef_user_key_file }}
      mode: '0600'
  - name: Create Chef organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_ORG_VALIDATOR_KEY_CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/{{ chef_org_validator_key_file }}
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: "{\n  \"status\": \"running\",\n  \"services\": [\n    {\"name\": \"automate-gateway\", \"status\": \"running\"},\n    {\"name\": \"automate-postgresql\",
        \"status\": \"running\"},\n    {\"name\": \"chef-server\", \"status\": \"running\"}\n  ]\n}\n"
      dest: /tmp/molecule_test/hab/chef-automate-status.json
      mode: '0644'
  - name: Create Chef Server user list file
    ansible.builtin.copy:
      content: '{{ chef_user_name }} '
      dest: /tmp/molecule_test/hab/chef-server-user-list.txt
      mode: '0644'
  - name: Create Chef Server organization list file
    ansible.builtin.copy:
      content: '{{ chef_org_name }} '
      dest: /tmp/molecule_test/hab/chef-server-org-list.txt
      mode: '0644'
