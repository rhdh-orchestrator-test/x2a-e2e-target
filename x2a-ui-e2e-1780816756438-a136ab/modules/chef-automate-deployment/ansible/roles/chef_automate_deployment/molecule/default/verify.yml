---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == chef_automate_hostname
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check sysctl settings file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file was created
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Sysctl file not found"
        success_msg: "Sysctl file exists"

    - name: Get sysctl content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl settings are correct
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('vm.max_map_count = ' ~ chef_automate_vm_max_map_count)
          - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = ' ~ chef_automate_vm_dirty_expire_centisecs)
        fail_msg: "Sysctl settings not set correctly"
        success_msg: "Sysctl settings set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI checks
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI was downloaded
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate deployment checks
    - name: Check Chef Automate status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-automate-status.json
      register: chef_automate_status_file

    - name: Assert Chef Automate status file exists
      ansible.builtin.assert:
        that:
          - chef_automate_status_file.stat.exists
          - chef_automate_status_file.stat.size > 0
        fail_msg: "Chef Automate status file not found"
        success_msg: "Chef Automate status file exists"

    # Chef user and organization checks
    - name: Check Chef user key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_user_key_file }}"
      register: chef_user_key

    - name: Assert Chef user key file was created
      ansible.builtin.assert:
        that:
          - chef_user_key.stat.exists
          - chef_user_key.stat.size > 0
        fail_msg: "Chef user key file not found"
        success_msg: "Chef user key file exists"

    - name: Check Chef organization validator key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_org_validator_key_file }}"
      register: chef_org_validator_key

    - name: Assert Chef organization validator key file was created
      ansible.builtin.assert:
        that:
          - chef_org_validator_key.stat.exists
          - chef_org_validator_key.stat.size > 0
        fail_msg: "Chef organization validator key file not found"
        success_msg: "Chef organization validator key file exists"

    - name: Check Chef Server user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-user-list.txt
      register: chef_server_user_list

    - name: Assert Chef Server user list file exists
      ansible.builtin.assert:
        that:
          - chef_server_user_list.stat.exists
          - chef_server_user_list.stat.size > 0
        fail_msg: "Chef Server user list file not found"
        success_msg: "Chef Server user list file exists"

    - name: Get Chef Server user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-server-user-list.txt
      register: chef_server_user_list_content
      when: chef_server_user_list.stat.exists

    - name: Assert Chef user was created
      ansible.builtin.assert:
        that:
          - (chef_server_user_list_content.content | b64decode) is search(chef_user_name)
        fail_msg: "Chef user not found in user list"
        success_msg: "Chef user found in user list"
      when: chef_server_user_list.stat.exists

    - name: Check Chef Server organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-org-list.txt
      register: chef_server_org_list

    - name: Assert Chef Server organization list file exists
      ansible.builtin.assert:
        that:
          - chef_server_org_list.stat.exists
          - chef_server_org_list.stat.size > 0
        fail_msg: "Chef Server organization list file not found"
        success_msg: "Chef Server organization list file exists"

    - name: Get Chef Server organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-server-org-list.txt
      register: chef_server_org_list_content
      when: chef_server_org_list.stat.exists

    - name: Assert Chef organization was created
      ansible.builtin.assert:
        that:
          - (chef_server_org_list_content.content | b64decode) is search(chef_org_name)
        fail_msg: "Chef organization not found in organization list"
        success_msg: "Chef organization found in organization list"
      when: chef_server_org_list.stat.exists

    # Service checks that can't run in container
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: chef-automate status
      register: chef_automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check Chef Infra Server service status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: chef_server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server service is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server service is not running"
        success_msg: "Chef Infra Server service is running"
      tags: molecule-notest

    - name: Check HTTPS port is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: https_port
      failed_when: false
      tags: molecule-notest

    - name: Assert HTTPS port is listening
      ansible.builtin.assert:
        that:
          - https_port is succeeded
        fail_msg: "HTTPS port 443 is not listening"
        success_msg: "HTTPS port 443 is listening"
      tags: molecule-notest

    - name: Check Chef Automate API
      ansible.builtin.uri:
        url: https://localhost/api/_status
        validate_certs: false
      register: api_status
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate API is accessible
      ansible.builtin.assert:
        that:
          - api_status is succeeded
        fail_msg: "Chef Automate API is not accessible"
        success_msg: "Chef Automate API is accessible"
      tags: molecule-notest