---
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_key_file }}"
    - "{{ chef_org_validator_key_file }}"
  when: item | dirname != '.'
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Wait for Chef Infra Server to be fully operational
  ansible.builtin.pause:
    seconds: 10
  when: chef_server_ctl_check.rc == 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_user_name }} "{{ chef_user_fullname }}" {{ chef_user_email }} "{{ chef_user_password }}" --filename {{ chef_user_key_file
      }}

      '
  become: true
  args:
    creates: "{{ chef_user_key_file }}"
  register: create_user_result
  changed_when: create_user_result.rc == 0
  no_log: true
  when: chef_server_ctl_check.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_fullname }}" --association_user {{ chef_user_name }} --filename {{ chef_org_validator_key_file
      }}

      '
  become: true
  args:
    creates: "{{ chef_org_validator_key_file }}"
  register: create_org_result
  changed_when: create_org_result.rc == 0
  when: chef_server_ctl_check.rc == 0
