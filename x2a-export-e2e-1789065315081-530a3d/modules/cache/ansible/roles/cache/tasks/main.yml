---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install memcached and redis packages
  ansible.builtin.package:
    name:
      - memcached
      - redis-server
    state: present
- name: Create redis group
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    system: true
    state: present
- name: Create redis user
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    group: "{{ cache_redis_group }}"
    state: present
- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}"
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory
- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}"
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0640"
    backup: true
  notify: Restart Redis
- name: Remove replica-related settings from Redis config
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}"
    regexp: ^{{ item_cache }}.*$
    state: absent
    backup: true
  loop: "{{ cache_redis_replica_settings_to_remove }}"
  loop_control:
    loop_var: item_cache
  notify: Restart Redis
- name: Start and enable Redis service
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
- name: Start and enable Memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
