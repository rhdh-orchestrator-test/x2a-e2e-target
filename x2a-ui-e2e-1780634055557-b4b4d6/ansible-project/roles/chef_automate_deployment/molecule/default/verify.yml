- name: Verify
  hosts: all
  gather_facts: false
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_user_name: admin
    chef_org_name: lab
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == chef_automate_hostname
      fail_msg: Hostname is not set correctly
      success_msg: Hostname is set correctly
    when: hostname_file.stat.exists
  - name: Check vm.max_map_count file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_file
  - name: Assert vm.max_map_count file exists
    ansible.builtin.assert:
      that:
      - max_map_count_file.stat.exists
      - max_map_count_file.stat.isreg
      fail_msg: vm.max_map_count file not found
      success_msg: vm.max_map_count file exists
  - name: Get vm.max_map_count content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_content
    when: max_map_count_file.stat.exists
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - (max_map_count_content.content | b64decode | trim) | int >= chef_automate_vm_max_map_count | int
      fail_msg: vm.max_map_count is not set correctly
      success_msg: vm.max_map_count is set correctly
    when: max_map_count_file.stat.exists
  - name: Check vm.dirty_expire_centisecs file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_file
  - name: Assert vm.dirty_expire_centisecs file exists
    ansible.builtin.assert:
      that:
      - dirty_expire_file.stat.exists
      - dirty_expire_file.stat.isreg
      fail_msg: vm.dirty_expire_centisecs file not found
      success_msg: vm.dirty_expire_centisecs file exists
  - name: Get vm.dirty_expire_centisecs content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_content
    when: dirty_expire_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - (dirty_expire_content.content | b64decode | trim) | int == chef_automate_vm_dirty_expire_centisecs | int
      fail_msg: vm.dirty_expire_centisecs is not set correctly
      success_msg: vm.dirty_expire_centisecs is set correctly
    when: dirty_expire_file.stat.exists
  - name: Check Chef Automate CLI file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli_file
  - name: Assert Chef Automate CLI file exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli_file.stat.exists
      - chef_automate_cli_file.stat.isreg
      - chef_automate_cli_file.stat.executable
      fail_msg: Chef Automate CLI file not found or not executable
      success_msg: Chef Automate CLI file exists and is executable
  - name: Check Chef user key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/root/{{ chef_user_name }}.pem
    register: user_key_file
  - name: Assert Chef user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.isreg
      - user_key_file.stat.mode == '0600'
      fail_msg: Chef user key file not found or has incorrect permissions
      success_msg: Chef user key file exists with correct permissions
  - name: Check Chef organization key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/root/{{ chef_org_name }}-validator.pem
    register: org_key_file
  - name: Assert Chef organization key file exists
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.isreg
      - org_key_file.stat.mode == '0600'
      fail_msg: Chef organization key file not found or has incorrect permissions
      success_msg: Chef organization key file exists with correct permissions
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: chef-automate status
    register: automate_status
    changed_when: false
    failed_when: automate_status.rc != 0
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: chef-server-ctl status
    register: chef_server_status
    changed_when: false
    failed_when: chef_server_status.rc != 0
    tags: molecule-notest
  - name: Verify Chef user exists
    ansible.builtin.command:
      cmd: chef-server-ctl user-list | grep {{ chef_user_name }}
    register: user_check
    changed_when: false
    failed_when: user_check.rc != 0
    tags: molecule-notest
  - name: Verify Chef organization exists
    ansible.builtin.command:
      cmd: chef-server-ctl org-list | grep {{ chef_org_name }}
    register: org_check
    changed_when: false
    failed_when: org_check.rc != 0
    tags: molecule-notest
  - name: Check if port 443 is listening
    ansible.builtin.command:
      cmd: ss -tlnp | grep :443
    register: port_check
    changed_when: false
    failed_when: port_check.rc != 0
    tags: molecule-notest
  - name: Check Chef Automate API status
    ansible.builtin.uri:
      url: https://localhost/api/_status
      validate_certs: false
      status_code: 200
    register: api_check
    failed_when: api_check.status != 200
    tags: molecule-notest
