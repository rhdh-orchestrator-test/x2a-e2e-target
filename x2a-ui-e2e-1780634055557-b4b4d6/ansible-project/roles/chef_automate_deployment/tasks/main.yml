---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Run preflight checks
  ansible.builtin.include_tasks: preflight_checks.yml
  when: chef_automate_run_preflight_checks | default(true)
- name: Configure system settings
  ansible.builtin.include_tasks: system_config.yml
- name: Install Chef Automate and Chef Infra Server
  ansible.builtin.include_tasks: install.yml
- name: Set up Chef user and organization
  ansible.builtin.include_tasks: user_org_setup.yml
