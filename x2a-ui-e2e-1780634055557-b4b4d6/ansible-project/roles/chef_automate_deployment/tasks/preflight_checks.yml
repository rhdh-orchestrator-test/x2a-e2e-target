---
- name: Verify hostname is set correctly
  ansible.builtin.command:
    cmd: hostname
  register: hostname_result
  changed_when: false
  failed_when: hostname_result.stdout != chef_automate_hostname
  tags: molecule-notest
- name: Verify kernel parameter vm.max_map_count
  ansible.builtin.command:
    cmd: cat /proc/sys/vm/max_map_count
  register: max_map_count_result
  changed_when: false
  failed_when: max_map_count_result.stdout | int < chef_automate_vm_max_map_count | int
  tags: molecule-notest
- name: Verify kernel parameter vm.dirty_expire_centisecs
  ansible.builtin.command:
    cmd: cat /proc/sys/vm/dirty_expire_centisecs
  register: dirty_expire_result
  changed_when: false
  failed_when: dirty_expire_result.stdout | int != chef_automate_vm_dirty_expire_centisecs | int
  tags: molecule-notest
- name: Check Chef Automate status
  ansible.builtin.command:
    cmd: chef-automate status
  register: automate_status
  changed_when: false
  failed_when: automate_status.rc != 0
  become: true
  tags: molecule-notest
- name: Check Chef Infra Server status
  ansible.builtin.command:
    cmd: chef-server-ctl status
  register: chef_server_status
  changed_when: false
  failed_when: chef_server_status.rc != 0
  become: true
  tags: molecule-notest
- name: Verify Chef user exists
  ansible.builtin.command:
    cmd: chef-server-ctl user-list | grep {{ chef_user_name }}
  register: user_check
  changed_when: false
  failed_when: user_check.rc != 0
  become: true
  tags: molecule-notest
- name: Verify Chef organization exists
  ansible.builtin.command:
    cmd: chef-server-ctl org-list | grep {{ chef_org_name }}
  register: org_check
  changed_when: false
  failed_when: org_check.rc != 0
  become: true
  tags: molecule-notest
- name: Verify user key file exists
  ansible.builtin.stat:
    path: "{{ chef_user_key_file }}"
  register: user_key_file
  failed_when: not user_key_file.stat.exists
- name: Verify organization key file exists
  ansible.builtin.stat:
    path: "{{ chef_org_key_file }}"
  register: org_key_file
  failed_when: not org_key_file.stat.exists
- name: Check if port 443 is listening
  ansible.builtin.command:
    cmd: ss -tlnp | grep :443
  register: port_check
  changed_when: false
  failed_when: port_check.rc != 0
  become: true
  tags: molecule-notest
- name: Check Chef Automate API status
  ansible.builtin.uri:
    url: https://localhost/api/_status
    validate_certs: false
    status_code: 200
  register: api_check
  failed_when: api_check.status != 200
  ignore_errors: true
  tags: molecule-notest
