- name: Converge
  hosts: all
  gather_facts: true
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_user_name: admin
    chef_org_name: lab
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/root
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_max_map_count }}'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_dirty_expire_centisecs }}'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK CHEF USER KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/root/{{ chef_user_name }}.pem
      mode: '0600'
  - name: Create Chef organization key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK CHEF ORG KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/root/{{ chef_org_name }}-validator.pem
      mode: '0600'
  - name: Create Chef Automate status mock
    ansible.builtin.copy:
      content: "Service: automate-gateway\n  Status: running\nService: automate-postgresql\n  Status: running\nService: chef-server\n  Status: running\n"
      dest: /tmp/molecule_test/tmp/chef-automate-status
      mode: '0644'
  - name: Create Chef Server status mock
    ansible.builtin.copy:
      content: 'run: chef-server-ctl: running

        run: bookshelf: running

        run: oc_bifrost: running

        run: oc_id: running

        run: opscode-erchef: running

        run: opscode-expander: running

        run: opscode-solr4: running

        run: postgresql: running

        run: rabbitmq: running

        run: redis_lb: running

        '
      dest: /tmp/molecule_test/tmp/chef-server-status
      mode: '0644'
  - name: Create Chef user list mock
    ansible.builtin.copy:
      content: '{{ chef_user_name }} '
      dest: /tmp/molecule_test/tmp/chef-user-list
      mode: '0644'
  - name: Create Chef org list mock
    ansible.builtin.copy:
      content: '{{ chef_org_name }} '
      dest: /tmp/molecule_test/tmp/chef-org-list
      mode: '0644'
  - name: Create port 443 listening mock
    ansible.builtin.copy:
      content: 'LISTEN 0 128 0.0.0.0:443 0.0.0.0:* users:((''nginx'',pid=1234,fd=6)) '
      dest: /tmp/molecule_test/tmp/ss-output
      mode: '0644'
  - name: Create API status mock
    ansible.builtin.copy:
      content: '{"status":"ok"}'
      dest: /tmp/molecule_test/tmp/api-status
      mode: '0644'
