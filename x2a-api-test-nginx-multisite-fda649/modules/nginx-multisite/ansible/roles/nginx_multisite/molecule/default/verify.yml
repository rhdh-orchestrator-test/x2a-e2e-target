---
- name: Verify nginx multisite configuration
  hosts: all
  gather_facts: false
  tasks:
    # Nginx configuration files verification
    - name: Check nginx configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/nginx/nginx.conf
        - /tmp/molecule_test/etc/nginx/conf.d/security.conf
      loop_control:
        loop_var: item_config
      register: nginx_config_stat_results

    - name: Assert nginx configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected nginx configuration file not found"
      loop: "{{ nginx_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Site configuration files verification
    - name: Check site configuration files exist
      ansible.builtin.stat:
        path: "{{ item_site_config }}"
      loop:
        - /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site_config
      register: site_config_stat_results

    - name: Assert site configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected site configuration file not found"
      loop: "{{ site_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Site enabled symlinks verification
    - name: Check site enabled symlinks exist
      ansible.builtin.stat:
        path: "{{ item_site_link }}"
      loop:
        - /tmp/molecule_test/etc/nginx/sites-enabled/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_site_link
      register: site_link_stat_results

    - name: Assert site enabled symlinks were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['islnk']
        fail_msg: "Expected site enabled symlink not found"
      loop: "{{ site_link_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Document root directories verification
    - name: Check document root directories exist
      ansible.builtin.stat:
        path: "{{ item_docroot }}"
      loop:
        - /tmp/molecule_test/opt/server/test
        - /tmp/molecule_test/opt/server/ci
        - /tmp/molecule_test/opt/server/status
      loop_control:
        loop_var: item_docroot
      register: docroot_stat_results

    - name: Assert document root directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected document root directory not found"
      loop: "{{ docroot_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Site index files verification
    - name: Check site index files exist
      ansible.builtin.stat:
        path: "{{ item_index }}"
      loop:
        - /tmp/molecule_test/opt/server/test/index.html
        - /tmp/molecule_test/opt/server/ci/index.html
        - /tmp/molecule_test/opt/server/status/index.html
      loop_control:
        loop_var: item_index
      register: index_stat_results

    - name: Assert site index files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected site index file not found"
      loop: "{{ index_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # SSL certificates verification
    - name: Check SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ item_cert }}"
      loop:
        - /tmp/molecule_test/etc/ssl/certs/test.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/ci.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_cert
      register: cert_stat_results

    - name: Assert SSL certificate files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate file not found"
      loop: "{{ cert_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # SSL private keys verification
    - name: Check SSL private key files exist
      ansible.builtin.stat:
        path: "{{ item_key }}"
      loop:
        - /tmp/molecule_test/etc/ssl/private/test.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/ci.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: key_stat_results

    - name: Assert SSL private key files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
          - item_result['stat']['mode'] == '0640'
        fail_msg: "Expected SSL private key file not found or incorrect permissions"
      loop: "{{ key_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Security configuration files verification
    - name: Check security configuration files exist
      ansible.builtin.stat:
        path: "{{ item_security }}"
      loop:
        - /tmp/molecule_test/etc/fail2ban/jail.local
        - /tmp/molecule_test/etc/sysctl.d/99-security.conf
        - /tmp/molecule_test/etc/ssh/sshd_config
      loop_control:
        loop_var: item_security
      register: security_stat_results

    - name: Assert security configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected security configuration file not found"
      loop: "{{ security_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

- name: Verify nginx configuration content
  hosts: all
  gather_facts: false
  tasks:
    # Nginx main configuration content verification
    - name: Read nginx main configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/nginx.conf
      register: nginx_conf_content

    - name: Assert nginx configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'user www-data' in nginx_conf_decoded"
          - "'worker_processes auto' in nginx_conf_decoded"
          - "'gzip on' in nginx_conf_decoded"
          - "'ssl_protocols TLSv1.2 TLSv1.3' in nginx_conf_decoded"
        fail_msg: "Nginx configuration missing expected settings"
      vars:
        nginx_conf_decoded: "{{ nginx_conf_content['content'] | b64decode }}"

    # Security configuration content verification
    - name: Read nginx security configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/conf.d/security.conf
      register: security_conf_content

    - name: Assert security configuration contains expected headers
      ansible.builtin.assert:
        that:
          - "'X-Frame-Options' in security_conf_decoded"
          - "'X-XSS-Protection' in security_conf_decoded"
          - "'X-Content-Type-Options' in security_conf_decoded"
          - "'Strict-Transport-Security' in security_conf_decoded"
          - "'server_tokens off' in security_conf_decoded"
        fail_msg: "Security configuration missing expected headers"
      vars:
        security_conf_decoded: "{{ security_conf_content['content'] | b64decode }}"

    # Site configuration content verification
    - name: Read site configuration files
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/sites-available/{{ item_site_name }}
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site_name
      register: site_conf_contents

    - name: Assert site configurations contain expected settings
      ansible.builtin.assert:
        that:
          - "'listen 80' in item_result['content'] | b64decode"
          - "'listen 443 ssl http2' in item_result['content'] | b64decode"
          - "'return 301 https://' in item_result['content'] | b64decode"
          - "'ssl_certificate /etc/ssl/certs/' in item_result['content'] | b64decode"
          - "'ssl_certificate_key /etc/ssl/private/' in item_result['content'] | b64decode"
        fail_msg: "Site configuration missing expected SSL and redirect settings"
      loop: "{{ site_conf_contents['results'] }}"
      loop_control:
        loop_var: item_result

    # Index file content verification
    - name: Read site index files
      ansible.builtin.slurp:
        src: /tmp/molecule_test/opt/server/{{ item_site_dir }}/index.html
      loop:
        - test
        - ci
        - status
      loop_control:
        loop_var: item_site_dir
      register: index_contents

    - name: Assert index files contain expected content
      ansible.builtin.assert:
        that:
          - "'<!DOCTYPE html>' in item_result['content'] | b64decode"
          - "'Environment' in item_result['content'] | b64decode"
          - "'/opt/server/' in item_result['content'] | b64decode"
        fail_msg: "Index file missing expected HTML content"
      loop: "{{ index_contents['results'] }}"
      loop_control:
        loop_var: item_result

    # Fail2ban configuration content verification
    - name: Read fail2ban jail configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/fail2ban/jail.local
      register: jail_conf_content

    - name: Assert fail2ban configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'[sshd]' in jail_conf_decoded"
          - "'enabled = true' in jail_conf_decoded"
          - "'[nginx-http-auth]' in jail_conf_decoded"
          - "'bantime = 3600' in jail_conf_decoded"
          - "'maxretry' in jail_conf_decoded"
        fail_msg: "Fail2ban configuration missing expected jail settings"
      vars:
        jail_conf_decoded: "{{ jail_conf_content['content'] | b64decode }}"

    # Sysctl security configuration content verification
    - name: Read sysctl security configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-security.conf
      register: sysctl_conf_content

    - name: Assert sysctl configuration contains expected security settings
      ansible.builtin.assert:
        that:
          - "'net.ipv4.conf.default.rp_filter = 1' in sysctl_conf_decoded"
          - "'net.ipv4.conf.all.accept_redirects = 0' in sysctl_conf_decoded"
          - "'net.ipv4.conf.all.send_redirects = 0' in sysctl_conf_decoded"
          - "'net.ipv4.conf.all.log_martians = 1' in sysctl_conf_decoded"
        fail_msg: "Sysctl configuration missing expected security settings"
      vars:
        sysctl_conf_decoded: "{{ sysctl_conf_content['content'] | b64decode }}"

    # SSH configuration content verification
    - name: Read SSH configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_conf_content

    - name: Assert SSH configuration contains expected security settings
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in ssh_conf_decoded"
          - "'PasswordAuthentication no' in ssh_conf_decoded"
          - "'Protocol 2' in ssh_conf_decoded"
        fail_msg: "SSH configuration missing expected security settings"
      vars:
        ssh_conf_decoded: "{{ ssh_conf_content['content'] | b64decode }}"

- name: Verify service and network checks (container-incompatible)
  hosts: all
  gather_facts: false
  tasks:
    # These checks would fail in container environment, so they're tagged for exclusion
    - name: Check nginx service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
        fail_msg: "Nginx service not running"
      tags: molecule-notest

    - name: Check fail2ban service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert fail2ban service is running
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
        fail_msg: "Fail2ban service not running"
      tags: molecule-notest

    - name: Check HTTP port is listening
      ansible.builtin.wait_for:
        port: 80
        host: localhost
        timeout: 5
      tags: molecule-notest

    - name: Check HTTPS port is listening
      ansible.builtin.wait_for:
        port: 443
        host: localhost
        timeout: 5
      tags: molecule-notest

    - name: Test HTTP to HTTPS redirect for test.cluster.local
      ansible.builtin.uri:
        url: http://test.cluster.local
        method: GET
        follow_redirects: none
        status_code: 301
      tags: molecule-notest

    - name: Test HTTPS response for test.cluster.local
      ansible.builtin.uri:
        url: https://test.cluster.local
        method: GET
        validate_certs: false
        status_code: 200
      tags: molecule-notest

    - name: Test HTTP to HTTPS redirect for ci.cluster.local
      ansible.builtin.uri:
        url: http://ci.cluster.local
        method: GET
        follow_redirects: none
        status_code: 301
      tags: molecule-notest

    - name: Test HTTPS response for ci.cluster.local
      ansible.builtin.uri:
        url: https://ci.cluster.local
        method: GET
        validate_certs: false
        status_code: 200
      tags: molecule-notest

    - name: Test HTTP to HTTPS redirect for status.cluster.local
      ansible.builtin.uri:
        url: http://status.cluster.local
        method: GET
        follow_redirects: none
        status_code: 301
      tags: molecule-notest

    - name: Test HTTPS response for status.cluster.local
      ansible.builtin.uri:
        url: https://status.cluster.local
        method: GET
        validate_certs: false
        status_code: 200
      tags: molecule-notest