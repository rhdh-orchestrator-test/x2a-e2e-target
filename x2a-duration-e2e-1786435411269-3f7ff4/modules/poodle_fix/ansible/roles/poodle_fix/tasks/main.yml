---
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: apache2
    state: present
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: "{{ apache_config_path }}"
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol {{ ssl_protocol_string }}
    mode: "0644"
  notify:
    - Restart apache2
