---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check configuration files
    - name: Check Redis configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/redis/redis.conf
      register: redis_conf

    - name: Assert Redis configuration file exists
      ansible.builtin.assert:
        that:
          - redis_conf.stat.exists
          - redis_conf.stat.size > 0
        fail_msg: "Redis configuration file not found or empty"
        success_msg: "Redis configuration file exists and has content"

    - name: Get Redis configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/redis/redis.conf
      register: redis_conf_content
      when: redis_conf.stat.exists

    - name: Assert Redis configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'port 6379' in (redis_conf_content.content | b64decode)"
          - "'bind 127.0.0.1' in (redis_conf_content.content | b64decode)"
          - "'daemonize yes' in (redis_conf_content.content | b64decode)"
          - "'logfile /var/log/redis/redis-server.log' in (redis_conf_content.content | b64decode)"
          - "'dir /var/lib/redis' in (redis_conf_content.content | b64decode)"
        fail_msg: "Redis configuration does not contain expected settings"
        success_msg: "Redis configuration contains expected settings"
      when: redis_conf.stat.exists

    # Check data directories
    - name: Check Redis data directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/lib/redis
      register: redis_data_dir

    - name: Assert Redis data directory exists
      ansible.builtin.assert:
        that:
          - redis_data_dir.stat.exists
          - redis_data_dir.stat.isdir
        fail_msg: "Redis data directory not found"
        success_msg: "Redis data directory exists"

    # Check log files
    - name: Check Redis log file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/redis/redis-server.log
      register: redis_log

    - name: Assert Redis log file exists
      ansible.builtin.assert:
        that:
          - redis_log.stat.exists
          - redis_log.stat.size > 0
        fail_msg: "Redis log file not found or empty"
        success_msg: "Redis log file exists and has content"

    # Check socket file
    - name: Check Redis socket file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/run/redis/redis-server.sock
      register: redis_sock

    - name: Assert Redis socket file exists
      ansible.builtin.assert:
        that:
          - redis_sock.stat.exists
        fail_msg: "Redis socket file not found"
        success_msg: "Redis socket file exists"

    # Service checks (tagged to skip in container)
    - name: Check Redis service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service'].state == 'running'"
          - "ansible_facts.services['redis-server.service'].status == 'enabled'"
        fail_msg: "Redis service is not running or not enabled"
        success_msg: "Redis service is running and enabled"
      tags: molecule-notest

    # Network checks (tagged to skip in container)
    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 1
      register: redis_port_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Redis port is listening
      ansible.builtin.assert:
        that:
          - redis_port_check is succeeded
        fail_msg: "Redis is not listening on port 6379"
        success_msg: "Redis is listening on port 6379"
      tags: molecule-notest

    # Redis connectivity check (tagged to skip in container)
    - name: Check Redis connectivity with ping
      ansible.builtin.command: redis-cli ping
      register: redis_ping
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Redis responds to ping
      ansible.builtin.assert:
        that:
          - redis_ping.rc == 0
          - "'PONG' in redis_ping.stdout"
        fail_msg: "Redis did not respond to ping"
        success_msg: "Redis responded to ping with PONG"
      tags: molecule-notest