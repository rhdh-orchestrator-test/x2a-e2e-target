---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application
    description:
      - Deploys the FastAPI tutorial repository, Python virtual environment, PostgreSQL dependency, and systemd service.
    options:
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output for tasks that handle the database password.
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Filesystem path where the application repository is deployed.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the FastAPI tutorial application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_virtualenv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Filesystem path for the Python virtual environment.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name for the application.
      fastapi_tutorial_service_unit:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Filesystem path for the systemd unit file.
      fastapi_tutorial_bind_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Host address where Uvicorn listens.
      fastapi_tutorial_bind_port:
        type: int
        required: false
        default: 8000
        description: TCP port where Uvicorn listens.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name written to the application environment file.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version written to the application environment file.
      database_host:
        type: str
        required: true
        description: Database host injected by the AAP credential type.
      database_name:
        type: str
        required: true
        description: Database name injected by the AAP credential type.
      database_user:
        type: str
        required: true
        description: Database username injected by the AAP credential type.
      database_password:
        type: str
        required: true
        description: Database password injected by the AAP credential type.
