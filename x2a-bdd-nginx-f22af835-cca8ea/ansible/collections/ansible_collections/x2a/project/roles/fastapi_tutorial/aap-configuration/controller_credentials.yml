---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials for the FastAPI application's local PostgreSQL database connection.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      database_host: "{{ database_host }}"
      database_name: "{{ database_name }}"
      database_user: "{{ database_user }}"
      database_password: "{{ vault_database_password }}"
