---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the FastAPI application's local PostgreSQL database connection.
    kind: cloud
    inputs:
      fields:
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server.
        - id: database_name
          type: string
          label: Database Name
          help_text: Name of the PostgreSQL database used by the FastAPI application.
        - id: database_user
          type: string
          label: Database User
          help_text: PostgreSQL role used by the FastAPI application.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL application role; store it in Ansible Vault or another protected secret store.
      required:
        - database_host
        - database_name
        - database_user
        - database_password
    injectors:
      extra_vars:
        database_host: !unsafe "{{ database_host }}"
        database_name: !unsafe "{{ database_name }}"
        database_user: !unsafe "{{ database_user }}"
        database_password: !unsafe "{{ database_password }}"
