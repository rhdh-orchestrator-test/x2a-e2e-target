---
argument_specs:
  main:
    short_description: Configure Redis cache authentication and log storage
    description:
      - Creates the Redis log directory.
      - Configures Redis authentication and removes obsolete replication directives.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether tasks handling the Redis password suppress output.
      cache_redis_config_path:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to the Redis configuration file.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Directory used for Redis logs.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: Redis TCP port.
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: Owner of the Redis log directory.
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: Group owner of the Redis log directory.
      cache_redis_log_mode:
        type: str
        required: false
        default: "0755"
        description: Permissions for the Redis log directory.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
