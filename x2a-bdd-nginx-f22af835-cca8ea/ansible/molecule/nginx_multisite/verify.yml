---
# Unsupported pre-flight checks: journalctl output, sysctl contents, and the
# approximate certificate validity duration have no concrete expected outcome.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: false
  vars:
    verify_sites:
      - name: test.cluster.local
        root: /opt/server/test
        certificate: /etc/ssl/certs/test.cluster.local.crt
        key: /etc/ssl/private/test.cluster.local.key
        available: /etc/nginx/sites-available/test.cluster.local
        enabled: /etc/nginx/sites-enabled/test.cluster.local
      - name: ci.cluster.local
        root: /opt/server/ci
        certificate: /etc/ssl/certs/ci.cluster.local.crt
        key: /etc/ssl/private/ci.cluster.local.key
        available: /etc/nginx/sites-available/ci.cluster.local
        enabled: /etc/nginx/sites-enabled/ci.cluster.local
      - name: status.cluster.local
        root: /opt/server/status
        certificate: /etc/ssl/certs/status.cluster.local.crt
        key: /etc/ssl/private/status.cluster.local.key
        available: /etc/nginx/sites-available/status.cluster.local
        enabled: /etc/nginx/sites-enabled/status.cluster.local
    verify_packages:
      - nginx
      - fail2ban
      - ufw
      - openssl
      - ca-certificates
  tasks:
    - name: Verify pre-flight packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert pre-flight packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        loop: "{{ verify_packages }}"
        loop_control:
          loop_var: item_package
        fail_msg: "A required pre-flight package is not installed."

    - name: Gather service facts for pre-flight services
      ansible.builtin.service_facts:

    - name: Assert fail2ban is active and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'
          - ansible_facts['services']['fail2ban.service']['status'] == 'enabled'
        fail_msg: "The fail2ban service is not active and enabled."

    - name: Assert nginx is active and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['nginx.service']['state'] == 'running'
          - ansible_facts['services']['nginx.service']['status'] == 'enabled'
        fail_msg: "The nginx service is not active and enabled."

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv: [nginx, -t]
      changed_when: false

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv: [sshd, -t]
      changed_when: false

    - name: Verify base configuration files exist
      ansible.builtin.stat:
        path: "{{ item_base_file }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
      loop_control:
        loop_var: item_base_file
      register: base_file_stats

    - name: Assert base configuration files exist
      ansible.builtin.assert:
        that:
          - item_base_stat['stat']['exists']
        loop: "{{ base_file_stats['results'] }}"
        loop_control:
          loop_var: item_base_stat
        fail_msg: "A required base configuration file is missing."

    - name: Check UFW status
      ansible.builtin.command:
        argv: [ufw, status, verbose]
      changed_when: false
      register: ufw_status

    - name: Assert UFW is active with the expected rules
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status['stdout']"
          - "'Default: deny (incoming)' in ufw_status['stdout']"
          - "'22/tcp' in ufw_status['stdout'] or 'SSH' in ufw_status['stdout']"
          - "'80/tcp' in ufw_status['stdout'] or 'HTTP' in ufw_status['stdout']"
          - "'443/tcp' in ufw_status['stdout'] or 'HTTPS' in ufw_status['stdout']"
        fail_msg: "UFW does not have the expected active, default-deny configuration."

    - name: Read SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config

    - name: Assert SSH root login and password authentication are disabled
      ansible.builtin.assert:
        that:
          - (sshd_config['content'] | b64decode) is regex('(?m)^\\s*PermitRootLogin\\s+no\\s*$')
          - (sshd_config['content'] | b64decode) is regex('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')
        fail_msg: "SSH hardening directives are not set to no."

    - name: Verify the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']
        fail_msg: "The default nginx site still exists."

    - name: Verify each site artifact exists
      ansible.builtin.stat:
        path: "{{ item_artifact }}"
      loop: "{{ verify_sites | map(attribute='root') | list + verify_sites | map(attribute='available') | list + verify_sites | map(attribute='certificate') | list + verify_sites | map(attribute='key') | list }}"
      loop_control:
        loop_var: item_artifact
      register: site_artifact_stats

    - name: Assert each site artifact exists
      ansible.builtin.assert:
        that:
          - item_artifact_stat['stat']['exists']
        loop: "{{ site_artifact_stats['results'] }}"
        loop_control:
          loop_var: item_artifact_stat
        fail_msg: "A required site artifact is missing."

    - name: Verify each site index file exists
      ansible.builtin.stat:
        path: "{{ item_site['root'] }}/index.html"
      loop: "{{ verify_sites }}"
      loop_control:
        loop_var: item_site
      register: index_stats

    - name: Assert each site index file exists
      ansible.builtin.assert:
        that:
          - item_index['stat']['exists']
        loop: "{{ index_stats['results'] }}"
        loop_control:
          loop_var: item_index
        fail_msg: "A site index file is missing."

    - name: Verify each enabled site symlink
      ansible.builtin.stat:
        path: "{{ item_site['enabled'] }}"
        follow: false
      loop: "{{ verify_sites }}"
      loop_control:
        loop_var: item_site
      register: enabled_site_stats

    - name: Assert each enabled site symlink resolves to its matching configuration
      ansible.builtin.assert:
        that:
          - item_enabled['stat']['islnk']
          - item_enabled['stat']['ln_source'] == item_enabled['item']['available']
        loop: "{{ enabled_site_stats['results'] }}"
        loop_control:
          loop_var: item_enabled
        fail_msg: "An enabled site symlink does not target its matching configuration."

    - name: Inspect each site certificate
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_site['certificate'] }}"
          - -noout
          - -subject
          - -dates
          - -text
      loop: "{{ verify_sites }}"
      loop_control:
        loop_var: item_site
      changed_when: false
      register: certificate_details

    - name: Assert each certificate has the matching subject and 2048-bit public key
      ansible.builtin.assert:
        that:
          - item_certificate['item']['name'] in item_certificate['stdout']
          - "'Public-Key: (2048 bit)' in item_certificate['stdout']"
        loop: "{{ certificate_details['results'] }}"
        loop_control:
          loop_var: item_certificate
        fail_msg: "A site certificate does not have the expected subject or key size."

    - name: Wait for the HTTPS listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 443
        state: started
        timeout: 10

    - name: Verify each site returns an nginx HTTPS response
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_site['name'] }}"
        validate_certs: false
        return_content: false
      loop: "{{ verify_sites }}"
      loop_control:
        loop_var: item_site
      register: https_responses

    - name: Assert each HTTPS response identifies nginx
      ansible.builtin.assert:
        that:
          - "'nginx' in (item_response['server'] | default('') | lower)"
        loop: "{{ https_responses['results'] }}"
        loop_control:
          loop_var: item_response
        fail_msg: "A site did not return an nginx HTTPS response."
