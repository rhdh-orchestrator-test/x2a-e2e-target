---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache
    description:
      - Fixes the POODLE SSL vulnerability in Apache web server by updating SSL protocol configuration.
      - Installs Apache, enables SSL module, and configures secure SSL protocols.
      - Disables vulnerable SSL protocols and enables only secure TLSv1.2.
      - Restarts Apache service after configuration changes.
    options:
      apache_ssl_config_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file.
      ssl_protocols:
        type: str
        required: false
        default: -all +TLSv1.2
        description: SSL protocols to enable. Uses Apache SSLProtocol directive syntax.
