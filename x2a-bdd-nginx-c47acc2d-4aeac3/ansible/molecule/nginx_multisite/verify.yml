---
# Unsupported pre-flight checks: package-query output, detailed configuration dumps,
# fail2ban jail-detail output, log tails, and certificate validity dates have no
# stated expected outcome beyond the assertions below.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: false
  vars:
    sites:
      - test.cluster.local
      - ci.cluster.local
      - status.cluster.local
    required_paths:
      - /etc/nginx/nginx.conf
      - /etc/nginx/conf.d/security.conf
      - /etc/fail2ban/jail.local
      - /etc/sysctl.d/99-security.conf
      - /etc/ssh/sshd_config
      - /etc/nginx/sites-available/test.cluster.local
      - /etc/nginx/sites-available/ci.cluster.local
      - /etc/nginx/sites-available/status.cluster.local
      - /etc/nginx/sites-enabled/test.cluster.local
      - /etc/nginx/sites-enabled/ci.cluster.local
      - /etc/nginx/sites-enabled/status.cluster.local
      - /etc/ssl/certs/test.cluster.local.crt
      - /etc/ssl/private/test.cluster.local.key
      - /etc/ssl/certs/ci.cluster.local.crt
      - /etc/ssl/private/ci.cluster.local.key
      - /etc/ssl/certs/status.cluster.local.crt
      - /etc/ssl/private/status.cluster.local.key
      - /opt/server/test
      - /opt/server/test/index.html
      - /opt/server/ci
      - /opt/server/ci/index.html
      - /opt/server/status
      - /opt/server/status/index.html
      - /run/nginx.pid
      - /var/log/nginx/access.log
      - /var/log/nginx/error.log
      - /var/log/nginx/test.cluster.local_access.log
      - /var/log/nginx/test.cluster.local_error.log
      - /var/log/nginx/ci.cluster.local_access.log
      - /var/log/nginx/ci.cluster.local_error.log
      - /var/log/nginx/status.cluster.local_access.log
      - /var/log/nginx/status.cluster.local_error.log
      - /var/log/auth.log
    sysctl_expectations:
      - key: net.ipv4.conf.default.rp_filter
        value: "1"
      - key: net.ipv4.conf.all.rp_filter
        value: "1"
      - key: net.ipv4.conf.all.accept_redirects
        value: "0"
      - key: net.ipv6.conf.all.disable_ipv6
        value: "1"
      - key: net.ipv4.tcp_syncookies
        value: "1"
      - key: net.ipv4.tcp_max_syn_backlog
        value: "2048"

  tasks:
    - name: Verify files and directories listed by the pre-flight checks
      ansible.builtin.stat:
        path: "{{ item_required_path }}"
      register: required_path_results
      loop: "{{ required_paths }}"
      loop_control:
        loop_var: item_required_path

    - name: Assert files and directories listed by the pre-flight checks exist
      ansible.builtin.assert:
        that:
          - item_required_result.stat.exists
        loop: "{{ required_path_results.results }}"
        loop_control:
          loop_var: item_required_result

    - name: Verify the default enabled nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert the default enabled nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site.stat.exists

    - name: Gather service status
      ansible.builtin.service_facts:

    - name: Assert nginx, fail2ban, and ssh are active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['nginx.service']['state'] == 'running'
          - ansible_facts.services['fail2ban.service']['state'] == 'running'
          - ansible_facts.services['ssh.service']['state'] == 'running'

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_test.rc == 0

    - name: Dump nginx configuration for configured host names
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      register: nginx_dump
      changed_when: false

    - name: Assert all configured host names occur in nginx configuration
      ansible.builtin.assert:
        that:
          - item_site in (nginx_dump.stdout ~ nginx_dump.stderr)
        loop: "{{ sites }}"
        loop_control:
          loop_var: item_site

    - name: Verify HTTP redirects to HTTPS
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_http_site }}"
        follow_redirects: none
        return_content: false
        status_code: 301
      register: http_redirects
      loop: "{{ sites }}"
      loop_control:
        loop_var: item_http_site

    - name: Assert HTTP redirects point to HTTPS
      ansible.builtin.assert:
        that:
          - item_http_result.status == 301
          - item_http_result.location is search('https://')
        loop: "{{ http_redirects.results }}"
        loop_control:
          loop_var: item_http_result

    - name: Verify HTTPS responses and security headers
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_https_site }}"
        validate_certs: false
        return_content: false
        status_code: 200
      register: https_responses
      loop: "{{ sites }}"
      loop_control:
        loop_var: item_https_site

    - name: Assert HTTPS responses include expected security headers
      ansible.builtin.assert:
        that:
          - item_https_result.status == 200
          - "'strict-transport-security' in item_https_result.xheaders"
          - "'x-frame-options' in item_https_result.xheaders"
          - "'x-content-type-options' in item_https_result.xheaders"
          - "'content-security-policy' in item_https_result.xheaders"
        loop: "{{ https_responses.results }}"
        loop_control:
          loop_var: item_https_result

    - name: Verify TLS 1.2 and TLS 1.3 support
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - 127.0.0.1:443
          - -servername
          - test.cluster.local
          - "{{ item_tls['option'] }}"
          - -brief
        stdin: ""
      register: tls_results
      changed_when: false
      loop:
        - option: -tls1_2
          protocol: TLSv1.2
        - option: -tls1_3
          protocol: TLSv1.3
      loop_control:
        loop_var: item_tls

    - name: Assert TLS 1.2 and TLS 1.3 are supported
      ansible.builtin.assert:
        that:
          - item_tls_result.rc == 0
          - item_tls_result.item['protocol'] in (item_tls_result.stdout ~ item_tls_result.stderr)
        loop: "{{ tls_results.results }}"
        loop_control:
          loop_var: item_tls_result

    - name: Verify SSH, HTTP, and HTTPS ports are listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_port }}"
        state: started
        timeout: 5
      loop:
        - 22
        - 80
        - 443
      loop_control:
        loop_var: item_port

    - name: Verify certificate common names
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "/etc/ssl/certs/{{ item_certificate['site'] }}.crt"
          - -noout
          - -subject
      register: certificate_results
      changed_when: false
      loop:
        - site: test.cluster.local
        - site: ci.cluster.local
        - site: status.cluster.local
      loop_control:
        loop_var: item_certificate

    - name: Assert certificate common names match their sites
      ansible.builtin.assert:
        that:
          - "'CN=' ~ item_certificate_result.item['site'] in item_certificate_result.stdout"
        loop: "{{ certificate_results.results }}"
        loop_control:
          loop_var: item_certificate_result

    - name: Verify UFW status and policy
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: ufw_status
      changed_when: false

    - name: Assert UFW is active, denies incoming traffic, and allows required ports
      ansible.builtin.assert:
        that:
          - ufw_status.stdout is search('Status: active')
          - ufw_status.stdout is search('Default: deny \(incoming\)')
          - ufw_status.stdout is search('22/tcp')
          - ufw_status.stdout is search('80/tcp')
          - ufw_status.stdout is search('443/tcp')

    - name: Verify fail2ban is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - fail2ban
      register: fail2ban_enabled
      changed_when: false

    - name: Assert fail2ban is enabled
      ansible.builtin.assert:
        that:
          - fail2ban_enabled.stdout | trim == 'enabled'

    - name: Read SSH configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: ssh_config

    - name: Assert SSH root login and password authentication are disabled
      ansible.builtin.assert:
        that:
          - (ssh_config.content | b64decode) is search('(?m)^\\s*PermitRootLogin\\s+no\\s*$')
          - (ssh_config.content | b64decode) is search('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false

    - name: Read selected security sysctls
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - "{{ item_sysctl['key'] }}"
      register: sysctl_results
      changed_when: false
      loop: "{{ sysctl_expectations }}"
      loop_control:
        loop_var: item_sysctl

    - name: Assert selected security sysctls have expected values
      ansible.builtin.assert:
        that:
          - item_sysctl_result.stdout | trim == item_sysctl_result.item['value']
        loop: "{{ sysctl_results.results }}"
        loop_control:
          loop_var: item_sysctl_result
