---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: /opt/fastapi-tutorial
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize application repository
  ansible.builtin.git:
    repo: https://github.com/dibanez/fastapi_tutorial.git
    dest: /opt/fastapi-tutorial
    version: main
    update: true

- name: Create Python virtual environment
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - /opt/fastapi-tutorial/venv
    creates: /opt/fastapi-tutorial/venv/bin/python

- name: Install application dependencies
  ansible.builtin.pip:
    requirements: /opt/fastapi-tutorial/requirements.txt
    virtualenv: /opt/fastapi-tutorial/venv

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL application role  # noqa: L039 R101 - credentials are validated by the prior task and the command uses trusted role inputs
  ansible.builtin.shell:  # noqa: R101 - command uses credentials validated by the prior task
    cmd: |
      if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}'" | grep -q 1; then
        psql -c "CREATE ROLE {{ db_username }} LOGIN PASSWORD '{{ db_password }}';"
        echo changed
      else
        echo unchanged
      fi
  register: fastapi_tutorial_role_result
  changed_when: "'changed' in fastapi_tutorial_role_result.stdout"
  become: true  # noqa: R108 - PostgreSQL role administration must run as the postgres system user
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL application database  # noqa: L039 R101 - database values are validated by the prior task and the command uses trusted role inputs
  ansible.builtin.shell:  # noqa: R101 - command uses database values validated by the prior task
    cmd: |
      if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ db_name }}'" | grep -q 1; then
        createdb -O '{{ db_username }}' '{{ db_name }}'
        echo changed
      else
        echo unchanged
      fi
  register: fastapi_tutorial_database_result
  changed_when: "'changed' in fastapi_tutorial_database_result.stdout"
  become: true  # noqa: R108 - PostgreSQL database administration must run as the postgres system user
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant PostgreSQL database privileges  # noqa: L039 R101 - database values are validated by the prior task and the command uses trusted role inputs
  ansible.builtin.command:  # noqa: R101 - command uses database values validated by the prior task
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_username }};
  changed_when: false
  become: true  # noqa: R108 - PostgreSQL privilege administration must run as the postgres system user
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write application environment file  # noqa: L039 - database credentials are validated by the prior task
  ansible.builtin.copy:
    dest: /opt/fastapi-tutorial/.env
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}/{{ db_name }}
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/fastapi-tutorial
      Environment="PATH=/opt/fastapi-tutorial/venv/bin"
      ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Enable and start FastAPI tutorial service
  ansible.builtin.systemd:
    name: fastapi-tutorial
    enabled: true
    state: started
    daemon_reload: true
