---
controller_credential_types:
  - name: Redis Authentication
    description: Credential for authenticating clients to the redis-6379 Redis instance.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password used as the Redis requirepass value for the redis-6379 instance.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
