---
- name: Restart SSH service
  ansible.builtin.service:
    name: '{{ nginx_multisite_ssh_service_name | default("ssh") }}'
    state: restarted

- name: Reload nginx service
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload security sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
