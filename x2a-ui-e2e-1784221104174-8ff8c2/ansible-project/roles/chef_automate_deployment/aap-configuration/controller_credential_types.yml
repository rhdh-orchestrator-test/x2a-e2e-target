---
controller_credential_types:
- name: Chef Deployment Password
  description: Password used for Chef user creation during deployment
  kind: cloud
  inputs:
    fields:
    - id: user_password
      type: string
      label: User Password
      secret: true
      help_text: Password for the initial Chef user account
    required:
    - user_password
  injectors:
    extra_vars:
      user_password: !unsafe '{{ user_password }}'
