---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_username: jtonello
    chef_automate_longusername: John Tonello
    chef_automate_useremail: jtonello@chef.lab
    chef_automate_orgname: lab
    chef_automate_longorgname: Chef Lab
    chef_automate_userfilename: "{{ chef_automate_username }}.pem"
    chef_automate_orgfilename: "{{ chef_automate_orgname }}-validator.pem"
  tasks:
    # Check hostname configuration
    - name: Check if hostname file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/hostname"
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file does not exist"
        success_msg: "Hostname file exists"

    - name: Get hostname file content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/hostname"
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is correctly set
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == chef_automate_hostname
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_file.stat.exists

    # Check sysctl settings
    - name: Check if sysctl settings file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl settings file does not exist"
        success_msg: "Sysctl settings file exists"

    - name: Get sysctl file content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl settings are correctly set
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
          - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "Sysctl settings are not set correctly"
        success_msg: "Sysctl settings are set correctly"
      when: sysctl_file.stat.exists

    # Check Chef Automate CLI
    - name: Check if Chef Automate CLI exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/tmp/chef-automate"
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI does not exist or is not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Check Chef Automate deployment
    - name: Check if Chef Automate deployment marker exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/hab/sup"
      register: hab_dir

    - name: Assert Chef Automate deployment marker exists
      ansible.builtin.assert:
        that:
          - hab_dir.stat.exists
          - hab_dir.stat.isdir
        fail_msg: "Chef Automate deployment marker does not exist"
        success_msg: "Chef Automate deployment marker exists"

    # Check Chef user PEM file
    - name: Check if Chef user PEM file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_automate_userfilename }}"
      register: user_pem

    - name: Assert Chef user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.isreg
          - user_pem.stat.mode == '0600'
        fail_msg: "Chef user PEM file does not exist or has incorrect permissions"
        success_msg: "Chef user PEM file exists with correct permissions"

    # Check Chef organization validator PEM file
    - name: Check if Chef organization validator PEM file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_automate_orgfilename }}"
      register: org_pem

    - name: Assert Chef organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_pem.stat.exists
          - org_pem.stat.isreg
          - org_pem.stat.mode == '0600'
        fail_msg: "Chef organization validator PEM file does not exist or has incorrect permissions"
        success_msg: "Chef organization validator PEM file exists with correct permissions"

    # Check chef-server-ctl mock
    - name: Check if chef-server-ctl mock exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/tmp/chef-server-ctl"
      register: chef_server_ctl

    - name: Assert chef-server-ctl mock exists
      ansible.builtin.assert:
        that:
          - chef_server_ctl.stat.exists
          - chef_server_ctl.stat.isreg
          - chef_server_ctl.stat.executable
        fail_msg: "chef-server-ctl mock does not exist or is not executable"
        success_msg: "chef-server-ctl mock exists and is executable"

    # Service checks (tagged for skipping in container)
    - name: Check Chef Automate services
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate services are running
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "'chef-server.service' in ansible_facts.services"
        fail_msg: "Chef Automate services are not running"
        success_msg: "Chef Automate services are running"
      tags: molecule-notest

    # Port checks (tagged for skipping in container)
    - name: Check if required ports are available
      ansible.builtin.wait_for:
        port: "{{ item }}"
        timeout: 1
      loop:
        - 80
        - 443
        - 9631
        - 9638
        - 9671
      register: port_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert required ports are available
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Required ports are not available"
        success_msg: "Required ports are available"
      tags: molecule-notest