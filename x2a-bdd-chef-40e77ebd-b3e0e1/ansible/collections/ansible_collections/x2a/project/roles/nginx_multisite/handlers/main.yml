---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Reload nginx multisite sysctl settings
  ansible.posix.sysctl:
    sysctl_file: /etc/sysctl.d/99-security.conf
    reload: true

- name: Restart nginx multisite SSH
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
    state: restarted
