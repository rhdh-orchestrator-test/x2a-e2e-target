---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Configure fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Check UFW status
  ansible.builtin.command:
    cmd: ufw status verbose
  when: nginx_multisite_ufw_enabled | bool
  changed_when: false
  register: nginx_multisite_ufw_status

- name: Set UFW default incoming policy
  ansible.builtin.command:
    cmd: ufw --force default deny incoming
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Default: deny (incoming)' not in nginx_multisite_ufw_status.stdout | default('')" # noqa: L039 - registered by prior Check UFW status task

- name: Allow SSH through UFW
  ansible.builtin.command:
    cmd: ufw allow 22/tcp
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout | default('')" # noqa: L039 - registered by prior Check UFW status task

- name: Allow HTTP through UFW
  ansible.builtin.command:
    cmd: ufw allow 80/tcp
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout | default('')" # noqa: L039 - registered by prior Check UFW status task

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    cmd: ufw allow 443/tcp
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout | default('')" # noqa: L039 - registered by prior Check UFW status task

- name: Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Status: active' not in nginx_multisite_ufw_status.stdout | default('')" # noqa: L039 - registered by prior Check UFW status task

- name: Check sysctl configuration directory
  ansible.builtin.stat:
    path: /etc/sysctl.d
  register: nginx_multisite_sysctl_dir

- name: Configure kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  when: nginx_multisite_sysctl_dir.stat.isdir | default(false) # noqa: L039 - registered by prior Check sysctl configuration directory task
  notify: Reload nginx multisite sysctl settings

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?\s*PermitRootLogin\s+
    line: PermitRootLogin no
    state: present
    create: false
    backup: true
  when: nginx_multisite_ssh_disable_root | bool
  notify: Restart nginx multisite SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?\s*PasswordAuthentication\s+
    line: PasswordAuthentication no
    state: present
    create: false
    backup: true
  when: not (nginx_multisite_ssh_password_auth | bool)
  notify: Restart nginx multisite SSH
