---
controller_credential_types:
  - name: Redis Authentication
    description: Authentication credential for the Redis instance listening on port 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required to authenticate to the Redis instance on port 6379; store it securely rather than in plaintext.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
