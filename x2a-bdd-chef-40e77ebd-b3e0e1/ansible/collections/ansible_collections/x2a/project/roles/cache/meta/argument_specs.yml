---
argument_specs:
  main:
    short_description: Configure Memcached and Redis caching services
    description:
      - Installs and configures Memcached and Redis with their service accounts, directories, and services.
    options:
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Redis package name for the target operating system.
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Redis system service name.
      cache_memcached_user:
        type: str
        required: false
        default: memcached
        description: Memcached service account name.
      cache_memcached_group:
        type: str
        required: false
        default: memcached
        description: Memcached service group name.
      cache_memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory allocation in megabytes.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      cache_memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      cache_memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      cache_memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached connections.
      cache_memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      cache_memcached_threads:
        type: int
        required: false
        default: 4
        description: Number of Memcached worker threads.
      cache_memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file descriptor limit.
      cache_memcached_experimental_options:
        type: str
        required: false
        default: ""
        description: Additional experimental Memcached options.
      cache_memcached_extra_cli_options:
        type: str
        required: false
        default: ""
        description: Additional Memcached command-line options.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output when handling the Redis password.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
