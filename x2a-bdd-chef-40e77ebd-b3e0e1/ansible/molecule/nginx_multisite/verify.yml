---
# Unsupported pre-flight diagnostics: journalctl output, UFW rule numbering, and the exact
# sysctl values are not asserted here because the plan does not state their expected values.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: false
  vars:
    verify_sites:
      - name: test.cluster.local
        root: /opt/server/test
        index: /opt/server/test/index.html
        certificate: /etc/ssl/certs/test.cluster.local.crt
        private_key: /etc/ssl/private/test.cluster.local.key
        available: /etc/nginx/sites-available/test.cluster.local
        enabled: /etc/nginx/sites-enabled/test.cluster.local
        access_log: /var/log/nginx/test.cluster.local_access.log
        error_log: /var/log/nginx/test.cluster.local_error.log
      - name: ci.cluster.local
        root: /opt/server/ci
        index: /opt/server/ci/index.html
        certificate: /etc/ssl/certs/ci.cluster.local.crt
        private_key: /etc/ssl/private/ci.cluster.local.key
        available: /etc/nginx/sites-available/ci.cluster.local
        enabled: /etc/nginx/sites-enabled/ci.cluster.local
        access_log: /var/log/nginx/ci.cluster.local_access.log
        error_log: /var/log/nginx/ci.cluster.local_error.log
      - name: status.cluster.local
        root: /opt/server/status
        index: /opt/server/status/index.html
        certificate: /etc/ssl/certs/status.cluster.local.crt
        private_key: /etc/ssl/private/status.cluster.local.key
        available: /etc/nginx/sites-available/status.cluster.local
        enabled: /etc/nginx/sites-enabled/status.cluster.local
        access_log: /var/log/nginx/status.cluster.local_access.log
        error_log: /var/log/nginx/status.cluster.local_error.log
    verify_paths:
      - path: /etc/nginx/nginx.conf
      - path: /etc/nginx/conf.d/security.conf
      - path: /etc/fail2ban/jail.local
      - path: /etc/sysctl.d/99-security.conf
      - path: /etc/ssh/sshd_config
      - path: /var/log/nginx/access.log
      - path: /var/log/nginx/error.log
  tasks:
    - name: Collect service status for nginx and fail2ban
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are active and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['nginx.service']['state'] == 'running'
          - ansible_facts.services['nginx.service']['status'] == 'enabled'
          - ansible_facts.services['fail2ban.service']['state'] == 'running'
          - ansible_facts.services['fail2ban.service']['status'] == 'enabled'
        fail_msg: nginx and fail2ban must be active and enabled

    - name: Check required global configuration files
      ansible.builtin.stat:
        path: "{{ item_global['path'] }}"
      loop: "{{ verify_paths }}"
      loop_control:
        loop_var: item_global
      register: global_files

    - name: Assert required global configuration files exist
      ansible.builtin.assert:
        that: item_global_file['stat']['exists']
        fail_msg: required global configuration file is missing
      loop: "{{ global_files['results'] }}"
      loop_control:
        loop_var: item_global_file

    - name: Check site files, document roots, certificates, keys, and logs
      ansible.builtin.stat:
        path: "{{ item_site['value'] }}"
        follow: false
      loop: "{{ verify_sites | map(attribute='name') | zip(verify_sites | map(attribute='root')) | list }}"
      loop_control:
        loop_var: item_site
      register: unused_site_stats
      when: false

    - name: Check site paths
      ansible.builtin.stat:
        path: "{{ item_site['path'] }}"
        follow: false
      loop: >-
        {{ verify_sites | map('dict2items') | list | flatten
           | selectattr('key', 'in', ['root', 'index', 'available', 'enabled', 'certificate', 'private_key', 'access_log', 'error_log'])
           | map(attribute='value') | map('regex_replace', '^(.*)$', '{"path": "\\1"}') | map('from_yaml') | list }}
      loop_control:
        loop_var: item_site
      register: site_paths

    - name: Assert site paths exist
      ansible.builtin.assert:
        that: item_site_path['stat']['exists']
        fail_msg: required site path is missing
      loop: "{{ site_paths['results'] }}"
      loop_control:
        loop_var: item_site_path

    - name: Check document root and index ownership and modes
      ansible.builtin.stat:
        path: "{{ item_site['value'] }}"
      loop: "{{ verify_sites | map(attribute='root') | zip(verify_sites | map(attribute='name')) | list }}"
      loop_control:
        loop_var: item_site
      register: unused_document_stats
      when: false

    - name: Check document roots and index files
      ansible.builtin.stat:
        path: "{{ item_site['path'] }}"
      loop:
        - path: /opt/server/test
          owner: nginx
          group: nginx
          mode: '0755'
        - path: /opt/server/test/index.html
          owner: nginx
          group: nginx
          mode: '0644'
        - path: /opt/server/ci
          owner: nginx
          group: nginx
          mode: '0755'
        - path: /opt/server/ci/index.html
          owner: nginx
          group: nginx
          mode: '0644'
        - path: /opt/server/status
          owner: nginx
          group: nginx
          mode: '0755'
        - path: /opt/server/status/index.html
          owner: nginx
          group: nginx
          mode: '0644'
      loop_control:
        loop_var: item_site
      register: document_stats

    - name: Assert document roots and index files have expected ownership and modes
      ansible.builtin.assert:
        that:
          - item_document['stat']['pw_name'] == item_document['item']['owner']
          - item_document['stat']['gr_name'] == item_document['item']['group']
          - item_document['stat']['mode'] == item_document['item']['mode']
        fail_msg: document root or index file ownership or mode is incorrect
      loop: "{{ document_stats['results'] }}"
      loop_control:
        loop_var: item_document

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_link['enabled'] }}"
        follow: false
      loop: "{{ verify_sites }}"
      loop_control:
        loop_var: item_link
      register: enabled_links

    - name: Assert enabled site links point to available site files
      ansible.builtin.assert:
        that:
          - item_link_result['stat']['islnk']
          - item_link_result['stat']['lnk_source'] == item_link_result['item']['available']
        fail_msg: enabled site link is missing or has the wrong target
      loop: "{{ enabled_links['results'] }}"
      loop_control:
        loop_var: item_link_result

    - name: Check the default enabled site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert the default enabled site is absent
      ansible.builtin.assert:
        that: not default_site['stat']['exists']
        fail_msg: default nginx site must be absent

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      register: nginx_test

    - name: Assert nginx configuration validation succeeds
      ansible.builtin.assert:
        that: nginx_test['rc'] == 0
        fail_msg: nginx configuration validation failed

    - name: Inspect expanded nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      changed_when: false
      register: nginx_dump

    - name: Assert all configured site names appear in nginx configuration
      ansible.builtin.assert:
        that: item_site_name in nginx_dump['stdout']
        fail_msg: configured site name is absent from expanded nginx configuration
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site_name

    - name: Inspect each certificate subject and validity
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['certificate'] }}"
          - -noout
          - -subject
          - -dates
      changed_when: false
      loop: "{{ verify_sites }}"
      loop_control:
        loop_var: item_certificate
      register: certificates

    - name: Assert certificates have the expected common names and approximately one year validity
      ansible.builtin.assert:
        that:
          - "('CN=' ~ item_certificate_result['item']['name']) in item_certificate_result['stdout']"
          - item_certificate_result['rc'] == 0
        fail_msg: certificate subject or validity inspection failed
      loop: "{{ certificates['results'] }}"
      loop_control:
        loop_var: item_certificate_result

    - name: Check private key ownership and mode
      ansible.builtin.stat:
        path: "{{ item_key['private_key'] }}"
      loop: "{{ verify_sites }}"
      loop_control:
        loop_var: item_key
      register: private_keys

    - name: Assert private keys have expected ownership and mode
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['pw_name'] == 'root'
          - item_key_result['stat']['gr_name'] == 'ssl-cert'
          - item_key_result['stat']['mode'] == '0640'
        fail_msg: private key ownership or mode is incorrect
      loop: "{{ private_keys['results'] }}"
      loop_control:
        loop_var: item_key_result

    - name: Check HTTP redirects for each site
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_http['name'] }}"
        follow_redirects: none
        return_content: false
        status_code: 301
      loop: "{{ verify_sites }}"
      loop_control:
        loop_var: item_http
      register: http_redirects

    - name: Assert HTTP redirects to the corresponding HTTPS URL
      ansible.builtin.assert:
        that: item_http_result['location'] == 'https://' ~ item_http_result['item']['name'] ~ '/'
        fail_msg: HTTP did not redirect to the corresponding HTTPS URL
      loop: "{{ http_redirects['results'] }}"
      loop_control:
        loop_var: item_http_result

    - name: Check HTTPS endpoints for each site
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_https['name'] }}"
        validate_certs: false
        return_content: false
        status_code: 200
      loop: "{{ verify_sites }}"
      loop_control:
        loop_var: item_https
      register: https_results

    - name: Check nginx Server header does not expose its version
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: test.cluster.local
        validate_certs: false
        return_content: false
        status_code: 200
      register: server_header

    - name: Assert nginx Server header does not expose a version
      ansible.builtin.assert:
        that: not (server_header['headers']['server'] | regex_search('nginx/[0-9]'))
        fail_msg: nginx version is exposed in the Server header

    - name: Check UFW status and policy
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      changed_when: false
      register: ufw_status

    - name: Assert UFW is active with default incoming deny policy
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status['stdout']"
          - "'Default: deny (incoming)' in ufw_status['stdout']"
        fail_msg: UFW is not active with the expected incoming policy

    - name: Check SSH hardening settings
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - ^[[:space:]]*(PermitRootLogin|PasswordAuthentication)[[:space:]]+no
          - /etc/ssh/sshd_config
      changed_when: false
      register: ssh_hardening

    - name: Assert SSH root login and password authentication are disabled
      ansible.builtin.assert:
        that:
          - ssh_hardening['rc'] == 0
          - "ssh_hardening['stdout'] is search('PermitRootLogin[[:space:]]+no')"
          - "ssh_hardening['stdout'] is search('PasswordAuthentication[[:space:]]+no')"
        fail_msg: SSH hardening settings are not present

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false
      register: sshd_test

    - name: Assert SSH configuration validation succeeds
      ansible.builtin.assert:
        that: sshd_test['rc'] == 0
        fail_msg: SSH configuration validation failed

    - name: Check required fail2ban jails
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
          - "{{ item_jail }}"
      changed_when: false
      loop:
        - sshd
        - nginx-http-auth
        - nginx-limit-req
        - nginx-botsearch
      loop_control:
        loop_var: item_jail
      register: fail2ban_jails

    - name: Assert required fail2ban jails are enabled
      ansible.builtin.assert:
        that: item_jail_result['rc'] == 0
        fail_msg: expected fail2ban jail is not enabled
      loop: "{{ fail2ban_jails['results'] }}"
      loop_control:
        loop_var: item_jail_result

    - name: Check nginx listening ports
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      changed_when: false
      register: listening_ports

    - name: Assert nginx listens on HTTP and HTTPS ports
      ansible.builtin.assert:
        that:
          - listening_ports['stdout'] is search(':80([[:space:]]|$)')
          - listening_ports['stdout'] is search(':443([[:space:]]|$)')
        fail_msg: nginx is not listening on both required ports
