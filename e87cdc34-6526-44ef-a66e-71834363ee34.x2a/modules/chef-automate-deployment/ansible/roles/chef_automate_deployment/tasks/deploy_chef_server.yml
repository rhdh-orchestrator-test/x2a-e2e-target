---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters for optimal performance
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  become: true
  loop: "{{ chef_automate_sysctl_params | dict2items }}"
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - unzip
      - gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: /tmp/chef-automate.zip
    dest: "{{ ansible_env.HOME }}"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/chef-automate"
    mode: "0755"
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "./chef-automate deploy  --product infra-server  --accept-terms-and-mlsa={{ 'true' if chef_automate_accept_license else 'false' }} "
    chdir: "{{ ansible_env.HOME }}"
    creates: /hab
  become: true
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ username }}  "{{ full_name }}"  {{ email }}  "{{ password }}"  --filename {{ username }}.pem

      '
    chdir: "{{ ansible_env.HOME }}"
    creates: "{{ ansible_env.HOME }}/{{ username }}.pem"
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_org_name }}  "{{ chef_org_long_name }}"  --association_user {{ username }}  --filename {{ chef_org_name }}-validator.pem

      '
    chdir: "{{ ansible_env.HOME }}"
    creates: "{{ ansible_env.HOME }}/{{ chef_org_name }}-validator.pem"
  become: true
