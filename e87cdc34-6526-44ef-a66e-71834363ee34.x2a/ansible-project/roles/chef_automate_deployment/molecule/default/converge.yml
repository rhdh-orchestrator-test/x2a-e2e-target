- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    full_name: John Tonello
    email: jtonello@chef.lab
    password: password
    chef_automate_hostname: automate.chef.lab
    chef_org_name: lab
    chef_org_long_name: Chef Lab
    chef_automate_deploy_automate: true
    chef_automate_deploy_infra_server: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/home/ansible
    - /tmp/molecule_test/proc/sys/vm
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl parameter files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/vm/{{ item.key | regex_replace('^vm\.', '') }}
      mode: '0644'
    loop:
    - key: vm.max_map_count
      value: '262144'
    - key: vm.dirty_expire_centisecs
      value: '20000'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'''
      dest: /tmp/molecule_test/home/ansible/chef-automate
      mode: '0755'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/ansible/{{ username }}.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/ansible/{{ chef_org_name }}-validator.pem
      mode: '0600'
  - name: Create mock chef-server-ctl output for user-list
    ansible.builtin.copy:
      content: '{{ username }}'
      dest: /tmp/molecule_test/chef-server-user-list
      mode: '0644'
  - name: Create mock chef-server-ctl output for org-list
    ansible.builtin.copy:
      content: '{{ chef_org_name }}'
      dest: /tmp/molecule_test/chef-server-org-list
      mode: '0644'
  - name: Create mock netstat output for port 443
    ansible.builtin.copy:
      content: tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/chef-automate
      dest: /tmp/molecule_test/netstat-output
      mode: '0644'
  - name: Create mock ss output for port 443
    ansible.builtin.copy:
      content: LISTEN     0      128          *:443                      *:*                   users:(('chef-automate',pid=1234,fd=4))
      dest: /tmp/molecule_test/ss-output
      mode: '0644'
  - name: Create mock chef-automate status output
    ansible.builtin.copy:
      content: 'Service: chef-automate Status: running PID: 1234'
      dest: /tmp/molecule_test/chef-automate-status
      mode: '0644'
  - name: Create mock chef-server-ctl status output
    ansible.builtin.copy:
      content: 'Service: chef-server Status: running PID: 5678'
      dest: /tmp/molecule_test/chef-server-status
      mode: '0644'
