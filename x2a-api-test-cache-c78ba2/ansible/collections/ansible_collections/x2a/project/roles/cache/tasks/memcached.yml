---
- name: Ensure Memcached service user exists
  ansible.builtin.user:
    name: "{{ memcached_service_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Install Memcached package
  ansible.builtin.package:
    name: "memcached{{ '=' + memcached_version if memcached_version is not none else '' }}"
    state: present

- name: Configure Memcached service options  # noqa: L039 - item_cache_option and item_cache_cli are defined by the inline template loops
  ansible.builtin.copy:
    dest: "{{ '/etc/sysconfig/memcached' if ansible_facts.os_family == 'RedHat' else '/etc/default/memcached' }}"  # noqa: R114 - destination is restricted to fixed OS service configuration paths
    content: |
      PORT="{{ memcached_port }}"
      USER="{{ memcached_service_user }}"
      MAXCONN="{{ memcached_maxconn }}"
      CACHESIZE="{{ memcached_memory }}"
      OPTIONS="-l {{ memcached_listen }} -U {{ memcached_udp_port }} -I {{ memcached_max_object_size }} -u {{ memcached_service_user }}{% if memcached_threads is not none %} -t {{ memcached_threads }}{% endif %}{% for item_cache_option in memcached_experimental_options %} {{ item_cache_option }}{% endfor %}{% for item_cache_cli in memcached_extra_cli_options %} {{ item_cache_cli }}{% endfor %}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart Memcached

- name: Ensure Memcached service is enabled and running
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
