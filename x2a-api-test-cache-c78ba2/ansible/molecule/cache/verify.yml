---
# Unsupported pre-flight checks: Memcached's confirmed threads value is not stated;
# Redis password authentication requires a secret-management process; Redis log journal
# inspection and the absence of a Unix socket have no asserted outcome suitable here.
- name: Verify cache services
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify Memcached unit is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - memcached
      register: item_memcached_enabled
      changed_when: false
      failed_when: false

    - name: Assert Memcached unit is enabled
      ansible.builtin.assert:
        that:
          - item_memcached_enabled['rc'] == 0

    - name: Verify Memcached unit is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - memcached
      register: item_memcached_active
      changed_when: false
      failed_when: false

    - name: Assert Memcached unit is active
      ansible.builtin.assert:
        that:
          - item_memcached_active['rc'] == 0

    - name: Verify Memcached TCP listener
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: item_memcached_tcp
      changed_when: false

    - name: Assert Memcached TCP listener is on all IPv4 addresses
      ansible.builtin.assert:
        that:
          - item_memcached_tcp['stdout'] is search('0\\.0\\.0\\.0:11211')

    - name: Verify Memcached UDP listener
      ansible.builtin.command:
        argv:
          - ss
          - -ulnp
      register: item_memcached_udp
      changed_when: false

    - name: Assert Memcached UDP listener is on all IPv4 addresses
      ansible.builtin.assert:
        that:
          - item_memcached_udp['stdout'] is search('0\\.0\\.0\\.0:11211')

    - name: Verify Memcached responds to the version command
      ansible.builtin.command:
        argv:
          - nc
          - -w
          - '2'
          - 127.0.0.1
          - '11211'
        stdin: "version\r\n"
      register: item_memcached_version
      changed_when: false
      failed_when: false

    - name: Assert Memcached returned a version response
      ansible.builtin.assert:
        that:
          - item_memcached_version['rc'] == 0
          - item_memcached_version['stdout'] | length > 0

    - name: Verify Memcached process exists
      ansible.builtin.command:
        argv:
          - ps
          - -ef
      register: item_memcached_process
      changed_when: false

    - name: Assert Memcached process is running as the configured service
      ansible.builtin.assert:
        that:
          - item_memcached_process['stdout'] is search('memcached')

    - name: Locate platform-specific Memcached configuration
      ansible.builtin.find:
        paths:
          - /etc
          - /etc/sysconfig
          - /etc/default
        patterns:
          - 'memcached*'
        file_type: file
        recurse: false
      register: item_memcached_config_files

    - name: Assert a Memcached configuration file was found
      ansible.builtin.assert:
        that:
          - item_memcached_config_files['matched'] | int > 0

    - name: Read platform-specific Memcached configuration
      ansible.builtin.slurp:
        src: "{{ item_memcached_file['path'] }}"
      loop: "{{ item_memcached_config_files['files'] }}"
      loop_control:
        loop_var: item_memcached_file
      register: item_memcached_config_contents

    - name: Assert explicit Memcached configuration values are present
      ansible.builtin.assert:
        that:
          - item_memcached_config_text is search('11211')
          - item_memcached_config_text is search('0\\.0\\.0\\.0')
          - item_memcached_config_text is search('1024')
          - item_memcached_config_text is search('64')
          - item_memcached_config_text is search('1m')
      vars:
        item_memcached_config_text: >-
          {{ item_memcached_config_contents['results']
             | map(attribute='content') | map('b64decode') | join('\n') }}

    - name: Verify Redis unit is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - redis
      register: item_redis_enabled
      changed_when: false
      failed_when: false

    - name: Assert Redis unit is enabled
      ansible.builtin.assert:
        that:
          - item_redis_enabled['rc'] == 0

    - name: Verify Redis unit is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - redis
      register: item_redis_active
      changed_when: false
      failed_when: false

    - name: Assert Redis unit is active
      ansible.builtin.assert:
        that:
          - item_redis_active['rc'] == 0

    - name: Verify Redis TCP listener
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: item_redis_tcp
      changed_when: false

    - name: Assert Redis listens on TCP port 6379
      ansible.builtin.assert:
        that:
          - item_redis_tcp['stdout'] is search(':6379\\b')

    - name: Verify Redis server process exists
      ansible.builtin.command:
        argv:
          - ps
          - -ef
      register: item_redis_process
      changed_when: false

    - name: Assert Redis server process is running
      ansible.builtin.assert:
        that:
          - item_redis_process['stdout'] is search('redis-server')

    - name: Check Redis PID directory
      ansible.builtin.stat:
        path: /run/redis
      register: item_redis_pid_directory

    - name: Assert Redis PID directory exists
      ansible.builtin.assert:
        that:
          - item_redis_pid_directory['stat']['exists']
          - item_redis_pid_directory['stat']['isdir']

    - name: Check Redis configuration
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: item_redis_config

    - name: Assert Redis port and PID path configuration
      ansible.builtin.assert:
        that:
          - item_redis_config_text is search('(?m)^port[ \t]+6379[ \t]*$')
          - item_redis_config_text is search('(?m)^pidfile[ \t]+/run/redis(?:/|$)')
      vars:
        item_redis_config_text: "{{ item_redis_config['content'] | b64decode }}"

    - name: Assert removed Redis replication directives are absent
      ansible.builtin.assert:
        that:
          - item_redis_config_text is not search('(?m)^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)')
      vars:
        item_redis_config_text: "{{ item_redis_config['content'] | b64decode }}"

    - name: Check Redis log directory
      ansible.builtin.stat:
        path: /var/log/redis
      register: item_redis_log_directory

    - name: Assert Redis log directory ownership and mode
      ansible.builtin.assert:
        that:
          - item_redis_log_directory['stat']['exists']
          - item_redis_log_directory['stat']['isdir']
          - item_redis_log_directory['stat']['pw_name'] == 'redis'
          - item_redis_log_directory['stat']['gr_name'] == 'redis'
          - item_redis_log_directory['stat']['mode'] == '0755'
