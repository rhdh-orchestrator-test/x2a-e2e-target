---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache web server
    description:
      - Fixes the POODLE SSL vulnerability by updating Apache SSL protocol configuration
      - Installs Apache web server if not present
      - Enables SSL module and configures secure protocols
      - Disables vulnerable SSL protocols and enables only TLSv1.2
    options:
      apache_ssl_conf_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file
      ssl_protocol_config:
        type: str
        required: false
        default: SSLProtocol -all +TLSv1.2
        description: SSL protocol configuration string to fix POODLE vulnerability
      manage_apache_service:
        type: bool
        required: false
        default: true
        description: Whether to manage Apache service restart
