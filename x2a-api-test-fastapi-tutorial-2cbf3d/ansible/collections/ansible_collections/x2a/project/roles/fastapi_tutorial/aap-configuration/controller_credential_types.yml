---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the FastAPI application's local PostgreSQL database, migrated from hardcoded Chef recipe values to Ansible Vault.
    kind: cloud
    inputs:
      fields:
        - id: database_user
          type: string
          label: Database User
          help_text: PostgreSQL role used by the FastAPI application.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL role; store in Ansible Vault.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_url
          type: string
          label: Database URL
          secret: true
          help_text: Application connection string for PostgreSQL; contains the database password and should be protected from logs and unauthorized access.
      required:
        - database_user
        - database_password
        - database_name
    injectors:
      extra_vars:
        database_user: !unsafe "{{ database_user }}"
        database_password: !unsafe "{{ database_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_url: !unsafe "{{ database_url }}"
