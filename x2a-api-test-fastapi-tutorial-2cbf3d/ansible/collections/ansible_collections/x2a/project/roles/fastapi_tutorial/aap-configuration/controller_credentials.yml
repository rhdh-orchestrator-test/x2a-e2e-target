---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials for the FastAPI application's local PostgreSQL database, migrated from hardcoded Chef recipe values to Ansible Vault.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      database_user: "{{ database_user }}"
      database_password: "{{ vault_database_password }}"
      database_name: "{{ database_name }}"
      database_url: "{{ vault_database_url }}"
