---
controller_credential_types:
  - name: Redis Database Password
    description: Password used to authenticate clients to the default Redis instance.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis clients and configured as requirepass; store the value securely in AAP credentials or an encrypted secret store.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
