---
- name: Install redis-server package
  ansible.builtin.package:
    name: "{{ redis_package }}"
    state: present
- name: Ensure Redis configuration directory exists
  ansible.builtin.file:
    path: /etc/redis
    state: directory
    mode: "0755"
- name: Configure Redis
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    mode: "0644"
  notify: Restart Redis
- name: Enable and start redis-server service
  ansible.builtin.service:
    name: "{{ redis_service }}"
    state: "{{ redis_service_state }}"
    enabled: "{{ redis_service_enabled }}"
