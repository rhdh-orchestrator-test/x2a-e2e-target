---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir

    - name: Create expected Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file example
          port 6379
          bind 127.0.0.1
          daemonize yes
          logfile /var/log/redis/redis-server.log
          dir /var/lib/redis
        dest: /tmp/molecule_test/etc/redis/redis.conf
        mode: "0644"
        backup: true

    - name: Create Redis log file
      ansible.builtin.copy:
        content: "# Redis server log file\n"
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"
        backup: true

    - name: Create Redis socket file
      ansible.builtin.copy:
        content: ""
        dest: /tmp/molecule_test/var/run/redis/redis-server.sock
        mode: "0644"
        backup: true