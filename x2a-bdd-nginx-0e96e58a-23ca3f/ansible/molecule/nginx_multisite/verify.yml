# Unsupported: log-tail output and certificate subject/date output have no stated expected value.
---
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: false
  tasks:
    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Assert required services are running
      ansible.builtin.assert:
        that:
          - ansible_facts['services'][item_service['name']]['state'] == 'running'
      loop:
        - name: nginx.service
        - name: fail2ban.service
        - name: ssh.service
      loop_control:
        loop_var: item_service

    - name: Check nginx and fail2ban are enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item_enabled['name'] }}"
      register: enabled_checks
      changed_when: false
      loop:
        - name: nginx
        - name: fail2ban
      loop_control:
        loop_var: item_enabled

    - name: Assert nginx and fail2ban are enabled
      ansible.builtin.assert:
        that:
          - item_enabled_result['rc'] == 0
          - item_enabled_result['stdout'] | trim == 'enabled'
      loop: "{{ enabled_checks['results'] }}"
      loop_control:
        loop_var: item_enabled_result

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      register: sshd_check
      changed_when: false

    - name: Assert SSH configuration is valid
      ansible.builtin.assert:
        that:
          - sshd_check['rc'] == 0

    - name: Check SSH hardening directives
      ansible.builtin.command:
        argv:
          - grep
          - "^{{ item_ssh['directive'] }}"
          - /etc/ssh/sshd_config
      register: ssh_directive_checks
      changed_when: false
      loop:
        - directive: PermitRootLogin no
        - directive: PasswordAuthentication no
      loop_control:
        loop_var: item_ssh

    - name: Assert SSH hardening directives are present
      ansible.builtin.assert:
        that:
          - item_ssh_result['rc'] == 0
      loop: "{{ ssh_directive_checks['results'] }}"
      loop_control:
        loop_var: item_ssh_result

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_config_check
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_config_check['rc'] == 0

    - name: Inspect active nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      register: nginx_dump
      changed_when: false

    - name: Assert configured site names are present
      ansible.builtin.assert:
        that:
          - item_site_name in nginx_dump['stdout']
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site_name

    - name: Check required site paths
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      register: site_paths
      loop:
        - path: /opt/server/test
          link: false
        - path: /opt/server/test/index.html
          link: false
        - path: /etc/nginx/sites-available/test.cluster.local
          link: false
        - path: /etc/nginx/sites-enabled/test.cluster.local
          link: true
        - path: /etc/ssl/certs/test.cluster.local.crt
          link: false
        - path: /etc/ssl/private/test.cluster.local.key
          link: false
        - path: /opt/server/ci
          link: false
        - path: /opt/server/ci/index.html
          link: false
        - path: /etc/nginx/sites-available/ci.cluster.local
          link: false
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          link: true
        - path: /etc/ssl/certs/ci.cluster.local.crt
          link: false
        - path: /etc/ssl/private/ci.cluster.local.key
          link: false
        - path: /opt/server/status
          link: false
        - path: /opt/server/status/index.html
          link: false
        - path: /etc/nginx/sites-available/status.cluster.local
          link: false
        - path: /etc/nginx/sites-enabled/status.cluster.local
          link: true
        - path: /etc/ssl/certs/status.cluster.local.crt
          link: false
        - path: /etc/ssl/private/status.cluster.local.key
          link: false
      loop_control:
        loop_var: item_path

    - name: Assert required site paths and link types
      ansible.builtin.assert:
        that:
          - item_path_result['stat']['exists']
          - item_path_result['stat']['islnk'] == item_path_result['item']['link']
      loop: "{{ site_paths['results'] }}"
      loop_control:
        loop_var: item_path_result

    - name: Check default site
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert default site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']

    - name: Check HTTP redirects
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_http['name'] }}"
        follow_redirects: none
        status_code: 301
      loop:
        - name: test.cluster.local
        - name: ci.cluster.local
        - name: status.cluster.local
      loop_control:
        loop_var: item_http

    - name: Check HTTPS responses
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_https['name'] }}"
        validate_certs: false
        status_code: 200
      loop:
        - name: test.cluster.local
        - name: ci.cluster.local
        - name: status.cluster.local
      loop_control:
        loop_var: item_https

    - name: Check nginx listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_port }}"
        state: started
        timeout: 5
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_port

    - name: Check UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: ufw_status
      changed_when: false

    - name: Assert UFW policy and allowed services
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status['stdout']"
          - "'Default: deny (incoming)' in ufw_status['stdout']"
          - ufw_status['stdout'] is search('(?im)^22/tcp.*ALLOW')
          - ufw_status['stdout'] is search('(?im)^80/tcp.*ALLOW')
          - ufw_status['stdout'] is search('(?im)^443/tcp.*ALLOW')

    - name: Check required sysctl values
      ansible.builtin.command:
        argv:
          - sysctl
          - "{{ item_sysctl['name'] }}"
      register: sysctl_checks
      changed_when: false
      loop:
        - name: net.ipv4.conf.all.rp_filter
          value: '1'
        - name: net.ipv4.conf.default.rp_filter
          value: '1'
        - name: net.ipv4.icmp_echo_ignore_all
          value: '1'
        - name: net.ipv4.tcp_syncookies
          value: '1'
        - name: net.ipv4.tcp_max_syn_backlog
          value: '2048'
        - name: net.ipv6.conf.all.disable_ipv6
          value: '1'
      loop_control:
        loop_var: item_sysctl

    - name: Assert required sysctl values
      ansible.builtin.assert:
        that:
          - item_sysctl_result['rc'] == 0
          - item_sysctl_result['stdout'] | trim == item_sysctl_result['item']['name'] ~ ' = ' ~ item_sysctl_result['item']['value']
      loop: "{{ sysctl_checks['results'] }}"
      loop_control:
        loop_var: item_sysctl_result

    - name: Check SSL ownership and permissions
      ansible.builtin.stat:
        path: "{{ item_ssl['path'] }}"
        follow: false
      register: ssl_paths
      loop:
        - path: /etc/ssl/certs
          owner: root
          group: root
          mode: '0755'
        - path: /etc/ssl/private
          owner: root
          group: ssl-cert
          mode: '0710'
        - path: /etc/ssl/private/test.cluster.local.key
          owner: root
          group: ssl-cert
          mode: '0640'
        - path: /etc/ssl/private/ci.cluster.local.key
          owner: root
          group: ssl-cert
          mode: '0640'
        - path: /etc/ssl/private/status.cluster.local.key
          owner: root
          group: ssl-cert
          mode: '0640'
      loop_control:
        loop_var: item_ssl

    - name: Assert SSL ownership and permissions
      ansible.builtin.assert:
        that:
          - item_ssl_result['stat']['pw_name'] == item_ssl_result['item']['owner']
          - item_ssl_result['stat']['gr_name'] == item_ssl_result['item']['group']
          - item_ssl_result['stat']['mode'] == item_ssl_result['item']['mode']
      loop: "{{ ssl_paths['results'] }}"
      loop_control:
        loop_var: item_ssl_result
