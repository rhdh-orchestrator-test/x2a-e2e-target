---
# User-configurable settings for the FastAPI Tutorial role.
fastapi_tutorial_app_directory: /opt/fastapi-tutorial
fastapi_tutorial_repository: https://github.com/dibanez/fastapi_tutorial.git
fastapi_tutorial_revision: main
fastapi_tutorial_venv_directory: /opt/fastapi-tutorial/venv
fastapi_tutorial_listen_host: 0.0.0.0
fastapi_tutorial_listen_port: 8000
fastapi_tutorial_service_name: fastapi-tutorial
fastapi_tutorial_service_unit: /etc/systemd/system/fastapi-tutorial.service
fastapi_tutorial_project_name: FastAPI Tutorial
fastapi_tutorial_api_version: 1.0.0
fastapi_tutorial_secure_logging: true
