---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI Tutorial system packages # noqa: R113 - package names are fixed by the role
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_directory }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository
  ansible.builtin.git: # noqa: R104, R106 - repository URL and source are trusted role defaults
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_directory }}" # noqa: R114 - destination is a role default controlled by the operator
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create virtual environment parent directory # noqa: R114 - path is derived from a role default
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_venv_directory | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Python virtual environment
  ansible.builtin.command: # noqa: R101 - command arguments are derived from role defaults
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_directory }}"
    creates: "{{ fastapi_tutorial_venv_directory }}/bin/python" # noqa: R114 - path is derived from a role default

- name: Install Python dependencies # noqa: R113 - requirements file is fixed within the trusted role repository
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_directory }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_venv_directory }}"
    state: present

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the application database role exists # noqa: L039 - credential variable is validated by the preceding task
  ansible.builtin.command: # noqa: R101 - SQL is constructed from validated role credentials
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ database_username }}';
  changed_when: false
  register: fastapi_tutorial_role_check
  become: true # noqa: R108 - querying PostgreSQL as postgres requires elevated privileges
  become_user: postgres

- name: Create the application database role # noqa: L039 - credential variables and registered check are validated or created by preceding tasks
  ansible.builtin.command: # noqa: R101 - SQL is constructed from validated role credentials
    argv:
      - psql
      - -c
      - CREATE ROLE {{ database_username }} LOGIN PASSWORD '{{ database_password }}';
  when: fastapi_tutorial_role_check.stdout | trim != '1'
  changed_when: true
  become: true # noqa: R108 - creating a PostgreSQL role as postgres requires elevated privileges
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the application database exists # noqa: L039 - credential variable is validated by the preceding task
  ansible.builtin.command: # noqa: R101 - SQL is constructed from validated role credentials
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}';
  changed_when: false
  register: fastapi_tutorial_database_check
  become: true # noqa: R108 - querying PostgreSQL as postgres requires elevated privileges
  become_user: postgres

- name: Create the application database # noqa: L039 - database variables and registered check are validated or created by preceding tasks
  ansible.builtin.command: # noqa: R101 - command arguments are constructed from validated role credentials
    argv:
      - createdb
      - -O
      - "{{ database_username }}"
      - "{{ database_name }}"
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  changed_when: true
  become: true # noqa: R108 - creating a PostgreSQL database as postgres requires elevated privileges
  become_user: postgres

- name: Grant application database privileges # noqa: L039 - database variables are validated by the preceding task
  ansible.builtin.command: # noqa: R101 - SQL is constructed from validated role credentials
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ database_username }};
  changed_when: false
  become: true # noqa: R108 - granting PostgreSQL privileges as postgres requires elevated privileges
  become_user: postgres

- name: Write application environment configuration # noqa: L039 - database variables are validated by the preceding task
  ansible.builtin.copy:
    content: |-
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL=postgresql://{{ database_username }}:{{ database_password }}@{{ database_host }}/{{ database_name }}
    dest: "{{ fastapi_tutorial_app_directory }}/.env" # noqa: R114 - path is derived from a role default
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write systemd service unit
  ansible.builtin.copy:
    content: |-
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_directory }}
      Environment="PATH={{ fastapi_tutorial_venv_directory }}/bin"
      ExecStart={{ fastapi_tutorial_venv_directory }}/bin/uvicorn app.main:app --host {{ fastapi_tutorial_listen_host }} --port {{ fastapi_tutorial_listen_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: "{{ fastapi_tutorial_service_unit }}" # noqa: R114 - unit path is a role default controlled by the operator
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before managing the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI Tutorial service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
