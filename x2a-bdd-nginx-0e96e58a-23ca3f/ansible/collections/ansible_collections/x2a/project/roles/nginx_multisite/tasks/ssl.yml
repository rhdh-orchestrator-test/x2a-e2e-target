---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create SSL certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_certificate_path }}"  # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create SSL private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}"  # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Generate self-signed SSL certificates
  ansible.builtin.shell:  # noqa: R101 - command uses role-defined certificate paths and site keys
    cmd: |
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        -keyout "{{ nginx_multisite_private_key_path }}/{{ item_nginx_ssl['key'] }}.key" \
        -out "{{ nginx_multisite_certificate_path }}/{{ item_nginx_ssl['key'] }}.crt" \
        -subj "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_ssl['key'] }}/emailAddress=admin@example.com"
    creates: "{{ nginx_multisite_certificate_path }}/{{ item_nginx_ssl['key'] }}.crt"
  when: item_nginx_ssl['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_ssl
  notify: Reload nginx

- name: Set SSL private key ownership and mode
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_ssl['key'] }}.key"  # noqa: R114 - path from role defaults and role-defined sites dict
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  when: item_nginx_ssl['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_ssl
