---
- name: Ensure nginx site directories exist  # noqa: R114 - loop values are fixed role-defined nginx directories
  ansible.builtin.file:
    path: "{{ item_nginx_site_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
  loop_control:
    loop_var: item_nginx_site_dir

- name: Deploy nginx virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item_nginx_site['key'] }}"  # noqa: R114 - loop over role-defined sites dict
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site
  notify: Reload nginx
  vars:
    server_name: "{{ item_nginx_site['key'] }}"
    document_root: "{{ item_nginx_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_nginx_site['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_certificate_path }}/{{ item_nginx_site['key'] }}.crt"
    key_file: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_site['key'] }}.key"

- name: Enable nginx virtual hosts
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item_nginx_site['key'] }}"  # noqa: R114 - loop over role-defined sites dict
    dest: "/etc/nginx/sites-enabled/{{ item_nginx_site['key'] }}"  # noqa: R114 - loop over role-defined sites dict
    state: link
    mode: "0644"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
