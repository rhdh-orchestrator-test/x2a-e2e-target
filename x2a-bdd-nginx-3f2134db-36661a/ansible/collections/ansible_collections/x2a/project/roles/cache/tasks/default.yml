---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Redis with approved collection role  # noqa: L038 - external role is explicitly pinned in this role's requirements.yml
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_version: "{{ cache_redis_version }}"
    redis_install_method: "{{ cache_redis_install_method }}"
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: "{{ cache_redis_cluster_enabled }}"
    redis_sentinel_enabled: "{{ cache_redis_sentinel_enabled }}"
    redis_replication_enabled: "{{ cache_redis_replication_enabled }}"
    redis_aof_enabled: "{{ cache_redis_aof_enabled }}"
    redis_rdb_enabled: "{{ cache_redis_rdb_enabled }}"

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Install Memcached
  ansible.builtin.package:
    name: "{{ cache_memcached_package }}"
    state: present

- name: Configure Memcached
  ansible.builtin.copy:
    dest: /etc/sysconfig/memcached
    content: |
      PORT="{{ cache_memcached_port }}"
      USER="memcached"
      MAXCONN="1024"
      CACHESIZE="{{ cache_memcached_memory }}"
      OPTIONS="-l {{ cache_memcached_listen }} {{ cache_memcached_options }}"
    mode: "0644"
    backup: true
  when: ansible_facts['os_family'] == 'RedHat'
  notify: Restart Memcached

- name: Configure Memcached on Debian-family systems
  ansible.builtin.copy:
    dest: /etc/memcached.conf
    content: |
      -p {{ cache_memcached_port }}
      -U 0
      -m {{ cache_memcached_memory }}
      -l {{ cache_memcached_listen }}
      {{ cache_memcached_options }}
    mode: "0644"
    backup: true
  when: ansible_facts['os_family'] == 'Debian'
  notify: Restart Memcached

- name: Enable and start Memcached
  ansible.builtin.service:
    name: "{{ cache_memcached_service }}"
    enabled: true
    state: started
