---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Ensure FastAPI service group exists
  ansible.builtin.group:
    name: "{{ fastapi_tutorial_service_group }}"
    state: present

- name: Ensure FastAPI service user exists
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    state: present
    create_home: false

- name: Install FastAPI and PostgreSQL packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create FastAPI application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    mode: "0755"
    recurse: true

- name: Create FastAPI environment file directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_env_file | dirname }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create FastAPI systemd unit directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_unit_file | dirname }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize FastAPI tutorial repository # noqa: R106 - repository source is a trusted role default
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R104 - repository URL is a trusted HTTPS role default
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default controlled by the operator
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment parent directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_venv_dir | dirname }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    mode: "0755"

- name: Create Python virtual environment
  ansible.builtin.command: # noqa: R101 - command arguments are fixed except for the role-default venv path
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}/bin/python" # noqa: R114 - path is derived from a role default

- name: Install Python dependencies
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R113 - virtualenv target is a role default
    virtualenv_command: "python3 -m venv"

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL role, database, and privileges
  ansible.builtin.shell: # noqa: R101 - SQL must use credential variables supplied by the trusted AAP credential type
    cmd: |
      psql -c "DO \$\$ BEGIN
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '{{ fastapi_tutorial_db_username }}') THEN
          CREATE ROLE {{ fastapi_tutorial_db_username }} LOGIN PASSWORD '{{ fastapi_tutorial_db_password }}';
        ELSE
          ALTER ROLE {{ fastapi_tutorial_db_username }} WITH PASSWORD '{{ fastapi_tutorial_db_password }}';
        END IF;
      END \$\$;"
      psql -c "SELECT 'CREATE DATABASE {{ fastapi_tutorial_db_name }} OWNER {{ fastapi_tutorial_db_username }}' WHERE NOT EXISTS
        (SELECT FROM pg_database WHERE datname = '{{ fastapi_tutorial_db_name }}')\gexec"
      psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ fastapi_tutorial_db_name }} TO {{ fastapi_tutorial_db_username }};"
    executable: /bin/bash
  become: true # noqa: R108 - PostgreSQL administration must run as the postgres user
  become_user: postgres
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI environment configuration
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_env_file }}" # noqa: R114 - path is a role default controlled by the operator
    content: |
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL=postgresql://{{ fastapi_tutorial_db_username }}:{{ fastapi_tutorial_db_password }}@{{ fastapi_tutorial_db_host }}:{{ fastapi_tutorial_db_port }}/{{ fastapi_tutorial_db_name }}
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI systemd unit
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_unit_file }}" # noqa: R114 - path is a role default controlled by the operator
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User={{ fastapi_tutorial_service_user }}
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      EnvironmentFile={{ fastapi_tutorial_env_file }}
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host {{ fastapi_tutorial_bind_address }} --port {{ fastapi_tutorial_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before starting FastAPI
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
