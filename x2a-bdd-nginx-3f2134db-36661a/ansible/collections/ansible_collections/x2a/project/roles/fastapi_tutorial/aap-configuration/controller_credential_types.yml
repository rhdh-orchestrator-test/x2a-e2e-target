---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection details for the FastAPI application's local PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL role; used to authenticate the application and must be stored securely.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname of the PostgreSQL server; the current configuration uses localhost.
        - id: db_port
          type: string
          label: Database Port
          help_text: TCP port for PostgreSQL when TCP listening is enabled; the documented default is 5432.
      required:
        - db_username
        - db_password
        - db_name
        - db_host
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_name: !unsafe "{{ db_name }}"
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
