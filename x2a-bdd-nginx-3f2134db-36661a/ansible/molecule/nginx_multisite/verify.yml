---
# Unsupported pre-flight checks: exact HTTP response status and response headers; exact
# sysctl settings (the plan does not enumerate them); and the requested openssl date output.
- name: Verify nginx-multisite pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service status facts
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['nginx.service']['state'] == 'running'
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'
        fail_msg: Nginx and Fail2ban must both be active.

    - name: Check nginx is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - nginx
      register: verify_nginx_enabled
      changed_when: false

    - name: Check fail2ban is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - fail2ban
      register: verify_fail2ban_enabled
      changed_when: false

    - name: Assert nginx and fail2ban are enabled
      ansible.builtin.assert:
        that:
          - verify_nginx_enabled.stdout | trim == 'enabled'
          - verify_fail2ban_enabled.stdout | trim == 'enabled'
        fail_msg: Nginx and Fail2ban must both be enabled.

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: verify_nginx_config
      changed_when: false

    - name: Inspect nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      register: verify_nginx_dump
      changed_when: false

    - name: Assert nginx configuration and virtual host names
      ansible.builtin.assert:
        that:
          - verify_nginx_config.rc == 0
          - "'test.cluster.local' in verify_nginx_dump.stdout"
          - "'ci.cluster.local' in verify_nginx_dump.stdout"
          - "'status.cluster.local' in verify_nginx_dump.stdout"
        fail_msg: Nginx configuration or the three expected virtual hosts are missing.

    - name: Wait for HTTP and HTTPS listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listener['port'] }}"
        state: started
        timeout: 10
      loop:
        - port: 80
        - port: 443
      loop_control:
        loop_var: item_listener

    - name: Check expected files and directories
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      register: verify_paths
      loop:
        - path: /etc/nginx/nginx.conf
        - path: /etc/nginx/conf.d/security.conf
        - path: /etc/fail2ban/jail.local
        - path: /etc/sysctl.d/99-security.conf
        - path: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-available/status.cluster.local
        - path: /opt/server/test
        - path: /opt/server/test/index.html
        - path: /opt/server/ci
        - path: /opt/server/ci/index.html
        - path: /opt/server/status
        - path: /opt/server/status/index.html
        - path: /etc/ssl/certs/test.cluster.local.crt
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/certs/ci.cluster.local.crt
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/certs/status.cluster.local.crt
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_path

    - name: Assert expected files and directories exist
      ansible.builtin.assert:
        that:
          - item_path_result['stat']['exists']
        fail_msg: An expected nginx-multisite path is missing.
      loop: "{{ verify_paths['results'] }}"
      loop_control:
        loop_var: item_path_result

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_link['path'] }}"
        follow: false
      register: verify_links
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_link

    - name: Assert enabled site links resolve correctly
      ansible.builtin.assert:
        that:
          - item_link_result['stat']['islnk']
          - item_link_result['stat']['ln_target'] == item_link_result['item']['target']
        fail_msg: An expected enabled nginx site link is missing or has the wrong target.
      loop: "{{ verify_links['results'] }}"
      loop_control:
        loop_var: item_link_result

    - name: Check the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: verify_default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not verify_default_site['stat']['exists']
        fail_msg: The default nginx site must not exist.

    - name: Inspect certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
          - -dates
      register: verify_certificates
      changed_when: false
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          common_name: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          common_name: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          common_name: status.cluster.local
      loop_control:
        loop_var: item_certificate

    - name: Assert certificate subjects contain expected names
      ansible.builtin.assert:
        that:
          - item_certificate_result['rc'] == 0
          - "item_certificate_result['item']['common_name'] in item_certificate_result['stdout']"
        fail_msg: A configured certificate does not contain its expected common name.
      loop: "{{ verify_certificates['results'] }}"
      loop_control:
        loop_var: item_certificate_result

    - name: Check TLS private key ownership and permissions
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
      register: verify_key_stats
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key

    - name: Assert TLS private key ownership and permissions
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['pw_name'] == 'root'
          - item_key_result['stat']['gr_name'] == 'ssl-cert'
          - item_key_result['stat']['mode'] == '0640'
        fail_msg: A TLS private key does not have the expected ownership or mode.
      loop: "{{ verify_key_stats['results'] }}"
      loop_control:
        loop_var: item_key_result

    - name: Check UFW verbose status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: verify_ufw_verbose
      changed_when: false

    - name: Check UFW numbered status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - numbered
      register: verify_ufw_numbered
      changed_when: false

    - name: Assert UFW policy and allowed ports
      ansible.builtin.assert:
        that:
          - verify_ufw_verbose.rc == 0
          - "'status: active' in (verify_ufw_verbose.stdout | lower)"
          - "'default: deny (incoming)' in (verify_ufw_verbose.stdout | lower)"
          - "'22/tcp' in (verify_ufw_verbose.stdout | lower)"
          - "'80/tcp' in (verify_ufw_verbose.stdout | lower)"
          - "'443/tcp' in (verify_ufw_verbose.stdout | lower)"
          - verify_ufw_numbered.rc == 0
        fail_msg: UFW must be active with deny incoming and SSH, HTTP, and HTTPS allowed.

    - name: Check fail2ban status
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
      register: verify_fail2ban_status
      changed_when: false

    - name: Check recent fail2ban logs
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - fail2ban
          - --no-pager
          - -n
          - '50'
      register: verify_fail2ban_logs
      changed_when: false

    - name: Assert fail2ban status and logs
      ansible.builtin.assert:
        that:
          - verify_fail2ban_status.rc == 0
          - "not (verify_fail2ban_logs.stdout | lower is search('startup error|configuration error|failed to'))"
        fail_msg: Fail2ban must be running without recent startup or configuration errors.

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      register: verify_sshd_config
      changed_when: false

    - name: Read SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: verify_sshd_file

    - name: Assert SSH configuration and hardening
      ansible.builtin.assert:
        that:
          - verify_sshd_config.rc == 0
          - "(verify_sshd_file['content'] | b64decode) is search('(?m)^\\s*PermitRootLogin\\s+no\\s*$')"
          - "(verify_sshd_file['content'] | b64decode) is search('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')"
        fail_msg: SSH configuration must validate and disable root login and password authentication.

    - name: Assert the sysctl configuration file exists
      ansible.builtin.assert:
        that:
          - verify_paths['results'] | selectattr('item.path', 'equalto', '/etc/sysctl.d/99-security.conf') | map(attribute='stat.exists') | first
        fail_msg: The sysctl security configuration file must exist.
