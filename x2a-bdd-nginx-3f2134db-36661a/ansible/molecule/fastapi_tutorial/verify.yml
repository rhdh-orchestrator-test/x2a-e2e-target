---
# Unsupported pre-flight checks: git remote/branch, diagnostic status/log output, systemd
# unit display details, PostgreSQL credential-based connectivity, and exact DATABASE_URL
# contents are omitted because the checks do not state a safe expected result or would
# require embedding a secret.
- name: Verify fastapi-tutorial deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify all required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert all required packages are present
      ansible.builtin.assert:
        that:
          - "item_package in ansible_facts['packages']"
        loop:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
        loop_control:
          loop_var: item_package
        fail_msg: "A required package is not installed."

    - name: Inspect the application directory
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: fastapi_directory

    - name: Assert application directory ownership and mode
      ansible.builtin.assert:
        that:
          - fastapi_directory.stat.exists
          - fastapi_directory.stat.isdir
          - fastapi_directory.stat.pw_name == 'root'
          - fastapi_directory.stat.gr_name == 'root'
          - fastapi_directory.stat.mode == '0755'

    - name: Inspect the application requirements file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/requirements.txt
      register: fastapi_requirements

    - name: Assert the application requirements file exists
      ansible.builtin.assert:
        that:
          - fastapi_requirements.stat.exists
          - fastapi_requirements.stat.isreg

    - name: Inspect the virtual environment Python executable
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/venv/bin/python
      register: fastapi_python

    - name: Inspect the virtual environment pip executable
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/venv/bin/pip
      register: fastapi_pip

    - name: Assert virtual environment executables are present and executable
      ansible.builtin.assert:
        that:
          - fastapi_python.stat.exists
          - fastapi_python.stat.executable
          - fastapi_pip.stat.exists
          - fastapi_pip.stat.executable

    - name: Check installed Python dependencies
      ansible.builtin.command:
        argv:
          - /opt/fastapi-tutorial/venv/bin/pip
          - check
      register: fastapi_pip_check
      changed_when: false

    - name: Assert Python dependencies pass pip check
      ansible.builtin.assert:
        that:
          - fastapi_pip_check.rc == 0

    - name: Check PostgreSQL is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - postgresql
      register: postgresql_enabled
      changed_when: false

    - name: Assert PostgreSQL is enabled
      ansible.builtin.assert:
        that:
          - postgresql_enabled.rc == 0

    - name: Check PostgreSQL is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - postgresql
      register: postgresql_active
      changed_when: false

    - name: Assert PostgreSQL is active
      ansible.builtin.assert:
        that:
          - postgresql_active.rc == 0

    - name: Check the fastapi PostgreSQL role
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - "SELECT usename FROM pg_user WHERE usename = 'fastapi';"
      register: fastapi_role
      changed_when: false

    - name: Assert the fastapi PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - fastapi_role.rc == 0
          - fastapi_role.stdout | trim == 'fastapi'

    - name: Check the fastapi_db PostgreSQL database
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - "SELECT datname FROM pg_database WHERE datname = 'fastapi_db';"
      register: fastapi_database
      changed_when: false

    - name: Assert the fastapi_db PostgreSQL database exists
      ansible.builtin.assert:
        that:
          - fastapi_database.rc == 0
          - fastapi_database.stdout | trim == 'fastapi_db'

    - name: Check the fastapi_db database owner
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'fastapi_db';"
      register: fastapi_database_owner
      changed_when: false

    - name: Assert the fastapi_db database owner is fastapi
      ansible.builtin.assert:
        that:
          - fastapi_database_owner.rc == 0
          - fastapi_database_owner.stdout | trim == 'fastapi'

    - name: Inspect the application environment file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/.env
      register: fastapi_env

    - name: Assert application environment file ownership and mode
      ansible.builtin.assert:
        that:
          - fastapi_env.stat.exists
          - fastapi_env.stat.isreg
          - fastapi_env.stat.pw_name == 'root'
          - fastapi_env.stat.gr_name == 'root'
          - fastapi_env.stat.mode == '0644'

    - name: Read the application environment file
      ansible.builtin.slurp:
        src: /opt/fastapi-tutorial/.env
      register: fastapi_env_content

    - name: Assert non-secret environment values
      ansible.builtin.assert:
        that:
          - "(fastapi_env_content.content | b64decode) is search('(?m)^PROJECT_NAME=\\\"FastAPI Tutorial\\\"$')"
          - "(fastapi_env_content.content | b64decode) is search('(?m)^API_VERSION=1\\.0\\.0$')"

    - name: Inspect the fastapi-tutorial systemd unit
      ansible.builtin.stat:
        path: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit

    - name: Assert systemd unit ownership and mode
      ansible.builtin.assert:
        that:
          - fastapi_unit.stat.exists
          - fastapi_unit.stat.isreg
          - fastapi_unit.stat.pw_name == 'root'
          - fastapi_unit.stat.gr_name == 'root'
          - fastapi_unit.stat.mode == '0644'

    - name: Check fastapi-tutorial is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - fastapi-tutorial
      register: fastapi_enabled
      changed_when: false

    - name: Assert fastapi-tutorial is enabled
      ansible.builtin.assert:
        that:
          - fastapi_enabled.rc == 0

    - name: Check fastapi-tutorial is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - fastapi-tutorial
      register: fastapi_active
      changed_when: false

    - name: Assert fastapi-tutorial is active
      ansible.builtin.assert:
        that:
          - fastapi_active.rc == 0

    - name: Check the FastAPI process
      ansible.builtin.command:
        argv:
          - ps
          - aux
      register: fastapi_process
      changed_when: false

    - name: Assert the Uvicorn FastAPI process is running
      ansible.builtin.assert:
        that:
          - fastapi_process.rc == 0
          - fastapi_process.stdout is search('uvicorn app.main:app')

    - name: Check port 8000 is bound on all IPv4 interfaces
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: fastapi_listener
      changed_when: false

    - name: Assert port 8000 is listening on 0.0.0.0
      ansible.builtin.assert:
        that:
          - fastapi_listener.rc == 0
          - fastapi_listener.stdout is search('0\\.0\\.0\\.0:8000')

    - name: Check the FastAPI root endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/
        method: GET
        return_content: false
        status_code: "{{ range(100, 600) | list }}"
      register: fastapi_endpoint

    - name: Assert the FastAPI root endpoint returned an HTTP response
      ansible.builtin.assert:
        that:
          - fastapi_endpoint.status >= 100
          - fastapi_endpoint.status < 600

    - name: Restart fastapi-tutorial for the restart check
      ansible.builtin.service:
        name: fastapi-tutorial
        state: restarted

    - name: Check fastapi-tutorial after restart
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - fastapi-tutorial
      register: fastapi_active_after_restart
      changed_when: false

    - name: Assert fastapi-tutorial remains active after restart
      ansible.builtin.assert:
        that:
          - fastapi_active_after_restart.rc == 0

    - name: Check the FastAPI endpoint after restart
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/
        method: GET
        return_content: false
        status_code: "{{ range(100, 600) | list }}"
      register: fastapi_endpoint_after_restart

    - name: Assert FastAPI remains available after restart
      ansible.builtin.assert:
        that:
          - fastapi_endpoint_after_restart.status >= 100
          - fastapi_endpoint_after_restart.status < 600
