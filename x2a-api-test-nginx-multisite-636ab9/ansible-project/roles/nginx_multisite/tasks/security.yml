---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present
- name: Deploy fail2ban jail configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  notify: Restart fail2ban
- name: Deploy kernel security parameters
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload sysctl
- name: Check UFW status
  ansible.builtin.shell:
    cmd: ufw status
  register: ufw_status
  changed_when: false
  failed_when: false
- name: Set UFW default deny policy
  ansible.builtin.shell:
    cmd: ufw --force default deny incoming
  when: "'Status: inactive' in ufw_status.stdout or 'default deny (incoming)' not in ufw_status.stdout"
  changed_when: true
- name: Allow SSH through UFW
  ansible.builtin.shell:
    cmd: ufw allow 22/tcp
  when: "'22/tcp' not in ufw_status.stdout"
  changed_when: true
- name: Allow HTTP through UFW
  ansible.builtin.shell:
    cmd: ufw allow 80/tcp
  when: "'80/tcp' not in ufw_status.stdout"
  changed_when: true
- name: Allow HTTPS through UFW
  ansible.builtin.shell:
    cmd: ufw allow 443/tcp
  when: "'443/tcp' not in ufw_status.stdout"
  changed_when: true
- name: Enable UFW firewall
  ansible.builtin.shell:
    cmd: ufw --force enable
  when: "'Status: inactive' in ufw_status.stdout"
  changed_when: true
- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^PermitRootLogin
    line: PermitRootLogin no
    backup: true
  when: nginx_multisite_security_ssh_disable_root
  notify: Restart ssh
- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^PasswordAuthentication
    line: PasswordAuthentication no
    backup: true
  when: not nginx_multisite_security_ssh_password_auth
  notify: Restart ssh
