---
- name: Verify nginx_multisite role
  hosts: all
  gather_facts: false
  tasks:
    # Configuration file existence checks
    - name: Check nginx configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/nginx/nginx.conf
        - /tmp/molecule_test/etc/nginx/conf.d/security.conf
        - /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_config
      register: config_stat_results

    - name: Assert nginx configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected nginx config file not found"
      loop: "{{ config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # SSL certificate checks
    - name: Check SSL certificates exist
      ansible.builtin.stat:
        path: "{{ item_ssl }}"
      loop:
        - /tmp/molecule_test/etc/ssl/certs/test.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/ci.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/status.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/private/test.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/ci.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_ssl
      register: ssl_stat_results

    - name: Assert SSL certificates were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate not found"
      loop: "{{ ssl_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Document root and content checks
    - name: Check document root directories exist
      ansible.builtin.stat:
        path: "{{ item_docroot }}"
      loop:
        - /tmp/molecule_test/opt/server/test
        - /tmp/molecule_test/opt/server/ci
        - /tmp/molecule_test/opt/server/status
      loop_control:
        loop_var: item_docroot
      register: docroot_stat_results

    - name: Assert document root directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected document root directory not found"
      loop: "{{ docroot_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check static HTML files exist
      ansible.builtin.stat:
        path: "{{ item_html }}"
      loop:
        - /tmp/molecule_test/opt/server/test/index.html
        - /tmp/molecule_test/opt/server/ci/index.html
        - /tmp/molecule_test/opt/server/status/index.html
      loop_control:
        loop_var: item_html
      register: html_stat_results

    - name: Assert static HTML files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected HTML file not found"
      loop: "{{ html_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Security configuration checks
    - name: Check security configuration files exist
      ansible.builtin.stat:
        path: "{{ item_security }}"
      loop:
        - /tmp/molecule_test/etc/fail2ban/jail.local
        - /tmp/molecule_test/etc/sysctl.d/99-security.conf
        - /tmp/molecule_test/etc/ssh/sshd_config
      loop_control:
        loop_var: item_security
      register: security_stat_results

    - name: Assert security configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected security config file not found"
      loop: "{{ security_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Content validation checks
    - name: Read nginx main configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/nginx.conf
      register: nginx_conf_content

    - name: Assert nginx configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'user www-data' in nginx_conf_decoded"
          - "'worker_processes auto' in nginx_conf_decoded"
          - "'ssl_protocols TLSv1.2 TLSv1.3' in nginx_conf_decoded"
          - "'server_tokens off' in nginx_conf_decoded"
          - "'gzip on' in nginx_conf_decoded"
        fail_msg: "Nginx configuration missing expected settings"
      vars:
        nginx_conf_decoded: "{{ nginx_conf_content['content'] | b64decode }}"

    - name: Read nginx security configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/conf.d/security.conf
      register: security_conf_content

    - name: Assert security configuration contains expected headers
      ansible.builtin.assert:
        that:
          - "'X-Frame-Options' in security_conf_decoded"
          - "'X-Content-Type-Options' in security_conf_decoded"
          - "'X-XSS-Protection' in security_conf_decoded"
          - "'Strict-Transport-Security' in security_conf_decoded"
          - "'Content-Security-Policy' in security_conf_decoded"
        fail_msg: "Security configuration missing expected headers"
      vars:
        security_conf_decoded: "{{ security_conf_content['content'] | b64decode }}"

    - name: Read virtual host configurations
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/sites-available/{{ item_vhost }}
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_vhost
      register: vhost_conf_results

    - name: Assert virtual host configurations contain expected settings
      ansible.builtin.assert:
        that:
          - "'listen 80' in vhost_decoded"
          - "'listen 443 ssl http2' in vhost_decoded"
          - "'return 301 https://' in vhost_decoded"
          - "'ssl_certificate /etc/ssl/certs/' in vhost_decoded"
          - "'ssl_certificate_key /etc/ssl/private/' in vhost_decoded"
        fail_msg: "Virtual host configuration missing expected SSL settings"
      vars:
        vhost_decoded: "{{ item_result['content'] | b64decode }}"
      loop: "{{ vhost_conf_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read HTML content for sites
      ansible.builtin.slurp:
        src: /tmp/molecule_test/opt/server/{{ item_site }}/index.html
      loop:
        - test
        - ci
        - status
      loop_control:
        loop_var: item_site
      register: html_content_results

    - name: Assert HTML content contains expected site information
      ansible.builtin.assert:
        that:
          - "item_site_check['expected_text'] in html_decoded"
          - "'<!DOCTYPE html>' in html_decoded"
          - "'SSL:</strong> Enabled' in html_decoded"
        fail_msg: "HTML content missing expected site information"
      vars:
        html_decoded: "{{ item_result['content'] | b64decode }}"
      loop:
        - result: "{{ html_content_results['results'][0] }}"
          expected_text: "test.cluster.local"
        - result: "{{ html_content_results['results'][1] }}"
          expected_text: "ci.cluster.local"
        - result: "{{ html_content_results['results'][2] }}"
          expected_text: "status.cluster.local"
      loop_control:
        loop_var: item_site_check
      vars:
        item_result: "{{ item_site_check['result'] }}"

    - name: Read fail2ban configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/fail2ban/jail.local
      register: fail2ban_conf_content

    - name: Assert fail2ban configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'[sshd]' in fail2ban_conf_decoded"
          - "'enabled = true' in fail2ban_conf_decoded"
          - "'bantime = 3600' in fail2ban_conf_decoded"
          - "'maxretry = 5' in fail2ban_conf_decoded"
          - "'[nginx-http-auth]' in fail2ban_conf_decoded"
        fail_msg: "Fail2ban configuration missing expected settings"
      vars:
        fail2ban_conf_decoded: "{{ fail2ban_conf_content['content'] | b64decode }}"

    - name: Read sysctl security configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-security.conf
      register: sysctl_conf_content

    - name: Assert sysctl configuration contains expected security parameters
      ansible.builtin.assert:
        that:
          - "'net.ipv4.conf.default.rp_filter = 1' in sysctl_conf_decoded"
          - "'net.ipv4.conf.all.accept_redirects = 0' in sysctl_conf_decoded"
          - "'net.ipv4.conf.all.send_redirects = 0' in sysctl_conf_decoded"
          - "'net.ipv4.conf.all.log_martians = 1' in sysctl_conf_decoded"
          - "'net.ipv4.icmp_echo_ignore_all = 1' in sysctl_conf_decoded"
        fail_msg: "Sysctl configuration missing expected security parameters"
      vars:
        sysctl_conf_decoded: "{{ sysctl_conf_content['content'] | b64decode }}"

    - name: Read SSH configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_conf_content

    - name: Assert SSH configuration contains expected security settings
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in ssh_conf_decoded"
          - "'PasswordAuthentication no' in ssh_conf_decoded"
          - "'Protocol 2' in ssh_conf_decoded"
          - "'StrictModes yes' in ssh_conf_decoded"
        fail_msg: "SSH configuration missing expected security settings"
      vars:
        ssh_conf_decoded: "{{ ssh_conf_content['content'] | b64decode }}"

    # Symlink validation
    - name: Check sites-enabled symlinks
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/nginx/sites-enabled/{{ item_symlink }}
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_symlink
      register: symlink_stat_results

    - name: Assert sites-enabled symlinks are valid
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['islnk']
        fail_msg: "Expected symlink not found or not a symlink"
      loop: "{{ symlink_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

- name: Verify services and network (container-incompatible checks)
  hosts: all
  gather_facts: false
  tasks:
    # Service status checks (tagged for skipping in container)
    - name: Check nginx service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
        fail_msg: "Nginx service not running"
      tags: molecule-notest

    - name: Check fail2ban service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert fail2ban service is running
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
        fail_msg: "Fail2ban service not running"
      tags: molecule-notest

    # Network port checks (tagged for skipping in container)
    - name: Check HTTP port is listening
      ansible.builtin.wait_for:
        port: 80
        host: 0.0.0.0
        timeout: 5
      tags: molecule-notest

    - name: Check HTTPS port is listening
      ansible.builtin.wait_for:
        port: 443
        host: 0.0.0.0
        timeout: 5
      tags: molecule-notest

    - name: Check SSH port is listening
      ansible.builtin.wait_for:
        port: 22
        host: 0.0.0.0
        timeout: 5
      tags: molecule-notest

    # HTTP/HTTPS endpoint checks (tagged for skipping in container)
    - name: Test HTTP redirect to HTTPS for test.cluster.local
      ansible.builtin.uri:
        url: http://test.cluster.local
        method: GET
        follow_redirects: none
        status_code: 301
      tags: molecule-notest

    - name: Test HTTPS response for test.cluster.local
      ansible.builtin.uri:
        url: https://test.cluster.local
        method: GET
        validate_certs: false
        status_code: 200
      tags: molecule-notest

    - name: Test HTTP redirect to HTTPS for ci.cluster.local
      ansible.builtin.uri:
        url: http://ci.cluster.local
        method: GET
        follow_redirects: none
        status_code: 301
      tags: molecule-notest

    - name: Test HTTPS response for ci.cluster.local
      ansible.builtin.uri:
        url: https://ci.cluster.local
        method: GET
        validate_certs: false
        status_code: 200
      tags: molecule-notest

    - name: Test HTTP redirect to HTTPS for status.cluster.local
      ansible.builtin.uri:
        url: http://status.cluster.local
        method: GET
        follow_redirects: none
        status_code: 301
      tags: molecule-notest

    - name: Test HTTPS response for status.cluster.local
      ansible.builtin.uri:
        url: https://status.cluster.local
        method: GET
        validate_certs: false
        status_code: 200
      tags: molecule-notest