---
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ user_full_name }} {{ user_email }} "{{ user_password }}" --filename {{ chef_automate_user_pem_filename }}
  become: true
  no_log: true
  args:
    creates: /root/{{ chef_automate_user_pem_filename }}
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ organization_name }} "{{ organization_name }}" --association_user {{ username }} --filename {{
      chef_automate_org_pem_filename }}
  become: true
  args:
    creates: /root/{{ chef_automate_org_pem_filename }}
