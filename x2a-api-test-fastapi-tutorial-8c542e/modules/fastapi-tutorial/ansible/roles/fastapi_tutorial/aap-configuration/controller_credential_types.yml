---
controller_credential_types:
- name: PostgreSQL Database Credentials
  description: Database credentials for PostgreSQL connection used by FastAPI tutorial
    application
  kind: cloud
  inputs:
    fields:
    - id: db_username
      type: string
      label: Database Username
      help_text: PostgreSQL username for FastAPI application database access
    - id: db_password
      type: string
      label: Database Password
      secret: true
      help_text: PostgreSQL password for FastAPI application database authentication
    - id: db_name
      type: string
      label: Database Name
      help_text: PostgreSQL database name for FastAPI application
    required:
    - db_username
    - db_password
    - db_name
  injectors:
    extra_vars:
      db_username: !unsafe '{{ db_username }}'
      db_password: !unsafe '{{ db_password }}'
      db_name: !unsafe '{{ db_name }}'
