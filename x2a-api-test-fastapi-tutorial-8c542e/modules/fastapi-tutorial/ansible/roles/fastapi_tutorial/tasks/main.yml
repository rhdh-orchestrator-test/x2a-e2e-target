---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install system packages
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_system_packages }}"
    state: present
- name: Install PostgreSQL development packages (Debian/Ubuntu)
  ansible.builtin.package:
    name: libpq-dev
    state: present
  when: ansible_os_family == "Debian"
- name: Install PostgreSQL development packages (RedHat/CentOS)
  ansible.builtin.package:
    name: postgresql-devel
    state: present
  when: ansible_os_family == "RedHat"
- name: Create service user
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_service_user }}"
    system: true
    shell: /bin/false
    home: "{{ fastapi_tutorial_app_dir }}"
    create_home: false
  when: fastapi_tutorial_service_user != "root"
- name: Create service group
  ansible.builtin.group:
    name: "{{ fastapi_tutorial_service_group }}"
    system: true
  when: fastapi_tutorial_service_group != "root"
- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}"
    state: directory
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    mode: "{{ fastapi_tutorial_dir_mode }}"
- name: Clone FastAPI tutorial repository
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_git_repo }}"
    dest: "{{ fastapi_tutorial_app_dir }}"
    version: "{{ fastapi_tutorial_git_branch }}"
    force: true
  become_user: "{{ fastapi_tutorial_service_user }}"
  when: fastapi_tutorial_service_user != "root"
- name: Clone FastAPI tutorial repository (as root)
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_git_repo }}"
    dest: "{{ fastapi_tutorial_app_dir }}"
    version: "{{ fastapi_tutorial_git_branch }}"
    force: true
  when: fastapi_tutorial_service_user == "root"
- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv {{ fastapi_tutorial_venv_path }}
    creates: "{{ fastapi_tutorial_venv_path }}/bin/python"
- name: Install Python dependencies
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_venv_path }}"
- name: Start and enable PostgreSQL service
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
- name: Check if PostgreSQL user exists
  ansible.builtin.command:
    cmd: sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ db_username }}'"
  register: postgres_user_check
  changed_when: false
  failed_when: false
- name: Create PostgreSQL database user
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "CREATE USER {{ db_username }} WITH PASSWORD '{{ db_password }}';"
  when: postgres_user_check.stdout != "1"
- name: Check if PostgreSQL database exists
  ansible.builtin.command:
    cmd: sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ db_name }}'"
  register: postgres_db_check
  changed_when: false
  failed_when: false
- name: Create PostgreSQL database
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "CREATE DATABASE {{ db_name }} OWNER {{ db_username }};"
  when: postgres_db_check.stdout != "1"
- name: Grant privileges on database
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_username }};"
  when: postgres_db_check.stdout != "1"
- name: Create environment configuration file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ fastapi_tutorial_app_dir }}/.env"
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    mode: "{{ fastapi_tutorial_file_mode }}"
    backup: true
  notify: Restart fastapi-tutorial
- name: Create systemd service file
  ansible.builtin.template:
    src: fastapi-tutorial.service.j2
    dest: /etc/systemd/system/{{ fastapi_tutorial_service_name }}.service
    owner: root
    group: root
    mode: "{{ fastapi_tutorial_file_mode }}"
    backup: true
  notify:
    - Reload systemd
    - Restart fastapi-tutorial
- name: Start and enable FastAPI tutorial service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    state: started
    enabled: true
