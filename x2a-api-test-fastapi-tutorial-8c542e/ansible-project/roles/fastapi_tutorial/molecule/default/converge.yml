- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item_dir }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/opt/fastapi-tutorial
    - /tmp/molecule_test/opt/fastapi-tutorial/venv
    - /tmp/molecule_test/opt/fastapi-tutorial/venv/bin
    - /tmp/molecule_test/opt/fastapi-tutorial/app
    - /tmp/molecule_test/etc/systemd/system
    - /tmp/molecule_test/opt/fastapi-tutorial/.git
    loop_control:
      loop_var: item_dir
  - name: Create FastAPI application files
    ansible.builtin.copy:
      content: '{{ item_file[''content''] }}'
      dest: '{{ item_file[''path''] }}'
      mode: '{{ item_file[''mode''] }}'
      backup: true
    loop:
    - path: /tmp/molecule_test/opt/fastapi-tutorial/requirements.txt
      content: 'fastapi==0.104.1

        uvicorn[standard]==0.24.0

        psycopg2-binary==2.9.9

        sqlalchemy==2.0.23

        alembic==1.12.1

        '
      mode: '0644'
    - path: /tmp/molecule_test/opt/fastapi-tutorial/app/main.py
      content: "from fastapi import FastAPI\n\napp = FastAPI(title=\"FastAPI Tutorial\", version=\"1.0.0\")\n\n@app.get(\"/\")\ndef read_root():\n    return {\"Hello\":
        \"World\"}\n\n@app.get(\"/health\")\ndef health_check():\n    return {\"status\": \"healthy\"}\n"
      mode: '0644'
    - path: /tmp/molecule_test/opt/fastapi-tutorial/app/__init__.py
      content: ''
      mode: '0644'
    loop_control:
      loop_var: item_file
  - name: Create Python virtual environment files
    ansible.builtin.copy:
      content: '{{ item_venv[''content''] }}'
      dest: '{{ item_venv[''path''] }}'
      mode: '{{ item_venv[''mode''] }}'
      backup: true
    loop:
    - path: /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/python
      content: '#!/usr/bin/python3 # Mock Python executable'
      mode: '0755'
    - path: /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/pip
      content: '#!/usr/bin/python3 # Mock pip executable'
      mode: '0755'
    - path: /tmp/molecule_test/opt/fastapi-tutorial/venv/bin/uvicorn
      content: '#!/usr/bin/python3 # Mock uvicorn executable'
      mode: '0755'
    - path: /tmp/molecule_test/opt/fastapi-tutorial/venv/pyvenv.cfg
      content: 'home = /usr/bin

        include-system-site-packages = false

        version = 3.11.2

        '
      mode: '0644'
    loop_control:
      loop_var: item_venv
  - name: Create environment configuration file
    ansible.builtin.copy:
      content: 'PROJECT_NAME="FastAPI Tutorial"

        API_VERSION=1.0.0

        DATABASE_URL=postgresql://fastapi:fastapi_password@localhost:5432/fastapi_db

        '
      dest: /tmp/molecule_test/opt/fastapi-tutorial/.env
      mode: '0644'
      backup: true
  - name: Create systemd service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=FastAPI Tutorial Service

        After=network.target postgresql.service


        [Service]

        Type=simple

        User=fastapi

        WorkingDirectory=/opt/fastapi-tutorial

        Environment="PATH=/opt/fastapi-tutorial/venv/bin"

        ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000

        Restart=always


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/fastapi-tutorial.service
      mode: '0644'
      backup: true
  - name: Create Git repository files
    ansible.builtin.copy:
      content: '{{ item_git[''content''] }}'
      dest: '{{ item_git[''path''] }}'
      mode: '0644'
      backup: true
    loop:
    - path: /tmp/molecule_test/opt/fastapi-tutorial/.git/config
      content: "[core]\n    repositoryformatversion = 0\n    filemode = true\n    bare = false\n    logallrefupdates = true\n[remote \"origin\"]\n    url = https://github.com/dibanez/fastapi_tutorial.git\n
        \   fetch = +refs/heads/*:refs/remotes/origin/*\n[branch \"main\"]\n    remote = origin\n    merge = refs/heads/main\n"
    - path: /tmp/molecule_test/opt/fastapi-tutorial/.git/HEAD
      content: 'ref: refs/heads/main'
    loop_control:
      loop_var: item_git
