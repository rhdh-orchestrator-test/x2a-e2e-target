---
# User-facing defaults for the FastAPI tutorial application.
fastapi_tutorial_app_path: /opt/fastapi-tutorial
fastapi_tutorial_repository: https://github.com/dibanez/fastapi_tutorial.git
fastapi_tutorial_revision: main
fastapi_tutorial_venv_path: /opt/fastapi-tutorial/venv
fastapi_tutorial_service_name: fastapi-tutorial
fastapi_tutorial_service_file: /etc/systemd/system/fastapi-tutorial.service
fastapi_tutorial_host: 0.0.0.0
fastapi_tutorial_port: 8000
fastapi_tutorial_app_module: app.main:app
fastapi_tutorial_run_user: root
fastapi_tutorial_run_group: root
fastapi_tutorial_postgresql_service: postgresql
fastapi_tutorial_system_packages:
  - python3
  - python3-pip
  - python3-venv
  - git
  - postgresql
  - postgresql-contrib
  - libpq-dev
fastapi_tutorial_secure_logging: true
