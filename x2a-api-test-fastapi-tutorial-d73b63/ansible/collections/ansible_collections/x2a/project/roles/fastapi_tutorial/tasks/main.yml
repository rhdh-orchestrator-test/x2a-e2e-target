---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Ensure FastAPI application group exists
  ansible.builtin.group:
    name: "{{ fastapi_tutorial_run_group }}"
    state: present

- name: Ensure FastAPI application user exists
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_run_user }}"
    group: "{{ fastapi_tutorial_run_group }}"
    system: true
    create_home: false
    state: present

- name: Install FastAPI system packages
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_system_packages }}"
    state: present

- name: Create FastAPI application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: "{{ fastapi_tutorial_run_user }}"
    group: "{{ fastapi_tutorial_run_group }}"
    mode: "0755"

- name: Synchronize FastAPI tutorial repository  # noqa: R104 - repository URL is an operator-controlled role parameter and may target an internal mirror without TLS
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R106 - repository source is an operator-controlled role parameter
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - destination is the role-defined application path
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - command paths come from trusted role defaults
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_path }}"
    creates: "{{ fastapi_tutorial_venv_path }}/bin/python" # noqa: R114 - path is the role-defined virtual environment

- name: Install Python dependencies  # noqa: R101 - command paths come from trusted role defaults
  ansible.builtin.command:
    argv:
      - "{{ fastapi_tutorial_venv_path }}/bin/pip"
      - install
      - -r
      - "{{ fastapi_tutorial_app_path }}/requirements.txt"
    chdir: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - directory is the role-defined application path
  changed_when: true

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_postgresql_service }}"
    enabled: true
    state: started

- name: Create or update FastAPI PostgreSQL role  # noqa: L039 - credential variables are validated by the preceding task
  ansible.builtin.shell:  # noqa: R101 - SQL uses validated AAP credential variables
    cmd: |
      psql -v ON_ERROR_STOP=1 -c "DO $$
      BEGIN
        CREATE ROLE {{ database_username | quote }} LOGIN PASSWORD '{{ database_password | replace("'", "''") }}';
      EXCEPTION WHEN duplicate_object THEN
        ALTER ROLE {{ database_username | quote }} WITH PASSWORD '{{ database_password | replace("'", "''") }}';
      END
      $$;"
  changed_when: true
  become: true  # noqa: R108 - PostgreSQL role management requires switching to the postgres system account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create FastAPI PostgreSQL database when absent  # noqa: L039 - credential variables are validated by the preceding task
  ansible.builtin.shell:  # noqa: R101 - SQL uses validated AAP credential variables
    cmd: |
      psql -v ON_ERROR_STOP=1 -c "SELECT format('CREATE DATABASE %I OWNER %I', '{{ database_name }}', '{{ database_username }}')
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ database_name }}')\\gexec"
  changed_when: true
  become: true  # noqa: R108 - database creation requires switching to the postgres system account
  become_user: postgres

- name: Grant FastAPI database privileges  # noqa: L039 - credential variables are validated by the preceding task
  ansible.builtin.command:  # noqa: R101 - SQL uses validated AAP credential variables
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ database_username }};
  changed_when: true
  become: true  # noqa: R108 - granting database privileges requires switching to the postgres system account
  become_user: postgres

- name: Write FastAPI environment configuration  # noqa: L039 - credential variables are validated by the preceding task
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ database_username }}:{{ database_password }}@{{ database_host }}/{{ database_name }}
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - path is the role-defined application path
    owner: "{{ fastapi_tutorial_run_user }}"
    group: "{{ fastapi_tutorial_run_group }}"
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User={{ fastapi_tutorial_run_user }}
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_venv_path }}/bin"
      ExecStart={{ fastapi_tutorial_venv_path }}/bin/uvicorn {{ fastapi_tutorial_app_module }} --host {{ fastapi_tutorial_host }} --port {{ fastapi_tutorial_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - path is the role-defined systemd unit path
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
