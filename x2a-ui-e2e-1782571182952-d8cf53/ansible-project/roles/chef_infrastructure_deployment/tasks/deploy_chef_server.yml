---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
  register: chef_automate_download
- name: Extract Chef Automate CLI if downloaded as zip
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_path }} && chmod +x {{ chef_automate_cli_path }}
  args:
    stdin: "{{ chef_automate_download.content | default('') }}"
    creates: "{{ chef_automate_cli_path }}"
  when: chef_automate_download.changed and chef_automate_cli_url is search('\.zip$')
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_accept_terms_and_mlsa | lower }}"
    creates: /etc/chef-automate/config.toml
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
  notify: Wait for Chef Infra Server services
