---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: molecule_test_user
    organization: molecule_test_org
  tasks:
    # Verify hostname configuration
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Verify hosts file
    - name: Check hosts file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hosts
      register: hosts_file

    - name: Assert hosts file was created
      ansible.builtin.assert:
        that:
          - hosts_file.stat.exists
          - hosts_file.stat.size > 0
        fail_msg: "Hosts file not found"
        success_msg: "Hosts file exists"

    - name: Get hosts file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hosts
      register: hosts_content
      when: hosts_file.stat.exists

    - name: Assert hosts file contains hostname entry
      ansible.builtin.assert:
        that:
          - (hosts_content.content | b64decode) is search("127.0.1.1 automate.chef.lab")
        fail_msg: "Hosts file does not contain hostname entry"
        success_msg: "Hosts file contains hostname entry"
      when: hosts_file.stat.exists

    # Verify Chef Automate CLI
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI was downloaded
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Verify Chef Automate config
    - name: Check Chef Automate config exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config

    - name: Assert Chef Automate config was created
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
          - chef_automate_config.stat.size > 0
        fail_msg: "Chef Automate config not found"
        success_msg: "Chef Automate config exists"

    # Verify user key file
    - name: Check user key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ username }}.pem"
      register: user_key_file

    - name: Assert user key file was created
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.size > 0
          - user_key_file.stat.mode == "0600"
        fail_msg: "User key file not found or has incorrect permissions"
        success_msg: "User key file exists with correct permissions"

    # Verify organization validator key file
    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ organization }}-validator.pem"
      register: org_key_file

    - name: Assert organization validator key file was created
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.size > 0
          - org_key_file.stat.mode == "0600"
        fail_msg: "Organization validator key file not found or has incorrect permissions"
        success_msg: "Organization validator key file exists with correct permissions"

    # The following checks can't run in a container, so they're tagged with molecule-notest
    
    # Verify system parameters
    - name: Check system parameters
      ansible.builtin.command:
        cmd: "sysctl vm.max_map_count vm.dirty_expire_centisecs"
      register: sysctl_output
      changed_when: false
      tags: molecule-notest

    - name: Assert system parameters are set correctly
      ansible.builtin.assert:
        that:
          - sysctl_output.stdout is search("vm.max_map_count = 262144")
          - sysctl_output.stdout is search("vm.dirty_expire_centisecs = 20000")
        fail_msg: "System parameters not set correctly"
        success_msg: "System parameters set correctly"
      tags: molecule-notest

    # Verify Chef Automate service status
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: "systemctl status chef-automate"
      register: chef_automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
          - chef_automate_status.stdout is search("active")
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    # Verify Chef Infra Server status
    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: "chef-server-ctl status"
      register: chef_server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server is not running"
        success_msg: "Chef Infra Server is running"
      tags: molecule-notest

    # Verify user and organization creation
    - name: Check user list
      ansible.builtin.command:
        cmd: "chef-server-ctl user-list"
      register: user_list
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert user was created
      ansible.builtin.assert:
        that:
          - user_list.stdout is search(username)
        fail_msg: "User not found in Chef Infra Server"
        success_msg: "User found in Chef Infra Server"
      tags: molecule-notest

    - name: Check organization list
      ansible.builtin.command:
        cmd: "chef-server-ctl org-list"
      register: org_list
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert organization was created
      ansible.builtin.assert:
        that:
          - org_list.stdout is search(organization)
        fail_msg: "Organization not found in Chef Infra Server"
        success_msg: "Organization found in Chef Infra Server"
      tags: molecule-notest

    # Verify network listening
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # Verify API access
    - name: Check API access
      ansible.builtin.uri:
        url: https://localhost/api/v0/auth/version
        validate_certs: false
      register: api_check
      failed_when: false
      tags: molecule-notest

    - name: Assert API is accessible
      ansible.builtin.assert:
        that:
          - api_check is succeeded
        fail_msg: "API is not accessible"
        success_msg: "API is accessible"
      tags: molecule-notest