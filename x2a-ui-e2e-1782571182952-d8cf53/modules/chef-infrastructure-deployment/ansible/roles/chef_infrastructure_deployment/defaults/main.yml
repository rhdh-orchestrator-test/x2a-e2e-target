---
chef_hostname: automate.chef.lab
chef_sysctl_settings:
  vm.max_map_count: 262144
  vm.dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: ./chef-automate
chef_accept_terms_and_mlsa: true
chef_admin_username: "{{ username | default('admin') }}"
chef_admin_fullname: "{{ username | default('Admin User') }}"
chef_admin_email: "{{ username | default('admin') }}@example.com"
chef_admin_password: "{{ password | default('changeme') }}"
chef_organization_name: "{{ organization | default('default') }}"
chef_organization_fullname: "{{ organization | default('Default Organization') }}"
chef_user_key_path: ./{{ chef_admin_username }}.pem
chef_org_key_path: ./{{ chef_organization_name }}-validator.pem
