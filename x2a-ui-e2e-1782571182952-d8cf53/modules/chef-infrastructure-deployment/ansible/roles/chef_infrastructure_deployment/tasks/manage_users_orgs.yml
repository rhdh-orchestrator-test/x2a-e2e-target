---
- name: Ensure key file directory exists
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ chef_user_key_path }}"
    - "{{ chef_org_key_path }}"
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_admin_username }}  "{{ chef_admin_fullname }}"  {{ chef_admin_email }}  "{{ chef_admin_password }}"  --filename {{
      chef_user_key_path }}

      '
    creates: "{{ chef_user_key_path }}"
  become: true
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_organization_name }}  "{{ chef_organization_fullname }}"  --association_user {{ chef_admin_username }}  --filename {{
      chef_org_key_path }}

      '
    creates: "{{ chef_org_key_path }}"
  become: true
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
- name: Set proper permissions on key files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
  loop:
    - "{{ chef_user_key_path }}"
    - "{{ chef_org_key_path }}"
  when: chef_user_create.changed or chef_org_create.changed
