---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_hostname }}"
  become: true
- name: Update /etc/hosts with hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ^127.0.1.1
    line: 127.0.1.1 {{ chef_hostname }}
    state: present
  become: true
- name: Configure sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ chef_sysctl_settings | dict2items }}"
  become: true
