---
controller_credential_types:
- name: Chef Server Admin User
  description: Credential type for Chef Server Admin User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Admin username for Chef Server
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Admin password for Chef Server
    - id: email
      type: string
      label: Email
      help_text: Email address for Chef Server admin user
    required:
    - username
    - password
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
