---
chef_hostname: automate.chef.lab
chef_kernel_params:
  vm.max_map_count: 262144
  vm.dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: "{{ ansible_env.HOME }}/chef-automate"
chef_deploy_automate: true
chef_deploy_infra_server: true
chef_accept_terms_and_mlsa: true
chef_user:
  username: "{{ username | default('chefuser') }}"
  fullname: "{{ username | default('Chef User') }}"
  email: "{{ email | default('chef@example.com') }}"
  password: "{{ password | default('password') }}"
  filename: "{{ username | default('chefuser') }}.pem"
chef_org:
  shortname: lab
  fullname: Chef Lab
  filename: lab-validator.pem
  association_user: "{{ username | default('chefuser') }}"
