---
- name: Configure kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  become: true
  loop: "{{ chef_kernel_params | dict2items }}"
- name: Verify kernel parameters are set correctly
  ansible.builtin.command:
    cmd: sysctl {{ item.key }}
  register: sysctl_result
  changed_when: false
  loop: "{{ chef_kernel_params | dict2items }}"
  tags: molecule-notest
- name: Display kernel parameter values
  ansible.builtin.debug:
    msg: "{{ item.stdout }}"
  loop: "{{ sysctl_result.results }}"
  tags: molecule-notest
