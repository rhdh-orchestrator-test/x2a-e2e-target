---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Configure system hostname
  ansible.builtin.include_tasks: configure_hostname.yml
- name: Configure kernel parameters
  ansible.builtin.include_tasks: configure_kernel_parameters.yml
- name: Install Chef Automate CLI
  ansible.builtin.include_tasks: install_automate_cli.yml
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.include_tasks: deploy_automate.yml
  when: chef_deploy_automate and chef_deploy_infra_server
- name: Deploy Chef Infra Server only
  ansible.builtin.include_tasks: deploy_chef_server.yml
  when: chef_deploy_infra_server and not chef_deploy_automate
- name: Create Chef user and organization
  ansible.builtin.include_tasks: create_chef_user_org.yml
  when: chef_deploy_infra_server
