---
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_accept_terms_and_mlsa | lower }} "
  become: true
  args:
    creates: /etc/chef-automate/config.toml
  register: deploy_result
  failed_when: deploy_result.rc != 0
- name: Check Chef Automate status
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} status"
  become: true
  register: automate_status
  changed_when: false
  failed_when: false
  tags: molecule-notest
- name: Check Chef Infra Server status
  ansible.builtin.command:
    cmd: chef-server-ctl status
  become: true
  register: chef_server_status
  changed_when: false
  failed_when: false
  tags: molecule-notest
- name: Display Chef Automate deployment status
  ansible.builtin.debug:
    msg: "Chef Automate deployment status: {{ 'Success' if automate_status.rc == 0 else 'Failed' }}"
  tags: molecule-notest
- name: Display Chef Infra Server deployment status
  ansible.builtin.debug:
    msg: "Chef Infra Server deployment status: {{ 'Success' if chef_server_status.rc == 0 else 'Failed' }}"
  tags: molecule-notest
