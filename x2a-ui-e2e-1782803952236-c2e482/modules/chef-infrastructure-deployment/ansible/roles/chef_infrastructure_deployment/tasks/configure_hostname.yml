---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_hostname }}"
  become: true
- name: Ensure hostname is in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ^127.0.1.1
    line: 127.0.1.1 {{ chef_hostname }}
    state: present
  become: true
- name: Verify hostname is set correctly
  ansible.builtin.command:
    cmd: hostname
  register: hostname_result
  changed_when: false
  tags: molecule-notest
- name: Verify hostname resolution
  ansible.builtin.command:
    cmd: getent hosts {{ chef_hostname }}
  register: hostname_resolution
  changed_when: false
  failed_when: false
  tags: molecule-notest
- name: Display hostname resolution status
  ansible.builtin.debug:
    msg: "Hostname resolution for {{ chef_hostname }}: {{ 'OK' if hostname_resolution.rc == 0 else 'FAILED - You may need to update DNS or /etc/hosts manually' }}"
  tags: molecule-notest
