- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    org_name: lab
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists and has content
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found or empty
      success_msg: Hostname file exists and has content
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Verify hostname content
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname is not set correctly
      success_msg: Hostname is set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Sysctl configuration file not found or empty
      success_msg: Sysctl configuration file exists and has content
  - name: Get sysctl file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Verify sysctl parameters
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: Sysctl parameters are not set correctly
      success_msg: Sysctl parameters are set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate deployment directory exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert Chef Automate is deployed
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef Automate deployment directory not found
      success_msg: Chef Automate deployment directory exists
  - name: Check user PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/{{ username }}.pem
    register: user_pem_file
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem_file.stat.exists
      - user_pem_file.stat.size > 0
      fail_msg: User PEM file not found or empty
      success_msg: User PEM file exists and has content
  - name: Check organization validator PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/{{ org_name }}-validator.pem
    register: org_validator_pem_file
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_validator_pem_file.stat.exists
      - org_validator_pem_file.stat.size > 0
      fail_msg: Organization validator PEM file not found or empty
      success_msg: Organization validator PEM file exists and has content
  - name: Check Chef Server user list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/chef-server-user-list.txt
    register: user_list_file
  - name: Get Chef Server user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/home/ansible/chef-server-user-list.txt
    register: user_list_content
    when: user_list_file.stat.exists
  - name: Verify Chef Server user exists
    ansible.builtin.assert:
      that:
      - '''jtonello'' in (user_list_content.content | b64decode)'
      fail_msg: Chef Server user not found
      success_msg: Chef Server user exists
    when: user_list_file.stat.exists
  - name: Check Chef Server organization list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/chef-server-org-list.txt
    register: org_list_file
  - name: Get Chef Server organization list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/home/ansible/chef-server-org-list.txt
    register: org_list_content
    when: org_list_file.stat.exists
  - name: Verify Chef Server organization exists
    ansible.builtin.assert:
      that:
      - '''lab'' in (org_list_content.content | b64decode)'
      fail_msg: Chef Server organization not found
      success_msg: Chef Server organization exists
    when: org_list_file.stat.exists
  - name: Check Chef Automate status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate services are running
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      fail_msg: Chef Automate service not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
