---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    long_username: John Tonello
    user_email: jtonello@chef.lab
    user_password: password
    user_pem: |
      -----BEGIN RSA PRIVATE KEY-----
      MIIEowIBAAKCAQEAzV7W3NzHAQC+JZ8qPkJJFYhGLHatTHhoHcxWVU5+bMGrRgwy
      SAMPLE_KEY_CONTENT_PLACEHOLDER
      -----END RSA PRIVATE KEY-----
    org_name: lab
    long_org_name: Chef Lab
    org_validator_pem: |
      -----BEGIN RSA PRIVATE KEY-----
      MIIEpAIBAAKCAQEA0Zf7QV+HFJRr+A5AoZZee9R+QSvUn1J7PsMv4GwLj7X1G1R7
      SAMPLE_KEY_CONTENT_PLACEHOLDER
      -----END RSA PRIVATE KEY-----
  tasks:
    # Create directory structure
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/ansible
        - /tmp/molecule_test/tmp

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl settings
    - name: Create sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI Simulation'"
        dest: "/tmp/molecule_test/home/ansible/chef-automate"
        mode: "0755"

    # Simulate Chef user PEM file
    - name: Create user PEM file
      ansible.builtin.copy:
        content: "{{ user_pem }}"
        dest: "/tmp/molecule_test/home/ansible/jtonello.pem"
        mode: "0600"

    # Simulate Chef organization validator PEM file
    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: "{{ org_validator_pem }}"
        dest: "/tmp/molecule_test/home/ansible/lab-validator.pem"
        mode: "0600"

    # Simulate Chef server command outputs
    - name: Create chef-server-ctl user-list output
      ansible.builtin.copy:
        content: "jtonello"
        dest: "/tmp/molecule_test/home/ansible/chef-server-user-list.txt"
        mode: "0644"

    - name: Create chef-server-ctl org-list output
      ansible.builtin.copy:
        content: "lab"
        dest: "/tmp/molecule_test/home/ansible/chef-server-org-list.txt"
        mode: "0644"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status output
      ansible.builtin.copy:
        content: "Chef Automate services are running"
        dest: "/tmp/molecule_test/home/ansible/chef-automate-status.txt"
        mode: "0644"