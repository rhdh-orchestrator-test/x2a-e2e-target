---
controller_credential_types:
- name: Chef Server User Credentials
  description: Credential type for Chef Server User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef Server user account name
    - id: long_username
      type: string
      label: Full Name
      help_text: Full name of the Chef Server user
    - id: user_email
      type: string
      label: Email Address
      help_text: Email address for the Chef Server user
    - id: user_password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef Server user account
    - id: user_pem
      type: string
      label: User PEM File
      secret: true
      help_text: PEM file for Chef Server user authentication
    required:
    - username
    - user_password
    - user_pem
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      long_username: !unsafe '{{ long_username }}'
      user_email: !unsafe '{{ user_email }}'
      user_password: !unsafe '{{ user_password }}'
      user_pem: !unsafe '{{ user_pem }}'
- name: Chef Organization Credentials
  description: Credential type for Chef Organization Credentials
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: long_org_name
      type: string
      label: Full Organization Name
      help_text: Full descriptive name of the Chef organization
    - id: org_validator_pem
      type: string
      label: Organization Validator PEM
      secret: true
      help_text: PEM file for Chef organization validation
    required:
    - org_name
    - org_validator_pem
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      long_org_name: !unsafe '{{ long_org_name }}'
      org_validator_pem: !unsafe '{{ org_validator_pem }}'
