---
# Cache role main tasks

- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install memcached
  ansible.builtin.package:
    name: memcached
    state: present

- name: Install Redis server
  ansible.builtin.package:
    name: redis-server
    state: present

- name: Ensure Redis group exists
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    system: true
    state: present

- name: Ensure Redis user exists
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present

- name: Create Redis configuration directory
  ansible.builtin.file:
    path: "{{ cache_redis_config_file | dirname }}" # noqa: R114 - path from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}" # noqa: R114 - path from role defaults
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"

- name: Create Redis runtime directory
  ansible.builtin.file:
    path: /var/run/redis
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"

- name: Create Redis data directory
  ansible.builtin.file:
    path: /var/lib/redis
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"

- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0640"
    backup: true
  notify: Restart Redis

- name: Remove replica-related settings from Redis config
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults  # noqa: R115 - path from role defaults
    regexp: ^{{ item_setting }}.*$
    state: absent
    backup: true
  loop: "{{ cache_redis_replica_settings_to_remove }}"
  loop_control:
    loop_var: item_setting
  notify: Restart Redis

- name: Start and enable Redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service_name }}"
    state: started
    enabled: true

- name: Start and enable memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
