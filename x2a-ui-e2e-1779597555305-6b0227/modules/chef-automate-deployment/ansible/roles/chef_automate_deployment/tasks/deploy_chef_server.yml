---
- name: Ensure gzip is installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Ensure /tmp directory exists with proper permissions
  ansible.builtin.file:
    path: /tmp
    state: directory
    mode: "1777"
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_binary }} && chmod +x {{ chef_automate_cli_binary }}
    stdin: /tmp/chef-automate.zip
    chdir: /tmp
    creates: /tmp/{{ chef_automate_cli_binary }}
  args:
    executable: /bin/bash
- name: Deploy Chef Infra Server (without Automate)
  ansible.builtin.command:
    cmd: ./{{ chef_automate_cli_binary }} deploy --product infra-server --accept-terms-and-mlsa=true
    chdir: /tmp
    creates: /hab
  become: true
