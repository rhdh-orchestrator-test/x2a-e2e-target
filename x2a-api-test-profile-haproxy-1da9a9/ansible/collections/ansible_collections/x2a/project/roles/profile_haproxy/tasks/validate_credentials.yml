---
- name: Validate HAProxy statistics credentials
  ansible.builtin.assert:
    that:
      - stats_password | default('') | length > 0
    fail_msg: Set stats_password (preferably through Ansible Vault or an AAP credential) when statistics are enabled.
  when: stats_enabled | default(false)
  no_log: "{{ profile_haproxy_secure_logging | default(false) }}"
