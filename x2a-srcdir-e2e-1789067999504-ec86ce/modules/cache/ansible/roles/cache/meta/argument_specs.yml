---
argument_specs:
  main:
    short_description: Install and configure Redis cache server
    description:
      - Installs Redis server package and ensures the service is running and enabled.
      - Uses default Redis configuration without custom settings.
      - Provides basic Redis functionality on the default port 6379.
    options:
      cache_service_name:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis service (may vary across distributions).
      cache_package_name:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis package to install (may vary across distributions).
