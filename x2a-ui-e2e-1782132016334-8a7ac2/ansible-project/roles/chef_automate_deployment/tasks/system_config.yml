---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  register: hostname_changed
- name: Ensure /etc directory exists
  ansible.builtin.file:
    path: /etc
    state: directory
    mode: "0755"
  when: hostname_changed is changed
- name: Update /etc/hosts with hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ^127.0.0.1\s+{{ chef_automate_hostname }}$
    line: 127.0.0.1 {{ chef_automate_hostname }}
    state: present
  when: hostname_changed is changed
- name: Configure kernel parameters for Chef Automate
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ chef_automate_sysctl_params | dict2items }}"
  notify: Reload sysctl
