---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Redis with the Private Hub role  # noqa: L038 - external role is declared in requirements.yml but is not present in this source tree
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_version: "7.2"
    redis_install_method: package
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Remove replica-serve-stale-data directive
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114,R115 - path is a role default, not user input
    regexp: ^replica-serve-stale-data.*$
    state: absent
  notify: Restart Redis

- name: Remove replica-read-only directive
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114,R115 - path is a role default, not user input
    regexp: ^replica-read-only.*$
    state: absent
  notify: Restart Redis

- name: Remove repl-ping-replica-period directive
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114,R115 - path is a role default, not user input
    regexp: ^repl-ping-replica-period.*$
    state: absent
  notify: Restart Redis

- name: Remove client-output-buffer-limit directive
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114,R115 - path is a role default, not user input
    regexp: ^client-output-buffer-limit.*$
    state: absent
  notify: Restart Redis

- name: Remove replica-priority directive
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114,R115 - path is a role default, not user input
    regexp: ^replica-priority.*$
    state: absent
  notify: Restart Redis
