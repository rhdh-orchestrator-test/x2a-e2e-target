---
argument_specs:
  main:
    short_description: Configure Redis caching services
    description:
      - Installs and configures a standalone Redis cache and removes incompatible replication directives.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether tasks handling the Redis password suppress output.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port used by Redis.
      cache_redis_config_path:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to the generated Redis configuration file.
      cache_redis_service_name:
        type: str
        required: false
        default: redis
        description: Redis service unit name.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
