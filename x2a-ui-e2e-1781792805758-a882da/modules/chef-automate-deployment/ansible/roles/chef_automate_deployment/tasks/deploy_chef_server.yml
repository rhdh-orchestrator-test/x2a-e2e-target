---
- name: Configure system parameters
  ansible.builtin.include_tasks: system_configuration.yml
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: "{{ chef_automate_cli_path }}.zip"
    dest: "{{ chef_automate_cli_path | dirname }}"
    remote_src: true
    creates: "{{ chef_automate_cli_path }}"
    mode: "0755"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "sudo ./{{ chef_automate_cli_path | basename }} deploy {% for product in chef_server_products %}--product {{ product }} {% endfor %} --accept-terms-and-mlsa={{
      chef_automate_accept_terms | lower }} "
  args:
    creates: /etc/chef-automate/config.toml
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
- name: Setup users and organizations
  ansible.builtin.include_tasks: setup_users_orgs.yml
