- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname configuration
    ansible.builtin.command:
      cmd: hostname
    register: hostname_result
    changed_when: false
    tags: molecule-notest
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - '''automate.chef.lab'' in hostname_result.stdout'
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    tags: molecule-notest
  - name: Check kernel parameters
    ansible.builtin.command:
      cmd: sysctl {{ item }}
    loop:
    - vm.max_map_count
    - vm.dirty_expire_centisecs
    register: sysctl_result
    changed_when: false
    tags: molecule-notest
  - name: Assert kernel parameters are set correctly
    ansible.builtin.assert:
      that:
      - '''262144'' in sysctl_result.results[0].stdout'
      - '''20000'' in sysctl_result.results[1].stdout'
      fail_msg: Kernel parameters not set correctly
      success_msg: Kernel parameters set correctly
    tags: molecule-notest
  - name: Check sysctl configuration file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl configuration file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      fail_msg: Sysctl configuration file not found
      success_msg: Sysctl configuration file exists
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-automate
    register: automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - automate_cli.stat.exists
      - automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate configuration file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: automate_config
  - name: Assert Chef Automate configuration file exists
    ansible.builtin.assert:
      that:
      - automate_config.stat.exists
      fail_msg: Chef Automate configuration file not found
      success_msg: Chef Automate configuration file exists
  - name: Check Chef Automate service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      - ansible_facts.services['chef-automate.service'].state == 'running'
      fail_msg: Chef Automate service not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Assert Chef Infra Server service is running
    ansible.builtin.assert:
      that:
      - '''chef-server.service'' in ansible_facts.services'
      - ansible_facts.services['chef-server.service'].state == 'running'
      fail_msg: Chef Infra Server service not running
      success_msg: Chef Infra Server service is running
    tags: molecule-notest
  - name: Check user PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_pem
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.size > 0
      fail_msg: User PEM file not found or empty
      success_msg: User PEM file exists
  - name: Check organization validator PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_pem
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_pem.stat.exists
      - org_pem.stat.size > 0
      fail_msg: Organization validator PEM file not found or empty
      success_msg: Organization validator PEM file exists
  - name: Check user list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/user-list.txt
    register: user_list_file
  - name: Get user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/user-list.txt
    register: user_list_content
    when: user_list_file.stat.exists
  - name: Assert user exists in user list
    ansible.builtin.assert:
      that:
      - user_list_file.stat.exists
      - '''jtonello'' in (user_list_content.content | b64decode)'
      fail_msg: User not found in user list
      success_msg: User found in user list
    when: user_list_file.stat.exists
  - name: Check organization list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/org-list.txt
    register: org_list_file
  - name: Get organization list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/org-list.txt
    register: org_list_content
    when: org_list_file.stat.exists
  - name: Assert organization exists in organization list
    ansible.builtin.assert:
      that:
      - org_list_file.stat.exists
      - '''lab'' in (org_list_content.content | b64decode)'
      fail_msg: Organization not found in organization list
      success_msg: Organization found in organization list
    when: org_list_file.stat.exists
  - name: Check if port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      timeout: 1
    register: port_check
    ignore_errors: true
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is success
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
  - name: Check Chef Automate web UI accessibility
    ansible.builtin.uri:
      url: https://localhost
      validate_certs: false
      status_code: 200
    register: web_ui_check
    ignore_errors: true
    tags: molecule-notest
  - name: Assert Chef Automate web UI is accessible
    ansible.builtin.assert:
      that:
      - web_ui_check is success
      fail_msg: Chef Automate web UI is not accessible
      success_msg: Chef Automate web UI is accessible
    tags: molecule-notest
