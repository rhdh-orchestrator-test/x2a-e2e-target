---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    user_full_name: "John Tonello"
    user_email: jtonello@example.com
    password: "molecule_test_password"
    organization_name: lab
    organization_full_name: "Chef Lab Organization"
    chef_automate_hostname: automate.chef.lab
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
    chef_automate_user_pem_file: /tmp/molecule_test/jtonello.pem
    chef_automate_org_pem_file: /tmp/molecule_test/lab-validator.pem
  tasks:
    # Create directory structure
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/systemd/system

    # System configuration files
    - name: Create mock sysctl configuration
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Chef Automate CLI
    - name: Create mock Chef Automate CLI
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Mock Chef Automate CLI'\n"
        dest: "{{ chef_automate_cli_path }}"
        mode: "0755"

    # Chef Automate configuration
    - name: Create mock Chef Automate config
      ansible.builtin.copy:
        content: |
          # Mock Chef Automate configuration
          [global]
            fqdn = "{{ chef_automate_hostname }}"
          [deployment]
            products = ["automate", "infra-server"]
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"

    # Chef Server service file
    - name: Create mock Chef Server service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Server
          After=network.target

          [Service]
          Type=simple
          ExecStart=/bin/true
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/etc/systemd/system/chef-server.service
        mode: "0644"

    # Chef Automate service file
    - name: Create mock Chef Automate service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Automate
          After=network.target

          [Service]
          Type=simple
          ExecStart=/bin/true
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
        mode: "0644"

    # User PEM file
    - name: Create mock user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAwZ5UJULAjWr7p6FVwGRQRjFN2s8tZ/6LC3X82fajpVsYqF1x
          qEuUDndDXVD09E4u83MS6HO6a3bIVQDp6/klnYldiE6Vp8HH5BSKaCWKVg8lGWg1
          UM9wZFnlryi14KgmpIFmcu9nA8yV/6MZAe6RSDmb3iyNBmiZ8aZhGw2pI1YwR+15
          MVqFFGB+7ExkziROi7L8CFCyCezK2/oOOvQsH1dzQ8z1JXWdg8/9Zx7Ktvgwu5PQ
          M3cJtSHX6iBPOkMU8Z8TugLlTqQXKZOEgwajwvQ5mf2DPkVgM08XAgaR9KjAI8R3
          qSA/FI5K/SHh2ZOHKXrCr5blU1Qo9CuS0UQ2Mw==
          -----END RSA PRIVATE KEY-----
        dest: "{{ chef_automate_user_pem_file }}"
        mode: "0600"

    # Organization validator PEM file
    - name: Create mock organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAwZ5UJULAjWr7p6FVwGRQRjFN2s8tZ/6LC3X82fajpVsYqF1x
          qEuUDndDXVD09E4u83MS6HO6a3bIVQDp6/klnYldiE6Vp8HH5BSKaCWKVg8lGWg1
          UM9wZFnlryi14KgmpIFmcu9nA8yV/6MZAe6RSDmb3iyNBmiZ8aZhGw2pI1YwR+15
          MVqFFGB+7ExkziROi7L8CFCyCezK2/oOOvQsH1dzQ8z1JXWdg8/9Zx7Ktvgwu5PQ
          M3cJtSHX6iBPOkMU8Z8TugLlTqQXKZOEgwajwvQ5mf2DPkVgM08XAgaR9KjAI8R3
          qSA/FI5K/SHh2ZOHKXrCr5blU1Qo9CuS0UQ2Mw==
          -----END RSA PRIVATE KEY-----
        dest: "{{ chef_automate_org_pem_file }}"
        mode: "0600"

    # Mock user and organization list files
    - name: Create mock user list file
      ansible.builtin.copy:
        content: "jtonello\n"
        dest: /tmp/molecule_test/user-list.txt
        mode: "0644"

    - name: Create mock organization list file
      ansible.builtin.copy:
        content: "lab\n"
        dest: /tmp/molecule_test/org-list.txt
        mode: "0644"