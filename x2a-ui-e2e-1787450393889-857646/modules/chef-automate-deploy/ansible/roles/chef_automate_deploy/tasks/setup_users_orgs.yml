---
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_key_file }}"
    - "{{ chef_automate_org_key_file }}"
  become: true
  when: chef_automate_user_key_file != "" and chef_automate_org_key_file != ""
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_username }} "{{ full_name | default(chef_automate_full_name) }}" "{{ email | default(chef_automate_email)
      }}" "{{ password | default(chef_automate_password) }}" --filename {{ chef_automate_user_key_file }}
  args:
    creates: "{{ chef_automate_user_key_file }}"
  become: true
  register: chef_user_create_result
  changed_when: chef_user_create_result.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_full_name }}" --association_user {{ chef_automate_username }} --filename
      {{ chef_automate_org_key_file }}
  args:
    creates: "{{ chef_automate_org_key_file }}"
  become: true
  register: chef_org_create_result
  changed_when: chef_org_create_result.rc == 0
