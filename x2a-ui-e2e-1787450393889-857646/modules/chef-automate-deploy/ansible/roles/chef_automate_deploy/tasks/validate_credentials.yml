---
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - username is defined
      - password is defined
      - full_name is defined
      - email is defined
    fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template.
    quiet: true
  vars:
    username: "{{ username | default(omit) }}"
    password: "{{ password | default(omit) }}"
    full_name: "{{ full_name | default(omit) }}"
    email: "{{ email | default(omit) }}"
