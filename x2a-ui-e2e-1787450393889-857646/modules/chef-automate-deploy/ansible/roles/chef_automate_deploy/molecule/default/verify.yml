---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration verification
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check sysctl files exist
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/{{ item }}"
      register: sysctl_files
      loop:
        - sysctl_vm_max_map_count
        - sysctl_vm_dirty_expire_centisecs

    - name: Assert sysctl files were created
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
        fail_msg: "Sysctl file {{ item.item }} not found"
        success_msg: "Sysctl file {{ item.item }} exists"
      loop: "{{ sysctl_files.results }}"

    - name: Get sysctl vm.max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl_vm_max_map_count
      register: vm_max_map_count_content
      when: sysctl_files.results[0].stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (vm_max_map_count_content.content | b64decode | trim) == "vm.max_map_count = 262144"
        fail_msg: "vm.max_map_count not set correctly"
        success_msg: "vm.max_map_count set correctly"
      when: sysctl_files.results[0].stat.exists

    - name: Get sysctl vm.dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl_vm_dirty_expire_centisecs
      register: vm_dirty_expire_centisecs_content
      when: sysctl_files.results[1].stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (vm_dirty_expire_centisecs_content.content | b64decode | trim) == "vm.dirty_expire_centisecs = 20000"
        fail_msg: "vm.dirty_expire_centisecs not set correctly"
        success_msg: "vm.dirty_expire_centisecs set correctly"
      when: sysctl_files.results[1].stat.exists

    # Chef Automate CLI verification
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/molecule/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI was created
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # User and organization key files verification
    - name: Check user key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/molecule/jtonello.pem
      register: user_key_file

    - name: Assert user key file was created
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.size > 0
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/molecule/lab-validator.pem
      register: org_key_file

    - name: Assert organization validator key file was created
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.size > 0
        fail_msg: "Organization validator key file not found"
        success_msg: "Organization validator key file exists"

    # Chef Automate and Chef Server status verification
    - name: Check Chef Automate status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-automate-status
      register: chef_automate_status_file

    - name: Assert Chef Automate status file was created
      ansible.builtin.assert:
        that:
          - chef_automate_status_file.stat.exists
          - chef_automate_status_file.stat.size > 0
        fail_msg: "Chef Automate status file not found"
        success_msg: "Chef Automate status file exists"

    - name: Check Chef Server status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-status
      register: chef_server_status_file

    - name: Assert Chef Server status file was created
      ansible.builtin.assert:
        that:
          - chef_server_status_file.stat.exists
          - chef_server_status_file.stat.size > 0
        fail_msg: "Chef Server status file not found"
        success_msg: "Chef Server status file exists"

    # Chef user and organization verification
    - name: Check Chef user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-user-list
      register: chef_user_list_file

    - name: Assert Chef user list file was created
      ansible.builtin.assert:
        that:
          - chef_user_list_file.stat.exists
          - chef_user_list_file.stat.size > 0
        fail_msg: "Chef user list file not found"
        success_msg: "Chef user list file exists"

    - name: Get Chef user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-user-list
      register: chef_user_list_content
      when: chef_user_list_file.stat.exists

    - name: Assert Chef user exists
      ansible.builtin.assert:
        that:
          - "'jtonello' in (chef_user_list_content.content | b64decode | trim)"
        fail_msg: "Chef user 'jtonello' not found"
        success_msg: "Chef user 'jtonello' exists"
      when: chef_user_list_file.stat.exists

    - name: Check Chef organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-org-list
      register: chef_org_list_file

    - name: Assert Chef organization list file was created
      ansible.builtin.assert:
        that:
          - chef_org_list_file.stat.exists
          - chef_org_list_file.stat.size > 0
        fail_msg: "Chef organization list file not found"
        success_msg: "Chef organization list file exists"

    - name: Get Chef organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-org-list
      register: chef_org_list_content
      when: chef_org_list_file.stat.exists

    - name: Assert Chef organization exists
      ansible.builtin.assert:
        that:
          - "'lab' in (chef_org_list_content.content | b64decode | trim)"
        fail_msg: "Chef organization 'lab' not found"
        success_msg: "Chef organization 'lab' exists"
      when: chef_org_list_file.stat.exists

    # Network and service status verification
    - name: Check network status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/network-status
      register: network_status_file

    - name: Assert network status file was created
      ansible.builtin.assert:
        that:
          - network_status_file.stat.exists
          - network_status_file.stat.size > 0
        fail_msg: "Network status file not found"
        success_msg: "Network status file exists"

    - name: Get network status content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/network-status
      register: network_status_content
      when: network_status_file.stat.exists

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - "':::443' in (network_status_content.content | b64decode)"
        fail_msg: "Port 443 not listening"
        success_msg: "Port 443 is listening"
      when: network_status_file.stat.exists

    # The following tasks would normally run on a real system but can't in a container
    # They are tagged with molecule-notest to be skipped during molecule testing
    
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: chef-automate status
      register: chef_automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Server status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: chef_server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Server is not running"
        success_msg: "Chef Server is running"
      tags: molecule-notest

    - name: Check web UI access
      ansible.builtin.uri:
        url: https://localhost/api/v0/status
        validate_certs: false
      register: web_ui_status
      tags: molecule-notest

    - name: Assert web UI is accessible
      ansible.builtin.assert:
        that:
          - web_ui_status.status == 200
        fail_msg: "Web UI is not accessible"
        success_msg: "Web UI is accessible"
      tags: molecule-notest