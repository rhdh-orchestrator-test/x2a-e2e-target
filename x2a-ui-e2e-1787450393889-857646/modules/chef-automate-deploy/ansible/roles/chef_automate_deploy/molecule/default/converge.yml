---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/molecule

    # Simulate system configuration files
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    - name: Create sysctl settings files
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "/tmp/molecule_test/etc/{{ item.name }}"
        mode: "0644"
      loop:
        - name: sysctl_vm_max_map_count
          value: "vm.max_map_count = 262144"
        - name: sysctl_vm_dirty_expire_centisecs
          value: "vm.dirty_expire_centisecs = 20000"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI Mock'\n"
        dest: "/tmp/molecule_test/home/molecule/chef-automate"
        mode: "0755"

    # Simulate Chef user and organization key files
    - name: Create Chef user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK_USER_KEY_CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/home/molecule/jtonello.pem"
        mode: "0600"

    - name: Create Chef organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK_ORG_VALIDATOR_KEY_CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/home/molecule/lab-validator.pem"
        mode: "0600"

    # Simulate Chef Automate and Chef Server status files
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: "Chef Automate services status: running"
        dest: "/tmp/molecule_test/hab/chef-automate-status"
        mode: "0644"

    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: "Chef Server services status: running"
        dest: "/tmp/molecule_test/hab/chef-server-status"
        mode: "0644"

    # Simulate Chef user and organization list outputs
    - name: Create Chef user list file
      ansible.builtin.copy:
        content: "jtonello"
        dest: "/tmp/molecule_test/hab/chef-user-list"
        mode: "0644"

    - name: Create Chef organization list file
      ansible.builtin.copy:
        content: "lab"
        dest: "/tmp/molecule_test/hab/chef-org-list"
        mode: "0644"

    # Simulate Chef user and organization show outputs
    - name: Create Chef user show file
      ansible.builtin.copy:
        content: "username: jtonello\nfull name: John Tonello\nemail: jtonello@chef.lab"
        dest: "/tmp/molecule_test/hab/chef-user-show"
        mode: "0644"

    - name: Create Chef organization show file
      ansible.builtin.copy:
        content: "name: lab\nfull name: Chef Lab\nassociated users: jtonello"
        dest: "/tmp/molecule_test/hab/chef-org-show"
        mode: "0644"

    # Simulate network and service status
    - name: Create network status file
      ansible.builtin.copy:
        content: "tcp6       0      0 :::443                  :::*                    LISTEN      -"
        dest: "/tmp/molecule_test/hab/network-status"
        mode: "0644"

    # Simulate API status responses
    - name: Create API status files
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "/tmp/molecule_test/hab/{{ item.name }}"
        mode: "0644"
      loop:
        - name: api-v0-status
          content: '{"ok": true}'
        - name: _status
          content: '{"status": "ok"}'