---
argument_specs:
  main:
    short_description: Deploy Chef Automate and Chef Infra Server
    description:
      - Deploys Chef Automate and Chef Infra Server on a target system.
      - Configures system parameters, installs Chef Automate CLI, deploys products, and creates initial users and organizations.
    options:
      chef_automate_hostname:
        type: str
        required: false
        default: automate.chef.lab
        description: Hostname to set for the Chef Automate server.
      chef_automate_vm_max_map_count:
        type: int
        required: false
        default: 262144
        description: Value for vm.max_map_count kernel parameter.
      chef_automate_vm_dirty_expire_centisecs:
        type: int
        required: false
        default: 20000
        description: Value for vm.dirty_expire_centisecs kernel parameter.
      chef_automate_cli_url:
        type: str
        required: false
        default: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
        description: URL to download the Chef Automate CLI.
      chef_automate_cli_path:
        type: str
        required: false
        default: ./chef-automate
        description: Path where the Chef Automate CLI will be saved.
      chef_automate_accept_terms:
        type: bool
        required: false
        default: true
        description: Whether to accept the Chef Automate terms and MLSA agreement.
      chef_automate_products:
        type: list
        elements: str
        required: false
        default:
          - automate
          - infra-server
        description: List of Chef products to deploy (automate, infra-server).
      chef_automate_username:
        type: str
        required: false
        default: jtonello
        description: Username for the initial Chef user.
      chef_automate_full_name:
        type: str
        required: false
        default: John Tonello
        description: Full name for the initial Chef user.
      chef_automate_email:
        type: str
        required: false
        default: jtonello@chef.lab
        description: Email for the initial Chef user.
      chef_automate_password:
        type: str
        required: false
        default: password
        description: Password for the initial Chef user. Overridden by AAP credential variable.
      chef_automate_org_name:
        type: str
        required: false
        default: lab
        description: Short name for the Chef organization.
      chef_automate_org_full_name:
        type: str
        required: false
        default: Chef Lab
        description: Full name for the Chef organization.
      chef_automate_user_key_file:
        type: str
        required: false
        default: "{{ chef_automate_username }}.pem"
        description: Path to save the user key file.
      chef_automate_org_key_file:
        type: str
        required: false
        default: "{{ chef_automate_org_name }}-validator.pem"
        description: Path to save the organization validator key file.
      username:
        type: str
        required: true
        description: Username for the Chef user. Injected by AAP credential type.
      password:
        type: str
        required: true
        description: Password for the Chef user. Injected by AAP credential type.
      full_name:
        type: str
        required: true
        description: Full name for the Chef user. Injected by AAP credential type.
      email:
        type: str
        required: true
        description: Email for the Chef user. Injected by AAP credential type.
