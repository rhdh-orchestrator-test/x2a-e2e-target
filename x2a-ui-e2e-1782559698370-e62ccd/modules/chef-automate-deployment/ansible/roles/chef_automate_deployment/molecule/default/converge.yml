- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directories for system configuration
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/etc
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_max_map_count }}'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_dirty_expire_centisecs }}'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create directories for Chef Automate
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/bin
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/sh echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test{{ chef_automate_cli_path }}
      mode: '0755'
  - name: Create directories for Chef user and organization files
    ansible.builtin.file:
      path: /tmp/molecule_test/home/chef
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK USER KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/home/chef/{{ chef_user_key_file }}
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK ORGANIZATION VALIDATOR KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/home/chef/{{ chef_org_validator_file }}
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: "Service: chef-automate\nStatus: running\nProducts:\n  - automate\n  - infra-server\n"
      dest: /tmp/molecule_test/var/log/chef-automate-status.log
      mode: '0644'
  - name: Create directories for Chef server status
    ansible.builtin.file:
      path: /tmp/molecule_test/var/log
      state: directory
      mode: '0755'
  - name: Create Chef server status file
    ansible.builtin.copy:
      content: "Service: chef-server\nStatus: running\nComponents:\n  - bookshelf\n  - erchef\n  - nginx\n  - postgresql\n"
      dest: /tmp/molecule_test/var/log/chef-server-status.log
      mode: '0644'
  - name: Create user list file
    ansible.builtin.copy:
      content: '{{ username }}'
      dest: /tmp/molecule_test/var/log/chef-server-users.log
      mode: '0644'
  - name: Create organization list file
    ansible.builtin.copy:
      content: '{{ chef_org_name }}'
      dest: /tmp/molecule_test/var/log/chef-server-orgs.log
      mode: '0644'
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_cli_path: /bin/chef-automate
    chef_automate_accept_terms_and_mlsa: true
    chef_automate_products:
    - automate
    - infra-server
    chef_org_name: lab
    chef_org_full_name: Chef Lab
    username: jtonello
    full_name: John Tonello
    email: jtonello@example.com
    password: molecule_test_password
    chef_user_key_file: '{{ username }}.pem'
    chef_org_validator_file: '{{ chef_org_name }}-validator.pem'
    chef_deploy_infra_server_only: false
