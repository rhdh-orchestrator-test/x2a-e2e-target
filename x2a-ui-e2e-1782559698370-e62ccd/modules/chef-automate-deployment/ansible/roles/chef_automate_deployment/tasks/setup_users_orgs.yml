---
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_key_file }}"
    - "{{ chef_org_validator_file }}"
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_user_key_file }}

      '
  args:
    creates: "{{ chef_user_key_file }}"
  register: create_user_result
  changed_when: create_user_result.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_full_name }}" --association_user {{ username }} --filename {{ chef_org_validator_file }}

      '
  args:
    creates: "{{ chef_org_validator_file }}"
  register: create_org_result
  changed_when: create_org_result.rc == 0
- name: Display user and organization creation results
  ansible.builtin.debug:
    msg:
      - "User creation: {{ 'Success' if create_user_result.rc == 0 else 'Failed or already exists' }}"
      - "Organization creation: {{ 'Success' if create_org_result.rc == 0 else 'Failed or already exists' }}"
