---
argument_specs:
  main:
    short_description: Deploy and configure the FastAPI tutorial application.
    description:
      - Installs the FastAPI application and its Python dependencies.
      - Configures PostgreSQL credentials and manages the application systemd service.
    options:
      fastapi_tutorial_repo_url:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the application.
      fastapi_tutorial_repo_version:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application installation directory.
      fastapi_tutorial_venv_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: User that runs the application service.
      fastapi_tutorial_bind_address:
        type: str
        required: false
        default: 0.0.0.0
        description: Address on which the application listens.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port for the application.
      fastapi_tutorial_database_username:
        type: str
        required: false
        default: "{{ database_username }}"
        description: Database username supplied by the AAP credential.
      fastapi_tutorial_database_password:
        type: str
        required: false
        default: "{{ database_password }}"
        description: Database password supplied by the AAP credential.
      fastapi_tutorial_database_name:
        type: str
        required: false
        default: "{{ database_name }}"
        description: Database name supplied by the AAP credential.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: "{{ database_host }}"
        description: Database host supplied by the AAP credential.
      fastapi_tutorial_database_port:
        type: str
        required: false
        default: "{{ database_port }}"
        description: Database port supplied by the AAP credential.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the database password.
