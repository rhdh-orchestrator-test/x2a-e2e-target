---
- name: Install Memcached package
  ansible.builtin.package:
    name: "{{ cache_memcached_package }}"
    state: present

- name: Create Memcached service group
  ansible.builtin.group:
    name: "{{ cache_memcached_user }}"
    system: true
    state: present

- name: Create Memcached service account
  ansible.builtin.user:
    name: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_user }}"
    system: true
    create_home: false
    home: /nonexistent
    comment: Memcached
    shell: /bin/false
    password_lock: true
    state: present

- name: Create Memcached log directory
  ansible.builtin.file:
    path: "{{ cache_memcached_logfilepath }}" # noqa: R114 - path from role defaults, not user input
    owner: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_user }}"
    mode: "0755"
    state: directory

- name: Create Memcached runtime directory
  ansible.builtin.file:
    path: /var/run/memcached
    owner: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_user }}"
    mode: "0755"
    state: directory
