---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Render Fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  notify: Restart fail2ban

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started

- name: Check UFW current status
  ansible.builtin.command:
    argv: [ufw, status, verbose]
  register: nginx_multisite_ufw_status
  changed_when: false
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default incoming policy  # noqa: L039 - variable is registered by the preceding UFW status task
  ansible.builtin.command:
    argv: [ufw, --force, default, deny]
  when:
    - nginx_multisite_ufw_enabled
    - "'Default: deny (incoming)' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Allow SSH through UFW  # noqa: L039 - variable is registered by the preceding UFW status task
  ansible.builtin.command:
    argv: [ufw, allow, 22/tcp]
  when:
    - nginx_multisite_ufw_enabled
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Allow HTTP through UFW  # noqa: L039 - variable is registered by the preceding UFW status task
  ansible.builtin.command:
    argv: [ufw, allow, 80/tcp]
  when:
    - nginx_multisite_ufw_enabled
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Allow HTTPS through UFW  # noqa: L039 - variable is registered by the preceding UFW status task
  ansible.builtin.command:
    argv: [ufw, allow, 443/tcp]
  when:
    - nginx_multisite_ufw_enabled
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Enable UFW  # noqa: L039 - variable is registered by the preceding UFW status task
  ansible.builtin.command:
    argv: [ufw, --force, enable]
  when:
    - nginx_multisite_ufw_enabled
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Render kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx_multisite sysctl

- name: Set SSH root login policy
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    state: present
    create: false
  when: nginx_multisite_disable_root_login | bool
  notify: Restart sshd

- name: Set SSH password authentication policy
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    state: present
    create: false
  when: not nginx_multisite_password_auth | bool
  notify: Restart sshd
