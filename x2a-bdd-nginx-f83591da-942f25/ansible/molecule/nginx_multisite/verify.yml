---
# Unsupported: journal output, reload history, the unidentified third site-directory path,
# and configuration contents without explicit expected values are not asserted.
- name: Verify nginx-multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify Nginx and Fail2ban are active
      ansible.builtin.assert:
        that:
          - ansible_facts['services'][item_service]['state'] == 'running'
      loop:
        - nginx.service
        - fail2ban.service
      loop_control:
        loop_var: item_service

    - name: Verify an SSH service is active
      ansible.builtin.assert:
        that:
          - >-
            ('ssh.service' in ansible_facts['services'] and
            ansible_facts['services']['ssh.service']['state'] == 'running') or
            ('sshd.service' in ansible_facts['services'] and
            ansible_facts['services']['sshd.service']['state'] == 'running')

    - name: Check required files
      ansible.builtin.stat:
        path: "{{ item_file_path }}"
      register: required_files
      loop:
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_file_path

    - name: Verify required files exist
      ansible.builtin.assert:
        that:
          - item_file_result['stat']['exists']
      loop: "{{ required_files['results'] }}"
      loop_control:
        loop_var: item_file_result

    - name: Check document roots and static files
      ansible.builtin.stat:
        path: "{{ item_site_entry['path'] }}"
      register: site_attributes
      loop:
        - path: /opt/server/test
          owner: nginx
          group: nginx
          mode: '0755'
        - path: /opt/server/test/index.html
          owner: nginx
          group: nginx
          mode: '0644'
        - path: /opt/server/ci
          owner: nginx
          group: nginx
          mode: '0755'
        - path: /opt/server/ci/index.html
          owner: nginx
          group: nginx
          mode: '0644'
        - path: /opt/server/status
          owner: nginx
          group: nginx
          mode: '0755'
        - path: /opt/server/status/index.html
          owner: nginx
          group: nginx
          mode: '0644'
      loop_control:
        loop_var: item_site_entry

    - name: Verify document root and static file attributes
      ansible.builtin.assert:
        that:
          - item_site_result['stat']['pw_name'] == item_site_result['item']['owner']
          - item_site_result['stat']['gr_name'] == item_site_result['item']['group']
          - item_site_result['stat']['mode'] == item_site_result['item']['mode']
      loop: "{{ site_attributes['results'] }}"
      loop_control:
        loop_var: item_site_result

    - name: Check private key attributes
      ansible.builtin.stat:
        path: "{{ item_key_path }}"
      register: private_keys
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key_path

    - name: Verify private key attributes
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['pw_name'] == 'root'
          - item_key_result['stat']['gr_name'] == 'ssl-cert'
          - item_key_result['stat']['mode'] == '0640'
      loop: "{{ private_keys['results'] }}"
      loop_control:
        loop_var: item_key_result

    - name: Check certificate common names
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
      register: certificate_subjects
      changed_when: false
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          name: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          name: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          name: status.cluster.local
      loop_control:
        loop_var: item_certificate

    - name: Verify certificate common names
      ansible.builtin.assert:
        that:
          - "item_certificate_subject['item']['name'] in item_certificate_subject['stdout']"
      loop: "{{ certificate_subjects['results'] }}"
      loop_control:
        loop_var: item_certificate_subject

    - name: Check enabled site symlink targets
      ansible.builtin.stat:
        path: "{{ item_link['path'] }}"
        follow: false
      register: enabled_sites
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_link

    - name: Verify enabled site symlink targets
      ansible.builtin.assert:
        that:
          - item_enabled_site['stat']['islnk']
          - item_enabled_site['stat']['lnk_source'] == item_enabled_site['item']['target']
      loop: "{{ enabled_sites['results'] }}"
      loop_control:
        loop_var: item_enabled_site

    - name: Verify the default site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert the default site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']

    - name: Check firewall status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: firewall_status
      changed_when: false

    - name: Verify firewall policy and allowed ports
      ansible.builtin.assert:
        that:
          - "'Status: active' in firewall_status['stdout']"
          - "'Default: deny (incoming)' in firewall_status['stdout']"
          - "'22/tcp' in firewall_status['stdout']"
          - "'80/tcp' in firewall_status['stdout']"
          - "'443/tcp' in firewall_status['stdout']"

    - name: Validate Nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false

    - name: Validate the security sysctl configuration
      ansible.builtin.command:
        argv:
          - sysctl
          - -p
          - /etc/sysctl.d/99-security.conf
      changed_when: false

    - name: Verify SSH hardening settings
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: ssh_configuration

    - name: Assert SSH hardening settings are present
      ansible.builtin.assert:
        that:
          - ssh_configuration['content'] | b64decode is search('(?m)^\\s*PermitRootLogin\\s+no\\s*$')
          - ssh_configuration['content'] | b64decode is search('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')

    - name: Verify required listening sockets
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listening_port }}"
        state: started
        timeout: 5
      loop:
        - 22
        - 80
        - 443
      loop_control:
        loop_var: item_listening_port
