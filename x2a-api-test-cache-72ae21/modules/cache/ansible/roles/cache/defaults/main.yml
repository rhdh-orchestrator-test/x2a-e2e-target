---
# Cache role defaults
# Redis configuration
cache_redis_port: 6379
cache_redis_log_dir: /var/log/redis
cache_redis_config_file: /etc/redis/6379.conf
# Memcached configuration (uses system defaults)
cache_memcached_enabled: true
# Redis replica settings to remove (configuration cleanup)
cache_redis_replica_settings_to_remove:
  - replica-serve-stale-data
  - replica-read-only
  - repl-ping-replica-period
  - client-output-buffer-limit
  - replica-priority
