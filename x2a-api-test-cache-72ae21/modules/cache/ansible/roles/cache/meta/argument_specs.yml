---
argument_specs:
  main:
    short_description: Install and configure memcached and Redis caching services
    description:
      - Installs and configures memcached service with default settings
      - Installs and configures Redis server with authentication
      - Creates Redis log directory with proper permissions
      - Removes replica-related configuration settings from Redis config
      - Starts and enables both caching services
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for Redis server to listen on
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory path for Redis log files
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to Redis configuration file
      cache_memcached_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and enable memcached service
      cache_redis_replica_settings_to_remove:
        type: list
        elements: str
        required: false
        default:
          - replica-serve-stale-data
          - replica-read-only
          - repl-ping-replica-period
          - client-output-buffer-limit
          - replica-priority
        description: List of Redis replica configuration settings to remove from config file
      redis_password:
        type: str
        required: true
        description: Redis authentication password (injected by AAP credential type)
