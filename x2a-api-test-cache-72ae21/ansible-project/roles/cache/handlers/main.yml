---
# Cache role handlers

- name: Restart memcached
  ansible.builtin.service:
    name: memcached
    state: restarted

- name: Restart redis
  ansible.builtin.service:
    name: redis-server
    state: restarted

- name: Reload redis config
  ansible.builtin.service:
    name: redis-server
    state: reloaded
