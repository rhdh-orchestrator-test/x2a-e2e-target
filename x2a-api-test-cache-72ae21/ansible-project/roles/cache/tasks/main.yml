---
# Cache role main tasks

- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install memcached package
  ansible.builtin.package:
    name: memcached
    state: present

- name: Start and enable memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true

- name: Install Redis packages
  ansible.builtin.package:
    name:
      - redis-server
      - redis-tools
    state: present

- name: Create redis group
  ansible.builtin.group:
    name: redis
    system: true
    state: present

- name: Create redis user
  ansible.builtin.user:
    name: redis
    group: redis
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present

- name: Create Redis configuration directory
  ansible.builtin.file:
    path: /etc/redis
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create Redis runtime directory
  ansible.builtin.file:
    path: /var/run/redis
    owner: redis
    group: redis
    mode: "0755"
    state: directory

- name: Create Redis log directory # noqa: R114 - path from role defaults
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}"
    owner: redis
    group: redis
    mode: "0755"
    state: directory

- name: Create Redis data directory # noqa: R114 - path from role defaults
  ansible.builtin.file:
    path: "/var/lib/redis/{{ cache_redis_port }}"
    owner: redis
    group: redis
    mode: "0755"
    state: directory

- name: Create Redis configuration file # noqa: R114 - path from role defaults
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}"
    owner: redis
    group: redis
    mode: "0640"
    backup: true
  notify: Restart redis

- name: Remove replica-related settings from Redis config # noqa: R114 - path from role defaults # noqa: R115 - path from role defaults
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}"
    regexp: ^{{ item_setting }}.*$
    state: absent
    backup: true
  loop: "{{ cache_redis_replica_settings_to_remove }}"
  loop_control:
    loop_var: item_setting
  notify: Reload redis config

- name: Start and enable Redis service
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
