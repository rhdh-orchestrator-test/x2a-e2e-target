---
apache_version: 2.4.41-4ubuntu3.10
apache_packages:
  - curl
  - openssl
  - python3-openssl
cert_dir: /etc/apache2/certs
cert_key_path: "{{ cert_dir }}/apache.key"
cert_csr_path: "{{ cert_dir }}/apache.csr"
cert_path: "{{ cert_dir }}/apache.crt"
cert_common_name: myhost
website_dir: /var/www/helloworld
website_conf_path: /etc/apache2/sites-available/helloworld.conf
conftext: '<VirtualHost *:443> DocumentRoot "/var/www/helloworld" SSLEngine on SSLCertificateFile /etc/apache2/certs/apache.crt SSLCertificateKeyFile /etc/apache2/certs/apache.key   <Directory
  "/var/www/helloworld"> allow from all Options None Require all granted </Directory> </VirtualHost> '
webtext: <html> <head><title>Test Site</title></head> <body> <h1>Hello, world!</h1> <p>The site is up and running</p> </body> </html>
