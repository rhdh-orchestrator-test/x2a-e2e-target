---
- name: Verify SSH configuration
  hosts: all
  gather_facts: false
  tasks:
    # Create mock SSH config for testing
    - name: Create SSH config directory
      ansible.builtin.file:
        path: /tmp/molecule_test/etc/ssh
        state: directory
        mode: "0755"

    - name: Create mock SSH config file
      ansible.builtin.copy:
        content: |
          # Mock SSH config for testing
          PermitRootLogin no
          Protocol 2
          HostbasedAuthentication no
          IgnoreRhosts yes
          PermitEmptyPasswords no
          PasswordAuthentication yes
          ChallengeResponseAuthentication no
          KerberosAuthentication no
          GSSAPIAuthentication yes
          X11Forwarding no
          Banner /etc/issue.net
        dest: /tmp/molecule_test/etc/ssh/sshd_config
        mode: "0644"

    # Verify SSH configuration
    - name: Check SSH config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_config

    - name: Assert SSH config file exists
      ansible.builtin.assert:
        that:
          - ssh_config.stat.exists
          - ssh_config.stat.size > 0
        fail_msg: "SSH config file not found"
        success_msg: "SSH config file exists"

    - name: Get SSH config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_content
      when: ssh_config.stat.exists

    - name: Assert root login is disabled
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (ssh_content.content | b64decode)"
        fail_msg: "Root login is not disabled in SSH config"
        success_msg: "Root login is disabled in SSH config"
      when: ssh_config.stat.exists

    # The following checks cannot run in a container environment
    # They are tagged with molecule-notest to be skipped during molecule testing

    - name: Check SSH service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert SSH service is running
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
          - "ansible_facts.services['sshd.service'].state == 'running'"
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"
      tags: molecule-notest