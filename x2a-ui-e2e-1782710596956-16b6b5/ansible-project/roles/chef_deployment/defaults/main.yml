---
chef_hostname: automate.chef.lab
chef_vm_max_map_count: 262144
chef_vm_dirty_expire_centisecs: 20000
chef_deploy_automate: true
chef_accept_terms_and_mlsa: true
chef_automate_cli_path: "{{ ansible_env.HOME }}/chef-automate"
chef_user_pem_path: "{{ ansible_env.HOME }}/{{ username }}.pem"
chef_org_validator_pem_path: "{{ ansible_env.HOME }}/{{ organization_name }}-validator.pem"
