---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    # Define required credential variables
    username: jtonello
    user_email: jtonello@example.com
    user_password: molecule_test_password
    organization_name: lab
    longorgname: "Chef Lab"
    # Define other required variables
    chef_hostname: automate.chef.lab
    chef_vm_max_map_count: 262144
    chef_vm_dirty_expire_centisecs: 20000
    chef_deploy_automate: true
    chef_accept_terms_and_mlsa: true
    chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
    chef_automate_cli_path: "/tmp/molecule_test/chef-automate"
    chef_user_pem_path: "/tmp/molecule_test/jtonello.pem"
    chef_org_validator_pem_path: "/tmp/molecule_test/lab-validator.pem"

  tasks:
    - name: Create necessary directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_hostname }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl parameters
    - name: Create sysctl parameter files
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "/tmp/molecule_test/etc/{{ item.name }}"
        mode: "0644"
      loop:
        - name: vm_max_map_count
          value: "{{ chef_vm_max_map_count }}"
        - name: vm_dirty_expire_centisecs
          value: "{{ chef_vm_dirty_expire_centisecs }}"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI Mock'"
        dest: "{{ chef_automate_cli_path }}"
        mode: "0755"

    # Simulate Chef user PEM file
    - name: Create Chef user PEM file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK PEM CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: "{{ chef_user_pem_path }}"
        mode: "0600"

    # Simulate Chef organization validator PEM file
    - name: Create Chef organization validator PEM file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK VALIDATOR PEM CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: "{{ chef_org_validator_pem_path }}"
        mode: "0600"

    # Simulate Chef Automate status output file
    - name: Create Chef Automate status output file
      ansible.builtin.copy:
        content: "Service: chef-automate\nStatus: running"
        dest: "/tmp/molecule_test/chef-automate-status"
        mode: "0644"

    # Simulate Chef Server status output file
    - name: Create Chef Server status output file
      ansible.builtin.copy:
        content: "Service: chef-server\nStatus: running"
        dest: "/tmp/molecule_test/chef-server-status"
        mode: "0644"

    # Simulate Chef user list output file
    - name: Create Chef user list output file
      ansible.builtin.copy:
        content: "jtonello"
        dest: "/tmp/molecule_test/chef-user-list"
        mode: "0644"

    # Simulate Chef organization list output file
    - name: Create Chef organization list output file
      ansible.builtin.copy:
        content: "lab"
        dest: "/tmp/molecule_test/chef-org-list"
        mode: "0644"