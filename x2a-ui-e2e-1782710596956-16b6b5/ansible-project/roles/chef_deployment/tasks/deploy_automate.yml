---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_hostname }}"
  become: true
- name: Set vm.max_map_count sysctl parameter
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ chef_vm_max_map_count }}"
    state: present
    reload: true
  become: true
- name: Set vm.dirty_expire_centisecs sysctl parameter
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ chef_vm_dirty_expire_centisecs }}"
    state: present
    reload: true
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: automate_cli_stat
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }} && chmod +x {{ chef_automate_cli_path }}
  args:
    creates: "{{ chef_automate_cli_path }}"
  when: not automate_cli_stat.stat.exists
  changed_when: true
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_accept_terms_and_mlsa | lower }}
    chdir: "{{ ansible_env.HOME }}"
  become: true
  args:
    creates: /hab
  register: deploy_result
  changed_when: deploy_result.rc == 0 and not deploy_result.stdout is search("already exists")
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ username }} {{ user_email }} {{ user_password }} --filename {{ chef_user_pem_path }}
  become: true
  args:
    creates: "{{ chef_user_pem_path }}"
  register: user_result
  changed_when: user_result.rc == 0 and not user_result.stdout is search("already exists")
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ organization_name }} "{{ longorgname }}" --association_user {{ username }} --filename {{ chef_org_validator_pem_path }}
  become: true
  args:
    creates: "{{ chef_org_validator_pem_path }}"
  register: org_result
  changed_when: org_result.rc == 0 and not org_result.stdout is search("already exists")
