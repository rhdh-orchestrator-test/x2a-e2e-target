---
- name: Restart chef-server
  ansible.builtin.command:
    cmd: chef-server-ctl restart
  become: true
  listen: restart chef services
  changed_when: false
  when: ansible_facts.services is defined and 'chef-server' in ansible_facts.services
- name: Restart chef-automate
  ansible.builtin.command:
    cmd: chef-automate restart
  become: true
  listen: restart chef services
  changed_when: false
  when: ansible_facts.services is defined and 'chef-automate' in ansible_facts.services
