---
argument_specs:
  main:
    short_description: Simple cache cookbook - local dependency for testing
    description:
      - Installs and configures Redis server as a simple cache solution.
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port the Redis server listens on.
      cache_redis_bind_address:
        type: str
        required: false
        default: 127.0.0.1
        description: IP address Redis server binds to.
      cache_redis_package_name:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis server package.
      cache_redis_service_name:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis server service.
      cache_redis_enabled:
        type: bool
        required: false
        default: true
        description: Whether to enable the Redis server service.
