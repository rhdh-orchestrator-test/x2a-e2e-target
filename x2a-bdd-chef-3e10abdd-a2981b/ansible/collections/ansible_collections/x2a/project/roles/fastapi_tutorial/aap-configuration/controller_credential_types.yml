---
controller_credential_types:
  - name: PostgreSQL FastAPI Application Database
    description: Credentials used to create and access the FastAPI application's local PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application; the source value is fastapi.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL role; the source value is hardcoded as fastapi_password and must be rotated.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application; the source value is fastapi_db.
        - id: db_host
          type: string
          label: Database Host
          help_text: PostgreSQL host used in the application connection string; the source value is localhost.
      required:
        - db_username
        - db_password
        - database_name
        - db_host
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        db_host: !unsafe "{{ db_host }}"
