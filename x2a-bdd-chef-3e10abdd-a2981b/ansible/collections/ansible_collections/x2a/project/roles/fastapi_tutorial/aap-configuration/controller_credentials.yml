---
controller_credentials:
  - name: PostgreSQL FastAPI Application Database - fastapi_tutorial
    description: Credentials used to create and access the FastAPI application's local PostgreSQL database.
    organization: Default
    credential_type: PostgreSQL FastAPI Application Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      database_name: "{{ database_name }}"
      db_host: "{{ db_host }}"
