---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize FastAPI repository  # noqa: R104,R106 - repository source is a role default controlled by the operator and defaults to an HTTPS URL
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - destination is a role default controlled by the operator
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - command arguments come from role defaults controlled by the operator
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path is a role default controlled by the operator

- name: Install Python dependencies  # noqa: R113 - virtualenv target comes from a role default controlled by the operator
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - path is under the role-defined application directory
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path is a role default controlled by the operator
    virtualenv_command: python3 -m venv

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL application role  # noqa: L039,R101,R108 - credentials are validated by the prior task and supplied by the job credential; the command uses validated variables; PostgreSQL role creation requires the postgres system user
  ansible.builtin.shell:
    cmd: >-
      if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}'" | grep -q '^1$'; then
      psql -v ON_ERROR_STOP=1 -c "CREATE USER {{ db_username }} WITH PASSWORD '{{ db_password }}';";
      fi
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL application database  # noqa: L039,R101,R108 - credentials are validated by the prior task and supplied by the job credential; the command uses validated variables; database creation requires the postgres system user
  ansible.builtin.shell:
    cmd: >-
      if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'" | grep -q '^1$'; then
      psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE {{ database_name }} OWNER {{ db_username }};";
      fi
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant PostgreSQL database privileges  # noqa: L039,R101,R108 - credentials are validated by the prior task and supplied by the job credential; the command uses validated variables; privilege management requires the postgres system user
  ansible.builtin.shell:
    cmd: >-
      psql -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ db_username }};"
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write application environment file  # noqa: L039 - database settings are validated by the prior task and supplied by the job credential
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}/{{ database_name }}
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path is under the role-defined application directory
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn {{ fastapi_tutorial_app_module }} --host {{ fastapi_tutorial_bind_address }} --port {{ fastapi_tutorial_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - unit path is a role default controlled by the operator
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Enable and start FastAPI service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    daemon_reload: true
    enabled: true
    state: started
