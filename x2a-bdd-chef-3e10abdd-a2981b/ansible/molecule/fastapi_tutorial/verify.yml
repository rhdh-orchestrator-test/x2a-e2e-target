---
# Unsupported pre-flight checks: PostgreSQL listener settings have no stated expected
# value; log inspection has no machine-checkable expected result; and the post-change
# daemon-reload procedure cannot be exercised without changing the deployed system.
# The privilege details in the interactive `\\l+` diagnostic likewise have no stated
# expected result beyond the database connection check.

- name: Verify fastapi-tutorial pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Check PostgreSQL service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - postgresql
      register: item_postgresql_active
      changed_when: false
      failed_when: false

    - name: Assert PostgreSQL service is active
      ansible.builtin.assert:
        that:
          - item_postgresql_active['rc'] == 0
          - item_postgresql_active['stdout'] == 'active'
        quiet: true

    - name: Check PostgreSQL service is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - postgresql
      register: item_postgresql_enabled
      changed_when: false
      failed_when: false

    - name: Assert PostgreSQL service is enabled
      ansible.builtin.assert:
        that:
          - item_postgresql_enabled['rc'] == 0
          - item_postgresql_enabled['stdout'] in ['enabled', 'static']
        quiet: true

    - name: Check FastAPI service status
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - fastapi-tutorial
      register: item_fastapi_active
      changed_when: false
      failed_when: false

    - name: Assert FastAPI service is active
      ansible.builtin.assert:
        that:
          - item_fastapi_active['rc'] == 0
          - item_fastapi_active['stdout'] == 'active'
        quiet: true

    - name: Check FastAPI service is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - fastapi-tutorial
      register: item_fastapi_enabled
      changed_when: false
      failed_when: false

    - name: Assert FastAPI service is enabled
      ansible.builtin.assert:
        that:
          - item_fastapi_enabled['rc'] == 0
          - item_fastapi_enabled['stdout'] in ['enabled', 'static']
        quiet: true

    - name: Inspect application directory
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: app_directory

    - name: Assert application directory ownership and mode
      ansible.builtin.assert:
        that:
          - app_directory['stat']['exists']
          - app_directory['stat']['isdir']
          - app_directory['stat']['pw_name'] == 'root'
          - app_directory['stat']['gr_name'] == 'root'
          - app_directory['stat']['mode'] == '0755'
        quiet: true

    - name: Inspect virtual environment and executable files
      ansible.builtin.stat:
        path: "{{ item_fastapi_path['path'] }}"
      loop:
        - path: /opt/fastapi-tutorial/venv
        - path: /opt/fastapi-tutorial/venv/bin/python
        - path: /opt/fastapi-tutorial/venv/bin/pip
        - path: /opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_fastapi_path
      register: fastapi_paths

    - name: Assert virtual environment and executables are available
      ansible.builtin.assert:
        that:
          - item_fastapi_path_result['stat']['exists']
          - >-
            (item_fastapi_path_result['item']['path'] == '/opt/fastapi-tutorial/venv') or
            item_fastapi_path_result['stat']['executable']
        loop: "{{ fastapi_paths['results'] }}"
        loop_control:
          loop_var: item_fastapi_path_result
        quiet: true

    - name: Inspect repository remote
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - remote
          - -v
      register: repository_remote
      changed_when: false

    - name: Assert repository points to the expected remote
      ansible.builtin.assert:
        that:
          - repository_remote['stdout'] is search('https://github\\.com/dibanez/fastapi_tutorial\\.git')
        quiet: true

    - name: Inspect checked-out repository revision
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - rev-parse
          - --abbrev-ref
          - HEAD
      register: repository_revision
      changed_when: false

    - name: Assert repository revision is main
      ansible.builtin.assert:
        that:
          - repository_revision['stdout'] == 'main'
        quiet: true

    - name: Inspect requirements file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/requirements.txt
      register: requirements_file

    - name: Assert requirements file exists
      ansible.builtin.assert:
        that:
          - requirements_file['stat']['exists']
          - requirements_file['stat']['isreg']
        quiet: true

    - name: Check PostgreSQL role and database objects
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv: "{{ item_database_check['argv'] }}"
      loop:
        - name: role
          argv:
            - psql
            - -tAc
            - SELECT rolname FROM pg_roles WHERE rolname = 'fastapi';
        - name: database
          argv:
            - psql
            - -tAc
            - SELECT datname, pg_catalog.pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'fastapi_db';
        - name: connection
          argv:
            - psql
            - -d
            - fastapi_db
            - -tAc
            - SELECT current_database(), current_user;
      loop_control:
        loop_var: item_database_check
      register: database_checks
      changed_when: false

    - name: Assert PostgreSQL role and database checks succeeded
      ansible.builtin.assert:
        that:
          - item_database_result['rc'] == 0
          - >-
            (item_database_result['item']['name'] == 'role' and
            item_database_result['stdout'] is search('(^|\\n)\\s*fastapi\\s*($|\\n)')) or
            (item_database_result['item']['name'] == 'database' and
            item_database_result['stdout'] is search('fastapi_db\\s*\\|\\s*fastapi')) or
            (item_database_result['item']['name'] == 'connection' and
            item_database_result['stdout'] is search('fastapi_db\\s*\\|\\s*fastapi'))
        loop: "{{ database_checks['results'] }}"
        loop_control:
          loop_var: item_database_result
        quiet: true

    - name: Inspect application environment settings without exposing the password
      ansible.builtin.command:
        argv:
          - awk
          - >-
            { if ($0 ~ /^DATABASE_URL=/) { sub(/postgresql:\/\/fastapi:[^@]+@/, "postgresql://fastapi:REDACTED@"); } print }
          - /opt/fastapi-tutorial/.env
      register: application_environment
      changed_when: false

    - name: Assert application environment settings
      ansible.builtin.assert:
        that:
          - application_environment['stdout'] is search('^PROJECT_NAME="FastAPI Tutorial"$', multiline=true)
          - application_environment['stdout'] is search('^API_VERSION=1\\.0\\.0$', multiline=true)
          - application_environment['stdout'] is search('^DATABASE_URL=postgresql://fastapi:REDACTED@localhost/fastapi_db$', multiline=true)
        quiet: true

    - name: Validate the FastAPI systemd unit
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/fastapi-tutorial.service
      register: systemd_unit_validation
      changed_when: false

    - name: Assert the FastAPI systemd unit is valid
      ansible.builtin.assert:
        that:
          - systemd_unit_validation['rc'] == 0
        quiet: true

    - name: Inspect FastAPI systemd service configuration
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - fastapi-tutorial
          - -p
          - User
          - -p
          - WorkingDirectory
          - -p
          - ExecStart
          - -p
          - Restart
      register: systemd_service_configuration
      changed_when: false

    - name: Assert FastAPI systemd service configuration
      ansible.builtin.assert:
        that:
          - systemd_service_configuration['stdout'] is search('User=root')
          - systemd_service_configuration['stdout'] is search('WorkingDirectory=/opt/fastapi-tutorial')
          - systemd_service_configuration['stdout'] is search('/opt/fastapi-tutorial/venv/bin/uvicorn')
          - systemd_service_configuration['stdout'] is search('app.main:app')
          - systemd_service_configuration['stdout'] is search('--host 0.0.0.0')
          - systemd_service_configuration['stdout'] is search('--port 8000')
          - systemd_service_configuration['stdout'] is search('Restart=always')
        quiet: true

    - name: Check the FastAPI HTTP root endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/
        method: GET
        return_content: false
        use_proxy: false
        status_code: "{{ range(100, 600) | list }}"
      register: fastapi_http_endpoint

    - name: Assert the FastAPI endpoint returned an HTTP response
      ansible.builtin.assert:
        that:
          - fastapi_http_endpoint['status'] | int >= 100
          - fastapi_http_endpoint['status'] | int < 600
        quiet: true

    - name: Inspect the FastAPI listening port
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: fastapi_listening_ports
      changed_when: false

    - name: Assert FastAPI listens on port 8000 with a wildcard address
      ansible.builtin.assert:
        that:
          - >-
            '0.0.0.0:8000' in fastapi_listening_ports['stdout'] or
            ':::8000' in fastapi_listening_ports['stdout'] or
            '*:8000' in fastapi_listening_ports['stdout']
        quiet: true
