---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create directory structure for Chef Automate
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/opscode
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/opscode
        - /tmp/molecule_test/usr/bin

    # Simulate system configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    - name: Create sysctl configuration file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Simulate Chef Automate CLI installation
    - name: Create Chef Automate CLI binary
      ansible.builtin.copy:
        content: "#!/bin/sh\necho 'Chef Automate CLI mock'\n"
        dest: /tmp/molecule_test/usr/bin/chef-automate
        mode: "0755"

    # Simulate Chef Automate configuration
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          [global]
            v1 = true
          [deployment]
            products = ["automate", "infra-server"]
          [license]
            acceptance = "accept-terms-and-mlsa"
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"

    # Simulate Chef Server configuration
    - name: Create Chef Server config file
      ansible.builtin.copy:
        content: |
          # Chef Server configuration
          nginx['ssl_port'] = 443
          nginx['enable'] = true
        dest: /tmp/molecule_test/etc/opscode/chef-server.rb
        mode: "0644"

    # Simulate user and organization keys
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK_USER_KEY_CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: /tmp/molecule_test/jtonello.pem
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK_ORG_VALIDATOR_KEY_CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: /tmp/molecule_test/lab-validator.pem
        mode: "0600"

    # Simulate Chef Server user and organization list files
    - name: Create user list file
      ansible.builtin.copy:
        content: "jtonello"
        dest: /tmp/molecule_test/var/opt/opscode/user-list
        mode: "0644"

    - name: Create organization list file
      ansible.builtin.copy:
        content: "lab"
        dest: /tmp/molecule_test/var/opt/opscode/org-list
        mode: "0644"

    # Simulate service status files
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: chef-automate
          Status: running
          PID: 12345
        dest: /tmp/molecule_test/var/opt/chef-automate/status
        mode: "0644"

    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          Service: chef-server
          Status: running
          PID: 12346
        dest: /tmp/molecule_test/var/opt/opscode/status
        mode: "0644"

  vars:
    chef_automate_hostname: automate.chef.lab
    username: jtonello