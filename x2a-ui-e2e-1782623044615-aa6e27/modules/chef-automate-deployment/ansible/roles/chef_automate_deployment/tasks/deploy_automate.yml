---
- name: Check if Chef Automate is already deployed
  ansible.builtin.stat:
    path: /etc/chef-automate/config.toml
  register: automate_config
  become: true
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product {{ chef_automate_products | join(' --product ') }} --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
  async: 3600
  poll: 30
  when: not automate_config.stat.exists
