---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check sysctl configuration file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are set correctly
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count = 262144' in (sysctl_content.content | b64decode)"
          - "'vm.dirty_expire_centisecs = 20000' in (sysctl_content.content | b64decode)"
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI installation check
    - name: Check Chef Automate CLI binary
      ansible.builtin.stat:
        path: /tmp/molecule_test/usr/bin/chef-automate
      register: automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - automate_cli.stat.exists
          - automate_cli.stat.isreg
          - automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate configuration check
    - name: Check Chef Automate config file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: automate_config

    - name: Assert Chef Automate config exists
      ansible.builtin.assert:
        that:
          - automate_config.stat.exists
          - automate_config.stat.isreg
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    # Chef Server configuration check
    - name: Check Chef Server config directory
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/opscode
      register: opscode_dir

    - name: Assert Chef Server config directory exists
      ansible.builtin.assert:
        that:
          - opscode_dir.stat.exists
          - opscode_dir.stat.isdir
        fail_msg: "Chef Server config directory not found"
        success_msg: "Chef Server config directory exists"

    - name: Check Chef Server config file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/opscode/chef-server.rb
      register: chef_server_config

    - name: Assert Chef Server config file exists
      ansible.builtin.assert:
        that:
          - chef_server_config.stat.exists
          - chef_server_config.stat.isreg
        fail_msg: "Chef Server config file not found"
        success_msg: "Chef Server config file exists"

    # User and organization key checks
    - name: Check user key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_key

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key.stat.exists
          - user_key.stat.isreg
          - user_key.stat.mode == "0600"
        fail_msg: "User key file not found or has incorrect permissions"
        success_msg: "User key file exists with correct permissions"

    - name: Check organization validator key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_key

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_key.stat.exists
          - org_key.stat.isreg
          - org_key.stat.mode == "0600"
        fail_msg: "Organization validator key file not found or has incorrect permissions"
        success_msg: "Organization validator key file exists with correct permissions"

    # User and organization list checks
    - name: Check user list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/opscode/user-list
      register: user_list

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/opscode/user-list
      register: user_list_content
      when: user_list.stat.exists

    - name: Assert user was created
      ansible.builtin.assert:
        that:
          - "'jtonello' in (user_list_content.content | b64decode)"
        fail_msg: "User jtonello not found in user list"
        success_msg: "User jtonello found in user list"
      when: user_list.stat.exists

    - name: Check organization list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/opscode/org-list
      register: org_list

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/opscode/org-list
      register: org_list_content
      when: org_list.stat.exists

    - name: Assert organization was created
      ansible.builtin.assert:
        that:
          - "'lab' in (org_list_content.content | b64decode)"
        fail_msg: "Organization lab not found in organization list"
        success_msg: "Organization lab found in organization list"
      when: org_list.stat.exists

    # Service status checks (these would normally be skipped in a container)
    - name: Check Chef Automate service status
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-automate/status
      register: automate_status
      tags: molecule-notest

    - name: Get Chef Automate status content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef-automate/status
      register: automate_status_content
      when: automate_status.stat.exists
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - "'Status: running' in (automate_status_content.content | b64decode)"
        fail_msg: "Chef Automate service not running"
        success_msg: "Chef Automate service is running"
      when: automate_status.stat.exists
      tags: molecule-notest

    - name: Check Chef Server service status
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/opscode/status
      register: chef_server_status
      tags: molecule-notest

    - name: Get Chef Server status content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/opscode/status
      register: chef_server_status_content
      when: chef_server_status.stat.exists
      tags: molecule-notest

    - name: Assert Chef Server service is running
      ansible.builtin.assert:
        that:
          - "'Status: running' in (chef_server_status_content.content | b64decode)"
        fail_msg: "Chef Server service not running"
        success_msg: "Chef Server service is running"
      when: chef_server_status.stat.exists
      tags: molecule-notest

    # Network port checks (would be skipped in a container)
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest