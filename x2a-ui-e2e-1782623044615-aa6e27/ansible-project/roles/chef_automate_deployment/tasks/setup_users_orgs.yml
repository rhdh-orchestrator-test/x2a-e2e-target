---
- name: Check if user key file exists
  ansible.builtin.stat:
    path: "{{ chef_user_key_path }}"
  register: user_key_file
  become: true
- name: Create Chef Server admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ chef_user_key_path }}
  become: true
  register: user_create_result
  changed_when: user_create_result.rc == 0
  no_log: true
  when: not user_key_file.stat.exists
- name: Check if organization validator key file exists
  ansible.builtin.stat:
    path: "{{ chef_org_validator_key_path }}"
  register: org_validator_key_file
  become: true
- name: Create Chef Server organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_full_name }}" --association_user {{ username }} --filename {{ chef_org_validator_key_path
      }}
  become: true
  register: org_create_result
  changed_when: org_create_result.rc == 0
  when: not org_validator_key_file.stat.exists
