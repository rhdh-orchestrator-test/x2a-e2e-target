---
- name: Install required packages for Chef Automate
  ansible.builtin.package:
    name:
      - curl
      - tar
      - unzip
      - jq
    state: present
  become: true
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters for Chef Automate
  community.general.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ chef_automate_kernel_params | dict2items }}"
  become: true
