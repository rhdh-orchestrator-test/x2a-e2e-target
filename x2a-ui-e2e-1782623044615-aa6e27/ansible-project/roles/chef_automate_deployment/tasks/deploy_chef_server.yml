---
- name: Check if Chef Infra Server is already deployed
  ansible.builtin.stat:
    path: /etc/opscode/chef-server.rb
  register: chef_server_config
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
  async: 3600
  poll: 30
  when: not chef_server_config.stat.exists
