---
- name: Render systemd unit
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/{{ app_name }}.service # noqa: R114 - service filename from role-defined app name
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload systemd
    - Restart application service

- name: Ensure application service is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ app_name }}"
    daemon_reload: true
    enabled: true
    state: started