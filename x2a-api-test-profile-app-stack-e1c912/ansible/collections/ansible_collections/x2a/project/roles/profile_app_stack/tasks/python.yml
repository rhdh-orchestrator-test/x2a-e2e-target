---
- name: Install Python runtime and build packages
  ansible.builtin.package:
    name:
      - "{{ python_version }}"
      - "{{ python_version }}-pip"
      - "{{ python_version }}-venv"
      - "{{ python_version }}-dev"
      - git
      - build-essential
      - curl
      - logrotate
    state: present

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true
    state: present

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    home: "{{ app_dir }}" # noqa: R114 - path from role defaults and trusted inventory configuration
    shell: /bin/bash
    system: true
    create_home: false
    state: present

- name: Create application log directory
  ansible.builtin.file:
    path: "{{ log_dir }}" # noqa: R114 - path from role defaults and trusted inventory configuration
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}" # noqa: R114 - path from role defaults and trusted inventory configuration
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Install optional Python packages # noqa: R113 - optional package list is an intentional role input
  ansible.builtin.pip:
    name: "{{ pip_packages }}"
    virtualenv: "{{ app_dir }}/venv" # noqa: R114 - path under role-defined application directory
    virtualenv_command: "{{ python_version }} -m venv"
    state: present
  when: pip_packages | length > 0

- name: Render logrotate configuration
  ansible.builtin.template:
    src: logrotate.conf.j2
    dest: /etc/logrotate.d/{{ app_name }} # noqa: R114 - filename derived from role-defined app name
    owner: root
    group: root
    mode: "0644"
    backup: true
