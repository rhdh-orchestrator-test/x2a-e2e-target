---
controller_credentials:
  - name: HashiCorp Vault Application Secrets - profile_app_stack
    description: Vault-managed secrets used by the test-app application for PostgreSQL authentication and application signing.
    organization: Default
    credential_type: HashiCorp Vault Application Secrets
    update_secrets: true
    inputs:
      db_password: "{{ vault_db_password }}"
      secret_key: "{{ vault_secret_key }}"
