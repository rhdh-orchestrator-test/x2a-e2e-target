---
controller_credential_types:
  - name: HashiCorp Vault Application Secrets
    description: Vault-managed secrets used by the test-app application for PostgreSQL authentication and application signing.
    kind: cloud
    inputs:
      fields:
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL database user used by test-app.
        - id: secret_key
          type: string
          label: Application Secret Key
          secret: true
          help_text: Secret key used by test-app for application security and signing; rendered into the protected application environment file.
      required:
        - db_password
        - secret_key
    injectors:
      extra_vars:
        db_password: !unsafe "{{ db_password }}"
        secret_key: !unsafe "{{ secret_key }}"
