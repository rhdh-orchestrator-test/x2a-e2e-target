---
- name: Check out application repository # noqa: R104 - repository URL is a trusted role input and defaults to HTTPS
  ansible.builtin.git:
    repo: "{{ app_repo }}" # noqa: R106 - repository source is a trusted role input, not untrusted package input
    dest: "{{ app_dir }}" # noqa: R114 - destination is the role-defined application directory
    version: "{{ app_revision }}"
    update: true
    force: true
  notify: Restart application service
  become: true # noqa: R108 - git checkout runs as the application user in its application directory
  become_user: "{{ app_user }}"

- name: Create application virtual environment
  ansible.builtin.command: # noqa: R101 - Python executable and application directory come from trusted role inputs
    argv:
      - "{{ python_version }}"
      - -m
      - venv
      - "{{ app_dir }}/venv"
    creates: "{{ app_dir }}/venv/bin/activate" # noqa: R114 - path under role-defined application directory
  become: true # noqa: R108 - virtual environment is created for the application user
  become_user: "{{ app_user }}"

- name: Install application requirements
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt" # noqa: R113 - requirements file is intentionally supplied by trusted application configuration; R114 - requirements file under role-defined application directory
    virtualenv: "{{ app_dir }}/venv" # noqa: R114 - virtualenv under role-defined application directory
    state: present
  notify: Restart application service
  become: true # noqa: R108 - packages are installed into the application user's virtualenv
  become_user: "{{ app_user }}"

- name: Install optional application packages
  ansible.builtin.pip:
    name: "{{ pip_packages }}" # noqa: R113 - optional package list is an intentional role input
    virtualenv: "{{ app_dir }}/venv" # noqa: R114 - virtualenv under role-defined application directory
    state: present
  when: pip_packages | length > 0
  notify: Restart application service
  become: true # noqa: R108 - packages are installed into the application user's virtualenv
  become_user: "{{ app_user }}"

- name: Render application environment
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dir }}/.env" # noqa: R114 - path under role-defined application directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
    backup: true
  notify: Restart application service
  no_log: "{{ profile_app_stack_secure_logging }}"
  vars:
    db_url: postgresql://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/{{ db_name }}

- name: Install application health-check script
  ansible.builtin.copy:
    src: app-healthcheck.sh
    dest: /usr/local/bin/app-healthcheck.sh
    owner: root
    group: root
    mode: "0755"
    backup: true

- name: Check whether database migration configuration exists
  ansible.builtin.stat:
    path: "{{ app_dir }}/migrations/env.py" # noqa: R114 - path under role-defined application directory
  register: profile_app_stack_migration_config

- name: Run database migrations when migration config exists # noqa: no-changed-when - migration intentionally reports its execution as changed
  ansible.builtin.command: # noqa: R101 - migration executable and working directory come from trusted role inputs
    argv:
      - "{{ app_dir }}/venv/bin/python"
      - -m
      - alembic
      - upgrade
      - head
    chdir: "{{ app_dir }}" # noqa: R114 - working directory from role-defined application directory
  when: profile_app_stack_migration_config.stat.exists # noqa: L039 - migration config is registered above
  become: true # noqa: R108 - migration runs as the application user in its application directory
  become_user: "{{ app_user }}"
  no_log: "{{ profile_app_stack_secure_logging }}"
  environment: # noqa: L045 - migration command requires DATABASE_URL in its process environment
    DATABASE_URL: postgresql://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/{{ db_name }} # noqa: L039 - db_password is supplied by role configuration
