---
- name: Install Prometheus monitoring packages in production
  ansible.builtin.package:
    name:
      - prometheus-node-exporter
      - prometheus-pushgateway
    state: present
  when: deployment_environment == 'production'

- name: Enable Prometheus node exporter in production
  ansible.builtin.service:
    name: prometheus-node-exporter
    enabled: true
    state: started
  when: deployment_environment == 'production'

- name: Schedule application metrics push in production
  ansible.builtin.cron:
    name: push_app_metrics
    user: "{{ app_user }}"
    minute: "*/5"
    job: /usr/local/bin/app-healthcheck.sh --push-metrics
  when: deployment_environment == 'production'

- name: Schedule application health check
  ansible.builtin.cron:
    name: app_health_check
    user: root
    minute: "*/2"
    job: /usr/local/bin/app-healthcheck.sh http://localhost:{{ app_port }}/health
