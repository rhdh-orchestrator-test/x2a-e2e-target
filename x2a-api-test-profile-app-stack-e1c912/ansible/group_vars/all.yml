---
# Repository-wide application stack overrides.
app_name: 'test-app'
app_repo: 'file:///tmp/test-app-repo'
app_revision: 'master'
app_port: 8000
app_dir: '/opt/test-app'
app_user: 'appuser'
app_group: 'appuser'
db_host: 'localhost'
db_port: 5432
db_name: 'testdb'
db_user: 'testuser'
worker_count: 2
worker_class: 'sync'
max_requests: 1000
graceful_timeout: 30
log_dir: '/var/log/test-app'
log_level: 'info'
python_version: 'python3'
pip_packages: []
deployment_environment: 'development'
