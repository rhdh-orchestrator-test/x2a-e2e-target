---
# Service discovery for HAProxy backends
# Note: This replaces PuppetDB-based discovery with Ansible dynamic inventory

- name: Generate dynamic backend configuration from inventory
  ansible.builtin.template:
    src: dynamic_backend.conf.j2
    dest: "{{ profile_haproxy_config_dir }}/conf.d/dynamic-{{ item_group }}.cfg"  # noqa: R114 - path from role defaults and loop over role-defined group names, not user input
    owner: root
    group: "{{ profile_haproxy_group }}"
    mode: "0640"
    backup: true
  when:
    - groups[item_group] is defined
    - groups[item_group] | length > 0
  loop:
    - webservers
    - api_servers
  loop_control:
    loop_var: item_group
  notify: restart haproxy
  vars:
    backend_name: dynamic-{{ item_group }}
    balance: roundrobin
    backend_port: "{{ hostvars[groups[item_group][0]]['app_port'] | default('8080') }}"
    servers: "{{ groups[item_group] | map('extract', hostvars, 'ansible_facts') | map(attribute='default_ipv4') | map(attribute='address') | list }}"
    health_check: httpchk GET /health
    health_interval: 10s
    ssl_enabled: "{{ profile_haproxy_ssl_enabled }}"

- name: Remove dynamic backend configurations for empty groups
  ansible.builtin.file:
    path: "{{ profile_haproxy_config_dir }}/conf.d/dynamic-{{ item_group }}.cfg"  # noqa: R114,R115 - path from role defaults and loop over role-defined group names, not user input
    state: absent
  when:
    - groups[item_group] is not defined or groups[item_group] | length == 0
  loop:
    - webservers
    - api_servers
  loop_control:
    loop_var: item_group
  notify: restart haproxy