---
# Manage HAProxy service lifecycle

- name: Check if systemd is available
  ansible.builtin.stat:
    path: /etc/systemd/system
  register: systemd_available  # noqa: L039 - registered by this task

- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/haproxy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: systemd_available.stat.exists  # noqa: L039 - registered by prior task

- name: Deploy systemd override configuration
  ansible.builtin.copy:
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/sbin/haproxy -Ws -f {{ profile_haproxy_config_file }} -f {{ profile_haproxy_config_dir }}/conf.d/ -p /run/haproxy.pid -S /run/haproxy-master.sock
    dest: /etc/systemd/system/haproxy.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    create: false
  when: systemd_available.stat.exists  # noqa: L039 - registered by prior task
  notify:
    - reload systemd
    - restart haproxy

- name: Validate HAProxy configuration
  ansible.builtin.command:
    cmd: |
      haproxy -c -f {{ profile_haproxy_config_file }} -f {{ profile_haproxy_config_dir }}/conf.d/  # noqa: R101 - paths from role defaults, not user input
  changed_when: false
  check_mode: false

- name: Enable and start HAProxy service
  ansible.builtin.systemd:
    name: "{{ profile_haproxy_service_name }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Check if logrotate is available
  ansible.builtin.stat:
    path: /etc/logrotate.d
  register: logrotate_available  # noqa: L039 - registered by this task

- name: Deploy logrotate configuration
  ansible.builtin.copy:
    content: |
      /var/log/haproxy/*.log {
          daily
          rotate 14
          missingok
          notifempty
          compress
          delaycompress
          sharedscripts
          postrotate
              /bin/kill -HUP $(cat /var/run/haproxy.pid 2>/dev/null) 2>/dev/null || true
          endscript
      }
    dest: /etc/logrotate.d/haproxy
    owner: root
    group: root
    mode: "0644"
    backup: true
    create: false
  when: logrotate_available.stat.exists  # noqa: L039 - registered by prior task