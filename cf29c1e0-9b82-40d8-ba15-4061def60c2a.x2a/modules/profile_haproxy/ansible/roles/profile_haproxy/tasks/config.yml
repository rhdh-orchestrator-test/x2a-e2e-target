---
# Configure HAProxy — main config and per-backend configs via loop

- name: Deploy main HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ profile_haproxy_config_file }}"  # noqa: R114 - path from role defaults, not user input
    owner: root
    group: "{{ profile_haproxy_group }}"
    mode: "0640"
    backup: true
  notify: restart haproxy
  no_log: "{{ profile_haproxy_secure_logging }}"

- name: Deploy backend configuration files
  ansible.builtin.template:
    src: backend.conf.j2
    dest: "{{ profile_haproxy_config_dir }}/conf.d/{{ item_backend['key'] }}.cfg" # noqa: R114 - path from role-defined backends dict, not user input
    owner: root
    group: "{{ profile_haproxy_group }}"
    mode: "0640"
    backup: true
  loop: "{{ profile_haproxy_backends | dict2items }}"
  loop_control:
    loop_var: item_backend
  notify: restart haproxy
  vars:
    backend_name: "{{ item_backend['key'] }}"
    balance: "{{ item_backend['value']['balance'] }}"
    backend_port: "{{ item_backend['value']['port'] }}"
    servers: "{{ item_backend['value']['servers'] }}"
    health_check: "{{ item_backend['value']['health_check'] | default(omit) }}"
    health_interval: "{{ item_backend['value']['health_interval'] | default(omit) }}"
    ssl_enabled: "{{ profile_haproxy_ssl_enabled }}"

- name: Deploy custom error pages
  ansible.builtin.copy:
    src: haproxy_errors/{{ item_error }}.http
    dest: "{{ profile_haproxy_config_dir }}/errors/{{ item_error }}.http"  # noqa: R114 - path from role defaults and loop over role-defined error codes, not user input
    owner: root
    group: "{{ profile_haproxy_group }}"
    mode: "0644"
    backup: true
  loop:
    - "503"
    - "408"
  loop_control:
    loop_var: item_error

- name: Deploy stick-table configuration
  ansible.builtin.copy:
    content: |
      # Managed by Ansible
      stick-table type ip size {{ profile_haproxy_stick_table_size }} expire {{ profile_haproxy_stick_table_expire }}
    dest: "{{ profile_haproxy_config_dir }}/conf.d/stick-tables.cfg"  # noqa: R114 - path from role defaults, not user input
    owner: root
    group: "{{ profile_haproxy_group }}"
    mode: "0640"
    backup: true
  when: profile_haproxy_stick_table_enabled | default(false)
  notify: restart haproxy