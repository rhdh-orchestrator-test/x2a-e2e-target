---
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_key_file }}"
    - "{{ chef_automate_org_key_file }}"
  become: true
  when: chef_automate_user_key_file | dirname != '.' or chef_automate_org_key_file | dirname != '.'
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_automate_username }} "{{ chef_automate_full_name }}" {{ chef_automate_email }} "{{ chef_automate_password }}" --filename
      {{ chef_automate_user_key_file }}

      '
  args:
    creates: "{{ chef_automate_user_key_file }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_full_name }}" --association_user {{ chef_automate_username }} --filename {{
      chef_automate_org_key_file }}

      '
  args:
    creates: "{{ chef_automate_org_key_file }}"
  become: true
