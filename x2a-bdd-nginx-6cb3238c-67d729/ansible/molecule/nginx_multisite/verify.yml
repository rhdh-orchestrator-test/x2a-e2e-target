---
# Unsupported: fail2ban-client jail output and individual sysctl values have no stated
# expected result, so no assertion is invented for them.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - "'nginx' in ansible_facts['packages']"
          - "'fail2ban' in ansible_facts['packages']"
          - "'ufw' in ansible_facts['packages']"
          - "'openssl' in ansible_facts['packages']"
          - "'ca-certificates' in ansible_facts['packages']"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert required services are enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['nginx.service']['status'] == 'enabled'
          - ansible_facts['services']['nginx.service']['state'] == 'running'
          - ansible_facts['services']['fail2ban.service']['status'] == 'enabled'
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'
          - ansible_facts['services']['ssh.service']['state'] == 'running'

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv: [nginx, -t]
      register: nginx_config
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that: nginx_config['rc'] == 0

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv: [sshd, -t]
      register: ssh_config
      changed_when: false

    - name: Assert SSH configuration is valid
      ansible.builtin.assert:
        that: ssh_config['rc'] == 0

    - name: Check UFW verbose status
      ansible.builtin.command:
        argv: [ufw, status, verbose]
      register: ufw_verbose
      changed_when: false

    - name: Check UFW numbered status
      ansible.builtin.command:
        argv: [ufw, status, numbered]
      register: ufw_numbered
      changed_when: false

    - name: Assert UFW policy and allowed ports
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_verbose['stdout']"
          - "'Default: deny (incoming)' in ufw_verbose['stdout']"
          - "'22' in ufw_verbose['stdout'] and '80' in ufw_verbose['stdout']"
          - "'443' in ufw_verbose['stdout']"
          - "'22' in ufw_numbered['stdout'] and '80' in ufw_numbered['stdout']"
          - "'443' in ufw_numbered['stdout']"

    - name: Verify nginx listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listener }}"
        state: started
        timeout: 5
      loop: [80, 443]
      loop_control:
        loop_var: item_listener

    - name: Read SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config_file

    - name: Assert SSH hardening is configured
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (sshd_config_file['content'] | b64decode)"
          - "'PasswordAuthentication no' in (sshd_config_file['content'] | b64decode)"

    - name: Check required files
      ansible.builtin.stat:
        path: "{{ item_file['path'] }}"
        follow: false
      loop:
        - {path: /etc/nginx/nginx.conf}
        - {path: /etc/nginx/conf.d/security.conf}
        - {path: /etc/nginx/sites-available/test.cluster.local}
        - {path: /etc/nginx/sites-available/ci.cluster.local}
        - {path: /etc/nginx/sites-available/status.cluster.local}
        - {path: /etc/nginx/sites-enabled/test.cluster.local}
        - {path: /etc/nginx/sites-enabled/ci.cluster.local}
        - {path: /etc/nginx/sites-enabled/status.cluster.local}
        - {path: /opt/server/test/index.html}
        - {path: /opt/server/ci/index.html}
        - {path: /opt/server/status/index.html}
      loop_control:
        loop_var: item_file
      register: required_files

    - name: Assert required files exist
      ansible.builtin.assert:
        that: item_required_file['stat']['exists']
      loop: "{{ required_files['results'] }}"
      loop_control:
        loop_var: item_required_file

    - name: Check default site absence
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert default site is absent
      ansible.builtin.assert:
        that: not default_site['stat']['exists']

    - name: Assert enabled site entries are symbolic links
      ansible.builtin.assert:
        that: item_enabled_site['stat']['islnk']
      loop: "{{ required_files['results'][5:8] }}"
      loop_control:
        loop_var: item_enabled_site

    - name: Check certificate subjects and issuers
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
          - -issuer
      loop:
        - {path: /etc/ssl/certs/test.cluster.local.crt, name: test.cluster.local}
        - {path: /etc/ssl/certs/ci.cluster.local.crt, name: ci.cluster.local}
        - {path: /etc/ssl/certs/status.cluster.local.crt, name: status.cluster.local}
      loop_control:
        loop_var: item_certificate
      register: certificate_details
      changed_when: false

    - name: Assert certificates are self-signed and named for their sites
      ansible.builtin.assert:
        that:
          - item_certificate_result['rc'] == 0
          - "('CN=' ~ item_certificate_result['item']['name']) in item_certificate_result['stdout']"
          - "(item_certificate_result['stdout'] | regex_search('subject=.*')) == (item_certificate_result['stdout'] | regex_search('issuer=.*'))"
      loop: "{{ certificate_details['results'] }}"
      loop_control:
        loop_var: item_certificate_result

    - name: Check certificate validity
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ item_certificate_validity['path'] }}", -checkend, '31536000', -noout]
      loop:
        - {path: /etc/ssl/certs/test.cluster.local.crt}
        - {path: /etc/ssl/certs/ci.cluster.local.crt}
        - {path: /etc/ssl/certs/status.cluster.local.crt}
      loop_control:
        loop_var: item_certificate_validity
      register: certificate_validity
      changed_when: false

    - name: Assert certificates are valid for 365 days
      ansible.builtin.assert:
        that: item_certificate_check['rc'] == 0
      loop: "{{ certificate_validity['results'] }}"
      loop_control:
        loop_var: item_certificate_check

    - name: Check private TLS key security
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
      loop:
        - {path: /etc/ssl/private/test.cluster.local.key}
        - {path: /etc/ssl/private/ci.cluster.local.key}
        - {path: /etc/ssl/private/status.cluster.local.key}
      loop_control:
        loop_var: item_key
      register: private_keys

    - name: Assert private TLS keys have required security
      ansible.builtin.assert:
        that:
          - item_private_key['stat']['pw_name'] == 'root'
          - item_private_key['stat']['gr_name'] == 'ssl-cert'
          - item_private_key['stat']['mode'] == '0640'
      loop: "{{ private_keys['results'] }}"
      loop_control:
        loop_var: item_private_key

    - name: Check SSL directory security
      ansible.builtin.stat:
        path: "{{ item_ssl_directory['path'] }}"
      loop:
        - {path: /etc/ssl/certs, owner: root, group: root, mode: '0755'}
        - {path: /etc/ssl/private, owner: root, group: ssl-cert, mode: '0710'}
      loop_control:
        loop_var: item_ssl_directory
      register: ssl_directories

    - name: Assert SSL directories have required security
      ansible.builtin.assert:
        that:
          - item_ssl_directory_result['stat']['pw_name'] == item_ssl_directory_result['item']['owner']
          - item_ssl_directory_result['stat']['gr_name'] == item_ssl_directory_result['item']['group']
          - item_ssl_directory_result['stat']['mode'] == item_ssl_directory_result['item']['mode']
      loop: "{{ ssl_directories['results'] }}"
      loop_control:
        loop_var: item_ssl_directory_result

    - name: Verify HTTP redirects for each site
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_http_site['name'] }}"
        follow_redirects: none
        status_code: 301
      loop:
        - {name: test.cluster.local}
        - {name: ci.cluster.local}
        - {name: status.cluster.local}
      loop_control:
        loop_var: item_http_site

    - name: Verify HTTPS serves each site
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_https_site['name'] }}"
        validate_certs: false
        status_code: 200
      loop:
        - {name: test.cluster.local}
        - {name: ci.cluster.local}
        - {name: status.cluster.local}
      loop_control:
        loop_var: item_https_site
