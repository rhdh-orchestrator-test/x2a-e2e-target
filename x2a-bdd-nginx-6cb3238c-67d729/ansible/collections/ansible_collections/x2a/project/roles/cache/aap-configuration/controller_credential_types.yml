---
controller_credential_types:
  - name: Redis Authentication
    description: Authentication credential for the Redis server listening on TCP port 6379. The source password is hardcoded in the Chef recipe and must be 
      rotated and stored securely during migration.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis clients to authenticate to the Redis server.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
