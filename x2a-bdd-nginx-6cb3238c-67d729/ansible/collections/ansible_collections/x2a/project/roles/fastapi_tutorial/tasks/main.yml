---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Ensure FastAPI application group exists
  ansible.builtin.group:
    name: "{{ fastapi_tutorial_app_group }}"
    state: present

- name: Ensure FastAPI application user exists
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_app_user }}"
    group: "{{ fastapi_tutorial_app_group }}"
    state: present

- name: Create FastAPI application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: "{{ fastapi_tutorial_app_user }}"
    group: "{{ fastapi_tutorial_app_group }}"
    mode: "0755"
    recurse: true

- name: Synchronize FastAPI tutorial repository # noqa: R104,R106 - repository URL comes from a trusted role default and uses HTTPS
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repo_url }}"
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default, not user input
    version: "{{ fastapi_tutorial_repo_version }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command arguments come from trusted role defaults
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path is a role default, not user input

- name: Install Python dependencies # noqa: R113 - dependency paths come from trusted role defaults
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - path is a role default, not user input
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path is a role default, not user input

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the FastAPI PostgreSQL role exists # noqa: R101,R108 - SQL query uses trusted role variables and PostgreSQL inspection must run as the postgres user
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ fastapi_tutorial_db_user }}';
  changed_when: false
  register: fastapi_tutorial_role_check
  become: true
  become_user: postgres

- name: Create the FastAPI PostgreSQL role # noqa: L039,R101,R108 - password is validated earlier, SQL uses validated variables, and role creation must run as postgres
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - CREATE ROLE {{ fastapi_tutorial_db_user }} LOGIN PASSWORD '{{ db_password }}';
  when: fastapi_tutorial_role_check.stdout | trim != '1'
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the FastAPI database exists # noqa: R101,R108 - SQL query uses trusted role variables and PostgreSQL inspection must run as the postgres user
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ fastapi_tutorial_db_name }}';
  changed_when: false
  register: fastapi_tutorial_database_check
  become: true
  become_user: postgres

- name: Create the FastAPI database # noqa: L039,R101,R108 - condition uses the registered check result, arguments are trusted variables, and creation must run as postgres
  ansible.builtin.command:
    argv:
      - createdb
      - -O
      - "{{ fastapi_tutorial_db_user }}"
      - "{{ fastapi_tutorial_db_name }}"
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  become: true
  become_user: postgres

- name: Grant privileges on the FastAPI database # noqa: R101,R108 - SQL uses trusted role variables and granting privileges must run as postgres
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ fastapi_tutorial_db_name }} TO {{ fastapi_tutorial_db_user }};
  changed_when: false
  become: true
  become_user: postgres

- name: Deploy FastAPI environment configuration # noqa: L039 - db_password is validated by the preceding credential validation task
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path is a role default, not user input
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ fastapi_tutorial_db_user }}:{{ db_password }}@{{ fastapi_tutorial_db_host }}/{{ fastapi_tutorial_db_name }}
    owner: "{{ fastapi_tutorial_app_user }}"
    group: "{{ fastapi_tutorial_app_group }}"
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy FastAPI systemd unit
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - path is a role default, not user input
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User={{ fastapi_tutorial_app_user }}
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: "{{ fastapi_tutorial_app_user }}"
    group: "{{ fastapi_tutorial_app_group }}"
    mode: "0644"
    backup: true
  notify: Reload systemd manager configuration

- name: Enable and start FastAPI service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
