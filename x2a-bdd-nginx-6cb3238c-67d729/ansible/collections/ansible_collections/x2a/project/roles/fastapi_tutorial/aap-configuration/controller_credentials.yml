---
controller_credentials:
  - name: PostgreSQL Application Database - fastapi_tutorial
    description: Credentials for the FastAPI application to connect to its PostgreSQL database. The source password is hardcoded in the Chef recipe and must be 
      rotated and stored securely during migration.
    organization: Default
    credential_type: PostgreSQL Application Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      db_host: "{{ db_host }}"
      db_name: "{{ db_name }}"
