---
fastapi_tutorial_repo_url: https://github.com/dibanez/fastapi_tutorial.git
fastapi_tutorial_repo_version: main
fastapi_tutorial_app_dir: /opt/fastapi-tutorial
fastapi_tutorial_venv_dir: /opt/fastapi-tutorial/venv
fastapi_tutorial_service_name: fastapi-tutorial
fastapi_tutorial_service_file: /etc/systemd/system/fastapi-tutorial.service
fastapi_tutorial_app_user: root
fastapi_tutorial_app_group: root
fastapi_tutorial_app_port: 8000
fastapi_tutorial_db_user: "{{ db_username }}"
fastapi_tutorial_db_host: "{{ db_host }}"
fastapi_tutorial_db_name: "{{ db_name }}"
fastapi_tutorial_secure_logging: true
