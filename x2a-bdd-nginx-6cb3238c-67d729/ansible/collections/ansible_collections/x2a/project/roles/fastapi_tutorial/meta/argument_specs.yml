---
argument_specs:
  main:
    short_description: Deploy and configure the FastAPI tutorial application
    description:
      - Installs the FastAPI application and its Python dependencies.
      - Configures PostgreSQL database access and manages the FastAPI systemd service.
    options:
      fastapi_tutorial_repo_url:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_repo_version:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Installation directory for the application.
      fastapi_tutorial_venv_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_service_file:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Path to the systemd unit file.
      fastapi_tutorial_app_user:
        type: str
        required: false
        default: root
        description: User running the application service.
      fastapi_tutorial_app_group:
        type: str
        required: false
        default: root
        description: Group owning application files.
      fastapi_tutorial_app_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which FastAPI listens.
      fastapi_tutorial_db_user:
        type: str
        required: false
        default: "{{ db_username }}"
        description: PostgreSQL application user, supplied by the AAP credential.
      fastapi_tutorial_db_host:
        type: str
        required: false
        default: "{{ db_host }}"
        description: PostgreSQL server hostname, supplied by the AAP credential.
      fastapi_tutorial_db_name:
        type: str
        required: false
        default: "{{ db_name }}"
        description: PostgreSQL database name, supplied by the AAP credential.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations that handle the database password.
      db_username:
        type: str
        required: true
        description: PostgreSQL username injected by the AAP credential type.
      db_password:
        type: str
        required: true
        description: PostgreSQL password injected by the AAP credential type.
      db_host:
        type: str
        required: true
        description: PostgreSQL host injected by the AAP credential type.
      db_name:
        type: str
        required: true
        description: PostgreSQL database name injected by the AAP credential type.
