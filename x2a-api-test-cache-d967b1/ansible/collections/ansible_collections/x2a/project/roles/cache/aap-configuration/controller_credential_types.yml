---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis server on port 6379; the source value is hardcoded and must be rotated and stored securely 
      in the Ansible migration.
    kind: cloud
    inputs:
      fields:
        - id: redis_requirepass
          type: string
          label: Redis Password
          secret: true
          help_text: Password required for authenticated Redis client connections; store as an encrypted secret and do not expose it in task output or 
            configuration management logs.
      required:
        - redis_requirepass
    injectors:
      extra_vars:
        redis_requirepass: !unsafe "{{ redis_requirepass }}"
