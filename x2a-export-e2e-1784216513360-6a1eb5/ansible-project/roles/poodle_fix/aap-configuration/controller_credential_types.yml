---
controller_credential_types:
- name: Chef Server Admin
  description: Credentials for Chef Infra Server administration
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Admin username for Chef Infra Server
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Admin password for Chef Infra Server
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Chef Automate Admin
  description: Credentials for Chef Automate administration
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Admin username for Chef Automate
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Admin password for Chef Automate
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
