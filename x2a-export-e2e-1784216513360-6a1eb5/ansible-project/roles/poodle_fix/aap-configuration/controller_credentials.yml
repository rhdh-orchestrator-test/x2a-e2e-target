---
controller_credentials:
- name: Chef Server Admin - poodle_fix
  description: Credentials for Chef Infra Server administration
  organization: Default
  credential_type: Chef Server Admin
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Chef Automate Admin - poodle_fix
  description: Credentials for Chef Automate administration
  organization: Default
  credential_type: Chef Automate Admin
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
