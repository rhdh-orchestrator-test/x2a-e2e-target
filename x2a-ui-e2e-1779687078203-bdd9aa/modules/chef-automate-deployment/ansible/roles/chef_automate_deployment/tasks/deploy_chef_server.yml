---
- name: Check if Chef Infra Server is already deployed
  ansible.builtin.stat:
    path: /hab
  register: hab_dir
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }} "
  args:
    creates: /hab
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
  when: not hab_dir.stat.exists
- name: Create deployment marker file
  ansible.builtin.file:
    path: /var/chef/infra_server_deployed
    state: touch
    mode: "0644"
  become: true
  when: deploy_result is changed
