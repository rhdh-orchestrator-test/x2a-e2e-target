---
controller_credentials:
- name: Chef User Password - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User Password
  update_secrets: true
  inputs:
    user_password: '{{ vault_user_password }}'
- name: Chef User Key - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User Key
  update_secrets: true
  inputs:
    user_key: '{{ vault_user_key }}'
- name: Chef Organization Validator Key - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Organization Validator Key
  update_secrets: true
  inputs:
    org_validator_key: '{{ vault_org_validator_key }}'
- name: Chef User Information - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User Information
  update_secrets: true
  inputs:
    username: '{{ username }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
