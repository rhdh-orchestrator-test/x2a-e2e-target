- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    full_name: John Tonello
    email: jtonello@example.com
    user_password: password123
    user_key: mock-key-content
    org_name: lab
    org_full_name: Chef Lab Organization
    org_validator_key: mock-validator-key-content
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_cli_path: /tmp/molecule_test/tmp/chef-automate
    chef_user_key_path: /tmp/molecule_test/tmp/{{ username }}.pem
    chef_org_validator_key_path: /tmp/molecule_test/tmp/{{ org_name }}-validator.pem
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/var/chef
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '262144'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '20000'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create deployment marker files
    ansible.builtin.file:
      path: /tmp/molecule_test/var/chef/{{ item }}
      state: touch
      mode: '0644'
    loop:
    - automate_deployed
    - infra_server_deployed
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock Chef User Key -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/tmp/jtonello.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock Chef Organization Validator Key -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/tmp/lab-validator.pem
      mode: '0600'
