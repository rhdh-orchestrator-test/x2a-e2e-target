---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Configure system for Chef Automate
  ansible.builtin.include_tasks: system_configuration.yml
- name: Create marker directory
  ansible.builtin.file:
    path: /var/chef
    state: directory
    mode: "0755"
  become: true
- name: Install Chef Automate CLI
  ansible.builtin.include_tasks: install_automate.yml
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.include_tasks: deploy_automate.yml
  when: chef_automate_deploy_automate | bool and chef_automate_deploy_infra_server | bool
- name: Deploy Chef Infra Server only
  ansible.builtin.include_tasks: deploy_chef_server.yml
  when: not chef_automate_deploy_automate | bool and chef_automate_deploy_infra_server | bool
- name: Setup Chef users and organizations
  ansible.builtin.include_tasks: setup_users_orgs.yml
  when: chef_automate_deploy_infra_server | bool
