- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = {{ chef_automate_vm_max_map_count }}

        vm.dirty_expire_centisecs = {{ chef_automate_vm_dirty_expire_centisecs }}

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/sh echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock Chef user key -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/{{ chef_automate_userfilename }}
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock Chef organization validator key -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/{{ chef_automate_orgfilename }}
      mode: '0600'
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_username: jtonello
    chef_automate_userfilename: jtonello.pem
    chef_automate_orgname: lab
    chef_automate_orgfilename: lab-validator.pem
    chef_automate_deploy_automate: true
    chef_automate_deploy_infra_server: true
    username: jtonello
    password: password
    full_name: John Tonello
    email: jtonello@chef.lab
