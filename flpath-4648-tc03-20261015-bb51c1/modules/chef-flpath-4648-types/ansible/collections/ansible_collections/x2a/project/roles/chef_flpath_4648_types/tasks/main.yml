---
# FLPATH-3351-TC-07-RULE
# Converted from Chef recipes/default.rb

- name: Ensure /srv directory exists for site document roots
  ansible.builtin.file:
    path: /srv
    state: directory
    mode: "0755"

- name: Create application directory
  ansible.builtin.file:
    path: /opt/{{ chef_flpath_4648_types_app_name }} # noqa: R114 - path from role-defined variable
    state: directory
    mode: "0755"

- name: Create application configuration file
  ansible.builtin.copy:
    dest: /opt/{{ chef_flpath_4648_types_app_name }}/application.conf # noqa: R114 - path from role-defined variable
    content: |
      enabled={{ chef_flpath_4648_types_enabled }}
      port={{ chef_flpath_4648_types_port }}
      ratio={{ chef_flpath_4648_types_ratio }}
      timeout={{ chef_flpath_4648_types_config.timeout }}
      retries={{ chef_flpath_4648_types_config.retries }}
      allowed_hosts={{ chef_flpath_4648_types_allowed_hosts | join(',') }}
    mode: "0644"
    backup: true

- name: Create site document root directories
  ansible.builtin.file:
    path: "{{ item_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dict
    state: directory
    mode: "0755"
  loop: "{{ chef_flpath_4648_types_sites | dict2items }}"
  loop_control:
    loop_var: item_site

- name: Create site configuration files
  ansible.builtin.copy:
    dest: /opt/{{ chef_flpath_4648_types_app_name }}/{{ item_site['key'] }}.conf # noqa: R114 - path from role-defined variables
    content: |
      document_root={{ item_site['value']['document_root'] }}
      ssl_enabled={{ item_site['value']['ssl_enabled'] }}
    mode: "0644"
    backup: true
  loop: "{{ chef_flpath_4648_types_sites | dict2items }}"
  loop_control:
    loop_var: item_site