- name: Converge
  hosts: all
  gather_facts: true
  vars:
    apache_conf_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    ssl_protocol: -all +TLSv1.2
    username: molecule_test
    password: molecule_test
  tasks:
  - name: Create directory structure for Apache config
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/apache2/mods-available
  - name: Create mock Apache SSL config file
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        SSLProtocol all

        SSLCipherSuite HIGH:MEDIUM:!aNULL:!MD5

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Validate credential variables
    ansible.builtin.assert:
      that:
      - username is defined
      - password is defined
      fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template.
      quiet: true
  - name: Fix SSL in Apache
    ansible.builtin.replace:
      dest: '{{ apache_conf_path }}'
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol {{ ssl_protocol }}
