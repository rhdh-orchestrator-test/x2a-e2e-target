---
- name: Install Apache web server
  ansible.builtin.package:
    name: "{{ 'httpd' if ansible_os_family == 'RedHat' else 'apache2' }}"
    state: present
  become: true
- name: Enable SSL module for Apache
  ansible.builtin.command:
    cmd: a2enmod ssl
  when: ansible_os_family == 'Debian'
  notify:
    - Restart apache2
  become: true
  changed_when: false
- name: Set OS-specific variables
  ansible.builtin.set_fact:
    ssl_config_path: "{{ ssl_config_paths[ansible_os_family] }}"
    apache_service_name: "{{ apache_service_names[ansible_os_family] }}"
- name: Ensure SSL configuration directory exists
  ansible.builtin.file:
    path: "{{ ssl_config_path | dirname }}"
    state: directory
    mode: "0755"
  become: true
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: "{{ ssl_config_path }}"
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol -all +TLSv1.2
    backup: true
  notify:
    - Restart apache2
  become: true
