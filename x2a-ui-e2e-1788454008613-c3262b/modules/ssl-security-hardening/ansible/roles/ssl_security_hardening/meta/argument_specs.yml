---
argument_specs:
  main:
    short_description: SSL/TLS security hardening for Apache web server
    description:
      - Hardens SSL/TLS configuration to mitigate POODLE and other vulnerabilities
      - Configures secure SSL protocols and cipher suites
      - Enables security headers including HSTS
      - Manages Apache service restarts after configuration changes
      - Automatically detects OS-specific Apache paths and service names
    options:
      ssl_protocols:
        type: list
        elements: str
        required: false
        default:
          - +TLSv1.2
          - +TLSv1.3
        description: List of allowed SSL/TLS protocols with + or - prefixes
      ssl_cipher_suite:
        type: str
        required: false
        default: ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20:!aNULL:!MD5:!DSS
        description: SSL cipher suite configuration string
      enable_hsts:
        type: bool
        required: false
        default: true
        description: Whether to enable HTTP Strict Transport Security headers
      hsts_max_age:
        type: int
        required: false
        default: 31536000
        description: HSTS max-age directive value in seconds
