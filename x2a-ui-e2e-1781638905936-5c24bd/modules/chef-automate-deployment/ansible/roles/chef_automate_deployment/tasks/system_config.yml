---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Get current vm.max_map_count value
  ansible.builtin.command:
    cmd: sysctl -n vm.max_map_count
  register: current_max_map_count
  changed_when: false
  become: true
- name: Set vm.max_map_count kernel parameter
  ansible.builtin.command:
    cmd: sysctl -w vm.max_map_count={{ chef_automate_vm_max_map_count }}
  become: true
  when: current_max_map_count.stdout | trim != chef_automate_vm_max_map_count | string
- name: Get current vm.dirty_expire_centisecs value
  ansible.builtin.command:
    cmd: sysctl -n vm.dirty_expire_centisecs
  register: current_dirty_expire_centisecs
  changed_when: false
  become: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  ansible.builtin.command:
    cmd: sysctl -w vm.dirty_expire_centisecs={{ chef_automate_vm_dirty_expire_centisecs }}
  become: true
  when: current_dirty_expire_centisecs.stdout | trim != chef_automate_vm_dirty_expire_centisecs | string
