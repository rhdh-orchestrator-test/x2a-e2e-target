---
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }}\n"
  args:
    creates: /hab
  become: true
  register: chef_infra_deploy
  changed_when: chef_infra_deploy.rc == 0
- name: Wait for Chef Infra Server services to be ready
  ansible.builtin.pause:
    seconds: 30
  when: chef_infra_deploy.changed
