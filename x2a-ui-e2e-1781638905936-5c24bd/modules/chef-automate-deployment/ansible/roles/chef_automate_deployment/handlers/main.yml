---
- name: Restart Chef Automate
  ansible.builtin.command:
    cmd: sudo chef-automate restart
  listen: restart chef-automate
  register: chef_automate_restart
  changed_when: chef_automate_restart.rc == 0
- name: Restart Chef Infra Server
  ansible.builtin.command:
    cmd: sudo chef-server-ctl restart
  listen: restart chef-infra-server
  register: chef_infra_restart
  changed_when: chef_infra_restart.rc == 0
