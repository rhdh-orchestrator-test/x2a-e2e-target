---
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }}\n"
  args:
    creates: /hab
  become: true
  register: chef_automate_deploy
  changed_when: chef_automate_deploy.rc == 0
- name: Wait for Chef Automate services to be ready
  ansible.builtin.pause:
    seconds: 30
  when: chef_automate_deploy.changed
