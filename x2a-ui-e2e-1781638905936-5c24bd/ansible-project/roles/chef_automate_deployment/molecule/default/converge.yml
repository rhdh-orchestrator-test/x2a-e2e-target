---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/home/molecule
        - /tmp/molecule_test/hab

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname | default('automate.chef.lab') }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate kernel parameters
    - name: Create max_map_count file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_max_map_count | default('262144') }}"
        dest: /tmp/molecule_test/proc/sys/vm/max_map_count
        mode: "0644"

    - name: Create dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_dirty_expire_centisecs | default('20000') }}"
        dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI Mock'\n"
        dest: /tmp/molecule_test/home/molecule/chef-automate
        mode: "0755"

    # Simulate user PEM file
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/molecule/{{ username | default('jtonello') }}.pem"
        mode: "0600"

    # Simulate organization validator PEM file
    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/molecule/{{ orgname | default('lab') }}-validator.pem"
        mode: "0600"

    # Simulate Chef Automate and Chef Server installation
    - name: Create hab directory to simulate installation
      ansible.builtin.file:
        path: /tmp/molecule_test/hab
        state: directory
        mode: "0755"

    # Simulate Chef Server CLI tools
    - name: Create chef-server-ctl mock
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Server Control Mock"
          if [ "$1" == "user-list" ]; then
            echo "{{ username | default('jtonello') }}"
          elif [ "$1" == "org-list" ]; then
            echo "{{ orgname | default('lab') }}"
          elif [ "$1" == "status" ]; then
            echo "All services running"
          fi
        dest: /tmp/molecule_test/usr/bin/chef-server-ctl
        mode: "0755"