- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache mods-available
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create directory structure for Apache mods-enabled
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-enabled
      state: directory
      mode: '0755'
  - name: Create directory structure for SSH config
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/ssh
      state: directory
      mode: '0755'
  - name: Create sample SSL configuration file with vulnerable settings
    ansible.builtin.copy:
      content: '# Sample Apache SSL configuration file

        # This contains a vulnerable SSLProtocol setting that should be fixed by the role

        SSLProtocol all -SSLv3

        SSLCipherSuite HIGH:!aNULL:!MD5

        SSLHonorCipherOrder on

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Create sample SSH configuration file
    ansible.builtin.copy:
      content: '# Sample SSH configuration file

        Protocol 1,2

        '
      dest: /tmp/molecule_test/etc/ssh/sshd_config
      mode: '0644'
  - name: Create dummy SSL module load file
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.load
      state: touch
      mode: '0644'
  - name: Prepare environment variables for testing
    ansible.builtin.set_fact:
      molecule_test_dir: /tmp/molecule_test
  - name: Mock package installation
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/sbin/apache2
      state: directory
      mode: '0755'
  - name: Fix SSL in Apache (simulate role)
    ansible.builtin.replace:
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
  - name: Fix SSH configuration for POODLE vulnerability (simulate role)
    ansible.builtin.lineinfile:
      path: /tmp/molecule_test/etc/ssh/sshd_config
      regexp: ^Protocol
      line: Protocol 2
      state: present
