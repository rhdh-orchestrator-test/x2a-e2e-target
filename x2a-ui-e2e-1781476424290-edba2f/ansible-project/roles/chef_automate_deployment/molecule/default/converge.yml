- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    full_name: John Tonello
    email: jtonello@chef.lab
    password: password
    chef_automate_hostname: automate.chef.lab
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
    chef_user_key_filename: /tmp/molecule_test/jtonello.pem
    chef_org_name: lab
    chef_org_validator_filename: /tmp/molecule_test/lab-validator.pem
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/sysctl.d
    - /tmp/molecule_test/var/log/chef-automate
    - /tmp/molecule_test/var/opt/chef-automate
  - name: Create mock hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/hostname
      mode: '0644'
  - name: Create mock sysctl configuration
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create mock Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        '
      dest: '{{ chef_automate_cli_path }}'
      mode: '0755'
  - name: Create mock Chef Automate config
    ansible.builtin.copy:
      content: "# Chef Automate configuration\n[global]\n  v1 = true\n[deployment]\n  products = [\"automate\", \"infra-server\"]\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create mock user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        (mock key content)

        -----END RSA PRIVATE KEY-----

        '
      dest: '{{ chef_user_key_filename }}'
      mode: '0600'
  - name: Create mock organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        (mock key content)

        -----END RSA PRIVATE KEY-----

        '
      dest: '{{ chef_org_validator_filename }}'
      mode: '0600'
  - name: Create mock Chef server status files
    ansible.builtin.copy:
      content: '# Mock status file

        Service is running

        '
      dest: /tmp/molecule_test/var/log/chef-automate/{{ item }}
      mode: '0644'
    loop:
    - automate-status.log
    - chef-server-status.log
