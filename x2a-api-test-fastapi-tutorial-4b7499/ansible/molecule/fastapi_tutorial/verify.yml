---
# Unsupported pre-flight checks: exact HTTP response content/status, package-manager diagnostic output,
# PostgreSQL password-authenticated psql checks, database privilege inspection, journal contents,
# and restart behavior have no stated assertion that can be safely translated without exposing a
# secret or changing state.
- name: Verify fastapi-tutorial deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Check required packages on Debian-family hosts
      ansible.builtin.package_facts:
        manager: auto
      when: ansible_facts['os_family'] == 'Debian'

    - name: Assert required packages on Debian-family hosts
      ansible.builtin.assert:
        that:
          - "'python3' in ansible_facts['packages']"
          - "'python3-pip' in ansible_facts['packages']"
          - "'python3-venv' in ansible_facts['packages']"
          - "'git' in ansible_facts['packages']"
          - "'postgresql' in ansible_facts['packages']"
          - "'postgresql-contrib' in ansible_facts['packages']"
          - "'libpq-dev' in ansible_facts['packages']"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Check required packages on RedHat-family hosts
      ansible.builtin.package_facts:
        manager: auto
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Assert required packages on RedHat-family hosts
      ansible.builtin.assert:
        that:
          - "'python3' in ansible_facts['packages']"
          - "'python3-pip' in ansible_facts['packages']"
          - "'git' in ansible_facts['packages']"
          - "'postgresql-server' in ansible_facts['packages']"
          - "'postgresql-contrib' in ansible_facts['packages']"
          - "'libpq-devel' in ansible_facts['packages']"
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Check PostgreSQL data directory initialization on RedHat-family hosts
      ansible.builtin.stat:
        path: /var/lib/pgsql/data/PG_VERSION
      register: postgresql_version_file
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Assert PostgreSQL data directory initialization on RedHat-family hosts
      ansible.builtin.assert:
        that:
          - postgresql_version_file['stat']['isreg'] | default(false)
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Check application directory
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: application_directory

    - name: Assert application directory ownership and mode
      ansible.builtin.assert:
        that:
          - application_directory['stat']['isdir']
          - application_directory['stat']['pw_name'] == 'root'
          - application_directory['stat']['gr_name'] == 'root'
          - application_directory['stat']['mode'] == '0755'

    - name: Check application repository remote
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - remote
          - get-url
          - origin
      register: repository_remote
      changed_when: false

    - name: Assert application repository remote
      ansible.builtin.assert:
        that:
          - repository_remote['rc'] == 0
          - repository_remote['stdout'] | trim == 'https://github.com/dibanez/fastapi_tutorial.git'

    - name: Check application repository revision
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - rev-parse
          - --abbrev-ref
          - HEAD
      register: repository_revision
      changed_when: false

    - name: Assert application repository revision
      ansible.builtin.assert:
        that:
          - repository_revision['rc'] == 0
          - repository_revision['stdout'] | trim == 'main'

    - name: Check application requirements file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/requirements.txt
      register: requirements_file

    - name: Assert application requirements file
      ansible.builtin.assert:
        that:
          - requirements_file['stat']['isreg']

    - name: Check virtual environment executables
      ansible.builtin.stat:
        path: "{{ item_virtualenv['path'] }}"
      register: virtualenv_executables
      loop:
        - path: /opt/fastapi-tutorial/venv/bin/python
        - path: /opt/fastapi-tutorial/venv/bin/pip
      loop_control:
        loop_var: item_virtualenv

    - name: Assert virtual environment executables
      ansible.builtin.assert:
        that:
          - item_virtualenv_result['stat']['isreg']
          - item_virtualenv_result['stat']['executable']
      loop: "{{ virtualenv_executables['results'] }}"
      loop_control:
        loop_var: item_virtualenv_result

    - name: Check FastAPI systemd unit file
      ansible.builtin.stat:
        path: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit_file

    - name: Assert FastAPI systemd unit file exists
      ansible.builtin.assert:
        that:
          - fastapi_unit_file['stat']['isreg']

    - name: Verify FastAPI systemd unit syntax
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit_syntax
      changed_when: false

    - name: Assert FastAPI systemd unit syntax
      ansible.builtin.assert:
        that:
          - fastapi_unit_syntax['rc'] == 0

    - name: Read FastAPI systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit_content

    - name: Assert FastAPI uses the expected Uvicorn executable
      ansible.builtin.assert:
        that:
          - "'/opt/fastapi-tutorial/venv/bin/uvicorn' in (fastapi_unit_content['content'] | b64decode)"

    - name: Check FastAPI service enabled state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - fastapi-tutorial
      register: fastapi_enabled
      changed_when: false

    - name: Assert FastAPI service enabled state
      ansible.builtin.assert:
        that:
          - fastapi_enabled['rc'] == 0
          - fastapi_enabled['stdout'] | trim == 'enabled'

    - name: Check FastAPI service active state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - fastapi-tutorial
      register: fastapi_active
      changed_when: false

    - name: Assert FastAPI service active state
      ansible.builtin.assert:
        that:
          - fastapi_active['rc'] == 0
          - fastapi_active['stdout'] | trim == 'active'

    - name: Check FastAPI listening endpoint
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8000
        state: started
        timeout: 5

    - name: Check PostgreSQL service enabled state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - postgresql
      register: postgresql_enabled
      changed_when: false

    - name: Assert PostgreSQL service enabled state
      ansible.builtin.assert:
        that:
          - postgresql_enabled['rc'] == 0
          - postgresql_enabled['stdout'] | trim == 'enabled'

    - name: Check PostgreSQL service active state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - postgresql
      register: postgresql_active
      changed_when: false

    - name: Assert PostgreSQL service active state
      ansible.builtin.assert:
        that:
          - postgresql_active['rc'] == 0
          - postgresql_active['stdout'] | trim == 'active'

    - name: Check PostgreSQL listening endpoint
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5432
        state: started
        timeout: 5

    - name: Check PostgreSQL role
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT rolname FROM pg_roles WHERE rolname = 'fastapi';
      register: postgresql_role
      changed_when: false

    - name: Assert PostgreSQL role
      ansible.builtin.assert:
        that:
          - postgresql_role['rc'] == 0
          - postgresql_role['stdout'] | trim == 'fastapi'

    - name: Check PostgreSQL database
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT datname FROM pg_database WHERE datname = 'fastapi_db';
      register: postgresql_database
      changed_when: false

    - name: Assert PostgreSQL database
      ansible.builtin.assert:
        that:
          - postgresql_database['rc'] == 0
          - postgresql_database['stdout'] | trim == 'fastapi_db'

    - name: Check PostgreSQL database owner
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT pg_catalog.pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'fastapi_db';
      register: postgresql_owner
      changed_when: false

    - name: Assert PostgreSQL database owner
      ansible.builtin.assert:
        that:
          - postgresql_owner['rc'] == 0
          - postgresql_owner['stdout'] | trim == 'fastapi'

    - name: Read application environment file
      ansible.builtin.slurp:
        src: /opt/fastapi-tutorial/.env
      register: application_environment

    - name: Assert application environment variables are present
      ansible.builtin.assert:
        that:
          - "'PROJECT_NAME=' in (application_environment['content'] | b64decode)"
          - "'API_VERSION=' in (application_environment['content'] | b64decode)"
          - "'DATABASE_URL=' in (application_environment['content'] | b64decode)"
