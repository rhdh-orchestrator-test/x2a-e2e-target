---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the FastAPI application's local PostgreSQL database. The password is currently hardcoded in the Chef 
      recipe and must be migrated to a protected AAP credential field.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application; currently fastapi.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role, used to create the database user and authenticate the application.
        - id: database_host
          type: string
          label: Database Host
          help_text: PostgreSQL server hostname used by the application; currently localhost.
        - id: database_port
          type: string
          label: Database Port
          help_text: TCP port for the PostgreSQL server; currently 5432.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application; currently fastapi_db.
      required:
        - database_username
        - database_password
        - database_host
        - database_port
        - database_name
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_host: !unsafe "{{ database_host }}"
        database_port: !unsafe "{{ database_port }}"
        database_name: !unsafe "{{ database_name }}"
