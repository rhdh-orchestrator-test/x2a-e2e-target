---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters for Chef Automate
  ansible.builtin.include_role:
    name: eloy.redis.redis
  vars:
    redis_install_method: none
    redis_sysctl_params: "{{ chef_automate_sysctl_params }}"
  become: true
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - unzip
      - gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
  become: true
- name: Unzip Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_path }}
    stdin: "{{ lookup('file', '/tmp/chef-automate.zip') }}"
    creates: "{{ chef_automate_cli_path }}"
  become: true
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
  become: true
