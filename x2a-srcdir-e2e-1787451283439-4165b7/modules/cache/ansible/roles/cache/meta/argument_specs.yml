---
argument_specs:
  main:
    short_description: Simple cache cookbook - local dependency for testing
    description:
      - Installs and configures Redis server as a caching solution.
      - Ensures the Redis service is enabled and running.
    options:
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis server package to install.
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis service.
      cache_redis_service_state:
        type: str
        required: false
        default: started
        description: Desired state of the Redis service (started, stopped).
      cache_redis_service_enabled:
        type: bool
        required: false
        default: true
        description: Whether the Redis service should be enabled at boot time.
