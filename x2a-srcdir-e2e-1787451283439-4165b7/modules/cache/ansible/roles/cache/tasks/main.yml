---
- name: Install redis server
  ansible.builtin.package:
    name: "{{ cache_redis_package }}"
    state: present
- name: Ensure Redis configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/redis
    - /var/lib/redis
    - /var/log/redis
    - /var/run/redis
- name: Configure Redis
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    mode: "0644"
  notify: Restart redis service
- name: Enable and start redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    state: "{{ cache_redis_service_state }}"
    enabled: "{{ cache_redis_service_enabled }}"
