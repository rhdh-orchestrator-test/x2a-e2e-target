---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    full_name: John Tonello
    email: jtonello@chef.lab
    password: password
    chef_hostname: automate.chef.lab
    chef_vm_max_map_count: 262144
    chef_vm_dirty_expire_centisecs: 20000
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
    chef_org_name: lab
    chef_org_long_name: Chef Lab
    chef_user_key_filename: /tmp/molecule_test/jtonello.pem
    chef_org_validator_filename: /tmp/molecule_test/lab-validator.pem
  tasks:
    # Create directory structure
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/hostname
        - /tmp/molecule_test/etc/sysctl.d

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl parameters
    - name: Create sysctl parameter files
      ansible.builtin.copy:
        content: |
          # Kernel parameters set by Chef deployment role
          vm.max_map_count = {{ chef_vm_max_map_count }}
          vm.dirty_expire_centisecs = {{ chef_vm_dirty_expire_centisecs }}
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-deployment.conf
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI mock"
          echo "This would deploy Chef Automate and/or Chef Infra Server"
        dest: "{{ chef_automate_cli_path }}"
        mode: "0755"

    # Simulate Chef Automate config
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          # Chef Automate configuration
          [global]
            v1 = true
          [deployment]
            automate = true
            infra_server = true
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          EXAMPLE_KEY_CONTENT_WOULD_BE_HERE_IN_REAL_DEPLOYMENT
          -----END RSA PRIVATE KEY-----
        dest: "{{ chef_user_key_filename }}"
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          EXAMPLE_VALIDATOR_KEY_CONTENT_WOULD_BE_HERE
          -----END RSA PRIVATE KEY-----
        dest: "{{ chef_org_validator_filename }}"
        mode: "0600"

    # Simulate chef-server-ctl output files
    - name: Create user list file
      ansible.builtin.copy:
        content: |
          jtonello
        dest: /tmp/molecule_test/user-list.txt
        mode: "0644"

    - name: Create organization list file
      ansible.builtin.copy:
        content: |
          lab
        dest: /tmp/molecule_test/org-list.txt
        mode: "0644"