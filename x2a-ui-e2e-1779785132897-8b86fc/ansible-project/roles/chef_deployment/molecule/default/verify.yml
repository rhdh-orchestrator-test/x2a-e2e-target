---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    chef_org_name: lab
    chef_hostname: automate.chef.lab
    chef_user_key_filename: /tmp/molecule_test/jtonello.pem
    chef_org_validator_filename: /tmp/molecule_test/lab-validator.pem
  tasks:
    # Hostname verification
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Verify hostname content
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == chef_hostname
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # System parameters verification
    - name: Check sysctl parameters file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-deployment.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl parameters file not found"
        success_msg: "Sysctl parameters file exists"

    - name: Get sysctl file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-deployment.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Verify sysctl parameters
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
          - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI verification
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate config verification
    - name: Check Chef Automate config exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config

    - name: Assert Chef Automate config exists
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
          - chef_automate_config.stat.isreg
        fail_msg: "Chef Automate config not found"
        success_msg: "Chef Automate config exists"

    # User key file verification
    - name: Check user key file exists
      ansible.builtin.stat:
        path: "{{ chef_user_key_filename }}"
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.isreg
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    # Organization validator key file verification
    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: "{{ chef_org_validator_filename }}"
      register: org_validator_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_validator_file.stat.exists
          - org_validator_file.stat.isreg
        fail_msg: "Organization validator key file not found"
        success_msg: "Organization validator key file exists"

    # User verification
    - name: Check user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/user-list.txt
      register: user_list_file

    - name: Assert user list file exists
      ansible.builtin.assert:
        that:
          - user_list_file.stat.exists
          - user_list_file.stat.isreg
        fail_msg: "User list file not found"
        success_msg: "User list file exists"

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/user-list.txt
      register: user_list_content
      when: user_list_file.stat.exists

    - name: Verify user exists
      ansible.builtin.assert:
        that:
          - (user_list_content.content | b64decode) is search(username)
        fail_msg: "User not found in user list"
        success_msg: "User found in user list"
      when: user_list_file.stat.exists

    # Organization verification
    - name: Check organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/org-list.txt
      register: org_list_file

    - name: Assert organization list file exists
      ansible.builtin.assert:
        that:
          - org_list_file.stat.exists
          - org_list_file.stat.isreg
        fail_msg: "Organization list file not found"
        success_msg: "Organization list file exists"

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/org-list.txt
      register: org_list_content
      when: org_list_file.stat.exists

    - name: Verify organization exists
      ansible.builtin.assert:
        that:
          - (org_list_content.content | b64decode) is search(chef_org_name)
        fail_msg: "Organization not found in organization list"
        success_msg: "Organization found in organization list"
      when: org_list_file.stat.exists

    # Service status checks (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: systemctl status chef-automate
      register: chef_automate_status
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
          - "'active (running)' in chef_automate_status.stdout"
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check Chef Server service status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: chef_server_status
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Server service is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Server service is not running"
        success_msg: "Chef Server service is running"
      tags: molecule-notest

    # Network listening checks (tagged for skipping in container)
    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # Web UI access check (tagged for skipping in container)
    - name: Check Web UI access
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
        status_code: 200
      register: web_ui_check
      failed_when: false
      tags: molecule-notest

    - name: Assert Web UI is accessible
      ansible.builtin.assert:
        that:
          - web_ui_check is succeeded
        fail_msg: "Web UI is not accessible"
        success_msg: "Web UI is accessible"
      tags: molecule-notest