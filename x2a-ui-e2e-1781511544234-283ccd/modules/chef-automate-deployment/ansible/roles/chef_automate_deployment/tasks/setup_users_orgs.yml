---
- name: Check if Chef Server is installed
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_check
  changed_when: false
  failed_when: false
  become: true
- name: Fail if Chef Server is not installed
  ansible.builtin.fail:
    msg: Chef Server is not installed. Please ensure Chef Server is installed before running this task.
  when: chef_server_check.rc != 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_user.name }} {{ chef_automate_user.fullname }} {{ chef_automate_user.email }} "{{
      chef_automate_user.password }}" --filename {{ chef_automate_user.filename }}
    creates: "{{ ansible_env.PWD }}/{{ chef_automate_user.filename }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org.name }} "{{ chef_automate_org.fullname }}" --association_user {{ chef_automate_user.name }} --filename
      {{ chef_automate_org.filename }}
    creates: "{{ ansible_env.PWD }}/{{ chef_automate_org.filename }}"
  become: true
