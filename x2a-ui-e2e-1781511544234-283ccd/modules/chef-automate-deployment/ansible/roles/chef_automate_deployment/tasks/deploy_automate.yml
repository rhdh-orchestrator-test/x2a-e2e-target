---
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: "/tmp/chef-automate deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{ chef_automate_accept_terms
      | lower }}\n"
    creates: /hab
  become: true
  register: deploy_result
- name: Display Chef Automate deployment result
  ansible.builtin.debug:
    var: deploy_result.stdout_lines
  when: deploy_result.changed
