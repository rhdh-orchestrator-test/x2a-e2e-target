---
- name: Install required packages
  ansible.builtin.package:
    name:
      - curl
      - gzip
    state: present
  become: true
- name: Check if Chef Automate CLI is already installed
  ansible.builtin.stat:
    path: /tmp/chef-automate
  register: chef_automate_cli
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
  become: true
  when: not chef_automate_cli.stat.exists
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > /tmp/chef-automate
    stdin: "{{ lookup('ansible.builtin.file', '/tmp/chef-automate.zip') }}"
    creates: /tmp/chef-automate
  become: true
  when: not chef_automate_cli.stat.exists
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: /tmp/chef-automate
    mode: "0755"
  become: true
