- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/home/ansible
    - /tmp/molecule_test/var/log
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname | default(''automate.chef.lab'') }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create Chef user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        MOCK_PEM_FILE_CONTENT_FOR_USER

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/ansible/{{ chef_automate_user.filename | default('jtonello.pem') }}
      mode: '0600'
  - name: Create Chef organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        MOCK_PEM_FILE_CONTENT_FOR_ORGANIZATION

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/ansible/{{ chef_automate_org.filename | default('lab-validator.pem') }}
      mode: '0600'
  - name: Create Chef server status files
    ansible.builtin.copy:
      content: running
      dest: /tmp/molecule_test/var/log/chef-server-status
      mode: '0644'
    with_items:
    - chef-server
    - chef-automate
  - name: Create Chef server user list file
    ansible.builtin.copy:
      content: '{{ chef_automate_user.name | default(''jtonello'') }}'
      dest: /tmp/molecule_test/var/log/chef-server-users
      mode: '0644'
  - name: Create Chef server org list file
    ansible.builtin.copy:
      content: '{{ chef_automate_org.name | default(''lab'') }}'
      dest: /tmp/molecule_test/var/log/chef-server-orgs
      mode: '0644'
