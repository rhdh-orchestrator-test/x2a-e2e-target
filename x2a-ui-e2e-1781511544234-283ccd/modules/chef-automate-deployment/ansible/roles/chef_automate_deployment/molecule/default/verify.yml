- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file was created
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl config file was created
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl config file not found
      success_msg: Sysctl config file exists
  - name: Get sysctl config file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert kernel parameters are set correctly
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: Kernel parameters not set correctly
      success_msg: Kernel parameters set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI was downloaded and extracted
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.isreg
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate deployment marker
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert Chef Automate was deployed
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef Automate deployment marker not found
      success_msg: Chef Automate deployment marker exists
  - name: Check Chef user PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/jtonello.pem
    register: user_pem
  - name: Assert Chef user PEM file was created
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.isreg
      - user_pem.stat.size > 0
      fail_msg: Chef user PEM file not found
      success_msg: Chef user PEM file exists
  - name: Check Chef organization validator PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/lab-validator.pem
    register: org_pem
  - name: Assert Chef organization validator PEM file was created
    ansible.builtin.assert:
      that:
      - org_pem.stat.exists
      - org_pem.stat.isreg
      - org_pem.stat.size > 0
      fail_msg: Chef organization validator PEM file not found
      success_msg: Chef organization validator PEM file exists
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - automate_status.rc == 0
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Server status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Server is running
    ansible.builtin.assert:
      that:
      - server_status.rc == 0
      fail_msg: Chef Server is not running
      success_msg: Chef Server is running
    tags: molecule-notest
  - name: Check Chef user list
    ansible.builtin.command:
      cmd: sudo chef-server-ctl user-list
    register: user_list
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef user was created
    ansible.builtin.assert:
      that:
      - '''jtonello'' in user_list.stdout'
      fail_msg: Chef user not found
      success_msg: Chef user exists
    tags: molecule-notest
  - name: Check Chef organization list
    ansible.builtin.command:
      cmd: sudo chef-server-ctl org-list
    register: org_list
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef organization was created
    ansible.builtin.assert:
      that:
      - '''lab'' in org_list.stdout'
      fail_msg: Chef organization not found
      success_msg: Chef organization exists
    tags: molecule-notest
  - name: Check network listening on port 443
    ansible.builtin.wait_for:
      port: 443
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is succeeded
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
  - name: Check Web UI access
    ansible.builtin.uri:
      url: https://automate.chef.lab/
      validate_certs: false
      status_code: 200
    register: web_ui
    failed_when: false
    tags: molecule-notest
