---
chef_automate_hostname: automate.chef.lab
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_accept_terms: true
chef_automate_products:
  - automate
  - infra-server
chef_automate_kernel_params:
  vm.max_map_count: 262144
  vm.dirty_expire_centisecs: 20000
chef_automate_user:
  name: "{{ username | default('jtonello') }}"
  fullname: "{{ full_name | default('John Tonello') }}"
  email: "{{ email | default('jtonello@chef.lab') }}"
  password: "{{ password | default('password') }}"
  filename: "{{ username | default('jtonello') }}.pem"
chef_automate_org:
  name: lab
  fullname: Chef Lab
  filename: lab-validator.pem
