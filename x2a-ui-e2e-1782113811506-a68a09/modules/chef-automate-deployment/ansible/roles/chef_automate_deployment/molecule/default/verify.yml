- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl settings file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl settings file not found
      success_msg: Sysctl settings file exists
  - name: Get sysctl content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl settings are correct
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: Sysctl settings not configured correctly
      success_msg: Sysctl settings configured correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: cli_file
  - name: Assert Chef Automate CLI file exists
    ansible.builtin.assert:
      that:
      - cli_file.stat.exists
      - cli_file.stat.isreg
      - cli_file.stat.executable
      fail_msg: Chef Automate CLI file not found or not executable
      success_msg: Chef Automate CLI file exists and is executable
  - name: Check Chef Automate status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/log/chef-automate/status.log
    register: automate_status_file
  - name: Assert Chef Automate status file exists
    ansible.builtin.assert:
      that:
      - automate_status_file.stat.exists
      - automate_status_file.stat.isreg
      fail_msg: Chef Automate status file not found
      success_msg: Chef Automate status file exists
  - name: Get Chef Automate status content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/log/chef-automate/status.log
    register: automate_status_content
    when: automate_status_file.stat.exists
  - name: Assert Chef Automate services are running
    ansible.builtin.assert:
      that:
      - '''chef-automate: running'' in (automate_status_content.content | b64decode)'
      - '''postgresql: running'' in (automate_status_content.content | b64decode)'
      - '''elasticsearch: running'' in (automate_status_content.content | b64decode)'
      - '''infra-server: running'' in (automate_status_content.content | b64decode)'
      fail_msg: Chef Automate services not running correctly
      success_msg: Chef Automate services running correctly
    when: automate_status_file.stat.exists
  - name: Check Chef Infra Server status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/log/chef-server/status.log
    register: server_status_file
  - name: Assert Chef Infra Server status file exists
    ansible.builtin.assert:
      that:
      - server_status_file.stat.exists
      - server_status_file.stat.isreg
      fail_msg: Chef Infra Server status file not found
      success_msg: Chef Infra Server status file exists
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.isreg
      fail_msg: User key file not found
      success_msg: User key file exists
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_key_file
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.isreg
      fail_msg: Organization validator key file not found
      success_msg: Organization validator key file exists
  - name: Check user list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/log/chef-server/user-list.log
    register: user_list_file
  - name: Assert user list file exists
    ansible.builtin.assert:
      that:
      - user_list_file.stat.exists
      - user_list_file.stat.isreg
      fail_msg: User list file not found
      success_msg: User list file exists
  - name: Get user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/log/chef-server/user-list.log
    register: user_list_content
    when: user_list_file.stat.exists
  - name: Assert user exists
    ansible.builtin.assert:
      that:
      - '''jtonello'' in (user_list_content.content | b64decode)'
      fail_msg: User not found in user list
      success_msg: User found in user list
    when: user_list_file.stat.exists
  - name: Check organization list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/log/chef-server/org-list.log
    register: org_list_file
  - name: Assert organization list file exists
    ansible.builtin.assert:
      that:
      - org_list_file.stat.exists
      - org_list_file.stat.isreg
      fail_msg: Organization list file not found
      success_msg: Organization list file exists
  - name: Get organization list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/log/chef-server/org-list.log
    register: org_list_content
    when: org_list_file.stat.exists
  - name: Assert organization exists
    ansible.builtin.assert:
      that:
      - '''lab'' in (org_list_content.content | b64decode)'
      fail_msg: Organization not found in organization list
      success_msg: Organization found in organization list
    when: org_list_file.stat.exists
  - name: Check netstat output file
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/log/netstat.log
    register: netstat_file
    tags: molecule-notest
  - name: Assert netstat file exists
    ansible.builtin.assert:
      that:
      - netstat_file.stat.exists
      - netstat_file.stat.isreg
      fail_msg: Netstat output file not found
      success_msg: Netstat output file exists
    tags: molecule-notest
  - name: Get netstat content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/log/netstat.log
    register: netstat_content
    when: netstat_file.stat.exists
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - '''0.0.0.0:443'' in (netstat_content.content | b64decode)'
      fail_msg: Port 443 not listening
      success_msg: Port 443 is listening
    when: netstat_file.stat.exists
    tags: molecule-notest
  - name: Check health check response file
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/log/chef-automate/health.json
    register: health_file
    tags: molecule-notest
  - name: Assert health check file exists
    ansible.builtin.assert:
      that:
      - health_file.stat.exists
      - health_file.stat.isreg
      fail_msg: Health check response file not found
      success_msg: Health check response file exists
    tags: molecule-notest
  - name: Get health check content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/log/chef-automate/health.json
    register: health_content
    when: health_file.stat.exists
    tags: molecule-notest
  - name: Assert health check status is ok
    ansible.builtin.assert:
      that:
      - '''status": "ok"'' in (health_content.content | b64decode)'
      fail_msg: Health check status not ok
      success_msg: Health check status is ok
    when: health_file.stat.exists
    tags: molecule-notest
