---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create base directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/tmp
        - /tmp/molecule_test/var/log/chef-automate
        - /tmp/molecule_test/var/log/chef-server

    # Simulate system configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    - name: Create sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate Chef Automate CLI installation
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          echo "Chef Automate CLI v0.1.0"
          echo "This is a mock CLI for molecule testing"
        dest: "/tmp/molecule_test/tmp/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          chef-automate: running
          postgresql: running
          elasticsearch: running
          infra-server: running
        dest: "/tmp/molecule_test/var/log/chef-automate/status.log"
        mode: "0644"

    # Simulate Chef Infra Server deployment
    - name: Create Chef Infra Server status file
      ansible.builtin.copy:
        content: |
          run: pid 12345
          log: /var/log/chef-server/server.log
          config: /etc/chef-server/chef-server.rb
        dest: "/tmp/molecule_test/var/log/chef-server/status.log"
        mode: "0644"

    # Simulate user and organization creation
    - name: Create user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAx4UbaPrYw8RBeUI6vs5h7NCUu15uOTRTbzYrLg==
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/jtonello.pem"
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAx4UbaPrYw8RBeUI6vs5h7NCUu15uOTRTbzYrLg==
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/lab-validator.pem"
        mode: "0600"

    - name: Create user list file
      ansible.builtin.copy:
        content: "jtonello"
        dest: "/tmp/molecule_test/var/log/chef-server/user-list.log"
        mode: "0644"

    - name: Create organization list file
      ansible.builtin.copy:
        content: "lab"
        dest: "/tmp/molecule_test/var/log/chef-server/org-list.log"
        mode: "0644"

    # Simulate network services
    - name: Create netstat output file
      ansible.builtin.copy:
        content: |
          tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/nginx
        dest: "/tmp/molecule_test/var/log/netstat.log"
        mode: "0644"

    # Simulate health check response
    - name: Create health check response file
      ansible.builtin.copy:
        content: |
          {
            "status": "ok",
            "services": [
              {"name": "automate", "status": "ok"},
              {"name": "infra-server", "status": "ok"}
            ]
          }
        dest: "/tmp/molecule_test/var/log/chef-automate/health.json"
        mode: "0644"