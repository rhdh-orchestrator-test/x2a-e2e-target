---
- name: Restart Chef Automate
  ansible.builtin.command:
    cmd: sudo chef-automate restart
  listen: restart chef automate
  ignore_errors: true
  register: restart_result
  changed_when: restart_result.rc == 0
  failed_when: restart_result.rc != 0 and "already running" not in restart_result.stderr
- name: Restart Chef Infra Server
  ansible.builtin.command:
    cmd: sudo chef-server-ctl restart
  listen: restart chef server
  ignore_errors: true
  register: restart_result
  changed_when: restart_result.rc == 0
  failed_when: restart_result.rc != 0 and "already running" not in restart_result.stderr
