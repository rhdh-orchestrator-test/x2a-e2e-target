---
- name: Check if Chef Automate is already deployed
  ansible.builtin.command:
    cmd: sudo chef-automate status
  register: automate_status
  changed_when: false
  failed_when: false
  ignore_errors: true
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "sudo {{ chef_automate_cli_path }} deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower
      }}\n"
  when:
    - automate_status.rc != 0
    - chef_automate_deploy_automate | bool
    - chef_automate_deploy_infra_server | bool
  register: deploy_result
  changed_when: deploy_result.rc == 0
  failed_when:
    - deploy_result.rc != 0
    - "'already deployed' not in deploy_result.stderr"
