---
- name: Check if user already exists
  ansible.builtin.command:
    cmd: sudo chef-server-ctl user-list | grep {{ chef_automate_username }}
  register: user_exists
  changed_when: false
  failed_when: false
  ignore_errors: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl user-create {{ chef_automate_username }} {{ chef_automate_full_name }} {{ chef_automate_email }} "{{ chef_automate_password }}" --filename
      {{ chef_automate_user_key_file }}

      '
  when: user_exists.rc != 0
  register: user_create
  changed_when: user_create.rc == 0
  no_log: true
- name: Set proper permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_automate_user_key_file }}"
    mode: "0600"
    state: file
  when: user_create is changed
- name: Check if organization already exists
  ansible.builtin.command:
    cmd: sudo chef-server-ctl org-list | grep {{ chef_automate_org_name }}
  register: org_exists
  changed_when: false
  failed_when: false
  ignore_errors: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_full_name }}" --association_user {{ chef_automate_username }} --filename
      {{ chef_automate_org_key_file }}

      '
  when: org_exists.rc != 0
  register: org_create
  changed_when: org_create.rc == 0
- name: Set proper permissions on organization key file
  ansible.builtin.file:
    path: "{{ chef_automate_org_key_file }}"
    mode: "0600"
    state: file
  when: org_create is changed
