---
- name: Check if user key file exists
  ansible.builtin.stat:
    path: "{{ chef_user_key_file }}"
  register: user_key_stat
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ user_full_name }}" {{ user_email }} "{{ password }}" --filename {{ chef_user_key_file }}
    creates: "{{ chef_user_key_file }}"
  become: true
  register: create_user
  changed_when: create_user.rc == 0
  failed_when:
    - create_user.rc != 0
    - "'already exists' not in create_user.stderr"
  when: not user_key_stat.stat.exists
- name: Check if organization key file exists
  ansible.builtin.stat:
    path: "{{ chef_org_key_file }}"
  register: org_key_stat
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ organization_name }} "{{ organization_name | title }} Organization" --association_user {{ username }} --filename {{
      chef_org_key_file }}
    creates: "{{ chef_org_key_file }}"
  become: true
  register: create_org
  changed_when: create_org.rc == 0
  failed_when:
    - create_org.rc != 0
    - "'already exists' not in create_org.stderr"
  when: not org_key_stat.stat.exists
