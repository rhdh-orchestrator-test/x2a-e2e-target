- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-server
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/chef-server
    - /tmp/molecule_test/var/log/chef-automate
    - /tmp/molecule_test/var/log/chef-server
    - /tmp/molecule_test/usr/bin
  - name: Create mock Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        echo "Chef Automate deployed"

        exit 0

        '
      dest: /tmp/molecule_test/usr/bin/chef-automate
      mode: '0755'
  - name: Create mock Chef Server control binary
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Server control mock"

        echo "Chef Server deployed"

        exit 0

        '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create mock Chef Automate configuration
    ansible.builtin.copy:
      content: '# Mock Chef Automate configuration

        [global]

        hostname = "automate.chef.lab"

        '
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create mock Chef Server configuration
    ansible.builtin.copy:
      content: '# Mock Chef Server configuration

        nginx[''server_name''] = "automate.chef.lab"

        nginx[''ssl_certificate''] = "/var/opt/chef-server/ssl/certs/automate.chef.lab.crt"

        nginx[''ssl_certificate_key''] = "/var/opt/chef-server/ssl/private/automate.chef.lab.key"

        '
      dest: /tmp/molecule_test/etc/chef-server/chef-server.rb
      mode: '0644'
  - name: Create mock user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5Nk8YbFJlVpMM+p0ZGtrnSRnz7Xf+cfJgsBZ1SCzjfFdQ==

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create mock organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5Nk8YbFJlVpMM+p0ZGtrnSRnz7Xf+cfJgsBZ1SCzjfFdQ==

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create mock sysctl configuration
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create mock Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: automate-load-balancer

        Status: running

        Service: automate-cs-bookshelf

        Status: running

        Service: automate-cs-oc-bifrost

        Status: running

        Service: automate-cs-oc-erchef

        Status: running

        Service: automate-cs-nginx

        Status: running

        '
      dest: /tmp/molecule_test/var/log/chef-automate/status.log
      mode: '0644'
  - name: Create mock user list file
    ansible.builtin.copy:
      content: 'jtonello

        '
      dest: /tmp/molecule_test/var/opt/chef-server/users.txt
      mode: '0644'
  - name: Create mock organization list file
    ansible.builtin.copy:
      content: 'lab

        '
      dest: /tmp/molecule_test/var/opt/chef-server/orgs.txt
      mode: '0644'
  - name: Set required variables
    ansible.builtin.set_fact:
      username: jtonello
      password: password123
      user_full_name: John Tonello
      user_email: jtonello@example.com
      organization_name: lab
