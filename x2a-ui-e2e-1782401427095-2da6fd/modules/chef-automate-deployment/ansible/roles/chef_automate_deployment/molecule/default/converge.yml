---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/systemd/system
        - /tmp/molecule_test/var/log/chef-automate
        - /tmp/molecule_test/var/opt/chef-automate

    # Simulate system configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate Chef Automate CLI binary
    - name: Create Chef Automate CLI binary file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate Chef Automate configuration
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          [global]
            v1 = true
          [deployment]
            products = ["automate", "infra-server"]
          [license]
            acceptance = "accept-terms-and-mlsa"
        dest: "/tmp/molecule_test/etc/chef-automate/config.toml"
        mode: "0644"

    # Simulate Chef Automate service
    - name: Create Chef Automate service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Automate
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/chef-automate start
          ExecStop=/usr/bin/chef-automate stop
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: "/tmp/molecule_test/etc/systemd/system/chef-automate.service"
        mode: "0644"

    # Simulate Chef Infra Server service
    - name: Create Chef Infra Server service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Infra Server
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/chef-server-ctl start
          ExecStop=/usr/bin/chef-server-ctl stop
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: "/tmp/molecule_test/etc/systemd/system/chef-server.service"
        mode: "0644"

    # Simulate user and organization keys
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/jtonello.pem"
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORG VALIDATOR KEY\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/lab-validator.pem"
        mode: "0600"

    # Simulate Chef Automate logs
    - name: Create Chef Automate log file
      ansible.builtin.copy:
        content: |
          [2023-01-01T00:00:00Z] INFO: Chef Automate started successfully
          [2023-01-01T00:00:01Z] INFO: Chef Infra Server integration complete
        dest: "/tmp/molecule_test/var/log/chef-automate/automate.log"
        mode: "0644"

  vars:
    chef_automate_hostname: automate.chef.lab
    username: jtonello
    chef_org_name: lab