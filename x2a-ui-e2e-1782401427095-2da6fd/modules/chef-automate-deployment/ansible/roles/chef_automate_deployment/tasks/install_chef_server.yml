---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_download_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate_linux_amd64.zip > {{ chef_automate_binary_path }}
    creates: "{{ chef_automate_binary_path }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_binary_path }}"
    mode: "0755"
    state: file
- name: Check if Chef Infra Server is already deployed
  ansible.builtin.stat:
    path: /etc/chef-server/chef-server.rb
  register: chef_server_config
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_binary_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}"
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
  failed_when: chef_server_deploy.rc != 0
  async: 3600
  poll: 30
  when: not chef_server_config.stat.exists
