---
controller_credential_types:
- name: Chef User Password
  description: Credential type for Chef User Password
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: 'Chef user account username (default: jtonello)'
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef user account
    - id: full_name
      type: string
      label: Full Name
      help_text: 'Full name for the Chef user account (default: John Tonello)'
    - id: email
      type: string
      label: Email
      help_text: 'Email address for the Chef user account (default: jtonello@chef.lab)'
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
