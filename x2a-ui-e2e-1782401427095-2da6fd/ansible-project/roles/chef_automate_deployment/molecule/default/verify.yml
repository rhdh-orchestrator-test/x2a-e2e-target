---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check sysctl configuration file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are set correctly
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count = 262144' in (sysctl_content.content | b64decode)"
          - "'vm.dirty_expire_centisecs = 20000' in (sysctl_content.content | b64decode)"
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate installation checks
    - name: Check Chef Automate CLI binary
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_binary

    - name: Assert Chef Automate CLI binary exists
      ansible.builtin.assert:
        that:
          - chef_automate_binary.stat.exists
          - chef_automate_binary.stat.isreg
          - chef_automate_binary.stat.executable
        fail_msg: "Chef Automate CLI binary not found or not executable"
        success_msg: "Chef Automate CLI binary exists and is executable"

    - name: Check Chef Automate config file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config

    - name: Assert Chef Automate config file exists
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
          - chef_automate_config.stat.isreg
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    - name: Get Chef Automate config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config_content
      when: chef_automate_config.stat.exists

    - name: Assert Chef Automate config contains expected values
      ansible.builtin.assert:
        that:
          - "'products = [\"automate\", \"infra-server\"]' in (chef_automate_config_content.content | b64decode)"
          - "'acceptance = \"accept-terms-and-mlsa\"' in (chef_automate_config_content.content | b64decode)"
        fail_msg: "Chef Automate config does not contain expected values"
        success_msg: "Chef Automate config contains expected values"
      when: chef_automate_config.stat.exists

    # Service checks (tagged for skipping in container)
    - name: Check Chef Automate service
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      register: chef_automate_service

    - name: Assert Chef Automate service file exists
      ansible.builtin.assert:
        that:
          - chef_automate_service.stat.exists
          - chef_automate_service.stat.isreg
        fail_msg: "Chef Automate service file not found"
        success_msg: "Chef Automate service file exists"

    - name: Check Chef Automate service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "ansible_facts.services['chef-automate.service'].state == 'running'"
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    # Chef Infra Server checks
    - name: Check Chef Infra Server service
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/systemd/system/chef-server.service
      register: chef_server_service

    - name: Assert Chef Infra Server service file exists
      ansible.builtin.assert:
        that:
          - chef_server_service.stat.exists
          - chef_server_service.stat.isreg
        fail_msg: "Chef Infra Server service file not found"
        success_msg: "Chef Infra Server service file exists"

    - name: Check Chef Infra Server service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Infra Server service is running
      ansible.builtin.assert:
        that:
          - "'chef-server.service' in ansible_facts.services"
          - "ansible_facts.services['chef-server.service'].state == 'running'"
        fail_msg: "Chef Infra Server service is not running"
        success_msg: "Chef Infra Server service is running"
      tags: molecule-notest

    # User and organization checks
    - name: Check user key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.isreg
          - user_key_file.stat.size > 0
        fail_msg: "User key file not found or empty"
        success_msg: "User key file exists"

    - name: Check organization validator key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_validator_key_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_validator_key_file.stat.exists
          - org_validator_key_file.stat.isreg
          - org_validator_key_file.stat.size > 0
        fail_msg: "Organization validator key file not found or empty"
        success_msg: "Organization validator key file exists"

    # Network and API checks (tagged for skipping in container)
    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      ignore_errors: true
      register: port_check
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is success
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    - name: Check Chef Automate API health
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
        status_code: 200
      register: api_health
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Automate API is healthy
      ansible.builtin.assert:
        that:
          - api_health is success
        fail_msg: "Chef Automate API health check failed"
        success_msg: "Chef Automate API is healthy"
      tags: molecule-notest

    - name: Check Chef Automate web UI
      ansible.builtin.uri:
        url: https://localhost/
        validate_certs: false
        method: HEAD
        status_code: 200
      register: web_ui
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Automate web UI is accessible
      ansible.builtin.assert:
        that:
          - web_ui is success
        fail_msg: "Chef Automate web UI is not accessible"
        success_msg: "Chef Automate web UI is accessible"
      tags: molecule-notest

    # Log checks
    - name: Check Chef Automate log file
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/chef-automate/automate.log
      register: chef_automate_log

    - name: Assert Chef Automate log file exists
      ansible.builtin.assert:
        that:
          - chef_automate_log.stat.exists
          - chef_automate_log.stat.isreg
          - chef_automate_log.stat.size > 0
        fail_msg: "Chef Automate log file not found or empty"
        success_msg: "Chef Automate log file exists"