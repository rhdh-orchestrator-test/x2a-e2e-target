---
- name: Create Nginx available sites directory
  ansible.builtin.file:
    path: /etc/nginx/sites-available
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create Nginx enabled sites directory
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Render Nginx virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_site['value']['id'] }} # noqa: R114 - path from role-defined sites
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Reload nginx
  vars:
    server_name: "{{ item_site['value']['id'] }}"
    document_root: "{{ item_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_site['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_certificate_path }}/{{ item_site['value']['id'] }}.crt"
    key_file: "{{ nginx_multisite_private_key_path }}/{{ item_site['value']['id'] }}.key"

- name: Enable Nginx virtual host configurations
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_site['value']['id'] }}
    dest: /etc/nginx/sites-enabled/{{ item_site['value']['id'] }} # noqa: R114 - path from role-defined sites
    state: link
    owner: root
    group: root
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Reload nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
