---
nginx_multisite_sites:
  ci.cluster.local:
    id: ci.cluster.local
    document_root: /var/www/ci.cluster.local
    ssl_enabled: true
    index_source: ci.cluster.local/index.html
  status.cluster.local:
    id: status.cluster.local
    document_root: /var/www/status.cluster.local
    ssl_enabled: true
    index_source: status.cluster.local/index.html
  test.cluster.local:
    id: test.cluster.local
    document_root: /var/www/test.cluster.local
    ssl_enabled: true
    index_source: test.cluster.local/index.html
