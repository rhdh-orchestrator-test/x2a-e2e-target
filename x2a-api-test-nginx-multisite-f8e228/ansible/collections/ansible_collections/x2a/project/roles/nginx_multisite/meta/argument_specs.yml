---
argument_specs:
  main:
    short_description: Install and configure a secure multi-site Nginx server
    description:
      - Installs Nginx, Fail2ban, firewall packages, and TLS tooling.
      - Configures SSL-enabled virtual hosts and host security settings.
    options:
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory containing site certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory containing site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban security configuration is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_disable_root:
        type: bool
        required: false
        default: true
        description: Whether root SSH login is disabled.
      nginx_multisite_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide sensitive task output by default.
      site_token:
        type: str
        required: true
        description: Site token injected by an AAP credential type.
