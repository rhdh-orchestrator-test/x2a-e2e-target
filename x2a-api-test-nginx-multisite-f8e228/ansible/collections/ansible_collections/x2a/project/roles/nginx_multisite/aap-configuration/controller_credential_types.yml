---
controller_credential_types:
  - name: Encrypted Data Bag Nginx Site Token
    description: Encrypted Chef data-bag token used by Nginx and written to the protected site token file.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Nginx Site Token
          secret: true
          help_text: Secret token read from the encrypted Chef data bag and written for Nginx site configuration.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
