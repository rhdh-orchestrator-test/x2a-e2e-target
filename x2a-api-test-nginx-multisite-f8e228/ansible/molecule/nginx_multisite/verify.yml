---
# Unsupported pre-flight checks: service status, package queries, UFW numbered output,
# sysctl values, nginx -t/nginx -T diagnostics, journal output, exact certificate
# lifetime, and SSH port status have no stated expected outcome suitable for assertion.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: false
  vars:
    nginx_multisite_sites:
      - name: ci.cluster.local
        document_root: /var/www/ci.cluster.local
        site_config: /etc/nginx/sites-available/ci.cluster.local
        enabled_link: /etc/nginx/sites-enabled/ci.cluster.local
        certificate: /etc/ssl/certs/ci.cluster.local.crt
        private_key: /etc/ssl/private/ci.cluster.local.key
      - name: status.cluster.local
        document_root: /var/www/status.cluster.local
        site_config: /etc/nginx/sites-available/status.cluster.local
        enabled_link: /etc/nginx/sites-enabled/status.cluster.local
        certificate: /etc/ssl/certs/status.cluster.local.crt
        private_key: /etc/ssl/private/status.cluster.local.key
      - name: test.cluster.local
        document_root: /var/www/test.cluster.local
        site_config: /etc/nginx/sites-available/test.cluster.local
        enabled_link: /etc/nginx/sites-enabled/test.cluster.local
        certificate: /etc/ssl/certs/test.cluster.local.crt
        private_key: /etc/ssl/private/test.cluster.local.key
  tasks:
    - name: Read firewall status for the explicit UFW expectations
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: nginx_multisite_ufw_status
      changed_when: false

    - name: Assert UFW is active with the required policy and rules
      ansible.builtin.assert:
        that:
          - "'Status: active' in nginx_multisite_ufw_status.stdout"
          - nginx_multisite_ufw_status.stdout is regex('Default:.*deny.*incoming')
          - nginx_multisite_ufw_status.stdout is regex('(?im)(22/tcp|ssh|OpenSSH)')
          - nginx_multisite_ufw_status.stdout is regex('(?im)(80/tcp|http)')
          - nginx_multisite_ufw_status.stdout is regex('(?im)(443/tcp|https)')
        fail_msg: UFW does not match the explicitly required active deny-incoming policy or allowances.

    - name: Read SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: nginx_multisite_sshd_config

    - name: Assert the explicitly required SSH hardening values
      ansible.builtin.assert:
        that:
          - nginx_multisite_sshd_config.content | b64decode is regex('(?m)^\\s*PermitRootLogin\\s+no\\s*$')
          - nginx_multisite_sshd_config.content | b64decode is regex('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')
        fail_msg: SSH hardening does not contain both required values.

    - name: Check explicitly listed configuration and secret paths
      ansible.builtin.stat:
        path: "{{ item_path }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/nginx/secrets
        - /etc/nginx/secrets/site_token
      loop_control:
        loop_var: item_path
      register: nginx_multisite_fixed_path_stats

    - name: Assert explicitly listed configuration and secret paths exist
      ansible.builtin.assert:
        that:
          - item_path_stat['stat']['exists']
        fail_msg: An explicitly required configuration or secret path is missing.
      loop: "{{ nginx_multisite_fixed_path_stats['results'] }}"
      loop_control:
        loop_var: item_path_stat

    - name: Assert the explicitly required secret permissions
      ansible.builtin.assert:
        that:
          - nginx_multisite_fixed_path_stats['results'][4]['stat']['mode'] == '0700'
          - nginx_multisite_fixed_path_stats['results'][5]['stat']['mode'] == '0600'
        fail_msg: The Nginx secret directory or token does not have the required mode.

    - name: Check required site directories
      ansible.builtin.stat:
        path: "{{ item_site['document_root'] }}"
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site
      register: nginx_multisite_site_root_stats

    - name: Assert each explicit site document root exists
      ansible.builtin.assert:
        that:
          - item_site_root['stat']['exists']
          - item_site_root['stat']['isdir']
        fail_msg: A required site document root is missing.
      loop: "{{ nginx_multisite_site_root_stats['results'] }}"
      loop_control:
        loop_var: item_site_root

    - name: Check site index files
      ansible.builtin.stat:
        path: "{{ item_site['document_root'] }}/index.html"
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site
      register: nginx_multisite_index_stats

    - name: Assert each explicit site index file exists
      ansible.builtin.assert:
        that:
          - item_site_index['stat']['exists']
          - item_site_index['stat']['isreg']
        fail_msg: A required site index file is missing.
      loop: "{{ nginx_multisite_index_stats['results'] }}"
      loop_control:
        loop_var: item_site_index

    - name: Read site configuration files
      ansible.builtin.slurp:
        src: "{{ item_site['site_config'] }}"
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site
      register: nginx_multisite_site_configs

    - name: Assert each site has the explicitly required Nginx settings
      ansible.builtin.assert:
        that:
          - item_site_config['content'] | b64decode is regex('server_name\\s+' ~ item_site_config['item']['name'])
          - item_site_config['content'] | b64decode is regex('root\\s+' ~ item_site_config['item']['document_root'])
          - item_site_config['content'] | b64decode is regex('ssl_certificate\\s+' ~ item_site_config['item']['certificate'])
          - item_site_config['content'] | b64decode is regex('ssl_certificate_key\\s+' ~ item_site_config['item']['private_key'])
        fail_msg: A site configuration does not contain its required virtual-host settings.
      loop: "{{ nginx_multisite_site_configs['results'] }}"
      loop_control:
        loop_var: item_site_config

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_site['enabled_link'] }}"
        follow: false
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site
      register: nginx_multisite_link_stats

    - name: Assert each site link points to its available configuration
      ansible.builtin.assert:
        that:
          - item_site_link['stat']['exists']
          - item_site_link['stat']['islnk']
          - item_site_link['stat']['lnk_source'] == item_site_link['item']['site_config']
        fail_msg: An enabled site link is missing or points to the wrong configuration.
      loop: "{{ nginx_multisite_link_stats['results'] }}"
      loop_control:
        loop_var: item_site_link

    - name: Check that the default enabled site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: nginx_multisite_default_site

    - name: Assert the default enabled site is absent
      ansible.builtin.assert:
        that:
          - not nginx_multisite_default_site['stat']['exists']
        fail_msg: The default Nginx enabled site must be absent.

    - name: Check site certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_site['certificate'] }}"
          - -noout
          - -subject
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site
      register: nginx_multisite_certificate_subjects
      changed_when: false

    - name: Assert each certificate has the explicitly required subject name
      ansible.builtin.assert:
        that:
          - item_certificate['stdout'] is regex('CN\\s*=\\s*' ~ item_certificate['item']['name'])
        fail_msg: A site certificate does not contain the required common name.
      loop: "{{ nginx_multisite_certificate_subjects['results'] }}"
      loop_control:
        loop_var: item_certificate

    - name: Check private key ownership and mode
      ansible.builtin.stat:
        path: "{{ item_site['private_key'] }}"
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site
      register: nginx_multisite_key_stats

    - name: Assert each private key has the explicitly required ownership and mode
      ansible.builtin.assert:
        that:
          - item_key['stat']['exists']
          - item_key['stat']['pw_name'] == 'root'
          - item_key['stat']['gr_name'] == 'ssl-cert'
          - item_key['stat']['mode'] == '0640'
        fail_msg: A site private key does not have the required ownership or mode.
      loop: "{{ nginx_multisite_key_stats['results'] }}"
      loop_control:
        loop_var: item_key

    - name: Check Nginx HTTP and HTTPS listeners
      ansible.builtin.wait_for:
        port: "{{ item_port }}"
        host: 127.0.0.1
        state: started
        timeout: 5
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_port

    - name: Verify each site responds over HTTP with its explicit Host header
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_site['name'] }}"
        method: HEAD
        return_content: false
        status_code: 200
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site

    - name: Verify each site responds over HTTPS with its explicit Host header
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_site['name'] }}"
        method: HEAD
        return_content: false
        validate_certs: false
        status_code: 200
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site
