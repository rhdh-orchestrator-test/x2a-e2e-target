---
controller_credentials:
- name: Chef Server Admin - website_https
  description: Admin credentials for Chef Server setup
  organization: Default
  credential_type: Chef Server Admin
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Chef Automate Admin - website_https
  description: Admin credentials for Chef Automate
  organization: Default
  credential_type: Chef Automate Admin
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
