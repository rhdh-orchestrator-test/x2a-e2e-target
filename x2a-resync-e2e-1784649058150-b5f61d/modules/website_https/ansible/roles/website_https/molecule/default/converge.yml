---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/apache2/certs
        - /tmp/molecule_test/etc/apache2/sites-available
        - /tmp/molecule_test/etc/apache2/sites-enabled
        - /tmp/molecule_test/var/www/helloworld

    # Create mock SSL certificates
    - name: Create mock SSL key file
      ansible.builtin.copy:
        content: "# Mock SSL private key for testing"
        dest: /tmp/molecule_test/etc/apache2/certs/apache.key
        mode: "0640"

    - name: Create mock SSL CSR file
      ansible.builtin.copy:
        content: "# Mock SSL CSR for testing"
        dest: /tmp/molecule_test/etc/apache2/certs/apache.csr
        mode: "0640"

    - name: Create mock SSL certificate file
      ansible.builtin.copy:
        content: "# Mock SSL certificate for testing"
        dest: /tmp/molecule_test/etc/apache2/certs/apache.crt
        mode: "0640"

    # Create virtual host configuration
    - name: Create virtual host configuration
      ansible.builtin.copy:
        content: |
          <VirtualHost *:443>
           DocumentRoot "/var/www/helloworld"
           SSLEngine on
           SSLCertificateFile /etc/apache2/certs/apache.crt
           SSLCertificateKeyFile /etc/apache2/certs/apache.key
            <Directory "/var/www/helloworld">
              allow from all
              Options None
              Require all granted
            </Directory>
          </VirtualHost>
        dest: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
        mode: "0640"

    # Create website content
    - name: Create website index file
      ansible.builtin.copy:
        content: |
          <html>
            <head><title>Test Site</title></head>
            <body>
             <h1>Hello, world!</h1>
             <p>The site is up and running</p>
            </body>
          </html>
        dest: /tmp/molecule_test/var/www/helloworld/index.html
        mode: "0644"

    # Create symlink to simulate enabled site
    - name: Create sites-enabled symlink directory
      ansible.builtin.file:
        path: /tmp/molecule_test/etc/apache2/sites-enabled
        state: directory
        mode: "0755"

    - name: Create mock enabled site symlink
      ansible.builtin.copy:
        content: "# This file simulates the enabled site symlink"
        dest: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
        mode: "0640"

    # Create mock for enabled SSL module
    - name: Create mods-enabled directory
      ansible.builtin.file:
        path: /tmp/molecule_test/etc/apache2/mods-enabled
        state: directory
        mode: "0755"

    - name: Create mock SSL module file
      ansible.builtin.copy:
        content: "# This file simulates the enabled SSL module"
        dest: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.load
        mode: "0640"