---
- name: Install Redis server package
  ansible.builtin.package:
    name: "{{ 'redis-server' if ansible_facts.os_family == 'Debian' else 'redis' }}"
    state: present

- name: Enable and start Redis server
  ansible.builtin.service:
    name: "{{ 'redis-server' if ansible_facts.os_family == 'Debian' else 'redis' }}"
    enabled: true
    state: started
