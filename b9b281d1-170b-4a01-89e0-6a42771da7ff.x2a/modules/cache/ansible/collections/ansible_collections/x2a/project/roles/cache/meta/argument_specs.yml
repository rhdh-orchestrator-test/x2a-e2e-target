---
argument_specs:
  main:
    short_description: Install and enable the Redis cache service
    description:
      - Installs the Redis server package and enables the Redis server service at boot.
      - Starts the Redis server immediately without managing its configuration.
    options:
      cache_my_variable:
        type: str
        default: default_value
        description:
          - Example role variable retained from the migrated Chef role.
