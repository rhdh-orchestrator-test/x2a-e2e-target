---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
- name: Configure kernel parameters for Chef Automate
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - name: vm.max_map_count
      value: "262144"
    - name: vm.dirty_expire_centisecs
      value: "20000"
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Ensure unzip is installed
  ansible.builtin.package:
    name: unzip
    state: present
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: /tmp/chef-automate_linux_amd64.zip
    dest: "{{ chef_automate_install_dir }}"
    remote_src: true
    creates: "{{ chef_automate_install_dir }}/chef-automate"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_install_dir }}/chef-automate"
    mode: "0755"
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product automate --product infra-server --accept-terms-and-mlsa=true
    chdir: "{{ chef_automate_install_dir }}"
    creates: /hab
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_automate_username }}  {{ chef_automate_longusername }} {{ chef_automate_useremail }}  "{{ chef_automate_userpassword
      }}" --filename {{ chef_automate_userfilename }}

      '
    creates: "{{ chef_automate_userfilename }}"
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_orgname }}  "{{ chef_automate_longorgname }}" --association_user {{ chef_automate_username }}  --filename {{
      chef_automate_orgfilename }}

      '
    creates: "{{ chef_automate_orgfilename }}"
  become: true
