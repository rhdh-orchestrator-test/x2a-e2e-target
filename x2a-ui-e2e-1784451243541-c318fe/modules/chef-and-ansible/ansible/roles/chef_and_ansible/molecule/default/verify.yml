- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check Apache certificate files exist
    ansible.builtin.stat:
      path: '{{ item }}'
    register: cert_files
    loop:
    - /tmp/molecule_test/etc/apache2/certs/apache.crt
    - /tmp/molecule_test/etc/apache2/certs/apache.key
    - /tmp/molecule_test/etc/apache2/certs/apache.csr
  - name: Assert certificate files were created
    ansible.builtin.assert:
      that:
      - item.stat.exists
      - item.stat.size > 0
      fail_msg: Certificate file {{ item.item }} not found or empty
      success_msg: Certificate file {{ item.item }} exists
    loop: '{{ cert_files.results }}'
  - name: Check virtual host configuration exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
    register: vhost_config
  - name: Assert virtual host configuration was created
    ansible.builtin.assert:
      that:
      - vhost_config.stat.exists
      - vhost_config.stat.size > 0
      fail_msg: Virtual host configuration not found or empty
      success_msg: Virtual host configuration exists
  - name: Check website content exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/www/helloworld/index.html
    register: website_content
  - name: Assert website content was created
    ansible.builtin.assert:
      that:
      - website_content.stat.exists
      - website_content.stat.size > 0
      fail_msg: Website content not found or empty
      success_msg: Website content exists
  - name: Get website content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/www/helloworld/index.html
    register: website_content_data
  - name: Assert website content has expected HTML
    ansible.builtin.assert:
      that:
      - '''Hello, world!'' in (website_content_data.content | b64decode | string)'
      fail_msg: Website content does not contain expected HTML
      success_msg: Website content contains expected HTML
  - name: Check SSL configuration exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_config
  - name: Assert SSL configuration was created
    ansible.builtin.assert:
      that:
      - ssl_config.stat.exists
      - ssl_config.stat.size > 0
      fail_msg: SSL configuration not found or empty
      success_msg: SSL configuration exists
  - name: Get SSL configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_config_data
  - name: Assert SSL configuration has POODLE fix
    ansible.builtin.assert:
      that:
      - '''SSLProtocol -all +TLSv1.2'' in (ssl_config_data.content | b64decode | string)'
      fail_msg: SSL configuration does not contain POODLE fix
      success_msg: SSL configuration contains POODLE fix
  - name: Check site is enabled
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
    register: enabled_site
  - name: Assert site is enabled
    ansible.builtin.assert:
      that:
      - enabled_site.stat.exists
      - enabled_site.stat.islnk
      fail_msg: Site is not enabled (symlink not found)
      success_msg: Site is enabled (symlink exists)
