---
apache_package: apache2
apache_version: 2.4.41-4ubuntu3.10
apache_service: apache2
apache_certs_dir: /etc/apache2/certs
apache_sites_available: /etc/apache2/sites-available
apache_sites_enabled: /etc/apache2/sites-enabled
apache_mods_available: /etc/apache2/mods-available
website_name: helloworld
website_root: /var/www/helloworld
website_port: 443
website_ssl_enabled: true
website_ssl_protocol: -all +TLSv1.2
ssl_cert_path: "{{ apache_certs_dir }}/apache.crt"
ssl_key_path: "{{ apache_certs_dir }}/apache.key"
ssl_csr_path: "{{ apache_certs_dir }}/apache.csr"
ssl_common_name: myhost
additional_packages:
  - curl
  - openssl
  - python3-openssl
