---
- name: Ensure SSH server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present
  become: true
- name: Fix SSL in Apache
  ansible.builtin.replace:
    path: "{{ apache_mods_available }}/ssl.conf"
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol {{ website_ssl_protocol }}
    mode: "0644"
  become: true
  notify:
    - Restart apache
    - Restart sshd
