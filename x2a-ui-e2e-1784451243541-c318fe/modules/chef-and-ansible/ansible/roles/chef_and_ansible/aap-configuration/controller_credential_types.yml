---
controller_credential_types:
- name: Chef Server Admin
  description: Admin credentials for Chef Server deployment
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Admin Username
      help_text: Username for Chef Server admin account
    - id: password
      type: string
      label: Admin Password
      secret: true
      help_text: Password for Chef Server admin account
    - id: email
      type: string
      label: Admin Email
      help_text: Email address for Chef Server admin account
    required:
    - username
    - password
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
- name: SSL Certificate
  description: SSL certificates for HTTPS website
  kind: cloud
  inputs:
    fields:
    - id: certificate
      type: string
      label: SSL Certificate
      secret: true
      help_text: SSL certificate content for HTTPS
    - id: private_key
      type: string
      label: SSL Private Key
      secret: true
      help_text: Private key for SSL certificate
    required:
    - certificate
    - private_key
  injectors:
    extra_vars:
      certificate: !unsafe '{{ certificate }}'
      private_key: !unsafe '{{ private_key }}'
