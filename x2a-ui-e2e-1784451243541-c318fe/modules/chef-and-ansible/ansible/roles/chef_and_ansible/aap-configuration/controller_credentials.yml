---
controller_credentials:
- name: Chef Server Admin - chef_and_ansible
  description: Admin credentials for Chef Server deployment
  organization: Default
  credential_type: Chef Server Admin
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    email: '{{ email }}'
- name: SSL Certificate - chef_and_ansible
  description: SSL certificates for HTTPS website
  organization: Default
  credential_type: SSL Certificate
  update_secrets: true
  inputs:
    certificate: '{{ vault_certificate }}'
    private_key: '{{ vault_private_key }}'
