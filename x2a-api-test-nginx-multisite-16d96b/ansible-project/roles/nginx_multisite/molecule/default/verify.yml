---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Nginx configuration files verification
    - name: Check nginx configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/nginx/nginx.conf
        - /tmp/molecule_test/etc/nginx/conf.d/security.conf
      loop_control:
        loop_var: item_config
      register: nginx_config_stat_results

    - name: Assert nginx configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected nginx configuration file not found"
      loop: "{{ nginx_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Site-specific configuration files verification
    - name: Check nginx site configuration files exist
      ansible.builtin.stat:
        path: "{{ item_site_config }}"
      loop:
        - /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site_config
      register: site_config_stat_results

    - name: Assert site configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected site configuration file not found"
      loop: "{{ site_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Site enabled symlinks verification
    - name: Check nginx sites-enabled symlinks exist
      ansible.builtin.stat:
        path: "{{ item_symlink }}"
      loop:
        - /tmp/molecule_test/etc/nginx/sites-enabled/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_symlink
      register: symlink_stat_results

    - name: Assert site symlinks were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['islnk']
        fail_msg: "Expected site symlink not found"
      loop: "{{ symlink_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Site content files verification
    - name: Check site index.html files exist
      ansible.builtin.stat:
        path: "{{ item_content_file }}"
      loop:
        - /tmp/molecule_test/opt/server/test/index.html
        - /tmp/molecule_test/opt/server/ci/index.html
        - /tmp/molecule_test/opt/server/status/index.html
      loop_control:
        loop_var: item_content_file
      register: content_stat_results

    - name: Assert site content files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected site content file not found"
      loop: "{{ content_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # SSL certificates verification
    - name: Check SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ item_cert_file }}"
      loop:
        - /tmp/molecule_test/etc/ssl/certs/test.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/ci.cluster.local.crt
        - /tmp/molecule_test/etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_cert_file
      register: cert_stat_results

    - name: Assert SSL certificate files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate file not found"
      loop: "{{ cert_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # SSL private keys verification
    - name: Check SSL private key files exist
      ansible.builtin.stat:
        path: "{{ item_key_file }}"
      loop:
        - /tmp/molecule_test/etc/ssl/private/test.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/ci.cluster.local.key
        - /tmp/molecule_test/etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key_file
      register: key_stat_results

    - name: Assert SSL private key files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
          - item_result['stat']['mode'] == '0640'
        fail_msg: "Expected SSL private key file not found or incorrect permissions"
      loop: "{{ key_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Security configuration files verification
    - name: Check security configuration files exist
      ansible.builtin.stat:
        path: "{{ item_security_file }}"
      loop:
        - /tmp/molecule_test/etc/fail2ban/jail.local
        - /tmp/molecule_test/etc/sysctl.d/99-security.conf
        - /tmp/molecule_test/etc/ssh/sshd_config
      loop_control:
        loop_var: item_security_file
      register: security_stat_results

    - name: Assert security configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected security configuration file not found"
      loop: "{{ security_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Content verification for site-specific files
    - name: Read site configuration content
      ansible.builtin.slurp:
        src: "{{ item_site_file }}"
      loop:
        - /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
        - /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site_file
      register: site_content_results

    - name: Assert site configurations contain expected server names
      ansible.builtin.assert:
        that:
          - "'server_name test.cluster.local' in (item_result['content'] | b64decode)" when "test.cluster.local" in item_result['source']
          - "'server_name ci.cluster.local' in (item_result['content'] | b64decode)" when "ci.cluster.local" in item_result['source']
          - "'server_name status.cluster.local' in (item_result['content'] | b64decode)" when "status.cluster.local" in item_result['source']
          - "'listen 443 ssl' in (item_result['content'] | b64decode)"
          - "'ssl_certificate' in (item_result['content'] | b64decode)"
        fail_msg: "Site configuration missing expected content"
      loop: "{{ site_content_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Content verification for site index files
    - name: Read site index.html content
      ansible.builtin.slurp:
        src: "{{ item_index_file }}"
      loop:
        - /tmp/molecule_test/opt/server/test/index.html
        - /tmp/molecule_test/opt/server/ci/index.html
        - /tmp/molecule_test/opt/server/status/index.html
      loop_control:
        loop_var: item_index_file
      register: index_content_results

    - name: Assert site index files contain expected content
      ansible.builtin.assert:
        that:
          - "'Test Environment' in (item_result['content'] | b64decode)" when "test" in item_result['source']
          - "'CI/CD Dashboard' in (item_result['content'] | b64decode)" when "ci" in item_result['source']
          - "'System Status' in (item_result['content'] | b64decode)" when "status" in item_result['source']
          - "'test.cluster.local' in (item_result['content'] | b64decode)" when "test" in item_result['source']
          - "'ci.cluster.local' in (item_result['content'] | b64decode)" when "ci" in item_result['source']
          - "'status.cluster.local' in (item_result['content'] | b64decode)" when "status" in item_result['source']
        fail_msg: "Site index file missing expected content"
      loop: "{{ index_content_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Security configuration content verification
    - name: Read fail2ban configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/fail2ban/jail.local
      register: fail2ban_content

    - name: Assert fail2ban configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'[sshd]' in (fail2ban_content['content'] | b64decode)"
          - "'enabled = true' in (fail2ban_content['content'] | b64decode)"
          - "'bantime = 3600' in (fail2ban_content['content'] | b64decode)"
          - "'maxretry = 5' in (fail2ban_content['content'] | b64decode)"
        fail_msg: "Fail2ban configuration missing expected settings"

    - name: Read sysctl security configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-security.conf
      register: sysctl_content

    - name: Assert sysctl configuration contains expected security parameters
      ansible.builtin.assert:
        that:
          - "'net.ipv4.conf.default.rp_filter = 1' in (sysctl_content['content'] | b64decode)"
          - "'net.ipv4.tcp_syncookies = 1' in (sysctl_content['content'] | b64decode)"
          - "'kernel.dmesg_restrict = 1' in (sysctl_content['content'] | b64decode)"
        fail_msg: "Sysctl configuration missing expected security parameters"

    - name: Read SSH configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_content

    - name: Assert SSH configuration contains expected security settings
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (ssh_content['content'] | b64decode)"
          - "'PasswordAuthentication no' in (ssh_content['content'] | b64decode)"
        fail_msg: "SSH configuration missing expected security settings"

    - name: Read nginx security configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/conf.d/security.conf
      register: nginx_security_content

    - name: Assert nginx security configuration contains expected headers
      ansible.builtin.assert:
        that:
          - "'X-Frame-Options DENY' in (nginx_security_content['content'] | b64decode)"
          - "'X-Content-Type-Options nosniff' in (nginx_security_content['content'] | b64decode)"
          - "'X-XSS-Protection' in (nginx_security_content['content'] | b64decode)"
          - "'Strict-Transport-Security' in (nginx_security_content['content'] | b64decode)"
        fail_msg: "Nginx security configuration missing expected headers"

# Service and network checks that cannot run in container environment
- name: Verify services (container-incompatible checks)
  hosts: all
  gather_facts: false
  tasks:
    - name: Check nginx service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
        fail_msg: "Nginx service not running"
      tags: molecule-notest

    - name: Check fail2ban service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert fail2ban service is running
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
        fail_msg: "Fail2ban service not running"
      tags: molecule-notest

    - name: Check HTTP port is listening
      ansible.builtin.wait_for:
        port: 80
        host: 0.0.0.0
        timeout: 5
      tags: molecule-notest

    - name: Check HTTPS port is listening
      ansible.builtin.wait_for:
        port: 443
        host: 0.0.0.0
        timeout: 5
      tags: molecule-notest

    - name: Test HTTP to HTTPS redirect for test site
      ansible.builtin.uri:
        url: http://test.cluster.local
        method: GET
        follow_redirects: none
        status_code: 301
      tags: molecule-notest

    - name: Test HTTPS response for test site
      ansible.builtin.uri:
        url: https://test.cluster.local
        method: GET
        validate_certs: false
        status_code: 200
      tags: molecule-notest

    - name: Test HTTP to HTTPS redirect for ci site
      ansible.builtin.uri:
        url: http://ci.cluster.local
        method: GET
        follow_redirects: none
        status_code: 301
      tags: molecule-notest

    - name: Test HTTPS response for ci site
      ansible.builtin.uri:
        url: https://ci.cluster.local
        method: GET
        validate_certs: false
        status_code: 200
      tags: molecule-notest

    - name: Test HTTP to HTTPS redirect for status site
      ansible.builtin.uri:
        url: http://status.cluster.local
        method: GET
        follow_redirects: none
        status_code: 301
      tags: molecule-notest

    - name: Test HTTPS response for status site
      ansible.builtin.uri:
        url: https://status.cluster.local
        method: GET
        validate_certs: false
        status_code: 200
      tags: molecule-notest