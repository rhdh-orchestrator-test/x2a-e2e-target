---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present
- name: Enable and start fail2ban service
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
- name: Deploy fail2ban jail configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  notify: Restart fail2ban
- name: Check UFW default policy
  ansible.builtin.command:
    cmd: ufw status verbose
  register: ufw_status
  changed_when: false
  failed_when: false
- name: Set UFW default deny policy
  ansible.builtin.command:
    cmd: ufw --force default deny
  when: "'Default: deny (incoming)' not in ufw_status.stdout"
  register: ufw_default_result
  failed_when: ufw_default_result.rc != 0
- name: Check UFW SSH rule
  ansible.builtin.command:
    cmd: ufw status
  register: ufw_ssh_status
  changed_when: false
  failed_when: false
- name: Allow SSH through UFW
  ansible.builtin.command:
    cmd: ufw allow ssh
  when: "'22/tcp' not in ufw_ssh_status.stdout and 'OpenSSH' not in ufw_ssh_status.stdout"
  register: ufw_ssh_result
  failed_when: ufw_ssh_result.rc != 0
- name: Check UFW HTTP rule
  ansible.builtin.command:
    cmd: ufw status
  register: ufw_http_status
  changed_when: false
  failed_when: false
- name: Allow HTTP through UFW
  ansible.builtin.command:
    cmd: ufw allow http
  when: "'80/tcp' not in ufw_http_status.stdout and 'Apache' not in ufw_http_status.stdout"
  register: ufw_http_result
  failed_when: ufw_http_result.rc != 0
- name: Check UFW HTTPS rule
  ansible.builtin.command:
    cmd: ufw status
  register: ufw_https_status
  changed_when: false
  failed_when: false
- name: Allow HTTPS through UFW
  ansible.builtin.command:
    cmd: ufw allow https
  when: "'443/tcp' not in ufw_https_status.stdout and 'Apache Secure' not in ufw_https_status.stdout"
  register: ufw_https_result
  failed_when: ufw_https_result.rc != 0
- name: Check UFW status
  ansible.builtin.command:
    cmd: ufw status
  register: ufw_final_status
  changed_when: false
  failed_when: false
- name: Enable UFW firewall
  ansible.builtin.command:
    cmd: ufw --force enable
  when: "'Status: active' not in ufw_final_status.stdout"
  register: ufw_enable_result
  failed_when: ufw_enable_result.rc != 0
- name: Deploy kernel security parameters
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload sysctl
- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    backup: true
  when: nginx_multisite_security_ssh_disable_root
  notify: Restart ssh
- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    backup: true
  when: not nginx_multisite_security_ssh_password_auth
  notify: Restart ssh
