---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for Chef Automate and Chef Infra Server
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/systemd/system
        - /tmp/molecule_test/tmp
        - /tmp/molecule_test/var/log/chef-automate

    # Create mock Chef Automate config file
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          [global]
            v1 = true
          [deployment]
            hostname = "automate.chef.lab"
          [products]
            automate = true
            infra-server = true
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"

    # Create mock Chef Automate CLI
    - name: Create mock Chef Automate CLI
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: /tmp/molecule_test/tmp/chef-automate
        mode: "0755"

    # Create mock Chef user key file
    - name: Create mock Chef user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          MOCK_KEY_CONTENT_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/jtonello.pem
        mode: "0600"

    # Create mock Chef organization validator key file
    - name: Create mock Chef organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          MOCK_VALIDATOR_KEY_CONTENT_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/lab-validator.pem
        mode: "0600"

    # Create mock Chef Automate service file
    - name: Create mock Chef Automate service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Automate
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/chef-automate
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
        mode: "0644"

    # Create mock Chef Server service file
    - name: Create mock Chef Server service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Infra Server
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/chef-server-ctl
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/etc/systemd/system/chef-server.service
        mode: "0644"

    # Create mock sysctl files to simulate kernel parameter changes
    - name: Create mock sysctl files
      ansible.builtin.copy:
        content: |
          # Mock sysctl settings for molecule testing
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Create mock hostname file
    - name: Create mock hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"