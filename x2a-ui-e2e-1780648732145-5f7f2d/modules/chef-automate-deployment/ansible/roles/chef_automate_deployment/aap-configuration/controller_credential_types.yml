---
controller_credential_types:
- name: Chef User Authentication
  description: Credential type for Chef User Authentication
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Chef Username
      help_text: Username for the Chef Infra Server and Chef Automate admin account
    - id: password
      type: string
      label: Chef Password
      secret: true
      help_text: Password for the Chef Infra Server and Chef Automate admin account
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the Chef admin user
    - id: email
      type: string
      label: Email Address
      help_text: Email address for the Chef admin user
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
