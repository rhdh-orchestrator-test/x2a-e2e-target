# Unsupported pre-flight checks: Redis service name, authentication secret, cleanup directives,
# Redis log properties/log file, Memcached service/endpoint, and diagnostic commands without
# a stated expected result are unverified or unavailable from the migration plan.
---
- name: Verify Redis instance on port 6379
  hosts: all
  gather_facts: false
  tasks:
    - name: Check the source-declared Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_file

    - name: Assert the source-declared Redis configuration file exists
      ansible.builtin.assert:
        that:
          - redis_config_file['stat']['exists']
          - redis_config_file['stat']['isreg']
        fail_msg: Redis configuration file is missing or is not a regular file.

    - name: Check the source-declared Redis port in its configuration
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - ^port[[:space:]]+6379$
          - /etc/redis/6379.conf
      register: redis_port_config
      changed_when: false

    - name: Assert Redis is configured for port 6379
      ansible.builtin.assert:
        that:
          - redis_port_config['rc'] == 0
        fail_msg: Redis port 6379 was not found in the source-declared configuration.

    - name: Verify Redis TCP port 6379 is listening
      ansible.builtin.wait_for:
        port: 6379
        state: started
        timeout: 10
