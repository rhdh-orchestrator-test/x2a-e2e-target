---
argument_specs:
  main:
    short_description: Configure a standalone Redis cache service
    description:
      - Installs and configures Redis through the eloy.redis collection.
      - Configures Redis on port 6379 with password authentication supplied by an AAP credential.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations that handle the Redis password.
      cache_redis_version:
        type: str
        required: false
        default: "7.2"
        description: Redis version to install.
      cache_redis_install_method:
        type: str
        required: false
        default: package
        description: Redis installation method.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port on which Redis listens.
      cache_redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Enable Redis Cluster mode.
      cache_redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Enable Redis Sentinel mode.
      cache_redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Enable Redis replication.
      cache_redis_aof_enabled:
        type: bool
        required: false
        default: false
        description: Enable append-only persistence.
      cache_redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Enable RDB persistence.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Directory for Redis logs.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
