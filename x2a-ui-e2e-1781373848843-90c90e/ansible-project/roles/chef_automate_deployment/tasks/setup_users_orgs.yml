---
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ user_full_name }}" "{{ user_email }}" "{{ user_password }}"  --filename {{ chef_automate_user_key_path
      }}
  args:
    creates: "{{ chef_automate_user_key_path }}"
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ organization_name }} "{{ organization_full_name }}"  --association_user {{ username }} --filename {{
      chef_automate_org_key_path }}
  args:
    creates: "{{ chef_automate_org_key_path }}"
  become: true
