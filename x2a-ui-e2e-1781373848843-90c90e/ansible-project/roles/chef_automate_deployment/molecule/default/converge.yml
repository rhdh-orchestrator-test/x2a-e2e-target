        1l7R+wxIqmJo1IYyy16xS8WsjyQuyC0lL456qkd5BDZ0Ag8j2X9H9D5220Ln7s9i

        oezTipXipS7p7Jekf3Ywx6abJwOmB0rX79dV4qiNcGgzATnG1PkXxqt76VhcGa0W

        DDVHEEYGbSQ6hIGSh0I7BQun0aLRZojfE3gqHQIDAQAB

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/chef-org-validator.pem
      mode: '0600'
  - name: Create Chef server user list file
    ansible.builtin.copy:
      content: admin
      dest: /tmp/molecule_test/chef-server-user-list
      mode: '0644'
  - name: Create Chef server org list file
    ansible.builtin.copy:
      content: chef-org
      dest: /tmp/molecule_test/chef-server-org-list
      mode: '0644'
