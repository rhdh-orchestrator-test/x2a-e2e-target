---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/sysctl.d
        - /tmp/molecule_test/etc/hostname
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/chef-server
        - /tmp/molecule_test/usr/bin

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: |
          # Chef Automate kernel parameters
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI binary
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI mock"
          echo "Version: 1.0.0"
          echo "This is a mock binary for testing purposes"
        dest: /tmp/molecule_test/usr/bin/chef-automate
        mode: "0755"

    # Simulate Chef Server CLI
    - name: Create Chef Server CLI binary
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Server CLI mock"
          echo "Version: 1.0.0"
          echo "This is a mock binary for testing purposes"
        dest: /tmp/molecule_test/usr/bin/chef-server-ctl
        mode: "0755"

    # Simulate Chef Automate deployment files
    - name: Create Chef Automate configuration files
      ansible.builtin.copy:
        content: |
          # Chef Automate configuration
          [automate]
          fqdn = "automate.chef.lab"
          products = ["automate", "infra-server"]
        dest: /tmp/molecule_test/var/opt/chef-automate/config.toml
        mode: "0644"

    # Simulate Chef Server configuration files
    - name: Create Chef Server configuration files
      ansible.builtin.copy:
        content: |
          # Chef Server configuration
          topology "standalone"
          api_fqdn "automate.chef.lab"
        dest: /tmp/molecule_test/var/opt/chef-server/chef-server.rb
        mode: "0644"

    # Simulate user and organization PEM files
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          ... (mock key content) ...
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/jtonello.pem
        mode: "0600"

    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          ... (mock key content) ...
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/lab-validator.pem
        mode: "0600"

    # Simulate service status files
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: postgresql        OK
          Service: elasticsearch     OK
          Service: automate-gateway  OK
          Service: automate-ui       OK
          Service: infra-server      OK
        dest: /tmp/molecule_test/var/opt/chef-automate/status.txt
        mode: "0644"

    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          run: postgresql           (pid 12345) 1234 days 12:34:56 running
          run: nginx                (pid 12346) 1234 days 12:34:56 running
          run: bookshelf            (pid 12347) 1234 days 12:34:56 running
          run: oc_bifrost           (pid 12348) 1234 days 12:34:56 running
          run: oc_id                (pid 12349) 1234 days 12:34:56 running
          run: opscode-erchef       (pid 12350) 1234 days 12:34:56 running
          run: opscode-expander     (pid 12351) 1234 days 12:34:56 running
          run: opscode-solr4        (pid 12352) 1234 days 12:34:56 running
        dest: /tmp/molecule_test/var/opt/chef-server/status.txt
        mode: "0644"

    # Simulate user and organization list files
    - name: Create user list file
      ansible.builtin.copy:
        content: |
          jtonello
          admin
        dest: /tmp/molecule_test/var/opt/chef-server/user-list.txt
        mode: "0644"

    - name: Create organization list file
      ansible.builtin.copy:
        content: |
          lab
        dest: /tmp/molecule_test/var/opt/chef-server/org-list.txt
        mode: "0644"

    # Simulate network listening ports
    - name: Create netstat output file
      ansible.builtin.copy:
        content: |
          tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      12345/nginx
          tcp6       0      0 :::443                  :::*                    LISTEN      12345/nginx
        dest: /tmp/molecule_test/var/opt/chef-automate/netstat.txt
        mode: "0644"

    # Simulate health API response
    - name: Create health API response file
      ansible.builtin.copy:
        content: |
          {"status":"OK","service_status":[{"service":"postgresql","status":"OK"},{"service":"elasticsearch","status":"OK"}]}
        dest: /tmp/molecule_test/var/opt/chef-automate/health.json
        mode: "0644"