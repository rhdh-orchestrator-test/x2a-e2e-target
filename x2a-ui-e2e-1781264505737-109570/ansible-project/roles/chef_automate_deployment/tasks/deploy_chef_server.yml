---
- name: Include download CLI tasks
  ansible.builtin.include_tasks: download_cli.yml
- name: Check if Chef Infra Server is already deployed
  ansible.builtin.stat:
    path: /var/opt/chef-server
  register: chef_server_dir
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }}"
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
  failed_when: deploy_result.rc != 0
  when: not chef_server_dir.stat.exists
