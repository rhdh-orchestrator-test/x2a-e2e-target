---
- name: Include download CLI tasks
  ansible.builtin.include_tasks: download_cli.yml
- name: Check if Chef Automate is already deployed
  ansible.builtin.stat:
    path: /var/opt/chef-automate
  register: chef_automate_dir
  become: true
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }}"
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
  failed_when: deploy_result.rc != 0
  when: not chef_automate_dir.stat.exists
