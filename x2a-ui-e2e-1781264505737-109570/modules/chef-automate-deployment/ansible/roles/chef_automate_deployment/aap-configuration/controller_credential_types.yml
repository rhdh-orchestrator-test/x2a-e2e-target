---
controller_credential_types:
- name: Chef User Credentials
  description: Credential type for Chef User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: 'Chef user account username (default: jtonello)'
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef user account
    - id: full_name
      type: string
      label: Full Name
      help_text: 'Full name for the Chef user (default: John Tonello)'
    - id: email
      type: string
      label: Email
      help_text: 'Email address for the Chef user (default: jtonello@chef.lab)'
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
- name: Chef Organization Configuration
  description: Credential type for Chef Organization Configuration
  kind: cloud
  inputs:
    fields:
    - id: org_short_name
      type: string
      label: Organization Short Name
      help_text: 'Short name for the Chef organization (default: lab)'
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: 'Full name for the Chef organization (default: Chef Lab)'
    required:
    - org_short_name
    - org_full_name
  injectors:
    extra_vars:
      org_short_name: !unsafe '{{ org_short_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
