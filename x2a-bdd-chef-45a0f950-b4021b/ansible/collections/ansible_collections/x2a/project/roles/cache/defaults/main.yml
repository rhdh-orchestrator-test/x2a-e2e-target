---
cache_secure_logging: true
cache_memcached_memory_mb: 64
cache_memcached_tcp_port: 11211
cache_memcached_udp_port: 11211
cache_memcached_listen: 0.0.0.0
cache_memcached_max_connections: 1024
cache_memcached_max_item_size: 1m
cache_memcached_threads: 4
cache_memcached_ulimit: 1024
cache_memcached_log_directory: /var/log/memcached
cache_memcached_runtime_directory: /var/run/memcached
cache_memcached_service_name: memcached
cache_redis_port: 6379
cache_redis_config_path: /etc/redis/6379.conf
cache_redis_pid_directory: /run/redis
cache_redis_log_directory: /var/log/redis
cache_redis_service_name: redis-server
cache_redis_package_name: redis-server
cache_redis_log_owner: redis
cache_redis_log_group: redis
cache_redis_log_mode: "0755"
