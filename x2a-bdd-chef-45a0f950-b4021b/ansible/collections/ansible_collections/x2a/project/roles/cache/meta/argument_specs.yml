---
argument_specs:
  main:
    short_description: Install and configure Memcached and Redis cache services
    description:
      - Configures the Memcached service and a standalone Redis instance for caching.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the Redis password.
      cache_memcached_memory_mb:
        type: int
        required: false
        default: 64
        description: Memcached memory allocation in megabytes.
      cache_memcached_tcp_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      cache_memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      cache_memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      cache_memcached_max_connections:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached connections.
      cache_memcached_max_item_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached item size.
      cache_memcached_threads:
        type: int
        required: false
        default: 4
        description: Number of Memcached worker threads.
      cache_memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file descriptor limit.
      cache_memcached_log_directory:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log directory.
      cache_memcached_runtime_directory:
        type: str
        required: false
        default: /var/run/memcached
        description: Memcached runtime directory.
      cache_memcached_service_name:
        type: str
        required: false
        default: memcached
        description: Memcached service name.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: Redis listening port.
      cache_redis_config_path:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration path.
      cache_redis_pid_directory:
        type: str
        required: false
        default: /run/redis
        description: Redis PID directory.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      cache_redis_service_name:
        type: str
        required: false
        default: redis-server
        description: Redis service name.
      cache_redis_package_name:
        type: str
        required: false
        default: redis-server
        description: Redis package name when using the role without the collection.
      cache_redis_log_owner:
        type: str
        required: false
        default: redis
        description: Redis log directory owner.
      cache_redis_log_group:
        type: str
        required: false
        default: redis
        description: Redis log directory group.
      cache_redis_log_mode:
        type: str
        required: false
        default: "0755"
        description: Redis log directory mode.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
