---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials and connection settings for the local PostgreSQL database used by the FastAPI application. The database password is currently 
      hardcoded in the Chef recipe and .env file and should be moved to Ansible Vault or an approved secret manager.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      database_name: "{{ database_name }}"
      db_host: "{{ db_host }}"
      db_port: "{{ db_port }}"
