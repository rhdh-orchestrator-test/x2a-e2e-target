---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application
    description:
      - Deploys the FastAPI tutorial application and its local PostgreSQL dependency.
    options:
      fastapi_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Filesystem path where the application is deployed.
      fastapi_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_service_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by the FastAPI service.
      fastapi_db_username:
        type: str
        required: false
        default: "{{ db_username }}"
        description: PostgreSQL username supplied by the AAP credential.
      fastapi_db_password:
        type: str
        required: false
        default: "{{ db_password }}"
        description: PostgreSQL password supplied by the AAP credential.
      fastapi_database_name:
        type: str
        required: false
        default: "{{ database_name }}"
        description: PostgreSQL database name supplied by the AAP credential.
      fastapi_db_host:
        type: str
        required: false
        default: "{{ db_host }}"
        description: PostgreSQL host supplied by the AAP credential.
      fastapi_db_port:
        type: str
        required: false
        default: "{{ db_port }}"
        description: PostgreSQL port supplied by the AAP credential.
      fastapi_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks handling the database password.
