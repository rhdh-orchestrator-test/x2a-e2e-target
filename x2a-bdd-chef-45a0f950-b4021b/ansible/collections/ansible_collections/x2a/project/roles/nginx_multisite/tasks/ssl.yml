---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create SSL certificate group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create SSL certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_certificate_path }}" # noqa: R114 - path is a role-defined trusted default
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create SSL private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}" # noqa: R114 - path is a role-defined trusted default
    owner: root
    group: ssl-cert
    mode: "0710"
    state: directory

- name: Generate self-signed SSL certificates # noqa: R101 - certificate paths come from role-defined trusted defaults and site keys come from role site data
  ansible.builtin.shell:
    cmd: |
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        -keyout "{{ nginx_multisite_private_key_path }}/{{ item_ssl_site['key'] }}.key" \
        -out "{{ nginx_multisite_certificate_path }}/{{ item_ssl_site['key'] }}.crt" \
        -subj "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl_site['key'] }}/emailAddress=admin@example.com"
      chmod 640 "{{ nginx_multisite_private_key_path }}/{{ item_ssl_site['key'] }}.key"
      chown root:ssl-cert "{{ nginx_multisite_private_key_path }}/{{ item_ssl_site['key'] }}.key"
    executable: /bin/sh
    creates: "{{ nginx_multisite_certificate_path }}/{{ item_ssl_site['key'] }}.crt"
  when: item_ssl_site['value']['ssl_enabled'] | bool
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  notify: Reload nginx
