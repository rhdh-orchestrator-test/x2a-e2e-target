---
argument_specs:
  main:
    short_description: Install and configure nginx with security hardening and dynamic sites
    description:
      - Installs nginx, fail2ban, and UFW, applies SSH and kernel security settings, and configures dynamic virtual hosts.
    options:
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated TLS certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated TLS private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban protection is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide secret-handling task output.
      nginx_sites:
        type: dict
        required: false
        default: {}
        description: Mapping of site names to document roots and SSL settings.
      site_token:
        type: str
        required: true
        description: Site token injected by an AAP credential type.
