---
- name: Install security packages
  ansible.builtin.package:
    name:
      - openssh-server
      - fail2ban
      - ufw
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Render fail2ban jail configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Set UFW default deny policy
  ansible.posix.ufw:
    default: deny
    direction: incoming
  when: nginx_multisite_ufw_enabled | bool

- name: Allow required UFW services
  ansible.posix.ufw:
    rule: allow
    port: "{{ item_ufw_port }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"
  loop_control:
    loop_var: item_ufw_port
  when: nginx_multisite_ufw_enabled | bool

- name: Enable UFW
  ansible.posix.ufw:
    state: enabled
  when: nginx_multisite_ufw_enabled | bool

- name: Render kernel security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Check whether the SSH daemon configuration exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config
  when: nginx_multisite_disable_root_login or not nginx_multisite_password_authentication

- name: Disable root SSH login # noqa: L039 - stat result is registered by the preceding task when SSH hardening is enabled
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin.*"
    line: "PermitRootLogin no"
    mode: "0600"
    backup: true
    create: false
  when:
    - nginx_multisite_disable_root_login
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd

- name: Disable SSH password authentication # noqa: L039 - stat result is registered by the preceding task when SSH hardening is enabled
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication.*"
    line: "PasswordAuthentication no"
    mode: "0600"
    backup: true
    create: false
  when:
    - not nginx_multisite_password_authentication
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd
