---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_hostname }}"
  become: true
- name: Set vm.max_map_count kernel parameter
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ chef_vm_max_map_count }}"
    state: present
    reload: true
  become: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ chef_vm_dirty_expire_centisecs }}"
    state: present
    reload: true
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate.zip > {{ chef_automate_cli_binary }} && chmod +x {{ chef_automate_cli_binary }}
    chdir: /tmp
    creates: /tmp/{{ chef_automate_cli_binary }}
  args:
    executable: /bin/bash
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: ./{{ chef_automate_cli_binary }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_accept_terms_and_mlsa | lower }}
    chdir: /tmp
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
  failed_when: chef_server_deploy.rc != 0
- name: Check if Chef user already exists
  ansible.builtin.command:
    cmd: chef-server-ctl user-list
  become: true
  register: chef_user_list
  changed_when: false
  failed_when: chef_user_list.rc != 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} '{{ username }}' {{ email }} '{{ password }}' --filename {{ chef_user_pem_filename }}
  become: true
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  failed_when: chef_user_create.rc != 0
  when: username not in chef_user_list.stdout
- name: Check if Chef organization already exists
  ansible.builtin.command:
    cmd: chef-server-ctl org-list
  become: true
  register: chef_org_list
  changed_when: false
  failed_when: chef_org_list.rc != 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} '{{ chef_org_long_name }}' --association_user {{ username }} --filename {{
      chef_org_validator_pem_filename }}
  become: true
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
  failed_when: chef_org_create.rc != 0
  when: chef_org_name not in chef_org_list.stdout
