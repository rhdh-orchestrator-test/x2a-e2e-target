---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    chef_org_name: lab
  tasks:
    # Hostname verification
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_file.stat.exists

    # System parameters verification
    - name: Check vm.max_map_count file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/vm.max_map_count
      register: max_map_count_file

    - name: Assert vm.max_map_count file was created
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
          - max_map_count_file.stat.isreg
        fail_msg: "vm.max_map_count file not found"
        success_msg: "vm.max_map_count file exists"

    - name: Get vm.max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/vm.max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "262144"
        fail_msg: "vm.max_map_count is not set correctly"
        success_msg: "vm.max_map_count is set correctly"
      when: max_map_count_file.stat.exists

    - name: Check vm.dirty_expire_centisecs file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/vm.dirty_expire_centisecs
      register: dirty_expire_centisecs_file

    - name: Assert vm.dirty_expire_centisecs file was created
      ansible.builtin.assert:
        that:
          - dirty_expire_centisecs_file.stat.exists
          - dirty_expire_centisecs_file.stat.isreg
        fail_msg: "vm.dirty_expire_centisecs file not found"
        success_msg: "vm.dirty_expire_centisecs file exists"

    - name: Get vm.dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/vm.dirty_expire_centisecs
      register: dirty_expire_centisecs_content
      when: dirty_expire_centisecs_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
        fail_msg: "vm.dirty_expire_centisecs is not set correctly"
        success_msg: "vm.dirty_expire_centisecs is set correctly"
      when: dirty_expire_centisecs_file.stat.exists

    # PEM files verification
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ username }}.pem"
      register: user_pem_file

    - name: Assert user PEM file was created
      ansible.builtin.assert:
        that:
          - user_pem_file.stat.exists
          - user_pem_file.stat.isreg
        fail_msg: "User PEM file not found"
        success_msg: "User PEM file exists"

    - name: Check organization validator PEM file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_org_name }}-validator.pem"
      register: org_validator_pem_file

    - name: Assert organization validator PEM file was created
      ansible.builtin.assert:
        that:
          - org_validator_pem_file.stat.exists
          - org_validator_pem_file.stat.isreg
        fail_msg: "Organization validator PEM file not found"
        success_msg: "Organization validator PEM file exists"

    # Chef Automate CLI binary verification
    - name: Check Chef Automate CLI binary exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli_binary

    - name: Assert Chef Automate CLI binary was created
      ansible.builtin.assert:
        that:
          - chef_automate_cli_binary.stat.exists
          - chef_automate_cli_binary.stat.isreg
          - chef_automate_cli_binary.stat.executable
        fail_msg: "Chef Automate CLI binary not found or not executable"
        success_msg: "Chef Automate CLI binary exists and is executable"

    # The following checks would normally run on the actual system but can't run in a container
    # They are tagged with molecule-notest to be skipped during molecule testing

    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: chef-automate status
      register: chef_automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - "'Status: running' in chef_automate_status.stdout"
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Server status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: chef_server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Server is running
      ansible.builtin.assert:
        that:
          - "'run:' in chef_server_status.stdout"
        fail_msg: "Chef Server is not running"
        success_msg: "Chef Server is running"
      tags: molecule-notest

    - name: Check user exists
      ansible.builtin.command:
        cmd: chef-server-ctl user-list
      register: chef_user_list
      changed_when: false
      tags: molecule-notest

    - name: Assert user exists
      ansible.builtin.assert:
        that:
          - "'jtonello' in chef_user_list.stdout"
        fail_msg: "User jtonello not found"
        success_msg: "User jtonello exists"
      tags: molecule-notest

    - name: Check organization exists
      ansible.builtin.command:
        cmd: chef-server-ctl org-list
      register: chef_org_list
      changed_when: false
      tags: molecule-notest

    - name: Assert organization exists
      ansible.builtin.assert:
        that:
          - "'lab' in chef_org_list.stdout"
        fail_msg: "Organization lab not found"
        success_msg: "Organization lab exists"
      tags: molecule-notest

    - name: Check Chef Automate UI accessibility
      ansible.builtin.uri:
        url: https://automate.chef.lab
        validate_certs: false
      register: chef_automate_ui
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate UI is accessible
      ansible.builtin.assert:
        that:
          - chef_automate_ui.status == 200
        fail_msg: "Chef Automate UI is not accessible"
        success_msg: "Chef Automate UI is accessible"
      tags: molecule-notest

    - name: Check Chef Server API accessibility
      ansible.builtin.uri:
        url: https://automate.chef.lab/organizations/lab
        validate_certs: false
      register: chef_server_api
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Server API is accessible
      ansible.builtin.assert:
        that:
          - chef_server_api.status == 200
        fail_msg: "Chef Server API is not accessible"
        success_msg: "Chef Server API is accessible"
      tags: molecule-notest