---
controller_credential_types:
- name: Chef User Credentials
  description: Credential type for Chef User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for the initial Chef user
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the initial Chef user
    - id: email
      type: string
      label: Email
      help_text: Email address for the initial Chef user
    - id: organization
      type: string
      label: Organization
      help_text: Chef organization name to create
    required:
    - username
    - password
    - email
    - organization
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
      organization: !unsafe '{{ organization }}'
