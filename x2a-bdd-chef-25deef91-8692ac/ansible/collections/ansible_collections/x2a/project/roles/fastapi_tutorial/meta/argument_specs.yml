---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application
    description:
      - Deploys the FastAPI tutorial application, its Python environment, PostgreSQL dependency, and systemd service.
    options:
      fastapi_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Filesystem path where the application is deployed.
      fastapi_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_service_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by the FastAPI service.
      fastapi_db_username:
        type: str
        required: false
        default: "{{ db_username }}"
        description: Database username supplied by the AAP credential configuration.
      fastapi_db_password:
        type: str
        required: false
        default: "{{ db_password }}"
        description: Database password supplied by the AAP credential configuration.
      fastapi_database_name:
        type: str
        required: false
        default: "{{ database_name }}"
        description: Database name supplied by the AAP credential configuration.
      fastapi_database_host:
        type: str
        required: false
        default: "{{ database_host }}"
        description: Database host supplied by the AAP credential configuration.
      fastapi_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks that handle the database password.
