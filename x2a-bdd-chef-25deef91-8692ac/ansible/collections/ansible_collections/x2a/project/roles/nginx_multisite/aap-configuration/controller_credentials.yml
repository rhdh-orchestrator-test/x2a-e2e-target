---
controller_credentials:
  - name: Nginx Site Token - nginx_multisite
    description: Token stored in the encrypted Chef data bag nginx_secrets/site and deployed to /etc/nginx/secrets/site_token.
    organization: Default
    credential_type: Nginx Site Token
    update_secrets: true
    inputs:
      site_token: "{{ vault_site_token }}"
  - name: Nginx TLS Private Key - nginx_multisite
    description: Locally generated RSA private keys for SSL-enabled Nginx sites, stored under /etc/ssl/private/<site_name>.key.
    organization: Default
    credential_type: Nginx TLS Private Key
    update_secrets: true
    inputs:
      tls_private_key: "{{ vault_tls_private_key }}"
