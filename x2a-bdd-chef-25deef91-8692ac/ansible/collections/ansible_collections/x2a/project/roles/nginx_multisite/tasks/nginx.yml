---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Ensure nginx service account exists
  ansible.builtin.user:
    name: nginx
    system: true
    create_home: false
    state: present

- name: Render nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Render nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create nginx secrets directory
  ansible.builtin.file:
    path: /etc/nginx/secrets
    owner: root
    group: root
    mode: "0700"
    state: directory

- name: Deploy nginx site token
  ansible.builtin.copy:
    content: "{{ site_token }}"
    dest: /etc/nginx/secrets/site_token
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Create site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_site['value']['document_root'] }}"  # noqa: R114 - loop over role-defined sites dict
    owner: nginx
    group: nginx
    mode: "0755"
    state: directory
    recurse: true
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site

- name: Deploy site index files
  ansible.builtin.copy:
    content: "{{ item_nginx_index['value'].get('index_content', '') }}"
    dest: "{{ item_nginx_index['value']['document_root'] }}/index.html"  # noqa: R114 - loop over role-defined sites dict
    owner: nginx
    group: nginx
    mode: "0644"
    backup: true
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_index
  when: item_nginx_index['value'].get('index_content') is not none
