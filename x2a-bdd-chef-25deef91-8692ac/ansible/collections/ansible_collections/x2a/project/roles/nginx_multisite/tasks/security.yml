---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: security_fail2ban_enabled | bool

- name: Configure fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: security_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Check current UFW status
  ansible.builtin.command:
    argv:
      - ufw
      - status
      - verbose
  register: nginx_multisite_ufw_status
  changed_when: false
  check_mode: false

- name: Set UFW default incoming policy
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  when:
    - security_ufw_enabled | bool
    - "'Default: deny' not in nginx_multisite_ufw_status.stdout"  # noqa: L039 - registered by prior task

- name: Allow SSH through UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - ssh
  when:
    - security_ufw_enabled | bool
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"  # noqa: L039 - registered by prior task

- name: Allow HTTP through UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - http
  when:
    - security_ufw_enabled | bool
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"  # noqa: L039 - registered by prior task

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - https
  when:
    - security_ufw_enabled | bool
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"  # noqa: L039 - registered by prior task

- name: Enable UFW
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - enable
  when:
    - security_ufw_enabled | bool
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"  # noqa: L039 - registered by prior task

- name: Configure kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload sysctl settings

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    state: present
    create: false
    backup: true
  when: security_ssh_disable_root | bool
  notify: Restart sshd

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    state: present
    create: false
    backup: true
  when: not security_ssh_password_auth | bool
  notify: Restart sshd
