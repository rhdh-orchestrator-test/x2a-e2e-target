---
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - site_token is defined
      - tls_private_key is defined
      - site_token | length > 0
      - >-
        (nginx_sites | dict2items | selectattr('value.ssl_enabled', 'defined')
        | selectattr('value.ssl_enabled', 'equalto', true) | list | length == 0)
        or (tls_private_key | length > 0)
    fail_msg: One or more required credential variables are missing or empty. Ensure the AAP credential type is attached to the job template.
    quiet: true