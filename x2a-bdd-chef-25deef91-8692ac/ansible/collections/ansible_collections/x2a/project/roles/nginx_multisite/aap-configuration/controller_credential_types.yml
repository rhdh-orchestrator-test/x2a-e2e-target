---
controller_credential_types:
  - name: Nginx Site Token
    description: Token stored in the encrypted Chef data bag nginx_secrets/site and deployed to /etc/nginx/secrets/site_token.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Site Token
          secret: true
          help_text: Secret token read from the nginx_secrets/site encrypted data bag item and written to the Nginx secrets directory.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
  - name: Nginx TLS Private Key
    description: Locally generated RSA private keys for SSL-enabled Nginx sites, stored under /etc/ssl/private/<site_name>.key.
    kind: cloud
    inputs:
      fields:
        - id: tls_private_key
          type: string
          label: TLS Private Key
          secret: true
          help_text: RSA private key used with the corresponding self-signed certificate for an SSL-enabled Nginx site.
      required:
        - tls_private_key
    injectors:
      extra_vars:
        tls_private_key: !unsafe "{{ tls_private_key }}"
