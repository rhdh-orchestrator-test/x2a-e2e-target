---
argument_specs:
  main:
    short_description: Configure nginx with dynamic multisite virtual hosts and security hardening
    description:
      - Installs and configures nginx, Fail2ban, UFW, SSH hardening, kernel security settings, and dynamic virtual hosts.
    options:
      nginx_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated SSL certificates.
      nginx_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated SSL private keys.
      security_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban security configuration is enabled.
      security_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      security_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether root SSH login is disabled.
      security_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is permitted.
      nginx_sites:
        type: dict
        required: false
        default: {}
        description: Mapping of site names to id, document root, and SSL settings.
      site_token:
        type: str
        required: false
        default: ""
        description: Site token injected by an AAP credential type.
      tls_private_key:
        type: str
        required: false
        default: ""
        description: TLS private key injected by an AAP credential type.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress task output when handling secrets.
