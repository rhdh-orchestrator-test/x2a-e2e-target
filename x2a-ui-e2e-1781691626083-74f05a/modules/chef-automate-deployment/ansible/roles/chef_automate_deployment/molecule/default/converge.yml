- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create required directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/root
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/usr/bin
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        (mock key content)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/root/jtonello.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        (mock key content)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/root/lab-validator.pem
      mode: '0600'
  - name: Create chef-server-ctl mock script
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Server Control mock"

        echo "Command executed: $@"

        exit 0

        '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create chef-automate status mock script
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate Status mock"

        echo "Service habitat-supervisor: running"

        echo "Service automate-load-balancer: running"

        echo "Service automate-cs-nginx: running"

        exit 0

        '
      dest: /tmp/molecule_test/usr/bin/chef-automate
      mode: '0755'
