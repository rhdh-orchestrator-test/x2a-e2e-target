- name: Ensure gzip package is installed
  ansible.builtin.package:
    name: gzip
    state: present
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: '{{ chef_automate_cli_url }}'
    dest: '{{ chef_automate_cli_path }}.zip'
    mode: '0644'
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
  args:
    creates: '{{ chef_automate_cli_path }}'
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: '{{ chef_automate_cli_path }}'
    mode: '0755'
    state: file
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: '{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }} '
  args:
    creates: /hab
  become: true
  register: deploy_result
- name: Display Chef Infra Server deployment result
  ansible.builtin.debug:
    var: deploy_result.stdout_lines
  when: deploy_result.stdout_lines is defined
