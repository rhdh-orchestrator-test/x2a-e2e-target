- name: Ensure Chef keys directory exists
  ansible.builtin.file:
    path: '{{ chef_automate_keys_dir }}'
    state: directory
    mode: '0700'
    owner: root
    group: root
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} {{ password }} --filename {{ chef_automate_keys_dir }}/{{ chef_automate_userfilename
      }} '
  args:
    creates: '{{ chef_automate_keys_dir }}/{{ chef_automate_userfilename }}'
  become: true
  register: user_create_result
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_orgname }} "{{ chef_automate_longorgname }}" --association_user {{ username }} --filename {{ chef_automate_keys_dir
      }}/{{ chef_automate_orgfilename }}

      '
  args:
    creates: '{{ chef_automate_keys_dir }}/{{ chef_automate_orgfilename }}'
  become: true
  register: org_create_result
- name: Display organization creation result
  ansible.builtin.debug:
    var: org_create_result.stdout_lines
  when: org_create_result.stdout_lines is defined and not org_create_result.stdout_lines | default([]) | length == 0
