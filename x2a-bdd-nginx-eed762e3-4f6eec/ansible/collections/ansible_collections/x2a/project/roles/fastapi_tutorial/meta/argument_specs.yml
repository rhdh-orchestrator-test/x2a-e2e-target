---
argument_specs:
  main:
    short_description: Deploy the FastAPI Tutorial application with PostgreSQL
    description:
      - Installs the FastAPI Tutorial application and its Python dependencies.
      - Provisions PostgreSQL and manages the application systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment path.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: User running the application service.
      fastapi_tutorial_service_group:
        type: str
        required: false
        default: root
        description: Group owning application files.
      fastapi_tutorial_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Application bind address.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: Application listening port.
      fastapi_tutorial_database_name:
        type: str
        required: false
        default: fastapi_db
        description: PostgreSQL database name.
      fastapi_tutorial_database_user:
        type: str
        required: false
        default: fastapi
        description: PostgreSQL role name.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: localhost
        description: PostgreSQL host.
      fastapi_tutorial_database_port:
        type: int
        required: false
        default: 5432
        description: PostgreSQL port.
      fastapi_tutorial_database_url:
        type: str
        required: false
        default: postgresql://fastapi:{{ db_password }}@localhost/fastapi_db
        description: Application PostgreSQL connection URL.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide sensitive task output involving the database password.
      fastapi_tutorial_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
        description: System packages required by the application.
