---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Password used by the FastAPI application to authenticate the fastapi PostgreSQL role and connect to fastapi_db.
    kind: cloud
    inputs:
      fields:
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the fastapi PostgreSQL role; use it for PostgreSQL role creation and the application's DATABASE_URL.
      required:
        - db_password
    injectors:
      extra_vars:
        db_password: !unsafe "{{ db_password }}"
