---
- name: Install TLS packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_certificate_path }}" # noqa: R114 - path from role defaults
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}" # noqa: R114 - path from role defaults
    owner: root
    group: ssl-cert
    mode: "0710"
    state: directory

- name: Check TLS certificate files
  ansible.builtin.stat:
    path: "{{ nginx_multisite_certificate_path }}/{{ item_ssl_site['key'] }}.crt"
  register: nginx_multisite_certificate_stat
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  when: item_ssl_site['value']['ssl_enabled']

- name: Check TLS private key files
  ansible.builtin.stat:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_ssl_site['key'] }}.key"
  register: nginx_multisite_private_key_stat
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  when: item_ssl_site['value']['ssl_enabled']

- name: Generate self-signed TLS certificates  # noqa: L039 - certificate and key stats are registered by prior tasks; R101 - command uses role-defined paths and sites; no-changed-when - command runs only when certificate or key is absent
  ansible.builtin.command:  # noqa: R101 - command uses role-defined paths and sites
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_multisite_private_key_path }}/{{ item_ssl_site['key'] }}.key"
      - -out
      - "{{ nginx_multisite_certificate_path }}/{{ item_ssl_site['key'] }}.crt"
      - -subj
      - "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl_site['key'] }}/emailAddress=admin@example.com"
  when:
    - item_ssl_site['value']['ssl_enabled']
    - not nginx_multisite_certificate_stat.results[ansible_loop.index0].stat.exists or not nginx_multisite_private_key_stat.results[ansible_loop.index0].stat.exists
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  notify: Reload nginx

- name: Set TLS private key ownership and mode
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_ssl_site['key'] }}.key" # noqa: R114 - path from role defaults and role-defined sites
    owner: root
    group: ssl-cert
    mode: "0640"
    state: file
  when: item_ssl_site['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
