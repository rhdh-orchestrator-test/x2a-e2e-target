---
- name: Install Nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Create Nginx configuration directories
  ansible.builtin.file:
    path: "{{ item_nginx_config_dir }}" # noqa: R114 - path comes from a role-defined fixed directory list
    owner: root
    group: root
    mode: "0755"
    state: directory
  loop:
    - /etc/nginx/conf.d
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
  loop_control:
    loop_var: item_nginx_config_dir

- name: Render Nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Render Nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dictionary
    owner: www-data
    group: www-data
    mode: "0755"
    state: directory
    recurse: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site

- name: Deploy site index pages
  ansible.builtin.copy:
    src: "{{ item_nginx_site['key'].split('.')[0] }}/index.html"
    dest: "{{ item_nginx_site['value']['document_root'] }}/index.html" # noqa: R114 - destination from role-defined sites dictionary
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site
