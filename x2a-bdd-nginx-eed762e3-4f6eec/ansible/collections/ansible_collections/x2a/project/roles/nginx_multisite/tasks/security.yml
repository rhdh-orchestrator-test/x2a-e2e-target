---
- name: Install security packages
  ansible.builtin.package:
    name:
      - openssh-server
      - procps
    state: present

- name: Install Fail2ban
  ansible.builtin.package:
    name: fail2ban
    state: present
  when: nginx_multisite_fail2ban_enabled | bool

- name: Install UFW
  ansible.builtin.package:
    name: ufw
    state: present
  when: nginx_multisite_ufw_enabled | bool

- name: Render Fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Set UFW default inbound policy
  ansible.builtin.command:
    cmd: ufw --force default deny
  changed_when: "'Default incoming policy changed' in nginx_multisite_ufw_default.stdout"
  register: nginx_multisite_ufw_default
  when: nginx_multisite_ufw_enabled | bool

- name: Allow SSH through UFW
  ansible.builtin.command:
    cmd: ufw allow ssh
  changed_when: "'Skipping' not in nginx_multisite_ufw_ssh.stdout"
  register: nginx_multisite_ufw_ssh
  when: nginx_multisite_ufw_enabled | bool

- name: Allow HTTP through UFW
  ansible.builtin.command:
    cmd: ufw allow http
  changed_when: "'Skipping' not in nginx_multisite_ufw_http.stdout"
  register: nginx_multisite_ufw_http
  when: nginx_multisite_ufw_enabled | bool

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    cmd: ufw allow https
  changed_when: "'Skipping' not in nginx_multisite_ufw_https.stdout"
  register: nginx_multisite_ufw_https
  when: nginx_multisite_ufw_enabled | bool

- name: Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  changed_when: "'Firewall is active' in nginx_multisite_ufw_enable.stdout"
  register: nginx_multisite_ufw_enable
  when: nginx_multisite_ufw_enabled | bool

- name: Render kernel security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    state: present
    backup: true
  when: nginx_multisite_disable_root_login | bool
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    state: present
    backup: true
  when: not nginx_multisite_password_authentication | bool
  notify: Restart SSH
