---
# Unsupported pre-flight checks: effective sysctl values are not specified; journal output
# has no stated expected result; and the configured SSH port is not specified.
- name: Verify nginx multisite pre-flight checks
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service facts for security and application services
      ansible.builtin.service_facts:

    - name: Verify fail2ban is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['fail2ban.service']['status'] == 'enabled'
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'
        fail_msg: fail2ban is not enabled and active

    - name: Check UFW verbose status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: item_ufw_verbose
      changed_when: false

    - name: Check UFW numbered status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - numbered
      register: item_ufw_numbered
      changed_when: false

    - name: Verify UFW is active with required inbound rules
      ansible.builtin.assert:
        that:
          - "'status: active' in item_ufw_verbose.stdout | lower"
          - "'default: deny (incoming)' in item_ufw_verbose.stdout | lower"
          - "item_ufw_verbose.stdout | lower is search('80|http')"
          - "item_ufw_verbose.stdout | lower is search('443|https')"
          - "item_ufw_numbered.stdout | lower is search('ssh|openssh')"
        fail_msg: UFW does not show the required active, default-deny, HTTP, HTTPS, and SSH configuration

    - name: Read SSH daemon configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_sshd_config

    - name: Verify SSH hardening configuration
      ansible.builtin.assert:
        that:
          - "item_sshd_config['content'] | b64decode is search('(?m)^\\s*PermitRootLogin\\s+no\\s*$')"
          - "item_sshd_config['content'] | b64decode is search('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')"
        fail_msg: SSH hardening settings are not present in sshd_config

    - name: Validate SSH daemon configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false

    - name: Verify SSH service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - ssh
      changed_when: false

    - name: Check rendered configuration and site paths
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
      register: item_path_stats
      loop:
        - path: /etc/fail2ban/jail.local
        - path: /etc/nginx/nginx.conf
        - path: /etc/nginx/conf.d/security.conf
        - path: /etc/sysctl.d/99-security.conf
        - path: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-available/status.cluster.local
        - path: /opt/server/test
        - path: /opt/server/test/index.html
        - path: /opt/server/ci
        - path: /opt/server/ci/index.html
        - path: /opt/server/status
        - path: /opt/server/status/index.html
      loop_control:
        loop_var: item_path

    - name: Verify rendered configuration and site paths exist
      ansible.builtin.assert:
        that: item_path_stat['stat']['exists']
        fail_msg: A required rendered configuration or site path is missing
      loop: "{{ item_path_stats['results'] }}"
      loop_control:
        loop_var: item_path_stat

    - name: Check enabled site symlinks
      ansible.builtin.stat:
        path: "{{ item_site_link['path'] }}"
        follow: false
      register: item_site_link_stats
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site_link

    - name: Verify enabled site symlinks resolve to available sites
      ansible.builtin.assert:
        that:
          - item_site_link_stat['stat']['islnk']
          - item_site_link_stat['stat']['lnk_source'] == item_site_link_stat['item']['target']
        fail_msg: An enabled site symlink is missing or has the wrong target
      loop: "{{ item_site_link_stats['results'] }}"
      loop_control:
        loop_var: item_site_link_stat

    - name: Check TLS certificates and private keys
      ansible.builtin.stat:
        path: "{{ item_tls_path['path'] }}"
      register: item_tls_path_stats
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
        - path: /etc/ssl/certs/ci.cluster.local.crt
        - path: /etc/ssl/certs/status.cluster.local.crt
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_tls_path

    - name: Verify TLS certificates and private keys exist
      ansible.builtin.assert:
        that: item_tls_path_stat['stat']['exists']
        fail_msg: A required TLS certificate or private key is missing
      loop: "{{ item_tls_path_stats['results'] }}"
      loop_control:
        loop_var: item_tls_path_stat

    - name: Check TLS private key metadata
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
      register: item_key_stats
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key

    - name: Verify TLS private key ownership and mode
      ansible.builtin.assert:
        that:
          - item_key_stat['stat']['mode'] == '0640'
          - item_key_stat['stat']['pw_name'] == 'root'
          - item_key_stat['stat']['gr_name'] == 'ssl-cert'
        fail_msg: A TLS private key has incorrect ownership or mode
      loop: "{{ item_key_stats['results'] }}"
      loop_control:
        loop_var: item_key_stat

    - name: Inspect TLS certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
          - -dates
      register: item_certificate_outputs
      changed_when: false
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          subject: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          subject: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          subject: status.cluster.local
      loop_control:
        loop_var: item_certificate

    - name: Verify TLS certificate subjects
      ansible.builtin.assert:
        that: "item_certificate_output['stdout'] is search('CN\\s*=\\s*' ~ item_certificate_output['item']['subject'])"
        fail_msg: A TLS certificate has the wrong subject
      loop: "{{ item_certificate_outputs['results'] }}"
      loop_control:
        loop_var: item_certificate_output

    - name: Validate Nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Inspect complete Nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      register: item_nginx_dump
      changed_when: false

    - name: Verify all enabled sites are in Nginx configuration
      ansible.builtin.assert:
        that: item_nginx_dump['stdout'] is search(item_nginx_site)
        fail_msg: An enabled site is absent from the Nginx configuration
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_nginx_site

    - name: Verify Nginx is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['nginx.service']['status'] == 'enabled'
          - ansible_facts['services']['nginx.service']['state'] == 'running'
        fail_msg: Nginx is not enabled and active

    - name: Verify HTTP and HTTPS listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listener['port'] }}"
        state: started
        timeout: 5
      loop:
        - port: 80
        - port: 443
      loop_control:
        loop_var: item_listener

    - name: Check HTTP and HTTPS virtual hosts
      ansible.builtin.uri:
        url: "{{ item_endpoint['url'] }}"
        headers:
          Host: "{{ item_endpoint['host'] }}"
        validate_certs: false
        return_content: false
      loop:
        - host: test.cluster.local
          url: http://127.0.0.1/
        - host: ci.cluster.local
          url: http://127.0.0.1/
        - host: status.cluster.local
          url: http://127.0.0.1/
        - host: test.cluster.local
          url: https://127.0.0.1/
        - host: ci.cluster.local
          url: https://127.0.0.1/
        - host: status.cluster.local
          url: https://127.0.0.1/
      loop_control:
        loop_var: item_endpoint

    - name: Check default Nginx site removal
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_site

    - name: Verify the default Nginx site is absent
      ansible.builtin.assert:
        that: not item_default_site['stat']['exists']
        fail_msg: The default Nginx site still exists
