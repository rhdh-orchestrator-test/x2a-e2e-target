---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - unzip
      - tar
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
  register: download_result
  notify:
    - Extract Chef Automate CLI
    - Make Chef Automate CLI executable
- name: Flush handlers
  ansible.builtin.meta: flush_handlers
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product {{ chef_automate_deploy_products | join(' --product ') }} --accept-terms-and-mlsa={{ chef_automate_accept_terms
      | lower }}"
    creates: /etc/chef-automate/config.toml
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
  failed_when: deploy_result.rc != 0
