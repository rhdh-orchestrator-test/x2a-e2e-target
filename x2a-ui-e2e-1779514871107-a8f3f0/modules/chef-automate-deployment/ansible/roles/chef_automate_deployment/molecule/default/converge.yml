---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure that would be created by Chef Automate deployment
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/usr/bin
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/log/chef-automate
        - /tmp/molecule_test/tmp

    # Create mock Chef Automate config file
    - name: Create mock Chef Automate config file
      ansible.builtin.copy:
        content: |
          # Chef Automate configuration
          [global]
            v1 = true
          [deployment]
            hostname = "automate.chef.lab"
          [load_balancer]
            v1 = true
          [auth_service]
            v1 = true
          [automate]
            v1 = true
          [infra_server]
            v1 = true
        dest: "/tmp/molecule_test/etc/chef-automate/config.toml"
        mode: "0644"

    # Create mock Chef Automate CLI binary
    - name: Create mock Chef Automate CLI binary
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI mock"
          echo "Version: 1.0.0"
          exit 0
        dest: "/tmp/molecule_test/tmp/chef-automate"
        mode: "0755"

    # Create mock Chef Server CTL binary
    - name: Create mock Chef Server CTL binary
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Server CTL mock"
          echo "Version: 1.0.0"
          exit 0
        dest: "/tmp/molecule_test/usr/bin/chef-server-ctl"
        mode: "0755"

    # Create mock user key file
    - name: Create mock user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefghijklmnopq
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/admin.pem"
        mode: "0600"

    # Create mock organization validator key file
    - name: Create mock organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          ZYXWVUTSRQPONMLKJIHGFEDCBA0987654321zyxwvutsrqponmlk
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/chef-validator.pem"
        mode: "0600"

    # Create mock sysctl settings file
    - name: Create mock sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Create mock hostname file
    - name: Create mock hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"