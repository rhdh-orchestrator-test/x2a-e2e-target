---
controller_credentials:
- name: Chef Admin User - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Admin User
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
- name: Chef User Key - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User Key
  update_secrets: true
  inputs:
    user_key: '{{ vault_user_key }}'
    key_path: '{{ key_path }}'
- name: Chef Organization Validator - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Organization Validator
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
    validator_key: '{{ vault_validator_key }}'
    validator_path: '{{ validator_path }}'
