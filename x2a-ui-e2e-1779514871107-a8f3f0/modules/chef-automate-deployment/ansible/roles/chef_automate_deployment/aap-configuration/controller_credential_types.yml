---
controller_credential_types:
- name: Chef Admin User
  description: Credential type for Chef Admin User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Admin username for Chef Automate and Chef Infra Server
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef admin user
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the Chef admin user
    - id: email
      type: string
      label: Email
      help_text: Email address of the Chef admin user
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
- name: Chef User Key
  description: Credential type for Chef User Key
  kind: cloud
  inputs:
    fields:
    - id: user_key
      type: string
      label: User Key
      secret: true
      help_text: PEM file content for Chef user authentication
    - id: key_path
      type: string
      label: Key Path
      help_text: Path where the user key file should be stored
    required:
    - user_key
  injectors:
    extra_vars:
      user_key: !unsafe '{{ user_key }}'
      key_path: !unsafe '{{ key_path }}'
- name: Chef Organization Validator
  description: Credential type for Chef Organization Validator
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full name of the Chef organization
    - id: validator_key
      type: string
      label: Validator Key
      secret: true
      help_text: PEM file content for the organization validator
    - id: validator_path
      type: string
      label: Validator Path
      help_text: Path where the organization validator key should be stored
    required:
    - org_name
    - validator_key
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
      validator_key: !unsafe '{{ validator_key }}'
      validator_path: !unsafe '{{ validator_path }}'
