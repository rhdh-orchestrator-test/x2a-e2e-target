---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: chef_automate_cli_stat
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
    creates: "{{ chef_automate_cli_path }}"
  when: not chef_automate_cli_stat.stat.exists
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Check if Chef Server is already deployed
  ansible.builtin.stat:
    path: /hab
  register: hab_dir
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}
    creates: /hab
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
  when: not hab_dir.stat.exists
