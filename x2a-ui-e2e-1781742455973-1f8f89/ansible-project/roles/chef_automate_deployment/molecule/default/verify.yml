- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl config file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl config file not found
      success_msg: Sysctl config file exists
  - name: Get sysctl config content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert kernel parameters are set correctly
    ansible.builtin.assert:
      that:
      - sysctl_content.content | b64decode | regex_search('vm.max_map_count = 262144')
      - sysctl_content.content | b64decode | regex_search('vm.dirty_expire_centisecs = 20000')
      fail_msg: Kernel parameters not set correctly
      success_msg: Kernel parameters set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/opt/chef-automate/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check chef-server-ctl exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/chef-server-ctl
    register: chef_server_ctl
  - name: Assert chef-server-ctl exists and is executable
    ansible.builtin.assert:
      that:
      - chef_server_ctl.stat.exists
      - chef_server_ctl.stat.executable
      fail_msg: chef-server-ctl not found or not executable
      success_msg: chef-server-ctl exists and is executable
  - name: Check Chef Automate status file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/opt/chef-automate/status.json
    register: chef_automate_status_file
  - name: Assert Chef Automate status file exists
    ansible.builtin.assert:
      that:
      - chef_automate_status_file.stat.exists
      fail_msg: Chef Automate status file not found
      success_msg: Chef Automate status file exists
  - name: Get Chef Automate status content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/opt/chef-automate/status.json
    register: chef_automate_status_content
    when: chef_automate_status_file.stat.exists
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - (chef_automate_status_content.content | b64decode | from_json).status == 'running'
      fail_msg: Chef Automate not running
      success_msg: Chef Automate is running
    when: chef_automate_status_file.stat.exists
  - name: Check user key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.isreg
      fail_msg: User key file not found
      success_msg: User key file exists
  - name: Check organization validator key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_key_file
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.isreg
      fail_msg: Organization validator key file not found
      success_msg: Organization validator key file exists
  - name: Check user list file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/opt/chef-automate/user-list.txt
    register: user_list_file
  - name: Get user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/opt/chef-automate/user-list.txt
    register: user_list_content
    when: user_list_file.stat.exists
  - name: Assert user exists in list
    ansible.builtin.assert:
      that:
      - (user_list_content.content | b64decode | trim) == 'jtonello'
      fail_msg: User jtonello not found in user list
      success_msg: User jtonello found in user list
    when: user_list_file.stat.exists
  - name: Check organization list file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/opt/chef-automate/org-list.txt
    register: org_list_file
  - name: Get organization list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/opt/chef-automate/org-list.txt
    register: org_list_content
    when: org_list_file.stat.exists
  - name: Assert organization exists in list
    ansible.builtin.assert:
      that:
      - (org_list_content.content | b64decode | trim) == 'lab'
      fail_msg: Organization lab not found in organization list
      success_msg: Organization lab found in organization list
    when: org_list_file.stat.exists
  - name: Check Chef Automate service status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: chef_automate_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - '''running'' in chef_automate_status.stdout'
      fail_msg: Chef Automate service not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check Chef Server service status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: chef_server_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Server service is running
    ansible.builtin.assert:
      that:
      - '''run'' in chef_server_status.stdout'
      fail_msg: Chef Server service not running
      success_msg: Chef Server service is running
    tags: molecule-notest
  - name: Check network listening on port 443
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
  - name: Check Chef Automate API access
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
    register: api_response
    tags: molecule-notest
  - name: Assert API is accessible
    ansible.builtin.assert:
      that:
      - api_response.status == 200
      fail_msg: Chef Automate API not accessible
      success_msg: Chef Automate API is accessible
    tags: molecule-notest
