---
- name: Check if Chef Server CLI is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Fail if Chef Server CLI is not available
  ansible.builtin.fail:
    msg: chef-server-ctl command not found. Ensure Chef Infra Server is properly installed.
  when: chef_server_ctl_check.rc != 0
- name: Create Chef Server admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ chef_server_user_key_path }}

      '
    creates: "{{ chef_server_user_key_path }}"
  become: true
  no_log: true
- name: Create Chef Server organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_server_org_name }} "{{ chef_server_org_long_name }}" --association_user {{ username }} --filename {{ chef_server_org_key_path
      }}

      '
    creates: "{{ chef_server_org_key_path }}"
  become: true
