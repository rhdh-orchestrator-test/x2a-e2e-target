- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    password: password123
    full_name: John Tonello
    email: jtonello@example.com
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/opt/chef-automate
    - /tmp/molecule_test/etc/sysctl.d
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
    vars:
      chef_automate_hostname: automate.chef.lab
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash # Mock Chef Automate CLI echo ''Chef Automate CLI mock'''
      dest: /tmp/molecule_test/opt/chef-automate/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment status file
    ansible.builtin.copy:
      content: "{\n  \"status\": \"running\",\n  \"products\": [\"automate\", \"infra-server\"]\n}\n"
      dest: /tmp/molecule_test/opt/chef-automate/status.json
      mode: '0644'
  - name: Create mock chef-server-ctl command
    ansible.builtin.copy:
      content: '#!/bin/bash # Mock chef-server-ctl echo ''chef-server-ctl mock'''
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK USER KEY -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK VALIDATOR KEY -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create Chef Server user list file
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/opt/chef-automate/user-list.txt
      mode: '0644'
  - name: Create Chef Server org list file
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/opt/chef-automate/org-list.txt
      mode: '0644'
