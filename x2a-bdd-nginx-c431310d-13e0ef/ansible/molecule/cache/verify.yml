# Unsupported pre-flight checks: Redis service name, authenticated redis-cli checks, process/log
# inspection, and Memcached checks require values or protected credentials not supplied in the plan.
---
- name: Verify cache pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify the Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_stat

    - name: Assert the Redis configuration file exists
      ansible.builtin.assert:
        that:
          - redis_config_stat.stat.exists
          - redis_config_stat.stat.isreg
        fail_msg: Redis configuration file is missing or is not a regular file.

    - name: Read the Redis configuration
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content
      when: redis_config_stat.stat.exists and redis_config_stat.stat.isreg

    - name: Verify the Redis port configuration
      ansible.builtin.assert:
        that:
          - >-
            (redis_config_content.content | b64decode) is
            regex_search('(?m)^port\s+6379(\s|$)')
        fail_msg: Redis configuration does not declare TCP port 6379.

    - name: Verify removed Redis directives are absent
      ansible.builtin.assert:
        that:
          - >-
            (redis_config_content.content | b64decode) is not
            regex_search('(?m)^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)(\s|$)')
        fail_msg: A removed Redis replication directive is still present.

    - name: Verify the Redis log directory
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_directory

    - name: Assert the Redis log directory ownership and mode
      ansible.builtin.assert:
        that:
          - redis_log_directory.stat.exists
          - redis_log_directory.stat.isdir
          - redis_log_directory.stat.mode == '0755'
          - redis_log_directory.stat.pw_name == 'redis'
          - redis_log_directory.stat.gr_name == 'redis'
        fail_msg: Redis log directory does not have the expected ownership or mode.

    - name: Verify Redis is listening on TCP port 6379
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 10

    - name: Check unauthenticated Redis PING rejection
      ansible.builtin.command:
        argv:
          - redis-cli
          - -p
          - '6379'
          - PING
      register: unauthenticated_redis_ping
      changed_when: false
      failed_when: false

    - name: Assert unauthenticated Redis PING requires authentication
      ansible.builtin.assert:
        that:
          - unauthenticated_redis_ping.rc != 0
          - >-
            (unauthenticated_redis_ping.stdout ~ unauthenticated_redis_ping.stderr)
            is regex('(?i)(noauth|authentication required)')
        fail_msg: Unauthenticated Redis PING was not rejected with an authentication-required error.
