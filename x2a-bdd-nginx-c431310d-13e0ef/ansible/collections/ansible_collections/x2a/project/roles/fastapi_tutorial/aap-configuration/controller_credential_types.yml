---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the FastAPI application to access its PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role used by the FastAPI application.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database accessed by the application.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname of the PostgreSQL server used by the application.
      required:
        - db_username
        - db_password
        - database_name
        - database_host
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
