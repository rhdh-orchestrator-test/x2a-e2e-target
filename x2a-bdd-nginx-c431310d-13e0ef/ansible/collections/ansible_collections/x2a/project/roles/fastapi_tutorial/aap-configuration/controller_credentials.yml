---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials and connection settings for the FastAPI application to access its PostgreSQL database.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      database_name: "{{ database_name }}"
      database_host: "{{ database_host }}"
