---
- name: Install FastAPI tutorial system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize application repository # noqa: R104 - repository is a trusted role parameter and uses HTTPS
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R106 - repository URL is a trusted role parameter
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - destination is a role default
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment
  ansible.builtin.command: # noqa: R101 - command uses role-defaulted paths
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}/bin/activate" # noqa: R114 - path is a role default

- name: Install application dependencies # noqa: R113 - requirements and virtualenv paths are role defaults
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - path is a role default
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path is a role default

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the PostgreSQL application role exists
  ansible.builtin.shell: # noqa: R101 - query uses a role-supplied database username
    cmd: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ fastapi_tutorial_db_username }}';"
    executable: /bin/bash
  become: true # noqa: R108 - PostgreSQL role inspection requires the postgres account
  become_user: postgres
  register: fastapi_tutorial_db_role_check
  changed_when: false

- name: Create PostgreSQL application role # noqa: L039 - db_password is a required role argument
  ansible.builtin.shell: # noqa: R101 - query uses required credential inputs
    cmd: >-
      psql -c "CREATE ROLE {{ fastapi_tutorial_db_username }} LOGIN PASSWORD '{{ db_password }}';"
    executable: /bin/bash
  become: true # noqa: R108 - PostgreSQL role creation requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"
  when: fastapi_tutorial_db_role_check.stdout | trim != '1'

- name: Check whether the PostgreSQL application database exists
  ansible.builtin.shell: # noqa: R101 - query uses a role-supplied database name
    cmd: psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ fastapi_tutorial_database_name }}';"
    executable: /bin/bash
  become: true # noqa: R108 - PostgreSQL database inspection requires the postgres account
  become_user: postgres
  register: fastapi_tutorial_db_check
  changed_when: false

- name: Create PostgreSQL application database # noqa: L039 - fastapi_tutorial_db_check is registered by the preceding database check
  ansible.builtin.shell: # noqa: R101 - query uses required database inputs
    cmd: >-
      psql -c "CREATE DATABASE {{ fastapi_tutorial_database_name }} OWNER {{ fastapi_tutorial_db_username }};"
    executable: /bin/bash
  become: true # noqa: R108 - PostgreSQL database creation requires the postgres account
  become_user: postgres
  when: fastapi_tutorial_db_check.stdout | trim != '1'

- name: Grant PostgreSQL application database privileges
  ansible.builtin.shell: # noqa: R101 - query uses required database inputs
    cmd: psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ fastapi_tutorial_database_name }} TO {{ fastapi_tutorial_db_username }};"
    executable: /bin/bash
  become: true # noqa: R108 - PostgreSQL privilege management requires the postgres account
  become_user: postgres
  changed_when: false

- name: Deploy application environment # noqa: L039 - db_password is a required role argument
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path is a role default
    content: |
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL=postgresql://{{ fastapi_tutorial_db_username }}:{{ db_password }}@{{ fastapi_tutorial_database_host }}/{{ fastapi_tutorial_database_name }}
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify: Restart FastAPI tutorial
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before managing the service
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start FastAPI tutorial
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
