---
# Cache role defaults
# Redis configuration
cache_redis_port: 6379
cache_redis_log_dir: /var/log/redis
cache_redis_config_file: /etc/redis/6379.conf
cache_redis_user: redis
cache_redis_group: redis
cache_redis_service_name: redis_{{ cache_redis_port }}
# Memcached configuration
cache_memcached_port: 11211
# Security logging toggle for credential handling
cache_secure_logging: true
# Redis replica settings to remove (configuration fix)
cache_redis_replica_settings_to_remove:
  - replica-serve-stale-data
  - replica-read-only
  - repl-ping-replica-period
  - client-output-buffer-limit
  - replica-priority
