---
# Cache role handlers

- name: Restart redis
  ansible.builtin.service:
    name: "{{ cache_redis_service_name }}"
    state: restarted

- name: Restart memcached
  ansible.builtin.service:
    name: memcached
    state: restarted

- name: Reload redis config
  ansible.builtin.service:
    name: "{{ cache_redis_service_name }}"
    state: reloaded
