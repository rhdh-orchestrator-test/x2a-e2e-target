---
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl user-create {{ username | default(chef_automate_username) }} {{ full_name | default(chef_automate_full_name) }} {{ email | default(chef_automate_email)
      }} "{{ password | default(chef_automate_password) }}" --filename {{ chef_automate_user_key_file }}

      '
  args:
    creates: "{{ chef_automate_user_key_file }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_full_name }}" --association_user {{ username | default(chef_automate_username)
      }} --filename {{ chef_automate_org_key_file }}

      '
  args:
    creates: "{{ chef_automate_org_key_file }}"
  become: true
