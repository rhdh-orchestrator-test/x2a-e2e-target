---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - unzip
      - gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
  args:
    creates: "{{ chef_automate_cli_path }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: "sudo ./chef-automate deploy {% if chef_automate_deploy_automate %}--product automate{% endif %} {% if chef_automate_deploy_infra_server %}--product infra-server{%
      endif %} --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }} "
  args:
    creates: /etc/chef-automate/config.toml
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
