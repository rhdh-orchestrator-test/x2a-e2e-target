---
controller_credential_types:
- name: Chef Server User Password
  description: Credential type for Chef Server User Password
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for the initial Chef user
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the initial Chef user
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Chef User PEM File
  description: Credential type for Chef User PEM File
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username associated with the PEM file
    - id: pem_content
      type: string
      label: PEM File Content
      secret: true
      help_text: Authentication key content for the Chef user
    required:
    - username
    - pem_content
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      pem_content: !unsafe '{{ pem_content }}'
- name: Chef Organization Validator
  description: Credential type for Chef Organization Validator
  kind: cloud
  inputs:
    fields:
    - id: organization_name
      type: string
      label: Organization Name
      help_text: Name of the Chef organization
    - id: validator_pem_content
      type: string
      label: Validator PEM Content
      secret: true
      help_text: Authentication key content for the Chef organization validator
    required:
    - organization_name
    - validator_pem_content
  injectors:
    extra_vars:
      organization_name: !unsafe '{{ organization_name }}'
      validator_pem_content: !unsafe '{{ validator_pem_content }}'
