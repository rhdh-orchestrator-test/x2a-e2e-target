---
- name: Ensure directories for PEM files exist
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_pem_path }}"
    - "{{ chef_automate_org_validator_pem_path }}"
  when: chef_automate_user_pem_path is defined and chef_automate_org_validator_pem_path is defined
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl user-create  {{ username }}  "{{ chef_automate_user_longname }}"  "{{ chef_automate_user_email }}"  "{{ password }}"  --filename {{
      chef_automate_user_pem_path }}

      '
  args:
    creates: "{{ chef_automate_user_pem_path }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl org-create  {{ organization_name }}  "{{ chef_automate_org_longname | default(''Chef Organization'') }}"  --association_user {{ username
      }}  --filename {{ chef_automate_org_validator_pem_path }}

      '
  args:
    creates: "{{ chef_automate_org_validator_pem_path }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
- name: Save user PEM content
  ansible.builtin.copy:
    content: "{{ pem_content }}"
    dest: "{{ chef_automate_user_pem_path }}"
    mode: "0600"
  when: pem_content is defined and pem_content | length > 0
  no_log: true
- name: Save organization validator PEM content
  ansible.builtin.copy:
    content: "{{ validator_pem_content }}"
    dest: "{{ chef_automate_org_validator_pem_path }}"
    mode: "0600"
  when: validator_pem_content is defined and validator_pem_content | length > 0
  no_log: true
