---
controller_credentials:
- name: Chef Server User Password - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Server User Password
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Chef User PEM File - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User PEM File
  update_secrets: true
  inputs:
    username: '{{ username }}'
    pem_content: '{{ vault_pem_content }}'
- name: Chef Organization Validator - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Organization Validator
  update_secrets: true
  inputs:
    organization_name: '{{ organization_name }}'
    validator_pem_content: '{{ vault_validator_pem_content }}'
