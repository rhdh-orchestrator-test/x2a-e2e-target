---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install cache packages
  ansible.builtin.package:
    name:
      - memcached
      - redis-server
    state: present
- name: Create redis group
  ansible.builtin.group:
    name: redis
    system: true
    state: present
- name: Create redis user
  ansible.builtin.user:
    name: redis
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    group: redis
    state: present
- name: Create Redis configuration directory
  ansible.builtin.file:
    path: /etc/redis
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}"
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true
- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}"
    owner: redis
    group: redis
    mode: "0640"
    backup: true
  notify: Restart redis
  vars:
    redis_port: "{{ cache_redis_port }}"
    redis_bind: "{{ cache_redis_bind }}"
    redis_password: "{{ redis_password }}"
    redis_maxmemory: "{{ cache_redis_maxmemory }}"
    redis_maxmemory_policy: "{{ cache_redis_maxmemory_policy }}"
    redis_log_file: "{{ cache_redis_log_dir }}/{{ cache_redis_log_file }}"
- name: Remove deprecated Redis configuration settings
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}"
    regexp: ^{{ item_redis_setting }}.*$
    state: absent
    backup: true
  loop: "{{ cache_redis_deprecated_settings }}"
  loop_control:
    loop_var: item_redis_setting
  notify: Restart redis
- name: Configure memcached
  ansible.builtin.template:
    src: memcached.conf.j2
    dest: /etc/memcached.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart memcached
  vars:
    memcached_port: "{{ cache_memcached_port }}"
    memcached_memory: "{{ cache_memcached_memory }}"
- name: Start and enable cache services
  ansible.builtin.service:
    name: "{{ item_cache_service }}"
    state: started
    enabled: true
  loop:
    - memcached
    - redis
  loop_control:
    loop_var: item_cache_service
