---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ deploy_automate_hostname }}"
  become: true
- name: Configure kernel parameters for Chef Automate
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
  loop: "{{ deploy_automate_sysctl_params | dict2items }}"
  become: true
  notify: Reload sysctl
- name: Create working directory if it doesn't exist
  ansible.builtin.file:
    path: "{{ deploy_automate_working_dir }}"
    state: directory
    mode: "0755"
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ deploy_automate_cli_url }}"
    dest: "{{ deploy_automate_cli_dest }}"
    mode: "0644"
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: "{{ deploy_automate_cli_dest }}"
    dest: "{{ deploy_automate_cli_extract_path }}"
    remote_src: true
  become: true
- name: Set executable permissions on Chef Automate CLI
  ansible.builtin.file:
    path: "{{ deploy_automate_cli_binary }}"
    mode: "0755"
  become: true
- name: Copy Chef Automate CLI to working directory
  ansible.builtin.copy:
    src: "{{ deploy_automate_cli_binary }}"
    dest: "{{ deploy_automate_working_dir }}/chef-automate"
    mode: "0755"
    remote_src: true
  become: true
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product {{ deploy_automate_products | join(' --product ') }} --accept-terms-and-mlsa={{ deploy_automate_accept_terms | lower
      }}
    chdir: "{{ deploy_automate_working_dir }}"
  args:
    creates: /hab
  become: true
- name: Check if chef-server-ctl exists
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl_check
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ long_username }} {{ user_email }} "{{ user_password }}" --filename {{ deploy_automate_user_key_path }}
  args:
    creates: "{{ deploy_automate_user_key_path }}"
  become: true
  when: chef_server_ctl_check.stat.exists
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ org_name }} "{{ long_org_name }}" --association_user {{ username }} --filename {{ deploy_automate_org_key_path }}
  args:
    creates: "{{ deploy_automate_org_key_path }}"
  become: true
  when: chef_server_ctl_check.stat.exists
