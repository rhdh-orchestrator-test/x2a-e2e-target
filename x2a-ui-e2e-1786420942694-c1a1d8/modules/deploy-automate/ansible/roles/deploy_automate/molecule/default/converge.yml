- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: test_user
    long_username: Test User
    user_email: test@example.com
    user_password: test_password
    org_name: test_org
    long_org_name: Test Organization
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/root
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/usr/bin
  - name: Create simulated Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create simulated Chef Automate CLI in working directory
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Mock'' '
      dest: /tmp/molecule_test/root/chef-automate
      mode: '0755'
  - name: Create simulated user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK PEM CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/root/test_user.pem
      mode: '0600'
  - name: Create simulated organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK ORG VALIDATOR PEM CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/root/test_org-validator.pem
      mode: '0600'
  - name: Create simulated chef-server-ctl binary
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Server CTL Mock'' '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
