- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: test_user
    org_name: test_org
  tasks:
  - name: Check if Chef Automate CLI exists in tmp directory
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli_tmp
  - name: Assert Chef Automate CLI exists in tmp directory
    ansible.builtin.assert:
      that:
      - chef_automate_cli_tmp.stat.exists
      - chef_automate_cli_tmp.stat.executable
      fail_msg: Chef Automate CLI not found in tmp directory or not executable
      success_msg: Chef Automate CLI exists in tmp directory and is executable
  - name: Check if Chef Automate CLI exists in working directory
    ansible.builtin.stat:
      path: /tmp/molecule_test/root/chef-automate
    register: chef_automate_cli_working
  - name: Assert Chef Automate CLI exists in working directory
    ansible.builtin.assert:
      that:
      - chef_automate_cli_working.stat.exists
      - chef_automate_cli_working.stat.executable
      fail_msg: Chef Automate CLI not found in working directory or not executable
      success_msg: Chef Automate CLI exists in working directory and is executable
  - name: Check if /hab directory exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert /hab directory exists
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: /hab directory not found
      success_msg: /hab directory exists
  - name: Check if user PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/root/{{ username }}.pem
    register: user_pem
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.size > 0
      fail_msg: User PEM file not found or empty
      success_msg: User PEM file exists and has content
  - name: Check if organization validator PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/root/{{ org_name }}-validator.pem
    register: org_validator_pem
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_validator_pem.stat.exists
      - org_validator_pem.stat.size > 0
      fail_msg: Organization validator PEM file not found or empty
      success_msg: Organization validator PEM file exists and has content
  - name: Check if chef-server-ctl exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/chef-server-ctl
    register: chef_server_ctl
  - name: Assert chef-server-ctl exists
    ansible.builtin.assert:
      that:
      - chef_server_ctl.stat.exists
      - chef_server_ctl.stat.executable
      fail_msg: chef-server-ctl not found or not executable
      success_msg: chef-server-ctl exists and is executable
  - name: Check system resources
    ansible.builtin.command:
      cmd: free -m
    register: free_output
    changed_when: false
    tags: molecule-notest
  - name: Check disk space
    ansible.builtin.command:
      cmd: df -h
    register: df_output
    changed_when: false
    tags: molecule-notest
  - name: Check if Chef Automate is running
    ansible.builtin.command:
      cmd: which chef-automate
    register: chef_automate_check
    changed_when: false
    failed_when: chef_automate_check.rc != 0
    tags: molecule-notest
  - name: Check if Chef Server is running
    ansible.builtin.command:
      cmd: which chef-server-ctl
    register: chef_server_check
    changed_when: false
    failed_when: chef_server_check.rc != 0
    tags: molecule-notest
