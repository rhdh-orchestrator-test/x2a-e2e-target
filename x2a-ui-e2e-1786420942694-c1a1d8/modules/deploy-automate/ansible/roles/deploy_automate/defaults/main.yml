---
deploy_automate_hostname: automate.chef.lab
deploy_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
deploy_automate_cli_dest: /tmp/chef-automate_linux_amd64.zip
deploy_automate_cli_extract_path: /tmp
deploy_automate_cli_binary: /tmp/chef-automate
deploy_automate_working_dir: /root
deploy_automate_sysctl_params:
  vm.max_map_count: "262144"
  vm.dirty_expire_centisecs: "20000"
deploy_automate_products:
  - automate
  - infra-server
deploy_automate_accept_terms: true
deploy_automate_user_key_path: "{{ deploy_automate_working_dir }}/{{ username }}.pem"
deploy_automate_org_key_path: "{{ deploy_automate_working_dir }}/{{ org_name }}-validator.pem"
