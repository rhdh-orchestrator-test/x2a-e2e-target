---
- name: Check if Chef Automate CLI is available
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: chef_automate_cli_stat
- name: Fail if Chef Automate CLI is not available
  ansible.builtin.fail:
    msg: Chef Automate CLI not found at {{ chef_automate_cli_path }}. Please ensure the install_cli.yml tasks have run successfully.
  when: not chef_automate_cli_stat.stat.exists or not chef_automate_cli_stat.stat.executable
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}
    creates: /hab
  become: true
  register: deploy_result
  notify: Display Chef Automate deployment result
