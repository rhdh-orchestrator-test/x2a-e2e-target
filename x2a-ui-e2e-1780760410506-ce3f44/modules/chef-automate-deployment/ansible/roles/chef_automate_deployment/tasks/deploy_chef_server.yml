---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - gzip
      - unzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
  register: download_result
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: cli_stat
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: /tmp/chef-automate.zip
    dest: /tmp/
    remote_src: true
    mode: "0755"
  when: download_result is changed or not cli_stat.stat.exists
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }} "
  become: true
  args:
    creates: /etc/chef-automate/config.toml
  register: deploy_result
  changed_when: deploy_result.rc == 0
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username | default(chef_automate_username) }} "{{ full_name | default(chef_automate_longusername) }}" {{ email |
      default(chef_automate_useremail) }} "{{ password }}" --filename {{ chef_automate_user_pem_path }}
  become: true
  args:
    creates: "{{ chef_automate_user_pem_path }}"
  no_log: true
  register: user_create_result
  changed_when: user_create_result.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_orgname }} "{{ chef_automate_longorgname }}" --association_user {{ username |
      default(chef_automate_username) }} --filename {{ chef_automate_org_pem_path }}
  become: true
  args:
    creates: "{{ chef_automate_org_pem_path }}"
  register: org_create_result
  changed_when: org_create_result.rc == 0
