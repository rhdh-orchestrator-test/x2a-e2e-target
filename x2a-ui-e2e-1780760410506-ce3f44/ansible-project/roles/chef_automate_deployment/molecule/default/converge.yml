- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    password: testpassword
    full_name: John Tonello
    email: jtonello@example.com
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/sysctl.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "# Chef Automate configuration\n[global]\n  fqdn = \"automate.chef.lab\"\n[deployment]\n  products = [\"automate\", \"infra-server\"]\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        (mock PEM content for testing purposes)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/tmp/jtonello.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        (mock PEM content for testing purposes)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/tmp/lab-validator.pem
      mode: '0600'
  - name: Create Chef Server status files
    ansible.builtin.copy:
      content: running
      dest: /tmp/molecule_test/chef-server-status
      mode: '0644'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: running
      dest: /tmp/molecule_test/chef-automate-status
      mode: '0644'
  - name: Create user list file
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/chef-server-user-list
      mode: '0644'
  - name: Create org list file
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/chef-server-org-list
      mode: '0644'
