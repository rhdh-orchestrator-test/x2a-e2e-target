---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Configure system for Chef Automate
  ansible.builtin.include_tasks: system_config.yml
- name: Install Chef Automate
  ansible.builtin.include_tasks: install.yml
  when: not chef_automate_deploy_server_only | default(false)
- name: Deploy Chef Server only
  ansible.builtin.include_tasks: deploy_chef_server.yml
  when: chef_automate_deploy_server_only | default(false)
- name: Setup user and organization
  ansible.builtin.include_tasks: user_org_setup.yml
