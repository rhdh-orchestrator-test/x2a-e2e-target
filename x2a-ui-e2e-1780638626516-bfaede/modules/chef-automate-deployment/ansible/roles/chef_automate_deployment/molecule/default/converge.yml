---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    password: password
    full_name: John Tonello
    email: jtonello@chef.lab
  tasks:
    # Create directory structure for testing
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/keys

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate kernel parameters
    - name: Create max_map_count file
      ansible.builtin.copy:
        content: "262144"
        dest: "/tmp/molecule_test/proc/sys/vm/max_map_count"
        mode: "0644"

    - name: Create dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "20000"
        dest: "/tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs"
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/sh\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.file:
        path: "/tmp/molecule_test/hab"
        state: directory
        mode: "0755"

    # Simulate user and organization key files
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY CONTENT\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/keys/jtonello.pem"
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORG VALIDATOR KEY CONTENT\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/keys/lab-validator.pem"
        mode: "0600"

    # Simulate Chef Server user and org list outputs
    - name: Create user list output file
      ansible.builtin.copy:
        content: "jtonello\npivotal\n"
        dest: "/tmp/molecule_test/chef-server-user-list.txt"
        mode: "0644"

    - name: Create org list output file
      ansible.builtin.copy:
        content: "lab\n"
        dest: "/tmp/molecule_test/chef-server-org-list.txt"
        mode: "0644"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status output file
      ansible.builtin.copy:
        content: "Service: automate-load-balancer\nStatus: running\nService: automate-cs-nginx\nStatus: running\n"
        dest: "/tmp/molecule_test/chef-automate-status.txt"
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status output file
      ansible.builtin.copy:
        content: "run: bookshelf: (pid 12345) 300s; run: nginx: (pid 12346) 300s\n"
        dest: "/tmp/molecule_test/chef-server-status.txt"
        mode: "0644"