---
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_automate_user_key_path }}

      '
  args:
    creates: "{{ chef_automate_user_key_path }}"
  register: user_create_result
  changed_when: user_create_result.rc == 0
  failed_when: user_create_result.rc != 0
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_full_name }}" --association_user {{ username }} --filename {{ chef_automate_org_key_path
      }}

      '
  args:
    creates: "{{ chef_automate_org_key_path }}"
  register: org_create_result
  changed_when: org_create_result.rc == 0
  failed_when: org_create_result.rc != 0
  become: true
