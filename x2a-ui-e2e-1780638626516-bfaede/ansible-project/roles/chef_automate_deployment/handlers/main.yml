---
- name: Restart Chef Automate
  ansible.builtin.command:
    cmd: sudo chef-automate restart
  register: restart_result
  changed_when: restart_result.rc == 0
  failed_when: restart_result.rc != 0
- name: Restart Chef Infra Server
  ansible.builtin.command:
    cmd: sudo chef-server-ctl restart
  register: restart_result
  changed_when: restart_result.rc == 0
  failed_when: restart_result.rc != 0
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
  args:
    creates: "{{ chef_automate_cli_path }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
