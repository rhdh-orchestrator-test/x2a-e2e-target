- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/run/redis
  - name: Create mock Redis configuration file
    ansible.builtin.copy:
      content: '# Redis configuration file example

        port {{ redis_port | default(6379) }}

        bind {{ redis_bind | default(''127.0.0.1'') }}

        maxmemory {{ redis_maxmemory | default(''256mb'') }}

        maxmemory-policy {{ redis_maxmemory_policy | default(''allkeys-lru'') }}

        dir /var/lib/redis

        logfile /var/log/redis/redis-server.log

        pidfile /var/run/redis/redis-server.pid

        daemonize yes

        supervised systemd

        {% if redis_rdb_enabled | default(true) %}

        save 900 1

        save 300 10

        save 60 10000

        dbfilename dump.rdb

        {% endif %}

        {% if redis_aof_enabled | default(false) %}

        appendonly yes

        appendfilename "appendonly.aof"

        {% endif %}

        '
      dest: /tmp/molecule_test/etc/redis/redis.conf
      mode: '0644'
  - name: Create mock Redis log file
    ansible.builtin.copy:
      content: '# Redis server log

        1:M 01 Jan 2023 00:00:00.000 * Redis 6.0.16 (00000000/0) 64 bit, standalone mode, port {{ redis_port | default(6379) }}

        1:M 01 Jan 2023 00:00:00.000 * Server initialized

        1:M 01 Jan 2023 00:00:00.000 * Ready to accept connections

        '
      dest: /tmp/molecule_test/var/log/redis/redis-server.log
      mode: '0644'
  - name: Create mock Redis data file
    ansible.builtin.copy:
      content: "REDIS0009þ\0\0"
      dest: /tmp/molecule_test/var/lib/redis/dump.rdb
      mode: '0644'
  - name: Create mock Redis socket file
    ansible.builtin.file:
      path: /tmp/molecule_test/var/run/redis/redis-server.sock
      state: touch
      mode: '0644'
