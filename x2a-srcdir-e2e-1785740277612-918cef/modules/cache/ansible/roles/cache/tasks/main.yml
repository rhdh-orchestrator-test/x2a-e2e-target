---
- name: Install and configure Redis cache server
  ansible.builtin.include_role:
    name: eloy.redis.redis
  vars:
    redis_port: "{{ redis_port }}"
    redis_bind: "{{ redis_bind }}"
    redis_maxmemory: "{{ redis_maxmemory }}"
    redis_maxmemory_policy: "{{ redis_maxmemory_policy }}"
    redis_service_enabled: "{{ redis_service_enabled }}"
    redis_service_state: "{{ redis_service_state }}"
    redis_rdb_enabled: "{{ redis_rdb_enabled }}"
    redis_aof_enabled: "{{ redis_aof_enabled }}"
