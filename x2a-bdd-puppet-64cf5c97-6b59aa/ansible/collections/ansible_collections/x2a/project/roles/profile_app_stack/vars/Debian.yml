---
# Debian-family operating system values for the application stack.
chrony_service_name: chrony
cron_package_name: cron
postgresql_client_package: postgresql-client
postgresql_dev_package: libpq-dev
python_runtime_packages:
  - python3
  - python3-pip
  - python3-venv
  - python3-dev
  - git
  - build-essential
  - curl
  - logrotate