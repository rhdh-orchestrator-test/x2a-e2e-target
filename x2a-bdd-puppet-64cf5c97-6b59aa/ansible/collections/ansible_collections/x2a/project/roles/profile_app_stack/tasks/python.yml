---
- name: Install Python runtime and application build packages
  ansible.builtin.package:
    name: "{{ python_runtime_packages + [postgresql_client_package, cron_package_name] }}"
    state: present

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true
    state: present

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    home: "{{ app_dir }}" # noqa: R114 - path from role defaults, not user input
    shell: /bin/bash
    system: true
    create_home: false
    state: present

- name: Create application log directory
  ansible.builtin.file:
    path: "{{ log_dir }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Create health check log directory
  ansible.builtin.file:
    path: /var/log/myapp-api
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy log rotation configuration
  ansible.builtin.template:
    src: logrotate.conf.j2
    dest: /etc/logrotate.d/{{ app_name }} # noqa: R114 - filename from role default, not user input
    owner: root
    group: root
    mode: "0644"
    backup: true
  vars:
    log_dir: "{{ log_dir }}"
    log_rotate_count: "{{ log_rotate_count }}"
    log_max_size: "{{ log_max_size }}"
    app_name: "{{ app_name }}"