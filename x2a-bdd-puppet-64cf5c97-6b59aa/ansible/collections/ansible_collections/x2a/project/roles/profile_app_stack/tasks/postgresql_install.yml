---
- name: Install PostgreSQL package list
  ansible.builtin.package:
    name: "{{ postgresql_package_names + [postgresql_dev_package] }}"
    state: present

- name: Initialize PostgreSQL database cluster on RedHat
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] == 'RedHat'