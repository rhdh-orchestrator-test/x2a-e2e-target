---
app_name: test-app
app_repo: file:///tmp/test-app-repo
app_revision: master
app_port: 8000
app_dir: /opt/test-app
app_user: appuser
app_group: appuser
worker_count: 2
worker_class: sync
max_requests: 1000
graceful_timeout: 30
log_dir: /var/log/test-app
log_level: info
python_version: python3
pip_packages: []
log_max_size: 100M
log_rotate_count: 7
app_environment: common
manage_utils: false
manage_ntp: false
manage_syslog: false
postgresql_version: 15
postgresql_package_names:
  - postgresql-15
  - postgresql-client-15
postgresql_service_name: postgresql
postgresql_repo_location: https://apt.postgresql.org/pub/repos/apt
postgresql_repo_release: "{{ ansible_facts['distribution_release'] }}-pgdg"
postgresql_repo_key_id: ACCC4CF8
postgresql_repo_key_source: https://www.postgresql.org/media/keys/ACCC4CF8.asc
postgresql_repo_key_filename: pgdg.asc
app_migrations_present: false
profile_app_stack_secure_logging: true
