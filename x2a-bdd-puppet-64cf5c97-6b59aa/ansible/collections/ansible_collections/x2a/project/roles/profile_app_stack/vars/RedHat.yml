---
# RedHat-family operating system values for the application stack.
chrony_service_name: chronyd
cron_package_name: cronie
postgresql_client_package: postgresql
postgresql_package_names:
  - postgresql-server
  - postgresql
postgresql_service_name: postgresql
postgresql_dev_package: libpq-devel
python_runtime_packages:
  - python3
  - python3-pip
  - python3-virtualenv
  - python3-devel
  - git
  - gcc
  - make
  - curl
  - logrotate