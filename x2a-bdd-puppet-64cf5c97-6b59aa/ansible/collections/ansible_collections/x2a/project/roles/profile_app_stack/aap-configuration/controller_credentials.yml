---
controller_credentials:
  - name: PostgreSQL Application Database - profile_app_stack
    description: Database connection credentials used by the test-app Python/Gunicorn application and local or production PostgreSQL instances.
    organization: Default
    credential_type: PostgreSQL Application Database
    update_secrets: true
    inputs:
      db_host: "{{ db_host }}"
      db_port: "{{ db_port }}"
      db_name: "{{ db_name }}"
      db_user: "{{ db_user }}"
      db_password: "{{ vault_db_password }}"
  - name: Test-App Application Secret - profile_app_stack
    description: Secret key used by the test-app application and rendered into its protected environment file.
    organization: Default
    credential_type: Test-App Application Secret
    update_secrets: true
    inputs:
      secret_key: "{{ vault_secret_key }}"
