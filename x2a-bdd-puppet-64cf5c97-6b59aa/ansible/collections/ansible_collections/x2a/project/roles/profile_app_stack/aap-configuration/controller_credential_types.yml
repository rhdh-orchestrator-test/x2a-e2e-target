---
controller_credential_types:
  - name: PostgreSQL Application Database
    description: Database connection credentials used by the test-app Python/Gunicorn application and local or production PostgreSQL instances.
    kind: cloud
    inputs:
      fields:
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname of the PostgreSQL server, such as localhost or db-primary.prod.internal.
        - id: db_port
          type: string
          label: Database Port
          help_text: TCP port used to connect to PostgreSQL.
        - id: db_name
          type: string
          label: Database Name
          help_text: Name of the application PostgreSQL database.
        - id: db_user
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the application PostgreSQL role; it is used in the generated DATABASE_URL and backup-related database operations.
      required:
        - db_host
        - db_port
        - db_name
        - db_user
        - db_password
    injectors:
      extra_vars:
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
        db_name: !unsafe "{{ db_name }}"
        db_user: !unsafe "{{ db_user }}"
        db_password: !unsafe "{{ db_password }}"
  - name: Test-App Application Secret
    description: Secret key used by the test-app application and rendered into its protected environment file.
    kind: cloud
    inputs:
      fields:
        - id: secret_key
          type: string
          label: Application Secret Key
          secret: true
          help_text: Sensitive application secret key rendered into /opt/test-app/.env; production, staging, and common values must be vaulted.
      required:
        - secret_key
    injectors:
      extra_vars:
        secret_key: !unsafe "{{ secret_key }}"
