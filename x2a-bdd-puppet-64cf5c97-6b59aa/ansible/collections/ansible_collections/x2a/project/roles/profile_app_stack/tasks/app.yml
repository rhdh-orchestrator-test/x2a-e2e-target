---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Check out application repository # noqa: R106 - repository source is a trusted role default
  ansible.builtin.git:
    repo: "{{ app_repo }}" # noqa: R104 - repository source is a trusted role default
    dest: "{{ app_dir }}" # noqa: R114 - path from role defaults, not user input
    version: "{{ app_revision }}"
    force: true
  notify: Restart application service
  become: true # noqa: R108 - checkout runs as the application user
  become_user: "{{ app_user }}"

- name: Create application virtual environment
  ansible.builtin.command:
    argv:
      - "{{ python_version }}" # noqa: R101 - interpreter comes from role defaults
      - -m
      - venv
      - "{{ app_dir }}/venv"
    creates: "{{ app_dir }}/venv/bin/activate" # noqa: R114 - path from role defaults, not user input
  become: true # noqa: R108 - virtual environment is created for the application user
  become_user: "{{ app_user }}"

- name: Install application requirements
  ansible.builtin.pip: # noqa: R113 - requirements package set is a role-defined application dependency
    requirements: "{{ app_dir }}/requirements.txt" # noqa: R114 - path from role defaults, not user input
    virtualenv: "{{ app_dir }}/venv" # noqa: R114 - path from role defaults, not user input
    virtualenv_command: "{{ python_version }} -m venv"
  notify: Restart application service
  become: true # noqa: R108 - packages are installed into the application virtualenv
  become_user: "{{ app_user }}"

- name: Install configured extra Python packages # noqa: R113 - package list comes from role defaults
  ansible.builtin.pip:
    name: "{{ pip_packages }}"
    virtualenv: "{{ app_dir }}/venv" # noqa: R114 - path from role defaults, not user input
    state: present
  when: pip_packages | length > 0
  notify: Restart application service
  become: true # noqa: R108 - packages are installed into the application virtualenv
  become_user: "{{ app_user }}"

- name: Deploy application environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dir }}/.env" # noqa: R114 - path from role defaults, not user input
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
    backup: true
  notify: Restart application service
  no_log: "{{ profile_app_stack_secure_logging }}"
  vars:
    db_url: postgresql://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/{{ db_name }}
    app_name: "{{ app_name }}"
    app_port: "{{ app_port }}"
    secret_key: "{{ secret_key }}"
    log_level: "{{ log_level }}"
    log_dir: "{{ log_dir }}"
    worker_count: "{{ worker_count }}"
    app_environment: "{{ app_environment }}"

- name: Deploy application health check script
  ansible.builtin.copy:
    src: app-healthcheck.sh
    dest: /usr/local/bin/app-healthcheck.sh
    owner: root
    group: root
    mode: "0755"
    backup: true

- name: Run database migrations when migration environment exists
  ansible.builtin.command:
    argv:
      - "{{ app_dir }}/venv/bin/python" # noqa: R101 - executable path comes from role defaults
      - -m
      - alembic
      - upgrade
      - head
    chdir: "{{ app_dir }}" # noqa: R114 - path from role defaults, not user input
  when: app_migrations_present | bool
  become: true # noqa: R108 - migration requires the application user context
  become_user: "{{ app_user }}"
  no_log: "{{ profile_app_stack_secure_logging }}"
  environment: # noqa: L045 - migration command requires DATABASE_URL in its task environment
    DATABASE_URL: postgresql://{{ db_user }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/{{ db_name }} # noqa: L039 - database variables come from role defaults or environment group variables
