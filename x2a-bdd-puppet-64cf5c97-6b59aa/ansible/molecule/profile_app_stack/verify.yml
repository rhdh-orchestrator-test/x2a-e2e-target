---
# Unsupported pre-flight checks: OS/fact printouts, unqualified status listings, optional
# production-only checks without a declared environment variable, timer listings, and
# crontab listings do not state a verifiable expected outcome for this scenario.
- name: Verify profile_app_stack pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Check python3 executable
      ansible.builtin.stat:
        path: /usr/bin/python3
      register: python3_stat

    - name: Assert python3 executable is present
      ansible.builtin.assert:
        that:
          - python3_stat.stat.exists
          - python3_stat.stat.executable
        fail_msg: python3 is not an executable at /usr/bin/python3

    - name: Check git executable
      ansible.builtin.stat:
        path: /usr/bin/git
      register: git_stat

    - name: Assert git executable is present
      ansible.builtin.assert:
        that:
          - git_stat.stat.exists
          - git_stat.stat.executable
        fail_msg: git is not an executable at /usr/bin/git

    - name: Look up appuser account
      ansible.builtin.getent:
        database: passwd
        key: appuser

    - name: Assert appuser account exists
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd['appuser'] is defined
        fail_msg: appuser account was not found

    - name: Look up appuser group
      ansible.builtin.getent:
        database: group
        key: appuser

    - name: Assert appuser group exists
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_group['appuser'] is defined
        fail_msg: appuser group was not found

    - name: Check test-app directory
      ansible.builtin.stat:
        path: /opt/test-app
      register: app_dir_stat

    - name: Assert test-app directory exists
      ansible.builtin.assert:
        that:
          - app_dir_stat.stat.isdir
        fail_msg: /opt/test-app is not a directory

    - name: Check Gunicorn executable
      ansible.builtin.stat:
        path: /opt/test-app/venv/bin/gunicorn
      register: gunicorn_stat

    - name: Assert Gunicorn executable exists
      ansible.builtin.assert:
        that:
          - gunicorn_stat.stat.exists
          - gunicorn_stat.stat.executable
        fail_msg: the test-app Gunicorn executable is missing or not executable

    - name: Check test-app environment file
      ansible.builtin.stat:
        path: /opt/test-app/.env
      register: env_file_stat

    - name: Assert test-app environment file exists
      ansible.builtin.assert:
        that:
          - env_file_stat.stat.isreg
        fail_msg: /opt/test-app/.env is missing or is not a regular file

    - name: Check test-app log directory
      ansible.builtin.stat:
        path: /var/log/test-app
      register: log_dir_stat

    - name: Assert test-app log directory exists
      ansible.builtin.assert:
        that:
          - log_dir_stat.stat.isdir
        fail_msg: /var/log/test-app is not a directory

    - name: Check test-app service is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - test-app
      register: test_app_enabled
      changed_when: false

    - name: Assert test-app service is enabled
      ansible.builtin.assert:
        that:
          - test_app_enabled.rc == 0
        fail_msg: test-app service is not enabled

    - name: Check test-app service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - test-app
      register: test_app_active
      changed_when: false

    - name: Assert test-app service is active
      ansible.builtin.assert:
        that:
          - test_app_active.rc == 0
        fail_msg: test-app service is not active

    - name: Check test-app service status
      ansible.builtin.command:
        argv:
          - systemctl
          - status
          - test-app
          - --no-pager
      register: test_app_status
      changed_when: false

    - name: Assert test-app status command succeeds
      ansible.builtin.assert:
        that:
          - test_app_status.rc == 0
        fail_msg: systemctl status reported a failure for test-app

    - name: Check test-app health endpoint
      ansible.builtin.uri:
        url: http://localhost:8000/health
        method: GET
        return_content: false
        status_code: 200

    - name: Verify test-app systemd unit syntax
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/test-app.service
      register: systemd_unit_verify
      changed_when: false

    - name: Assert test-app systemd unit is valid
      ansible.builtin.assert:
        that:
          - systemd_unit_verify.rc == 0
        fail_msg: systemd-analyze verify failed for test-app.service

    - name: Check requirements file
      ansible.builtin.stat:
        path: /opt/test-app/requirements.txt
      register: requirements_stat

    - name: Assert requirements file exists
      ansible.builtin.assert:
        that:
          - requirements_stat.stat.isreg
        fail_msg: /opt/test-app/requirements.txt is missing or is not a regular file

    - name: Check installed Python package consistency
      ansible.builtin.command:
        argv:
          - /opt/test-app/venv/bin/python
          - -m
          - pip
          - check
      register: pip_check
      changed_when: false

    - name: Assert Python package consistency check succeeds
      ansible.builtin.assert:
        that:
          - pip_check.rc == 0
        fail_msg: pip check reported inconsistent Python packages

    - name: Check Alembic current revision
      ansible.builtin.command:
        argv:
          - /opt/test-app/venv/bin/python
          - -m
          - alembic
          - current
        chdir: /opt/test-app
      register: alembic_current
      changed_when: false

    - name: Assert Alembic current command succeeds
      ansible.builtin.assert:
        that:
          - alembic_current.rc == 0
        fail_msg: Alembic current failed

    - name: Check local PostgreSQL readiness
      ansible.builtin.command:
        argv:
          - pg_isready
          - -h
          - localhost
          - -p
          - "5432"
      register: local_postgresql_ready
      changed_when: false
      when: profile_app_stack_db_host | default('localhost') == 'localhost'

    - name: Assert local PostgreSQL is ready
      ansible.builtin.assert:
        that:
          - local_postgresql_ready.rc == 0
        fail_msg: local PostgreSQL is not ready
      when: profile_app_stack_db_host | default('localhost') == 'localhost'

    - name: Check local PostgreSQL service is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - postgresql
      register: local_postgresql_enabled
      changed_when: false
      when: profile_app_stack_db_host | default('localhost') == 'localhost'

    - name: Assert local PostgreSQL service is enabled
      ansible.builtin.assert:
        that:
          - local_postgresql_enabled.rc == 0
        fail_msg: local PostgreSQL service is not enabled
      when: profile_app_stack_db_host | default('localhost') == 'localhost'

    - name: Check local PostgreSQL service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - postgresql
      register: local_postgresql_active
      changed_when: false
      when: profile_app_stack_db_host | default('localhost') == 'localhost'

    - name: Assert local PostgreSQL service is active
      ansible.builtin.assert:
        that:
          - local_postgresql_active.rc == 0
        fail_msg: local PostgreSQL service is not active
      when: profile_app_stack_db_host | default('localhost') == 'localhost'

    - name: Check testuser PostgreSQL role
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT 1 FROM pg_roles WHERE rolname='testuser'
      register: testuser_role
      changed_when: false
      when: profile_app_stack_db_host | default('localhost') == 'localhost'

    - name: Assert testuser PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - testuser_role.rc == 0
          - testuser_role.stdout | trim == '1'
        fail_msg: testuser PostgreSQL role was not found
      when: profile_app_stack_db_host | default('localhost') == 'localhost'

    - name: Check testdb PostgreSQL database
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT 1 FROM pg_catalog.pg_database WHERE datname='testdb'
      register: testdb_database
      changed_when: false
      when: profile_app_stack_db_host | default('localhost') == 'localhost'

    - name: Assert testdb PostgreSQL database exists
      ansible.builtin.assert:
        that:
          - testdb_database.rc == 0
          - testdb_database.stdout | trim == '1'
        fail_msg: testdb PostgreSQL database was not found
      when: profile_app_stack_db_host | default('localhost') == 'localhost'

    - name: Check testuser database CREATE privilege
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT has_database_privilege('testuser', 'testdb', 'CREATE')
      register: testuser_database_privilege
      changed_when: false
      when: profile_app_stack_db_host | default('localhost') == 'localhost'

    - name: Assert testuser has CREATE privilege on testdb
      ansible.builtin.assert:
        that:
          - testuser_database_privilege.rc == 0
          - testuser_database_privilege.stdout | trim == 't'
        fail_msg: testuser lacks CREATE privilege on testdb
      when: profile_app_stack_db_host | default('localhost') == 'localhost'

    - name: Check production PostgreSQL readiness
      ansible.builtin.command:
        argv:
          - pg_isready
          - -h
          - db-primary.prod.internal
          - -p
          - "5432"
      register: production_postgresql_ready
      changed_when: false
      when: profile_app_stack_db_host | default('') == 'db-primary.prod.internal'

    - name: Assert production PostgreSQL is ready
      ansible.builtin.assert:
        that:
          - production_postgresql_ready.rc == 0
        fail_msg: production PostgreSQL is not ready
      when: profile_app_stack_db_host | default('') == 'db-primary.prod.internal'

    - name: Check database backup script
      ansible.builtin.stat:
        path: /usr/local/bin/db-backup.sh
      register: backup_script_stat

    - name: Assert database backup script is executable
      ansible.builtin.assert:
        that:
          - backup_script_stat.stat.exists
          - backup_script_stat.stat.executable
        fail_msg: /usr/local/bin/db-backup.sh is missing or not executable

    - name: Check application health-check script
      ansible.builtin.stat:
        path: /usr/local/bin/app-healthcheck.sh
      register: healthcheck_script_stat

    - name: Assert application health-check script is executable
      ansible.builtin.assert:
        that:
          - healthcheck_script_stat.stat.exists
          - healthcheck_script_stat.stat.executable
        fail_msg: /usr/local/bin/app-healthcheck.sh is missing or not executable

    - name: Check logrotate configuration
      ansible.builtin.stat:
        path: /etc/logrotate.d/test-app
      register: logrotate_config_stat

    - name: Assert logrotate configuration exists
      ansible.builtin.assert:
        that:
          - logrotate_config_stat.stat.isreg
        fail_msg: /etc/logrotate.d/test-app is missing or is not a regular file

    - name: Validate logrotate configuration
      ansible.builtin.command:
        argv:
          - logrotate
          - -d
          - /etc/logrotate.d/test-app
      register: logrotate_verify
      changed_when: false

    - name: Assert logrotate validation succeeds
      ansible.builtin.assert:
        that:
          - logrotate_verify.rc == 0
        fail_msg: logrotate validation failed for test-app
