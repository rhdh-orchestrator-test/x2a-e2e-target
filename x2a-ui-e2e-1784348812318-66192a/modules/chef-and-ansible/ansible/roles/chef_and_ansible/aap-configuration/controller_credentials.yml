---
controller_credentials:
- name: Chef Server Admin - chef_and_ansible
  description: Admin credentials for Chef Server deployment
  organization: Default
  credential_type: Chef Server Admin
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Chef Automate Admin - chef_and_ansible
  description: Admin credentials for Chef Automate deployment
  organization: Default
  credential_type: Chef Automate Admin
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
