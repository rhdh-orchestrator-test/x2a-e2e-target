---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_hostname }}"
  become: true
- name: Set vm.max_map_count
  community.general.sysctl:
    name: vm.max_map_count
    value: "{{ chef_vm_max_map_count }}"
    state: present
    reload: true
  become: true
- name: Set vm.dirty_expire_centisecs
  community.general.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ chef_vm_dirty_expire_centisecs }}"
    state: present
    reload: true
  become: true
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
  register: download_result
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c /tmp/chef-automate.zip > /tmp/chef-automate && chmod +x /tmp/chef-automate
  args:
    creates: /tmp/chef-automate
  changed_when: false
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: /tmp/chef-automate deploy --product infra-server --accept-terms-and-mlsa=true
    creates: /hab
  become: true
  register: deploy_result
  async: 3600
  poll: 30
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_username }}  "{{ chef_longusername }}"  {{ chef_useremail }}  "{{ password }}"  --filename {{ chef_userfilename }}

      '
  args:
    creates: "{{ chef_userfilename }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_orgname }}  "{{ chef_longorgname }}"  --association_user {{ chef_username }}  --filename {{ chef_orgfilename }}

      '
  args:
    creates: "{{ chef_orgfilename }}"
  become: true
