---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/tmp

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl settings
    - name: Create max_map_count file
      ansible.builtin.copy:
        content: "262144"
        dest: "/tmp/molecule_test/proc/sys/vm/max_map_count"
        mode: "0644"

    - name: Create dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "20000"
        dest: "/tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs"
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create chef-automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI'"
        dest: "/tmp/molecule_test/tmp/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create hab directory to simulate deployment
      ansible.builtin.file:
        path: "/tmp/molecule_test/hab"
        state: directory
        mode: "0755"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA...\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/admin.pem"
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA...\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/chef-validator.pem"
        mode: "0600"

    # Simulate chef-server-ctl output for user list
    - name: Create user list file
      ansible.builtin.copy:
        content: "admin"
        dest: "/tmp/molecule_test/user-list.txt"
        mode: "0644"

    # Simulate chef-server-ctl output for org list
    - name: Create org list file
      ansible.builtin.copy:
        content: "chef"
        dest: "/tmp/molecule_test/org-list.txt"
        mode: "0644"

    # Simulate network listening on port 443
    - name: Create netstat output file
      ansible.builtin.copy:
        content: "tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/chef-automate"
        dest: "/tmp/molecule_test/netstat.txt"
        mode: "0644"

    # Simulate Chef Automate status output
    - name: Create chef-automate status file
      ansible.builtin.copy:
        content: "Service: chef-automate\nStatus: running"
        dest: "/tmp/molecule_test/chef-automate-status.txt"
        mode: "0644"

    # Simulate Chef Infra Server status output
    - name: Create chef-server-ctl status file
      ansible.builtin.copy:
        content: "Service: chef-server\nStatus: running"
        dest: "/tmp/molecule_test/chef-server-status.txt"
        mode: "0644"