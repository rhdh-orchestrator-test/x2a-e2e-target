---
argument_specs:
  main:
    short_description: Configure Memcached and Redis cache services
    description:
      - Installs and configures Memcached and a standalone Redis cache instance.
      - Redis authentication is supplied through an AAP credential variable.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress task output when handling the Redis password.
      cache_memcached_user:
        type: str
        required: false
        default: memcached
        description: Operating system user used to run Memcached.
      cache_memcached_service:
        type: str
        required: false
        default: memcached
        description: Memcached service name.
      cache_memcached_config:
        type: str
        required: false
        default: /etc/memcached.conf
        description: Memcached configuration file path.
      cache_memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory allocation in megabytes.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      cache_memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      cache_memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      cache_memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum simultaneous Memcached connections.
      cache_memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      cache_memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Experimental Memcached command-line options.
      cache_memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional Memcached command-line options.
      cache_memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: File descriptor limit for Memcached.
      cache_memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log file path.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
