---
controller_credential_types:
  - name: Redis Authentication
    description: Redis authentication password currently hardcoded in the Chef recipe and intended for protected Ansible Vault storage during migration.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis clients to authenticate to the Redis instance on port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
