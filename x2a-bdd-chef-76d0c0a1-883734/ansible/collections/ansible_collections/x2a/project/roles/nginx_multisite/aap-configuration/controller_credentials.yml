---
controller_credentials:
  - name: Chef Encrypted Data Bag Site Token - nginx_multisite
    description: Token stored in the Chef encrypted data bag nginx_secrets/site and written to the Nginx secrets directory.
    organization: Default
    credential_type: Chef Encrypted Data Bag Site Token
    update_secrets: true
    inputs:
      site_token: "{{ vault_site_token }}"
  - name: Nginx TLS Certificate and Private Key - nginx_multisite
    description: TLS material for SSL-enabled Nginx virtual hosts, currently generated locally with OpenSSL.
    organization: Default
    credential_type: Nginx TLS Certificate and Private Key
    update_secrets: true
    inputs:
      tls_private_key: "{{ vault_tls_private_key }}"
      tls_certificate: "{{ tls_certificate }}"
