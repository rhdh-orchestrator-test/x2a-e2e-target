---
argument_specs:
  main:
    short_description: Configure Nginx with multiple SSL-enabled virtual hosts
    description:
      - Installs and configures Nginx, security hardening, Fail2ban, UFW, and optional SSL sites.
    options:
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for site TLS certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for site TLS private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and enable Fail2ban.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and enable UFW.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks handling the site token.
      nginx_multisite_sites:
        type: dict
        required: false
        default: {}
        description: Site definitions keyed by site name, including document_root, site_folder, and ssl_enabled.
      site_token:
        type: str
        required: true
        description: Site token injected by an AAP credential type.
      tls_private_key:
        type: str
        required: true
        description: TLS private key injected by an AAP credential type.
      tls_certificate:
        type: str
        required: true
        description: TLS certificate injected by an AAP credential type.
