---
- name: Install SSH server for security hardening
  ansible.builtin.package:
    name: openssh-server
    state: present

- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
    state: present
  when: nginx_multisite_fail2ban_enabled | bool or nginx_multisite_ufw_enabled | bool

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Render Fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Check UFW status
  ansible.builtin.command:
    argv: [ufw, status]
  register: nginx_multisite_ufw_status
  changed_when: false
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default incoming policy  # noqa: L039 - registered by prior task
  ansible.builtin.command:
    argv: [ufw, --force, default, deny]
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Default: deny' not in nginx_multisite_ufw_status.stdout"

- name: Allow SSH through UFW  # noqa: L039 - registered by prior task
  ansible.builtin.command:
    argv: [ufw, allow, ssh]
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTP through UFW  # noqa: L039 - registered by prior task
  ansible.builtin.command:
    argv: [ufw, allow, http]
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTPS through UFW  # noqa: L039 - registered by prior task
  ansible.builtin.command:
    argv: [ufw, allow, https]
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Enable UFW  # noqa: L039 - registered by prior task
  ansible.builtin.command:
    argv: [ufw, --force, enable]
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"

- name: Render sysctl security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    state: present
    create: false
    backup: true
  when: nginx_multisite_ssh_disable_root | bool
  notify: Restart sshd

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    state: present
    create: false
    backup: true
  when: not nginx_multisite_ssh_password_auth | bool
  notify: Restart sshd
