---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}" # noqa: R114 - path from role defaults
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}" # noqa: R114 - path from role defaults
    owner: root
    group: ssl-cert
    mode: "0710"
    state: directory

- name: Deploy TLS certificate  # noqa: L039 - variable is provided as a role parameter
  ansible.builtin.copy:
    content: "{{ tls_certificate }}"
    dest: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_ssl['key'] }}.crt" # noqa: R114 - site name from role-defined sites dictionary
    owner: root
    group: root
    mode: "0644"
  no_log: "{{ nginx_multisite_secure_logging }}"
  when: item_nginx_ssl['value']['ssl_enabled'] | bool
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_ssl

- name: Deploy TLS private key  # noqa: L039 - variable is provided as a role parameter
  ansible.builtin.copy:
    content: "{{ tls_private_key }}"
    dest: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_ssl['key'] }}.key" # noqa: R114 - site name from role-defined sites dictionary
    owner: root
    group: ssl-cert
    mode: "0640"
  no_log: "{{ nginx_multisite_secure_logging }}"
  when: item_nginx_ssl['value']['ssl_enabled'] | bool
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_ssl

- name: Check certificate files
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_ssl['key'] }}.crt" # noqa: R114 - site name from role-defined sites dictionary
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_ssl
  register: nginx_multisite_certificate_status

- name: Generate self-signed certificates  # noqa: L039 - registered by prior task
  ansible.builtin.shell:  # noqa: R101 - command uses role-defined paths and site names
    cmd: |
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        -keyout "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_ssl['key'] }}.key" \
        -out "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_ssl['key'] }}.crt" \
        -subj "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_ssl['key'] }}/emailAddress=admin@example.com"
      chmod 640 "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_ssl['key'] }}.key"
      chown root:ssl-cert "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_ssl['key'] }}.key"
    creates: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_ssl['key'] }}.crt" # noqa: R114 - path from role-defined sites dictionary
  when:
    - item_nginx_ssl['value']['ssl_enabled'] | bool
    - not (nginx_multisite_certificate_status.results[ansible_loop.index0]['stat']['exists'] | bool)
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_ssl
    extended: true
  notify: Reload nginx

- name: Set private key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_ssl['key'] }}.key" # noqa: R114 - site name from role-defined sites dictionary
    owner: root
    group: ssl-cert
    mode: "0640"
    state: file
  when: item_nginx_ssl['value']['ssl_enabled'] | bool
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_ssl
    extended: true
