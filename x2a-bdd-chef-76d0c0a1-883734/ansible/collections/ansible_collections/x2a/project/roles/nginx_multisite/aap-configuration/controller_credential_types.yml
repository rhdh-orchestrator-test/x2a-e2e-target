---
controller_credential_types:
  - name: Chef Encrypted Data Bag Site Token
    description: Token stored in the Chef encrypted data bag nginx_secrets/site and written to the Nginx secrets directory.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Site Token
          secret: true
          help_text: Secret token from the encrypted nginx_secrets/site data-bag item.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
  - name: Nginx TLS Certificate and Private Key
    description: TLS material for SSL-enabled Nginx virtual hosts, currently generated locally with OpenSSL.
    kind: cloud
    inputs:
      fields:
        - id: tls_private_key
          type: string
          label: TLS Private Key
          secret: true
          help_text: Private key for the SSL-enabled Nginx virtual host; protect with restrictive permissions.
        - id: tls_certificate
          type: string
          label: TLS Certificate
          help_text: Self-signed TLS certificate for the SSL-enabled Nginx virtual host.
      required:
        - tls_private_key
        - tls_certificate
    injectors:
      extra_vars:
        tls_private_key: !unsafe "{{ tls_private_key }}"
        tls_certificate: !unsafe "{{ tls_certificate }}"
