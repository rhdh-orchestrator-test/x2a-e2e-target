---
# Unsupported pre-flight checks: version-only diagnostics, git revision output, package-list
# output, pip/package listings, systemd/log diagnostics, process/resource listings, and the
# credential-bearing DATABASE_URL value have no safe, explicit expected assertion here.
- name: Verify fastapi-tutorial deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Collect installed package facts for package pre-flight checks
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify required RHEL-family packages
      ansible.builtin.assert:
        that:
          - item_rhel_package in ansible_facts['packages']
        fail_msg: "A required RHEL-family package is not installed."
      loop:
        - python3
        - python3-pip
        - git
        - postgresql-server
        - postgresql-contrib
        - libpq-devel
      loop_control:
        loop_var: item_rhel_package
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Verify required Debian-family packages
      ansible.builtin.assert:
        that:
          - item_debian_package in ansible_facts['packages']
        fail_msg: "A required Debian-family package is not installed."
      loop:
        - python3
        - python3-pip
        - python3-venv
        - git
        - postgresql
        - postgresql-contrib
        - libpq-dev
      loop_control:
        loop_var: item_debian_package
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify PostgreSQL initialization marker on RHEL-family systems
      ansible.builtin.stat:
        path: /var/lib/pgsql/data/PG_VERSION
      register: postgresql_version_marker
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Assert PostgreSQL initialization marker exists
      ansible.builtin.assert:
        that:
          - postgresql_version_marker['stat']['isreg']
        fail_msg: "The PostgreSQL initialization marker is missing."
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Verify FastAPI application directory
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: fastapi_directory

    - name: Assert FastAPI application directory exists
      ansible.builtin.assert:
        that:
          - fastapi_directory['stat']['isdir']
        fail_msg: "The FastAPI application directory is missing."

    - name: Verify FastAPI requirements file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/requirements.txt
      register: fastapi_requirements

    - name: Assert FastAPI requirements file exists
      ansible.builtin.assert:
        that:
          - fastapi_requirements['stat']['isreg']
        fail_msg: "The FastAPI requirements file is missing."

    - name: Verify FastAPI virtual environment executables
      ansible.builtin.stat:
        path: "{{ item_fastapi_executable }}"
      register: fastapi_executables
      loop:
        - /opt/fastapi-tutorial/venv/bin/python
        - /opt/fastapi-tutorial/venv/bin/pip
        - /opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_fastapi_executable

    - name: Assert FastAPI virtual environment executables are executable
      ansible.builtin.assert:
        that:
          - item_fastapi_stat['stat']['isreg']
          - item_fastapi_stat['stat']['executable']
        fail_msg: "A required FastAPI virtual environment executable is missing or not executable."
      loop: "{{ fastapi_executables['results'] }}"
      loop_control:
        loop_var: item_fastapi_stat

    - name: Verify FastAPI environment file
      ansible.builtin.slurp:
        src: /opt/fastapi-tutorial/.env
      register: fastapi_environment

    - name: Assert non-secret FastAPI environment settings
      ansible.builtin.assert:
        that:
          - "'PROJECT_NAME=\"FastAPI Tutorial\"' in (fastapi_environment['content'] | b64decode)"
          - "'API_VERSION=1.0.0' in (fastapi_environment['content'] | b64decode)"
        fail_msg: "The non-secret FastAPI environment settings are incorrect."

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Assert fastapi-tutorial service is enabled and running
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['fastapi-tutorial.service']['status'] == 'enabled'
          - ansible_facts['services']['fastapi-tutorial.service']['state'] == 'running'
        fail_msg: "The fastapi-tutorial service is not enabled and running."

    - name: Assert PostgreSQL service is enabled and running
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['postgresql.service']['status'] == 'enabled'
          - ansible_facts['services']['postgresql.service']['state'] == 'running'
        fail_msg: "The PostgreSQL service is not enabled and running."

    - name: Verify fastapi-tutorial systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit

    - name: Assert fastapi-tutorial systemd unit settings
      ansible.builtin.assert:
        that:
          - "'User=root' in (fastapi_unit['content'] | b64decode)"
          - "'WorkingDirectory=/opt/fastapi-tutorial' in (fastapi_unit['content'] | b64decode)"
          - "'/opt/fastapi-tutorial/venv/bin/uvicorn' in (fastapi_unit['content'] | b64decode)"
          - "'Restart=always' in (fastapi_unit['content'] | b64decode)"
        fail_msg: "The fastapi-tutorial systemd unit does not contain the expected settings."

    - name: Verify PostgreSQL port is available
      ansible.builtin.wait_for:
        host: localhost
        port: 5432
        state: started
        timeout: 5

    - name: Verify FastAPI port is available
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8000
        state: started
        timeout: 5

    - name: Check PostgreSQL role exists
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT rolname FROM pg_roles WHERE rolname = 'fastapi';
      register: fastapi_role_check
      changed_when: false

    - name: Assert PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - fastapi_role_check['stdout'] | trim == 'fastapi'
        fail_msg: "The PostgreSQL role fastapi does not exist."

    - name: Check PostgreSQL database and owner
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT datname, pg_catalog.pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'fastapi_db';
      register: fastapi_database_check
      changed_when: false

    - name: Assert PostgreSQL database and owner
      ansible.builtin.assert:
        that:
          - fastapi_database_check['stdout'] | trim == 'fastapi_db | fastapi'
        fail_msg: "The PostgreSQL database fastapi_db or its owner is incorrect."
