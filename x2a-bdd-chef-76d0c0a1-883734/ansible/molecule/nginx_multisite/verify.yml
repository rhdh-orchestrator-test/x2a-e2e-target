---
# Unsupported pre-flight checks: service status output, Fail2ban jail status, sysctl values,
# secret ownership/mode output, and the unresolved site-manifest checks have no stated
# expected result or require site names that were not supplied.
- name: Verify nginx-multisite pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Check security sysctl configuration file exists
      ansible.builtin.stat:
        path: /etc/sysctl.d/99-security.conf
      register: sysctl_security_file

    - name: Assert security sysctl configuration file exists
      ansible.builtin.assert:
        that:
          - sysctl_security_file.stat.exists
          - sysctl_security_file.stat.isreg
        fail_msg: "The security sysctl configuration file is missing."

    - name: Check SSH hardening settings
      ansible.builtin.command:
        argv:
          - grep
          - ^PermitRootLogin no
          - /etc/ssh/sshd_config
      register: ssh_root_login
      changed_when: false

    - name: Assert root SSH login is disabled
      ansible.builtin.assert:
        that:
          - ssh_root_login.rc == 0
        fail_msg: "PermitRootLogin no was not found in sshd_config."

    - name: Check SSH password authentication setting
      ansible.builtin.command:
        argv:
          - grep
          - ^PasswordAuthentication no
          - /etc/ssh/sshd_config
      register: ssh_password_authentication
      changed_when: false

    - name: Assert SSH password authentication is disabled
      ansible.builtin.assert:
        that:
          - ssh_password_authentication.rc == 0
        fail_msg: "PasswordAuthentication no was not found in sshd_config."

    - name: Validate SSH daemon configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      register: sshd_config_test
      changed_when: false

    - name: Assert SSH daemon configuration is valid
      ansible.builtin.assert:
        that:
          - sshd_config_test.rc == 0
        fail_msg: "sshd configuration validation failed."

    - name: Check Nginx main configuration file
      ansible.builtin.stat:
        path: /etc/nginx/nginx.conf
      register: nginx_config_file

    - name: Assert Nginx main configuration file exists
      ansible.builtin.assert:
        that:
          - nginx_config_file.stat.exists
          - nginx_config_file.stat.isreg
        fail_msg: "The Nginx main configuration file is missing."

    - name: Check Nginx security configuration file
      ansible.builtin.stat:
        path: /etc/nginx/conf.d/security.conf
      register: nginx_security_file

    - name: Assert Nginx security configuration file exists
      ansible.builtin.assert:
        that:
          - nginx_security_file.stat.exists
          - nginx_security_file.stat.isreg
        fail_msg: "The Nginx security configuration file is missing."

    - name: Validate Nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_config_test
      changed_when: false

    - name: Assert Nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_config_test.rc == 0
        fail_msg: "Nginx configuration validation failed."

    - name: Check Nginx PID file
      ansible.builtin.stat:
        path: /run/nginx.pid
      register: nginx_pid_file

    - name: Assert Nginx PID file exists
      ansible.builtin.assert:
        that:
          - nginx_pid_file.stat.exists
          - nginx_pid_file.stat.isreg
        fail_msg: "The Nginx PID file is missing."

    - name: Check UFW verbose status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: ufw_verbose_status
      changed_when: false

    - name: Assert UFW default incoming policy denies traffic
      ansible.builtin.assert:
        that:
          - ufw_verbose_status.rc == 0
          - "'Default: deny' in ufw_verbose_status.stdout"
        fail_msg: "UFW default incoming policy is not deny."

    - name: Check UFW allowed ports
      ansible.builtin.command:
        argv:
          - ufw
          - status
      register: ufw_status
      changed_when: false

    - name: Assert UFW allows SSH HTTP and HTTPS
      ansible.builtin.assert:
        that:
          - ufw_status.rc == 0
          - "'22/tcp' in ufw_status.stdout"
          - "'80/tcp' in ufw_status.stdout"
          - "'443/tcp' in ufw_status.stdout"
        fail_msg: "UFW does not show all required TCP ports."

    - name: Check HTTP and HTTPS listeners
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: listening_sockets
      changed_when: false

    - name: Assert HTTP and HTTPS listeners are present
      ansible.builtin.assert:
        that:
          - listening_sockets.rc == 0
          - listening_sockets.stdout is search(':80')
          - listening_sockets.stdout is search(':443')
        fail_msg: "The required HTTP or HTTPS listener is missing."
