---
- name: Ensure Redis collection is available
  ansible.builtin.meta:
    collections:
      - eloy.redis
- name: Install and configure Redis cache
  ansible.builtin.include_role:
    name: eloy.redis.redis
  vars:
    redis_install_method: "{{ redis_install_method }}"
    redis_port: "{{ redis_port }}"
    redis_bind_interface: "{{ redis_bind_interface }}"
    redis_service_enabled: "{{ redis_service_enabled }}"
    redis_service_state: "{{ redis_service_state }}"
