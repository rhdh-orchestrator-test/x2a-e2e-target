- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected Redis directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/run/redis
  - name: Create mock Redis configuration file
    ansible.builtin.copy:
      content: '# Redis configuration file example


        # Accept connections on the specified port, default is 6379

        port 6379


        # If you want you can bind a single interface

        bind 127.0.0.1


        # Specify the path for the Unix socket that will be used to listen for

        # incoming connections

        unixsocket /var/run/redis/redis-server.sock


        # Specify the log file name

        logfile /var/log/redis/redis-server.log


        # Set the number of databases

        databases 16


        # The working directory

        dir /var/lib/redis


        # Run as a daemon

        daemonize yes

        '
      dest: /tmp/molecule_test/etc/redis/redis.conf
      mode: '0644'
  - name: Create mock Redis log file
    ansible.builtin.copy:
      content: '1:M 01 Jan 2023 00:00:00.000 # Server initialized

        1:M 01 Jan 2023 00:00:00.000 * Ready to accept connections

        '
      dest: /tmp/molecule_test/var/log/redis/redis-server.log
      mode: '0644'
  - name: Create mock Redis socket directory
    ansible.builtin.file:
      path: /tmp/molecule_test/var/run/redis
      state: directory
      mode: '0755'
  - name: Create mock Redis socket file
    ansible.builtin.file:
      path: /tmp/molecule_test/var/run/redis/redis-server.sock
      state: touch
      mode: '0644'
  - name: Set role variables
    ansible.builtin.set_fact:
      redis_install_method: package
      redis_port: 6379
      redis_bind_interface: 127.0.0.1
      redis_service_enabled: true
      redis_service_state: started
      redis_service_name: redis-server
