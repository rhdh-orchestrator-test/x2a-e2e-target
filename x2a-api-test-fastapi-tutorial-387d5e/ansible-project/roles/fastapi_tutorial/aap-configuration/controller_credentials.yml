---
controller_credentials:
- name: PostgreSQL Database Credentials - fastapi_tutorial
  description: Database credentials for PostgreSQL connection used by FastAPI tutorial
    application
  organization: Default
  credential_type: PostgreSQL Database Credentials
  update_secrets: true
  inputs:
    db_username: '{{ db_username }}'
    db_password: '{{ vault_db_password }}'
    db_host: '{{ db_host }}'
    db_name: '{{ db_name }}'
