---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install required system packages
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_system_packages }}"
    state: present
- name: Install PostgreSQL development packages (Debian/Ubuntu)
  ansible.builtin.package:
    name: libpq-dev
    state: present
  when: ansible_os_family == "Debian"
- name: Install PostgreSQL development packages (RedHat/CentOS)
  ansible.builtin.package:
    name: postgresql-devel
    state: present
  when: ansible_os_family == "RedHat"
- name: Create service user
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    system: true
    shell: /bin/false
    home: "{{ fastapi_tutorial_app_dir }}"
    create_home: false
  when: fastapi_tutorial_service_user != "root"
- name: Create service group
  ansible.builtin.group:
    name: "{{ fastapi_tutorial_service_group }}"
    system: true
  when: fastapi_tutorial_service_group != "root"
- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}"
    state: directory
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    mode: "{{ fastapi_tutorial_dir_mode }}"
- name: Clone FastAPI tutorial repository
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repo_url }}"
    dest: "{{ fastapi_tutorial_app_dir }}"
    version: "{{ fastapi_tutorial_repo_branch }}"
    force: true
  become_user: "{{ fastapi_tutorial_service_user }}"
  when: fastapi_tutorial_service_user != "root"
- name: Clone FastAPI tutorial repository (as root)
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repo_url }}"
    dest: "{{ fastapi_tutorial_app_dir }}"
    version: "{{ fastapi_tutorial_repo_branch }}"
    force: true
  when: fastapi_tutorial_service_user == "root"
- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv {{ fastapi_tutorial_venv_path }}
    creates: "{{ fastapi_tutorial_venv_path }}/bin/python"
- name: Set virtual environment ownership
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_venv_path }}"
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    recurse: true
- name: Install Python dependencies
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_venv_path }}"
- name: Enable and start PostgreSQL service
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
- name: Check if PostgreSQL user exists
  ansible.builtin.command:
    cmd: sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ fastapi_tutorial_db_user }}'"
  register: postgres_user_check
  changed_when: false
  failed_when: false
- name: Create PostgreSQL database user
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "CREATE USER {{ fastapi_tutorial_db_user }} WITH PASSWORD '{{ fastapi_tutorial_db_password }}';"
  when: postgres_user_check.stdout != "1"
- name: Check if PostgreSQL database exists
  ansible.builtin.command:
    cmd: sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ fastapi_tutorial_db_name }}'"
  register: postgres_db_check
  changed_when: false
  failed_when: false
- name: Create PostgreSQL database
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "CREATE DATABASE {{ fastapi_tutorial_db_name }} OWNER {{ fastapi_tutorial_db_user }};"
  when: postgres_db_check.stdout != "1"
- name: Grant privileges on database
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ fastapi_tutorial_db_name }} TO {{ fastapi_tutorial_db_user }};"
  changed_when: false
- name: Create environment configuration file
  ansible.builtin.copy:
    content: 'PROJECT_NAME="{{ fastapi_tutorial_project_name }}"

      API_VERSION={{ fastapi_tutorial_api_version }}

      DATABASE_URL=postgresql://{{ fastapi_tutorial_db_user }}:{{ fastapi_tutorial_db_password }}@{{ fastapi_tutorial_db_host }}/{{ fastapi_tutorial_db_name }}

      '
    dest: "{{ fastapi_tutorial_app_dir }}/.env"
    mode: "{{ fastapi_tutorial_file_mode }}"
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    backup: true
- name: Create systemd service file
  ansible.builtin.copy:
    content: '[Unit]

      Description=FastAPI Tutorial Service

      After=network.target postgresql.service


      [Service]

      Type=simple

      User={{ fastapi_tutorial_service_user }}

      WorkingDirectory={{ fastapi_tutorial_app_dir }}

      Environment="PATH={{ fastapi_tutorial_venv_path }}/bin"

      ExecStart={{ fastapi_tutorial_venv_path }}/bin/uvicorn app.main:app --host {{ fastapi_tutorial_host }} --port {{ fastapi_tutorial_port }}

      Restart=always


      [Install]

      WantedBy=multi-user.target

      '
    dest: /etc/systemd/system/{{ fastapi_tutorial_service_name }}.service
    mode: "{{ fastapi_tutorial_file_mode }}"
    owner: root
    group: root
    backup: true
  notify:
    - Reload systemd daemon
    - Restart fastapi tutorial service
- name: Enable and start FastAPI tutorial service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
