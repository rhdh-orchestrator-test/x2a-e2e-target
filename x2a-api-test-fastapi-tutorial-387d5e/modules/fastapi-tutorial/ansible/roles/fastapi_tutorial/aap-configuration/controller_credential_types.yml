---
controller_credential_types:
- name: PostgreSQL Database Credentials
  description: Database credentials for PostgreSQL connection used by FastAPI tutorial
    application
  kind: cloud
  inputs:
    fields:
    - id: db_username
      type: string
      label: Database Username
      help_text: PostgreSQL database username for FastAPI application
    - id: db_password
      type: string
      label: Database Password
      secret: true
      help_text: PostgreSQL database password for FastAPI application authentication
    - id: db_host
      type: string
      label: Database Host
      help_text: PostgreSQL database host address
    - id: db_name
      type: string
      label: Database Name
      help_text: PostgreSQL database name for FastAPI application
    required:
    - db_username
    - db_password
    - db_host
    - db_name
  injectors:
    extra_vars:
      db_username: !unsafe '{{ db_username }}'
      db_password: !unsafe '{{ db_password }}'
      db_host: !unsafe '{{ db_host }}'
      db_name: !unsafe '{{ db_name }}'
