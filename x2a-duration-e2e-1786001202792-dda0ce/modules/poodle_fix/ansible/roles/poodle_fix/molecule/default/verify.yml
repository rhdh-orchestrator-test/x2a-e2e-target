---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check if the ssl.conf file exists
    - name: Check if ssl.conf exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_conf_file

    - name: Assert ssl.conf file exists
      ansible.builtin.assert:
        that:
          - ssl_conf_file.stat.exists
          - ssl_conf_file.stat.isreg
        fail_msg: "ssl.conf file not found"
        success_msg: "ssl.conf file exists"

    # Check if the SSL protocol configuration has been updated
    - name: Get ssl.conf content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_conf_content
      when: ssl_conf_file.stat.exists

    - name: Assert SSL protocol configuration is secure
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in (ssl_conf_content.content | b64decode)"
        fail_msg: "SSL configuration not properly updated to mitigate POODLE vulnerability"
        success_msg: "SSL configuration properly updated to mitigate POODLE vulnerability"
      when: ssl_conf_file.stat.exists

    # The following checks would be performed in a real environment but can't run in the container
    # They are tagged with molecule-notest to be skipped during molecule testing
    
    - name: Check Apache service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Check SSH service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert SSH service is running
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
          - "ansible_facts.services['sshd.service'].state == 'running'"
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"
      tags: molecule-notest

    - name: Validate Apache configuration
      ansible.builtin.command: apache2ctl configtest
      register: apache_config_test
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Apache configuration is valid
      ansible.builtin.assert:
        that:
          - "apache_config_test.rc == 0"
          - "'Syntax OK' in apache_config_test.stdout"
        fail_msg: "Apache configuration test failed"
        success_msg: "Apache configuration is valid"
      tags: molecule-notest