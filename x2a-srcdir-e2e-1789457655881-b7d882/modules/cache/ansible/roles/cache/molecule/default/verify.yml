---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis configuration and data files exist
      ansible.builtin.stat:
        path: "{{ item_file }}"
      loop:
        - /tmp/molecule_test/etc/redis/redis.conf
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/log/redis/redis-server.log
        - /tmp/molecule_test/var/run/redis/redis-server.pid
      loop_control:
        loop_var: item_file
      register: redis_file_stats

    - name: Assert Redis files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: "Expected Redis file not found"
      loop: "{{ redis_file_stats['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check Redis configuration file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/redis/redis.conf
      register: redis_config_content

    - name: Assert Redis configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'port 6379' in redis_config_decoded"
          - "'bind 127.0.0.1' in redis_config_decoded"
          - "'dir /var/lib/redis' in redis_config_decoded"
          - "'logfile /var/log/redis/redis-server.log' in redis_config_decoded"
        fail_msg: "Redis configuration missing expected settings"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

    - name: Check Redis log file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/log/redis/redis-server.log
      register: redis_log_content

    - name: Assert Redis log file has content
      ansible.builtin.assert:
        that:
          - redis_log_content['content'] | b64decode | length > 0
          - "'Server started' in redis_log_decoded"
        fail_msg: "Redis log file missing expected content"
      vars:
        redis_log_decoded: "{{ redis_log_content['content'] | b64decode }}"

    - name: Check Redis PID file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/run/redis/redis-server.pid
      register: redis_pid_content

    - name: Assert Redis PID file has valid content
      ansible.builtin.assert:
        that:
          - redis_pid_content['content'] | b64decode | trim | length > 0
          - redis_pid_content['content'] | b64decode | trim | int > 0
        fail_msg: "Redis PID file missing or invalid"

- name: Verify Redis Service (Container-incompatible checks)
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis service status
      ansible.builtin.command:
        cmd: systemctl status redis-server
      register: redis_service_status
      failed_when: false
      tags: molecule-notest

    - name: Assert Redis service is active
      ansible.builtin.assert:
        that:
          - redis_service_status['rc'] == 0
          - "'active (running)' in redis_service_status['stdout']"
        fail_msg: "Redis service not running"
      tags: molecule-notest

    - name: Check Redis process is running
      ansible.builtin.command:
        cmd: pgrep redis-server
      register: redis_process_check
      failed_when: false
      tags: molecule-notest

    - name: Assert Redis process exists
      ansible.builtin.assert:
        that:
          - redis_process_check['rc'] == 0
          - redis_process_check['stdout'] | length > 0
        fail_msg: "Redis process not found"
      tags: molecule-notest

- name: Verify Redis Connectivity (Container-incompatible checks)
  hosts: all
  gather_facts: false
  tasks:
    - name: Test Redis connectivity with ping
      ansible.builtin.command:
        cmd: redis-cli ping
      register: redis_ping_result
      failed_when: false
      tags: molecule-notest

    - name: Assert Redis responds to ping
      ansible.builtin.assert:
        that:
          - redis_ping_result['rc'] == 0
          - "'PONG' in redis_ping_result['stdout']"
        fail_msg: "Redis not responding to ping"
      tags: molecule-notest

    - name: Test Redis basic operations
      ansible.builtin.command:
        cmd: "{{ item_cmd }}"
      loop:
        - redis-cli set test_key "test_value"
        - redis-cli get test_key
        - redis-cli del test_key
      loop_control:
        loop_var: item_cmd
      register: redis_ops_results
      failed_when: false
      tags: molecule-notest

    - name: Assert Redis operations work
      ansible.builtin.assert:
        that:
          - item_result['rc'] == 0
        fail_msg: "Redis operation failed"
      loop: "{{ redis_ops_results['results'] }}"
      loop_control:
        loop_var: item_result
      tags: molecule-notest

    - name: Check Redis server info
      ansible.builtin.command:
        cmd: "{{ item_info_cmd }}"
      loop:
        - redis-cli info server
        - redis-cli info memory
        - redis-cli info clients
      loop_control:
        loop_var: item_info_cmd
      register: redis_info_results
      failed_when: false
      tags: molecule-notest

    - name: Assert Redis info commands work
      ansible.builtin.assert:
        that:
          - item_result['rc'] == 0
          - item_result['stdout'] | length > 0
        fail_msg: "Redis info command failed"
      loop: "{{ redis_info_results['results'] }}"
      loop_control:
        loop_var: item_result
      tags: molecule-notest

- name: Verify Redis Network (Container-incompatible checks)
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 5
      tags: molecule-notest

    - name: Check network connections
      ansible.builtin.command:
        cmd: "{{ item_net_cmd }}"
      loop:
        - netstat -tulpn | grep 6379
        - ss -tlnp | grep redis
        - lsof -i :6379
      loop_control:
        loop_var: item_net_cmd
      register: redis_network_results
      failed_when: false
      tags: molecule-notest

    - name: Assert Redis network bindings exist
      ansible.builtin.assert:
        that:
          - item_result['rc'] == 0
          - item_result['stdout'] | length > 0
        fail_msg: "Redis network binding not found"
      loop: "{{ redis_network_results['results'] }}"
      loop_control:
        loop_var: item_result
      tags: molecule-notest