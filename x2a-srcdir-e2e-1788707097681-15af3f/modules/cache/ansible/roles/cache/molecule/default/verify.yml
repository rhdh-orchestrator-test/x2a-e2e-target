---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis configuration and data directories exist
      ansible.builtin.stat:
        path: "{{ item_path }}"
      loop:
        - /tmp/molecule_test/etc/redis/redis.conf
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_path
      register: redis_path_results

    - name: Assert Redis directories and files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: "Expected Redis path not found"
      loop: "{{ redis_path_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check Redis configuration file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/redis/redis.conf
      register: redis_config_content

    - name: Assert Redis configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'port 6379' in redis_config_decoded"
          - "'bind 127.0.0.1' in redis_config_decoded"
          - "'dir /var/lib/redis' in redis_config_decoded"
          - "'logfile /var/log/redis/redis-server.log' in redis_config_decoded"
        fail_msg: "Redis configuration missing expected settings"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

    - name: Check Redis log file exists and has content
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/redis/redis-server.log
      register: redis_log_stat

    - name: Assert Redis log file was created with content
      ansible.builtin.assert:
        that:
          - redis_log_stat['stat']['exists']
          - redis_log_stat['stat']['size'] > 0
        fail_msg: "Redis log file not found or empty"

    - name: Check Redis PID file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/run/redis/redis-server.pid
      register: redis_pid_stat

    - name: Assert Redis PID file was created
      ansible.builtin.assert:
        that:
          - redis_pid_stat['stat']['exists']
          - redis_pid_stat['stat']['size'] > 0
        fail_msg: "Redis PID file not found or empty"

    # Service checks that cannot run in container environment
    - name: Check Redis service status (container-incompatible)
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Redis service is active (container-incompatible)
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
        fail_msg: "Redis service not running"
      tags: molecule-notest

    # Network connectivity checks that cannot run in container
    - name: Check Redis port 6379 is listening (container-incompatible)
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 5
      tags: molecule-notest

    # Redis CLI checks that cannot run in container without Redis installed
    - name: Test Redis connectivity with ping (container-incompatible)
      ansible.builtin.command:
        cmd: redis-cli ping
      register: redis_ping_result
      changed_when: false
      tags: molecule-notest

    - name: Assert Redis responds to ping (container-incompatible)
      ansible.builtin.assert:
        that:
          - "redis_ping_result['stdout'] == 'PONG'"
        fail_msg: "Redis not responding to ping"
      tags: molecule-notest

    - name: Test Redis basic operations (container-incompatible)
      ansible.builtin.command:
        argv:
          - redis-cli
          - set
          - test_key
          - test_value
      register: redis_set_result
      changed_when: false
      tags: molecule-notest

    - name: Verify Redis set operation (container-incompatible)
      ansible.builtin.command:
        argv:
          - redis-cli
          - get
          - test_key
      register: redis_get_result
      changed_when: false
      tags: molecule-notest

    - name: Assert Redis operations work (container-incompatible)
      ansible.builtin.assert:
        that:
          - "redis_get_result['stdout'] == 'test_value'"
        fail_msg: "Redis basic operations failed"
      tags: molecule-notest

    - name: Clean up test key (container-incompatible)
      ansible.builtin.command:
        argv:
          - redis-cli
          - del
          - test_key
      changed_when: false
      tags: molecule-notest