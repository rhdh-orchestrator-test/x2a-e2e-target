- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Get hostname
    ansible.builtin.command: hostname
    register: hostname_result
    changed_when: false
    tags: molecule-notest
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - '''automate.chef.lab'' in hostname_result.stdout'
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    tags: molecule-notest
  - name: Get kernel parameters
    ansible.builtin.command: sysctl {{ item }}
    register: sysctl_result
    changed_when: false
    loop:
    - vm.max_map_count
    - vm.dirty_expire_centisecs
    tags: molecule-notest
  - name: Assert kernel parameters are set correctly
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in sysctl_result.results[0].stdout'
      - '''vm.dirty_expire_centisecs = 20000'' in sysctl_result.results[1].stdout'
      fail_msg: Kernel parameters not set correctly
      success_msg: Kernel parameters set correctly
    tags: molecule-notest
  - name: Check Chef Automate config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: automate_config
  - name: Assert Chef Automate config file exists
    ansible.builtin.assert:
      that:
      - automate_config.stat.exists
      - automate_config.stat.isreg
      fail_msg: Chef Automate config file not found
      success_msg: Chef Automate config file exists
  - name: Check Chef Infra Server config directory exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/opscode
    register: opscode_dir
  - name: Assert Chef Infra Server config directory exists
    ansible.builtin.assert:
      that:
      - opscode_dir.stat.exists
      - opscode_dir.stat.isdir
      fail_msg: Chef Infra Server config directory not found
      success_msg: Chef Infra Server config directory exists
  - name: Check Chef Infra Server config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/opscode/chef-server.rb
    register: chef_server_config
  - name: Assert Chef Infra Server config file exists
    ansible.builtin.assert:
      that:
      - chef_server_config.stat.exists
      - chef_server_config.stat.isreg
      fail_msg: Chef Infra Server config file not found
      success_msg: Chef Infra Server config file exists
  - name: Check admin user key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_key
  - name: Assert admin user key file exists
    ansible.builtin.assert:
      that:
      - user_key.stat.exists
      - user_key.stat.isreg
      - user_key.stat.mode == '0400'
      fail_msg: Admin user key file not found or has incorrect permissions
      success_msg: Admin user key file exists with correct permissions
  - name: Check organization validator key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_key
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key.stat.exists
      - org_key.stat.isreg
      - org_key.stat.mode == '0400'
      fail_msg: Organization validator key file not found or has incorrect permissions
      success_msg: Organization validator key file exists with correct permissions
  - name: Check Chef Automate service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      - ansible_facts.services['chef-automate.service'].state == 'running'
      fail_msg: Chef Automate service is not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check if required ports are listening
    ansible.builtin.wait_for:
      port: '{{ item }}'
      state: started
      timeout: 5
    loop:
    - 443
    - 9631
    ignore_errors: true
    register: port_check
    tags: molecule-notest
  - name: Assert required ports are listening
    ansible.builtin.assert:
      that:
      - not port_check.failed
      fail_msg: Required ports are not listening
      success_msg: Required ports are listening
    tags: molecule-notest
  - name: Check web UI accessibility
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/status
      validate_certs: false
      status_code: 200
    register: web_ui
    ignore_errors: true
    tags: molecule-notest
  - name: Assert web UI is accessible
    ansible.builtin.assert:
      that:
      - not web_ui.failed
      fail_msg: Web UI is not accessible
      success_msg: Web UI is accessible
    tags: molecule-notest
