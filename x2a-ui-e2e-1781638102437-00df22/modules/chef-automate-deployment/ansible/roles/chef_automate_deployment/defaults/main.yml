---
chef_automate_hostname: automate.chef.lab
chef_automate_vm_max_map_count: 262144
chef_automate_vm_dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: ./chef-automate
chef_automate_accept_terms: true
chef_automate_admin_username: "{{ username | default('jtonello') }}"
chef_automate_admin_fullname: "{{ full_name | default('John Tonello') }}"
chef_automate_admin_email: "{{ email | default('jtonello@chef.lab') }}"
chef_automate_admin_password: "{{ password | default('password') }}"
chef_automate_admin_key_file: "{{ chef_automate_admin_username }}.pem"
chef_automate_org_name: lab
chef_automate_org_fullname: Chef Lab
chef_automate_org_validator_key: "{{ chef_automate_org_name }}-validator.pem"
chef_automate_deploy_automate: true
