---
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Fail if chef-server-ctl is not available
  ansible.builtin.fail:
    msg: chef-server-ctl command not found. Ensure Chef Infra Server is installed.
  when: chef_server_ctl_check.rc != 0
- name: Create admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_automate_admin_username }} {{ chef_automate_admin_fullname }} {{ chef_automate_admin_email }} "{{ chef_automate_admin_password
      }}" --filename {{ chef_automate_admin_key_file }}

      '
    creates: "{{ chef_automate_admin_key_file }}"
  become: true
  register: user_create_result
  no_log: true
- name: Create organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_fullname }}" --association_user {{ chef_automate_admin_username }} --filename
      {{ chef_automate_org_validator_key }}

      '
    creates: "{{ chef_automate_org_validator_key }}"
  become: true
  register: org_create_result
- name: Set permissions on admin key file
  ansible.builtin.file:
    path: "{{ chef_automate_admin_key_file }}"
    mode: "0400"
  when: user_create_result.changed
- name: Set permissions on organization validator key file
  ansible.builtin.file:
    path: "{{ chef_automate_org_validator_key }}"
    mode: "0400"
  when: org_create_result.changed
