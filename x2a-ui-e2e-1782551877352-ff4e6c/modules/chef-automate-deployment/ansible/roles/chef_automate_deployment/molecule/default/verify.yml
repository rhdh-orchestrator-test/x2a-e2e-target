---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration verification
    - name: Check hostname configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found or empty"
        success_msg: "Hostname file exists and has content"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
        fail_msg: "Hostname not set to expected value"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Sysctl configuration verification
    - name: Check sysctl configuration files
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate-{{ item.key | replace('.', '-') }}.conf"
      register: sysctl_files
      loop:
        - key: vm.max_map_count
          value: 262144
        - key: vm.dirty_expire_centisecs
          value: 20000
      loop_control:
        label: "{{ item.key }}"

    - name: Assert sysctl files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Sysctl file for {{ item.item.key }} not found"
        success_msg: "Sysctl file for {{ item.item.key }} exists"
      loop: "{{ sysctl_files.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    # Chef Automate CLI verification
    - name: Check Chef Automate CLI file
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # User and organization key verification
    - name: Check user key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_key_file

    - name: Assert user key file exists with proper permissions
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.mode == '0400'
        fail_msg: "User key file not found or has incorrect permissions"
        success_msg: "User key file exists with correct permissions"

    - name: Check organization validator key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_key_file

    - name: Assert organization validator key file exists with proper permissions
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.mode == '0400'
        fail_msg: "Organization validator key file not found or has incorrect permissions"
        success_msg: "Organization validator key file exists with correct permissions"

    # Chef Automate status verification (would run in real environment)
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: chef-automate status
      register: automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - automate_status.rc == 0
          - "'Status: running' in automate_status.stdout"
        fail_msg: "Chef Automate is not running properly"
        success_msg: "Chef Automate is running properly"
      tags: molecule-notest

    # Chef Server status verification (would run in real environment)
    - name: Check Chef Server status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Server is running
      ansible.builtin.assert:
        that:
          - server_status.rc == 0
        fail_msg: "Chef Server is not running properly"
        success_msg: "Chef Server is running properly"
      tags: molecule-notest

    # User verification (would run in real environment)
    - name: Check Chef user list
      ansible.builtin.command:
        cmd: chef-server-ctl user-list
      register: user_list
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert user exists
      ansible.builtin.assert:
        that:
          - "'jtonello' in user_list.stdout"
        fail_msg: "User jtonello not found"
        success_msg: "User jtonello exists"
      tags: molecule-notest

    # Organization verification (would run in real environment)
    - name: Check Chef organization list
      ansible.builtin.command:
        cmd: chef-server-ctl org-list
      register: org_list
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert organization exists
      ansible.builtin.assert:
        that:
          - "'lab' in org_list.stdout"
        fail_msg: "Organization lab not found"
        success_msg: "Organization lab exists"
      tags: molecule-notest

    # Web UI access verification (would run in real environment)
    - name: Check web UI access
      ansible.builtin.uri:
        url: https://automate.chef.lab/
        validate_certs: false
      register: web_ui
      failed_when: false
      tags: molecule-notest

    - name: Assert web UI is accessible
      ansible.builtin.assert:
        that:
          - web_ui.status == 200
        fail_msg: "Chef Automate web UI is not accessible"
        success_msg: "Chef Automate web UI is accessible"
      tags: molecule-notest

    # Port verification (would run in real environment)
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest