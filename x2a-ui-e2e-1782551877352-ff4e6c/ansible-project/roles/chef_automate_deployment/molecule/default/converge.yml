---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create test directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/tmp
        - /tmp/molecule_test/var/log/chef-automate
        - /tmp/molecule_test/var/log/chef-server

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname | default('automate.chef.lab') }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: "{{ item.key }} = {{ item.value }}"
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate-{{ item.key | replace('.', '-') }}.conf"
        mode: "0644"
      loop:
        - key: vm.max_map_count
          value: 262144
        - key: vm.dirty_expire_centisecs
          value: 20000

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI Mock'\necho 'Success!'"
        dest: "/tmp/molecule_test/tmp/chef-automate"
        mode: "0755"

    # Simulate user and organization key files
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/jtonello.pem"
        mode: "0400"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORG VALIDATOR KEY CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/lab-validator.pem"
        mode: "0400"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          chef-automate status
          Service: automate-gateway
            Status: running
          Service: automate-postgresql
            Status: running
          Service: automate-elasticsearch
            Status: running
          Service: automate-ui
            Status: running
        dest: "/tmp/molecule_test/var/log/chef-automate/status.log"
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          chef-server-ctl status
          run: chef-server: (pid 12345) 123s; run: log: (pid 12346) 123s
          run: bookshelf: (pid 12347) 123s; run: log: (pid 12348) 123s
          run: oc_bifrost: (pid 12349) 123s; run: log: (pid 12350) 123s
          run: oc_id: (pid 12351) 123s; run: log: (pid 12352) 123s
          run: opscode-erchef: (pid 12353) 123s; run: log: (pid 12354) 123s
          run: opscode-expander: (pid 12355) 123s; run: log: (pid 12356) 123s
          run: opscode-solr4: (pid 12357) 123s; run: log: (pid 12358) 123s
          run: postgresql: (pid 12359) 123s; run: log: (pid 12360) 123s
          run: rabbitmq: (pid 12361) 123s; run: log: (pid 12362) 123s
          run: redis_lb: (pid 12363) 123s; run: log: (pid 12364) 123s
        dest: "/tmp/molecule_test/var/log/chef-server/status.log"
        mode: "0644"

    # Simulate user and organization list outputs
    - name: Create Chef user list file
      ansible.builtin.copy:
        content: "jtonello\npivotal"
        dest: "/tmp/molecule_test/var/log/chef-server/user-list.log"
        mode: "0644"

    - name: Create Chef organization list file
      ansible.builtin.copy:
        content: "lab"
        dest: "/tmp/molecule_test/var/log/chef-server/org-list.log"
        mode: "0644"