---
- name: Ensure directories for key files exist
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_key_path }}"
    - "{{ chef_org_key_path }}"
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create  {{ username }}  "{{ full_name }}"  {{ email }}  "{{ password }}"  --filename {{ chef_user_key_path }}
  become: true
  register: user_create_result
  changed_when: user_create_result.rc == 0
  failed_when:
    - user_create_result.rc != 0
    - "'already exists' not in user_create_result.stderr"
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create  {{ chef_org_name }}  "{{ chef_org_full_name }}"  --association_user {{ username }}  --filename {{ chef_org_key_path }}
  become: true
  register: org_create_result
  changed_when: org_create_result.rc == 0
  failed_when:
    - org_create_result.rc != 0
    - "'already exists' not in org_create_result.stderr"
- name: Set proper permissions on key files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0400"
    state: file
  loop:
    - "{{ chef_user_key_path }}"
    - "{{ chef_org_key_path }}"
  when:
    - user_create_result.rc == 0 or org_create_result.rc == 0
