---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - gzip
      - unzip
      - curl
    state: present
  become: true
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: cli_stat
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
  register: download_result
  when: not cli_stat.stat.exists
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_path }}
    stdin: "{{ download_result.dest }}"
  args:
    creates: "{{ chef_automate_cli_path }}"
  when: download_result is defined and download_result.changed
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
  when: download_result is defined and download_result.changed
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} {{ chef_automate_deploy_options }}"
  become: true
  register: deploy_result
  changed_when: "'Success!' in deploy_result.stdout"
  failed_when:
    - deploy_result.rc != 0
    - "'already deployed' not in deploy_result.stderr"
