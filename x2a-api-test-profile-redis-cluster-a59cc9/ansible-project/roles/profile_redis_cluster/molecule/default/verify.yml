---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/redis/redis.conf
        - /tmp/molecule_test/etc/redis/redis.conf.orig
        - /tmp/molecule_test/etc/systemd/system/redis.service
        - /tmp/molecule_test/etc/security/limits.d/redis.conf
        - /tmp/molecule_test/etc/systemd/system/redis.service.d/limit.conf
        - /tmp/molecule_test/etc/default/redis-server
      loop_control:
        loop_var: item_config
      register: config_stat_results

    - name: Assert configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected configuration file not found"
      loop: "{{ config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check Redis directories exist
      ansible.builtin.stat:
        path: "{{ item_dir }}"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir
      register: dir_stat_results

    - name: Assert directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected directory not found"
      loop: "{{ dir_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read Redis main configuration file
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/redis/redis.conf
      register: redis_conf_content

    - name: Verify Redis configuration content
      ansible.builtin.assert:
        that:
          - "'port 6379' in redis_conf_decoded"
          - "'requirepass CHANGEME' in redis_conf_decoded"
          - "'maxmemory 2048mb' in redis_conf_decoded"
          - "'maxmemory-policy allkeys-lru' in redis_conf_decoded"
          - "'appendonly yes' in redis_conf_decoded"
          - "'bind 0.0.0.0' in redis_conf_decoded"
        fail_msg: "Redis configuration missing expected settings"
      vars:
        redis_conf_decoded: "{{ redis_conf_content['content'] | b64decode }}"

    - name: Read Redis systemd service file
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/systemd/system/redis.service
      register: redis_service_content

    - name: Verify Redis systemd service configuration
      ansible.builtin.assert:
        that:
          - "'ExecStart=/usr/bin/redis-server /etc/redis/redis.conf' in redis_service_decoded"
          - "'User=redis' in redis_service_decoded"
          - "'Group=redis' in redis_service_decoded"
          - "'TimeoutStartSec=10' in redis_service_decoded"
          - "'TimeoutStopSec=0' in redis_service_decoded"
        fail_msg: "Redis systemd service missing expected configuration"
      vars:
        redis_service_decoded: "{{ redis_service_content['content'] | b64decode }}"

    - name: Read Redis ulimit configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/security/limits.d/redis.conf
      register: redis_ulimit_content

    - name: Verify Redis ulimit configuration
      ansible.builtin.assert:
        that:
          - "'redis soft nofile 65535' in redis_ulimit_decoded"
          - "'redis hard nofile 65535' in redis_ulimit_decoded"
        fail_msg: "Redis ulimit configuration missing expected settings"
      vars:
        redis_ulimit_decoded: "{{ redis_ulimit_content['content'] | b64decode }}"

    - name: Read Redis systemd ulimit override
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/systemd/system/redis.service.d/limit.conf
      register: redis_systemd_ulimit_content

    - name: Verify Redis systemd ulimit override
      ansible.builtin.assert:
        that:
          - "'LimitNOFILE=65535' in redis_systemd_ulimit_decoded"
        fail_msg: "Redis systemd ulimit override missing expected configuration"
      vars:
        redis_systemd_ulimit_decoded: "{{ redis_systemd_ulimit_content['content'] | b64decode }}"

    - name: Check Redis log and data files exist
      ansible.builtin.stat:
        path: "{{ item_file }}"
      loop:
        - /tmp/molecule_test/var/log/redis/redis-server.log
        - /tmp/molecule_test/var/lib/redis/dump.rdb
        - /tmp/molecule_test/var/lib/redis/appendonly.aof
      loop_control:
        loop_var: item_file
      register: data_file_stat_results

    - name: Assert data files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected data file not found"
      loop: "{{ data_file_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

# Service and network checks that cannot run in container environment
- name: Verify Redis service (container-incompatible)
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Redis service is configured
      ansible.builtin.assert:
        that:
          - "'redis.service' in ansible_facts.services"
        fail_msg: "Redis service not found in systemd"
      tags: molecule-notest

    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 5
      tags: molecule-notest

    - name: Test Redis connectivity
      ansible.builtin.uri:
        url: "redis://127.0.0.1:6379"
        method: GET
        timeout: 5
      tags: molecule-notest
      failed_when: false

    - name: Validate Redis configuration syntax
      ansible.builtin.command:
        cmd: redis-server /etc/redis/redis.conf --test-memory 1
      tags: molecule-notest
      failed_when: false
      changed_when: false