---
- name: Set OS-specific Redis package name
  ansible.builtin.set_fact:
    redis_package_name: "{{ redis_package_name_debian }}"
  when: ansible_os_family == "Debian"
- name: Set OS-specific Redis package name
  ansible.builtin.set_fact:
    redis_package_name: "{{ redis_package_name_redhat }}"
  when: ansible_os_family == "RedHat"
