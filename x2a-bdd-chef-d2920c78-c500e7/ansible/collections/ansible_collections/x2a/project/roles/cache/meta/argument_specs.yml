---
argument_specs:
  main:
    short_description: Configure Memcached and Redis caching services
    description:
      - Installs and configures Memcached and Redis with the requested cache service settings.
    options:
      memcached_version:
        type: str
        required: false
        default:
        description: Optional Memcached package version.
      memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory allocation in megabytes.
      memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum number of Memcached connections.
      memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Optional Memcached experimental options.
      memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: Optional additional Memcached command-line options.
      memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file descriptor limit.
      memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log path.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks handling Redis credentials.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: Redis TCP port.
      cache_redis_pid_dir:
        type: str
        required: false
        default: /run/redis
        description: Redis PID directory.
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration file path.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
