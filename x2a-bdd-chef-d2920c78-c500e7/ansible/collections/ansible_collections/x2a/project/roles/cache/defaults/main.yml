---
memcached_version:
memcached_memory: 64
memcached_port: 11211
memcached_udp_port: 11211
memcached_listen: 0.0.0.0
memcached_maxconn: 1024
memcached_max_object_size: 1m
memcached_experimental_options: []
memcached_extra_cli_options: []
memcached_ulimit: 1024
memcached_logfilepath: /var/log/memcached
cache_secure_logging: true
cache_redis_port: 6379
cache_redis_pid_dir: /run/redis
cache_redis_log_dir: /var/log/redis
cache_redis_config_file: /etc/redis/6379.conf
