---
- name: Check if Chef Server admin user already exists
  ansible.builtin.command:
    cmd: chef-server-ctl user-list
  become: true
  register: user_list
  changed_when: false
  no_log: true
- name: Create Chef Server admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ chef_server_user_key_path }}
  become: true
  register: create_user_result
  changed_when: create_user_result.rc == 0
  no_log: true
  when: username not in user_list.stdout
- name: Check if Chef Server organization already exists
  ansible.builtin.command:
    cmd: chef-server-ctl org-list
  become: true
  register: org_list
  changed_when: false
- name: Create Chef Server organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_server_org_name }} "{{ chef_server_org_long_name }}" --association_user {{ username }} --filename {{
      chef_server_org_key_path }}
  become: true
  register: create_org_result
  changed_when: create_org_result.rc == 0
  when: chef_server_org_name not in org_list.stdout
