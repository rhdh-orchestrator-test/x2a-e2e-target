---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/sysctl.d
        - /tmp/molecule_test/usr/local/bin

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: |
          # Chef Automate kernel parameters
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI binary
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI v1.0.0"
          echo "This is a simulated Chef Automate CLI for molecule testing"
        dest: "/tmp/molecule_test/usr/local/bin/chef-automate"
        mode: "0755"

    # Simulate Chef Server CLI
    - name: Create Chef Server CLI binary
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Server CLI v1.0.0"
          echo "This is a simulated Chef Server CLI for molecule testing"
        dest: "/tmp/molecule_test/usr/local/bin/chef-server-ctl"
        mode: "0755"

    # Simulate user and organization PEM files
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          ... simulated PEM content ...
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/jtonello.pem"
        mode: "0600"

    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          ... simulated PEM content ...
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/lab-validator.pem"
        mode: "0600"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          chef-automate status
          Service: automate-gateway
          Status: running
          Service: automate-ui
          Status: running
          Service: chef-server
          Status: running
        dest: "/tmp/molecule_test/automate-status.txt"
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          chef-server-ctl status
          run: postgresql-9.6: (pid 12345) 99s; run: log: (pid 12346) 99s
          run: nginx: (pid 12347) 99s; run: log: (pid 12348) 99s
          run: bookshelf: (pid 12349) 99s; run: log: (pid 12350) 99s
          run: oc_bifrost: (pid 12351) 99s; run: log: (pid 12352) 99s
          run: oc_id: (pid 12353) 99s; run: log: (pid 12354) 99s
          run: opscode-erchef: (pid 12355) 99s; run: log: (pid 12356) 99s
        dest: "/tmp/molecule_test/chef-server-status.txt"
        mode: "0644"

    # Simulate user and organization list outputs
    - name: Create user list file
      ansible.builtin.copy:
        content: "jtonello"
        dest: "/tmp/molecule_test/user-list.txt"
        mode: "0644"

    - name: Create organization list file
      ansible.builtin.copy:
        content: "lab"
        dest: "/tmp/molecule_test/org-list.txt"
        mode: "0644"