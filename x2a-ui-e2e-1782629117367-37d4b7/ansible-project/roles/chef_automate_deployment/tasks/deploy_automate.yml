---
- name: Check if Chef Automate is already deployed
  ansible.builtin.stat:
    path: /hab/sup/default/data
  register: chef_automate_deployed
  become: true
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: "./chef-automate deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{ chef_automate_accept_terms
      | lower }} "
    creates: /hab/sup/default/data
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
  async: 3600
  poll: 30
  when: not chef_automate_deployed.stat.exists
