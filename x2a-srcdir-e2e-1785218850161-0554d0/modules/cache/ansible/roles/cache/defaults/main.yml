---
redis_install_method: package
redis_port: 6379
redis_bind: 127.0.0.1
redis_maxmemory_policy: allkeys-lru
redis_rdb_enabled: true
redis_package_name: "{{ 'redis-server' if ansible_os_family == 'Debian' else 'redis' }}"
redis_service_name: "{{ 'redis-server' if ansible_os_family == 'Debian' else 'redis' }}"
