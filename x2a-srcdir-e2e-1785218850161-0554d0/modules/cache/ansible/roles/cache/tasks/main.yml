---
- name: Include Redis role from eloy.redis collection
  ansible.builtin.include_role:
    name: eloy.redis.redis
  vars:
    redis_port: "{{ redis_port }}"
    redis_bind: "{{ redis_bind }}"
    redis_install_method: "{{ redis_install_method }}"
    redis_maxmemory_policy: "{{ redis_maxmemory_policy }}"
    redis_rdb_enabled: "{{ redis_rdb_enabled }}"
    redis_package_name: "{{ redis_package_name }}"
    redis_service_name: "{{ redis_service_name }}"
