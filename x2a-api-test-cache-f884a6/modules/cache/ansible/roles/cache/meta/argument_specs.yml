---
argument_specs:
  main:
    short_description: Install and configure Redis and Memcached cache services
    description:
      - Installs and configures Redis server with password authentication
      - Installs and configures Memcached service
      - Creates Redis log directory with proper permissions
      - Removes replica-related settings from Redis configuration
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for Redis server to listen on
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory path for Redis log files
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to Redis configuration file
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: System user for Redis service
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: System group for Redis service
      cache_memcached_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and enable Memcached service
      cache_redis_replica_settings_to_remove:
        type: list
        elements: str
        required: false
        default:
          - replica-serve-stale-data
          - replica-read-only
          - repl-ping-replica-period
          - client-output-buffer-limit
          - replica-priority
        description: List of Redis replica configuration settings to remove from config file
      redis_password:
        type: str
        required: true
        description: Redis authentication password (injected by AAP credential type)
