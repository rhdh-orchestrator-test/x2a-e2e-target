---
controller_credential_types:
- name: Redis Authentication Password
  description: Redis server authentication password for client connections
  kind: cloud
  inputs:
    fields:
    - id: redis_password
      type: string
      label: Redis Password
      secret: true
      help_text: Password for Redis server authentication (requirepass setting)
    required:
    - redis_password
  injectors:
    extra_vars:
      redis_password: !unsafe '{{ redis_password }}'
