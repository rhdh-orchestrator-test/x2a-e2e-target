---
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Fail if chef-server-ctl is not available
  ansible.builtin.fail:
    msg: chef-server-ctl command not found. Ensure Chef Infra Server is properly installed.
  when: chef_server_ctl_check.rc != 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_username }} "{{ chef_longusername }}" {{ chef_useremail }} "{{ password }}" --filename {{ chef_userfilename }}
    creates: "{{ chef_userfilename }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_orgname }} "{{ chef_longorgname }}" --association_user {{ chef_username }} --filename {{ chef_orgfilename }}
    creates: "{{ chef_orgfilename }}"
  become: true
