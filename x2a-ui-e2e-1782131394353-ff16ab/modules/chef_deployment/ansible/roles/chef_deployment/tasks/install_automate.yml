---
- name: Check if Chef Automate is already installed
  ansible.builtin.stat:
    path: /hab
  register: hab_dir
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
  register: download_result
  when: not hab_dir.stat.exists
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > chef-automate
    stdin: "{{ download_result.dest }}"
    chdir: /tmp
    creates: /tmp/chef-automate
  when: download_result is defined and download_result.changed
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: /tmp/chef-automate
    mode: "0755"
    state: file
  when: not hab_dir.stat.exists
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_accept_terms_and_mlsa | lower }}
    chdir: /tmp
    creates: /hab
  become: true
  when: chef_deploy_automate and chef_deploy_infra_server and not hab_dir.stat.exists
