---
controller_credential_types:
- name: Chef User Password
  description: Credential type for Chef User Password
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for the Chef user account
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef user account
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
