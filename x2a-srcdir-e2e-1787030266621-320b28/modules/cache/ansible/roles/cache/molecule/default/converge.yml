- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Simulate redis-server package installation
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/bin/redis-server
      state: directory
      mode: '0755'
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/run/redis
  - name: Create expected config file
    ansible.builtin.copy:
      content: '# Redis configuration file example

        # Note: This is a simplified version for testing


        # Network

        bind 127.0.0.1

        port 6379


        # General

        daemonize yes

        pidfile /var/run/redis/redis-server.pid

        logfile /var/log/redis/redis-server.log


        # Memory management

        maxmemory 256mb

        maxmemory-policy volatile-lru

        '
      dest: /tmp/molecule_test/etc/redis/redis.conf
      mode: '0644'
  - name: Create log file
    ansible.builtin.copy:
      content: '# Redis server log file '
      dest: /tmp/molecule_test/var/log/redis/redis-server.log
      mode: '0644'
  - name: Create socket file placeholder
    ansible.builtin.copy:
      content: ''
      dest: /tmp/molecule_test/var/run/redis/redis-server.sock
      mode: '0644'
  - name: Create service status file
    ansible.builtin.copy:
      content: active
      dest: /tmp/molecule_test/var/run/redis/redis-server.status
      mode: '0644'
