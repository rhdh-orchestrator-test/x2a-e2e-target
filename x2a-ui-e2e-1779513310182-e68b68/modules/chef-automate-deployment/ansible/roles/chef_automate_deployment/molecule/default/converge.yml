---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/ansible
        - /tmp/molecule_test/tmp

    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname | default('automate.chef.lab') }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/sh\necho 'Chef Automate CLI Mock'\necho 'Version: 20230101'\n"
        dest: /tmp/molecule_test/tmp/chef-automate
        mode: "0755"

    - name: Create user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAzMOKchwJ1yf9OsQ9Q9jL7KYlQ6cxVVVoaXfXx/Y7zX3q2Sax
          HEY+UJ4MU3Fs6F8RdVRXEeee6Qd5QBrLnBU/Hm2gkEe6Yl5cQgMKvpwYIQKDHJvn
          KcbDX3O3OjjCUofVU8eiGJj+wXZX+qYhAMPzUyB+bjgHCSQuJJ6D/9tBhyszFZcB
          MOCK_KEY_CONTENT_FOR_MOLECULE_TEST
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/home/ansible/{{ chef_automate_username | default('admin') }}.pem
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAzMOKchwJ1yf9OsQ9Q9jL7KYlQ6cxVVVoaXfXx/Y7zX3q2Sax
          HEY+UJ4MU3Fs6F8RdVRXEeee6Qd5QBrLnBU/Hm2gkEe6Yl5cQgMKvpwYIQKDHJvn
          KcbDX3O3OjjCUofVU8eiGJj+wXZX+qYhAMPzUyB+bjgHCSQuJJ6D/9tBhyszFZcB
          MOCK_ORG_KEY_CONTENT_FOR_MOLECULE_TEST
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/home/ansible/{{ chef_automate_org_name | default('default') }}-validator.pem
        mode: "0600"

    - name: Create sysctl settings file for vm.max_map_count
      ansible.builtin.copy:
        content: "vm.max_map_count = {{ chef_automate_vm_max_map_count | default(262144) }}"
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-max-map-count.conf
        mode: "0644"

    - name: Create sysctl settings file for vm.dirty_expire_centisecs
      ansible.builtin.copy:
        content: "vm.dirty_expire_centisecs = {{ chef_automate_vm_dirty_expire_centisecs | default(20000) }}"
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-dirty-expire-centisecs.conf
        mode: "0644"

    - name: Create mock Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-cs-bookshelf - running
          Service: automate-cs-oc-bifrost - running
          Service: automate-cs-oc-erchef - running
          Service: automate-cs-nginx - running
          Service: automate-gateway - running
          Service: automate-postgresql - running
          Service: automate-elasticsearch - running
          Service: automate-ui - running
        dest: /tmp/molecule_test/hab/chef-automate-status.txt
        mode: "0644"

    - name: Create mock Chef Server user list
      ansible.builtin.copy:
        content: "{{ chef_automate_username | default('admin') }}"
        dest: /tmp/molecule_test/hab/chef-server-user-list.txt
        mode: "0644"

    - name: Create mock Chef Server org list
      ansible.builtin.copy:
        content: "{{ chef_automate_org_name | default('default') }}"
        dest: /tmp/molecule_test/hab/chef-server-org-list.txt
        mode: "0644"