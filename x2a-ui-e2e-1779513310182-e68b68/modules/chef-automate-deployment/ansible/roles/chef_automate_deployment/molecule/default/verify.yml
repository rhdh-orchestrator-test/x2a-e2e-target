---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists and has content
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found or empty"
        success_msg: "Hostname file exists and has content"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_content is defined

    # Kernel parameter checks
    - name: Check vm.max_map_count sysctl file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-max-map-count.conf
      register: max_map_count_file

    - name: Assert vm.max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
        fail_msg: "vm.max_map_count sysctl file not found"
        success_msg: "vm.max_map_count sysctl file exists"

    - name: Get vm.max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-max-map-count.conf
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - max_map_count_content.content | b64decode | regex_search('262144')
        fail_msg: "vm.max_map_count is not set correctly"
        success_msg: "vm.max_map_count is set correctly"
      when: max_map_count_content is defined

    - name: Check vm.dirty_expire_centisecs sysctl file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-dirty-expire-centisecs.conf
      register: dirty_expire_file

    - name: Assert vm.dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_file.stat.exists
        fail_msg: "vm.dirty_expire_centisecs sysctl file not found"
        success_msg: "vm.dirty_expire_centisecs sysctl file exists"

    - name: Get vm.dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-dirty-expire-centisecs.conf
      register: dirty_expire_content
      when: dirty_expire_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - dirty_expire_content.content | b64decode | regex_search('20000')
        fail_msg: "vm.dirty_expire_centisecs is not set correctly"
        success_msg: "vm.dirty_expire_centisecs is set correctly"
      when: dirty_expire_content is defined

    # Chef Automate CLI check
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # User and organization key files check
    - name: Check user key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/admin.pem
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.size > 0
        fail_msg: "User key file not found or empty"
        success_msg: "User key file exists"

    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/default-validator.pem
      register: org_key_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.size > 0
        fail_msg: "Organization validator key file not found or empty"
        success_msg: "Organization validator key file exists"

    # Chef Automate status check
    - name: Check Chef Automate status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-automate-status.txt
      register: chef_automate_status_file

    - name: Assert Chef Automate status file exists
      ansible.builtin.assert:
        that:
          - chef_automate_status_file.stat.exists
        fail_msg: "Chef Automate status file not found"
        success_msg: "Chef Automate status file exists"

    # Chef Server user and organization list checks
    - name: Check Chef Server user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-user-list.txt
      register: chef_server_user_list_file

    - name: Assert Chef Server user list file exists
      ansible.builtin.assert:
        that:
          - chef_server_user_list_file.stat.exists
        fail_msg: "Chef Server user list file not found"
        success_msg: "Chef Server user list file exists"

    - name: Get Chef Server user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-server-user-list.txt
      register: chef_server_user_list_content
      when: chef_server_user_list_file.stat.exists

    - name: Assert user exists in Chef Server user list
      ansible.builtin.assert:
        that:
          - (chef_server_user_list_content.content | b64decode | trim) == 'admin'
        fail_msg: "User not found in Chef Server user list"
        success_msg: "User found in Chef Server user list"
      when: chef_server_user_list_content is defined

    - name: Check Chef Server org list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-org-list.txt
      register: chef_server_org_list_file

    - name: Assert Chef Server org list file exists
      ansible.builtin.assert:
        that:
          - chef_server_org_list_file.stat.exists
        fail_msg: "Chef Server org list file not found"
        success_msg: "Chef Server org list file exists"

    - name: Get Chef Server org list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-server-org-list.txt
      register: chef_server_org_list_content
      when: chef_server_org_list_file.stat.exists

    - name: Assert organization exists in Chef Server org list
      ansible.builtin.assert:
        that:
          - (chef_server_org_list_content.content | b64decode | trim) == 'default'
        fail_msg: "Organization not found in Chef Server org list"
        success_msg: "Organization found in Chef Server org list"
      when: chef_server_org_list_content is defined

    # Service status checks (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: chef_automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate services are running
      ansible.builtin.assert:
        that:
          - "'running' in chef_automate_status.stdout"
        fail_msg: "Chef Automate services are not running"
        success_msg: "Chef Automate services are running"
      when: chef_automate_status.rc == 0
      tags: molecule-notest

    - name: Check Chef Infra Server service status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server services are running
      ansible.builtin.assert:
        that:
          - "'run' in chef_server_status.stdout"
        fail_msg: "Chef Infra Server services are not running"
        success_msg: "Chef Infra Server services are running"
      when: chef_server_status.rc == 0
      tags: molecule-notest

    # Network port checks (tagged for skipping in container)
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # API health checks (tagged for skipping in container)
    - name: Check Chef Automate API health
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
        status_code: 200
      register: api_health
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate API is healthy
      ansible.builtin.assert:
        that:
          - api_health is succeeded
        fail_msg: "Chef Automate API is not healthy"
        success_msg: "Chef Automate API is healthy"
      tags: molecule-notest