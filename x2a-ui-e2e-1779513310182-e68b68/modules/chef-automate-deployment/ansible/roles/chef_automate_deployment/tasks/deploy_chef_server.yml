---
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | ternary('true', 'false') }}
    creates: /hab
  become: true
  register: chef_server_deploy_result
- name: Display Chef Infra Server deployment result
  ansible.builtin.debug:
    var: chef_server_deploy_result.stdout_lines
  when: chef_server_deploy_result.stdout_lines is defined
