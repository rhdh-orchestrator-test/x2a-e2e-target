---
- name: Ensure key directory exists
  ansible.builtin.file:
    path: "{{ chef_automate_user_key_path | dirname | regex_replace('^~', ansible_env.HOME) }}"
    state: directory
    mode: "0755"
  become: false
- name: Create Chef user
  ansible.builtin.command:
    cmd: "chef-server-ctl user-create  {{ chef_automate_username }}  {{ chef_automate_user_fullname | quote }}  {{ chef_automate_user_email | quote }}  {{ chef_automate_user_password
      | quote }}  --filename {{ chef_automate_user_key_path | regex_replace('^~', ansible_env.HOME) }} "
    creates: "{{ chef_automate_user_key_path | regex_replace('^~', ansible_env.HOME) }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: "chef-server-ctl org-create  {{ chef_automate_org_name }}  {{ chef_automate_org_fullname | quote }}  --association_user {{ chef_automate_username }}  --filename
      {{ chef_automate_org_key_path | regex_replace('^~', ansible_env.HOME) }} "
    creates: "{{ chef_automate_org_key_path | regex_replace('^~', ansible_env.HOME) }}"
  become: true
