---
- name: Deploy Chef Automate with Chef Infra Server
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | ternary('true', 'false') }}
    creates: /hab
  become: true
  register: chef_automate_deploy_result
- name: Display Chef Automate deployment result
  ansible.builtin.debug:
    var: chef_automate_deploy_result.stdout_lines
  when: chef_automate_deploy_result.stdout_lines is defined
