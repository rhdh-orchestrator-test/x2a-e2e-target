---
controller_credential_types:
- name: Chef User Password
  description: Credentials for the initial Chef administrator user
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for the initial Chef user account
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the initial Chef user account
    - id: email
      type: string
      label: Email
      help_text: Email address for the Chef user account
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name for the Chef user account
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
      full_name: !unsafe '{{ full_name }}'
- name: Chef Organization
  description: Organization details for Chef Infra Server
  kind: cloud
  inputs:
    fields:
    - id: organization_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: organization_full_name
      type: string
      label: Organization Full Name
      help_text: Full name for the Chef organization
    required:
    - organization_name
  injectors:
    extra_vars:
      organization_name: !unsafe '{{ organization_name }}'
      organization_full_name: !unsafe '{{ organization_full_name }}'
- name: Chef Server Configuration
  description: System configuration for Chef server deployment
  kind: cloud
  inputs:
    fields:
    - id: hostname
      type: string
      label: Hostname
      help_text: Hostname for the Chef Automate and Chef Infra Server
    required:
    - hostname
  injectors:
    extra_vars:
      hostname: !unsafe '{{ hostname }}'
