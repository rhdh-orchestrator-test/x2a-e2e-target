---
# This role is a wrapper for the eloy.redis.redis collection role
# In a normal environment, you would include the role like this:
# - name: Include Redis role from eloy.redis collection
#   ansible.builtin.include_role:
#     name: eloy.redis.redis
#   vars:
#     redis_port: 6379
#     redis_bind: 127.0.0.1
#
# For molecule testing, the converge.yml file simulates the Redis installation
# by creating the expected directory structure and configuration files.