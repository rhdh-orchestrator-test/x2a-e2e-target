---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Kernel parameter checks
    - name: Check max_map_count file
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_file

    - name: Assert max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
          - max_map_count_file.stat.isreg
        fail_msg: "max_map_count file not found"
        success_msg: "max_map_count file exists"

    - name: Get max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "262144"
        fail_msg: "max_map_count not set correctly"
        success_msg: "max_map_count set correctly"
      when: max_map_count_file.stat.exists

    - name: Check dirty_expire_centisecs file
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_file

    - name: Assert dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_centisecs_file.stat.exists
          - dirty_expire_centisecs_file.stat.isreg
        fail_msg: "dirty_expire_centisecs file not found"
        success_msg: "dirty_expire_centisecs file exists"

    - name: Get dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_content
      when: dirty_expire_centisecs_file.stat.exists

    - name: Assert dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
        fail_msg: "dirty_expire_centisecs not set correctly"
        success_msg: "dirty_expire_centisecs set correctly"
      when: dirty_expire_centisecs_file.stat.exists

    # Chef Automate CLI check
    - name: Check Chef Automate CLI file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate deployment check
    - name: Check Chef Automate deployment marker
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: hab_dir

    - name: Assert Chef Automate was deployed
      ansible.builtin.assert:
        that:
          - hab_dir.stat.exists
          - hab_dir.stat.isdir
        fail_msg: "Chef Automate deployment marker not found"
        success_msg: "Chef Automate deployment marker exists"

    # User key file check
    - name: Check user key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/jtonello.pem
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.isreg
          - user_key_file.stat.mode == "0600"
        fail_msg: "User key file not found or incorrect permissions"
        success_msg: "User key file exists with correct permissions"

    # Organization validator key file check
    - name: Check organization validator key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/lab-validator.pem
      register: org_key_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.isreg
          - org_key_file.stat.mode == "0600"
        fail_msg: "Organization validator key file not found or incorrect permissions"
        success_msg: "Organization validator key file exists with correct permissions"

    # Chef Automate status check
    - name: Check Chef Automate status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate services are running
      ansible.builtin.assert:
        that:
          - "'automate-cs-bookshelf.service' in ansible_facts.services"
          - "'automate-cs-oc-bifrost.service' in ansible_facts.services"
          - "'automate-cs-oc-erchef.service' in ansible_facts.services"
          - "'automate-cs-nginx.service' in ansible_facts.services"
          - "'automate-postgresql.service' in ansible_facts.services"
        fail_msg: "Chef Automate services not running"
        success_msg: "Chef Automate services running"
      tags: molecule-notest

    # Chef Infra Server status check
    - name: Check Chef Infra Server status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Infra Server services are running
      ansible.builtin.assert:
        that:
          - "'chef-server-nginx.service' in ansible_facts.services"
          - "'chef-server-postgresql.service' in ansible_facts.services"
        fail_msg: "Chef Infra Server services not running"
        success_msg: "Chef Infra Server services running"
      tags: molecule-notest

    # Network listening check
    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      tags: molecule-notest

    # Web UI access check
    - name: Check Chef Automate API health
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
        status_code: 200
      tags: molecule-notest