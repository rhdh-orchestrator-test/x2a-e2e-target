---
- name: Set hostname for Chef Automate server
  ansible.builtin.hostname:
    name: "{{ automate_hostname }}"
  become: true
- name: Configure kernel parameters for Chef Automate
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ automate_kernel_params }}"
  become: true
