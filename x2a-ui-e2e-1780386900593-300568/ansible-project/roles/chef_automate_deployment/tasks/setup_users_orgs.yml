- name: Check if chef-server-ctl exists
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ user_key_path }}

      '
  args:
    creates: '{{ user_key_path }}'
  become: true
  when: chef_server_ctl.stat.exists
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ org_name }} "{{ org_full_name }}" --association_user {{ username }} --filename {{ org_key_path }}

      '
  args:
    creates: '{{ org_key_path }}'
  become: true
  when: chef_server_ctl.stat.exists
