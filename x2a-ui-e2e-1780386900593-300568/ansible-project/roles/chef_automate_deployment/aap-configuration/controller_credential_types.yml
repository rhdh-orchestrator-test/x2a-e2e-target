---
controller_credential_types:
- name: Chef User Authentication
  description: Credential type for Chef User Authentication
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef user account username
    - id: full_name
      type: string
      label: Full Name
      help_text: Chef user's full name
    - id: email
      type: string
      label: Email
      help_text: Chef user's email address
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef user account
    required:
    - username
    - full_name
    - email
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
      password: !unsafe '{{ password }}'
- name: Chef Organization
  description: Credential type for Chef Organization
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name for the Chef organization
    required:
    - org_name
    - org_full_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
