---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/ansible

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate kernel parameters
    - name: Create kernel parameter files
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "/tmp/molecule_test/proc/sys/vm/{{ item.name | regex_replace('^vm\\.', '') }}"
        mode: "0644"
      loop:
        - name: vm.max_map_count
          value: "262144"
        - name: vm.dirty_expire_centisecs
          value: "20000"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.file:
        path: "/tmp/molecule_test/hab"
        state: directory
        mode: "0755"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY CONTENT\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/home/ansible/jtonello.pem"
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORG VALIDATOR KEY CONTENT\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/home/ansible/lab-validator.pem"
        mode: "0600"

    # Simulate Chef server status output
    - name: Create Chef server status file
      ansible.builtin.copy:
        content: |
          run: postgresql: running
          run: bookshelf: running
          run: oc_bifrost: running
          run: oc_id: running
          run: opscode-erchef: running
          run: nginx: running
          run: opscode-solr4: running
        dest: "/tmp/molecule_test/chef-server-status"
        mode: "0644"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-cs-bookshelf                    Status: running
          Service: automate-cs-oc-bifrost                   Status: running
          Service: automate-cs-oc-erchef                    Status: running
          Service: automate-cs-nginx                        Status: running
          Service: automate-postgresql                      Status: running
        dest: "/tmp/molecule_test/chef-automate-status"
        mode: "0644"

    # Simulate user list output
    - name: Create user list file
      ansible.builtin.copy:
        content: "jtonello\n"
        dest: "/tmp/molecule_test/chef-user-list"
        mode: "0644"

    # Simulate user show output
    - name: Create user show file
      ansible.builtin.copy:
        content: |
          username: jtonello
          display_name: John Tonello
          email: jtonello@chef.lab
          first_name: John
          last_name: Tonello
        dest: "/tmp/molecule_test/chef-user-show"
        mode: "0644"

    # Simulate organization list output
    - name: Create organization list file
      ansible.builtin.copy:
        content: "lab\n"
        dest: "/tmp/molecule_test/chef-org-list"
        mode: "0644"

    # Simulate organization show output
    - name: Create organization show file
      ansible.builtin.copy:
        content: |
          name: lab
          full_name: Chef Lab
          guid: abcdef1234567890
        dest: "/tmp/molecule_test/chef-org-show"
        mode: "0644"

    # Simulate network listening output
    - name: Create network listening file
      ansible.builtin.copy:
        content: |
          tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/nginx
        dest: "/tmp/molecule_test/netstat-output"
        mode: "0644"

    # Simulate health API response
    - name: Create health API response file
      ansible.builtin.copy:
        content: |
          {"status":"ok","service_status":[{"service":"automate-postgresql","status":"OK"}]}
        dest: "/tmp/molecule_test/health-api-response"
        mode: "0644"