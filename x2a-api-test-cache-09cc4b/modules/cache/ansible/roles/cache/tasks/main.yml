---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install memcached package
  ansible.builtin.package:
    name: memcached
    state: present
- name: Install Redis server package
  ansible.builtin.package:
    name: redis-server
    state: present
- name: Ensure redis user exists
  ansible.builtin.user:
    name: redis
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present
- name: Ensure redis group exists
  ansible.builtin.group:
    name: redis
    system: true
    state: present
- name: Create Redis configuration directory
  ansible.builtin.file:
    path: /etc/redis
    owner: root
    group: root
    mode: "0755"
    state: directory
- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    owner: redis
    group: redis
    mode: "0755"
    state: directory
    recurse: true
- name: Create Redis data directory
  ansible.builtin.file:
    path: "{{ cache_redis_dir }}"
    owner: redis
    group: redis
    mode: "0755"
    state: directory
    recurse: true
- name: Create Redis PID directory
  ansible.builtin.file:
    path: /var/run/redis
    owner: redis
    group: redis
    mode: "0755"
    state: directory
    recurse: true
- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/6379.conf
    owner: redis
    group: redis
    mode: "0640"
    backup: true
  notify: Restart redis-server
- name: Remove deprecated Redis replica settings
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: "{{ item_cache }}"
    state: absent
  loop:
    - ^replica-serve-stale-data.*$
    - ^replica-read-only.*$
    - ^repl-ping-replica-period.*$
    - ^client-output-buffer-limit.*$
    - ^replica-priority.*$
  loop_control:
    loop_var: item_cache
  notify: Restart redis-server
- name: Start and enable memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
- name: Start and enable Redis server service
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
