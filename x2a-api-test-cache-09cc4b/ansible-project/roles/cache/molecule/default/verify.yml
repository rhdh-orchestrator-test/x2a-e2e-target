---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    redis_password: redis_secure_password_123
  tasks:
    - name: Check service status
      ansible.builtin.service_facts:

    - name: Assert memcached service is running
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - "ansible_facts.services['memcached.service']['state'] == 'running'"
        fail_msg: "Memcached service is not running"

    - name: Assert Redis server service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
        fail_msg: "Redis server service is not running"

    - name: Check memcached port is listening
      ansible.builtin.wait_for:
        port: 11211
        host: 127.0.0.1
        timeout: 10

    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 10

    - name: Check Redis log directory exists
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory was created
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['exists']
          - redis_log_dir_stat['stat']['isdir']
          - redis_log_dir_stat['stat']['pw_name'] == 'redis'
          - redis_log_dir_stat['stat']['gr_name'] == 'redis'
          - redis_log_dir_stat['stat']['mode'] == '0755'
        fail_msg: "Redis log directory not properly configured"

    - name: Check Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_stat

    - name: Assert Redis configuration file was created
      ansible.builtin.assert:
        that:
          - redis_config_stat['stat']['exists']
          - redis_config_stat['stat']['size'] > 0
          - redis_config_stat['stat']['pw_name'] == 'redis'
          - redis_config_stat['stat']['gr_name'] == 'redis'
        fail_msg: "Redis configuration file not found or improperly configured"

    - name: Read Redis configuration file
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis password authentication is configured
      ansible.builtin.assert:
        that:
          - "'requirepass' in (redis_config_content['content'] | b64decode)"
        fail_msg: "Redis password authentication not configured"

    - name: Assert deprecated Redis replica settings are removed
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in (redis_config_content['content'] | b64decode)"
          - "'replica-read-only' not in (redis_config_content['content'] | b64decode)"
          - "'repl-ping-replica-period' not in (redis_config_content['content'] | b64decode)"
          - "'client-output-buffer-limit' not in (redis_config_content['content'] | b64decode)"
          - "'replica-priority' not in (redis_config_content['content'] | b64decode)"
        fail_msg: "Deprecated Redis replica settings still present in configuration"

- name: Verify Redis connectivity and authentication
  hosts: all
  gather_facts: false
  vars:
    redis_password: redis_secure_password_123
  tasks:
    - name: Test Redis authentication with correct password
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a {{ redis_password }} ping
      register: redis_auth_test
      changed_when: false

    - name: Assert Redis authentication works
      ansible.builtin.assert:
        that:
          - redis_auth_test['stdout'] == 'PONG'
        fail_msg: "Redis authentication failed"

    - name: Test Redis basic operations
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a {{ redis_password }} {{ item_redis_cmd }}
      loop:
        - "set test_key test_value"
        - "get test_key"
        - "del test_key"
      loop_control:
        loop_var: item_redis_cmd
      register: redis_ops_results
      changed_when: false

    - name: Assert Redis operations work correctly
      ansible.builtin.assert:
        that:
          - redis_ops_results['results'][0]['stdout'] == 'OK'
          - redis_ops_results['results'][1]['stdout'] == 'test_value'
          - redis_ops_results['results'][2]['stdout'] == '1'
        fail_msg: "Redis basic operations failed"

- name: Verify memcached connectivity
  hosts: all
  gather_facts: false
  tasks:
    - name: Test memcached connectivity
      ansible.builtin.command: |
        bash -c 'echo "stats" | nc localhost 11211'
      register: memcached_stats
      changed_when: false

    - name: Assert memcached is responding
      ansible.builtin.assert:
        that:
          - "'STAT' in memcached_stats['stdout']"
        fail_msg: "Memcached is not responding to stats command"

    - name: Test memcached basic operations
      ansible.builtin.shell: |
        echo -e "set test_key 0 60 10\r\ntest_value\r\nget test_key\r\nquit\r" | nc localhost 11211
      register: memcached_ops
      changed_when: false

    - name: Assert memcached operations work
      ansible.builtin.assert:
        that:
          - "'STORED' in memcached_ops['stdout']"
          - "'test_value' in memcached_ops['stdout']"
        fail_msg: "Memcached basic operations failed"