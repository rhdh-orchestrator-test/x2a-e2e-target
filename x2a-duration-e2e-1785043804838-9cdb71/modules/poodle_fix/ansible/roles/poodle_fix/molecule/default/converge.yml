- name: Converge
  hosts: all
  gather_facts: true
  vars:
    apache_ssl_config_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    ssl_protocol_setting: -all +TLSv1.2
  tasks:
  - name: Create directory structure for Apache SSL config
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create mock Apache SSL config file with default SSLProtocol setting
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        SSLEngine on

        SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem

        SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

        SSLProtocol all -SSLv3

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Mock package installation (Apache)
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/sbin/apache2
      state: touch
      mode: '0755'
  - name: Mock package installation (SSH)
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/sbin/sshd
      state: touch
      mode: '0755'
  - name: Fix SSL in Apache (from role)
    ansible.builtin.replace:
      dest: '{{ apache_ssl_config_path }}'
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol {{ ssl_protocol_setting }}
