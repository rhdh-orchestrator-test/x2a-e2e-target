---
- name: Restart memcached
  ansible.builtin.service:
    name: memcached
    state: restarted
- name: Restart redis
  ansible.builtin.service:
    name: "{{ 'redis-server' if ansible_os_family == 'Debian' else 'redis' }}"
    state: restarted
- name: Reload redis
  ansible.builtin.service:
    name: "{{ 'redis-server' if ansible_os_family == 'Debian' else 'redis' }}"
    state: reloaded
