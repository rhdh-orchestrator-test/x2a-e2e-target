---
cache_memcached_port: 11211
cache_memcached_memory: 64
cache_memcached_user: memcache
cache_redis_port: 6379
cache_redis_log_dir: /var/log/redis
cache_redis_config_file: /etc/redis/6379.conf
cache_redis_user: redis
cache_redis_group: redis
cache_redis_password: "{{ redis_password }}"
cache_memcached_package: "{{ _cache_memcached_package }}"
cache_redis_package: "{{ _cache_redis_package }}"
_cache_memcached_package: "{{ 'memcached' if ansible_os_family == 'Debian' else 'memcached' }}"
_cache_redis_package: "{{ 'redis-server' if ansible_os_family == 'Debian' else 'redis' }}"
