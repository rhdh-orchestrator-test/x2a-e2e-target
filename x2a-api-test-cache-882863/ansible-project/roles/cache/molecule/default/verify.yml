---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check service status
      ansible.builtin.service_facts:

    - name: Assert memcached service is running
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - "ansible_facts.services['memcached.service']['state'] == 'running'"
        fail_msg: "Memcached service is not running"

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
        fail_msg: "Redis service is not running"

    - name: Check memcached port is listening
      ansible.builtin.wait_for:
        port: 11211
        host: localhost
        timeout: 10

    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: localhost
        timeout: 10

    - name: Check Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_stat

    - name: Assert Redis config file exists
      ansible.builtin.assert:
        that:
          - redis_config_stat['stat']['exists']
          - redis_config_stat['stat']['size'] > 0
        fail_msg: "Redis configuration file not found"

    - name: Check Redis log directory exists
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory exists with correct ownership
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['exists']
          - redis_log_dir_stat['stat']['isdir']
          - redis_log_dir_stat['stat']['pw_name'] == 'redis'
          - redis_log_dir_stat['stat']['gr_name'] == 'redis'
        fail_msg: "Redis log directory not found or incorrect ownership"

    - name: Read Redis configuration file
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis configuration contains requirepass
      ansible.builtin.assert:
        that:
          - "'requirepass' in (redis_config_content['content'] | b64decode)"
        fail_msg: "Redis configuration missing requirepass setting"

    - name: Assert replica settings are removed from Redis config
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in (redis_config_content['content'] | b64decode)"
          - "'replica-read-only' not in (redis_config_content['content'] | b64decode)"
          - "'repl-ping-replica-period' not in (redis_config_content['content'] | b64decode)"
          - "'client-output-buffer-limit' not in (redis_config_content['content'] | b64decode)"
          - "'replica-priority' not in (redis_config_content['content'] | b64decode)"
        fail_msg: "Redis configuration still contains replica settings that should be removed"

    - name: Test memcached connectivity
      ansible.builtin.command:
        cmd: echo "stats"
        stdin: true
      register: memcached_stats
      changed_when: false
      failed_when: false

    - name: Test Redis connectivity with authentication
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 ping
      register: redis_ping
      changed_when: false
      failed_when: false

    - name: Assert Redis responds to ping
      ansible.builtin.assert:
        that:
          - redis_ping['rc'] == 0
          - "'PONG' in redis_ping['stdout']"
        fail_msg: "Redis authentication or connectivity failed"

    - name: Test Redis set/get operations
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 set test_key "test_value"
      register: redis_set
      changed_when: false
      failed_when: false

    - name: Test Redis get operation
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 get test_key
      register: redis_get
      changed_when: false
      failed_when: false

    - name: Assert Redis set/get operations work
      ansible.builtin.assert:
        that:
          - redis_set['rc'] == 0
          - redis_get['rc'] == 0
          - "'test_value' in redis_get['stdout']"
        fail_msg: "Redis set/get operations failed"