---
- name: Wait for Chef Server to be ready
  ansible.builtin.command:
    cmd: chef-server-ctl status
  become: true
  register: chef_server_status
  until: chef_server_status.rc == 0
  retries: 10
  delay: 30
  changed_when: false
  when: "'infra-server' in chef_automate_products"
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_userfilename }}"
    - "{{ chef_automate_orgfilename }}"
  when: item | dirname != '.'
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_automate_username }} {{ chef_automate_longusername }} {{ chef_automate_useremail }} "{{ chef_automate_userpassword }}"
      --filename {{ chef_automate_userfilename }}

      '
  become: true
  args:
    creates: "{{ chef_automate_userfilename }}"
  register: user_create_result
  changed_when: user_create_result.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_orgname }} "{{ chef_automate_longorgname }}" --association_user {{ chef_automate_username }} --filename {{ chef_automate_orgfilename
      }}

      '
  become: true
  args:
    creates: "{{ chef_automate_orgfilename }}"
  register: org_create_result
  changed_when: org_create_result.rc == 0
