---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/usr/bin

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname | default('automate.chef.lab') }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl settings
    - name: Create sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = {{ chef_automate_vm_max_map_count | default(262144) }}
          vm.dirty_expire_centisecs = {{ chef_automate_vm_dirty_expire_centisecs | default(20000) }}
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/sh\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/usr/bin/chef-automate"
        mode: "0755"

    # Simulate Chef Server CLI
    - name: Create Chef Server CLI file
      ansible.builtin.copy:
        content: "#!/bin/sh\necho 'Chef Server CLI mock'\n"
        dest: "/tmp/molecule_test/usr/bin/chef-server-ctl"
        mode: "0755"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/{{ chef_automate_userfilename | default('jtonello.pem') }}"
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORGANIZATION VALIDATOR KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/{{ chef_automate_orgfilename | default('lab-validator.pem') }}"
        mode: "0600"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-gateway
            Status: running
          Service: automate-postgresql
            Status: running
          Service: automate-elasticsearch
            Status: running
          Service: chef-server
            Status: running
        dest: "/tmp/molecule_test/automate-status.txt"
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          run: bookshelf: (pid 12345) 1234s; run: log: (pid 12346) 1234s
          run: nginx: (pid 12347) 1234s; run: log: (pid 12348) 1234s
          run: postgresql: (pid 12349) 1234s; run: log: (pid 12350) 1234s
        dest: "/tmp/molecule_test/chef-server-status.txt"
        mode: "0644"

    # Simulate user list output
    - name: Create user list file
      ansible.builtin.copy:
        content: "{{ chef_automate_username | default('jtonello') }}\n"
        dest: "/tmp/molecule_test/chef-user-list.txt"
        mode: "0644"

    # Simulate organization list output
    - name: Create organization list file
      ansible.builtin.copy:
        content: "{{ chef_automate_orgname | default('lab') }}\n"
        dest: "/tmp/molecule_test/chef-org-list.txt"
        mode: "0644"

    # Simulate network listening output
    - name: Create network listening file
      ansible.builtin.copy:
        content: |
          tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      12345/nginx
          tcp6       0      0 :::443                  :::*                    LISTEN      12345/nginx
        dest: "/tmp/molecule_test/network-listening.txt"
        mode: "0644"

    # Simulate health API response
    - name: Create health API response file
      ansible.builtin.copy:
        content: '{"status":"ok"}'
        dest: "/tmp/molecule_test/health-api-response.json"
        mode: "0644"