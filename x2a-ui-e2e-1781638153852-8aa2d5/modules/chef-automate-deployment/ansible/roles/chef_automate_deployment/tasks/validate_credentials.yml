---
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - password is defined
      - user_key is defined
      - key_path is defined
      - validator_key is defined
      - key_path is defined
      - username is defined
      - full_name is defined
      - email is defined
      - org_name is defined
      - org_full_name is defined
    fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template.
    quiet: true
- name: Check for required system packages
  ansible.builtin.package_facts:
    manager: auto
  tags: molecule-notest
- name: Ensure required packages are available
  ansible.builtin.package:
    name:
      - unzip
      - curl
    state: present
  become: true
  tags: molecule-notest
