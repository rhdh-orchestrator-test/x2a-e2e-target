---
- name: Ensure directory for Chef Automate CLI exists
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path | dirname }}"
    state: directory
    mode: "0755"
  when: chef_automate_cli_path | dirname != '.'
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_path }}
    stdin: "{{ lookup('ansible.builtin.file', '/tmp/chef-automate.zip') }}"
    creates: "{{ chef_automate_cli_path }}"
  args:
    executable: /bin/bash
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product {{ chef_automate_products | join(' --product ') }} --accept-terms-and-mlsa=true"
    creates: /hab
  become: true
  when: deploy_chef_automate | bool
