---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/sysctl.d
        - /tmp/molecule_test/home
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/tmp

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname | default('automate.chef.lab') }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: |
          # Chef Automate sysctl settings
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\n# Mock Chef Automate CLI\necho 'Chef Automate CLI mock'"
        dest: /tmp/molecule_test/tmp/chef-automate
        mode: "0755"

    # Simulate Chef user key file
    - name: Create Chef user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAwZ5UJULAjWr7p6FVwGRQRjFN2s8tZ/6LC3X82fajpVsYqF1x
          qEuUDndDXVD09E4u83MS6HO6a3bIVQDp6/klnYldiE6Vp8HH5BSKaCWKVg8lGWg1
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/home/jtonello.pem
        mode: "0600"

    # Simulate Chef organization validator key file
    - name: Create Chef organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA7NvH72rdA0gM2GBmz0QSMmDt5uqD6GHD7xZhYEKz9a5rKd9T
          JQgH3+5bYmQQQV/h6xJGWKpG8j8zKj+UTQ9Oc9fQZPjTfB0eRbG4CdM7ZCrtwwUV
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/home/lab-validator.pem
        mode: "0600"

    # Simulate Chef Automate deployment marker
    - name: Create Chef Automate deployment marker
      ansible.builtin.file:
        path: /tmp/molecule_test/hab/sup
        state: directory
        mode: "0755"

    # Simulate Chef Server status file
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          chef-server-ctl status
          run: postgresql: (pid 12345) 100s; run: log: (pid 12346) 100s
          run: bookshelf: (pid 12347) 100s; run: log: (pid 12348) 100s
          run: oc_bifrost: (pid 12349) 100s; run: log: (pid 12350) 100s
          run: oc_id: (pid 12351) 100s; run: log: (pid 12352) 100s
          run: opscode-erchef: (pid 12353) 100s; run: log: (pid 12354) 100s
          run: nginx: (pid 12355) 100s; run: log: (pid 12356) 100s
        dest: /tmp/molecule_test/tmp/chef-server-status
        mode: "0644"

    # Simulate Chef Automate status file
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          chef-automate status
          Service: automate-cs-bookshelf      OK
          Service: automate-cs-oc-bifrost     OK
          Service: automate-cs-oc-erchef      OK
          Service: automate-cs-nginx          OK
          Service: automate-gateway           OK
          Service: automate-postgresql        OK
          Service: automate-elasticsearch     OK
        dest: /tmp/molecule_test/tmp/chef-automate-status
        mode: "0644"

    # Simulate user list output
    - name: Create Chef user list file
      ansible.builtin.copy:
        content: |
          jtonello
          admin
        dest: /tmp/molecule_test/tmp/chef-user-list
        mode: "0644"

    # Simulate organization list output
    - name: Create Chef organization list file
      ansible.builtin.copy:
        content: |
          lab
          default
        dest: /tmp/molecule_test/tmp/chef-org-list
        mode: "0644"