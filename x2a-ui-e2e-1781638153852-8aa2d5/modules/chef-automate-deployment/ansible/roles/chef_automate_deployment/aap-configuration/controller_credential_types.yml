---
controller_credential_types:
- name: Chef User Password
  description: Credential type for Chef User Password
  kind: cloud
  inputs:
    fields:
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the initial Chef user account
    required:
    - password
  injectors:
    extra_vars:
      password: !unsafe '{{ password }}'
- name: Chef User Key File
  description: Credential type for Chef User Key File
  kind: cloud
  inputs:
    fields:
    - id: user_key
      type: string
      label: User Key
      secret: true
      help_text: Authentication key for the Chef user
    - id: key_path
      type: string
      label: Key File Path
      help_text: Path where the user key file is stored
    required:
    - user_key
  injectors:
    extra_vars:
      user_key: !unsafe '{{ user_key }}'
      key_path: !unsafe '{{ key_path }}'
- name: Chef Organization Validator Key
  description: Credential type for Chef Organization Validator Key
  kind: cloud
  inputs:
    fields:
    - id: validator_key
      type: string
      label: Validator Key
      secret: true
      help_text: Validator key for the Chef organization
    - id: key_path
      type: string
      label: Key File Path
      help_text: Path where the organization validator key file is stored
    required:
    - validator_key
  injectors:
    extra_vars:
      validator_key: !unsafe '{{ validator_key }}'
      key_path: !unsafe '{{ key_path }}'
- name: Chef User Identity
  description: Credential type for Chef User Identity
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for the Chef user account
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the Chef user
    - id: email
      type: string
      label: Email
      help_text: Email address of the Chef user
    required:
    - username
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
- name: Chef Organization Identity
  description: Credential type for Chef Organization Identity
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full name of the Chef organization
    required:
    - org_name
    - org_full_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
