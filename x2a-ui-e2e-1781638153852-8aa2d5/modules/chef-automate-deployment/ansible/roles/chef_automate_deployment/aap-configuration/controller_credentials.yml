---
controller_credentials:
- name: Chef User Password - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User Password
  update_secrets: true
  inputs:
    password: '{{ vault_password }}'
- name: Chef User Key File - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User Key File
  update_secrets: true
  inputs:
    user_key: '{{ vault_user_key }}'
    key_path: '{{ key_path }}'
- name: Chef Organization Validator Key - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Organization Validator Key
  update_secrets: true
  inputs:
    validator_key: '{{ vault_validator_key }}'
    key_path: '{{ key_path }}'
- name: Chef User Identity - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User Identity
  update_secrets: true
  inputs:
    username: '{{ username }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
- name: Chef Organization Identity - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Organization Identity
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
