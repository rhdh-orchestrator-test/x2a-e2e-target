---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
        - /tmp/molecule_test/etc/memcached
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          # Generated by Ansible

          # Network
          bind 127.0.0.1
          port 6379
          timeout 0
          tcp-keepalive 300

          # General
          daemonize yes
          supervised systemd
          pidfile /var/run/redis/redis-server.pid
          loglevel notice
          logfile /var/log/redis/redis-server.log
          databases 16

          # Snapshotting
          save 900 1
          save 300 10
          save 60 10000
          stop-writes-on-bgsave-error yes
          rdbcompression yes
          rdbchecksum yes
          dbfilename dump.rdb
          dir /var/lib/redis

          # Security
          requirepass redis_secure_password_123

          # Memory management
          maxmemory-policy noeviction

          # Disable dangerous commands
          rename-command FLUSHDB ""
          rename-command FLUSHALL ""
          rename-command DEBUG ""
          rename-command CONFIG ""
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create memcached configuration file
      ansible.builtin.copy:
        content: |
          # memcached default config file
          # Run memcached as a daemon
          -d
          # Log memcached's output to /var/log/memcached
          logfile /var/log/memcached.log
          # Be verbose
          # -v
          # Be even more verbose (print client commands as well)
          # -vv
          # Start with a cap of 64 megs of memory. It's reasonable, and the daemon default
          # Note that the daemon will grow to this size, but does not start out holding this much
          # memory
          -m 64
          # Default connection port is 11211
          -p 11211
          # Run the daemon as root. The start-memcached will default to running as root if no
          # -u command is present in this config file
          -u memcache
          # Specify which IP address to listen on. The default is to listen on all IP addresses
          # This parameter is one of the only security measures that memcached has, so make sure
          # it's listening on a firewalled interface.
          -l 127.0.0.1
          # Limit the number of simultaneous incoming connections. The daemon default is 1024
          -c 1024
          # Lock down all paged memory. Consult with the README and homepage before you do this
          # -k
          # Return error when memory is exhausted (rather than removing items)
          # -M
          # Maximize core file limit
          # -r
        dest: /tmp/molecule_test/etc/memcached.conf
        mode: "0644"
        backup: true

    - name: Create Redis log file
      ansible.builtin.copy:
        content: |
          # Redis log file placeholder
          # This file would contain Redis server logs
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"
        backup: true

    - name: Create Redis PID file directory
      ansible.builtin.file:
        path: /tmp/molecule_test/var/run/redis
        state: directory
        mode: "0755"

    - name: Create Redis data directory files
      ansible.builtin.copy:
        content: |
          # Redis dump file placeholder
          # This would contain Redis database snapshot
        dest: /tmp/molecule_test/var/lib/redis/dump.rdb
        mode: "0644"
        backup: true