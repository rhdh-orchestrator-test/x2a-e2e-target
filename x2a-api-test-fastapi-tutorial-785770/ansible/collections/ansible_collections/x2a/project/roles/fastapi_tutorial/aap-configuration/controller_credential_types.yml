---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the FastAPI application to authenticate to its PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application; the source role is fastapi.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; the source plaintext value is fastapi_password and must be rotated and protected.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server; the source connection uses localhost.
        - id: db_port
          type: string
          label: Database Port
          help_text: PostgreSQL service port; the source expects the default port 5432.
        - id: db_name
          type: string
          label: Database Name
          help_text: Database accessed by the FastAPI application; the source database is fastapi_db.
      required:
        - db_username
        - db_password
        - db_host
        - db_port
        - db_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
        db_name: !unsafe "{{ db_name }}"
