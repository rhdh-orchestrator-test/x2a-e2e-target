- name: Converge
  hosts: all
  gather_facts: true
  vars:
    conftext: '<VirtualHost *:443> DocumentRoot "/var/www/helloworld" SSLEngine on SSLCertificateFile /etc/apache2/certs/apache.crt SSLCertificateKeyFile /etc/apache2/certs/apache.key   <Directory
      "/var/www/helloworld"> allow from all Options None Require all granted </Directory> </VirtualHost> '
    webtext: <html> <head><title>Test Site</title></head> <body> <h1>Hello, world!</h1> <p>The site is up and running</p> </body> </html>
  tasks:
  - name: Create required directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/apache2/certs
    - /tmp/molecule_test/etc/apache2/sites-available
    - /tmp/molecule_test/etc/apache2/mods-available
    - /tmp/molecule_test/var/www/helloworld
  - name: Create mock SSL certificate files
    ansible.builtin.copy:
      content: '# Mock SSL certificate content'
      dest: '{{ item }}'
      mode: '0640'
    loop:
    - /tmp/molecule_test/etc/apache2/certs/apache.key
    - /tmp/molecule_test/etc/apache2/certs/apache.csr
    - /tmp/molecule_test/etc/apache2/certs/apache.crt
  - name: Create virtual host configuration
    ansible.builtin.copy:
      content: '{{ conftext }}'
      dest: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      mode: '0640'
  - name: Create website content
    ansible.builtin.copy:
      content: '{{ webtext }}'
      dest: /tmp/molecule_test/var/www/helloworld/index.html
      mode: '0644'
  - name: Create mock SSL configuration file
    ansible.builtin.copy:
      content: SSLProtocol -all +TLSv1.2
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Create sites-enabled directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/sites-enabled
      state: directory
      mode: '0755'
  - name: Create mods-enabled directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-enabled
      state: directory
      mode: '0755'
  - name: Create symbolic link for enabled site
    ansible.builtin.file:
      src: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      dest: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
      state: link
  - name: Create symbolic link for enabled SSL module
    ansible.builtin.file:
      src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      dest: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.conf
      state: link
