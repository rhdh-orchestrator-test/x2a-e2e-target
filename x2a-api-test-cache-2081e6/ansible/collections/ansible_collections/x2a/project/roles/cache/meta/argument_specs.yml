---
argument_specs:
  main:
    short_description: Install and configure Memcached and authenticated Redis caching services.
    description:
      - Installs and starts Memcached and a Redis instance for the cache service.
      - Configures Redis authentication, logging, and cleanup of replication directives.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether tasks handling the Redis password suppress output.
      cache_redis_port:
        type: str
        required: false
        default: "{{ redis_port | default('6379') }}"
        description: Redis TCP port, supplied by the AAP credential or defaulted to 6379.
      cache_redis_config_path:
        type: str
        required: false
        default: /etc/redis/redis.conf
        description: Path to the Redis instance configuration file.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Directory used for Redis logs.
      cache_redis_service_name:
        type: str
        required: false
        default: redis-server
        description: Redis service name on the target operating system.
      cache_memcached_service_name:
        type: str
        required: false
        default: memcached
        description: Memcached service name on the target operating system.
      cache_redis_packages:
        type: list
        elements: str
        required: false
        default:
          - redis-server
        description: Packages required for Redis.
      cache_memcached_packages:
        type: list
        elements: str
        required: false
        default:
          - memcached
        description: Packages required for Memcached.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
      redis_port:
        type: str
        required: false
        default: "6379"
        description: Redis port injected by the AAP credential type. 
