---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install Memcached packages
  ansible.builtin.package:
    name: "{{ cache_memcached_packages }}"
    state: present

- name: Enable and start Memcached
  ansible.builtin.service:
    name: "{{ cache_memcached_service_name }}"
    state: started
    enabled: true

- name: Install Redis packages
  ansible.builtin.package:
    name: "{{ cache_redis_packages }}"
    state: present

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Ensure Redis configuration directory exists
  ansible.builtin.file:
    path: /etc/redis
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Redis configuration
  ansible.builtin.template:
    src: 6379.conf.j2
    dest: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart Redis after configuration changes
  no_log: "{{ cache_secure_logging }}"

- name: Remove replication directives from Redis configuration
  ansible.builtin.replace:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$
    replace: ""
  notify: Restart Redis after configuration changes

- name: Enable and start Redis
  ansible.builtin.service:
    name: "{{ cache_redis_service_name }}"
    state: started
    enabled: true
