---
# Defaults for x2a.project.cache.
cache_secure_logging: true
cache_redis_port: "{{ redis_port | default('6379') }}"
cache_redis_config_path: /etc/redis/redis.conf
cache_redis_log_directory: /var/log/redis
cache_redis_service_name: redis-server
cache_memcached_service_name: memcached
cache_redis_packages:
  - redis-server
cache_memcached_packages:
  - memcached
