---
# Unsupported pre-flight checks: the Redis service name is a placeholder; log inspection,
# restart validation, authenticated Redis checks, and exact command-output checks require
# runtime credentials or outcomes not safely available to this verification playbook.
- name: Verify Redis cache instance
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify Redis endpoint is listening on TCP port 6379
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 30

    - name: Check Redis configuration file
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_file

    - name: Assert Redis configuration file exists
      ansible.builtin.assert:
        that:
          - redis_config_file.stat.exists
          - redis_config_file.stat.isreg
        fail_msg: Redis configuration file is missing or is not a regular file.

    - name: Check Redis log directory
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_directory

    - name: Assert Redis log directory properties
      ansible.builtin.assert:
        that:
          - redis_log_directory.stat.exists
          - redis_log_directory.stat.isdir
          - redis_log_directory.stat.pw_name == 'redis'
          - redis_log_directory.stat.gr_name == 'redis'
          - redis_log_directory.stat.mode == '0755'
        fail_msg: Redis log directory is missing or has unexpected properties.

    - name: Read Redis configuration without displaying its contents
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_contents

    - name: Assert replication cleanup directives are absent
      ansible.builtin.assert:
        that:
          - (redis_config_contents.content | b64decode) is not regex('(?m)^replica-serve-stale-data.*$')
          - (redis_config_contents.content | b64decode) is not regex('(?m)^replica-read-only.*$')
          - (redis_config_contents.content | b64decode) is not regex('(?m)^repl-ping-replica-period.*$')
          - (redis_config_contents.content | b64decode) is not regex('(?m)^client-output-buffer-limit.*$')
          - (redis_config_contents.content | b64decode) is not regex('(?m)^replica-priority.*$')
        fail_msg: Redis configuration contains a directive that should have been removed.
