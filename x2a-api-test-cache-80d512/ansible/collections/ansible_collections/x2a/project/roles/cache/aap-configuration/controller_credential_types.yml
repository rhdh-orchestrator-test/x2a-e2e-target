---
controller_credential_types:
  - name: Redis Authentication
    description: Credential used to authenticate clients to the Redis instance through the Redis requirepass directive.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis clients to authenticate to the redis-6379 instance.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
