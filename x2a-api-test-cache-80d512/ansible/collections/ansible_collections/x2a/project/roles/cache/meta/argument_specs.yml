---
argument_specs:
  main:
    short_description: Configure a standalone Redis cache service
    description:
      - Installs and configures Redis on TCP port 6379 using the eloy.redis Private Hub role.
      - Creates the Redis log directory and removes unsupported replication directives.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks handling the Redis password.
      redis_version:
        type: str
        required: false
        default: "7.2"
        description: Redis version to install.
      redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port used by Redis.
      redis_requirepass:
        type: str
        required: false
        default: "{{ redis_password }}"
        description: Redis authentication password supplied by the AAP credential.
      redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis cluster mode is enabled.
      redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis Sentinel mode is enabled.
      redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis replication is enabled.
      redis_aof_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis append-only persistence is enabled.
      redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Whether Redis RDB persistence is enabled.
