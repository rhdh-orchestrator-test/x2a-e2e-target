---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis and Memcached configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /etc/redis/6379.conf
      loop_control:
        loop_var: item_config
      register: config_stat_results

    - name: Assert configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected configuration file not found"
      loop: "{{ config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check Redis log directory exists
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory was created with correct permissions
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['exists']
          - redis_log_dir_stat['stat']['isdir']
          - redis_log_dir_stat['stat']['pw_name'] == 'redis'
          - redis_log_dir_stat['stat']['gr_name'] == 'redis'
          - redis_log_dir_stat['stat']['mode'] == '0755'
        fail_msg: "Redis log directory not found or incorrect permissions"

    - name: Get service facts
      ansible.builtin.service_facts:

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - ansible_facts.services['redis-server.service']['state'] == 'running'
          - ansible_facts.services['redis-server.service']['status'] == 'enabled'
        fail_msg: "Redis service not running or not enabled"

    - name: Assert Memcached service is running
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - ansible_facts.services['memcached.service']['state'] == 'running'
          - ansible_facts.services['memcached.service']['status'] == 'enabled'
        fail_msg: "Memcached service not running or not enabled"

    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 10
        msg: "Redis port 6379 not listening"

    - name: Check Memcached port is listening
      ansible.builtin.wait_for:
        port: 11211
        host: 127.0.0.1
        timeout: 10
        msg: "Memcached port 11211 not listening"

    - name: Read Redis configuration file
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis configuration contains required settings
      ansible.builtin.assert:
        that:
          - "'requirepass' in redis_config_decoded"
          - "'port 6379' in redis_config_decoded"
          - "'bind 127.0.0.1' in redis_config_decoded"
        fail_msg: "Redis configuration missing required settings"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

    - name: Assert problematic Redis replica configuration lines were removed
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in redis_config_decoded"
          - "'replica-read-only' not in redis_config_decoded"
          - "'repl-ping-replica-period' not in redis_config_decoded"
          - "'replica-priority' not in redis_config_decoded"
        fail_msg: "Problematic Redis replica configuration lines still present"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

- name: Verify Redis connectivity
  hosts: all
  gather_facts: false
  tasks:
    - name: Test Redis connectivity with authentication # noqa: L039 - redis_password comes from molecule test environment  # noqa: R101 - redis_password comes from molecule test environment
      ansible.builtin.command:
        argv:
          - redis-cli
          - -p
          - "6379"
          - -a
          - "{{ redis_password }}"
          - ping
      register: redis_ping_result
      changed_when: false

    - name: Assert Redis responds to ping
      ansible.builtin.assert:
        that:
          - redis_ping_result['stdout'] == 'PONG'
        fail_msg: "Redis not responding to ping command"

    - name: Test Redis set/get operations # noqa: L039 - redis_password comes from molecule test environment  # noqa: R101 - redis_password comes from molecule test environment
      ansible.builtin.command:
        argv:
          - redis-cli
          - -p
          - "6379"
          - -a
          - "{{ redis_password }}"
          - set
          - test_key
          - test_value
      register: redis_set_result
      changed_when: false

    - name: Test Redis get operation # noqa: L039 - redis_password comes from molecule test environment  # noqa: R101 - redis_password comes from molecule test environment
      ansible.builtin.command:
        argv:
          - redis-cli
          - -p
          - "6379"
          - -a
          - "{{ redis_password }}"
          - get
          - test_key
      register: redis_get_result
      changed_when: false

    - name: Assert Redis set/get operations work
      ansible.builtin.assert:
        that:
          - redis_set_result['stdout'] == 'OK'
          - redis_get_result['stdout'] == 'test_value'
        fail_msg: "Redis set/get operations failed"

    - name: Clean up Redis test key # noqa: L039 - redis_password comes from molecule test environment  # noqa: R101 - redis_password comes from molecule test environment
      ansible.builtin.command:
        argv:
          - redis-cli
          - -p
          - "6379"
          - -a
          - "{{ redis_password }}"
          - del
          - test_key
      changed_when: false

- name: Verify Memcached connectivity
  hosts: all
  gather_facts: false
  tasks:
    - name: Test Memcached stats command
      ansible.builtin.command:
        cmd: |
          echo "stats" | nc localhost 11211
      register: memcached_stats_result
      changed_when: false

    - name: Assert Memcached responds to stats
      ansible.builtin.assert:
        that:
          - "'STAT version' in memcached_stats_result['stdout']"
          - "'END' in memcached_stats_result['stdout']"
        fail_msg: "Memcached not responding to stats command"

    - name: Test Memcached set/get operations
      ansible.builtin.command:
        cmd: 'echo -e "set test_key 0 60 10\r test_value\r get test_key\r quit\r " | nc localhost 11211'
      register: memcached_ops_result
      changed_when: false

    - name: Assert Memcached set/get operations work
      ansible.builtin.assert:
        that:
          - "'STORED' in memcached_ops_result['stdout']"
          - "'VALUE test_key' in memcached_ops_result['stdout']"
          - "'test_value' in memcached_ops_result['stdout']"
        fail_msg: "Memcached set/get operations failed"
