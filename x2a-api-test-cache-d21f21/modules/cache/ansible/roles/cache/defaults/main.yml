---
# Redis configuration
cache_redis_port: 6379
cache_redis_bind: 127.0.0.1
cache_redis_maxmemory: 256mb
cache_redis_maxmemory_policy: allkeys-lru
cache_redis_save_enabled: true
cache_redis_save_intervals:
  - 900 1
  - 300 10
  - 60 10000
# Memcached configuration
cache_memcached_port: 11211
cache_memcached_listen: 127.0.0.1
cache_memcached_memory: 64
cache_memcached_user: memcache
cache_memcached_connections: 1024
# Service management
cache_redis_service_name: redis-server
cache_memcached_service_name: memcached
