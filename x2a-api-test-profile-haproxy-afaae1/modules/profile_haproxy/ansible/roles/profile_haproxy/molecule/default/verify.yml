---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check HAProxy configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/haproxy/haproxy.cfg
        - /tmp/molecule_test/etc/haproxy/conf.d/webservers.cfg
        - /tmp/molecule_test/etc/haproxy/conf.d/api.cfg
        - /tmp/molecule_test/etc/haproxy/conf.d/stick-tables.cfg
        - /tmp/molecule_test/etc/haproxy/errors/503.http
        - /tmp/molecule_test/etc/haproxy/errors/408.http
        - /tmp/molecule_test/etc/systemd/system/haproxy.service.d/override.conf
        - /tmp/molecule_test/etc/logrotate.d/haproxy
      loop_control:
        loop_var: item_config
      register: config_stat_results

    - name: Assert configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected HAProxy config file not found"
      loop: "{{ config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check HAProxy directories exist
      ansible.builtin.stat:
        path: "{{ item_dir }}"
      loop:
        - /tmp/molecule_test/etc/haproxy
        - /tmp/molecule_test/etc/haproxy/conf.d
        - /tmp/molecule_test/etc/haproxy/errors
        - /tmp/molecule_test/var/lib/haproxy
        - /tmp/molecule_test/etc/systemd/system/haproxy.service.d
      loop_control:
        loop_var: item_dir
      register: dir_stat_results

    - name: Assert directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected HAProxy directory not found"
      loop: "{{ dir_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read HAProxy main configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/haproxy/haproxy.cfg
      register: haproxy_main_config

    - name: Assert HAProxy main configuration contains expected content
      ansible.builtin.assert:
        that:
          - "'global' in haproxy_main_config['content'] | b64decode"
          - "'defaults' in haproxy_main_config['content'] | b64decode"
          - "'frontend http_front' in haproxy_main_config['content'] | b64decode"
          - "'maxconn     4096' in haproxy_main_config['content'] | b64decode"
          - "'user        haproxy' in haproxy_main_config['content'] | b64decode"
          - "'group       haproxy' in haproxy_main_config['content'] | b64decode"
          - "'bind *:80' in haproxy_main_config['content'] | b64decode"
          - "'bind *:9000' in haproxy_main_config['content'] | b64decode"
          - "'stats enable' in haproxy_main_config['content'] | b64decode"
        fail_msg: "HAProxy main configuration missing expected content"

    - name: Read backend configuration files
      ansible.builtin.slurp:
        src: "{{ item_backend_file }}"
      loop:
        - /tmp/molecule_test/etc/haproxy/conf.d/webservers.cfg
        - /tmp/molecule_test/etc/haproxy/conf.d/api.cfg
      loop_control:
        loop_var: item_backend_file
      register: backend_config_results

    - name: Assert backend configurations contain expected content
      ansible.builtin.assert:
        that:
          - "'backend webservers' in backend_config_results['results'][0]['content'] | b64decode or 'backend api' in backend_config_results['results'][0]['content'] | b64decode"
          - "'balance roundrobin' in backend_config_results['results'][0]['content'] | b64decode or 'balance leastconn' in backend_config_results['results'][0]['content'] | b64decode"
          - "'server web1 10.0.1.10:8080' in backend_config_results['results'][0]['content'] | b64decode or 'server api1 10.0.2.10:3000' in backend_config_results['results'][0]['content'] | b64decode"
        fail_msg: "Backend configuration missing expected content"

    - name: Read error page files
      ansible.builtin.slurp:
        src: "{{ item_error_file }}"
      loop:
        - /tmp/molecule_test/etc/haproxy/errors/503.http
        - /tmp/molecule_test/etc/haproxy/errors/408.http
      loop_control:
        loop_var: item_error_file
      register: error_page_results

    - name: Assert error pages contain expected content
      ansible.builtin.assert:
        that:
          - "'HTTP/1.0 503 Service Unavailable' in error_page_results['results'][0]['content'] | b64decode"
          - "'HTTP/1.0 408 Request Timeout' in error_page_results['results'][1]['content'] | b64decode"
          - "'<html><body>' in item_result['content'] | b64decode"
        fail_msg: "Error page missing expected content"
      loop: "{{ error_page_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read systemd override configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/systemd/system/haproxy.service.d/override.conf
      register: systemd_override_config

    - name: Assert systemd override contains expected content
      ansible.builtin.assert:
        that:
          - "'[Service]' in systemd_override_config['content'] | b64decode"
          - "'ExecStart=' in systemd_override_config['content'] | b64decode"
          - "'/usr/sbin/haproxy -Ws' in systemd_override_config['content'] | b64decode"
          - "'/etc/haproxy/haproxy.cfg' in systemd_override_config['content'] | b64decode"
        fail_msg: "Systemd override configuration missing expected content"

    - name: Read logrotate configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/logrotate.d/haproxy
      register: logrotate_config

    - name: Assert logrotate configuration contains expected content
      ansible.builtin.assert:
        that:
          - "'/var/log/haproxy/*.log' in logrotate_config['content'] | b64decode"
          - "'daily' in logrotate_config['content'] | b64decode"
          - "'rotate 14' in logrotate_config['content'] | b64decode"
          - "'compress' in logrotate_config['content'] | b64decode"
          - "'postrotate' in logrotate_config['content'] | b64decode"
        fail_msg: "Logrotate configuration missing expected content"

    - name: Read stick-table configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/haproxy/conf.d/stick-tables.cfg
      register: stick_table_config

    - name: Assert stick-table configuration contains expected content
      ansible.builtin.assert:
        that:
          - "'stick-table type ip size 100k expire 30m' in stick_table_config['content'] | b64decode"
          - "'# Managed by Ansible' in stick_table_config['content'] | b64decode"
        fail_msg: "Stick-table configuration missing expected content"

    - name: Check SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ item_ssl_file }}"
      loop:
        - /tmp/molecule_test/etc/ssl/certs/haproxy.pem
        - /tmp/molecule_test/etc/ssl/private/haproxy.key
      loop_control:
        loop_var: item_ssl_file
      register: ssl_file_results

    - name: Assert SSL files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL file not found"
      loop: "{{ ssl_file_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Service checks that cannot run in container environment
    - name: Check HAProxy service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert HAProxy service is running
      ansible.builtin.assert:
        that:
          - "'haproxy.service' in ansible_facts.services"
          - "ansible_facts.services['haproxy.service']['state'] == 'running'"
        fail_msg: "HAProxy service not running"
      tags: molecule-notest

    # Port checks that cannot run in container environment
    - name: Check HTTP port is listening
      ansible.builtin.wait_for:
        port: 80
        host: localhost
        timeout: 5
      tags: molecule-notest

    - name: Check HTTPS port is listening (SSL environments)
      ansible.builtin.wait_for:
        port: 443
        host: localhost
        timeout: 5
      tags: molecule-notest

    - name: Check stats port is listening
      ansible.builtin.wait_for:
        port: 9000
        host: localhost
        timeout: 5
      tags: molecule-notest

    # HTTP endpoint checks that cannot run in container environment
    - name: Check HAProxy stats interface
      ansible.builtin.uri:
        url: http://localhost:9000/haproxy-stats
        method: GET
        status_code: [200, 401]
      tags: molecule-notest

    - name: Check webservers backend health
      ansible.builtin.uri:
        url: http://localhost:80/health
        method: GET
        status_code: [200, 503]
      tags: molecule-notest

    - name: Check API backend health
      ansible.builtin.uri:
        url: http://localhost:3000/health
        method: GET
        status_code: [200, 503]
      tags: molecule-notest

    # Configuration validation that cannot run in container environment
    - name: Validate HAProxy configuration syntax
      ansible.builtin.command:
        cmd: haproxy -f /etc/haproxy/haproxy.cfg -c
      changed_when: false
      tags: molecule-notest

    - name: Check HAProxy configuration with debug mode
      ansible.builtin.command:
        cmd: haproxy -f /etc/haproxy/haproxy.cfg -db
      changed_when: false
      tags: molecule-notest