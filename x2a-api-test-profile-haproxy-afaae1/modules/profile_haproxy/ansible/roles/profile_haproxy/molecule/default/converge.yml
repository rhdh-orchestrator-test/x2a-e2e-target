---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected HAProxy directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/haproxy
        - /tmp/molecule_test/etc/haproxy/conf.d
        - /tmp/molecule_test/etc/haproxy/errors
        - /tmp/molecule_test/var/lib/haproxy
        - /tmp/molecule_test/etc/systemd/system/haproxy.service.d
        - /tmp/molecule_test/etc/logrotate.d
        - /tmp/molecule_test/etc/ssl/certs
        - /tmp/molecule_test/etc/ssl/private
      loop_control:
        loop_var: item_dir

    - name: Create HAProxy main configuration file
      ansible.builtin.copy:
        content: |
          # Managed by Ansible — do not edit manually
          # Role: profile_haproxy

          global
              log         127.0.0.1 local0 info
              chroot      /var/lib/haproxy
              maxconn     4096
              user        haproxy
              group       haproxy
              daemon
              stats socket /var/lib/haproxy/stats mode 660 level admin

          defaults
              log     global
              mode    http
              option  httplog
              option  dontlognull
              option  forwardfor
              option  http-server-close
              timeout connect 5s
              timeout client  30s
              timeout server  30s
              retries 3
              errorfile 503 /etc/haproxy/errors/503.http
              errorfile 408 /etc/haproxy/errors/408.http

          listen stats
              bind *:9000
              stats enable
              stats uri /haproxy-stats
              stats realm HAProxy\ Statistics
              stats auth admin:password
              stats admin if TRUE
              stats refresh 30s

          frontend http_front
              bind *:80
              default_backend webservers

          # Backend configuration included from conf.d/webservers.cfg
          # Backend configuration included from conf.d/api.cfg
        dest: /tmp/molecule_test/etc/haproxy/haproxy.cfg
        mode: "0640"
        backup: true

    - name: Create backend configuration files
      ansible.builtin.copy:
        content: |
          # Backend: {{ item_backend['name'] }}
          # Managed by Ansible — do not edit manually

          backend {{ item_backend['name'] }}
              balance {{ item_backend['balance'] }}
              option  {{ item_backend['health_check'] }}
              default-server inter {{ item_backend['health_interval'] }}
          {% for server in item_backend['servers'] %}
              server {{ server['name'] }} {{ server['address'] }}:{{ item_backend['port'] }} check weight {{ server['weight'] }}
          {% endfor %}
        dest: "/tmp/molecule_test/etc/haproxy/conf.d/{{ item_backend['name'] }}.cfg"
        mode: "0640"
        backup: true
      loop:
        - name: webservers
          balance: roundrobin
          port: 8080
          health_check: httpchk GET /health
          health_interval: 5s
          servers:
            - name: web1
              address: 10.0.1.10
              weight: 100
            - name: web2
              address: 10.0.1.11
              weight: 100
        - name: api
          balance: leastconn
          port: 3000
          health_check: httpchk GET /api/health
          health_interval: 10s
          servers:
            - name: api1
              address: 10.0.2.10
              weight: 100
            - name: api2
              address: 10.0.2.11
              weight: 100
      loop_control:
        loop_var: item_backend

    - name: Create HAProxy error pages
      ansible.builtin.copy:
        content: |
          HTTP/1.0 {{ item_error }} {{ 'Service Unavailable' if item_error == '503' else 'Request Timeout' }}
          Cache-Control: no-cache
          Connection: close
          Content-Type: text/html

          <html><body><h1>{{ item_error }} {{ 'Service Unavailable' if item_error == '503' else 'Request Timeout' }}</h1>
          <p>The service is temporarily unavailable. Please try again later.</p>
          </body></html>
        dest: "/tmp/molecule_test/etc/haproxy/errors/{{ item_error }}.http"
        mode: "0644"
        backup: true
      loop:
        - "503"
        - "408"
      loop_control:
        loop_var: item_error

    - name: Create systemd service override
      ansible.builtin.copy:
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/sbin/haproxy -Ws -f /etc/haproxy/haproxy.cfg -f /etc/haproxy/conf.d/ -p /run/haproxy.pid -S /run/haproxy-master.sock
        dest: /tmp/molecule_test/etc/systemd/system/haproxy.service.d/override.conf
        mode: "0644"
        backup: true

    - name: Create HAProxy log rotation configuration
      ansible.builtin.copy:
        content: |
          /var/log/haproxy/*.log {
              daily
              rotate 14
              missingok
              notifempty
              compress
              delaycompress
              sharedscripts
              postrotate
                  /bin/kill -HUP $(cat /var/run/haproxy.pid 2>/dev/null) 2>/dev/null || true
              endscript
          }
        dest: /tmp/molecule_test/etc/logrotate.d/haproxy
        mode: "0644"
        backup: true

    - name: Create stick-table configuration (production environment)
      ansible.builtin.copy:
        content: |
          # Managed by Ansible
          stick-table type ip size 100k expire 30m
        dest: /tmp/molecule_test/etc/haproxy/conf.d/stick-tables.cfg
        mode: "0640"
        backup: true

