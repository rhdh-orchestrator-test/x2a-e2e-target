---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
- name: restart haproxy
  ansible.builtin.systemd:
    name: "{{ profile_haproxy_service_name }}"
    state: restarted
- name: reload haproxy
  ansible.builtin.systemd:
    name: "{{ profile_haproxy_service_name }}"
    state: reloaded
- name: validate haproxy config
  ansible.builtin.command:
    cmd: haproxy -c -f {{ profile_haproxy_config_file }} -f {{ profile_haproxy_config_dir }}/conf.d/
  changed_when: false
