- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: chef_admin
    chef_orgname: lab
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file was created
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found or empty
      success_msg: Hostname file exists and has content
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file was created
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Sysctl config file not found or empty
      success_msg: Sysctl config file exists and has content
  - name: Get sysctl content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl settings are correct
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: Sysctl settings not configured correctly
      success_msg: Sysctl settings configured correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: chef_config_file
  - name: Assert Chef Automate config file was created
    ansible.builtin.assert:
      that:
      - chef_config_file.stat.exists
      - chef_config_file.stat.size > 0
      fail_msg: Chef Automate config file not found or empty
      success_msg: Chef Automate config file exists and has content
  - name: Check user PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/molecule/{{ username }}.pem
    register: user_pem_file
  - name: Assert user PEM file was created
    ansible.builtin.assert:
      that:
      - user_pem_file.stat.exists
      - user_pem_file.stat.size > 0
      - user_pem_file.stat.mode == "0600"
      fail_msg: User PEM file not found, empty, or has incorrect permissions
      success_msg: User PEM file exists with correct permissions
  - name: Check organization validator PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/molecule/{{ chef_orgname }}-validator.pem
    register: org_pem_file
  - name: Assert organization validator PEM file was created
    ansible.builtin.assert:
      that:
      - org_pem_file.stat.exists
      - org_pem_file.stat.size > 0
      - org_pem_file.stat.mode == "0600"
      fail_msg: Organization validator PEM file not found, empty, or has incorrect permissions
      success_msg: Organization validator PEM file exists with correct permissions
  - name: Check deployment log file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/log/chef-automate/automate-deployment.log
    register: deployment_log_file
  - name: Assert deployment log file was created
    ansible.builtin.assert:
      that:
      - deployment_log_file.stat.exists
      - deployment_log_file.stat.size > 0
      fail_msg: Deployment log file not found or empty
      success_msg: Deployment log file exists and has content
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: chef-automate status
    register: automate_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - automate_status.rc == 0
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: chef-server-ctl status
    register: server_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - server_status.rc == 0
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Check user exists
    ansible.builtin.command:
      cmd: chef-server-ctl user-list
    register: user_list
    changed_when: false
    tags: molecule-notest
  - name: Assert user exists
    ansible.builtin.assert:
      that:
      - username in user_list.stdout
      fail_msg: User not found in Chef Infra Server
      success_msg: User exists in Chef Infra Server
    tags: molecule-notest
  - name: Check organization exists
    ansible.builtin.command:
      cmd: chef-server-ctl org-list
    register: org_list
    changed_when: false
    tags: molecule-notest
  - name: Assert organization exists
    ansible.builtin.assert:
      that:
      - chef_orgname in org_list.stdout
      fail_msg: Organization not found in Chef Infra Server
      success_msg: Organization exists in Chef Infra Server
    tags: molecule-notest
  - name: Check Chef Automate UI port
    ansible.builtin.wait_for:
      port: 443
      timeout: 5
    register: automate_port
    ignore_errors: true
    tags: molecule-notest
  - name: Assert Chef Automate UI port is listening
    ansible.builtin.assert:
      that:
      - automate_port is succeeded
      fail_msg: Chef Automate UI port (443) is not listening
      success_msg: Chef Automate UI port (443) is listening
    tags: molecule-notest
  - name: Check Chef Infra Server port
    ansible.builtin.wait_for:
      port: 8989
      timeout: 5
    register: server_port
    ignore_errors: true
    tags: molecule-notest
  - name: Assert Chef Infra Server port is listening
    ansible.builtin.assert:
      that:
      - server_port is succeeded
      fail_msg: Chef Infra Server port (8989) is not listening
      success_msg: Chef Infra Server port (8989) is listening
    tags: molecule-notest
  - name: Check Chef Automate API health
    ansible.builtin.uri:
      url: https://localhost/api/v0/health
      validate_certs: false
      status_code: 200
    register: api_health
    ignore_errors: true
    tags: molecule-notest
  - name: Assert Chef Automate API is healthy
    ansible.builtin.assert:
      that:
      - api_health is succeeded
      fail_msg: Chef Automate API health check failed
      success_msg: Chef Automate API is healthy
    tags: molecule-notest
