- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: chef_admin
    password: chef_password
    chef_hostname: automate.chef.lab
    chef_orgname: lab
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/var/log/chef-automate
    - /tmp/molecule_test/home/molecule
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "# Mock Chef Automate configuration file\n[global]\n  v1 = true\n[deployment]\n  automate = true\n  infra_server = true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAzV7Z2hHFTxbASUCZfZ8rXGJQXgvkfGnKQi5zxxvbvE5YCdmk

        [MOCK PEM CONTENT]

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/molecule/{{ username }}.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0Zf7MRNVVFQjJ4WBf1dMhFWXIYYxL0qjDnnA/X0KO3sBSVXc

        [MOCK PEM CONTENT]

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/molecule/{{ chef_orgname }}-validator.pem
      mode: '0600'
  - name: Create deployment log file
    ansible.builtin.copy:
      content: '[2023-07-01T12:00:00Z] Starting Chef Automate deployment

        [2023-07-01T12:05:00Z] Deploying Chef Infra Server

        [2023-07-01T12:10:00Z] Deployment complete

        '
      dest: /tmp/molecule_test/var/log/chef-automate/automate-deployment.log
      mode: '0644'
  - name: Create mock sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
