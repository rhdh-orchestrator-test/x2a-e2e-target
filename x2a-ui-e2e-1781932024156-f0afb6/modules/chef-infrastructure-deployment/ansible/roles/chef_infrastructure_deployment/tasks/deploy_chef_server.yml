- name: Set system hostname
  ansible.builtin.hostname:
    name: '{{ chef_hostname }}'
  become: true
- name: Set kernel parameter vm.max_map_count
  community.general.sysctl:
    name: vm.max_map_count
    value: '{{ chef_vm_max_map_count }}'
    state: present
    reload: true
  become: true
- name: Set kernel parameter vm.dirty_expire_centisecs
  community.general.sysctl:
    name: vm.dirty_expire_centisecs
    value: '{{ chef_vm_dirty_expire_centisecs }}'
    state: present
    reload: true
  become: true
- name: Ensure unzip is installed
  ansible.builtin.package:
    name: unzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: '{{ chef_automate_cli_url }}'
    dest: /tmp/chef-automate.zip
    mode: '0644'
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: /tmp/chef-automate.zip
    dest: /tmp/
    remote_src: true
    creates: /tmp/chef-automate
    mode: '0755'
- name: Deploy Chef Infra Server (without Automate)
  ansible.builtin.command:
    cmd: /tmp/chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_accept_terms_and_mlsa | lower }}
    creates: /etc/chef-automate/config.toml
  become: true
- name: Ensure user PEM directory exists
  ansible.builtin.file:
    path: '{{ chef_user_pem_path | dirname | expanduser }}'
    state: directory
    mode: '0755'
  when: chef_user_pem_path is defined
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ chef_longusername }}" {{ chef_useremail }} "{{ password }}" --filename {{ chef_user_pem_path | expanduser
      }}
    creates: '{{ chef_user_pem_path | expanduser }}'
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_orgname }} "{{ chef_longorgname }}" --association_user {{ username }} --filename {{ chef_org_pem_path | expanduser }}
    creates: '{{ chef_org_pem_path | expanduser }}'
  become: true
