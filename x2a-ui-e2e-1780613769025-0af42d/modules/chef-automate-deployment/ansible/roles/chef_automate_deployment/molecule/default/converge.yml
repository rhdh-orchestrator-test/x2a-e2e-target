---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/ansible

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate kernel parameters
    - name: Create max_map_count file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_max_map_count }}"
        dest: "/tmp/molecule_test/proc/sys/vm/max_map_count"
        mode: "0644"

    - name: Create dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_dirty_expire_centisecs }}"
        dest: "/tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs"
        mode: "0644"

    # Simulate Chef Automate CLI download and extraction
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/sh\necho 'Chef Automate CLI mock'\nexit 0"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.file:
        path: "/tmp/molecule_test/hab/sup"
        state: directory
        mode: "0755"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-cs-nginx
          Status: running
          Service: automate-cs-postgresql
          Status: running
          Service: chef-server-nginx
          Status: running
        dest: "/tmp/molecule_test/hab/sup/status.txt"
        mode: "0644"

    # Simulate user and organization key files
    - name: Create user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAx4UbaPrYw4L4WYsd0dH9yRVos/kbcgLI5j45aGELQHJPE1CY
          MOCK_KEY_CONTENT_FOR_USER
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/ansible/{{ chef_automate_username }}.pem"
        mode: "0600"

    - name: Create organization key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAx4UbaPrYw4L4WYsd0dH9yRVos/kbcgLI5j45aGELQHJPE1CY
          MOCK_KEY_CONTENT_FOR_ORG
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/ansible/{{ chef_automate_org_name }}-validator.pem"
        mode: "0600"