---
- name: Ensure directory for key files exists
  ansible.builtin.file:
    path: "{{ chef_automate_user_key_path | dirname }}"
    state: directory
    mode: "0755"
  when: chef_automate_user_key_path is defined and chef_automate_user_key_path != ""
- name: Create Chef Infra Server admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_automate_username }} {{ chef_automate_full_name }} {{ chef_automate_email }} "{{ chef_automate_password }}" --filename
      {{ chef_automate_user_key_path }}

      '
  args:
    creates: "{{ chef_automate_user_key_path }}"
  become: true
  register: user_create_result
  changed_when: user_create_result.rc == 0
  failed_when: user_create_result.rc != 0
  no_log: true
- name: Create Chef Infra Server organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_full_name }}" --association_user {{ chef_automate_username }} --filename {{
      chef_automate_org_key_path }}

      '
  args:
    creates: "{{ chef_automate_org_key_path }}"
  become: true
  register: org_create_result
  changed_when: org_create_result.rc == 0
  failed_when: org_create_result.rc != 0
- name: Set proper permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_automate_user_key_path }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: user_create_result is changed
- name: Set proper permissions on organization key file
  ansible.builtin.file:
    path: "{{ chef_automate_org_key_path }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: org_create_result is changed
