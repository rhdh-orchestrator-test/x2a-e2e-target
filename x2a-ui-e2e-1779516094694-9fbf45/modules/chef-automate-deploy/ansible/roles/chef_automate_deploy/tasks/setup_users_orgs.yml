---
- name: Ensure directories for key files exist
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_key_path }}"
    - "{{ chef_org_validator_path }}"
  when: chef_automate_setup_users_orgs | bool
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ chef_user_key_path }}
  become: true
  args:
    creates: "{{ chef_user_key_path }}"
  when: chef_automate_setup_users_orgs | bool
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ org_short_name }} "{{ org_full_name }}" --association_user {{ username }} --filename {{ chef_org_validator_path }}
  become: true
  args:
    creates: "{{ chef_org_validator_path }}"
  when: chef_automate_setup_users_orgs | bool
- name: Set permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_user_key_path }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: chef_automate_setup_users_orgs | bool
- name: Set permissions on organization validator key file
  ansible.builtin.file:
    path: "{{ chef_org_validator_path }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  when: chef_automate_setup_users_orgs | bool
