---
controller_credential_types:
- name: Chef User Credentials
  description: Credential type for Chef User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for the Chef user account
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef user account
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the Chef user
    - id: email
      type: string
      label: Email
      help_text: Email address for the Chef user
    required:
    - username
    - password
    - full_name
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
- name: Chef User Key File
  description: Credential type for Chef User Key File
  kind: cloud
  inputs:
    fields:
    - id: user_key_path
      type: string
      label: User Key Path
      help_text: Path where the user's PEM key file will be stored
    - id: user_key_content
      type: string
      label: User Key Content
      secret: true
      help_text: Content of the PEM key file for Chef user authentication
    required:
    - user_key_path
  injectors:
    extra_vars:
      user_key_path: !unsafe '{{ user_key_path }}'
      user_key_content: !unsafe '{{ user_key_content }}'
- name: Chef Organization Validator
  description: Credential type for Chef Organization Validator
  kind: cloud
  inputs:
    fields:
    - id: org_short_name
      type: string
      label: Organization Short Name
      help_text: Short name for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full name for the Chef organization
    - id: org_validator_path
      type: string
      label: Organization Validator Path
      help_text: Path where the organization validator PEM key file will be stored
    - id: org_validator_content
      type: string
      label: Organization Validator Content
      secret: true
      help_text: Content of the PEM key file for Chef organization validation
    required:
    - org_short_name
    - org_full_name
  injectors:
    extra_vars:
      org_short_name: !unsafe '{{ org_short_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
      org_validator_path: !unsafe '{{ org_validator_path }}'
      org_validator_content: !unsafe '{{ org_validator_content }}'
