---
- name: Store user key
  ansible.builtin.copy:
    content: "{{ user_key }}"
    dest: "{{ chef_automate_user_key_path }}"
    mode: "0600"
  when: user_key is defined and user_key | length > 0
- name: Store organization validator key
  ansible.builtin.copy:
    content: "{{ validator_key }}"
    dest: "{{ chef_automate_org_validator_key_path }}"
    mode: "0600"
  when: validator_key is defined and validator_key | length > 0
