---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/keys

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate kernel parameters
    - name: Create max_map_count file
      ansible.builtin.copy:
        content: "262144"
        dest: "/tmp/molecule_test/proc/sys/vm/max_map_count"
        mode: "0644"

    - name: Create dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "20000"
        dest: "/tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs"
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI'"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.file:
        path: "/tmp/molecule_test/hab"
        state: directory
        mode: "0755"

    # Simulate user and organization keys
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA...\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/keys/jtonello.pem"
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA...\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/keys/lab-validator.pem"
        mode: "0600"

    # Simulate Chef server status output
    - name: Create Chef server status file
      ansible.builtin.copy:
        content: |
          run: postgresql: running
          run: bookshelf: running
          run: oc_bifrost: running
          run: oc_id: running
          run: opscode-erchef: running
          run: nginx: running
          run: opscode-solr4: running
        dest: "/tmp/molecule_test/chef-server-status"
        mode: "0644"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-gateway
            Status: running
          Service: automate-load-balancer
            Status: running
          Service: automate-postgresql
            Status: running
          Service: automate-elasticsearch
            Status: running
        dest: "/tmp/molecule_test/chef-automate-status"
        mode: "0644"

    # Simulate user and organization lists
    - name: Create user list file
      ansible.builtin.copy:
        content: "jtonello"
        dest: "/tmp/molecule_test/chef-user-list"
        mode: "0644"

    - name: Create organization list file
      ansible.builtin.copy:
        content: "lab"
        dest: "/tmp/molecule_test/chef-org-list"
        mode: "0644"