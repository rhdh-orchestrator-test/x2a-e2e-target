---
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ username }}  {{ full_name }}  {{ email }}  "{{ password }}"  --filename {{ chef_automate_user_key_path }}

      '
  args:
    creates: "{{ chef_automate_user_key_path }}"
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ org_short_name }}  "{{ org_full_name }}"  --association_user {{ username }}  --filename {{ chef_automate_org_validator_key_path
      }}

      '
  args:
    creates: "{{ chef_automate_org_validator_key_path }}"
  become: true
