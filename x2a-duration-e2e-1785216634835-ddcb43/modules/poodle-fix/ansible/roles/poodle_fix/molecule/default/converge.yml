- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache mods-available
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create mock Apache SSL configuration file
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file for testing

        # Original line that will be replaced by the role

        SSLProtocol all -SSLv3

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Mock package installation for Apache
    ansible.builtin.debug:
      msg: Mocking Apache installation
  - name: Mock package installation for SSH server
    ansible.builtin.debug:
      msg: Mocking SSH server installation
  - name: Apply poodle_fix task (Fix SSL in Apache)
    ansible.builtin.replace:
      path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
      mode: '0644'
    register: ssl_config_update
    changed_when: ssl_config_update.changed
