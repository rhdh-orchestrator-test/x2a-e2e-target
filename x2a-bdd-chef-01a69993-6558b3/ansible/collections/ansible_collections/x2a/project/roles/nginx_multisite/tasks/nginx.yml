---
- name: Install Nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Ensure Nginx service user exists
  ansible.builtin.user:
    name: nginx
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Render Nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Render Nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create Nginx secrets directory
  ansible.builtin.file:
    path: /etc/nginx/secrets
    owner: root
    group: root
    mode: "0700"
    state: directory

- name: Write Nginx site token # noqa: L039 - token is a required role parameter supplied by the AAP credential type
  ansible.builtin.copy:
    content: "{{ token }}"
    dest: /etc/nginx/secrets/site_token
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Create site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dictionary
    owner: nginx
    group: nginx
    mode: "0755"
    state: directory
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site

- name: Deploy site index pages
  ansible.builtin.copy:
    src: "{{ item_nginx_site['value']['site_folder'] | default(item_nginx_site['key'].split('.')[0]) }}/index.html" # noqa: R114 - role-defined site content path
    dest: "{{ item_nginx_site['value']['document_root'] }}/index.html" # noqa: R114 - path from role-defined sites dictionary
    owner: nginx
    group: nginx
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site
