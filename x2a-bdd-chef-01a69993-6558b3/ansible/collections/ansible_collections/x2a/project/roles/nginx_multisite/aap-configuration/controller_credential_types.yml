---
controller_credential_types:
  - name: Custom Secret Store Nginx Site Token
    description: Secret token referenced as site_secret['token'] and deployed to the Nginx host for site-related use. The original provider is unknown and 
      migration guidance requires Ansible Vault or an approved secret manager.
    kind: cloud
    inputs:
      fields:
        - id: token
          type: string
          label: Site Token
          secret: true
          help_text: Secret token used for Nginx site-related operations and written to the protected site_token file.
      required:
        - token
    injectors:
      extra_vars:
        token: !unsafe "{{ token }}"
