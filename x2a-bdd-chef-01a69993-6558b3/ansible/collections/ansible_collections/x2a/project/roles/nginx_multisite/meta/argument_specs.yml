---
argument_specs:
  main:
    short_description: Configures nginx with multiple SSL-enabled subdomains
    description:
      - Installs and configures Nginx, Fail2ban, UFW, SSH hardening, and site-specific TLS.
    options:
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for site certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW rules and activation are applied.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether root SSH login is disabled.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_sites:
        type: dict
        required: false
        default: {}
        description: Mapping of site names to document root, content, and TLS settings.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks handling the site token.
      token:
        type: str
        required: true
        description: Site token injected by an AAP credential type.
