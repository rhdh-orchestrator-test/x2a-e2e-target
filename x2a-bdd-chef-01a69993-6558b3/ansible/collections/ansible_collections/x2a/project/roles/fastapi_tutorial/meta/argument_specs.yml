---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application
    description:
      - Deploys the FastAPI tutorial application and its local PostgreSQL database.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout and working directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_service_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by the FastAPI service.
      fastapi_tutorial_db_username:
        type: str
        required: false
        default: "{{ db_username }}"
        description: PostgreSQL application username supplied by the AAP credential.
      fastapi_tutorial_database_name:
        type: str
        required: false
        default: "{{ database_name }}"
        description: PostgreSQL database name supplied by the AAP credential.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: "{{ database_host }}"
        description: PostgreSQL database host supplied by the AAP credential.
      fastapi_tutorial_database_url:
        type: str
        required: false
        default: "{{ database_url }}"
        description: Database connection URL supplied by the AAP credential.
      fastapi_tutorial_db_password:
        type: str
        required: false
        default: "{{ db_password }}"
        description: PostgreSQL password supplied by the AAP credential.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations that handle database secrets.
