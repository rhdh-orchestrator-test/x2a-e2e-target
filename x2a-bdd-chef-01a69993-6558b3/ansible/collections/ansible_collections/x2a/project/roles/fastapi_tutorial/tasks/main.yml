---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Set RedHat-family package list
  ansible.builtin.set_fact:
    fastapi_tutorial_packages:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Set Debian-family package list
  ansible.builtin.set_fact:
    fastapi_tutorial_packages:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
  when: ansible_facts['os_family'] not in ['RedHat', 'Fedora']

- name: Install application and database packages  # noqa: R113 - package list is fixed by the role for the detected OS family
  ansible.builtin.package:  # noqa: R113 - package list is fixed by the role for the detected OS family
    name: "{{ fastapi_tutorial_packages }}"  # noqa: R113 - package list is fixed by the role for the detected OS family
    state: present

- name: Initialize PostgreSQL on RedHat-family systems
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - role default path
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository  # noqa: R104,R106 - repository is a trusted role default and is intentionally configurable
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - role default path
    version: "{{ fastapi_tutorial_revision }}"
    force: true

- name: Create Python virtual environment  # noqa: R101 - command arguments use the trusted role default application path
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_app_path }}/venv"
    creates: "{{ fastapi_tutorial_app_path }}/venv" # noqa: R114 - role default path

- name: Install Python dependencies  # noqa: R113 - dependency paths are fixed by the trusted role default application path
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt" # noqa: R114 - role default path
    executable: "{{ fastapi_tutorial_app_path }}/venv/bin/pip" # noqa: R114 - role default path

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL application user  # noqa: R101,R108 - psql must run as the postgres account and SQL uses the configured database credentials
  ansible.builtin.shell:
    cmd: |
      psql -v ON_ERROR_STOP=1 -d postgres -c "DO $$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '{{ fastapi_tutorial_db_username }}') THEN
        CREATE ROLE \"{{ fastapi_tutorial_db_username }}\" LOGIN PASSWORD '{{ fastapi_tutorial_db_password }}';
      ELSE
        ALTER ROLE \"{{ fastapi_tutorial_db_username }}\" LOGIN PASSWORD '{{ fastapi_tutorial_db_password }}';
      END IF;
      END $$;"
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL application database  # noqa: R101,R108 - psql uses configured database values and must run as the postgres account
  ansible.builtin.shell:
    cmd: |
      psql -v ON_ERROR_STOP=1 -d postgres -c "SELECT format('CREATE DATABASE %I OWNER %I',
      '{{ fastapi_tutorial_database_name }}', '{{ fastapi_tutorial_db_username }}')
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ fastapi_tutorial_database_name }}')\gexec"
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant PostgreSQL database privileges  # noqa: R101,R108 - psql must run as the postgres account and targets the configured database
  ansible.builtin.shell:
    cmd: >-
      psql -v ON_ERROR_STOP=1 -d "{{ fastapi_tutorial_database_name }}" -c
      "GRANT ALL PRIVILEGES ON DATABASE \"{{ fastapi_tutorial_database_name }}\" TO
      \"{{ fastapi_tutorial_db_username }}\";"
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy application environment configuration
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL={{ fastapi_tutorial_database_url }}
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - role default path
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_app_path }}/venv/bin"
      ExecStart={{ fastapi_tutorial_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before starting FastAPI
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
