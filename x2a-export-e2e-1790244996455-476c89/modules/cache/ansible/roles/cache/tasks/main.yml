---
# Cache role main tasks

- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Create redis group
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    system: true
    state: present

- name: Create redis user
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    group: "{{ cache_redis_group }}"
    state: present

- name: Install memcached and redis packages
  ansible.builtin.package:
    name:
      - memcached
      - redis-server
    state: present

- name: Create Redis configuration directory
  ansible.builtin.file:
    path: /etc/redis
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create Redis runtime directory
  ansible.builtin.file:
    path: /var/run/redis
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}" # noqa: R114 - path from role defaults
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory

- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0640"
    backup: true
  notify: Restart redis

- name: Remove deprecated Redis configuration settings
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults
    regexp: ^{{ item_setting }}.*$ # noqa: R114,R115 - loop over role-defined deprecated settings list
    state: absent
    backup: true
  loop: "{{ cache_redis_deprecated_settings }}"
  loop_control:
    loop_var: item_setting
  notify: Reload redis config

- name: Start and enable memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true

- name: Start and enable redis service
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
