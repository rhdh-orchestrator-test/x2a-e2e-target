---
# Unsupported pre-flight diagnostics omitted: unbounded package listings, process/log output,
# complete systemd/curl output, and checks whose commands do not state an expected result.
- name: Verify fastapi-tutorial pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify required command-line tools are available
      ansible.builtin.command:
        argv:
          - "{{ item_tool }}"
          - "--version"
      loop:
        - python3
        - pip3
        - git
      loop_control:
        loop_var: item_tool
      register: tool_versions
      changed_when: false

    - name: Assert required command-line tools are available
      ansible.builtin.assert:
        that:
          - item_tool_version['rc'] == 0
        quiet: true
      loop: "{{ tool_versions['results'] }}"
      loop_control:
        loop_var: item_tool_version

    - name: Verify PostgreSQL is active
      ansible.builtin.service_facts:

    - name: Assert PostgreSQL service is active
      ansible.builtin.assert:
        that:
          - "'postgresql.service' in ansible_facts['services']"
          - ansible_facts['services']['postgresql.service']['state'] == 'running'
        quiet: true

    - name: Verify PostgreSQL accepts a local query
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - -c
          - SELECT version();
      register: postgresql_query
      changed_when: false

    - name: Assert PostgreSQL accepts a local query
      ansible.builtin.assert:
        that:
          - postgresql_query['rc'] == 0
        quiet: true

    - name: Verify application directory metadata
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: application_directory

    - name: Assert application directory exists with expected metadata
      ansible.builtin.assert:
        that:
          - application_directory['stat']['exists']
          - application_directory['stat']['isdir']
          - application_directory['stat']['pw_name'] == 'root'
          - application_directory['stat']['gr_name'] == 'root'
          - application_directory['stat']['mode'] == '0755'
        quiet: true

    - name: Verify application requirements file exists
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/requirements.txt
      register: requirements_file

    - name: Assert application requirements file exists
      ansible.builtin.assert:
        that:
          - requirements_file['stat']['exists']
          - requirements_file['stat']['isreg']
        quiet: true

    - name: Verify virtual environment executables
      ansible.builtin.stat:
        path: "{{ item_venv_executable }}"
      loop:
        - /opt/fastapi-tutorial/venv/bin/python
        - /opt/fastapi-tutorial/venv/bin/pip
        - /opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_venv_executable
      register: virtual_environment_executables

    - name: Assert virtual environment executables are executable
      ansible.builtin.assert:
        that:
          - item_venv_executable['stat']['exists']
          - item_venv_executable['stat']['isreg']
          - item_venv_executable['stat']['executable']
        quiet: true
      loop: "{{ virtual_environment_executables['results'] }}"
      loop_control:
        loop_var: item_venv_executable

    - name: Verify the virtual environment Python version command
      ansible.builtin.command:
        argv:
          - /opt/fastapi-tutorial/venv/bin/python
          - --version
      register: virtualenv_python_version
      changed_when: false

    - name: Assert the virtual environment Python is usable
      ansible.builtin.assert:
        that:
          - virtualenv_python_version['rc'] == 0
        quiet: true

    - name: Verify the installed application can be imported
      ansible.builtin.command:
        argv:
          - /opt/fastapi-tutorial/venv/bin/python
          - -c
          - from app.main import app; print(app)
        chdir: /opt/fastapi-tutorial
      register: application_import
      changed_when: false

    - name: Assert the FastAPI application can be imported
      ansible.builtin.assert:
        that:
          - application_import['rc'] == 0
        quiet: true

    - name: Verify PostgreSQL application role exists
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - -tAc
          - SELECT rolname FROM pg_roles WHERE rolname = 'fastapi';
      register: application_role
      changed_when: false

    - name: Assert PostgreSQL application role exists
      ansible.builtin.assert:
        that:
          - application_role['rc'] == 0
          - application_role['stdout'] | trim == 'fastapi'
        quiet: true

    - name: Verify PostgreSQL application database exists
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - -tAc
          - SELECT datname FROM pg_database WHERE datname = 'fastapi_db';
      register: application_database
      changed_when: false

    - name: Assert PostgreSQL application database exists
      ansible.builtin.assert:
        that:
          - application_database['rc'] == 0
          - application_database['stdout'] | trim == 'fastapi_db'
        quiet: true

    - name: Verify PostgreSQL application database owner
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - postgres
          - --
          - psql
          - -tAc
          - SELECT pg_catalog.pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'fastapi_db';
      register: application_database_owner
      changed_when: false

    - name: Assert PostgreSQL application database owner
      ansible.builtin.assert:
        that:
          - application_database_owner['rc'] == 0
          - application_database_owner['stdout'] | trim == 'fastapi'
        quiet: true

    - name: Verify environment file exists
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/.env
      register: environment_file

    - name: Assert environment file exists
      ansible.builtin.assert:
        that:
          - environment_file['stat']['exists']
          - environment_file['stat']['isreg']
        quiet: true

    - name: Verify non-secret environment values
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - '^(PROJECT_NAME="FastAPI Tutorial"|API_VERSION=1\.0\.0)$'
          - /opt/fastapi-tutorial/.env
      register: environment_values
      changed_when: false

    - name: Assert non-secret environment values are present
      ansible.builtin.assert:
        that:
          - environment_values['rc'] == 0
        quiet: true

    - name: Verify environment database URL shape without exposing its credential
      ansible.builtin.command:
        argv:
          - grep
          - -Eq
          - '^DATABASE_URL=postgresql://[^:]+:[^@]+@localhost/fastapi_db$'
          - /opt/fastapi-tutorial/.env
      register: environment_database_url
      changed_when: false

    - name: Assert environment database URL points to the application database
      ansible.builtin.assert:
        that:
          - environment_database_url['rc'] == 0
        quiet: true

    - name: Verify systemd unit file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/fastapi-tutorial.service
      register: application_unit

    - name: Assert systemd unit file exists
      ansible.builtin.assert:
        that:
          - application_unit['stat']['exists']
          - application_unit['stat']['isreg']
        quiet: true

    - name: Verify systemd unit syntax
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/fastapi-tutorial.service
      register: systemd_unit_syntax
      changed_when: false

    - name: Assert systemd unit syntax is valid
      ansible.builtin.assert:
        that:
          - systemd_unit_syntax['rc'] == 0
        quiet: true

    - name: Verify FastAPI service is active
      ansible.builtin.service_facts:

    - name: Assert FastAPI service remains active after startup
      ansible.builtin.assert:
        that:
          - "'fastapi-tutorial.service' in ansible_facts['services']"
          - ansible_facts['services']['fastapi-tutorial.service']['state'] == 'running'
        quiet: true

    - name: Verify FastAPI endpoint is listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8000
        state: started
        timeout: 10
