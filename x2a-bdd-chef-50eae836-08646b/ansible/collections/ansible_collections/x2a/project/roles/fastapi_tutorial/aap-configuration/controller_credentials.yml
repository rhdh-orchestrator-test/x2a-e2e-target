---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Database connection credential for the FastAPI application, migrated from a hardcoded PostgreSQL password in the Chef recipe and .env file.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      db_host: "{{ db_host }}"
      db_name: "{{ db_name }}"
