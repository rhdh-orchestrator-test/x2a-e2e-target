---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application
    description:
      - Deploys the FastAPI tutorial from Git, configures its Python virtual environment, PostgreSQL database, and systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Filesystem path where the application is checked out.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_service_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which the FastAPI service listens.
      fastapi_tutorial_db_username:
        type: str
        required: false
        default: "{{ db_username }}"
        description: PostgreSQL username supplied by the AAP credential type.
      fastapi_tutorial_db_password:
        type: str
        required: false
        default: "{{ db_password }}"
        description: PostgreSQL password supplied by the AAP credential type.
      fastapi_tutorial_db_host:
        type: str
        required: false
        default: "{{ db_host }}"
        description: PostgreSQL host supplied by the AAP credential type.
      fastapi_tutorial_db_name:
        type: str
        required: false
        default: "{{ db_name }}"
        description: PostgreSQL database name supplied by the AAP credential type.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks handling the database password.
