---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Database connection credential for the FastAPI application, migrated from a hardcoded PostgreSQL password in the Chef recipe and .env file.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; use a vaulted or AAP-managed secret.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server, currently localhost.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application, currently fastapi_db.
      required:
        - db_username
        - db_password
        - db_host
        - db_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_host: !unsafe "{{ db_host }}"
        db_name: !unsafe "{{ db_name }}"
