---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml

- name: Configure Redis cache  # noqa: L038 - external eloy.redis role is declared in requirements.yml and is unavailable to the static checker
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: 6379
    redis_requirepass: "{{ redis_password }}"
    redis_base_piddir: /run/redis
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Create Redis PID directory
  ansible.builtin.file:
    path: /run/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Remove unsupported Redis replication directives
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf # noqa: R114 - fixed configuration path from the source recipe
    regexp: "{{ item_cache_directive }}"
    state: absent
  loop:
    - ^replica-serve-stale-data.*$
    - ^replica-read-only.*$
    - ^repl-ping-replica-period.*$
    - ^client-output-buffer-limit.*$
    - ^replica-priority.*$
  loop_control:
    loop_var: item_cache_directive
  notify: Restart Redis
