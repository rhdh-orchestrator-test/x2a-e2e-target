---
argument_specs:
  main:
    short_description: Install and configure nginx as a secure multisite web server
    description:
      - Installs nginx, Fail2ban, UFW, and SSL dependencies.
      - Configures secure nginx virtual hosts and self-signed certificates for defined sites.
    options:
      nginx_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for site certificates.
      nginx_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for site private keys.
      security_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban should be enabled.
      security_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW should be enabled.
      security_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether SSH root login should be disabled.
      security_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide sensitive task output by default.
      nginx_sites:
        type: dict
        required: false
        default: {}
        description: Mapping of site names to id, document_root, and ssl_enabled values.
      site_token:
        type: str
        required: true
        description: Token injected by an AAP credential type for nginx site access.
