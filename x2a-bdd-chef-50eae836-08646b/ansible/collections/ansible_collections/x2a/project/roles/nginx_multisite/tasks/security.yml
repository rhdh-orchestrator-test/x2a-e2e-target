---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
      - "{{ 'procps-ng' if ansible_facts.os_family == 'RedHat' else 'procps' }}"
    state: present

- name: Ensure fail2ban is enabled and started
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: security_fail2ban_enabled | bool

- name: Deploy fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: security_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Check UFW status
  ansible.builtin.command:
    argv: [ufw, status]
  register: nginx_multisite_ufw_status
  changed_when: false
  check_mode: false
  when: security_ufw_enabled | bool

- name: Set UFW default incoming policy  # noqa: L039 - status is registered by the preceding UFW check
  ansible.builtin.command:
    argv: [ufw, --force, default, deny]
  when:
    - security_ufw_enabled | bool
    - "'Default: deny (incoming)' not in nginx_multisite_ufw_status.stdout"

- name: Allow SSH through UFW  # noqa: L039 - status is registered by the preceding UFW check
  ansible.builtin.command:
    argv: [ufw, allow, ssh]
  when:
    - security_ufw_enabled | bool
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTP through UFW  # noqa: L039 - status is registered by the preceding UFW check
  ansible.builtin.command:
    argv: [ufw, allow, http]
  when:
    - security_ufw_enabled | bool
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTPS through UFW  # noqa: L039 - status is registered by the preceding UFW check
  ansible.builtin.command:
    argv: [ufw, allow, https]
  when:
    - security_ufw_enabled | bool
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Enable UFW  # noqa: L039 - status is registered by the preceding UFW check
  ansible.builtin.command:
    argv: [ufw, --force, enable]
  when:
    - security_ufw_enabled | bool
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"

- name: Deploy kernel security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    state: present
    backup: true
  when: security_ssh_disable_root | bool
  notify: Restart sshd

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    state: present
    backup: true
  when: not (security_ssh_password_auth | bool)
  notify: Restart sshd
