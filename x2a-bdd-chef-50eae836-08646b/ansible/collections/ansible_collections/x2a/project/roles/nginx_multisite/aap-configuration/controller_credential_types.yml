---
controller_credential_types:
  - name: Nginx Site Token
    description: Token stored in the Chef encrypted data bag item nginx_secrets/site and deployed to the Nginx secret file.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Site Token
          secret: true
          help_text: Secret token written to /etc/nginx/secrets/site_token for Nginx site configuration or content.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
