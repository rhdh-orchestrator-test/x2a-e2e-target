---
- name: Create nginx sites directories
  ansible.builtin.file:
    path: "{{ item_nginx_sites_dir }}"  # noqa: R114 - loop over role-defined fixed nginx site directories
    owner: root
    group: root
    mode: "0755"
    state: directory
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
  loop_control:
    loop_var: item_nginx_sites_dir

- name: Render nginx site configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item_nginx_site.value.id }}"  # noqa: R114 - path comes from role-defined sites data
    mode: "0644"
    backup: true
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site
  notify: Reload nginx
  vars:
    server_name: "{{ item_nginx_site.value.id }}"
    document_root: "{{ item_nginx_site.value.document_root }}"
    ssl_enabled: "{{ item_nginx_site.value.ssl_enabled }}"
    cert_file: "{{ nginx_ssl_certificate_path }}/{{ item_nginx_site.value.id }}.crt"
    key_file: "{{ nginx_ssl_private_key_path }}/{{ item_nginx_site.value.id }}.key"

- name: Enable nginx sites
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item_nginx_link.value.id }}"
    dest: "/etc/nginx/sites-enabled/{{ item_nginx_link.value.id }}"  # noqa: R114 - path comes from role-defined sites data
    state: link
    owner: root
    group: root
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_link
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
