---
argument_specs:
  main:
    short_description: Configure Memcached and a standalone Redis cache service
    description:
      - Installs and configures Memcached with the requested listener and resource limits.
      - Configures Redis on port 6379 through the eloy.redis Private Hub role.
    options:
      memcached_version:
        type: str
        required: false
        default:
        description: Optional Memcached package version.
      memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory limit in megabytes.
      memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached connections.
      memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Experimental Memcached command-line options.
      memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional Memcached command-line options.
      memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: File descriptor limit for Memcached.
      memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log directory.
      memcached_service_user:
        type: str
        required: false
        default: memcached
        description: Memcached service account.
      memcached_service_group:
        type: str
        required: false
        default: memcached
        description: Memcached service group.
      memcached_threads:
        type: int
        required: false
        default:
        description: Optional Memcached worker thread count.
      redis_port:
        type: int
        required: false
        default: 6379
        description: Redis TCP port.
      redis_base_piddir:
        type: str
        required: false
        default: /run/redis
        description: Redis PID directory.
      redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      redis_service_name:
        type: str
        required: false
        default: redis
        description: Redis service unit name.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide tasks that handle the AAP-injected Redis password.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
