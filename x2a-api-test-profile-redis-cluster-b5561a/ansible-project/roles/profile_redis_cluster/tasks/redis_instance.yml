---
- name: Deploy Redis configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    mode: "0640"
    owner: redis
    group: redis
    backup: true
  notify: Restart Redis service
- name: Deploy Redis systemd service
  ansible.builtin.template:
    src: redis.service.j2
    dest: /etc/systemd/system/redis.service
    mode: "0644"
    backup: true
  notify:
    - Reload systemd daemon
    - Restart Redis service
- name: Ensure Redis configuration is active
  ansible.builtin.copy:
    src: /etc/redis/redis.conf
    dest: /etc/redis/redis.conf.active
    remote_src: true
    mode: "0640"
    owner: redis
    group: redis
  when: not ansible_check_mode
