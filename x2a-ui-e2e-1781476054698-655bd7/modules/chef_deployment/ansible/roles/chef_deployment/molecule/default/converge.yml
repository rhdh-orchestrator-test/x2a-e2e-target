---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    user_full_name: "John Tonello"
    user_email: jtonello@example.com
    user_password: password
    chef_hostname: automate.chef.lab
    chef_vm_max_map_count: 262144
    chef_vm_dirty_expire_centisecs: 20000
    chef_org_name: lab
    chef_org_long_name: Chef Lab
    chef_user_filename: "jtonello.pem"
    chef_org_filename: "lab-validator.pem"
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/molecule

    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    - name: Create mock Chef Automate CLI
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI mock"
          echo "Version: 1.0.0"
        dest: /tmp/molecule_test/home/molecule/chef-automate
        mode: "0755"

    - name: Create mock user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefghijklmnopq
          rstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefg
          hijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ12345678
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/home/molecule/{{ chef_user_filename }}
        mode: "0600"

    - name: Create mock organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          ZYXWVUTSRQPONMLKJIHGFEDCBA0987654321zyxwvutsrqponmlk
          jihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA0987654321zyxwvu
          tsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA09876543
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/home/molecule/{{ chef_org_filename }}
        mode: "0600"

    - name: Create mock sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = {{ chef_vm_max_map_count }}
          vm.dirty_expire_centisecs = {{ chef_vm_dirty_expire_centisecs }}
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-deployment.conf
        mode: "0644"

    - name: Create mock Chef Automate status output
      ansible.builtin.copy:
        content: |
          Service: automate-cs-bookshelf
            Status: running
          Service: automate-cs-oc-bifrost
            Status: running
          Service: automate-cs-oc-erchef
            Status: running
          Service: automate-cs-nginx
            Status: running
          Service: automate-postgresql
            Status: running
          Service: automate-elasticsearch
            Status: running
        dest: /tmp/molecule_test/home/molecule/chef-automate-status.txt
        mode: "0644"

    - name: Create mock Chef Server user list output
      ansible.builtin.copy:
        content: |
          jtonello
        dest: /tmp/molecule_test/home/molecule/chef-server-user-list.txt
        mode: "0644"

    - name: Create mock Chef Server org list output
      ansible.builtin.copy:
        content: |
          lab
        dest: /tmp/molecule_test/home/molecule/chef-server-org-list.txt
        mode: "0644"