---
controller_credential_types:
- name: Chef User Password
  description: Credential type for Chef User Password
  kind: cloud
  inputs:
    fields:
    - id: user_password
      type: string
      label: User Password
      secret: true
      help_text: Password for creating the initial Chef user
    - id: username
      type: string
      label: Username
      help_text: Username for the initial Chef user
    - id: user_email
      type: string
      label: User Email
      help_text: Email address for the initial Chef user
    - id: user_full_name
      type: string
      label: User Full Name
      help_text: Full name for the initial Chef user
    required:
    - user_password
    - username
  injectors:
    extra_vars:
      user_password: !unsafe '{{ user_password }}'
      username: !unsafe '{{ username }}'
      user_email: !unsafe '{{ user_email }}'
      user_full_name: !unsafe '{{ user_full_name }}'
