---
controller_credential_types:
- name: Chef User Credentials
  description: User credentials for Chef Automate and Chef Infra Server
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef user account username
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Chef user account password
    - id: email
      type: string
      label: Email
      help_text: Email address associated with the Chef user account
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
- name: Chef Organization Validator
  description: Organization validator credentials for Chef Infra Server
  kind: cloud
  inputs:
    fields:
    - id: organization_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: organization_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name for the Chef organization
    - id: validator_key
      type: string
      label: Validator Key
      secret: true
      help_text: PEM file content for organization validator
    required:
    - organization_name
    - validator_key
  injectors:
    extra_vars:
      organization_name: !unsafe '{{ organization_name }}'
      organization_full_name: !unsafe '{{ organization_full_name }}'
      validator_key: !unsafe '{{ validator_key }}'
