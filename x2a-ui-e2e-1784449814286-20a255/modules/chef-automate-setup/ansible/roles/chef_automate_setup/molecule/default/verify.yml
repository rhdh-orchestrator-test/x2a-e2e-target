---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Verify system hostname
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Verify kernel parameters
    - name: Check vm.max_map_count file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_file

    - name: Assert vm.max_map_count file was created
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
        fail_msg: "vm.max_map_count file not found"
        success_msg: "vm.max_map_count file exists"

    - name: Get vm.max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "262144"
        fail_msg: "vm.max_map_count not set correctly"
        success_msg: "vm.max_map_count set correctly"
      when: max_map_count_file.stat.exists

    - name: Check vm.dirty_expire_centisecs file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_file

    - name: Assert vm.dirty_expire_centisecs file was created
      ansible.builtin.assert:
        that:
          - dirty_expire_file.stat.exists
        fail_msg: "vm.dirty_expire_centisecs file not found"
        success_msg: "vm.dirty_expire_centisecs file exists"

    - name: Get vm.dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_content
      when: dirty_expire_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_content.content | b64decode | trim) == "20000"
        fail_msg: "vm.dirty_expire_centisecs not set correctly"
        success_msg: "vm.dirty_expire_centisecs set correctly"
      when: dirty_expire_file.stat.exists

    # Verify Chef Automate CLI
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI was created
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Verify Chef deployment
    - name: Check hab directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: hab_dir

    - name: Assert hab directory was created
      ansible.builtin.assert:
        that:
          - hab_dir.stat.exists
          - hab_dir.stat.isdir
        fail_msg: "hab directory not found"
        success_msg: "hab directory exists"

    # Verify user PEM file
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/testuser.pem
      register: user_pem

    - name: Assert user PEM file was created
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.size > 0
        fail_msg: "User PEM file not found"
        success_msg: "User PEM file exists"

    # Verify organization validator PEM file
    - name: Check organization validator PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/testorg-validator.pem
      register: org_pem

    - name: Assert organization validator PEM file was created
      ansible.builtin.assert:
        that:
          - org_pem.stat.exists
          - org_pem.stat.size > 0
        fail_msg: "Organization validator PEM file not found"
        success_msg: "Organization validator PEM file exists"

    # System requirement checks (these would normally be skipped in container)
    - name: Check CPU resources
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/cpuinfo
      register: cpuinfo_file
      tags: molecule-notest

    - name: Count processors in mock cpuinfo
      ansible.builtin.shell: grep -c processor /tmp/molecule_test/proc/cpuinfo
      register: cpu_count
      changed_when: false
      when: cpuinfo_file.stat.exists
      tags: molecule-notest

    - name: Assert CPU requirements
      ansible.builtin.assert:
        that: cpu_count.stdout | int >= 4
        fail_msg: "System requires at least 4 CPU cores"
        success_msg: "System has adequate CPU resources"
      when: cpuinfo_file.stat.exists
      tags: molecule-notest

    # Service checks (would be skipped in container)
    - name: Check Chef Automate services
      ansible.builtin.command: systemctl status hab-sup
      register: chef_service
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that: chef_service.rc == 0
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    # Network connectivity check (would be skipped in container)
    - name: Check network connectivity to Chef packages
      ansible.builtin.uri:
        url: https://packages.chef.io
        timeout: 5
      register: chef_connectivity
      failed_when: false
      tags: molecule-notest

    - name: Verify Chef packages connectivity
      ansible.builtin.assert:
        that: chef_connectivity.status == 200
        fail_msg: "Cannot connect to Chef package repository"
        success_msg: "Successfully connected to Chef package repository"
      tags: molecule-notest