---
controller_credentials:
- name: Chef User Credentials - chef_automate_setup
  description: User credentials for Chef Automate and Chef Infra Server
  organization: Default
  credential_type: Chef User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    email: '{{ email }}'
- name: Chef Organization Validator - chef_automate_setup
  description: Organization validator credentials for Chef Infra Server
  organization: Default
  credential_type: Chef Organization Validator
  update_secrets: true
  inputs:
    organization_name: '{{ organization_name }}'
    organization_full_name: '{{ organization_full_name }}'
    validator_key: '{{ vault_validator_key }}'
