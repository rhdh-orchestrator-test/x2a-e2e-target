- name: Set system hostname
  ansible.builtin.hostname:
    name: '{{ chef_automate_hostname }}'
  become: true
- name: Configure kernel parameters
  ansible.posix.sysctl:
    name: '{{ item.key }}'
    value: '{{ item.value }}'
    state: present
    sysctl_set: true
  loop: '{{ chef_automate_kernel_params | dict2items }}'
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: '{{ chef_automate_cli_url }}'
    dest: '{{ chef_automate_cli_path }}.zip'
    mode: '0644'
  become: true
- name: Check if Chef Automate CLI exists
  ansible.builtin.stat:
    path: '{{ chef_automate_cli_path }}'
  register: automate_cli_stat
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.shell: gunzip < {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
  args:
    creates: '{{ chef_automate_cli_path }}'
  become: true
  when: not automate_cli_stat.stat.exists
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: '{{ chef_automate_cli_path }}'
    mode: '0755'
  become: true
- name: Deploy Chef Automate and Infra Server
  ansible.builtin.command: '{{ chef_automate_cli_path }} deploy  --product automate  --product infra-server  --accept-terms-and-mlsa={{ chef_automate_accept_terms
    | lower }} '
  args:
    creates: /hab
  register: deploy_result
  become: true
- name: Display deployment output
  ansible.builtin.debug:
    var: deploy_result.stdout_lines
  when: deploy_result.stdout_lines is defined
- name: Ensure directory exists for PEM files
  ansible.builtin.file:
    path: '{{ chef_automate_user_pem_path | dirname }}'
    state: directory
    mode: '0755'
  become: true
  when: chef_automate_user_pem_path | dirname != '/'
- name: Create Chef user
  ansible.builtin.command: 'chef-server-ctl user-create  {{ username }}  {{ email.split(''@'')[0] | title }}  {{ email }}  "{{ password }}"  --filename {{ chef_automate_user_pem_path
    }}

    '
  args:
    creates: '{{ chef_automate_user_pem_path }}'
  become: true
- name: Create Chef organization
  ansible.builtin.command: 'chef-server-ctl org-create  {{ organization_name }}  "{{ organization_full_name }}"  --association_user {{ username }}  --filename {{
    chef_automate_org_pem_path }}

    '
  args:
    creates: '{{ chef_automate_org_pem_path }}'
  become: true
