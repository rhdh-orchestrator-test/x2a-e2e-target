---
- name: Ensure SSH server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present
- name: Fix SSL in Apache
  ansible.builtin.replace:
    path: /etc/apache2/mods-available/ssl.conf
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol -all +TLSv1.2
  notify:
    - Restart apache
