---
apache_package_version: 2.4.41-4ubuntu3.10
apache_ssl_cert_dir: /etc/apache2/certs
apache_ssl_cert_file: "{{ apache_ssl_cert_dir }}/apache.crt"
apache_ssl_key_file: "{{ apache_ssl_cert_dir }}/apache.key"
apache_ssl_csr_file: "{{ apache_ssl_cert_dir }}/apache.csr"
website_hostname: myhost
website_docroot: /var/www/helloworld
website_conf_file: /etc/apache2/sites-available/helloworld.conf
ssl_protocols: -all +TLSv1.2
