---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check Apache configuration files
    - name: Check Apache virtual host configuration exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      register: vhost_config

    - name: Assert virtual host configuration exists
      ansible.builtin.assert:
        that:
          - vhost_config.stat.exists
          - vhost_config.stat.size > 0
        fail_msg: "Virtual host configuration file not found"
        success_msg: "Virtual host configuration file exists"

    - name: Check virtual host is enabled
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
      register: vhost_enabled

    - name: Assert virtual host is enabled
      ansible.builtin.assert:
        that:
          - vhost_enabled.stat.exists
          - vhost_enabled.stat.islnk
        fail_msg: "Virtual host is not enabled"
        success_msg: "Virtual host is enabled"

    # Check SSL certificate files
    - name: Check SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: ssl_files
      loop:
        - /tmp/molecule_test/etc/apache2/certs/apache.key
        - /tmp/molecule_test/etc/apache2/certs/apache.crt
        - /tmp/molecule_test/etc/apache2/certs/apache.csr

    - name: Assert SSL certificate files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "SSL certificate file {{ item.item }} not found"
        success_msg: "SSL certificate file {{ item.item }} exists"
      loop: "{{ ssl_files.results }}"

    # Check website content
    - name: Check website content exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/www/helloworld/index.html
      register: website_content

    - name: Assert website content exists
      ansible.builtin.assert:
        that:
          - website_content.stat.exists
          - website_content.stat.size > 0
        fail_msg: "Website content not found"
        success_msg: "Website content exists"

    # Check website content contains expected text
    - name: Get website content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/www/helloworld/index.html
      register: website_content_data

    - name: Assert website content contains expected text
      ansible.builtin.assert:
        that:
          - "'Hello, world!' in (website_content_data.content | b64decode)"
        fail_msg: "Website content does not contain expected text"
        success_msg: "Website content contains expected text"

    # Check POODLE fix in SSL configuration
    - name: Get SSL configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_config

    - name: Assert POODLE fix is in place
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in (ssl_config.content | b64decode)"
        fail_msg: "POODLE fix not found in SSL configuration"
        success_msg: "POODLE fix found in SSL configuration"

    # Check SSH security configuration
    - name: Get SSH configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_config

    - name: Assert root login is disabled
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (ssh_config.content | b64decode)"
          - "'PermitRootLogin yes' not in (ssh_config.content | b64decode)"
        fail_msg: "SSH root login is not properly disabled"
        success_msg: "SSH root login is properly disabled"

    # The following checks would normally be performed but can't run in a container
    # They are tagged with molecule-notest so they'll be skipped during molecule testing

    - name: Check Apache service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      tags: molecule-notest

    - name: Check HTTPS response
      ansible.builtin.uri:
        url: https://localhost/
        validate_certs: false
        return_content: true
      register: https_response
      tags: molecule-notest

    - name: Assert HTTPS response contains expected content
      ansible.builtin.assert:
        that:
          - "'Hello, world!' in https_response.content"
        fail_msg: "HTTPS response does not contain expected content"
        success_msg: "HTTPS response contains expected content"
      tags: molecule-notest