---
argument_specs:
  main:
    short_description: Deploy the FastAPI tutorial application and PostgreSQL database.
    description:
      - Installs the FastAPI tutorial application from Git and runs it with Uvicorn.
      - Configures PostgreSQL and writes the application database connection environment.
    options:
      fastapi_tutorial_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
        description: System packages required by the application and PostgreSQL.
      fastapi_tutorial_postgresql_service:
        type: str
        required: false
        default: postgresql
        description: PostgreSQL service name.
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: FastAPI systemd service name.
      fastapi_tutorial_service_file:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Systemd unit file path.
      fastapi_tutorial_bind_address:
        type: str
        required: false
        default: 0.0.0.0
        description: Address on which Uvicorn listens.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which Uvicorn listens.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Application project name written to the environment file.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: Application API version written to the environment file.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations handling the database password.
      db_username:
        type: str
        required: true
        description: PostgreSQL username injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: PostgreSQL password injected by an AAP credential type.
      db_name:
        type: str
        required: true
        description: PostgreSQL database name injected by an AAP credential type.
      db_host:
        type: str
        required: true
        description: PostgreSQL host injected by an AAP credential type.
