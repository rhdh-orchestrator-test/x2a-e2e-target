---
# Unsupported pre-flight checks: SSH service status, fail2ban status, kernel values,
# certificate validity dates, log contents, process listings, and diagnostic output
# without an explicit expected result are not asserted here.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather service facts for nginx
      ansible.builtin.service_facts:

    - name: Assert nginx is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts['services']['nginx.service']['state'] == 'running'"
          - "ansible_facts['services']['nginx.service']['status'] == 'enabled'"
        fail_msg: nginx must be enabled and active.

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_config_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - item_nginx_config_test['rc'] == 0
        fail_msg: nginx -t must succeed.

    - name: Inspect nginx configuration for all virtual hosts
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      register: item_nginx_dump
      changed_when: false

    - name: Assert all virtual hosts are configured
      ansible.builtin.assert:
        that:
          - "'test.cluster.local' in item_nginx_dump['stdout']"
          - "'ci.cluster.local' in item_nginx_dump['stdout']"
          - "'status.cluster.local' in item_nginx_dump['stdout']"
        fail_msg: All three nginx virtual hosts must be present in the configuration.

    - name: Check required site files, links, and document roots
      ansible.builtin.stat:
        path: "{{ item_site['path'] }}"
      loop:
        - { path: /opt/server/test, kind: directory }
        - { path: /opt/server/test/index.html, kind: file }
        - { path: /etc/nginx/sites-available/test.cluster.local, kind: file }
        - { path: /etc/nginx/sites-enabled/test.cluster.local, kind: link }
        - { path: /etc/ssl/certs/test.cluster.local.crt, kind: file }
        - { path: /etc/ssl/private/test.cluster.local.key, kind: file }
        - { path: /opt/server/ci, kind: directory }
        - { path: /opt/server/ci/index.html, kind: file }
        - { path: /etc/nginx/sites-available/ci.cluster.local, kind: file }
        - { path: /etc/nginx/sites-enabled/ci.cluster.local, kind: link }
        - { path: /etc/ssl/certs/ci.cluster.local.crt, kind: file }
        - { path: /etc/ssl/private/ci.cluster.local.key, kind: file }
        - { path: /opt/server/status, kind: directory }
        - { path: /opt/server/status/index.html, kind: file }
        - { path: /etc/nginx/sites-available/status.cluster.local, kind: file }
        - { path: /etc/nginx/sites-enabled/status.cluster.local, kind: link }
        - { path: /etc/ssl/certs/status.cluster.local.crt, kind: file }
        - { path: /etc/ssl/private/status.cluster.local.key, kind: file }
      loop_control:
        loop_var: item_site
      register: item_site_paths

    - name: Assert required site files and links exist
      ansible.builtin.assert:
        that:
          - item_site['stat']['exists']
          - "(item_site['item']['kind'] != 'directory') or item_site['stat']['isdir']"
          - "(item_site['item']['kind'] != 'file') or item_site['stat']['isreg']"
          - "(item_site['item']['kind'] != 'link') or item_site['stat']['islnk']"
        fail_msg: A required nginx site path is missing or has the wrong type.
      loop: "{{ item_site_paths['results'] }}"
      loop_control:
        loop_var: item_site

    - name: Check that the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_site['stat']['exists']
        fail_msg: The default nginx site must be absent.

    - name: Verify nginx listens on HTTP and HTTPS
      ansible.builtin.wait_for:
        port: "{{ item_port }}"
        host: 127.0.0.1
        state: started
        timeout: 10
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_port

    - name: Verify HTTP redirects for each site
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_site['host'] }}"
        return_content: false
        follow_redirects: none
      loop:
        - { host: test.cluster.local }
        - { host: ci.cluster.local }
        - { host: status.cluster.local }
      loop_control:
        loop_var: item_site
      register: item_http_redirects

    - name: Assert each HTTP site redirects to HTTPS
      ansible.builtin.assert:
        that:
          - item_site['status'] in [301, 302, 307, 308]
          - item_site['location'] is defined
          - item_site['location'] is match('^https://')
        fail_msg: Each HTTP virtual host must redirect to HTTPS.
      loop: "{{ item_http_redirects['results'] }}"
      loop_control:
        loop_var: item_site

    - name: Verify HTTPS serves each site
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_site['host'] }}"
        validate_certs: false
        status_code: 200
        return_content: false
      loop:
        - { host: test.cluster.local }
        - { host: ci.cluster.local }
        - { host: status.cluster.local }
      loop_control:
        loop_var: item_site

    - name: Inspect private key ownership and mode
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
      loop:
        - { path: /etc/ssl/private/test.cluster.local.key }
        - { path: /etc/ssl/private/ci.cluster.local.key }
        - { path: /etc/ssl/private/status.cluster.local.key }
      loop_control:
        loop_var: item_key
      register: item_key_stats

    - name: Assert private keys have the required ownership and mode
      ansible.builtin.assert:
        that:
          - item_key['stat']['pw_name'] == 'root'
          - item_key['stat']['gr_name'] == 'ssl-cert'
          - item_key['stat']['mode'] == '0640'
        fail_msg: Each TLS private key must be root:ssl-cert with mode 0640.
      loop: "{{ item_key_stats['results'] }}"
      loop_control:
        loop_var: item_key

    - name: Inspect certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_cert['path'] }}"
          - -noout
          - -subject
      loop:
        - { path: /etc/ssl/certs/test.cluster.local.crt, host: test.cluster.local }
        - { path: /etc/ssl/certs/ci.cluster.local.crt, host: ci.cluster.local }
        - { path: /etc/ssl/certs/status.cluster.local.crt, host: status.cluster.local }
      loop_control:
        loop_var: item_cert
      register: item_cert_subjects
      changed_when: false

    - name: Assert each certificate subject contains its site name
      ansible.builtin.assert:
        that:
          - item_cert['rc'] == 0
          - item_cert['stdout'] is search(item_cert['item']['host'])
        fail_msg: Each certificate subject must contain its matching site name.
      loop: "{{ item_cert_subjects['results'] }}"
      loop_control:
        loop_var: item_cert

    - name: Verify TLS 1.2 and TLS 1.3 connections
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - 127.0.0.1:443
          - -servername
          - test.cluster.local
          - "-{{ item_tls }}"
      loop:
        - tls1_2
        - tls1_3
      loop_control:
        loop_var: item_tls
      register: item_tls_connections
      changed_when: false

    - name: Assert TLS 1.2 and TLS 1.3 connections succeed
      ansible.builtin.assert:
        that:
          - item_tls['rc'] == 0
        fail_msg: TLS 1.2 and TLS 1.3 connections must succeed.
      loop: "{{ item_tls_connections['results'] }}"
      loop_control:
        loop_var: item_tls

    - name: Inspect security response headers
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: test.cluster.local
        validate_certs: false
        return_content: false
      register: item_security_headers

    - name: Assert configured security response headers are present
      ansible.builtin.assert:
        that:
          - "'strict-transport-security' in item_security_headers['headers']"
          - "'x-frame-options' in item_security_headers['headers']"
          - "'x-content-type-options' in item_security_headers['headers']"
          - "'referrer-policy' in item_security_headers['headers']"
        fail_msg: Required security response headers must be present.

    - name: Inspect UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: item_ufw_status
      changed_when: false

    - name: Assert UFW has the expected policy and allowed ports
      ansible.builtin.assert:
        that:
          - item_ufw_status['rc'] == 0
          - item_ufw_status['stdout'] is search('Default: deny')
          - item_ufw_status['stdout'] is search('22/tcp')
          - item_ufw_status['stdout'] is search('80/tcp')
          - item_ufw_status['stdout'] is search('443/tcp')
        fail_msg: UFW must use default deny and permit TCP ports 22, 80, and 443.

    - name: Read SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_sshd_config

    - name: Assert SSH root login and password authentication are disabled
      ansible.builtin.assert:
        that:
          - item_sshd_config['content'] | b64decode is search('(?m)^PermitRootLogin\\s+no\\s*$')
          - item_sshd_config['content'] | b64decode is search('(?m)^PasswordAuthentication\\s+no\\s*$')
        fail_msg: SSH must disable root login and password authentication.
