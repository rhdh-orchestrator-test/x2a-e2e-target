---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Create nginx configuration directories
  ansible.builtin.file:
    path: "{{ item_nginx_multisite_nginx_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/nginx/conf.d
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
  loop_control:
    loop_var: item_nginx_multisite_nginx_dir

- name: Deploy nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Deploy nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_multisite_site['value']['document_root'] }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
    recurse: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site

- name: Deploy site index files
  ansible.builtin.copy:
    src: "{{ item_nginx_multisite_site['value']['file_source'] }}"
    dest: "{{ item_nginx_multisite_site['value']['document_root'] }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site
