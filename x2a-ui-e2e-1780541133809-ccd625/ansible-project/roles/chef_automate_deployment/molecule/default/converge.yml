- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/home/ansible
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/bin
    - /tmp/molecule_test/etc/systemd/system
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '262144'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '20000'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create chef-automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI v1.0.0'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create chef-automate binary in PATH
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI v1.0.0'' '
      dest: /tmp/molecule_test/bin/chef-automate
      mode: '0755'
  - name: Create chef-server-ctl binary in PATH
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Server Control v1.0.0'' '
      dest: /tmp/molecule_test/bin/chef-server-ctl
      mode: '0755'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/home/ansible/admin.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/home/ansible/default-validator.pem
      mode: '0600'
  - name: Create chef-automate service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Automate

        After=network.target


        [Service]

        Type=simple

        ExecStart=/hab/bin/chef-automate-ctl start

        ExecStop=/hab/bin/chef-automate-ctl stop

        Restart=on-failure


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      mode: '0644'
