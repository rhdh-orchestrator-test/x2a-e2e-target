---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - unzip
      - gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > chef-automate && chmod +x chef-automate
    stdin: "{{ lookup('ansible.builtin.file', '/tmp/chef-automate.zip') }}"
    chdir: /tmp
    creates: /tmp/chef-automate
  args:
    executable: /bin/bash
- name: Deploy Chef Automate with Automate and Infra Server products
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_license }} "
    chdir: /tmp
    creates: /hab
  become: true
