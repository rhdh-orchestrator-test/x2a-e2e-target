---
chef_automate_hostname: automate.chef.lab
chef_automate_vm_max_map_count: 262144
chef_automate_vm_dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_deploy_automate: true
chef_automate_deploy_infra_server: true
chef_automate_username: "{{ username | default('admin') }}"
chef_automate_longusername: "{{ longusername | default('Administrator') }}"
chef_automate_useremail: "{{ useremail | default('admin@example.com') }}"
chef_automate_userpassword: "{{ password | default('changeme') }}"
chef_automate_orgname: "{{ org_name | default('default') }}"
chef_automate_longorgname: "{{ longorgname | default('Default Organization') }}"
chef_automate_user_key_path: "{{ user_key_path | default('~/') }}{{ chef_automate_username }}.pem"
chef_automate_org_validator_path: "{{ org_validator_path | default('~/') }}{{ chef_automate_orgname }}-validator.pem"
chef_automate_accept_license: "{{ accept_license | default('true') }}"
