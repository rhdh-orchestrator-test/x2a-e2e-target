---
controller_credentials:
- name: Chef Infra Server Admin - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Infra Server Admin
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Chef User PEM - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User PEM
  update_secrets: true
  inputs:
    user_key: '{{ vault_user_key }}'
    user_key_path: '{{ user_key_path }}'
- name: Chef Organization Validator - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Organization Validator
  update_secrets: true
  inputs:
    org_validator_key: '{{ vault_org_validator_key }}'
    org_validator_path: '{{ org_validator_path }}'
    org_name: '{{ org_name }}'
- name: Chef License Acceptance - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef License Acceptance
  update_secrets: true
  inputs:
    accept_license: '{{ accept_license }}'
