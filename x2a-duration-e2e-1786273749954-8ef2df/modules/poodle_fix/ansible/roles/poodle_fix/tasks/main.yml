---
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: apache2
    state: present
- name: Ensure OpenSSH server is installed
  ansible.builtin.package:
    name: openssh-server
    state: present
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: "{{ apache_config_path }}"
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol {{ ssl_protocol }}
  notify:
    - Restart apache2
    - Restart sshd
