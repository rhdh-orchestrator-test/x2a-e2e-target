---
- name: Ensure key file directories exist
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_key_path }}"
    - "{{ chef_automate_org_key_path }}"
- name: Create admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ first_name }} {{ last_name }} {{ email }} "{{ password }}" --filename {{ chef_automate_user_key_path }}
    creates: "{{ chef_automate_user_key_path }}"
  become: true
- name: Create organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_long_name }}" --association_user {{ username }} --filename {{
      chef_automate_org_key_path }}
    creates: "{{ chef_automate_org_key_path }}"
  become: true
