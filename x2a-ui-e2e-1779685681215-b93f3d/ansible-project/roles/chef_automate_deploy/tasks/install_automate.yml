---
- name: Ensure /etc/chef directory exists
  ansible.builtin.file:
    path: /etc/chef
    state: directory
    mode: "0755"
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
  register: chef_automate_download
- name: Extract Chef Automate CLI (if compressed)
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_path }} && chmod +x {{ chef_automate_cli_path }}
  args:
    stdin: "{{ chef_automate_download.content }}"
    creates: "{{ chef_automate_cli_path }}"
  when: chef_automate_download.changed
  become: true
- name: Deploy Chef Automate with selected products
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{ chef_automate_accept_terms
      | lower }}"
  args:
    creates: /etc/systemd/system/chef-automate.service
  become: true
