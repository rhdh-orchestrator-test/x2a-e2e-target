---
- name: Set hostname for Chef Server
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters for Chef Server
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ chef_automate_sysctl_params | dict2items }}"
  become: true
- name: Ensure /etc/chef directory exists
  ansible.builtin.file:
    path: /etc/chef
    state: directory
    mode: "0755"
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
  register: chef_automate_download
- name: Extract Chef Automate CLI (if compressed)
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_path }} && chmod +x {{ chef_automate_cli_path }}
  args:
    stdin: "{{ chef_automate_download.content }}"
    creates: "{{ chef_automate_cli_path }}"
  when: chef_automate_download.changed
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}"
  args:
    creates: /etc/systemd/system/chef-automate.service
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_server_user_key_path }}
  args:
    creates: "{{ chef_server_user_key_path }}"
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_server_org_name }} "{{ chef_server_org_long_name }}" --association_user {{ username }} --filename {{
      chef_server_org_key_path }}
  args:
    creates: "{{ chef_server_org_key_path }}"
  become: true
