- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl settings file
    ansible.builtin.stat:
      path: /tmp/molecule_test/sysctl_settings
    register: sysctl_file
  - name: Assert sysctl file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Sysctl settings file not found
      success_msg: Sysctl settings file exists
  - name: Get sysctl content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/sysctl_settings
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl settings are correct
    ansible.builtin.assert:
      that:
      - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
      - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = 20000')
      fail_msg: Sysctl settings not configured correctly
      success_msg: Sysctl settings configured correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate service file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/systemd/system/chef-automate.service
    register: chef_automate_service
  - name: Assert Chef Automate service file exists
    ansible.builtin.assert:
      that:
      - chef_automate_service.stat.exists
      - chef_automate_service.stat.size > 0
      fail_msg: Chef Automate service file not found
      success_msg: Chef Automate service file exists
  - name: Check Chef Automate service status
    ansible.builtin.command:
      cmd: systemctl status chef-automate
    tags: molecule-notest
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: chef-automate status
    tags: molecule-notest
  - name: Check Chef Server status
    ansible.builtin.command:
      cmd: chef-server-ctl status
    tags: molecule-notest
  - name: Check Chef user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/jtonello.pem
    register: chef_user_key
  - name: Assert Chef user key exists
    ansible.builtin.assert:
      that:
      - chef_user_key.stat.exists
      - chef_user_key.stat.size > 0
      fail_msg: Chef user key file not found
      success_msg: Chef user key file exists
  - name: Check Chef organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/lab-validator.pem
    register: chef_org_key
  - name: Assert Chef organization validator key exists
    ansible.builtin.assert:
      that:
      - chef_org_key.stat.exists
      - chef_org_key.stat.size > 0
      fail_msg: Chef organization validator key file not found
      success_msg: Chef organization validator key file exists
  - name: Check Chef user list
    ansible.builtin.command:
      cmd: chef-server-ctl user-list
    register: chef_user_list
    tags: molecule-notest
  - name: Assert Chef user exists
    ansible.builtin.assert:
      that:
      - '''jtonello'' in chef_user_list.stdout'
      fail_msg: Chef user not found
      success_msg: Chef user exists
    tags: molecule-notest
  - name: Check Chef organization list
    ansible.builtin.command:
      cmd: chef-server-ctl org-list
    register: chef_org_list
    tags: molecule-notest
  - name: Assert Chef organization exists
    ansible.builtin.assert:
      that:
      - '''lab'' in chef_org_list.stdout'
      fail_msg: Chef organization not found
      success_msg: Chef organization exists
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
  - name: Check Chef Automate API
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
    tags: molecule-notest
  - name: Check Chef Automate status endpoint
    ansible.builtin.uri:
      url: https://localhost/_status
      validate_certs: false
    tags: molecule-notest
