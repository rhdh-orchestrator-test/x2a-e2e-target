- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    full_name: John Tonello
    email: jtonello@example.com
    password: password123
    chef_automate_hostname: automate.chef.lab
    chef_server_org_name: lab
    chef_server_org_long_name: Chef Lab
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/etc/systemd/system
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/sysctl_settings
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'''
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Automate

        After=network.target


        [Service]

        Type=simple

        ExecStart=/usr/bin/chef-automate

        Restart=on-failure


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      mode: '0644'
  - name: Create Chef user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA...MOCK KEY...

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/etc/chef/jtonello.pem
      mode: '0600'
  - name: Create Chef organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA...MOCK VALIDATOR KEY...

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/etc/chef/lab-validator.pem
      mode: '0600'
  - name: Create Chef server status file
    ansible.builtin.copy:
      content: 'chef-server-ctl status output

        run: 0

        chef-server: up

        postgresql: up

        nginx: up

        '
      dest: /tmp/molecule_test/chef-server-status
      mode: '0644'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'chef-automate status output

        deployment-service: running

        postgresql: running

        elasticsearch: running

        automate-gateway: running

        automate-ui: running

        '
      dest: /tmp/molecule_test/chef-automate-status
      mode: '0644'
  - name: Create Chef user list file
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/chef-user-list
      mode: '0644'
  - name: Create Chef org list file
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/chef-org-list
      mode: '0644'
