---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Apache configuration verification
    - name: Check Apache virtual host configuration exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      register: vhost_config

    - name: Assert virtual host configuration exists
      ansible.builtin.assert:
        that:
          - vhost_config.stat.exists
          - vhost_config.stat.size > 0
        fail_msg: "Virtual host configuration file not found"
        success_msg: "Virtual host configuration file exists"

    # SSL certificate verification
    - name: Check SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: ssl_files
      loop:
        - /tmp/molecule_test/etc/apache2/certs/apache.key
        - /tmp/molecule_test/etc/apache2/certs/apache.csr
        - /tmp/molecule_test/etc/apache2/certs/apache.crt

    - name: Assert SSL certificate files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "SSL certificate file {{ item.item }} not found"
        success_msg: "SSL certificate file {{ item.item }} exists"
      loop: "{{ ssl_files.results }}"

    # Website content verification
    - name: Check website content exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/www/helloworld/index.html
      register: website_content

    - name: Assert website content exists
      ansible.builtin.assert:
        that:
          - website_content.stat.exists
          - website_content.stat.size > 0
        fail_msg: "Website content file not found"
        success_msg: "Website content file exists"

    # Fetch website content
    - name: Fetch website content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/www/helloworld/index.html
      register: website_content_data

    - name: Assert website content contains expected text
      ansible.builtin.assert:
        that:
          - "'Hello, world!' in (website_content_data.content | b64decode | string)"
        fail_msg: "Website content does not contain expected text"
        success_msg: "Website content contains expected text"

    # SSL configuration verification
    - name: Check SSL configuration exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_config

    - name: Assert SSL configuration exists
      ansible.builtin.assert:
        that:
          - ssl_config.stat.exists
          - ssl_config.stat.size > 0
        fail_msg: "SSL configuration file not found"
        success_msg: "SSL configuration file exists"

    # Fetch SSL configuration
    - name: Fetch SSL configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_config_data

    - name: Assert SSL configuration contains POODLE fix
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in (ssl_config_data.content | b64decode | string)"
        fail_msg: "SSL configuration does not contain POODLE fix"
        success_msg: "SSL configuration contains POODLE fix"

    # Virtual host configuration verification
    - name: Fetch virtual host configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      register: vhost_config_data

    - name: Assert virtual host configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'SSLEngine on' in (vhost_config_data.content | b64decode | string)"
          - "'DocumentRoot' in (vhost_config_data.content | b64decode | string)"
        fail_msg: "Virtual host configuration does not contain expected settings"
        success_msg: "Virtual host configuration contains expected settings"

    # SSH security check
    - name: Check SSH configuration exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_config

    - name: Assert SSH configuration exists
      ansible.builtin.assert:
        that:
          - ssh_config.stat.exists
          - ssh_config.stat.size > 0
        fail_msg: "SSH configuration file not found"
        success_msg: "SSH configuration file exists"

    - name: Fetch SSH configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_config_data

    - name: Assert SSH configuration has root login disabled
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (ssh_config_data.content | b64decode | string)"
        fail_msg: "SSH configuration does not have root login disabled"
        success_msg: "SSH configuration has root login disabled"

    # Service status checks (tagged to skip in container)
    - name: Check Apache service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Check SSH service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert SSH service is running
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
          - "ansible_facts.services['sshd.service'].state == 'running'"
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"
      tags: molecule-notest

    # Port listening check (tagged to skip in container)
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      tags: molecule-notest

    # HTTPS website accessibility check (tagged to skip in container)
    - name: Check HTTPS website accessibility
      ansible.builtin.uri:
        url: https://localhost/
        validate_certs: false
        return_content: true
      register: website_response
      tags: molecule-notest

    - name: Assert website returns expected content
      ansible.builtin.assert:
        that:
          - website_response.status == 200
          - "'Hello, world!' in website_response.content"
        fail_msg: "Website does not return expected content"
        success_msg: "Website returns expected content"
      tags: molecule-notest