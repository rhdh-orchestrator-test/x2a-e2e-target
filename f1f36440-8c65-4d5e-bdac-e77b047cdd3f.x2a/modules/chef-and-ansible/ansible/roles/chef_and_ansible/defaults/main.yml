---
apache_version: 2.4.41-4ubuntu3.10
apache_ssl_cert_path: /etc/apache2/certs
apache_ssl_cert_file: "{{ apache_ssl_cert_path }}/apache.crt"
apache_ssl_key_file: "{{ apache_ssl_cert_path }}/apache.key"
apache_ssl_csr_file: "{{ apache_ssl_cert_path }}/apache.csr"
website_name: helloworld
website_document_root: /var/www/{{ website_name }}
website_owner: root
website_group: root
ssl_protocols: -all +TLSv1.2
