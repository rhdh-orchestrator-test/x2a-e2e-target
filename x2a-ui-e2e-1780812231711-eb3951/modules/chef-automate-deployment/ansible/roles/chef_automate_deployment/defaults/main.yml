---
chef_automate_hostname: automate.chef.lab
chef_automate_sysctl_settings:
  vm.max_map_count: 262144
  vm.dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: /tmp/chef-automate
chef_automate_products:
  - automate
  - infra-server
chef_automate_accept_terms: true
chef_automate_user:
  username: "{{ username | default('admin') }}"
  first_name: "{{ first_name | default('Admin') }}"
  last_name: "{{ last_name | default('User') }}"
  email: "{{ email | default('admin@example.com') }}"
  password: "{{ password | default('changeme') }}"
  filename: "{{ username | default('admin') }}.pem"
chef_automate_org:
  name: lab
  full_name: Chef Lab
  filename: lab-validator.pem
chef_automate_user_pem_path: /root/{{ chef_automate_user.filename }}
chef_automate_org_pem_path: /root/{{ chef_automate_org.filename }}
