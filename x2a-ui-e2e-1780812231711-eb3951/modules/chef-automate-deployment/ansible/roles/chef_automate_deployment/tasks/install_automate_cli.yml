---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
  become: true
- name: Create temporary directory for extraction
  ansible.builtin.file:
    path: /tmp/chef-automate-extract
    state: directory
    mode: "0755"
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c /tmp/chef-automate.zip > {{ chef_automate_cli_path }}
  args:
    creates: "{{ chef_automate_cli_path }}"
  become: true
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
  become: true
