---
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_automate_user.username }} "{{ chef_automate_user.first_name }} {{ chef_automate_user.last_name }}" {{ chef_automate_user.email
      }} "{{ chef_automate_user.password }}" --filename {{ chef_automate_user_pem_path }}

      '
  args:
    creates: "{{ chef_automate_user_pem_path }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_org.name }} "{{ chef_automate_org.full_name }}" --association_user {{ chef_automate_user.username }} --filename
      {{ chef_automate_org_pem_path }}

      '
  args:
    creates: "{{ chef_automate_org_pem_path }}"
  become: true
- name: Set proper permissions on PEM files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
    owner: root
    group: root
  loop:
    - "{{ chef_automate_user_pem_path }}"
    - "{{ chef_automate_org_pem_path }}"
  become: true
