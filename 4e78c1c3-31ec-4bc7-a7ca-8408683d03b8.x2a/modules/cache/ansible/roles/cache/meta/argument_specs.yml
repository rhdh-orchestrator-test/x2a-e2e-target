---
argument_specs:
  main:
    short_description: Simple cache cookbook - local dependency for testing
    description:
      - Installs and configures Redis server as a simple cache solution.
    options:
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Redis server package name.
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Redis server service name.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: Redis server port.
      cache_redis_bind:
        type: str
        required: false
        default: 127.0.0.1
        description: Redis bind address (default is localhost only).
      cache_redis_service_state:
        type: str
        required: false
        default: started
        description: Redis service state (started, stopped).
      cache_redis_service_enabled:
        type: bool
        required: false
        default: true
        description: Whether Redis service should be enabled at boot.
