- name: Converge
  hosts: all
  gather_facts: true
  vars:
    redis_password: redis_secure_password_123
  tasks:
  - name: Create systemd directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/systemd/system
      state: directory
      mode: '0755'
  - name: Create expected directories for cache services
    ansible.builtin.file:
      path: '{{ item_dir }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/run/redis
    - /tmp/molecule_test/var/run/memcached
    loop_control:
      loop_var: item_dir
  - name: Create Redis configuration file
    ansible.builtin.copy:
      content: '# Redis configuration file

        # Generated by Ansible


        # Network

        bind 127.0.0.1

        port 6379


        # General

        daemonize yes

        supervised systemd

        pidfile /tmp/molecule_test/var/run/redis/redis-server.pid


        # Logging

        loglevel notice

        logfile /tmp/molecule_test/var/log/redis/redis-server.log


        # Snapshotting

        save 900 1

        save 300 10

        save 60 10000


        # Database

        dir /tmp/molecule_test/var/lib/redis


        # Security

        requirepass redis_secure_password_123


        # Memory management

        maxmemory-policy allkeys-lru


        # Append only file

        appendonly yes

        appendfilename "appendonly.aof"

        appendfsync everysec

        '
      dest: /tmp/molecule_test/etc/redis/6379.conf
      mode: '0640'
      backup: true
  - name: Create Redis log file
    ansible.builtin.copy:
      content: '# Redis server log

        # This file would contain Redis server logs

        '
      dest: /tmp/molecule_test/var/log/redis/redis-server.log
      mode: '0644'
      backup: true
  - name: Create memcached configuration placeholder
    ansible.builtin.copy:
      content: '# Memcached configuration

        # Port: 11211

        # Memory: 64MB

        '
      dest: /tmp/molecule_test/etc/memcached.conf
      mode: '0644'
      backup: true
  - name: Create systemd service files for testing
    ansible.builtin.copy:
      content: '[Unit]

        Description={{ item_service[''description''] }}

        After=network.target


        [Service]

        Type=forking

        ExecStart={{ item_service[''exec_start''] }}

        PIDFile={{ item_service[''pid_file''] }}


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/{{ item_service['name'] }}.service
      mode: '0644'
      backup: true
    loop:
    - name: redis-server
      description: Advanced key-value store
      exec_start: /usr/bin/redis-server /tmp/molecule_test/etc/redis/6379.conf
      pid_file: /tmp/molecule_test/var/run/redis/redis-server.pid
    - name: memcached
      description: Distributed memory object caching system
      exec_start: /usr/bin/memcached -d -p 11211 -u memcache -m 64
      pid_file: /tmp/molecule_test/var/run/memcached/memcached.pid
    loop_control:
      loop_var: item_service
