---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache
    description:
      - Fixes the POODLE SSL vulnerability by updating Apache SSL protocol configuration
      - Installs Apache, enables SSL module, and configures secure SSL protocols
      - Disables vulnerable SSL protocols and enables only TLSv1.2
      - Manages Apache service restart after configuration changes
    options:
      apache_ssl_conf_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to the Apache SSL configuration file
      ssl_protocols:
        type: str
        required: false
        default: -all +TLSv1.2
        description: SSL protocols to enable in Apache configuration
      restart_apache:
        type: bool
        required: false
        default: true
        description: Whether to restart Apache after SSL configuration changes
