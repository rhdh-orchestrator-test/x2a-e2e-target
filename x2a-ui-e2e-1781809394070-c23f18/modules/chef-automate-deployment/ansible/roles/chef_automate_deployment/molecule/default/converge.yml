- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname | default(''automate.chef.lab'') }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/sysctl.d
      state: directory
      mode: '0755'
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '# Managed by Ansible

        vm.max_map_count = {{ chef_automate_vm_max_map_count | default(262144) }}

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash # Simulated Chef Automate CLI echo ''Chef Automate CLI'''
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment directory
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'Service Name: chef-automate

        Status: running

        Uptime: 1 day

        '
      dest: /tmp/molecule_test/tmp/chef-automate-status.txt
      mode: '0644'
  - name: Create Chef Infra Server status file
    ansible.builtin.copy:
      content: 'run: postgresql-9.6: (pid 12345) 1s; run: log: (pid 12346) 1s

        run: elasticsearch: (pid 12347) 1s; run: log: (pid 12348) 1s

        run: nginx: (pid 12349) 1s; run: log: (pid 12350) 1s

        run: bookshelf: (pid 12351) 1s; run: log: (pid 12352) 1s

        run: oc_bifrost: (pid 12353) 1s; run: log: (pid 12354) 1s

        run: oc_id: (pid 12355) 1s; run: log: (pid 12356) 1s

        run: opscode-erchef: (pid 12357) 1s; run: log: (pid 12358) 1s

        '
      dest: /tmp/molecule_test/tmp/chef-server-status.txt
      mode: '0644'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAv8h21YvrNmPrFcHpN9XS2jLElF3WXaJfd0l9B8gEZ9+n0Pb0

        NJGOXqZU9b7o+L+SGLuBqz0IRMrsdFCGVFH8qjLqg1UXjL+dIbyWS7V5e/j3L2Ij

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_automate_user_key_file | default('jtonello.pem') }}
      mode: '0600'
  - name: Create organization key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAv8h21YvrNmPrFcHpN9XS2jLElF3WXaJfd0l9B8gEZ9+n0Pb0

        NJGOXqZU9b7o+L+SGLuBqz0IRMrsdFCGVFH8qjLqg1UXjL+dIbyWS7V5e/j3L2Ij

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_automate_org_key_file | default('lab-validator.pem') }}
      mode: '0600'
  - name: Create user list file
    ansible.builtin.copy:
      content: '{{ chef_automate_username | default(''jtonello'') }}'
      dest: /tmp/molecule_test/tmp/chef-user-list.txt
      mode: '0644'
  - name: Create organization list file
    ansible.builtin.copy:
      content: '{{ chef_automate_org_name | default(''lab'') }}'
      dest: /tmp/molecule_test/tmp/chef-org-list.txt
      mode: '0644'
  - name: Create systemd service directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/systemd/system
      state: directory
      mode: '0755'
  - name: Create Chef Automate service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Automate

        After=network.target


        [Service]

        Type=simple

        ExecStart=/hab/bin/chef-automate-ctl start

        ExecStop=/hab/bin/chef-automate-ctl stop

        Restart=on-failure


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      mode: '0644'
