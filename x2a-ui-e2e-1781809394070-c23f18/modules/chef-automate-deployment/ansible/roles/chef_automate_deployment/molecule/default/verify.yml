---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Verify hostname configuration
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is correctly set
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Verify sysctl configuration
    - name: Check sysctl configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file was created
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl configuration is correct
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
        fail_msg: "Sysctl configuration not set correctly"
        success_msg: "Sysctl configuration set correctly"
      when: sysctl_file.stat.exists

    # Verify Chef Automate CLI installation
    - name: Check Chef Automate CLI file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: cli_file

    - name: Assert Chef Automate CLI file was created
      ansible.builtin.assert:
        that:
          - cli_file.stat.exists
          - cli_file.stat.size > 0
          - cli_file.stat.mode == '0755'
        fail_msg: "Chef Automate CLI file not found or not executable"
        success_msg: "Chef Automate CLI file exists and is executable"

    # Verify Chef Automate deployment
    - name: Check Chef Automate deployment directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: hab_dir

    - name: Assert Chef Automate deployment directory was created
      ansible.builtin.assert:
        that:
          - hab_dir.stat.exists
          - hab_dir.stat.isdir
        fail_msg: "Chef Automate deployment directory not found"
        success_msg: "Chef Automate deployment directory exists"

    # Verify user and organization key files
    - name: Check user key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_key_file

    - name: Assert user key file was created
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.size > 0
          - user_key_file.stat.mode == '0600'
        fail_msg: "User key file not found or incorrect permissions"
        success_msg: "User key file exists with correct permissions"

    - name: Check organization key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_key_file

    - name: Assert organization key file was created
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.size > 0
          - org_key_file.stat.mode == '0600'
        fail_msg: "Organization key file not found or incorrect permissions"
        success_msg: "Organization key file exists with correct permissions"

    # Verify user and organization lists
    - name: Check user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-user-list.txt
      register: user_list_file

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/tmp/chef-user-list.txt
      register: user_list_content
      when: user_list_file.stat.exists

    - name: Assert user list contains expected user
      ansible.builtin.assert:
        that:
          - (user_list_content.content | b64decode | trim) == 'jtonello'
        fail_msg: "User list does not contain expected user"
        success_msg: "User list contains expected user"
      when: user_list_file.stat.exists

    - name: Check organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-org-list.txt
      register: org_list_file

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/tmp/chef-org-list.txt
      register: org_list_content
      when: org_list_file.stat.exists

    - name: Assert organization list contains expected organization
      ansible.builtin.assert:
        that:
          - (org_list_content.content | b64decode | trim) == 'lab'
        fail_msg: "Organization list does not contain expected organization"
        success_msg: "Organization list contains expected organization"
      when: org_list_file.stat.exists

    # Verify service file
    - name: Check Chef Automate service file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      register: service_file

    - name: Assert Chef Automate service file was created
      ansible.builtin.assert:
        that:
          - service_file.stat.exists
          - service_file.stat.size > 0
        fail_msg: "Chef Automate service file not found"
        success_msg: "Chef Automate service file exists"

    # The following checks would normally run on a real system but can't in a container
    # They are tagged with molecule-notest to be skipped during molecule testing

    - name: Check Chef Automate service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is active
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "ansible_facts.services['chef-automate.service'].state == 'running'"
        fail_msg: "Chef Automate service not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check Chef Automate UI accessibility
      ansible.builtin.uri:
        url: https://localhost/api/v0/auth/version
        validate_certs: false
      register: automate_ui
      tags: molecule-notest

    - name: Assert Chef Automate UI is accessible
      ansible.builtin.assert:
        that:
          - automate_ui.status == 200
        fail_msg: "Chef Automate UI not accessible"
        success_msg: "Chef Automate UI is accessible"
      tags: molecule-notest

    - name: Check Chef Infra Server API accessibility
      ansible.builtin.uri:
        url: https://localhost/organizations/lab
        validate_certs: false
      register: infra_server_api
      tags: molecule-notest

    - name: Assert Chef Infra Server API is accessible
      ansible.builtin.assert:
        that:
          - infra_server_api.status == 200
        fail_msg: "Chef Infra Server API not accessible"
        success_msg: "Chef Infra Server API is accessible"
      tags: molecule-notest

    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      tags: molecule-notest