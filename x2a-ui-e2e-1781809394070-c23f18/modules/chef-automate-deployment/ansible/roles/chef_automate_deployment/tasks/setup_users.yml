---
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl user-create  {{ username | default(chef_automate_username) }}  {{ full_name | default(chef_automate_full_name) }}  {{ email | default(chef_automate_email)
      }}  "{{ password }}"  --filename {{ chef_automate_user_key_file }}

      '
  args:
    creates: "{{ ansible_env.PWD }}/{{ chef_automate_user_key_file }}"
  register: create_user
  changed_when: create_user.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl org-create  {{ chef_automate_org_name }}  "{{ chef_automate_org_full_name }}"  --association_user {{ username | default(chef_automate_username)
      }}  --filename {{ chef_automate_org_key_file }}

      '
  args:
    creates: "{{ ansible_env.PWD }}/{{ chef_automate_org_key_file }}"
  register: create_org
  changed_when: create_org.rc == 0
- name: Set permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_automate_user_key_file }}"
    mode: "0600"
    state: file
  when: create_user.changed
- name: Set permissions on organization key file
  ansible.builtin.file:
    path: "{{ chef_automate_org_key_file }}"
    mode: "0600"
    state: file
  when: create_org.changed
