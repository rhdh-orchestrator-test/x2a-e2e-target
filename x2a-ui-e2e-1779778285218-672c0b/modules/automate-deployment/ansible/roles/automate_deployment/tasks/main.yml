---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Configure system for Chef deployment
  ansible.builtin.include_tasks: configure_system.yml
- name: Download Chef Automate CLI
  ansible.builtin.include_tasks: download_cli.yml
  when: deploy_automate | default(true) | bool or deploy_chef_server_only | default(false) | bool
- name: Deploy Chef Automate and Infra Server
  ansible.builtin.include_tasks: deploy_automate.yml
  when: deploy_automate | default(true) | bool
- name: Deploy Chef Infra Server only
  ansible.builtin.include_tasks: deploy_chef_server.yml
  when: deploy_chef_server_only | default(false) | bool
- name: Manage Chef users and organizations
  ansible.builtin.include_tasks: manage_users_orgs.yml
