---
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "./chef-automate deploy  {% for product in chef_automate_products.infra_only %} --product {{ product }}  {% endfor %} --accept-terms-and-mlsa={{ chef_accept_terms_and_mlsa
      | lower }} "
  args:
    creates: /hab
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
