---
argument_specs:
  main:
    short_description: Install and configure Redis and Memcached caching services
    description:
      - Installs and configures Redis server with authentication
      - Installs and configures Memcached service
      - Creates necessary directories and applies security configurations
      - Cleans up Redis configuration to remove replica-related settings
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for Redis server to listen on
      cache_redis_password:
        type: str
        required: true
        description: Password for Redis authentication (injected by AAP credential type)
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory path for Redis log files
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to Redis configuration file
      cache_memcached_enabled:
        type: bool
        required: false
        default: true
        description: Whether to enable Memcached service
      cache_redis_owner:
        type: str
        required: false
        default: redis
        description: User owner for Redis files and directories
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: Group owner for Redis files and directories
      cache_redis_log_dir_mode:
        type: str
        required: false
        default: "0755"
        description: File permissions for Redis log directory
      cache_redis_cleanup_patterns:
        type: list
        elements: str
        required: false
        default:
          - ^replica-serve-stale-data.*$
          - ^replica-read-only.*$
          - ^repl-ping-replica-period.*$
          - ^client-output-buffer-limit.*$
          - ^replica-priority.*$
        description: Regular expression patterns to remove from Redis configuration
