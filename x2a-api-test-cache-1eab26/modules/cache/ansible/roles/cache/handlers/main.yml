---
- name: Restart redis-server
  ansible.builtin.service:
    name: redis-server
    state: restarted
- name: Restart memcached
  ansible.builtin.service:
    name: memcached
    state: restarted
- name: Reload redis-server
  ansible.builtin.service:
    name: redis-server
    state: reloaded
- name: Reload memcached
  ansible.builtin.service:
    name: memcached
    state: reloaded
