---
- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload sysctl security settings
  ansible.posix.sysctl:
    name: net.ipv4.tcp_syncookies
    value: "1"
    sysctl_file: /etc/sysctl.d/99-security.conf
    sysctl_set: true
    reload: true
    state: present

- name: Restart SSH
  ansible.builtin.service:
    name: ssh
    state: restarted
