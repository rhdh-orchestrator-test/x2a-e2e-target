---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the FastAPI application to connect to its PostgreSQL database; the password is currently hardcoded and must be moved to 
      protected Ansible Vault storage.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL role used by the FastAPI application.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database owned by and used by the FastAPI application.
      required:
        - db_username
        - db_password
        - database_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
