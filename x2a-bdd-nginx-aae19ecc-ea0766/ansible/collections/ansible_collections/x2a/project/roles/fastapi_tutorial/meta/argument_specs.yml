---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application
    description:
      - Deploys the FastAPI tutorial from Git, installs its Python dependencies, provisions PostgreSQL, and manages its systemd service.
    options:
      fastapi_tutorial_app_directory:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_virtualenv_directory:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_requirements_file:
        type: str
        required: false
        default: /opt/fastapi-tutorial/requirements.txt
        description: Python requirements file.
      fastapi_tutorial_env_file:
        type: str
        required: false
        default: /opt/fastapi-tutorial/.env
        description: Application environment file path.
      fastapi_tutorial_systemd_unit:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: FastAPI systemd unit path.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/example/fastapi-tutorial.git
        description: Git repository containing the application.
      fastapi_tutorial_repository_version:
        type: str
        required: false
        default: HEAD
        description: Git revision to deploy.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: User running the application service.
      fastapi_tutorial_service_group:
        type: str
        required: false
        default: root
        description: Group running the application service.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks handling database credentials.
      fastapi_tutorial_env_content:
        type: str
        required: false
        default: DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@localhost/{{ database_name }}
        description: Application environment content template.
      fastapi_tutorial_systemd_exec_start:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv/bin/uvicorn main:app --host 0.0.0.0
        description: Application command used by the systemd unit.
      fastapi_tutorial_systemd_working_directory:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Working directory for the systemd service.
      db_username:
        type: str
        required: true
        description: Database username injected by the AAP credential configuration.
      db_password:
        type: str
        required: true
        description: Database password injected by the AAP credential configuration.
      database_name:
        type: str
        required: true
        description: Database name injected by the AAP credential configuration.
