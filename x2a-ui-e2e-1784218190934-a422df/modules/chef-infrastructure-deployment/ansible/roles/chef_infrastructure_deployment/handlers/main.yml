---
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: "{{ chef_automate_cli_path }}.zip"
    dest: "{{ chef_automate_cli_path | dirname }}"
    remote_src: true
  args:
    creates: "{{ chef_automate_cli_path | regex_replace('\\.zip$', '') }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path | regex_replace('\\.zip$', '') }}"
    mode: "0755"
