---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    chef_org_name: lab
  tasks:
    # Hostname verification
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_file.stat.exists

    # System parameter verification
    - name: Check max_map_count parameter file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_file

    - name: Assert max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
        fail_msg: "max_map_count parameter file not found"
        success_msg: "max_map_count parameter file exists"

    - name: Get max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "262144"
        fail_msg: "max_map_count is not set correctly"
        success_msg: "max_map_count is set correctly"
      when: max_map_count_file.stat.exists

    - name: Check dirty_expire_centisecs parameter file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_file

    - name: Assert dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_centisecs_file.stat.exists
        fail_msg: "dirty_expire_centisecs parameter file not found"
        success_msg: "dirty_expire_centisecs parameter file exists"

    - name: Get dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_content
      when: dirty_expire_centisecs_file.stat.exists

    - name: Assert dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
        fail_msg: "dirty_expire_centisecs is not set correctly"
        success_msg: "dirty_expire_centisecs is set correctly"
      when: dirty_expire_centisecs_file.stat.exists

    # Chef Automate status verification
    - name: Check Chef Automate status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-automate-status
      register: chef_automate_status_file

    - name: Assert Chef Automate status file exists
      ansible.builtin.assert:
        that:
          - chef_automate_status_file.stat.exists
        fail_msg: "Chef Automate status file not found"
        success_msg: "Chef Automate status file exists"

    - name: Get Chef Automate status content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-automate-status
      register: chef_automate_status_content
      when: chef_automate_status_file.stat.exists

    - name: Assert Chef Automate services are running
      ansible.builtin.assert:
        that:
          - (chef_automate_status_content.content | b64decode) is search('Status: running')
        fail_msg: "Chef Automate services are not running"
        success_msg: "Chef Automate services are running"
      when: chef_automate_status_file.stat.exists

    # User verification
    - name: Check Chef Server user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-user-list
      register: chef_server_user_list_file

    - name: Assert Chef Server user list file exists
      ansible.builtin.assert:
        that:
          - chef_server_user_list_file.stat.exists
        fail_msg: "Chef Server user list file not found"
        success_msg: "Chef Server user list file exists"

    - name: Get Chef Server user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-server-user-list
      register: chef_server_user_list_content
      when: chef_server_user_list_file.stat.exists

    - name: Assert user exists in Chef Server
      ansible.builtin.assert:
        that:
          - (chef_server_user_list_content.content | b64decode) is search(username)
        fail_msg: "User {{ username }} not found in Chef Server"
        success_msg: "User {{ username }} exists in Chef Server"
      when: chef_server_user_list_file.stat.exists

    # Organization verification
    - name: Check Chef Server org list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-server-org-list
      register: chef_server_org_list_file

    - name: Assert Chef Server org list file exists
      ansible.builtin.assert:
        that:
          - chef_server_org_list_file.stat.exists
        fail_msg: "Chef Server org list file not found"
        success_msg: "Chef Server org list file exists"

    - name: Get Chef Server org list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/hab/chef-server-org-list
      register: chef_server_org_list_content
      when: chef_server_org_list_file.stat.exists

    - name: Assert organization exists in Chef Server
      ansible.builtin.assert:
        that:
          - (chef_server_org_list_content.content | b64decode) is search(chef_org_name)
        fail_msg: "Organization {{ chef_org_name }} not found in Chef Server"
        success_msg: "Organization {{ chef_org_name }} exists in Chef Server"
      when: chef_server_org_list_file.stat.exists

    # PEM file verification
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/jtonello.pem
      register: user_pem_file

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem_file.stat.exists
          - user_pem_file.stat.size > 0
        fail_msg: "User PEM file not found"
        success_msg: "User PEM file exists"

    - name: Check organization validator PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/lab-validator.pem
      register: org_validator_pem_file

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_validator_pem_file.stat.exists
          - org_validator_pem_file.stat.size > 0
        fail_msg: "Organization validator PEM file not found"
        success_msg: "Organization validator PEM file exists"

    # The following checks cannot be run in a container environment
    # They are tagged with molecule-notest so they will be skipped during molecule testing

    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: chef_automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check Chef Infra Server service status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server service is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server service is not running"
        success_msg: "Chef Infra Server service is running"
      tags: molecule-notest

    - name: Check network listening on port 443
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      register: port_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    - name: Check Chef Automate UI access
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
        status_code: 200
      register: ui_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Automate UI is accessible
      ansible.builtin.assert:
        that:
          - ui_check is succeeded
        fail_msg: "Chef Automate UI is not accessible"
        success_msg: "Chef Automate UI is accessible"
      tags: molecule-notest

    - name: Check Chef Server API access
      ansible.builtin.command:
        cmd: knife user list -s https://localhost/organizations/lab -u jtonello -k ~/jtonello.pem
      register: api_check
      changed_when: false
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Server API is accessible
      ansible.builtin.assert:
        that:
          - api_check is succeeded
        fail_msg: "Chef Server API is not accessible"
        success_msg: "Chef Server API is accessible"
      tags: molecule-notest