---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    password: testpassword
    email: jtonello@example.com
    chef_hostname: automate.chef.lab
    chef_sysctl_params:
      vm.max_map_count: 262144
      vm.dirty_expire_centisecs: 20000
    chef_org_name: lab
    chef_org_long_name: Chef Lab
    chef_user_long_name: John Tonello
    chef_user_pem_path: /tmp/molecule_test/home/jtonello.pem
    chef_org_validator_pem_path: /tmp/molecule_test/home/lab-validator.pem
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
    chef_deploy_automate: true
    chef_deploy_infra_server_only: false
  tasks:
    # Create directory structure
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/home
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/proc/sys/vm

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl parameters
    - name: Create sysctl parameter files
      ansible.builtin.copy:
        content: "{{ chef_sysctl_params['vm.max_map_count'] }}"
        dest: /tmp/molecule_test/proc/sys/vm/max_map_count
        mode: "0644"

    - name: Create dirty_expire_centisecs parameter file
      ansible.builtin.copy:
        content: "{{ chef_sysctl_params['vm.dirty_expire_centisecs'] }}"
        dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI Mock'"
        dest: "{{ chef_automate_cli_path }}"
        mode: "0755"

    # Simulate PEM files
    - name: Create user PEM file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER PEM CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: "{{ chef_user_pem_path }}"
        mode: "0600"

    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORG VALIDATOR PEM CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: "{{ chef_org_validator_pem_path }}"
        mode: "0600"

    # Simulate Chef Automate and Chef Server installation
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-cs-nginx
          Status: running
          Service: automate-cs-postgresql
          Status: running
          Service: chef-server
          Status: running
        dest: /tmp/molecule_test/hab/chef-automate-status
        mode: "0644"

    # Simulate Chef Server user and org lists
    - name: Create Chef Server user list file
      ansible.builtin.copy:
        content: "{{ username }}"
        dest: /tmp/molecule_test/hab/chef-server-user-list
        mode: "0644"

    - name: Create Chef Server org list file
      ansible.builtin.copy:
        content: "{{ chef_org_name }}"
        dest: /tmp/molecule_test/hab/chef-server-org-list
        mode: "0644"