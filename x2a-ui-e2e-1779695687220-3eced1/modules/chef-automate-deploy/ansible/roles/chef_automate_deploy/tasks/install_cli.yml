---
- name: Create directory for Chef Automate CLI
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path | dirname }}"
    state: directory
    mode: "0755"
  when: chef_automate_cli_path | dirname != '.'
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.gz"
    mode: "0644"
  register: download_result
- name: Extract Chef Automate CLI
  ansible.builtin.command:
    cmd: gunzip -f {{ chef_automate_cli_path }}.gz
    creates: "{{ chef_automate_cli_path }}"
  register: extract_result
  changed_when: extract_result.rc == 0
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
