- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/opscode
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/vm/{{ item.key | regex_replace('^vm\.', '') }}
      mode: '0644'
    loop: '{{ chef_automate_sysctl | dict2items }}'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI v1.0.0'' '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "# Chef Automate configuration\n[global]\n  v1 = true\n[automate]\n  enable = true\n[infra-server]\n  enable = true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_USER_KEY_CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/{{ chef_automate_user_key_file }}
      mode: '0600'
  - name: Create org validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_ORG_VALIDATOR_KEY_CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/{{ chef_automate_org_key_file }}
      mode: '0600'
  - name: Create Chef server user list file
    ansible.builtin.copy:
      content: '{{ chef_automate_username }} admin '
      dest: /tmp/molecule_test/chef-server-users.txt
      mode: '0644'
  - name: Create Chef server org list file
    ansible.builtin.copy:
      content: '{{ chef_automate_org_name }} '
      dest: /tmp/molecule_test/chef-server-orgs.txt
      mode: '0644'
