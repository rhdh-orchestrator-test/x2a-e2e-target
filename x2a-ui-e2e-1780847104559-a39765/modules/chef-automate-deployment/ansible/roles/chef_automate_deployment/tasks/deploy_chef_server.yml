---
- name: Configure system for Chef Server
  ansible.builtin.include_tasks: system_config.yml
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
  register: download_result
- name: Check if Chef Automate CLI exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: cli_stat
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate_linux_amd64.zip > {{ chef_automate_cli_path }} && chmod +x {{ chef_automate_cli_path }}
    executable: /bin/bash
  args:
    creates: "{{ chef_automate_cli_path }}"
  changed_when: true
  when: not cli_stat.stat.exists or download_result.changed
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "sudo {{ chef_automate_cli_path }} deploy {% for product in chef_server_only_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{
      chef_automate_accept_terms | lower }} "
  args:
    creates: /etc/chef-server/chef-server.rb
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
- name: Setup users and organizations
  ansible.builtin.include_tasks: setup_users_orgs.yml
