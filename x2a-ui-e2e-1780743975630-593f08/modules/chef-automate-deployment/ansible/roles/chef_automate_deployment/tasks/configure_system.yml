---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Create sysctl configuration file for Chef Automate
  ansible.builtin.template:
    src: chef-automate-sysctl.conf.j2
    dest: /etc/sysctl.d/99-chef-automate.conf
    mode: "0644"
  become: true
  register: sysctl_config
- name: Apply sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  become: true
  when: sysctl_config is changed
  changed_when: true
