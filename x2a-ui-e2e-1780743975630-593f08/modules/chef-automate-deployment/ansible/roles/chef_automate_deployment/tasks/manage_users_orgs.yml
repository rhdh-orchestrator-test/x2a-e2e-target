---
- name: Ensure directory for PEM files exists
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_key_path }}"
    - "{{ chef_automate_org_key_path }}"
  when: chef_automate_user_key_path | dirname != '.' or chef_automate_org_key_path | dirname != '.'
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_automate_username }}  {{ chef_automate_longusername }}  {{ chef_automate_useremail }}  "{{ password }}"  --filename
      {{ chef_automate_user_key_path }}

      '
  become: true
  args:
    creates: "{{ chef_automate_user_key_path }}"
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_automate_orgname }}  "{{ chef_automate_longorgname }}"  --association_user {{ chef_automate_username }}  --filename
      {{ chef_automate_org_key_path }}

      '
  become: true
  args:
    creates: "{{ chef_automate_org_key_path }}"
- name: Set permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_automate_user_key_path }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  when: ansible_user is defined
- name: Set permissions on organization key file
  ansible.builtin.file:
    path: "{{ chef_automate_org_key_path }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  when: ansible_user is defined
