- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    password: molecule_test_password
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-server
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/var/log/chef-automate
    - /tmp/molecule_test/var/log/chef-server
    - /tmp/molecule_test/usr/bin
    - /tmp/molecule_test/etc/systemd/system
  - name: Create mock Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        echo "Command: $@"

        exit 0

        '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create mock chef-server-ctl
    ansible.builtin.copy:
      content: "#!/bin/bash\necho \"Chef Server Control mock\"\necho \"Command: $@\"\nif [[ \"$1\" == \"user-list\" ]]; then\n  echo \"jtonello\"\nelif [[ \"$1\"
        == \"org-list\" ]]; then\n  echo \"lab\"\nfi\nexit 0\n"
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create mock user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5NhYL7ZF8xd3okeZ4fkgqR2CrF9lQGX7AZZ6JpELFBQTHjG

        vqZMKiVRQJQeRYWLw2ISjJYBxkfvqLJMKLTU/pUSKdOj4MmYQ2Bwxip+plU3Gg==

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create mock organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5NhYL7ZF8xd3okeZ4fkgqR2CrF9lQGX7AZZ6JpELFBQTHjG

        vqZMKiVRQJQeRYWLw2ISjJYBxkfvqLJMKLTU/pUSKdOj4MmYQ2Bwxip+plU3Gg==

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create mock sysctl configuration
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create mock Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: automate-load-balancer

        Status: running

        Service: automate-cs-nginx

        Status: running

        Service: automate-cs-oc-erchef

        Status: running

        '
      dest: /tmp/molecule_test/var/log/chef-automate/status.log
      mode: '0644'
  - name: Create mock Chef Server status file
    ansible.builtin.copy:
      content: 'Service: chef-server-nginx

        Status: running

        Service: chef-server-oc-erchef

        Status: running

        '
      dest: /tmp/molecule_test/var/log/chef-server/status.log
      mode: '0644'
  - name: Create mock systemd service files
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef {{ item }} Service


        [Service]

        ExecStart=/bin/true


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-{{ item }}.service
      mode: '0644'
    loop:
    - automate
    - server
