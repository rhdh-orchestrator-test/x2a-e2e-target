---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check SSL configuration file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_config_file

    - name: Assert SSL configuration file exists
      ansible.builtin.assert:
        that:
          - ssl_config_file.stat.exists
          - ssl_config_file.stat.isreg
        fail_msg: "SSL configuration file not found"
        success_msg: "SSL configuration file exists"

    - name: Get SSL configuration file content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_config_content

    - name: Assert SSL protocol setting has been updated
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in (ssl_config_content.content | b64decode)"
          - "'SSLProtocol all -SSLv3' not in (ssl_config_content.content | b64decode)"
        fail_msg: "SSL protocol setting was not updated correctly"
        success_msg: "SSL protocol setting was updated correctly"

    # The following checks can't run in a container environment
    # but are included with the molecule-notest tag for documentation

    - name: Check Apache service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Check SSH service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert SSH service is running
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
          - "ansible_facts.services['sshd.service'].state == 'running'"
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"
      tags: molecule-notest

    - name: Validate Apache configuration
      ansible.builtin.command: apache2ctl configtest
      changed_when: false
      tags: molecule-notest

    - name: Test SSL configuration with OpenSSL
      ansible.builtin.command: openssl s_client -connect localhost:443 -tls1_2
      changed_when: false
      tags: molecule-notest

    - name: Verify POODLE vulnerability is mitigated
      ansible.builtin.command: nmap --script ssl-enum-ciphers -p 443 localhost
      changed_when: false
      tags: molecule-notest