- name: Converge
  hosts: all
  gather_facts: true
  vars:
    user_password: password
    chef_automate_hostname: automate.chef.lab
    chef_automate_username: jtonello
    chef_automate_longusername: John Tonello
    chef_automate_useremail: jtonello@chef.lab
    chef_automate_orgname: lab
    chef_automate_longorgname: Chef Lab
    chef_automate_userfilename: /tmp/molecule_test/jtonello.pem
    chef_automate_orgfilename: /tmp/molecule_test/lab-validator.pem
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/hab
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '262144'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '20000'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create chef-automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI'''
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create chef-automate status file
    ansible.builtin.copy:
      content: 'Chef Automate services:

        - automate-cs-bookshelf: running

        - automate-cs-oc-bifrost: running

        - automate-cs-oc-erchef: running

        - automate-cs-nginx: running

        - automate-pg: running

        - automate-elasticsearch: running

        '
      dest: /tmp/molecule_test/hab/chef-automate-status
      mode: '0644'
  - name: Create chef-server-ctl status file
    ansible.builtin.copy:
      content: 'run: service_name: bookshelf

        run: service_name: oc_bifrost

        run: service_name: oc_erchef

        run: service_name: nginx

        '
      dest: /tmp/molecule_test/hab/chef-server-status
      mode: '0644'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_automate_username }}.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_automate_orgname }}-validator.pem
      mode: '0600'
  - name: Create user-list output file
    ansible.builtin.copy:
      content: '{{ chef_automate_username }}'
      dest: /tmp/molecule_test/hab/user-list
      mode: '0644'
  - name: Create org-list output file
    ansible.builtin.copy:
      content: '{{ chef_automate_orgname }}'
      dest: /tmp/molecule_test/hab/org-list
      mode: '0644'
  - name: Create chef-automate service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Automate

        [Service]

        ExecStart=/hab/bin/chef-automate

        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/chef-automate.service
      mode: '0644'
  - name: Create chef-server service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Infra Server

        [Service]

        ExecStart=/hab/bin/chef-server-ctl

        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/chef-server.service
      mode: '0644'
