---
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl user-create  {{ username }}  "{{ chef_user_long_name }}"  {{ email }}  "{{ password }}"  --filename {{ chef_user_key_path }}

      '
  args:
    creates: "{{ chef_user_key_path | expanduser }}"
  register: chef_user_create
  become: true
  no_log: true
  notify: Display user creation
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl org-create  {{ chef_org_name }}  "{{ chef_org_long_name }}"  --association_user {{ username }}  --filename {{ chef_org_key_path }}

      '
  args:
    creates: "{{ chef_org_key_path | expanduser }}"
  register: chef_org_create
  become: true
  notify: Display organization creation
- name: Check if key files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ chef_user_key_path | expanduser }}"
    - "{{ chef_org_key_path | expanduser }}"
  register: key_files_stat
- name: Set permissions on key files
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop: "{{ key_files_stat.results }}"
  when: item.stat.exists
