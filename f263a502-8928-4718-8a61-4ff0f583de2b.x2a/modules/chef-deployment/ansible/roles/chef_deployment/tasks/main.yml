---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Configure system parameters
  ansible.builtin.include_tasks: configure_system.yml
- name: Deploy Chef Automate with Chef Infra Server
  ansible.builtin.include_tasks: deploy_automate.yml
  when: chef_deploy_automate | bool
- name: Deploy standalone Chef Infra Server
  ansible.builtin.include_tasks: deploy_chef_server.yml
  when: not chef_deploy_automate | bool and chef_deploy_infra_server | bool
- name: Create Chef users and organizations
  ansible.builtin.include_tasks: create_users_orgs.yml
