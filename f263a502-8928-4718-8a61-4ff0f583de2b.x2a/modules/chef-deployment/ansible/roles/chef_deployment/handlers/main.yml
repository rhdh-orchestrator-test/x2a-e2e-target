---
- name: Restart chef-automate
  ansible.builtin.command:
    cmd: sudo chef-automate restart
  listen: restart chef services
  changed_when: true
- name: Restart chef-server
  ansible.builtin.command:
    cmd: sudo chef-server-ctl restart
  listen: restart chef services
  changed_when: true
- name: Display user creation
  ansible.builtin.debug:
    msg: Chef user {{ username }} created successfully
- name: Display organization creation
  ansible.builtin.debug:
    msg: Chef organization {{ chef_org_name }} created successfully
- name: Wait for Chef services
  ansible.builtin.pause:
    seconds: 30
