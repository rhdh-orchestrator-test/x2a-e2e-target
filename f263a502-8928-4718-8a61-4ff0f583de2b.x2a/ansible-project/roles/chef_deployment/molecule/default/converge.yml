---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    email: jtonello@example.com
    password: molecule_test_password
    chef_hostname: automate.chef.lab
    chef_vm_max_map_count: 262144
    chef_vm_dirty_expire_centisecs: 20000
    chef_org_name: lab
    chef_org_long_name: Chef Lab
    chef_user_long_name: Chef Admin
    chef_user_key_path: /tmp/molecule_test/home/jtonello.pem
    chef_org_key_path: /tmp/molecule_test/home/lab-validator.pem
    chef_deploy_automate: true
    chef_deploy_infra_server: true
    chef_accept_terms_and_mlsa: true
  tasks:
    - name: Create directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/home
        - /tmp/molecule_test/tmp

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl parameters
    - name: Create sysctl parameters file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = {{ chef_vm_max_map_count }}
          vm.dirty_expire_centisecs = {{ chef_vm_dirty_expire_centisecs }}
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-deployment.conf
        mode: "0644"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          # Simulated Chef Automate config
          [global]
            fqdn = "{{ chef_hostname }}"
          [deployment]
            products = ["automate", "infra-server"]
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"
      when: chef_deploy_automate | bool

    # Simulate Chef user key file
    - name: Create Chef user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefghijklmnop
          -----END RSA PRIVATE KEY-----
        dest: "{{ chef_user_key_path }}"
        mode: "0600"

    # Simulate Chef organization validator key file
    - name: Create Chef organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          ZYXWVUTSRQPONMLKJIHGFEDCBA0987654321zyxwvutsrqponmlk
          -----END RSA PRIVATE KEY-----
        dest: "{{ chef_org_key_path }}"
        mode: "0600"