- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/home/molecule
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_hostname | default(''automate.chef.lab'') }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI v1.0.0'' '
      dest: /tmp/molecule_test/home/molecule/chef-automate
      mode: '0755'
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "[global]\n  v1 = true\n[deployment]\n  automate = true\n  infra_server = true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu1SU1LfVLPHCozMxH2Mo4lgOEePzNm0tRgeLezV6ffAt0Gkw

        E1d0JZkUWfj+jYrpxZ5i0xE14GpnfBl4TmBHw1ZHUPVesP/SIgzFiQrZ3qdFKNg4

        zPMBz1eGgRmX8AR5/Z+0Kj2Y38YIzUoF1pdp0x2Kpwc9H/A9x1KWHUnuNQqnxgV0

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/molecule/admin.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu1SU1LfVLPHCozMxH2Mo4lgOEePzNm0tRgeLezV6ffAt0Gkw

        E1d0JZkUWfj+jYrpxZ5i0xE14GpnfBl4TmBHw1ZHUPVesP/SIgzFiQrZ3qdFKNg4

        zPMBz1eGgRmX8AR5/Z+0Kj2Y38YIzUoF1pdp0x2Kpwc9H/A9x1KWHUnuNQqnxgV0

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/molecule/lab-validator.pem
      mode: '0600'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  vars:
    chef_hostname: automate.chef.lab
    username: admin
    chef_orgname: lab
