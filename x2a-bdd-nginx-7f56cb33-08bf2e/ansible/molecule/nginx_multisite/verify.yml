---
# Unsupported pre-flight checks: service status output, UFW/fail2ban status details, sysctl
# values, certificate subject/validity output, HTTPS response status, and log tail output
# have no stated expected outcome in the migration plan.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        fail_msg: "A required package is not installed."
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Check nginx is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - nginx
      register: nginx_enabled
      changed_when: false

    - name: Assert nginx is enabled
      ansible.builtin.assert:
        that:
          - nginx_enabled.stdout == 'enabled'
        fail_msg: "The nginx service is not enabled."

    - name: Check nginx is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - nginx
      register: nginx_active
      changed_when: false

    - name: Assert nginx is active
      ansible.builtin.assert:
        that:
          - nginx_active.stdout == 'active'
        fail_msg: "The nginx service is not active."

    - name: Check fail2ban is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - fail2ban
      register: fail2ban_enabled
      changed_when: false

    - name: Assert fail2ban is enabled
      ansible.builtin.assert:
        that:
          - fail2ban_enabled.stdout == 'enabled'
        fail_msg: "The fail2ban service is not enabled."

    - name: Check fail2ban is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - fail2ban
      register: fail2ban_active
      changed_when: false

    - name: Assert fail2ban is active
      ansible.builtin.assert:
        that:
          - fail2ban_active.stdout == 'active'
        fail_msg: "The fail2ban service is not active."

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_config_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_config_test.rc == 0
        fail_msg: "The nginx configuration test failed."

    - name: Check configured site names in nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      register: nginx_dump
      changed_when: false

    - name: Assert all configured site names are present
      ansible.builtin.assert:
        that:
          - "'test.cluster.local' in nginx_dump.stdout"
          - "'ci.cluster.local' in nginx_dump.stdout"
          - "'status.cluster.local' in nginx_dump.stdout"
        fail_msg: "One or more configured site names are missing from nginx configuration."

    - name: Validate SSH daemon configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      register: sshd_config_test
      changed_when: false

    - name: Assert SSH daemon configuration is valid
      ansible.builtin.assert:
        that:
          - sshd_config_test.rc == 0
        fail_msg: "The SSH daemon configuration test failed."

    - name: Check required configuration and content paths
      ansible.builtin.stat:
        path: "{{ item_path }}"
      register: required_paths
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /opt/server/test
        - /opt/server/test/index.html
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_path

    - name: Assert required configuration and content paths exist
      ansible.builtin.assert:
        that:
          - item_path_result.stat.exists
        fail_msg: "A required nginx multisite path is missing."
      loop: "{{ required_paths.results }}"
      loop_control:
        loop_var: item_path_result

    - name: Check the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site.stat.exists
        fail_msg: "The default nginx site must not exist."

    - name: Check enabled virtual-host links
      ansible.builtin.stat:
        path: "{{ item_link }}"
        follow: false
      register: enabled_links
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_link

    - name: Assert enabled virtual-host links exist
      ansible.builtin.assert:
        that:
          - item_link_result.stat.islnk
        fail_msg: "A required nginx virtual-host link is missing."
      loop: "{{ enabled_links.results }}"
      loop_control:
        loop_var: item_link_result

    - name: Verify nginx listens on HTTP and HTTPS
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_port }}"
        state: started
        timeout: 5
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_port

    - name: Verify HTTP redirects for configured sites
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_site }}"
        follow_redirects: none
        return_content: false
        status_code: 301
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site

    - name: Check TLS private-key metadata
      ansible.builtin.stat:
        path: "{{ item_key_path }}"
      register: private_key_metadata
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key_path

    - name: Assert TLS private-key ownership and mode
      ansible.builtin.assert:
        that:
          - item_key_result.stat.pw_name == 'root'
          - item_key_result.stat.gr_name == 'ssl-cert'
          - item_key_result.stat.mode == '0640'
        fail_msg: "A TLS private key has unexpected ownership or permissions."
      loop: "{{ private_key_metadata.results }}"
      loop_control:
        loop_var: item_key_result

    - name: Check SSH hardening settings
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - '^[[:space:]]*PermitRootLogin|^[[:space:]]*PasswordAuthentication'
          - /etc/ssh/sshd_config
      register: ssh_hardening
      changed_when: false

    - name: Assert SSH hardening settings
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in ssh_hardening.stdout"
          - "'PasswordAuthentication no' in ssh_hardening.stdout"
        fail_msg: "SSH root login or password authentication is not disabled."
