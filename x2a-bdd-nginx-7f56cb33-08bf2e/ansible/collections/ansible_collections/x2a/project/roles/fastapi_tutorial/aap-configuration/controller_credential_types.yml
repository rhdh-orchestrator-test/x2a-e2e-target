---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Database connection credential for the FastAPI application; the PostgreSQL password is currently hardcoded in the Chef recipe and should be 
      rotated and stored securely in AAP.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL FastAPI role; replace the compromised hardcoded value.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname or address of the PostgreSQL server.
        - id: db_port
          type: string
          label: Database Port
          help_text: Port on which PostgreSQL accepts connections.
      required:
        - db_username
        - db_password
        - database_name
        - db_host
        - db_port
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
