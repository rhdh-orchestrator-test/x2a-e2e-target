---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Database connection credential for the FastAPI application; the PostgreSQL password is currently hardcoded in the Chef recipe and should be 
      rotated and stored securely in AAP.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      database_name: "{{ database_name }}"
      db_host: "{{ db_host }}"
      db_port: "{{ db_port }}"
