---
# User-facing defaults for the FastAPI Tutorial application.
fastapi_tutorial_secure_logging: true
fastapi_tutorial_repository: https://github.com/dibanez/fastapi_tutorial.git
fastapi_tutorial_revision: main
fastapi_tutorial_app_dir: /opt/fastapi-tutorial
fastapi_tutorial_venv_dir: /opt/fastapi-tutorial/venv
fastapi_tutorial_env_file: /opt/fastapi-tutorial/.env
fastapi_tutorial_service_name: fastapi-tutorial
fastapi_tutorial_service_file: /etc/systemd/system/fastapi-tutorial.service
fastapi_tutorial_bind_host: 0.0.0.0
fastapi_tutorial_bind_port: 8000
fastapi_tutorial_project_name: FastAPI Tutorial
fastapi_tutorial_api_version: 1.0.0
fastapi_tutorial_db_user: "{{ db_username }}"
fastapi_tutorial_db_name: "{{ database_name }}"
fastapi_tutorial_db_host: "{{ db_host }}"
fastapi_tutorial_db_port: "{{ db_port }}"
fastapi_tutorial_system_packages:
  - python3
  - python3-pip
  - python3-venv
  - git
  - postgresql
  - postgresql-contrib
  - libpq-dev
