---
- name: Install TLS packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}" # noqa: R114 - path from role default
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}" # noqa: R114 - path from role default
    owner: root
    group: ssl-cert
    mode: "0710"
    state: directory

- name: Check existing site certificates
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt" # noqa: R114 - site name from role-defined sites dictionary
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  register: nginx_multisite_certificate_files

- name: Check existing site private keys
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key" # noqa: R114 - site name from role-defined sites dictionary
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  register: nginx_multisite_key_files

- name: Generate self-signed site certificates  # noqa: L039,R101 - variables are registered by the preceding certificate stat tasks; command uses trusted role-defined paths and site names
  ansible.builtin.shell:
    cmd: |
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        -keyout "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key" \
        -out "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt" \
        -subj "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl_site['key'] }}/emailAddress=admin@example.com"
      chmod 0640 "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key"
      chown root:ssl-cert "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key"
    executable: /bin/bash
  when:
    - item_ssl_site['value']['ssl_enabled']
    - not nginx_multisite_certificate_files['results'][index_ssl_site]['stat']['exists'] or not
      nginx_multisite_key_files['results'][index_ssl_site]['stat']['exists']
  changed_when: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
    index_var: index_ssl_site
  register: nginx_multisite_certificate_generation
  notify: Reload nginx
