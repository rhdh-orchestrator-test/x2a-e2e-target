---
- name: Install fail2ban
  ansible.builtin.package:
    name: fail2ban
    state: present
  when: nginx_multisite_fail2ban_enabled | bool

- name: Install UFW
  ansible.builtin.package:
    name: ufw
    state: present
  when:
    - nginx_multisite_ufw_enabled | bool
    - ansible_facts['os_family'] == 'Debian'

- name: Install SSH server and sysctl support
  ansible.builtin.package:
    name:
      - openssh-server
      - "{{ 'procps' if ansible_facts['os_family'] == 'Debian' else 'procps-ng' }}"
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Configure fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Configure UFW default deny
  ansible.builtin.shell:
    cmd: ufw --force default deny
    executable: /bin/bash
  when:
    - nginx_multisite_ufw_enabled | bool
    - ansible_facts['os_family'] == 'Debian'
  changed_when: "'Default: deny' not in nginx_multisite_ufw_default.stdout"
  register: nginx_multisite_ufw_default

- name: Allow SSH through UFW
  ansible.builtin.command:
    cmd: ufw allow ssh
  when:
    - nginx_multisite_ufw_enabled | bool
    - ansible_facts['os_family'] == 'Debian'
  changed_when: "'Rule added' in nginx_multisite_ufw_ssh.stdout"
  register: nginx_multisite_ufw_ssh

- name: Allow HTTP through UFW
  ansible.builtin.command:
    cmd: ufw allow http
  when:
    - nginx_multisite_ufw_enabled | bool
    - ansible_facts['os_family'] == 'Debian'
  changed_when: "'Rule added' in nginx_multisite_ufw_http.stdout"
  register: nginx_multisite_ufw_http

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    cmd: ufw allow https
  when:
    - nginx_multisite_ufw_enabled | bool
    - ansible_facts['os_family'] == 'Debian'
  changed_when: "'Rule added' in nginx_multisite_ufw_https.stdout"
  register: nginx_multisite_ufw_https

- name: Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  when:
    - nginx_multisite_ufw_enabled | bool
    - ansible_facts['os_family'] == 'Debian'
  changed_when: "'Firewall is active' in nginx_multisite_ufw_enable.stdout"
  register: nginx_multisite_ufw_enable

- name: Configure kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    backup: true
  when: nginx_multisite_ssh_disable_root | bool
  notify: Restart ssh

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    backup: true
  when: not nginx_multisite_ssh_password_auth | bool
  notify: Restart ssh
