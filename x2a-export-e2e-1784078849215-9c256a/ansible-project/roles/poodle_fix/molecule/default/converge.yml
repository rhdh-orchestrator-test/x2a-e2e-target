- name: Converge
  hosts: all
  gather_facts: true
  vars:
    ssl_config_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    ssl_protocol_setting: -all +TLSv1.2
  tasks:
  - name: Create directory structure for Apache SSL config
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create mock Apache SSL config file
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        SSLProtocol all -SSLv3

        SSLCipherSuite HIGH:!aNULL:!MD5

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Fix SSL in Apache (direct task simulation)
    ansible.builtin.replace:
      dest: '{{ ssl_config_path }}'
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol {{ ssl_protocol_setting }}
