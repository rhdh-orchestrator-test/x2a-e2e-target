---
controller_credentials:
- name: Chef Automate Deployment - poodle_fix
  description: Credentials used for deploying Chef Automate and Chef Infra Server
  organization: Default
  credential_type: Chef Automate Deployment
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Apache SSL Certificate - poodle_fix
  description: Self-signed SSL certificates for Apache HTTPS configuration
  organization: Default
  credential_type: Apache SSL Certificate
  update_secrets: true
  inputs:
    ssl_certificate: '{{ vault_ssl_certificate }}'
    ssl_key: '{{ vault_ssl_key }}'
