---
controller_credential_types:
- name: Chef Automate Deployment
  description: Credentials used for deploying Chef Automate and Chef Infra Server
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Automate/Infra Server setup
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Automate/Infra Server setup
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Apache SSL Certificate
  description: Self-signed SSL certificates for Apache HTTPS configuration
  kind: cloud
  inputs:
    fields:
    - id: ssl_certificate
      type: string
      label: SSL Certificate
      secret: true
      help_text: SSL certificate content for Apache HTTPS
    - id: ssl_key
      type: string
      label: SSL Private Key
      secret: true
      help_text: SSL private key for Apache HTTPS
    required:
    - ssl_certificate
    - ssl_key
  injectors:
    extra_vars:
      ssl_certificate: !unsafe '{{ ssl_certificate }}'
      ssl_key: !unsafe '{{ ssl_key }}'
