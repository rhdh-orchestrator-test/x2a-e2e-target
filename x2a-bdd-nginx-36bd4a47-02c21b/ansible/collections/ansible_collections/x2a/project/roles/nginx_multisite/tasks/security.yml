---
- name: Install OpenSSH server
  ansible.builtin.package:
    name: openssh-server
    state: present

- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
    state: present
  when: nginx_multisite_fail2ban_enabled | bool

- name: Install UFW
  ansible.builtin.package:
    name: ufw
    state: present
  when: nginx_multisite_ufw_enabled | bool

- name: Ensure Fail2ban is enabled and started
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Configure Fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Check UFW status
  ansible.builtin.command:
    argv:
      - ufw
      - status
  register: nginx_multisite_ufw_status
  changed_when: false
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default policy to deny  # noqa: L039 - registered by prior task
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  changed_when: false
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Default: deny (incoming)' not in nginx_multisite_ufw_status.stdout"

- name: Allow SSH through UFW  # noqa: L039 - registered by prior task
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - ssh
  changed_when: false
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTP through UFW  # noqa: L039 - registered by prior task
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - http
  changed_when: false
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTPS through UFW  # noqa: L039 - registered by prior task
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - https
  changed_when: false
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Enable UFW  # noqa: L039 - registered by prior task
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - enable
  changed_when: false
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"

- name: Configure kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    backup: true
  when: nginx_multisite_ssh_disable_root | bool
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    backup: true
  when: not nginx_multisite_ssh_password_auth | bool
  notify: Restart SSH
