---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters for Chef Automate
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - name: vm.max_map_count
      value: "262144"
    - name: vm.dirty_expire_centisecs
      value: "20000"
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate_linux_amd64.zip > /tmp/chef-automate
  args:
    creates: /tmp/chef-automate
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: /tmp/chef-automate
    mode: "0755"
    state: file
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: /tmp/chef-automate deploy --product automate --product infra-server --accept-terms-and-mlsa=true
  args:
    creates: /etc/chef-automate/config.toml
  become: true
  register: automate_deploy
  changed_when: automate_deploy.rc == 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_username }}  {{ chef_longusername }}  {{ chef_useremail }}  "{{ chef_userpassword }}"  --filename {{ chef_userfilename
      }}

      '
  args:
    creates: "{{ chef_userfilename }}"
  become: true
  register: user_create
  changed_when: user_create.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_orgname }}  "{{ chef_longorgname }}"  --association_user {{ chef_username }}  --filename {{ chef_orgfilename }}

      '
  args:
    creates: "{{ chef_orgfilename }}"
  become: true
  register: org_create
  changed_when: org_create.rc == 0
