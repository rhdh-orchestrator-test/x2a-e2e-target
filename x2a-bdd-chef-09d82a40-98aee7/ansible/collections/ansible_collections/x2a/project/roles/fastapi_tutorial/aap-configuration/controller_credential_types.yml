---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the FastAPI application to authenticate to its local PostgreSQL database. The password is currently hardcoded in the Chef 
      recipe and must be migrated to an approved AAP secret source.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; used both to create the role and in the application connection string.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL service; the migration plan specifies localhost.
        - id: db_port
          type: string
          label: Database Port
          help_text: PostgreSQL listener port; the migration plan specifies 5432.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application; the migration plan specifies fastapi_db.
      required:
        - db_username
        - db_password
        - db_host
        - db_port
        - db_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
        db_name: !unsafe "{{ db_name }}"
