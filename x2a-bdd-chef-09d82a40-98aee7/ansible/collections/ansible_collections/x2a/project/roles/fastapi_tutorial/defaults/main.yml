---
# Defaults for the FastAPI tutorial application and PostgreSQL dependency.
fastapi_tutorial_secure_logging: true
fastapi_tutorial_app_path: /opt/fastapi-tutorial
fastapi_tutorial_repository: https://github.com/dibanez/fastapi_tutorial.git
fastapi_tutorial_repository_version: main
fastapi_tutorial_virtualenv_path: /opt/fastapi-tutorial/venv
fastapi_tutorial_requirements_file: /opt/fastapi-tutorial/requirements.txt
fastapi_tutorial_service_name: fastapi-tutorial
fastapi_tutorial_service_user: root
fastapi_tutorial_listen_address: 0.0.0.0
fastapi_tutorial_listen_port: 8000
fastapi_tutorial_project_name: FastAPI Tutorial
fastapi_tutorial_api_version: 1.0.0
fastapi_tutorial_database_url_scheme: postgresql
