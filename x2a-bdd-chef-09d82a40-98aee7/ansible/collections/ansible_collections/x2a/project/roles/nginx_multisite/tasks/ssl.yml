---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create SSL certificate group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Grant nginx access to SSL private keys
  ansible.builtin.user:
    name: nginx
    groups: ssl-cert
    append: true
    state: present

- name: Create SSL certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_certificate_path }}" # noqa: R114 - path from role default
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create SSL private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}" # noqa: R114 - path from role default
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Check existing SSL certificates
  ansible.builtin.stat:
    path: "{{ nginx_multisite_certificate_path }}/{{ item_nginx_multisite_ssl['key'] }}.crt" # noqa: R114 - path from role-defined sites
  when: item_nginx_multisite_ssl['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_ssl
  register: nginx_multisite_certificate_stats

- name: Check existing SSL private keys
  ansible.builtin.stat:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite_ssl['key'] }}.key" # noqa: R114 - path from role-defined sites
  when: item_nginx_multisite_ssl['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_ssl
  register: nginx_multisite_key_stats

- name: Generate self-signed SSL certificates # noqa: L039 - statistics are registered by prior tasks
  ansible.builtin.command: # noqa: R101 - command arguments come from role-defined SSL paths and sites
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite_ssl['key'] }}.key"
      - -out
      - "{{ nginx_multisite_certificate_path }}/{{ item_nginx_multisite_ssl['key'] }}.crt"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_multisite_ssl['key'] }}/emailAddress=admin@example.com
  changed_when: true
  when:
    - item_nginx_multisite_ssl['value']['ssl_enabled']
    - not (nginx_multisite_certificate_stats.results[ansible_loop.index0]['stat']['exists'] | default(false)) or not (nginx_multisite_key_stats.results[ansible_loop.index0]['stat']['exists'] | default(false))
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_ssl
  notify: Reload nginx

- name: Set SSL private key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite_ssl['key'] }}.key" # noqa: R114 - path from role-defined sites
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  when: item_nginx_multisite_ssl['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_ssl
