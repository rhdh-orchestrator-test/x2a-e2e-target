---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload security sysctl
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.rp_filter
    value: "1"
    sysctl_file: /etc/sysctl.d/99-security.conf
    sysctl_set: true
    reload: true
    state: present

- name: Restart sshd # noqa: L039 - variable comes from role defaults or inventory and has a safe default
  ansible.builtin.service:
    name: "{{ nginx_multisite_sshd_service | default('sshd' if ansible_facts['os_family'] == 'RedHat' else 'ssh') }}"
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
