---
controller_credential_types:
  - name: Redis Authentication
    description: Authentication password for the candidate Redis instance on port 6379; the source plan marks this reference as requiring verification.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password used by Redis clients to authenticate to the Redis instance.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
