---
argument_specs:
  main:
    short_description: Deploy Chef Automate and Chef Infra Server
    description:
      - Deploys Chef Automate and Chef Infra Server on a Linux system
      - Sets system parameters, downloads the Chef Automate CLI
      - Deploys Chef Automate and Infra Server products
      - Creates a user and organization in Chef Server
    options:
      chef_automate_hostname:
        type: str
        required: false
        default: automate.chef.lab
        description: Hostname to set for the Chef Automate server
      chef_automate_cli_url:
        type: str
        required: false
        default: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
        description: URL to download the Chef Automate CLI
      chef_automate_cli_path:
        type: str
        required: false
        default: /tmp/chef-automate
        description: Path where the Chef Automate CLI will be installed
      chef_automate_vm_max_map_count:
        type: int
        required: false
        default: 262144
        description: Value for vm.max_map_count kernel parameter
      chef_automate_vm_dirty_expire_centisecs:
        type: int
        required: false
        default: 20000
        description: Value for vm.dirty_expire_centisecs kernel parameter
      chef_automate_accept_terms:
        type: bool
        required: false
        default: true
        description: Whether to accept Chef Automate terms and MLSA
      chef_automate_user_pem_path:
        type: str
        required: false
        default: /tmp/{{ username }}.pem
        description: Path where the user PEM file will be saved
      chef_automate_org_pem_path:
        type: str
        required: false
        default: /tmp/{{ org_name }}-validator.pem
        description: Path where the organization validator PEM file will be saved
      username:
        type: str
        required: true
        description: Chef user name (injected by AAP credential)
      long_username:
        type: str
        required: true
        description: Chef user's full name (injected by AAP credential)
      user_email:
        type: str
        required: true
        description: Chef user's email address (injected by AAP credential)
      user_password:
        type: str
        required: true
        description: Chef user's password (injected by AAP credential)
      org_name:
        type: str
        required: true
        description: Chef organization short name (injected by AAP credential)
      long_org_name:
        type: str
        required: true
        description: Chef organization full name (injected by AAP credential)
