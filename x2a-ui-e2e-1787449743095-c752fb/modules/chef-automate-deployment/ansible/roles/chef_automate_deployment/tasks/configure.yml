---
- name: Ensure directory for PEM files exists with proper permissions
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_pem_path }}"
    - "{{ chef_automate_org_pem_path }}"
  become: true
- name: Create Chef user
  ansible.builtin.command: 'chef-server-ctl user-create {{ username }} {{ long_username }} {{ user_email }} "{{ user_password }}" --filename {{ chef_automate_user_pem_path
    }}

    '
  args:
    creates: "{{ chef_automate_user_pem_path }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command: 'chef-server-ctl org-create {{ org_name }} "{{ long_org_name }}" --association_user {{ username }} --filename {{ chef_automate_org_pem_path
    }}

    '
  args:
    creates: "{{ chef_automate_org_pem_path }}"
  become: true
