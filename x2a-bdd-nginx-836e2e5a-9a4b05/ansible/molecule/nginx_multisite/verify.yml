---
# Unsupported without an expected outcome: package/service status listings, nginx -t,
# sshd -t, fail2ban-client status, kernel sysctl values, listening-process listings,
# log tails, and reload/notification history.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify HTTP redirects for configured sites
      ansible.builtin.uri:
        url: "http://127.0.0.1/"
        headers:
          Host: "{{ item_site['hostname'] }}"
        follow_redirects: none
        return_content: false
        status_code: 301
      loop:
        - hostname: test.cluster.local
        - hostname: ci.cluster.local
        - hostname: status.cluster.local
      loop_control:
        loop_var: item_site

    - name: Verify HTTPS serves each configured site
      ansible.builtin.uri:
        url: "https://127.0.0.1/"
        headers:
          Host: "{{ item_site['hostname'] }}"
        validate_certs: false
        return_content: true
        status_code: 200
      loop:
        - hostname: test.cluster.local
        - hostname: ci.cluster.local
        - hostname: status.cluster.local
      loop_control:
        loop_var: item_site

    - name: Verify generated certificate common names
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['certificate'] }}"
          - -noout
          - -subject
      register: certificate_subjects
      changed_when: false
      loop:
        - hostname: test.cluster.local
          certificate: /etc/ssl/certs/test.cluster.local.crt
        - hostname: ci.cluster.local
          certificate: /etc/ssl/certs/ci.cluster.local.crt
        - hostname: status.cluster.local
          certificate: /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_certificate

    - name: Assert generated certificate common names
      ansible.builtin.assert:
        that:
          - item_certificate_result['stdout'] is search('CN = ' ~ item_certificate_result['item']['hostname'])
      loop: "{{ certificate_subjects['results'] }}"
      loop_control:
        loop_var: item_certificate_result

    - name: Verify private key modes and ownership
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
      register: private_keys
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key

    - name: Assert private key modes and ownership
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['exists']
          - item_key_result['stat']['mode'] == '0640'
          - item_key_result['stat']['pw_name'] == 'root'
          - item_key_result['stat']['gr_name'] == 'ssl-cert'
      loop: "{{ private_keys['results'] }}"
      loop_control:
        loop_var: item_key_result

    - name: Verify document roots and index files
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
      register: site_paths
      loop:
        - path: /opt/server/test
          mode: '0755'
          owner: www-data
          group: www-data
        - path: /opt/server/test/index.html
          mode: '0644'
          owner: www-data
          group: www-data
        - path: /opt/server/ci
          mode: '0755'
          owner: www-data
          group: www-data
        - path: /opt/server/ci/index.html
          mode: '0644'
          owner: www-data
          group: www-data
        - path: /opt/server/status
          mode: '0755'
          owner: www-data
          group: www-data
        - path: /opt/server/status/index.html
          mode: '0644'
          owner: www-data
          group: www-data
      loop_control:
        loop_var: item_path

    - name: Assert document root and index file metadata
      ansible.builtin.assert:
        that:
          - item_site_path['stat']['exists']
          - item_site_path['stat']['mode'] == item_site_path['item']['mode']
          - item_site_path['stat']['pw_name'] == item_site_path['item']['owner']
          - item_site_path['stat']['gr_name'] == item_site_path['item']['group']
      loop: "{{ site_paths['results'] }}"
      loop_control:
        loop_var: item_site_path

    - name: Verify enabled site link targets
      ansible.builtin.stat:
        path: "{{ item_link['path'] }}"
        follow: false
      register: enabled_links
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_link

    - name: Assert enabled site link targets
      ansible.builtin.assert:
        that:
          - item_enabled_link['stat']['islnk']
          - item_enabled_link['stat']['lnk_source'] == item_enabled_link['item']['target']
      loop: "{{ enabled_links['results'] }}"
      loop_control:
        loop_var: item_enabled_link

    - name: Verify the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']

    - name: Read SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: ssh_config

    - name: Assert SSH root login and password authentication are disabled
      ansible.builtin.assert:
        that:
          - (ssh_config['content'] | b64decode) is search('(?m)^PermitRootLogin\\s+no\\s*$')
          - (ssh_config['content'] | b64decode) is search('(?m)^PasswordAuthentication\\s+no\\s*$')

    - name: Verify UFW allows SSH HTTP and HTTPS
      ansible.builtin.command:
        argv:
          - ufw
          - status
      register: ufw_status
      changed_when: false

    - name: Assert UFW allows SSH HTTP and HTTPS
      ansible.builtin.assert:
        that:
          - ufw_status['stdout'] is search('22/tcp')
          - ufw_status['stdout'] is search('80/tcp')
          - ufw_status['stdout'] is search('443/tcp')

    - name: Verify SSH is listening on TCP port 22
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 22
        state: started
        timeout: 5
