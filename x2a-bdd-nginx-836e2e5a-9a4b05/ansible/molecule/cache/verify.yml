---
# Unsupported pre-flight checks: service status/enablement, process and socket diagnostics,
# Redis authenticated checks, configuration value grep, service logs, and authenticated
# write/read checks have no usable expected result here or require a protected password.
- name: Verify cache instance files and cleanup
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: item_redis_config

    - name: Assert Redis configuration file exists
      ansible.builtin.assert:
        that:
          - item_redis_config['stat']['exists']
          - item_redis_config['stat']['isreg']
        fail_msg: Redis configuration file is missing or is not a regular file.

    - name: Read Redis configuration for cleanup verification
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: item_redis_config_content

    - name: Assert Chef cleanup directives are absent
      ansible.builtin.assert:
        that:
          - >-
            (item_redis_config_content['content'] | b64decode) is not
            search('(?m)^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)')
        fail_msg: One or more Redis cleanup directives are still present.

    - name: Verify Redis log directory metadata
      ansible.builtin.stat:
        path: /var/log/redis
      register: item_redis_log_directory

    - name: Assert Redis log directory has expected metadata
      ansible.builtin.assert:
        that:
          - item_redis_log_directory['stat']['exists']
          - item_redis_log_directory['stat']['isdir']
          - item_redis_log_directory['stat']['mode'] == '0755'
          - item_redis_log_directory['stat']['pw_name'] == 'redis'
          - item_redis_log_directory['stat']['gr_name'] == 'redis'
        fail_msg: Redis log directory is missing or has unexpected metadata.
