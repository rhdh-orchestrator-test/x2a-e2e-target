---
argument_specs:
  main:
    short_description: Install and configure a standalone Redis cache
    description:
      - Installs Redis through the approved Redis collection and configures one authenticated instance.
      - Creates the Redis log directory and removes obsolete replication directives from the generated configuration.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations that handle the Redis password.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for the Redis instance.
      cache_redis_version:
        type: str
        required: false
        default: "7.2"
        description: Redis version to install.
      cache_redis_install_method:
        type: str
        required: false
        default: package
        description: Redis installation method.
      cache_redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis cluster mode is enabled.
      cache_redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis Sentinel mode is enabled.
      cache_redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis replication is enabled.
      cache_redis_aof_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis AOF persistence is enabled.
      cache_redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Whether Redis RDB persistence is enabled.
      cache_redis_config_path:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration file cleaned after collection configuration.
      cache_redis_service_name:
        type: str
        required: false
        default: redis
        description: Redis service name used by the restart handler.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
