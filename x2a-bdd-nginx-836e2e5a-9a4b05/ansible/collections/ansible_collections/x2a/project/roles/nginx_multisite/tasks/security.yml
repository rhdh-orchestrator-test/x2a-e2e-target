---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
      - procps
    state: present

- name: Ensure fail2ban is enabled and started
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Configure fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Check UFW status
  ansible.builtin.command:
    cmd: ufw status verbose
  register: nginx_multisite_ufw_status
  changed_when: false
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default policy # noqa: L039 - registered by prior task when UFW is enabled
  ansible.builtin.command:
    cmd: ufw --force default deny
  changed_when: true
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Default: deny' not in nginx_multisite_ufw_status.stdout"

- name: Allow SSH through UFW
  ansible.builtin.command:
    cmd: ufw allow ssh
  changed_when: "'Skipping' not in nginx_multisite_ufw_ssh.stdout"
  register: nginx_multisite_ufw_ssh
  when: nginx_multisite_ufw_enabled | bool

- name: Allow HTTP through UFW
  ansible.builtin.command:
    cmd: ufw allow http
  changed_when: "'Skipping' not in nginx_multisite_ufw_http.stdout"
  register: nginx_multisite_ufw_http
  when: nginx_multisite_ufw_enabled | bool

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    cmd: ufw allow https
  changed_when: "'Skipping' not in nginx_multisite_ufw_https.stdout"
  register: nginx_multisite_ufw_https
  when: nginx_multisite_ufw_enabled | bool

- name: Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  changed_when: "'already active' not in nginx_multisite_ufw_enable.stdout"
  register: nginx_multisite_ufw_enable
  when: nginx_multisite_ufw_enabled | bool

- name: Configure kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx multisite sysctl

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    state: present
  when: nginx_multisite_ssh_disable_root | bool
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    state: present
  when: not nginx_multisite_ssh_password_auth | bool
  notify: Restart SSH
