---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI system packages # noqa: R113 - package list is fixed in the role, not user-provided
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path from role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize FastAPI tutorial repository # noqa: R104 - repository URL comes from role defaults and uses HTTPS
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R106 - repository URL comes from role defaults, not untrusted input
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path from role default, not user input
    version: "{{ fastapi_tutorial_revision }}"

- name: Create virtual environment parent directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_venv_path | dirname }}" # noqa: R114 - path from role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Python virtual environment # noqa: R101 - command uses role-default virtual environment path
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_path }}"
    creates: "{{ fastapi_tutorial_venv_path }}/bin/python" # noqa: R114 - path from role default, not user input

- name: Install Python dependencies # noqa: R113 - requirements and virtualenv paths come from role defaults
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_venv_path }}"

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL application role # noqa: L039 - credentials are validated by the preceding task
  ansible.builtin.command: # noqa: R101 - SQL command uses validated credential variables
    argv:
      - psql
      - --username=postgres
      - --command
      - DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ db_username }}') THEN CREATE ROLE {{ db_username }} LOGIN PASSWORD '{{ db_password }}'; ELSE ALTER ROLE {{ db_username }} PASSWORD '{{ db_password }}'; END IF; END $$;
  become: true # noqa: R108 - PostgreSQL role management requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether FastAPI database exists # noqa: L039 - database_name is validated by the preceding task
  ansible.builtin.command: # noqa: R101 - SQL command uses the validated database name
    argv:
      - psql
      - --username=postgres
      - --tuples-only
      - --no-align
      - --command
      - SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}';
  changed_when: false
  register: fastapi_tutorial_database_exists
  become: true # noqa: R108 - PostgreSQL inspection requires the postgres account
  become_user: postgres

- name: Create FastAPI database # noqa: L039 - database variables are validated by the preceding task
  ansible.builtin.command: # noqa: R101 - command uses validated database variables
    argv:
      - createdb
      - --owner={{ db_username }}
      - "{{ database_name }}"
  when: "'1' not in fastapi_tutorial_database_exists.stdout"
  become: true # noqa: R108 - database creation requires the postgres account
  become_user: postgres

- name: Grant database privileges to FastAPI role # noqa: L039 - database variables are validated by the preceding task
  ansible.builtin.command: # noqa: R101 - SQL command uses validated database variables
    argv:
      - psql
      - --username=postgres
      - --command
      - GRANT ALL PRIVILEGES ON DATABASE "{{ database_name }}" TO "{{ db_username }}";
  changed_when: false
  become: true # noqa: R108 - PostgreSQL privilege management requires the postgres account
  become_user: postgres

- name: Deploy application environment
  ansible.builtin.template:
    src: fastapi_tutorial.env.j2
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - path from role default, not user input
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"
  notify: Restart FastAPI tutorial

- name: Deploy FastAPI systemd unit # noqa: R114 - service path uses the role-default service name
  ansible.builtin.template:
    src: fastapi_tutorial.service.j2
    dest: "/etc/systemd/system/{{ fastapi_tutorial_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart FastAPI tutorial

- name: Reload systemd manager configuration
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
