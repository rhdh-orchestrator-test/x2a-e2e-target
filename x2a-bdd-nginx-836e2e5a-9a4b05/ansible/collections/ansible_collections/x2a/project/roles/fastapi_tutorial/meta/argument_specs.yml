---
argument_specs:
  main:
    short_description: Deploy and configure the FastAPI tutorial application.
    description:
      - Installs the FastAPI tutorial application and its Python dependencies.
      - Configures PostgreSQL and manages the FastAPI systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application installation directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment path.
      fastapi_tutorial_bind_address:
        type: str
        required: false
        default: 0.0.0.0
        description: Address on which Uvicorn listens.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which Uvicorn listens.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_database_url_scheme:
        type: str
        required: false
        default: postgresql
        description: Database URL scheme used by the application.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide tasks that handle the database password from logs.
      db_username:
        type: str
        required: true
        description: PostgreSQL username injected by the AAP credential type.
      db_password:
        type: str
        required: true
        description: PostgreSQL password injected by the AAP credential type.
      db_host:
        type: str
        required: true
        description: PostgreSQL host injected by the AAP credential type.
      database_name:
        type: str
        required: true
        description: PostgreSQL database name injected by the AAP credential type.
