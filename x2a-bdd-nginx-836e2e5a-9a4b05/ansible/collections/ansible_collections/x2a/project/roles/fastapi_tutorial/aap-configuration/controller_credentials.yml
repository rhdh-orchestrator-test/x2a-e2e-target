---
controller_credentials:
  - name: PostgreSQL Application Database - fastapi_tutorial
    description: Credentials for the FastAPI application's PostgreSQL role and database connection. The password is currently hardcoded and must be migrated as 
      the encrypted variable fastapi_db_password.
    organization: Default
    credential_type: PostgreSQL Application Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      db_host: "{{ db_host }}"
      database_name: "{{ database_name }}"
