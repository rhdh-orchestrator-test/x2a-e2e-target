---
controller_credential_types:
  - name: PostgreSQL Application Database
    description: Credentials for the FastAPI application's PostgreSQL role and database connection. The password is currently hardcoded and must be migrated as 
      the encrypted variable fastapi_db_password.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application; currently fastapi.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; migrate the hardcoded value to the encrypted variable fastapi_db_password.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server; currently localhost.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application; currently fastapi_db.
      required:
        - db_username
        - db_password
        - db_host
        - database_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_host: !unsafe "{{ db_host }}"
        database_name: !unsafe "{{ database_name }}"
