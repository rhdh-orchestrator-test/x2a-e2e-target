- name: Converge
  hosts: all
  gather_facts: false
  tasks:
  - name: Create expected Redis directories
    ansible.builtin.file:
      path: '{{ item_dir }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/log/redis
    loop_control:
      loop_var: item_dir
  - name: Create Redis configuration file
    ansible.builtin.copy:
      content: '# Redis configuration file

        port 6379

        bind 127.0.0.1

        dir /var/lib/redis

        logfile /var/log/redis/redis-server.log

        daemonize yes

        pidfile /var/run/redis/redis-server.pid

        timeout 0

        tcp-keepalive 0

        loglevel notice

        databases 16

        save 900 1

        save 300 10

        save 60 10000

        stop-writes-on-bgsave-error yes

        rdbcompression yes

        rdbchecksum yes

        dbfilename dump.rdb

        '
      dest: /tmp/molecule_test/etc/redis/redis.conf
      mode: '0644'
      backup: true
  - name: Create Redis log file
    ansible.builtin.copy:
      content: '[1] 01 Jan 00:00:00.000 # Server started, Redis version 6.0.16

        [1] 01 Jan 00:00:00.000 * Ready to accept connections

        [1] 01 Jan 00:00:00.000 * The server is now ready to accept connections on port 6379

        '
      dest: /tmp/molecule_test/var/log/redis/redis-server.log
      mode: '0644'
      backup: true
  - name: Create Redis data directory with proper ownership simulation
    ansible.builtin.file:
      path: /tmp/molecule_test/var/lib/redis
      state: directory
      mode: '0755'
  - name: Create Redis PID directory
    ansible.builtin.file:
      path: /tmp/molecule_test/var/run/redis
      state: directory
      mode: '0755'
