- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check if Apache SSL configuration file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_conf_file
  - name: Assert SSL configuration file exists
    ansible.builtin.assert:
      that:
      - ssl_conf_file.stat.exists
      - ssl_conf_file.stat.isreg
      fail_msg: Apache SSL configuration file not found
      success_msg: Apache SSL configuration file exists
  - name: Get SSL configuration file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_conf_content
    when: ssl_conf_file.stat.exists
  - name: Assert SSL protocol is properly configured
    ansible.builtin.assert:
      that:
      - ssl_conf_content.content | b64decode | regex_search('SSLProtocol -all \+TLSv1\.2')
      fail_msg: SSL protocol configuration not properly updated to mitigate POODLE vulnerability
      success_msg: SSL protocol configuration correctly updated to mitigate POODLE vulnerability
    when: ssl_conf_file.stat.exists
  - name: Verify Apache configuration syntax
    ansible.builtin.command: apache2ctl configtest
    changed_when: false
    tags: molecule-notest
  - name: Check SSL/TLS configuration
    ansible.builtin.command: nmap --script ssl-enum-ciphers -p 443 localhost
    changed_when: false
    tags: molecule-notest
  - name: Verify SSH configuration
    ansible.builtin.command: sshd -t
    changed_when: false
    tags: molecule-notest
  - name: Test TLS version support
    ansible.builtin.command: openssl s_client -connect localhost:443 -tls1_2
    changed_when: false
    tags: molecule-notest
  - name: Check Apache service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Apache service is running
    ansible.builtin.assert:
      that:
      - '''apache2.service'' in ansible_facts.services'
      - ansible_facts.services['apache2.service'].state == 'running'
      fail_msg: Apache service is not running
      success_msg: Apache service is running
    tags: molecule-notest
  - name: Assert SSH service is running
    ansible.builtin.assert:
      that:
      - '''sshd.service'' in ansible_facts.services'
      - ansible_facts.services['sshd.service'].state == 'running'
      fail_msg: SSH service is not running
      success_msg: SSH service is running
    tags: molecule-notest
