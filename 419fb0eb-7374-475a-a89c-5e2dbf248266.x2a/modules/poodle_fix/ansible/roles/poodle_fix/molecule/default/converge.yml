- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/apache2/mods-available
  - name: Create mock Apache SSL configuration file
    ansible.builtin.copy:
      content: '# This is a mock Apache SSL configuration file for testing

        # Original line that will be replaced by the role

        SSLProtocol all -SSLv3


        # Other SSL configuration directives

        SSLHonorCipherOrder on

        SSLCipherSuite HIGH:!aNULL:!MD5

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Simulate Apache installation
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/sbin/apache2
      state: touch
      mode: '0755'
  - name: Simulate SSH server installation
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/sbin/sshd
      state: touch
      mode: '0755'
  - name: Fix SSL in Apache (molecule test version)
    ansible.builtin.replace:
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
