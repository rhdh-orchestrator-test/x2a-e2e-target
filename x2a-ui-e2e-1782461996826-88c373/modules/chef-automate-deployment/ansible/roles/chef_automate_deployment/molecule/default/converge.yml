- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directories for system configuration
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab/sup/default/data
    - /tmp/molecule_test/home/ansible
  - name: Create vm.max_map_count file
    ansible.builtin.copy:
      content: '262144'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create vm.dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '20000'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.file:
      path: /tmp/molecule_test/home/ansible/chef-automate
      state: touch
      mode: '0755'
  - name: Create Chef Automate CLI zip file
    ansible.builtin.file:
      path: /tmp/molecule_test/home/ansible/chef-automate.zip
      state: touch
      mode: '0644'
  - name: Create services.dat file to simulate successful deployment
    ansible.builtin.file:
      path: /tmp/molecule_test/hab/sup/default/data/services.dat
      state: touch
      mode: '0644'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/home/ansible/jtonello.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/home/ansible/lab-validator.pem
      mode: '0600'
  - name: Create chef-server-ctl status output file
    ansible.builtin.copy:
      content: 'run: service_name: running

        log: service_name: running

        postgresql: service_name: running

        nginx: service_name: running

        bookshelf: service_name: running

        '
      dest: /tmp/molecule_test/etc/chef-server-status
      mode: '0644'
  - name: Create chef-automate status output file
    ansible.builtin.copy:
      content: 'deployment-service: running

        automate-postgresql: running

        automate-elasticsearch: running

        automate-ui: running

        automate-gateway: running

        '
      dest: /tmp/molecule_test/etc/chef-automate-status
      mode: '0644'
  - name: Create user list output file
    ansible.builtin.copy:
      content: 'jtonello pivotal '
      dest: /tmp/molecule_test/etc/chef-server-users
      mode: '0644'
  - name: Create organization list output file
    ansible.builtin.copy:
      content: 'lab '
      dest: /tmp/molecule_test/etc/chef-server-orgs
      mode: '0644'
  - name: Create netstat output file for port 443
    ansible.builtin.copy:
      content: 'tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/nginx '
      dest: /tmp/molecule_test/etc/netstat-output
      mode: '0644'
