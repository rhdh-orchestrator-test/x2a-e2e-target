- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname configuration
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is correctly set
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname is not set correctly
      success_msg: Hostname is set correctly
    when: hostname_file.stat.exists
  - name: Check vm.max_map_count parameter
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_file
  - name: Assert vm.max_map_count file exists
    ansible.builtin.assert:
      that:
      - max_map_count_file.stat.exists
      fail_msg: vm.max_map_count file not found
      success_msg: vm.max_map_count file exists
  - name: Get vm.max_map_count content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_content
    when: max_map_count_file.stat.exists
  - name: Assert vm.max_map_count is correctly set
    ansible.builtin.assert:
      that:
      - (max_map_count_content.content | b64decode | trim) == "262144"
      fail_msg: vm.max_map_count is not set correctly
      success_msg: vm.max_map_count is set correctly
    when: max_map_count_file.stat.exists
  - name: Check vm.dirty_expire_centisecs parameter
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_file
  - name: Assert vm.dirty_expire_centisecs file exists
    ansible.builtin.assert:
      that:
      - dirty_expire_centisecs_file.stat.exists
      fail_msg: vm.dirty_expire_centisecs file not found
      success_msg: vm.dirty_expire_centisecs file exists
  - name: Get vm.dirty_expire_centisecs content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_content
    when: dirty_expire_centisecs_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is correctly set
    ansible.builtin.assert:
      that:
      - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
      fail_msg: vm.dirty_expire_centisecs is not set correctly
      success_msg: vm.dirty_expire_centisecs is set correctly
    when: dirty_expire_centisecs_file.stat.exists
  - name: Check Chef Automate CLI
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check services.dat file
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/sup/default/data/services.dat
    register: services_dat
  - name: Assert services.dat file exists
    ansible.builtin.assert:
      that:
      - services_dat.stat.exists
      fail_msg: services.dat file not found, deployment may have failed
      success_msg: services.dat file exists, deployment successful
  - name: Check Chef Automate status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate-status
    register: chef_automate_status_file
  - name: Get Chef Automate status content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/chef-automate-status
    register: chef_automate_status_content
    when: chef_automate_status_file.stat.exists
    tags: molecule-notest
  - name: Assert Chef Automate services are running
    ansible.builtin.assert:
      that:
      - chef_automate_status_content.content | b64decode | string | search('running')
      fail_msg: Chef Automate services not running
      success_msg: Chef Automate services running
    when: chef_automate_status_file.stat.exists
    tags: molecule-notest
  - name: Check Chef Infra Server status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-server-status
    register: chef_server_status_file
  - name: Get Chef Infra Server status content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/chef-server-status
    register: chef_server_status_content
    when: chef_server_status_file.stat.exists
    tags: molecule-notest
  - name: Assert Chef Infra Server services are running
    ansible.builtin.assert:
      that:
      - chef_server_status_content.content | b64decode | string | search('running')
      fail_msg: Chef Infra Server services not running
      success_msg: Chef Infra Server services running
    when: chef_server_status_file.stat.exists
    tags: molecule-notest
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/jtonello.pem
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      fail_msg: User key file not found
      success_msg: User key file exists
  - name: Check user list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-server-users
    register: user_list_file
  - name: Get user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/chef-server-users
    register: user_list_content
    when: user_list_file.stat.exists
    tags: molecule-notest
  - name: Assert user was created
    ansible.builtin.assert:
      that:
      - user_list_content.content | b64decode | string | search('jtonello')
      fail_msg: User jtonello not found in user list
      success_msg: User jtonello found in user list
    when: user_list_file.stat.exists
    tags: molecule-notest
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/lab-validator.pem
    register: org_key_file
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      fail_msg: Organization validator key file not found
      success_msg: Organization validator key file exists
  - name: Check organization list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-server-orgs
    register: org_list_file
  - name: Get organization list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/chef-server-orgs
    register: org_list_content
    when: org_list_file.stat.exists
    tags: molecule-notest
  - name: Assert organization was created
    ansible.builtin.assert:
      that:
      - org_list_content.content | b64decode | string | search('lab')
      fail_msg: Organization lab not found in organization list
      success_msg: Organization lab found in organization list
    when: org_list_file.stat.exists
    tags: molecule-notest
  - name: Check netstat output file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/netstat-output
    register: netstat_file
  - name: Get netstat output content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/netstat-output
    register: netstat_content
    when: netstat_file.stat.exists
    tags: molecule-notest
  - name: Assert service is listening on port 443
    ansible.builtin.assert:
      that:
      - netstat_content.content | b64decode | string | search('0.0.0.0:443')
      fail_msg: No service found listening on port 443
      success_msg: Service found listening on port 443
    when: netstat_file.stat.exists
    tags: molecule-notest
  - name: Check web UI access
    ansible.builtin.uri:
      url: https://localhost
      validate_certs: false
    register: web_ui_access
    failed_when: false
    tags: molecule-notest
