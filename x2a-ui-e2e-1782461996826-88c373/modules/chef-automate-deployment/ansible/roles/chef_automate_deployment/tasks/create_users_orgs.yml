---
- name: Verify Chef Infra Server is installed
  ansible.builtin.stat:
    path: /hab/sup/default/data/services.dat
  register: chef_server_installed
  become: true
- name: Fail if Chef Infra Server is not installed
  ansible.builtin.fail:
    msg: Chef Infra Server is not installed. Please run the deploy_chef_server.yml tasks first.
  when: not chef_server_installed.stat.exists
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_key_path }}"
    - "{{ chef_automate_org_key_path }}"
  when: item | dirname != '.'
- name: Create Chef Infra Server user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_automate_user_key_path }}

      '
  become: true
  args:
    creates: "{{ chef_automate_user_key_path }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
- name: Create Chef Infra Server organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_orgname }} "{{ chef_automate_longorgname }}" --association_user {{ username }} --filename {{ chef_automate_org_key_path
      }}

      '
  become: true
  args:
    creates: "{{ chef_automate_org_key_path }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
