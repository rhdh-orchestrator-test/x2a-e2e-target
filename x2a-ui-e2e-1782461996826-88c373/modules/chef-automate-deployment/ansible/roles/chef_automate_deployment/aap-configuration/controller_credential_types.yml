---
controller_credential_types:
- name: Chef Infra Server User
  description: Credential type for Chef Infra Server User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for the Chef Infra Server admin user
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef Infra Server admin user
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the Chef Infra Server admin user
    - id: email
      type: string
      label: Email
      help_text: Email address of the Chef Infra Server admin user
    required:
    - username
    - password
    - full_name
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
