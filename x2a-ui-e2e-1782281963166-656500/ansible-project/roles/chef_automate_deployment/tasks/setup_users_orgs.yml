---
- name: Ensure Chef Server CLI is available
  ansible.builtin.command:
    cmd: chef-automate status
  register: chef_server_status
  changed_when: false
  failed_when: "'chef-server' not in chef_server_status.stdout"
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_user_name }} {{ chef_user_fullname }} {{ chef_user_email }} "{{ chef_user_password }}" --filename {{
      chef_user_key_file }}
  become: true
  register: create_user_result
  changed_when: create_user_result.rc == 0
  failed_when: create_user_result.rc != 0
  args:
    creates: "{{ chef_user_key_file }}"
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_fullname }}" --association_user {{ chef_user_name }} --filename {{ chef_org_validator_key
      }}
  become: true
  register: create_org_result
  changed_when: create_org_result.rc == 0
  failed_when: create_org_result.rc != 0
  args:
    creates: "{{ chef_org_validator_key }}"
