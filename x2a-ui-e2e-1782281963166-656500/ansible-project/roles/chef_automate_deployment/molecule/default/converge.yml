- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname | default(''automate.chef.lab'') }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_max_map_count | default(''262144'') }}'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_dirty_expire_centisecs | default(''20000'') }}'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create chef-automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK USER KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/{{ chef_user_name | default('jtonello') }}.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK ORGANIZATION VALIDATOR KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/{{ chef_org_name | default('lab') }}-validator.pem
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: automate-gateway

        Status: running

        Service: automate-postgresql

        Status: running

        Service: chef-server

        Status: running

        '
      dest: /tmp/molecule_test/tmp/chef-automate-status
      mode: '0644'
  - name: Create Chef Server status file
    ansible.builtin.copy:
      content: 'run: chef-server: (pid 12345) 123s; run: log: (pid 12346) 123s

        run: chef-solr: (pid 12347) 123s; run: log: (pid 12348) 123s

        run: postgresql: (pid 12349) 123s; run: log: (pid 12350) 123s

        '
      dest: /tmp/molecule_test/tmp/chef-server-status
      mode: '0644'
  - name: Create Chef user list file
    ansible.builtin.copy:
      content: '{{ chef_user_name | default(''jtonello'') }} '
      dest: /tmp/molecule_test/tmp/chef-user-list
      mode: '0644'
  - name: Create Chef organization list file
    ansible.builtin.copy:
      content: '{{ chef_org_name | default(''lab'') }} '
      dest: /tmp/molecule_test/tmp/chef-org-list
      mode: '0644'
