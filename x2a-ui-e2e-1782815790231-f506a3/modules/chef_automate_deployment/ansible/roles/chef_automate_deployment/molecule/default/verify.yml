- name: Verify
  hosts: all
  gather_facts: true
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file was created
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check hosts file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hosts
    register: hosts_file
  - name: Assert hosts file was created
    ansible.builtin.assert:
      that:
      - hosts_file.stat.exists
      - hosts_file.stat.size > 0
      fail_msg: Hosts file not found
      success_msg: Hosts file exists
  - name: Get hosts file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hosts
    register: hosts_content
    when: hosts_file.stat.exists
  - name: Assert hosts file contains hostname entry
    ansible.builtin.assert:
      that:
      - (hosts_content.content | b64decode) is search("automate.chef.lab")
      fail_msg: Hosts file does not contain hostname entry
      success_msg: Hosts file contains hostname entry
    when: hosts_file.stat.exists
  - name: Check sysctl settings file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl settings file was created
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Sysctl settings file not found
      success_msg: Sysctl settings file exists
  - name: Get sysctl settings file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - (sysctl_content.content | b64decode) is search("vm.max_map_count = 262144")
      fail_msg: vm.max_map_count not set correctly
      success_msg: vm.max_map_count set correctly
    when: sysctl_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - (sysctl_content.content | b64decode) is search("vm.dirty_expire_centisecs = 20000")
      fail_msg: vm.dirty_expire_centisecs not set correctly
      success_msg: vm.dirty_expire_centisecs set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI was downloaded
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check user key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/keys/jtonello.pem
    register: user_key_file
  - name: Assert user key file was created
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.size > 0
      fail_msg: User key file not found
      success_msg: User key file exists
  - name: Check organization validator key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/keys/lab-validator.pem
    register: org_key_file
  - name: Assert organization validator key file was created
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.size > 0
      fail_msg: Organization validator key file not found
      success_msg: Organization validator key file exists
  - name: Check Chef Automate status file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-automate-status.json
    register: chef_automate_status_file
  - name: Assert Chef Automate status file was created
    ansible.builtin.assert:
      that:
      - chef_automate_status_file.stat.exists
      - chef_automate_status_file.stat.size > 0
      fail_msg: Chef Automate status file not found
      success_msg: Chef Automate status file exists
  - name: Check Chef Server user list file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-server-user-list.txt
    register: chef_server_user_list_file
  - name: Assert Chef Server user list file was created
    ansible.builtin.assert:
      that:
      - chef_server_user_list_file.stat.exists
      - chef_server_user_list_file.stat.size > 0
      fail_msg: Chef Server user list file not found
      success_msg: Chef Server user list file exists
  - name: Get Chef Server user list file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/hab/chef-server-user-list.txt
    register: chef_server_user_list_content
    when: chef_server_user_list_file.stat.exists
  - name: Assert user was created in Chef Server
    ansible.builtin.assert:
      that:
      - (chef_server_user_list_content.content | b64decode) is search("jtonello")
      fail_msg: User not found in Chef Server user list
      success_msg: User found in Chef Server user list
    when: chef_server_user_list_file.stat.exists
  - name: Check Chef Server org list file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-server-org-list.txt
    register: chef_server_org_list_file
  - name: Assert Chef Server org list file was created
    ansible.builtin.assert:
      that:
      - chef_server_org_list_file.stat.exists
      - chef_server_org_list_file.stat.size > 0
      fail_msg: Chef Server org list file not found
      success_msg: Chef Server org list file exists
  - name: Get Chef Server org list file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/hab/chef-server-org-list.txt
    register: chef_server_org_list_content
    when: chef_server_org_list_file.stat.exists
  - name: Assert organization was created in Chef Server
    ansible.builtin.assert:
      that:
      - (chef_server_org_list_content.content | b64decode) is search("lab")
      fail_msg: Organization not found in Chef Server org list
      success_msg: Organization found in Chef Server org list
    when: chef_server_org_list_file.stat.exists
  - name: Check Chef Automate service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      - ansible_facts.services['chef-automate.service'].state == 'running'
      fail_msg: Chef Automate service not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check Chef Infra Server service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Infra Server service is running
    ansible.builtin.assert:
      that:
      - '''chef-server.service'' in ansible_facts.services'
      - ansible_facts.services['chef-server.service'].state == 'running'
      fail_msg: Chef Infra Server service not running
      success_msg: Chef Infra Server service is running
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
  - name: Check Chef Automate health endpoint
    ansible.builtin.uri:
      url: https://localhost/api/v0/health
      validate_certs: false
      status_code: 200
    tags: molecule-notest
  - name: Check Chef Automate UI access
    ansible.builtin.uri:
      url: https://localhost
      validate_certs: false
      status_code: 200
    tags: molecule-notest
  - name: Check Chef Infra Server API access
    ansible.builtin.uri:
      url: https://localhost/organizations
      validate_certs: false
      status_code: 200
    tags: molecule-notest
