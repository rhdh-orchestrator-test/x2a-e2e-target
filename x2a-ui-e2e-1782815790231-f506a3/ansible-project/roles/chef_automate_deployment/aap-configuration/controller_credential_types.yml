---
controller_credential_types:
- name: Chef Automate Admin User
  description: Credential type for Chef Automate Admin User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Admin username for Chef Automate and Chef Infra Server
    - id: user_email
      type: string
      label: User Email
      help_text: Email address for the admin user
    - id: user_password
      type: string
      label: User Password
      secret: true
      help_text: Password for the admin user account
    required:
    - username
    - user_email
    - user_password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      user_email: !unsafe '{{ user_email }}'
      user_password: !unsafe '{{ user_password }}'
