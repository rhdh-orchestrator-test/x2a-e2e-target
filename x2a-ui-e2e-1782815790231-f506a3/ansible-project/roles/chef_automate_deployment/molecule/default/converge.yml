- name: Converge
  hosts: all
  gather_facts: true
  become: false
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/keys
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create hosts file
    ansible.builtin.copy:
      content: '127.0.0.1 localhost

        127.0.1.1 automate.chef.lab automate

        '
      dest: /tmp/molecule_test/etc/hosts
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'''
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK USER KEY CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/keys/jtonello.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK ORG VALIDATOR KEY CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/keys/lab-validator.pem
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: "{\n  \"status\": \"running\",\n  \"services\": [\n    {\"name\": \"automate-gateway\", \"status\": \"running\"},\n    {\"name\": \"automate-postgresql\",
        \"status\": \"running\"},\n    {\"name\": \"chef-server\", \"status\": \"running\"}\n  ]\n}\n"
      dest: /tmp/molecule_test/hab/chef-automate-status.json
      mode: '0644'
  - name: Create Chef Server user list file
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/hab/chef-server-user-list.txt
      mode: '0644'
  - name: Create Chef Server org list file
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/hab/chef-server-org-list.txt
      mode: '0644'
