- name: Install redis server
  ansible.builtin.package:
    name: '{{ redis_package }}'
    state: present
- name: Configure redis server
  ansible.builtin.file:
    path: /etc/redis
    state: directory
    mode: '0755'
  notify: Restart redis
- name: Enable and start redis server
  ansible.builtin.service:
    name: '{{ redis_service }}'
    state: started
    enabled: true
