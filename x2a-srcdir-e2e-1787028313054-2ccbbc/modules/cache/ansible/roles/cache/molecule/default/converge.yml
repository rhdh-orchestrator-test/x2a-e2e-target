---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/run/redis

    - name: Create expected config file
      ansible.builtin.copy:
        content: |
          # Redis configuration file example
          # Note: This is a simplified version for testing
          
          # Network
          bind 127.0.0.1
          port 6379
          
          # General
          daemonize yes
          pidfile /var/run/redis/redis-server.pid
          
          # Logging
          logfile /var/log/redis/redis-server.log
          
          # Data
          dir /var/lib/redis
        dest: /tmp/molecule_test/etc/redis/redis.conf
        mode: "0644"

    - name: Create log file
      ansible.builtin.copy:
        content: "# Redis server log file\n"
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"

    - name: Create PID file
      ansible.builtin.copy:
        content: "12345\n"
        dest: /tmp/molecule_test/var/run/redis/redis-server.pid
        mode: "0644"

    - name: Create sample data file
      ansible.builtin.copy:
        content: "# Redis data directory\n"
        dest: /tmp/molecule_test/var/lib/redis/dump.rdb
        mode: "0644"