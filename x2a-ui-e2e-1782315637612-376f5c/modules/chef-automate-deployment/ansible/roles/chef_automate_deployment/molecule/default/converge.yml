---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/tmp

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl parameters
    - name: Create sysctl files
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "/tmp/molecule_test/etc/{{ item.name }}"
        mode: "0644"
      loop:
        - name: sysctl_vm_max_map_count
          value: "vm.max_map_count = 262144"
        - name: sysctl_vm_dirty_expire_centisecs
          value: "vm.dirty_expire_centisecs = 20000"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI Mock'\n"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment files
      ansible.builtin.copy:
        content: "# Chef Automate deployment mock file"
        dest: "/tmp/molecule_test/hab/{{ item }}"
        mode: "0644"
      loop:
        - automate_deployment_status
        - chef_server_status

    # Simulate user and organization PEM files
    - name: Create user PEM file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER PEM FILE\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/jtonello.pem"
        mode: "0600"

    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORGANIZATION VALIDATOR PEM FILE\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/lab-validator.pem"
        mode: "0600"

    # Simulate Chef server user and organization lists
    - name: Create Chef server user list file
      ansible.builtin.copy:
        content: "jtonello"
        dest: "/tmp/molecule_test/chef_server_user_list"
        mode: "0644"

    - name: Create Chef server organization list file
      ansible.builtin.copy:
        content: "lab"
        dest: "/tmp/molecule_test/chef_server_org_list"
        mode: "0644"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: "Service: chef-automate\nStatus: running"
        dest: "/tmp/molecule_test/chef_automate_status"
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: "Service: chef-server\nStatus: running"
        dest: "/tmp/molecule_test/chef_server_status"
        mode: "0644"

    # Simulate health API response
    - name: Create health API response file
      ansible.builtin.copy:
        content: '{"status":"ok"}'
        dest: "/tmp/molecule_test/health_api_response"
        mode: "0644"