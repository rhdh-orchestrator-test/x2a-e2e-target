---
controller_credentials:
  - name: HAProxy Statistics Authentication - profile_haproxy
    description: Credentials used to authenticate to the HAProxy statistics endpoint; the password is currently a plaintext Hiera value and must be migrated 
      securely.
    organization: Default
    credential_type: HAProxy Statistics Authentication
    update_secrets: true
    inputs:
      stats_user: "{{ stats_user }}"
      stats_password: "{{ vault_stats_password }}"
