---
- name: Create HAProxy error directory
  ansible.builtin.file:
    path: "{{ config_dir }}/errors"
    state: directory
    owner: root
    group: "{{ group }}"
    mode: "0755"

- name: Deploy HAProxy error pages
  ansible.builtin.copy:
    src: errors/{{ item_haproxy_error }}.http
    dest: "{{ config_dir }}/errors/{{ item_haproxy_error }}.http"
    owner: root
    group: "{{ group }}"
    mode: "0644"
    backup: true
  loop:
    - "503"
    - "408"
  loop_control:
    loop_var: item_haproxy_error

- name: Render HAProxy primary configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ config_file }}"
    owner: root
    group: "{{ group }}"
    mode: "0640"
    backup: true
  no_log: "{{ profile_haproxy_secure_logging }}"

- name: Render HAProxy backend configurations
  ansible.builtin.template:
    src: backend.conf.j2
    dest: "{{ config_dir }}/conf.d/{{ item_haproxy_backend['key'] }}.cfg"
    owner: root
    group: "{{ group }}"
    mode: "0640"
    backup: true
  loop: "{{ backends | dict2items }}"
  loop_control:
    loop_var: item_haproxy_backend
  no_log: "{{ profile_haproxy_secure_logging }}"
  vars:
    backend_name: "{{ item_haproxy_backend['key'] }}"
    balance: "{{ item_haproxy_backend['value'].get('balance', 'roundrobin') }}"
    port: "{{ item_haproxy_backend['value'].get('port', 80) }}"
    servers: "{{ item_haproxy_backend['value'].get('servers', []) }}"
    health_check: "{{ item_haproxy_backend['value'].get('health_check', '') }}"
    health_interval: "{{ item_haproxy_backend['value'].get('health_interval', '') }}"
    ssl_enabled: "{{ ssl_enabled }}"

- name: Render optional HAProxy stick-table configuration
  ansible.builtin.copy:
    content: "# Managed by Ansible stick-table type ip size {{ stick_table_size }} expire {{ stick_table_expire }} "
    dest: "{{ config_dir }}/conf.d/stick-tables.cfg"
    owner: root
    group: "{{ group }}"
    mode: "0640"
    backup: true
  when: stick_table_enabled | bool
  no_log: "{{ profile_haproxy_secure_logging }}"
