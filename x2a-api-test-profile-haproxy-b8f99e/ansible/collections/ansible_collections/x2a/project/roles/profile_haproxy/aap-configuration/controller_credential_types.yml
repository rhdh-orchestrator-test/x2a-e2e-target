---
controller_credential_types:
  - name: HAProxy Statistics Authentication
    description: Credentials used to authenticate to the HAProxy statistics endpoint; the password is currently a plaintext Hiera value and must be migrated 
      securely.
    kind: cloud
    inputs:
      fields:
        - id: stats_user
          type: string
          label: Statistics Username
          help_text: Username required to access the HAProxy statistics endpoint.
        - id: stats_password
          type: string
          label: Statistics Password
          secret: true
          help_text: Password used with the statistics username to authenticate to the HAProxy statistics endpoint; store in Ansible Vault or an approved 
            external secret manager.
      required:
        - stats_user
        - stats_password
    injectors:
      extra_vars:
        stats_user: !unsafe "{{ stats_user }}"
        stats_password: !unsafe "{{ stats_password }}"
