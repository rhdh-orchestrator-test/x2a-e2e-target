---
- name: Create HAProxy systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/haproxy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy HAProxy systemd override
  ansible.builtin.template:
    src: override.conf.j2
    dest: /etc/systemd/system/haproxy.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd manager configuration

- name: Validate HAProxy configuration
  ansible.builtin.command:
    argv:
      - haproxy
      - -c
      - -f
      - "{{ config_file }}"
      - -f
      - "{{ config_dir }}/conf.d/"
  changed_when: false

- name: Enable and start HAProxy service
  ansible.builtin.service:
    name: "{{ service_name }}"
    enabled: true
    state: started

- name: Deploy HAProxy logrotate configuration
  ansible.builtin.template:
    src: haproxy.logrotate.j2
    dest: /etc/logrotate.d/haproxy
    owner: root
    group: root
    mode: "0644"
    backup: true
