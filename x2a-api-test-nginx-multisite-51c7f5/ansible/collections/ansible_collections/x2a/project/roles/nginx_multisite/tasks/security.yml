---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Render Fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Set UFW default incoming policy
  ansible.builtin.command:
    cmd: ufw --force default deny
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'already' not in nginx_multisite_ufw_default.stdout | lower"
  register: nginx_multisite_ufw_default

- name: Allow SSH through UFW
  ansible.builtin.command:
    cmd: ufw allow ssh
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Skipping' not in nginx_multisite_ufw_ssh.stdout"
  register: nginx_multisite_ufw_ssh

- name: Allow HTTP through UFW
  ansible.builtin.command:
    cmd: ufw allow http
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Skipping' not in nginx_multisite_ufw_http.stdout"
  register: nginx_multisite_ufw_http

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    cmd: ufw allow https
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Skipping' not in nginx_multisite_ufw_https.stdout"
  register: nginx_multisite_ufw_https

- name: Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'already' not in nginx_multisite_ufw_enable.stdout | lower"
  register: nginx_multisite_ufw_enable

- name: Render kernel security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    create: false
    backup: true
  when: nginx_multisite_ssh_disable_root | bool
  notify: Restart sshd

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    create: false
    backup: true
  when: not nginx_multisite_ssh_password_auth | bool
  notify: Restart sshd
