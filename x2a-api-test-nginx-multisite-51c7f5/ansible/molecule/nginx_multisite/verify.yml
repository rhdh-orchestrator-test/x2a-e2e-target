# Unsupported: journal/log output, status-display diagnostics, and certificate validity duration
# are not asserted because the pre-flight checks provide no precise machine-checkable result.
---
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Collect package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert pre-flight packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        loop:
          - fail2ban
          - ufw
          - nginx
          - openssl
          - ca-certificates
        loop_control:
          loop_var: item_package
        fail_msg: A required package is not installed.

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Assert pre-flight services are enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services'][item_service['name']]['status'] == 'running'
          - ansible_facts['services'][item_service['name']]['enabled'] | default(false) | bool
        loop:
          - name: fail2ban.service
          - name: nginx.service
        loop_control:
          loop_var: item_service
        fail_msg: A required service is not enabled and active.

    - name: Check required files and directories
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      loop:
        - path: /etc/fail2ban/jail.local
          type: file
        - path: /etc/sysctl.d/99-security.conf
          type: file
        - path: /etc/ssh/sshd_config
          type: file
        - path: /etc/nginx/nginx.conf
          type: file
        - path: /etc/nginx/conf.d/security.conf
          type: file
        - path: /opt/server/test
          type: directory
        - path: /opt/server/test/index.html
          type: file
        - path: /opt/server/ci
          type: directory
        - path: /opt/server/ci/index.html
          type: file
        - path: /opt/server/status
          type: directory
        - path: /opt/server/status/index.html
          type: file
        - path: /etc/ssl/certs
          type: directory
        - path: /etc/ssl/private
          type: directory
        - path: /etc/nginx/sites-available
          type: directory
        - path: /etc/nginx/sites-enabled
          type: directory
        - path: /etc/nginx/sites-available/test.cluster.local
          type: file
        - path: /etc/nginx/sites-available/ci.cluster.local
          type: file
        - path: /etc/nginx/sites-available/status.cluster.local
          type: file
        - path: /etc/ssl/certs/test.cluster.local.crt
          type: file
        - path: /etc/ssl/private/test.cluster.local.key
          type: file
        - path: /etc/ssl/certs/ci.cluster.local.crt
          type: file
        - path: /etc/ssl/private/ci.cluster.local.key
          type: file
        - path: /etc/ssl/certs/status.cluster.local.crt
          type: file
        - path: /etc/ssl/private/status.cluster.local.key
          type: file
      loop_control:
        loop_var: item_path
      register: required_paths

    - name: Assert required files and directories have the expected type
      ansible.builtin.assert:
        that:
          - item_path_result['stat']['exists']
          - (item_path_result['stat']['isdir'] if item_path_result['item']['type'] == 'directory'
            else item_path_result['stat']['isreg'])
        loop: "{{ required_paths['results'] }}"
        loop_control:
          loop_var: item_path_result
        fail_msg: A required pre-flight path is missing or has the wrong type.

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_link['link'] }}"
        follow: false
      loop:
        - link: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - link: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - link: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_link
      register: site_links

    - name: Resolve enabled site links
      ansible.builtin.command:
        argv:
          - readlink
          - -f
          - "{{ item_link_result['item']['link'] }}"
      changed_when: false
      loop: "{{ site_links['results'] }}"
      loop_control:
        loop_var: item_link_result
      register: resolved_links

    - name: Assert enabled site links target available configurations
      ansible.builtin.assert:
        that:
          - item_resolved['item']['stat']['islnk']
          - item_resolved['stdout'] | trim == item_resolved['item']['item']['target']
        loop: "{{ resolved_links['results'] }}"
        loop_control:
          loop_var: item_resolved
        fail_msg: An enabled site link is missing or has the wrong target.

    - name: Check default site removal
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert default site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']

    - name: Validate Nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      register: nginx_test

    - name: Assert Nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_test['rc'] == 0
          - "'syntax is ok' in nginx_test['stderr']"

    - name: Check Nginx configuration modes
      ansible.builtin.stat:
        path: "{{ item_config['path'] }}"
      loop:
        - path: /etc/nginx/nginx.conf
          mode: '0644'
        - path: /etc/nginx/conf.d/security.conf
          mode: '0644'
      loop_control:
        loop_var: item_config
      register: config_stats

    - name: Assert Nginx configuration modes
      ansible.builtin.assert:
        that:
          - item_config_result['stat']['mode'] == item_config_result['item']['mode']
        loop: "{{ config_stats['results'] }}"
        loop_control:
          loop_var: item_config_result
        fail_msg: An Nginx configuration file has the wrong mode.

    - name: Check HTTP virtual hosts
      ansible.builtin.uri:
        url: http://127.0.0.1/
        method: HEAD
        headers:
          Host: "{{ item_http['host'] }}"
        status_code: 200
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_http

    - name: Check HTTPS virtual hosts
      ansible.builtin.uri:
        url: https://127.0.0.1/
        method: HEAD
        headers:
          Host: "{{ item_https['host'] }}"
        validate_certs: false
        status_code: 200
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_https

    - name: Check private key permissions and ownership
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: key_stats

    - name: Assert private keys have the expected permissions and ownership
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['mode'] == '0640'
          - item_key_result['stat']['pw_name'] == 'root'
          - item_key_result['stat']['gr_name'] == 'ssl-cert'
        loop: "{{ key_stats['results'] }}"
        loop_control:
          loop_var: item_key_result
        fail_msg: A TLS private key has unexpected permissions or ownership.

    - name: Check Nginx listening ports
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_port }}"
        state: started
        timeout: 5
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_port

    - name: Read UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      changed_when: false
      register: ufw_status

    - name: Assert UFW pre-flight expectations
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status['stdout']"
          - "'Default: deny (incoming)' in ufw_status['stdout']"
          - "'22' in ufw_status['stdout'] or 'SSH' in ufw_status['stdout']"
          - "'80' in ufw_status['stdout'] or 'HTTP' in ufw_status['stdout']"
          - "'443' in ufw_status['stdout'] or 'HTTPS' in ufw_status['stdout']"

    - name: Validate Fail2ban status
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
      changed_when: false
      register: fail2ban_status

    - name: Assert Fail2ban accepts its configuration
      ansible.builtin.assert:
        that:
          - fail2ban_status['rc'] == 0

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false
      register: sshd_test

    - name: Read effective SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -T
      changed_when: false
      register: sshd_effective

    - name: Assert effective SSH settings
      ansible.builtin.assert:
        that:
          - sshd_test['rc'] == 0
          - "'permitrootlogin no' in sshd_effective['stdout'] | lower"
          - "'passwordauthentication no' in sshd_effective['stdout'] | lower"

    - name: Validate security sysctl file
      ansible.builtin.command:
        argv:
          - sysctl
          - -p
          - /etc/sysctl.d/99-security.conf
      changed_when: false
      register: sysctl_test

    - name: Assert security sysctl file loads successfully
      ansible.builtin.assert:
        that:
          - sysctl_test['rc'] == 0
