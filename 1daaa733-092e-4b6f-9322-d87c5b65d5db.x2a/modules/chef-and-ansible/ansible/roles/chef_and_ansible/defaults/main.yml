---
# Apache configuration variables
chef_and_ansible_apache_version: 2.4.41-4ubuntu3.10
chef_and_ansible_cert_path: /etc/apache2/certs
chef_and_ansible_web_root: /var/www/helloworld
chef_and_ansible_site_name: helloworld
# SSL certificate configuration
chef_and_ansible_ssl_common_name: myhost
# Virtual host configuration content
chef_and_ansible_conftext: |
  <VirtualHost *:443>
   DocumentRoot "/var/www/helloworld"
   SSLEngine on
   SSLCertificateFile /etc/apache2/certs/apache.crt
   SSLCertificateKeyFile /etc/apache2/certs/apache.key
    <Directory "/var/www/helloworld">
      allow from all
      Options None
      Require all granted
    </Directory>
  </VirtualHost>
# Website content
chef_and_ansible_webtext: |
  <html>
    <head><title>Test Site</title></head>
    <body>
     <h1>Hello, world!</h1>
     <p>The site is up and running</p>
    </body>
  </html>
# Required packages
chef_and_ansible_packages:
  - curl
  - openssl
  - python3-openssl
