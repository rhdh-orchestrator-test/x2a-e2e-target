---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Apache service status
      ansible.builtin.service_facts:

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service']['state'] == 'running'"
        fail_msg: "Apache2 service is not running"

    - name: Check SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ item_cert }}" # noqa: R114 - path from role defaults, trusted test paths
      loop:
        - /etc/apache2/certs/apache.key
        - /etc/apache2/certs/apache.crt
        - /etc/apache2/certs/apache.csr
      loop_control:
        loop_var: item_cert
      register: cert_stat_results

    - name: Assert SSL certificate files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate file not found"
      loop: "{{ cert_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check web document root directory exists
      ansible.builtin.stat:
        path: /var/www/helloworld
      register: webroot_stat

    - name: Assert web document root directory was created
      ansible.builtin.assert:
        that:
          - webroot_stat['stat']['exists']
          - webroot_stat['stat']['isdir']
        fail_msg: "Web document root directory not found"

    - name: Check website content file exists
      ansible.builtin.stat:
        path: /var/www/helloworld/index.html
      register: index_stat

    - name: Assert website content file was created
      ansible.builtin.assert:
        that:
          - index_stat['stat']['exists']
          - index_stat['stat']['size'] > 0
        fail_msg: "Website index.html file not found"

    - name: Check virtual host configuration exists
      ansible.builtin.stat:
        path: /etc/apache2/sites-available/helloworld.conf
      register: vhost_stat

    - name: Assert virtual host configuration was created
      ansible.builtin.assert:
        that:
          - vhost_stat['stat']['exists']
          - vhost_stat['stat']['size'] > 0
        fail_msg: "Virtual host configuration file not found"

    - name: Check Apache configuration syntax
      ansible.builtin.command:
        cmd: apache2ctl configtest
      register: configtest_result
      changed_when: false
      failed_when: configtest_result['rc'] != 0

    - name: Assert Apache configuration is valid
      ansible.builtin.assert:
        that:
          - configtest_result['rc'] == 0
        fail_msg: "Apache configuration syntax test failed"

    - name: Check SSL configuration for POODLE fix
      ansible.builtin.slurp:
        src: /etc/apache2/mods-available/ssl.conf
      register: ssl_config

    - name: Assert SSL protocol configuration is hardened
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in (ssl_config['content'] | b64decode)"
        fail_msg: "SSL protocol not properly configured for POODLE fix"

    - name: Check HTTPS port is listening
      ansible.builtin.wait_for:
        port: 443
        host: localhost
        timeout: 10
        msg: "HTTPS port 443 is not listening"

    - name: Test HTTPS connectivity
      ansible.builtin.uri:
        url: https://localhost/
        method: GET
        validate_certs: false
        return_content: true
      register: https_response

    - name: Assert HTTPS response is successful
      ansible.builtin.assert:
        that:
          - https_response['status'] == 200
          - "'Hello, world!' in https_response['content']"
        fail_msg: "HTTPS connectivity test failed"
