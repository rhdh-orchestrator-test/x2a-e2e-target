---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/apache2/mods-available

    - name: Create mock SSL configuration file
      ansible.builtin.copy:
        content: |
          # Mock Apache SSL configuration file
          # This simulates the original file before the POODLE fix
          SSLProtocol all -SSLv3
          SSLCipherSuite HIGH:!aNULL:!MD5
        dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
        mode: "0644"

    # Since the role has hardcoded paths, we'll simulate what the role would do
    # rather than including the role itself
    - name: Simulate role action - Fix SSL in Apache
      ansible.builtin.replace:
        dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
        regexp: ^SSLProtocol.*$
        replace: SSLProtocol -all +TLSv1.2