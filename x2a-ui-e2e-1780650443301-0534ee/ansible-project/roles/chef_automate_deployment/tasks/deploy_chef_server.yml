---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters for Chef Infra Server
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  become: true
  loop:
    - name: vm.max_map_count
      value: "{{ chef_automate_vm_max_map_count }}"
    - name: vm.dirty_expire_centisecs
      value: "{{ chef_automate_vm_dirty_expire_centisecs }}"
- name: Ensure curl is installed
  ansible.builtin.package:
    name: curl
    state: present
  become: true
- name: Download and extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: curl {{ chef_automate_cli_url }} | gunzip - > {{ chef_automate_cli_path }}
    creates: "{{ chef_automate_cli_path }}"
  args:
    warn: false
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }} "
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
  failed_when: chef_server_deploy.rc != 0
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ chef_user_pem_filename }}

      '
  become: true
  args:
    creates: "{{ chef_user_pem_filename }}"
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}" --association_user {{ username }} --filename {{ chef_org_validator_filename }}

      '
  become: true
  args:
    creates: "{{ chef_org_validator_filename }}"
