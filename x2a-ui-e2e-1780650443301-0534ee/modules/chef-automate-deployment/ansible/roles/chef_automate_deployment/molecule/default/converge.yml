- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/sysctl.d
    - /tmp/molecule_test/etc/hostname
    - /tmp/molecule_test/usr/bin
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/chef-server
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/usr/bin/chef-automate
      mode: '0755'
  - name: Create Chef Server CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Server CLI mock'' '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create Chef Automate deployment files
    ansible.builtin.copy:
      content: '# Chef Automate configuration'
      dest: /tmp/molecule_test/var/opt/chef-automate/config.toml
      mode: '0644'
  - name: Create Chef Server deployment files
    ansible.builtin.copy:
      content: '# Chef Server configuration'
      dest: /tmp/molecule_test/var/opt/chef-server/chef-server.rb
      mode: '0644'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_KEY_CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_VALIDATOR_KEY_CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
