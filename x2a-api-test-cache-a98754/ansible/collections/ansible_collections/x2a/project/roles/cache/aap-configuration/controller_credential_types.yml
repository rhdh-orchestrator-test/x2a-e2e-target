---
controller_credential_types:
  - name: Chef Redis Authentication
    description: Hardcoded Redis authentication password migrated to an Ansible Vault-backed credential.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required for clients to authenticate to the Redis server.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
