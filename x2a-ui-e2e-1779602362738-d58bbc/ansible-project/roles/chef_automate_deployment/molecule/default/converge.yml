---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/ansible

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl settings
    - name: Create sysctl settings directory
      ansible.builtin.file:
        path: "/tmp/molecule_test/etc/sysctl.d"
        state: directory
        mode: "0755"

    - name: Create sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count={{ chef_automate_vm_max_map_count }}
          vm.dirty_expire_centisecs={{ chef_automate_vm_dirty_expire_centisecs }}
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI Mock'\n"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate Chef user and organization key files
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/home/ansible/{{ chef_automate_username }}.pem"
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORG VALIDATOR KEY CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/home/ansible/{{ chef_automate_orgname }}-validator.pem"
        mode: "0600"

    # Simulate Chef server status output files
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-cs-bookshelf
            Status: running
          Service: automate-cs-oc-bifrost
            Status: running
          Service: automate-cs-oc-erchef
            Status: running
          Service: automate-cs-nginx
            Status: running
        dest: "/tmp/molecule_test/chef-automate-status.txt"
        mode: "0644"
      when: chef_automate_deploy_automate

    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          run: bookshelf: (pid 12345) 123 s; run: log: (pid 12346) 123 s
          run: nginx: (pid 12347) 123 s; run: log: (pid 12348) 123 s
          run: oc_bifrost: (pid 12349) 123 s; run: log: (pid 12350) 123 s
          run: oc_erchef: (pid 12351) 123 s; run: log: (pid 12352) 123 s
          run: postgresql: (pid 12353) 123 s; run: log: (pid 12354) 123 s
        dest: "/tmp/molecule_test/chef-server-status.txt"
        mode: "0644"

    # Simulate user and organization list outputs
    - name: Create user list file
      ansible.builtin.copy:
        content: "{{ chef_automate_username }}"
        dest: "/tmp/molecule_test/chef-server-user-list.txt"
        mode: "0644"

    - name: Create organization list file
      ansible.builtin.copy:
        content: "{{ chef_automate_orgname }}"
        dest: "/tmp/molecule_test/chef-server-org-list.txt"
        mode: "0644"

    # Simulate network listening ports
    - name: Create netstat output file
      ansible.builtin.copy:
        content: |
          tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      12345/nginx
        dest: "/tmp/molecule_test/netstat-output.txt"
        mode: "0644"

    # Simulate process list
    - name: Create process list file
      ansible.builtin.copy:
        content: |
          root     12345  0.0  0.5 123456 54321 ?        Ss   12:34   0:00 /hab/pkgs/chef/automate-nginx/1.0.0/bin/nginx
          hab      12346  0.0  0.5 123456 54321 ?        Ss   12:34   0:00 /hab/pkgs/chef/automate-postgresql/1.0.0/bin/postgres
          hab      12347  0.0  0.5 123456 54321 ?        Ss   12:34   0:00 /hab/pkgs/chef/chef-server-ctl/1.0.0/bin/chef-server-ctl
        dest: "/tmp/molecule_test/process-list.txt"
        mode: "0644"

  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_username: jtonello
    chef_automate_orgname: lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_deploy_automate: true
    chef_automate_deploy_infra_server: true