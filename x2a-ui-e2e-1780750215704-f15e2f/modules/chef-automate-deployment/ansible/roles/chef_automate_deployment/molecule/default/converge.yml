---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/chef-automate-dir

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate kernel parameters
    - name: Create max_map_count file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_max_map_count }}"
        dest: "/tmp/molecule_test/proc/sys/vm/max_map_count"
        mode: "0644"

    - name: Create dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_dirty_expire_centisecs }}"
        dest: "/tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs"
        mode: "0644"

    # Simulate Chef Automate CLI binary
    - name: Create Chef Automate CLI binary
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/chef-automate-dir/chef-automate"
        mode: "0755"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/chef-automate-dir/{{ chef_automate_userfilename }}"
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORG VALIDATOR KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/chef-automate-dir/{{ chef_automate_orgfilename }}"
        mode: "0600"

    # Simulate Chef server user list output
    - name: Create Chef server user list output
      ansible.builtin.copy:
        content: "{{ chef_automate_username }}\nadmin\n"
        dest: "/tmp/molecule_test/chef-automate-dir/user-list.txt"
        mode: "0644"

    # Simulate Chef server user show output
    - name: Create Chef server user show output
      ansible.builtin.copy:
        content: "username: {{ chef_automate_username }}\nname: {{ chef_automate_longusername }}\nemail: {{ chef_automate_useremail }}\n"
        dest: "/tmp/molecule_test/chef-automate-dir/user-show.txt"
        mode: "0644"

    # Simulate Chef server org list output
    - name: Create Chef server org list output
      ansible.builtin.copy:
        content: "{{ chef_automate_orgname }}\n"
        dest: "/tmp/molecule_test/chef-automate-dir/org-list.txt"
        mode: "0644"

    # Simulate Chef server org show output
    - name: Create Chef server org show output
      ansible.builtin.copy:
        content: "name: {{ chef_automate_orgname }}\nfull_name: {{ chef_automate_longorgname }}\n"
        dest: "/tmp/molecule_test/chef-automate-dir/org-show.txt"
        mode: "0644"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status output
      ansible.builtin.copy:
        content: "Service: automate-postgresql\nStatus: running\n\nService: automate-elasticsearch\nStatus: running\n"
        dest: "/tmp/molecule_test/chef-automate-dir/automate-status.txt"
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status output
      ansible.builtin.copy:
        content: "run: bookshelf: (pid 12345) 300s; run: postgresql: (pid 12346) 300s\n"
        dest: "/tmp/molecule_test/chef-automate-dir/chef-server-status.txt"
        mode: "0644"

  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_username: jtonello
    chef_automate_longusername: John Tonello
    chef_automate_useremail: jtonello@chef.lab
    chef_automate_orgname: lab
    chef_automate_longorgname: Chef Lab
    chef_automate_userfilename: jtonello.pem
    chef_automate_orgfilename: lab-validator.pem