---
- name: Download and extract Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
  register: download_result
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
  when: download_result.changed
- name: Check if Chef Automate is already deployed
  ansible.builtin.stat:
    path: /hab/sup/default/data/services.dat
  register: chef_automate_deployed
  become: true
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }} "
    creates: /hab/sup/default/data/services.dat
  become: true
  when: deploy_with_automate | bool and not chef_automate_deployed.stat.exists
  register: automate_deploy
  changed_when: automate_deploy.rc == 0
  failed_when: automate_deploy.rc != 0
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }} "
    creates: /hab/sup/default/data/services.dat
  become: true
  when: not deploy_with_automate | bool and not chef_automate_deployed.stat.exists
  register: infra_deploy
  changed_when: infra_deploy.rc == 0
  failed_when: infra_deploy.rc != 0
