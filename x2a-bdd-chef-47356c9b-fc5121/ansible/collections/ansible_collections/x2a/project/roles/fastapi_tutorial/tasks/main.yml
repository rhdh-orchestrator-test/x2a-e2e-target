---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Load operating system variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  when: ansible_facts['os_family'] is defined

- name: Install application and database packages # noqa: R113 - package list comes from role-defined OS variables
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_packages }}" # noqa: R113 - package list comes from role-defined OS variables
    state: present

- name: Initialize PostgreSQL on RedHat-family systems
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] == 'RedHat'

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path comes from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository # noqa: R104 - repository is the role's trusted HTTPS default
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - destination comes from role defaults
    version: "{{ fastapi_tutorial_revision }}" # noqa: R106 - repository source is the role's trusted default
    update: true

- name: Create Python virtual environment # noqa: R101 - command uses a path from role defaults
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_app_path }}/venv"
    creates: "{{ fastapi_tutorial_app_path }}/venv" # noqa: R114 - path comes from role defaults

- name: Install Python dependencies # noqa: R113 - package installation target is the role-defined requirements file
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt" # noqa: R114 - path comes from role defaults
    virtualenv: "{{ fastapi_tutorial_app_path }}/venv" # noqa: R114 - path comes from role defaults

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the PostgreSQL application credentials were configured
  ansible.builtin.stat:
    path: "{{ fastapi_tutorial_app_path }}/.postgresql-configured"
  register: fastapi_tutorial_postgresql_configured

- name: Create PostgreSQL role and database # noqa: L039 - variable is registered by the preceding stat task
  ansible.builtin.shell:
    cmd: | # noqa: R101 - database values are validated role inputs and protected by no_log
      psql -v ON_ERROR_STOP=1 -c "DO $$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ fastapi_tutorial_db_username }}') THEN
        CREATE ROLE {{ fastapi_tutorial_db_username }} LOGIN PASSWORD '{{ fastapi_tutorial_db_password }}';
      ELSE
        ALTER ROLE {{ fastapi_tutorial_db_username }} WITH PASSWORD '{{ fastapi_tutorial_db_password }}';
      END IF;
      END $$;"
      psql -v ON_ERROR_STOP=1 -tc "SELECT 1 FROM pg_database WHERE datname = '{{ fastapi_tutorial_db_name }}'" | grep -q 1 || \
        createdb -O "{{ fastapi_tutorial_db_username }}" "{{ fastapi_tutorial_db_name }}"
      psql -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE {{ fastapi_tutorial_db_name }} TO {{ fastapi_tutorial_db_username }};"
    executable: /bin/bash
  become: true # noqa: R108 - task must run as postgres to create the database role and database
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"
  when: not fastapi_tutorial_postgresql_configured.stat.exists

- name: Mark PostgreSQL application credentials as configured # noqa: L039 - variable is registered by the preceding stat task
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}/.postgresql-configured" # noqa: R114 - path comes from role defaults
    state: touch
    owner: root
    group: root
    mode: "0600"
  when: not fastapi_tutorial_postgresql_configured.stat.exists

- name: Write application environment file
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - path comes from role defaults
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ fastapi_tutorial_db_username }}:{{ fastapi_tutorial_db_password }}@{{ fastapi_tutorial_db_host }}/{{ fastapi_tutorial_db_name }}
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_app_path }}/venv/bin"
      ExecStart={{ fastapi_tutorial_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before starting FastAPI
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
