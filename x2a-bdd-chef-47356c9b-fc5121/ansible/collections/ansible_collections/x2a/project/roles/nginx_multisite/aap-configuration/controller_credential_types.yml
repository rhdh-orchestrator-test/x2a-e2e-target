---
controller_credential_types:
  - name: Chef Encrypted Data Bag Nginx Site Token
    description: Encrypted site token from the nginx_secrets data bag item used to create the Nginx host secret file.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Nginx Site Token
          secret: true
          help_text: Secret token loaded from the Chef encrypted data bag item nginx_secrets/site and written to the Nginx host with restrictive permissions.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
