---
# Unsupported pre-flight checks: version values, pip list output, application HTTP response
# body/status, journal contents, systemctl status/show/cat diagnostics, and password-based
# application-role connectivity have no stated expected outcome or require protected credentials.
- name: Verify fastapi-tutorial pre-flight checks
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify Python executable is available
      ansible.builtin.command:
        argv:
          - python3
          - --version
      register: item_python_version
      changed_when: false
      failed_when: item_python_version['rc'] != 0

    - name: Verify pip executable is available
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - pip
          - --version
      register: item_pip_version
      changed_when: false
      failed_when: item_pip_version['rc'] != 0

    - name: Verify Git executable is available
      ansible.builtin.command:
        argv:
          - git
          - --version
      register: item_git_version
      changed_when: false
      failed_when: item_git_version['rc'] != 0

    - name: Collect installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify Fedora and RHEL package prerequisites
      ansible.builtin.assert:
        that:
          - "'python3' in ansible_facts['packages']"
          - "'python3-pip' in ansible_facts['packages']"
          - "'git' in ansible_facts['packages']"
          - "'postgresql-server' in ansible_facts['packages']"
          - "'postgresql-contrib' in ansible_facts['packages']"
          - "'libpq-devel' in ansible_facts['packages']"
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Verify Debian and Ubuntu package prerequisites
      ansible.builtin.assert:
        that:
          - "'python3' in ansible_facts['packages']"
          - "'python3-pip' in ansible_facts['packages']"
          - "'python3-venv' in ansible_facts['packages']"
          - "'git' in ansible_facts['packages']"
          - "'postgresql' in ansible_facts['packages']"
          - "'postgresql-contrib' in ansible_facts['packages']"
          - "'libpq-dev' in ansible_facts['packages']"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify application directory exists
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: item_app_directory

    - name: Assert application directory exists
      ansible.builtin.assert:
        that:
          - item_app_directory['stat']['exists']
          - item_app_directory['stat']['isdir']

    - name: Verify checked-out revision metadata
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - rev-parse
          - --abbrev-ref
          - HEAD
      register: item_git_revision
      changed_when: false
      failed_when: item_git_revision['rc'] != 0

    - name: Verify application repository files
      ansible.builtin.stat:
        path: "{{ item_repository_file }}"
      register: item_repository_file_stat
      loop:
        - /opt/fastapi-tutorial/requirements.txt
        - /opt/fastapi-tutorial/app/main.py
      loop_control:
        loop_var: item_repository_file

    - name: Assert application repository files exist
      ansible.builtin.assert:
        that:
          - item_repository_file_result['stat']['exists']
          - item_repository_file_result['stat']['isreg']
      loop: "{{ item_repository_file_stat['results'] }}"
      loop_control:
        loop_var: item_repository_file_result

    - name: Verify virtual environment executables
      ansible.builtin.stat:
        path: "{{ item_venv_executable }}"
      register: item_venv_executable_stat
      loop:
        - /opt/fastapi-tutorial/venv/bin/python
        - /opt/fastapi-tutorial/venv/bin/pip
        - /opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_venv_executable

    - name: Assert virtual environment executables are executable
      ansible.builtin.assert:
        that:
          - item_venv_executable_result['stat']['exists']
          - item_venv_executable_result['stat']['executable']
      loop: "{{ item_venv_executable_stat['results'] }}"
      loop_control:
        loop_var: item_venv_executable_result

    - name: Verify Python dependencies
      ansible.builtin.command:
        argv:
          - /opt/fastapi-tutorial/venv/bin/pip
          - check
      register: item_pip_check
      changed_when: false
      failed_when: item_pip_check['rc'] != 0

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Assert PostgreSQL service is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts['services']['postgresql.service']['status'] == 'enabled'"
          - "ansible_facts['services']['postgresql.service']['state'] == 'running'"

    - name: Verify PostgreSQL listener
      ansible.builtin.command:
        argv:
          - ss
          - -ltn
      register: item_postgresql_listener
      changed_when: false
      failed_when: item_postgresql_listener['rc'] != 0

    - name: Assert PostgreSQL listens on port 5432
      ansible.builtin.assert:
        that:
          - item_postgresql_listener['stdout'] is search(':5432(?:\\s|$)')

    - name: Verify PostgreSQL role
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT rolname FROM pg_roles WHERE rolname = 'fastapi';
      register: item_postgresql_role
      changed_when: false
      failed_when: item_postgresql_role['rc'] != 0

    - name: Assert PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - item_postgresql_role['stdout'] | trim == 'fastapi'

    - name: Verify PostgreSQL database and owner
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT datname, pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'fastapi_db';
      register: item_postgresql_database
      changed_when: false
      failed_when: item_postgresql_database['rc'] != 0

    - name: Assert PostgreSQL database has the expected owner
      ansible.builtin.assert:
        that:
          - item_postgresql_database['stdout'] | trim == 'fastapi_db | fastapi'

    - name: Verify environment file exists
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/.env
      register: item_environment_file

    - name: Assert environment file exists
      ansible.builtin.assert:
        that:
          - item_environment_file['stat']['exists']
          - item_environment_file['stat']['isreg']

    - name: Verify required environment settings without exposing credentials
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - '^(PROJECT_NAME="FastAPI Tutorial"|API_VERSION=1.0.0|DATABASE_URL=)'
          - /opt/fastapi-tutorial/.env
      register: item_environment_settings
      changed_when: false
      failed_when: item_environment_settings['rc'] != 0

    - name: Verify systemd unit file
      ansible.builtin.stat:
        path: /etc/systemd/system/fastapi-tutorial.service
      register: item_systemd_unit

    - name: Assert systemd unit file exists
      ansible.builtin.assert:
        that:
          - item_systemd_unit['stat']['exists']
          - item_systemd_unit['stat']['isreg']

    - name: Verify systemd unit syntax
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/fastapi-tutorial.service
      register: item_systemd_verify
      changed_when: false
      failed_when: item_systemd_verify['rc'] != 0

    - name: Read systemd unit properties
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: item_systemd_unit_content

    - name: Assert expected systemd unit properties
      ansible.builtin.assert:
        that:
          - "item_systemd_unit_content['content'] | b64decode is search('(?m)^User=root$')"
          - "item_systemd_unit_content['content'] | b64decode is search('(?m)^WorkingDirectory=/opt/fastapi-tutorial$')"
          - "item_systemd_unit_content['content'] | b64decode is search('(?m)^Restart=always$')"
          - "item_systemd_unit_content['content'] | b64decode is search('(?m)^ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000$')"

    - name: Assert FastAPI service is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts['services']['fastapi-tutorial.service']['status'] == 'enabled'"
          - "ansible_facts['services']['fastapi-tutorial.service']['state'] == 'running'"

    - name: Verify Uvicorn process
      ansible.builtin.command:
        argv:
          - pgrep
          - -af
          - uvicorn
      register: item_uvicorn_process
      changed_when: false
      failed_when: item_uvicorn_process['rc'] != 0

    - name: Verify FastAPI listener
      ansible.builtin.command:
        argv:
          - ss
          - -ltn
      register: item_fastapi_listener
      changed_when: false
      failed_when: item_fastapi_listener['rc'] != 0

    - name: Assert FastAPI listens on all interfaces at port 8000
      ansible.builtin.assert:
        that:
          - item_fastapi_listener['stdout'] is search('(?:0\\.0\\.0\\.0|\\[::\\]):8000(?:\\s|$)')
