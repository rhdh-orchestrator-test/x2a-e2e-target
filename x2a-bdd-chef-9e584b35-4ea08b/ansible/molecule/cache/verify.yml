---
# Unsupported checks: platform-dependent Memcached configuration path and effective values;
# Redis authenticated SET/GET/DEL (requires a secret and mutates state); Redis service logs;
# Redis-directory writability by the service account; source-file/template checks; and the
# project Makefile/agent-file requirement (those paths are outside the disposable hosts).
- name: Verify cache services and endpoints
  hosts: all
  gather_facts: true
  tasks:
    - name: Collect service facts for the Memcached and Redis pre-flight checks
      ansible.builtin.service_facts:

    - name: Assert that the Memcached service is running and enabled
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts.services | dict2items
            | selectattr('key', 'match', '^memcached')
            | selectattr('value.state', 'equalto', 'running') | list | length) > 0
          - >-
            (ansible_facts.services | dict2items
            | selectattr('key', 'match', '^memcached')
            | selectattr('value.status', 'equalto', 'enabled') | list | length) > 0
        fail_msg: Memcached must be running and enabled.

    - name: Query the Memcached version endpoint
      ansible.builtin.command:
        argv:
          - nc
          - -w
          - "2"
          - 127.0.0.1
          - "11211"
        stdin: "version\r\n"
      register: item_memcached_version
      changed_when: false

    - name: Assert that Memcached returns a VERSION response
      ansible.builtin.assert:
        that:
          - item_memcached_version.stdout is regex('(?m)^VERSION(?:\\s|$)')
        fail_msg: The Memcached endpoint must return a VERSION response.

    - name: Check that the Memcached TCP port is listening
      ansible.builtin.command:
        argv:
          - ss
          - -ltnp
      register: item_memcached_tcp
      changed_when: false

    - name: Assert that TCP port 11211 is listening
      ansible.builtin.assert:
        that:
          - item_memcached_tcp.stdout is regex('(?m):11211\\b')
        fail_msg: TCP port 11211 must be listening.

    - name: Check that the Memcached UDP port is listening
      ansible.builtin.command:
        argv:
          - ss
          - -lunp
      register: item_memcached_udp
      changed_when: false

    - name: Assert that UDP port 11211 is listening
      ansible.builtin.assert:
        that:
          - item_memcached_udp.stdout is regex('(?m):11211\\b')
        fail_msg: UDP port 11211 must be listening.

    - name: Assert that a Redis service is running and enabled
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts.services | dict2items
            | selectattr('key', 'match', '^redis')
            | selectattr('value.state', 'equalto', 'running') | list | length) > 0
          - >-
            (ansible_facts.services | dict2items
            | selectattr('key', 'match', '^redis')
            | selectattr('value.status', 'equalto', 'enabled') | list | length) > 0
        fail_msg: Redis must be running and enabled.

    - name: Wait for the Redis TCP endpoint
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 2

    - name: Read the Redis instance configuration metadata
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: item_redis_config

    - name: Assert that the Redis instance configuration exists
      ansible.builtin.assert:
        that:
          - item_redis_config.stat.exists
          - item_redis_config.stat.isreg
        fail_msg: /etc/redis/6379.conf must exist as a regular file.

    - name: Read the Redis instance configuration
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: item_redis_config_contents

    - name: Assert the Redis port, authentication, and PID path configuration
      ansible.builtin.assert:
        that:
          - item_redis_config_contents.content | b64decode is regex('(?m)^port\\s+6379(?:\\s|$)')
          - item_redis_config_contents.content | b64decode is regex('(?m)^requirepass\\s+\\S+')
          - item_redis_config_contents.content | b64decode is regex('(?m)^pidfile\\s+/run/redis(?:/|\\s|$)')
        fail_msg: Redis must configure port 6379, authentication, and a PID path under /run/redis.

    - name: Assert that unwanted Redis replication directives are absent
      ansible.builtin.assert:
        that:
          - >-
            item_redis_config_contents.content | b64decode is not regex(
            '(?m)^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)\\b')
        fail_msg: Unwanted replication directives must be absent from the Redis configuration.

    - name: Read Redis log directory metadata
      ansible.builtin.stat:
        path: /var/log/redis
      register: item_redis_log_directory

    - name: Assert Redis log directory ownership and mode
      ansible.builtin.assert:
        that:
          - item_redis_log_directory.stat.exists
          - item_redis_log_directory.stat.isdir
          - item_redis_log_directory.stat.pw_name == 'redis'
          - item_redis_log_directory.stat.gr_name == 'redis'
          - item_redis_log_directory.stat.mode == '0755'
        fail_msg: /var/log/redis must be a 0755 directory owned by redis:redis.

    - name: Read Redis PID directory metadata
      ansible.builtin.stat:
        path: /run/redis
      register: item_redis_pid_directory

    - name: Assert that the Redis PID directory exists
      ansible.builtin.assert:
        that:
          - item_redis_pid_directory.stat.exists
          - item_redis_pid_directory.stat.isdir
        fail_msg: /run/redis must exist as a directory.
