---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml

- name: Configure standalone Redis
  ansible.builtin.include_role:
    name: eloy.redis.redis # noqa: L038 - role is provided by the declared eloy.redis collection dependency
  no_log: "{{ redis_secure_logging }}"

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ redis_log_dir }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Ensure Redis PID directory exists
  ansible.builtin.file:
    path: "{{ redis_base_piddir }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Remove replica stale-data directive
  ansible.builtin.lineinfile:
    path: "{{ redis_config_file }}" # noqa: R114,R115 - configuration path is a role default and must remain parameterized
    regexp: ^replica-serve-stale-data.*$
    state: absent
  notify: Restart Redis

- name: Remove replica read-only directive
  ansible.builtin.lineinfile:
    path: "{{ redis_config_file }}" # noqa: R114,R115 - configuration path is a role default and must remain parameterized
    regexp: ^replica-read-only.*$
    state: absent
  notify: Restart Redis

- name: Remove replica ping period directive
  ansible.builtin.lineinfile:
    path: "{{ redis_config_file }}" # noqa: R114,R115 - configuration path is a role default and must remain parameterized
    regexp: ^repl-ping-replica-period.*$
    state: absent
  notify: Restart Redis

- name: Remove client output buffer directive
  ansible.builtin.lineinfile:
    path: "{{ redis_config_file }}" # noqa: R114,R115 - configuration path is a role default and must remain parameterized
    regexp: ^client-output-buffer-limit.*$
    state: absent
  notify: Restart Redis

- name: Remove replica priority directive
  ansible.builtin.lineinfile:
    path: "{{ redis_config_file }}" # noqa: R114,R115 - configuration path is a role default and must remain parameterized
    regexp: ^replica-priority.*$
    state: absent
  notify: Restart Redis

- name: Enable and start Redis
  ansible.builtin.service:
    name: redis
    state: started
    enabled: true
