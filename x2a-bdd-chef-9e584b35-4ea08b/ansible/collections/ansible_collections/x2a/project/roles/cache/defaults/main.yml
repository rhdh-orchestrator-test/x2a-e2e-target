---
memcached_version:
memcached_memory: 64
memcached_port: 11211
memcached_udp_port: 11211
memcached_listen: 0.0.0.0
memcached_maxconn: 1024
memcached_max_object_size: 1m
memcached_experimental_options: []
memcached_extra_cli_options: []
memcached_ulimit: 1024
memcached_logfilepath: /var/log/memcached
memcached_service_user: service_user
redis_secure_logging: true
redis_port: 6379
redis_cluster_enabled: false
redis_sentinel_enabled: false
redis_replication_enabled: false
redis_rdb_enabled: true
redis_install_method: package
redis_version:
redis_base_piddir: /run/redis
redis_log_dir: /var/log/redis
redis_config_file: /etc/redis/6379.conf
