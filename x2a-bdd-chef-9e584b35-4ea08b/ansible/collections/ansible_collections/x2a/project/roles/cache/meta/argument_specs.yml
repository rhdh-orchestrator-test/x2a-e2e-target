---
argument_specs:
  main:
    short_description: Configure Memcached and standalone Redis caching services
    description:
      - Installs and starts Memcached and configures standalone Redis with authentication.
    options:
      memcached_version:
        type: str
        required: false
        default:
        description: Optional Memcached package version.
      memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory allocation in megabytes.
      memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached connections.
      memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Memcached experimental options.
      memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional Memcached command-line options.
      memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file descriptor limit.
      memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log path.
      memcached_service_user:
        type: str
        required: false
        default: service_user
        description: Memcached service user.
      redis_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide tasks that handle the Redis password from logs.
      redis_port:
        type: int
        required: false
        default: 6379
        description: Redis TCP port.
      redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Enable Redis clustering.
      redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Enable Redis Sentinel.
      redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Enable Redis replication.
      redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Enable Redis RDB persistence.
      redis_install_method:
        type: str
        required: false
        default: package
        description: Redis installation method.
      redis_version:
        type: str
        required: false
        default:
        description: Optional Redis version.
      redis_base_piddir:
        type: str
        required: false
        default: /run/redis
        description: Redis PID directory.
      redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis instance configuration path.
      redis_requirepass:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
