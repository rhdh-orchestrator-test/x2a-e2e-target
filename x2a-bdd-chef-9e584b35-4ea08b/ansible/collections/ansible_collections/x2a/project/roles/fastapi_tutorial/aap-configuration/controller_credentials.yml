---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials and connection settings for the FastAPI application to authenticate to its local PostgreSQL database.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      username: "{{ username }}"
      password: "{{ vault_password }}"
      database_name: "{{ database_name }}"
      host: "{{ host }}"
