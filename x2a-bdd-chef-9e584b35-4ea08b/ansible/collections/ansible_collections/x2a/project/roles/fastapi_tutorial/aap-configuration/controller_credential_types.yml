---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the FastAPI application to authenticate to its local PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL role; replace the exposed hardcoded value with a protected AAP credential value.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: host
          type: string
          label: Database Host
          help_text: PostgreSQL server hostname; the migration currently uses localhost.
      required:
        - username
        - password
        - database_name
        - host
    injectors:
      extra_vars:
        username: !unsafe "{{ username }}"
        password: !unsafe "{{ password }}"
        database_name: !unsafe "{{ database_name }}"
        host: !unsafe "{{ host }}"
