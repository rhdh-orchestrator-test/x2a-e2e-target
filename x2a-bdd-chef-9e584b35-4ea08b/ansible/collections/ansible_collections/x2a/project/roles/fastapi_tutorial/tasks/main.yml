---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install Fedora and RHEL dependencies
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Debian dependencies
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Initialize PostgreSQL on RedHat systems
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] == 'RedHat'

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is a trusted role default
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize application repository  # noqa: R104,R106 - repository URL and revision come from trusted role defaults
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - destination is a trusted role default
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - command path comes from a trusted role default
  ansible.builtin.command:
    cmd: python3 -m venv {{ fastapi_tutorial_venv_path }}
    creates: "{{ fastapi_tutorial_venv_path }}/bin/python" # noqa: R114 - path is a trusted role default

- name: Install application dependencies  # noqa: R113 - dependency paths and virtualenv come from trusted role defaults
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt" # noqa: R114 - path is a trusted role default
    virtualenv: "{{ fastapi_tutorial_venv_path }}" # noqa: R114 - path is a trusted role default

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_postgresql_service }}"
    enabled: true
    state: started

- name: Check whether the FastAPI database role exists  # noqa: L039,R101,R108 - username is supplied by validated role credentials; command runs as postgres to inspect PostgreSQL
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname='{{ username }}';
  changed_when: false
  register: fastapi_tutorial_role_check
  become: true
  become_user: postgres

- name: Create the FastAPI database role  # noqa: L039,R101,R108 - validated role credentials are intentional SQL inputs and PostgreSQL role administration requires postgres privileges
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - CREATE ROLE {{ username }} LOGIN PASSWORD '{{ password }}';
  when: fastapi_tutorial_role_check.stdout | trim != '1'
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the FastAPI database exists  # noqa: L039,R101,R108 - database name is supplied by validated role credentials; command runs as postgres to inspect PostgreSQL
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname='{{ database_name }}';
  changed_when: false
  register: fastapi_tutorial_database_check
  become: true
  become_user: postgres

- name: Create the FastAPI database  # noqa: L039,R101,R108 - validated database and role names are intentional command inputs and database creation requires postgres privileges
  ansible.builtin.command:
    argv:
      - createdb
      - -O
      - "{{ username }}"
      - "{{ database_name }}"
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  become: true
  become_user: postgres

- name: Grant database privileges to the FastAPI role  # noqa: L039,R101,R108 - validated database and role names are intentional SQL inputs and privilege administration requires postgres privileges
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ username }};
  changed_when: false
  become: true
  become_user: postgres

- name: Render application environment
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL={{ fastapi_tutorial_database_url }}
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - path is a trusted role default
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target {{ fastapi_tutorial_postgresql_service }}.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_venv_path }}/bin"
      ExecStart={{ fastapi_tutorial_venv_path }}/bin/uvicorn {{ fastapi_tutorial_app_module }} --host {{ fastapi_tutorial_host }} --port {{ fastapi_tutorial_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd manager

- name: Flush systemd handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI tutorial
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
