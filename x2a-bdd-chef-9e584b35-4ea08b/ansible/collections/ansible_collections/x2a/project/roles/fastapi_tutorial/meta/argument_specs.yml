---
argument_specs:
  main:
    short_description: Deploy the FastAPI tutorial application with PostgreSQL.
    description:
      - Installs application and database dependencies.
      - Deploys the FastAPI tutorial source, virtual environment, database configuration, and systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application installation directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_app_module:
        type: str
        required: false
        default: app.main:app
        description: Uvicorn application module.
      fastapi_tutorial_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Address on which Uvicorn listens.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which Uvicorn listens.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Application project name written to the environment file.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version written to the environment file.
      fastapi_tutorial_postgresql_service:
        type: str
        required: false
        default: postgresql
        description: PostgreSQL service name.
      fastapi_tutorial_database_url:
        type: str
        required: false
        default: postgresql://{{ username }}:{{ password }}@{{ host }}/{{ database_name }}
        description: Database connection URL; its password is supplied by the AAP credential variable.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations that handle the database password.
