---
argument_specs:
  main:
    short_description: Configure nginx with multiple SSL-enabled virtual hosts
    description:
      - Installs and secures nginx, Fail2ban, UFW, SSH, kernel settings, and self-signed TLS sites.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Site definitions including document roots and TLS enablement.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for public TLS certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for TLS private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban is enabled by the role.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW is enabled by the role.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_disable_password_authentication:
        type: bool
        required: false
        default: true
        description: Whether SSH password authentication is disabled.
      nginx_multisite_ssh_service:
        type: str
        required: false
        default: ssh
        description: Service name used to restart the SSH daemon.
