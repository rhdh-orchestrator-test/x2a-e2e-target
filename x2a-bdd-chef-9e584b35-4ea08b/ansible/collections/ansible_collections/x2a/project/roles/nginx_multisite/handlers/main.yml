---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload security sysctl
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.rp_filter
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-security.conf
    reload: true

- name: Restart SSH
  ansible.builtin.service:
    name: "{{ nginx_multisite_ssh_service }}"
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
