---
# Verification playbook for cache module
# Unsupported checks (no expected outcome or diagnostic-only):
# - redis-cli --intrinsic-latency / --latency-history (performance benchmarks)
# - tail -f / journalctl -f (continuous log monitoring)
# - top -p (interactive process monitor)
# - redis-cli MEMORY DOCTOR (advisory output)

- name: Verify cache deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify redis-server service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services or 'redis.service' in ansible_facts.services"
          - >-
            (ansible_facts.services['redis-server.service'].state | default('')) == 'running' or
            (ansible_facts.services['redis.service'].state | default('')) == 'running'
        fail_msg: "redis-server service is not running"
        success_msg: "redis-server service is running"

    - name: Verify redis-server service is enabled
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts.services['redis-server.service'].status | default('')) == 'enabled' or
            (ansible_facts.services['redis.service'].status | default('')) == 'enabled'
        fail_msg: "redis-server service is not enabled"
        success_msg: "redis-server service is enabled"

    - name: Check redis-server process is running
      ansible.builtin.command:
        argv:
          - pgrep
          - -f
          - redis-server
      register: redis_process
      changed_when: false
      failed_when: redis_process.rc != 0

    - name: Verify Redis responds to PING
      ansible.builtin.command:
        argv:
          - redis-cli
          - ping
      register: redis_ping
      changed_when: false
      failed_when: redis_ping.rc != 0

    - name: Assert Redis PING returns PONG
      ansible.builtin.assert:
        that:
          - redis_ping.stdout == 'PONG'
        fail_msg: "Redis PING did not return PONG"
        success_msg: "Redis PING successful"

    - name: Get Redis server info
      ansible.builtin.command:
        argv:
          - redis-cli
          - INFO
          - server
      register: redis_info_server
      changed_when: false

    - name: Get Redis memory info
      ansible.builtin.command:
        argv:
          - redis-cli
          - INFO
          - memory
      register: redis_info_memory
      changed_when: false

    - name: Get Redis stats info
      ansible.builtin.command:
        argv:
          - redis-cli
          - INFO
          - stats
      register: redis_info_stats
      changed_when: false

    - name: Verify Redis config file exists
      ansible.builtin.stat:
        path: /etc/redis/redis.conf
      register: redis_conf

    - name: Assert Redis config file exists
      ansible.builtin.assert:
        that:
          - redis_conf.stat.exists
        fail_msg: "Redis configuration file not found at /etc/redis/redis.conf"
        success_msg: "Redis configuration file exists"

    - name: Get Redis bind configuration
      ansible.builtin.command:
        argv:
          - redis-cli
          - CONFIG
          - GET
          - bind
      register: redis_config_bind
      changed_when: false

    - name: Get Redis port configuration
      ansible.builtin.command:
        argv:
          - redis-cli
          - CONFIG
          - GET
          - port
      register: redis_config_port
      changed_when: false

    - name: Assert Redis port is 6379
      ansible.builtin.assert:
        that:
          - "'6379' in redis_config_port.stdout"
        fail_msg: "Redis port is not configured to 6379"
        success_msg: "Redis port is correctly configured to 6379"

    - name: Get Redis requirepass configuration
      ansible.builtin.command:
        argv:
          - redis-cli
          - CONFIG
          - GET
          - requirepass
      register: redis_config_requirepass
      changed_when: false

    - name: Test Redis SET operation
      ansible.builtin.command:
        argv:
          - redis-cli
          - SET
          - test_key
          - test_value
      register: redis_set
      changed_when: false

    - name: Assert Redis SET succeeded
      ansible.builtin.assert:
        that:
          - redis_set.stdout == 'OK'
        fail_msg: "Redis SET operation failed"
        success_msg: "Redis SET operation successful"

    - name: Test Redis GET operation
      ansible.builtin.command:
        argv:
          - redis-cli
          - GET
          - test_key
      register: redis_get
      changed_when: false

    - name: Assert Redis GET returns correct value
      ansible.builtin.assert:
        that:
          - redis_get.stdout == 'test_value'
        fail_msg: "Redis GET did not return expected value"
        success_msg: "Redis GET operation successful"

    - name: Clean up test key with DEL
      ansible.builtin.command:
        argv:
          - redis-cli
          - DEL
          - test_key
      register: redis_del
      changed_when: false

    - name: Check Redis log file exists
      ansible.builtin.stat:
        path: /var/log/redis/redis-server.log
      register: redis_log

    - name: Search for errors in Redis log if it exists
      ansible.builtin.command:
        argv:
          - grep
          - -i
          - error
          - /var/log/redis/redis-server.log
      register: redis_log_errors
      changed_when: false
      failed_when: false
      when: redis_log.stat.exists

    - name: Check Redis is listening on port 6379
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 5
        state: started

    - name: Verify data directory exists
      ansible.builtin.stat:
        path: /var/lib/redis/
      register: redis_data_dir

    - name: Assert Redis data directory exists
      ansible.builtin.assert:
        that:
          - redis_data_dir.stat.exists
          - redis_data_dir.stat.isdir
        fail_msg: "Redis data directory not found at /var/lib/redis/"
        success_msg: "Redis data directory exists"

    - name: Check disk space for data directory
      ansible.builtin.command:
        argv:
          - df
          - -h
          - /var/lib/redis/
      register: redis_data_df
      changed_when: false

    - name: Get Redis LASTSAVE timestamp
      ansible.builtin.command:
        argv:
          - redis-cli
          - LASTSAVE
      register: redis_lastsave
      changed_when: false

    - name: Get Redis persistence info
      ansible.builtin.command:
        argv:
          - redis-cli
          - INFO
          - persistence
      register: redis_info_persistence
      changed_when: false

    - name: Check if RDB dump file exists
      ansible.builtin.stat:
        path: /var/lib/redis/dump.rdb
      register: redis_dump_rdb

    - name: Get Redis memory stats
      ansible.builtin.command:
        argv:
          - redis-cli
          - MEMORY
          - STATS
      register: redis_memory_stats
      changed_when: false

    - name: Get Redis client list
      ansible.builtin.command:
        argv:
          - redis-cli
          - CLIENT
          - LIST
      register: redis_client_list
      changed_when: false

    - name: Get Redis clients info
      ansible.builtin.command:
        argv:
          - redis-cli
          - INFO
          - clients
      register: redis_info_clients
      changed_when: false

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify redis-server package is installed
      ansible.builtin.assert:
        that:
          - "'redis-server' in ansible_facts.packages or 'redis' in ansible_facts.packages"
        fail_msg: "redis-server package is not installed"
        success_msg: "redis-server package is installed"

    - name: Get Redis server version
      ansible.builtin.command:
        argv:
          - redis-server
          - --version
      register: redis_version
      changed_when: false

    - name: Get process resource usage
      ansible.builtin.shell: |
        set -o pipefail
        cat /proc/$(pgrep redis-server | head -1)/status | grep -E 'VmRSS|VmSize'
      args:
        executable: /bin/bash
      register: redis_memory_usage
      changed_when: false
      failed_when: false
