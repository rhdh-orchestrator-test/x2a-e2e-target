---
# tasks file for cache

- name: Load operating system variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  when: ansible_facts['os_family'] is defined

- name: Install Redis server package
  ansible.builtin.package:
    name: "{{ cache_redis_package }}"
    state: present

- name: Enable and start Redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    state: "{{ cache_redis_service_state }}"
    enabled: "{{ cache_redis_service_enabled }}"
