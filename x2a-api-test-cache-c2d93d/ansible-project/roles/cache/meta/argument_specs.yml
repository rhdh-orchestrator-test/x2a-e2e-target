---
argument_specs:
  main:
    short_description: Install and configure Redis and Memcached caching services
    description:
      - Installs and configures Redis server with authentication
      - Installs and configures Memcached service
      - Creates necessary directories and users for Redis
      - Cleans up unwanted Redis replica configuration settings
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for Redis server to listen on
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory path for Redis log files
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to Redis configuration file
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: System user for Redis service
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: System group for Redis service
      cache_memcached_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and enable Memcached service
      cache_redis_cleanup_patterns:
        type: list
        elements: str
        required: false
        default:
          - ^replica-serve-stale-data.*$
          - ^replica-read-only.*$
          - ^repl-ping-replica-period.*$
          - ^client-output-buffer-limit.*$
          - ^replica-priority.*$
        description: List of regex patterns for Redis configuration lines to remove during cleanup process
      redis_password:
        type: str
        required: true
        description: Redis authentication password. This variable is injected by AAP credential types at runtime.
