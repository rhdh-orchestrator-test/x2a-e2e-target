---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
        - /tmp/molecule_test/var/log
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          # Generated by Ansible

          # Network
          bind 127.0.0.1
          port 6379
          timeout 0
          tcp-keepalive 300

          # General
          daemonize yes
          supervised systemd
          pidfile /var/run/redis/redis-server.pid

          # Logging
          loglevel notice
          logfile /var/log/redis/redis-server.log

          # Snapshotting
          save 900 1
          save 300 10
          save 60 10000
          stop-writes-on-bgsave-error yes
          rdbcompression yes
          rdbchecksum yes
          dbfilename dump.rdb
          dir /var/lib/redis

          # Security
          requirepass redis_secure_password_123

          # Limits
          maxclients 10000

          # Memory management
          maxmemory-policy noeviction

          # Client output buffer limits
          client-output-buffer-limit normal 0 0 0
          client-output-buffer-limit replica 256mb 64mb 60
          client-output-buffer-limit pubsub 32mb 8mb 60
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create memcached log file placeholder
      ansible.builtin.copy:
        content: |
          # Memcached log file placeholder
          # This would contain memcached service logs
        dest: /tmp/molecule_test/var/log/memcached.log
        mode: "0644"
        backup: true

    - name: Create Redis log file placeholder
      ansible.builtin.copy:
        content: |
          # Redis log file placeholder
          # This would contain Redis server logs
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"
        backup: true

    - name: Create Redis PID file placeholder
      ansible.builtin.copy:
        content: "12345"
        dest: /tmp/molecule_test/var/run/redis/redis-server.pid
        mode: "0644"
        backup: true

    - name: Create Redis data directory placeholder files
      ansible.builtin.copy:
        content: |
          # Redis data files would be stored here
          # dump.rdb and appendonly.aof files
        dest: /tmp/molecule_test/var/lib/redis/dump.rdb
        mode: "0644"
        backup: true