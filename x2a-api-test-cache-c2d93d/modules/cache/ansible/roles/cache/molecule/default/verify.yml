---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/redis/6379.conf
      register: redis_config_stat

    - name: Assert Redis configuration file was created
      ansible.builtin.assert:
        that:
          - redis_config_stat['stat']['exists']
          - redis_config_stat['stat']['size'] > 0
        fail_msg: "Redis configuration file not found"

    - name: Check Redis log directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory was created
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['exists']
          - redis_log_dir_stat['stat']['isdir']
        fail_msg: "Redis log directory not found"

    - name: Check Redis log file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/redis/redis-server.log
      register: redis_log_file_stat

    - name: Assert Redis log file was created
      ansible.builtin.assert:
        that:
          - redis_log_file_stat['stat']['exists']
          - redis_log_file_stat['stat']['size'] > 0
        fail_msg: "Redis log file not found"

    - name: Check memcached log file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/memcached.log
      register: memcached_log_stat

    - name: Assert memcached log file was created
      ansible.builtin.assert:
        that:
          - memcached_log_stat['stat']['exists']
          - memcached_log_stat['stat']['size'] > 0
        fail_msg: "Memcached log file not found"

    - name: Read Redis configuration file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis configuration contains required settings
      ansible.builtin.assert:
        that:
          - "'requirepass redis_secure_password_123' in redis_config_decoded"
          - "'port 6379' in redis_config_decoded"
          - "'bind 127.0.0.1' in redis_config_decoded"
          - "'logfile /var/log/redis/redis-server.log' in redis_config_decoded"
        fail_msg: "Redis configuration missing required settings"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

    - name: Assert Redis configuration cleanup patterns are absent
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in redis_config_decoded"
          - "'replica-read-only' not in redis_config_decoded"
          - "'repl-ping-replica-period' not in redis_config_decoded"
          - "'replica-priority' not in redis_config_decoded"
        fail_msg: "Redis configuration contains patterns that should be cleaned up"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

    - name: Check Redis data directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/lib/redis
      register: redis_data_dir_stat

    - name: Assert Redis data directory was created
      ansible.builtin.assert:
        that:
          - redis_data_dir_stat['stat']['exists']
          - redis_data_dir_stat['stat']['isdir']
        fail_msg: "Redis data directory not found"

    - name: Check Redis PID file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/run/redis/redis-server.pid
      register: redis_pid_stat

    - name: Assert Redis PID file was created
      ansible.builtin.assert:
        that:
          - redis_pid_stat['stat']['exists']
          - redis_pid_stat['stat']['size'] > 0
        fail_msg: "Redis PID file not found"

- name: Verify Services (Container-incompatible checks)
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Redis service is active
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
        fail_msg: "Redis service not running"
      tags: molecule-notest

    - name: Check memcached service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert memcached service is active
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - "ansible_facts.services['memcached.service']['state'] == 'running'"
        fail_msg: "Memcached service not running"
      tags: molecule-notest

    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 5
      tags: molecule-notest

    - name: Check memcached port is listening
      ansible.builtin.wait_for:
        port: 11211
        host: 127.0.0.1
        timeout: 5
      tags: molecule-notest

    - name: Test Redis connectivity with authentication
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 ping
      register: redis_ping_result
      changed_when: false
      tags: molecule-notest

    - name: Assert Redis responds to authenticated ping
      ansible.builtin.assert:
        that:
          - "redis_ping_result['stdout'] == 'PONG'"
        fail_msg: "Redis authentication test failed"
      tags: molecule-notest

    - name: Test Redis functionality with set/get
      ansible.builtin.command:
        cmd: "{{ item_redis_cmd }}"
      loop:
        - redis-cli -p 6379 -a redis_secure_password_123 set test_key "test_value"
        - redis-cli -p 6379 -a redis_secure_password_123 get test_key
        - redis-cli -p 6379 -a redis_secure_password_123 del test_key
      loop_control:
        loop_var: item_redis_cmd
      register: redis_test_results
      changed_when: false
      tags: molecule-notest

    - name: Assert Redis set/get functionality works
      ansible.builtin.assert:
        that:
          - "redis_test_results['results'][0]['stdout'] == 'OK'"
          - "redis_test_results['results'][1]['stdout'] == '\"test_value\"'"
          - "redis_test_results['results'][2]['stdout'] == '1'"
        fail_msg: "Redis functionality test failed"
      tags: molecule-notest

    - name: Test memcached connectivity
      ansible.builtin.shell: |
        echo "stats" | nc localhost 11211
      register: memcached_stats_result
      changed_when: false
      tags: molecule-notest

    - name: Assert memcached responds to stats command
      ansible.builtin.assert:
        that:
          - "'STAT' in memcached_stats_result['stdout']"
        fail_msg: "Memcached connectivity test failed"
      tags: molecule-notest