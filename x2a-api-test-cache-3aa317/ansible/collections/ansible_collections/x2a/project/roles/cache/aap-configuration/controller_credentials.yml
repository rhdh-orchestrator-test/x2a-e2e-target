---
controller_credentials:
  - name: Redis Authentication - cache
    description: Password used to authenticate clients to the Redis instance on port 6379. The source value is hardcoded in the Chef recipe and must be rotated 
      and stored as an AAP secret.
    organization: Default
    credential_type: Redis Authentication
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
  - name: Chef Encrypted Data Bag Token - cache
    description: Encrypted token stored in the nginx_secrets/site Chef encrypted data bag item. It is not consumed by the cache execution flow but is identified
      in the module Credentials section for migration handling.
    organization: Default
    credential_type: Chef Encrypted Data Bag Token
    update_secrets: true
    inputs:
      id: "{{ id }}"
      token: "{{ vault_token }}"
