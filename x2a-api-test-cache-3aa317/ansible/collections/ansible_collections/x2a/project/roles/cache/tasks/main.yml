---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Redis cache instance  # noqa: L038 - eloy.redis.redis is an external role declared in this role's requirements.yml
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_install_method: package
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_password }}"
    redis_bind: "{{ cache_redis_bind }}"
    redis_version: "{{ cache_redis_version }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_rdb_enabled: true

- name: Ensure Redis PID directory exists
  ansible.builtin.file:
    path: "{{ cache_redis_pid_dir }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Ensure Redis log directory exists
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Check for the Redis configuration file
  ansible.builtin.stat:
    path: /etc/redis/6379.conf
  register: cache_redis_config

- name: Remove prohibited Redis replication directives  # noqa: L039 - cache_redis_config is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^{{ item_redis_directive }}(?:\s|$)
    state: absent
    create: false
  when: cache_redis_config.stat.exists
  loop:
    - replica-serve-stale-data
    - replica-read-only
    - repl-ping-replica-period
    - client-output-buffer-limit
    - replica-priority
  loop_control:
    loop_var: item_redis_directive
  notify: Restart redis

- name: Include Memcached configuration
  ansible.builtin.include_tasks: memcached.yml
