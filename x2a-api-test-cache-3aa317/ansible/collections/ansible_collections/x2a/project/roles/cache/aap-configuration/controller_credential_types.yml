---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis instance on port 6379. The source value is hardcoded in the Chef recipe and must be rotated 
      and stored as an AAP secret.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required to authenticate to the Redis server listening on port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
  - name: Chef Encrypted Data Bag Token
    description: Encrypted token stored in the nginx_secrets/site Chef encrypted data bag item. It is not consumed by the cache execution flow but is identified
      in the module Credentials section for migration handling.
    kind: cloud
    inputs:
      fields:
        - id: id
          type: string
          label: Data Bag Item ID
          help_text: Identifier for the encrypted Chef data bag item, nginx_secrets/site.
        - id: token
          type: string
          label: Site Token
          secret: true
          help_text: Secret token stored in the encrypted Chef data bag item.
      required:
        - token
    injectors:
      extra_vars:
        id: !unsafe "{{ id }}"
        token: !unsafe "{{ token }}"
