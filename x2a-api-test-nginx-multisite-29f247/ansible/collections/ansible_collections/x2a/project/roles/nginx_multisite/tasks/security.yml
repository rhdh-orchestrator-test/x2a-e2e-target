---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Configure fail2ban jail
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Check UFW status
  ansible.builtin.command:
    cmd: ufw status
  changed_when: false
  register: nginx_multisite_ufw_status
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default incoming policy  # noqa: L039 - status is registered by the preceding UFW status check
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  when:
    - nginx_multisite_ufw_enabled
    - "'Default: deny' not in nginx_multisite_ufw_status.stdout"

- name: Allow SSH through UFW  # noqa: L039 - status is registered by the preceding UFW status check
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - ssh
  when:
    - nginx_multisite_ufw_enabled
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTP through UFW  # noqa: L039 - status is registered by the preceding UFW status check
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - http
  when:
    - nginx_multisite_ufw_enabled
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTPS through UFW  # noqa: L039 - status is registered by the preceding UFW status check
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - https
  when:
    - nginx_multisite_ufw_enabled
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Enable UFW  # noqa: L039 - status is registered by the preceding UFW status check
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - enable
  when:
    - nginx_multisite_ufw_enabled
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"

- name: Deploy sysctl security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload sysctl

- name: Check SSH daemon configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable SSH root login  # noqa: L039 - configuration is registered by the preceding SSH stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    state: present
    create: false
    backup: true
  when:
    - nginx_multisite_disable_root_login
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart SSH

- name: Disable SSH password authentication  # noqa: L039 - configuration is registered by the preceding SSH stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    state: present
    create: false
    backup: true
  when:
    - not nginx_multisite_password_authentication
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart SSH
