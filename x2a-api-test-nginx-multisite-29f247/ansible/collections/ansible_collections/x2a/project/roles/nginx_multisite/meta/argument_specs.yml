---
argument_specs:
  main:
    short_description: Install and configure an Nginx multisite web server
    description:
      - Installs Nginx, configures multiple HTTPS virtual hosts, and applies security hardening.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
            content_file: test/index.html
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
            content_file: ci/index.html
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
            content_file: status/index.html
        description: Site definitions and document roots to configure.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory where site certificates are stored.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory where site private keys are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban security is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
