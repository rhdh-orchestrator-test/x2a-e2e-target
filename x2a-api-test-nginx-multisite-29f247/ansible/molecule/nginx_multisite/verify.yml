---
# Unsupported because the pre-flight commands state no expected outcome: package,
# service, UFW, security-file, fail2ban, per-site ls, HTTP/HTTPS curl, and journal checks.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Validate Nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_config_test
      changed_when: false

    - name: Assert Nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_config_test['rc'] == 0
        fail_msg: Nginx configuration validation failed.

    - name: Read SSH configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config

    - name: Assert SSH root login and password authentication are disabled
      ansible.builtin.assert:
        that:
          - sshd_config['content'] | b64decode is search('(?m)^PermitRootLogin[ \t]+no[ \t]*$')
          - sshd_config['content'] | b64decode is search('(?m)^PasswordAuthentication[ \t]+no[ \t]*$')
        fail_msg: Expected SSH hardening settings were not found.

    - name: Inspect certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          common_name: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          common_name: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          common_name: status.cluster.local
      loop_control:
        loop_var: item_certificate
      register: certificate_subjects
      changed_when: false

    - name: Assert certificate common names
      ansible.builtin.assert:
        that:
          - item_certificate_subject['stdout'] is search('CN[[:space:]]*=[[:space:]]*' ~ item_certificate_subject['item']['common_name'])
        fail_msg: Certificate subject common name did not match the expected hostname.
      loop: "{{ certificate_subjects['results'] }}"
      loop_control:
        loop_var: item_certificate_subject

    - name: Inspect private-key permissions and ownership
      ansible.builtin.stat:
        path: "{{ item_private_key['path'] }}"
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_private_key
      register: private_key_stats

    - name: Assert private-key permissions and ownership
      ansible.builtin.assert:
        that:
          - item_private_key_stat['stat']['exists']
          - item_private_key_stat['stat']['mode'] == '0640'
          - item_private_key_stat['stat']['pw_name'] == 'root'
          - item_private_key_stat['stat']['gr_name'] == 'ssl-cert'
        fail_msg: Private-key permissions or ownership did not match the expected values.
      loop: "{{ private_key_stats['results'] }}"
      loop_control:
        loop_var: item_private_key_stat

    - name: Check default Nginx site removal
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert default Nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']
        fail_msg: The default Nginx site is still present.
