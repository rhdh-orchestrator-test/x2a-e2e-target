---
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: apache2
    state: present
  become: true
- name: Ensure SSH server is installed
  ansible.builtin.package:
    name: "{{ 'openssh-server' if ansible_os_family == 'Debian' else 'openssh-server' }}"
    state: present
  become: true
- name: Ensure Apache SSL module is enabled
  ansible.builtin.command: a2enmod ssl
  become: true
  register: ssl_enabled
  changed_when: "'already enabled' not in ssl_enabled.stdout"
  failed_when: false
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: "{{ apache_ssl_conf_path }}"
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol {{ apache_ssl_protocol }}
  notify:
    - Restart apache
    - Restart sshd
  become: true
