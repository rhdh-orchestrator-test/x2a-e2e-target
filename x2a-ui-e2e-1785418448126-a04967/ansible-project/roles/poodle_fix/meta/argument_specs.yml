---
argument_specs:
  main:
    short_description: Role to fix POODLE vulnerability in Apache SSL configuration
    description: "This role applies a security fix for the POODLE vulnerability by updating SSL configuration in Apache to disable vulnerable protocols and enable
      only TLSv1.2.\n"
    author: X2A Migration
    options:
      apache_ssl_protocol:
        type: str
        default: -all +TLSv1.2
        description: "The SSL protocol configuration string for Apache. Default disables all protocols except TLSv1.2 to mitigate POODLE vulnerability.\n"
      apache_ssl_conf_path:
        type: str
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to the Apache SSL configuration file.
