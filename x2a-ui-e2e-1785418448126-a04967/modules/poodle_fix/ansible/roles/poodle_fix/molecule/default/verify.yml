---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check if Apache SSL config file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_conf_file

    - name: Assert SSL config file exists
      ansible.builtin.assert:
        that:
          - ssl_conf_file.stat.exists
          - ssl_conf_file.stat.isreg
        fail_msg: "Apache SSL config file not found"
        success_msg: "Apache SSL config file exists"

    - name: Get SSL config file content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_conf_content
      when: ssl_conf_file.stat.exists

    - name: Assert SSL protocol is properly configured
      ansible.builtin.assert:
        that:
          - ssl_conf_content.content | b64decode | regex_search('SSLProtocol -all \+TLSv1\.2')
        fail_msg: "SSL protocol configuration is incorrect"
        success_msg: "SSL protocol is correctly configured to disable vulnerable protocols"
      when: ssl_conf_file.stat.exists

    # The following checks would be performed on a real system but can't run in a container
    # They are tagged with molecule-notest to exclude them during molecule testing

    - name: Check if Apache is installed and running
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Assert SSH service is running
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
          - "ansible_facts.services['sshd.service'].state == 'running'"
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"
      tags: molecule-notest

    - name: Check if SSL module is enabled in Apache
      ansible.builtin.command: apache2ctl -M
      register: apache_modules
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert SSL module is enabled
      ansible.builtin.assert:
        that:
          - "'ssl_module' in apache_modules.stdout"
        fail_msg: "SSL module is not enabled in Apache"
        success_msg: "SSL module is enabled in Apache"
      tags: molecule-notest

    - name: Test TLS 1.2 connection
      ansible.builtin.command: openssl s_client -connect localhost:443 -tls1_2
      register: tls_test
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert TLS 1.2 connection works
      ansible.builtin.assert:
        that:
          - "tls_test.rc == 0"
        fail_msg: "TLS 1.2 connection failed"
        success_msg: "TLS 1.2 connection successful"
      tags: molecule-notest

    - name: Test SSLv3 connection (should fail)
      ansible.builtin.command: openssl s_client -connect localhost:443 -ssl3
      register: ssl3_test
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert SSLv3 connection fails (POODLE mitigation)
      ansible.builtin.assert:
        that:
          - "ssl3_test.rc != 0"
        fail_msg: "SSLv3 connection succeeded (POODLE vulnerability may still exist)"
        success_msg: "SSLv3 connection failed as expected (POODLE mitigation working)"
      tags: molecule-notest