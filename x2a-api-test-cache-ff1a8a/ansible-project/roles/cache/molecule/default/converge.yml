---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/var/log
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          # Generated by Ansible for molecule testing

          # Network
          bind 127.0.0.1
          port 6379
          timeout 0
          tcp-keepalive 60

          # General
          daemonize yes
          supervised systemd
          pidfile /var/run/redis/redis-server.pid
          loglevel notice
          logfile /var/log/redis/redis-server.log

          # Snapshotting
          save 900 1
          save 300 10
          save 60 10000
          stop-writes-on-bgsave-error yes
          rdbcompression yes
          rdbchecksum yes
          dbfilename dump.rdb
          dir /var/lib/redis

          # Security
          requirepass redis_secure_password_123

          # Clients
          maxclients 10000

          # Memory management
          maxmemory-policy noeviction

          # Append only file
          appendonly no
          appendfilename "appendonly.aof"
          appendfsync everysec
          no-appendfsync-on-rewrite no
          auto-aof-rewrite-percentage 100
          auto-aof-rewrite-min-size 64mb
          aof-load-truncated yes

          # Lua scripting
          lua-time-limit 5000

          # Slow log
          slowlog-log-slower-than 10000
          slowlog-max-len 128

          # Advanced config
          hash-max-ziplist-entries 512
          hash-max-ziplist-value 64
          list-max-ziplist-size -2
          list-compress-depth 0
          set-max-intset-entries 512
          zset-max-ziplist-entries 128
          zset-max-ziplist-value 64
          hll-sparse-max-bytes 3000
          activerehashing yes
          client-output-buffer-limit normal 0 0 0
          client-output-buffer-limit slave 256mb 64mb 60
          client-output-buffer-limit pubsub 32mb 8mb 60
          hz 10
          aof-rewrite-incremental-fsync yes
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create Memcached configuration file
      ansible.builtin.copy:
        content: |
          # memcached default config file
          # Generated by Ansible for molecule testing

          # Run memcached as a daemon
          -d

          # Log memcached's output to /var/log/memcached
          logfile /var/log/memcached.log

          # Start with a cap of 64 megs of memory
          -m 64

          # Default connection port is 11211
          -p 11211

          # Run the daemon as memcache user
          -u memcache

          # Specify which IP address to listen on
          -l 127.0.0.1
        dest: /tmp/molecule_test/etc/memcached.conf
        mode: "0644"
        backup: true

    - name: Create Redis log file placeholder
      ansible.builtin.copy:
        content: "# Redis log file placeholder for molecule testing"
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"
        backup: true

    - name: Create Memcached log file placeholder
      ansible.builtin.copy:
        content: "# Memcached log file placeholder for molecule testing"
        dest: /tmp/molecule_test/var/log/memcached.log
        mode: "0644"
        backup: true

    - name: Create Redis data directory placeholder files
      ansible.builtin.copy:
        content: "# Redis data directory placeholder"
        dest: "{{ item_data }}"
        mode: "0644"
        backup: true
      loop:
        - /tmp/molecule_test/var/lib/redis/dump.rdb
        - /tmp/molecule_test/var/lib/redis/appendonly.aof
      loop_control:
        loop_var: item_data

    - name: Create Redis PID file placeholder
      ansible.builtin.copy:
        content: "12345"
        dest: /tmp/molecule_test/var/run/redis/redis-server.pid
        mode: "0644"
        backup: true