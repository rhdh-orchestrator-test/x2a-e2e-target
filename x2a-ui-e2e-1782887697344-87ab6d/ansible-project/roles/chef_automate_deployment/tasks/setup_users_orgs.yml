---
- name: Ensure directory for key files exists
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_key_filename }}"
    - "{{ chef_org_validator_filename }}"
  when: chef_user_key_filename | dirname != '.' or chef_org_validator_filename | dirname != '.'
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ chef_user_key_filename }}

      '
  become: true
  args:
    creates: "{{ chef_user_key_filename }}"
  register: create_user_result
  changed_when: create_user_result.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_full_name }}" --association_user {{ username }} --filename {{ chef_org_validator_filename }}

      '
  become: true
  args:
    creates: "{{ chef_org_validator_filename }}"
  register: create_org_result
  changed_when: create_org_result.rc == 0
- name: Set proper permissions on key files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0400"
    state: file
  loop:
    - "{{ chef_user_key_filename }}"
    - "{{ chef_org_validator_filename }}"
  when: create_user_result.changed or create_org_result.changed
