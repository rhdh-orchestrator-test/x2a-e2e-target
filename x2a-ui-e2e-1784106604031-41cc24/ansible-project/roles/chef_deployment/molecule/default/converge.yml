---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: molecule_test_user
    password: molecule_test_password
    email: molecule@test.com
    chef_hostname: molecule-test.chef.lab
    chef_orgname: molecule
    chef_longorgname: Molecule Test Org
    chef_longusername: Molecule Test User
    chef_userfilename: molecule_test_user.pem
    chef_orgfilename: molecule-validator.pem
    chef_vm_max_map_count: 262144
    chef_vm_dirty_expire_centisecs: 20000
    chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
    chef_automate_accept_terms: true
    chef_deploy_automate: true
  tasks:
    # Create directory structure to simulate what the role would create
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/tmp
        - /tmp/molecule_test/hab

    # Simulate hostname setting
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl settings
    - name: Create sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = {{ chef_vm_max_map_count }}
          vm.dirty_expire_centisecs = {{ chef_vm_dirty_expire_centisecs }}
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-settings.conf
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "# Simulated Chef Automate CLI binary"
        dest: /tmp/molecule_test/tmp/chef-automate
        mode: "0755"

    # Simulate Chef user PEM file
    - name: Create Chef user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAwZ5UJULAjWr7p6FVwGRQRjFN2s8tZ/6LC3X82fajpVsYqF1x
          qEuUDndDXVD09E4u83MS6HO6a3bIVQDp6/klnYldiE6Vp8HH5BSKaCWKVg8lGWg1
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/{{ chef_userfilename }}
        mode: "0600"

    # Simulate Chef organization validator PEM file
    - name: Create Chef organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA7NvXUZP8YYIgD9dZ9urqKfxOjNsZKpKMcKkLkFWOAYwUgpQF
          iVJnfD3Jjg19BWmB5xOek4TuqBNRswbXbkSgGDauGi9j5m9EXQ3zGXGCe/Eo+Ld0
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/{{ chef_orgfilename }}
        mode: "0600"

    # Simulate Chef Automate deployment artifacts
    - name: Create Chef Automate deployment artifacts
      ansible.builtin.copy:
        content: "# Simulated Chef Automate deployment configuration"
        dest: /tmp/molecule_test/hab/chef-automate-config.toml
        mode: "0644"

    # Simulate Chef server-ctl command outputs
    - name: Create Chef user list file
      ansible.builtin.copy:
        content: "{{ username }}"
        dest: /tmp/molecule_test/chef-user-list.txt
        mode: "0644"

    - name: Create Chef organization list file
      ansible.builtin.copy:
        content: "{{ chef_orgname }}"
        dest: /tmp/molecule_test/chef-org-list.txt
        mode: "0644"