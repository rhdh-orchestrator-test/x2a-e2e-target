---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: molecule_test_user
    chef_orgname: molecule
    chef_userfilename: molecule_test_user.pem
    chef_orgfilename: molecule-validator.pem
  tasks:
    # Check hostname
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "molecule-test.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Check kernel parameters
    - name: Check sysctl settings file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-settings.conf
      register: sysctl_file

    - name: Assert sysctl settings file was created
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Sysctl settings file not found"
        success_msg: "Sysctl settings file exists"

    - name: Get sysctl settings content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-settings.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search("vm.max_map_count = 262144")
        fail_msg: "vm.max_map_count not set correctly"
        success_msg: "vm.max_map_count set correctly"
      when: sysctl_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search("vm.dirty_expire_centisecs = 20000")
        fail_msg: "vm.dirty_expire_centisecs not set correctly"
        success_msg: "vm.dirty_expire_centisecs set correctly"
      when: sysctl_file.stat.exists

    # Check Chef Automate CLI
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI was downloaded
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Check Chef user PEM file
    - name: Check Chef user PEM file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_userfilename }}"
      register: user_pem

    - name: Assert Chef user PEM file was created
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.size > 0
        fail_msg: "Chef user PEM file not found"
        success_msg: "Chef user PEM file exists"

    # Check Chef organization validator PEM file
    - name: Check Chef organization validator PEM file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_orgfilename }}"
      register: org_pem

    - name: Assert Chef organization validator PEM file was created
      ansible.builtin.assert:
        that:
          - org_pem.stat.exists
          - org_pem.stat.size > 0
        fail_msg: "Chef organization validator PEM file not found"
        success_msg: "Chef organization validator PEM file exists"

    # Check Chef Automate deployment artifacts
    - name: Check Chef Automate deployment artifacts exist
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/chef-automate-config.toml
      register: chef_automate_config

    - name: Assert Chef Automate deployment artifacts were created
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
          - chef_automate_config.stat.size > 0
        fail_msg: "Chef Automate deployment artifacts not found"
        success_msg: "Chef Automate deployment artifacts exist"

    # Check Chef user list
    - name: Check Chef user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-user-list.txt
      register: user_list

    - name: Assert Chef user list file was created
      ansible.builtin.assert:
        that:
          - user_list.stat.exists
          - user_list.stat.size > 0
        fail_msg: "Chef user list file not found"
        success_msg: "Chef user list file exists"

    - name: Get Chef user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/chef-user-list.txt
      register: user_list_content
      when: user_list.stat.exists

    - name: Assert Chef user was created
      ansible.builtin.assert:
        that:
          - (user_list_content.content | b64decode | trim) == username
        fail_msg: "Chef user not created correctly"
        success_msg: "Chef user created correctly"
      when: user_list.stat.exists

    # Check Chef organization list
    - name: Check Chef organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-org-list.txt
      register: org_list

    - name: Assert Chef organization list file was created
      ansible.builtin.assert:
        that:
          - org_list.stat.exists
          - org_list.stat.size > 0
        fail_msg: "Chef organization list file not found"
        success_msg: "Chef organization list file exists"

    - name: Get Chef organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/chef-org-list.txt
      register: org_list_content
      when: org_list.stat.exists

    - name: Assert Chef organization was created
      ansible.builtin.assert:
        that:
          - (org_list_content.content | b64decode | trim) == chef_orgname
        fail_msg: "Chef organization not created correctly"
        success_msg: "Chef organization created correctly"
      when: org_list.stat.exists

    # The following checks would normally be performed but can't run in a container
    # They are tagged with molecule-notest so they won't run during molecule testing

    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo ./chef-automate status
        chdir: /tmp
      register: chef_automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef user list
      ansible.builtin.command:
        cmd: sudo chef-server-ctl user-list
      register: chef_user_list
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef user exists
      ansible.builtin.assert:
        that:
          - username in chef_user_list.stdout
        fail_msg: "Chef user not found"
        success_msg: "Chef user exists"
      tags: molecule-notest

    - name: Check Chef organization list
      ansible.builtin.command:
        cmd: sudo chef-server-ctl org-list
      register: chef_org_list
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef organization exists
      ansible.builtin.assert:
        that:
          - chef_orgname in chef_org_list.stdout
        fail_msg: "Chef organization not found"
        success_msg: "Chef organization exists"
      tags: molecule-notest