- name: Set system hostname
  ansible.builtin.hostname:
    name: '{{ chef_automate_hostname }}'
  become: true
- name: Set vm.max_map_count kernel parameter
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: '{{ chef_automate_vm_max_map_count }}'
    state: present
    sysctl_set: true
  become: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: '{{ chef_automate_vm_dirty_expire_centisecs }}'
    state: present
    sysctl_set: true
  become: true
- name: Create temporary directory for Chef Automate CLI
  ansible.builtin.tempfile:
    state: directory
    suffix: chef-automate
  register: chef_automate_temp_dir
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: '{{ chef_automate_cli_url }}'
    dest: '{{ chef_automate_temp_dir.path }}/chef-automate.zip'
    mode: '0644'
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: '{{ chef_automate_temp_dir.path }}/chef-automate.zip'
    dest: '{{ chef_automate_temp_dir.path }}/'
    remote_src: true
    mode: '0755'
    creates: '{{ chef_automate_temp_dir.path }}/chef-automate'
- name: Deploy Chef Infra Server only
  ansible.builtin.command: '{{ chef_automate_temp_dir.path }}/chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms |
    lower }} '
  args:
    creates: /hab
  become: true
- name: Create Chef user
  ansible.builtin.command: 'chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ chef_automate_user_pem_path }}

    '
  args:
    creates: '{{ chef_automate_user_pem_path }}'
  become: true
- name: Create Chef organization
  ansible.builtin.command: 'chef-server-ctl org-create {{ org_name }} "{{ org_full_name }}" --association_user {{ username }} --filename {{ chef_automate_org_pem_path
    }}

    '
  args:
    creates: '{{ chef_automate_org_pem_path }}'
  become: true
