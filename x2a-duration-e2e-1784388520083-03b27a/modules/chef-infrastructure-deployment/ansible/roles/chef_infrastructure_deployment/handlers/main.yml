---
- name: Restart Chef Automate
  ansible.builtin.command:
    cmd: sudo chef-automate restart
  listen: restart chef automate
  changed_when: false
  failed_when: false
- name: Restart Chef Infra Server
  ansible.builtin.command:
    cmd: sudo chef-server-ctl restart
  listen: restart chef server
  changed_when: false
  failed_when: false
- name: Wait for Chef Infra Server to be ready
  ansible.builtin.wait_for:
    host: localhost
    port: 443
    delay: 10
    timeout: 600
  listen: wait for chef server
  tags: molecule-notest
