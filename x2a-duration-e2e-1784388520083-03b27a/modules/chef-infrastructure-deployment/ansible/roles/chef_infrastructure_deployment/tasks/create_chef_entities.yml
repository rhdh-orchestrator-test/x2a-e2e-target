---
- name: Create Chef user
  ansible.builtin.command:
    cmd: sudo chef-server-ctl user-create {{ username }} "{{ username }}" {{ email }} "{{ password }}" --filename {{ chef_user_filename }}
  args:
    creates: "{{ chef_user_filename }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: sudo chef-server-ctl org-create {{ organization }} "{{ organization }}" --association_user {{ username }} --filename {{ chef_org_filename }}
  args:
    creates: "{{ chef_org_filename }}"
  become: true
