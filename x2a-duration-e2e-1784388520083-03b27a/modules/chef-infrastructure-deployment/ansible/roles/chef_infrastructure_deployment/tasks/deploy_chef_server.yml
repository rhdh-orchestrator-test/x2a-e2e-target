---
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: sudo ./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_accept_terms_and_mlsa | lower }}
  args:
    creates: /hab
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
  notify: wait for chef server
