---
controller_credential_types:
- name: Chef Admin User
  description: Credentials for the initial Chef admin user
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Admin username for Chef Automate and Chef Infra Server
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Admin password for Chef Automate and Chef Infra Server
    - id: email
      type: string
      label: Email
      help_text: Email address for the Chef admin user
    - id: organization
      type: string
      label: Organization
      help_text: Chef organization name to create
    required:
    - username
    - password
    - email
    - organization
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
      organization: !unsafe '{{ organization }}'
