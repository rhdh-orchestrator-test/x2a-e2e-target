- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache config
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/apache2/mods-available
  - name: Create mock Apache SSL config file with default settings
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        # Default configuration before POODLE fix

        SSLProtocol all -SSLv3

        SSLCipherSuite HIGH:!aNULL:!MD5

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Include role poodle_fix
    include_role:
      name: poodle_fix
    vars:
      apache_ssl_conf_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
