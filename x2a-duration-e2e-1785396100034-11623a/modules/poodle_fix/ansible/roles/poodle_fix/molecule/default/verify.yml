---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check SSL configuration file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_conf_file

    - name: Assert SSL configuration file exists
      ansible.builtin.assert:
        that:
          - ssl_conf_file.stat.exists
          - ssl_conf_file.stat.isreg
        fail_msg: "SSL configuration file not found"
        success_msg: "SSL configuration file exists"

    - name: Get SSL configuration file content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_conf_content

    - name: Assert SSL configuration has been updated to fix POODLE vulnerability
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in ssl_conf_content.content | b64decode"
          - "'SSLProtocol all -SSLv2' not in ssl_conf_content.content | b64decode"
        fail_msg: "SSL configuration was not properly updated to fix POODLE vulnerability"
        success_msg: "SSL configuration was properly updated to fix POODLE vulnerability"

    # The following checks would be performed in a real environment but can't run in the molecule container
    # They are tagged with molecule-notest to be skipped during molecule testing

    - name: Check Apache is installed
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is available
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
        fail_msg: "Apache service not found"
        success_msg: "Apache service is available"
      tags: molecule-notest

    - name: Check SSH is installed
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert SSH service is available
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
        fail_msg: "SSH service not found"
        success_msg: "SSH service is available"
      tags: molecule-notest

    - name: Validate Apache configuration
      ansible.builtin.command: apache2ctl configtest
      changed_when: false
      tags: molecule-notest

    - name: Test SSL configuration with OpenSSL
      ansible.builtin.command: openssl s_client -connect localhost:443 -tls1_2
      changed_when: false
      tags: molecule-notest