---
argument_specs:
  main:
    short_description: Configure a secure Nginx multisite server
    description:
      - Installs and configures Nginx, Fail2ban, UFW, SSH hardening, kernel security, SSL certificates, and virtual hosts.
    options:
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated SSL certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated SSL private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban protection is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether root SSH login is disabled.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is permitted.
      nginx_multisite_sites:
        type: dict
        required: false
        default: {}
        description: Mapping of site names to document roots and SSL settings.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks handling credential values.
      token:
        type: str
        required: true
        description: Site token injected by an AAP credential type.
      private_key:
        type: str
        required: true
        description: Private key injected by an AAP credential type.
