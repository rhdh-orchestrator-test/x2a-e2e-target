---
controller_credentials:
  - name: Nginx Site Token - nginx_multisite
    description: Secret token loaded from the Chef encrypted data bag nginx_secrets/site and written to /etc/nginx/secrets/site_token.
    organization: Default
    credential_type: Nginx Site Token
    update_secrets: true
    inputs:
      token: "{{ vault_token }}"
  - name: Nginx TLS Private Keys - nginx_multisite
    description: Private keys generated for SSL-enabled Nginx sites and installed under /etc/ssl/private.
    organization: Default
    credential_type: Nginx TLS Private Keys
    update_secrets: true
    inputs:
      private_key: "{{ vault_private_key }}"
