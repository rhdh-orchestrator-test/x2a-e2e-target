---
controller_credential_types:
  - name: Nginx Site Token
    description: Secret token loaded from the Chef encrypted data bag nginx_secrets/site and written to /etc/nginx/secrets/site_token.
    kind: cloud
    inputs:
      fields:
        - id: token
          type: string
          label: Site Token
          secret: true
          help_text: Secret token retrieved from the nginx_secrets/site encrypted data bag item.
      required:
        - token
    injectors:
      extra_vars:
        token: !unsafe "{{ token }}"
  - name: Nginx TLS Private Keys
    description: Private keys generated for SSL-enabled Nginx sites and installed under /etc/ssl/private.
    kind: cloud
    inputs:
      fields:
        - id: private_key
          type: string
          label: TLS Private Key
          secret: true
          help_text: Private key for an SSL-enabled Nginx site; store securely and suppress it from logs and task output.
      required:
        - private_key
    injectors:
      extra_vars:
        private_key: !unsafe "{{ private_key }}"
