---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Deploy Fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Check UFW current status
  ansible.builtin.command:
    argv:
      - ufw
      - status
      - verbose
  register: nginx_multisite_ufw_status
  changed_when: false
  check_mode: false
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default incoming policy # noqa: L039 - status is registered by the preceding UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  when:
    - nginx_multisite_ufw_enabled
    - "'Default: deny (incoming)' not in (nginx_multisite_ufw_status.stdout | default(''))"

- name: Allow SSH through UFW # noqa: L039 - status is registered by the preceding UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - ssh
  changed_when: false
  when:
    - nginx_multisite_ufw_enabled
    - "'22/tcp' not in (nginx_multisite_ufw_status.stdout | default(''))"

- name: Allow HTTP through UFW # noqa: L039 - status is registered by the preceding UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - http
  changed_when: false
  when:
    - nginx_multisite_ufw_enabled
    - "'80/tcp' not in (nginx_multisite_ufw_status.stdout | default(''))"

- name: Allow HTTPS through UFW # noqa: L039 - status is registered by the preceding UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - https
  changed_when: false
  when:
    - nginx_multisite_ufw_enabled
    - "'443/tcp' not in (nginx_multisite_ufw_status.stdout | default(''))"

- name: Enable UFW # noqa: L039 - status is registered by the preceding UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - enable
  changed_when: false
  when:
    - nginx_multisite_ufw_enabled
    - "'Status: active' not in (nginx_multisite_ufw_status.stdout | default(''))"

- name: Deploy kernel security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Check whether SSH daemon configuration exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable root SSH login # noqa: L039 - SSH configuration status is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    mode: "0600"
    backup: true
    create: false
  when:
    - nginx_multisite_ssh_disable_root
    - nginx_multisite_sshd_config.stat.exists | default(false)
  notify: Restart sshd

- name: Disable SSH password authentication # noqa: L039 - SSH configuration status is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    mode: "0600"
    backup: true
    create: false
  when:
    - not nginx_multisite_ssh_password_auth
    - nginx_multisite_sshd_config.stat.exists | default(false)
  notify: Restart sshd
