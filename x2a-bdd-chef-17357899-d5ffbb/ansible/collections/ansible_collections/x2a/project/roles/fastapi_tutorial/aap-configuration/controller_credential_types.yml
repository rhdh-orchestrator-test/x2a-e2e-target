---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the FastAPI application's local PostgreSQL database, currently hardcoded in the Chef recipe and embedded in the generated 
      DATABASE_URL.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application; currently fastapi.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; currently hardcoded and must be rotated and stored securely.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application; currently fastapi_db.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL connection; currently localhost.
        - id: database_port
          type: string
          label: Database Port
          help_text: TCP port for PostgreSQL; currently 5432.
        - id: database_url
          type: string
          label: Database Connection URL
          secret: true
          help_text: Connection string exposed through the DATABASE_URL environment variable; it contains the database password.
      required:
        - database_username
        - database_password
        - database_name
        - database_host
        - database_port
        - database_url
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
        database_port: !unsafe "{{ database_port }}"
        database_url: !unsafe "{{ database_url }}"
