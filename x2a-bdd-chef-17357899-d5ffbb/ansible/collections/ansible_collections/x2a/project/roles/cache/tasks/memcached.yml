---
- name: Install Memcached package
  ansible.builtin.package:
    name: memcached
    state: present

- name: Configure Memcached service
  ansible.builtin.template:
    src: memcached.conf.j2
    dest: "{{ cache_memcached_config_path }}" # noqa: R114 - path is a role-controlled platform configuration path
    mode: "0644"
    backup: true
  notify: Restart Memcached

- name: Enable and start Memcached
  ansible.builtin.service:
    name: "{{ cache_memcached_service_name }}"
    enabled: true
    state: started
