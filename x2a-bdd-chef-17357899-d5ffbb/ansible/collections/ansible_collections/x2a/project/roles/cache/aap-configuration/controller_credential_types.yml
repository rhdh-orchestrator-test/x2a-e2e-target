---
controller_credential_types:
  - name: Redis Cache Authentication
    description: Redis authentication password configured for the Redis instance on port 6379; currently stored as hardcoded plaintext in a Chef recipe and 
      intended for migration to Ansible Vault or an external secret manager.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required to authenticate clients to the Redis instance listening on TCP port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
