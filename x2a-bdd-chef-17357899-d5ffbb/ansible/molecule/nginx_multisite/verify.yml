---
# Unsupported pre-flight checks: individual fail2ban jail status, exact kernel values,
# site-specific checks, TLS permission checks without retrieved site data, log tails,
# and configuration listings whose expected contents were not specified.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Collect service facts for fail2ban, SSH, and nginx checks
      ansible.builtin.service_facts:

    - name: Verify fail2ban is enabled and active
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service']['status'] == 'enabled'"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
        fail_msg: "fail2ban is not enabled and running"
        success_msg: "fail2ban is enabled and running"

    - name: Check UFW status and allowed pre-flight ports
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: item_ufw_status
      changed_when: false

    - name: Verify UFW is active and allows SSH, HTTP, and HTTPS
      ansible.builtin.assert:
        that:
          - "'Status: active' in item_ufw_status.stdout"
          - "item_ufw_status.stdout is search('22/tcp')"
          - "item_ufw_status.stdout is search('80/tcp')"
          - "item_ufw_status.stdout is search('443/tcp')"
        fail_msg: "UFW is not active or does not allow all required TCP ports"
        success_msg: "UFW is active and allows TCP ports 22, 80, and 443"

    - name: Verify sshd is active
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
          - "ansible_facts.services['sshd.service']['state'] == 'running'"
        fail_msg: "sshd is not active"
        success_msg: "sshd is active"

    - name: Read the SSH daemon configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_sshd_config

    - name: Verify SSH hardening settings
      ansible.builtin.assert:
        that:
          - "(item_sshd_config.content | b64decode) is search('(?m)^PermitRootLogin\\s+no\\s*$')"
          - "(item_sshd_config.content | b64decode) is search('(?m)^PasswordAuthentication\\s+no\\s*$')"
        fail_msg: "sshd_config does not contain the required hardening settings"
        success_msg: "sshd_config contains the required hardening settings"

    - name: Validate the SSH daemon configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false

    - name: Verify nginx is enabled and active
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service']['status'] == 'enabled'"
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
        fail_msg: "nginx is not enabled and running"
        success_msg: "nginx is enabled and running"

    - name: Validate the nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Verify nginx is listening on HTTP
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 80
        state: started
        timeout: 10

    # HTTPS listening and all site-specific checks are unsupported until site data is retrieved.
