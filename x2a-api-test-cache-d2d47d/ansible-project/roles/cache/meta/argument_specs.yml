---
argument_specs:
  main:
    short_description: Install and configure memcached and Redis cache services
    description:
      - Installs and configures memcached and Redis cache services with authentication.
      - Creates necessary directories and users for Redis operation.
      - Configures Redis with password authentication using AAP credential variables.
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for Redis server to listen on.
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory path for Redis log files.
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to Redis configuration file.
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: System user for Redis service.
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: System group for Redis service.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: TCP port for memcached service to listen on.
      cache_packages:
        type: list
        elements: str
        required: false
        default:
          - memcached
          - redis-server
        description: List of cache packages to install.
      cache_memcached_service:
        type: str
        required: false
        default: memcached
        description: Name of the memcached service.
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis service.
      redis_password:
        type: str
        required: true
        description: >-
          Redis authentication password. This variable is injected by AAP
          credential types at runtime and should not be set manually.
