---
# Validate credential variables first

- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
# Install cache packages

- name: Install cache packages
  ansible.builtin.package:
    name: "{{ cache_packages }}"
    state: present
# Create Redis user and group

- name: Create Redis group
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    state: present

- name: Create Redis user
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present
# Create Redis directories

- name: Create Redis configuration directory
  ansible.builtin.file:
    path: /etc/redis
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}" # noqa: R114 - path from role defaults
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"

- name: Create Redis data directory
  ansible.builtin.file:
    path: /var/lib/redis
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"

- name: Create Redis run directory
  ansible.builtin.file:
    path: /var/run/redis
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
# Configure Redis

- name: Deploy Redis configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0640"
    backup: true
  notify: Restart Redis service
# Start and enable services

- name: Start and enable memcached service
  ansible.builtin.service:
    name: "{{ cache_memcached_service }}"
    state: started
    enabled: true

- name: Start and enable Redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    state: started
    enabled: true
