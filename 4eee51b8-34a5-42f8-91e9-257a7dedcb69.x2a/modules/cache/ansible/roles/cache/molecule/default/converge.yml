- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item_dir }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/run/redis
    loop_control:
      loop_var: item_dir
  - name: Simulate Redis package installation
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/bin/redis-server
      state: touch
      mode: '0755'
  - name: Create Redis configuration file
    ansible.builtin.copy:
      content: '# Redis configuration file

        port {{ cache_redis_port | default(6379) }}

        bind {{ cache_redis_bind_address | default(''127.0.0.1'') }}

        dir /var/lib/redis

        logfile /var/log/redis/redis-server.log

        unixsocket /var/run/redis/redis-server.sock

        unixsocketperm 755

        # Other default Redis settings would be here

        '
      dest: /tmp/molecule_test/etc/redis/redis.conf
      mode: '0644'
      backup: true
  - name: Create sample Redis log file
    ansible.builtin.copy:
      content: '# Redis server log

        1:M 01 Jan 2023 00:00:00.000 * Redis 6.0.16 (00000000/0) 64 bit, standalone mode, port 6379

        1:M 01 Jan 2023 00:00:00.000 * Server initialized

        1:M 01 Jan 2023 00:00:00.000 * Ready to accept connections

        '
      dest: /tmp/molecule_test/var/log/redis/redis-server.log
      mode: '0644'
      backup: true
  - name: Create Redis socket file (placeholder)
    ansible.builtin.file:
      path: /tmp/molecule_test/var/run/redis/redis-server.sock
      state: touch
      mode: '0755'
