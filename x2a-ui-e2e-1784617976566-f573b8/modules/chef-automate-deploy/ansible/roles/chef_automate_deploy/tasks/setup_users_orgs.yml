---
- name: Check if Chef Server is installed
  ansible.builtin.stat:
    path: /hab
  register: chef_server_installed
  become: true
- name: Fail if Chef Server is not installed
  ansible.builtin.fail:
    msg: Chef Server is not installed. Please run the install_chef_server.yml or install_automate.yml tasks first.
  when: not chef_server_installed.stat.exists
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_user_name }} {{ chef_user_fullname }} {{ chef_user_email }} "{{ chef_user_password }}" --filename {{
      chef_user_key_file }}
    creates: "{{ chef_user_key_file }}"
  become: true
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  no_log: true
  notify: Set permissions on user key file
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_fullname }}" --association_user {{ chef_user_name }} --filename {{
      chef_org_validator_key_file }}
    creates: "{{ chef_org_validator_key_file }}"
  become: true
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
  notify: Set permissions on organization validator key file
