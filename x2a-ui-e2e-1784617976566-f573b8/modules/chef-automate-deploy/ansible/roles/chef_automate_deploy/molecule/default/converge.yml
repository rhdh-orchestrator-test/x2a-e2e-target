- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create required directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/home/ansible
    - /tmp/molecule_test/var
    - /tmp/molecule_test/var/log
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '{{ chef_vm_max_map_count }}'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '{{ chef_vm_dirty_expire_centisecs }}'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/home/ansible/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock Chef user key -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/home/ansible/{{ chef_user_name }}.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock Chef organization validator key -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/home/ansible/{{ chef_org_name }}-validator.pem
      mode: '0600'
  - name: Create Chef server status files
    ansible.builtin.copy:
      content: running
      dest: /tmp/molecule_test/var/log/chef-server-status
      mode: '0644'
  - name: Create Chef Automate status files
    ansible.builtin.copy:
      content: running
      dest: /tmp/molecule_test/var/log/chef-automate-status
      mode: '0644'
    when: chef_automate_deploy_automate | bool
  vars:
    chef_hostname: automate.chef.lab
    chef_vm_max_map_count: 262144
    chef_vm_dirty_expire_centisecs: 20000
    chef_automate_cli_path: ./chef-automate
    chef_automate_deploy_automate: true
    chef_user_name: jtonello
    chef_org_name: lab
