---
argument_specs:
  main:
    short_description: Configures FastAPI tutorial application with PostgreSQL
    description:
      - Installs and configures a FastAPI tutorial application with PostgreSQL database backend.
      - Sets up Python virtual environment, clones the tutorial repository, and configures systemd service.
      - Creates database user and database using AAP credential variables for authentication.
    options:
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Directory where the FastAPI application will be installed.
      fastapi_tutorial_repo_url:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the FastAPI tutorial application.
      fastapi_tutorial_repo_branch:
        type: str
        required: false
        default: main
        description: Git branch to checkout from the repository.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Name of the systemd service for the FastAPI application.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port the FastAPI application will listen on.
      fastapi_tutorial_host:
        type: str
        required: false
        default: 0.0.0.0
        description: IP address the FastAPI application will bind to.
      fastapi_tutorial_python_executable:
        type: str
        required: false
        default: python3
        description: Python executable to use for creating the virtual environment.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: "{{ fastapi_tutorial_app_dir }}/venv"
        description: Path where the Python virtual environment will be created.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name to set in the environment configuration.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version to set in the environment configuration.
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: User account to run the FastAPI service as.
      fastapi_tutorial_service_group:
        type: str
        required: false
        default: root
        description: Group account to run the FastAPI service as.
      fastapi_tutorial_working_directory:
        type: str
        required: false
        default: "{{ fastapi_tutorial_app_dir }}"
        description: Working directory for the FastAPI service.
      fastapi_tutorial_restart_policy:
        type: str
        required: false
        default: always
        description: Systemd restart policy for the FastAPI service.
      fastapi_tutorial_dir_mode:
        type: str
        required: false
        default: "0755"
        description: File permissions for directories created by the role.
      fastapi_tutorial_file_mode:
        type: str
        required: false
        default: "0644"
        description: File permissions for files created by the role.
      fastapi_tutorial_system_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
        description: List of system packages required for the FastAPI application.
      db_username:
        type: str
        required: true
        description: Database username injected by AAP credential type for PostgreSQL authentication.
      db_password:
        type: str
        required: true
        description: Database password injected by AAP credential type for PostgreSQL authentication.
      db_host:
        type: str
        required: true
        description: Database host injected by AAP credential type for PostgreSQL connection.
      db_name:
        type: str
        required: true
        description: Database name injected by AAP credential type for PostgreSQL connection.
