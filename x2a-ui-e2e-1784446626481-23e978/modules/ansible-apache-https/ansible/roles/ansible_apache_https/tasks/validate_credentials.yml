---
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - username is defined
      - password is defined
      - vault_name is defined
      - vault_item is defined
      - vault_addr is defined
      - vault_token is defined
      - secret_path is defined
      - certificate is defined
      - private_key is defined
      - data_bag_name is defined
      - data_bag_item is defined
    fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template.
    quiet: true
