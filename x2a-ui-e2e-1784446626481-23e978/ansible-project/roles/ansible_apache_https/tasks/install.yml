---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true
- name: Install Apache with specific version
  ansible.builtin.apt:
    name: apache2={{ apache_version }}
    state: present
  become: true
- name: Install supporting packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - curl
    - openssl
    - python3-openssl
  become: true
