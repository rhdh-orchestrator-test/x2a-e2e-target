---
- name: Create a directory for certs
  ansible.builtin.file:
    path: "{{ apache_ssl_cert_dir }}"
    state: directory
    mode: "0640"
  become: true
- name: Generate an OpenSSL private key
  community.crypto.openssl_privatekey:
    path: "{{ apache_ssl_cert_dir }}/apache.key"
  become: true
- name: Generate an OpenSSL CSR
  community.crypto.openssl_csr:
    path: "{{ apache_ssl_cert_dir }}/apache.csr"
    privatekey_path: "{{ apache_ssl_cert_dir }}/apache.key"
    common_name: "{{ apache_server_name }}"
  become: true
- name: Generate a self-signed OpenSSL certificate
  community.crypto.x509_certificate:
    path: "{{ apache_ssl_cert_dir }}/apache.crt"
    privatekey_path: "{{ apache_ssl_cert_dir }}/apache.key"
    csr_path: "{{ apache_ssl_cert_dir }}/apache.csr"
    provider: selfsigned
  become: true
