---
controller_credentials:
- name: Chef Vault Database Credentials - ansible_apache_https
  description: Database credentials stored in Chef Vault
  organization: Default
  credential_type: Chef Vault Database Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    vault_name: '{{ vault_name }}'
    vault_item: '{{ vault_item }}'
- name: HashiCorp Vault API - ansible_apache_https
  description: Credentials for accessing HashiCorp Vault API
  organization: Default
  credential_type: HashiCorp Vault API
  update_secrets: true
  inputs:
    vault_addr: '{{ vault_addr }}'
    vault_token: '{{ vault_vault_token }}'
    secret_path: '{{ secret_path }}'
- name: SSL Certificate - ansible_apache_https
  description: SSL certificates for Apache HTTPS configuration
  organization: Default
  credential_type: SSL Certificate
  update_secrets: true
  inputs:
    certificate: '{{ certificate }}'
    private_key: '{{ vault_private_key }}'
    data_bag_name: '{{ data_bag_name }}'
    data_bag_item: '{{ data_bag_item }}'
