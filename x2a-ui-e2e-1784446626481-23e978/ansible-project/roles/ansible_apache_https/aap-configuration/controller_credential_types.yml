---
controller_credential_types:
- name: Chef Vault Database Credentials
  description: Database credentials stored in Chef Vault
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Database Username
      help_text: Username for database authentication
    - id: password
      type: string
      label: Database Password
      secret: true
      help_text: Password for database authentication
    - id: vault_name
      type: string
      label: Vault Name
      help_text: Name of the Chef Vault containing the credentials
    - id: vault_item
      type: string
      label: Vault Item
      help_text: Item name within the Chef Vault
    required:
    - username
    - password
    - vault_name
    - vault_item
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      vault_name: !unsafe '{{ vault_name }}'
      vault_item: !unsafe '{{ vault_item }}'
- name: HashiCorp Vault API
  description: Credentials for accessing HashiCorp Vault API
  kind: cloud
  inputs:
    fields:
    - id: vault_addr
      type: string
      label: Vault Address
      help_text: URL of the HashiCorp Vault server
    - id: vault_token
      type: string
      label: Vault Token
      secret: true
      help_text: Authentication token for HashiCorp Vault
    - id: secret_path
      type: string
      label: Secret Path
      help_text: Path to the secret in HashiCorp Vault
    required:
    - vault_addr
    - vault_token
  injectors:
    extra_vars:
      vault_addr: !unsafe '{{ vault_addr }}'
      vault_token: !unsafe '{{ vault_token }}'
      secret_path: !unsafe '{{ secret_path }}'
- name: SSL Certificate
  description: SSL certificates for Apache HTTPS configuration
  kind: cloud
  inputs:
    fields:
    - id: certificate
      type: string
      label: SSL Certificate
      help_text: Public SSL certificate for HTTPS
    - id: private_key
      type: string
      label: Private Key
      secret: true
      help_text: Private key for SSL certificate
    - id: data_bag_name
      type: string
      label: Data Bag Name
      help_text: Name of the encrypted data bag containing SSL certificates
    - id: data_bag_item
      type: string
      label: Data Bag Item
      help_text: Item name within the encrypted data bag
    required:
    - certificate
    - private_key
    - data_bag_name
  injectors:
    extra_vars:
      certificate: !unsafe '{{ certificate }}'
      private_key: !unsafe '{{ private_key }}'
      data_bag_name: !unsafe '{{ data_bag_name }}'
      data_bag_item: !unsafe '{{ data_bag_item }}'
