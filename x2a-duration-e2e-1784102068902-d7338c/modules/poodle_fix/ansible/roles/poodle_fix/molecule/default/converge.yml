---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create directory structure for Apache config
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/apache2/mods-available

    - name: Create sample Apache SSL config file with vulnerable configuration
      ansible.builtin.copy:
        content: |
          # Sample Apache SSL configuration file
          # This contains a vulnerable SSLProtocol line that will be fixed by the role
          
          SSLEngine on
          SSLProtocol all -SSLv3
          SSLCipherSuite HIGH:!aNULL:!MD5
        dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
        mode: "0644"

    # Simulate the role's task directly
    - name: Fix SSL in Apache (simulate role task)
      ansible.builtin.replace:
        dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
        regexp: ^SSLProtocol.*$
        replace: SSLProtocol -all +TLSv1.2