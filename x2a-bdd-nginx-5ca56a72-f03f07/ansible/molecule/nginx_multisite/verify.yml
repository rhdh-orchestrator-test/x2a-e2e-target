---
# Unsupported pre-flight checks: package listing, grep-only diagnostics, process listings,
# UFW numbered output, journal logs, certificate subject/date output, and unspecified command output.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service facts for nginx and fail2ban checks
      ansible.builtin.service_facts:

    - name: Verify nginx is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['nginx.service']['enabled'] | default(false)
          - ansible_facts.services['nginx.service']['state'] == 'running'

    - name: Verify fail2ban is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['fail2ban.service']['enabled'] | default(false)
          - ansible_facts.services['fail2ban.service']['state'] == 'running'

    - name: Verify required deployment files and directories exist
      ansible.builtin.stat:
        path: "{{ item_path }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_path
      register: required_paths

    - name: Assert required deployment files and directories exist
      ansible.builtin.assert:
        that:
          - item_required['stat']['exists']
      loop: "{{ required_paths['results'] }}"
      loop_control:
        loop_var: item_required

    - name: Verify the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']

    - name: Verify enabled site links
      ansible.builtin.stat:
        path: "{{ item_link['path'] }}"
        follow: false
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_link
      register: enabled_links

    - name: Assert enabled site links resolve to the available site files
      ansible.builtin.assert:
        that:
          - item_enabled['stat']['islnk']
          - item_enabled['stat']['lnk_source'] == item_enabled['item']['target']
      loop: "{{ enabled_links['results'] }}"
      loop_control:
        loop_var: item_enabled

    - name: Verify private key ownership and permissions
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: private_keys

    - name: Assert private keys have the required ownership and mode
      ansible.builtin.assert:
        that:
          - item_private['stat']['pw_name'] == 'root'
          - item_private['stat']['gr_name'] == 'ssl-cert'
          - item_private['stat']['mode'] == '0640'
      loop: "{{ private_keys['results'] }}"
      loop_control:
        loop_var: item_private

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      failed_when: nginx_test['rc'] != 0
      register: nginx_test

    - name: Verify nginx listens on HTTP and HTTPS
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_port }}"
        state: started
        timeout: 10
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_port

    - name: Verify HTTP and HTTPS responses for all named sites
      ansible.builtin.uri:
        url: "{{ item_endpoint['url'] }}"
        headers:
          Host: "{{ item_endpoint['host'] }}"
        status_code: 200
        validate_certs: false
      loop:
        - host: test.cluster.local
          url: http://127.0.0.1/
        - host: test.cluster.local
          url: https://127.0.0.1/
        - host: ci.cluster.local
          url: http://127.0.0.1/
        - host: ci.cluster.local
          url: https://127.0.0.1/
        - host: status.cluster.local
          url: http://127.0.0.1/
        - host: status.cluster.local
          url: https://127.0.0.1/
      loop_control:
        loop_var: item_endpoint

    - name: Verify fail2ban reports a valid status
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
      changed_when: false
      failed_when: fail2ban_status['rc'] != 0
      register: fail2ban_status

    - name: Verify sysctl security configuration applies
      ansible.builtin.command:
        argv:
          - sysctl
          - -p
          - /etc/sysctl.d/99-security.conf
      changed_when: false
      failed_when: sysctl_check['rc'] != 0
      register: sysctl_check

    - name: Verify SSH configuration disables root login and password authentication
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - ^(PermitRootLogin|PasswordAuthentication)[[:space:]]+no
          - /etc/ssh/sshd_config
      changed_when: false
      failed_when: ssh_settings['rc'] != 0
      register: ssh_settings

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false
      failed_when: sshd_test['rc'] != 0
      register: sshd_test

    - name: Verify UFW is active with required allowed services
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      changed_when: false
      failed_when: ufw_status['rc'] != 0
      register: ufw_status

    - name: Assert UFW policy and service rules
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status['stdout']"
          - "'Default: deny (incoming)' in ufw_status['stdout']"
          - "'22/tcp' in ufw_status['stdout'] or 'SSH' in ufw_status['stdout']"
          - "'80/tcp' in ufw_status['stdout'] or 'HTTP' in ufw_status['stdout']"
          - "'443/tcp' in ufw_status['stdout'] or 'HTTPS' in ufw_status['stdout']"
