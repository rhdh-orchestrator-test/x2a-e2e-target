---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install application and database packages  # noqa: R113 - package names come from role defaults controlled by the operator
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_packages }}"
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize application repository  # noqa: R104 - repository URL is controlled by the role and defaults to HTTPS; noqa: R106 - repository source is an intentional role parameter using the role's HTTPS default
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R106 - repository source is an intentional role parameter using the role's HTTPS default
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - destination is a role-defined application path
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - command arguments use role-defined paths, not untrusted command input
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}/bin/python" # noqa: R114 - path is under the role-defined application directory

- name: Install Python dependencies  # noqa: R113 - dependency installation uses a role-defined requirements file and virtualenv executable
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
    executable: "{{ fastapi_tutorial_venv_dir }}/bin/pip"
    state: present

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the PostgreSQL application role exists  # noqa: L039,R101 - database_username is a validated credential and is used as a SQL query value
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ database_username }}';
  changed_when: false
  register: fastapi_tutorial_role_check
  become: true  # noqa: R108 - PostgreSQL role inspection requires the postgres account
  become_user: postgres

- name: Create the PostgreSQL application role  # noqa: L039,R101 - validated credential values and the registered check are used intentionally in the SQL command
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - CREATE ROLE {{ database_username }} LOGIN PASSWORD '{{ database_password }}';
  when: fastapi_tutorial_role_check.stdout | trim != '1'
  changed_when: true
  become: true  # noqa: R108 - PostgreSQL role creation requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the application database exists  # noqa: L039,R101 - database_name is a validated credential and is used as a SQL query value
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}';
  changed_when: false
  register: fastapi_tutorial_database_check
  become: true  # noqa: R108 - PostgreSQL database inspection requires the postgres account
  become_user: postgres

- name: Create the application database  # noqa: L039,R101 - validated credential values and the registered check are used intentionally as createdb arguments
  ansible.builtin.command:
    argv:
      - createdb
      - -O
      - "{{ database_username }}"
      - "{{ database_name }}"
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  changed_when: true
  become: true  # noqa: R108 - database creation requires the postgres account
  become_user: postgres

- name: Grant application database privileges  # noqa: L039,R101 - validated credential values are used intentionally in the SQL command
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ database_username }};
  changed_when: false
  become: true  # noqa: R108 - granting PostgreSQL privileges requires the postgres account
  become_user: postgres

- name: Write application environment configuration  # noqa: L039 - database_url comes from the attached credential or role parameters
  ansible.builtin.copy:
    content: |-
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL={{ database_url }}
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path is under the role-defined application directory
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    content: |-
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - unit path is a role-defined system path
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: fastapi_tutorial systemd reload

- name: Apply systemd unit changes before starting FastAPI
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
