---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials for the local PostgreSQL role and FastAPI application's database connection.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      database_username: "{{ database_username }}"
      database_password: "{{ vault_database_password }}"
      database_name: "{{ database_name }}"
      database_host: "{{ database_host }}"
      database_url: "{{ vault_database_url }}"
