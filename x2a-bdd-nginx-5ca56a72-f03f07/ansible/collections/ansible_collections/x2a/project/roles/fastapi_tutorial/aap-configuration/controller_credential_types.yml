---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the local PostgreSQL role and FastAPI application's database connection.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application; the source value is fastapi.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; the source value is hardcoded and must be rotated.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application; the source value is fastapi_db.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname of the PostgreSQL server; the source connection uses localhost.
        - id: database_url
          type: string
          label: Database Connection URL
          secret: true
          help_text: Connection string supplied to the FastAPI application through DATABASE_URL; it contains the database password.
      required:
        - database_username
        - database_password
        - database_name
        - database_host
        - database_url
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
        database_url: !unsafe "{{ database_url }}"
