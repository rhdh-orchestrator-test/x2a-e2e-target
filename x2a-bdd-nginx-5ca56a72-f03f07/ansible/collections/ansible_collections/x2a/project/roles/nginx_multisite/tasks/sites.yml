---
- name: Deploy virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item_site['name'] }}" # noqa: R114 - path from role-defined sites list
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_site
  notify: Validate and reload nginx
  vars:
    server_name: "{{ item_site['name'] }}"
    document_root: "{{ item_site['document_root'] }}"
    ssl_enabled: "{{ item_site['ssl_enabled'] | default(false) }}"
    cert_file: "{{ item_site['cert_file'] | default('') }}"
    key_file: "{{ item_site['key_file'] | default('') }}"

- name: Enable virtual host configurations
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item_enabled_site['name'] }}"
    dest: "/etc/nginx/sites-enabled/{{ item_enabled_site['name'] }}" # noqa: R114 - path from role-defined sites list
    state: link
    mode: "0644"
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_enabled_site
  notify: Validate and reload nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Validate and reload nginx
