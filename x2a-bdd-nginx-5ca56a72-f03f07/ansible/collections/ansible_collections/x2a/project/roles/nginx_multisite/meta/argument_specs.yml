---
# argument spec file for x2a.project.nginx_multisite
argument_specs:
  main:
    short_description: Configure Nginx multisite hosting and host security.
    options:
      nginx_multisite_my_variable:
        type: str
        description: A simple string argument for demonstration.
        default: default_value
      nginx_multisite_sites:
        type: list
        elements: dict
        description: Sites to configure and optionally provision with self-signed TLS.
        default: []
        options:
          name:
            type: str
            required: true
          document_root:
            type: str
            required: true
          ssl_enabled:
            type: bool
            default: false
          cert_file:
            type: str
            required: false
          key_file:
            type: str
            required: false
          subject:
            type: str
            required: false
