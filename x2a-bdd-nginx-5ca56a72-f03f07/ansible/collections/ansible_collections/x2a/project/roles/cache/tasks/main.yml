---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Redis cache
  ansible.builtin.include_role:  # noqa: L038 - external eloy.redis.redis role is declared in requirements.yml
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_requirepass: "{{ redis_password }}"

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Enable and start Redis service
  ansible.builtin.service:
    name: redis
    state: started
    enabled: true
