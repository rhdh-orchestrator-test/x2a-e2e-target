---
# Unsupported: package-query output, unqualified fail2ban jail status output, SSH grep output,
# sysctl output, and certificate issuer/date output have no stated expected result.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify required services are active
      ansible.builtin.service_facts:

    - name: Assert required services are active
      ansible.builtin.assert:
        that:
          - "ansible_facts.services[item_service['name'] + '.service']['state'] == 'running'"
        fail_msg: required service is not active
      loop:
        - name: nginx
        - name: fail2ban
        - name: sshd
      loop_control:
        loop_var: item_service

    - name: Verify nginx configuration syntax
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      register: nginx_config_test

    - name: Assert nginx configuration syntax is valid
      ansible.builtin.assert:
        that:
          - nginx_config_test['rc'] == 0
        fail_msg: nginx configuration syntax check failed

    - name: Verify configured virtual hosts are present
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      changed_when: false
      register: nginx_dump

    - name: Assert all expected virtual hosts are configured
      ansible.builtin.assert:
        that:
          - "'test.cluster.local' in nginx_dump['stdout']"
          - "'ci.cluster.local' in nginx_dump['stdout']"
          - "'status.cluster.local' in nginx_dump['stdout']"
        fail_msg: expected virtual hosts are not all present in nginx configuration

    - name: Verify nginx listens on HTTP and HTTPS ports
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_port['port'] }}"
        state: started
        timeout: 10
      loop:
        - port: 80
        - port: 443
      loop_control:
        loop_var: item_port

    - name: Verify UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      changed_when: false
      register: ufw_status

    - name: Assert UFW is active with required policy and rules
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status['stdout']"
          - "'Default: deny (incoming)' in ufw_status['stdout']"
          - "'22/tcp' in ufw_status['stdout'] or '22' in ufw_status['stdout']"
          - "'80/tcp' in ufw_status['stdout'] or '80' in ufw_status['stdout']"
          - "'443/tcp' in ufw_status['stdout'] or '443' in ufw_status['stdout']"
        fail_msg: UFW is not active with the required default policy and rules

    - name: Verify site and TLS paths
      ansible.builtin.stat:
        path: "{{ item_site_file['path'] }}"
        follow: false
      loop:
        - path: /opt/server/test
          kind: directory
        - path: /opt/server/test/index.html
          kind: file
        - path: /etc/nginx/sites-available/test.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/test.cluster.local
          kind: link
        - path: /etc/ssl/certs/test.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/test.cluster.local.key
          kind: file
        - path: /opt/server/ci
          kind: directory
        - path: /opt/server/ci/index.html
          kind: file
        - path: /etc/nginx/sites-available/ci.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          kind: link
        - path: /etc/ssl/certs/ci.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/ci.cluster.local.key
          kind: file
        - path: /opt/server/status
          kind: directory
        - path: /opt/server/status/index.html
          kind: file
        - path: /etc/nginx/sites-available/status.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/status.cluster.local
          kind: link
        - path: /etc/ssl/certs/status.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/status.cluster.local.key
          kind: file
      loop_control:
        loop_var: item_site_file
      register: site_file_stats

    - name: Assert expected site and TLS paths have expected types
      ansible.builtin.assert:
        that:
          - item_site_stat['stat']['exists']
          - "(item_site_stat['item']['kind'] == 'directory' and item_site_stat['stat']['isdir']) or (item_site_stat['item']['kind'] == 'file' and item_site_stat['stat']['isreg']) or (item_site_stat['item']['kind'] == 'link' and item_site_stat['stat']['islnk'])"
        fail_msg: expected site or TLS path is missing or has the wrong type
      loop: "{{ site_file_stats['results'] }}"
      loop_control:
        loop_var: item_site_stat

    - name: Verify private key ownership and mode
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
        follow: false
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: private_key_stats

    - name: Assert private keys have required ownership and mode
      ansible.builtin.assert:
        that:
          - item_key_stat['stat']['pw_name'] == 'root'
          - item_key_stat['stat']['gr_name'] == 'ssl-cert'
          - item_key_stat['stat']['mode'] == '0640'
        fail_msg: private key ownership or mode is incorrect
      loop: "{{ private_key_stats['results'] }}"
      loop_control:
        loop_var: item_key_stat

    - name: Verify certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
      changed_when: false
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          name: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          name: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          name: status.cluster.local
      loop_control:
        loop_var: item_certificate
      register: certificate_details

    - name: Assert each certificate contains its matching site name
      ansible.builtin.assert:
        that:
          - "item_certificate_detail['item']['name'] in item_certificate_detail['stdout']"
        fail_msg: certificate subject does not contain its matching site name
      loop: "{{ certificate_details['results'] }}"
      loop_control:
        loop_var: item_certificate_detail

    - name: Verify HTTP redirects and HTTPS responses
      ansible.builtin.uri:
        url: "{{ item_endpoint['url'] }}"
        headers:
          Host: "{{ item_endpoint['host'] }}"
        validate_certs: false
        follow_redirects: none
        return_content: false
        status_code: "{{ item_endpoint['status_codes'] }}"
      loop:
        - host: test.cluster.local
          url: http://127.0.0.1/
          status_codes: [301]
        - host: test.cluster.local
          url: https://127.0.0.1/
          status_codes: [200]
        - host: ci.cluster.local
          url: http://127.0.0.1/
          status_codes: [301]
        - host: ci.cluster.local
          url: https://127.0.0.1/
          status_codes: [200]
        - host: status.cluster.local
          url: http://127.0.0.1/
          status_codes: [301]
        - host: status.cluster.local
          url: https://127.0.0.1/
          status_codes: [200]
      loop_control:
        loop_var: item_endpoint
