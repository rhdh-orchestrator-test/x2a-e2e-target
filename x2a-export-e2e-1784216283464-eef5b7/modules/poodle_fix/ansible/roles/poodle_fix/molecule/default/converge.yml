- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create Apache mods-available directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create sample ssl.conf file with vulnerable configuration
    ansible.builtin.copy:
      content: "# Sample Apache SSL configuration file\n# This is a simplified version for testing purposes\n\n<IfModule mod_ssl.c>\n    SSLProtocol all -SSLv3\n
        \   SSLCipherSuite HIGH:!aNULL:!MD5\n    SSLHonorCipherOrder on\n</IfModule>\n"
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Simulate package installation in molecule
    ansible.builtin.debug:
      msg: Simulating apache2 package installation in molecule environment
  - name: Fix SSL in Apache (molecule adaptation)
    ansible.builtin.replace:
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
      mode: '0644'
