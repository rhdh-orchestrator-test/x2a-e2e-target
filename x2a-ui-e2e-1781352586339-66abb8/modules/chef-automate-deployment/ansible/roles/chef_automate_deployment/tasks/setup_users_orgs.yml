---
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_automate_user.name }} {{ chef_automate_user.fullname }} {{ chef_automate_user.email }} "{{ password }}" --filename {{
      chef_automate_user.key_file }}

      '
  args:
    creates: "{{ chef_automate_user.key_file }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_org.name }} "{{ chef_automate_org.fullname }}" --association_user {{ chef_automate_user.name }} --filename {{
      chef_automate_org.validator_key_file }}

      '
  args:
    creates: "{{ chef_automate_org.validator_key_file }}"
  become: true
