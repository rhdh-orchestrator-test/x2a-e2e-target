---
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  become: true
  loop:
    - "{{ chef_user_key_filename }}"
    - "{{ chef_org_validator_filename }}"
  when: item | dirname != '.'
- name: Create Chef user
  ansible.builtin.command:
    cmd: "chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} {{ password }}  --filename {{ chef_user_key_filename }} "
  become: true
  args:
    creates: "{{ chef_user_key_filename }}"
  register: user_create_result
  changed_when: user_create_result.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}"  --association_user {{ username }} --filename {{ chef_org_validator_filename }}

      '
  become: true
  args:
    creates: "{{ chef_org_validator_filename }}"
  register: org_create_result
  changed_when: org_create_result.rc == 0
