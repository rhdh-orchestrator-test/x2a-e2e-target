- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create required directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_max_map_count }}'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_dirty_expire_centisecs }}'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/sh echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create hab directory to simulate successful deployment
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK USER KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/{{ chef_user_key_filename }}
      mode: '0600'
    vars:
      username: jtonello
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK ORG VALIDATOR KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/{{ chef_org_validator_filename }}
      mode: '0600'
    vars:
      chef_org_name: lab
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: "Service: automate-postgresql\n  Status: running\nService: automate-elasticsearch\n  Status: running\nService: automate-gateway\n  Status: running\nService:
        automate-ui\n  Status: running\n"
      dest: /tmp/molecule_test/chef-automate-status
      mode: '0644'
  - name: Create Chef Server status file
    ansible.builtin.copy:
      content: 'run: chef-server: (pid 12345) 123s; run: log: (pid 12346) 123s

        run: chef-solr: (pid 12347) 123s; run: log: (pid 12348) 123s

        run: postgresql: (pid 12349) 123s; run: log: (pid 12350) 123s

        '
      dest: /tmp/molecule_test/chef-server-status
      mode: '0644'
  - name: Create Chef user list file
    ansible.builtin.copy:
      content: 'jtonello '
      dest: /tmp/molecule_test/chef-user-list
      mode: '0644'
  - name: Create Chef user show file
    ansible.builtin.copy:
      content: 'username: jtonello

        display_name: John Tonello

        email: jtonello@chef.lab

        '
      dest: /tmp/molecule_test/chef-user-show
      mode: '0644'
  - name: Create Chef org list file
    ansible.builtin.copy:
      content: 'lab '
      dest: /tmp/molecule_test/chef-org-list
      mode: '0644'
  - name: Create Chef org show file
    ansible.builtin.copy:
      content: 'name: lab

        full_name: Chef Lab

        guid: 12345678-1234-1234-1234-123456789012

        '
      dest: /tmp/molecule_test/chef-org-show
      mode: '0644'
