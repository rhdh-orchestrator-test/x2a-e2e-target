---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Set vm.max_map_count kernel parameter
  ansible.builtin.sysctl:
    name: vm.max_map_count
    value: "{{ chef_automate_vm_max_map_count }}"
    state: present
    reload: true
  become: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  ansible.builtin.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ chef_automate_vm_dirty_expire_centisecs }}"
    state: present
    reload: true
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
- name: Ensure unzip is installed
  ansible.builtin.package:
    name: unzip
    state: present
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: /tmp/chef-automate.zip
    dest: /tmp/
    remote_src: true
    mode: "0755"
  register: extract_result
- name: Ensure destination directory exists for Chef Automate CLI
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path | dirname }}"
    state: directory
    mode: "0755"
  become: true
  when: chef_automate_cli_path | dirname != '.'
- name: Move Chef Automate CLI to destination
  ansible.builtin.copy:
    src: /tmp/chef-automate
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
    remote_src: true
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}
  become: true
  args:
    creates: /hab
  register: deploy_result
  changed_when: deploy_result.rc == 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: "chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} {{ password }}  --filename {{ chef_user_key_filename }} "
  become: true
  args:
    creates: "{{ chef_user_key_filename }}"
  register: user_create_result
  changed_when: user_create_result.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}"  --association_user {{ username }} --filename {{ chef_org_validator_filename }}

      '
  become: true
  args:
    creates: "{{ chef_org_validator_filename }}"
  register: org_create_result
  changed_when: org_create_result.rc == 0
