- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/systemd/system
    - /tmp/molecule_test/var/log/chef-automate
    - /tmp/molecule_test/opt/chef-automate
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "[global]\n  v1 = true\n[deployment]\n  automate = \"enabled\"\n  infra_server = \"enabled\"\n[load_balancer]\n  v1 = true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create Chef Automate service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Automate

        After=network.target


        [Service]

        Type=simple

        ExecStart=/opt/chef-automate/bin/chef-automate-ctl start

        ExecStop=/opt/chef-automate/bin/chef-automate-ctl stop

        Restart=on-failure


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      mode: '0644'
  - name: Create Chef Server service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Infra Server

        After=network.target


        [Service]

        Type=simple

        ExecStart=/opt/chef-server/bin/chef-server-ctl start

        ExecStop=/opt/chef-server/bin/chef-server-ctl stop

        Restart=on-failure


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-server.service
      mode: '0644'
  - name: Create Chef user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz1234567890

        abcdefghijklmnopqrstuvwxyz1234567890abcdefghijklmnopqrstuvwxyz

        abcdefghijklmnopqrstuvwxyz1234567890abcdefghijklmnopqrstuvwxyz

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create Chef organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba0987654321

        zyxwvutsrqponmlkjihgfedcba0987654321zyxwvutsrqponmlkjihgfedcba

        zyxwvutsrqponmlkjihgfedcba0987654321zyxwvutsrqponmlkjihgfedcba

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create mock Chef Automate CLI binary
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        exit 0

        '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create mock sysctl configuration
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create mock hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
