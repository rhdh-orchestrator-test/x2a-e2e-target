---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Set vm.max_map_count kernel parameter
  community.general.sysctl:
    name: vm.max_map_count
    value: "{{ chef_automate_vm_max_map_count }}"
    state: present
    reload: true
  become: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  community.general.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ chef_automate_vm_dirty_expire_centisecs }}"
    state: present
    reload: true
  become: true
- name: Ensure unzip is installed
  ansible.builtin.package:
    name: unzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
    force: true
  register: download_result
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
  when: download_result.changed
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product automate --product infra-server --accept-terms-and-mlsa=true"
  become: true
  args:
    creates: /hab
  register: deploy_result
  changed_when: deploy_result.rc == 0
- name: Wait for Chef Server to be fully operational
  ansible.builtin.pause:
    seconds: 30
  when: deploy_result.changed
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_key_filename }}"
    - "{{ chef_org_validator_filename }}"
  when: chef_user_key_filename is defined and chef_org_validator_filename is defined
- name: Create Chef user
  ansible.builtin.command:
    cmd: "chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} {{ password }}  --filename {{ chef_user_key_filename }} "
  become: true
  args:
    creates: "{{ chef_user_key_filename }}"
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}"  --association_user {{ username }} --filename {{ chef_org_validator_filename }}

      '
  become: true
  args:
    creates: "{{ chef_org_validator_filename }}"
