---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    full_name: John Tonello
    email: jtonello@chef.lab
    password: password
    chef_automate_hostname: automate.chef.lab
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
    chef_org_name: lab
    chef_org_long_name: Chef Lab
    chef_user_key_filename: /tmp/molecule_test/jtonello.pem
    chef_org_validator_filename: /tmp/molecule_test/lab-validator.pem
    chef_automate_products:
      - automate
      - infra-server

  tasks:
    - name: Create directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/hab

    # Simulate hostname configuration
    - name: Create hosts file
      ansible.builtin.copy:
        content: |
          127.0.0.1 localhost
          127.0.1.1 automate.chef.lab automate
        dest: /tmp/molecule_test/etc/hosts
        mode: "0644"

    # Simulate kernel parameters
    - name: Create max_map_count file
      ansible.builtin.copy:
        content: "262144"
        dest: /tmp/molecule_test/proc/sys/vm/max_map_count
        mode: "0644"

    - name: Create dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "20000"
        dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI v1.0.0"
          echo "This is a mock CLI for molecule testing"
        dest: /tmp/molecule_test/chef-automate
        mode: "0755"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAwZ5UJULAjWr7p6FVwGRQRjFN2s8tZ/6LC3X82fajpVsYqF1x
          qEuUDndDXVD09E4u83MS6HO6a3bIVQDp6/klnYldiE6Vp8HH5BSKaCWKVg8lGWg1
          UM9wZFnlryi14KgmpIFmcu9nA8yV/6MZAe6RSDmb3iyNBmiZ8aZhGw2pI1YwR+15
          MVqFFGB+7ExkziROi7L8CFCyCezK2/oOOvQsH1dzQ8z1JXWdg8/9Zx7Ktvgwu5PQ
          M3cJtSHX6iBPOkMU8Z8TugLlTqQXKZOEgwajwvQ5mf2DPkVgM08XAgaR9zVOVnVF
          MOCK_KEY_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/jtonello.pem
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAwZ5UJULAjWr7p6FVwGRQRjFN2s8tZ/6LC3X82fajpVsYqF1x
          qEuUDndDXVD09E4u83MS6HO6a3bIVQDp6/klnYldiE6Vp8HH5BSKaCWKVg8lGWg1
          UM9wZFnlryi14KgmpIFmcu9nA8yV/6MZAe6RSDmb3iyNBmiZ8aZhGw2pI1YwR+15
          MVqFFGB+7ExkziROi7L8CFCyCezK2/oOOvQsH1dzQ8z1JXWdg8/9Zx7Ktvgwu5PQ
          M3cJtSHX6iBPOkMU8Z8TugLlTqQXKZOEgwajwvQ5mf2DPkVgM08XAgaR9zVOVnVF
          MOCK_ORG_KEY_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/lab-validator.pem
        mode: "0600"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-postgresql        Status: running (PID 12345)
          Service: automate-elasticsearch     Status: running (PID 12346)
          Service: automate-gateway           Status: running (PID 12347)
          Service: chef-server                Status: running (PID 12348)
        dest: /tmp/molecule_test/automate-status.txt
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          run: bookshelf: (pid 12349) 1s; run: log: (pid 12350) 1s
          run: nginx: (pid 12351) 1s; run: log: (pid 12352) 1s
          run: postgresql: (pid 12353) 1s; run: log: (pid 12354) 1s
        dest: /tmp/molecule_test/chef-server-status.txt
        mode: "0644"

    # Simulate user list output
    - name: Create user list file
      ansible.builtin.copy:
        content: |
          jtonello
          pivotal
        dest: /tmp/molecule_test/user-list.txt
        mode: "0644"

    # Simulate organization list output
    - name: Create organization list file
      ansible.builtin.copy:
        content: |
          lab
        dest: /tmp/molecule_test/org-list.txt
        mode: "0644"