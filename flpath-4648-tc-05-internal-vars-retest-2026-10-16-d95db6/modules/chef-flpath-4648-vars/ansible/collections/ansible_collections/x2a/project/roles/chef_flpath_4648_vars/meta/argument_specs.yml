---
# FLPATH-3351-TC-07-RULE
argument_specs:
  main:
    short_description: Configure service with a simple configuration file
    description:
      - Creates a configuration file at /etc/flpath-4648-vars.conf with specific permissions
      - Sets the service_name parameter in the configuration file
    options:
      chef_flpath_4648_vars_service_name:
        type: str
        required: false
        default: fixture-service
        description: Name of the service to configure
