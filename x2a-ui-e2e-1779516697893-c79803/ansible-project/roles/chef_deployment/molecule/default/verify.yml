---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    chef_org_name: lab
    chef_user_pem_filename: jtonello.pem
    chef_org_pem_filename: lab-validator.pem
  tasks:
    # Hostname verification
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_file.stat.exists

    # System parameters
    - name: Check sysctl settings file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-deployment.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl settings file not found"
        success_msg: "Sysctl settings file exists"

    - name: Get sysctl settings content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-deployment.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl settings are correct
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count = 262144' in (sysctl_content.content | b64decode)"
          - "'vm.dirty_expire_centisecs = 20000' in (sysctl_content.content | b64decode)"
        fail_msg: "Sysctl settings are not set correctly"
        success_msg: "Sysctl settings are set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Service status (can't be tested in container)
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: systemctl status chef-automate
      register: chef_automate_status
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check Chef Server service status
      ansible.builtin.command:
        cmd: systemctl status chef-server
      register: chef_server_status
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Server service is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Server service is not running"
        success_msg: "Chef Server service is running"
      tags: molecule-notest

    # Chef Server functionality
    - name: Check services.dat file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/sup/default/data/services.dat
      register: services_dat

    - name: Assert services.dat file exists
      ansible.builtin.assert:
        that:
          - services_dat.stat.exists
          - services_dat.stat.isreg
        fail_msg: "services.dat file not found"
        success_msg: "services.dat file exists"

    # Chef Server user and organization checks
    - name: Check user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server-user-list
      register: user_list_file

    - name: Assert user list file exists
      ansible.builtin.assert:
        that:
          - user_list_file.stat.exists
          - user_list_file.stat.isreg
        fail_msg: "User list file not found"
        success_msg: "User list file exists"

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-server-user-list
      register: user_list_content
      when: user_list_file.stat.exists

    - name: Assert user exists in user list
      ansible.builtin.assert:
        that:
          - username in (user_list_content.content | b64decode)
        fail_msg: "User not found in user list"
        success_msg: "User found in user list"
      when: user_list_file.stat.exists

    - name: Check org list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server-org-list
      register: org_list_file

    - name: Assert org list file exists
      ansible.builtin.assert:
        that:
          - org_list_file.stat.exists
          - org_list_file.stat.isreg
        fail_msg: "Organization list file not found"
        success_msg: "Organization list file exists"

    - name: Get org list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-server-org-list
      register: org_list_content
      when: org_list_file.stat.exists

    - name: Assert organization exists in org list
      ansible.builtin.assert:
        that:
          - chef_org_name in (org_list_content.content | b64decode)
        fail_msg: "Organization not found in org list"
        success_msg: "Organization found in org list"
      when: org_list_file.stat.exists

    # Check PEM files
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/home/ansible/{{ chef_user_pem_filename }}"
      register: user_pem_file

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem_file.stat.exists
          - user_pem_file.stat.isreg
          - user_pem_file.stat.size > 0
        fail_msg: "User PEM file not found or empty"
        success_msg: "User PEM file exists"

    - name: Check organization PEM file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/home/ansible/{{ chef_org_pem_filename }}"
      register: org_pem_file

    - name: Assert organization PEM file exists
      ansible.builtin.assert:
        that:
          - org_pem_file.stat.exists
          - org_pem_file.stat.isreg
          - org_pem_file.stat.size > 0
        fail_msg: "Organization PEM file not found or empty"
        success_msg: "Organization PEM file exists"

    # Network listening (can't be tested in container)
    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # Web UI access (can't be tested in container)
    - name: Check Chef Automate API health
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
      register: health_check
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate API is healthy
      ansible.builtin.assert:
        that:
          - health_check is succeeded
        fail_msg: "Chef Automate API health check failed"
        success_msg: "Chef Automate API is healthy"
      tags: molecule-notest

    # Chef Automate API check (can't be tested in container)
    - name: Check Chef Automate auth API
      ansible.builtin.uri:
        url: https://localhost/api/v0/auth/version
        validate_certs: false
      register: auth_check
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate auth API is accessible
      ansible.builtin.assert:
        that:
          - auth_check is succeeded
        fail_msg: "Chef Automate auth API check failed"
        success_msg: "Chef Automate auth API is accessible"
      tags: molecule-notest

    # Chef Infra Server API check (can't be tested in container)
    - name: Check Chef Infra Server organization API
      ansible.builtin.uri:
        url: "https://localhost/organizations/{{ chef_org_name }}"
        validate_certs: false
      register: org_check
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server organization API is accessible
      ansible.builtin.assert:
        that:
          - org_check is succeeded
        fail_msg: "Chef Infra Server organization API check failed"
        success_msg: "Chef Infra Server organization API is accessible"
      tags: molecule-notest