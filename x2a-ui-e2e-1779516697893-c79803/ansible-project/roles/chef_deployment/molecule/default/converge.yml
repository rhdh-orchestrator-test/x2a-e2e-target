---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    name: John Tonello
    email: jtonello@example.com
    password: secure_password
    chef_hostname: automate.chef.lab
    chef_org_name: lab
    chef_org_long_name: Chef Lab
    chef_user_pem_filename: jtonello.pem
    chef_org_pem_filename: lab-validator.pem
    chef_deployment_type: automate_and_server
  tasks:
    # Create directory structure that would be created by the role
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab/sup/default/data
        - /tmp/molecule_test/home/ansible

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI'"
        dest: /tmp/molecule_test/home/ansible/chef-automate
        mode: "0755"

    # Simulate services.dat file
    - name: Create services.dat file
      ansible.builtin.copy:
        content: |
          {
            "chef-server": "running",
            "automate": "running"
          }
        dest: /tmp/molecule_test/hab/sup/default/data/services.dat
        mode: "0644"

    # Simulate PEM files
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/ansible/{{ chef_user_pem_filename }}"
        mode: "0600"

    - name: Create organization PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/ansible/{{ chef_org_pem_filename }}"
        mode: "0600"

    # Simulate sysctl settings
    - name: Create sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-deployment.conf
        mode: "0644"

    # Simulate chef-server-ctl output files
    - name: Create user-list output file
      ansible.builtin.copy:
        content: "{{ username }}"
        dest: /tmp/molecule_test/etc/chef-server-user-list
        mode: "0644"

    - name: Create org-list output file
      ansible.builtin.copy:
        content: "{{ chef_org_name }}"
        dest: /tmp/molecule_test/etc/chef-server-org-list
        mode: "0644"

    - name: Create user-show output file
      ansible.builtin.copy:
        content: |
          username: {{ username }}
          name: {{ name }}
          email: {{ email }}
        dest: "/tmp/molecule_test/etc/chef-server-user-{{ username }}"
        mode: "0644"

    - name: Create org-show output file
      ansible.builtin.copy:
        content: |
          name: {{ chef_org_name }}
          full_name: {{ chef_org_long_name }}
        dest: "/tmp/molecule_test/etc/chef-server-org-{{ chef_org_name }}"
        mode: "0644"