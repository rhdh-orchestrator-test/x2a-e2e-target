---
- name: Check if Chef user exists
  ansible.builtin.command:
    cmd: chef-server-ctl user-list
  become: true
  register: user_list
  changed_when: false
  check_mode: false
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ name }} {{ email }} {{ password }} --filename {{ chef_user_pem_filename }}
  become: true
  register: create_user_result
  failed_when: create_user_result.rc != 0 and 'already exists' not in create_user_result.stderr
  changed_when: create_user_result.rc == 0
  no_log: true
  when: username not in user_list.stdout
- name: Check if Chef organization exists
  ansible.builtin.command:
    cmd: chef-server-ctl org-list
  become: true
  register: org_list
  changed_when: false
  check_mode: false
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}" --association_user {{ username }} --filename {{ chef_org_pem_filename }}
  become: true
  register: create_org_result
  failed_when: create_org_result.rc != 0 and 'already exists' not in create_org_result.stderr
  changed_when: create_org_result.rc == 0
  when: chef_org_name not in org_list.stdout
