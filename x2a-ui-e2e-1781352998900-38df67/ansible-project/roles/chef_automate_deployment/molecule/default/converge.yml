---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    password: password
    full_name: John Tonello
    email: jtonello@chef.lab
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/tmp

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl files
    - name: Create max_map_count file
      ansible.builtin.copy:
        content: "262144"
        dest: /tmp/molecule_test/proc/sys/vm/max_map_count
        mode: "0644"

    - name: Create dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "20000"
        dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create dummy Chef Automate CLI zip
      ansible.builtin.copy:
        content: "Mock Chef Automate CLI zip content"
        dest: /tmp/molecule_test/tmp/chef-automate_linux_amd64.zip
        mode: "0644"

    # Simulate Chef Automate CLI executable
    - name: Create dummy Chef Automate CLI executable
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Mock Chef Automate CLI'"
        dest: /tmp/molecule_test/tmp/chef-automate
        mode: "0755"

    # Simulate user and organization PEM files
    - name: Create user PEM file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMock user PEM content\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/{{ chef_automate_username }}.pem"
        mode: "0600"

    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMock organization validator PEM content\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/{{ chef_automate_orgname }}-validator.pem"
        mode: "0600"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          chef-automate status
          deployment-service running
          postgresql-service running
          elasticsearch-service running
          automate-ui running
          infra-server running
        dest: /tmp/molecule_test/chef-automate-status.txt
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          chef-server-ctl status
          run: postgresql-service: (pid 12345) 100s; run: log: (pid 12346) 100s
          run: nginx: (pid 12347) 100s; run: log: (pid 12348) 100s
          run: bookshelf: (pid 12349) 100s; run: log: (pid 12350) 100s
          run: oc_bifrost: (pid 12351) 100s; run: log: (pid 12352) 100s
          run: oc_id: (pid 12353) 100s; run: log: (pid 12354) 100s
          run: opscode-erchef: (pid 12355) 100s; run: log: (pid 12356) 100s
        dest: /tmp/molecule_test/chef-server-status.txt
        mode: "0644"

    # Simulate user list output
    - name: Create Chef Server user list file
      ansible.builtin.copy:
        content: "{{ chef_automate_username }}"
        dest: /tmp/molecule_test/chef-server-user-list.txt
        mode: "0644"

    # Simulate organization list output
    - name: Create Chef Server organization list file
      ansible.builtin.copy:
        content: "{{ chef_automate_orgname }}"
        dest: /tmp/molecule_test/chef-server-org-list.txt
        mode: "0644"

    # Simulate web UI response
    - name: Create mock web UI response
      ansible.builtin.copy:
        content: "<html><body>Chef Automate</body></html>"
        dest: /tmp/molecule_test/web-ui-response.html
        mode: "0644"

    # Simulate API response
    - name: Create mock API response
      ansible.builtin.copy:
        content: '{"status":"ok"}'
        dest: /tmp/molecule_test/api-response.json
        mode: "0644"

    # Simulate network listening output
    - name: Create mock network listening output
      ansible.builtin.copy:
        content: "tcp6       0      0 :::443                  :::*                    LISTEN      12345/nginx"
        dest: /tmp/molecule_test/network-listening.txt
        mode: "0644"

    # Simulate service status
    - name: Create mock service status
      ansible.builtin.copy:
        content: |
          ● chef-automate.service - Chef Automate
             Loaded: loaded (/etc/systemd/system/chef-automate.service; enabled; vendor preset: enabled)
             Active: active (running) since Mon 2023-01-01 00:00:00 UTC; 1h ago
        dest: /tmp/molecule_test/chef-automate-service-status.txt
        mode: "0644"