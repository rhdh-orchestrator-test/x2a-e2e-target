---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/usr/bin
        - /tmp/molecule_test/var/log

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname | default('automate.chef.lab') }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: "{{ item.key }} = {{ item.value }}"
        dest: "/tmp/molecule_test/etc/{{ item.key | replace('.', '_') }}.conf"
        mode: "0644"
      loop:
        - key: vm.max_map_count
          value: 262144
        - key: vm.dirty_expire_centisecs
          value: 20000

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: /tmp/molecule_test/usr/bin/chef-automate
        mode: "0755"

    # Simulate Chef Server CLI
    - name: Create Chef Server CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Server CLI mock'\n"
        dest: /tmp/molecule_test/usr/bin/chef-server-ctl
        mode: "0755"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: /tmp/molecule_test/jtonello.pem
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORG VALIDATOR KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: /tmp/molecule_test/lab-validator.pem
        mode: "0600"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-cs-bookshelf
            Status: running
          Service: automate-cs-oc-bifrost
            Status: running
          Service: automate-cs-oc-erchef
            Status: running
          Service: automate-cs-nginx
            Status: running
        dest: /tmp/molecule_test/var/log/chef-automate-status.log
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          run: bookshelf: (pid 12345) 1234s; run: log: (pid 12346) 1234s
          run: oc_bifrost: (pid 12347) 1234s; run: log: (pid 12348) 1234s
          run: oc_erchef: (pid 12349) 1234s; run: log: (pid 12350) 1234s
          run: nginx: (pid 12351) 1234s; run: log: (pid 12352) 1234s
        dest: /tmp/molecule_test/var/log/chef-server-status.log
        mode: "0644"

    # Simulate user list output
    - name: Create user list file
      ansible.builtin.copy:
        content: "jtonello\nadmin\n"
        dest: /tmp/molecule_test/var/log/chef-user-list.log
        mode: "0644"

    # Simulate organization list output
    - name: Create organization list file
      ansible.builtin.copy:
        content: "lab\nchef\n"
        dest: /tmp/molecule_test/var/log/chef-org-list.log
        mode: "0644"