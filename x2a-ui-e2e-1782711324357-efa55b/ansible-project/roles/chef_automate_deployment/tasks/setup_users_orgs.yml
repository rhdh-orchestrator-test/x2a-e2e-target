---
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_key_path }}"
    - "{{ chef_automate_org_key_path }}"
  when:
    - chef_automate_user_key_path is defined
    - chef_automate_org_key_path is defined
    - chef_automate_user_key_path | dirname != '.'
    - chef_automate_org_key_path | dirname != '.'
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ chef_automate_user_key_path }}
  become: true
  args:
    creates: "{{ chef_automate_user_key_path }}"
  register: create_user_result
  changed_when: create_user_result.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ org_name }} "{{ org_full_name }}" --association_user {{ username }} --filename {{ chef_automate_org_key_path }}
  become: true
  args:
    creates: "{{ chef_automate_org_key_path }}"
  register: create_org_result
  changed_when: create_org_result.rc == 0
