- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/home/ansible
    - /tmp/molecule_test/usr/bin
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl.d directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/sysctl.d
      state: directory
      mode: '0755'
  - name: Create sysctl parameter files
    ansible.builtin.copy:
      content: '# Managed by Ansible

        vm.max_map_count = {{ chef_automate_vm_max_map_count }}

        vm.dirty_expire_centisecs = {{ chef_automate_vm_dirty_expire_centisecs }}

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/sh echo ''Chef Automate CLI Mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_USER_KEY_CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/home/ansible/{{ chef_automate_userfilename }}
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_ORG_VALIDATOR_KEY_CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/home/ansible/{{ chef_automate_orgfilename }}
      mode: '0600'
  - name: Create hab directory structure
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/hab/sup
    - /tmp/molecule_test/hab/pkgs/chef
    - /tmp/molecule_test/hab/pkgs/core
  - name: Create chef-server-ctl mock
    ansible.builtin.copy:
      content: '#!/bin/sh echo ''Chef Server CTL Mock'' '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_username: jtonello
    chef_automate_orgname: lab
    chef_automate_userfilename: jtonello.pem
    chef_automate_orgfilename: lab-validator.pem
