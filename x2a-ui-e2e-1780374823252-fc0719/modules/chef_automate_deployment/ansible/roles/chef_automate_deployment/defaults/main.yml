---
chef_automate_hostname: automate.chef.lab
chef_automate_vm_max_map_count: 262144
chef_automate_vm_dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: ./chef-automate
chef_automate_products:
  - automate
  - infra-server
chef_automate_accept_terms: true
chef_automate_username: "{{ username | default('admin') }}"
chef_automate_full_name: "{{ full_name | default('Administrator') }}"
chef_automate_email: "{{ email | default('admin@example.com') }}"
chef_automate_password: "{{ password | default('changeme') }}"
chef_automate_org_short_name: "{{ org_short_name | default('default') }}"
chef_automate_org_full_name: "{{ org_full_name | default('Default Organization') }}"
chef_automate_user_key_path: ./{{ chef_automate_username }}.pem
chef_automate_org_key_path: ./{{ chef_automate_org_short_name }}-validator.pem
