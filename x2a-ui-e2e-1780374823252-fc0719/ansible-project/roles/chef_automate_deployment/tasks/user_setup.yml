---
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_username }} {{ chef_automate_full_name }} {{ chef_automate_email }} "{{ chef_automate_password }}"
      --filename {{ chef_automate_user_key_path }}
  args:
    creates: "{{ chef_automate_user_key_path }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  no_log: true
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org_short_name }} "{{ chef_automate_org_full_name }}" --association_user {{ chef_automate_username }}
      --filename {{ chef_automate_org_key_path }}
  args:
    creates: "{{ chef_automate_org_key_path }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
  become: true
