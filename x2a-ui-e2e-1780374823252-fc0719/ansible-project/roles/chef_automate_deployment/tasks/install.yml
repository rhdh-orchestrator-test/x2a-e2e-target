---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - unzip
      - curl
    state: present
  become: true
- name: Download and extract Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
  register: chef_automate_cli_download
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: ./chef-automate deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{
      chef_automate_accept_terms | lower }}
  args:
    chdir: "{{ ansible_env.HOME }}"
    creates: /hab
  register: chef_automate_deploy
  changed_when: chef_automate_deploy.rc == 0
  become: true
  when: chef_automate_cli_download is succeeded
