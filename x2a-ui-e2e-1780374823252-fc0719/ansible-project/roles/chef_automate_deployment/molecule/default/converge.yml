---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/ansible

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate kernel parameters
    - name: Create kernel parameter files
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "/tmp/molecule_test/proc/sys/vm/{{ item.name | regex_replace('^vm\\.', '') }}"
        mode: "0644"
      loop:
        - name: vm.max_map_count
          value: "{{ chef_automate_vm_max_map_count }}"
        - name: vm.dirty_expire_centisecs
          value: "{{ chef_automate_vm_dirty_expire_centisecs }}"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          echo "Chef Automate CLI v1.0.0"
          echo "This is a simulated Chef Automate CLI for molecule testing"
        dest: /tmp/molecule_test/home/ansible/chef-automate
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.file:
        path: /tmp/molecule_test/hab
        state: directory
        mode: "0755"

    # Simulate user and organization key files
    - name: Create user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAx4UbaDzY5xjW6hc9jwN0mX33XpTDVW9WqHp5AKaRbtAC3DqX
          IXFMPgw3K45jxRb93f8tv9vL3rD9CUG1Gv4FM+o7ds7FRES5RTjv2RT/JVNJCoqF
          ol8+ngLqRZCyBtQN7zYByWMRirPGoDUqdPYrj2yq+ObBBNhg5N+hOwKjjpzdj2Ud
          1l7R+wxIqmJo1IYyy16xS8WsjyQuyC0lL456qkd5BDZ0Ag8j2X9H9D5220Ln7s9i
          oezTipXipS7p7Jekf3Ywx6abJwOmB0rX79dV4qiNcGgzATnG1PkXxqt76VhcGa0W
          DDVHEEYGbSQ6hIGSh0I7BQun0aLRZojfE3gqHQIDAQAB
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/ansible/{{ chef_automate_username }}.pem"
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAx4UbaDzY5xjW6hc9jwN0mX33XpTDVW9WqHp5AKaRbtAC3DqX
          IXFMPgw3K45jxRb93f8tv9vL3rD9CUG1Gv4FM+o7ds7FRES5RTjv2RT/JVNJCoqF
          ol8+ngLqRZCyBtQN7zYByWMRirPGoDUqdPYrj2yq+ObBBNhg5N+hOwKjjpzdj2Ud
          1l7R+wxIqmJo1IYyy16xS8WsjyQuyC0lL456qkd5BDZ0Ag8j2X9H9D5220Ln7s9i
          oezTipXipS7p7Jekf3Ywx6abJwOmB0rX79dV4qiNcGgzATnG1PkXxqt76VhcGa0W
          DDVHEEYGbSQ6hIGSh0I7BQun0aLRZojfE3gqHQIDAQAB
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/ansible/{{ chef_automate_org_short_name }}-validator.pem"
        mode: "0600"

    # Simulate Chef server status files
    - name: Create Chef server status files
      ansible.builtin.copy:
        content: |
          {
            "status": "running",
            "services": {
              "automate-postgresql": "running",
              "automate-elasticsearch": "running",
              "automate-ui": "running",
              "automate-cs-bookshelf": "running",
              "automate-cs-oc-bifrost": "running",
              "automate-cs-oc-erchef": "running",
              "automate-cs-nginx": "running"
            }
          }
        dest: "/tmp/molecule_test/hab/chef-automate-status.json"
        mode: "0644"

    # Simulate Chef server binaries
    - name: Create Chef server binaries
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          echo "Chef Server Control utility"
          echo "All services are running"
        dest: "/tmp/molecule_test/hab/chef-server-ctl"
        mode: "0755"

    - name: Create Chef Automate status binary
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          echo "Chef Automate status utility"
          echo "All services are running"
        dest: "/tmp/molecule_test/hab/chef-automate"
        mode: "0755"

  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_username: jtonello
    chef_automate_org_short_name: lab