---
# Unsupported pre-flight checks: journal log review and diagnostic output from `cat`,
# `ufw status verbose` without a stated condition, and private-key `stat` output.
- name: Verify nginx-multisite pre-flight checks
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are present
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        loop:
          - fail2ban
          - ufw
          - nginx
          - openssl
          - ca-certificates
        loop_control:
          loop_var: item_package
        fail_msg: "Required package is not installed"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert required services are enabled and running
      ansible.builtin.assert:
        that:
          - item_service in ansible_facts['services']
          - ansible_facts['services'][item_service]['state'] == 'running'
          - ansible_facts['services'][item_service]['status'] == 'enabled'
        loop:
          - fail2ban.service
          - nginx.service
        loop_control:
          loop_var: item_service
        fail_msg: "Required service is not enabled and running"

    - name: Verify Fail2ban status command
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
      register: fail2ban_status
      changed_when: false

    - name: Assert Fail2ban status succeeds
      ansible.builtin.assert:
        that:
          - fail2ban_status.rc == 0
        fail_msg: "Fail2ban status check failed"

    - name: Check required configuration files
      ansible.builtin.stat:
        path: "{{ item_file['path'] }}"
      loop:
        - path: /etc/fail2ban/jail.local
        - path: /etc/sysctl.d/99-security.conf
        - path: /etc/nginx/nginx.conf
        - path: /etc/nginx/conf.d/security.conf
        - path: /etc/ssh/sshd_config
        - path: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-available/status.cluster.local
        - path: /opt/server/test/index.html
        - path: /opt/server/ci/index.html
        - path: /opt/server/status/index.html
        - path: /etc/ssl/certs/test.cluster.local.crt
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/certs/ci.cluster.local.crt
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/certs/status.cluster.local.crt
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_file
      register: required_files

    - name: Assert required files exist
      ansible.builtin.assert:
        that:
          - item_file_result.stat.exists
        loop: "{{ required_files['results'] }}"
        loop_control:
          loop_var: item_file_result
        fail_msg: "A required pre-flight file is missing"

    - name: Check document roots
      ansible.builtin.stat:
        path: "{{ item_root['path'] }}"
      loop:
        - path: /opt/server/test
        - path: /opt/server/ci
        - path: /opt/server/status
      loop_control:
        loop_var: item_root
      register: document_roots

    - name: Assert document roots are directories
      ansible.builtin.assert:
        that:
          - item_root_result.stat.exists
          - item_root_result.stat.isdir
        loop: "{{ document_roots['results'] }}"
        loop_control:
          loop_var: item_root_result
        fail_msg: "A required document root is missing"

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_link['path'] }}"
        follow: false
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_link
      register: enabled_site_links

    - name: Assert enabled site links exist
      ansible.builtin.assert:
        that:
          - item_link_result.stat.exists
          - item_link_result.stat.islnk
        loop: "{{ enabled_site_links['results'] }}"
        loop_control:
          loop_var: item_link_result
        fail_msg: "A required Nginx site link is missing"

    - name: Verify default Nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert default Nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site.stat.exists
        fail_msg: "The default Nginx site is present"

    - name: Verify UFW default policy and allowed services
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: ufw_status
      changed_when: false

    - name: Assert UFW denies by default and allows SSH HTTP and HTTPS
      ansible.builtin.assert:
        that:
          - ufw_status.rc == 0
          - "'Default: deny' in ufw_status.stdout"
          - ufw_status.stdout is search('22|ssh')
          - ufw_status.stdout is search('80|http')
          - ufw_status.stdout is search('443|https')
        fail_msg: "UFW policy or required allowed service is missing"

    - name: Verify SSH hardening and configuration syntax
      ansible.builtin.command:
        argv: "{{ item_ssh_check['argv'] }}"
      loop:
        - argv: [grep, -E, '^[[:space:]]*PermitRootLogin[[:space:]]+no', /etc/ssh/sshd_config]
        - argv: [grep, -E, '^[[:space:]]*PasswordAuthentication[[:space:]]+no', /etc/ssh/sshd_config]
        - argv: [sshd, -t]
      loop_control:
        loop_var: item_ssh_check
      register: ssh_checks
      changed_when: false

    - name: Assert SSH hardening checks succeed
      ansible.builtin.assert:
        that:
          - item_ssh_result.rc == 0
        loop: "{{ ssh_checks['results'] }}"
        loop_control:
          loop_var: item_ssh_result
        fail_msg: "An SSH hardening check failed"

    - name: Verify kernel security configuration syntax
      ansible.builtin.command:
        argv:
          - sysctl
          - -p
          - /etc/sysctl.d/99-security.conf
      register: sysctl_check
      changed_when: false

    - name: Assert kernel security configuration loads
      ansible.builtin.assert:
        that:
          - sysctl_check.rc == 0
        fail_msg: "Kernel security configuration failed to load"

    - name: Verify Nginx configuration syntax
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_check
      changed_when: false

    - name: Assert Nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_check.rc == 0
        fail_msg: "Nginx configuration test failed"

    - name: Verify HTTP and HTTPS listeners
      ansible.builtin.wait_for:
        port: "{{ item_listener['port'] }}"
        host: 127.0.0.1
        state: started
        timeout: 5
      loop:
        - port: 80
        - port: 443
        - port: 22
      loop_control:
        loop_var: item_listener

    - name: Verify HTTP virtual host responses
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_http_site['host'] }}"
        method: HEAD
        status_code: 200
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_http_site

    - name: Verify HTTPS virtual host responses
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_https_site['host'] }}"
        method: HEAD
        validate_certs: false
        status_code: 200
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_https_site
