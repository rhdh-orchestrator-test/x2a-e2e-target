---
# Unsupported pre-flight checks: password-authenticated PostgreSQL connectivity and
# DATABASE_URL contents are omitted to avoid embedding or exposing the credential;
# PostgreSQL privilege details, service-unit contents, and diagnostic command output
# without a stated expected value are also not asserted.
- name: Verify FastAPI tutorial deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are present
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        fail_msg: "A required package is not installed"
      loop:
        - python3
        - python3-pip
        - python3-venv
        - git
        - postgresql
        - postgresql-contrib
        - libpq-dev
      loop_control:
        loop_var: item_package
      when: ansible_facts['pkg_mgr'] == 'apt' or item_package != 'libpq-dev'

    - name: Verify the application directory
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: fastapi_app_directory

    - name: Assert the application directory exists
      ansible.builtin.assert:
        that:
          - fastapi_app_directory.stat.exists
          - fastapi_app_directory.stat.isdir

    - name: Verify the virtual environment directory
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/venv
      register: fastapi_venv_directory

    - name: Assert the virtual environment directory exists
      ansible.builtin.assert:
        that:
          - fastapi_venv_directory.stat.exists
          - fastapi_venv_directory.stat.isdir

    - name: Verify the requirements file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/requirements.txt
      register: fastapi_requirements

    - name: Assert the requirements file exists
      ansible.builtin.assert:
        that:
          - fastapi_requirements.stat.exists
          - fastapi_requirements.stat.isreg

    - name: Verify application executables
      ansible.builtin.stat:
        path: "{{ item_executable }}"
      loop:
        - /opt/fastapi-tutorial/venv/bin/python
        - /opt/fastapi-tutorial/venv/bin/pip
        - /opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_executable
      register: fastapi_executables

    - name: Assert application executables are present and executable
      ansible.builtin.assert:
        that:
          - item_executable_result.stat.exists
          - item_executable_result.stat.executable
        fail_msg: "An application executable is missing or not executable"
      loop: "{{ fastapi_executables.results }}"
      loop_control:
        loop_var: item_executable_result

    - name: Verify PostgreSQL service state
      ansible.builtin.service_facts:

    - name: Assert PostgreSQL is active and enabled
      ansible.builtin.assert:
        that:
          - "'postgresql.service' in ansible_facts['services']"
          - ansible_facts['services']['postgresql.service']['state'] == 'running'
          - ansible_facts['services']['postgresql.service']['status'] == 'enabled'

    - name: Verify the PostgreSQL role exists
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT rolname FROM pg_roles WHERE rolname = 'fastapi';
      changed_when: false
      register: fastapi_postgres_role

    - name: Assert the fastapi PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - fastapi_postgres_role.stdout | trim == 'fastapi'

    - name: Verify the PostgreSQL database exists and has the expected owner
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT datname || ':' || pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'fastapi_db';
      changed_when: false
      register: fastapi_postgres_database

    - name: Assert the fastapi_db database is owned by fastapi
      ansible.builtin.assert:
        that:
          - fastapi_postgres_database.stdout | trim == 'fastapi_db:fastapi'

    - name: Verify the application environment file
      ansible.builtin.slurp:
        src: /opt/fastapi-tutorial/.env
      register: fastapi_environment

    - name: Assert non-secret environment values
      ansible.builtin.assert:
        that:
          - "'PROJECT_NAME=\"FastAPI Tutorial\"' in (fastapi_environment.content | b64decode)"
          - "'API_VERSION=1.0.0' in (fastapi_environment.content | b64decode)"

    - name: Verify environment file ownership and mode
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/.env
      register: fastapi_environment_stat

    - name: Assert environment file ownership and mode
      ansible.builtin.assert:
        that:
          - fastapi_environment_stat.stat.pw_name == 'root'
          - fastapi_environment_stat.stat.gr_name == 'root'
          - fastapi_environment_stat.stat.mode == '0644'

    - name: Verify FastAPI service state
      ansible.builtin.assert:
        that:
          - "'fastapi-tutorial.service' in ansible_facts['services']"
          - ansible_facts['services']['fastapi-tutorial.service']['state'] == 'running'
          - ansible_facts['services']['fastapi-tutorial.service']['status'] == 'enabled'

    - name: Verify FastAPI listens on TCP port 8000
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8000
        state: started
        timeout: 10

    - name: Verify PostgreSQL listens on TCP port 5432
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5432
        state: started
        timeout: 10

    - name: Verify the FastAPI endpoint returns an HTTP response
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/
        return_content: false
      register: fastapi_http_response

    - name: Assert the FastAPI endpoint returned an HTTP response
      ansible.builtin.assert:
        that:
          - fastapi_http_response.status is defined
          - fastapi_http_response.status >= 100
          - fastapi_http_response.status <= 599

    - name: Check for failed systemd units
      ansible.builtin.command:
        argv:
          - systemctl
          - --failed
          - --no-legend
      changed_when: false
      register: fastapi_failed_units

    - name: Assert no systemd units are failed
      ansible.builtin.assert:
        that:
          - fastapi_failed_units.stdout | trim == ''
