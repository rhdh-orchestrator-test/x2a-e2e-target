---
# Unsupported pre-flight checks: authenticated Redis PING/INFO require a supplied
# vaulted variable name; netstat duplicate diagnostic; journalctl log review; and
# the conditional Memcached checks require configuration not supplied by the plan.
- name: Verify cache deployment
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify redis-server is enabled and active
      ansible.builtin.service_facts:

    - name: Assert redis-server is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts['services'].get('redis-server.service', {}).get('status') == 'enabled'"
          - "ansible_facts['services'].get('redis-server.service', {}).get('state') == 'running'"
        fail_msg: redis-server must be enabled and active.

    - name: Verify Redis TCP port 6379 is listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 10

    - name: Verify a Redis server process exists
      ansible.builtin.command:
        argv:
          - ps
          - aux
      register: item_redis_processes
      changed_when: false

    - name: Assert a Redis server process exists
      ansible.builtin.assert:
        that:
          - item_redis_processes.stdout is search('[r]edis-server')
        fail_msg: A redis-server process must be running.

    - name: Verify Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: item_redis_config

    - name: Assert Redis configuration file exists
      ansible.builtin.assert:
        that:
          - item_redis_config.stat.exists
          - item_redis_config.stat.isreg
        fail_msg: /etc/redis/6379.conf must exist as a regular file.

    - name: Read Redis configuration
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: item_redis_config_content

    - name: Assert Redis port and authentication directives are configured
      ansible.builtin.assert:
        that:
          - "(item_redis_config_content.content | b64decode) is search('(?m)^port\\s+6379\\s*$')"
          - "(item_redis_config_content.content | b64decode) is search('(?m)^requirepass\\s+\\S+')"
        fail_msg: Redis configuration must define port 6379 and requirepass.

    - name: Assert removed Redis directives are absent
      ansible.builtin.assert:
        that:
          - >-
            (item_redis_config_content.content | b64decode) is not search(
            '(?m)^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)')
        fail_msg: Removed Redis replication directives must be absent.

    - name: Verify unauthenticated Redis access is rejected
      ansible.builtin.command:
        argv:
          - redis-cli
          - -h
          - 127.0.0.1
          - -p
          - '6379'
          - PING
      register: item_redis_unauthenticated
      changed_when: false
      failed_when: false

    - name: Assert unauthenticated Redis access requires authentication
      ansible.builtin.assert:
        that:
          - item_redis_unauthenticated.rc != 0
          - >-
            (item_redis_unauthenticated.stdout ~ item_redis_unauthenticated.stderr)
            is search('(?i)(noauth|authentication required)')
        fail_msg: Unauthenticated Redis access must be rejected as requiring authentication.

    - name: Verify Redis log directory metadata
      ansible.builtin.stat:
        path: /var/log/redis
      register: item_redis_log_directory

    - name: Assert Redis log directory ownership and mode
      ansible.builtin.assert:
        that:
          - item_redis_log_directory.stat.exists
          - item_redis_log_directory.stat.isdir
          - item_redis_log_directory.stat.pw_name == 'redis'
          - item_redis_log_directory.stat.gr_name == 'redis'
          - item_redis_log_directory.stat.mode == '0755'
        fail_msg: /var/log/redis must be a redis-owned directory with mode 0755.
