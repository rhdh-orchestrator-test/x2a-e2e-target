---
argument_specs:
  main:
    short_description: Install and configure Redis cache services.
    description:
      - Creates the Redis log directory and delegates Redis installation and configuration to the approved eloy.redis collection.
      - Removes obsolete replication directives from the generated Redis configuration.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks handling the injected Redis password.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
