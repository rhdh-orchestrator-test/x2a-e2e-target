---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install and configure Redis  # noqa: L038 - Redis role is provided by the declared eloy.redis collection and cannot be resolved locally
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: 6379
    redis_requirepass: "{{ redis_password }}"
    redis_replication_enabled: false
    redis_cluster_enabled: false
    redis_sentinel_enabled: false

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Remove obsolete replication directives
  ansible.builtin.replace:
    path: /etc/redis/6379.conf
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$
    replace: ""
    backup: true
  notify: Restart Redis
