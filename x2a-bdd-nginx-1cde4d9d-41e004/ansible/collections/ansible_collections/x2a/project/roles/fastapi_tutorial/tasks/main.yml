---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI tutorial system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create FastAPI tutorial application user  # noqa: L044 - user module manages the account without an explicit state parameter
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_app_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  when: fastapi_tutorial_app_user != 'root'

- name: Create FastAPI tutorial application directory
  ansible.builtin.file:  # noqa: R114 - path comes from role defaults
    path: "{{ fastapi_tutorial_app_path }}"
    state: directory
    owner: "{{ fastapi_tutorial_app_user }}"
    group: "{{ fastapi_tutorial_app_user }}"
    mode: "0755"

- name: Synchronize FastAPI tutorial repository  # noqa: R104 - repository URL is HTTPS and comes from trusted role defaults
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"  # noqa: R106 - repository source comes from trusted role defaults
    dest: "{{ fastapi_tutorial_app_path }}"
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - command paths come from trusted role defaults
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_path }}"
    creates: "{{ fastapi_tutorial_venv_path }}/bin/python"

- name: Install FastAPI tutorial Python dependencies  # noqa: R113 - dependency paths come from trusted role defaults
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_venv_path }}"
    chdir: "{{ fastapi_tutorial_app_path }}"

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create FastAPI PostgreSQL role  # noqa: L039 - credential variables are asserted by the preceding validation task
  ansible.builtin.shell:  # noqa: R101 - database values are validated role inputs
    cmd: |
      if psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ database_username }}'" | grep -q 1; then
        echo FASTAPI_TUTORIAL_ROLE_EXISTS
      else
        psql -c "CREATE USER {{ database_username }} WITH PASSWORD '{{ database_password }}';"
        echo FASTAPI_TUTORIAL_ROLE_CREATED
      fi
  register: fastapi_tutorial_role
  changed_when: "'FASTAPI_TUTORIAL_ROLE_CREATED' in fastapi_tutorial_role.stdout"
  become: true  # noqa: R108 - PostgreSQL role creation requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create FastAPI PostgreSQL database  # noqa: L039 - credential variables are asserted by the preceding validation task
  ansible.builtin.shell:  # noqa: R101 - database values are validated role inputs
    cmd: |
      if psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'" | grep -q 1; then
        echo FASTAPI_TUTORIAL_DATABASE_EXISTS
      else
        createdb -O {{ database_username }} {{ database_name }}
        echo FASTAPI_TUTORIAL_DATABASE_CREATED
      fi
  register: fastapi_tutorial_database
  changed_when: "'FASTAPI_TUTORIAL_DATABASE_CREATED' in fastapi_tutorial_database.stdout"
  become: true  # noqa: R108 - database creation requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant FastAPI database privileges  # noqa: L039 - credential variables are asserted by the preceding validation task
  ansible.builtin.shell:  # noqa: R101 - database values are validated role inputs
    cmd: |
      if psql -tAc "SELECT has_database_privilege('{{ database_username }}', '{{ database_name }}', 'ALL')" | grep -q t; then
        echo FASTAPI_TUTORIAL_PRIVILEGES_PRESENT
      else
        psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ database_username }};"
        echo FASTAPI_TUTORIAL_PRIVILEGES_GRANTED
      fi
  register: fastapi_tutorial_privileges
  changed_when: "'FASTAPI_TUTORIAL_PRIVILEGES_GRANTED' in fastapi_tutorial_privileges.stdout"
  become: true  # noqa: R108 - granting database privileges requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI tutorial environment configuration  # noqa: L039 - credential variables are asserted by the preceding validation task
  ansible.builtin.copy:  # noqa: R114 - destination path comes from role defaults
    dest: "{{ fastapi_tutorial_app_path }}/.env"
    content: |
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL=postgresql://{{ database_username }}:{{ database_password }}@{{ database_host }}:{{ database_port }}/{{ database_name }}
    owner: "{{ fastapi_tutorial_app_user }}"
    group: "{{ fastapi_tutorial_app_user }}"
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI tutorial systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User={{ fastapi_tutorial_app_user }}
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_venv_path }}/bin"
      ExecStart={{ fastapi_tutorial_venv_path }}/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: fastapi_tutorial_unit

- name: Reload systemd after FastAPI unit changes  # noqa: L039 - variable is registered by the preceding unit-copy task
  ansible.builtin.systemd:
    daemon_reload: true
  when: fastapi_tutorial_unit is changed

- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
