---
controller_credential_types:
  - name: PostgreSQL Application Database
    description: Credentials for the FastAPI application's PostgreSQL role and database connection.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL role; used for database authentication.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server. The source configuration uses localhost.
        - id: database_port
          type: string
          label: Database Port
          help_text: TCP port for PostgreSQL. The source configuration uses the default port 5432.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
      required:
        - database_username
        - database_password
        - database_host
        - database_name
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_host: !unsafe "{{ database_host }}"
        database_port: !unsafe "{{ database_port }}"
        database_name: !unsafe "{{ database_name }}"
