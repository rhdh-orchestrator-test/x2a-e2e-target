---
argument_specs:
  main:
    short_description: Deploy and configure the FastAPI tutorial application.
    description:
      - Installs the FastAPI tutorial application and its Python dependencies.
      - Configures PostgreSQL credentials, database access, and a systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application installation directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI tutorial application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment path.
      fastapi_tutorial_app_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by the FastAPI service.
      fastapi_tutorial_app_user:
        type: str
        required: false
        default: root
        description: Operating system user running the FastAPI service.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the database password.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name written to the application environment file.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version written to the application environment file.
      database_username:
        type: str
        required: true
        description: PostgreSQL username injected by an AAP credential type.
      database_password:
        type: str
        required: true
        description: PostgreSQL password injected by an AAP credential type.
      database_host:
        type: str
        required: true
        description: PostgreSQL host injected by an AAP credential type.
      database_port:
        type: str
        required: true
        description: PostgreSQL port injected by an AAP credential type.
      database_name:
        type: str
        required: true
        description: PostgreSQL database name injected by an AAP credential type.
