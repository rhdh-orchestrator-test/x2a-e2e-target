---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create SSL certificate group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create SSL certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}" # noqa: R114 - path from role default
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create SSL private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}" # noqa: R114 - path from role default
    owner: root
    group: ssl-cert
    mode: "0710"
    state: directory

- name: Check existing SSL certificates
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl['key'] }}.crt"
  register: nginx_multisite_ssl_certificates
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl

- name: Check existing SSL private keys
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl['key'] }}.key"
  register: nginx_multisite_ssl_keys
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl

- name: Generate self-signed certificates  # noqa: L039 - certificate and key results are registered by prior tasks
  ansible.builtin.command:  # noqa: R101 - command arguments use role-defined SSL paths and site names
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl['key'] }}.key"
      - -out
      - "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl['key'] }}.crt"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl['key'] }}/emailAddress=admin@example.com
  when:
    - item_ssl['value']['ssl_enabled']
    - not (nginx_multisite_ssl_certificates.results[item_ssl_index].stat.exists and nginx_multisite_ssl_keys.results[item_ssl_index].stat.exists)
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl
    index_var: item_ssl_index
  notify: Reload nginx
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Set private key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl['key'] }}.key" # noqa: R114 - path from role-defined site names
    owner: root
    group: ssl-cert
    mode: "0640"
    state: file
  when: item_ssl['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl
