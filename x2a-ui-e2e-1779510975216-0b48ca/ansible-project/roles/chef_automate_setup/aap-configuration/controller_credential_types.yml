---
controller_credential_types:
- name: Chef Admin User Credentials
  description: Credential type for Chef Admin User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Admin Username
      help_text: Username for the Chef Infra Server admin account
    - id: password
      type: string
      label: Admin Password
      secret: true
      help_text: Password for the Chef Infra Server admin account
    - id: email
      type: string
      label: Admin Email
      help_text: Email address for the Chef Infra Server admin account
    required:
    - username
    - password
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
- name: Chef User PEM
  description: Credential type for Chef User PEM
  kind: cloud
  inputs:
    fields:
    - id: user_key
      type: string
      label: User PEM Key
      secret: true
      help_text: PEM file content for Chef user authentication
    - id: user_key_path
      type: string
      label: User PEM Key Path
      help_text: Path where the user PEM key file should be stored
    required:
    - user_key
  injectors:
    extra_vars:
      user_key: !unsafe '{{ user_key }}'
      user_key_path: !unsafe '{{ user_key_path }}'
- name: Chef Organization Validator PEM
  description: Credential type for Chef Organization Validator PEM
  kind: cloud
  inputs:
    fields:
    - id: org_validator_key
      type: string
      label: Organization Validator PEM Key
      secret: true
      help_text: PEM file content for Chef organization validation
    - id: org_validator_path
      type: string
      label: Organization Validator PEM Path
      help_text: Path where the organization validator PEM key file should be stored
    - id: org_name
      type: string
      label: Organization Name
      help_text: Name of the Chef organization
    required:
    - org_validator_key
    - org_name
  injectors:
    extra_vars:
      org_validator_key: !unsafe '{{ org_validator_key }}'
      org_validator_path: !unsafe '{{ org_validator_path }}'
      org_name: !unsafe '{{ org_name }}'
