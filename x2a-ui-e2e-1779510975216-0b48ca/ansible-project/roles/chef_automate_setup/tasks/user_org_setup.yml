---
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_automate_username }}  {{ chef_automate_longusername }}  {{ chef_automate_useremail }}  "{{ chef_automate_userpassword
      }}"  --filename {{ chef_automate_userfilename | expanduser }}

      '
  args:
    creates: "{{ chef_automate_userfilename | expanduser }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_automate_orgname }}  "{{ chef_automate_longorgname }}"  --association_user {{ chef_automate_username }}  --filename
      {{ chef_automate_orgfilename | expanduser }}

      '
  args:
    creates: "{{ chef_automate_orgfilename | expanduser }}"
  become: true
- name: Set proper permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_automate_userfilename | expanduser }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0600"
  become: true
- name: Set proper permissions on organization validator key file
  ansible.builtin.file:
    path: "{{ chef_automate_orgfilename | expanduser }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0600"
  become: true
