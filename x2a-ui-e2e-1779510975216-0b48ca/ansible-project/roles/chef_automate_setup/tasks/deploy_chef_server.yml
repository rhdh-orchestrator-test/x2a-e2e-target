---
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "./chef-automate deploy  --product infra-server  --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }} "
  args:
    chdir: "{{ chef_automate_cli_path | dirname | expanduser }}"
    creates: /etc/chef-automate/config.toml
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
- name: Wait for Chef Infra Server services to be fully operational
  ansible.builtin.pause:
    seconds: 30
  when: chef_server_deploy.changed
- name: Check Chef Infra Server status
  ansible.builtin.command:
    cmd: chef-server-ctl status
  become: true
  register: chef_server_status
  changed_when: false
  failed_when: chef_server_status.rc != 0
- name: Display Chef Infra Server status
  ansible.builtin.debug:
    var: chef_server_status.stdout_lines
  when: chef_server_status is defined
