---
chef_automate_hostname: automate.chef.lab
chef_automate_vm_max_map_count: 262144
chef_automate_vm_dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: ~/chef-automate
chef_automate_accept_terms_and_mlsa: true
chef_automate_deployment_type: automate_and_server
chef_automate_username: "{{ username | default('admin') }}"
chef_automate_longusername: "{{ longusername | default('Administrator') }}"
chef_automate_useremail: "{{ email | default('admin@example.com') }}"
chef_automate_userpassword: "{{ password | default('password') }}"
chef_automate_orgname: "{{ org_name | default('organization') }}"
chef_automate_longorgname: Chef Organization
chef_automate_userfilename: "{{ user_key_path | default('~/') }}{{ username | default('admin') }}.pem"
chef_automate_orgfilename: "{{ org_validator_path | default('~/') }}{{ org_name | default('organization') }}-validator.pem"
