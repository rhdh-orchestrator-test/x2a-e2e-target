---
- name: Install Apache web server
  ansible.builtin.package:
    name: apache2
    state: present
  become: true
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: "{{ apache_ssl_conf_path }}"
    regexp: ^SSLProtocol.*$
    replace: "{{ ssl_protocol_setting }}"
    backup: true
  become: true
  notify:
    - Restart apache2
    - Restart sshd
