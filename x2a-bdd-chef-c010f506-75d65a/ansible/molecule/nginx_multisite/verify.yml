# Unsupported pre-flight checks: package listings, generic service/log output, nginx -t/-T,
# listener discovery, UFW/Fail2ban status, SSH/sysctl diagnostics, and unspecified
# configuration/template/resource checks have no stated expected outcome here. The
# certificate key stat and site-link checks are covered below.
---
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: false
  vars:
    nginx_multisite_sites:
      - name: test.cluster.local
        document_root: /opt/server/test
        certificate: /etc/ssl/certs/test.cluster.local.crt
        private_key: /etc/ssl/private/test.cluster.local.key
        site_available: /etc/nginx/sites-available/test.cluster.local
        site_enabled: /etc/nginx/sites-enabled/test.cluster.local
      - name: ci.cluster.local
        document_root: /opt/server/ci
        certificate: /etc/ssl/certs/ci.cluster.local.crt
        private_key: /etc/ssl/private/ci.cluster.local.key
        site_available: /etc/nginx/sites-available/ci.cluster.local
        site_enabled: /etc/nginx/sites-enabled/ci.cluster.local
      - name: status.cluster.local
        document_root: /opt/server/status
        certificate: /etc/ssl/certs/status.cluster.local.crt
        private_key: /etc/ssl/private/status.cluster.local.key
        site_available: /etc/nginx/sites-available/status.cluster.local
        site_enabled: /etc/nginx/sites-enabled/status.cluster.local

  tasks:
    - name: Check HTTP redirects for each configured site
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_site['name'] }}"
        follow_redirects: none
        return_content: false
        status_code: 301
      register: nginx_multisite_http_redirects
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site

    - name: Assert HTTP redirects to HTTPS for each configured site
      ansible.builtin.assert:
        that:
          - item_redirect['status'] == 301
          - item_redirect['location'] is match('^https://')
      loop: "{{ nginx_multisite_http_redirects['results'] }}"
      loop_control:
        loop_var: item_redirect

    - name: Check HTTPS response for each configured site
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_site_https['name'] }}"
        validate_certs: false
        return_content: false
        status_code: 200
      register: nginx_multisite_https_responses
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site_https

    - name: Assert HTTPS returns the static index response for each site
      ansible.builtin.assert:
        that:
          - item_https['status'] == 200
      loop: "{{ nginx_multisite_https_responses['results'] }}"
      loop_control:
        loop_var: item_https

    - name: Inspect certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['certificate'] }}"
          - -noout
          - -subject
          - -nameopt
          - RFC2253
      register: nginx_multisite_certificate_subjects
      changed_when: false
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_certificate

    - name: Assert each certificate subject contains its site name
      ansible.builtin.assert:
        that:
          - "'CN=' ~ item_subject['item']['name'] in item_subject['stdout']"
      loop: "{{ nginx_multisite_certificate_subjects['results'] }}"
      loop_control:
        loop_var: item_subject

    - name: Check certificate validity dates
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate_date['certificate'] }}"
          - -noout
          - -checkend
          - "0"
      register: nginx_multisite_certificate_dates
      changed_when: false
      failed_when: false
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_certificate_date

    - name: Assert each certificate is not expired
      ansible.builtin.assert:
        that:
          - item_date['rc'] == 0
      loop: "{{ nginx_multisite_certificate_dates['results'] }}"
      loop_control:
        loop_var: item_date

    - name: Inspect private-key ownership and mode
      ansible.builtin.stat:
        path: "{{ item_key['private_key'] }}"
        follow: false
      register: nginx_multisite_private_keys
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_key

    - name: Assert each private key has the required ownership and mode
      ansible.builtin.assert:
        that:
          - item_private_key['stat']['exists']
          - item_private_key['stat']['pw_name'] == 'root'
          - item_private_key['stat']['gr_name'] == 'ssl-cert'
          - item_private_key['stat']['mode'] == '0640'
      loop: "{{ nginx_multisite_private_keys['results'] }}"
      loop_control:
        loop_var: item_private_key

    - name: Check each document root and static index file
      ansible.builtin.stat:
        path: "{{ item_root['document_root'] }}/index.html"
      register: nginx_multisite_index_files
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_root

    - name: Assert each document root contains its static index file
      ansible.builtin.assert:
        that:
          - item_index['stat']['exists']
          - item_index['stat']['isreg']
      loop: "{{ nginx_multisite_index_files['results'] }}"
      loop_control:
        loop_var: item_index

    - name: Resolve each enabled-site link
      ansible.builtin.command:
        argv:
          - readlink
          - -f
          - "{{ item_link['site_enabled'] }}"
      register: nginx_multisite_enabled_links
      changed_when: false
      failed_when: false
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_link

    - name: Assert each enabled-site link resolves to its available site
      ansible.builtin.assert:
        that:
          - item_resolved['rc'] == 0
          - item_resolved['stdout'] == item_resolved['item']['site_available']
      loop: "{{ nginx_multisite_enabled_links['results'] }}"
      loop_control:
        loop_var: item_resolved

    - name: Check that the default enabled site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: nginx_multisite_default_site

    - name: Assert that the default enabled site does not exist
      ansible.builtin.assert:
        that:
          - not nginx_multisite_default_site['stat']['exists']
