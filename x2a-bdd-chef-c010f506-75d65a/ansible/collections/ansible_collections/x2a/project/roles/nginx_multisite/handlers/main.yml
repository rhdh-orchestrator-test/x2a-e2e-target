---
- name: Restart sshd  # noqa: L039 - variable comes from role parameters with a default fallback
  ansible.builtin.service:
    name: "{{ nginx_multisite_sshd_service_name | default(\"sshd\") }}"
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload sysctl security settings
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: false

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
