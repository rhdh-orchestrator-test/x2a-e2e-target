---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Ensure nginx group exists
  ansible.builtin.group:
    name: nginx
    state: present

- name: Ensure nginx user exists
  ansible.builtin.user:
    name: nginx
    group: nginx
    system: true
    create_home: false
    state: present

- name: Deploy nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Deploy nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create nginx site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_multisite_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dictionary
    state: directory
    owner: nginx
    group: nginx
    mode: "0755"
    recurse: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site

- name: Deploy nginx site index files
  ansible.builtin.copy:
    src: "{{ item_nginx_multisite_site['key'].split('.')[0] }}/index.html"
    dest: "{{ item_nginx_multisite_site['value']['document_root'] }}/index.html" # noqa: R114 - paths from role-defined sites dictionary
    owner: nginx
    group: nginx
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site
