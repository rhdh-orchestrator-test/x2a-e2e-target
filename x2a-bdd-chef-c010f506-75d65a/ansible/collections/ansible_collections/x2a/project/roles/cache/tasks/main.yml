---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml

- name: Configure Redis using the Private Hub role
  ansible.builtin.include_role:
    name: eloy.redis.redis  # noqa: L038 - external role is declared in requirements.yml but is not locally resolvable during validation
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_install_method: package
    redis_port: 6379
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Remove obsolete Redis replica directives
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^{{ item_redis_directive }}.*$
    state: absent
    backup: true
  loop:
    - replica-serve-stale-data
    - replica-read-only
    - repl-ping-replica-period
    - client-output-buffer-limit
    - replica-priority
  loop_control:
    loop_var: item_redis_directive
  notify: Restart Redis

- name: Enable and start Redis
  ansible.builtin.service:
    name: redis
    state: started
    enabled: true
