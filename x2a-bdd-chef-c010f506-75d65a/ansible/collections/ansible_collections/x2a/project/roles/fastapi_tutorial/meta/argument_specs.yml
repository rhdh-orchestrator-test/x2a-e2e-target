---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application with PostgreSQL.
    description:
      - Deploys the FastAPI tutorial repository, Python virtual environment, PostgreSQL database, environment file, and systemd service.
    options:
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks that handle the database password.
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Installation directory for the application.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment path.
      fastapi_tutorial_app_user:
        type: str
        required: false
        default: root
        description: User running and owning the application.
      fastapi_tutorial_app_group:
        type: str
        required: false
        default: root
        description: Group owning the application files.
      fastapi_tutorial_bind_address:
        type: str
        required: false
        default: 0.0.0.0
        description: Address on which Uvicorn listens.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which Uvicorn listens.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: FastAPI systemd service name.
      fastapi_tutorial_database_service_name:
        type: str
        required: false
        default: postgresql
        description: PostgreSQL system service name.
      fastapi_tutorial_database_name:
        type: str
        required: false
        default: fastapi_db
        description: PostgreSQL database name.
      fastapi_tutorial_database_user:
        type: str
        required: false
        default: fastapi
        description: PostgreSQL application role name.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: localhost
        description: PostgreSQL hostname.
      fastapi_tutorial_database_port:
        type: int
        required: false
        default: 5432
        description: PostgreSQL port.
      fastapi_tutorial_database_password:
        type: str
        required: false
        default: "{{ db_password }}"
        description: PostgreSQL password supplied by the AAP credential variable db_password.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Application project name written to the environment file.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: Application API version written to the environment file.
