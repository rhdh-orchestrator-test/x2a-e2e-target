---
controller_credential_types:
  - name: PostgreSQL Application Password
    description: Password used by the FastAPI application and PostgreSQL provisioning for the fastapi database role.
    kind: cloud
    inputs:
      fields:
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; replace the hardcoded value with an Ansible Vault variable or approved secret backend.
      required:
        - db_password
    injectors:
      extra_vars:
        db_password: !unsafe "{{ db_password }}"
