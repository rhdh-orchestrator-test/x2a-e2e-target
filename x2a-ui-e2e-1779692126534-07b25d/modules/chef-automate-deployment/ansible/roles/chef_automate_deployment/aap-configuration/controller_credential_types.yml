---
controller_credential_types:
- name: Chef User Credentials
  description: Credential type for Chef User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Chef Username
      help_text: Username for the initial Chef user account
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name for the Chef user account
    - id: email
      type: string
      label: Email Address
      help_text: Email address for the Chef user account
    - id: password
      type: string
      label: User Password
      secret: true
      help_text: Password for authenticating to Chef Automate and Chef Infra Server
    - id: user_key_path
      type: string
      label: User Key Path
      help_text: Path where the user's PEM key file will be stored
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
      password: !unsafe '{{ password }}'
      user_key_path: !unsafe '{{ user_key_path }}'
- name: Chef Organization Configuration
  description: Credential type for Chef Organization Configuration
  kind: cloud
  inputs:
    fields:
    - id: org_short_name
      type: string
      label: Organization Short Name
      help_text: Short name identifier for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name for the Chef organization
    - id: org_validator_path
      type: string
      label: Organization Validator Key Path
      help_text: Path where the organization validator PEM key file will be stored
    required:
    - org_short_name
    - org_full_name
  injectors:
    extra_vars:
      org_short_name: !unsafe '{{ org_short_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
      org_validator_path: !unsafe '{{ org_validator_path }}'
