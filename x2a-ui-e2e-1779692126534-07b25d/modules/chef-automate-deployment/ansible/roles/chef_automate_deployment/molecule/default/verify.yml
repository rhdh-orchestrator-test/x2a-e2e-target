- name: Verify
  hosts: all
  gather_facts: false
  vars:
    chef_automate_hostname: automate.chef.lab
    user_key_path: jtonello.pem
    org_validator_path: lab-validator.pem
    username: jtonello
    org_short_name: lab
  tasks:
  - name: Check hostname configuration
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is correctly set
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == chef_automate_hostname
      fail_msg: Hostname is not set correctly
      success_msg: Hostname is set correctly
    when: hostname_file.stat.exists
  - name: Check max_map_count parameter
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_file
  - name: Assert max_map_count file exists
    ansible.builtin.assert:
      that:
      - max_map_count_file.stat.exists
      fail_msg: max_map_count file not found
      success_msg: max_map_count file exists
  - name: Get max_map_count content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_content
    when: max_map_count_file.stat.exists
  - name: Assert max_map_count is correctly set
    ansible.builtin.assert:
      that:
      - (max_map_count_content.content | b64decode | trim) == "262144"
      fail_msg: max_map_count is not set correctly
      success_msg: max_map_count is set correctly
    when: max_map_count_file.stat.exists
  - name: Check dirty_expire_centisecs parameter
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_file
  - name: Assert dirty_expire_centisecs file exists
    ansible.builtin.assert:
      that:
      - dirty_expire_centisecs_file.stat.exists
      fail_msg: dirty_expire_centisecs file not found
      success_msg: dirty_expire_centisecs file exists
  - name: Get dirty_expire_centisecs content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_content
    when: dirty_expire_centisecs_file.stat.exists
  - name: Assert dirty_expire_centisecs is correctly set
    ansible.builtin.assert:
      that:
      - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
      fail_msg: dirty_expire_centisecs is not set correctly
      success_msg: dirty_expire_centisecs is set correctly
    when: dirty_expire_centisecs_file.stat.exists
  - name: Check Chef Automate CLI
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check user key directory
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ user_key_path | dirname }}
    register: user_key_dir
    when: user_key_path | dirname != '.'
  - name: Assert user key directory exists
    ansible.builtin.assert:
      that:
      - user_key_dir.stat.exists
      - user_key_dir.stat.isdir
      fail_msg: User key directory not found
      success_msg: User key directory exists
    when: user_key_path | dirname != '.'
  - name: Check organization validator key directory
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ org_validator_path | dirname }}
    register: org_validator_dir
    when: org_validator_path | dirname != '.'
  - name: Assert organization validator key directory exists
    ansible.builtin.assert:
      that:
      - org_validator_dir.stat.exists
      - org_validator_dir.stat.isdir
      fail_msg: Organization validator key directory not found
      success_msg: Organization validator key directory exists
    when: org_validator_path | dirname != '.'
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ user_key_path }}
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.size > 0
      fail_msg: User key file not found
      success_msg: User key file exists
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ org_validator_path }}
    register: org_validator_file
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_validator_file.stat.exists
      - org_validator_file.stat.size > 0
      fail_msg: Organization validator key file not found
      success_msg: Organization validator key file exists
  - name: Check Chef Automate status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-automate-status
    register: chef_automate_status_file
  - name: Assert Chef Automate status file exists
    ansible.builtin.assert:
      that:
      - chef_automate_status_file.stat.exists
      - chef_automate_status_file.stat.size > 0
      fail_msg: Chef Automate status file not found
      success_msg: Chef Automate status file exists
  - name: Check Chef Server status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-server-status
    register: chef_server_status_file
  - name: Assert Chef Server status file exists
    ansible.builtin.assert:
      that:
      - chef_server_status_file.stat.exists
      - chef_server_status_file.stat.size > 0
      fail_msg: Chef Server status file not found
      success_msg: Chef Server status file exists
  - name: Check user list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-server-user-list
    register: user_list_file
  - name: Assert user list file exists
    ansible.builtin.assert:
      that:
      - user_list_file.stat.exists
      - user_list_file.stat.size > 0
      fail_msg: User list file not found
      success_msg: User list file exists
  - name: Get user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/hab/chef-server-user-list
    register: user_list_content
    when: user_list_file.stat.exists
  - name: Assert user exists in list
    ansible.builtin.assert:
      that:
      - username in (user_list_content.content | b64decode | trim)
      fail_msg: User not found in user list
      success_msg: User found in user list
    when: user_list_file.stat.exists
  - name: Check organization list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-server-org-list
    register: org_list_file
  - name: Assert organization list file exists
    ansible.builtin.assert:
      that:
      - org_list_file.stat.exists
      - org_list_file.stat.size > 0
      fail_msg: Organization list file not found
      success_msg: Organization list file exists
  - name: Get organization list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/hab/chef-server-org-list
    register: org_list_content
    when: org_list_file.stat.exists
  - name: Assert organization exists in list
    ansible.builtin.assert:
      that:
      - org_short_name in (org_list_content.content | b64decode | trim)
      fail_msg: Organization not found in organization list
      success_msg: Organization found in organization list
    when: org_list_file.stat.exists
  - name: Check Chef Automate service status
    ansible.builtin.command:
      cmd: chef-automate status
    register: automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate services are running
    ansible.builtin.assert:
      that:
      - '''running'' in automate_status.stdout'
      fail_msg: Chef Automate services are not running
      success_msg: Chef Automate services are running
    when: automate_status.rc == 0
    tags: molecule-notest
  - name: Check Chef Infra Server service status
    ansible.builtin.command:
      cmd: chef-server-ctl status
    register: server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server services are running
    ansible.builtin.assert:
      that:
      - '''run:'' in server_status.stdout'
      fail_msg: Chef Infra Server services are not running
      success_msg: Chef Infra Server services are running
    when: server_status.rc == 0
    tags: molecule-notest
  - name: Check HTTPS connectivity
    ansible.builtin.uri:
      url: https://localhost
      validate_certs: false
    register: https_result
    failed_when: false
    tags: molecule-notest
  - name: Assert HTTPS connectivity
    ansible.builtin.assert:
      that:
      - https_result.status == 200
      fail_msg: HTTPS connectivity check failed
      success_msg: HTTPS connectivity check passed
    when: https_result is defined
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check.state == "started"
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    when: port_check is defined
    tags: molecule-notest
