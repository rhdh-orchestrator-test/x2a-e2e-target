- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname | default(''automate.chef.lab'') }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/vm/{{ item.key | regex_replace('^vm\.', '') }}
      mode: '0644'
    loop:
    - key: vm.max_map_count
      value: '262144'
    - key: vm.dirty_expire_centisecs
      value: '20000'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI v1.0.0'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create directories for key files
    ansible.builtin.file:
      path: /tmp/molecule_test/{{ item | dirname }}
      state: directory
      mode: '0755'
    loop:
    - '{{ user_key_path | default(''jtonello.pem'') }}'
    - '{{ org_validator_path | default(''lab-validator.pem'') }}'
    when: item | dirname != '.'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/{{ user_key_path | default('jtonello.pem') }}
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/{{ org_validator_path | default('lab-validator.pem') }}
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: chef-automate-postgresql    Status: running

        Service: chef-automate-elasticsearch Status: running

        Service: chef-automate-nginx         Status: running

        '
      dest: /tmp/molecule_test/hab/chef-automate-status
      mode: '0644'
  - name: Create Chef Server status file
    ansible.builtin.copy:
      content: 'run: postgresql-9.2.24: (pid 12345) 300s; run: log: (pid 12346) 300s

        run: bookshelf: (pid 12347) 300s; run: log: (pid 12348) 300s

        run: oc_bifrost: (pid 12349) 300s; run: log: (pid 12350) 300s

        run: oc_id: (pid 12351) 300s; run: log: (pid 12352) 300s

        run: opscode-erchef: (pid 12353) 300s; run: log: (pid 12354) 300s

        run: nginx: (pid 12355) 300s; run: log: (pid 12356) 300s

        '
      dest: /tmp/molecule_test/hab/chef-server-status
      mode: '0644'
  - name: Create user list file
    ansible.builtin.copy:
      content: '{{ username | default(''jtonello'') }} '
      dest: /tmp/molecule_test/hab/chef-server-user-list
      mode: '0644'
  - name: Create organization list file
    ansible.builtin.copy:
      content: '{{ org_short_name | default(''lab'') }} '
      dest: /tmp/molecule_test/hab/chef-server-org-list
      mode: '0644'
