---
- name: Ensure gzip package is installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: "set -o pipefail gunzip < /tmp/chef-automate_linux_amd64.zip > {{ chef_automate_cli_path }} "
    executable: /bin/bash
    creates: "{{ chef_automate_cli_path }}"
  register: extract_result
  changed_when: extract_result.rc == 0
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
