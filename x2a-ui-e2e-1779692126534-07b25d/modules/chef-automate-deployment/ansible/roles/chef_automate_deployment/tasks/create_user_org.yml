---
- name: Ensure directory for user key exists
  ansible.builtin.file:
    path: "{{ user_key_path | dirname }}"
    state: directory
    mode: "0755"
  when: user_key_path | dirname != '.'
- name: Ensure directory for organization validator key exists
  ansible.builtin.file:
    path: "{{ org_validator_path | dirname }}"
    state: directory
    mode: "0755"
  when: org_validator_path | dirname != '.'
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ user_key_path }}
  args:
    creates: "{{ user_key_path }}"
  become: true
  register: create_user_result
  changed_when: create_user_result.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ org_short_name }} "{{ org_full_name }}" --association_user {{ username }} --filename {{ org_validator_path }}
  args:
    creates: "{{ org_validator_path }}"
  become: true
  register: create_org_result
  changed_when: create_org_result.rc == 0
