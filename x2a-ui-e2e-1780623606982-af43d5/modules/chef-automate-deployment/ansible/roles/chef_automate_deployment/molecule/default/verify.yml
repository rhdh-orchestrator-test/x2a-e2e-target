- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname configuration
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname is configured
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found or empty
      success_msg: Hostname file exists and has content
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set to expected value
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check vm.max_map_count configuration
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_file
  - name: Assert vm.max_map_count is configured
    ansible.builtin.assert:
      that:
      - max_map_count_file.stat.exists
      - max_map_count_file.stat.size > 0
      fail_msg: vm.max_map_count file not found or empty
      success_msg: vm.max_map_count file exists and has content
  - name: Get vm.max_map_count content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_content
    when: max_map_count_file.stat.exists
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - (max_map_count_content.content | b64decode | trim) == "262144"
      fail_msg: vm.max_map_count not set to expected value
      success_msg: vm.max_map_count set correctly
    when: max_map_count_file.stat.exists
  - name: Check vm.dirty_expire_centisecs configuration
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_file
  - name: Assert vm.dirty_expire_centisecs is configured
    ansible.builtin.assert:
      that:
      - dirty_expire_centisecs_file.stat.exists
      - dirty_expire_centisecs_file.stat.size > 0
      fail_msg: vm.dirty_expire_centisecs file not found or empty
      success_msg: vm.dirty_expire_centisecs file exists and has content
  - name: Get vm.dirty_expire_centisecs content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_content
    when: dirty_expire_centisecs_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
      fail_msg: vm.dirty_expire_centisecs not set to expected value
      success_msg: vm.dirty_expire_centisecs set correctly
    when: dirty_expire_centisecs_file.stat.exists
  - name: Check Chef Automate CLI
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate deployment marker
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert Chef Automate is deployed
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef Automate deployment marker directory not found
      success_msg: Chef Automate deployment marker directory exists
  - name: Check user PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/admin.pem
    register: user_pem
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.size > 0
      fail_msg: User PEM file not found or empty
      success_msg: User PEM file exists and has content
  - name: Check organization validator PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_pem
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_pem.stat.exists
      - org_pem.stat.size > 0
      fail_msg: Organization validator PEM file not found or empty
      success_msg: Organization validator PEM file exists and has content
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: chef-automate status
    tags: molecule-notest
    register: automate_status
    changed_when: false
    failed_when: false
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - automate_status.rc == 0
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: chef-server-ctl status
    tags: molecule-notest
    register: chef_server_status
    changed_when: false
    failed_when: false
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - chef_server_status.rc == 0
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Check if port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
    register: port_check
    failed_when: false
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is succeeded
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
  - name: Test API connectivity
    ansible.builtin.uri:
      url: https://localhost/api/v0/health
      validate_certs: false
    tags: molecule-notest
    register: api_check
    failed_when: false
  - name: Assert API is accessible
    ansible.builtin.assert:
      that:
      - api_check is succeeded
      fail_msg: API is not accessible
      success_msg: API is accessible
    tags: molecule-notest
