---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate_linux_amd64.zip > {{ chef_automate_cli_path }}
  args:
    creates: "{{ chef_automate_cli_path }}"
  become: true
  changed_when: false
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
  become: true
- name: Build product deployment options
  ansible.builtin.set_fact:
    product_options: "{% for product in chef_automate_products %}--product {{ product }} {% endfor %}"
- name: Deploy Chef Automate
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy {{ product_options }} --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }}"
  args:
    creates: /hab
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
