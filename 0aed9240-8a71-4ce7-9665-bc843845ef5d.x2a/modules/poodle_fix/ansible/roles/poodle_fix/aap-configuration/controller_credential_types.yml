---
controller_credential_types:
- name: Chef Server User
  description: Credential type for Chef Server User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef server administrator username
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Chef server administrator password
    - id: email
      type: string
      label: Email
      help_text: Chef server administrator email address
    required:
    - username
    - password
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
