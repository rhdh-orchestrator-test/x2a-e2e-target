---
argument_specs:
  main:
    short_description: Install and configure the FastAPI Tutorial application
    description:
      - Deploys the FastAPI Tutorial repository, Python environment, PostgreSQL dependency, and systemd service.
    options:
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to hide tasks that handle the database password.
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Filesystem path where the application is deployed.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment path.
      fastapi_tutorial_app_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by the FastAPI service.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Application project name written to the environment file.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: Application API version.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name for the application.
      fastapi_tutorial_postgresql_service:
        type: str
        required: false
        default: postgresql
        description: PostgreSQL systemd service name.
      db_user:
        type: str
        required: true
        description: Database user injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: Database password injected by an AAP credential type.
      db_host:
        type: str
        required: true
        description: Database host injected by an AAP credential type.
      db_name:
        type: str
        required: true
        description: Database name injected by an AAP credential type.
