---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials for the FastAPI application's PostgreSQL role and database connection. The current password is hardcoded in the Chef recipe and 
      must be migrated to Ansible Vault or an external secret store.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      db_user: "{{ db_user }}"
      db_password: "{{ vault_db_password }}"
      db_host: "{{ db_host }}"
      db_name: "{{ db_name }}"
