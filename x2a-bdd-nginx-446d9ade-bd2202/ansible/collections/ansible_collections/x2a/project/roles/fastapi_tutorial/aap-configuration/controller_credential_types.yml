---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the FastAPI application's PostgreSQL role and database connection. The current password is hardcoded in the Chef recipe and 
      must be migrated to Ansible Vault or an external secret store.
    kind: cloud
    inputs:
      fields:
        - id: db_user
          type: string
          label: Database User
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the fastapi PostgreSQL role; currently hardcoded as fastapi_password and embedded in DATABASE_URL.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server, currently localhost.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application, currently fastapi_db.
      required:
        - db_user
        - db_password
        - db_host
        - db_name
    injectors:
      extra_vars:
        db_user: !unsafe "{{ db_user }}"
        db_password: !unsafe "{{ db_password }}"
        db_host: !unsafe "{{ db_host }}"
        db_name: !unsafe "{{ db_name }}"
