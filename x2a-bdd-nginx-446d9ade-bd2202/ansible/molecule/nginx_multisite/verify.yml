# Unsupported pre-flight checks: package versions/presence, exact certificate validity duration,
# raw sysctl output/application, HTTP response bodies/statuses, SSH service state, nginx -t,
# service logs, and the rendered Nginx error-log path have no safely stated expected outcome
# suitable for a read-only assertion here.
---
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: false
  vars:
    nginx_multisite_sites:
      - name: test.cluster.local
        document_root: /opt/server/test
        certificate: /etc/ssl/certs/test.cluster.local.crt
        private_key: /etc/ssl/private/test.cluster.local.key
        available: /etc/nginx/sites-available/test.cluster.local
        enabled: /etc/nginx/sites-enabled/test.cluster.local
        index: /opt/server/test/index.html
      - name: ci.cluster.local
        document_root: /opt/server/ci
        certificate: /etc/ssl/certs/ci.cluster.local.crt
        private_key: /etc/ssl/private/ci.cluster.local.key
        available: /etc/nginx/sites-available/ci.cluster.local
        enabled: /etc/nginx/sites-enabled/ci.cluster.local
        index: /opt/server/ci/index.html
      - name: status.cluster.local
        document_root: /opt/server/status
        certificate: /etc/ssl/certs/status.cluster.local.crt
        private_key: /etc/ssl/private/status.cluster.local.key
        available: /etc/nginx/sites-available/status.cluster.local
        enabled: /etc/nginx/sites-enabled/status.cluster.local
        index: /opt/server/status/index.html

  tasks:
    - name: Verify explicitly listed configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config_file }}"  # noqa: R114 - fixed verification path in this play
      loop:
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available
        - /etc/nginx/sites-enabled
      loop_control:
        loop_var: item_config_file
      register: nginx_multisite_config_files

    - name: Assert explicitly listed configuration files exist
      ansible.builtin.assert:
        that:
          - item_config_result['stat']['exists']
        loop: "{{ nginx_multisite_config_files['results'] }}"
        loop_control:
          loop_var: item_config_result

    - name: Verify site document roots exist
      ansible.builtin.stat:
        path: "{{ item_site['document_root'] }}"  # noqa: R114 - path is from the fixed site map above
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site
      register: nginx_multisite_document_roots

    - name: Assert site document roots exist
      ansible.builtin.assert:
        that:
          - item_document_root['stat']['exists']
        loop: "{{ nginx_multisite_document_roots['results'] }}"
        loop_control:
          loop_var: item_document_root

    - name: Verify site index files exist
      ansible.builtin.stat:
        path: "{{ item_site_index['index'] }}"  # noqa: R114 - path is from the fixed site map above
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site_index
      register: nginx_multisite_index_files

    - name: Assert site index files exist
      ansible.builtin.assert:
        that:
          - item_index_file['stat']['exists']
        loop: "{{ nginx_multisite_index_files['results'] }}"
        loop_control:
          loop_var: item_index_file

    - name: Verify available site configurations exist
      ansible.builtin.stat:
        path: "{{ item_available['available'] }}"  # noqa: R114 - path is from the fixed site map above
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_available
      register: nginx_multisite_available_sites

    - name: Assert available site configurations exist
      ansible.builtin.assert:
        that:
          - item_available_site['stat']['exists']
        loop: "{{ nginx_multisite_available_sites['results'] }}"
        loop_control:
          loop_var: item_available_site

    - name: Verify TLS certificates exist
      ansible.builtin.stat:
        path: "{{ item_certificate['certificate'] }}"  # noqa: R114 - path is from the fixed site map above
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_certificate
      register: nginx_multisite_certificates

    - name: Assert TLS certificates exist
      ansible.builtin.assert:
        that:
          - item_certificate_result['stat']['exists']
        loop: "{{ nginx_multisite_certificates['results'] }}"
        loop_control:
          loop_var: item_certificate_result

    - name: Verify TLS private keys exist with expected ownership and mode
      ansible.builtin.stat:
        path: "{{ item_key['private_key'] }}"  # noqa: R114 - path is from the fixed site map above
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_key
      register: nginx_multisite_key_stats

    - name: Assert TLS private keys have expected ownership and mode
      ansible.builtin.assert:
        that:
          - item_key_stat['stat']['exists']
          - item_key_stat['stat']['pw_name'] == 'root'
          - item_key_stat['stat']['gr_name'] == 'ssl-cert'
          - item_key_stat['stat']['mode'] == '0640'
        loop: "{{ nginx_multisite_key_stats['results'] }}"
        loop_control:
          loop_var: item_key_stat

    - name: Verify enabled site links and their targets
      ansible.builtin.stat:
        path: "{{ item_link['enabled'] }}"  # noqa: R114 - link path is from the fixed site map above
        follow: false
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_link
      register: nginx_multisite_link_stats

    - name: Assert enabled site links target their available configurations
      ansible.builtin.assert:
        that:
          - item_link_stat['stat']['islnk']
          - item_link_stat['stat']['lnk_source'] == item_link_stat['item']['available']
        loop: "{{ nginx_multisite_link_stats['results'] }}"
        loop_control:
          loop_var: item_link_stat

    - name: Verify the default Nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: nginx_multisite_default_site

    - name: Assert the default Nginx site is absent
      ansible.builtin.assert:
        that:
          - not nginx_multisite_default_site['stat']['exists']

    - name: Read SSH authentication hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: nginx_multisite_sshd_config

    - name: Assert root login and password authentication are disabled
      ansible.builtin.assert:
        that:
          - (nginx_multisite_sshd_config['content'] | b64decode) is regex('(?m)^\\s*PermitRootLogin\\s+no\\s*$')
          - (nginx_multisite_sshd_config['content'] | b64decode) is regex('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')

    - name: Gather service facts for active service checks
      ansible.builtin.service_facts:

    - name: Assert fail2ban and Nginx are active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'
          - ansible_facts['services']['nginx.service']['state'] == 'running'

    - name: Verify fail2ban and Nginx are enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item_service['name'] }}"
      loop:
        - name: fail2ban.service
        - name: nginx.service
      loop_control:
        loop_var: item_service
      register: nginx_multisite_enabled_services
      changed_when: false

    - name: Assert fail2ban and Nginx are enabled
      ansible.builtin.assert:
        that:
          - item_enabled_service['rc'] == 0
          - item_enabled_service['stdout'] | trim == 'enabled'
        loop: "{{ nginx_multisite_enabled_services['results'] }}"
        loop_control:
          loop_var: item_enabled_service

    - name: Verify UFW status and allowed ports
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: nginx_multisite_ufw_status
      changed_when: false

    - name: Assert UFW is active, denies incoming traffic, and allows SSH HTTP and HTTPS
      ansible.builtin.assert:
        that:
          - nginx_multisite_ufw_status['rc'] == 0
          - nginx_multisite_ufw_status['stdout'] is search('Status:\\s+active')
          - nginx_multisite_ufw_status['stdout'] is search('Default:\\s+deny')
          - nginx_multisite_ufw_status['stdout'] is search('22')
          - nginx_multisite_ufw_status['stdout'] is search('80')
          - nginx_multisite_ufw_status['stdout'] is search('443')

    - name: Inspect certificate subjects and validity fields
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['certificate'] }}"
          - -noout
          - -subject
          - -dates
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_certificate
      register: nginx_multisite_certificate_details
      changed_when: false

    - name: Assert certificate subjects and validity metadata match site names
      ansible.builtin.assert:
        that:
          - item_certificate_result['rc'] == 0
          - item_certificate_result['stdout'] is search('CN\\s*=\\s*' ~ item_certificate_result['item']['name'])
          - item_certificate_result['stdout'] is search('notBefore=')
          - item_certificate_result['stdout'] is search('notAfter=')
        loop: "{{ nginx_multisite_certificate_details['results'] }}"
        loop_control:
          loop_var: item_certificate_result

    - name: Verify Nginx listens on HTTP HTTPS and SSH ports
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: nginx_multisite_listening_ports
      changed_when: false

    - name: Assert Nginx and SSH listening ports
      ansible.builtin.assert:
        that:
          - nginx_multisite_listening_ports['rc'] == 0
          - nginx_multisite_listening_ports['stdout'] is search(':80\\s')
          - nginx_multisite_listening_ports['stdout'] is search(':443\\s')
          - nginx_multisite_listening_ports['stdout'] is search(':22\\s')
