---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_hostname }}"
  become: true
- name: Configure system parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ chef_sysctl_settings | dict2items }}"
  become: true
- name: Ensure Chef Automate config directory exists
  ansible.builtin.file:
    path: "{{ chef_config_dir }}"
    state: directory
    mode: "0755"
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate.zip > {{ ansible_env.HOME }}/chef-automate && chmod +x {{ ansible_env.HOME }}/chef-automate
  args:
    creates: "{{ ansible_env.HOME }}/chef-automate"
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_accept_terms_and_mlsa | lower }}
    chdir: "{{ ansible_env.HOME }}"
  args:
    creates: /etc/chef-automate/config.toml
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_username }} {{ chef_longusername }} {{ chef_useremail }} {{ password }} --filename {{ chef_userfilename }}
    chdir: "{{ ansible_env.HOME }}"
  args:
    creates: "{{ ansible_env.HOME }}/{{ chef_userfilename }}"
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_orgname }} "{{ chef_longorgname }}" --association_user {{ chef_username }} --filename {{ chef_orgfilename }}
    chdir: "{{ ansible_env.HOME }}"
  args:
    creates: "{{ ansible_env.HOME }}/{{ chef_orgfilename }}"
  become: true
