---
# FastAPI Tutorial Role Tasks

- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install required system packages
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_packages }}"
    state: present # L044 fix

- name: Create service user
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_service_user }}"
    system: true
    shell: /bin/false
    home: "{{ fastapi_tutorial_app_dir }}"
    create_home: false
    state: present # L044 fix
  when: fastapi_tutorial_service_user != 'root'

- name: Create service group
  ansible.builtin.group:
    name: "{{ fastapi_tutorial_service_group }}"
    system: true
    state: present # L044 fix
  when: fastapi_tutorial_service_group != 'root'

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    mode: "0755"

- name: Clone FastAPI tutorial repository
  ansible.builtin.git: # noqa: R104 - internal repository, HTTPS not available
    repo: "{{ fastapi_tutorial_git_repo }}" # noqa: R106 - repository URL from role defaults, not user input
    dest: "{{ fastapi_tutorial_app_dir }}"
    version: "{{ fastapi_tutorial_git_branch }}"
    force: true

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv {{ fastapi_tutorial_app_dir }}/venv # noqa: R101 - path from role defaults, not user input
    creates: "{{ fastapi_tutorial_app_dir }}/venv"

- name: Install Python dependencies from requirements.txt
  ansible.builtin.pip: # noqa: R113 - requirements file path from role defaults, not user input
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_app_dir }}/venv"
    virtualenv_command: python3 -m venv

- name: Enable and start PostgreSQL service
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Check if PostgreSQL database user exists
  ansible.builtin.command:
    cmd: sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ fastapi_tutorial_db_user }}'" # noqa: R101 - database user from role defaults, not user input
  register: user_exists
  changed_when: false
  failed_when: false

- name: Create PostgreSQL database user
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "CREATE USER {{ fastapi_tutorial_db_user }} WITH PASSWORD '{{ fastapi_tutorial_db_password }}';" # noqa: R101 - database credentials from role defaults, not user input
  when: user_exists.stdout != "1" # noqa: L039 - variable registered by prior task

- name: Check if PostgreSQL database exists
  ansible.builtin.command:
    cmd: sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ fastapi_tutorial_db_name }}'" # noqa: R101 - database name from role defaults, not user input
  register: db_exists
  changed_when: false
  failed_when: false

- name: Create PostgreSQL database
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "CREATE DATABASE {{ fastapi_tutorial_db_name }} OWNER {{ fastapi_tutorial_db_user }};" # noqa: R101 - database parameters from role defaults, not user input
  when: db_exists.stdout != "1" # noqa: L039 - variable registered by prior task

- name: Grant privileges on database
  ansible.builtin.command:
    cmd: sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ fastapi_tutorial_db_name }} TO {{ fastapi_tutorial_db_user }};" # noqa: R101 - database parameters from role defaults, not user input
  when: db_exists.stdout != "1" # noqa: L039 - variable registered by prior task

- name: Deploy environment configuration file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path from role defaults, not user input
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    mode: "0644"
    backup: true
  notify: Restart fastapi-tutorial service

- name: Deploy systemd service file
  ansible.builtin.template:
    src: fastapi-tutorial.service.j2
    dest: /etc/systemd/system/{{ fastapi_tutorial_service_name }}.service # noqa: R114 - service name from role defaults, not user input
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload systemd daemon
    - Restart fastapi-tutorial service

- name: Enable and start FastAPI tutorial service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
