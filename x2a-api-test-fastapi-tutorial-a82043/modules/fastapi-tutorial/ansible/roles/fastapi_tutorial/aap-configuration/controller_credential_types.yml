---
controller_credential_types:
  - name: FastAPI PostgreSQL Database
    description: Database credentials for the FastAPI tutorial application to connect to PostgreSQL
    kind: cloud
    inputs:
      fields:
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi user
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL username for the FastAPI application
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database name for the FastAPI application
        - id: db_host
          type: string
          label: Database Host
          help_text: PostgreSQL server hostname or IP address
      required:
        - db_password
        - db_username
        - db_name
        - db_host
    injectors:
      extra_vars:
        db_password: !unsafe "{{ db_password }}"
        db_username: !unsafe "{{ db_username }}"
        db_name: !unsafe "{{ db_name }}"
        db_host: !unsafe "{{ db_host }}"
