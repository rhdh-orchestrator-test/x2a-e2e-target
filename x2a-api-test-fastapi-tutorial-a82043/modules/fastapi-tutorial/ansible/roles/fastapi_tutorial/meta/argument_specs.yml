---
argument_specs:
  main:
    short_description: Install and configure FastAPI tutorial web application with PostgreSQL backend
    description:
      - Deploys a FastAPI tutorial web application with PostgreSQL database backend
      - Installs Python 3, clones FastAPI tutorial repository from GitHub
      - Sets up Python virtual environment and installs dependencies
      - Configures PostgreSQL with dedicated database and user
      - Runs the application as a systemd service on configurable port
    options:
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Directory where the FastAPI application will be installed
      fastapi_tutorial_git_repo:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the FastAPI tutorial application
      fastapi_tutorial_git_branch:
        type: str
        required: false
        default: main
        description: Git branch to checkout from the repository
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name used in the application configuration
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version used in the application configuration
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port the FastAPI application listens on
      fastapi_tutorial_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Host address the FastAPI application binds to
      fastapi_tutorial_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
        description: List of system packages required for the application
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Name of the systemd service for the FastAPI application
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: User account that runs the FastAPI service
      fastapi_tutorial_service_group:
        type: str
        required: false
        default: root
        description: Group account that runs the FastAPI service
      fastapi_tutorial_db_host:
        type: str
        required: false
        default: localhost
        description: PostgreSQL database host (uses AAP credential variable db_host if available)
      fastapi_tutorial_db_name:
        type: str
        required: false
        default: fastapi_db
        description: PostgreSQL database name (uses AAP credential variable db_name if available)
      fastapi_tutorial_db_user:
        type: str
        required: false
        default: fastapi
        description: PostgreSQL database user (uses AAP credential variable db_username if available)
      fastapi_tutorial_db_password:
        type: str
        required: false
        default: fastapi_password
        description: PostgreSQL database password (uses AAP credential variable db_password if available)
