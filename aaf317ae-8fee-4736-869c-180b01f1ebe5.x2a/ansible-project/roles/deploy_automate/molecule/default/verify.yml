- name: Verify
  hosts: all
  gather_facts: false
  vars:
    user_password: molecule_test_password
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file was created
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set to automate.chef.lab
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl settings file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file was created
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Sysctl settings file not found
      success_msg: Sysctl settings file exists
  - name: Get sysctl content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl settings are correct
    ansible.builtin.assert:
      that:
      - (sysctl_content.content | b64decode) is search("vm.max_map_count = 262144")
      - (sysctl_content.content | b64decode) is search("vm.dirty_expire_centisecs = 20000")
      fail_msg: Sysctl settings not configured correctly
      success_msg: Sysctl settings configured correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: cli_file
  - name: Assert Chef Automate CLI file was created
    ansible.builtin.assert:
      that:
      - cli_file.stat.exists
      - cli_file.stat.size > 0
      - cli_file.stat.mode == "0755"
      fail_msg: Chef Automate CLI file not found or incorrect permissions
      success_msg: Chef Automate CLI file exists with correct permissions
  - name: Check Chef Automate status file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-automate-status.txt
    register: status_file
  - name: Assert Chef Automate status file was created
    ansible.builtin.assert:
      that:
      - status_file.stat.exists
      - status_file.stat.size > 0
      fail_msg: Chef Automate status file not found
      success_msg: Chef Automate status file exists
  - name: Get Chef Automate status content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/hab/chef-automate-status.txt
    register: status_content
    when: status_file.stat.exists
  - name: Assert Chef Automate services are running
    ansible.builtin.assert:
      that:
      - (status_content.content | b64decode) is search("automate-postgresql.default - OK")
      - (status_content.content | b64decode) is search("chef-server.default - OK")
      fail_msg: Chef Automate services not running correctly
      success_msg: Chef Automate services running correctly
    when: status_file.stat.exists
  - name: Check user key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_key_file
  - name: Assert user key file was created
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.size > 0
      - user_key_file.stat.mode == "0600"
      fail_msg: User key file not found or incorrect permissions
      success_msg: User key file exists with correct permissions
  - name: Check organization validator key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_key_file
  - name: Assert organization validator key file was created
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.size > 0
      - org_key_file.stat.mode == "0600"
      fail_msg: Organization validator key file not found or incorrect permissions
      success_msg: Organization validator key file exists with correct permissions
  - name: Check Chef Server user list file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-server-user-list.txt
    register: user_list_file
  - name: Get Chef Server user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/hab/chef-server-user-list.txt
    register: user_list_content
    when: user_list_file.stat.exists
  - name: Assert user was created
    ansible.builtin.assert:
      that:
      - (user_list_content.content | b64decode | trim) == "jtonello"
      fail_msg: User jtonello not found in Chef Server user list
      success_msg: User jtonello found in Chef Server user list
    when: user_list_file.stat.exists
  - name: Check Chef Server org list file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-server-org-list.txt
    register: org_list_file
  - name: Get Chef Server org list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/hab/chef-server-org-list.txt
    register: org_list_content
    when: org_list_file.stat.exists
  - name: Assert organization was created
    ansible.builtin.assert:
      that:
      - (org_list_content.content | b64decode | trim) == "lab"
      fail_msg: Organization lab not found in Chef Server org list
      success_msg: Organization lab found in Chef Server org list
    when: org_list_file.stat.exists
  - name: Check Chef Automate service status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - automate_status.rc == 0
      fail_msg: Chef Automate service is not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check Chef Infra Server service status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server service is running
    ansible.builtin.assert:
      that:
      - server_status.rc == 0
      fail_msg: Chef Infra Server service is not running
      success_msg: Chef Infra Server service is running
    tags: molecule-notest
  - name: Check HTTPS port is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Assert HTTPS port is listening
    ansible.builtin.assert:
      that:
      - port_check is succeeded
      fail_msg: HTTPS port 443 is not listening
      success_msg: HTTPS port 443 is listening
    tags: molecule-notest
  - name: Check Chef Automate API access
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
    register: api_check
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate API is accessible
    ansible.builtin.assert:
      that:
      - api_check is succeeded
      fail_msg: Chef Automate API is not accessible
      success_msg: Chef Automate API is accessible
    tags: molecule-notest
