---
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_key_path }}"
    - "{{ chef_org_validator_key_path }}"
  become: true
  when: chef_user_key_path is defined and chef_org_validator_key_path is defined
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ user_fullname }} {{ user_email }} "{{ user_password }}" --filename {{ chef_user_key_path }}
  args:
    creates: "{{ chef_user_key_path }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}" --association_user {{ username }} --filename {{ chef_org_validator_key_path
      }}
  args:
    creates: "{{ chef_org_validator_key_path }}"
  become: true
- name: Ensure key files have proper permissions
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  loop:
    - "{{ chef_user_key_path }}"
    - "{{ chef_org_validator_key_path }}"
  become: true
  when:
    - ansible_user is defined
