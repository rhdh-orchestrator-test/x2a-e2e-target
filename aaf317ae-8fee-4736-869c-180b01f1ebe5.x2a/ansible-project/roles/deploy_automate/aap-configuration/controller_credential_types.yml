---
controller_credential_types:
- name: Chef User Password
  description: Credential type for Chef User Password
  kind: cloud
  inputs:
    fields:
    - id: user_password
      type: string
      label: User Password
      secret: true
      help_text: Password used to create the initial Chef user account
    - id: username
      type: string
      label: Username
      help_text: Username for the Chef user account
    - id: user_email
      type: string
      label: User Email
      help_text: Email address for the Chef user account
    - id: user_fullname
      type: string
      label: User Full Name
      help_text: Full name for the Chef user account
    required:
    - user_password
    - username
  injectors:
    extra_vars:
      user_password: !unsafe '{{ user_password }}'
      username: !unsafe '{{ username }}'
      user_email: !unsafe '{{ user_email }}'
      user_fullname: !unsafe '{{ user_fullname }}'
