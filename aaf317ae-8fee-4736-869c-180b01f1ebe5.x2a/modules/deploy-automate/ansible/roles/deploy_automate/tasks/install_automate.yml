---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - gzip
      - unzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
  register: download_result
- name: Extract Chef Automate CLI (if compressed)
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }} > {{ chef_automate_cli_path }}.extracted && chmod +x {{ chef_automate_cli_path }}.extracted
  args:
    creates: "{{ chef_automate_cli_path }}.extracted"
  when: download_result.changed
  register: extract_result
  changed_when: extract_result is defined and extract_result.rc == 0
- name: Set Chef Automate CLI path
  ansible.builtin.set_fact:
    chef_automate_cli_executable: "{{ chef_automate_cli_path }}.extracted"
  when: extract_result is defined and extract_result.changed
  changed_when: false
- name: Set Chef Automate CLI path (if not extracted)
  ansible.builtin.set_fact:
    chef_automate_cli_executable: "{{ chef_automate_cli_path }}"
  when: not download_result.changed or not extract_result.changed
  changed_when: false
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_executable }} deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}"
  args:
    creates: /hab
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
- name: Wait for Chef Automate services to be ready
  ansible.builtin.pause:
    seconds: 30
  when: deploy_result.changed
  changed_when: false
