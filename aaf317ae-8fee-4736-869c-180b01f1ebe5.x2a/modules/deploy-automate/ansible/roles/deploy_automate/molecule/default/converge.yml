- name: Converge
  hosts: all
  gather_facts: true
  vars:
    user_password: molecule_test_password
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_USER_KEY_CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_ORG_VALIDATOR_KEY_CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: automate-postgresql.default - OK

        Service: automate-elasticsearch.default - OK

        Service: automate-gateway.default - OK

        Service: chef-server.default - OK

        '
      dest: /tmp/molecule_test/hab/chef-automate-status.txt
      mode: '0644'
  - name: Create Chef Server user list file
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/hab/chef-server-user-list.txt
      mode: '0644'
  - name: Create Chef Server org list file
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/hab/chef-server-org-list.txt
      mode: '0644'
