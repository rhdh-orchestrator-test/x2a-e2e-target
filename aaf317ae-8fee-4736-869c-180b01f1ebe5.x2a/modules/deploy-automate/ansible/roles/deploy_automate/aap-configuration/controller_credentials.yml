---
controller_credentials:
- name: Chef User Password - deploy_automate
  description: Credential for deploy_automate
  organization: Default
  credential_type: Chef User Password
  update_secrets: true
  inputs:
    user_password: '{{ vault_user_password }}'
    username: '{{ username }}'
    user_email: '{{ user_email }}'
    user_fullname: '{{ user_fullname }}'
