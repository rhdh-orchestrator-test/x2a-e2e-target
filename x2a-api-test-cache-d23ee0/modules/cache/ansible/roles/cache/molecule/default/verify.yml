---
- name: Verify cache services and configuration
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis and Memcached configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /etc/redis/redis.conf
        - /var/log/redis
      loop_control:
        loop_var: item_config
      register: config_stat_results

    - name: Assert configuration files and directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: "Expected configuration file or directory not found"
      loop: "{{ config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check Redis log directory permissions
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory has correct permissions
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['isdir']
          - redis_log_dir_stat['stat']['mode'] == '0755'
          - redis_log_dir_stat['stat']['pw_name'] == 'redis'
          - redis_log_dir_stat['stat']['gr_name'] == 'redis'
        fail_msg: "Redis log directory permissions incorrect"

    - name: Check Redis configuration content
      ansible.builtin.slurp:
        src: /etc/redis/redis.conf
      register: redis_config_content

    - name: Assert Redis configuration contains required settings
      ansible.builtin.assert:
        that:
          - "'requirepass' in redis_config_decoded"
          - "'port 6379' in redis_config_decoded"
          - "'bind 127.0.0.1' in redis_config_decoded"
        fail_msg: "Redis configuration missing required settings"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

    - name: Assert problematic Redis configuration lines are removed
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in redis_config_decoded"
          - "'replica-read-only' not in redis_config_decoded"
          - "'repl-ping-replica-period' not in redis_config_decoded"
          - "'client-output-buffer-limit' not in redis_config_decoded"
          - "'replica-priority' not in redis_config_decoded"
        fail_msg: "Problematic Redis configuration lines still present"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

    - name: Get service facts
      ansible.builtin.service_facts:

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services or 'redis.service' in ansible_facts.services"
          - >-
            (ansible_facts.services['redis-server.service']['state'] == 'running' if 'redis-server.service' in ansible_facts.services
            else ansible_facts.services['redis.service']['state'] == 'running')
        fail_msg: "Redis service is not running"

    - name: Assert Memcached service is running
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - "ansible_facts.services['memcached.service']['state'] == 'running'"
        fail_msg: "Memcached service is not running"

    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 10
        msg: "Redis port 6379 is not listening"

    - name: Check Memcached port is listening
      ansible.builtin.wait_for:
        port: 11211
        host: 127.0.0.1
        timeout: 10
        msg: "Memcached port 11211 is not listening"

- name: Verify cache connectivity and functionality
  hosts: all
  gather_facts: false
  tasks:
    - name: Test Redis connectivity with authentication
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a {{ redis_password }} ping
      register: redis_ping_result
      changed_when: false
      failed_when: redis_ping_result.stdout != "PONG"

    - name: Test Redis set/get operations
      ansible.builtin.command:
        cmd: "{{ item_redis_cmd }}"
      loop:
        - redis-cli -p 6379 -a {{ redis_password }} set test_key "test_value"
        - redis-cli -p 6379 -a {{ redis_password }} get test_key
        - redis-cli -p 6379 -a {{ redis_password }} del test_key
      loop_control:
        loop_var: item_redis_cmd
      register: redis_ops_results
      changed_when: false

    - name: Assert Redis operations successful
      ansible.builtin.assert:
        that:
          - redis_ops_results['results'][0]['stdout'] == "OK"
          - redis_ops_results['results'][1]['stdout'] == "test_value"
          - redis_ops_results['results'][2]['stdout'] == "1"
        fail_msg: "Redis operations failed"

    - name: Test Memcached connectivity
      ansible.builtin.shell: |
        echo "stats" | nc localhost 11211 | head -1
      register: memcached_stats_result
      changed_when: false

    - name: Assert Memcached is responding
      ansible.builtin.assert:
        that:
          - "'STAT' in memcached_stats_result.stdout"
        fail_msg: "Memcached is not responding to stats command"