---
argument_specs:
  main:
    short_description: Install and configure Redis and Memcached cache services
    description:
      - Installs and configures Redis server with authentication
      - Installs and configures Memcached service
      - Creates necessary directories and users for cache services
      - Applies configuration fixes to remove problematic Redis settings
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for Redis server to listen on
      cache_redis_bind:
        type: str
        required: false
        default: 127.0.0.1
        description: IP address for Redis server to bind to
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory path for Redis log files
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/redis.conf
        description: Path to Redis configuration file
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: System user for Redis service
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: System group for Redis service
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: TCP port for Memcached server to listen on
      cache_memcached_bind:
        type: str
        required: false
        default: 127.0.0.1
        description: IP address for Memcached server to bind to
      cache_memcached_memory:
        type: int
        required: false
        default: 64
        description: Memory allocation for Memcached in MB
      cache_redis_package:
        type: str
        required: false
        default: redis-server (Debian) or redis (RedHat)
        description: Package name for Redis server (OS-dependent)
      cache_memcached_package:
        type: str
        required: false
        default: memcached
        description: Package name for Memcached
      cache_redis_service:
        type: str
        required: false
        default: redis-server (Debian) or redis (RedHat)
        description: Service name for Redis (OS-dependent)
      cache_memcached_service:
        type: str
        required: false
        default: memcached
        description: Service name for Memcached
      redis_password:
        type: str
        required: true
        description: Redis authentication password (injected by AAP credential type)
