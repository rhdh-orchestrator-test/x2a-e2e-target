---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Validate supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['RedHat', 'Debian']
    fail_msg: "Unsupported OS family: {{ ansible_facts['os_family'] }}. This role only supports RedHat and Debian families."
    quiet: true
  when: ansible_facts['os_family'] is defined

- name: Load operating system variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  when: ansible_facts['os_family'] is defined

- name: Discover Redis cluster nodes
  ansible.builtin.set_fact:
    profile_redis_cluster_nodes: "{{ groups['redis_cluster'] | default([]) }}"
  when: groups['redis_cluster'] is defined

- name: Include Redis installation tasks
  ansible.builtin.include_tasks: install.yml
