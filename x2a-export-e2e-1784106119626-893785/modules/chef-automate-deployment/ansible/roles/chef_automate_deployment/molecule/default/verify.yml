- name: Verify
  hosts: all
  gather_facts: false
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_username: jtonello
    chef_automate_orgname: lab
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Verify hostname content
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == chef_automate_hostname
      fail_msg: Hostname does not match expected value
      success_msg: Hostname is correctly set
    when: hostname_file.stat.exists
  - name: Check sysctl settings file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl settings file not found
      success_msg: Sysctl settings file exists
  - name: Get sysctl content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Verify sysctl content
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: Sysctl settings do not match expected values
      success_msg: Sysctl settings are correctly set
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.isreg
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate deployment marker
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: chef_automate_hab
  - name: Assert Chef Automate deployment marker exists
    ansible.builtin.assert:
      that:
      - chef_automate_hab.stat.exists
      - chef_automate_hab.stat.isdir
      fail_msg: Chef Automate deployment marker not found
      success_msg: Chef Automate deployment marker exists
  - name: Check user PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/{{ chef_automate_username }}.pem
    register: user_pem
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.isreg
      - user_pem.stat.mode == '0600'
      fail_msg: User PEM file not found or has incorrect permissions
      success_msg: User PEM file exists with correct permissions
  - name: Check organization validator PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/{{ chef_automate_orgname }}-validator.pem
    register: org_pem
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_pem.stat.exists
      - org_pem.stat.isreg
      - org_pem.stat.mode == '0600'
      fail_msg: Organization validator PEM file not found or has incorrect permissions
      success_msg: Organization validator PEM file exists with correct permissions
  - name: Check Chef server status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-server-status.txt
    register: chef_server_status
  - name: Assert Chef server status file exists
    ansible.builtin.assert:
      that:
      - chef_server_status.stat.exists
      - chef_server_status.stat.isreg
      fail_msg: Chef server status file not found
      success_msg: Chef server status file exists
  - name: Check Chef Automate status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate-status.txt
    register: chef_automate_status
  - name: Assert Chef Automate status file exists
    ansible.builtin.assert:
      that:
      - chef_automate_status.stat.exists
      - chef_automate_status.stat.isreg
      fail_msg: Chef Automate status file not found
      success_msg: Chef Automate status file exists
  - name: Check user list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-user-list.txt
    register: user_list
  - name: Assert user list file exists
    ansible.builtin.assert:
      that:
      - user_list.stat.exists
      - user_list.stat.isreg
      fail_msg: User list file not found
      success_msg: User list file exists
  - name: Get user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/chef-user-list.txt
    register: user_list_content
    when: user_list.stat.exists
  - name: Verify user list content
    ansible.builtin.assert:
      that:
      - chef_automate_username in (user_list_content.content | b64decode)
      fail_msg: User not found in user list
      success_msg: User found in user list
    when: user_list.stat.exists
  - name: Check organization list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-org-list.txt
    register: org_list
  - name: Assert organization list file exists
    ansible.builtin.assert:
      that:
      - org_list.stat.exists
      - org_list.stat.isreg
      fail_msg: Organization list file not found
      success_msg: Organization list file exists
  - name: Get organization list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/chef-org-list.txt
    register: org_list_content
    when: org_list.stat.exists
  - name: Verify organization list content
    ansible.builtin.assert:
      that:
      - chef_automate_orgname in (org_list_content.content | b64decode)
      fail_msg: Organization not found in organization list
      success_msg: Organization found in organization list
    when: org_list.stat.exists
  - name: Check web UI HTML file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate-login.html
    register: web_ui_html
  - name: Assert web UI HTML file exists
    ansible.builtin.assert:
      that:
      - web_ui_html.stat.exists
      - web_ui_html.stat.isreg
      fail_msg: Web UI HTML file not found
      success_msg: Web UI HTML file exists
  - name: Get web UI HTML content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/chef-automate-login.html
    register: web_ui_content
    when: web_ui_html.stat.exists
  - name: Verify web UI HTML content
    ansible.builtin.assert:
      that:
      - '''Chef Automate Login'' in (web_ui_content.content | b64decode)'
      - '''Log In'' in (web_ui_content.content | b64decode)'
      fail_msg: Web UI HTML content does not match expected content
      success_msg: Web UI HTML content matches expected content
    when: web_ui_html.stat.exists
  - name: Check Chef Automate service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      - ansible_facts.services['chef-automate.service'].state == 'running'
      fail_msg: Chef Automate service is not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check if port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    register: port_check
    ignore_errors: true
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is success
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
