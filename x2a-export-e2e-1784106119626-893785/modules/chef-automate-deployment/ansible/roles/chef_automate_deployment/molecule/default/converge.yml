---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/ansible

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl settings
    - name: Create sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = {{ chef_automate_vm_max_map_count }}
          vm.dirty_expire_centisecs = {{ chef_automate_vm_dirty_expire_centisecs }}
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.file:
        path: "/tmp/molecule_test/hab"
        state: directory
        mode: "0755"

    # Simulate user PEM file
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          EXAMPLE_PEM_CONTENT_FOR_USER
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/ansible/{{ chef_automate_userfilename }}"
        mode: "0600"

    # Simulate organization validator PEM file
    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          EXAMPLE_PEM_CONTENT_FOR_ORG_VALIDATOR
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/home/ansible/{{ chef_automate_orgfilename }}"
        mode: "0600"

    # Simulate Chef server status output
    - name: Create Chef server status file
      ansible.builtin.copy:
        content: |
          run: service_name: running
          postgresql: running
          nginx: running
          oc_bifrost: running
          oc_id: running
          bookshelf: running
          opscode-erchef: running
          opscode-solr4: running
          opscode-expander: running
          opscode-chef-mover: running
        dest: "/tmp/molecule_test/etc/chef-server-status.txt"
        mode: "0644"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-cs-bookshelf      Status: running
          Service: automate-cs-oc-bifrost     Status: running
          Service: automate-cs-oc-erchef      Status: running
          Service: automate-cs-nginx          Status: running
          Service: automate-gateway           Status: running
          Service: automate-postgresql        Status: running
          Service: automate-elasticsearch     Status: running
        dest: "/tmp/molecule_test/etc/chef-automate-status.txt"
        mode: "0644"

    # Simulate user list output
    - name: Create user list file
      ansible.builtin.copy:
        content: "{{ chef_automate_username }}"
        dest: "/tmp/molecule_test/etc/chef-user-list.txt"
        mode: "0644"

    # Simulate organization list output
    - name: Create organization list file
      ansible.builtin.copy:
        content: "{{ chef_automate_orgname }}"
        dest: "/tmp/molecule_test/etc/chef-org-list.txt"
        mode: "0644"

    # Simulate web UI access
    - name: Create mock web UI HTML
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>Chef Automate Login</title>
          </head>
          <body>
            <h1>Chef Automate</h1>
            <form id="login-form">
              <input type="text" placeholder="Username">
              <input type="password" placeholder="Password">
              <button type="submit">Log In</button>
            </form>
          </body>
          </html>
        dest: "/tmp/molecule_test/etc/chef-automate-login.html"
        mode: "0644"

    # Simulate systemd service file
    - name: Create systemd service file for Chef Automate
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Automate
          After=network.target

          [Service]
          Type=simple
          ExecStart=/hab/bin/chef-automate-ctl start
          ExecStop=/hab/bin/chef-automate-ctl stop
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: "/tmp/molecule_test/etc/systemd/system/chef-automate.service"
        mode: "0644"

    # Simulate network ports listening
    - name: Create netstat output file
      ansible.builtin.copy:
        content: |
          tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/nginx
          tcp6       0      0 :::443                  :::*                    LISTEN      1234/nginx
        dest: "/tmp/molecule_test/etc/netstat-output.txt"
        mode: "0644"