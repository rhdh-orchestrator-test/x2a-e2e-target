---
# FLPATH-3351-TC-07-RULE
argument_specs:
  main:
    short_description: Manages API credentials configuration file
    description:
      - Creates a configuration file containing API endpoint information and credentials
      - Sets secure file permissions (0600) with root ownership
    options:
      endpoint:
        type: str
        required: false
        default: https://example.test/api
        description: API endpoint URL
      username:
        type: str
        required: false
        default: fixture-user
        description: API username for authentication
      api_token:
        type: str
        required: true
        description: API authentication token injected by AAP credential type
      chef_flpath_4648_credentials_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to enable secure logging for sensitive variables
