---
controller_credential_types:
  - name: API Configuration and Token
    description: Credential type for API Configuration and Token
    kind: cloud
    inputs:
      fields:
        - id: endpoint
          type: string
          label: API Endpoint
          help_text: URL of the API endpoint
        - id: username
          type: string
          label: Username
          help_text: Username for API authentication
        - id: api_token
          type: string
          label: API Token
          secret: true
          help_text: Authentication token for API access
      required:
        - api_token
    injectors:
      extra_vars:
        endpoint: !unsafe "{{ endpoint }}"
        username: !unsafe "{{ username }}"
        api_token: !unsafe "{{ api_token }}"
