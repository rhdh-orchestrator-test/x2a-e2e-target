---
controller_credential_types:
  - name: Redis Authentication
    description: Credential for authenticating clients to the Redis cache instance on TCP port 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_requirepass
          type: string
          label: Redis Requirepass
          secret: true
          help_text: Password configured as Redis requirepass for client authentication.
      required:
        - redis_requirepass
    injectors:
      extra_vars:
        redis_requirepass: !unsafe "{{ redis_requirepass }}"
