---
- name: Install Apache web server
  ansible.builtin.package:
    name: apache2
    state: present
  become: true # noqa: R108 - package installation requires root privileges

- name: Enable Apache SSL module
  ansible.builtin.command:
    cmd: a2enmod ssl
    creates: /etc/apache2/mods-enabled/ssl.conf
  become: true # noqa: R108 - enabling Apache modules requires root privileges
  notify:
    - Restart apache2

- name: Fix SSL in Apache
  ansible.builtin.replace:
    path: "{{ poodle_fix_apache_config_path }}" # noqa: R114 - path from role defaults, not user input
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol {{ poodle_fix_apache_ssl_protocol }}
    backup: true
  when: poodle_fix_restart_services | bool
  notify:
    - Restart apache2
  become: true # noqa: R108 - modifying system configuration files requires root privileges
