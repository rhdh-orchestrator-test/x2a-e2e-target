---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create the directory structure that would be created by Redis installation
    - name: Create Redis directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/run/redis

    # Create a mock Redis configuration file
    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          port 6379
          bind 127.0.0.1
          dir /var/lib/redis
          logfile /var/log/redis/redis-server.log
          pidfile /var/run/redis/redis-server.pid
          maxmemory-policy allkeys-lru
        dest: /tmp/molecule_test/etc/redis/redis.conf
        mode: "0644"

    # Create a mock Redis log file
    - name: Create Redis log file
      ansible.builtin.copy:
        content: |
          # Redis server log
          1:M 01 Jan 2023 00:00:00.000 * Redis 6.0.16 (00000000/0) 64 bit, standalone mode, port 6379
          1:M 01 Jan 2023 00:00:00.000 * Server initialized
          1:M 01 Jan 2023 00:00:00.000 * Ready to accept connections
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"

    # Create a mock Redis PID file
    - name: Create Redis PID file
      ansible.builtin.copy:
        content: "12345"
        dest: /tmp/molecule_test/var/run/redis/redis-server.pid
        mode: "0644"

    # Create a mock Redis socket file (empty file to represent the socket)
    - name: Create Redis socket file
      ansible.builtin.file:
        path: /tmp/molecule_test/var/run/redis/redis-server.sock
        state: touch
        mode: "0644"