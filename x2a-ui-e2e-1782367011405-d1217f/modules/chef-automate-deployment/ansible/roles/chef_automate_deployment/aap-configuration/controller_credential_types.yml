---
controller_credential_types:
- name: Chef User Authentication
  description: Credential type for Chef User Authentication
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Chef Username
      help_text: Username for the Chef user created during deployment
    - id: password
      type: string
      label: Chef User Password
      secret: true
      help_text: Password for authenticating to Chef Automate and Chef Infra Server
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the Chef user
    - id: email
      type: string
      label: Email Address
      help_text: Email address for the Chef user
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
- name: Chef Organization Configuration
  description: Credential type for Chef Organization Configuration
  kind: cloud
  inputs:
    fields:
    - id: short_name
      type: string
      label: Organization Short Name
      help_text: Short name identifier for the Chef organization
    - id: full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name for the Chef organization
    required:
    - short_name
    - full_name
  injectors:
    extra_vars:
      short_name: !unsafe '{{ short_name }}'
      full_name: !unsafe '{{ full_name }}'
