---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: chef_automate_cli_stat
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
  when: not chef_automate_cli_stat.stat.exists
  args:
    creates: "{{ chef_automate_cli_path }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: "sudo ./chef-automate deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa
      | lower }} "
    creates: /hab
  register: chef_automate_deploy
  changed_when: chef_automate_deploy.rc == 0
- name: Wait for Chef Automate services to be ready
  ansible.builtin.pause:
    seconds: 30
  when: chef_automate_deploy.changed
