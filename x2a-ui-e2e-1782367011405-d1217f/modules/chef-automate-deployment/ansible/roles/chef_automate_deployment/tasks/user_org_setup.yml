---
- name: Check if Chef Server is installed
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl_stat
  failed_when: not chef_server_ctl_stat.stat.exists
  changed_when: false
- name: Create Chef user
  ansible.builtin.command:
    cmd: sudo chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ chef_automate_user_filename }}
  args:
    creates: "{{ chef_automate_user_filename }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: sudo chef-server-ctl org-create {{ short_name }} "{{ full_name }}" --association_user {{ username }} --filename {{ chef_automate_org_filename }}
  args:
    creates: "{{ chef_automate_org_filename }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
- name: Set permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_automate_user_filename }}"
    mode: "0600"
    state: file
  when: chef_user_create.changed
- name: Set permissions on organization validator key file
  ansible.builtin.file:
    path: "{{ chef_automate_org_filename }}"
    mode: "0600"
    state: file
  when: chef_org_create.changed
