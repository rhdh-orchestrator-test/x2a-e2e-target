- name: Converge
  hosts: all
  gather_facts: true
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_cli_path: /tmp/molecule_test/home/ansible/chef-automate
    username: jtonello
    short_name: lab
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/home/ansible
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create hosts file
    ansible.builtin.copy:
      content: '127.0.0.1 localhost

        127.0.1.1 automate.chef.lab

        '
      dest: /tmp/molecule_test/etc/hosts
      mode: '0644'
  - name: Create vm.max_map_count file
    ansible.builtin.copy:
      content: '262144'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create vm.dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '20000'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI'''
      dest: /tmp/molecule_test/home/ansible/chef-automate
      mode: '0755'
  - name: Create Chef Automate CLI zip file
    ansible.builtin.copy:
      content: Chef Automate CLI zip content
      dest: /tmp/molecule_test/home/ansible/chef-automate.zip
      mode: '0644'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_KEY_CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/home/ansible/jtonello.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_VALIDATOR_KEY_CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/home/ansible/lab-validator.pem
      mode: '0600'
