---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check hosts file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hosts
      register: hosts_file

    - name: Assert hosts file was created
      ansible.builtin.assert:
        that:
          - hosts_file.stat.exists
          - hosts_file.stat.isreg
        fail_msg: "Hosts file not found"
        success_msg: "Hosts file exists"

    # Kernel parameter checks
    - name: Check vm.max_map_count file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_file

    - name: Assert vm.max_map_count file was created
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
          - max_map_count_file.stat.isreg
        fail_msg: "vm.max_map_count file not found"
        success_msg: "vm.max_map_count file exists"

    - name: Get vm.max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "262144"
        fail_msg: "vm.max_map_count not set correctly"
        success_msg: "vm.max_map_count set correctly"
      when: max_map_count_file.stat.exists

    - name: Check vm.dirty_expire_centisecs file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_file

    - name: Assert vm.dirty_expire_centisecs file was created
      ansible.builtin.assert:
        that:
          - dirty_expire_centisecs_file.stat.exists
          - dirty_expire_centisecs_file.stat.isreg
        fail_msg: "vm.dirty_expire_centisecs file not found"
        success_msg: "vm.dirty_expire_centisecs file exists"

    - name: Get vm.dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_content
      when: dirty_expire_centisecs_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
        fail_msg: "vm.dirty_expire_centisecs not set correctly"
        success_msg: "vm.dirty_expire_centisecs set correctly"
      when: dirty_expire_centisecs_file.stat.exists

    # Chef Automate CLI checks
    - name: Check Chef Automate CLI file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/chef-automate
      register: chef_automate_cli_file

    - name: Assert Chef Automate CLI file was created
      ansible.builtin.assert:
        that:
          - chef_automate_cli_file.stat.exists
          - chef_automate_cli_file.stat.isreg
          - chef_automate_cli_file.stat.executable
        fail_msg: "Chef Automate CLI file not found or not executable"
        success_msg: "Chef Automate CLI file exists and is executable"

    # PEM file checks
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/jtonello.pem
      register: user_pem_file

    - name: Assert user PEM file was created
      ansible.builtin.assert:
        that:
          - user_pem_file.stat.exists
          - user_pem_file.stat.isreg
          - user_pem_file.stat.mode == "0600"
        fail_msg: "User PEM file not found or has incorrect permissions"
        success_msg: "User PEM file exists with correct permissions"

    - name: Check organization validator PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/lab-validator.pem
      register: org_validator_pem_file

    - name: Assert organization validator PEM file was created
      ansible.builtin.assert:
        that:
          - org_validator_pem_file.stat.exists
          - org_validator_pem_file.stat.isreg
          - org_validator_pem_file.stat.mode == "0600"
        fail_msg: "Organization validator PEM file not found or has incorrect permissions"
        success_msg: "Organization validator PEM file exists with correct permissions"

    # Chef Automate status check (cannot run in container)
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: chef_automate_status
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    # Chef Server status check (cannot run in container)
    - name: Check Chef Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Server is not running"
        success_msg: "Chef Server is running"
      tags: molecule-notest

    # User verification (cannot run in container)
    - name: Check Chef user exists
      ansible.builtin.command:
        cmd: sudo chef-server-ctl user-list
      register: chef_user_list
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef user exists
      ansible.builtin.assert:
        that:
          - "'jtonello' in chef_user_list.stdout"
        fail_msg: "Chef user 'jtonello' not found"
        success_msg: "Chef user 'jtonello' exists"
      tags: molecule-notest

    # Organization verification (cannot run in container)
    - name: Check Chef organization exists
      ansible.builtin.command:
        cmd: sudo chef-server-ctl org-list
      register: chef_org_list
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef organization exists
      ansible.builtin.assert:
        that:
          - "'lab' in chef_org_list.stdout"
        fail_msg: "Chef organization 'lab' not found"
        success_msg: "Chef organization 'lab' exists"
      tags: molecule-notest

    # Network listening check (cannot run in container)
    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # Web UI access check (cannot run in container)
    - name: Check Web UI access
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
        status_code: 200
      register: web_ui_check
      failed_when: false
      tags: molecule-notest

    - name: Assert Web UI is accessible
      ansible.builtin.assert:
        that:
          - web_ui_check is succeeded
        fail_msg: "Web UI is not accessible"
        success_msg: "Web UI is accessible"
      tags: molecule-notest