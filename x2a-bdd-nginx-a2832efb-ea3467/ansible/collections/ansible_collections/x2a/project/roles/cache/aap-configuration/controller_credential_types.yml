---
controller_credential_types:
  - name: Redis Authentication
    description: Credential for authenticating clients to the Redis instance on TCP port 6379. The source password is hardcoded in the Chef recipe and must be 
      moved to Ansible Vault or an approved external secrets provider.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis clients to authenticate to the instance listening on TCP port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
