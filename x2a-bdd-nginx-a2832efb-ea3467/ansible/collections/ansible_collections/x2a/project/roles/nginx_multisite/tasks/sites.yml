---
- name: Ensure nginx site directories exist
  ansible.builtin.file:
    path: "{{ item_site_dir }}" # noqa: R114 - fixed role-managed nginx directory
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
  loop_control:
    loop_var: item_site_dir

- name: Render nginx virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_site['key'] }} # noqa: R114 - filename from role-defined sites dictionary
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Reload nginx
  vars:
    server_name: "{{ item_site['key'] }}"
    document_root: "{{ item_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_site['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_certificate_path }}/{{ item_site['key'] }}.crt"
    key_file: "{{ nginx_multisite_private_key_path }}/{{ item_site['key'] }}.key"

- name: Enable nginx virtual hosts
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_enabled_site['key'] }} # noqa: R114 - source from role-defined sites dictionary
    dest: /etc/nginx/sites-enabled/{{ item_enabled_site['key'] }} # noqa: R114 - destination from role-defined sites dictionary
    state: link
    force: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_enabled_site
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
