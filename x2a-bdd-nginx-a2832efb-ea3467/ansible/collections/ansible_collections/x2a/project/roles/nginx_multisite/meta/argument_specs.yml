---
argument_specs:
  main:
    short_description: Configure a hardened nginx multisite HTTPS server
    description:
      - Installs and configures nginx, fail2ban, UFW, SSH hardening, TLS certificates, and three HTTPS sites.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Site names and document-root settings.
        options:
          document_root:
            type: str
            required: true
            description: Filesystem path served by the site.
          ssl_enabled:
            type: bool
            required: true
            description: Whether the site uses HTTPS.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban jail configuration is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW rules are applied and enabled.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is permitted.
