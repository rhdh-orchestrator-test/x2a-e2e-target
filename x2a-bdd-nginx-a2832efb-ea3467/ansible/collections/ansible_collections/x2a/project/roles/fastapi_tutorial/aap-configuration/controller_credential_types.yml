---
controller_credential_types:
  - name: PostgreSQL Application Database
    description: Credentials and connection settings for the FastAPI application's local PostgreSQL database. The source values are hardcoded in the Chef recipe
      and should be migrated to protected AAP credential storage or Ansible Vault.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: "PostgreSQL role used by the FastAPI application: fastapi."
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role.
        - id: database_name
          type: string
          label: Database Name
          help_text: "PostgreSQL database used by the application: fastapi_db."
        - id: database_host
          type: string
          label: Database Host
          help_text: Host where PostgreSQL is running, specified as localhost.
        - id: database_url
          type: string
          label: Database Connection URL
          secret: true
          help_text: Application DATABASE_URL connection string for PostgreSQL; contains the database password and should be protected.
      required:
        - database_username
        - database_password
        - database_name
        - database_host
        - database_url
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
        database_url: !unsafe "{{ database_url }}"
