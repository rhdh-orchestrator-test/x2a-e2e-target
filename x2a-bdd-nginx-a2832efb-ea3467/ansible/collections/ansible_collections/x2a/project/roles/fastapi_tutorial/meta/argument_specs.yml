---
argument_specs:
  main:
    short_description: Deploy the FastAPI tutorial application and PostgreSQL database.
    description:
      - Installs the application prerequisites, checks out the FastAPI tutorial source, and runs it with systemd.
      - Creates the PostgreSQL application database and renders the application environment configuration.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Filesystem path where the application is deployed.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Path to the Python virtual environment.
      fastapi_tutorial_app_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by the FastAPI service.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Application project name written to the environment file.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: Application API version written to the environment file.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name for the application.
      fastapi_tutorial_service_file:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Path to the systemd unit file.
      fastapi_tutorial_database_user:
        type: str
        required: false
        default: "{{ database_username }}"
        description: PostgreSQL username supplied by the AAP credential.
      fastapi_tutorial_database_name:
        type: str
        required: false
        default: "{{ database_name }}"
        description: PostgreSQL database name supplied by the AAP credential.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: "{{ database_host }}"
        description: PostgreSQL host supplied by the AAP credential.
      fastapi_tutorial_database_url:
        type: str
        required: false
        default: "{{ database_url }}"
        description: PostgreSQL connection URL supplied by the AAP credential.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output when handling database credentials.
