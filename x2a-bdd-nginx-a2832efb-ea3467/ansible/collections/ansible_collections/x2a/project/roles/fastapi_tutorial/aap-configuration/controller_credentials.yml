---
controller_credentials:
  - name: PostgreSQL Application Database - fastapi_tutorial
    description: Credentials and connection settings for the FastAPI application's local PostgreSQL database. The source values are hardcoded in the Chef recipe
      and should be migrated to protected AAP credential storage or Ansible Vault.
    organization: Default
    credential_type: PostgreSQL Application Database
    update_secrets: true
    inputs:
      database_username: "{{ database_username }}"
      database_password: "{{ vault_database_password }}"
      database_name: "{{ database_name }}"
      database_host: "{{ database_host }}"
      database_url: "{{ vault_database_url }}"
