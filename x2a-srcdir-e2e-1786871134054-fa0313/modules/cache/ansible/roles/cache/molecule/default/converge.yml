- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected Redis directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/run/redis
  - name: Simulate redis package installation
    ansible.builtin.debug:
      msg: Redis package would be installed here
  - name: Create mock Redis configuration file
    ansible.builtin.template:
      src: redis.conf.j2
      dest: /tmp/molecule_test/etc/redis/redis.conf
      mode: '0644'
    vars:
      redis_port: 6379
      redis_bind_address: 127.0.0.1
  - name: Create mock Redis log file
    ansible.builtin.copy:
      content: '# Redis server log

        1:M 01 Jan 2023 00:00:00.000 * Ready to accept connections

        '
      dest: /tmp/molecule_test/var/log/redis/redis-server.log
      mode: '0644'
  - name: Create mock Redis PID file
    ansible.builtin.copy:
      content: '12345'
      dest: /tmp/molecule_test/var/run/redis/redis-server.pid
      mode: '0644'
  - name: Simulate redis service start
    ansible.builtin.debug:
      msg: Redis service would be started here
