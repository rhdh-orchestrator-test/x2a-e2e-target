- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: admin
    user_password: Password123!
    user_full_name: Admin User
    user_email: admin@example.com
    organization_name: chef
    organization_full_name: Chef Organization
    chef_automate_cli_path: /tmp/molecule_test/usr/bin/chef-automate
    chef_automate_user_key_path: /tmp/molecule_test/admin.pem
    chef_automate_org_key_path: /tmp/molecule_test/chef-validator.pem
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/opscode
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/opscode
    - /tmp/molecule_test/usr/bin
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "# Chef Automate configuration file\n[global]\n  v1 = true\n[deployment]\n  automate = \"enabled\"\n  infra_server = \"enabled\"\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create Chef Infra Server pivotal key
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/etc/opscode/pivotal.pem
      mode: '0600'
  - name: Create Chef Automate CLI binary
    ansible.builtin.copy:
      content: '#!/bin/sh

        echo "Chef Automate CLI mock"

        exit 0

        '
      dest: /tmp/molecule_test/usr/bin/chef-automate
      mode: '0755'
  - name: Create Chef Server CLI binary
    ansible.builtin.copy:
      content: '#!/bin/sh

        echo "Chef Server CLI mock"

        exit 0

        '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/admin.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/chef-validator.pem
      mode: '0600'
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '# Chef Automate sysctl settings

        vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
