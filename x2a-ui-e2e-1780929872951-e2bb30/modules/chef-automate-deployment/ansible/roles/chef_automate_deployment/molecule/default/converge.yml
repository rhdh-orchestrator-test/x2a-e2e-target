---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directories that would be created by the role
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/ansible
        - /tmp/molecule_test/tmp

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl parameters
    - name: Create sysctl.conf file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.conf"
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI'"
        dest: "/tmp/molecule_test/tmp/chef-automate"
        mode: "0755"

    # Simulate Chef Automate CLI zip file
    - name: Create Chef Automate CLI zip file
      ansible.builtin.copy:
        content: "Chef Automate CLI zip content"
        dest: "/tmp/molecule_test/tmp/chef-automate.zip"
        mode: "0644"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA...\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/home/ansible/admin.pem"
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA...\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/home/ansible/chef-org-validator.pem"
        mode: "0600"

    # Simulate Chef server user list output
    - name: Create Chef server user list file
      ansible.builtin.copy:
        content: "admin"
        dest: "/tmp/molecule_test/tmp/chef-server-user-list"
        mode: "0644"

    # Simulate Chef server org list output
    - name: Create Chef server org list file
      ansible.builtin.copy:
        content: "chef-org"
        dest: "/tmp/molecule_test/tmp/chef-server-org-list"
        mode: "0644"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: "Service: deployment-service\nStatus: running\n\nService: automate-postgresql\nStatus: running"
        dest: "/tmp/molecule_test/tmp/chef-automate-status"
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: "run: chef-server: (pid 12345) 300s; run: log: (pid 12346) 300s"
        dest: "/tmp/molecule_test/tmp/chef-server-status"
        mode: "0644"