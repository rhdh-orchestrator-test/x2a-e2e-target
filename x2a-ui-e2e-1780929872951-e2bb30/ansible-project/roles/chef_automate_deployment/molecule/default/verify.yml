- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl configuration file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.conf
    register: sysctl_file
  - name: Assert sysctl file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl configuration file not found
      success_msg: Sysctl configuration file exists
  - name: Get sysctl content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl parameters are set correctly
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: Sysctl parameters not set correctly
      success_msg: Sysctl parameters set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.isreg
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/admin.pem
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.isreg
      - user_key_file.stat.mode == "0600"
      fail_msg: User key file not found or has incorrect permissions
      success_msg: User key file exists with correct permissions
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/ansible/chef-org-validator.pem
    register: org_key_file
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.isreg
      - org_key_file.stat.mode == "0600"
      fail_msg: Organization validator key file not found or has incorrect permissions
      success_msg: Organization validator key file exists with correct permissions
  - name: Check Chef Automate status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate-status
    register: chef_automate_status_file
    tags: molecule-notest
  - name: Get Chef Automate status content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/tmp/chef-automate-status
    register: chef_automate_status_content
    when: chef_automate_status_file.stat.exists
    tags: molecule-notest
  - name: Assert Chef Automate services are running
    ansible.builtin.assert:
      that:
      - '''Status: running'' in (chef_automate_status_content.content | b64decode)'
      fail_msg: Chef Automate services not running
      success_msg: Chef Automate services are running
    when: chef_automate_status_file.stat.exists
    tags: molecule-notest
  - name: Check Chef Server status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-server-status
    register: chef_server_status_file
    tags: molecule-notest
  - name: Get Chef Server status content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/tmp/chef-server-status
    register: chef_server_status_content
    when: chef_server_status_file.stat.exists
    tags: molecule-notest
  - name: Assert Chef Server is running
    ansible.builtin.assert:
      that:
      - '''run: chef-server:'' in (chef_server_status_content.content | b64decode)'
      fail_msg: Chef Server not running
      success_msg: Chef Server is running
    when: chef_server_status_file.stat.exists
    tags: molecule-notest
  - name: Check Chef Automate API port
    ansible.builtin.wait_for:
      port: 443
      host: localhost
      state: started
      timeout: 1
    ignore_errors: true
    register: port_check
    tags: molecule-notest
  - name: Assert Chef Automate API port is listening
    ansible.builtin.assert:
      that:
      - port_check is success
      fail_msg: Chef Automate API port not listening
      success_msg: Chef Automate API port is listening
    when: port_check is defined
    tags: molecule-notest
