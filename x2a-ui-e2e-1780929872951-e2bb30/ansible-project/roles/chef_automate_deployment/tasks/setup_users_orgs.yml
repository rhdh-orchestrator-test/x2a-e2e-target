---
- name: Ensure home directory exists for key files
  ansible.builtin.file:
    path: "{{ chef_user_key_path | dirname }}"
    state: directory
    mode: "0700"
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ chef_user_key_path }}
  become: true
  args:
    creates: "{{ chef_user_key_path }}"
  register: create_user
  changed_when: create_user.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ org_name }} "{{ org_full_name }}" --association_user {{ username }} --filename {{ chef_org_validator_key_path }}
  become: true
  args:
    creates: "{{ chef_org_validator_key_path }}"
  register: create_org
  changed_when: create_org.rc == 0
- name: Set permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_user_key_path }}"
    mode: "0600"
    state: file
  when: create_user.changed
- name: Set permissions on organization validator key file
  ansible.builtin.file:
    path: "{{ chef_org_validator_key_path }}"
    mode: "0600"
    state: file
  when: create_org.changed
