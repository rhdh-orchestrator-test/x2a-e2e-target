---
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_username }} {{ chef_user_fullname }} {{ chef_user_email }} "{{ password }}" --filename {{ chef_user_key_file }}
  args:
    creates: "{{ chef_user_key_file }}"
  become: true
  no_log: true
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_fullname }}" --association_user {{ chef_username }} --filename {{ chef_org_validator_file
      }}
  args:
    creates: "{{ chef_org_validator_file }}"
  become: true
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
