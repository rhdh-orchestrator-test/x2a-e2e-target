- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    orgname: lab
    userfilename: '{{ username }}.pem'
    orgfilename: '{{ orgname }}-validator.pem'
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/etc/sysctl.d
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '# Managed by Ansible

        vm.max_map_count = 262144

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "# Chef Automate configuration\n[global]\n  fqdn = \"automate.chef.lab\"\n[deployment]\n  products = [\"automate\", \"infra-server\"]\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create Chef Automate CLI binary file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI'''
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA...

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ userfilename }}
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA...

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ orgfilename }}
      mode: '0600'
