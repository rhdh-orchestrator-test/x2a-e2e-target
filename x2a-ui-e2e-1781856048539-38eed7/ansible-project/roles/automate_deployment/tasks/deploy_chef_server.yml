---
- name: Include system configuration tasks
  ansible.builtin.include_tasks: system_config.yml
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_download_dir }}/chef-automate_linux_amd64.zip"
    mode: "0644"
  register: download_result
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_download_dir }}/{{ chef_automate_binary }}"
  register: automate_cli_stat
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_download_dir }}/chef-automate_linux_amd64.zip > {{ chef_automate_download_dir }}/{{ chef_automate_binary }}
  args:
    creates: "{{ chef_automate_download_dir }}/{{ chef_automate_binary }}"
  when: download_result is changed or not automate_cli_stat.stat.exists
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_download_dir }}/{{ chef_automate_binary }}"
    mode: "0755"
    state: file
  when: download_result is changed or not automate_cli_stat.stat.exists
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: ./{{ chef_automate_binary }} deploy --product infra-server --accept-terms-and-mlsa={{ accept_terms_and_mlsa | lower }}
    chdir: "{{ chef_automate_download_dir }}"
  args:
    creates: /etc/chef-automate/config.toml
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}"  --filename {{ userfilename }}

      '
  args:
    creates: "{{ userfilename }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ orgname }} "{{ longorgname }}"  --association_user {{ username }} --filename {{ orgfilename }}

      '
  args:
    creates: "{{ orgfilename }}"
  become: true
