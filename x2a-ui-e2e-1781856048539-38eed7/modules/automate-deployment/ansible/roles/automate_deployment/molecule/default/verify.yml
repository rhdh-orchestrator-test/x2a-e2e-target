- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    orgname: lab
    userfilename: '{{ username }}.pem'
    orgfilename: '{{ orgname }}-validator.pem'
  tasks:
  - name: Check hostname configuration
    ansible.builtin.command:
      cmd: hostname
    register: hostname_result
    changed_when: false
    tags: molecule-notest
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - '''automate.chef.lab'' in hostname_result.stdout'
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    tags: molecule-notest
  - name: Check sysctl configuration file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl configuration file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Sysctl configuration file not found
      success_msg: Sysctl configuration file exists
  - name: Get sysctl configuration file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl configuration contains expected values
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      fail_msg: Sysctl configuration does not contain expected values
      success_msg: Sysctl configuration contains expected values
    when: sysctl_file.stat.exists
  - name: Check Chef Automate config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: automate_config_file
  - name: Assert Chef Automate config file exists
    ansible.builtin.assert:
      that:
      - automate_config_file.stat.exists
      - automate_config_file.stat.size > 0
      fail_msg: Chef Automate config file not found
      success_msg: Chef Automate config file exists
  - name: Get Chef Automate config file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/chef-automate/config.toml
    register: automate_config_content
    when: automate_config_file.stat.exists
  - name: Assert Chef Automate config contains expected values
    ansible.builtin.assert:
      that:
      - '''fqdn = "automate.chef.lab"'' in (automate_config_content.content | b64decode)'
      - '''products = ["automate", "infra-server"]'' in (automate_config_content.content | b64decode)'
      fail_msg: Chef Automate config does not contain expected values
      success_msg: Chef Automate config contains expected values
    when: automate_config_file.stat.exists
  - name: Check Chef Automate CLI binary exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: automate_cli_file
  - name: Assert Chef Automate CLI binary exists and is executable
    ansible.builtin.assert:
      that:
      - automate_cli_file.stat.exists
      - automate_cli_file.stat.executable
      fail_msg: Chef Automate CLI binary not found or not executable
      success_msg: Chef Automate CLI binary exists and is executable
  - name: Check user key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ userfilename }}
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.size > 0
      fail_msg: User key file not found
      success_msg: User key file exists
  - name: Check organization validator key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ orgfilename }}
    register: org_key_file
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.size > 0
      fail_msg: Organization validator key file not found
      success_msg: Organization validator key file exists
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: automate_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - '''running'' in automate_status.stdout'
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: chef_server_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - '''run'' in chef_server_status.stdout'
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Check Chef user exists
    ansible.builtin.command:
      cmd: sudo chef-server-ctl user-list
    register: user_list
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef user exists
    ansible.builtin.assert:
      that:
      - '''{{ username }}'' in user_list.stdout'
      fail_msg: Chef user not found
      success_msg: Chef user exists
    tags: molecule-notest
  - name: Check Chef organization exists
    ansible.builtin.command:
      cmd: sudo chef-server-ctl org-list
    register: org_list
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef organization exists
    ansible.builtin.assert:
      that:
      - '''{{ orgname }}'' in org_list.stdout'
      fail_msg: Chef organization not found
      success_msg: Chef organization exists
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
  - name: Check Chef Automate API status
    ansible.builtin.uri:
      url: https://localhost/api/v0/status
      validate_certs: false
    register: api_status
    tags: molecule-notest
  - name: Assert Chef Automate API is accessible
    ansible.builtin.assert:
      that:
      - api_status.status == 200
      fail_msg: Chef Automate API is not accessible
      success_msg: Chef Automate API is accessible
    tags: molecule-notest
