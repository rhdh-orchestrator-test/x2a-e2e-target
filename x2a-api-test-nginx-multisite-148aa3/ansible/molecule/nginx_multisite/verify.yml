---
# Unsupported: command output details, sysctl contents, certificate subject/date values,
# and journal/error-log output have no stated expected outcome.
- name: Verify nginx-multisite pre-flight checks
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify required packages are installed
      ansible.builtin.assert:
        that: item_package in ansible_facts['packages']
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify nginx and fail2ban are enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services'][item_service]['status'] == 'enabled'
          - ansible_facts['services'][item_service]['state'] == 'running'
      loop:
        - nginx.service
        - fail2ban.service
      loop_control:
        loop_var: item_service

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv: [nginx, -t]
      register: nginx_config_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that: nginx_config_test['rc'] == 0

    - name: Validate fail2ban responsiveness
      ansible.builtin.command:
        argv: [fail2ban-client, ping]
      register: fail2ban_ping
      changed_when: false

    - name: Assert fail2ban responds
      ansible.builtin.assert:
        that: fail2ban_ping['rc'] == 0

    - name: Validate fail2ban status
      ansible.builtin.command:
        argv: [fail2ban-client, status]
      register: fail2ban_status
      changed_when: false

    - name: Assert fail2ban status is available
      ansible.builtin.assert:
        that: fail2ban_status['rc'] == 0

    - name: Read firewall status
      ansible.builtin.command:
        argv: [ufw, status]
      register: firewall_status
      changed_when: false

    - name: Verify firewall allows SSH, HTTP, and HTTPS
      ansible.builtin.assert:
        that:
          - firewall_status['rc'] == 0
          - firewall_status['stdout'] is search('22|80|443')

    - name: Verify SSH hardening directives are present
      ansible.builtin.command:
        argv: [grep, -nE, PermitRootLogin|PasswordAuthentication, /etc/ssh/sshd_config]
      register: ssh_hardening
      changed_when: false

    - name: Assert SSH hardening directives were found
      ansible.builtin.assert:
        that: ssh_hardening['rc'] == 0

    - name: Validate configured sysctl values
      ansible.builtin.command:
        argv: [sysctl, -p, /etc/sysctl.d/99-security.conf]
      register: sysctl_validation
      changed_when: false

    - name: Assert sysctl configuration applies successfully
      ansible.builtin.assert:
        that: sysctl_validation['rc'] == 0

    - name: Verify base nginx configuration files exist
      ansible.builtin.stat:
        path: "{{ item_nginx_config }}"
      register: nginx_config_files
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
      loop_control:
        loop_var: item_nginx_config

    - name: Assert base nginx configuration files are regular files
      ansible.builtin.assert:
        that: item_nginx_file['stat']['isreg']
      loop: "{{ nginx_config_files['results'] }}"
      loop_control:
        loop_var: item_nginx_file

    - name: Verify nginx base configuration directives
      ansible.builtin.command:
        argv: [grep, -nE, listen|server_name|include, /etc/nginx/nginx.conf]
      register: nginx_base_directives
      changed_when: false

    - name: Assert nginx base directives are present
      ansible.builtin.assert:
        that: nginx_base_directives['rc'] == 0

    - name: Verify nginx security configuration directives
      ansible.builtin.command:
        argv: [grep, -nE, listen|server_name|ssl|security, /etc/nginx/conf.d/security.conf]
      register: nginx_security_directives
      changed_when: false

    - name: Assert nginx security directives are present
      ansible.builtin.assert:
        that: nginx_security_directives['rc'] == 0

    - name: Verify nginx secret directory and token
      ansible.builtin.stat:
        path: "{{ item_secret_path }}"
      register: nginx_secret_paths
      loop:
        - /etc/nginx/secrets
        - /etc/nginx/secrets/site_token
      loop_control:
        loop_var: item_secret_path

    - name: Assert nginx secret directory and token exist
      ansible.builtin.assert:
        that: item_secret_result['stat']['exists']
      loop: "{{ nginx_secret_paths['results'] }}"
      loop_control:
        loop_var: item_secret_result

    - name: Verify site token permissions and ownership
      ansible.builtin.stat:
        path: /etc/nginx/secrets/site_token
      register: site_token_stat

    - name: Assert site token is mode 0600 and owned by root
      ansible.builtin.assert:
        that:
          - site_token_stat['stat']['mode'] == '0600'
          - site_token_stat['stat']['pw_name'] == 'root'
          - site_token_stat['stat']['gr_name'] == 'root'

    - name: Verify site files links certificates and keys
      ansible.builtin.stat:
        path: "{{ item_site_path }}"
      register: site_paths
      loop:
        - /var/www/ci.cluster.local
        - /var/www/ci.cluster.local/index.html
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /var/www/status.cluster.local
        - /var/www/status.cluster.local/index.html
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
        - /var/www/test.cluster.local
        - /var/www/test.cluster.local/index.html
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
      loop_control:
        loop_var: item_site_path

    - name: Assert site paths exist
      ansible.builtin.assert:
        that: item_site_result['stat']['exists']
      loop: "{{ site_paths['results'] }}"
      loop_control:
        loop_var: item_site_result

    - name: Verify enabled site configurations are symbolic links
      ansible.builtin.stat:
        path: "{{ item_enabled_site }}"
      register: enabled_site_links
      loop:
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
      loop_control:
        loop_var: item_enabled_site

    - name: Assert enabled site configurations are links
      ansible.builtin.assert:
        that: item_enabled_result['stat']['islnk']
      loop: "{{ enabled_site_links['results'] }}"
      loop_control:
        loop_var: item_enabled_result

    - name: Validate site certificates
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ item_certificate }}", -noout, -subject, -dates]
      register: certificate_validation
      changed_when: false
      loop:
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/certs/test.cluster.local.crt
      loop_control:
        loop_var: item_certificate

    - name: Assert site certificates are readable X.509 certificates
      ansible.builtin.assert:
        that: item_certificate_result['rc'] == 0
      loop: "{{ certificate_validation['results'] }}"
      loop_control:
        loop_var: item_certificate_result

    - name: Verify default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert default nginx site is absent
      ansible.builtin.assert:
        that: not default_site['stat']['exists']

    - name: Verify nginx HTTP HTTPS and SSH ports are listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listening_port }}"
        state: started
        timeout: 5
      loop:
        - 80
        - 443
        - 22
      loop_control:
        loop_var: item_listening_port
