---
- name: Install Nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Deploy Nginx base configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true

- name: Deploy Nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true

- name: Create Nginx secrets directory
  ansible.builtin.file:
    path: /etc/nginx/secrets
    owner: root
    group: root
    mode: "0700"
    state: directory

- name: Write Nginx site token  # noqa: L039 - site_token is validated by the preceding credential validation task
  ansible.builtin.copy:
    content: "{{ site_token }}"
    dest: /etc/nginx/secrets/site_token
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Create site document roots  # noqa: R114 - paths come from role-default nginx_sites data
  ansible.builtin.file:
    path: "{{ item_nginx_site['value']['document_root'] }}"
    owner: nginx
    group: nginx
    mode: "0755"
    recurse: true
    state: directory
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site

- name: Deploy site index pages  # noqa: R114 - paths come from role-default nginx_sites data
  ansible.builtin.copy:
    src: "{{ item_nginx_site['value']['site_folder'] }}/index.html"
    dest: "{{ item_nginx_site['value']['document_root'] }}/index.html"
    owner: nginx
    group: nginx
    mode: "0644"
    backup: true
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
