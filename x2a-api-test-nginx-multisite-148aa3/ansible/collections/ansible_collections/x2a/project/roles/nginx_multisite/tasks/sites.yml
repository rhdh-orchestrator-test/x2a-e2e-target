---
- name: Create available sites directory
  ansible.builtin.file:
    path: /etc/nginx/sites-available
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create enabled sites directory
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Deploy virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_nginx_site['key'] }} # noqa: R114 - destination is derived from role-defined sites
    mode: "0644"
    backup: true
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site
  vars:
    server_name: "{{ item_nginx_site['key'] }}"
    document_root: "{{ item_nginx_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_nginx_site['value']['ssl_enabled'] }}"
    cert_file: /etc/ssl/certs/{{ item_nginx_site['key'] }}.crt
    key_file: /etc/ssl/private/{{ item_nginx_site['key'] }}.key

- name: Enable virtual host configurations
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_nginx_site['key'] }} # noqa: R114 - link source is derived from role-defined sites
    dest: /etc/nginx/sites-enabled/{{ item_nginx_site['key'] }} # noqa: R114 - link destination is derived from role-defined sites
    state: link
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
