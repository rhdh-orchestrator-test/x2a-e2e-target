---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started

- name: Configure fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  notify: Restart fail2ban

- name: Read UFW status
  ansible.builtin.command:
    argv:
      - ufw
      - status
      - verbose
  register: nginx_multisite_ufw_status
  changed_when: false

- name: Set UFW default incoming policy
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  when: "'Default: deny (incoming)' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Allow SSH through UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - ssh
  when: "'22/tcp' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Allow HTTP through UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - http
  when: "'80/tcp' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - https
  when: "'443/tcp' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Enable UFW
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - enable
  when: "'Status: active' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Render kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
  when: nginx_multisite_disable_root_login
  notify: Restart sshd

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  when: not nginx_multisite_password_authentication
  notify: Restart sshd
