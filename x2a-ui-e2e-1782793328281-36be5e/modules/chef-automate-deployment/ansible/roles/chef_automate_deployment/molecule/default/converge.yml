- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/chef-server
    - /tmp/molecule_test/var/log/chef-server/nginx
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/usr/bin
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "# Chef Automate configuration file\n[global]\n  v1 = true\n[deployment]\n  hostname = \"automate.chef.lab\"\n[gateway]\n  port = 443\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create Chef Infra Server config file
    ansible.builtin.copy:
      content: '# Chef Infra Server configuration file

        nginx[''ssl_port''] = 443

        bookshelf[''vip''] = ''automate.chef.lab''

        api_fqdn ''automate.chef.lab''

        '
      dest: /tmp/molecule_test/etc/chef-server/chef-server.rb
      mode: '0644'
  - name: Create mock Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        echo "Command executed: $@"

        exit 0

        '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create mock chef-server-ctl
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Server CTL mock"

        echo "Command executed: $@"

        exit 0

        '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create mock user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create mock organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create mock sysctl configuration
    ansible.builtin.copy:
      content: '# Kernel parameters for Chef Automate

        vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.conf
      mode: '0644'
  - name: Create mock nginx access log
    ansible.builtin.copy:
      content: '127.0.0.1 - - [01/Jan/2023:12:00:00 +0000] "GET /api/_status HTTP/1.1" 200 1234 "-" "curl/7.68.0"

        '
      dest: /tmp/molecule_test/var/log/chef-server/nginx/access.log
      mode: '0644'
  - name: Create mock nginx error log
    ansible.builtin.copy:
      content: '2023/01/01 12:00:00 [notice] 12345#0: using the "epoll" event method

        '
      dest: /tmp/molecule_test/var/log/chef-server/nginx/error.log
      mode: '0644'
