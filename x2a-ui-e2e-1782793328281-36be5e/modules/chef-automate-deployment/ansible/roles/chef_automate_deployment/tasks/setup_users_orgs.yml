---
- name: Ensure directory for PEM files exists
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_pem_path }}"
    - "{{ chef_org_validator_pem_path }}"
  when: item | dirname != '.'
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} {{ username | title }} {{ email }} "{{ password }}" --filename {{ chef_user_pem_path }}

      '
  args:
    creates: "{{ chef_user_pem_path }}"
  become: true
  register: user_create_result
  changed_when: user_create_result.rc == 0
  failed_when: user_create_result.rc != 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}" --association_user {{ username }} --filename {{ chef_org_validator_pem_path }}

      '
  args:
    creates: "{{ chef_org_validator_pem_path }}"
  become: true
  register: org_create_result
  changed_when: org_create_result.rc == 0
  failed_when: org_create_result.rc != 0
- name: Set permissions on user PEM file
  ansible.builtin.file:
    path: "{{ chef_user_pem_path }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  when: user_create_result is changed
- name: Set permissions on organization validator PEM file
  ansible.builtin.file:
    path: "{{ chef_org_validator_pem_path }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  when: org_create_result is changed
