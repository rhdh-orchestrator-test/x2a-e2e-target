---
- name: Ensure gzip package is installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
  register: download_result
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
  args:
    creates: "{{ chef_automate_cli_path }}"
  when: download_result is changed
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
  when: download_result is changed
- name: Build Chef Automate deploy command
  ansible.builtin.set_fact:
    deploy_cmd: "{{ chef_automate_cli_path }} deploy"
- name: Add products to deploy command
  ansible.builtin.set_fact:
    deploy_cmd: "{{ deploy_cmd }} --product {{ item }}"
  loop: "{{ chef_automate_products }}"
- name: Add MLSA acceptance to deploy command
  ansible.builtin.set_fact:
    deploy_cmd: "{{ deploy_cmd }} --accept-terms-and-mlsa=true"
  when: chef_automate_accept_terms | bool
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ deploy_cmd }}"
  args:
    creates: /etc/chef-automate/config.toml
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
  failed_when: deploy_result.rc != 0
- name: Wait for Chef Automate services to be ready
  ansible.builtin.pause:
    seconds: 30
  when: deploy_result is changed
