- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create hosts file
    ansible.builtin.copy:
      content: '127.0.0.1 localhost

        127.0.0.1 automate.chef.lab

        '
      dest: /tmp/molecule_test/etc/hosts
      mode: '0644'
  - name: Create sysctl.conf file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.conf
      mode: '0644'
  - name: Create chef-automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK USER KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create organization key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK ORG VALIDATOR KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
