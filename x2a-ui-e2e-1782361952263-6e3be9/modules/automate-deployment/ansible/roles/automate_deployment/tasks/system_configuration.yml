---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name: "{{ required_packages }}"
    state: present
  become: true
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ automate_hostname }}"
  become: true
- name: Update /etc/hosts with hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: 127.0.0.1 {{ automate_hostname }}
    regexp: ^127.0.0.1
    state: present
  become: true
- name: Set vm.max_map_count kernel parameter
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ vm_max_map_count }}"
    state: present
    reload: true
  become: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ vm_dirty_expire_centisecs }}"
    state: present
    reload: true
  become: true
