---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate_linux_amd64.zip > {{ chef_automate_cli_path }}
    creates: "{{ chef_automate_cli_path }}"
  args:
    creates: "{{ chef_automate_cli_path }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product automate --product infra-server --accept-terms-and-mlsa={{ accept_terms_and_mlsa | lower }}"
  become: true
  register: automate_deploy
  changed_when: automate_deploy.rc == 0
  args:
    creates: /hab
- name: Wait for Chef Automate services to be ready
  ansible.builtin.wait_for:
    host: localhost
    port: 443
    delay: 10
    timeout: 600
