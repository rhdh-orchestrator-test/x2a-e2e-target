---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Configure system parameters
  ansible.builtin.include_tasks: system_configuration.yml
- name: Install Chef Automate with Infra Server
  ansible.builtin.include_tasks: install_automate.yml
  when: deploy_automate_with_infra | bool
- name: Install Chef Infra Server only
  ansible.builtin.include_tasks: deploy_chef_server.yml
  when: not deploy_automate_with_infra | bool
- name: Setup users and organizations
  ansible.builtin.include_tasks: setup_users_orgs.yml
