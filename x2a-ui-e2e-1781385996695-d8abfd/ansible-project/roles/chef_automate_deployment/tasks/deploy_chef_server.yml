---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
  register: chef_automate_cli_download
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
  when: chef_automate_cli_download.changed
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy  --product infra-server  --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}\n"
  become: true
  args:
    creates: /etc/chef-automate/config.toml
  register: chef_infra_deploy
- name: Wait for Chef Infra Server services to be ready
  ansible.builtin.command:
    cmd: chef-server-ctl status
  become: true
  register: chef_server_status
  until: chef_server_status.rc == 0
  retries: 12
  delay: 10
  when: chef_infra_deploy.changed
