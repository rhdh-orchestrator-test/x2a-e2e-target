---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install cache packages
  ansible.builtin.package:
    name: "{{ cache_packages }}"
    state: present
- name: Create Redis configuration directory
  ansible.builtin.file:
    path: "{{ cache_redis_config_file | dirname }}"
    state: directory
    mode: "0755"
- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}"
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    recurse: true
- name: Configure Redis server
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}"
    regexp: "{{ item_cache['regexp'] }}"
    line: "{{ item_cache['line'] }}"
    backup: true
    create: true
    mode: "0644"
  loop:
    - regexp: ^port\s+
      line: port {{ cache_redis_port }}
    - regexp: ^bind\s+
      line: bind {{ cache_redis_bind }}
    - regexp: ^requirepass\s+
      line: requirepass {{ redis_password }}
  loop_control:
    loop_var: item_cache
  notify: Restart redis
- name: Remove deprecated Redis replica settings
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}"
    regexp: "{{ item_cache }}"
    state: absent
    backup: true
  loop:
    - ^replica-serve-stale-data.*$
    - ^replica-read-only.*$
    - ^repl-ping-replica-period.*$
    - ^client-output-buffer-limit.*$
    - ^replica-priority.*$
  loop_control:
    loop_var: item_cache
  notify: Restart redis
- name: Start and enable Redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    state: started
    enabled: true
- name: Start and enable memcached service
  ansible.builtin.service:
    name: "{{ cache_memcached_service }}"
    state: started
    enabled: true
  when: cache_memcached_enabled
