---
argument_specs:
  main:
    short_description: Install and configure Redis and memcached caching services
    description:
      - Installs and configures Redis server with authentication
      - Installs and configures memcached service
      - Creates Redis log directory with proper permissions
      - Removes deprecated Redis replica configuration settings
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for Redis server to listen on
      cache_redis_bind:
        type: str
        required: false
        default: 127.0.0.1
        description: IP address for Redis server to bind to
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory path for Redis log files
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to Redis configuration file
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: System user for Redis service
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: System group for Redis service
      cache_memcached_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and start memcached service
      cache_packages:
        type: list
        elements: str
        required: false
        default:
          - redis-server
          - memcached
        description: List of cache-related packages to install
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis systemd service
      cache_memcached_service:
        type: str
        required: false
        default: memcached
        description: Name of the memcached systemd service
      redis_password:
        type: str
        required: true
        description: Redis authentication password (injected by AAP credential type)
