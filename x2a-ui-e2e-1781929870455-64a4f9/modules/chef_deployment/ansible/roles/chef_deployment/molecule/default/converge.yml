- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create hosts file
    ansible.builtin.copy:
      content: '127.0.0.1 localhost

        127.0.0.1 automate.chef.lab

        '
      dest: /tmp/molecule_test/etc/hosts
      mode: '0644'
  - name: Create sysctl.conf file
    ansible.builtin.copy:
      content: 'vm.max_map_count=262144

        vm.dirty_expire_centisecs=20000

        '
      dest: /tmp/molecule_test/etc/sysctl.conf
      mode: '0644'
  - name: Create systemd directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/systemd/system
      state: directory
      mode: '0755'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI'''
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create directory for PEM files
    ansible.builtin.file:
      path: /tmp/molecule_test/tmp
      state: directory
      mode: '0700'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/tmp/admin.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/tmp/lab-validator.pem
      mode: '0600'
  - name: Create chef-automate service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Automate

        After=network.target


        [Service]

        Type=simple

        ExecStart=/hab/bin/chef-automate

        Restart=on-failure


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      mode: '0644'
  - name: Create chef-server service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Infra Server

        After=network.target


        [Service]

        Type=simple

        ExecStart=/hab/bin/chef-server-ctl

        Restart=on-failure


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-server.service
      mode: '0644'
  - name: Create bin directory
    ansible.builtin.file:
      path: /tmp/molecule_test/hab/bin
      state: directory
      mode: '0755'
  - name: Create chef-server-ctl binary
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Server Control'''
      dest: /tmp/molecule_test/hab/bin/chef-server-ctl
      mode: '0755'
  - name: Create chef-automate binary
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate Control'''
      dest: /tmp/molecule_test/hab/bin/chef-automate
      mode: '0755'
