---
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - username is defined and username | length > 0
      - password is defined and password | length > 0
      - full_name is defined and full_name | length > 0
      - email is defined and email | length > 0
    fail_msg: One or more required credential variables are not defined or empty. Ensure the AAP credential type is attached to the job template.
    quiet: true
