---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
  register: download_result
- name: Check if Chef Automate CLI exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: cli_stat
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }} && chmod +x {{ chef_automate_cli_path }}
  args:
    creates: "{{ chef_automate_cli_path }}"
  when: download_result is changed or not cli_stat.stat.exists
- name: Deploy Chef Automate with Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product automate --product infra-server --accept-terms-and-mlsa=true"
    creates: /hab
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
- name: Wait for Chef Server to be ready
  ansible.builtin.wait_for:
    timeout: 30
  when: deploy_result is changed
  tags: molecule-notest
- name: Ensure directory for PEM files exists with proper permissions
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ chef_user_pem_path }}"
    - "{{ chef_org_validator_pem_path }}"
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_username }}  "{{ full_name | default(chef_full_name) }}"  "{{ email | default(chef_email) }}"  "{{ password }}"  --filename
      {{ chef_user_pem_path }}

      '
    creates: "{{ chef_user_pem_path }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_org_name }}  "{{ chef_org_full_name }}"  --association_user {{ chef_username }}  --filename {{ chef_org_validator_pem_path
      }}

      '
    creates: "{{ chef_org_validator_pem_path }}"
  become: true
