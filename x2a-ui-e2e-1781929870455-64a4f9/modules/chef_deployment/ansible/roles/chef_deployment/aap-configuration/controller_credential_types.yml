---
controller_credential_types:
- name: Chef Admin User
  description: Credential type for Chef Admin User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Admin username for Chef Automate and Chef Infra Server
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the admin user in Chef Automate and Chef Infra Server
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the admin user
    - id: email
      type: string
      label: Email Address
      help_text: Email address for the admin user
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
