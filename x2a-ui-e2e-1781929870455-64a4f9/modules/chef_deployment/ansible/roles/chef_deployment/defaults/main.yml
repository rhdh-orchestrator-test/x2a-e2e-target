---
chef_hostname: automate.chef.lab
chef_username: admin
chef_full_name: Admin User
chef_email: admin@example.com
chef_org_name: lab
chef_org_full_name: Chef Lab
deploy_automate: true
deploy_chef_server: true
chef_vm_max_map_count: 262144
chef_vm_dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: /tmp/chef-automate
chef_user_pem_path: /tmp/{{ chef_username }}.pem
chef_org_validator_pem_path: /tmp/{{ chef_org_name }}-validator.pem
