- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is correctly set
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
      fail_msg: Hostname is not set correctly
      success_msg: Hostname is set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl configuration file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl configuration file not found
      success_msg: Sysctl configuration file exists
  - name: Get sysctl configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl parameters are correctly set
    ansible.builtin.assert:
      that:
      - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
      - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = 20000')
      fail_msg: Sysctl parameters are not set correctly
      success_msg: Sysctl parameters are set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-automate
    register: automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - automate_cli.stat.exists
      - automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate deployment directory
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert Chef Automate deployment directory exists
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef Automate deployment directory not found
      success_msg: Chef Automate deployment directory exists
  - name: Check user JSON file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/opscode/users/jtonello.json
    register: user_json
  - name: Assert user JSON file exists
    ansible.builtin.assert:
      that:
      - user_json.stat.exists
      - user_json.stat.isreg
      fail_msg: User JSON file not found
      success_msg: User JSON file exists
  - name: Check organization directory
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/opscode/orgs/lab
    register: org_dir
  - name: Assert organization directory exists
    ansible.builtin.assert:
      that:
      - org_dir.stat.exists
      - org_dir.stat.isdir
      fail_msg: Organization directory not found
      success_msg: Organization directory exists
  - name: Check user PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_pem
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.isreg
      fail_msg: User PEM file not found
      success_msg: User PEM file exists
  - name: Check organization validator PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_validator_pem
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_validator_pem.stat.exists
      - org_validator_pem.stat.isreg
      fail_msg: Organization validator PEM file not found
      success_msg: Organization validator PEM file exists
  - name: Check Chef Automate service file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/systemd/system/chef-automate.service
    register: automate_service
  - name: Assert Chef Automate service file exists
    ansible.builtin.assert:
      that:
      - automate_service.stat.exists
      - automate_service.stat.isreg
      fail_msg: Chef Automate service file not found
      success_msg: Chef Automate service file exists
  - name: Check Chef Server service file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/systemd/system/chef-server.service
    register: server_service
  - name: Assert Chef Server service file exists
    ansible.builtin.assert:
      that:
      - server_service.stat.exists
      - server_service.stat.isreg
      fail_msg: Chef Server service file not found
      success_msg: Chef Server service file exists
  - name: Check Chef Automate service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is active
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      - ansible_facts.services['chef-automate.service'].state == 'running'
      fail_msg: Chef Automate service is not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Assert Chef Server service is active
    ansible.builtin.assert:
      that:
      - '''chef-server.service'' in ansible_facts.services'
      - ansible_facts.services['chef-server.service'].state == 'running'
      fail_msg: Chef Server service is not running
      success_msg: Chef Server service is running
    tags: molecule-notest
  - name: Check Chef Automate API health
    ansible.builtin.uri:
      url: https://localhost/api/v0/health
      validate_certs: false
      status_code: 200
    register: automate_health
    tags: molecule-notest
  - name: Assert Chef Automate API is healthy
    ansible.builtin.assert:
      that:
      - automate_health.status == 200
      fail_msg: Chef Automate API is not healthy
      success_msg: Chef Automate API is healthy
    tags: molecule-notest
  - name: Check Chef Infra Server organizations
    ansible.builtin.uri:
      url: https://localhost/organizations
      validate_certs: false
      status_code: 200
    register: server_orgs
    tags: molecule-notest
  - name: Assert Chef Infra Server API is accessible
    ansible.builtin.assert:
      that:
      - server_orgs.status == 200
      fail_msg: Chef Infra Server API is not accessible
      success_msg: Chef Infra Server API is accessible
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
