- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create necessary directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/etc/opscode
    - /tmp/molecule_test/etc/opscode/users
    - /tmp/molecule_test/etc/opscode/orgs
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/home/ansible
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '# Simulated sysctl configuration for Chef Automate

        vm.max_map_count = {{ automate_vm_max_map_count }}

        vm.dirty_expire_centisecs = {{ automate_vm_dirty_expire_centisecs }}

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/sh

        # Simulated Chef Automate CLI

        echo "Chef Automate CLI v1.0.0"

        echo "Usage: chef-automate COMMAND [options]"

        exit 0

        '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user JSON file
    ansible.builtin.copy:
      content: "{\n  \"username\": \"{{ automate_username }}\",\n  \"display_name\": \"John Tonello\",\n  \"email\": \"jtonello@chef.lab\"\n}\n"
      dest: /tmp/molecule_test/etc/opscode/users/{{ automate_username }}.json
      mode: '0644'
  - name: Create organization directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/opscode/orgs/{{ automate_org_name }}
      state: directory
      mode: '0755'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAvPbwWJPEb9TQvlcpd...

        (simulated PEM content)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ automate_user_pem_file }}
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAvPbwWJPEb9TQvlcpd...

        (simulated validator PEM content)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ automate_org_validator_pem }}
      mode: '0600'
  - name: Create systemd service files
    ansible.builtin.copy:
      content: '[Unit]

        Description={{ item }} Service

        After=network.target


        [Service]

        Type=simple

        ExecStart=/bin/true

        Restart=on-failure


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/{{ item }}.service
      mode: '0644'
    loop:
    - chef-automate
    - chef-server
  vars:
    automate_hostname: automate.chef.lab
    automate_vm_max_map_count: 262144
    automate_vm_dirty_expire_centisecs: 20000
    automate_username: jtonello
    automate_org_name: lab
    automate_user_pem_file: jtonello.pem
    automate_org_validator_pem: lab-validator.pem
