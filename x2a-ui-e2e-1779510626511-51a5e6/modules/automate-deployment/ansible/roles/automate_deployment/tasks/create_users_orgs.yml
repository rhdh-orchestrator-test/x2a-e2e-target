---
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ automate_username }} {{ automate_full_name | quote }} {{ automate_email | quote }} {{ automate_password | quote }}
      --filename {{ automate_user_pem_file }}
    creates: /etc/opscode/users/{{ automate_username }}.json
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ automate_org_name }} {{ automate_org_full_name | quote }} --association_user {{ automate_username }} --filename {{
      automate_org_validator_pem }}
    creates: /etc/opscode/orgs/{{ automate_org_name }}
  become: true
