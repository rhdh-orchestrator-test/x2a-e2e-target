---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - unzip
      - curl
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > {{ automate_cli_path }} < /tmp/chef-automate_linux_amd64.zip
    creates: "{{ automate_cli_path }}"
  become: true
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ automate_cli_path }}"
    mode: "0755"
    state: file
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ automate_accept_terms_and_mlsa | lower }}"
    creates: /hab
  become: true
  register: chef_server_deploy_result
  changed_when: chef_server_deploy_result.rc == 0
