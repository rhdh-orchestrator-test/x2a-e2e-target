---
automate_hostname: automate.chef.lab
automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
automate_cli_path: ./chef-automate
automate_vm_max_map_count: 262144
automate_vm_dirty_expire_centisecs: 20000
automate_accept_terms_and_mlsa: true
automate_username: "{{ username | default('jtonello') }}"
automate_full_name: "{{ full_name | default('John Tonello') }}"
automate_email: "{{ email | default('jtonello@chef.lab') }}"
automate_password: "{{ password | default('password') }}"
automate_org_name: lab
automate_org_full_name: Chef Lab
automate_user_pem_file: "{{ automate_username }}.pem"
automate_org_validator_pem: "{{ automate_org_name }}-validator.pem"
