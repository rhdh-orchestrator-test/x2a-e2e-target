---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure that would be created by Chef Automate and Chef Infra Server
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/chef-server
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/chef-server
        - /tmp/molecule_test/var/log/chef-automate
        - /tmp/molecule_test/var/log/chef-server

    # Create mock config files
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          # Mock Chef Automate config.toml
          [global]
            v1 = true
          [deployment]
            hostname = "automate.chef.lab"
          [products]
            automate = true
            infra-server = true
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"

    - name: Create Chef Server config file
      ansible.builtin.copy:
        content: |
          # Mock Chef Server config
          nginx['ssl_certificate'] = '/var/opt/chef-server/ssl/certs/chef-server.cert'
          nginx['ssl_certificate_key'] = '/var/opt/chef-server/ssl/keys/chef-server.key'
          bookshelf['vip'] = 'automate.chef.lab'
          nginx['url'] = 'https://automate.chef.lab'
        dest: /tmp/molecule_test/etc/chef-server/chef-server.rb
        mode: "0644"

    # Create mock user and organization key files
    - name: Create mock user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAzV7Z2hHJPCIRZj+MWsXMXJJkP9S1vDAaJJd5o3kGZU/SMCW1
          MOCK_USER_KEY_CONTENT_PLACEHOLDER
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/jtonello.pem
        mode: "0600"

    - name: Create mock organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA6NF8iallvQVp22WDkTkyrtvp9eWW6A8YVr+kz4TjGYe7gHzI
          MOCK_ORG_VALIDATOR_KEY_CONTENT_PLACEHOLDER
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/lab-validator.pem
        mode: "0600"

    # Create mock systemd service files
    - name: Create mock Chef Automate service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Automate
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/chef-automate start
          ExecStop=/usr/bin/chef-automate stop
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
        mode: "0644"

    - name: Create mock Chef Server service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Infra Server
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/chef-server-ctl start
          ExecStop=/usr/bin/chef-server-ctl stop
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/etc/systemd/system/chef-server.service
        mode: "0644"

    # Create mock CLI binaries
    - name: Create mock Chef Automate CLI
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI mock"
          exit 0
        dest: /tmp/molecule_test/usr/bin/chef-automate
        mode: "0755"

    - name: Create mock Chef Server CLI
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Server CLI mock"
          exit 0
        dest: /tmp/molecule_test/usr/bin/chef-server-ctl
        mode: "0755"

    # Create mock sysctl settings
    - name: Create mock sysctl settings file
      ansible.builtin.copy:
        content: |
          # Chef Automate sysctl settings
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Create mock hostname file
    - name: Create mock hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"