---
argument_specs:
  main:
    short_description: Multi-site Nginx web server with SSL and security hardening
    description:
      - Configures multiple SSL-enabled virtual hosts with comprehensive security hardening
      - Includes fail2ban, UFW firewall, SSH restrictions, and kernel security parameters
      - Generates self-signed SSL certificates for development environments
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Dictionary of site configurations with document roots and SSL settings
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory path for SSL certificates
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory path for SSL private keys
      nginx_multisite_security_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to enable fail2ban intrusion prevention
      nginx_multisite_security_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to enable UFW firewall
      nginx_multisite_security_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login
      nginx_multisite_security_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether to allow SSH password authentication
