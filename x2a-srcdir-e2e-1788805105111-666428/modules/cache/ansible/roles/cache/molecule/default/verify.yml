---
- name: Verify Redis configuration and files
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis configuration and data files exist
      ansible.builtin.stat:
        path: "{{ item_file }}"
      loop:
        - /tmp/molecule_test/etc/redis/redis.conf
        - /tmp/molecule_test/var/lib/redis/dump.rdb
        - /tmp/molecule_test/var/log/redis/redis-server.log
        - /tmp/molecule_test/var/run/redis/redis-server.pid
        - /tmp/molecule_test/var/run/redis/redis-server.sock
      loop_control:
        loop_var: item_file
      register: redis_file_stats

    - name: Assert Redis files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] >= 0
        fail_msg: "Expected Redis file not found"
      loop: "{{ redis_file_stats['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check Redis directories exist
      ansible.builtin.stat:
        path: "{{ item_dir }}"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir
      register: redis_dir_stats

    - name: Assert Redis directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected Redis directory not found"
      loop: "{{ redis_dir_stats['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read Redis configuration file
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/redis/redis.conf
      register: redis_config_content

    - name: Assert Redis configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'port 6379' in redis_config_decoded"
          - "'bind 127.0.0.1' in redis_config_decoded"
          - "'dir /var/lib/redis/' in redis_config_decoded"
          - "'logfile /var/log/redis/redis-server.log' in redis_config_decoded"
        fail_msg: "Redis configuration missing expected settings"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

    - name: Read Redis log file
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/log/redis/redis-server.log
      register: redis_log_content

    - name: Assert Redis log contains startup messages
      ansible.builtin.assert:
        that:
          - "'Redis server' in redis_log_decoded"
          - "'Ready to accept connections' in redis_log_decoded"
        fail_msg: "Redis log missing expected startup messages"
      vars:
        redis_log_decoded: "{{ redis_log_content['content'] | b64decode }}"

    - name: Check systemd service file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/systemd/system/redis-server.service
      register: redis_service_stat

    - name: Assert Redis systemd service file was created
      ansible.builtin.assert:
        that:
          - redis_service_stat['stat']['exists']
          - redis_service_stat['stat']['size'] > 0
        fail_msg: "Redis systemd service file not found"

    - name: Read Redis systemd service file
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/systemd/system/redis-server.service
      register: redis_service_content

    - name: Assert Redis service file contains expected configuration
      ansible.builtin.assert:
        that:
          - "'ExecStart=/usr/bin/redis-server /etc/redis/redis.conf' in redis_service_decoded"
          - "'User=redis' in redis_service_decoded"
          - "'WantedBy=multi-user.target' in redis_service_decoded"
        fail_msg: "Redis service file missing expected configuration"
      vars:
        redis_service_decoded: "{{ redis_service_content['content'] | b64decode }}"

- name: Verify Redis service and connectivity (container-incompatible)
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
        fail_msg: "Redis service not running"
      tags: molecule-notest

    - name: Check Redis service is enabled
      ansible.builtin.systemd:
        name: redis-server
      register: redis_service_status
      tags: molecule-notest

    - name: Assert Redis service is enabled
      ansible.builtin.assert:
        that:
          - redis_service_status['enabled']
        fail_msg: "Redis service not enabled"
      tags: molecule-notest

    - name: Test Redis connectivity with ping
      ansible.builtin.command:
        cmd: redis-cli ping
      register: redis_ping_result
      changed_when: false
      tags: molecule-notest

    - name: Assert Redis responds to ping
      ansible.builtin.assert:
        that:
          - redis_ping_result['stdout'] == 'PONG'
        fail_msg: "Redis not responding to ping"
      tags: molecule-notest

    - name: Test Redis basic operations
      ansible.builtin.command:
        cmd: "{{ item_cmd }}"
      loop:
        - redis-cli set test_key "test_value"
        - redis-cli get test_key
        - redis-cli del test_key
      loop_control:
        loop_var: item_cmd
      register: redis_ops_results
      changed_when: false
      tags: molecule-notest

    - name: Assert Redis operations work correctly
      ansible.builtin.assert:
        that:
          - redis_ops_results['results'][0]['stdout'] == 'OK'
          - redis_ops_results['results'][1]['stdout'] == 'test_value'
          - redis_ops_results['results'][2]['stdout'] == '1'
        fail_msg: "Redis basic operations failed"
      tags: molecule-notest

    - name: Check Redis is listening on port 6379
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 5
      tags: molecule-notest

    - name: Get Redis server info
      ansible.builtin.command:
        cmd: redis-cli info server
      register: redis_info_result
      changed_when: false
      tags: molecule-notest

    - name: Assert Redis server info contains expected data
      ansible.builtin.assert:
        that:
          - "'redis_version' in redis_info_result['stdout']"
          - "'process_id' in redis_info_result['stdout']"
        fail_msg: "Redis server info missing expected data"
      tags: molecule-notest