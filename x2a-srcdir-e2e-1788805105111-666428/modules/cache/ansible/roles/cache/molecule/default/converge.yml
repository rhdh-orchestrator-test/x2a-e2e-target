---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected Redis directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          port 6379
          bind 127.0.0.1
          timeout 0
          tcp-keepalive 0
          loglevel notice
          logfile /var/log/redis/redis-server.log
          databases 16
          save 900 1
          save 300 10
          save 60 10000
          stop-writes-on-bgsave-error yes
          rdbcompression yes
          rdbchecksum yes
          dbfilename dump.rdb
          dir /var/lib/redis/
          maxmemory-policy noeviction
          appendonly no
          appendfilename "appendonly.aof"
          appendfsync everysec
          no-appendfsync-on-rewrite no
          auto-aof-rewrite-percentage 100
          auto-aof-rewrite-min-size 64mb
        dest: /tmp/molecule_test/etc/redis/redis.conf
        mode: "0644"
        backup: true

    - name: Create Redis systemd service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Advanced key-value store
          After=network.target
          Documentation=http://redis.io/documentation, man:redis-server(1)

          [Service]
          Type=notify
          ExecStart=/usr/bin/redis-server /etc/redis/redis.conf
          ExecStop=/bin/kill -s QUIT $MAINPID
          TimeoutStopSec=0
          Restart=always
          User=redis
          Group=redis
          RuntimeDirectory=redis
          RuntimeDirectoryMode=0755

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/etc/systemd/system/redis-server.service
        mode: "0644"
        backup: true

    - name: Create Redis log file
      ansible.builtin.copy:
        content: |
          1:C 01 Jan 2024 00:00:00.000 # Redis server v=7.0.0 sha=00000000:0 malloc=jemalloc-5.2.1 bits=64 build=0
          1:M 01 Jan 2024 00:00:00.000 * monotonic clock: POSIX clock_gettime
          1:M 01 Jan 2024 00:00:00.000 * Running mode=standalone, port=6379.
          1:M 01 Jan 2024 00:00:00.000 # Server initialized
          1:M 01 Jan 2024 00:00:00.000 * Ready to accept connections
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"
        backup: true

    - name: Create Redis PID file
      ansible.builtin.copy:
        content: "12345"
        dest: /tmp/molecule_test/var/run/redis/redis-server.pid
        mode: "0644"
        backup: true

    - name: Create Redis socket file placeholder
      ansible.builtin.copy:
        content: ""
        dest: /tmp/molecule_test/var/run/redis/redis-server.sock
        mode: "0755"
        backup: true

    - name: Create Redis data directory with dump file
      ansible.builtin.copy:
        content: "REDIS0009"
        dest: /tmp/molecule_test/var/lib/redis/dump.rdb
        mode: "0644"
        backup: true