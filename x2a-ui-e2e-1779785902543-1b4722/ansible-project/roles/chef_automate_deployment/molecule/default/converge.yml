---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directories that would be created by the role
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/chef-server
        - /tmp/molecule_test/etc/chef

    # Mock the Chef Automate CLI
    - name: Create mock Chef Automate CLI
      ansible.builtin.file:
        path: "/tmp/molecule_test/chef-automate"
        state: touch
        mode: "0755"

    # Mock the config files
    - name: Create mock Chef Automate config file
      ansible.builtin.copy:
        content: |
          # Mock Chef Automate config file
          [global]
            v1 = true
          [deployment]
            hostname = "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/chef-automate/config.toml"
        mode: "0644"

    # Mock the user and organization key files
    - name: Create mock user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          MOCK_KEY_CONTENT_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/jtonello.pem"
        mode: "0400"

    - name: Create mock organization key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          MOCK_ORG_KEY_CONTENT_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/lab-validator.pem"
        mode: "0400"

    # Mock the system configuration
    - name: Create mock sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Mock the hostname file
    - name: Create mock hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"