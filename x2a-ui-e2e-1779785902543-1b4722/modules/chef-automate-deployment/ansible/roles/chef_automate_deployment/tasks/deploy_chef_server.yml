---
- name: Include system configuration tasks
  ansible.builtin.include_tasks: system_config.yml
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: "{{ chef_automate_cli_path }}.zip"
    dest: "{{ ansible_env.PWD }}"
    remote_src: true
    creates: "{{ chef_automate_cli_path }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "sudo ./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }} "
  args:
    creates: /etc/chef-automate/config.toml
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_server_user_key_path }}

      '
  args:
    creates: "{{ chef_server_user_key_path }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl org-create {{ chef_server_org_name }} "{{ chef_server_org_long_name }}" --association_user {{ username }} --filename {{ chef_server_org_key_path
      }}

      '
  args:
    creates: "{{ chef_server_org_key_path }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
- name: Set permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_server_user_key_path }}"
    mode: "0400"
    state: file
  when: chef_user_create.changed
- name: Set permissions on organization key file
  ansible.builtin.file:
    path: "{{ chef_server_org_key_path }}"
    mode: "0400"
    state: file
  when: chef_org_create.changed
