---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
  register: chef_automate_cli_download
- name: Check if Chef Automate CLI binary exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_binary }}"
  register: chef_automate_cli_stat
- name: Extract Chef Automate CLI (if compressed)
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_binary }} && chmod +x {{ chef_automate_cli_binary }}
  args:
    stdin: "{{ chef_automate_cli_path }}"
    creates: "{{ chef_automate_cli_binary }}"
  when: chef_automate_cli_download.changed and not chef_automate_cli_stat.stat.exists
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "./{{ chef_automate_cli_binary }} deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{ chef_automate_accept_terms
      | lower }} "
  become: true
  args:
    creates: /etc/chef-automate/config.toml
  register: chef_automate_deploy
  changed_when: chef_automate_deploy.rc == 0
- name: Wait for Chef Automate services to be fully operational
  ansible.builtin.pause:
    seconds: 30
  when: chef_automate_deploy.changed
