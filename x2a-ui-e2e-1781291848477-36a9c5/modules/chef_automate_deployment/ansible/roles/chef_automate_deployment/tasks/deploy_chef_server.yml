---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
  register: chef_automate_cli_download
- name: Check if Chef Automate CLI binary exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_binary }}"
  register: chef_automate_cli_stat
- name: Extract Chef Automate CLI (if compressed)
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_binary }} && chmod +x {{ chef_automate_cli_binary }}
  args:
    stdin: "{{ chef_automate_cli_path }}"
    creates: "{{ chef_automate_cli_binary }}"
  when: chef_automate_cli_download.changed and not chef_automate_cli_stat.stat.exists
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "./{{ chef_automate_cli_binary }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }} "
  become: true
  args:
    creates: /etc/chef-server/chef-server.rb
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
- name: Wait for Chef Infra Server services to be fully operational
  ansible.builtin.pause:
    seconds: 30
  when: chef_server_deploy.changed
