---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname configuration
      ansible.builtin.command:
        cmd: hostname
      register: hostname_result
      changed_when: false
      tags: molecule-notest

    - name: Check kernel parameters
      ansible.builtin.command:
        cmd: "sysctl {{ item }}"
      loop:
        - vm.max_map_count
        - vm.dirty_expire_centisecs
      register: sysctl_result
      changed_when: false
      tags: molecule-notest

    # Verify Chef Automate and Chef Server directories exist
    - name: Check Chef Automate config directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate
      register: chef_automate_config_dir

    - name: Assert Chef Automate config directory exists
      ansible.builtin.assert:
        that:
          - chef_automate_config_dir.stat.exists
          - chef_automate_config_dir.stat.isdir
        fail_msg: "Chef Automate config directory not found"
        success_msg: "Chef Automate config directory exists"

    - name: Check Chef Server config directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server
      register: chef_server_config_dir

    - name: Assert Chef Server config directory exists
      ansible.builtin.assert:
        that:
          - chef_server_config_dir.stat.exists
          - chef_server_config_dir.stat.isdir
        fail_msg: "Chef Server config directory not found"
        success_msg: "Chef Server config directory exists"

    # Verify Chef Automate config file
    - name: Check Chef Automate config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config_file

    - name: Assert Chef Automate config file exists
      ansible.builtin.assert:
        that:
          - chef_automate_config_file.stat.exists
          - chef_automate_config_file.stat.size > 0
        fail_msg: "Chef Automate config file not found or empty"
        success_msg: "Chef Automate config file exists"

    # Verify Chef Server config file
    - name: Check Chef Server config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server/chef-server.rb
      register: chef_server_config_file

    - name: Assert Chef Server config file exists
      ansible.builtin.assert:
        that:
          - chef_server_config_file.stat.exists
          - chef_server_config_file.stat.size > 0
        fail_msg: "Chef Server config file not found or empty"
        success_msg: "Chef Server config file exists"

    # Verify Chef Automate CLI binary
    - name: Check Chef Automate CLI binary exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/usr/local/bin/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI binary exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI binary not found or not executable"
        success_msg: "Chef Automate CLI binary exists and is executable"

    # Verify user and organization setup
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_pem_file

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem_file.stat.exists
          - user_pem_file.stat.size > 0
        fail_msg: "User PEM file not found or empty"
        success_msg: "User PEM file exists"

    - name: Check organization validator PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_validator_pem_file

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_validator_pem_file.stat.exists
          - org_validator_pem_file.stat.size > 0
        fail_msg: "Organization validator PEM file not found or empty"
        success_msg: "Organization validator PEM file exists"

    # Verify Chef Automate status (would be run on actual system)
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: chef_automate_status
      changed_when: false
      tags: molecule-notest

    # Verify Chef Server status (would be run on actual system)
    - name: Check Chef Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      tags: molecule-notest

    # Verify user creation (would be run on actual system)
    - name: Verify user creation
      ansible.builtin.command:
        cmd: sudo chef-server-ctl user-list
      register: chef_user_list
      changed_when: false
      tags: molecule-notest

    # Verify organization creation (would be run on actual system)
    - name: Verify organization creation
      ansible.builtin.command:
        cmd: sudo chef-server-ctl org-list
      register: chef_org_list
      changed_when: false
      tags: molecule-notest

    # Network checks (would be run on actual system)
    - name: Check network listening ports
      ansible.builtin.command:
        cmd: netstat -tulpn | grep 443
      register: netstat_result
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Check HTTPS endpoint
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
      register: https_result
      failed_when: false
      tags: molecule-notest

    # Service health checks (would be run on actual system)
    - name: Check service health endpoint
      ansible.builtin.uri:
        url: https://localhost/_status
        validate_certs: false
      register: health_result
      failed_when: false
      tags: molecule-notest

    - name: Check Chef Automate version
      ansible.builtin.command:
        cmd: sudo chef-automate version
      register: chef_automate_version
      changed_when: false
      tags: molecule-notest

    # Disk space checks (would be run on actual system)
    - name: Check disk space for Chef Automate
      ansible.builtin.command:
        cmd: df -h /var/opt/chef-automate
      register: chef_automate_disk_space
      changed_when: false
      tags: molecule-notest

    - name: Check disk space for Chef Server
      ansible.builtin.command:
        cmd: df -h /var/opt/chef-server
      register: chef_server_disk_space
      changed_when: false
      tags: molecule-notest