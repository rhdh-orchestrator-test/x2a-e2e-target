- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Chef Automate and Chef Server
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/chef-server
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/chef-server
    - /tmp/molecule_test/var/log/chef-automate
    - /tmp/molecule_test/var/log/chef-server
    - /tmp/molecule_test/usr/local/bin
    - /tmp/molecule_test/usr/bin
    - /tmp/molecule_test/proc/sys/vm
  - name: Create mock Chef Automate config file
    ansible.builtin.copy:
      content: "# Mock Chef Automate config file\n[global]\n  v1 = true\n[deployment]\n  automate = \"enabled\"\n  infra-server = \"enabled\"\n[mlsa]\n  accept =
        true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create mock Chef Server config file
    ansible.builtin.copy:
      content: '# Mock Chef Server config file

        nginx[''ssl_port''] = 443

        nginx[''enable''] = true

        bookshelf[''enable''] = true

        '
      dest: /tmp/molecule_test/etc/chef-server/chef-server.rb
      mode: '0644'
  - name: Create mock Chef Automate CLI binary
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        echo "Version: 2.0.0"

        '
      dest: /tmp/molecule_test/usr/local/bin/chef-automate
      mode: '0755'
  - name: Create mock Chef Server CLI binary
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Server CLI mock"

        echo "Version: 14.0.0"

        '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create mock user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefghijklmnopq

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create mock organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        ZYXWVUTSRQPONMLKJIHGFEDCBA0987654321zyxwvutsrqponmlk

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create mock user list output file
    ansible.builtin.copy:
      content: 'jtonello

        admin

        pivotal

        '
      dest: /tmp/molecule_test/chef-server-user-list.txt
      mode: '0644'
  - name: Create mock organization list output file
    ansible.builtin.copy:
      content: 'lab

        chef

        '
      dest: /tmp/molecule_test/chef-server-org-list.txt
      mode: '0644'
  - name: Create mock Chef Automate status output file
    ansible.builtin.copy:
      content: "Service: automate-gateway\n  Status: running (pid 12345)\nService: automate-postgresql\n  Status: running (pid 12346)\nService: chef-server\n  Status:
        running (pid 12347)\nOverall status: ok\n"
      dest: /tmp/molecule_test/chef-automate-status.txt
      mode: '0644'
  - name: Create mock Chef Server status output file
    ansible.builtin.copy:
      content: 'run: bookshelf: (pid 12348) 1s; run: nginx: (pid 12349) 1s

        run: opscode-erchef: (pid 12350) 1s; run: postgresql: (pid 12351) 1s

        '
      dest: /tmp/molecule_test/chef-server-status.txt
      mode: '0644'
  - name: Create mock sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/proc/sys/vm/settings
      mode: '0644'
