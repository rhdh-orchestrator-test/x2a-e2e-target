- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache config
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/apache2/mods-available
  - name: Create mock Apache SSL config file
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        # Original line that will be replaced by the role

        SSLProtocol all -SSLv3


        # Other SSL configuration options

        SSLHonorCipherOrder on

        SSLCipherSuite HIGH:!aNULL:!MD5

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Simulate package installation (apache2)
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/sbin/apache2
      state: touch
      mode: '0755'
  - name: Simulate package installation (openssh-server)
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/sbin/sshd
      state: touch
      mode: '0755'
  - name: Simulate Apache SSL module enable
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.conf
      state: touch
      mode: '0644'
  - name: Fix SSL in Apache (test version)
    ansible.builtin.replace:
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
    register: ssl_config_result
  - name: Show config change result
    ansible.builtin.debug:
      var: ssl_config_result
