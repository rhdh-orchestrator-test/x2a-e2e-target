- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname configuration file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
    tags: molecule-notest
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists | default(false)
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
    tags: molecule-notest
  - name: Check sysctl configuration
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d
    register: sysctl_dir
    tags: molecule-notest
  - name: Assert sysctl directory exists
    ansible.builtin.assert:
      that:
      - sysctl_dir.stat.exists | default(false)
      - sysctl_dir.stat.isdir | default(false)
      fail_msg: Sysctl directory not found
      success_msg: Sysctl directory exists
    tags: molecule-notest
  - name: Check Chef Automate config file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: config_file
  - name: Assert Chef Automate config file exists
    ansible.builtin.assert:
      that:
      - config_file.stat.exists
      - config_file.stat.size > 0
      fail_msg: Chef Automate config file not found or empty
      success_msg: Chef Automate config file exists and has content
  - name: Check Chef Automate CLI
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Server CLI
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/chef-server-ctl
    register: chef_server_cli
  - name: Assert Chef Server CLI exists and is executable
    ansible.builtin.assert:
      that:
      - chef_server_cli.stat.exists
      - chef_server_cli.stat.executable
      fail_msg: Chef Server CLI not found or not executable
      success_msg: Chef Server CLI exists and is executable
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.size > 0
      fail_msg: User key file not found or empty
      success_msg: User key file exists and has content
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_key_file
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.size > 0
      fail_msg: Organization validator key file not found or empty
      success_msg: Organization validator key file exists and has content
  - name: Check Chef Automate service status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: chef_automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - chef_automate_status.rc == 0
      fail_msg: Chef Automate service is not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: chef_server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - chef_server_status.rc == 0
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Check user list
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/opt/chef-server/user-list
    register: user_list_file
  - name: Slurp user list file
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/opt/chef-server/user-list
    register: user_list_content
    when: user_list_file.stat.exists
  - name: Assert user exists in user list
    ansible.builtin.assert:
      that:
      - user_list_file.stat.exists
      - '''jtonello'' in (user_list_content[''content''] | b64decode)'
      fail_msg: User jtonello not found in user list
      success_msg: User jtonello found in user list
    when: user_list_file.stat.exists
  - name: Check organization list
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/opt/chef-server/org-list
    register: org_list_file
  - name: Slurp organization list file
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/opt/chef-server/org-list
    register: org_list_content
    when: org_list_file.stat.exists
  - name: Assert organization exists in organization list
    ansible.builtin.assert:
      that:
      - org_list_file.stat.exists
      - '''lab'' in (org_list_content[''content''] | b64decode)'
      fail_msg: Organization lab not found in organization list
      success_msg: Organization lab found in organization list
    when: org_list_file.stat.exists
  - name: Check API accessibility
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
    register: api_response
    failed_when: false
    tags: molecule-notest
  - name: Assert API is accessible
    ansible.builtin.assert:
      that:
      - api_response.status == 200
      fail_msg: API is not accessible
      success_msg: API is accessible
    tags: molecule-notest
  - name: Check network listening
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/opt/chef-automate/network-listening
    register: network_listening_file
  - name: Slurp network listening file
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/opt/chef-automate/network-listening
    register: network_listening_content
    when: network_listening_file.stat.exists
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - network_listening_file.stat.exists
      - '''443'' in (network_listening_content[''content''] | b64decode)'
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    when: network_listening_file.stat.exists
