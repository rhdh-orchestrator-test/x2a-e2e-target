---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
  register: download_result
  failed_when: false
- name: Check if Chef Automate CLI exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: cli_stat
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
    creates: "{{ chef_automate_cli_path }}"
  when: not cli_stat.stat.exists or download_result.changed
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Set deployment products
  ansible.builtin.set_fact:
    chef_automate_products: "{% set products = [] %} {% if chef_automate_deploy_automate %} {% set products = products + ['automate'] %} {% endif %} {% if chef_automate_deploy_infra_server
      %} {% set products = products + ['infra-server'] %} {% endif %} {{ products }}"
- name: Check if Chef Automate is already deployed
  ansible.builtin.stat:
    path: /etc/chef-automate/config.toml
  register: automate_config
  become: true
- name: Deploy Chef Automate and/or Chef Infra Server
  ansible.builtin.command:
    cmd: ./chef-automate deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{
      chef_automate_accept_terms | lower }}
  become: true
  register: deploy_result
  changed_when: "'Success!' in deploy_result.stdout"
  failed_when:
    - deploy_result.rc != 0
    - "'already deployed' not in deploy_result.stderr"
  when: not automate_config.stat.exists
