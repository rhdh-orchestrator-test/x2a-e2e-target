---
controller_credential_types:
- name: Chef User Credentials
  description: Credentials for Chef Automate and Chef Infra Server user creation
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef user account
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef user account
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
