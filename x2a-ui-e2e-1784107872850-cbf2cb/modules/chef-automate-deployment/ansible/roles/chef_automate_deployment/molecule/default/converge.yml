- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/opscode
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/proc/sys/vm
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create mock Chef Automate CLI binary
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        echo "Version: 20230101"

        '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create mock user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu7YvQnP3OVfGfMjQ9pPjsAho5jnQlx6J3Vw/ps1UoLqA1fIO

        MOCK_KEY_CONTENT_FOR_TESTING_ONLY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_automate_userfilename }}
      mode: '0600'
  - name: Create mock organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu7YvQnP3OVfGfMjQ9pPjsAho5jnQlx6J3Vw/ps1UoLqA1fIO

        MOCK_ORG_VALIDATOR_KEY_CONTENT_FOR_TESTING_ONLY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_automate_orgfilename }}
      mode: '0600'
  - name: Create mock sysctl files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/{{ item.path }}
      mode: '0644'
    loop:
    - path: vm/max_map_count
      value: '{{ chef_automate_vm_max_map_count }}'
    - path: vm/dirty_expire_centisecs
      value: '{{ chef_automate_vm_dirty_expire_centisecs }}'
  - name: Create mock Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: automate-postgresql      | Status: running

        Service: automate-elasticsearch   | Status: running

        Service: automate-es-gateway      | Status: running

        Service: automate-ui              | Status: running

        Service: automate-load-balancer   | Status: running

        Service: automate-cs-nginx        | Status: running

        Service: automate-cs-bookshelf    | Status: running

        Service: automate-cs-oc-erchef    | Status: running

        '
      dest: /tmp/molecule_test/var/opt/chef-automate/status.txt
      mode: '0644'
  - name: Create mock Chef Server status file
    ansible.builtin.copy:
      content: 'run: bookshelf: (pid 12345) 99s; run: log: (pid 12346) 99s

        run: nginx: (pid 12347) 99s; run: log: (pid 12348) 99s

        run: oc_bifrost: (pid 12349) 99s; run: log: (pid 12350) 99s

        run: oc_erchef: (pid 12351) 99s; run: log: (pid 12352) 99s

        run: oc_id: (pid 12353) 99s; run: log: (pid 12354) 99s

        run: opscode-expander: (pid 12355) 99s; run: log: (pid 12356) 99s

        run: opscode-solr4: (pid 12357) 99s; run: log: (pid 12358) 99s

        run: postgresql: (pid 12359) 99s; run: log: (pid 12360) 99s

        run: redis_lb: (pid 12361) 99s; run: log: (pid 12362) 99s

        '
      dest: /tmp/molecule_test/var/opt/opscode/status.txt
      mode: '0644'
  - name: Create mock user list file
    ansible.builtin.copy:
      content: '{{ chef_automate_username }}'
      dest: /tmp/molecule_test/var/opt/opscode/user-list.txt
      mode: '0644'
  - name: Create mock organization list file
    ansible.builtin.copy:
      content: '{{ chef_automate_orgname }}'
      dest: /tmp/molecule_test/var/opt/opscode/org-list.txt
      mode: '0644'
  - name: Create mock network listening file
    ansible.builtin.copy:
      content: 'tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      12345/nginx

        '
      dest: /tmp/molecule_test/var/opt/chef-automate/network-status.txt
      mode: '0644'
  - name: Create mock health API response
    ansible.builtin.copy:
      content: '{"status":"ok"}

        '
      dest: /tmp/molecule_test/var/opt/chef-automate/health-api.json
      mode: '0644'
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_username: jtonello
    chef_automate_longusername: John Tonello
    chef_automate_useremail: jtonello@chef.lab
    chef_automate_orgname: lab
    chef_automate_longorgname: Chef Lab
    chef_automate_userfilename: jtonello.pem
    chef_automate_orgfilename: lab-validator.pem
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_cli_binary: chef-automate
