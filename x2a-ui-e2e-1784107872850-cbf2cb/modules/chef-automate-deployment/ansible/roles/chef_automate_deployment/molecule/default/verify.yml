- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file was created
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
      fail_msg: Hostname is not set correctly
      success_msg: Hostname is set correctly
    when: hostname_file.stat.exists
  - name: Check vm.max_map_count file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_file
  - name: Assert vm.max_map_count file was created
    ansible.builtin.assert:
      that:
      - max_map_count_file.stat.exists
      fail_msg: vm.max_map_count file not found
      success_msg: vm.max_map_count file exists
  - name: Get vm.max_map_count content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_content
    when: max_map_count_file.stat.exists
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - (max_map_count_content.content | b64decode | trim) == '262144'
      fail_msg: vm.max_map_count is not set correctly
      success_msg: vm.max_map_count is set correctly
    when: max_map_count_file.stat.exists
  - name: Check vm.dirty_expire_centisecs file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_file
  - name: Assert vm.dirty_expire_centisecs file was created
    ansible.builtin.assert:
      that:
      - dirty_expire_centisecs_file.stat.exists
      fail_msg: vm.dirty_expire_centisecs file not found
      success_msg: vm.dirty_expire_centisecs file exists
  - name: Get vm.dirty_expire_centisecs content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_content
    when: dirty_expire_centisecs_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - (dirty_expire_centisecs_content.content | b64decode | trim) == '20000'
      fail_msg: vm.dirty_expire_centisecs is not set correctly
      success_msg: vm.dirty_expire_centisecs is set correctly
    when: dirty_expire_centisecs_file.stat.exists
  - name: Check Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI was created
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check user PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_pem_file
  - name: Assert user PEM file was created
    ansible.builtin.assert:
      that:
      - user_pem_file.stat.exists
      - user_pem_file.stat.isreg
      fail_msg: User PEM file not found
      success_msg: User PEM file exists
  - name: Check organization validator PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_validator_pem_file
  - name: Assert organization validator PEM file was created
    ansible.builtin.assert:
      that:
      - org_validator_pem_file.stat.exists
      - org_validator_pem_file.stat.isreg
      fail_msg: Organization validator PEM file not found
      success_msg: Organization validator PEM file exists
  - name: Check Chef Automate status file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/opt/chef-automate/status.txt
    register: chef_automate_status_file
  - name: Assert Chef Automate status file was created
    ansible.builtin.assert:
      that:
      - chef_automate_status_file.stat.exists
      fail_msg: Chef Automate status file not found
      success_msg: Chef Automate status file exists
  - name: Check Chef Server status file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/opt/opscode/status.txt
    register: chef_server_status_file
  - name: Assert Chef Server status file was created
    ansible.builtin.assert:
      that:
      - chef_server_status_file.stat.exists
      fail_msg: Chef Server status file not found
      success_msg: Chef Server status file exists
  - name: Check user list file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/opt/opscode/user-list.txt
    register: user_list_file
  - name: Assert user list file was created
    ansible.builtin.assert:
      that:
      - user_list_file.stat.exists
      fail_msg: User list file not found
      success_msg: User list file exists
  - name: Get user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/opt/opscode/user-list.txt
    register: user_list_content
    when: user_list_file.stat.exists
  - name: Assert user exists in list
    ansible.builtin.assert:
      that:
      - '''jtonello'' in (user_list_content.content | b64decode)'
      fail_msg: User jtonello not found in user list
      success_msg: User jtonello found in user list
    when: user_list_file.stat.exists
  - name: Check organization list file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/opt/opscode/org-list.txt
    register: org_list_file
  - name: Assert organization list file was created
    ansible.builtin.assert:
      that:
      - org_list_file.stat.exists
      fail_msg: Organization list file not found
      success_msg: Organization list file exists
  - name: Get organization list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/opt/opscode/org-list.txt
    register: org_list_content
    when: org_list_file.stat.exists
  - name: Assert organization exists in list
    ansible.builtin.assert:
      that:
      - '''lab'' in (org_list_content.content | b64decode)'
      fail_msg: Organization lab not found in organization list
      success_msg: Organization lab found in organization list
    when: org_list_file.stat.exists
  - name: Check network status file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/opt/chef-automate/network-status.txt
    register: network_status_file
  - name: Assert network status file was created
    ansible.builtin.assert:
      that:
      - network_status_file.stat.exists
      fail_msg: Network status file not found
      success_msg: Network status file exists
  - name: Get network status content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/opt/chef-automate/network-status.txt
    register: network_status_content
    when: network_status_file.stat.exists
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - '''0.0.0.0:443'' in (network_status_content.content | b64decode)'
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    when: network_status_file.stat.exists
    tags: molecule-notest
  - name: Check health API file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/opt/chef-automate/health-api.json
    register: health_api_file
  - name: Assert health API file was created
    ansible.builtin.assert:
      that:
      - health_api_file.stat.exists
      fail_msg: Health API file not found
      success_msg: Health API file exists
  - name: Get health API content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/opt/chef-automate/health-api.json
    register: health_api_content
    when: health_api_file.stat.exists
  - name: Assert health API status is ok
    ansible.builtin.assert:
      that:
      - '''status'' in (health_api_content.content | b64decode | from_json)'
      - (health_api_content.content | b64decode | from_json).status == 'ok'
      fail_msg: Health API status is not ok
      success_msg: Health API status is ok
    when: health_api_file.stat.exists
    tags: molecule-notest
  - name: Check Chef Automate service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate services are running
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      fail_msg: Chef Automate service not found
      success_msg: Chef Automate service found
    tags: molecule-notest
  - name: Check Chef Server service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Server services are running
    ansible.builtin.assert:
      that:
      - '''chef-server.service'' in ansible_facts.services'
      fail_msg: Chef Server service not found
      success_msg: Chef Server service found
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
  - name: Check web UI access
    ansible.builtin.uri:
      url: https://localhost/api/v0/health
      validate_certs: false
      status_code: 200
    tags: molecule-notest
