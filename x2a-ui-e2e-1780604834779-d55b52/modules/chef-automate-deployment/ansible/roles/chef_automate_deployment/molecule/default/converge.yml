---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/usr/bin

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "/tmp/molecule_test/etc/{{ item.name }}"
        mode: "0644"
      loop:
        - name: sysctl_vm_max_map_count
          value: "vm.max_map_count={{ chef_automate_vm_max_map_count }}"
        - name: sysctl_vm_dirty_expire_centisecs
          value: "vm.dirty_expire_centisecs={{ chef_automate_vm_dirty_expire_centisecs }}"

    # Simulate Chef Automate CLI download and extraction
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/usr/bin/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.copy:
        content: |
          Chef Automate deployed with:
          - Products: {{ chef_automate_products | join(', ') }}
          - Accept Terms: {{ chef_automate_accept_terms_and_mlsa }}
        dest: "/tmp/molecule_test/hab/chef-automate-deployed"
        mode: "0644"

    # Simulate Chef Server CLI tools
    - name: Create Chef Server CLI tools
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Server CLI mock'\n"
        dest: "/tmp/molecule_test/usr/bin/chef-server-ctl"
        mode: "0755"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/{{ chef_automate_user_key_path }}"
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORG VALIDATOR KEY\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/{{ chef_automate_org_key_path }}"
        mode: "0600"

    # Simulate Chef Server status output
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          chef-server-ctl status output:
          run: service_name: running
          log: service_name: running
        dest: "/tmp/molecule_test/hab/chef-server-status"
        mode: "0644"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          chef-automate status output:
          Service: automate-gateway      OK
          Service: automate-ui           OK
          Service: infra-server          OK
        dest: "/tmp/molecule_test/hab/chef-automate-status"
        mode: "0644"

    # Simulate user and organization list outputs
    - name: Create user list file
      ansible.builtin.copy:
        content: "jtonello"
        dest: "/tmp/molecule_test/hab/chef-user-list"
        mode: "0644"

    - name: Create organization list file
      ansible.builtin.copy:
        content: "lab"
        dest: "/tmp/molecule_test/hab/chef-org-list"
        mode: "0644"