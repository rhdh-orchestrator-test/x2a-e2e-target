---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache web server
    description:
      - Security hardening role that fixes the POODLE SSL vulnerability by updating Apache SSL configuration.
      - Disables vulnerable SSL protocols and enforces TLS 1.2 only.
      - Restarts Apache service to apply changes.
    options:
      apache_ssl_conf_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file.
      ssl_protocol_config:
        type: str
        required: false
        default: SSLProtocol -all +TLSv1.2
        description: SSL protocol configuration string to fix POODLE vulnerability.
      restart_apache:
        type: bool
        required: false
        default: true
        description: Whether to restart Apache after configuration change.
