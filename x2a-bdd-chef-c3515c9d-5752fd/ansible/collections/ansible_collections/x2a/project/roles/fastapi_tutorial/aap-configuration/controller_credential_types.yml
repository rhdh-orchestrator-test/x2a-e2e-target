---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credential for the FastAPI application's PostgreSQL database user and connection.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL application username used to connect to fastapi_db.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi user; store in Ansible Vault or an approved secret manager.
        - id: database_url
          type: string
          label: Database Connection URL
          help_text: PostgreSQL connection URL used by the application, including the database host and name.
      required:
        - db_username
        - db_password
        - database_url
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_url: !unsafe "{{ database_url }}"
