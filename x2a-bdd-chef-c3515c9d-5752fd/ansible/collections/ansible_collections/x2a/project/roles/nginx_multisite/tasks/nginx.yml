---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Create nginx service user
  ansible.builtin.user:
    name: nginx
    system: true
    create_home: false
    state: present

- name: Deploy nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  register: nginx_multisite_main_config

- name: Deploy nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  register: nginx_multisite_security_config

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dictionary
    state: directory
    owner: nginx
    group: nginx
    mode: "0755"
    recurse: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site

- name: Deploy site index files
  ansible.builtin.copy:
    src: "{{ item_index['key'] }}/index.html" # noqa: R114 - source is a role-defined site key
    dest: "{{ item_index['value']['document_root'] }}/index.html" # noqa: R114 - path from role-defined sites dictionary
    owner: nginx
    group: nginx
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_index

- name: Reload nginx after configuration changes # noqa: L039 - variables are registered by the preceding configuration template tasks
  ansible.builtin.service:
    name: nginx
    state: reloaded
  when: nginx_multisite_main_config is changed or nginx_multisite_security_config is changed
