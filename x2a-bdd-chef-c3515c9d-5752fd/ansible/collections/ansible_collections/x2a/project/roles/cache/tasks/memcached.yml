---
- name: Install Memcached package
  ansible.builtin.package:
    name:
      - memcached
    state: present

- name: Create Memcached log directory
  ansible.builtin.file:
    path: "{{ cache_memcached_log_directory }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_user }}"
    mode: "0755"

- name: Create Memcached runtime directory
  ansible.builtin.file:
    path: "{{ cache_memcached_run_directory }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_user }}"
    mode: "0755"

- name: Configure Memcached service arguments
  ansible.builtin.copy:
    dest: /etc/sysconfig/memcached
    content: |
      PORT="{{ cache_memcached_tcp_port }}"
      USER="{{ cache_memcached_user }}"
      MAXCONN="{{ cache_memcached_max_connections }}"
      CACHESIZE="{{ cache_memcached_memory }}"
      OPTIONS="-l {{ cache_memcached_listen }} -U {{ cache_memcached_udp_port }} -I {{ cache_memcached_max_item_size }} -t {{ cache_memcached_threads }}"
    mode: "0644"
    backup: true
  notify: Restart cache services

- name: Enable and start Memcached
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
