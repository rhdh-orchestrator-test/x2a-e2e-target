---
controller_credential_types:
- name: Chef Infra Server Admin
  description: Credential type for Chef Infra Server Admin
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Admin Username
      help_text: Username for the Chef Infra Server admin account
    - id: password
      type: string
      label: Admin Password
      secret: true
      help_text: Password for the Chef Infra Server admin account
    - id: name
      type: string
      label: Full Name
      help_text: Full name for the Chef Infra Server admin user
    - id: email
      type: string
      label: Email Address
      help_text: Email address for the Chef Infra Server admin user
    - id: organization
      type: string
      label: Organization Name
      help_text: Name of the Chef organization to create
    required:
    - username
    - password
    - name
    - email
    - organization
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      name: !unsafe '{{ name }}'
      email: !unsafe '{{ email }}'
      organization: !unsafe '{{ organization }}'
