---
- name: Set credential variables from AAP credential or defaults
  ansible.builtin.set_fact:
    username: "{{ username | default(chef_automate_username) }}"
    password: "{{ password | default(chef_automate_password) }}"
    name: "{{ name | default(chef_automate_name) }}"
    email: "{{ email | default(chef_automate_email) }}"
    organization: "{{ organization | default(chef_automate_organization) }}"
    organization_full_name: "{{ organization_full_name | default(chef_automate_organization_full_name) }}"
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - username is defined
      - password is defined
      - name is defined
      - email is defined
      - organization is defined
    fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template.
    quiet: true
