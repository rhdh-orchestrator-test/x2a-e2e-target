---
- name: Create Chef Server admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ username | default(chef_automate_username) }}  {{ name | default(chef_automate_name) }}  {{ email | default(chef_automate_email)
      }}  "{{ password | default(chef_automate_password) }}"  --filename {{ username | default(chef_automate_username) }}.pem

      '
  args:
    creates: /root/{{ username | default(chef_automate_username) }}.pem
  become: true
  no_log: true
- name: Create Chef Server organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ organization | default(chef_automate_organization) }}  "{{ organization | default(chef_automate_organization_full_name) }}"  --association_user
      {{ username | default(chef_automate_username) }}  --filename {{ organization | default(chef_automate_organization) }}-validator.pem

      '
  args:
    creates: /root/{{ organization | default(chef_automate_organization) }}-validator.pem
  become: true
