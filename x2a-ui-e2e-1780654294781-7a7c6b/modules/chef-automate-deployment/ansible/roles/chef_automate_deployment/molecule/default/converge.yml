- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/chef-server
    - /tmp/molecule_test/etc/sysctl.d
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/root
  - name: Create Chef Automate CLI file
    ansible.builtin.file:
      path: /tmp/molecule_test/tmp/chef-automate
      state: touch
      mode: '0755'
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "[global]\n  v1 = true\n[deployment]\n  automate = true\n  infra_server = true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create Chef Server config file
    ansible.builtin.copy:
      content: 'topology "standalone"

        api_fqdn "automate.chef.lab"

        '
      dest: /tmp/molecule_test/etc/chef-server/chef-server.rb
      mode: '0644'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/root/jtonello.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/root/lab-validator.pem
      mode: '0600'
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
