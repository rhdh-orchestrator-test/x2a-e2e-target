---
# Unsupported pre-flight checks: version-only diagnostics, ownership/mode output, pip list,
# password-authenticated database connectivity, optional PostgreSQL TCP listening, log review,
# and the endpoint's exact HTTP status (the plan does not specify one).
- name: Verify FastAPI tutorial deployment
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Verify PostgreSQL initialization on RedHat-family platforms
      ansible.builtin.stat:
        path: /var/lib/pgsql/data/PG_VERSION
      register: postgres_version_file
      when: ansible_facts['os_family'] in ['RedHat', 'Rocky', 'AlmaLinux', 'Amazon']

    - name: Assert PostgreSQL is initialized on RedHat-family platforms
      ansible.builtin.assert:
        that:
          - postgres_version_file['stat']['exists']
        fail_msg: PostgreSQL initialization marker is missing on this RedHat-family host.
      when: ansible_facts['os_family'] in ['RedHat', 'Rocky', 'AlmaLinux', 'Amazon']

    - name: Gather service facts for PostgreSQL and FastAPI
      ansible.builtin.service_facts:

    - name: Assert PostgreSQL is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['postgresql.service']['status'] == 'enabled'
          - ansible_facts['services']['postgresql.service']['state'] == 'running'
        fail_msg: PostgreSQL must be enabled and active.

    - name: Check that the fastapi PostgreSQL role exists
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT 1 FROM pg_roles WHERE rolname='fastapi';
      register: fastapi_role_check
      changed_when: false

    - name: Assert that the fastapi PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - fastapi_role_check['stdout'] | trim == '1'
        fail_msg: The fastapi PostgreSQL role was not found.

    - name: Check the fastapi_db database and owner
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT datname, pg_catalog.pg_get_userbyid(datdba) FROM pg_database WHERE datname='fastapi_db';
      register: fastapi_database_check
      changed_when: false

    - name: Assert the fastapi_db database is owned by fastapi
      ansible.builtin.assert:
        that:
          - fastapi_database_check['stdout'] | trim == 'fastapi_db|fastapi'
        fail_msg: The fastapi_db database is missing or has the wrong owner.

    - name: Verify the application directory exists
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: application_directory

    - name: Assert the application directory exists
      ansible.builtin.assert:
        that:
          - application_directory['stat']['exists']
          - application_directory['stat']['isdir']
        fail_msg: The FastAPI application directory is missing.

    - name: Verify requirements.txt exists
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/requirements.txt
      register: requirements_file

    - name: Assert requirements.txt exists
      ansible.builtin.assert:
        that:
          - requirements_file['stat']['isreg']
        fail_msg: The application requirements file is missing.

    - name: Verify the virtual environment executables
      ansible.builtin.stat:
        path: "{{ item_virtualenv['path'] }}"
      loop:
        - path: /opt/fastapi-tutorial/venv/bin/python
        - path: /opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_virtualenv
      register: virtual_environment_executables

    - name: Assert the virtual environment executables exist and are executable
      ansible.builtin.assert:
        that:
          - item_virtualenv_result['stat']['isreg']
          - item_virtualenv_result['stat']['executable']
        fail_msg: A required virtual environment executable is missing or not executable.
      loop: "{{ virtual_environment_executables['results'] }}"
      loop_control:
        loop_var: item_virtualenv_result

    - name: Check the deployed Git branch
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - rev-parse
          - --abbrev-ref
          - HEAD
      register: deployed_git_branch
      changed_when: false

    - name: Assert the deployed Git branch is main
      ansible.builtin.assert:
        that:
          - deployed_git_branch['stdout'] | trim == 'main'
        fail_msg: The application is not deployed on the main branch.

    - name: Read the application environment file
      ansible.builtin.slurp:
        src: /opt/fastapi-tutorial/.env
      register: application_environment

    - name: Assert the expected non-secret environment values
      ansible.builtin.assert:
        that:
          - "'PROJECT_NAME=\"FastAPI Tutorial\"' in (application_environment['content'] | b64decode)"
          - "'API_VERSION=1.0.0' in (application_environment['content'] | b64decode)"
        fail_msg: The expected non-secret application environment values are missing.

    - name: Verify the FastAPI systemd unit exists
      ansible.builtin.stat:
        path: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit_file

    - name: Assert the FastAPI systemd unit exists
      ansible.builtin.assert:
        that:
          - fastapi_unit_file['stat']['isreg']
        fail_msg: The FastAPI systemd unit file is missing.

    - name: Validate the FastAPI systemd unit
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/fastapi-tutorial.service
      changed_when: false

    - name: Read the FastAPI systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit_content

    - name: Assert the expected FastAPI systemd unit settings
      ansible.builtin.assert:
        that:
          - "'User=root' in (fastapi_unit_content['content'] | b64decode)"
          - "'WorkingDirectory=/opt/fastapi-tutorial' in (fastapi_unit_content['content'] | b64decode)"
          - "'Environment=\"PATH=/opt/fastapi-tutorial/venv/bin\"' in (fastapi_unit_content['content'] | b64decode)"
          - "'ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000' in (fastapi_unit_content['content'] | b64decode)"
          - "'Restart=always' in (fastapi_unit_content['content'] | b64decode)"
        fail_msg: The FastAPI systemd unit is missing one or more expected settings.

    - name: Assert the FastAPI service is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['fastapi-tutorial.service']['status'] == 'enabled'
          - ansible_facts['services']['fastapi-tutorial.service']['state'] == 'running'
        fail_msg: The FastAPI service must be enabled and active.

    - name: Wait for FastAPI to listen on port 8000
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8000
        state: started
        timeout: 30

    - name: Check the FastAPI root endpoint responds
      ansible.builtin.command:
        argv:
          - curl
          - --fail-with-body
          - --silent
          - --show-error
          - http://127.0.0.1:8000/
      register: fastapi_endpoint_check
      changed_when: false
      failed_when: false

    - name: Assert the FastAPI root endpoint is reachable
      ansible.builtin.assert:
        that:
          - fastapi_endpoint_check['rc'] == 0
        fail_msg: The FastAPI root endpoint did not return an HTTP response.
