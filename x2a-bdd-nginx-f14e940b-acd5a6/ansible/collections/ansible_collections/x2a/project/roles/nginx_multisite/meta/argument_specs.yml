---
argument_specs:
  main:
    short_description: Install and configure a secure nginx multisite server
    description:
      - Deploys nginx with three configurable static HTTPS virtual hosts.
      - Configures self-signed TLS certificates, fail2ban, UFW, sysctl hardening, and SSH hardening.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Dictionary of nginx site names and their document-root and TLS settings.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory where site certificates are stored.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory where site private keys are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and enable fail2ban.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and enable UFW.
      nginx_multisite_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login.
      nginx_multisite_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
