---
- name: Validate nginx configuration and reload
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  notify: Reload nginx
  listen: Validate and reload nginx

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
  listen: Reload nginx

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload security sysctl
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.rp_filter
    value: "1"
    sysctl_file: /etc/sysctl.d/99-security.conf
    state: present
    reload: true

- name: Restart SSH
  ansible.builtin.service:
    name: ssh
    state: restarted
