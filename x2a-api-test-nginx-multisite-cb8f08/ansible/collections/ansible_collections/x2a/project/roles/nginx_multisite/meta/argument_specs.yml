---
argument_specs:
  main:
    short_description: Install and configure a hardened nginx multisite deployment
    description:
      - Configures nginx, Fail2ban, UFW, SSH hardening, kernel security settings, TLS certificates, and HTTPS sites.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
            cert_file: /etc/ssl/certs/test.cluster.local.crt
            key_file: /etc/ssl/private/test.cluster.local.key
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
            cert_file: /etc/ssl/certs/ci.cluster.local.crt
            key_file: /etc/ssl/private/ci.cluster.local.key
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
            cert_file: /etc/ssl/certs/status.cluster.local.crt
            key_file: /etc/ssl/private/status.cluster.local.key
        description: Site definitions, document roots, TLS settings, and certificate paths.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for site certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban protection is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_disable_root_ssh:
        type: bool
        required: false
        default: true
        description: Whether root SSH login is disabled.
      nginx_multisite_disable_password_ssh:
        type: bool
        required: false
        default: true
        description: Whether SSH password authentication is disabled.
