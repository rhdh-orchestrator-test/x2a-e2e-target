---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Deploy fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Read UFW status
  ansible.builtin.command:
    cmd: ufw status
  changed_when: false
  register: ufw_status
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default deny policy  # noqa: L039 - ufw_status is registered by the preceding task when UFW is enabled
  ansible.builtin.command:
    cmd: ufw --force default deny
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Default: deny' not in ufw_status.stdout"
  changed_when: true

- name: Allow SSH through UFW  # noqa: L039 - ufw_status is registered by the preceding task when UFW is enabled
  ansible.builtin.command:
    cmd: ufw allow ssh
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'22/tcp' not in ufw_status.stdout"
  changed_when: true

- name: Allow HTTP through UFW  # noqa: L039 - ufw_status is registered by the preceding task when UFW is enabled
  ansible.builtin.command:
    cmd: ufw allow http
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'80/tcp' not in ufw_status.stdout"
  changed_when: true

- name: Allow HTTPS through UFW  # noqa: L039 - ufw_status is registered by the preceding task when UFW is enabled
  ansible.builtin.command:
    cmd: ufw allow https
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'443/tcp' not in ufw_status.stdout"
  changed_when: true

- name: Enable UFW  # noqa: L039 - ufw_status is registered by the preceding task when UFW is enabled
  ansible.builtin.command:
    cmd: ufw --force enable
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Status: active' not in ufw_status.stdout"
  changed_when: true

- name: Deploy kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    backup: true
    create: false
  when: nginx_multisite_disable_root_ssh | bool
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    backup: true
    create: false
  when: nginx_multisite_disable_password_ssh | bool
  notify: Restart SSH
