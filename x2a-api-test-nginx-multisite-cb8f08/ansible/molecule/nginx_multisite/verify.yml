---
# Unsupported pre-flight diagnostics without a stated expected result are omitted:
# grep/stat output checks, journal and log tails, SSH service/port discovery, UFW and
# Fail2ban status output, and the HTTPS curl diagnostics.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are present
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        fail_msg: Required package is not installed.
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are enabled and active
      ansible.builtin.assert:
        that:
          - item_service in ansible_facts['services']
          - ansible_facts['services'][item_service]['state'] == 'running'
          - ansible_facts['services'][item_service]['status'] == 'enabled'
        fail_msg: Required service is not enabled and active.
      loop:
        - nginx.service
        - fail2ban.service
      loop_control:
        loop_var: item_service

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_test['rc'] == 0
        fail_msg: nginx configuration validation failed.

    - name: Verify required nginx configuration and site files
      ansible.builtin.stat:
        path: "{{ item_nginx_file['path'] }}"
      register: nginx_files
      loop:
        - path: /etc/nginx/nginx.conf
        - path: /etc/nginx/conf.d/security.conf
        - path: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-available/status.cluster.local
        - path: /opt/server/test/index.html
        - path: /opt/server/ci/index.html
        - path: /opt/server/status/index.html
        - path: /etc/ssl/certs/test.cluster.local.crt
        - path: /etc/ssl/certs/ci.cluster.local.crt
        - path: /etc/ssl/certs/status.cluster.local.crt
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_nginx_file

    - name: Assert required nginx, site, content, and TLS files exist
      ansible.builtin.assert:
        that:
          - item_nginx_stat['stat']['exists']
          - item_nginx_stat['stat']['isreg']
        fail_msg: Required deployment file is missing or is not a regular file.
      loop: "{{ nginx_files['results'] }}"
      loop_control:
        loop_var: item_nginx_stat

    - name: Verify enabled site links
      ansible.builtin.stat:
        path: "{{ item_site_link['path'] }}"
        follow: false
      register: site_links
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site_link

    - name: Assert enabled site links resolve to their available files
      ansible.builtin.assert:
        that:
          - item_site_stat['stat']['islnk']
          - item_site_stat['stat']['lnk_source'] == item_site_stat['item']['target']
        fail_msg: Enabled site link is missing or points to the wrong file.
      loop: "{{ site_links['results'] }}"
      loop_control:
        loop_var: item_site_stat

    - name: Verify the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']
        fail_msg: The default nginx site must be absent.

    - name: Verify HTTP redirects for every configured site
      ansible.builtin.uri:
        url: "http://127.0.0.1/"
        headers:
          Host: "{{ item_http_site['host'] }}"
        status_code: 301
        follow_redirects: none
        return_content: false
      register: http_redirects
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_http_site

    - name: Assert HTTP redirects target HTTPS
      ansible.builtin.assert:
        that:
          - item_http_result['status'] == 301
          - item_http_result['location'] is match('^https://')
        fail_msg: HTTP request did not return an HTTPS redirect.
      loop: "{{ http_redirects['results'] }}"
      loop_control:
        loop_var: item_http_result

    - name: Verify nginx HTTP and HTTPS listeners
      ansible.builtin.wait_for:
        port: "{{ item_listener['port'] }}"
        host: 127.0.0.1
        state: started
        timeout: 5
      loop:
        - port: 80
        - port: 443
      loop_control:
        loop_var: item_listener

    - name: Verify certificates are currently valid
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate }}"
          - -noout
          - -checkend
          - "0"
      register: certificate_checks
      changed_when: false
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_certificate

    - name: Assert certificates have not expired
      ansible.builtin.assert:
        that:
          - item_certificate_result['rc'] == 0
        fail_msg: TLS certificate is expired or invalid.
      loop: "{{ certificate_checks['results'] }}"
      loop_control:
        loop_var: item_certificate_result
