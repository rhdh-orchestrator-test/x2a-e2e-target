---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/tmp
        - /tmp/molecule_test/key_storage

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl settings
    - name: Create max_map_count file
      ansible.builtin.copy:
        content: "262144"
        dest: "/tmp/molecule_test/proc/sys/vm/max_map_count"
        mode: "0644"

    - name: Create dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "20000"
        dest: "/tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs"
        mode: "0644"

    # Simulate Chef Automate CLI download and extraction
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/tmp/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.file:
        path: "/tmp/molecule_test/hab"
        state: directory
        mode: "0755"

    # Simulate user and organization PEM files
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          MOCK_USER_PEM_FILE_CONTENT
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/key_storage/jtonello.pem"
        mode: "0600"

    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          MOCK_ORG_VALIDATOR_PEM_FILE_CONTENT
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/key_storage/lab-validator.pem"
        mode: "0600"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-gateway
          Status: running
          Service: automate-postgresql
          Status: running
          Service: chef-server
          Status: running
        dest: "/tmp/molecule_test/tmp/chef-automate-status"
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          run: chef-server: (pid 12345) 123456s; run: log: (pid 12346) 123456s
          run: chef-solr: (pid 12347) 123456s; run: log: (pid 12348) 123456s
          run: postgresql: (pid 12349) 123456s; run: log: (pid 12350) 123456s
        dest: "/tmp/molecule_test/tmp/chef-server-status"
        mode: "0644"

    # Simulate Chef Server user list
    - name: Create Chef Server user list file
      ansible.builtin.copy:
        content: |
          jtonello
          admin
        dest: "/tmp/molecule_test/tmp/chef-server-user-list"
        mode: "0644"

    # Simulate Chef Server org list
    - name: Create Chef Server org list file
      ansible.builtin.copy:
        content: |
          lab
        dest: "/tmp/molecule_test/tmp/chef-server-org-list"
        mode: "0644"