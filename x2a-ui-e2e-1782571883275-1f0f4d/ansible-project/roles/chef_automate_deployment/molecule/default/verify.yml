---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Verify system configuration
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Verify sysctl settings
    - name: Check vm.max_map_count file
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_file

    - name: Assert vm.max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
          - max_map_count_file.stat.isreg
        fail_msg: "vm.max_map_count file not found"
        success_msg: "vm.max_map_count file exists"

    - name: Get vm.max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "262144"
        fail_msg: "vm.max_map_count not set correctly"
        success_msg: "vm.max_map_count set correctly"
      when: max_map_count_file.stat.exists

    - name: Check vm.dirty_expire_centisecs file
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_file

    - name: Assert vm.dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_centisecs_file.stat.exists
          - dirty_expire_centisecs_file.stat.isreg
        fail_msg: "vm.dirty_expire_centisecs file not found"
        success_msg: "vm.dirty_expire_centisecs file exists"

    - name: Get vm.dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_content
      when: dirty_expire_centisecs_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
        fail_msg: "vm.dirty_expire_centisecs not set correctly"
        success_msg: "vm.dirty_expire_centisecs set correctly"
      when: dirty_expire_centisecs_file.stat.exists

    # Verify Chef Automate CLI
    - name: Check Chef Automate CLI file
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli_file

    - name: Assert Chef Automate CLI file exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli_file.stat.exists
          - chef_automate_cli_file.stat.isreg
          - chef_automate_cli_file.stat.executable
        fail_msg: "Chef Automate CLI file not found or not executable"
        success_msg: "Chef Automate CLI file exists and is executable"

    # Verify Chef Automate deployment
    - name: Check Chef Automate deployment marker
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: hab_dir

    - name: Assert Chef Automate deployment marker exists
      ansible.builtin.assert:
        that:
          - hab_dir.stat.exists
          - hab_dir.stat.isdir
        fail_msg: "Chef Automate deployment marker not found"
        success_msg: "Chef Automate deployment marker exists"

    # Verify user and organization PEM files
    - name: Check user PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/key_storage/jtonello.pem
      register: user_pem_file

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem_file.stat.exists
          - user_pem_file.stat.isreg
          - user_pem_file.stat.size > 0
        fail_msg: "User PEM file not found"
        success_msg: "User PEM file exists"

    - name: Check organization validator PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/key_storage/lab-validator.pem
      register: org_validator_pem_file

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_validator_pem_file.stat.exists
          - org_validator_pem_file.stat.isreg
          - org_validator_pem_file.stat.size > 0
        fail_msg: "Organization validator PEM file not found"
        success_msg: "Organization validator PEM file exists"

    # The following checks would normally be performed but can't run in a container
    # They are tagged with molecule-notest to be skipped during molecule testing

    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: chef_automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - "'Status: running' in chef_automate_status.stdout"
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Server is running
      ansible.builtin.assert:
        that:
          - "'run: chef-server' in chef_server_status.stdout"
        fail_msg: "Chef Server is not running"
        success_msg: "Chef Server is running"
      tags: molecule-notest

    - name: Check Chef user creation
      ansible.builtin.command:
        cmd: sudo chef-server-ctl user-list
      register: chef_user_list
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef user was created
      ansible.builtin.assert:
        that:
          - "'jtonello' in chef_user_list.stdout"
        fail_msg: "Chef user not found"
        success_msg: "Chef user exists"
      tags: molecule-notest

    - name: Check Chef organization creation
      ansible.builtin.command:
        cmd: sudo chef-server-ctl org-list
      register: chef_org_list
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef organization was created
      ansible.builtin.assert:
        that:
          - "'lab' in chef_org_list.stdout"
        fail_msg: "Chef organization not found"
        success_msg: "Chef organization exists"
      tags: molecule-notest

    - name: Check Chef Automate UI accessibility
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
        status_code: 200
      register: chef_automate_ui
      tags: molecule-notest

    - name: Assert Chef Automate UI is accessible
      ansible.builtin.assert:
        that:
          - chef_automate_ui.status == 200
        fail_msg: "Chef Automate UI is not accessible"
        success_msg: "Chef Automate UI is accessible"
      tags: molecule-notest

    - name: Check Chef Infra Server API accessibility
      ansible.builtin.uri:
        url: https://localhost/organizations/lab
        validate_certs: false
        status_code: 200
      register: chef_infra_server_api
      tags: molecule-notest

    - name: Assert Chef Infra Server API is accessible
      ansible.builtin.assert:
        that:
          - chef_infra_server_api.status == 200
        fail_msg: "Chef Infra Server API is not accessible"
        success_msg: "Chef Infra Server API is accessible"
      tags: molecule-notest

    - name: Check services
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is active
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "ansible_facts.services['chef-automate.service'].state == 'running'"
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Assert Chef Server service is active
      ansible.builtin.assert:
        that:
          - "'chef-server.service' in ansible_facts.services"
          - "ansible_facts.services['chef-server.service'].state == 'running'"
        fail_msg: "Chef Server service is not running"
        success_msg: "Chef Server service is running"
      tags: molecule-notest

    - name: Check network listening
      ansible.builtin.command:
        cmd: ss -tlnp | grep 443
      register: network_listening
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - "':443' in network_listening.stdout"
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest