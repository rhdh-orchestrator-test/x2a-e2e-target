---
- name: Ensure key file storage directory exists
  ansible.builtin.file:
    path: "{{ key_file_storage_path }}"
    state: directory
    mode: "0750"
  become: true
  when: key_file_storage_path != "."
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ key_file_storage_path }}/{{ user_key_file }}

      '
  become: true
  args:
    creates: "{{ key_file_storage_path }}/{{ user_key_file }}"
  register: user_create_result
  changed_when: user_create_result.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ orgname }} "{{ longorgname }}" --association_user {{ username }} --filename {{ key_file_storage_path }}/{{ org_validator_file
      }}

      '
  become: true
  args:
    creates: "{{ key_file_storage_path }}/{{ org_validator_file }}"
  register: org_create_result
  changed_when: org_create_result.rc == 0
