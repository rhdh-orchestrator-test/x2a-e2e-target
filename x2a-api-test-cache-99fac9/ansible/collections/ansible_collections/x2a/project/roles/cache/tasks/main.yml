---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install Redis package
  ansible.builtin.package:
    name: "{{ cache_redis_package }}"
    state: present

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Ensure Redis configuration directory exists
  ansible.builtin.file:
    path: "{{ cache_redis_config_path | dirname }}"  # noqa: R114 - path is derived from role vars
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render Redis instance configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_path }}"  # noqa: R114 - path is defined in role vars
    owner: redis
    group: redis
    mode: "0640"
    backup: true
  notify: Restart Redis
  no_log: "{{ cache_secure_logging }}"

- name: Enable and start Redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    enabled: true
    state: started
