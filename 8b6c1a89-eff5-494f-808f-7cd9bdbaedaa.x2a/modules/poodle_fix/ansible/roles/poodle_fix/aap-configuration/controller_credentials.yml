  description: Credential for poodle_fix
  organization: Default
  credential_type: Chef Automate Setup Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Chef Server Setup Credentials - poodle_fix
  description: Credential for poodle_fix
  organization: Default
  credential_type: Chef Server Setup Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
