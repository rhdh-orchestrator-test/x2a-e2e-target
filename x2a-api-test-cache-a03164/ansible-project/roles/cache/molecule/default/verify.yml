---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis and Memcached configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /etc/redis/6379.conf
        - /var/log/redis
      loop_control:
        loop_var: item_config
      register: config_stat_results

    - name: Assert configuration files and directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: "Expected configuration file or directory not found"
      loop: "{{ config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check Redis log directory permissions
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory has correct permissions
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['isdir']
          - redis_log_dir_stat['stat']['pw_name'] == 'redis'
          - redis_log_dir_stat['stat']['gr_name'] == 'redis'
          - redis_log_dir_stat['stat']['mode'] == '0755'
        fail_msg: "Redis log directory permissions incorrect"

    - name: Check services are running
      ansible.builtin.service_facts:

    - name: Assert Redis service is active
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
        fail_msg: "Redis service not running"

    - name: Assert Memcached service is active
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - "ansible_facts.services['memcached.service']['state'] == 'running'"
        fail_msg: "Memcached service not running"

    - name: Check Redis is listening on port 6379
      ansible.builtin.wait_for:
        port: 6379
        host: localhost
        timeout: 10

    - name: Check Memcached is listening on port 11211
      ansible.builtin.wait_for:
        port: 11211
        host: localhost
        timeout: 10

    - name: Read Redis configuration file
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis configuration contains requirepass
      ansible.builtin.assert:
        that:
          - "'requirepass' in (redis_config_content['content'] | b64decode)"
        fail_msg: "Redis configuration missing requirepass setting"

    - name: Assert Redis configuration has replica settings removed
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in (redis_config_content['content'] | b64decode)"
          - "'replica-read-only' not in (redis_config_content['content'] | b64decode)"
          - "'repl-ping-replica-period' not in (redis_config_content['content'] | b64decode)"
          - "'client-output-buffer-limit' not in (redis_config_content['content'] | b64decode)"
          - "'replica-priority' not in (redis_config_content['content'] | b64decode)"
        fail_msg: "Redis configuration still contains replica settings"

- name: Verify Redis Authentication
  hosts: all
  gather_facts: false
  tasks:
    - name: Test Redis connectivity without authentication (should fail)
      ansible.builtin.command:
        cmd: redis-cli -p 6379 ping
      register: redis_no_auth_result
      failed_when: false
      changed_when: false

    - name: Assert Redis requires authentication
      ansible.builtin.assert:
        that:
          - redis_no_auth_result['rc'] != 0
        fail_msg: "Redis should require authentication but doesn't"

    - name: Test Redis connectivity with authentication
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 ping
      register: redis_auth_result
      changed_when: false

    - name: Assert Redis authentication works
      ansible.builtin.assert:
        that:
          - redis_auth_result['rc'] == 0
          - "'PONG' in redis_auth_result['stdout']"
        fail_msg: "Redis authentication failed"

    - name: Test Redis set/get operations
      ansible.builtin.command:
        cmd: "{{ item_redis_cmd }}"
      loop:
        - redis-cli -p 6379 -a redis_secure_password_123 set test_key "test_value"
        - redis-cli -p 6379 -a redis_secure_password_123 get test_key
        - redis-cli -p 6379 -a redis_secure_password_123 del test_key
      loop_control:
        loop_var: item_redis_cmd
      register: redis_ops_results
      changed_when: false

    - name: Assert Redis operations work correctly
      ansible.builtin.assert:
        that:
          - redis_ops_results['results'][0]['stdout'] == 'OK'
          - redis_ops_results['results'][1]['stdout'] == 'test_value'
          - redis_ops_results['results'][2]['stdout'] == '1'
        fail_msg: "Redis operations failed"

- name: Verify Memcached Functionality
  hosts: all
  gather_facts: false
  tasks:
    - name: Test Memcached stats command
      ansible.builtin.shell: |
        echo "stats" | nc localhost 11211
      register: memcached_stats_result
      changed_when: false

    - name: Assert Memcached responds to stats
      ansible.builtin.assert:
        that:
          - memcached_stats_result['rc'] == 0
          - "'STAT' in memcached_stats_result['stdout']"
        fail_msg: "Memcached stats command failed"