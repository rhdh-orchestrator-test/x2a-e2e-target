---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create directory structure for Apache mods-available
      ansible.builtin.file:
        path: "/tmp/molecule_test/etc/apache2/mods-available"
        state: directory
        mode: "0755"

    - name: Create sample Apache SSL configuration file
      ansible.builtin.copy:
        content: |
          # Sample Apache SSL configuration file
          # This represents the original file before the role applies changes
          SSLEngine on
          SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
          SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
          SSLProtocol all -SSLv3
        dest: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
        mode: "0644"

    # We don't include the role directly since it would try to modify the real /etc path
    # Instead, we simulate what the role would do in our test environment
    - name: Simulate poodle_fix role action - Fix SSL in Apache
      ansible.builtin.replace:
        dest: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
        regexp: ^SSLProtocol.*$
        replace: SSLProtocol -all +TLSv1.2