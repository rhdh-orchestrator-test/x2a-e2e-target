---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check if Apache SSL configuration file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_conf_file

    - name: Assert SSL configuration file exists
      ansible.builtin.assert:
        that:
          - ssl_conf_file.stat.exists
          - ssl_conf_file.stat.isreg
        fail_msg: "Apache SSL configuration file not found"
        success_msg: "Apache SSL configuration file exists"

    - name: Get SSL configuration file content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_conf_content

    - name: Assert SSL configuration has been updated for POODLE mitigation
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in ssl_conf_content.content | b64decode"
          - "'SSLProtocol all -SSLv3' not in ssl_conf_content.content | b64decode"
        fail_msg: "SSL configuration not properly updated to mitigate POODLE vulnerability"
        success_msg: "SSL configuration properly updated to mitigate POODLE vulnerability"

    # The following checks would be performed on a real system but can't run in a container
    # They are tagged with molecule-notest so they're skipped during molecule testing

    - name: Check Apache configuration syntax
      ansible.builtin.command: apache2ctl configtest
      changed_when: false
      tags: molecule-notest

    - name: Check SSL/TLS configuration with nmap
      ansible.builtin.command: nmap --script ssl-enum-ciphers -p 443 localhost
      changed_when: false
      register: nmap_result
      tags: molecule-notest

    - name: Assert only TLSv1.2 is enabled
      ansible.builtin.assert:
        that:
          - "'TLSv1.2' in nmap_result.stdout"
          - "'SSLv3' not in nmap_result.stdout"
          - "'TLSv1.0' not in nmap_result.stdout"
          - "'TLSv1.1' not in nmap_result.stdout"
        fail_msg: "SSL/TLS configuration is not secure"
        success_msg: "SSL/TLS configuration is secure"
      tags: molecule-notest

    - name: Verify SSH configuration
      ansible.builtin.command: sshd -t
      changed_when: false
      tags: molecule-notest

    - name: Test TLS connection with OpenSSL
      ansible.builtin.command: openssl s_client -connect localhost:443 -tls1_2
      changed_when: false
      register: openssl_result
      tags: molecule-notest

    - name: Assert TLSv1.2 connection succeeds
      ansible.builtin.assert:
        that:
          - "'CONNECTED' in openssl_result.stdout"
        fail_msg: "TLSv1.2 connection failed"
        success_msg: "TLSv1.2 connection succeeded"
      tags: molecule-notest