---
- name: Install memcached
  ansible.builtin.package:
    name: memcached
    state: present

- name: Enable and start memcached
  ansible.builtin.service:
    name: memcached
    enabled: true
    state: started

- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Redis cache server  # noqa: L038 - eloy.redis.redis is declared in the role requirements
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: 6379
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Check whether the Redis configuration exists
  ansible.builtin.stat:
    path: /etc/redis/6379.conf
  register: redis_config

- name: Remove replica stale data directive from Redis configuration  # noqa: L039 - redis_config is registered by the prior stat task
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^replica-serve-stale-data.*$
    state: absent
    create: false
  when: redis_config.stat.exists
  notify: Restart Redis

- name: Remove replica read only directive from Redis configuration  # noqa: L039 - redis_config is registered by the prior stat task
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^replica-read-only.*$
    state: absent
    create: false
  when: redis_config.stat.exists
  notify: Restart Redis

- name: Remove replica ping period directive from Redis configuration  # noqa: L039 - redis_config is registered by the prior stat task
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^repl-ping-replica-period.*$
    state: absent
    create: false
  when: redis_config.stat.exists
  notify: Restart Redis

- name: Remove client output buffer limit directive from Redis configuration  # noqa: L039 - redis_config is registered by the prior stat task
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^client-output-buffer-limit.*$
    state: absent
    create: false
  when: redis_config.stat.exists
  notify: Restart Redis

- name: Remove replica priority directive from Redis configuration  # noqa: L039 - redis_config is registered by the prior stat task
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^replica-priority.*$
    state: absent
    create: false
  when: redis_config.stat.exists
  notify: Restart Redis
