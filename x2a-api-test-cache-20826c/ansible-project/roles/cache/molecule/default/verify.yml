---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/redis/6379.conf
      register: redis_config_stat

    - name: Assert Redis configuration file was created
      ansible.builtin.assert:
        that:
          - redis_config_stat['stat']['exists']
          - redis_config_stat['stat']['size'] > 0
        fail_msg: "Redis configuration file not found"

    - name: Check Redis log directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory was created
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['exists']
          - redis_log_dir_stat['stat']['isdir']
        fail_msg: "Redis log directory not found"

    - name: Check memcached log file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/memcached.log
      register: memcached_log_stat

    - name: Assert memcached log file was created
      ansible.builtin.assert:
        that:
          - memcached_log_stat['stat']['exists']
          - memcached_log_stat['stat']['size'] > 0
        fail_msg: "Memcached log file not found"

    - name: Read Redis configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis configuration contains required settings
      ansible.builtin.assert:
        that:
          - "'requirepass redis_secure_password_123' in redis_config_decoded"
          - "'port 6379' in redis_config_decoded"
          - "'bind 127.0.0.1' in redis_config_decoded"
          - "'logfile /var/log/redis/redis-server.log' in redis_config_decoded"
        fail_msg: "Redis configuration missing required settings"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

    - name: Assert Redis configuration does not contain replica settings
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in redis_config_decoded"
          - "'replica-read-only' not in redis_config_decoded"
          - "'repl-ping-replica-period' not in redis_config_decoded"
          - "'replica-priority' not in redis_config_decoded"
        fail_msg: "Redis configuration contains replica settings that should be cleaned up"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

    # Service checks that cannot run in container environment
    - name: Check Redis service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
        fail_msg: "Redis service is not running"
      tags: molecule-notest

    - name: Check memcached service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert memcached service is running
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - "ansible_facts.services['memcached.service']['state'] == 'running'"
        fail_msg: "Memcached service is not running"
      tags: molecule-notest

    # Port connectivity checks that cannot run in container
    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 5
      tags: molecule-notest

    - name: Check memcached port is listening
      ansible.builtin.wait_for:
        port: 11211
        host: 127.0.0.1
        timeout: 5
      tags: molecule-notest

    # Redis connectivity tests that cannot run in container
    - name: Test Redis authentication (should fail without password)
      ansible.builtin.command:
        cmd: redis-cli -p 6379 ping
      register: redis_no_auth_result
      failed_when: redis_no_auth_result['rc'] == 0
      tags: molecule-notest

    - name: Test Redis authentication (should succeed with password)
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 ping
      register: redis_auth_result
      failed_when: redis_auth_result['rc'] != 0 or 'PONG' not in redis_auth_result['stdout']
      tags: molecule-notest

    - name: Test Redis basic operations
      ansible.builtin.command:
        cmd: "{{ item_redis_cmd }}"
      loop:
        - redis-cli -p 6379 -a redis_secure_password_123 set test_key test_value
        - redis-cli -p 6379 -a redis_secure_password_123 get test_key
        - redis-cli -p 6379 -a redis_secure_password_123 del test_key
      loop_control:
        loop_var: item_redis_cmd
      register: redis_ops_results
      tags: molecule-notest

    - name: Assert Redis operations succeeded
      ansible.builtin.assert:
        that:
          - redis_ops_results['results'][0]['rc'] == 0
          - redis_ops_results['results'][1]['rc'] == 0
          - "'test_value' in redis_ops_results['results'][1]['stdout']"
          - redis_ops_results['results'][2]['rc'] == 0
        fail_msg: "Redis basic operations failed"
      tags: molecule-notest