---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
- name: Install necessary packages
  ansible.builtin.apt:
    name: apache2={{ apache_version }}
- name: Install curl, openssl, PyOpenSSL
  ansible.builtin.apt:
    pkg:
      - curl
      - openssl
      - python3-openssl
- name: Install SSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present
- name: Create a directory for certs
  ansible.builtin.file:
    path: "{{ ssl_cert_path }}"
    state: directory
    owner: root
    group: www-data
    mode: "0750"
- name: Generate an openssl key
  community.crypto.openssl_privatekey:
    path: "{{ ssl_cert_path }}/apache.key"
    content: "{{ ssl_private_key | default(omit) }}"
    owner: root
    group: www-data
    mode: "0600"
- name: Generate an openssl csr
  community.crypto.openssl_csr:
    path: "{{ ssl_cert_path }}/apache.csr"
    privatekey_path: "{{ ssl_cert_path }}/apache.key"
    common_name: "{{ ssl_common_name }}"
    owner: root
    group: www-data
    mode: "0640"
- name: Generate a self-signed openssl certificate
  community.crypto.openssl_certificate:
    path: "{{ ssl_cert_path }}/apache.crt"
    privatekey_path: "{{ ssl_cert_path }}/apache.key"
    csr_path: "{{ ssl_cert_path }}/apache.csr"
    provider: selfsigned
    content: "{{ ssl_certificate | default(omit) }}"
    owner: root
    group: www-data
    mode: "0640"
- name: Configure Hello World virtual host
  ansible.builtin.template:
    src: virtualhost.conf.j2
    dest: /etc/apache2/sites-available/{{ website_name }}.conf
    owner: root
    group: www-data
    mode: "0640"
    force: true
- name: Create the website directory
  ansible.builtin.file:
    path: "{{ website_root }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"
- name: Deploy the Hello World website
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ website_root }}/index.html"
    owner: root
    group: root
    mode: "0644"
    force: true
- name: Deactivate the default virtualhost
  community.general.apache2_site:
    name: 000-default
    state: absent
- name: Activate the virtualhost
  community.general.apache2_site:
    name: "{{ website_name }}"
    state: present
  notify:
    - Restart apache
- name: Activate SSL on Apache
  community.general.apache2_module:
    name: ssl
    state: present
  notify:
    - Restart apache
