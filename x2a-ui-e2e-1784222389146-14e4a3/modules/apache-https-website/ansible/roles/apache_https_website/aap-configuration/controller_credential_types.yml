---
controller_credential_types:
- name: Chef Server Deployment Credentials
  description: Credentials used for Chef Server and Chef Automate deployment
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Server authentication
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Server authentication
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Apache SSL Certificate
  description: SSL certificate information for Apache HTTPS configuration
  kind: cloud
  inputs:
    fields:
    - id: ssl_private_key
      type: string
      label: SSL Private Key
      secret: true
      help_text: Private key for SSL certificate
    - id: ssl_certificate
      type: string
      label: SSL Certificate
      help_text: SSL certificate for HTTPS
    - id: ssl_common_name
      type: string
      label: SSL Common Name
      help_text: Common name for the SSL certificate
    required:
    - ssl_private_key
    - ssl_certificate
  injectors:
    extra_vars:
      ssl_private_key: !unsafe '{{ ssl_private_key }}'
      ssl_certificate: !unsafe '{{ ssl_certificate }}'
      ssl_common_name: !unsafe '{{ ssl_common_name }}'
