---
argument_specs:
  main:
    short_description: Configure Apache web server with HTTPS support
    description:
      - This role configures an Apache web server with HTTPS support using a self-signed certificate
      - Creates a simple "Hello World" website
    options:
      apache_version:
        type: str
        default: 2.4.41-4ubuntu3.10
        description: Apache version to install
      website_name:
        type: str
        default: helloworld
        description: Name of the website
      website_root:
        type: str
        default: /var/www/helloworld
        description: Document root path
      ssl_cert_path:
        type: str
        default: /etc/apache2/certs
        description: Path for SSL certificates
      ssl_common_name:
        type: str
        default: myhost
        description: Common name for SSL certificate
      ssl_private_key:
        type: str
        required: false
        description: SSL private key content (provided by AAP credential)
      ssl_certificate:
        type: str
        required: false
        description: SSL certificate content (provided by AAP credential)
