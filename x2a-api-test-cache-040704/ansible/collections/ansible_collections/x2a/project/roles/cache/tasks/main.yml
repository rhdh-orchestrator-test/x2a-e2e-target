---
- name: Check whether the Redis configuration exists
  ansible.builtin.stat:
    path: /etc/redis/6379.conf
  register: cache_redis_config

- name: Check whether the Redis service user exists
  ansible.builtin.getent:
    database: passwd
    key: redis
    fail_key: false
  register: cache_redis_user

- name: Create Redis log directory  # noqa: L039 - cache_redis_user is registered by the prior task
  ansible.builtin.file:
    path: /var/log/redis
    owner: redis
    group: redis
    mode: "0755"
    state: directory
    recurse: true
  when: cache_redis_user.ansible_facts.getent_passwd is defined and "redis" in cache_redis_user.ansible_facts.getent_passwd

- name: Remove unsupported Redis replication directives  # noqa: L039 - cache_redis_config is registered by the prior task
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: "^{{ item_cache_cleanup }}.*$"
    state: absent
    create: false
  loop:
    - replica-serve-stale-data
    - replica-read-only
    - repl-ping-replica-period
    - client-output-buffer-limit
    - replica-priority
  loop_control:
    loop_var: item_cache_cleanup
  when: cache_redis_config.stat.exists
