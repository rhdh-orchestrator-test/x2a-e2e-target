- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache config
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/apache2/mods-available
  - name: Create mock Apache SSL config file with vulnerable settings
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        # This represents the file before the poodle_fix role is applied

        SSLProtocol all -SSLv2

        SSLCipherSuite HIGH:MEDIUM:!aNULL:!MD5

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Simulate package installation (Apache)
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/sbin/apache2
      state: touch
      mode: '0755'
  - name: Simulate package installation (SSH)
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/sbin/sshd
      state: touch
      mode: '0755'
  - name: Apply POODLE fix to SSL config (simulating role execution)
    ansible.builtin.replace:
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
      mode: '0644'
