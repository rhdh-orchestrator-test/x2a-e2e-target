---
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: apache2
    state: present
- name: Ensure SSH server is installed
  ansible.builtin.package:
    name: openssh-server
    state: present
- name: Ensure Apache SSL module is enabled
  ansible.builtin.command: a2enmod ssl
  args:
    creates: /etc/apache2/mods-enabled/ssl.load
  register: ssl_module_enabled
  notify: Restart apache
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: "{{ ssl_poodle_apache_config_path }}"
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol {{ ssl_poodle_protocol_string }}
    mode: "0644"
  notify:
    - Restart apache
    - Restart sshd
