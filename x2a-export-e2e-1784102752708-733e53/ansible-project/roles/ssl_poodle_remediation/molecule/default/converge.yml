- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache config
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create directory structure for Apache mods-enabled
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-enabled
      state: directory
      mode: '0755'
  - name: Create mock Apache SSL module load file
    ansible.builtin.copy:
      content: '# Mock Apache SSL module load file

        LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.load
      mode: '0644'
  - name: Create mock Apache SSL config file (before remediation)
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        # This simulates the original file before remediation

        SSLProtocol all -SSLv3

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Simulate enabling SSL module
    ansible.builtin.file:
      src: /tmp/molecule_test/etc/apache2/mods-available/ssl.load
      dest: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.load
      state: link
      mode: '0644'
  - name: Apply SSL POODLE remediation (simulate role action)
    ansible.builtin.replace:
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
      mode: '0644'
