---
- name: Gather facts from all hosts
  ansible.builtin.setup:
  delegate_to: "{{ item_host }}"
  delegate_facts: true
  loop: "{{ groups['all'] }}"
  loop_control:
    loop_var: item_host
  run_once: true
- name: Build dynamic webserver backend list
  ansible.builtin.set_fact:
    dynamic_webservers: "{{ groups['webservers'] | default([]) | map('extract', hostvars) | selectattr('profile_app_server_enabled', 'defined') | selectattr('profile_app_server_enabled',
      'equalto', true) | list }}"
  when: groups['webservers'] is defined
- name: Build dynamic API backend list
  ansible.builtin.set_fact:
    dynamic_api_servers: "{{ groups['api_servers'] | default([]) | map('extract', hostvars) | selectattr('profile_app_server_enabled', 'defined') | selectattr('profile_app_server_enabled',
      'equalto', true) | list }}"
  when: groups['api_servers'] is defined
- name: Update webserver backend configuration with discovered servers
  ansible.builtin.template:
    src: backend.conf.j2
    dest: "{{ profile_haproxy_config_dir }}/conf.d/webservers-dynamic.cfg"
    owner: root
    group: "{{ profile_haproxy_group }}"
    mode: "0640"
    backup: true
  vars:
    backend_name: webservers-dynamic
    balance: roundrobin
    backend_port: 8080
    servers: "{{ dynamic_webservers | default([]) | map('dict2items') | map('selectattr', 'key', 'equalto', 'ansible_default_ipv4') | map('map', attribute='value.address')
      | list | zip(dynamic_webservers | default([]) | map('extract', 'inventory_hostname')) | map('zip', ['address', 'name']) | map('dict') | map('combine', {'weight':
      100}) | list }}"
    health_check: httpchk GET /health
    health_interval: 10s
    ssl_enabled: "{{ profile_haproxy_ssl_enabled }}"
  when: dynamic_webservers is defined and dynamic_webservers | length > 0
  notify: Restart haproxy
- name: Update API backend configuration with discovered servers
  ansible.builtin.template:
    src: backend.conf.j2
    dest: "{{ profile_haproxy_config_dir }}/conf.d/api-dynamic.cfg"
    owner: root
    group: "{{ profile_haproxy_group }}"
    mode: "0640"
    backup: true
  vars:
    backend_name: api-dynamic
    balance: leastconn
    backend_port: 3000
    servers: "{{ dynamic_api_servers | default([]) | map('dict2items') | map('selectattr', 'key', 'equalto', 'ansible_default_ipv4') | map('map', attribute='value.address')
      | list | zip(dynamic_api_servers | default([]) | map('extract', 'inventory_hostname')) | map('zip', ['address', 'name']) | map('dict') | map('combine', {'weight':
      100}) | list }}"
    health_check: httpchk GET /api/health
    health_interval: 10s
    ssl_enabled: "{{ profile_haproxy_ssl_enabled }}"
  when: dynamic_api_servers is defined and dynamic_api_servers | length > 0
  notify: Restart haproxy
