---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
- name: Restart haproxy
  ansible.builtin.systemd:
    name: "{{ profile_haproxy_service_name }}"
    state: restarted
- name: Reload haproxy
  ansible.builtin.systemd:
    name: "{{ profile_haproxy_service_name }}"
    state: reloaded
