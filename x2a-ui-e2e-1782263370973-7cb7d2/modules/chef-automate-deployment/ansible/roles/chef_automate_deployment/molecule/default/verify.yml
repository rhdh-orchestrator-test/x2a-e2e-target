---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check hostname configuration
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Check sysctl configuration
    - name: Check sysctl config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl config file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl config file not found"
        success_msg: "Sysctl config file exists"

    - name: Get sysctl config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count = 262144' in (sysctl_content.content | b64decode)"
        fail_msg: "vm.max_map_count not set correctly"
        success_msg: "vm.max_map_count set correctly"
      when: sysctl_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - "'vm.dirty_expire_centisecs = 20000' in (sysctl_content.content | b64decode)"
        fail_msg: "vm.dirty_expire_centisecs not set correctly"
        success_msg: "vm.dirty_expire_centisecs set correctly"
      when: sysctl_file.stat.exists

    # Check Chef Automate CLI
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Check Chef Automate config
    - name: Check Chef Automate config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config

    - name: Assert Chef Automate config file exists
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
          - chef_automate_config.stat.isreg
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    # Check user and organization PEM files
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_pem

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.isreg
        fail_msg: "User PEM file not found"
        success_msg: "User PEM file exists"

    - name: Check organization validator PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_validator_pem

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_validator_pem.stat.exists
          - org_validator_pem.stat.isreg
        fail_msg: "Organization validator PEM file not found"
        success_msg: "Organization validator PEM file exists"

    # Check service files
    - name: Check Chef Automate service file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      register: chef_automate_service

    - name: Assert Chef Automate service file exists
      ansible.builtin.assert:
        that:
          - chef_automate_service.stat.exists
          - chef_automate_service.stat.isreg
        fail_msg: "Chef Automate service file not found"
        success_msg: "Chef Automate service file exists"

    - name: Check Chef Server service file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/systemd/system/chef-server.service
      register: chef_server_service

    - name: Assert Chef Server service file exists
      ansible.builtin.assert:
        that:
          - chef_server_service.stat.exists
          - chef_server_service.stat.isreg
        fail_msg: "Chef Server service file not found"
        success_msg: "Chef Server service file exists"

    # The following checks would not work in a container environment
    # Adding them with molecule-notest tag as per instructions

    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: chef_automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server is not running"
        success_msg: "Chef Infra Server is running"
      tags: molecule-notest

    - name: Check user list
      ansible.builtin.command:
        cmd: sudo chef-server-ctl user-list
      register: user_list
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert user exists
      ansible.builtin.assert:
        that:
          - "'jtonello' in user_list.stdout"
        fail_msg: "User jtonello not found"
        success_msg: "User jtonello exists"
      tags: molecule-notest

    - name: Check organization list
      ansible.builtin.command:
        cmd: sudo chef-server-ctl org-list
      register: org_list
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert organization exists
      ansible.builtin.assert:
        that:
          - "'lab' in org_list.stdout"
        fail_msg: "Organization lab not found"
        success_msg: "Organization lab exists"
      tags: molecule-notest

    - name: Check service connectivity
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
      register: service_connectivity
      failed_when: false
      tags: molecule-notest

    - name: Assert service is accessible
      ansible.builtin.assert:
        that:
          - service_connectivity.status == 200
        fail_msg: "Service not accessible"
        success_msg: "Service is accessible"
      tags: molecule-notest

    - name: Check network listening
      ansible.builtin.command:
        cmd: ss -tlnp | grep 443
      register: network_listening
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - network_listening.rc == 0
        fail_msg: "Port 443 not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    - name: Check Chef Automate API
      ansible.builtin.uri:
        url: https://automate.chef.lab/api/v0/auth/version
        validate_certs: false
      register: api_check
      failed_when: false
      tags: molecule-notest

    - name: Assert API is accessible
      ansible.builtin.assert:
        that:
          - api_check.status == 200
        fail_msg: "API not accessible"
        success_msg: "API is accessible"
      tags: molecule-notest