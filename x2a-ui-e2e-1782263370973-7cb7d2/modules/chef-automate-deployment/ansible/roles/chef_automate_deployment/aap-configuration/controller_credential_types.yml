---
controller_credential_types:
- name: Chef Infra Server User
  description: Credential type for Chef Infra Server User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for the initial Chef Infra Server user
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name for the initial Chef Infra Server user
    - id: email
      type: string
      label: Email
      help_text: Email address for the initial Chef Infra Server user
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the initial Chef Infra Server user
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
      password: !unsafe '{{ password }}'
