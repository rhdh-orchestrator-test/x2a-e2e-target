---
controller_credential_types:
  - name: Redis Authentication
    description: Hardcoded Redis authentication password that must be migrated to protected Ansible Vault storage.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password used to authenticate clients to the Redis server on port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
