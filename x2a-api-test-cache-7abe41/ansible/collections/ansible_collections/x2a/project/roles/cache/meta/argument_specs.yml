---
argument_specs:
  main:
    short_description: Install and configure Memcached and Redis cache services.
    description:
      - Deploys Memcached with the configured listener and resource limits.
      - Configures a standalone authenticated Redis instance on port 6379.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks handling the Redis password.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
      memcached_version:
        type: str
        required: false
        default:
        description: Optional Memcached package version.
      memcached_memory:
        type: int
        required: false
        default: 64
        description: Maximum Memcached memory in megabytes.
      memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum number of Memcached connections.
      memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      memcached_threads:
        type: int
        required: false
        default:
        description: Optional number of Memcached worker threads.
      memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional Memcached experimental options.
      memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional Memcached command-line options.
      memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file descriptor limit.
      memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log file path.
      memcached_user:
        type: str
        required: false
        default: memcached
        description: User account running Memcached.
