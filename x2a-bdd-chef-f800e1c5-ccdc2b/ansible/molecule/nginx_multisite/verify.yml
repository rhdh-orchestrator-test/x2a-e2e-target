---
# Unsupported pre-flight checks: exact package versions, complete configuration grep output,
# certificate issuer/lifetime precision, all fail2ban ban-time details, firewall numbering,
# journal contents, and the lsof/ss process-owner diagnostics are not asserted here.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts.packages
        fail_msg: "Required package is not installed"
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert required services are enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts.services[item_service]['status'] == 'enabled'
          - ansible_facts.services[item_service]['state'] == 'running'
        fail_msg: "Required service is not enabled and active"
      loop:
        - nginx.service
        - fail2ban.service
      loop_control:
        loop_var: item_service

    - name: Assert SSH service is active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['ssh.service']['state'] == 'running' or
            ansible_facts.services['sshd.service']['state'] == 'running'
        fail_msg: "SSH service is not active"

    - name: Verify required configuration and content paths
      ansible.builtin.stat:
        path: "{{ item_path }}"
      register: required_paths
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/nginx/sites-available
        - /etc/nginx/sites-enabled
        - /etc/ssl/certs
        - /etc/ssl/private
      loop_control:
        loop_var: item_path

    - name: Assert required paths exist
      ansible.builtin.assert:
        that: item_path_result['stat']['exists']
        fail_msg: "Required deployment path is missing"
      loop: "{{ required_paths['results'] }}"
      loop_control:
        loop_var: item_path_result

    - name: Verify enabled site links
      ansible.builtin.stat:
        path: "{{ item_site['path'] }}"
        follow: false
      register: site_links
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site

    - name: Assert enabled sites are symbolic links
      ansible.builtin.assert:
        that:
          - item_site_link['stat']['islnk']
          - item_site_link['stat']['lnk_source'] == item_site_link['item']['target']
        fail_msg: "Enabled site link is missing or points to the wrong site"
      loop: "{{ site_links['results'] }}"
      loop_control:
        loop_var: item_site_link

    - name: Verify default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert default nginx site is absent
      ansible.builtin.assert:
        that: not default_site['stat']['exists']
        fail_msg: "The default nginx site must be absent"

    - name: Verify private key permissions and group
      ansible.builtin.stat:
        path: "{{ item_key }}"
      register: private_keys
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key

    - name: Assert private keys have the required mode and group
      ansible.builtin.assert:
        that:
          - item_private_key['stat']['mode'] == '0640'
          - item_private_key['stat']['gr_name'] == 'ssl-cert'
        fail_msg: "TLS private key permissions or group are incorrect"
      loop: "{{ private_keys['results'] }}"
      loop_control:
        loop_var: item_private_key

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_test['rc'] == 0
          - "'syntax is ok' in nginx_test['stderr']"
          - "'test is successful' in nginx_test['stderr']"
        fail_msg: "nginx configuration validation failed"

    - name: Verify SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: ssh_config

    - name: Assert SSH hardening settings
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (ssh_config['content'] | b64decode)"
          - "'PasswordAuthentication no' in (ssh_config['content'] | b64decode)"
        fail_msg: "SSH hardening settings are missing"

    - name: Verify site HTTP redirects
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_http['host'] }}"
        follow_redirects: none
        status_code: 301
      register: http_redirects
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_http

    - name: Assert site HTTP redirects use HTTPS
      ansible.builtin.assert:
        that: "item_redirect['location'] == 'https://' ~ item_redirect['item']['host'] ~ '/'"
        fail_msg: "HTTP did not redirect to the expected HTTPS site"
      loop: "{{ http_redirects['results'] }}"
      loop_control:
        loop_var: item_redirect

    - name: Verify site HTTPS responses and security headers
      ansible.builtin.uri:
        url: "https://{{ item_https['host'] }}/"
        headers:
          Host: "{{ item_https['host'] }}"
        validate_certs: false
        status_code: 200
      register: https_responses
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_https

    - name: Assert site HTTPS security headers are present
      ansible.builtin.assert:
        that:
          - "'strict-transport-security' in item_https_response['headers']"
          - "item_https_response['headers']['x-frame-options'] == 'DENY'"
          - "item_https_response['headers']['x-content-type-options'] == 'nosniff'"
          - "'x-xss-protection' in item_https_response['headers']"
          - "'referrer-policy' in item_https_response['headers']"
          - "'content-security-policy' in item_https_response['headers']"
        fail_msg: "HTTPS security headers are incomplete"
      loop: "{{ https_responses['results'] }}"
      loop_control:
        loop_var: item_https_response

    - name: Verify nginx listens on HTTP and HTTPS ports
      ansible.builtin.wait_for:
        port: "{{ item_port }}"
        state: started
        timeout: 5
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_port

    - name: Verify UFW status and allowed ports
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: ufw_status
      changed_when: false

    - name: Assert UFW is active with the expected policy and ports
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status['stdout']"
          - "'deny (incoming)' in ufw_status['stdout']"
          - "'22/tcp' in ufw_status['stdout']"
          - "'80/tcp' in ufw_status['stdout']"
          - "'443/tcp' in ufw_status['stdout']"
        fail_msg: "UFW is not active with the expected rules"

    - name: Verify fail2ban jails
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
          - "{{ item_jail }}"
      register: jail_status
      changed_when: false
      loop:
        - sshd
        - nginx-http-auth
        - nginx-limit-req
        - nginx-botsearch
      loop_control:
        loop_var: item_jail

    - name: Assert fail2ban jails are enabled
      ansible.builtin.assert:
        that:
          - item_jail_status['rc'] == 0
          - "item_jail_status['item'] in item_jail_status['stdout']"
        fail_msg: "Expected fail2ban jail is not enabled"
      loop: "{{ jail_status['results'] }}"
      loop_control:
        loop_var: item_jail_status

    - name: Verify kernel security settings
      ansible.builtin.command:
        argv:
          - sysctl
          - "{{ item_sysctl['key'] }}"
      register: sysctl_values
      changed_when: false
      loop:
        - key: net.ipv4.conf.default.rp_filter
          expected: "= 1"
        - key: net.ipv4.conf.all.rp_filter
          expected: "= 1"
        - key: net.ipv4.conf.all.accept_redirects
          expected: "= 0"
        - key: net.ipv6.conf.all.accept_redirects
          expected: "= 0"
        - key: net.ipv4.conf.all.send_redirects
          expected: "= 0"
        - key: net.ipv4.conf.all.accept_source_route
          expected: "= 0"
        - key: net.ipv6.conf.all.disable_ipv6
          expected: "= 1"
        - key: net.ipv4.tcp_syncookies
          expected: "= 1"
        - key: net.ipv4.tcp_max_syn_backlog
          expected: "= 2048"
      loop_control:
        loop_var: item_sysctl

    - name: Assert kernel security settings
      ansible.builtin.assert:
        that: "item_sysctl_value['item']['expected'] in item_sysctl_value['stdout']"
        fail_msg: "Kernel security setting has an unexpected value"
      loop: "{{ sysctl_values['results'] }}"
      loop_control:
        loop_var: item_sysctl_value
