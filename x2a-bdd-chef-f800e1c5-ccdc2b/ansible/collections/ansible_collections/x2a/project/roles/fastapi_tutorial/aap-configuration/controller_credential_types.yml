---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the fastapi PostgreSQL role and the FastAPI application's database connection.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: Username for the PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the fastapi PostgreSQL role.
        - id: database_url
          type: string
          label: Database Connection URL
          help_text: PostgreSQL connection string used by the FastAPI application; it may contain the database password and should be protected accordingly.
      required:
        - db_username
        - db_password
        - database_url
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_url: !unsafe "{{ database_url }}"
