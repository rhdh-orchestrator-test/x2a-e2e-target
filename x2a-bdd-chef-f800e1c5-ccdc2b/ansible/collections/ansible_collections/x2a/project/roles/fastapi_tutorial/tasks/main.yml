---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install Fedora and RHEL system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Install Debian and Ubuntu system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Initialize PostgreSQL on Fedora and RHEL
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository # noqa: R106 - repository source comes from role defaults, not untrusted input
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R104 - repository default uses HTTPS
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path from role defaults, not user input
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command path comes from role defaults, not user input
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path from role defaults, not user input

- name: Install Python dependencies # noqa: R113 - requirements path comes from role defaults, not an untrusted package target
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - path from role defaults, not user input
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path from role defaults, not user input
    virtualenv_command: python3 -m venv

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create PostgreSQL role and database # noqa: L039 - db_password is validated by the preceding credential validation task
  ansible.builtin.shell: # noqa: R101 - SQL values come from validated role credential variables; no-changed-when - intentional idempotent SQL batch has no reliable changed status
    cmd: |
      psql -v ON_ERROR_STOP=1 -d postgres -c "DO $$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '{{ fastapi_tutorial_database_user }}') THEN
        CREATE ROLE {{ fastapi_tutorial_database_user }} LOGIN PASSWORD '{{ db_password }}';
      ELSE
        ALTER ROLE {{ fastapi_tutorial_database_user }} WITH PASSWORD '{{ db_password }}';
      END IF;
      END $$;"
      psql -v ON_ERROR_STOP=1 -d postgres -c "SELECT 'CREATE DATABASE {{ fastapi_tutorial_database_name }} OWNER {{ fastapi_tutorial_database_user }}' WHERE NOT EXISTS
      (SELECT FROM pg_database WHERE datname = '{{ fastapi_tutorial_database_name }}')\\gexec"
      psql -v ON_ERROR_STOP=1 -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE {{ fastapi_tutorial_database_name }} TO {{ fastapi_tutorial_database_user }};"
    become: true
    become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy application environment
  ansible.builtin.copy:
    content: "PROJECT_NAME=\"FastAPI Tutorial\" API_VERSION=1.0.0 DATABASE_URL={{ fastapi_tutorial_database_url }} "
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path from role defaults, not user input
    owner: root
    group: root
    mode: "0644"
    backup: true

- name: Deploy systemd service unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host {{ fastapi_tutorial_bind_address }} --port {{ fastapi_tutorial_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - path from role defaults, not user input
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before starting the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    state: started
    enabled: true
