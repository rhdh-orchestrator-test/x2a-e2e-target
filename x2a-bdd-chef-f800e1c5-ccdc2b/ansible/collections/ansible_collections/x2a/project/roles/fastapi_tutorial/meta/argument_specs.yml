---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application.
    description:
      - Deploys the FastAPI tutorial repository, Python virtual environment, PostgreSQL database, and systemd service.
    options:
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_venv_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_service_file:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Systemd unit file path.
      fastapi_tutorial_bind_address:
        type: str
        required: false
        default: 0.0.0.0
        description: Address where Uvicorn listens.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port where Uvicorn listens.
      fastapi_tutorial_database_name:
        type: str
        required: false
        default: fastapi_db
        description: PostgreSQL database name.
      fastapi_tutorial_database_user:
        type: str
        required: false
        default: "{{ db_username }}"
        description: PostgreSQL application user.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: localhost
        description: PostgreSQL server host.
      fastapi_tutorial_database_url:
        type: str
        required: false
        default: "{{ database_url }}"
        description: Application database connection URL.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations handling the database password.
      db_username:
        type: str
        required: true
        description: PostgreSQL username injected by the AAP credential type.
      db_password:
        type: str
        required: true
        description: PostgreSQL password injected by the AAP credential type.
      database_url:
        type: str
        required: true
        description: Database connection URL injected by the AAP credential type.
