---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started

- name: Configure fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  notify: Restart fail2ban

- name: Check UFW status
  ansible.builtin.command:
    argv: [ufw, status, verbose]
  register: nginx_multisite_ufw_status
  changed_when: false
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default policy  # noqa: L039 - variable registered by prior task when UFW is enabled
  ansible.builtin.command:
    argv: [ufw, --force, default, deny]
  when:
    - nginx_multisite_ufw_enabled
    - "'Default: deny (incoming)' not in nginx_multisite_ufw_status.stdout"
  changed_when: false

- name: Allow SSH through UFW  # noqa: L039 - variable registered by prior task when UFW is enabled
  ansible.builtin.command:
    argv: [ufw, allow, ssh]
  when:
    - nginx_multisite_ufw_enabled
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"
  changed_when: false

- name: Allow HTTP through UFW  # noqa: L039 - variable registered by prior task when UFW is enabled
  ansible.builtin.command:
    argv: [ufw, allow, http]
  when:
    - nginx_multisite_ufw_enabled
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"
  changed_when: false

- name: Allow HTTPS through UFW  # noqa: L039 - variable registered by prior task when UFW is enabled
  ansible.builtin.command:
    argv: [ufw, allow, https]
  when:
    - nginx_multisite_ufw_enabled
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"
  changed_when: false

- name: Enable UFW  # noqa: L039 - variable registered by prior task when UFW is enabled
  ansible.builtin.command:
    argv: [ufw, --force, enable]
  when:
    - nginx_multisite_ufw_enabled
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"
  changed_when: false

- name: Configure kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Check whether SSH daemon configuration exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable SSH root login  # noqa: L039 - variable registered by prior task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    create: false
    backup: true
  when:
    - nginx_multisite_ssh_disable_root
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart SSH

- name: Disable SSH password authentication  # noqa: L039 - variable registered by prior task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    create: false
    backup: true
  when:
    - not nginx_multisite_ssh_password_auth
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart SSH
