---
controller_credential_types:
  - name: Redis Authentication
    description: Hardcoded Redis password that must be migrated to an approved AAP secret mechanism such as Ansible Vault.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required to authenticate clients to the Redis listener on port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
