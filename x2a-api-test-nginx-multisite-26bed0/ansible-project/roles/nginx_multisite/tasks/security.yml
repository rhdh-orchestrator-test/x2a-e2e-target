---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start fail2ban service
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Deploy fail2ban jail configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  notify: Restart fail2ban

- name: Set UFW default deny policy
  ansible.builtin.command:
    cmd: ufw --force default deny
  changed_when: false
  failed_when: ufw_default_result.rc != 0
  register: ufw_default_result

- name: Allow SSH through UFW
  ansible.builtin.command:
    cmd: ufw allow ssh
  changed_when: "'Rules updated' in ufw_ssh_result.stdout"
  failed_when: ufw_ssh_result.rc != 0
  register: ufw_ssh_result

- name: Allow HTTP through UFW
  ansible.builtin.command:
    cmd: ufw allow http
  changed_when: "'Rules updated' in ufw_http_result.stdout"
  failed_when: ufw_http_result.rc != 0
  register: ufw_http_result

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    cmd: ufw allow https
  changed_when: "'Rules updated' in ufw_https_result.stdout"
  failed_when: ufw_https_result.rc != 0
  register: ufw_https_result

- name: Enable UFW firewall
  ansible.builtin.command:
    cmd: ufw --force enable
  changed_when: false
  failed_when: ufw_enable_result.rc != 0
  register: ufw_enable_result

- name: Deploy kernel security parameters
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload sysctl

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    backup: true
  when: nginx_multisite_security_ssh_disable_root | bool
  notify: Restart ssh

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    backup: true
  when: not nginx_multisite_security_ssh_password_auth | bool
  notify: Restart ssh
