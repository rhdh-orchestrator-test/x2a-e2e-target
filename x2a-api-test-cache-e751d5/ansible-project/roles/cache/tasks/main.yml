---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install memcached and redis packages
  ansible.builtin.package:
    name:
      - memcached
      - redis-server
    state: present

- name: Create redis group
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    system: true
    state: present

- name: Create redis user
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present

- name: Create redis directories
  ansible.builtin.file:
    path: "{{ item_dir }}" # noqa: R114 - paths from role defaults and hardcoded values
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory
    recurse: true
  loop:
    - /var/lib/redis
    - /etc/redis
    - /var/run/redis
    - "{{ cache_redis_log_dir }}"
  loop_control:
    loop_var: item_dir

- name: Configure redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0640"
    backup: true
  notify: Restart redis

- name: Remove deprecated redis configuration lines
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114,R115 - path from role defaults
    regexp: "{{ item_redis_config }}"
    state: absent
    backup: true
  loop:
    - ^replica-serve-stale-data.*$
    - ^replica-read-only.*$
    - ^repl-ping-replica-period.*$
    - ^client-output-buffer-limit.*$
    - ^replica-priority.*$
  loop_control:
    loop_var: item_redis_config
  notify: Restart redis

- name: Start and enable redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service_name }}"
    state: started
    enabled: true

- name: Start and enable memcached service
  ansible.builtin.service:
    name: "{{ cache_memcached_service_name }}"
    state: started
    enabled: true
