---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories for Redis
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file for port 6379
          # Generated by Ansible

          # Network
          bind 127.0.0.1
          port 6379
          tcp-backlog 511
          timeout 0
          tcp-keepalive 300

          # General
          daemonize yes
          supervised no
          pidfile /var/run/redis/redis-server-6379.pid
          loglevel notice
          logfile /var/log/redis/redis-server-6379.log
          databases 16

          # Security
          requirepass redis_secure_password_123

          # Memory management
          maxmemory 256mb
          maxmemory-policy allkeys-lru

          # Snapshotting
          save 900 1
          save 300 10
          save 60 10000
          stop-writes-on-bgsave-error yes
          rdbcompression yes
          rdbchecksum yes
          dbfilename dump-6379.rdb
          dir /var/lib/redis

          # Append only file
          appendonly no
          appendfilename "appendonly-6379.aof"
          appendfsync everysec

          # Advanced config
          hash-max-ziplist-entries 512
          hash-max-ziplist-value 64
          list-max-ziplist-size -2
          list-compress-depth 0
          set-max-intset-entries 512
          zset-max-ziplist-entries 128
          zset-max-ziplist-value 64
          hll-sparse-max-bytes 3000
          activerehashing yes
          client-output-buffer-limit normal 0 0 0
          client-output-buffer-limit pubsub 32mb 8mb 60
          hz 10
          aof-rewrite-incremental-fsync yes
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create Redis log file
      ansible.builtin.copy:
        content: |
          # Redis log file placeholder
          # This file would contain Redis server logs
        dest: /tmp/molecule_test/var/log/redis/redis-server-6379.log
        mode: "0644"
        backup: true

    - name: Create Redis PID file directory structure
      ansible.builtin.file:
        path: /tmp/molecule_test/var/run/redis
        state: directory
        mode: "0755"

    - name: Create memcached configuration placeholder
      ansible.builtin.copy:
        content: |
          # Memcached configuration placeholder
          # Port: 11211
          # Memory: 64MB
          # This represents the expected memcached configuration
        dest: /tmp/molecule_test/etc/memcached.conf
        mode: "0644"
        backup: true