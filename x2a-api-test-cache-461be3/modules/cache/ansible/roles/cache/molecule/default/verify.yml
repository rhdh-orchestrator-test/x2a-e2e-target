---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # File existence checks
    - name: Check Redis configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/redis/6379.conf
        - /tmp/molecule_test/var/log/redis/redis-server-6379.log
      loop_control:
        loop_var: item_config
      register: redis_config_stat_results

    - name: Assert Redis configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected Redis config file not found"
      loop: "{{ redis_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check memcached configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/memcached.conf
      register: memcached_config_stat

    - name: Assert memcached configuration file was created
      ansible.builtin.assert:
        that:
          - memcached_config_stat['stat']['exists']
          - memcached_config_stat['stat']['size'] > 0
        fail_msg: "Expected memcached config file not found"

    # Directory structure checks
    - name: Check Redis directories exist
      ansible.builtin.stat:
        path: "{{ item_dir }}"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir
      register: redis_dir_stat_results

    - name: Assert Redis directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected Redis directory not found"
      loop: "{{ redis_dir_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Configuration content validation
    - name: Read Redis configuration file
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis configuration contains required settings
      ansible.builtin.assert:
        that:
          - "'requirepass redis_secure_password_123' in redis_config_decoded"
          - "'port 6379' in redis_config_decoded"
          - "'bind 127.0.0.1' in redis_config_decoded"
          - "'maxmemory 256mb' in redis_config_decoded"
          - "'maxmemory-policy allkeys-lru' in redis_config_decoded"
          - "'logfile /var/log/redis/redis-server-6379.log' in redis_config_decoded"
        fail_msg: "Redis configuration missing required settings"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

    - name: Assert Redis configuration does not contain problematic replica settings
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in redis_config_decoded"
          - "'replica-read-only' not in redis_config_decoded"
          - "'repl-ping-replica-period' not in redis_config_decoded"
          - "'replica-priority' not in redis_config_decoded"
        fail_msg: "Redis configuration contains problematic replica settings"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

- name: Verify Services (Container-incompatible checks)
  hosts: all
  gather_facts: false
  tasks:
    # Service status checks (tagged as molecule-notest since they won't work in container)
    - name: Check memcached service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert memcached service is running
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - "ansible_facts.services['memcached.service']['state'] == 'running'"
        fail_msg: "Memcached service not running"
      tags: molecule-notest

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'redis_6379.service' in ansible_facts.services"
          - "ansible_facts.services['redis_6379.service']['state'] == 'running'"
        fail_msg: "Redis service not running"
      tags: molecule-notest

    # Network connectivity checks (tagged as molecule-notest)
    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 5
      tags: molecule-notest

    - name: Check memcached port is listening
      ansible.builtin.wait_for:
        port: 11211
        host: 127.0.0.1
        timeout: 5
      tags: molecule-notest

    # Redis authentication test (tagged as molecule-notest)
    - name: Test Redis authentication
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 ping
      register: redis_auth_test
      changed_when: false
      failed_when: redis_auth_test.stdout != "PONG"
      tags: molecule-notest

    - name: Test Redis info command
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a redis_secure_password_123 info server
      register: redis_info_test
      changed_when: false
      tags: molecule-notest

    - name: Assert Redis info contains server information
      ansible.builtin.assert:
        that:
          - "'redis_version' in redis_info_test.stdout"
        fail_msg: "Redis info command failed"
      tags: molecule-notest