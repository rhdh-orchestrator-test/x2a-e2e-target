---
argument_specs:
  main:
    short_description: Apply POODLE vulnerability fixes to Apache SSL configuration
    description:
      - This role applies security fixes for the POODLE vulnerability by updating SSL configuration
      - in Apache to disable vulnerable protocols and enable only TLSv1.2.
    author: X2A Migration
    options:
      poodle_fix_apache_ssl_config_path:
        type: str
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to the Apache SSL configuration file
      poodle_fix_ssl_protocol:
        type: str
        default: -all +TLSv1.2
        description: SSL protocol configuration string to use in Apache
      poodle_fix_apache_service_name:
        type: str
        default: apache2
        description: Name of the Apache service
      poodle_fix_ssh_service_name:
        type: str
        default: sshd
        description: Name of the SSH service
      poodle_fix_create_backup:
        type: bool
        default: true
        description: Whether to create a backup of the configuration file before modifying
      poodle_fix_validate_config:
        type: bool
        default: true
        description: Whether to validate the Apache configuration before applying changes
