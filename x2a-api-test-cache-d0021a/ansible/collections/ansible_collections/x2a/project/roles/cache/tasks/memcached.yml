---
- name: Install and prepare Memcached
  ansible.builtin.include_tasks: package.yml

- name: Configure Memcached service
  ansible.builtin.template:
    src: memcached.conf.j2
    dest: /etc/memcached.conf
    mode: "0644"
    backup: true
  notify: Restart Memcached

- name: Ensure Memcached service is enabled and started
  ansible.builtin.service:
    name: "{{ cache_memcached_service_name }}"
    enabled: true
    state: started
