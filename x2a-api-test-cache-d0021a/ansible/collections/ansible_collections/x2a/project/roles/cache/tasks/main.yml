---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml

- name: Configure Redis cache service  # noqa: L038 - external role is declared in this role's requirements.yml
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: 6379
    redis_requirepass: "{{ redis_password }}"
    redis_install_method: package
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Check whether the Redis configuration exists
  ansible.builtin.stat:
    path: /etc/redis/6379.conf
  register: cache_redis_config

- name: Remove obsolete replica stale-data directive
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^replica-serve-stale-data.*$
    state: absent
    create: false
    backup: true
  when: cache_redis_config.stat.exists  # noqa: L039 - variable is registered by the preceding stat task

- name: Remove obsolete replica read-only directive
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^replica-read-only.*$
    state: absent
    create: false
    backup: true
  when: cache_redis_config.stat.exists  # noqa: L039 - variable is registered by the preceding stat task

- name: Remove obsolete replica ping directive
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^repl-ping-replica-period.*$
    state: absent
    create: false
    backup: true
  when: cache_redis_config.stat.exists  # noqa: L039 - variable is registered by the preceding stat task

- name: Remove obsolete client buffer directive
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^client-output-buffer-limit.*$
    state: absent
    create: false
    backup: true
  when: cache_redis_config.stat.exists  # noqa: L039 - variable is registered by the preceding stat task

- name: Remove obsolete replica priority directive
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^replica-priority.*$
    state: absent
    create: false
    backup: true
  when: cache_redis_config.stat.exists  # noqa: L039 - variable is registered by the preceding stat task
