---
argument_specs:
  main:
    short_description: Install and configure Memcached and Redis cache services
    description:
      - Installs and configures Memcached with the requested listener and resource settings.
      - Includes the standalone Redis role for the cache service and configures password authentication.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks handling the Redis password.
      cache_memcached_version:
        type: str
        required: false
        default:
        description: Optional Memcached package version.
      cache_memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory allocation in megabytes.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP listener port.
      cache_memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP listener port.
      cache_memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      cache_memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum number of Memcached connections.
      cache_memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      cache_memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Experimental Memcached command-line options.
      cache_memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional Memcached command-line options.
      cache_memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: File descriptor limit for Memcached.
      cache_memcached_log_directory:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log directory.
      cache_memcached_runtime_directory:
        type: str
        required: false
        default: /var/run/memcached
        description: Memcached runtime directory.
      cache_memcached_service_user:
        type: str
        required: false
        default: memcached
        description: Memcached service account.
      cache_memcached_service_group:
        type: str
        required: false
        default: memcached
        description: Memcached service group.
      cache_memcached_service_name:
        type: str
        required: false
        default: memcached
        description: Memcached service name.
      cache_memcached_threads:
        type: int
        required: false
        default:
        description: Optional Memcached worker thread count.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
