---
chef_automate_hostname: automate.chef.lab
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: /tmp/chef-automate
chef_automate_kernel_params:
  vm.max_map_count: 262144
  vm.dirty_expire_centisecs: 20000
chef_automate_accept_terms: true
chef_automate_deploy_automate: true
chef_automate_deploy_infra_server: true
chef_automate_username: "{{ username | default('admin') }}"
chef_automate_longusername: "{{ admin_username | default('Administrator') }}"
chef_automate_useremail: "{{ admin_username | default('admin') }}@example.com"
chef_automate_userpassword: "{{ admin_password | default('password') }}"
chef_automate_orgname: "{{ organization_name | default('default') }}"
chef_automate_longorgname: "{{ organization_long_name | default('Default Organization') }}"
chef_automate_userfilename: /tmp/{{ chef_automate_username }}.pem
chef_automate_orgfilename: /tmp/{{ chef_automate_orgname }}-validator.pem
