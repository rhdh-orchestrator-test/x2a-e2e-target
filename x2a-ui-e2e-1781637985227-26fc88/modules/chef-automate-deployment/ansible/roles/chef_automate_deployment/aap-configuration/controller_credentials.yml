---
controller_credentials:
- name: Chef Admin User Credentials - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Admin User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    user_key: '{{ vault_user_key }}'
- name: Chef Organization Validator - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Organization Validator
  update_secrets: true
  inputs:
    organization_name: '{{ organization_name }}'
    organization_long_name: '{{ organization_long_name }}'
    validator_key: '{{ vault_validator_key }}'
- name: Chef Automate Admin Credentials - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Automate Admin Credentials
  update_secrets: true
  inputs:
    admin_username: '{{ admin_username }}'
    admin_password: '{{ vault_admin_password }}'
