---
controller_credential_types:
- name: Chef Admin User Credentials
  description: Credential type for Chef Admin User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Admin Username
      help_text: Username for the Chef Infra Server admin user
    - id: password
      type: string
      label: Admin Password
      secret: true
      help_text: Password for the Chef Infra Server admin user
    - id: user_key
      type: string
      label: Admin User Key
      secret: true
      help_text: PEM file content for the admin user authentication
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      user_key: !unsafe '{{ user_key }}'
- name: Chef Organization Validator
  description: Credential type for Chef Organization Validator
  kind: cloud
  inputs:
    fields:
    - id: organization_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: organization_long_name
      type: string
      label: Organization Long Name
      help_text: Full descriptive name for the Chef organization
    - id: validator_key
      type: string
      label: Organization Validator Key
      secret: true
      help_text: PEM file content for the organization validator
    required:
    - organization_name
    - validator_key
  injectors:
    extra_vars:
      organization_name: !unsafe '{{ organization_name }}'
      organization_long_name: !unsafe '{{ organization_long_name }}'
      validator_key: !unsafe '{{ validator_key }}'
- name: Chef Automate Admin Credentials
  description: Credential type for Chef Automate Admin Credentials
  kind: cloud
  inputs:
    fields:
    - id: admin_username
      type: string
      label: Automate Admin Username
      help_text: Username for the Chef Automate admin user
    - id: admin_password
      type: string
      label: Automate Admin Password
      secret: true
      help_text: Password for the Chef Automate admin user
    required:
    - admin_username
    - admin_password
  injectors:
    extra_vars:
      admin_username: !unsafe '{{ admin_username }}'
      admin_password: !unsafe '{{ admin_password }}'
