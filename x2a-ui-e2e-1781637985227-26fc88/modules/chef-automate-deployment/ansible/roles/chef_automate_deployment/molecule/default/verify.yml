---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_content is defined

    - name: Check sysctl settings file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl settings file not found"
        success_msg: "Sysctl settings file exists"

    - name: Get sysctl content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl settings are correct
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count = 262144' in (sysctl_content.content | b64decode)"
          - "'vm.dirty_expire_centisecs = 20000' in (sysctl_content.content | b64decode)"
        fail_msg: "Sysctl settings are not set correctly"
        success_msg: "Sysctl settings are set correctly"
      when: sysctl_content is defined

    # Chef Automate CLI checks
    - name: Check Chef Automate CLI
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate configuration checks
    - name: Check Chef Automate config file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config

    - name: Assert Chef Automate config exists
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
          - chef_automate_config.stat.isreg
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    # Chef Server configuration checks
    - name: Check Chef Server config file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server/chef-server.rb
      register: chef_server_config

    - name: Assert Chef Server config exists
      ansible.builtin.assert:
        that:
          - chef_server_config.stat.exists
          - chef_server_config.stat.isreg
        fail_msg: "Chef Server config file not found"
        success_msg: "Chef Server config file exists"

    # Chef Server CTL checks
    - name: Check Chef Server CTL
      ansible.builtin.stat:
        path: /tmp/molecule_test/usr/bin/chef-server-ctl
      register: chef_server_ctl

    - name: Assert Chef Server CTL exists
      ansible.builtin.assert:
        that:
          - chef_server_ctl.stat.exists
          - chef_server_ctl.stat.isreg
          - chef_server_ctl.stat.executable
        fail_msg: "Chef Server CTL not found or not executable"
        success_msg: "Chef Server CTL exists and is executable"

    # User and organization PEM file checks
    - name: Check user PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/admin.pem
      register: user_pem

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.isreg
          - user_pem.stat.mode == "0600"
        fail_msg: "User PEM file not found or has incorrect permissions"
        success_msg: "User PEM file exists with correct permissions"

    - name: Check organization validator PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/default-validator.pem
      register: org_pem

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_pem.stat.exists
          - org_pem.stat.isreg
          - org_pem.stat.mode == "0600"
        fail_msg: "Organization validator PEM file not found or has incorrect permissions"
        success_msg: "Organization validator PEM file exists with correct permissions"

    # Service status checks (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: systemctl status chef-automate
      register: automate_status
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - automate_status.rc == 0
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check Chef Server services
      ansible.builtin.command:
        cmd: chef-server-ctl service-list
      register: server_services
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Server services are available
      ansible.builtin.assert:
        that:
          - server_services.rc == 0
        fail_msg: "Chef Server services are not available"
        success_msg: "Chef Server services are available"
      tags: molecule-notest

    # API endpoint checks (tagged for skipping in container)
    - name: Check Chef Automate API
      ansible.builtin.uri:
        url: https://localhost/api/v0/auth/version
        validate_certs: false
        status_code: 200
      register: automate_api
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate API is accessible
      ansible.builtin.assert:
        that:
          - automate_api.status == 200
        fail_msg: "Chef Automate API is not accessible"
        success_msg: "Chef Automate API is accessible"
      tags: molecule-notest

    - name: Check Chef Infra Server API
      ansible.builtin.uri:
        url: https://localhost/organizations
        validate_certs: false
        status_code: 200
      register: server_api
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server API is accessible
      ansible.builtin.assert:
        that:
          - server_api.status == 200
        fail_msg: "Chef Infra Server API is not accessible"
        success_msg: "Chef Infra Server API is accessible"
      tags: molecule-notest

    # Port checks (tagged for skipping in container)
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest