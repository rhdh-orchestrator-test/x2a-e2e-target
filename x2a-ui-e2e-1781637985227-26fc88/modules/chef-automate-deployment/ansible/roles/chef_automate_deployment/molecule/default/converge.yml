- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/chef-server
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/usr/bin
    - /tmp/molecule_test/tmp
  - name: Create mock Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        exit 0

        '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create mock Chef Server CTL
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Server CTL mock"

        exit 0

        '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create mock Chef Automate config
    ansible.builtin.copy:
      content: '# Mock Chef Automate config

        [global]

        fqdn = "automate.chef.lab"

        '
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create mock Chef Server config
    ansible.builtin.copy:
      content: '# Mock Chef Server config

        topology "standalone"

        api_fqdn "automate.chef.lab"

        '
      dest: /tmp/molecule_test/etc/chef-server/chef-server.rb
      mode: '0644'
  - name: Create mock user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAx4UbaDzY5xjW6hc9jwN0mX33XpTDVW9WqHp5AKaRbtAC3DqX

        IXFMPgw3K45jxRb93f8tv9vL3rD9CUG1Gv4FM+o7ds7FRES5RTjv2RT/JVNJCoqF

        ol8+ngLqRZCyBtQN7zYByWMRirPGoDUqdPYrj2yq+ObBBNhg5N+hOwKjjpzdj2Ud

        1l7R+wxIqmJo1IYyy16xS8WsjyQuyC0lL456qkd5BDZ0Ag8j2X9H9D5220Ln7s9i

        oezTipXipS7p7Jekf3Ywx6abJwOmB0rX79dV4qiNcGgzATnG1PkXxqt76VhcGa0W

        DDVHEEYGbSQ6hIGSh0I7BQun0aLRZojfE3gqHQIDAQAB

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/tmp/admin.pem
      mode: '0600'
  - name: Create mock organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAx4UbaDzY5xjW6hc9jwN0mX33XpTDVW9WqHp5AKaRbtAC3DqX

        IXFMPgw3K45jxRb93f8tv9vL3rD9CUG1Gv4FM+o7ds7FRES5RTjv2RT/JVNJCoqF

        ol8+ngLqRZCyBtQN7zYByWMRirPGoDUqdPYrj2yq+ObBBNhg5N+hOwKjjpzdj2Ud

        1l7R+wxIqmJo1IYyy16xS8WsjyQuyC0lL456qkd5BDZ0Ag8j2X9H9D5220Ln7s9i

        oezTipXipS7p7Jekf3Ywx6abJwOmB0rX79dV4qiNcGgzATnG1PkXxqt76VhcGa0W

        DDVHEEYGbSQ6hIGSh0I7BQun0aLRZojfE3gqHQIDAQAB

