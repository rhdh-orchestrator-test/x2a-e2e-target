---
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_user.username }} "{{ chef_automate_user.fullname }}" {{ chef_automate_user.email }} "{{
      chef_automate_user.password }}" --filename {{ chef_automate_user.key_file }}
  args:
    creates: "{{ chef_automate_user.key_file }}"
  become: true
  no_log: true
  when: chef_server_ctl_check.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org.name }} "{{ chef_automate_org.fullname }}" --association_user {{ chef_automate_user.username }}
      --filename {{ chef_automate_org.validator_key }}
  args:
    creates: "{{ chef_automate_org.validator_key }}"
  become: true
  when: chef_server_ctl_check.rc == 0
