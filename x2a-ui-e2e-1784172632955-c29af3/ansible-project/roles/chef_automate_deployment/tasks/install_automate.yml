---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: automate_cli_stat
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: set -o pipefail && gunzip < /tmp/chef-automate_linux_amd64.zip > {{ chef_automate_cli_path }}
    executable: /bin/bash
  args:
    warn: false
  when: not automate_cli_stat.stat.exists
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: ./chef-automate deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa=true
  args:
    creates: /hab
    chdir: "{{ chef_automate_cli_path | dirname }}"
  become: true
  register: automate_deploy
  changed_when: automate_deploy.rc == 0
