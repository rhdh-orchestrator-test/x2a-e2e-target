---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is correctly set
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == chef_automate_hostname
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Kernel parameter checks
    - name: Check vm.max_map_count
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_file

    - name: Assert max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
        fail_msg: "max_map_count file not found"
        success_msg: "max_map_count file exists"

    - name: Get max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert max_map_count is correctly set
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == chef_automate_vm_max_map_count | string
        fail_msg: "vm.max_map_count not set correctly"
        success_msg: "vm.max_map_count set correctly"
      when: max_map_count_file.stat.exists

    - name: Check vm.dirty_expire_centisecs
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_file

    - name: Assert dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_centisecs_file.stat.exists
        fail_msg: "dirty_expire_centisecs file not found"
        success_msg: "dirty_expire_centisecs file exists"

    - name: Get dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_content
      when: dirty_expire_centisecs_file.stat.exists

    - name: Assert dirty_expire_centisecs is correctly set
      ansible.builtin.assert:
        that:
          - (dirty_expire_centisecs_content.content | b64decode | trim) == chef_automate_vm_dirty_expire_centisecs | string
        fail_msg: "vm.dirty_expire_centisecs not set correctly"
        success_msg: "vm.dirty_expire_centisecs set correctly"
      when: dirty_expire_centisecs_file.stat.exists

    # Chef Automate installation checks
    - name: Check Chef Automate CLI
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    - name: Check Chef Automate deployment
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: chef_automate_deploy

    - name: Assert Chef Automate is deployed
      ansible.builtin.assert:
        that:
          - chef_automate_deploy.stat.exists
          - chef_automate_deploy.stat.isdir
        fail_msg: "Chef Automate deployment directory not found"
        success_msg: "Chef Automate deployment directory exists"

    # User and organization checks
    - name: Check user key file
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_automate_user.key_file }}"
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    - name: Check organization validator key file
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_automate_org.validator_key }}"
      register: org_validator_key_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_validator_key_file.stat.exists
        fail_msg: "Organization validator key file not found"
        success_msg: "Organization validator key file exists"

    # Service status checks (tagged for skipping in container)
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - "'running' in automate_status.stdout"
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server is running
      ansible.builtin.assert:
        that:
          - "'running' in chef_server_status.stdout"
        fail_msg: "Chef Infra Server is not running"
        success_msg: "Chef Infra Server is running"
      tags: molecule-notest

    # Network checks (tagged for skipping in container)
    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # API health checks (tagged for skipping in container)
    - name: Check Chef Automate API health
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
      register: automate_health
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Automate API is healthy
      ansible.builtin.assert:
        that:
          - automate_health is succeeded
        fail_msg: "Chef Automate API is not healthy"
        success_msg: "Chef Automate API is healthy"
      tags: molecule-notest

    - name: Check Chef Server API status
      ansible.builtin.uri:
        url: "https://localhost/organizations/{{ chef_automate_org.name }}/_status"
        validate_certs: false
      register: chef_server_api_status
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Server API is healthy
      ansible.builtin.assert:
        that:
          - chef_server_api_status is succeeded
        fail_msg: "Chef Server API is not healthy"
        success_msg: "Chef Server API is healthy"
      tags: molecule-notest