- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create required directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_max_map_count }}'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_dirty_expire_centisecs }}'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/sh echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock Chef user key -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/{{ chef_automate_user.key_file }}
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock Chef organization validator key -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/{{ chef_automate_org.validator_key }}
      mode: '0600'
  - name: Create Chef server status files
    ansible.builtin.copy:
      content: running
      dest: /tmp/molecule_test/{{ item }}
      mode: '0644'
    loop:
    - chef-automate-status
    - chef-server-status
  - name: Create user list file
    ansible.builtin.copy:
      content: '{{ chef_automate_user.username }}'
      dest: /tmp/molecule_test/chef-server-user-list
      mode: '0644'
  - name: Create organization list file
    ansible.builtin.copy:
      content: '{{ chef_automate_org.name }}'
      dest: /tmp/molecule_test/chef-server-org-list
      mode: '0644'
  - name: Create network service file
    ansible.builtin.copy:
      content: tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      -
      dest: /tmp/molecule_test/netstat-output
      mode: '0644'
  - name: Create API health files
    ansible.builtin.copy:
      content: '{"status":"ok"}'
      dest: /tmp/molecule_test/{{ item }}
      mode: '0644'
    loop:
    - automate-health-api
    - chef-server-status-api
