---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check sysctl configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl configuration file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Chef Automate sysctl configuration file not found"
        success_msg: "Chef Automate sysctl configuration file exists"

    - name: Get sysctl configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are correctly set
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count = 262144' in (sysctl_content.content | b64decode)"
          - "'vm.dirty_expire_centisecs = 20000' in (sysctl_content.content | b64decode)"
        fail_msg: "Sysctl parameters are not correctly set"
        success_msg: "Sysctl parameters are correctly set"
      when: sysctl_file.stat.exists

    # Chef Automate configuration checks
    - name: Check Chef Automate config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: automate_config

    - name: Assert Chef Automate config file exists
      ansible.builtin.assert:
        that:
          - automate_config.stat.exists
          - automate_config.stat.size > 0
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    - name: Get Chef Automate config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-automate/config.toml
      register: automate_config_content
      when: automate_config.stat.exists

    - name: Assert Chef Automate config contains required settings
      ansible.builtin.assert:
        that:
          - "'automate = \"enabled\"' in (automate_config_content.content | b64decode)"
          - "'infra-server = \"enabled\"' in (automate_config_content.content | b64decode)"
        fail_msg: "Chef Automate config does not contain required settings"
        success_msg: "Chef Automate config contains required settings"
      when: automate_config.stat.exists

    # Service files checks
    - name: Check Chef Automate service file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      register: automate_service

    - name: Assert Chef Automate service file exists
      ansible.builtin.assert:
        that:
          - automate_service.stat.exists
          - automate_service.stat.size > 0
        fail_msg: "Chef Automate service file not found"
        success_msg: "Chef Automate service file exists"

    - name: Check Chef Server service file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/systemd/system/chef-server.service
      register: chef_server_service

    - name: Assert Chef Server service file exists
      ansible.builtin.assert:
        that:
          - chef_server_service.stat.exists
          - chef_server_service.stat.size > 0
        fail_msg: "Chef Server service file not found"
        success_msg: "Chef Server service file exists"

    # CLI binaries checks
    - name: Check Chef Automate CLI binary exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/usr/local/bin/chef-automate
      register: automate_cli

    - name: Assert Chef Automate CLI binary exists
      ansible.builtin.assert:
        that:
          - automate_cli.stat.exists
          - automate_cli.stat.executable
        fail_msg: "Chef Automate CLI binary not found or not executable"
        success_msg: "Chef Automate CLI binary exists and is executable"

    - name: Check Chef Server CLI binary exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/usr/bin/chef-server-ctl
      register: chef_server_cli

    - name: Assert Chef Server CLI binary exists
      ansible.builtin.assert:
        that:
          - chef_server_cli.stat.exists
          - chef_server_cli.stat.executable
        fail_msg: "Chef Server CLI binary not found or not executable"
        success_msg: "Chef Server CLI binary exists and is executable"

    # PEM files checks
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_pem

    - name: Assert user PEM file exists with correct permissions
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.size > 0
          - user_pem.stat.mode == '0600'
        fail_msg: "User PEM file not found or has incorrect permissions"
        success_msg: "User PEM file exists with correct permissions"

    - name: Check organization validator PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_pem

    - name: Assert organization validator PEM file exists with correct permissions
      ansible.builtin.assert:
        that:
          - org_pem.stat.exists
          - org_pem.stat.size > 0
          - org_pem.stat.mode == '0600'
        fail_msg: "Organization validator PEM file not found or has incorrect permissions"
        success_msg: "Organization validator PEM file exists with correct permissions"

    # Service status checks (these can't run in container)
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: systemctl status chef-automate
      register: automate_status
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - automate_status.rc == 0
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check Chef Server service status
      ansible.builtin.command:
        cmd: systemctl status chef-server
      register: chef_server_status
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Server service is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Server service is not running"
        success_msg: "Chef Server service is running"
      tags: molecule-notest

    # Network checks (these can't run in container)
    - name: Check Chef Automate port
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate port is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Chef Automate port 443 is not listening"
        success_msg: "Chef Automate port 443 is listening"
      tags: molecule-notest

    # API checks (these can't run in container)
    - name: Check Chef Automate API
      ansible.builtin.uri:
        url: https://localhost/api/v0/auth/version
        validate_certs: false
      register: api_check
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate API is responding
      ansible.builtin.assert:
        that:
          - api_check.status == 200
        fail_msg: "Chef Automate API is not responding"
        success_msg: "Chef Automate API is responding"
      tags: molecule-notest