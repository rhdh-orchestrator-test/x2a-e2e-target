- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/systemd/system
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/chef
    - /tmp/molecule_test/usr/local/bin
    - /tmp/molecule_test/usr/bin
    - /tmp/molecule_test/etc/sysctl.d
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "[global]\n  v1 = true\n[deployment]\n  automate = \"enabled\"\n  infra-server = \"enabled\"\n[load_balancer]\n  v1 = true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create Chef Automate service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Automate

        After=network.target


        [Service]

        Type=simple

        ExecStart=/usr/local/bin/chef-automate start

        ExecStop=/usr/local/bin/chef-automate stop

        Restart=on-failure


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      mode: '0644'
  - name: Create Chef Server service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Infra Server

        After=network.target


        [Service]

        Type=simple

        ExecStart=/usr/bin/chef-server-ctl start

        ExecStop=/usr/bin/chef-server-ctl stop

        Restart=on-failure


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-server.service
      mode: '0644'
  - name: Create Chef Automate CLI binary
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        exit 0

        '
      dest: /tmp/molecule_test/usr/local/bin/chef-automate
      mode: '0755'
  - name: Create Chef Server CLI binary
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Server CLI mock"

        exit 0

        '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5NhYMol+K8tYnYNgikHoLssjZ8lsjKlW4MxHmE5WphX8w5S

        MOCK_PEM_CONTENT_FOR_USER

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5NhYMol+K8tYnYNgikHoLssjZ8lsjKlW4MxHmE5WphX8w5S

        MOCK_PEM_CONTENT_FOR_ORG

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create sysctl configuration
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
