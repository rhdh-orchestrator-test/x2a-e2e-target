---
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_key_path }}"
    - "{{ chef_org_key_path }}"
  become: true
  when: ansible_user_id != 'root'
- name: Create Chef Server user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}"  --filename {{ chef_user_key_path }}
  args:
    creates: "{{ chef_user_key_path }}"
  become: true
  no_log: true
- name: Create Chef Server organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_server_org_name }} "{{ chef_server_org_long_name }}"  --association_user {{ username }} --filename {{
      chef_org_key_path }}
  args:
    creates: "{{ chef_org_key_path }}"
  become: true
- name: Set proper permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_user_key_path }}"
    mode: "0600"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
  become: true
  when: ansible_user_id != 'root'
- name: Set proper permissions on organization key file
  ansible.builtin.file:
    path: "{{ chef_org_key_path }}"
    mode: "0600"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
  become: true
  when: ansible_user_id != 'root'
