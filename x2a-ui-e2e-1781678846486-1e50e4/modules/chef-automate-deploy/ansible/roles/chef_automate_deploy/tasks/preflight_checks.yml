---
- name: Check if system meets minimum requirements
  ansible.builtin.assert:
    that:
      - ansible_memtotal_mb >= 8192
      - ansible_processor_vcpus >= 2
    fail_msg: "System does not meet minimum requirements: 8GB RAM and 2 CPUs required"
    success_msg: System meets minimum requirements
- name: Check if required ports are available
  ansible.builtin.wait_for:
    port: "{{ item }}"
    state: stopped
    timeout: 5
  loop:
    - 443
    - 80
  ignore_errors: true
  register: port_check
  tags: molecule-notest
- name: Verify ports are available
  ansible.builtin.assert:
    that:
      - port_check is succeeded
    fail_msg: Required ports (80, 443) are already in use
    success_msg: Required ports are available
  tags: molecule-notest
- name: Check disk space
  ansible.builtin.command:
    cmd: df -h / --output=avail
  register: disk_space
  changed_when: false
- name: Verify sufficient disk space
  ansible.builtin.assert:
    that:
      - disk_space.stdout is regex('([0-9]+)G')
      - disk_space.stdout is regex('([0-9]{2,}|[5-9])G')
    fail_msg: Insufficient disk space. At least 5GB free space required
    success_msg: Sufficient disk space available
- name: Check if Chef Automate is already installed
  ansible.builtin.stat:
    path: /etc/chef-automate/config.toml
  register: chef_automate_config
- name: Set fact about Chef Automate installation status
  ansible.builtin.set_fact:
    chef_automate_already_installed: "{{ chef_automate_config.stat.exists | default(false) }}"
