---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Run preflight checks
  ansible.builtin.include_tasks: preflight_checks.yml
- name: Configure system for Chef Automate
  ansible.builtin.include_tasks: system_config.yml
  when: not chef_automate_already_installed | default(false)
- name: Install Chef Automate with Infra Server
  ansible.builtin.include_tasks: install_automate.yml
  when:
    - not chef_automate_already_installed | default(false)
    - chef_automate_deployment_mode == 'full'
- name: Install Chef Infra Server only
  ansible.builtin.include_tasks: install_chef_server.yml
  when:
    - not chef_automate_already_installed | default(false)
    - chef_automate_deployment_mode == 'infra-server-only'
- name: Set up Chef Server users and organizations
  ansible.builtin.include_tasks: setup_users_orgs.yml
  when: not chef_automate_already_installed | default(false)
