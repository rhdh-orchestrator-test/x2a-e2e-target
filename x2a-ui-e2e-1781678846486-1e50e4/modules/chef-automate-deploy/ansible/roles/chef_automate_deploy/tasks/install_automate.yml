---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - unzip
      - tar
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
  register: download_result
  notify:
    - Extract Chef Automate CLI
    - Make Chef Automate CLI executable
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product automate --product infra-server --accept-terms-and-mlsa=true"
  args:
    creates: /etc/chef-automate/config.toml
  become: true
  when: chef_automate_deployment_mode == 'full'
- name: Wait for Chef Automate services to be fully operational
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} status"
  register: automate_status
  until: automate_status.rc == 0
  retries: 12
  delay: 10
  become: true
  changed_when: false
  when: chef_automate_deployment_mode == 'full'
