---
- name: Install nginx package
  ansible.builtin.package:
    name: nginx
    state: present
- name: Create nginx sites-available directory
  ansible.builtin.file:
    path: /etc/nginx/sites-available
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Create nginx sites-enabled directory
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Deploy main nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx
- name: Deploy nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx
- name: Create document root parent directories
  ansible.builtin.file:
    path: "{{ item_site['value']['document_root'] | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
- name: Create document root directories for sites
  ansible.builtin.file:
    path: "{{ item_site['value']['document_root'] }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
- name: Deploy static index.html files for sites
  ansible.builtin.copy:
    src: "{{ item_site['key'].split('.')[0] }}/index.html"
    dest: "{{ item_site['value']['document_root'] }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
- name: Enable and start nginx service
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
