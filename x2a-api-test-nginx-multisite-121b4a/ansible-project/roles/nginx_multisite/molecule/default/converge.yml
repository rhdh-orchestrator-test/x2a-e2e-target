---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories for nginx configuration
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/nginx
        - /tmp/molecule_test/etc/nginx/conf.d
        - /tmp/molecule_test/etc/nginx/sites-available
        - /tmp/molecule_test/etc/nginx/sites-enabled
        - /tmp/molecule_test/etc/fail2ban
        - /tmp/molecule_test/etc/sysctl.d
        - /tmp/molecule_test/etc/ssh
        - /tmp/molecule_test/etc/ssl/certs
        - /tmp/molecule_test/etc/ssl/private
        - /tmp/molecule_test/opt/server/test
        - /tmp/molecule_test/opt/server/ci
        - /tmp/molecule_test/opt/server/status
      loop_control:
        loop_var: item_dir

    - name: Create main nginx configuration file
      ansible.builtin.copy:
        content: |
          user www-data;
          worker_processes auto;
          pid /run/nginx.pid;
          
          events {
              worker_connections 768;
              use epoll;
              multi_accept on;
          }
          
          http {
              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65;
              types_hash_max_size 2048;
              server_tokens off;
              
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_prefer_server_ciphers on;
              
              access_log /var/log/nginx/access.log;
              error_log /var/log/nginx/error.log;
              
              gzip on;
              gzip_vary on;
              gzip_proxied any;
              gzip_comp_level 6;
              gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
              
              include /etc/nginx/conf.d/*.conf;
              include /etc/nginx/sites-enabled/*;
          }
        dest: /tmp/molecule_test/etc/nginx/nginx.conf
        mode: "0644"
        backup: true

    - name: Create nginx security configuration
      ansible.builtin.copy:
        content: |
          # Security headers
          add_header X-Frame-Options "SAMEORIGIN" always;
          add_header X-XSS-Protection "1; mode=block" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header Referrer-Policy "no-referrer-when-downgrade" always;
          add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
          
          # Hide nginx version
          server_tokens off;
          
          # Limit request size
          client_max_body_size 100M;
          
          # Rate limiting
          limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
          limit_req_zone $binary_remote_addr zone=global:10m rate=1r/s;
        dest: /tmp/molecule_test/etc/nginx/conf.d/security.conf
        mode: "0644"
        backup: true

    - name: Create nginx site configurations
      ansible.builtin.copy:
        content: |
          server {
              listen 80;
              server_name {{ item_site['key'] }};
              return 301 https://$server_name$request_uri;
          }
          
          server {
              listen 443 ssl http2;
              server_name {{ item_site['key'] }};
              
              root {{ item_site['value']['document_root'] }};
              index index.html index.htm;
              
              ssl_certificate /etc/ssl/certs/{{ item_site['key'] }}.crt;
              ssl_certificate_key /etc/ssl/private/{{ item_site['key'] }}.key;
              
              ssl_session_timeout 1d;
              ssl_session_cache shared:SSL:50m;
              ssl_stapling on;
              ssl_stapling_verify on;
              
              location / {
                  try_files $uri $uri/ =404;
              }
              
              location ~ /\.ht {
                  deny all;
              }
          }
        dest: "/tmp/molecule_test/etc/nginx/sites-available/{{ item_site['key'] }}"
        mode: "0644"
        backup: true
      loop:
        - key: test.cluster.local
          value:
            document_root: /opt/server/test
            ssl_enabled: true
        - key: ci.cluster.local
          value:
            document_root: /opt/server/ci
            ssl_enabled: true
        - key: status.cluster.local
          value:
            document_root: /opt/server/status
            ssl_enabled: true
      loop_control:
        loop_var: item_site

    - name: Create symbolic links for enabled sites
      ansible.builtin.file:
        src: "/tmp/molecule_test/etc/nginx/sites-available/{{ item_site }}"
        dest: "/tmp/molecule_test/etc/nginx/sites-enabled/{{ item_site }}"
        state: link
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site

    - name: Create SSL certificates for sites
      ansible.builtin.copy:
        content: |
          -----BEGIN CERTIFICATE-----
          MIIDXTCCAkWgAwIBAgIJAKoK/heBjcOuMA0GCSqGSIb3DQEBCwUAMEUxCzAJBgNV
          BAYTAkFVMRMwEQYDVQQIDApTb21lLVN0YXRlMSEwHwYDVQQKDBhJbnRlcm5ldCBX
          aWRnaXRzIFB0eSBMdGQwHhcNMTcwODI3MjM1NzU5WhcNMTgwODI3MjM1NzU5WjBF
          MQswCQYDVQQGEwJBVTETMBEGA1UECAwKU29tZS1TdGF0ZTEhMB8GA1UECgwYSW50
          ZXJuZXQgV2lkZ2l0cyBQdHkgTHRkMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIB
          CgKCAQEAuuExKvY1xzHFw4A9J3QnsdTciByZWDuB4JSjb3+j+AjjZTrIHiVjEiK
          -----END CERTIFICATE-----
        dest: "/tmp/molecule_test/etc/ssl/certs/{{ item_cert }}.crt"
        mode: "0644"
        backup: true
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_cert

    - name: Create SSL private keys for sites
      ansible.builtin.copy:
        content: |
          -----BEGIN PRIVATE KEY-----
          MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC64TEq9jXHMcXD
          gD0ndCex1NyIHJlYO4HglKNvf6P4CONlOsgeJWMSIqJf7BJ2u61W2GddyFfQCXOz
          -----END PRIVATE KEY-----
        dest: "/tmp/molecule_test/etc/ssl/private/{{ item_key }}.key"
        mode: "0640"
        backup: true
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_key

    - name: Create site index.html files
      ansible.builtin.copy:
        content: "{{ item_content['content'] }}"
        dest: "/tmp/molecule_test/opt/server/{{ item_content['site'] }}/index.html"
        mode: "0644"
        backup: true
      loop:
        - site: test
          content: |
            <!DOCTYPE html>
            <html><head><title>Test Environment</title></head>
            <body><h1>Test Environment</h1><p>Running on test.cluster.local</p></body></html>
        - site: ci
          content: |
            <!DOCTYPE html>
            <html><head><title>CI Environment</title></head>
            <body><h1>CI Environment</h1><p>Running on ci.cluster.local</p></body></html>
        - site: status
          content: |
            <!DOCTYPE html>
            <html><head><title>Status Environment</title></head>
            <body><h1>Status Environment</h1><p>Running on status.cluster.local</p></body></html>
      loop_control:
        loop_var: item_content

    - name: Create fail2ban jail configuration
      ansible.builtin.copy:
        content: |
          [DEFAULT]
          bantime = 3600
          findtime = 600
          maxretry = 5
          
          [nginx-http-auth]
          enabled = true
          port = http,https
          logpath = /var/log/nginx/error.log
          
          [nginx-noscript]
          enabled = true
          port = http,https
          logpath = /var/log/nginx/access.log
          
          [nginx-badbots]
          enabled = true
          port = http,https
          logpath = /var/log/nginx/access.log
        dest: /tmp/molecule_test/etc/fail2ban/jail.local
        mode: "0644"
        backup: true

    - name: Create sysctl security configuration
      ansible.builtin.copy:
        content: |
          # IP Spoofing protection
          net.ipv4.conf.default.rp_filter = 1
          net.ipv4.conf.all.rp_filter = 1
          
          # Ignore ICMP redirects
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv6.conf.all.accept_redirects = 0
          
          # Ignore send redirects
          net.ipv4.conf.all.send_redirects = 0
          
          # Disable source packet routing
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv6.conf.all.accept_source_route = 0
          
          # Log Martians
          net.ipv4.conf.all.log_martians = 1
          
          # Ignore ICMP ping requests
          net.ipv4.icmp_echo_ignore_all = 1
        dest: /tmp/molecule_test/etc/sysctl.d/99-security.conf
        mode: "0644"
        backup: true

    - name: Create SSH configuration with security settings
      ansible.builtin.copy:
        content: |
          # SSH daemon configuration
          Port 22
          Protocol 2
          HostKey /etc/ssh/ssh_host_rsa_key
          HostKey /etc/ssh/ssh_host_dsa_key
          HostKey /etc/ssh/ssh_host_ecdsa_key
          HostKey /etc/ssh/ssh_host_ed25519_key
          
          # Security settings
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          AuthorizedKeysFile .ssh/authorized_keys
          
          # Logging
          SyslogFacility AUTH
          LogLevel INFO
          
          # Connection settings
          LoginGraceTime 2m
          MaxAuthTries 6
          MaxSessions 10
        dest: /tmp/molecule_test/etc/ssh/sshd_config
        mode: "0644"
        backup: true