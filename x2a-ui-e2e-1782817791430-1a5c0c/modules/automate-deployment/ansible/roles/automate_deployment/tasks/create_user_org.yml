---
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ long_username }} {{ user_email }} '{{ user_password }}' --filename {{ automate_user_file }}
    creates: "{{ automate_user_file }}"
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ org_name }} '{{ long_org_name }}' --association_user {{ username }} --filename {{ automate_org_file }}
    creates: "{{ automate_org_file }}"
  become: true
