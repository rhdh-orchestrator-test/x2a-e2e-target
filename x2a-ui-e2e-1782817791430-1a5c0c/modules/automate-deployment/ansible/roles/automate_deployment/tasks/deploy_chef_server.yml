---
- name: Check if Chef Infra Server is already deployed
  ansible.builtin.stat:
    path: /hab/sup
  register: hab_sup_dir
  become: true
- name: Deploy Chef Infra Server
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product infra-server --accept-terms-and-mlsa=true
    creates: /hab/sup
  become: true
  args:
    chdir: "{{ playbook_dir }}"
  when: not hab_sup_dir.stat.exists
