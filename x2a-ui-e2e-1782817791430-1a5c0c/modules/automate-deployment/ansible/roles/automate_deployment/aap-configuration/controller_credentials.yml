---
controller_credentials:
- name: Chef User Credentials - automate_deployment
  description: Credential for automate_deployment
  organization: Default
  credential_type: Chef User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    long_username: '{{ long_username }}'
    user_email: '{{ user_email }}'
    user_password: '{{ vault_user_password }}'
- name: Chef Organization Credentials - automate_deployment
  description: Credential for automate_deployment
  organization: Default
  credential_type: Chef Organization Credentials
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    long_org_name: '{{ long_org_name }}'
