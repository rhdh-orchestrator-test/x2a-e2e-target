---
automate_hostname: automate.chef.lab
automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
automate_cli_path: ./chef-automate
automate_kernel_params:
  vm.max_map_count: "262144"
  vm.dirty_expire_centisecs: "20000"
automate_accept_terms: true
automate_deploy_automate: true
automate_deploy_infra_server: true
automate_user_file: "{{ username }}.pem"
automate_org_file: "{{ org_name }}-validator.pem"
