---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: "test_user"
    org_name: "test_org"
    automate_hostname: "automate.test.local"
  tasks:
    # Check hostname configuration
    - name: Check if hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file does not exist"
        success_msg: "Hostname file exists"

    - name: Get hostname file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is correctly set
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == automate_hostname
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_file.stat.exists

    # Check kernel parameters
    - name: Check if sysctl config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl config file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl config file does not exist"
        success_msg: "Sysctl config file exists"

    - name: Get sysctl config file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert kernel parameters are correctly set
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count = 262144' in (sysctl_content.content | b64decode)"
          - "'vm.dirty_expire_centisecs = 20000' in (sysctl_content.content | b64decode)"
        fail_msg: "Kernel parameters are not set correctly"
        success_msg: "Kernel parameters are set correctly"
      when: sysctl_file.stat.exists

    # Check Chef Automate CLI
    - name: Check if Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: cli_file

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - cli_file.stat.exists
          - cli_file.stat.isreg
          - cli_file.stat.executable
        fail_msg: "Chef Automate CLI does not exist or is not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Check Chef deployment
    - name: Check if hab directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: hab_dir

    - name: Assert hab directory exists
      ansible.builtin.assert:
        that:
          - hab_dir.stat.exists
          - hab_dir.stat.isdir
        fail_msg: "Hab directory does not exist"
        success_msg: "Hab directory exists"

    # Check user and organization PEM files
    - name: Check if user PEM file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ username }}.pem"
      register: user_pem

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.isreg
          - user_pem.stat.mode == "0600"
        fail_msg: "User PEM file does not exist or has incorrect permissions"
        success_msg: "User PEM file exists with correct permissions"

    - name: Check if organization validator PEM file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ org_name }}-validator.pem"
      register: org_pem

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_pem.stat.exists
          - org_pem.stat.isreg
          - org_pem.stat.mode == "0600"
        fail_msg: "Organization validator PEM file does not exist or has incorrect permissions"
        success_msg: "Organization validator PEM file exists with correct permissions"

    # The following checks would normally be performed but can't run in a container
    # They are tagged with molecule-notest so they'll be skipped during molecule testing

    - name: Check Chef Automate services
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate services are running
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - ansible_facts.services['chef-automate.service'].state == 'running'
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check if Chef Automate UI is accessible
      ansible.builtin.uri:
        url: "https://{{ automate_hostname }}"
        validate_certs: no
        status_code: 200
      register: ui_check
      tags: molecule-notest

    - name: Assert Chef Automate UI is accessible
      ansible.builtin.assert:
        that:
          - ui_check.status == 200
        fail_msg: "Chef Automate UI is not accessible"
        success_msg: "Chef Automate UI is accessible"
      tags: molecule-notest