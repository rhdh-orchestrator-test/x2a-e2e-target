---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Create temporary directory for Chef Automate CLI download
  ansible.builtin.tempfile:
    state: directory
    suffix: chef-automate
  register: chef_automate_temp_dir
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ automate_cli_url }}"
    dest: "{{ chef_automate_temp_dir.path }}/chef-automate.zip"
    mode: "0644"
- name: Ensure playbook directory exists
  ansible.builtin.file:
    path: "{{ playbook_dir }}"
    state: directory
    mode: "0755"
  when: playbook_dir is defined
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < {{ chef_automate_temp_dir.path }}/chef-automate.zip > {{ automate_cli_path }}
    creates: "{{ automate_cli_path }}"
  args:
    executable: /bin/bash
- name: Set execute permissions on Chef Automate CLI
  ansible.builtin.file:
    path: "{{ automate_cli_path }}"
    mode: "0755"
    state: file
