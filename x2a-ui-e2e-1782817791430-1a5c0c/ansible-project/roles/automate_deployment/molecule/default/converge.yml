---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: "test_user"
    long_username: "Test User"
    user_email: "test@example.com"
    user_password: "testpassword"
    org_name: "test_org"
    long_org_name: "Test Organization"
    automate_hostname: "automate.test.local"
    automate_cli_path: "/tmp/molecule_test/chef-automate"
    automate_user_file: "/tmp/molecule_test/test_user.pem"
    automate_org_file: "/tmp/molecule_test/test_org-validator.pem"
    playbook_dir: "/tmp/molecule_test"
  tasks:
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/etc/sysctl.d

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ automate_hostname }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate kernel parameters file
    - name: Create sysctl configuration file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI mock"
        dest: "{{ automate_cli_path }}"
        mode: "0755"

    # Simulate user and organization PEM files
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA...
          -----END RSA PRIVATE KEY-----
        dest: "{{ automate_user_file }}"
        mode: "0600"

    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA...
          -----END RSA PRIVATE KEY-----
        dest: "{{ automate_org_file }}"
        mode: "0600"

    # Simulate /hab directory to indicate successful deployment
    - name: Create hab directory structure
      ansible.builtin.file:
        path: "/tmp/molecule_test/hab/sup"
        state: directory
        mode: "0755"

    # Create mock chef-server-ctl command
    - name: Create mock chef-server-ctl command
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Server CTL mock"
          echo "$@" > /tmp/molecule_test/chef-server-ctl-args.txt
          exit 0
        dest: "/tmp/molecule_test/chef-server-ctl"
        mode: "0755"