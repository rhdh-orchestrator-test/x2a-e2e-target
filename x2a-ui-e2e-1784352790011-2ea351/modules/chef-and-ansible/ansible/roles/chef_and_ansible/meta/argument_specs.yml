---
argument_specs:
  main:
    short_description: Install and configure Apache web server with HTTPS and security hardening
    description:
      - This role installs and configures Apache web server with HTTPS support
      - Sets up a simple Hello World website
      - Implements security hardening (POODLE vulnerability fix)
    options:
      apache_version:
        type: str
        default: 2.4.41-4ubuntu3.10
        description: Version of Apache to install
      ssl_cert_dir:
        type: str
        default: /etc/apache2/certs
        description: Directory for SSL certificates
      vhost_name:
        type: str
        default: helloworld
        description: Name of the virtual host
      document_root:
        type: str
        default: /var/www/helloworld
        description: Document root for the website
      ssl_protocols:
        type: str
        default: -all +TLSv1.2
        description: SSL protocols to enable/disable
      ssl_key:
        type: str
        required: false
        description: SSL private key content (if provided)
      ssl_cert:
        type: str
        required: false
        description: SSL certificate content (if provided)
      ssl_csr:
        type: str
        required: false
        description: SSL certificate signing request content (if provided)
