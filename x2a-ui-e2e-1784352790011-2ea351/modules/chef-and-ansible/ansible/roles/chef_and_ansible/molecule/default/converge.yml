---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for Apache and SSL certificates
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/apache2/sites-available
        - /tmp/molecule_test/etc/apache2/mods-available
        - /tmp/molecule_test/etc/apache2/certs
        - /tmp/molecule_test/var/www/helloworld

    # Create mock SSL files
    - name: Create mock SSL key
      ansible.builtin.copy:
        content: "-----BEGIN PRIVATE KEY-----\nMOCK_PRIVATE_KEY_CONTENT\n-----END PRIVATE KEY-----"
        dest: /tmp/molecule_test/etc/apache2/certs/apache.key
        mode: "0640"

    - name: Create mock SSL CSR
      ansible.builtin.copy:
        content: "-----BEGIN CERTIFICATE REQUEST-----\nMOCK_CSR_CONTENT\n-----END CERTIFICATE REQUEST-----"
        dest: /tmp/molecule_test/etc/apache2/certs/apache.csr
        mode: "0640"

    - name: Create mock SSL certificate
      ansible.builtin.copy:
        content: "-----BEGIN CERTIFICATE-----\nMOCK_CERTIFICATE_CONTENT\n-----END CERTIFICATE-----"
        dest: /tmp/molecule_test/etc/apache2/certs/apache.crt
        mode: "0640"

    # Create mock Apache configuration files
    - name: Create mock Apache virtual host configuration
      ansible.builtin.copy:
        content: |
          <VirtualHost *:443>
           DocumentRoot "/var/www/helloworld"
           SSLEngine on
           SSLCertificateFile /etc/apache2/certs/apache.crt
           SSLCertificateKeyFile /etc/apache2/certs/apache.key
            <Directory "/var/www/helloworld">
              allow from all
              Options None
              Require all granted
            </Directory>
          </VirtualHost>
        dest: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
        mode: "0640"

    - name: Create mock SSL module configuration
      ansible.builtin.copy:
        content: |
          SSLProtocol -all +TLSv1.2
          # Other SSL configuration would be here
        dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
        mode: "0644"

    # Create mock website content
    - name: Create mock website content
      ansible.builtin.copy:
        content: |
          <html>
            <head>
              <title>Test Site</title>
            </head>
            <body>
              <h1>Hello, world!</h1>
              <p>The site is up and running</p>
            </body>
          </html>
        dest: /tmp/molecule_test/var/www/helloworld/index.html
        mode: "0644"

    # Create mock enabled sites directory and symlinks
    - name: Create sites-enabled directory
      ansible.builtin.file:
        path: /tmp/molecule_test/etc/apache2/sites-enabled
        state: directory
        mode: "0755"

    - name: Create mock symlink for enabled site
      ansible.builtin.file:
        src: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
        dest: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
        state: link

    # Create mock mods-enabled directory and symlinks
    - name: Create mods-enabled directory
      ansible.builtin.file:
        path: /tmp/molecule_test/etc/apache2/mods-enabled
        state: directory
        mode: "0755"

    - name: Create mock symlink for enabled SSL module
      ansible.builtin.file:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
        dest: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.conf
        state: link