---
controller_credential_types:
- name: Chef Automate User Credentials
  description: User credentials for Chef Automate deployment
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Automate authentication
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Automate authentication
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Apache SSL Certificate
  description: SSL certificates for Apache HTTPS configuration
  kind: cloud
  inputs:
    fields:
    - id: ssl_key
      type: string
      label: SSL Private Key
      secret: true
      help_text: Private key for SSL certificate
    - id: ssl_cert
      type: string
      label: SSL Certificate
      help_text: Self-signed SSL certificate for Apache
    - id: ssl_csr
      type: string
      label: Certificate Signing Request
      help_text: CSR used to generate the certificate
    required:
    - ssl_key
    - ssl_cert
  injectors:
    extra_vars:
      ssl_key: !unsafe '{{ ssl_key }}'
      ssl_cert: !unsafe '{{ ssl_cert }}'
      ssl_csr: !unsafe '{{ ssl_csr }}'
