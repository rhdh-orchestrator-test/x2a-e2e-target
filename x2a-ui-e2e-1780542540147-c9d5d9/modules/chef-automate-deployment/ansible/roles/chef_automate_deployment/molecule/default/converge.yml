- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directory structure
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/var/log/chef-automate
    - /tmp/molecule_test/{{ chef_automate_user_key_path | dirname }}
    - /tmp/molecule_test/{{ chef_automate_org_key_path | dirname }}
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '# Simulated sysctl configuration

        vm.max_map_count = {{ chef_automate_vm_max_map_count }}

        vm.dirty_expire_centisecs = {{ chef_automate_vm_dirty_expire_centisecs }}

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/sh

        # Simulated Chef Automate CLI

        echo "Chef Automate CLI"

        '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment files
    ansible.builtin.copy:
      content: '# Simulated Chef Automate deployment

        # This would be created by the chef-automate deploy command

        '
      dest: /tmp/molecule_test/hab/sup/default/data/chef-automate-deployment.toml
      mode: '0644'
  - name: Create Chef Infra Server files
    ansible.builtin.copy:
      content: '# Simulated Chef Infra Server configuration

        '
      dest: /tmp/molecule_test/hab/sup/default/data/chef-infra-server.toml
      mode: '0644'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA...SIMULATED_KEY_CONTENT...

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_automate_user_key_path }}
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA...SIMULATED_ORG_KEY_CONTENT...

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_automate_org_key_path }}
      mode: '0600'
  - name: Create log files
    ansible.builtin.copy:
      content: '[2023-01-01T00:00:00Z] Chef Automate started successfully

        [2023-01-01T00:00:01Z] Chef Infra Server started successfully

        '
      dest: /tmp/molecule_test/var/log/chef-automate/deployment.log
      mode: '0644'
  - name: Create chef-server-ctl command
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/bin
      state: directory
      mode: '0755'
  - name: Create chef-server-ctl executable
    ansible.builtin.copy:
      content: '#!/bin/sh

        # Simulated chef-server-ctl

        echo "Chef Server Control"

        '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_username: jtonello
    chef_automate_orgname: lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_user_key_path: jtonello.pem
    chef_automate_org_key_path: lab-validator.pem
