- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl configuration file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl configuration file not found
      success_msg: Sysctl configuration file exists
  - name: Get sysctl file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl parameters are set correctly
    ansible.builtin.assert:
      that:
      - (sysctl_content.content | b64decode) is search("vm.max_map_count = 262144")
      - (sysctl_content.content | b64decode) is search("vm.dirty_expire_centisecs = 20000")
      fail_msg: Sysctl parameters not set correctly
      success_msg: Sysctl parameters set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.isreg
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate deployment file
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/sup/default/data/chef-automate-deployment.toml
    register: chef_automate_deployment
  - name: Assert Chef Automate deployment file exists
    ansible.builtin.assert:
      that:
      - chef_automate_deployment.stat.exists
      - chef_automate_deployment.stat.isreg
      fail_msg: Chef Automate deployment file not found
      success_msg: Chef Automate deployment file exists
  - name: Check Chef Infra Server file
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/sup/default/data/chef-infra-server.toml
    register: chef_infra_server
  - name: Assert Chef Infra Server file exists
    ansible.builtin.assert:
      that:
      - chef_infra_server.stat.exists
      - chef_infra_server.stat.isreg
      fail_msg: Chef Infra Server file not found
      success_msg: Chef Infra Server file exists
  - name: Check chef-server-ctl command
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/chef-server-ctl
    register: chef_server_ctl
  - name: Assert chef-server-ctl exists and is executable
    ansible.builtin.assert:
      that:
      - chef_server_ctl.stat.exists
      - chef_server_ctl.stat.isreg
      - chef_server_ctl.stat.executable
      fail_msg: chef-server-ctl command not found or not executable
      success_msg: chef-server-ctl command exists and is executable
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.isreg
      - user_key_file.stat.size > 0
      fail_msg: User key file not found or empty
      success_msg: User key file exists
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_key_file
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.isreg
      - org_key_file.stat.size > 0
      fail_msg: Organization validator key file not found or empty
      success_msg: Organization validator key file exists
  - name: Check deployment log file
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/log/chef-automate/deployment.log
    register: deployment_log
  - name: Assert deployment log file exists
    ansible.builtin.assert:
      that:
      - deployment_log.stat.exists
      - deployment_log.stat.isreg
      - deployment_log.stat.size > 0
      fail_msg: Deployment log file not found or empty
      success_msg: Deployment log file exists
  - name: Check Chef Automate service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      - ansible_facts.services['chef-automate.service'].state == 'running'
      fail_msg: Chef Automate service not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check if port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    ignore_errors: true
    register: port_check
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is succeeded
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
  - name: Check web UI access
    ansible.builtin.uri:
      url: https://localhost
      validate_certs: false
      status_code: 200
    register: web_ui_check
    ignore_errors: true
    tags: molecule-notest
  - name: Assert web UI is accessible
    ansible.builtin.assert:
      that:
      - web_ui_check is succeeded
      fail_msg: Web UI is not accessible
      success_msg: Web UI is accessible
    tags: molecule-notest
