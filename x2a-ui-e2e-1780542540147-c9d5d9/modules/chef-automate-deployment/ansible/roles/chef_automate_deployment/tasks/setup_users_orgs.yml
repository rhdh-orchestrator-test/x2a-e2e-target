---
- name: Check if chef-server-ctl is available
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_key_path }}"
    - "{{ chef_automate_org_key_path }}"
  when: item | dirname != '.'
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_automate_username | default(username) }} {{ chef_automate_longusername | default(full_name) }} {{ chef_automate_useremail
      | default(email) }} "{{ password }}" --filename {{ chef_automate_user_key_path }}

      '
  become: true
  args:
    creates: "{{ chef_automate_user_key_path }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  no_log: true
  when: chef_server_ctl.stat.exists
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_orgname }} "{{ chef_automate_longorgname }}" --association_user {{ chef_automate_username | default(username)
      }} --filename {{ chef_automate_org_key_path }}

      '
  become: true
  args:
    creates: "{{ chef_automate_org_key_path }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
  when: chef_server_ctl.stat.exists
