- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/etc/sysctl.d
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/usr/bin
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '# Managed by Ansible

        vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/sh

        # Mock Chef Automate CLI

        echo "Chef Automate CLI mock"

        '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab/sup
      state: directory
      mode: '0755'
  - name: Create Chef Server deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab/pkgs/chef
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        MOCK_KEY_CONTENT_FOR_TESTING_ONLY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/admin.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        MOCK_VALIDATOR_KEY_CONTENT_FOR_TESTING_ONLY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/default-validator.pem
      mode: '0600'
  - name: Create mock chef-server-ctl
    ansible.builtin.copy:
      content: '#!/bin/sh

        # Mock chef-server-ctl

        echo "Chef Server CTL mock"

        echo "Command executed: $@"

        '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
