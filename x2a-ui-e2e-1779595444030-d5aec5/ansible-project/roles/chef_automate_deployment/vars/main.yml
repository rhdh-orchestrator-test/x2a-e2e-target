---
chef_automate_cli_binary: chef-automate
chef_automate_deploy_cmd: "{{ chef_automate_cli_path }} deploy  {% for product in chef_automate_products %}--product {{ product }} {% endfor %} --accept-terms-and-mlsa={{
  chef_automate_accept_terms | lower }}"
chef_server_deploy_cmd: "{{ chef_automate_cli_path }} deploy  --product infra-server  --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}"
chef_server_user_create_cmd: chef-server-ctl user-create  {{ chef_user_name }}  "{{ chef_user_full_name }}"  {{ chef_user_email }}  "{{ password }}"  --filename
  {{ chef_user_key_file }}
chef_server_org_create_cmd: chef-server-ctl org-create  {{ chef_org_name }}  "{{ chef_org_full_name }}"  --association_user {{ chef_user_name }}  --filename {{
  chef_org_validator_key_file }}
