---
- name: Include system configuration tasks
  ansible.builtin.include_tasks: system_config.yml
- name: Ensure required packages for Chef Infra Server are installed
  ansible.builtin.package:
    name:
      - curl
      - tar
      - jq
    state: present
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_server_deploy_cmd }}"
  args:
    creates: /hab
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
  failed_when: chef_server_deploy.rc != 0 and 'already exists' not in chef_server_deploy.stderr
- name: Wait for Chef Infra Server services to be ready
  ansible.builtin.wait_for:
    host: localhost
    port: 443
    delay: 10
    timeout: 300
  when: chef_server_deploy.changed
- name: Include tasks to create users and organizations
  ansible.builtin.include_tasks: create_users_orgs.yml
