---
controller_credentials:
- name: Chef User Password - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User Password
  update_secrets: true
  inputs:
    password: '{{ vault_password }}'
- name: SSL Private Key - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: SSL Private Key
  update_secrets: true
  inputs:
    private_key: '{{ vault_private_key }}'
- name: Chef User Authentication - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User Authentication
  update_secrets: true
  inputs:
    username: '{{ username }}'
    user_key: '{{ vault_user_key }}'
- name: Chef Organization Validator - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Organization Validator
  update_secrets: true
  inputs:
    organization: '{{ organization }}'
    validator_key: '{{ vault_validator_key }}'
