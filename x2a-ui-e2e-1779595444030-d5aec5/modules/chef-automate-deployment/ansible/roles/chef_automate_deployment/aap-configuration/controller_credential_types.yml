---
controller_credential_types:
- name: Chef User Password
  description: Credential type for Chef User Password
  kind: cloud
  inputs:
    fields:
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the initial Chef user account
    required:
    - password
  injectors:
    extra_vars:
      password: !unsafe '{{ password }}'
- name: SSL Private Key
  description: Credential type for SSL Private Key
  kind: cloud
  inputs:
    fields:
    - id: private_key
      type: string
      label: SSL Private Key
      secret: true
      help_text: SSL private key for secure web server configuration
    required:
    - private_key
  injectors:
    extra_vars:
      private_key: !unsafe '{{ private_key }}'
- name: Chef User Authentication
  description: Credential type for Chef User Authentication
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef user account
    - id: user_key
      type: string
      label: User Key
      secret: true
      help_text: PEM file for Chef user authentication
    required:
    - username
    - user_key
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      user_key: !unsafe '{{ user_key }}'
- name: Chef Organization Validator
  description: Credential type for Chef Organization Validator
  kind: cloud
  inputs:
    fields:
    - id: organization
      type: string
      label: Organization Name
      help_text: Short name for Chef organization
    - id: validator_key
      type: string
      label: Organization Validator Key
      secret: true
      help_text: PEM file for Chef organization validation
    required:
    - organization
    - validator_key
  injectors:
    extra_vars:
      organization: !unsafe '{{ organization }}'
      validator_key: !unsafe '{{ validator_key }}'
