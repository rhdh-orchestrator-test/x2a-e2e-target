---
controller_credentials:
- name: Chef Deployment Admin - chef_automate_deployment
  description: Admin user credentials for Chef Automate and Chef Infra Server deployment
  organization: Default
  credential_type: Chef Deployment Admin
  update_secrets: true
  inputs:
    username: '{{ username }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
    password: '{{ vault_password }}'
- name: Chef Organization - chef_automate_deployment
  description: Organization configuration for Chef Infra Server
  organization: Default
  credential_type: Chef Organization
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
    validator_key: '{{ vault_validator_key }}'
