# Unsupported pre-flight checks: service-name discovery/status/enablement, Redis command output without a stated
# expected result, authenticated Redis checks requiring an unavailable secret, process/log inspection, and socket
# checks without a stated expected result.
---
- name: Verify Redis cache implementation
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_file

    - name: Assert Redis configuration file is present
      ansible.builtin.assert:
        that:
          - redis_config_file['stat']['exists']
          - redis_config_file['stat']['isreg']
        fail_msg: Redis configuration file is missing or is not a regular file.
        success_msg: Redis configuration file is present.

    - name: Read Redis configuration for removed-directive verification
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content

    - name: Assert removed Redis directives are absent
      ansible.builtin.assert:
        that:
          - >-
            not (redis_config_content['content'] | b64decode |
            regex_search('(?m)^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)'))
        fail_msg: A removed Redis replication directive is present in the configuration.
        success_msg: Removed Redis replication directives are absent.

    - name: Verify Redis log directory metadata
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_directory

    - name: Assert Redis log directory has expected ownership and permissions
      ansible.builtin.assert:
        that:
          - redis_log_directory['stat']['exists']
          - redis_log_directory['stat']['isdir']
          - redis_log_directory['stat']['pw_name'] == 'redis'
          - redis_log_directory['stat']['gr_name'] == 'redis'
          - redis_log_directory['stat']['mode'] == '0755'
        fail_msg: Redis log directory is missing or has unexpected metadata.
        success_msg: Redis log directory has the expected metadata.
