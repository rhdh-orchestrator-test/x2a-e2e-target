---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis server on port 6379. The source value is hardcoded in a Chef recipe and must be moved to 
      Ansible Vault or an approved AAP secret mechanism.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis clients to authenticate to the Redis server.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
