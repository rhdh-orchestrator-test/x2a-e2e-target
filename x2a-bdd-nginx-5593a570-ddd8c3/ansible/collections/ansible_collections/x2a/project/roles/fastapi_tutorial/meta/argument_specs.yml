---
argument_specs:
  main:
    short_description: Deploy and configure the FastAPI Tutorial application.
    description:
      - Installs the application dependencies, PostgreSQL prerequisites, and systemd service.
      - Database credential variables are injected by AAP credential types.
    options:
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI Tutorial application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_root:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application deployment directory.
      fastapi_tutorial_venv:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: User running the application service.
      fastapi_tutorial_service_group:
        type: str
        required: false
        default: root
        description: Group running the application service.
      fastapi_tutorial_bind_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Address on which Uvicorn listens.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which Uvicorn listens.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Application project name written to the environment file.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: Application API version written to the environment file.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle database credentials.
      database_username:
        type: str
        required: true
        description: Database username injected by an AAP credential type.
      database_password:
        type: str
        required: true
        description: Database password injected by an AAP credential type.
      database_name:
        type: str
        required: true
        description: Database name injected by an AAP credential type.
      database_host:
        type: str
        required: true
        description: Database host injected by an AAP credential type.
      database_url:
        type: str
        required: true
        description: Database connection URL injected by an AAP credential type.
