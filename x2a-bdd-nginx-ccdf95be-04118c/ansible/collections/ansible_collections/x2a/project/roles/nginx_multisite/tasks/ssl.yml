---
- name: Install TLS packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_certificate_path }}" # noqa: R114 - path is a role-defined default
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}" # noqa: R114 - path is a role-defined default
    owner: root
    group: ssl-cert
    mode: "0710"
    state: directory

- name: Check TLS certificate
  ansible.builtin.stat:
    path: "{{ nginx_multisite_certificate_path }}/{{ item_ssl_site['key'] }}.crt" # noqa: R114 - path from role-defined sites
  register: item_ssl_certificate
  when: item_ssl_site['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site

- name: Check TLS private key
  ansible.builtin.stat:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_ssl_site['key'] }}.key" # noqa: R114 - path from role-defined sites
  register: item_ssl_private_key
  when: item_ssl_site['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site

- name: Generate self-signed TLS certificates
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_multisite_private_key_path }}/{{ item_ssl_site['key'] }}.key" # noqa: R114 - path from role-defined sites
      - -out
      - "{{ nginx_multisite_certificate_path }}/{{ item_ssl_site['key'] }}.crt" # noqa: R114 - path from role-defined sites
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl_site['key'] }}/emailAddress=admin@example.com
  when:
    - item_ssl_site['value']['ssl_enabled']
    - >-
      not item_ssl_certificate.results[item_ssl_site_index].stat.exists or
      not item_ssl_private_key.results[item_ssl_site_index].stat.exists
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
    index_var: item_ssl_site_index
  notify: Reload nginx

- name: Set TLS private key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_ssl_site['key'] }}.key" # noqa: R114 - path from role-defined sites dictionary
    owner: root
    group: ssl-cert
    mode: "0640"
    state: file
  when: item_ssl_site['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
