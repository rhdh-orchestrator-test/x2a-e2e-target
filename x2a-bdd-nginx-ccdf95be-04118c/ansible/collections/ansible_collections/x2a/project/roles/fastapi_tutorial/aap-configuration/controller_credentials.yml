---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: PostgreSQL application database credential currently hardcoded in the Chef recipe and .env file; migrate the password to Ansible Vault.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      database_host: "{{ database_host }}"
      database_name: "{{ database_name }}"
      database_url: "{{ vault_database_url }}"
