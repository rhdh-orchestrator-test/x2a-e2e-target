---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: PostgreSQL application database credential currently hardcoded in the Chef recipe and .env file; migrate the password to Ansible Vault.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL application role; currently hardcoded as fastapi_password.
        - id: database_host
          type: string
          label: Database Host
          help_text: PostgreSQL server hostname or address used by the application.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_url
          type: string
          label: Database Connection URL
          secret: true
          help_text: Full PostgreSQL connection string provided to the FastAPI application through DATABASE_URL.
      required:
        - db_username
        - db_password
        - database_host
        - database_name
        - database_url
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_host: !unsafe "{{ database_host }}"
        database_name: !unsafe "{{ database_name }}"
        database_url: !unsafe "{{ database_url }}"
