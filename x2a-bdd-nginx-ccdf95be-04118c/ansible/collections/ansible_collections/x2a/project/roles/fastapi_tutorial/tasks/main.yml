---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Ensure application service group exists
  ansible.builtin.group:
    name: "{{ fastapi_tutorial_service_group }}"
    state: present

- name: Ensure application service user exists
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    create_home: false
    state: present

- name: Install FastAPI system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path from role default, not user input
    state: directory
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    mode: "0755"
    recurse: true

- name: Synchronize FastAPI Tutorial repository
  ansible.builtin.git: # noqa: R104 - repository URL defaults to HTTPS in role defaults
    repo: "{{ fastapi_tutorial_repo_url }}" # noqa: R106 - repository URL is a trusted role default
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path from role default, not user input
    version: "{{ fastapi_tutorial_repo_version }}"
    update: true

- name: Create Python virtual environment
  ansible.builtin.command: # noqa: R101 - command arguments use trusted role defaults
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}/bin/activate" # noqa: R114 - path from role default, not user input

- name: Install Python dependencies
  ansible.builtin.pip: # noqa: R113 - requirements and virtualenv paths come from role defaults
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - path from role default, not user input
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path from role default, not user input

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create PostgreSQL role and database # noqa: L039 - credentials are validated by the preceding task
  ansible.builtin.shell: # noqa: R101 - database command uses validated credential variables
    cmd: |
      psql -v ON_ERROR_STOP=1 -d postgres -c "DO $${BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ db_username }}') THEN CREATE ROLE {{ db_username }} LOGIN PASSWORD '{{ db_password }}'; ELSE ALTER ROLE {{ db_username }} WITH LOGIN PASSWORD '{{ db_password }}'; END IF; END$$;"
      psql -v ON_ERROR_STOP=1 -d postgres -c "SELECT 'CREATE DATABASE {{ database_name }} OWNER {{ db_username }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ database_name }}')\gexec"
      psql -v ON_ERROR_STOP=1 -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ db_username }};"
    executable: /bin/bash
  become: true # noqa: R108 - PostgreSQL administration requires the postgres user
  become_user: postgres
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write application environment file
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL={{ database_url }}
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path from role default, not user input
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}" # noqa: L039 - database_url is validated by the preceding task

- name: Write FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User={{ fastapi_tutorial_service_user }}
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn {{ fastapi_tutorial_app_module }} --host {{ fastapi_tutorial_bind_host }} --port {{ fastapi_tutorial_bind_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/{{ fastapi_tutorial_service_name }}.service # noqa: R114 - service name from role default, not user input
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd daemon

- name: Apply pending systemd unit changes before managing service
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI Tutorial service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    state: started
    enabled: true
