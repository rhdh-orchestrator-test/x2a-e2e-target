---
argument_specs:
  main:
    short_description: Install and configure the FastAPI Tutorial application.
    description:
      - Deploys the FastAPI Tutorial repository, Python virtual environment, PostgreSQL-backed configuration, and systemd service.
    options:
      fastapi_tutorial_repo_url:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the application.
      fastapi_tutorial_repo_version:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_venv_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_app_module:
        type: str
        required: false
        default: app.main:app
        description: Uvicorn application import path.
      fastapi_tutorial_bind_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Address on which Uvicorn listens.
      fastapi_tutorial_bind_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which Uvicorn listens.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: User running the application service.
      fastapi_tutorial_service_group:
        type: str
        required: false
        default: root
        description: Group owning application-managed files.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name written to the application environment file.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version written to the application environment file.
      fastapi_tutorial_database_port:
        type: int
        required: false
        default: 5432
        description: PostgreSQL TCP port.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations involving credential variables.
      db_username:
        type: str
        required: true
        description: Database username injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: Database password injected by an AAP credential type.
      database_host:
        type: str
        required: true
        description: Database host injected by an AAP credential type.
      database_name:
        type: str
        required: true
        description: Database name injected by an AAP credential type.
      database_url:
        type: str
        required: true
        description: Database connection URL injected by an AAP credential type.
