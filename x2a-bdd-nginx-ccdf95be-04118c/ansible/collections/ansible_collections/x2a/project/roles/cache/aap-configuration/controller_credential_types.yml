---
controller_credential_types:
  - name: Redis Authentication
    description: Reported hardcoded Redis password used to authenticate clients to the Redis instance on port 6379. The migration plan marks this credential as 
      unverified and requires confirmation before implementation.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required to authenticate clients to the Redis server.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
