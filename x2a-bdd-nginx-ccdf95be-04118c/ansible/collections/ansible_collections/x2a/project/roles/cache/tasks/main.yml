---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Redis cache server  # noqa: L038 - eloy.redis.redis is an external role dependency unavailable in this project
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_version: "7.2"
    redis_install_method: package
    redis_port: 6379
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    owner: redis
    group: redis
    mode: "0755"
    state: directory
    recurse: true

- name: Check whether the Redis configuration exists
  ansible.builtin.stat:
    path: /etc/redis/6379.conf
  register: redis_config

- name: Remove unsupported Redis replication directives  # noqa: L039 - redis_config is registered by the preceding stat task
  ansible.builtin.replace:
    path: /etc/redis/6379.conf
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$
    replace: ""
    create: false
  when: redis_config.stat.exists
