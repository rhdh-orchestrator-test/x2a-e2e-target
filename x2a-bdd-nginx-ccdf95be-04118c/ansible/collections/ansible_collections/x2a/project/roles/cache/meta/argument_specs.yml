---
argument_specs:
  main:
    short_description: Install and configure Redis cache services.
    description:
      - Configures a standalone Redis server on TCP port 6379 and prepares its log directory.
      - The Redis authentication password is injected by an AAP credential type.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks that handle the Redis password.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
