# Unsupported: exact database password contents, distribution-dependent PostgreSQL port/socket,
# journal output, exact HTTP status for /, and daemon-reload notification-only behavior.
---
- name: Verify FastAPI tutorial deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert all seven required packages are installed
      ansible.builtin.assert:
        that:
          - "item_package in ansible_facts['packages']"
        fail_msg: A required package is not installed
      loop:
        - python3
        - python3-pip
        - python3-venv
        - git
        - postgresql
        - postgresql-contrib
        - libpq-dev
      loop_control:
        loop_var: item_package

    - name: Inspect application paths
      ansible.builtin.stat:
        path: "{{ item_path }}"
      loop:
        - /opt/fastapi-tutorial
        - /opt/fastapi-tutorial/venv
        - /opt/fastapi-tutorial/requirements.txt
      loop_control:
        loop_var: item_path
      register: application_paths

    - name: Assert application paths exist
      ansible.builtin.assert:
        that:
          - item_path_result.stat.exists
        fail_msg: An expected application path is missing
      loop: "{{ application_paths.results }}"
      loop_control:
        loop_var: item_path_result

    - name: Assert application directory ownership and mode
      ansible.builtin.assert:
        that:
          - application_paths.results[0].stat.isdir
          - application_paths.results[0].stat.pw_name == 'root'
          - application_paths.results[0].stat.gr_name == 'root'
          - application_paths.results[0].stat.mode == '0755'

    - name: Read repository remote
      ansible.builtin.command:
        argv: [git, -C, /opt/fastapi-tutorial, remote, get-url, origin]
      changed_when: false
      register: repository_remote

    - name: Assert repository remote is expected
      ansible.builtin.assert:
        that:
          - repository_remote.stdout | trim == 'https://github.com/dibanez/fastapi_tutorial.git'

    - name: Read checked out repository branch
      ansible.builtin.command:
        argv: [git, -C, /opt/fastapi-tutorial, branch, --show-current]
      changed_when: false
      register: repository_branch

    - name: Assert repository is checked out on main
      ansible.builtin.assert:
        that:
          - repository_branch.stdout | trim == 'main'

    - name: Verify repository HEAD
      ansible.builtin.command:
        argv: [git, -C, /opt/fastapi-tutorial, rev-parse, --verify, HEAD]
      changed_when: false
      register: repository_head

    - name: Assert repository HEAD is valid
      ansible.builtin.assert:
        that:
          - repository_head.rc == 0
          - repository_head.stdout | trim | length > 0

    - name: Check Python and pip in the virtual environment
      ansible.builtin.command:
        argv: "{{ item_runtime['argv'] }}"
      changed_when: false
      loop:
        - name: Python
          argv: [/opt/fastapi-tutorial/venv/bin/python, --version]
        - name: pip
          argv: [/opt/fastapi-tutorial/venv/bin/pip, --version]
      loop_control:
        loop_var: item_runtime
      register: runtime_checks

    - name: Check Python dependency consistency
      ansible.builtin.command:
        argv: [/opt/fastapi-tutorial/venv/bin/pip, check]
      changed_when: false

    - name: Check FastAPI and Uvicorn imports
      ansible.builtin.command:
        argv: "{{ item_import['argv'] }}"
      changed_when: false
      loop:
        - name: FastAPI
          argv: [/opt/fastapi-tutorial/venv/bin/python, -c, "import fastapi; print(fastapi.__version__)"]
        - name: Uvicorn
          argv: [/opt/fastapi-tutorial/venv/bin/python, -c, "import uvicorn; print(uvicorn.__version__)"]
      loop_control:
        loop_var: item_import

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert PostgreSQL is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['postgresql.service']['status'] == 'enabled'
          - ansible_facts['services']['postgresql.service']['state'] == 'running'

    - name: Check PostgreSQL role
      ansible.builtin.command:
        argv: [sudo, -u, postgres, psql, -d, postgres, -tAc, "SELECT 1 FROM pg_roles WHERE rolname = 'fastapi';"]
      changed_when: false
      register: postgres_role

    - name: Assert PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - postgres_role.stdout | trim == '1'

    - name: Check PostgreSQL database owner
      ansible.builtin.command:
        argv: [sudo, -u, postgres, psql, -d, postgres, -tAc, "SELECT datname || ':' || pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'fastapi_db';"]
      changed_when: false
      register: postgres_database

    - name: Assert database exists and is owned by fastapi
      ansible.builtin.assert:
        that:
          - postgres_database.stdout | trim == 'fastapi_db:fastapi'

    - name: Inspect environment file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/.env
      register: application_environment

    - name: Read environment settings
      ansible.builtin.slurp:
        src: /opt/fastapi-tutorial/.env
      register: application_environment_content

    - name: Assert environment file is hardened and configured
      ansible.builtin.assert:
        that:
          - application_environment.stat.exists
          - application_environment.stat.pw_name == 'root'
          - application_environment.stat.gr_name == 'root'
          - application_environment.stat.mode == '0600'
          - "'PROJECT_NAME=\"FastAPI Tutorial\"' in (application_environment_content.content | b64decode)"
          - "'API_VERSION=1.0.0' in (application_environment_content.content | b64decode)"
          - "'DATABASE_URL=postgresql://' in (application_environment_content.content | b64decode)"

    - name: Read FastAPI systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit

    - name: Assert FastAPI systemd unit configuration
      ansible.builtin.assert:
        that:
          - "'After=network.target postgresql.service' in (fastapi_unit.content | b64decode)"
          - "'User=root' in (fastapi_unit.content | b64decode)"
          - "'WorkingDirectory=/opt/fastapi-tutorial' in (fastapi_unit.content | b64decode)"
          - "'Environment=\"PATH=/opt/fastapi-tutorial/venv/bin\"' in (fastapi_unit.content | b64decode)"
          - "'ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000' in (fastapi_unit.content | b64decode)"
          - "'Restart=always' in (fastapi_unit.content | b64decode)"

    - name: Verify systemd unit syntax
      ansible.builtin.command:
        argv: [systemd-analyze, verify, /etc/systemd/system/fastapi-tutorial.service]
      changed_when: false

    - name: Assert FastAPI service is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['fastapi-tutorial.service']['status'] == 'enabled'
          - ansible_facts['services']['fastapi-tutorial.service']['state'] == 'running'

    - name: Verify FastAPI listens on TCP port 8000
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8000
        state: started
        timeout: 10

    - name: Inspect running Uvicorn command
      ansible.builtin.command:
        argv: [ps, -eo, args]
      changed_when: false
      register: uvicorn_processes

    - name: Assert expected Uvicorn command is running
      ansible.builtin.assert:
        that:
          - "'/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000' in uvicorn_processes.stdout"

    - name: Read FastAPI service runtime properties
      ansible.builtin.command:
        argv: [systemctl, show, fastapi-tutorial, -p, Restart, -p, User, -p, WorkingDirectory]
      changed_when: false
      register: fastapi_runtime

    - name: Assert FastAPI service runtime properties
      ansible.builtin.assert:
        that:
          - "'Restart=always' in fastapi_runtime.stdout"
          - "'User=root' in fastapi_runtime.stdout"
          - "'WorkingDirectory=/opt/fastapi-tutorial' in fastapi_runtime.stdout"
