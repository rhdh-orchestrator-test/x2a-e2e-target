# Unsupported pre-flight diagnostics omitted because they do not state an expected outcome:
# certificate subject/issuer/dates, listener discovery and curl responses, service logs, and
# sysctl values. HTTP/HTTPS checks remain conditional because rendered listener configuration
# was not supplied with an expected response.
---
- name: Verify nginx-multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        loop:
          - nginx
          - fail2ban
          - ufw
          - openssl
          - ca-certificates
        loop_control:
          loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban services are active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['nginx.service']['state'] == 'running'
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'

    - name: Check nginx is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - nginx
      register: item_nginx_enabled
      changed_when: false

    - name: Assert nginx is enabled
      ansible.builtin.assert:
        that:
          - item_nginx_enabled['rc'] == 0
          - item_nginx_enabled['stdout'] == 'enabled'

    - name: Check fail2ban is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - fail2ban
      register: item_fail2ban_enabled
      changed_when: false

    - name: Assert fail2ban is enabled
      ansible.builtin.assert:
        that:
          - item_fail2ban_enabled['rc'] == 0
          - item_fail2ban_enabled['stdout'] == 'enabled'

    - name: Validate the nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_config_test
      changed_when: false

    - name: Assert the nginx configuration is valid
      ansible.builtin.assert:
        that:
          - item_nginx_config_test['rc'] == 0

    - name: Validate the SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      register: item_sshd_config_test
      changed_when: false

    - name: Assert the SSH configuration is valid
      ansible.builtin.assert:
        that:
          - item_sshd_config_test['rc'] == 0

    - name: Check UFW status and policy
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: item_ufw_status
      changed_when: false

    - name: Assert UFW is active with the expected policy and allowed ports
      ansible.builtin.assert:
        that:
          - item_ufw_status['rc'] == 0
          - item_ufw_status['stdout'] is search('Status: active')
          - item_ufw_status['stdout'] is search('Default: deny \(incoming\)')
          - item_ufw_status['stdout'] is search('22/tcp')
          - item_ufw_status['stdout'] is search('80/tcp')
          - item_ufw_status['stdout'] is search('443/tcp')

    - name: Check configured Fail2ban jails
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
      register: item_fail2ban_status
      changed_when: false

    - name: Assert Fail2ban loads its configured jails
      ansible.builtin.assert:
        that:
          - item_fail2ban_status['rc'] == 0

    - name: Check required configuration and content paths
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      loop:
        - path: /etc/fail2ban/jail.local
        - path: /etc/sysctl.d/99-security.conf
        - path: /etc/nginx/nginx.conf
        - path: /etc/nginx/conf.d/security.conf
        - path: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-available/status.cluster.local
        - path: /opt/server/test
        - path: /opt/server/test/index.html
        - path: /opt/server/ci
        - path: /opt/server/ci/index.html
        - path: /opt/server/status
        - path: /opt/server/status/index.html
        - path: /etc/ssl/certs/test.cluster.local.crt
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/certs/ci.cluster.local.crt
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/certs/status.cluster.local.crt
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_path
      register: item_required_paths

    - name: Assert required configuration and content paths exist
      ansible.builtin.assert:
        that:
          - item_required_path['stat']['exists']
        loop: "{{ item_required_paths['results'] }}"
        loop_control:
          loop_var: item_required_path

    - name: Check enabled nginx site links
      ansible.builtin.stat:
        path: "{{ item_site_link['path'] }}"
        follow: false
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_site_link
      register: item_enabled_site_links

    - name: Assert enabled nginx site links are symbolic links
      ansible.builtin.assert:
        that:
          - item_enabled_site_link['stat']['islnk'] | default(false)
        loop: "{{ item_enabled_site_links['results'] }}"
        loop_control:
          loop_var: item_enabled_site_link

    - name: Check the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
        follow: false
      register: item_default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_site['stat']['exists']

    - name: Check TLS private-key ownership and permissions
      ansible.builtin.stat:
        path: "{{ item_tls_key['path'] }}"
        follow: false
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_tls_key
      register: item_tls_key_stats

    - name: Assert TLS private-key ownership and permissions
      ansible.builtin.assert:
        that:
          - item_tls_key_stat['stat']['mode'] == '0640'
          - item_tls_key_stat['stat']['pw_name'] == 'root'
          - item_tls_key_stat['stat']['gr_name'] == 'ssl-cert'
        loop: "{{ item_tls_key_stats['results'] }}"
        loop_control:
          loop_var: item_tls_key_stat

    - name: Check SSH hardening settings
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - '^[[:space:]]*PermitRootLogin'
          - /etc/ssh/sshd_config
      register: item_root_login_setting
      changed_when: false

    - name: Check SSH password authentication setting
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - '^[[:space:]]*PasswordAuthentication'
          - /etc/ssh/sshd_config
      register: item_password_auth_setting
      changed_when: false

    - name: Assert SSH hardening settings
      ansible.builtin.assert:
        that:
          - item_root_login_setting['rc'] == 0
          - item_root_login_setting['stdout'] is search('PermitRootLogin[[:space:]]+no')
          - item_password_auth_setting['rc'] == 0
          - item_password_auth_setting['stdout'] is search('PasswordAuthentication[[:space:]]+no')
