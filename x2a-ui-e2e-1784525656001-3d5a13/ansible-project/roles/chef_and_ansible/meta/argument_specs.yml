---
argument_specs:
  main:
    short_description: Role for configuring Apache web server with HTTPS support and SSL security hardening
    description:
      - This role installs and configures Apache web server with HTTPS support
      - Sets up a self-signed certificate
      - Deploys a simple Hello World website
      - Hardens SSL/TLS configuration (disables SSLv3, enables TLSv1.2)
    options:
      conftext:
        type: str
        description: Apache virtual host configuration for HTTPS
        default: "<VirtualHost *:443>\n DocumentRoot \"/var/www/helloworld\"\n SSLEngine on\n SSLCertificateFile /etc/apache2/certs/apache.crt\n SSLCertificateKeyFile
          /etc/apache2/certs/apache.key\n  <Directory \"/var/www/helloworld\">\n    allow from all\n    Options None\n    Require all granted\n  </Directory>\n</VirtualHost>\n"
      webtext:
        type: str
        description: HTML content for the Hello World website
        default: "<html>\n  <head><title>Test Site</title>/head>\n  <body>\n   <h1>Hello, world!</h1>\n   <p>The site is up and running</p>\n  </body>\n</html>"
