---
- name: Render Nginx virtual host configurations # noqa: R114 - paths come from the role-defined sites dictionary
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_site['key'] }} # noqa: R114 - path from role-defined sites dictionary
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Validate and reload nginx
  vars:
    server_name: "{{ item_site['key'] }}"
    document_root: "{{ item_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_site['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_certificate_path }}/{{ item_site['key'] }}.crt"
    key_file: "{{ nginx_multisite_private_key_path }}/{{ item_site['key'] }}.key"

- name: Enable Nginx virtual host configurations # noqa: R114 - paths come from the role-defined sites dictionary
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_site['key'] }} # noqa: R114 - source from role-defined site names
    dest: /etc/nginx/sites-enabled/{{ item_site['key'] }} # noqa: R114 - path from role-defined sites dictionary
    state: link
    force: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Validate and reload nginx

- name: Remove the default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Validate and reload nginx
