---
argument_specs:
  main:
    short_description: Deploy FastAPI tutorial application with PostgreSQL backend
    description:
      - Installs and configures a FastAPI tutorial web application
      - Sets up Python virtual environment and dependencies
      - Configures PostgreSQL database with dedicated user and database
      - Deploys the application as a systemd service
    options:
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Directory where the FastAPI application will be installed
      fastapi_tutorial_repo_url:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the FastAPI tutorial application
      fastapi_tutorial_repo_version:
        type: str
        required: false
        default: main
        description: Git branch or tag to checkout
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Name of the systemd service
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name used in environment configuration
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version used in environment configuration
      fastapi_tutorial_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Host address the FastAPI application binds to
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: Port number the FastAPI application listens on
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: User account that runs the FastAPI service
      fastapi_tutorial_service_group:
        type: str
        required: false
        default: root
        description: Group that runs the FastAPI service
      fastapi_tutorial_system_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - python3-psycopg2
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
        description: List of system packages required for the application
      db_username:
        type: str
        required: true
        description: PostgreSQL database username (injected by AAP credential type)
      db_password:
        type: str
        required: true
        description: PostgreSQL database password (injected by AAP credential type)
      db_host:
        type: str
        required: true
        description: PostgreSQL database host (injected by AAP credential type)
      db_name:
        type: str
        required: true
        description: PostgreSQL database name (injected by AAP credential type)
