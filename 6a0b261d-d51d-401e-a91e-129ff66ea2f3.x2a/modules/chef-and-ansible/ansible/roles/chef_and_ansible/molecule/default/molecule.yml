dependency:
  name: galaxy
driver:
  name: vagrant
platforms:
- name: ubuntu-2004
  box: ubuntu/focal64
  memory: 512
  cpus: 1
provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
  inventory:
    host_vars:
      ubuntu-2004:
        ansible_host: ubuntu-2004
verifier:
  name: ansible
scenario:
  name: default
  test_sequence:
  - dependency
  - lint
  - cleanup
  - destroy
  - syntax
  - create
  - prepare
  - converge
  - idempotence
  - verify
  - cleanup
  - destroy
