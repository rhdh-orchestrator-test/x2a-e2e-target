---
- name: Ensure directory exists for PEM files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_server_user_key_path }}"
    - "{{ chef_server_org_key_path }}"
  when: item | dirname != '.'
- name: Create Chef Server user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ chef_server_user_key_path }}

      '
  become: true
  register: user_create_result
  changed_when: user_create_result.rc == 0
  failed_when: user_create_result.rc != 0
  args:
    creates: "{{ chef_server_user_key_path }}"
- name: Create Chef Server organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_server_org_name }} "{{ chef_server_org_long_name }}" --association_user {{ username }} --filename {{ chef_server_org_key_path
      }}

      '
  become: true
  register: org_create_result
  changed_when: org_create_result.rc == 0
  failed_when: org_create_result.rc != 0
  args:
    creates: "{{ chef_server_org_key_path }}"
