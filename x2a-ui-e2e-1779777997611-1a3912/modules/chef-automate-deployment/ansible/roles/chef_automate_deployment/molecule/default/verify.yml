- name: Verify
  hosts: all
  gather_facts: true
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl parameters file
    ansible.builtin.stat:
      path: /tmp/molecule_test/sysctl_params
    register: sysctl_file
  - name: Assert sysctl file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Sysctl parameters file not found
      success_msg: Sysctl parameters file exists
  - name: Get sysctl content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/sysctl_params
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl parameters are set correctly
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: Sysctl parameters not set correctly
      success_msg: Sysctl parameters set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI file exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI file not found or not executable
      success_msg: Chef Automate CLI file exists and is executable
  - name: Check Chef Automate config file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: chef_automate_config
  - name: Assert Chef Automate config file exists
    ansible.builtin.assert:
      that:
      - chef_automate_config.stat.exists
      - chef_automate_config.stat.size > 0
      fail_msg: Chef Automate config file not found
      success_msg: Chef Automate config file exists
  - name: Check Chef Server config file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/opscode/chef-server.rb
    register: chef_server_config
  - name: Assert Chef Server config file exists
    ansible.builtin.assert:
      that:
      - chef_server_config.stat.exists
      - chef_server_config.stat.size > 0
      fail_msg: Chef Server config file not found
      success_msg: Chef Server config file exists
  - name: Check user PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_pem
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.size > 0
      - user_pem.stat.mode == "0600"
      fail_msg: User PEM file not found or incorrect permissions
      success_msg: User PEM file exists with correct permissions
  - name: Check organization validator PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_pem
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_pem.stat.exists
      - org_pem.stat.size > 0
      - org_pem.stat.mode == "0600"
      fail_msg: Organization validator PEM file not found or incorrect permissions
      success_msg: Organization validator PEM file exists with correct permissions
  - name: Check Chef Automate service status
    ansible.builtin.command:
      cmd: chef-automate status
    register: chef_automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - chef_automate_status.rc == 0
      fail_msg: Chef Automate service is not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check Chef Server service status
    ansible.builtin.command:
      cmd: chef-server-ctl status
    register: chef_server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Server service is running
    ansible.builtin.assert:
      that:
      - chef_server_status.rc == 0
      fail_msg: Chef Server service is not running
      success_msg: Chef Server service is running
    tags: molecule-notest
  - name: Check Chef Automate API
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
    register: chef_automate_api
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate API is accessible
    ansible.builtin.assert:
      that:
      - chef_automate_api.status == 200
      fail_msg: Chef Automate API is not accessible
      success_msg: Chef Automate API is accessible
    tags: molecule-notest
  - name: Check Chef Server API
    ansible.builtin.uri:
      url: https://localhost/organizations/lab
      validate_certs: false
    register: chef_server_api
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Server API is accessible
    ansible.builtin.assert:
      that:
      - chef_server_api.status == 200
      fail_msg: Chef Server API is not accessible
      success_msg: Chef Server API is accessible
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is succeeded
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
