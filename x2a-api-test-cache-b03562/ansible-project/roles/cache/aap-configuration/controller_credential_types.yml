---
controller_credential_types:
- name: Redis Authentication Password
  description: Redis server authentication credential configured via redisio cookbook
  kind: cloud
  inputs:
    fields:
    - id: redis_password
      type: string
      label: Redis Password
      secret: true
      help_text: Authentication password for Redis client connections
    required:
    - redis_password
  injectors:
    extra_vars:
      redis_password: !unsafe '{{ redis_password }}'
