---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install cache packages
  ansible.builtin.package:
    name:
      - "{{ cache_redis_package }}"
      - "{{ cache_memcached_package }}"
    state: present

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path comes from role defaults
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    recurse: true

- name: Ensure Redis configuration has authentication
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path comes from role defaults
    regexp: ^requirepass\s+
    line: requirepass {{ cache_redis_password }}
    create: true
    mode: "0640"
  no_log: "{{ cache_secure_logging }}"
  notify: Restart Redis after configuration changes

- name: Remove unsupported Redis replication directives
  ansible.builtin.replace:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path comes from role defaults
    regexp: (?m)^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$\ ?
    replace: ""
  notify: Restart Redis after configuration changes

- name: Install Redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    enabled: true
    state: started

- name: Install Memcached service
  ansible.builtin.service:
    name: "{{ cache_memcached_service }}"
    enabled: true
    state: started
