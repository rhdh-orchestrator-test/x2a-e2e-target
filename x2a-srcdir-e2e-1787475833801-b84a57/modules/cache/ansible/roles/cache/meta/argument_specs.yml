---
argument_specs:
  main:
    short_description: Simple cache role that installs and configures Redis server
    description:
      - Installs Redis server as a simple caching solution
      - Enables and starts the Redis service with default configuration
    options:
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Redis server package name to install
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Redis server service name to enable and start
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port the Redis server listens on
      cache_redis_bind:
        type: str
        required: false
        default: 127.0.0.1
        description: IP address the Redis server binds to
