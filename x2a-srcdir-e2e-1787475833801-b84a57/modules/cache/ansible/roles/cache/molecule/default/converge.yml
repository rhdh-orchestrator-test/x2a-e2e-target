- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/run/redis
  - name: Create mock Redis configuration file
    ansible.builtin.copy:
      content: '# Redis configuration file


        # Accept connections on the specified port

        port 6379


        # Bind to the specified IP address

        bind 127.0.0.1


        # Specify the path for the Unix socket

        unixsocket /var/run/redis/redis-server.sock

        unixsocketperm 700


        # Specify the log file name

        logfile /var/log/redis/redis-server.log


        # The working directory

        dir /var/lib/redis


        # Run as a daemon

        daemonize yes

        '
      dest: /tmp/molecule_test/etc/redis/redis.conf
      mode: '0644'
  - name: Create mock Redis log file
    ansible.builtin.copy:
      content: '1:M 01 Jan 2023 00:00:00.000 # Server initialized

        1:M 01 Jan 2023 00:00:00.000 * Ready to accept connections

        '
      dest: /tmp/molecule_test/var/log/redis/redis-server.log
      mode: '0644'
  - name: Create mock Redis socket directory
    ansible.builtin.file:
      path: /tmp/molecule_test/var/run/redis
      state: directory
      mode: '0755'
  - name: Create mock Redis socket file
    ansible.builtin.copy:
      content: ''
      dest: /tmp/molecule_test/var/run/redis/redis-server.sock
      mode: '0644'
