fastapi_tutorial_git_version: main
fastapi_tutorial_venv_path: "{{ fastapi_tutorial_app_dir }}/venv"
fastapi_tutorial_system_packages:
  - python3
  - python3-pip
  - python3-venv
  - git
  - postgresql
  - postgresql-contrib
  - python3-psycopg2
