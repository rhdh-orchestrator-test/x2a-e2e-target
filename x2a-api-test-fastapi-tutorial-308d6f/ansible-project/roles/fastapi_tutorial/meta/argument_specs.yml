---
argument_specs:
  main:
    short_description: Configures FastAPI tutorial application with PostgreSQL
    description:
      - Deploys a FastAPI tutorial application with PostgreSQL database backend.
      - Installs system dependencies, clones the application from GitHub, sets up a Python virtual environment.
      - Configures PostgreSQL with a dedicated database and user, and runs the FastAPI application as a systemd service.
    options:
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Name of the FastAPI project displayed in the application.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: Version of the API to be set in environment configuration.
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Directory where the FastAPI application will be installed.
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: System user that will run the FastAPI service.
      fastapi_tutorial_bind_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Host address the FastAPI application will bind to.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port the FastAPI application will listen on.
      fastapi_tutorial_git_repo:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the FastAPI tutorial application.
      fastapi_tutorial_git_version:
        type: str
        required: false
        default: main
        description: Git branch or tag to checkout from the repository.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: "{{ fastapi_tutorial_app_dir }}/venv"
        description: Path where the Python virtual environment will be created.
      fastapi_tutorial_system_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        description: List of system packages required for the FastAPI application.
      db_username:
        type: str
        required: true
        description: Database username injected by AAP credential type.
      db_password:
        type: str
        required: true
        description: Database password injected by AAP credential type.
      db_host:
        type: str
        required: true
        description: Database host injected by AAP credential type.
      db_port:
        type: str
        required: true
        description: Database port injected by AAP credential type.
      db_name:
        type: str
        required: true
        description: Database name injected by AAP credential type.
