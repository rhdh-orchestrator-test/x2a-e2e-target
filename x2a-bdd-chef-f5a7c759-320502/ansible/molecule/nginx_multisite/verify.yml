---
# Unsupported pre-flight checks: dynamic site checks (site inventory was not supplied),
# log-tail diagnostics, configuration-content grep diagnostics, and conditional HTTPS
# listener/site curl checks have no safely determined expectations for this scenario.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Collect installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - ansible_facts.packages['nginx'] is defined
          - ansible_facts.packages['fail2ban'] is defined
          - ansible_facts.packages['ufw'] is defined
          - ansible_facts.packages['openssl'] is defined
          - ansible_facts.packages['ca-certificates'] is defined
        fail_msg: One or more required packages are not installed.

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['nginx.service']['state'] == 'running'
          - ansible_facts.services['fail2ban.service']['state'] == 'running'
        fail_msg: nginx and fail2ban must be active.

    - name: Assert an SSH service is active
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts.services['sshd.service'] is defined and
            ansible_facts.services['sshd.service']['state'] == 'running') or
            (ansible_facts.services['ssh.service'] is defined and
            ansible_facts.services['ssh.service']['state'] == 'running')
        fail_msg: An SSH service must be active.

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_config_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - item_nginx_config_test.rc == 0
          - "'syntax is ok' in item_nginx_config_test.stderr"
          - "'test is successful' in item_nginx_config_test.stderr"
        fail_msg: nginx configuration validation failed.

    - name: Collect fail2ban overall status
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
      register: item_fail2ban_status
      changed_when: false

    - name: Collect fail2ban SSH jail status
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
          - sshd
      register: item_fail2ban_sshd_status
      changed_when: false

    - name: Assert fail2ban status commands succeed
      ansible.builtin.assert:
        that:
          - item_fail2ban_status.rc == 0
          - item_fail2ban_sshd_status.rc == 0
        fail_msg: fail2ban status checks failed.

    - name: Collect firewall status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: item_ufw_status
      changed_when: false

    - name: Assert UFW is active with required rules
      ansible.builtin.assert:
        that:
          - item_ufw_status.rc == 0
          - "'Status: active' in item_ufw_status.stdout"
          - "'Default: deny (incoming)' in item_ufw_status.stdout"
          - item_ufw_status.stdout is search('22/tcp\\s+ALLOW')
          - item_ufw_status.stdout is search('80/tcp\\s+ALLOW')
          - item_ufw_status.stdout is search('443/tcp\\s+ALLOW')
        fail_msg: UFW is not active with the required default and port rules.

    - name: Read kernel security settings
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - "{{ item_sysctl['key'] }}"
      loop:
        - key: net.ipv4.conf.all.rp_filter
          value: '1'
        - key: net.ipv4.conf.all.accept_redirects
          value: '0'
        - key: net.ipv4.icmp_echo_ignore_all
          value: '1'
        - key: net.ipv6.conf.all.disable_ipv6
          value: '1'
        - key: net.ipv4.tcp_syncookies
          value: '1'
      loop_control:
        loop_var: item_sysctl
      register: item_sysctl_results
      changed_when: false

    - name: Assert kernel security settings
      ansible.builtin.assert:
        that:
          - item_sysctl_result.stdout | trim == item_sysctl_result.item['value']
        fail_msg: A required kernel security setting has an unexpected value.
      loop: "{{ item_sysctl_results.results }}"
      loop_control:
        loop_var: item_sysctl_result

    - name: Read SSH hardening settings
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - '^(PermitRootLogin|PasswordAuthentication)'
          - /etc/ssh/sshd_config
      register: item_ssh_hardening
      changed_when: false

    - name: Assert SSH hardening settings
      ansible.builtin.assert:
        that:
          - item_ssh_hardening.rc == 0
          - item_ssh_hardening.stdout is search('^PermitRootLogin\\s+no', multiline=True)
          - item_ssh_hardening.stdout is search('^PasswordAuthentication\\s+no', multiline=True)
        fail_msg: SSH root-login and password-authentication settings are not hardened.

    - name: Inspect nginx secret directory metadata
      ansible.builtin.stat:
        path: /etc/nginx/secrets
      register: item_secret_directory

    - name: Inspect nginx site token metadata
      ansible.builtin.stat:
        path: /etc/nginx/secrets/site_token
      register: item_site_token

    - name: Assert secret file metadata and non-empty token
      ansible.builtin.assert:
        that:
          - item_secret_directory.stat.exists
          - item_secret_directory.stat.pw_name == 'root'
          - item_secret_directory.stat.gr_name == 'root'
          - item_secret_directory.stat.mode == '0700'
          - item_site_token.stat.exists
          - item_site_token.stat.pw_name == 'root'
          - item_site_token.stat.gr_name == 'root'
          - item_site_token.stat.mode == '0600'
          - item_site_token.stat.size > 0
        fail_msg: nginx secret paths do not have the expected metadata.

    - name: Check nginx HTTP listener
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: item_listener_status
      changed_when: false

    - name: Assert nginx listens on TCP port 80
      ansible.builtin.assert:
        that:
          - item_listener_status.rc == 0
          - item_listener_status.stdout is search(':80\\s')
        fail_msg: nginx is not listening on TCP port 80.

    - name: Check default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_site

    - name: Assert default nginx site is removed
      ansible.builtin.assert:
        that:
          - not item_default_site.stat.exists
        fail_msg: The default nginx site must not exist.
