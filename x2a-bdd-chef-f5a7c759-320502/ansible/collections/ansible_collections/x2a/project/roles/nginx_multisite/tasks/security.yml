---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Configure fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Set UFW default incoming policy
  ansible.builtin.command:
    cmd: ufw --force default deny
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Default incoming policy changed' in nginx_multisite_ufw_default.stdout"
  register: nginx_multisite_ufw_default

- name: Allow required UFW ports # noqa: R101 - port values come from a fixed role loop, not user input
  ansible.builtin.command:
    cmd: ufw allow {{ item_ufw_port }}
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Rule added' in nginx_multisite_ufw_allow.stdout"
  loop:
    - ssh
    - http
    - https
  loop_control:
    loop_var: item_ufw_port
  register: nginx_multisite_ufw_allow

- name: Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Firewall is active' in nginx_multisite_ufw_enable.stdout"
  register: nginx_multisite_ufw_enable

- name: Configure kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Check whether the SSH daemon configuration exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable root SSH login # noqa: L039 - nginx_multisite_sshd_config is registered by the preceding task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    state: present
    create: false
    backup: true
  when:
    - nginx_multisite_disable_root
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd

- name: Configure SSH password authentication # noqa: L039 - nginx_multisite_sshd_config is registered by the preceding task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    state: present
    create: false
    backup: true
  when:
    - not nginx_multisite_password_auth
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd
