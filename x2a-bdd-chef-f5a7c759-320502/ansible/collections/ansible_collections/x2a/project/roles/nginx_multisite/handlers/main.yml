---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload security sysctl
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.rp_filter
    value: "1"
    sysctl_file: /etc/sysctl.d/99-security.conf
    reload: true
    state: present

- name: Restart sshd # noqa: L039 - service name comes from role parameters with a platform-specific fallback
  ansible.builtin.service:
    name: "{{ nginx_multisite_ssh_service_name | default('ssh' if ansible_facts.os_family == 'Debian' else 'sshd') }}"
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
