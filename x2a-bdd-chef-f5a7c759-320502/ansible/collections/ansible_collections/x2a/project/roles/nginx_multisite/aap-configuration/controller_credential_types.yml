---
controller_credential_types:
  - name: Chef Encrypted Data Bag Nginx Site Token
    description: Secret token loaded from the Chef encrypted data bag item nginx_secrets/site and deployed for Nginx use.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Site Token
          secret: true
          help_text: Secret token written to /etc/nginx/secrets/site_token with restrictive permissions.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
