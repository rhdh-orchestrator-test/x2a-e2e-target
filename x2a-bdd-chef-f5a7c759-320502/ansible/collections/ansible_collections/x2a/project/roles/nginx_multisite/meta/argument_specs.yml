---
argument_specs:
  main:
    short_description: Install and configure nginx for multiple virtual hosts
    description:
      - Installs nginx and supporting security services.
      - Configures dynamic virtual hosts, optional self-signed TLS, firewall rules, and system hardening.
    options:
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for site certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW is enabled and configured.
      nginx_multisite_disable_root:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output when handling the site token secret.
      nginx_multisite_sites:
        type: dict
        required: false
        default: {}
        description: Site definitions keyed by site name.
