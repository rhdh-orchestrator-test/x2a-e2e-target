---
# User-facing application settings.
fastapi_app_path: /opt/fastapi-tutorial
fastapi_repository: https://github.com/dibanez/fastapi_tutorial.git
fastapi_revision: main
fastapi_service_name: fastapi-tutorial
fastapi_service_port: 8000
fastapi_database_name: "{{ database_name }}"
fastapi_database_user: "{{ database_user }}"
fastapi_database_host: "{{ database_host }}"
fastapi_database_port: "{{ database_port }}"
fastapi_database_password: "{{ database_password }}"
fastapi_secure_logging: true
fastapi_project_name: FastAPI Tutorial
fastapi_api_version: v1
