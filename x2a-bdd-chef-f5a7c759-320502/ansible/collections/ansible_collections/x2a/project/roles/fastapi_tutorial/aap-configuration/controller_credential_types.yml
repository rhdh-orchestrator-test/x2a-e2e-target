---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: PostgreSQL credentials used by the FastAPI application and for provisioning the application database role.
    kind: cloud
    inputs:
      fields:
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname of the PostgreSQL server.
        - id: database_port
          type: string
          label: Database Port
          help_text: PostgreSQL listener port, normally 5432.
        - id: database_name
          type: string
          label: Database Name
          help_text: Application database name.
        - id: database_user
          type: string
          label: Database User
          help_text: PostgreSQL role used by the FastAPI application.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL application role; replace the hardcoded value and store it securely in AAP or Ansible Vault.
      required:
        - database_host
        - database_port
        - database_name
        - database_user
        - database_password
    injectors:
      extra_vars:
        database_host: !unsafe "{{ database_host }}"
        database_port: !unsafe "{{ database_port }}"
        database_name: !unsafe "{{ database_name }}"
        database_user: !unsafe "{{ database_user }}"
        database_password: !unsafe "{{ database_password }}"
