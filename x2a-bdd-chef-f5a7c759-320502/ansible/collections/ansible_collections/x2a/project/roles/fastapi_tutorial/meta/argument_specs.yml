---
argument_specs:
  main:
    short_description: Configures FastAPI tutorial application with PostgreSQL
    description:
      - Deploys the FastAPI tutorial application and its PostgreSQL database dependency.
    options:
      fastapi_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Filesystem path where the application is deployed.
      fastapi_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name for the application.
      fastapi_service_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which the application listens.
      fastapi_database_name:
        type: str
        required: false
        default: "{{ database_name }}"
        description: PostgreSQL database name from the AAP credential.
      fastapi_database_user:
        type: str
        required: false
        default: "{{ database_user }}"
        description: PostgreSQL role used by the application from the AAP credential.
      fastapi_database_host:
        type: str
        required: false
        default: "{{ database_host }}"
        description: PostgreSQL server hostname from the AAP credential.
      fastapi_database_port:
        type: str
        required: false
        default: "{{ database_port }}"
        description: PostgreSQL server port from the AAP credential.
      fastapi_database_password:
        type: str
        required: false
        default: "{{ database_password }}"
        description: PostgreSQL password from the AAP credential.
      fastapi_secure_logging:
        type: bool
        required: false
        default: true
        description: Hides task output when handling the database password.
      fastapi_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name written to the application environment.
      fastapi_api_version:
        type: str
        required: false
        default: v1
        description: API version written to the application environment.
