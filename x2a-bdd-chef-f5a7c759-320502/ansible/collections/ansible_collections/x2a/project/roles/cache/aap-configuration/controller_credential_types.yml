---
controller_credential_types:
  - name: Redis Authentication
    description: Authentication password for the Redis server listening on port 6379. The migration plan identifies this as a hardcoded Chef credential that 
      must be rotated and stored in Ansible Vault or an AAP secret-management integration.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required to authenticate clients to the Redis server on port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
