---
controller_credentials:
- name: Chef User Credentials - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    email: '{{ email }}'
    full_name: '{{ full_name }}'
    organization_name: '{{ organization_name }}'
    organization_full_name: '{{ organization_full_name }}'
