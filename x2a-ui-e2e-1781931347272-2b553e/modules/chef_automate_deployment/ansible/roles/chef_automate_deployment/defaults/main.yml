---
chef_automate_hostname: automate.chef.lab
chef_automate_vm_max_map_count: 262144
chef_automate_vm_dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: "{{ ansible_env.PWD }}/chef-automate"
chef_automate_accept_terms_and_mlsa: true
chef_automate_products:
  - automate
  - infra-server
chef_automate_user_pem_file: "{{ username }}.pem"
chef_automate_org_validator_pem_file: "{{ organization_name }}-validator.pem"
chef_automate_deploy_with_automate: true
