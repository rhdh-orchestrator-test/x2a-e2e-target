---
controller_credential_types:
- name: Chef Admin User
  description: Credential type for Chef Admin User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Admin Username
      help_text: Username for the initial admin user for Chef Automate and Chef Infra
        Server
    - id: password
      type: string
      label: Admin Password
      secret: true
      help_text: Password for the initial admin user for Chef Automate and Chef Infra
        Server
    - id: first_name
      type: string
      label: First Name
      help_text: First name of the admin user
    - id: last_name
      type: string
      label: Last Name
      help_text: Last name of the admin user
    - id: email
      type: string
      label: Email Address
      help_text: Email address of the admin user
    - id: organization_name
      type: string
      label: Organization Name
      help_text: Name of the organization to create in Chef Infra Server
    - id: organization_full_name
      type: string
      label: Organization Full Name
      help_text: Full name of the organization to create in Chef Infra Server
    required:
    - username
    - password
    - organization_name
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      first_name: !unsafe '{{ first_name }}'
      last_name: !unsafe '{{ last_name }}'
      email: !unsafe '{{ email }}'
      organization_name: !unsafe '{{ organization_name }}'
      organization_full_name: !unsafe '{{ organization_full_name }}'
