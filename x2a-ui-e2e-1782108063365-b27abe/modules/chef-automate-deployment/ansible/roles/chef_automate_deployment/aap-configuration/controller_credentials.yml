---
controller_credentials:
- name: Chef Admin User - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Admin User
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    first_name: '{{ first_name }}'
    last_name: '{{ last_name }}'
    email: '{{ email }}'
    organization_name: '{{ organization_name }}'
    organization_full_name: '{{ organization_full_name }}'
