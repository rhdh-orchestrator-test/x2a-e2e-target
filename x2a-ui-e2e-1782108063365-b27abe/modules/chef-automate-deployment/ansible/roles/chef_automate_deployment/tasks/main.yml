---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Configure system for Chef Automate
  ansible.builtin.include_tasks: configure_system.yml
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.include_tasks: deploy_automate.yml
  when: chef_automate_products | join(',') is search('automate')
- name: Deploy Chef Infra Server only
  ansible.builtin.include_tasks: deploy_chef_server.yml
  when: not (chef_automate_products | join(',') is search('automate')) and chef_automate_products | join(',') is search('infra-server')
- name: Create Chef Infra Server users and organizations
  ansible.builtin.include_tasks: create_users.yml
  when: chef_automate_products | join(',') is search('infra-server')
