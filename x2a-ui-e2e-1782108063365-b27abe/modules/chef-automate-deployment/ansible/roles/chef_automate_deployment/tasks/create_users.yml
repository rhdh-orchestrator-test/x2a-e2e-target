---
- name: Create Chef Infra Server admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username | default(chef_automate_default_username) }} "{{ first_name | default(chef_automate_default_first_name) }}" "{{
      last_name | default(chef_automate_default_last_name) }}" {{ email | default(chef_automate_default_email) }} "{{ password }}" --filename {{ chef_automate_user_key_path
      }}

      '
  become: true
  args:
    creates: "{{ chef_automate_user_key_path }}"
  register: user_create_result
  changed_when: user_create_result.rc == 0
  no_log: true
  tags: molecule-notest
- name: Create Chef Infra Server organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ organization_name | default(chef_automate_default_organization) }} "{{ organization_full_name | default(chef_automate_default_organization_full_name)
      }}" --association_user {{ username | default(chef_automate_default_username) }} --filename {{ chef_automate_org_key_path }}

      '
  become: true
  args:
    creates: "{{ chef_automate_org_key_path }}"
  register: org_create_result
  changed_when: org_create_result.rc == 0
  tags: molecule-notest
