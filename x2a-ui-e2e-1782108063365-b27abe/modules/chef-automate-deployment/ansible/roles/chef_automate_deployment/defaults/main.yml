---
chef_automate_hostname: automate.chef.lab
chef_automate_sysctl_settings:
  - name: vm.max_map_count
    value: "262144"
  - name: vm.dirty_expire_centisecs
    value: "20000"
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: ./chef-automate
chef_automate_accept_terms: true
chef_automate_products:
  - automate
  - infra-server
chef_automate_default_username: admin
chef_automate_default_first_name: Admin
chef_automate_default_last_name: User
chef_automate_default_email: admin@example.com
chef_automate_default_organization: default
chef_automate_default_organization_full_name: Default Organization
chef_automate_user_key_path: "{{ username | default(chef_automate_default_username) }}.pem"
chef_automate_org_key_path: "{{ organization_name | default(chef_automate_default_organization) }}-validator.pem"
