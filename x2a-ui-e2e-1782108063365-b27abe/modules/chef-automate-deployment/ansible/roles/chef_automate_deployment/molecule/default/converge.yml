- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create parent directories
    ansible.builtin.file:
      path: /tmp/molecule_test
      state: directory
      mode: '0755'
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/chef-server
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/chef
    - /tmp/molecule_test/proc/sys/vm
  - name: Create mock Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        echo "Version: 20230101000000"

        '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create mock Chef Automate config
    ansible.builtin.copy:
      content: '# Mock Chef Automate config file

        [global]

        fqdn = "automate.chef.lab"

        '
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create mock Chef Server config
    ansible.builtin.copy:
      content: '# Mock Chef Server config file

        nginx[''server_name''] = "automate.chef.lab"

        nginx[''ssl_certificate''] = "/var/opt/chef/ssl/certs/automate.chef.lab.crt"

        nginx[''ssl_certificate_key''] = "/var/opt/chef/ssl/private/automate.chef.lab.key"

        '
      dest: /tmp/molecule_test/etc/chef-server/chef-server.rb
      mode: '0644'
  - name: Create mock user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAv8MoCMJLH9SCPNzYO/1SoEp5mQjt3ysG752FOol3k98Lm3Qa

        MOCK_KEY_CONTENT_FOR_TESTING_ONLY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/admin.pem
      mode: '0600'
  - name: Create mock organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAv8MoCMJLH9SCPNzYO/1SoEp5mQjt3ysG752FOol3k98Lm3Qa

        MOCK_KEY_CONTENT_FOR_TESTING_ONLY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/default-validator.pem
      mode: '0600'
  - name: Create mock sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/proc/sys/vm/settings
      mode: '0644'
  - name: Create mock hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create mock Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: automate-postgresql

        Status: running


        Service: automate-elasticsearch

        Status: running


        Service: automate-nginx

        Status: running

        '
      dest: /tmp/molecule_test/var/opt/chef-automate/status
      mode: '0644'
  - name: Create mock Chef Server status file
    ansible.builtin.copy:
      content: 'run: postgresql: (pid 12345) 300s; run: log: (pid 12346) 300s

        run: nginx: (pid 12347) 300s; run: log: (pid 12348) 300s

        run: bookshelf: (pid 12349) 300s; run: log: (pid 12350) 300s

        '
      dest: /tmp/molecule_test/var/opt/chef/status
      mode: '0644'
  - name: Create mock user list file
    ansible.builtin.copy:
      content: admin
      dest: /tmp/molecule_test/var/opt/chef/users
      mode: '0644'
  - name: Create mock organization list file
    ansible.builtin.copy:
      content: default
      dest: /tmp/molecule_test/var/opt/chef/organizations
      mode: '0644'
