---
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: apache2
    state: present
- name: Check current SSL configuration
  ansible.builtin.command: grep -q "SSLProtocol -all +TLSv1.2" /etc/apache2/mods-available/ssl.conf
  register: ssl_config_check
  changed_when: false
  failed_when: false
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: /etc/apache2/mods-available/ssl.conf
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol -all +TLSv1.2
  notify:
    - Restart apache2
  when: ssl_config_check.rc != 0
