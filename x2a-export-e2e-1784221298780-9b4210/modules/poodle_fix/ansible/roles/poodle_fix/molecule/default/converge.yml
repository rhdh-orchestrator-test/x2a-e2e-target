- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache config
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/apache2/mods-available
  - name: Create mock Apache SSL config file with vulnerable configuration
    ansible.builtin.copy:
      content: "# Mock Apache SSL configuration file\n# This file contains a vulnerable SSLProtocol line that will be fixed by the role\n\n<IfModule mod_ssl.c>\n
        \   SSLProtocol all -SSLv3\n    SSLCipherSuite HIGH:!aNULL:!MD5\n    SSLHonorCipherOrder on\n</IfModule>\n"
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Check current SSL configuration (simulating role task)
    ansible.builtin.command: grep -q "SSLProtocol -all +TLSv1.2" /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_config_check
    changed_when: false
    failed_when: false
  - name: Fix SSL in Apache (simulating role task)
    ansible.builtin.replace:
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
    when: ssl_config_check.rc != 0
