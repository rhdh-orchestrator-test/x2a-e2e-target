---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check hostname file
    - name: Check if hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    # Check hostname content
    - name: Get hostname file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Check sysctl parameter files
    - name: Check if sysctl parameter files exist
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/sysctl.d/{{ item }}"
      register: sysctl_files
      loop:
        - vm_max_map_count.conf
        - vm_dirty_expire_centisecs.conf

    - name: Assert sysctl parameter files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Sysctl parameter file {{ item.item }} not found"
        success_msg: "Sysctl parameter file {{ item.item }} exists"
      loop: "{{ sysctl_files.results }}"

    # Check Chef Automate CLI
    - name: Check if Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/molecule/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Check user PEM file
    - name: Check if user PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/molecule/chef-user.pem
      register: user_pem

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.isreg
          - user_pem.stat.mode == "0600"
        fail_msg: "User PEM file not found or has incorrect permissions"
        success_msg: "User PEM file exists with correct permissions"

    # Check organization validator PEM file
    - name: Check if organization validator PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/molecule/chef-org-validator.pem
      register: org_validator_pem

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_validator_pem.stat.exists
          - org_validator_pem.stat.isreg
          - org_validator_pem.stat.mode == "0600"
        fail_msg: "Organization validator PEM file not found or has incorrect permissions"
        success_msg: "Organization validator PEM file exists with correct permissions"

    # The following checks would normally be performed but can't run in a container
    # They are tagged with molecule-notest so they'll be skipped during molecule testing

    - name: Check if Chef Automate service is running
      ansible.builtin.command: chef-automate status
      register: chef_automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check if Chef user exists
      ansible.builtin.command: chef-server-ctl user-list
      register: chef_user_list
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef user exists
      ansible.builtin.assert:
        that:
          - "'chef-user' in chef_user_list.stdout"
        fail_msg: "Chef user not found"
        success_msg: "Chef user exists"
      tags: molecule-notest

    - name: Check if Chef organization exists
      ansible.builtin.command: chef-server-ctl org-list
      register: chef_org_list
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef organization exists
      ansible.builtin.assert:
        that:
          - "'chef-org' in chef_org_list.stdout"
        fail_msg: "Chef organization not found"
        success_msg: "Chef organization exists"
      tags: molecule-notest