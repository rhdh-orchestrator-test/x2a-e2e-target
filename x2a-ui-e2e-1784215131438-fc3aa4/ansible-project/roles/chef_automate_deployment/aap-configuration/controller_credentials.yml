---
controller_credentials:
- name: Chef User Credentials - chef_automate_deployment
  description: Credentials used for creating Chef user during deployment
  organization: Default
  credential_type: Chef User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    long_username: '{{ long_username }}'
    user_email: '{{ user_email }}'
    user_password: '{{ vault_user_password }}'
- name: Chef Organization Configuration - chef_automate_deployment
  description: Organization settings for Chef Infra Server
  organization: Default
  credential_type: Chef Organization Configuration
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    long_org_name: '{{ long_org_name }}'
