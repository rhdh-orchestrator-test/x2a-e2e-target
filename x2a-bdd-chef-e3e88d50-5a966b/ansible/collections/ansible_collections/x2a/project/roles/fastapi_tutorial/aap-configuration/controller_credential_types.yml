---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: PostgreSQL credentials used to create and authenticate the FastAPI application's database user and to generate its DATABASE_URL.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; currently hardcoded as fastapi_password and embedded in DATABASE_URL.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL service, currently localhost.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application, currently fastapi_db.
      required:
        - db_username
        - db_password
        - db_host
        - db_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_host: !unsafe "{{ db_host }}"
        db_name: !unsafe "{{ db_name }}"
