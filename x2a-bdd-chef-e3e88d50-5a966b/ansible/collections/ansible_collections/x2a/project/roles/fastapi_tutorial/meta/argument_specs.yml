---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application
    description:
      - Deploys the FastAPI tutorial from Git with Python dependencies and PostgreSQL.
      - Configures the application environment and systemd service.
    options:
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks handling the database password.
      fastapi_tutorial_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-psycopg2
          - git
          - postgresql
          - postgresql-contrib
          - python3-venv
        description: Operating system packages required by the application.
      fastapi_tutorial_postgresql_service:
        type: str
        required: false
        default: postgresql
        description: Name of the PostgreSQL system service.
      db_username:
        type: str
        required: true
        description: PostgreSQL application username injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: PostgreSQL application password injected by an AAP credential type.
      db_host:
        type: str
        required: true
        description: PostgreSQL host injected by an AAP credential type.
      db_name:
        type: str
        required: true
        description: PostgreSQL database name injected by an AAP credential type.
