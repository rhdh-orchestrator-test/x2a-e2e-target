---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: PostgreSQL credentials used to create and authenticate the FastAPI application's database user and to generate its DATABASE_URL.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      db_host: "{{ db_host }}"
      db_name: "{{ db_name }}"
