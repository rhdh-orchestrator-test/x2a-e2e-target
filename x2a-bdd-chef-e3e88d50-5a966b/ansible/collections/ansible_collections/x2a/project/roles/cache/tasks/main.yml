---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml

- name: Configure Redis with the Private Hub role # noqa: L038 - role is supplied by the eloy.redis collection declared in requirements.yml
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ redis_log_directory }}" # noqa: R114 - path is a trusted role default
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Check for the Redis configuration file
  ansible.builtin.stat:
    path: /etc/redis/6379.conf
  register: redis_config

- name: Remove replication directives from Redis configuration # noqa: L039 - redis_config is registered by the preceding stat task
  ansible.builtin.replace:
    path: /etc/redis/6379.conf
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$
    replace: ""
    backup: true
    create: false
  when: redis_config.stat.exists

- name: Enable and start Redis
  ansible.builtin.service:
    name: redis
    enabled: true
    state: started
