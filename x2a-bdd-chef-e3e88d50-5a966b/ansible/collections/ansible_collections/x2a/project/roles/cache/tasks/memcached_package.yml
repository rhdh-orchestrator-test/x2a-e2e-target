---
- name: Install Memcached package
  ansible.builtin.package:
    name: "{{ memcached_package_name }}"
    state: present

- name: Create Memcached service group
  ansible.builtin.group:
    name: "{{ memcached_group }}"
    system: true
    state: present

- name: Create locked Memcached service user
  ansible.builtin.user:
    name: "{{ memcached_user }}"
    system: true
    group: "{{ memcached_group }}"
    home: "{{ memcached_user_home }}"
    shell: "{{ memcached_user_shell }}"
    comment: "{{ memcached_user_comment }}"
    create_home: false
    password_lock: true
    state: present

- name: Create Memcached log directory
  ansible.builtin.file:
    path: "{{ memcached_log_directory }}" # noqa: R114 - path is a trusted role default
    state: directory
    owner: "{{ memcached_user }}"
    group: "{{ memcached_group }}"
    mode: "0755"

- name: Create Memcached runtime directory
  ansible.builtin.file:
    path: "{{ memcached_run_directory }}" # noqa: R114 - path is a trusted role default
    state: directory
    owner: "{{ memcached_user }}"
    group: "{{ memcached_group }}"
    mode: "0755"
