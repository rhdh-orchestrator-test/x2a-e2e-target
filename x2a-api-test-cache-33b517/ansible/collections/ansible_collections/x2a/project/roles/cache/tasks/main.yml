---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Redis cache service  # noqa: L038 - eloy.redis.redis is provided by the declared eloy.redis collection dependency
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_version: "7.2"
    redis_install_method: package
    redis_port: 6379
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true
    redis_base_piddir: /run/redis

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Check for Redis configuration file
  ansible.builtin.stat:
    path: /etc/redis/6379.conf
  register: redis_config

- name: Remove replica serve stale data directive  # noqa: L039 - redis_config is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^replica-serve-stale-data.*$
    state: absent
    create: false
  when: redis_config.stat.exists
  notify: Restart Redis service

- name: Remove replica read only directive  # noqa: L039 - redis_config is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^replica-read-only.*$
    state: absent
    create: false
  when: redis_config.stat.exists
  notify: Restart Redis service

- name: Remove replica ping period directive  # noqa: L039 - redis_config is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^repl-ping-replica-period.*$
    state: absent
    create: false
  when: redis_config.stat.exists
  notify: Restart Redis service

- name: Remove client output buffer limit directive  # noqa: L039 - redis_config is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^client-output-buffer-limit.*$
    state: absent
    create: false
  when: redis_config.stat.exists
  notify: Restart Redis service

- name: Remove replica priority directive  # noqa: L039 - redis_config is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^replica-priority.*$
    state: absent
    create: false
  when: redis_config.stat.exists
  notify: Restart Redis service

- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml
