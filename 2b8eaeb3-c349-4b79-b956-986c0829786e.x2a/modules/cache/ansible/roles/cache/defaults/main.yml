---
redis_package_install: true
redis_version: 6.2.6
redis_source_url: http://download.redis.io/releases/redis-{{ redis_version }}.tar.gz
redis_install_dir: /usr/local
redis_user: redis
redis_group: redis
redis_set_limits: true
redis_nofile_limit: 65536
redis_disable_os_default: true
redis_instances:
  - port: 6379
    name: "6379"
    datadir: /var/lib/redis/6379
    logdir: /var/log/redis
    loglevel: notice
    timeout: 0
    databases: 16
    save:
      - 900 1
      - 300 10
      - 60 10000
    rdbcompression: "yes"
    rdbchecksum: "yes"
    dbfilename: dump.rdb
    maxclients: 10000
    appendonly: "no"
    appendfsync: everysec
    no_appendfsync_on_rewrite: "no"
    auto_aof_rewrite_percentage: 100
    auto_aof_rewrite_min_size: 64mb
    lua_time_limit: 5000
    slowlog_log_slower_than: 10000
    slowlog_max_len: 128
    activerehashing: "yes"
    hz: 10
    aof_rewrite_incremental_fsync: "yes"
