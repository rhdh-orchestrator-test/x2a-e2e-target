---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - unzip
      - curl
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_dir }}/chef-automate.zip"
    mode: "0644"
  register: download_result
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < chef-automate.zip > chef-automate && chmod +x chef-automate
    chdir: "{{ chef_automate_cli_dir }}"
    executable: /bin/bash
  args:
    creates: "{{ chef_automate_cli_dir }}/chef-automate"
  when: download_result is changed
