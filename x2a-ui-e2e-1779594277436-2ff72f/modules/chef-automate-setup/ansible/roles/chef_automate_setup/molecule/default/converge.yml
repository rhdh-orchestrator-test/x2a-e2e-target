- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    password: TestPassword123
    email: jtonello@example.com
    full_name: John Tonello
  tasks:
  - name: Create required directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/home/molecule
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create mock sysctl files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/vm/{{ item.name }}
      mode: '0644'
    loop:
    - name: max_map_count
      value: '262144'
    - name: dirty_expire_centisecs
      value: '20000'
  - name: Create mock Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock version 1.0.0"

        echo "This is a mock file for molecule testing"

        '
      dest: /tmp/molecule_test/home/molecule/chef-automate
      mode: '0755'
  - name: Create mock Chef Automate CLI zip
    ansible.builtin.copy:
      content: Mock Chef Automate CLI zip file
      dest: /tmp/molecule_test/home/molecule/chef-automate.zip
      mode: '0644'
  - name: Create mock user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5NhYL7ZFsH0JXIvfIaP9HQAh9MrQ5A5Kj3f5A9ThOhTrJgP

        MOCK_KEY_CONTENT_FOR_TESTING_ONLY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/molecule/jtonello.pem
      mode: '0600'
  - name: Create mock organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5NhYL7ZFsH0JXIvfIaP9HQAh9MrQ5A5Kj3f5A9ThOhTrJgP

        MOCK_ORG_KEY_CONTENT_FOR_TESTING_ONLY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/molecule/lab-validator.pem
      mode: '0600'
