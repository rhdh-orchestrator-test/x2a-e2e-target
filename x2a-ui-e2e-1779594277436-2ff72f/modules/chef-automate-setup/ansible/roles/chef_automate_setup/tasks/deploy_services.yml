---
- name: Check if Chef Automate is already deployed
  ansible.builtin.stat:
    path: /hab
  register: hab_dir
  become: true
- name: Deploy Chef Automate and Infra Server
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product {{ chef_automate_products | join(' --product ') }} --accept-terms-and-mlsa={{ accept_terms_and_mlsa | lower }}
    chdir: "{{ chef_automate_cli_dir }}"
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
  failed_when: deploy_result.rc != 0
  when: not hab_dir.stat.exists
