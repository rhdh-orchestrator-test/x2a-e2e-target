---
- name: Check if user PEM file exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_dir }}/{{ userfilename }}"
  register: user_pem_file
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ userfilename }}
    chdir: "{{ chef_automate_cli_dir }}"
  become: true
  register: create_user_result
  changed_when: create_user_result.rc == 0
  failed_when: create_user_result.rc != 0 and "already exists" not in create_user_result.stderr
  when: not user_pem_file.stat.exists
- name: Check if organization PEM file exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_dir }}/{{ orgfilename }}"
  register: org_pem_file
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ orgname }} "{{ longorgname }}" --association_user {{ username }} --filename {{ orgfilename }}
    chdir: "{{ chef_automate_cli_dir }}"
  become: true
  register: create_org_result
  changed_when: create_org_result.rc == 0
  failed_when: create_org_result.rc != 0 and "already exists" not in create_org_result.stderr
  when: not org_pem_file.stat.exists
