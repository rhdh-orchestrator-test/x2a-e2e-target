- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/home
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "[global]\n  # Chef Automate configuration\n  v1 = true\n[deployment]\n  automate = true\n  infra_server = true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        EXAMPLE_PEM_CONTENT_FOR_USER

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/{{ chef_userfilename }}
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        EXAMPLE_PEM_CONTENT_FOR_ORG_VALIDATOR

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/{{ chef_orgfilename }}
      mode: '0600'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        exit 0

        '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = {{ chef_vm_max_map_count }}

        vm.dirty_expire_centisecs = {{ chef_vm_dirty_expire_centisecs }}

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  vars:
    chef_hostname: automate.chef.lab
    chef_username: jtonello
    chef_longusername: John Tonello
    chef_useremail: jtonello@chef.lab
    chef_orgname: lab
    chef_longorgname: Chef Lab
    chef_vm_max_map_count: 262144
    chef_vm_dirty_expire_centisecs: 20000
    chef_userfilename: jtonello.pem
    chef_orgfilename: lab-validator.pem
    chef_deploy_automate: true
