- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl config file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl config file not found
      success_msg: Sysctl config file exists
  - name: Get sysctl config content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl parameters are set correctly
    ansible.builtin.assert:
      that:
      - (sysctl_content.content | b64decode) is search("vm.max_map_count = 262144")
      - (sysctl_content.content | b64decode) is search("vm.dirty_expire_centisecs = 20000")
      fail_msg: Sysctl parameters not set correctly
      success_msg: Sysctl parameters set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: chef_config_file
  - name: Assert Chef Automate config file exists
    ansible.builtin.assert:
      that:
      - chef_config_file.stat.exists
      - chef_config_file.stat.isreg
      fail_msg: Chef Automate config file not found
      success_msg: Chef Automate config file exists
  - name: Check user PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/jtonello.pem
    register: user_pem_file
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem_file.stat.exists
      - user_pem_file.stat.isreg
      - user_pem_file.stat.mode == "0600"
      fail_msg: User PEM file not found or has incorrect permissions
      success_msg: User PEM file exists with correct permissions
  - name: Check organization validator PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/lab-validator.pem
    register: org_pem_file
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_pem_file.stat.exists
      - org_pem_file.stat.isreg
      - org_pem_file.stat.mode == "0600"
      fail_msg: Organization validator PEM file not found or has incorrect permissions
      success_msg: Organization validator PEM file exists with correct permissions
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - automate_status.rc == 0
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: chef_server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - chef_server_status.rc == 0
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Check user exists in Chef Server
    ansible.builtin.command:
      cmd: sudo chef-server-ctl user-list
    register: chef_user_list
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert user exists in Chef Server
    ansible.builtin.assert:
      that:
      - '''jtonello'' in chef_user_list.stdout'
      fail_msg: User not found in Chef Server
      success_msg: User exists in Chef Server
    tags: molecule-notest
  - name: Check organization exists in Chef Server
    ansible.builtin.command:
      cmd: sudo chef-server-ctl org-list
    register: chef_org_list
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert organization exists in Chef Server
    ansible.builtin.assert:
      that:
      - '''lab'' in chef_org_list.stdout'
      fail_msg: Organization not found in Chef Server
      success_msg: Organization exists in Chef Server
    tags: molecule-notest
  - name: Check web UI accessibility
    ansible.builtin.uri:
      url: https://localhost/api/_status
      validate_certs: false
      status_code: 200
    register: web_ui_status
    failed_when: false
    tags: molecule-notest
  - name: Assert web UI is accessible
    ansible.builtin.assert:
      that:
      - web_ui_status.status == 200
      fail_msg: Chef web UI is not accessible
      success_msg: Chef web UI is accessible
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check.state == "started"
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
  - name: Check Chef Automate service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - '''chef-automate'' in ansible_facts.services'
      - ansible_facts.services['chef-automate'].state == 'running'
      fail_msg: Chef Automate service is not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
