---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_hostname }}"
  become: true
- name: Configure sysctl parameters for Chef Infra Server
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - key: vm.max_map_count
      value: "{{ chef_vm_max_map_count }}"
    - key: vm.dirty_expire_centisecs
      value: "{{ chef_vm_dirty_expire_centisecs }}"
  become: true
  notify: Apply sysctl settings
- name: Install required packages
  ansible.builtin.package:
    name:
      - curl
      - gzip
      - unzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: /tmp/chef-automate
  register: chef_automate_cli
- name: Extract Chef Automate CLI
  ansible.builtin.command:
    cmd: gunzip -c /tmp/chef-automate.zip > /tmp/chef-automate
  args:
    creates: /tmp/chef-automate
  when: not chef_automate_cli.stat.exists
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: /tmp/chef-automate
    mode: "0755"
- name: Deploy Chef Infra Server (without Automate)
  ansible.builtin.command:
    cmd: /tmp/chef-automate deploy --product infra-server --accept-terms-and-mlsa=true
    creates: /etc/chef-automate/config.toml
  become: true
  register: chef_server_deploy
  async: 3600
  poll: 30
- name: Ensure directory exists for PEM files
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_env.HOME }}"
  become: false
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_username }}  {{ chef_longusername }}  {{ chef_useremail }}  "{{ user_password }}"  --filename {{ chef_userfilename
      }}

      '
    creates: "{{ chef_userfilename }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_orgname }}  "{{ chef_longorgname }}"  --association_user {{ chef_username }}  --filename {{ chef_orgfilename }}

      '
    creates: "{{ chef_orgfilename }}"
  become: true
