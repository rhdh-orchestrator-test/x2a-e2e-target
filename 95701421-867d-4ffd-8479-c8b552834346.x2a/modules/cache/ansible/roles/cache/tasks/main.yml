- name: Include Redis role from eloy.redis collection
  ansible.builtin.include_role:
    name: eloy.redis.redis
  vars:
    redis_port: '{{ redis_port }}'
    redis_bind: '{{ redis_bind }}'
    redis_service_enabled: '{{ redis_service_enabled }}'
    redis_service_state: '{{ redis_service_state }}'
    redis_maxmemory: '{{ redis_maxmemory | default(omit) }}'
    redis_maxmemory_policy: '{{ redis_maxmemory_policy | default(omit) }}'
