- name: Check if Chef Automate CLI exists
  ansible.builtin.stat:
    path: '{{ chef_automate_cli_path }}'
  register: automate_cli
- name: Download Chef Automate CLI if not exists
  ansible.builtin.get_url:
    url: '{{ chef_automate_cli_url }}'
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: '0644'
  when: not automate_cli.stat.exists
- name: Extract Chef Automate CLI if not exists
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_path }} < /tmp/chef-automate_linux_amd64.zip
  args:
    executable: /bin/bash
  when: not automate_cli.stat.exists
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: '{{ chef_automate_cli_path }}'
    mode: '0755'
    state: file
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: './chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }} '
  args:
    creates: /etc/chef-automate/config.toml
  become: true
