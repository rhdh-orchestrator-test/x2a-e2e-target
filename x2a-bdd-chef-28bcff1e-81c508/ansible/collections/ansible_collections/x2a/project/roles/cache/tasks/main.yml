---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml

- name: Configure standalone Redis
  ansible.builtin.include_role:
    name: eloy.redis.redis # noqa: L038 - the Redis role is supplied externally and cannot be resolved in this role tree
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_requirepass: "{{ redis_password }}"

- name: Ensure Redis log directory exists
  ansible.builtin.file:
    path: "{{ redis_log_directory }}" # noqa: R114 - path comes from role defaults
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Check whether the Redis configuration exists
  ansible.builtin.stat:
    path: /etc/redis/6379.conf
  register: redis_config_file

- name: Remove obsolete Redis replication directives # noqa: L039 - redis_config_file is registered by the preceding stat task
  ansible.builtin.replace:
    path: /etc/redis/6379.conf
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$
    replace: ""
    create: false
  when: redis_config_file.stat.exists
  no_log: "{{ cache_secure_logging }}"
