---
argument_specs:
  main:
    short_description: Install and configure a hardened Nginx multisite server.
    description:
      - Installs Nginx and Fail2ban, configures firewall and SSH hardening, and deploys virtual hosts.
    options:
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated SSL certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated SSL private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_sites:
        type: dict
        required: false
        default: {}
        description: Site records keyed by site name, including document root and SSL settings.
      nginx_multisite_site_token:
        type: str
        required: false
        default: "{{ site_token }}"
        description: Site token supplied by the AAP credential variable.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks handling secret values.
