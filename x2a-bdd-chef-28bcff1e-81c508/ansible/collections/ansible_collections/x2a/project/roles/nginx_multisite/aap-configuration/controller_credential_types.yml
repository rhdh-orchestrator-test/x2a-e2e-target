---
controller_credential_types:
  - name: Nginx Site Token
    description: Secret token written to the Nginx site token file and used by the Nginx deployment. The original Chef storage backend is unknown.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Site Token
          secret: true
          help_text: Secret token used by the Nginx site configuration; store in Ansible Vault or an approved external secret manager and deploy without logging
            its value.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
