---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Deploy Fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Check current UFW status
  ansible.builtin.command:
    cmd: ufw status verbose
  register: nginx_multisite_ufw_status
  changed_when: false
  check_mode: false
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default incoming policy  # noqa: L039 - registered by prior command task
  ansible.builtin.command:
    cmd: ufw --force default deny
  when:
    - nginx_multisite_ufw_enabled
    - "'Default: deny (incoming)' not in (nginx_multisite_ufw_status.stdout | default(''))"

- name: Allow SSH through UFW  # noqa: L039 - registered by prior command task
  ansible.builtin.command:
    cmd: ufw allow ssh
  when:
    - nginx_multisite_ufw_enabled
    - "'22/tcp' not in (nginx_multisite_ufw_status.stdout | default(''))"

- name: Allow HTTP through UFW  # noqa: L039 - registered by prior command task
  ansible.builtin.command:
    cmd: ufw allow http
  when:
    - nginx_multisite_ufw_enabled
    - "'80/tcp' not in (nginx_multisite_ufw_status.stdout | default(''))"

- name: Allow HTTPS through UFW  # noqa: L039 - registered by prior command task
  ansible.builtin.command:
    cmd: ufw allow https
  when:
    - nginx_multisite_ufw_enabled
    - "'443/tcp' not in (nginx_multisite_ufw_status.stdout | default(''))"

- name: Enable UFW  # noqa: L039 - registered by prior command task
  ansible.builtin.command:
    cmd: ufw --force enable
  when:
    - nginx_multisite_ufw_enabled
    - "'Status: active' not in (nginx_multisite_ufw_status.stdout | default(''))"

- name: Check sysctl configuration directory
  ansible.builtin.stat:
    path: /etc/sysctl.d
  register: nginx_multisite_sysctl_dir

- name: Deploy sysctl security configuration  # noqa: L039 - registered by prior stat task
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  when: nginx_multisite_sysctl_dir.stat.isdir | default(false)
  notify: Reload nginx multisite sysctl

- name: Check SSH daemon configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable SSH root login  # noqa: L039 - registered by prior stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    state: present
    create: false
    backup: true
  when:
    - nginx_multisite_ssh_disable_root
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd

- name: Disable SSH password authentication  # noqa: L039 - registered by prior stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    state: present
    create: false
    backup: true
  when:
    - not nginx_multisite_ssh_password_auth
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd
