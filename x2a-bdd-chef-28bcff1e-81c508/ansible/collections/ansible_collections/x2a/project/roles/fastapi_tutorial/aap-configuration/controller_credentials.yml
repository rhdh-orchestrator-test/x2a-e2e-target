---
controller_credentials:
  - name: PostgreSQL Application Database - fastapi_tutorial
    description: Hardcoded PostgreSQL application credential from the Chef recipe, to be migrated into Ansible Vault or an approved secret-management 
      integration.
    organization: Default
    credential_type: PostgreSQL Application Database
    update_secrets: true
    inputs:
      database_user: "{{ database_user }}"
      db_password: "{{ vault_db_password }}"
      database_name: "{{ database_name }}"
      database_host: "{{ database_host }}"
      database_port: "{{ database_port }}"
