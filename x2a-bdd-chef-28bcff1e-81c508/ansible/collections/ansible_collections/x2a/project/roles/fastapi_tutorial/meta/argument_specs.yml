---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application.
    description:
      - Deploys the FastAPI tutorial from Git and configures its PostgreSQL dependency and systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout and virtual environment path.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_service_port:
        type: int
        required: false
        default: 8000
        description: TCP port for the Uvicorn service.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations that handle the database password.
      database_user:
        type: str
        required: true
        description: Database user injected by the AAP credential type.
      db_password:
        type: str
        required: true
        description: Database password injected by the AAP credential type.
      database_name:
        type: str
        required: true
        description: Database name injected by the AAP credential type.
      database_host:
        type: str
        required: true
        description: Database host injected by the AAP credential type.
      database_port:
        type: str
        required: true
        description: Database port injected by the AAP credential type.
