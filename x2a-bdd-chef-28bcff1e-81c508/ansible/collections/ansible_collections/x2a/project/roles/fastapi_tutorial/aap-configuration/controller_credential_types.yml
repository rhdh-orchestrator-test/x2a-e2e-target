---
controller_credential_types:
  - name: PostgreSQL Application Database
    description: Hardcoded PostgreSQL application credential from the Chef recipe, to be migrated into Ansible Vault or an approved secret-management 
      integration.
    kind: cloud
    inputs:
      fields:
        - id: database_user
          type: string
          label: Database User
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL application role; currently hardcoded as fastapi_password and used in the database URL.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname of the PostgreSQL server used by the application.
        - id: database_port
          type: string
          label: Database Port
          help_text: TCP port for PostgreSQL connections; the plan identifies port 5432.
      required:
        - database_user
        - db_password
        - database_name
        - database_host
        - database_port
    injectors:
      extra_vars:
        database_user: !unsafe "{{ database_user }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
        database_port: !unsafe "{{ database_port }}"
