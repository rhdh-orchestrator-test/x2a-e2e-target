---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install Fedora and RHEL dependencies
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - sudo
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Debian-family dependencies
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - sudo
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Initialize PostgreSQL on Fedora and RHEL
  ansible.builtin.command:
    argv:
      - postgresql-setup
      - --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] == 'RedHat'

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository  # noqa: R104 - repository is an HTTPS role default controlled by the operator
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R106 - repository source is an HTTPS role default controlled by the operator
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - destination is a role default controlled by the operator
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment
  ansible.builtin.command: # noqa: R101 - application path is a validated role input used in a fixed virtual-environment command
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_app_path }}/venv"
    creates: "{{ fastapi_tutorial_app_path }}/venv/bin/python" # noqa: R114 - path is under the role-defined application directory

- name: Install Python dependencies  # noqa: R113 - requirements target is under the role-defined application directory
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt" # noqa: R114 - requirements are from the role-defined application directory
    virtualenv: "{{ fastapi_tutorial_app_path }}/venv" # noqa: R114 - virtualenv is under the role-defined application directory

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL role  # noqa: L039 - credential variables are asserted by the preceding validation task
  ansible.builtin.shell: # noqa: R101 - credentials are validated role inputs intentionally interpolated into a fixed PostgreSQL administrative command
    cmd: >-
      sudo -u postgres psql -v ON_ERROR_STOP=1 -c
      "DO $$ BEGIN CREATE ROLE {{ database_user | quote }} LOGIN PASSWORD '{{ db_password }}';
      EXCEPTION WHEN duplicate_object THEN ALTER ROLE {{ database_user | quote }} PASSWORD '{{ db_password }}'; END $$;"
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL database  # noqa: L039 - credential variables are asserted by the preceding validation task
  ansible.builtin.command: # noqa: R101 - database variables are validated role inputs intentionally interpolated into a fixed PostgreSQL administrative command
    cmd: >-
      sudo -u postgres psql -v ON_ERROR_STOP=1 -c
      "SELECT 'CREATE DATABASE {{ database_name }} OWNER {{ database_user }}' WHERE NOT EXISTS
      (SELECT FROM pg_database WHERE datname = '{{ database_name }}')\gexec"
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant PostgreSQL database privileges  # noqa: L039 - credential variables are asserted by the preceding validation task
  ansible.builtin.shell: # noqa: R101 - database variables are validated role inputs intentionally interpolated into a fixed PostgreSQL administrative command
    cmd: >-
      sudo -u postgres psql -v ON_ERROR_STOP=1 -c
      "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ database_user }};"
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write application environment file  # noqa: L039 - credential variables are asserted by the preceding validation task
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - path is under the role-defined application directory
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ database_user }}:{{ db_password }}@{{ database_host }}:{{ database_port }}/{{ database_name }}
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_app_path }}/venv/bin"
      ExecStart={{ fastapi_tutorial_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before starting the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI tutorial
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
