---
# Unsupported pre-flight diagnostics omitted because they do not state an expected
# outcome: tool version output, git status/branch output, pip package listing,
# PostgreSQL version/endpoint output, privilege listing, masked secret inspection,
# process listings, journal output, and service ordering output.

- name: Verify FastAPI tutorial deployment
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify FastAPI application directory exists
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: fastapi_app_directory

    - name: Assert FastAPI application directory exists
      ansible.builtin.assert:
        that:
          - fastapi_app_directory.stat.exists
          - fastapi_app_directory.stat.isdir
        fail_msg: FastAPI application directory is missing

    - name: Verify FastAPI requirements file exists
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/requirements.txt
      register: fastapi_requirements_file

    - name: Assert FastAPI requirements file exists
      ansible.builtin.assert:
        that:
          - fastapi_requirements_file.stat.exists
          - fastapi_requirements_file.stat.isreg
        fail_msg: FastAPI requirements file is missing

    - name: Verify FastAPI virtual environment executables
      ansible.builtin.stat:
        path: "{{ item_fastapi_executable }}"
      loop:
        - /opt/fastapi-tutorial/venv/bin/python
        - /opt/fastapi-tutorial/venv/bin/pip
      loop_control:
        loop_var: item_fastapi_executable
      register: fastapi_virtual_environment_executables

    - name: Assert FastAPI virtual environment executables are present
      ansible.builtin.assert:
        that:
          - item_fastapi_executable_result.stat.exists
          - item_fastapi_executable_result.stat.isreg
          - item_fastapi_executable_result.stat.executable
        fail_msg: A FastAPI virtual environment executable is missing or not executable
      loop: "{{ fastapi_virtual_environment_executables.results }}"
      loop_control:
        loop_var: item_fastapi_executable_result

    - name: Check PostgreSQL service state
      ansible.builtin.service_facts:

    - name: Assert PostgreSQL service is active
      ansible.builtin.assert:
        that:
          - "'postgresql.service' in ansible_facts.services"
          - ansible_facts.services['postgresql.service']['state'] == 'running'
        fail_msg: PostgreSQL service is not active

    - name: Check PostgreSQL service is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - postgresql
      register: fastapi_postgresql_enabled
      changed_when: false

    - name: Assert PostgreSQL service is enabled
      ansible.builtin.assert:
        that:
          - fastapi_postgresql_enabled.stdout | trim == 'enabled'
        fail_msg: PostgreSQL service is not enabled

    - name: Verify PostgreSQL role exists
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT rolname FROM pg_roles WHERE rolname = 'fastapi';
      register: fastapi_postgresql_role
      changed_when: false

    - name: Assert PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - fastapi_postgresql_role.stdout | trim == 'fastapi'
        fail_msg: PostgreSQL role fastapi is missing

    - name: Verify PostgreSQL database owner
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - >-
            SELECT datname || ':' || pg_catalog.pg_get_userbyid(datdba)
            FROM pg_database WHERE datname = 'fastapi_db';
      register: fastapi_postgresql_database
      changed_when: false

    - name: Assert PostgreSQL database has the expected owner
      ansible.builtin.assert:
        that:
          - fastapi_postgresql_database.stdout | trim == 'fastapi_db:fastapi'
        fail_msg: PostgreSQL database fastapi_db is missing or has the wrong owner

    - name: Read FastAPI environment file
      ansible.builtin.slurp:
        src: /opt/fastapi-tutorial/.env
      register: fastapi_environment_file

    - name: Assert expected non-secret environment values
      ansible.builtin.assert:
        that:
          - "'PROJECT_NAME=\"FastAPI Tutorial\"' in (fastapi_environment_file.content | b64decode)"
          - "'API_VERSION=1.0.0' in (fastapi_environment_file.content | b64decode)"
        fail_msg: Expected FastAPI environment values are missing

    - name: Read FastAPI systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_systemd_unit

    - name: Assert expected FastAPI systemd settings
      ansible.builtin.assert:
        that:
          - "'User=root' in (fastapi_systemd_unit.content | b64decode)"
          - "'WorkingDirectory=/opt/fastapi-tutorial' in (fastapi_systemd_unit.content | b64decode)"
          - "'ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000' in (fastapi_systemd_unit.content | b64decode)"
          - "'Restart=always' in (fastapi_systemd_unit.content | b64decode)"
        fail_msg: Expected FastAPI systemd settings are missing

    - name: Verify FastAPI systemd unit syntax
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_systemd_verify
      changed_when: false

    - name: Assert FastAPI systemd unit is valid
      ansible.builtin.assert:
        that:
          - fastapi_systemd_verify.rc == 0
        fail_msg: FastAPI systemd unit failed systemd-analyze verification

    - name: Check FastAPI service state
      ansible.builtin.service_facts:

    - name: Assert FastAPI service is active
      ansible.builtin.assert:
        that:
          - "'fastapi-tutorial.service' in ansible_facts.services"
          - ansible_facts.services['fastapi-tutorial.service']['state'] == 'running'
        fail_msg: FastAPI service is not active

    - name: Check FastAPI service is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - fastapi-tutorial
      register: fastapi_service_enabled
      changed_when: false

    - name: Assert FastAPI service is enabled
      ansible.builtin.assert:
        that:
          - fastapi_service_enabled.stdout | trim == 'enabled'
        fail_msg: FastAPI service is not enabled

    - name: Check FastAPI root endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/
        method: GET
        return_content: false
        status_code: "{{ range(100, 600) | list }}"
      register: fastapi_root_endpoint

    - name: Assert FastAPI root endpoint returned an HTTP response
      ansible.builtin.assert:
        that:
          - fastapi_root_endpoint.status is defined
          - fastapi_root_endpoint.status >= 100
          - fastapi_root_endpoint.status < 600
        fail_msg: FastAPI root endpoint did not return an HTTP response
