---
controller_credential_types:
  - name: HAProxy Statistics Authentication
    description: Credentials for authenticating to the HAProxy statistics endpoint. The password is encrypted in module data with EYAML and has a plaintext test
      override that must not be migrated to production.
    kind: cloud
    inputs:
      fields:
        - id: stats_user
          type: string
          label: Statistics Username
          help_text: Username used to authenticate to the HAProxy statistics endpoint.
        - id: stats_password
          type: string
          label: Statistics Password
          secret: true
          help_text: Password used to authenticate to the HAProxy statistics endpoint; store the production value securely in AAP.
      required:
        - stats_user
        - stats_password
    injectors:
      extra_vars:
        stats_user: !unsafe "{{ stats_user }}"
        stats_password: !unsafe "{{ stats_password }}"
