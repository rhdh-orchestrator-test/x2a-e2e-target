---
controller_credentials:
  - name: HAProxy Statistics Authentication - profile_haproxy
    description: Credentials for authenticating to the HAProxy statistics endpoint. The password is encrypted in module data with EYAML and has a plaintext test
      override that must not be migrated to production.
    organization: Default
    credential_type: HAProxy Statistics Authentication
    update_secrets: true
    inputs:
      stats_user: "{{ stats_user }}"
      stats_password: "{{ vault_stats_password }}"
