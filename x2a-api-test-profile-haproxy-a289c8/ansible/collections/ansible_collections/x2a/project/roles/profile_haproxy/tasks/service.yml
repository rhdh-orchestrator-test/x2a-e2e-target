---
- name: Create HAProxy systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/haproxy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install HAProxy systemd override
  ansible.builtin.copy:
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/sbin/haproxy -Ws -f {{ haproxy_config_file }} -f {{ haproxy_config_dir }}/conf.d/ -p /run/haproxy.pid -S /run/haproxy-master.sock
    dest: /etc/systemd/system/haproxy.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Reload systemd before managing HAProxy service
  ansible.builtin.systemd:
    daemon_reload: true

- name: Validate HAProxy configuration  # noqa: R101 - configuration paths come from role defaults, not user input
  ansible.builtin.command:
    argv:
      - haproxy
      - -c
      - -f
      - "{{ haproxy_config_file }}"
      - -f
      - "{{ haproxy_config_dir }}/conf.d/"
  changed_when: false

- name: Install HAProxy logrotate configuration
  ansible.builtin.copy:
    content: |
      /var/log/haproxy/*.log {
          daily
          rotate 14
          missingok
          notifempty
          compress
          delaycompress
          sharedscripts
          postrotate
              /bin/kill -HUP $(cat /var/run/haproxy.pid 2>/dev/null) 2>/dev/null || true
          endscript
      }
    dest: /etc/logrotate.d/haproxy
    owner: root
    group: root
    mode: "0644"
    backup: true

- name: Ensure HAProxy service is enabled and running
  ansible.builtin.service:
    name: "{{ haproxy_service_name }}"
    state: started
    enabled: true
