---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_hostname }}"
  become: true
- name: Configure system parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ chef_sysctl_settings | dict2items }}"
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
  register: chef_automate_cli_download
- name: Deploy Chef Infra Server (without Automate)
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_accept_terms_and_mlsa | lower }} "
  become: true
  args:
    creates: /hab/sup/default/data/services.dat
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
- name: Ensure directory for PEM files exists
  ansible.builtin.file:
    path: "{{ chef_user_pem_path | dirname }}"
    state: directory
    mode: "0755"
  become: true
  when: chef_user_pem_path | dirname != '.'
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_username }} {{ chef_user_fullname }} {{ chef_user_email }} "{{ user_password }}" --filename {{ chef_user_pem_path
      }}
  become: true
  args:
    creates: "{{ chef_user_pem_path }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_fullname }}" --association_user {{ chef_username }} --filename {{
      chef_org_validator_pem_path }}
  become: true
  args:
    creates: "{{ chef_org_validator_pem_path }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
