---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
        - /tmp/molecule_test/etc/memcached
      loop_control:
        loop_var: item_dir

    - name: Create redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          # Generated by Ansible - do not edit manually

          # Network
          bind 127.0.0.1
          port 6379
          timeout 0
          tcp-keepalive 300

          # General
          daemonize yes
          supervised systemd
          pidfile /var/run/redis/redis-server.pid
          loglevel notice
          logfile /var/log/redis/redis-server.log

          # Snapshotting
          save 900 1
          save 300 10
          save 60 10000

          stop-writes-on-bgsave-error yes
          rdbcompression yes
          rdbchecksum yes
          dbfilename dump.rdb
          dir /var/lib/redis

          # Security
          requirepass redis_secure_password_123

          # Memory management
          maxmemory 256mb
          maxmemory-policy allkeys-lru

          # Database
          databases 16

          # Append only file
          appendonly no
          appendfilename "appendonly.aof"
          appendfsync everysec
          no-appendfsync-on-rewrite no
          auto-aof-rewrite-percentage 100
          auto-aof-rewrite-min-size 64mb
          aof-load-truncated yes

          # Slow log
          slowlog-log-slower-than 10000
          slowlog-max-len 128

          # Latency monitor
          latency-monitor-threshold 0

          # Event notification
          notify-keyspace-events ""

          # Advanced config
          hash-max-ziplist-entries 512
          hash-max-ziplist-value 64
          list-max-ziplist-size -2
          list-compress-depth 0
          set-max-intset-entries 512
          zset-max-ziplist-entries 128
          zset-max-ziplist-value 64
          hll-sparse-max-bytes 3000
          stream-node-max-bytes 4096
          stream-node-max-entries 100
          activerehashing yes
          client-output-buffer-limit normal 0 0 0
          client-output-buffer-limit slave 256mb 64mb 60
          client-output-buffer-limit pubsub 32mb 8mb 60
          hz 10
          dynamic-hz yes
          aof-rewrite-incremental-fsync yes
          rdb-save-incremental-fsync yes
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create memcached configuration file
      ansible.builtin.copy:
        content: |
          # Memcached configuration
          # Run as daemon
          -d
          # Log to syslog
          -v
          # Start with a cap of 64 megs of memory
          -m 64
          # Default connection port is 11211
          -p 11211
          # Run the daemon as root
          -u memcache
          # Specify which IP address to listen on
          -l 127.0.0.1
          # Limit the number of simultaneous incoming connections
          -c 1024
        dest: /tmp/molecule_test/etc/memcached/memcached.conf
        mode: "0644"
        backup: true

    - name: Create redis log file
      ansible.builtin.copy:
        content: |
          # Redis log file placeholder
          1:M 01 Jan 2024 00:00:00.000 # Redis server started
          1:M 01 Jan 2024 00:00:00.000 # Server initialized
          1:M 01 Jan 2024 00:00:00.000 # Ready to accept connections
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"
        backup: true

    - name: Create redis pid file
      ansible.builtin.copy:
        content: "12345"
        dest: /tmp/molecule_test/var/run/redis/redis-server.pid
        mode: "0644"
        backup: true

    - name: Create redis database file
      ansible.builtin.copy:
        content: "REDIS0009"
        dest: /tmp/molecule_test/var/lib/redis/dump.rdb
        mode: "0644"
        backup: true