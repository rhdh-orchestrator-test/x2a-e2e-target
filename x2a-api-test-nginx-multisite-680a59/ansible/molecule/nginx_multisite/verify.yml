---
# Unsupported pre-flight checks: UFW rule/policy output, certificate metadata, the
# configured SSH port, site HTTP response status, diagnostic logs, and command output
# checks without an explicit expected value are not asserted here.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify nginx service is enabled and active
      ansible.builtin.service_facts:

    - name: Assert nginx service state
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts['services']"
          - "ansible_facts['services']['nginx.service']['status'] == 'enabled'"
          - "ansible_facts['services']['nginx.service']['state'] == 'running'"

    - name: Verify fail2ban service is enabled and active
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts['services']"
          - "ansible_facts['services']['fail2ban.service']['status'] == 'enabled'"
          - "ansible_facts['services']['fail2ban.service']['state'] == 'running'"

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_config_check
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - item_nginx_config_check['rc'] == 0

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      register: item_sshd_config_check
      changed_when: false

    - name: Assert SSH configuration is valid
      ansible.builtin.assert:
        that:
          - item_sshd_config_check['rc'] == 0

    - name: Validate fail2ban configuration
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - -t
      register: item_fail2ban_config_check
      changed_when: false

    - name: Assert fail2ban configuration is valid
      ansible.builtin.assert:
        that:
          - item_fail2ban_config_check['rc'] == 0

    - name: Verify SSH hardening settings
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_sshd_config

    - name: Assert SSH hardening settings are present
      ansible.builtin.assert:
        that:
          - item_sshd_config['content'] | b64decode is search('(?m)^\\s*PermitRootLogin\\s+no\\s*$')
          - item_sshd_config['content'] | b64decode is search('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')

    - name: Verify fail2ban jail configuration exists
      ansible.builtin.stat:
        path: /etc/fail2ban/jail.local
      register: item_fail2ban_jail

    - name: Assert fail2ban jail configuration exists
      ansible.builtin.assert:
        that:
          - item_fail2ban_jail['stat']['exists']
          - item_fail2ban_jail['stat']['isreg']

    - name: Verify Nginx listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listener['port'] }}"
        state: started
        timeout: 5
      loop:
        - port: 80
        - port: 443
      loop_control:
        loop_var: item_listener

    - name: Verify base Nginx files
      ansible.builtin.stat:
        path: "{{ item_nginx_file }}"
      register: item_nginx_files
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
      loop_control:
        loop_var: item_nginx_file

    - name: Assert base Nginx files exist
      ansible.builtin.assert:
        that:
          - item_nginx_file_result['stat']['exists']
          - item_nginx_file_result['stat']['isreg']
      loop: "{{ item_nginx_files['results'] }}"
      loop_control:
        loop_var: item_nginx_file_result

    - name: Verify default Nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_nginx_site

    - name: Assert default Nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_nginx_site['stat']['exists']

    - name: Verify kernel security configuration exists
      ansible.builtin.stat:
        path: /etc/sysctl.d/99-security.conf
      register: item_sysctl_security

    - name: Assert kernel security configuration exists
      ansible.builtin.assert:
        that:
          - item_sysctl_security['stat']['exists']
          - item_sysctl_security['stat']['isreg']

    - name: Verify site directories and index files
      ansible.builtin.stat:
        path: "{{ item_site['path'] }}"
      register: item_site_paths
      loop:
        - path: /opt/server/test
          kind: directory
        - path: /opt/server/test/index.html
          kind: file
        - path: /opt/server/ci
          kind: directory
        - path: /opt/server/ci/index.html
          kind: file
        - path: /opt/server/status
          kind: directory
        - path: /opt/server/status/index.html
          kind: file
      loop_control:
        loop_var: item_site

    - name: Assert site directories and index files exist
      ansible.builtin.assert:
        that:
          - item_site_path['stat']['exists']
          - >-
            (item_site_path['item']['kind'] == 'directory' and item_site_path['stat']['isdir']) or
            (item_site_path['item']['kind'] == 'file' and item_site_path['stat']['isreg'])
      loop: "{{ item_site_paths['results'] }}"
      loop_control:
        loop_var: item_site_path

    - name: Verify site configurations and TLS files
      ansible.builtin.stat:
        path: "{{ item_site_file['path'] }}"
      register: item_site_files
      loop:
        - path: /etc/nginx/sites-available/test.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/test.cluster.local
          kind: link
        - path: /etc/ssl/certs/test.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/test.cluster.local.key
          kind: file
        - path: /etc/nginx/sites-available/ci.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          kind: link
        - path: /etc/ssl/certs/ci.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/ci.cluster.local.key
          kind: file
        - path: /etc/nginx/sites-available/status.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/status.cluster.local
          kind: link
        - path: /etc/ssl/certs/status.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/status.cluster.local.key
          kind: file
      loop_control:
        loop_var: item_site_file

    - name: Assert site configurations and TLS files exist
      ansible.builtin.assert:
        that:
          - item_site_file_result['stat']['exists']
          - >-
            (item_site_file_result['item']['kind'] == 'file' and item_site_file_result['stat']['isreg']) or
            (item_site_file_result['item']['kind'] == 'link' and item_site_file_result['stat']['islnk'])
      loop: "{{ item_site_files['results'] }}"
      loop_control:
        loop_var: item_site_file_result
