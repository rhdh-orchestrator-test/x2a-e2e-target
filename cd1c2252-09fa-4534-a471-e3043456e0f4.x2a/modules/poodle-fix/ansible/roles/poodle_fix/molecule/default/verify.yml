---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify SSL configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_config_file

    - name: Assert SSL configuration file exists
      ansible.builtin.assert:
        that:
          - ssl_config_file.stat.exists
          - ssl_config_file.stat.isreg
        fail_msg: "SSL configuration file does not exist"
        success_msg: "SSL configuration file exists"

    - name: Get SSL configuration file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_config_content

    - name: Decode SSL configuration file content
      ansible.builtin.set_fact:
        ssl_config_decoded: "{{ ssl_config_content.content | b64decode }}"

    - name: Assert SSL protocol is properly configured
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in ssl_config_decoded"
          - "'SSLProtocol all -SSLv3' not in ssl_config_decoded"
        fail_msg: "SSL protocol configuration was not updated correctly"
        success_msg: "SSL protocol configuration was updated correctly"

    - name: Verify backup file was created
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf.bak"
      register: backup_file

    - name: Assert backup file exists
      ansible.builtin.assert:
        that:
          - backup_file.stat.exists
        fail_msg: "Backup file was not created"
        success_msg: "Backup file was created"

    # The following checks would be performed on a real system but can't run in the container
    # They are tagged with molecule-notest so they won't be executed during molecule test

    - name: Check Apache service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Check SSH service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert SSH service is running
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
          - "ansible_facts.services['sshd.service'].state == 'running'"
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"
      tags: molecule-notest

    - name: Test TLSv1.2 connection
      ansible.builtin.command: openssl s_client -connect localhost:443 -tls1_2
      register: tls_test
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert TLSv1.2 connection works
      ansible.builtin.assert:
        that:
          - "tls_test.rc == 0"
        fail_msg: "TLSv1.2 connection failed"
        success_msg: "TLSv1.2 connection works"
      tags: molecule-notest

    - name: Test SSLv3 connection (should fail)
      ansible.builtin.command: openssl s_client -connect localhost:443 -ssl3
      register: ssl3_test
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert SSLv3 connection fails (POODLE mitigation)
      ansible.builtin.assert:
        that:
          - "ssl3_test.rc != 0"
        fail_msg: "SSLv3 connection succeeded (POODLE vulnerability still present)"
        success_msg: "SSLv3 connection failed (POODLE vulnerability mitigated)"
      tags: molecule-notest