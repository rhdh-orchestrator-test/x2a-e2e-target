---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/tmp
        - /tmp/molecule_test/home/molecule

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl settings
    - name: Create sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-settings.conf"
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI'"
        dest: "/tmp/molecule_test/tmp/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.file:
        path: "/tmp/molecule_test/hab"
        state: directory
        mode: "0755"

    # Simulate user and organization key files
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/home/molecule/jtonello.pem"
        mode: "0600"

    - name: Create organization key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORG KEY\n-----END RSA PRIVATE KEY-----"
        dest: "/tmp/molecule_test/home/molecule/lab-validator.pem"
        mode: "0600"

    # Simulate Chef server status output
    - name: Create Chef server status file
      ansible.builtin.copy:
        content: |
          run: postgresql: running
          run: nginx: running
          run: oc_bifrost: running
          run: oc_id: running
          run: bookshelf: running
          run: opscode-erchef: running
        dest: "/tmp/molecule_test/tmp/chef-server-status"
        mode: "0644"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-cs-bookshelf      Status: running
          Service: automate-cs-oc-bifrost     Status: running
          Service: automate-cs-oc-erchef      Status: running
          Service: automate-cs-nginx          Status: running
          Service: automate-cs-postgresql     Status: running
        dest: "/tmp/molecule_test/tmp/chef-automate-status"
        mode: "0644"

    # Simulate user list output
    - name: Create user list file
      ansible.builtin.copy:
        content: "jtonello"
        dest: "/tmp/molecule_test/tmp/chef-user-list"
        mode: "0644"

    # Simulate organization list output
    - name: Create organization list file
      ansible.builtin.copy:
        content: "lab"
        dest: "/tmp/molecule_test/tmp/chef-org-list"
        mode: "0644"