---
controller_credential_types:
- name: Chef Administrator User
  description: Credential type for Chef Administrator User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef administrator username
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef administrator user
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
