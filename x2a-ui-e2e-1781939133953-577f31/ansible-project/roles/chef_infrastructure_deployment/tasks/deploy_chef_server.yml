---
- name: Ensure gzip package is installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate.zip > /tmp/chef-automate && chmod +x /tmp/chef-automate
  args:
    creates: /tmp/chef-automate
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: /tmp/chef-automate deploy --product infra-server --accept-terms-and-mlsa=true
  args:
    creates: /hab
  become: true
  register: deploy_result
  async: 3600
  poll: 30
  notify: Display deployment result
