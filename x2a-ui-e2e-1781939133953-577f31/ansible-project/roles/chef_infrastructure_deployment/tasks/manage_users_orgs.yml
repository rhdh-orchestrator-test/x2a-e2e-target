---
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Ensure chef-server-ctl is available
  ansible.builtin.fail:
    msg: chef-server-ctl command not found. Ensure Chef Infra Server is properly installed.
  when: chef_server_ctl_check.rc != 0
- name: Ensure key file directories exist
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_key_path }}"
    - "{{ chef_org_key_path }}"
  become: true
  when: ansible_user is defined
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_user_name }}  {{ chef_user_long_name }}  {{ chef_user_email }}  "{{ password }}"  --filename {{ chef_user_key_path
      }}

      '
  args:
    creates: "{{ chef_user_key_path }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_org_name }}  "{{ chef_org_long_name }}"  --association_user {{ chef_user_name }}  --filename {{ chef_org_key_path }}

      '
  args:
    creates: "{{ chef_org_key_path }}"
  become: true
- name: Set permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_user_key_path }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  become: true
  when: ansible_user is defined
- name: Set permissions on organization key file
  ansible.builtin.file:
    path: "{{ chef_org_key_path }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  become: true
  when: ansible_user is defined
