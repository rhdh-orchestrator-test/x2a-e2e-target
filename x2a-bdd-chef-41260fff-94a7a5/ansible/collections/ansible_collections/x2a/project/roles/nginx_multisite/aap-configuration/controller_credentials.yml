---
controller_credentials:
  - name: Nginx Site Token - nginx_multisite
    description: Secret token loaded from the Chef encrypted data bag nginx_secrets/site and written to the nginx secrets directory.
    organization: Default
    credential_type: Nginx Site Token
    update_secrets: true
    inputs:
      token: "{{ vault_token }}"
  - name: Nginx TLS Private Key - nginx_multisite
    description: Locally generated private key used by nginx for HTTPS TLS termination; the source generates one key per SSL-enabled site.
    organization: Default
    credential_type: Nginx TLS Private Key
    update_secrets: true
    inputs:
      tls_private_key: "{{ vault_tls_private_key }}"
