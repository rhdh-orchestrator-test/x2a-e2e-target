---
controller_credential_types:
  - name: Nginx Site Token
    description: Secret token loaded from the Chef encrypted data bag nginx_secrets/site and written to the nginx secrets directory.
    kind: cloud
    inputs:
      fields:
        - id: token
          type: string
          label: Site Token
          secret: true
          help_text: Secret token from the nginx_secrets/site encrypted data bag item.
      required:
        - token
    injectors:
      extra_vars:
        token: !unsafe "{{ token }}"
  - name: Nginx TLS Private Key
    description: Locally generated private key used by nginx for HTTPS TLS termination; the source generates one key per SSL-enabled site.
    kind: cloud
    inputs:
      fields:
        - id: tls_private_key
          type: string
          label: TLS Private Key
          secret: true
          help_text: Private key material for an SSL-enabled nginx site; preserve restrictive permissions and do not log its contents.
      required:
        - tls_private_key
    injectors:
      extra_vars:
        tls_private_key: !unsafe "{{ tls_private_key }}"
