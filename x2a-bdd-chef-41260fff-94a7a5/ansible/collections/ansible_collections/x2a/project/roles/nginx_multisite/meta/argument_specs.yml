---
argument_specs:
  main:
    short_description: Install and configure nginx as a secure multi-site web server
    description:
      - Installs nginx and host security components, configures virtual hosts, and optionally creates TLS certificates.
    options:
      nginx_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory containing nginx TLS certificates.
      nginx_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory containing nginx TLS private keys.
      security_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban should be enabled.
      security_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW should be enabled.
      security_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether SSH root login should be disabled.
      security_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication should be allowed.
      nginx_sites:
        type: dict
        required: false
        default: {}
        description: Named site inventory with document roots and TLS settings.
      token:
        type: str
        required: false
        default: ""
        description: Site token injected by an AAP credential or Ansible Vault.
      tls_private_key:
        type: str
        required: false
        default: ""
        description: TLS private key injected by an AAP credential or Ansible Vault.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations handling sensitive credentials.
