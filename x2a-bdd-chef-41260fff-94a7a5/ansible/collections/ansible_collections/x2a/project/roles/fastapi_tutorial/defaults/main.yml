---
fastapi_tutorial_app_path: /opt/fastapi-tutorial
fastapi_tutorial_repository: https://github.com/dibanez/fastapi_tutorial.git
fastapi_tutorial_revision: main
fastapi_tutorial_service_port: 8000
fastapi_tutorial_secure_logging: true
fastapi_tutorial_python_packages:
  - python3
  - python3-pip
  - git
fastapi_tutorial_postgresql_packages:
  - postgresql
  - postgresql-contrib
fastapi_tutorial_postgresql_dev_package: libpq-dev
fastapi_tutorial_postgresql_service: postgresql
fastapi_tutorial_db_user: "{{ db_username }}"
fastapi_tutorial_db_name: "{{ database_name }}"
fastapi_tutorial_db_host: "{{ database_host }}"
