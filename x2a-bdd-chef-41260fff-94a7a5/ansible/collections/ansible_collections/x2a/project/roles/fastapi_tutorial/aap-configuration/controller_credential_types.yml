---
controller_credential_types:
  - name: PostgreSQL Application Database
    description: Credentials for the FastAPI application's local PostgreSQL database, currently hardcoded in the Chef recipe and intended to be stored in 
      Ansible Vault.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL role; use the vaulted fastapi_tutorial_db_password value.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_host
          type: string
          label: Database Host
          help_text: Host where PostgreSQL is running; the current configuration uses localhost.
      required:
        - db_username
        - db_password
        - database_name
        - database_host
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
