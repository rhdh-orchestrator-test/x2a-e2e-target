---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application
    description:
      - Deploys the FastAPI tutorial repository, PostgreSQL dependency, database, and systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application installation directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_service_port:
        type: int
        required: false
        default: 8000
        description: Port on which the FastAPI service listens.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output for tasks handling the database password.
      fastapi_tutorial_python_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - git
        description: Common operating system packages required by the application.
      fastapi_tutorial_postgresql_packages:
        type: list
        elements: str
        required: false
        default:
          - postgresql
          - postgresql-contrib
        description: PostgreSQL packages for non-RedHat systems.
      fastapi_tutorial_postgresql_dev_package:
        type: str
        required: false
        default: libpq-dev
        description: PostgreSQL development package name.
      fastapi_tutorial_postgresql_service:
        type: str
        required: false
        default: postgresql
        description: PostgreSQL service name.
      fastapi_tutorial_db_user:
        type: str
        required: false
        default: "{{ db_username }}"
        description: Database username supplied by the AAP credential.
      fastapi_tutorial_db_name:
        type: str
        required: false
        default: "{{ database_name }}"
        description: Database name supplied by the AAP credential.
      fastapi_tutorial_db_host:
        type: str
        required: false
        default: "{{ database_host }}"
        description: Database host supplied by the AAP credential.
      db_username:
        type: str
        required: true
        description: Database username injected by AAP credential types.
      db_password:
        type: str
        required: true
        description: Database password injected by AAP credential types.
      database_name:
        type: str
        required: true
        description: Database name injected by AAP credential types.
      database_host:
        type: str
        required: true
        description: Database host injected by AAP credential types.
