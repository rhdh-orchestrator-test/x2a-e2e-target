---
# Unsupported diagnostics: raw status, version, process, journal, socket, curl, and
# password-authenticated psql output have no stated expected result suitable for assertion.
- name: Verify the FastAPI tutorial deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify Fedora and RHEL packages
      ansible.builtin.assert:
        that:
          - ansible_facts['packages'][item_rhel_package] is defined
        fail_msg: "A required Fedora or RHEL package is missing."
      loop:
        - python3
        - python3-pip
        - git
        - postgresql-server
        - postgresql-contrib
        - libpq-devel
      loop_control:
        loop_var: item_rhel_package
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Verify Debian-family packages
      ansible.builtin.assert:
        that:
          - ansible_facts['packages'][item_debian_package] is defined
        fail_msg: "A required Debian-family package is missing."
      loop:
        - python3
        - python3-pip
        - python3-venv
        - git
        - postgresql
        - postgresql-contrib
        - libpq-dev
      loop_control:
        loop_var: item_debian_package
      when: ansible_facts['os_family'] == 'Debian'

    - name: Check Fedora and RHEL PostgreSQL initialization
      ansible.builtin.stat:
        path: /var/lib/pgsql/data/PG_VERSION
      register: postgresql_version_file
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Assert Fedora and RHEL PostgreSQL is initialized
      ansible.builtin.assert:
        that:
          - postgresql_version_file['stat']['isreg']
        fail_msg: "The Fedora or RHEL PostgreSQL data directory is not initialized."
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert PostgreSQL is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['postgresql.service'] is defined
          - ansible_facts['services']['postgresql.service']['enabled'] | bool
          - ansible_facts['services']['postgresql.service']['state'] == 'running'
        fail_msg: "The postgresql service is not enabled and active."

    - name: Check the application directory
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: fastapi_directory

    - name: Assert the application directory exists
      ansible.builtin.assert:
        that:
          - fastapi_directory['stat']['isdir']
        fail_msg: "The FastAPI application directory is missing."

    - name: Check the application requirements file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/requirements.txt
      register: fastapi_requirements

    - name: Assert the requirements file exists
      ansible.builtin.assert:
        that:
          - fastapi_requirements['stat']['isreg']
        fail_msg: "The application requirements file is missing."

    - name: Read the repository remote
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - remote
          - -v
      register: fastapi_remote
      changed_when: false

    - name: Assert the expected repository remote
      ansible.builtin.assert:
        that:
          - "'https://github.com/dibanez/fastapi_tutorial.git' in fastapi_remote['stdout']"
        fail_msg: "The FastAPI repository remote is incorrect."

    - name: Read the repository branch
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - rev-parse
          - --abbrev-ref
          - HEAD
      register: fastapi_branch
      changed_when: false

    - name: Assert the repository is on main
      ansible.builtin.assert:
        that:
          - fastapi_branch['stdout'] | trim == 'main'
        fail_msg: "The FastAPI repository is not checked out at main."

    - name: Read the repository revision
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - rev-parse
          - HEAD
      register: fastapi_revision
      changed_when: false

    - name: Assert a repository revision is checked out
      ansible.builtin.assert:
        that:
          - fastapi_revision['stdout'] | trim | length > 0
        fail_msg: "No FastAPI repository revision is checked out."

    - name: Verify the virtual environment Python executable
      ansible.builtin.command:
        argv:
          - test
          - -x
          - /opt/fastapi-tutorial/venv/bin/python
      changed_when: false

    - name: Verify the virtual environment pip executable
      ansible.builtin.command:
        argv:
          - test
          - -x
          - /opt/fastapi-tutorial/venv/bin/pip
      changed_when: false

    - name: Verify installed Python dependencies
      ansible.builtin.command:
        argv:
          - /opt/fastapi-tutorial/venv/bin/pip
          - check
      args:
        chdir: /opt/fastapi-tutorial
      changed_when: false

    - name: Verify the application module imports
      ansible.builtin.command:
        argv:
          - /opt/fastapi-tutorial/venv/bin/python
          - -c
          - "import app.main; print('app.main import succeeded')"
      args:
        chdir: /opt/fastapi-tutorial
      changed_when: false

    - name: Check the environment file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/.env
      register: fastapi_environment

    - name: Assert the environment file exists
      ansible.builtin.assert:
        that:
          - fastapi_environment['stat']['isreg']
        fail_msg: "The FastAPI environment file is missing."

    - name: Verify environment file settings without exposing the password
      ansible.builtin.command:
        argv:
          - grep
          - -Eq
          - '^(PROJECT_NAME="FastAPI Tutorial"|API_VERSION=1\\.0\\.0|DATABASE_URL=postgresql://fastapi:[^@]+@localhost/fastapi_db)$'
          - /opt/fastapi-tutorial/.env
      changed_when: false

    - name: Check the systemd unit
      ansible.builtin.stat:
        path: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit

    - name: Assert the systemd unit exists
      ansible.builtin.assert:
        that:
          - fastapi_unit['stat']['isreg']
        fail_msg: "The FastAPI systemd unit is missing."

    - name: Read the systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit_content

    - name: Assert the systemd unit settings
      ansible.builtin.assert:
        that:
          - "(fastapi_unit_content['content'] | b64decode) is search('^After=.*network\\.target.*postgresql\\.service$', multiline=True)"
          - "(fastapi_unit_content['content'] | b64decode) is search('^User=root$', multiline=True)"
          - "(fastapi_unit_content['content'] | b64decode) is search('^WorkingDirectory=/opt/fastapi-tutorial$', multiline=True)"
          - "(fastapi_unit_content['content'] | b64decode) is search('^Environment=\\\"PATH=/opt/fastapi-tutorial/venv/bin\\\"$', multiline=True)"
          - "(fastapi_unit_content['content'] | b64decode) is search('^ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app\\.main:app --host 0\\.0\\.0\\.0 --port 8000$', multiline=True)"
          - "(fastapi_unit_content['content'] | b64decode) is search('^Restart=always$', multiline=True)"
        fail_msg: "The FastAPI systemd unit does not contain the expected settings."

    - name: Verify systemd unit syntax
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/fastapi-tutorial.service
      changed_when: false

    - name: Assert the FastAPI service is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['fastapi-tutorial.service'] is defined
          - ansible_facts['services']['fastapi-tutorial.service']['enabled'] | bool
          - ansible_facts['services']['fastapi-tutorial.service']['state'] == 'running'
        fail_msg: "The fastapi-tutorial service is not enabled and active."

    - name: Read the PostgreSQL role
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - "SELECT rolname FROM pg_roles WHERE rolname = 'fastapi';"
      register: fastapi_role
      changed_when: false

    - name: Assert the PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - fastapi_role['stdout'] | trim == 'fastapi'
        fail_msg: "The fastapi PostgreSQL role is missing."

    - name: Read the PostgreSQL database
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - "SELECT datname FROM pg_database WHERE datname = 'fastapi_db';"
      register: fastapi_database
      changed_when: false

    - name: Assert the PostgreSQL database exists
      ansible.builtin.assert:
        that:
          - fastapi_database['stdout'] | trim == 'fastapi_db'
        fail_msg: "The fastapi_db PostgreSQL database is missing."
