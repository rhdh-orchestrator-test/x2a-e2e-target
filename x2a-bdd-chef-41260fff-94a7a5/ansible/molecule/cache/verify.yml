---
# Unsupported pre-flight checks: OS/service-unit discovery, Memcached diagnostic/configuration
# details (including threads), Memcached TCP query, Redis authentication and read/write tests,
# service logs, process listings, and Redis log-file review have no safe, explicit expected
# outcome that can be translated here without inventing implementation details or exposing secrets.
- name: Verify cache services and configuration
  hosts: all
  gather_facts: true
  tasks:
    - name: Collect service facts for Memcached and Redis checks
      ansible.builtin.service_facts:

    - name: Verify the Memcached service is enabled and active
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts['services']"
          - ansible_facts['services']['memcached.service']['status'] == 'enabled'
          - ansible_facts['services']['memcached.service']['state'] == 'running'
        fail_msg: Memcached must be enabled and active.

    - name: Verify a supported Redis service is enabled and active
      ansible.builtin.assert:
        that:
          - >-
            ('redis-server.service' in ansible_facts['services'] and
             ansible_facts['services']['redis-server.service']['status'] == 'enabled' and
             ansible_facts['services']['redis-server.service']['state'] == 'running') or
            ('redis.service' in ansible_facts['services'] and
             ansible_facts['services']['redis.service']['status'] == 'enabled' and
             ansible_facts['services']['redis.service']['state'] == 'running')
        fail_msg: Redis must be enabled and active under redis-server or redis.

    - name: Check the Memcached TCP listener
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: item_memcached_tcp_listener
      changed_when: false
      failed_when: false

    - name: Verify the Memcached TCP listener on port 11211
      ansible.builtin.assert:
        that:
          - item_memcached_tcp_listener['rc'] == 0
          - item_memcached_tcp_listener['stdout'] is search('(?:0\\.0\\.0\\.0|\\*):11211')
        fail_msg: Memcached must listen on TCP port 11211.

    - name: Check the Memcached UDP listener
      ansible.builtin.command:
        argv:
          - ss
          - -ulnp
      register: item_memcached_udp_listener
      changed_when: false
      failed_when: false

    - name: Verify the Memcached UDP listener on port 11211
      ansible.builtin.assert:
        that:
          - item_memcached_udp_listener['rc'] == 0
          - item_memcached_udp_listener['stdout'] is search('(?:0\\.0\\.0\\.0|\\*):11211')
        fail_msg: Memcached must listen on UDP port 11211.

    - name: Check the Redis TCP listener
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: item_redis_tcp_listener
      changed_when: false
      failed_when: false

    - name: Verify the Redis TCP listener on port 6379
      ansible.builtin.assert:
        that:
          - item_redis_tcp_listener['rc'] == 0
          - item_redis_tcp_listener['stdout'] is search('(?:127\\.0\\.0\\.1|0\\.0\\.0\\.0|\\*):6379')
        fail_msg: Redis must listen on TCP port 6379.

    - name: Check the Redis PID directory
      ansible.builtin.stat:
        path: /run/redis
      register: item_redis_pid_directory

    - name: Verify the Redis PID directory exists
      ansible.builtin.assert:
        that:
          - item_redis_pid_directory['stat']['exists']
          - item_redis_pid_directory['stat']['isdir']
        fail_msg: The Redis PID directory must exist at /run/redis.

    - name: Check the Redis log directory
      ansible.builtin.stat:
        path: /var/log/redis
      register: item_redis_log_directory

    - name: Verify the Redis log directory ownership and mode
      ansible.builtin.assert:
        that:
          - item_redis_log_directory['stat']['exists']
          - item_redis_log_directory['stat']['isdir']
          - item_redis_log_directory['stat']['pw_name'] == 'redis'
          - item_redis_log_directory['stat']['gr_name'] == 'redis'
          - item_redis_log_directory['stat']['mode'] == '0755'
        fail_msg: The Redis log directory must be redis:redis with mode 0755.

    - name: Verify the Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: item_redis_configuration

    - name: Assert the Redis configuration file is present
      ansible.builtin.assert:
        that:
          - item_redis_configuration['stat']['exists']
          - item_redis_configuration['stat']['isreg']
        fail_msg: The Redis configuration file must exist at /etc/redis/6379.conf.

    - name: Check for a redacted Redis password directive
      ansible.builtin.command:
        argv:
          - awk
          - $1 == "requirepass" { print $1 " <redacted>" }
          - /etc/redis/6379.conf
      register: item_redis_password_directive
      changed_when: false
      failed_when: false

    - name: Verify the Redis password directive is configured without revealing it
      ansible.builtin.assert:
        that:
          - item_redis_password_directive['rc'] == 0
          - item_redis_password_directive['stdout'] is search('^requirepass <redacted>$')
        fail_msg: A Redis requirepass directive must be present.

    - name: Check for removed Redis replication directives
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)
          - /etc/redis/6379.conf
      register: item_redis_removed_directives
      changed_when: false
      failed_when: false

    - name: Verify unwanted Redis replication directives are absent
      ansible.builtin.assert:
        that:
          - item_redis_removed_directives['rc'] == 1
        fail_msg: Unwanted Redis replication directives must be absent.
