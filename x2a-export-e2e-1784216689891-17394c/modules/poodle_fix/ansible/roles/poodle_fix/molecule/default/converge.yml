- name: Converge
  hosts: all
  gather_facts: true
  vars:
    apache_config_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    restart_apache: false
    restart_ssh: false
    username: test_user
    password: test_password
    ssl_protocol_setting: -all +TLSv1.2
  tasks:
  - name: Create directory structure for Apache config
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create mock Apache SSL config file
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        SSLProtocol all -SSLv3

        SSLCipherSuite HIGH:!aNULL:!MD5

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Validate credential variables
    ansible.builtin.assert:
      that:
      - username is defined
      - password is defined
      fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template.
      quiet: true
  - name: Fix SSL in Apache
    ansible.builtin.replace:
      dest: '{{ apache_config_path }}'
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol {{ ssl_protocol_setting }}
      mode: '0644'
