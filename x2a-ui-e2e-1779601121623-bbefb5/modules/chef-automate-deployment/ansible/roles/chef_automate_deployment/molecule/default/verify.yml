- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: admin
    org_short_name: org
  tasks:
  - name: Check hostname configuration
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is correctly set
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname is not set correctly
      success_msg: Hostname is set correctly
    when: hostname_file.stat.exists
  - name: Check vm.max_map_count parameter
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_file
  - name: Assert vm.max_map_count file exists
    ansible.builtin.assert:
      that:
      - max_map_count_file.stat.exists
      - max_map_count_file.stat.isreg
      fail_msg: vm.max_map_count file not found
      success_msg: vm.max_map_count file exists
  - name: Get vm.max_map_count content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_content
    when: max_map_count_file.stat.exists
  - name: Assert vm.max_map_count is correctly set
    ansible.builtin.assert:
      that:
      - (max_map_count_content.content | b64decode | trim) == "262144"
      fail_msg: vm.max_map_count is not set correctly
      success_msg: vm.max_map_count is set correctly
    when: max_map_count_file.stat.exists
  - name: Check vm.dirty_expire_centisecs parameter
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_file
  - name: Assert vm.dirty_expire_centisecs file exists
    ansible.builtin.assert:
      that:
      - dirty_expire_centisecs_file.stat.exists
      - dirty_expire_centisecs_file.stat.isreg
      fail_msg: vm.dirty_expire_centisecs file not found
      success_msg: vm.dirty_expire_centisecs file exists
  - name: Get vm.dirty_expire_centisecs content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_content
    when: dirty_expire_centisecs_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is correctly set
    ansible.builtin.assert:
      that:
      - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
      fail_msg: vm.dirty_expire_centisecs is not set correctly
      success_msg: vm.dirty_expire_centisecs is set correctly
    when: dirty_expire_centisecs_file.stat.exists
  - name: Check Chef Automate CLI
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.isreg
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate deployment status
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate-deploy-status
    register: deploy_status_file
  - name: Assert deployment status file exists
    ansible.builtin.assert:
      that:
      - deploy_status_file.stat.exists
      - deploy_status_file.stat.isreg
      fail_msg: Deployment status file not found
      success_msg: Deployment status file exists
  - name: Get deployment status content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/tmp/chef-automate-deploy-status
    register: deploy_status_content
    when: deploy_status_file.stat.exists
  - name: Assert deployment was successful
    ansible.builtin.assert:
      that:
      - '''Success!'' in (deploy_status_content.content | b64decode)'
      fail_msg: Chef Automate deployment was not successful
      success_msg: Chef Automate deployment was successful
    when: deploy_status_file.stat.exists
  - name: Check user PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/{{ username }}.pem
    register: user_pem_file
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem_file.stat.exists
      - user_pem_file.stat.isreg
      - user_pem_file.stat.mode == "0600"
      fail_msg: User PEM file not found or has incorrect permissions
      success_msg: User PEM file exists with correct permissions
  - name: Check organization validator PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/{{ org_short_name }}-validator.pem
    register: org_validator_pem_file
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_validator_pem_file.stat.exists
      - org_validator_pem_file.stat.isreg
      - org_validator_pem_file.stat.mode == "0600"
      fail_msg: Organization validator PEM file not found or has incorrect permissions
      success_msg: Organization validator PEM file exists with correct permissions
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: chef_automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - chef_automate_status.rc == 0
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: chef_server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - chef_server_status.rc == 0
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Check Web UI accessibility
    ansible.builtin.uri:
      url: https://localhost/
      validate_certs: false
    register: web_ui_check
    failed_when: false
    tags: molecule-notest
  - name: Assert Web UI is accessible
    ansible.builtin.assert:
      that:
      - web_ui_check.status == 200
      fail_msg: Chef Automate Web UI is not accessible
      success_msg: Chef Automate Web UI is accessible
    tags: molecule-notest
  - name: Check status endpoint
    ansible.builtin.uri:
      url: https://localhost/_status
      validate_certs: false
    register: status_check
    failed_when: false
    tags: molecule-notest
  - name: Assert status endpoint is accessible
    ansible.builtin.assert:
      that:
      - status_check.status == 200
      fail_msg: Chef Automate status endpoint is not accessible
      success_msg: Chef Automate status endpoint is accessible
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check.state == "started"
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
