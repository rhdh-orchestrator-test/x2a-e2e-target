- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_max_map_count }}'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '{{ chef_automate_vm_dirty_expire_centisecs }}'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment status file
    ansible.builtin.copy:
      content: 'Chef Automate deployment status:

        - Products: {{ chef_automate_products | join('', '') }}

        - Terms accepted: {{ chef_automate_accept_terms_and_mlsa }}

        - Status: Success!

        '
      dest: /tmp/molecule_test/tmp/chef-automate-deploy-status
      mode: '0644'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu1SU1LfVLPHCozMxH2Mo4lgOEePzNm0tRgeLezV6ffAt0hyc

        (mock user PEM content)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/tmp/{{ username }}.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu1SU1LfVLPHCozMxH2Mo4lgOEePzNm0tRgeLezV6ffAt0hyc

        (mock organization validator PEM content)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/tmp/{{ org_short_name }}-validator.pem
      mode: '0600'
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_accept_terms_and_mlsa: true
    chef_automate_products:
    - automate
    - infra-server
    username: admin
    org_short_name: org
