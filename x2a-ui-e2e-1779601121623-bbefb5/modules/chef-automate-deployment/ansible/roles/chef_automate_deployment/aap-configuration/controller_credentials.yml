---
controller_credentials:
- name: Chef Automate Admin User - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Automate Admin User
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
- name: Chef Organization - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Organization
  update_secrets: true
  inputs:
    org_short_name: '{{ org_short_name }}'
    org_full_name: '{{ org_full_name }}'
