# Variables for Chef Automate deployment
# These variables are set from the source script
# In production, these should be provided via AAP credentials

# Note: The following variables are now provided by AAP credentials:
# - username: Admin username for Chef Automate/Infra Server
# - full_name: Full name of the admin user
# - email: Email address of the admin user
# - password: Password for the admin user
# - org_short_name: Short name for the organization
# - org_full_name: Full name of the organization