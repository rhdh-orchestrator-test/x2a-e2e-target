---
- name: Wait for Chef Infra Server to be ready
  ansible.builtin.command:
    cmd: chef-server-ctl status
  register: chef_server_status
  until: chef_server_status.rc == 0
  retries: 10
  delay: 30
  changed_when: false
  become: true
  tags: molecule-notest
- name: Create admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ username | default(chef_automate_username) }}  "{{ full_name | default(chef_automate_longusername) }}"  {{ email | default(chef_automate_useremail)
      }}  "{{ password | default(chef_automate_userpassword) }}"  --filename {{ chef_automate_user_pem_path }}

      '
  args:
    creates: "{{ chef_automate_user_pem_path }}"
  become: true
  no_log: true
- name: Create organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_automate_orgname }}  "{{ chef_automate_longorgname }}"  --association_user {{ username | default(chef_automate_username)
      }}  --filename {{ chef_automate_org_pem_path }}

      '
  args:
    creates: "{{ chef_automate_org_pem_path }}"
  become: true
