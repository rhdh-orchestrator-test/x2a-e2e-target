---
argument_specs:
  main:
    short_description: Configure nginx with multiple SSL-enabled subdomains
    description:
      - Installs and configures nginx, security controls, TLS certificates, and data-driven virtual hosts.
    options:
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory containing site certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory containing site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban protection is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks handling credentials.
      nginx_sites:
        type: dict
        required: false
        default: {}
        description: Mapping of virtual host names to site configuration dictionaries.
      site_token:
        type: str
        required: true
        description: Site token injected by an AAP credential type.
      private_key:
        type: str
        required: true
        description: Private key material injected by an AAP credential type.
