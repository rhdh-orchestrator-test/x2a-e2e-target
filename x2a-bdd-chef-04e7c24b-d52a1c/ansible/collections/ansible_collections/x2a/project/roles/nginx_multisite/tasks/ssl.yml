---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_certificate_path }}"  # noqa: R114 - path from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}"  # noqa: R114 - path from role defaults
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Install supplied private key for SSL sites  # noqa: L039 - private key is supplied as a role parameter
  ansible.builtin.copy:
    content: "{{ private_key }}"
    dest: "{{ nginx_multisite_private_key_path }}/{{ item_ssl_site['value']['id'] }}.key" # noqa: R114 - path from role-defined nginx_sites data
    owner: root
    group: ssl-cert
    mode: "0640"
    backup: true
  when:
    - item_ssl_site['value']['ssl_enabled'] | bool
    - private_key | length > 0
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Generate certificates for supplied private keys  # noqa: L039 - private key is supplied as a role parameter
  ansible.builtin.command:  # noqa: R101 - command paths come from role defaults and role-defined site data
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -new
      - -key
      - "{{ nginx_multisite_private_key_path }}/{{ item_ssl_site['value']['id'] }}.key"
      - -out
      - "{{ nginx_multisite_certificate_path }}/{{ item_ssl_site['value']['id'] }}.crt"
      - -subj
      - "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl_site['value']['id'] }}/emailAddress=admin@example.com"
    creates: "{{ nginx_multisite_certificate_path }}/{{ item_ssl_site['value']['id'] }}.crt"
  when:
    - item_ssl_site['value']['ssl_enabled'] | bool
    - private_key | length > 0
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  notify: Reload nginx
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Generate self-signed certificates for SSL sites  # noqa: L039 - private key is supplied as a role parameter
  ansible.builtin.shell:  # noqa: R101 - command paths come from role defaults and role-defined site data
    cmd: |
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        -keyout "{{ nginx_multisite_private_key_path }}/{{ item_ssl_site['value']['id'] }}.key" \
        -out "{{ nginx_multisite_certificate_path }}/{{ item_ssl_site['value']['id'] }}.crt" \
        -subj "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl_site['value']['id'] }}/emailAddress=admin@example.com"
      chmod 0640 "{{ nginx_multisite_private_key_path }}/{{ item_ssl_site['value']['id'] }}.key"
      chown root:ssl-cert "{{ nginx_multisite_private_key_path }}/{{ item_ssl_site['value']['id'] }}.key"
    creates: "{{ nginx_multisite_certificate_path }}/{{ item_ssl_site['value']['id'] }}.crt"
  when:
    - item_ssl_site['value']['ssl_enabled'] | bool
    - private_key | length == 0
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  notify: Reload nginx
  no_log: "{{ nginx_multisite_secure_logging }}"
