---
controller_credentials:
  - name: Chef Encrypted Data Bag Nginx Site Token - nginx_multisite
    description: Secret token stored in the Chef encrypted data bag nginx_secrets, item site, and deployed for nginx site-related use.
    organization: Default
    credential_type: Chef Encrypted Data Bag Nginx Site Token
    update_secrets: true
    inputs:
      site_token: "{{ vault_site_token }}"
  - name: Nginx TLS Private Key - nginx_multisite
    description: TLS private key material used by nginx HTTPS virtual hosts; currently generated locally as a self-signed development key and intended for 
      secure external delivery or managed certificate integration in production.
    organization: Default
    credential_type: Nginx TLS Private Key
    update_secrets: true
    inputs:
      private_key: "{{ vault_private_key }}"
