---
controller_credential_types:
  - name: Chef Encrypted Data Bag Nginx Site Token
    description: Secret token stored in the Chef encrypted data bag nginx_secrets, item site, and deployed for nginx site-related use.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Nginx Site Token
          secret: true
          help_text: Secret token used by the nginx site configuration and stored with restrictive permissions.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
  - name: Nginx TLS Private Key
    description: TLS private key material used by nginx HTTPS virtual hosts; currently generated locally as a self-signed development key and intended for 
      secure external delivery or managed certificate integration in production.
    kind: cloud
    inputs:
      fields:
        - id: private_key
          type: string
          label: TLS Private Key
          secret: true
          help_text: Private key for an nginx TLS-enabled site, corresponding to the certificate configured for the virtual host.
      required:
        - private_key
    injectors:
      extra_vars:
        private_key: !unsafe "{{ private_key }}"
