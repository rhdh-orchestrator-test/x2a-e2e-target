---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - openssh-server
      - ufw
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Deploy fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  notify: Restart fail2ban
  when: nginx_multisite_fail2ban_enabled | bool

- name: Check UFW status
  ansible.builtin.command:
    argv:
      - ufw
      - status
  register: nginx_multisite_ufw_status
  changed_when: false
  failed_when: false
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default incoming policy
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  changed_when: false
  failed_when: nginx_multisite_ufw_default.rc != 0
  register: nginx_multisite_ufw_default
  when: nginx_multisite_ufw_enabled | bool

- name: Allow SSH through UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - ssh
  changed_when: true
  failed_when: nginx_multisite_ufw_ssh.rc != 0
  register: nginx_multisite_ufw_ssh
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"  # noqa: L039 - registered by the preceding UFW status task

- name: Allow HTTP through UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - http
  changed_when: true
  failed_when: nginx_multisite_ufw_http.rc != 0
  register: nginx_multisite_ufw_http
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"  # noqa: L039 - registered by the preceding UFW status task

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - https
  changed_when: true
  failed_when: nginx_multisite_ufw_https.rc != 0
  register: nginx_multisite_ufw_https
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"  # noqa: L039 - registered by the preceding UFW status task

- name: Enable UFW
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - enable
  changed_when: true
  failed_when: nginx_multisite_ufw_enable.rc != 0
  register: nginx_multisite_ufw_enable
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Status: inactive' in nginx_multisite_ufw_status.stdout"  # noqa: L039 - registered by the preceding UFW status task

- name: Deploy kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Check SSH daemon configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    create: false
    backup: true
  when:
    - nginx_multisite_disable_root_login
    - nginx_multisite_sshd_config.stat.exists  # noqa: L039 - registered by the preceding SSH stat task
  notify: Restart SSH daemon

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    create: false
    backup: true
  when:
    - not nginx_multisite_password_authentication
    - nginx_multisite_sshd_config.stat.exists  # noqa: L039 - registered by the preceding SSH stat task
  notify: Restart SSH daemon
