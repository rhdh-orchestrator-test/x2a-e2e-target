---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload security sysctl  # noqa: L039 - loop variable is defined by this handler's loop
  ansible.posix.sysctl:
    name: "{{ item_handler_sysctl['key'] }}"
    value: "{{ item_handler_sysctl['value'] }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-security.conf
    reload: true
  loop:
    - key: net.ipv4.conf.default.rp_filter
      value: "1"
    - key: net.ipv4.conf.all.rp_filter
      value: "1"
    - key: net.ipv4.conf.all.accept_redirects
      value: "0"
    - key: net.ipv6.conf.all.accept_redirects
      value: "0"
  loop_control:
    loop_var: item_handler_sysctl

- name: Restart SSH daemon
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
