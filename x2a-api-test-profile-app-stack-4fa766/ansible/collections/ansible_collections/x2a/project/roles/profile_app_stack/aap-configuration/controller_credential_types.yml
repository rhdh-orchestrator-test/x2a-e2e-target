---
controller_credential_types:
  - name: Application Stack Secrets
    description: Sensitive values used by the test-app application for PostgreSQL authentication and application signing/secret-key configuration. The migration
      plan identifies these values as plaintext or encrypted Puppet/Hiera data that must be moved to Ansible Vault or an external secret backend.
    kind: cloud
    inputs:
      fields:
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the test-app PostgreSQL database user.
        - id: secret_key
          type: string
          label: Application Secret Key
          secret: true
          help_text: Application runtime secret key used by test-app for secure application configuration and signing.
      required:
        - db_password
        - secret_key
    injectors:
      extra_vars:
        db_password: !unsafe "{{ db_password }}"
        secret_key: !unsafe "{{ secret_key }}"
