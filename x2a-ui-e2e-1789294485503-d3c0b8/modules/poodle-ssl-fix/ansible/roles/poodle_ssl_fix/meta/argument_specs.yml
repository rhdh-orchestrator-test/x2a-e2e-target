---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache
    description:
      - Installs Apache web server if not already present.
      - Fixes the POODLE SSL vulnerability by configuring Apache to use only TLSv1.2 protocol.
      - Modifies Apache SSL configuration to disable vulnerable protocols.
      - Restarts Apache and SSH services after configuration changes.
    options:
      apache_ssl_config_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file.
      ssl_protocols:
        type: str
        required: false
        default: -all +TLSv1.2
        description: SSL protocols to enable/disable for POODLE vulnerability fix.
      restart_services:
        type: list
        elements: str
        required: false
        default:
          - apache2
          - sshd
        description: List of services to restart after SSL configuration change.
