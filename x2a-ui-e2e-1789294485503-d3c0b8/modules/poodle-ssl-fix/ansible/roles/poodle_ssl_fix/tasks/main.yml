---
- name: Install Apache web server
  ansible.builtin.package:
    name: apache2
    state: present
  become: true
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: "{{ apache_ssl_config_path }}"
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol {{ ssl_protocols }}
    backup: true
  become: true
  notify:
    - Restart apache
    - Restart sshd
