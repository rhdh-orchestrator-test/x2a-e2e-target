---
profile_redis_cluster_redis_port: 6379
profile_redis_cluster_maxmemory_mb: 2048
profile_redis_cluster_maxmemory_policy: allkeys-lru
profile_redis_cluster_bind: 0.0.0.0
profile_redis_cluster_appendonly: true
profile_redis_cluster_appendfsync: everysec
profile_redis_cluster_manage_package: true
profile_redis_cluster_manage_service: true
profile_redis_cluster_service_manage: true
profile_redis_cluster_service_ensure: running
profile_redis_cluster_service_enable: true
profile_redis_cluster_manage_repo: false
profile_redis_cluster_ulimit_managed: true
profile_redis_cluster_ulimit: 65536
profile_redis_cluster_default_install: true
profile_redis_cluster_dnf_module_stream: ""
profile_redis_cluster_notify_service: true
