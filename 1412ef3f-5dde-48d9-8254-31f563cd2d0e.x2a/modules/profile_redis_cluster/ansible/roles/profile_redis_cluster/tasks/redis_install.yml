---
- name: Include DNF module configuration
  ansible.builtin.include_tasks: dnfmodule.yml
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - profile_redis_cluster_dnf_module_stream | length > 0
- name: Install Redis package
  ansible.builtin.package:
    name: redis
    state: present
  when: profile_redis_cluster_manage_package | bool
