---
- name: Manage Redis service
  ansible.builtin.service:
    name: "{{ 'redis-server' if ansible_facts['os_family'] == 'Debian' else 'redis' }}"
    state: "{{ profile_redis_cluster_service_ensure }}"
    enabled: "{{ profile_redis_cluster_service_enable }}"
  when: profile_redis_cluster_service_manage | bool
