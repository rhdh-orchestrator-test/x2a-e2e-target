---
argument_specs:
  main:
    short_description: Configure the FastAPI tutorial application with PostgreSQL
    description:
      - Deploys the FastAPI tutorial repository and Python virtual environment.
      - Installs PostgreSQL dependencies and configures the application database.
    options:
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git branch, tag, or commit to deploy.
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_venv_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_env_file:
        type: str
        required: false
        default: /opt/fastapi-tutorial/.env
        description: Application environment file path.
      fastapi_tutorial_service_file:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Systemd unit file path.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: FastAPI systemd service name.
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: Operating system user running the FastAPI service.
      fastapi_tutorial_api_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by the FastAPI application.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output when handling database credentials.
      database_username:
        type: str
        required: true
        description: PostgreSQL username injected by an AAP credential type.
      database_password:
        type: str
        required: true
        description: PostgreSQL password injected by an AAP credential type.
      database_name:
        type: str
        required: true
        description: PostgreSQL database name injected by an AAP credential type.
