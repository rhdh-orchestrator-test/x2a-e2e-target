---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the fastapi PostgreSQL user and fastapi_db database used by the FastAPI application.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL username used by the FastAPI application; the migration identifies this as fastapi.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL user; migrate the hardcoded value to an AAP credential or Ansible Vault.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application; the migration identifies this as fastapi_db.
      required:
        - database_username
        - database_password
        - database_name
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_name: !unsafe "{{ database_name }}"
