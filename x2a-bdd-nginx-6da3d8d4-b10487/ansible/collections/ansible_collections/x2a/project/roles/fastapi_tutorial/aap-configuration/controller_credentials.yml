---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials for the fastapi PostgreSQL user and fastapi_db database used by the FastAPI application.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      database_username: "{{ database_username }}"
      database_password: "{{ vault_database_password }}"
      database_name: "{{ database_name }}"
