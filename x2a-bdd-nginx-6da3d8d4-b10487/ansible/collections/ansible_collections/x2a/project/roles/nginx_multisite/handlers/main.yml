---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload security sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

- name: Restart SSH on Debian-family systems
  ansible.builtin.service:
    name: ssh
    state: restarted
  when: ansible_facts.os_family == 'Debian'

- name: Restart SSH on RedHat-family systems
  ansible.builtin.service:
    name: sshd
    state: restarted
  when: ansible_facts.os_family == 'RedHat'

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
