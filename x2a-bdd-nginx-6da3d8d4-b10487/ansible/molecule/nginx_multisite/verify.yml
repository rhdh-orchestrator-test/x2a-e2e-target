# Unsupported pre-flight checks: HTTP/TLS curl responses, exact file contents and permissions,
# symlink targets, certificate subject/date values, detailed service status output, journal logs,
# and lsof diagnostics have no stated expected result suitable for a deterministic assertion.
---
- name: Verify nginx multisite pre-flight checks
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        fail_msg: "Required package is not installed"
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify nginx service is enabled and active
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts['services']"
          - ansible_facts['services']['nginx.service']['enabled'] == 'enabled'
          - ansible_facts['services']['nginx.service']['state'] == 'running'
        fail_msg: "The nginx service is not enabled and active"

    - name: Verify fail2ban service is enabled and active
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts['services']"
          - ansible_facts['services']['fail2ban.service']['enabled'] == 'enabled'
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'
        fail_msg: "The fail2ban service is not enabled and active"

    - name: Verify nginx configuration syntax
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_syntax
      changed_when: false
      failed_when: false

    - name: Assert nginx configuration syntax is valid
      ansible.builtin.assert:
        that:
          - item_nginx_syntax['rc'] == 0
        fail_msg: "Nginx configuration syntax validation failed"

    - name: Check required files and directories
      ansible.builtin.stat:
        path: "{{ item_path }}"
        follow: false
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /opt/server/test
        - /opt/server/test/index.html
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_path
      register: item_required_files

    - name: Assert required files and directories exist
      ansible.builtin.assert:
        that:
          - item_required_file['stat']['exists']
        fail_msg: "A required pre-flight path is missing"
      loop: "{{ item_required_files['results'] }}"
      loop_control:
        loop_var: item_required_file

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_site_link }}"
        follow: false
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_site_link
      register: item_site_links

    - name: Assert enabled site links exist
      ansible.builtin.assert:
        that:
          - item_site_link_result['stat']['exists']
          - item_site_link_result['stat']['islnk']
        fail_msg: "A required enabled-site link is missing"
      loop: "{{ item_site_links['results'] }}"
      loop_control:
        loop_var: item_site_link_result

    - name: Verify the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
        follow: false
      register: item_default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_site['stat']['exists']
        fail_msg: "The default nginx site still exists"

    - name: Verify TLS certificates can be parsed
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate }}"
          - -noout
          - -subject
          - -dates
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_certificate
      changed_when: false
      register: item_certificate_checks
      failed_when: false

    - name: Assert TLS certificate checks succeed
      ansible.builtin.assert:
        that:
          - item_certificate_check['rc'] == 0
        fail_msg: "A configured TLS certificate could not be parsed"
      loop: "{{ item_certificate_checks['results'] }}"
      loop_control:
        loop_var: item_certificate_check

    - name: Verify UFW required policy and allowances
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: item_ufw_status
      changed_when: false
      failed_when: false

    - name: Assert UFW denies by default and includes required ports
      ansible.builtin.assert:
        that:
          - item_ufw_status['rc'] == 0
          - "'Default: deny' in item_ufw_status['stdout']"
          - item_ufw_status['stdout'] is search('22')
          - item_ufw_status['stdout'] is search('80')
          - item_ufw_status['stdout'] is search('443')
        fail_msg: "UFW does not show the required default policy and allowances"

    - name: Verify SSH root-login hardening
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - ^[[:space:]]*PermitRootLogin[[:space:]]+no
          - /etc/ssh/sshd_config
      changed_when: false
      register: item_root_login_check
      failed_when: false

    - name: Assert SSH root-login hardening is present
      ansible.builtin.assert:
        that:
          - item_root_login_check['rc'] == 0
        fail_msg: "PermitRootLogin no was not found"

    - name: Verify SSH password-authentication hardening
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - ^[[:space:]]*PasswordAuthentication[[:space:]]+no
          - /etc/ssh/sshd_config
      changed_when: false
      register: item_password_auth_check
      failed_when: false

    - name: Assert SSH password-authentication hardening is present
      ansible.builtin.assert:
        that:
          - item_password_auth_check['rc'] == 0
        fail_msg: "PasswordAuthentication no was not found"

    - name: Verify SSH configuration syntax
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false
      register: item_sshd_syntax
      failed_when: false

    - name: Assert SSH configuration syntax is valid
      ansible.builtin.assert:
        that:
          - item_sshd_syntax['rc'] == 0
        fail_msg: "SSH configuration syntax validation failed"

    - name: Verify sysctl security configuration can be applied
      ansible.builtin.command:
        argv:
          - sysctl
          - -p
          - /etc/sysctl.d/99-security.conf
      changed_when: false
      register: item_sysctl_check
      failed_when: false

    - name: Assert sysctl security configuration check succeeds
      ansible.builtin.assert:
        that:
          - item_sysctl_check['rc'] == 0
        fail_msg: "The sysctl security configuration could not be applied"

    - name: Verify HTTP and HTTPS listeners
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      changed_when: false
      register: item_listener_check
      failed_when: false

    - name: Assert HTTP and HTTPS ports are listening
      ansible.builtin.assert:
        that:
          - item_listener_check['rc'] == 0
          - item_listener_check['stdout'] is search(':80')
          - item_listener_check['stdout'] is search(':443')
        fail_msg: "HTTP and HTTPS listeners were not found"
