---
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - username is defined
      - password is defined
      - full_name is defined
      - email is defined
      - user_key_file is defined
      - org_name is defined
      - org_full_name is defined
      - org_validator_key is defined
      - automate_admin_username is defined
      - automate_admin_password is defined
    fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template.
    quiet: true
