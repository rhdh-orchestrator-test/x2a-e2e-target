---
- name: Ensure directories for key files exist
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user.key_file }}"
    - "{{ chef_automate_org.validator_key }}"
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_user.name }} {{ chef_automate_user.full_name }} {{ chef_automate_user.email }} "{{
      chef_automate_user.password }}" --filename {{ chef_automate_user.key_file }}
  args:
    creates: "{{ chef_automate_user.key_file }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org.name }} "{{ chef_automate_org.full_name }}" --association_user {{ chef_automate_user.name }} --filename
      {{ chef_automate_org.validator_key }}
  args:
    creates: "{{ chef_automate_org.validator_key }}"
  become: true
