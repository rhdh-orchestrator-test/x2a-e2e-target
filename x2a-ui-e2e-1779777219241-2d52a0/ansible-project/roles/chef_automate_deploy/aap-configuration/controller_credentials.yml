---
controller_credentials:
- name: Chef Admin User Credentials - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef Admin User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
- name: Chef User Key File - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef User Key File
  update_secrets: true
  inputs:
    user_key_file: '{{ vault_user_key_file }}'
- name: Chef Organization Validator Key - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef Organization Validator Key
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
    org_validator_key: '{{ vault_org_validator_key }}'
- name: Chef Automate Credentials - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef Automate Credentials
  update_secrets: true
  inputs:
    automate_admin_username: '{{ automate_admin_username }}'
    automate_admin_password: '{{ vault_automate_admin_password }}'
