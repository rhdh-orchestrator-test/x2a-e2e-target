---
controller_credential_types:
- name: Chef Admin User Credentials
  description: Credential type for Chef Admin User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef admin username (e.g., 'jtonello')
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef admin user
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the Chef admin user (e.g., 'John Tonello')
    - id: email
      type: string
      label: Email
      help_text: Email address of the Chef admin user (e.g., 'jtonello@chef.lab')
    required:
    - username
    - password
    - full_name
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
- name: Chef User Key File
  description: Credential type for Chef User Key File
  kind: cloud
  inputs:
    fields:
    - id: user_key_file
      type: string
      label: User Key File
      secret: true
      help_text: Authentication key file for the Chef admin user (e.g., 'jtonello.pem')
    required:
    - user_key_file
  injectors:
    extra_vars:
      user_key_file: !unsafe '{{ user_key_file }}'
- name: Chef Organization Validator Key
  description: Credential type for Chef Organization Validator Key
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization (e.g., 'lab')
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full name for the Chef organization (e.g., 'Chef Lab')
    - id: org_validator_key
      type: string
      label: Organization Validator Key
      secret: true
      help_text: Authentication key for the Chef organization (e.g., 'lab-validator.pem')
    required:
    - org_name
    - org_full_name
    - org_validator_key
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
      org_validator_key: !unsafe '{{ org_validator_key }}'
- name: Chef Automate Credentials
  description: Credential type for Chef Automate Credentials
  kind: cloud
  inputs:
    fields:
    - id: automate_admin_username
      type: string
      label: Automate Admin Username
      help_text: Username for Chef Automate web UI
    - id: automate_admin_password
      type: string
      label: Automate Admin Password
      secret: true
      help_text: Password for Chef Automate web UI
    required:
    - automate_admin_username
    - automate_admin_password
  injectors:
    extra_vars:
      automate_admin_username: !unsafe '{{ automate_admin_username }}'
      automate_admin_password: !unsafe '{{ automate_admin_password }}'
