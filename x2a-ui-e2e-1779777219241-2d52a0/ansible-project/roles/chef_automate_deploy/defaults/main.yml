---
chef_automate_hostname: automate.chef.lab
chef_automate_kernel_params:
  - name: vm.max_map_count
    value: "262144"
  - name: vm.dirty_expire_centisecs
    value: "20000"
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: /tmp/chef-automate
chef_automate_accept_terms: true
chef_automate_products:
  - automate
  - infra-server
chef_automate_user:
  name: "{{ username | default('chef-admin') }}"
  full_name: "{{ full_name | default('Chef Administrator') }}"
  email: "{{ email | default('admin@example.com') }}"
  password: "{{ password | default('changeme') }}"
  key_file: "{{ user_key_file | default('/tmp/chef-user.pem') }}"
chef_automate_org:
  name: "{{ org_name | default('chef-org') }}"
  full_name: "{{ org_full_name | default('Chef Organization') }}"
  validator_key: "{{ org_validator_key | default('/tmp/chef-validator.pem') }}"
chef_automate_admin:
  username: "{{ automate_admin_username | default('admin') }}"
  password: "{{ automate_admin_password | default('changeme') }}"
