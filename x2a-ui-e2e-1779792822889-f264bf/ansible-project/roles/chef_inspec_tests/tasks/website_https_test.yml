---
- name: Check if port 443 is listening
  ansible.builtin.wait_for:
    port: "{{ https_port }}"
    state: started
    timeout: 5
  register: port_check
  ignore_errors: true
  tags:
    - molecule-notest
- name: Fail if port 443 is not listening
  ansible.builtin.fail:
    msg: "FAILED: Port {{ https_port }} is not listening"
  when: port_check is failed
  tags:
    - molecule-notest
- name: Check HTTPS status code
  ansible.builtin.uri:
    url: https://{{ https_host }}/
    validate_certs: false
    return_content: true
  register: https_response
  ignore_errors: true
  tags:
    - molecule-notest
- name: Verify HTTPS status code is 200
  ansible.builtin.fail:
    msg: "FAILED: HTTPS status code is not 200 (got {{ https_response.status }})"
  when:
    - https_response is succeeded
    - https_response.status != https_expected_status
  tags:
    - molecule-notest
- name: Verify HTTPS response contains expected content
  ansible.builtin.fail:
    msg: "FAILED: HTTPS response does not contain expected content"
  when:
    - https_response is succeeded
    - https_expected_content not in https_response.content
  tags:
    - molecule-notest
- name: Check SSL3 protocol (should be disabled)
  ansible.builtin.shell:
    cmd: set -o pipefail && echo | openssl s_client -connect {{ https_host }}:{{ https_port }} -ssl3 2>&1 || echo 'SSL3 disabled (good)'
    executable: /bin/bash
  register: ssl3_check
  changed_when: false
  tags:
    - molecule-notest
- name: Fail if SSL3 is enabled
  ansible.builtin.fail:
    msg: "FAILED: SSL3 protocol is enabled (should be disabled)"
  when: "'SSL3 disabled (good)' not in ssl3_check.stdout and 'ssl3 alert handshake failure' not in ssl3_check.stdout"
  tags:
    - molecule-notest
- name: Check TLS 1.2 protocol (should be enabled)
  ansible.builtin.shell:
    cmd: set -o pipefail && echo | openssl s_client -connect {{ https_host }}:{{ https_port }} -tls1_2 2>&1
    executable: /bin/bash
  register: tls12_check
  changed_when: false
  ignore_errors: true
  tags:
    - molecule-notest
- name: Fail if TLS 1.2 is disabled
  ansible.builtin.fail:
    msg: "FAILED: TLS 1.2 protocol is disabled (should be enabled)"
  when: tls12_check is failed or 'BEGIN CERTIFICATE' not in tls12_check.stdout
  tags:
    - molecule-notest
- name: Report HTTPS website test results
  ansible.builtin.debug:
    msg: "PASSED: HTTPS website security tests - Port {{ https_port }} is listening - Status code is {{ https_expected_status }} - Response contains expected content
      - SSL3 is disabled - TLS 1.2 is enabled "
  when:
    - port_check is succeeded
    - https_response is succeeded
    - https_response.status == https_expected_status
    - https_expected_content in https_response.content
    - "'SSL3 disabled (good)' in ssl3_check.stdout or 'ssl3 alert handshake failure' in ssl3_check.stdout"
    - tls12_check is succeeded
    - "'BEGIN CERTIFICATE' in tls12_check.stdout"
  tags:
    - molecule-notest
