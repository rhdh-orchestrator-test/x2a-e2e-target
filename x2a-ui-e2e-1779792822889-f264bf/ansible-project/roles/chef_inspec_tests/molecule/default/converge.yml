---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create test directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/ssh
        - /tmp/molecule_test/var/www/html

    # Create a mock sshd_config file for testing
    - name: Create mock sshd_config file
      ansible.builtin.copy:
        content: |
          # Mock sshd_config for testing
          Protocol 2
          HostKey /etc/ssh/ssh_host_rsa_key
          HostKey /etc/ssh/ssh_host_ecdsa_key
          HostKey /etc/ssh/ssh_host_ed25519_key
          SyslogFacility AUTHPRIV
          PermitRootLogin no
          PasswordAuthentication yes
          ChallengeResponseAuthentication no
          GSSAPIAuthentication yes
          GSSAPICleanupCredentials no
          UsePAM yes
          X11Forwarding yes
          PrintMotd no
          AcceptEnv LANG LC_CTYPE LC_NUMERIC LC_TIME LC_COLLATE LC_MONETARY LC_MESSAGES
          AcceptEnv LC_PAPER LC_NAME LC_ADDRESS LC_TELEPHONE LC_MEASUREMENT
          AcceptEnv LC_IDENTIFICATION LC_ALL LANGUAGE
          AcceptEnv XMODIFIERS
          Subsystem sftp /usr/libexec/openssh/sftp-server
        dest: /tmp/molecule_test/etc/ssh/sshd_config
        mode: "0644"

    # Create a mock HTML file for testing
    - name: Create mock HTML file
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>Test Page</title>
          </head>
          <body>
            <h1>Hello, world!</h1>
            <p>This is a test page for molecule testing.</p>
          </body>
          </html>
        dest: /tmp/molecule_test/var/www/html/index.html
        mode: "0644"

    # Create a mock package facts file to simulate openssh-server installation
    - name: Create mock package facts
      ansible.builtin.copy:
        content: |
          {
            "packages": {
              "openssh-server": [
                {
                  "version": "8.0p1",
                  "source": "rpm",
                  "arch": "x86_64",
                  "name": "openssh-server"
                }
              ]
            }
          }
        dest: /tmp/molecule_test/package_facts.json
        mode: "0644"