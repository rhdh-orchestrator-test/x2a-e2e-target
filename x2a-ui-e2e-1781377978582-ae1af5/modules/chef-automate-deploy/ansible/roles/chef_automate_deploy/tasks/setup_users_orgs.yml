---
- name: Set user variables
  ansible.builtin.set_fact:
    chef_user_name: "{{ username | default(chef_automate_default_username) }}"
    chef_user_full_name: "{{ full_name | default(chef_automate_default_full_name) }}"
    chef_user_email: "{{ email | default(chef_automate_default_email) }}"
    chef_user_password: "{{ password | default(chef_automate_default_password) }}"
    chef_org_name: "{{ org_name | default(chef_automate_default_org_name) }}"
    chef_org_full_name: "{{ org_full_name | default(chef_automate_default_org_full_name) }}"
    chef_user_key_file: "{{ user_key_path | default(chef_automate_user_key_path) }}"
    chef_org_validator_file: "{{ org_validator_path | default(chef_automate_org_validator_path) }}"
- name: Check if Chef Server CLI tools are available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Fail if Chef Server CLI tools are not available
  ansible.builtin.fail:
    msg: Chef Server CLI tools (chef-server-ctl) are not available. Please ensure Chef Infra Server is installed.
  when: chef_server_ctl_check.rc != 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_user_name }} {{ chef_user_full_name }} {{ chef_user_email }} "{{ chef_user_password }}" --filename {{ chef_user_key_file
      }}

      '
  become: true
  register: create_user_result
  changed_when: create_user_result.rc == 0
  failed_when:
    - create_user_result.rc != 0
    - "'already exists' not in create_user_result.stderr"
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_full_name }}" --association_user {{ chef_user_name }} --filename {{ chef_org_validator_file
      }}

      '
  become: true
  register: create_org_result
  changed_when: create_org_result.rc == 0
  failed_when:
    - create_org_result.rc != 0
    - "'already exists' not in create_org_result.stderr"
- name: Set permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_user_key_file }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  when: create_user_result is changed
- name: Set permissions on organization validator key file
  ansible.builtin.file:
    path: "{{ chef_org_validator_file }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  when: create_org_result is changed
