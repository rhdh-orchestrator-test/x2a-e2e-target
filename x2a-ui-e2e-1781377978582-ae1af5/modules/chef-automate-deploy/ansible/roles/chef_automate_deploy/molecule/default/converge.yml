- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create base directories for testing
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/etc/sysctl.d
    - /tmp/molecule_test/tmp/chef-automate-cli
    - /tmp/molecule_test/home/ansible
    - /tmp/molecule_test/var/log/chef-automate
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '# Chef Automate kernel parameters

        vm.max_map_count = {{ chef_automate_vm_max_map_count }}

        vm.dirty_expire_centisecs = {{ chef_automate_vm_dirty_expire_centisecs }}

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI placeholder
    ansible.builtin.copy:
      content: '#!/bin/bash

        # Simulated Chef Automate CLI

        echo "Chef Automate CLI v2.0.0"

        '
      dest: /tmp/molecule_test/tmp/chef-automate-cli/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment log
    ansible.builtin.copy:
      content: '[2023-07-15T12:00:00Z] Chef Automate deployment started

        [2023-07-15T12:05:00Z] Deploying Chef Automate with Infra Server

        [2023-07-15T12:10:00Z] Accepting terms and MLSA

        [2023-07-15T12:15:00Z] Deployment completed successfully

        '
      dest: /tmp/molecule_test/var/log/chef-automate/deploy.log
      mode: '0644'
  - name: Create Chef Automate config directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/chef-automate
      state: directory
      mode: '0755'
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: '# Chef Automate configuration

        [global]

        fqdn = "{{ chef_automate_hostname }}"

        '
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create Chef Server config directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/opscode
      state: directory
      mode: '0755'
  - name: Create Chef Server config file
    ansible.builtin.copy:
      content: '# Chef Server configuration

        nginx[''server_name''] = "{{ chef_automate_hostname }}"

        '
      dest: /tmp/molecule_test/etc/opscode/chef-server.rb
      mode: '0644'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAvPb5Lh/G8MiKxP+TeT4LzW5Q6Bm/HCXy6vCWPRLxgwqZOcwH

        [... simulated key content ...]

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/ansible/{{ chef_automate_default_username }}.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0FPPrPRK3wMg0AUj9xfFj19w2g4HWL8DoFsQxIlYpMzKUmZw

        [... simulated key content ...]

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/ansible/{{ chef_automate_default_org_name }}-validator.pem
      mode: '0600'
  - name: Create user-list output file
    ansible.builtin.copy:
      content: '{{ chef_automate_default_username }}

        pivotal

        '
      dest: /tmp/molecule_test/tmp/chef-server-user-list.txt
      mode: '0644'
  - name: Create org-list output file
    ansible.builtin.copy:
      content: '{{ chef_automate_default_org_name }}

        '
      dest: /tmp/molecule_test/tmp/chef-server-org-list.txt
      mode: '0644'
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_default_username: jtonello
    chef_automate_default_org_name: lab
