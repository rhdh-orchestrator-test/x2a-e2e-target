---
- name: Restart apache2
  ansible.builtin.service:
    name: apache2
    state: restarted
  when: not (molecule_testing is defined and molecule_testing | bool)
  tags: molecule-notest
- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
  when: not (molecule_testing is defined and molecule_testing | bool)
  tags: molecule-notest
