---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application and PostgreSQL database.
    description:
      - Deploys the FastAPI tutorial repository in a Python virtual environment.
      - Configures PostgreSQL objects and a systemd service for Uvicorn.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment path.
      fastapi_tutorial_bind_address:
        type: str
        required: false
        default: 0.0.0.0
        description: Address on which Uvicorn listens.
      fastapi_tutorial_port:
        type: int
        required: false
        default: 8000
        description: TCP port for the application service.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_service_file:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Systemd unit file path.
      fastapi_tutorial_app_module:
        type: str
        required: false
        default: app.main:app
        description: Uvicorn application module.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name written to the environment file.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version written to the environment file.
      fastapi_tutorial_db_username:
        type: str
        required: false
        default: "{{ db_username }}"
        description: PostgreSQL application role name.
      fastapi_tutorial_db_name:
        type: str
        required: false
        default: "{{ db_name }}"
        description: PostgreSQL application database name.
      fastapi_tutorial_db_host:
        type: str
        required: false
        default: "{{ db_host }}"
        description: PostgreSQL host used in the application connection URL.
      fastapi_tutorial_db_port:
        type: str
        required: false
        default: "{{ db_port }}"
        description: PostgreSQL port used in the application connection URL.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations involving the database password.
      db_username:
        type: str
        required: true
        description: PostgreSQL username injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: PostgreSQL password injected by an AAP credential type.
      db_name:
        type: str
        required: true
        description: PostgreSQL database name injected by an AAP credential type.
      db_host:
        type: str
        required: true
        description: PostgreSQL host injected by an AAP credential type.
      db_port:
        type: str
        required: true
        description: PostgreSQL port injected by an AAP credential type.
