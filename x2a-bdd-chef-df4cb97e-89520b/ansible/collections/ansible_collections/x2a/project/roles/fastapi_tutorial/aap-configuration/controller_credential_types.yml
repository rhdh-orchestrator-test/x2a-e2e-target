---
controller_credential_types:
  - name: PostgreSQL Database
    description: Password for the FastAPI application's PostgreSQL database role, currently hardcoded in the Chef recipe and embedded in DATABASE_URL.
    kind: cloud
    inputs:
      fields:
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role, used when creating the role and rendering the application's DATABASE_URL.
      required:
        - database_password
    injectors:
      extra_vars:
        database_password: !unsafe "{{ database_password }}"
