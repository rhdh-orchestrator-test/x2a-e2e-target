---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install required packages on RedHat-family systems
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install required packages on Debian-family systems
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Initialize PostgreSQL on RedHat-family systems
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] == 'RedHat'

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository  # noqa: R104 - repository URL comes from role defaults and uses HTTPS
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R106 - repository source is trusted role configuration
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - destination is from role defaults
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - command path comes from role defaults, not user input
  ansible.builtin.command:
    cmd: python3 -m venv {{ fastapi_tutorial_app_path }}/venv
    creates: "{{ fastapi_tutorial_app_path }}/venv/bin/python" # noqa: R114 - path is from role defaults

- name: Install Python dependencies  # noqa: R113 - pip executable and requirements path come from role defaults
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt" # noqa: R114 - path is from role defaults
    executable: "{{ fastapi_tutorial_app_path }}/venv/bin/pip" # noqa: R114 - path is from role defaults

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL application role  # noqa: L039 - database_password is validated by the prior credential assertion
  ansible.builtin.shell:  # noqa: R101 - command values come from validated role configuration
    cmd: >-
      psql -v ON_ERROR_STOP=1 -c
      "DO $$ BEGIN CREATE ROLE {{ fastapi_tutorial_database_user }} LOGIN PASSWORD '{{ database_password }}';
      EXCEPTION WHEN duplicate_object THEN ALTER ROLE {{ fastapi_tutorial_database_user }} PASSWORD '{{ database_password }}'; END $$;"
  become: true  # noqa: R108 - creating the PostgreSQL role requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL application database
  ansible.builtin.command:  # noqa: R101 - command values come from trusted role configuration
    cmd: >-
      psql -v ON_ERROR_STOP=1 -c
      "SELECT 'CREATE DATABASE {{ fastapi_tutorial_database_name }} OWNER {{ fastapi_tutorial_database_user }}'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ fastapi_tutorial_database_name }}')\\gexec"
  become: true  # noqa: R108 - creating the PostgreSQL database requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant PostgreSQL database privileges
  ansible.builtin.shell:  # noqa: R101 - command values come from trusted role configuration
    cmd: >-
      psql -v ON_ERROR_STOP=1 -c
      "GRANT ALL PRIVILEGES ON DATABASE {{ fastapi_tutorial_database_name }} TO {{ fastapi_tutorial_database_user }};"
  become: true  # noqa: R108 - granting PostgreSQL privileges requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create application environment file  # noqa: L039 - database_password is validated by the prior credential assertion
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ fastapi_tutorial_database_user }}:{{ database_password }}@{{ fastapi_tutorial_database_host }}/{{ fastapi_tutorial_database_name }}
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - path is from role defaults
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_app_path }}/venv/bin"
      ExecStart={{ fastapi_tutorial_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Enable and start FastAPI service
  ansible.builtin.systemd:
    name: fastapi-tutorial
    daemon_reload: true
    enabled: true
    state: started
