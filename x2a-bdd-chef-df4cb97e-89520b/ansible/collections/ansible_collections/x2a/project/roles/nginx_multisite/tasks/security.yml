---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Deploy Fail2ban jail configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Read UFW status
  ansible.builtin.command:
    argv:
      - ufw
      - status
  register: nginx_multisite_ufw_status
  changed_when: false
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default incoming policy # noqa: L039 - registered by prior task when UFW is enabled
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Default: deny (incoming)' not in (nginx_multisite_ufw_status.stdout | default(''))"

- name: Allow required firewall ports # noqa: L039 - registered by prior task when UFW is enabled
  ansible.builtin.command: # noqa: R101 - ufw command uses role-controlled port values
    argv:
      - ufw
      - allow
      - "{{ item_nginx_multisite['port'] }}/tcp"
  when:
    - nginx_multisite_ufw_enabled | bool
    - "(item_nginx_multisite['port'] | string + '/tcp') not in (nginx_multisite_ufw_status.stdout | default(''))"
  loop:
    - port: 22
    - port: 80
    - port: 443
  loop_control:
    loop_var: item_nginx_multisite

- name: Enable UFW # noqa: L039 - registered by prior task when UFW is enabled
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - enable
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Status: active' not in (nginx_multisite_ufw_status.stdout | default(''))"

- name: Deploy sysctl security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx multisite sysctl

- name: Apply kernel security settings
  ansible.posix.sysctl:
    name: "{{ item_nginx_multisite['name'] }}"
    value: "{{ item_nginx_multisite['value'] }}"
    sysctl_file: /etc/sysctl.d/99-security.conf
    state: present
    reload: false
  loop:
    - name: net.ipv4.conf.default.rp_filter
      value: "1"
    - name: net.ipv4.conf.all.rp_filter
      value: "1"
    - name: net.ipv4.conf.all.accept_redirects
      value: "0"
    - name: net.ipv6.conf.all.accept_redirects
      value: "0"
    - name: net.ipv4.conf.default.accept_redirects
      value: "0"
    - name: net.ipv6.conf.default.accept_redirects
      value: "0"
    - name: net.ipv4.conf.all.send_redirects
      value: "0"
    - name: net.ipv4.conf.default.send_redirects
      value: "0"
    - name: net.ipv4.conf.all.accept_source_route
      value: "0"
    - name: net.ipv6.conf.all.accept_source_route
      value: "0"
    - name: net.ipv4.conf.default.accept_source_route
      value: "0"
    - name: net.ipv6.conf.default.accept_source_route
      value: "0"
    - name: net.ipv4.conf.all.log_martians
      value: "1"
    - name: net.ipv4.conf.default.log_martians
      value: "1"
    - name: net.ipv4.icmp_echo_ignore_all
      value: "1"
    - name: net.ipv4.icmp_echo_ignore_broadcasts
      value: "1"
    - name: net.ipv6.conf.all.disable_ipv6
      value: "1"
    - name: net.ipv6.conf.default.disable_ipv6
      value: "1"
    - name: net.ipv6.conf.lo.disable_ipv6
      value: "1"
    - name: net.ipv4.tcp_syncookies
      value: "1"
    - name: net.ipv4.tcp_max_syn_backlog
      value: "2048"
    - name: net.ipv4.tcp_synack_retries
      value: "2"
    - name: net.ipv4.tcp_syn_retries
      value: "5"
  loop_control:
    loop_var: item_nginx_multisite
  notify: Reload nginx multisite sysctl

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin\s+
    line: PermitRootLogin no
    state: present
    create: false
    backup: true
  when: nginx_multisite_disable_root_login | bool
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication\s+
    line: PasswordAuthentication no
    state: present
    create: false
    backup: true
  when: nginx_multisite_password_authentication is false
  notify: Restart SSH
