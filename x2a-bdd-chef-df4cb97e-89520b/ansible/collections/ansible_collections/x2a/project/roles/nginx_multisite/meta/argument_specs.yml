---
argument_specs:
  main:
    short_description: Configure nginx with multiple secure virtual hosts
    description:
      - Installs and configures nginx, Fail2ban, UFW, SSL certificates, and SSH security settings.
      - Site definitions are supplied through the nginx_multisite_sites mapping.
    options:
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated SSL certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated SSL private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and start Fail2ban.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and enable UFW.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is enabled.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide tasks that handle the AAP-injected site token from logs.
      nginx_multisite_sites:
        type: dict
        required: false
        default: {}
        description: Mapping of site identifiers to document roots and SSL settings.
      nginx_multisite_token:
        type: str
        required: false
        default: "{{ token }}"
        description: AAP-injected secret token written to the nginx secrets directory.
