---
controller_credential_types:
  - name: Nginx Site Token
    description: Secret token loaded from the Chef encrypted data bag item nginx_secrets/site and deployed to /etc/nginx/secrets/site_token.
    kind: cloud
    inputs:
      fields:
        - id: token
          type: string
          label: Site Token
          secret: true
          help_text: Token used as the Nginx site secret and deployed with restrictive file permissions.
      required:
        - token
    injectors:
      extra_vars:
        token: !unsafe "{{ token }}"
