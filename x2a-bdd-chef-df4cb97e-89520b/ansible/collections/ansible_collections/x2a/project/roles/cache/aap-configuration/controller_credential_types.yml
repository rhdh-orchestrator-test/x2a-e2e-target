---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis instance listening on port 6379. The source value is hardcoded in a Chef recipe and should 
      be migrated to Ansible Vault.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required for authenticated access to the Redis server on port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
