---
argument_specs:
  main:
    short_description: Configure Memcached and a standalone Redis cache.
    description:
      - Installs and configures Memcached with the requested listener and resource settings.
      - Includes the eloy.redis role for an authenticated standalone Redis instance.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output that may contain the Redis authentication password.
      memcached_version:
        type: str
        required: false
        default:
        description: Optional Memcached package version.
      memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached cache size in megabytes.
      memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached client connections.
      memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      memcached_threads:
        type: int
        required: false
        default: 4
        description: Number of Memcached worker threads.
      memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Optional experimental Memcached options.
      memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional Memcached command-line options.
      memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file descriptor limit.
      memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log directory.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
