---
- name: Install Memcached package
  ansible.builtin.package:
    name: memcached
    state: present

- name: Create Memcached service group
  ansible.builtin.group:
    name: memcached
    system: true
    state: present

- name: Create locked Memcached service user
  ansible.builtin.user:
    name: memcached
    group: memcached
    system: true
    home: /nonexistent
    shell: /bin/false
    comment: Memcached
    password_lock: true
    create_home: false
    state: present

- name: Create Memcached log directory
  ansible.builtin.file:
    path: /var/log/memcached
    state: directory
    owner: memcached
    group: memcached
    mode: "0755"

- name: Create Memcached runtime directory
  ansible.builtin.file:
    path: /var/run/memcached
    state: directory
    owner: memcached
    group: memcached
    mode: "0755"

- name: Create Memcached sysconfig directory
  ansible.builtin.file:
    path: /etc/sysconfig
    state: directory
    mode: "0755"

- name: Configure Memcached service arguments
  ansible.builtin.template:
    src: memcached.service.conf.j2
    dest: /etc/sysconfig/memcached
    mode: "0644"
    backup: true
  notify: Restart Memcached

- name: Enable and start Memcached
  ansible.builtin.service:
    name: memcached
    enabled: true
    state: started
