---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    hostname: automate.chef.lab
    username: jtonello
    full_name: John Tonello
    email: jtonello@chef.lab
    password: password
    org_name: lab
    org_full_name: Chef Lab
  tasks:
    # Create directory structure for testing
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/sysctl.d
        - /tmp/molecule_test/root
        - /tmp/molecule_test/tmp

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: |
          # Managed by Ansible
          vm.max_map_count = 262144
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-max-map-count.conf
        mode: "0644"

    - name: Create sysctl dirty expire configuration
      ansible.builtin.copy:
        content: |
          # Managed by Ansible
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-dirty-expire-centisecs.conf
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\n# Simulated Chef Automate CLI\necho 'Chef Automate CLI would execute here'"
        dest: /tmp/molecule_test/tmp/chef-automate
        mode: "0755"

