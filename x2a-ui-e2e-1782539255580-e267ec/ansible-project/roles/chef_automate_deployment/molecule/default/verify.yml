---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    hostname: automate.chef.lab
    username: jtonello
    org_name: lab
  tasks:
    # System configuration verification
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Verify hostname content
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == hostname
        fail_msg: "Hostname content does not match expected value"
        success_msg: "Hostname content is correct"
      when: hostname_file.stat.exists

    # Sysctl configuration verification
    - name: Check vm.max_map_count sysctl file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-max-map-count.conf
      register: max_map_count_file

    - name: Assert vm.max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
          - max_map_count_file.stat.isreg
        fail_msg: "vm.max_map_count sysctl file not found"
        success_msg: "vm.max_map_count sysctl file exists"

    - name: Get vm.max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-max-map-count.conf
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Verify vm.max_map_count content
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count = 262144' in (max_map_count_content.content | b64decode)"
        fail_msg: "vm.max_map_count content does not match expected value"
        success_msg: "vm.max_map_count content is correct"
      when: max_map_count_file.stat.exists

    - name: Check vm.dirty_expire_centisecs sysctl file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-dirty-expire-centisecs.conf
      register: dirty_expire_file

    - name: Assert vm.dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_file.stat.exists
          - dirty_expire_file.stat.isreg
        fail_msg: "vm.dirty_expire_centisecs sysctl file not found"
        success_msg: "vm.dirty_expire_centisecs sysctl file exists"

    - name: Get vm.dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-dirty-expire-centisecs.conf
      register: dirty_expire_content
      when: dirty_expire_file.stat.exists

    - name: Verify vm.dirty_expire_centisecs content
      ansible.builtin.assert:
        that:
          - "'vm.dirty_expire_centisecs = 20000' in (dirty_expire_content.content | b64decode)"
        fail_msg: "vm.dirty_expire_centisecs content does not match expected value"
        success_msg: "vm.dirty_expire_centisecs content is correct"
      when: dirty_expire_file.stat.exists

    # Chef Automate CLI verification
    - name: Check Chef Automate CLI file
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI file exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI file not found or not executable"
        success_msg: "Chef Automate CLI file exists and is executable"

    # Chef Automate deployment verification
    - name: Check Chef Automate deployment marker
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: chef_automate_hab

    - name: Assert Chef Automate deployment marker exists
      ansible.builtin.assert:
        that:
          - chef_automate_hab.stat.exists
          - chef_automate_hab.stat.isdir
        fail_msg: "Chef Automate deployment marker not found"
        success_msg: "Chef Automate deployment marker exists"

    # User and organization key verification
    - name: Check user key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/root/{{ username }}.pem
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.isreg
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    - name: Check organization validator key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/root/{{ org_name }}-validator.pem
      register: org_key_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.isreg
        fail_msg: "Organization validator key file not found"
        success_msg: "Organization validator key file exists"

    # Chef Automate status check (would fail in container)
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: chef-automate status
      register: chef_automate_status
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    # Chef Infra Server status check (would fail in container)
    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: chef_server_status
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server is not running"
        success_msg: "Chef Infra Server is running"
      tags: molecule-notest

    # Network listening check (would fail in container)
    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # HTTP check (would fail in container)
    - name: Check Chef Automate API health
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
        status_code: 200
      register: api_health
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate API is healthy
      ansible.builtin.assert:
        that:
          - api_health is succeeded
        fail_msg: "Chef Automate API is not healthy"
        success_msg: "Chef Automate API is healthy"
      tags: molecule-notest