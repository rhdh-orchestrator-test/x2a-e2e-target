---
controller_credentials:
- name: Chef User Authentication - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User Authentication
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
- name: Chef Organization Configuration - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Organization Configuration
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
- name: Chef Server Configuration - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Server Configuration
  update_secrets: true
  inputs:
    hostname: '{{ hostname }}'
