---
# Cache role main tasks

- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install cache packages
  ansible.builtin.package:
    name:
      - memcached
      - redis-server
    state: present

- name: Ensure Redis group exists
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    system: true
    state: present

- name: Ensure Redis user exists
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}" # noqa: R114 - path from role defaults
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory
    recurse: true

- name: Ensure Redis config file exists
  ansible.builtin.file:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Configure Redis server port
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults
    regexp: "^port "
    line: "port {{ cache_redis_port }}"
    backup: true
  notify: Restart Redis

- name: Configure Redis authentication
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: L039 - variable comes from role defaults # noqa: R114 - path from role defaults
    regexp: "^requirepass "
    line: "requirepass {{ redis_password }}"
    backup: true
  notify: Restart Redis

- name: Remove Redis replica configuration lines
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults # noqa: R115 - removing lines from role-defined config file
    regexp: "{{ item_pattern }}"
    state: absent
    backup: true
  loop: "{{ cache_redis_cleanup_patterns }}"
  loop_control:
    loop_var: item_pattern
  notify: Restart Redis

- name: Start and enable Redis service
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true

- name: Start and enable Memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
