---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install cache packages
  ansible.builtin.package:
    name:
      - redis-server
      - memcached
    state: present
- name: Create redis user
  ansible.builtin.user:
    name: redis
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present
- name: Create memcache user
  ansible.builtin.user:
    name: "{{ cache_memcached_user }}"
    system: true
    shell: /bin/false
    home: /nonexistent
    create_home: false
    state: present
- name: Create Redis data directory
  ansible.builtin.file:
    path: /var/lib/redis
    owner: redis
    group: redis
    mode: "0755"
    state: directory
- name: Create Redis PID directory
  ansible.builtin.file:
    path: /var/run/redis
    owner: redis
    group: redis
    mode: "0755"
    state: directory
- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    owner: redis
    group: redis
    mode: "0755"
    state: directory
    recurse: true
- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/6379.conf
    owner: redis
    group: redis
    mode: "0640"
    backup: true
  notify: Restart redis
- name: Clean up Redis configuration
  ansible.builtin.replace:
    path: /etc/redis/6379.conf
    regexp: ^{{ item_cache }}.*$
    replace: ""
  loop:
    - replica-serve-stale-data
    - replica-read-only
    - repl-ping-replica-period
    - client-output-buffer-limit
    - replica-priority
  loop_control:
    loop_var: item_cache
  notify: Restart redis
- name: Start and enable Redis service
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
- name: Start and enable memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
