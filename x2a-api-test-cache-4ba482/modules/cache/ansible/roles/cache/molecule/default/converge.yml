---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          # Generated by Ansible for testing

          # Network
          port 6379
          bind 127.0.0.1
          timeout 0
          tcp-keepalive 300

          # General
          daemonize yes
          supervised systemd
          pidfile /var/run/redis/redis-server.pid
          loglevel notice
          logfile /var/log/redis/redis_6379.log
          databases 16

          # Authentication
          requirepass redis_secure_password_123

          # Memory management
          maxmemory 256mb
          maxmemory-policy allkeys-lru

          # Persistence
          save 900 1
          save 300 10
          save 60 10000

          stop-writes-on-bgsave-error yes
          rdbcompression yes
          rdbchecksum yes
          dbfilename dump.rdb
          dir /var/lib/redis

          # Security
          protected-mode yes

          # Clients
          maxclients 10000

          # Slow log
          slowlog-log-slower-than 10000
          slowlog-max-len 128

          # Latency monitor
          latency-monitor-threshold 100
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create Redis log file
      ansible.builtin.copy:
        content: |
          # Redis log file placeholder
          # This would contain Redis server logs in production
        dest: /tmp/molecule_test/var/log/redis/redis_6379.log
        mode: "0644"
        backup: true

    - name: Create memcached configuration directory
      ansible.builtin.file:
        path: /tmp/molecule_test/etc/memcached
        state: directory
        mode: "0755"

    - name: Create memcached configuration file
      ansible.builtin.copy:
        content: |
          # memcached configuration
          # Memory limit
          -m 64
          # Port
          -p 11211
          # Listen address
          -l 127.0.0.1
          # User
          -u memcache
          # Max connections
          -c 1024
        dest: /tmp/molecule_test/etc/memcached/memcached.conf
        mode: "0644"
        backup: true

    - name: Create systemd service directories
      ansible.builtin.file:
        path: "{{ item_systemd }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/systemd/system
        - /tmp/molecule_test/lib/systemd/system
      loop_control:
        loop_var: item_systemd

    - name: Create Redis systemd service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Advanced key-value store
          After=network.target
          Documentation=http://redis.io/documentation, man:redis-server(1)

          [Service]
          Type=notify
          ExecStart=/usr/bin/redis-server /etc/redis/6379.conf
          ExecStop=/bin/kill -s QUIT $MAINPID
          TimeoutStopSec=0
          Restart=always
          User=redis
          Group=redis
          RuntimeDirectory=redis
          RuntimeDirectoryMode=0755

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/lib/systemd/system/redis-server.service
        mode: "0644"
        backup: true

    - name: Create memcached systemd service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=memcached daemon
          After=network.target
          Documentation=man:memcached(1)

          [Service]
          Type=simple
          ExecStart=/usr/bin/memcached -m 64 -p 11211 -u memcache -l 127.0.0.1 -c 1024
          User=memcache
          Group=memcache
          Restart=always

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/lib/systemd/system/memcached.service
        mode: "0644"
        backup: true