- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create necessary directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/apache2/certs
    - /tmp/molecule_test/etc/apache2/sites-available
    - /tmp/molecule_test/etc/apache2/mods-available
    - /tmp/molecule_test/var/www/helloworld
  - name: Create mock SSL key
    ansible.builtin.copy:
      content: '-----BEGIN PRIVATE KEY----- MOCK_SSL_KEY_CONTENT -----END PRIVATE KEY-----'
      dest: /tmp/molecule_test/etc/apache2/certs/apache.key
      mode: '0640'
  - name: Create mock SSL CSR
    ansible.builtin.copy:
      content: '-----BEGIN CERTIFICATE REQUEST----- MOCK_CSR_CONTENT -----END CERTIFICATE REQUEST-----'
      dest: /tmp/molecule_test/etc/apache2/certs/apache.csr
      mode: '0640'
  - name: Create mock SSL certificate
    ansible.builtin.copy:
      content: '-----BEGIN CERTIFICATE----- MOCK_CERTIFICATE_CONTENT -----END CERTIFICATE-----'
      dest: /tmp/molecule_test/etc/apache2/certs/apache.crt
      mode: '0640'
  - name: Create virtual host configuration
    ansible.builtin.copy:
      content: '<VirtualHost *:443> DocumentRoot "/var/www/helloworld" SSLEngine on SSLCertificateFile /etc/apache2/certs/apache.crt SSLCertificateKeyFile /etc/apache2/certs/apache.key   <Directory
        "/var/www/helloworld"> allow from all Options None Require all granted </Directory> </VirtualHost> '
      dest: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      mode: '0640'
  - name: Create website content
    ansible.builtin.copy:
      content: <html> <head><title>Test Site</title></head> <body> <h1>Hello, world!</h1> <p>The site is up and running</p> </body> </html>
      dest: /tmp/molecule_test/var/www/helloworld/index.html
      mode: '0644'
  - name: Create SSL configuration with POODLE fix
    ansible.builtin.copy:
      content: '# Mock SSL configuration file

        SSLProtocol -all +TLSv1.2

        # Other SSL settings would go here

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Create sites-enabled directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/sites-enabled
      state: directory
      mode: '0755'
  - name: Create mods-enabled directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-enabled
      state: directory
      mode: '0755'
  - name: Create symlink for enabled site
    ansible.builtin.file:
      src: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      dest: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
      state: link
  - name: Create symlink for enabled SSL module
    ansible.builtin.file:
      src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      dest: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.conf
      state: link
