---
controller_credential_types:
- name: Chef Automate User Credentials
  description: User credentials for Chef Automate deployment
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Automate administrator
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Automate administrator
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: SSL Certificate
  description: SSL certificate for HTTPS website
  kind: cloud
  inputs:
    fields:
    - id: ssl_key
      type: string
      label: SSL Private Key
      secret: true
      help_text: Private key for SSL certificate
    - id: ssl_certificate
      type: string
      label: SSL Certificate
      help_text: Public SSL certificate
    - id: ssl_csr
      type: string
      label: Certificate Signing Request
      help_text: Certificate signing request data
    required:
    - ssl_key
    - ssl_certificate
  injectors:
    extra_vars:
      ssl_key: !unsafe '{{ ssl_key }}'
      ssl_certificate: !unsafe '{{ ssl_certificate }}'
      ssl_csr: !unsafe '{{ ssl_csr }}'
