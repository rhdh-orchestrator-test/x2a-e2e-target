---
argument_specs:
  main:
    short_description: Role to fix POODLE vulnerability in Apache SSL configuration
    description:
      - This role applies a security fix for the POODLE vulnerability by updating SSL configuration
      - in Apache to disable vulnerable protocols and enable only TLSv1.2.
      - It also restarts Apache and SSH services after configuration changes.
    options:
      apache_ssl_config_path:
        type: str
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file
      ssl_protocol_setting:
        type: str
        default: -all +TLSv1.2
        description: SSL protocol configuration string for Apache
