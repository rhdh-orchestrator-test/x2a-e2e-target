---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check if Apache SSL config file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_config_file

    - name: Assert SSL config file exists
      ansible.builtin.assert:
        that:
          - ssl_config_file.stat.exists
          - ssl_config_file.stat.isreg
        fail_msg: "Apache SSL config file not found"
        success_msg: "Apache SSL config file exists"

    - name: Get SSL config file content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_config_content

    - name: Assert SSL protocol is properly configured
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in ssl_config_content.content | b64decode"
        fail_msg: "SSL protocol not properly configured to disable vulnerable protocols"
        success_msg: "SSL protocol properly configured to only allow TLSv1.2"

    # The following checks would be performed on a real system but can't run in a container
    # They are tagged with molecule-notest so they're skipped during molecule testing

    - name: Check Apache configuration syntax
      ansible.builtin.command: apache2ctl configtest
      changed_when: false
      tags: molecule-notest

    - name: Check SSL/TLS protocols with nmap
      ansible.builtin.command: nmap --script ssl-enum-ciphers -p 443 localhost
      changed_when: false
      register: nmap_ssl_result
      tags: molecule-notest

    - name: Verify SSH configuration
      ansible.builtin.command: sshd -t
      changed_when: false
      tags: molecule-notest

    - name: Check SSH protocols with nmap
      ansible.builtin.command: nmap --script ssh2-enum-algos -p 22 localhost
      changed_when: false
      register: nmap_ssh_result
      tags: molecule-notest

    - name: Verify Apache service is running
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is active
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Assert SSH service is active
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
          - "ansible_facts.services['sshd.service'].state == 'running'"
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"
      tags: molecule-notest