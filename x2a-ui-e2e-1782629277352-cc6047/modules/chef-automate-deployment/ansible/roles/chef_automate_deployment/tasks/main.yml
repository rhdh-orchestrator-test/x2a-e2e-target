---
- name: Validate credential variables
  ansible.builtin.include_tasks:
    file: validate_credentials.yml
- name: Configure system parameters
  ansible.builtin.include_tasks:
    file: system_config.yml
- name: Install Chef Automate CLI
  ansible.builtin.include_tasks:
    file: install_automate.yml
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.include_tasks:
    file: deploy_automate.yml
- name: Create Chef user and organization
  ansible.builtin.include_tasks:
    file: create_user_org.yml
