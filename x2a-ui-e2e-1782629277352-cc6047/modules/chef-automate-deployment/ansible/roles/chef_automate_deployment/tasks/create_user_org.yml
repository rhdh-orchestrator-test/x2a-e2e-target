---
- name: Check if Chef Server is installed
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_check
  changed_when: false
  failed_when: false
  become: true
- name: Fail if Chef Server is not installed
  ansible.builtin.fail:
    msg: Chef Server is not installed. Please ensure Chef Automate deployment completed successfully.
  when: chef_server_check.rc != 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ chef_automate_userfilename }}
  args:
    creates: "{{ ansible_env.PWD }}/{{ chef_automate_userfilename }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_orgname }} "{{ chef_automate_longorgname }}" --association_user {{ username }} --filename {{
      chef_automate_orgfilename }}
  args:
    creates: "{{ ansible_env.PWD }}/{{ chef_automate_orgfilename }}"
  become: true
