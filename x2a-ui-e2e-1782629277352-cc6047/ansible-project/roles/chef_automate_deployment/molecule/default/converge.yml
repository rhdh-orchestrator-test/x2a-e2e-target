---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    full_name: John Tonello
    email: jtonello@chef.lab
    password: password
    chef_automate_hostname: automate.chef.lab
    chef_automate_orgname: lab
    chef_automate_longorgname: Chef Lab
    chef_automate_userfilename: "{{ username }}.pem"
    chef_automate_orgfilename: "{{ chef_automate_orgname }}-validator.pem"
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
  tasks:
    # Create directory structure
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/sysctl.d

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: |
          # Managed by Ansible
          vm.max_map_count = 262144
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-max-map-count.conf
        mode: "0644"

    - name: Create sysctl dirty expire configuration
      ansible.builtin.copy:
        content: |
          # Managed by Ansible
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-dirty-expire.conf
        mode: "0644"

    # Simulate Chef Automate CLI installation
    - name: Create Chef Automate CLI executable
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI v1.0.0"
          echo "This is a mock Chef Automate CLI for testing"
        dest: "{{ chef_automate_cli_path }}"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          # This is a mock Chef Automate config file
          [global]
          products = ["automate", "infra-server"]
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"

    # Simulate user and organization creation
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAu5NhEgSMGXKXNyLyhU1ioStPST+133L6Ht0gSzc1xUVSQCED
          [MOCK KEY CONTENT]
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/{{ chef_automate_userfilename }}
        mode: "0600"

    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAu5NhEgSMGXKXNyLyhU1ioStPST+133L6Ht0gSzc1xUVSQCED
          [MOCK VALIDATOR KEY CONTENT]
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/{{ chef_automate_orgfilename }}
        mode: "0600"