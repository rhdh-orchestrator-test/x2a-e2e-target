- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create base directory
    ansible.builtin.file:
      path: /tmp/molecule_test
      state: directory
      mode: '0755'
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/chef-server
    - /tmp/molecule_test/etc/opscode
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/opscode
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/usr/bin
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "# Mock Chef Automate config file\n[global]\n  v1 = true\n[deployment]\n  hostname = \"automate.chef.lab\"\n[products]\n  automate = true\n  infra-server
        = true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create Chef Server config file
    ansible.builtin.copy:
      content: "# Mock Chef Server config file\ntopology \"standalone\"\nserver \"automate.chef.lab\",\n  api_fqdn \"automate.chef.lab\"\n"
      dest: /tmp/molecule_test/etc/chef-server/chef-server.rb
      mode: '0644'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAv8Moc0RH2RRgqxJQKBgZ...

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAv8Moc0RH2RRgqxJQKBgZ...

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create mock sysctl files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/{{ item.path }}
      mode: '0644'
    loop:
    - path: vm/max_map_count
      value: '262144'
    - path: vm/dirty_expire_centisecs
      value: '20000'
    loop_control:
      label: '{{ item.path }}'
  - name: Create mock hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create mock Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        echo "Deployment successful"

        exit 0

        '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create mock chef-server-ctl
    ansible.builtin.copy:
      content: "#!/bin/bash\nif [[ \"$1\" == \"user-list\" ]]; then\n  echo \"jtonello\"\nelif [[ \"$1\" == \"org-list\" ]]; then\n  echo \"lab\"\nelif [[ \"$1\"
        == \"user-create\" ]]; then\n  echo \"Created user $2\"\nelif [[ \"$1\" == \"org-create\" ]]; then\n  echo \"Created organization $2\"\nelif [[ \"$1\" ==
        \"status\" ]]; then\n  echo \"run: service_name: all services OK\"\nfi\nexit 0\n"
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
