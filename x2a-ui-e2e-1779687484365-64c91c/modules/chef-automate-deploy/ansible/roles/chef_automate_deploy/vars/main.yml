---
chef_automate_username: "{{ username | default(chef_automate_username) }}"
chef_automate_full_name: "{{ full_name | default(chef_automate_full_name) }}"
chef_automate_email: "{{ email | default(chef_automate_email) }}"
chef_automate_password: "{{ password | default(chef_automate_password) }}"
chef_automate_user_key_file: "{{ chef_automate_username }}.pem"
chef_automate_org_key_file: "{{ chef_automate_org_name }}-validator.pem"
