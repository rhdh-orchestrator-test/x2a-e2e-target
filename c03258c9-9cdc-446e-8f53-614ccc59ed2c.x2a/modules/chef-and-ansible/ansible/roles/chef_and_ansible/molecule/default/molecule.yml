dependency:
  name: galaxy
driver:
  name: vagrant
platforms:
- name: ubuntu-20.04
provisioner:
  name: ansible
  inventory:
    host_vars:
      instance:
        ansible_user: vagrant
verifier:
  name: ansible
  lint:
    name: ansible-lint
scenario:
  name: default
  test_sequence:
  - lint
  - destroy
  - dependency
  - syntax
  - create
  - prepare
  - converge
  - idempotence
  - verify
  - destroy
