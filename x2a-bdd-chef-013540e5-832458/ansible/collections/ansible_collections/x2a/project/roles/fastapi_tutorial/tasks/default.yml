---
- name: Install FastAPI tutorial dependencies on RedHat
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Install FastAPI tutorial dependencies on Debian
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Initialize PostgreSQL on RedHat
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository # noqa: R104,R106 - repository URL and source come from a trusted role default
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is a role default, not user input
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command path comes from a trusted role default
  ansible.builtin.command:
    cmd: python3 -m venv {{ fastapi_tutorial_venv_path }} # noqa: R114 - venv path is a role default, not user input
    creates: "{{ fastapi_tutorial_venv_path }}/bin/python" # noqa: R114 - path is a role default, not user input

- name: Install Python dependencies # noqa: R113 - requirements path and virtualenv come from trusted role defaults
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt" # noqa: R114 - path is a role default, not user input
    virtualenv: "{{ fastapi_tutorial_venv_path }}" # noqa: R114 - path is a role default, not user input
    state: present

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_postgresql_service_name }}"
    enabled: true
    state: started

- name: Create PostgreSQL application role # noqa: L039,R101,R108 - credentials are validated role parameters; command values are validated credentials; role creation requires the postgres user
  ansible.builtin.shell:
    cmd: |
      if psql -v ON_ERROR_STOP=1 -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}'" | grep -q 1; then
        echo ROLE_EXISTS
      else
        psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE {{ db_username }} LOGIN PASSWORD '{{ db_password }}';"
        echo ROLE_CREATED
      fi
  register: fastapi_tutorial_role_result
  changed_when: "'ROLE_CREATED' in fastapi_tutorial_role_result.stdout"
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL application database # noqa: L039,R101,R108 - credentials are validated role parameters; command values are validated credentials; database creation requires the postgres user
  ansible.builtin.shell:
    cmd: |
      if psql -v ON_ERROR_STOP=1 -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'" | grep -q 1; then
        echo DATABASE_EXISTS
      else
        createdb -O "{{ db_username }}" "{{ database_name }}"
        echo DATABASE_CREATED
      fi
  register: fastapi_tutorial_database_result
  changed_when: "'DATABASE_CREATED' in fastapi_tutorial_database_result.stdout"
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant PostgreSQL application database privileges # noqa: L039,R101,R108 - credentials are validated role parameters; command values are validated credentials; grants require the postgres user
  ansible.builtin.command:
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -d
      - postgres
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ db_username }};
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write application environment configuration # noqa: L039 - credentials are required role parameters validated by the prior task
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@localhost/{{ database_name }}
    dest: "{{ fastapi_tutorial_env_file }}" # noqa: R114 - path is a role default, not user input
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_venv_path }}/bin"
      ExecStart={{ fastapi_tutorial_venv_path }}/bin/uvicorn {{ fastapi_tutorial_app_module }} --host {{ fastapi_tutorial_app_host }} --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - path is a role default, not user input
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before starting FastAPI
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI tutorial
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
