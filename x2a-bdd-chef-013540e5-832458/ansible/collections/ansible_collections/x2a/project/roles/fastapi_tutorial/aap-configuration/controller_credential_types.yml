---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: PostgreSQL credentials for the FastAPI application; the password is hardcoded in the Chef recipe and should be migrated to Ansible Vault or an 
      external secret manager.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password assigned to the PostgreSQL role used by the FastAPI application.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database owned and accessed by the FastAPI application.
      required:
        - db_username
        - db_password
        - database_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
