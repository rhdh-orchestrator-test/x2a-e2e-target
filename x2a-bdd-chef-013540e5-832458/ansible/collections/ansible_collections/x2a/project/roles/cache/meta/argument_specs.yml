---
argument_specs:
  main:
    short_description: Install and configure Memcached and standalone Redis cache services
    description:
      - Configures Memcached and delegates Redis installation and service management to eloy.redis.redis.
    options:
      memcached_version:
        type: str
        required: false
        default:
        description: Optional Memcached package version.
      memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory allocation in megabytes.
      memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached connections.
      memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Memcached experimental command-line options.
      memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional Memcached command-line options.
      memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: File descriptor limit for Memcached.
      memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log directory.
      memcached_service_user:
        type: str
        required: false
        default: memcached
        description: Memcached service account.
      memcached_service_group:
        type: str
        required: false
        default: memcached
        description: Memcached service group.
      memcached_runtime_dir:
        type: str
        required: false
        default: /var/run/memcached
        description: Memcached runtime directory.
      redis_password:
        type: str
        required: false
        default: ""
        description: Redis authentication password injected by an AAP credential.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks handling the Redis password.
      redis_port:
        type: int
        required: false
        default: 6379
        description: Redis TCP port.
      redis_pid_dir:
        type: str
        required: false
        default: /run/redis
        description: Redis PID directory.
      redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration file to clean of legacy replication directives.
