---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml

- name: Configure standalone Redis cache
  ansible.builtin.include_role:
    name: eloy.redis.redis # noqa: L038 - external role is declared in this role's requirements.yml and is required for Redis configuration
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ redis_log_dir }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Remove legacy Redis replication directives
  ansible.builtin.replace:
    path: "{{ redis_config_file }}" # noqa: R114 - path from role defaults, not user input
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$
    replace: ""
  when: ansible_facts['os_family'] is defined
