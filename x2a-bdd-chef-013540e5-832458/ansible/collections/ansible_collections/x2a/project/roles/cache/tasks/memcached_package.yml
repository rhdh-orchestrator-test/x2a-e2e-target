---
- name: Install Memcached package
  ansible.builtin.package:
    name: memcached
    state: present

- name: Create Memcached service group
  ansible.builtin.group:
    name: "{{ memcached_service_group }}"
    system: true
    state: present

- name: Create locked Memcached service user
  ansible.builtin.user:
    name: "{{ memcached_service_user }}"
    system: true
    create_home: false
    group: "{{ memcached_service_group }}"
    home: /nonexistent
    comment: Memcached
    shell: /bin/false
    password_lock: true
    state: present

- name: Create Memcached log directory
  ansible.builtin.file:
    path: "{{ memcached_logfilepath }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: "{{ memcached_service_user }}"
    group: "{{ memcached_service_group }}"
    mode: "0755"

- name: Create Memcached runtime directory
  ansible.builtin.file:
    path: "{{ memcached_runtime_dir }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: "{{ memcached_service_user }}"
    group: "{{ memcached_service_group }}"
    mode: "0755"
