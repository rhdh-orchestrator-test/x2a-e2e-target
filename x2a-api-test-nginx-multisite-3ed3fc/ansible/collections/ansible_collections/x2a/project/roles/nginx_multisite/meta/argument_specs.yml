---
# argument spec file for x2a.project.nginx_multisite
argument_specs:
  main:
    short_description: Configure Nginx multisite hosting and security hardening.
    options:
      nginx_multisite_my_variable:
        type: str
        description: A simple string argument for demonstration.
        default: default_value
      nginx_sites:
        type: dict
        description: Mapping of host names to document root and TLS settings.
        default:
          example.com:
            document_root: /var/www/example.com
            ssl_enabled: true
      nginx_ssl_certificate_path:
        type: str
        description: Directory containing site certificates.
        default: /etc/ssl/certs
      nginx_ssl_private_key_path:
        type: str
        description: Directory containing site private keys.
        default: /etc/ssl/private
