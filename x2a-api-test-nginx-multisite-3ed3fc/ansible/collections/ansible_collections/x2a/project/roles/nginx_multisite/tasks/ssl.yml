---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_ssl_certificate_path }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_ssl_private_key_path }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Generate private keys  # noqa: R101 - command arguments come from role-defined site names and paths
  ansible.builtin.command:
    argv:
      - openssl
      - genrsa
      - -out
      - "{{ nginx_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key"
      - "2048"
    creates: "{{ nginx_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key" # noqa: R114 - path from role-defined site names
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site

- name: Set private key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key" # noqa: R114 - path from role-defined site names
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site

- name: Generate self-signed certificates  # noqa: R101 - command arguments come from role-defined site names and paths
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -new
      - -key
      - "{{ nginx_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key"
      - -out
      - "{{ nginx_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl_site['key'] }}/emailAddress=admin@example.com
    creates: "{{ nginx_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt" # noqa: R114 - path from role-defined site names
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
