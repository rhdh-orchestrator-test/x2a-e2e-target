---
controller_credential_types:
- name: Chef User Credentials
  description: Credential type for Chef User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for the Chef user account
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name for the Chef user account
    - id: email
      type: string
      label: Email
      help_text: Email address for the Chef user account
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef user account
    - id: private_key_path
      type: string
      label: Private Key Path
      help_text: Path where the user's private key will be saved
    required:
    - username
    - full_name
    - email
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
      password: !unsafe '{{ password }}'
      private_key_path: !unsafe '{{ private_key_path }}'
- name: Chef Organization Credentials
  description: Credential type for Chef Organization Credentials
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Name of the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full name of the Chef organization
    - id: validator_key_path
      type: string
      label: Validator Key Path
      help_text: Path where the organization validator key will be saved
    required:
    - org_name
    - org_full_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
      validator_key_path: !unsafe '{{ validator_key_path }}'
