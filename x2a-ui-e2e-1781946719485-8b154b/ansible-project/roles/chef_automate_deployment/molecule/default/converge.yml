- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: test_user
    full_name: Test User
    email: test@example.com
    password: test_password
    private_key_path: /tmp/molecule_test/keys
    org_name: test_org
    org_full_name: Test Organization
    validator_key_path: /tmp/molecule_test/keys
    chef_automate_cli_path: /tmp/molecule_test/home/ansible/chef-automate
    chef_user_key_path: /tmp/molecule_test/keys
    chef_org_validator_key_path: /tmp/molecule_test/keys
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/hostname
    - /tmp/molecule_test/keys
    - /tmp/molecule_test/home/ansible
    - /tmp/molecule_test/proc/sys/vm
  - name: Create mock Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        exit 0

        '
      dest: /tmp/molecule_test/home/ansible/chef-automate
      mode: '0755'
  - name: Create mock config.toml
    ansible.builtin.copy:
      content: "# Mock Chef Automate configuration\n[global]\n  v1 = true\n[deployment]\n  automate = \"enabled\"\n  infra_server = \"enabled\"\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create mock hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create mock user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5NhYMoj56/sFYh6FYbLhIrGCbc3yQf7fXW+iYRMPCATk9Q3

        MOCK_KEY_CONTENT_FOR_TESTING_ONLY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/keys/test_user.pem
      mode: '0600'
  - name: Create mock organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5NhYMoj56/sFYh6FYbLhIrGCbc3yQf7fXW+iYRMPCATk9Q3

        MOCK_ORG_VALIDATOR_KEY_CONTENT_FOR_TESTING_ONLY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/keys/test_org-validator.pem
      mode: '0600'
  - name: Create mock sysctl files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/{{ item.path }}
      mode: '0644'
    loop:
    - path: vm/max_map_count
      value: '262144'
    - path: vm/dirty_expire_centisecs
      value: '20000'
    loop_control:
      label: '{{ item.path }}'
  - name: Include validate_credentials tasks
    ansible.builtin.include_tasks: ../../tasks/validate_credentials.yml
    tags: molecule-notest
  - name: Include system_config tasks
    ansible.builtin.include_tasks: ../../tasks/system_config.yml
    tags: molecule-notest
  - name: Include install_automate tasks
    ansible.builtin.include_tasks: ../../tasks/install_automate.yml
    tags: molecule-notest
  - name: Include setup_user_org tasks
    ansible.builtin.include_tasks: ../../tasks/setup_user_org.yml
    tags: molecule-notest
