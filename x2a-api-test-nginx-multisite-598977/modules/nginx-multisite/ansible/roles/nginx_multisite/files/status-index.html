<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Dashboard - status.cluster.local</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #fff3cd;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #856404;
            margin-bottom: 20px;
        }
        .status {
            background-color: #ffeaa7;
            border: 1px solid #fdcb6e;
            border-radius: 5px;
            padding: 15px;
            margin: 20px 0;
        }
        .info {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Status Dashboard</h1>
        <div class="status">
            <h2>📊 Service Status: Monitoring</h2>
            <p>The status monitoring dashboard is running successfully on status.cluster.local</p>
        </div>
        <div class="info">
            <h3>Environment Information</h3>
            <ul>
                <li><strong>Hostname:</strong> status.cluster.local</li>
                <li><strong>Environment:</strong> Status Monitoring</li>
                <li><strong>SSL:</strong> Enabled</li>
                <li><strong>Document Root:</strong> /opt/server/status</li>
            </ul>
        </div>
    </div>
</body>
</html>
