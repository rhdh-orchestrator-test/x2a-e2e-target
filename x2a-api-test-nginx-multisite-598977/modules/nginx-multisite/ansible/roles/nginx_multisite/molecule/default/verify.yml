---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check service status
      ansible.builtin.service_facts:

    - name: Assert nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
        fail_msg: "Nginx service is not running"

    - name: Assert fail2ban service is running
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
        fail_msg: "Fail2ban service is not running"

    - name: Check nginx configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_config
      register: nginx_config_stat_results

    - name: Assert nginx configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected nginx configuration file not found"
      loop: "{{ nginx_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check document root files exist
      ansible.builtin.stat:
        path: "{{ item_docroot }}"
      loop:
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_docroot
      register: docroot_stat_results

    - name: Assert document root files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected document root file not found"
      loop: "{{ docroot_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ item_ssl }}"
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_ssl
      register: ssl_stat_results

    - name: Assert SSL certificate files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate file not found"
      loop: "{{ ssl_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check security configuration files exist
      ansible.builtin.stat:
        path: "{{ item_security }}"
      loop:
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
      loop_control:
        loop_var: item_security
      register: security_stat_results

    - name: Assert security configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected security configuration file not found"
      loop: "{{ security_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Validate nginx configuration syntax
      ansible.builtin.command:
        cmd: nginx -t
      register: nginx_test_result
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_test_result['rc'] == 0
        fail_msg: "Nginx configuration syntax is invalid"

    - name: Check HTTP ports are listening
      ansible.builtin.wait_for:
        port: "{{ item_port }}"
        host: "0.0.0.0"
        timeout: 10
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_port

    - name: Read document root content for verification
      ansible.builtin.slurp:
        src: "{{ item_content }}"
      loop:
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_content
      register: content_results

    - name: Assert document root content is correct
      ansible.builtin.assert:
        that:
          - item_result['content'] | b64decode | length > 0
        fail_msg: "Document root content is empty"
      loop: "{{ content_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Verify SSL certificate properties
      ansible.builtin.command:
        cmd: openssl x509 -in {{ item_cert }} -noout -subject -dates  # noqa: R101 - loop over hardcoded certificate paths
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_cert
      register: ssl_cert_results
      changed_when: false

    - name: Assert SSL certificates are valid
      ansible.builtin.assert:
        that:
          - item_result['rc'] == 0
          - "'CN=' in item_result['stdout']"
        fail_msg: "SSL certificate validation failed"
      loop: "{{ ssl_cert_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check SSL private key permissions
      ansible.builtin.stat:
        path: "{{ item_key }}"
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: ssl_key_stat_results

    - name: Assert SSL private key permissions are secure
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['mode'] == '0640'
          - item_result['stat']['pw_name'] == 'root'
          - item_result['stat']['gr_name'] == 'ssl-cert'
        fail_msg: "SSL private key permissions are incorrect"
      loop: "{{ ssl_key_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check fail2ban status
      ansible.builtin.command:
        cmd: fail2ban-client status
      register: fail2ban_status_result
      changed_when: false

    - name: Assert fail2ban is operational
      ansible.builtin.assert:
        that:
          - fail2ban_status_result['rc'] == 0
          - "'Status' in fail2ban_status_result['stdout']"
        fail_msg: "Fail2ban is not operational"

    - name: Verify default nginx site is disabled
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site_stat

    - name: Assert default nginx site is disabled
      ansible.builtin.assert:
        that:
          - not default_site_stat['stat']['exists']
        fail_msg: "Default nginx site should be disabled"