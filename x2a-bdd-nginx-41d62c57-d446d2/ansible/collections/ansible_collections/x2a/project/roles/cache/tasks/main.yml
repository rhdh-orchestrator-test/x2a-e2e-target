---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Redis cache  # noqa: L038 - role is provided by the eloy.redis collection declared in requirements.yml
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: 6379
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Check for Redis configuration
  ansible.builtin.stat:
    path: /etc/redis/6379.conf
  register: redis_config_file

- name: Remove unsupported Redis replication directives  # noqa: L039 - redis_config_file is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^{{ item_cache_directive }}.*$
    state: absent
    create: false
  notify: Restart Redis cache service
  when:
    - ansible_facts['os_family'] is defined
    - redis_config_file.stat.exists
  loop:
    - replica-serve-stale-data
    - replica-read-only
    - repl-ping-replica-period
    - client-output-buffer-limit
    - replica-priority
  loop_control:
    loop_var: item_cache_directive
