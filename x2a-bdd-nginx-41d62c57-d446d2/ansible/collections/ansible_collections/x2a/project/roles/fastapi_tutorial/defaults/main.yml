---
# Runtime database credentials are supplied by the AAP credential type.
fastapi_tutorial_secure_logging: true
fastapi_tutorial_app_path: /opt/fastapi-tutorial
fastapi_tutorial_repository: https://github.com/dibanez/fastapi_tutorial.git
fastapi_tutorial_revision: main
fastapi_tutorial_venv_path: /opt/fastapi-tutorial/venv
fastapi_tutorial_database_user: "{{ db_user }}"
fastapi_tutorial_database_name: "{{ db_name }}"
fastapi_tutorial_database_host: "{{ db_host }}"
fastapi_tutorial_database_port: "{{ db_port }}"
fastapi_tutorial_service_name: fastapi-tutorial
fastapi_tutorial_service_unit: /etc/systemd/system/fastapi-tutorial.service
fastapi_tutorial_app_port: 8000
fastapi_tutorial_project_name: FastAPI Tutorial
fastapi_tutorial_api_version: 1.0.0
