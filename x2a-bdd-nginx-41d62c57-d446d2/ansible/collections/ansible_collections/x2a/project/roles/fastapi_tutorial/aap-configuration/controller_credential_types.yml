---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credential for the local PostgreSQL database used by the FastAPI application. The password is currently hardcoded in PostgreSQL provisioning 
      commands and the application DATABASE_URL.
    kind: cloud
    inputs:
      fields:
        - id: db_user
          type: string
          label: Database User
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; store this value in Ansible Vault.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server.
        - id: db_port
          type: string
          label: Database Port
          help_text: TCP port for the PostgreSQL server.
      required:
        - db_user
        - db_password
        - db_name
        - db_host
        - db_port
    injectors:
      extra_vars:
        db_user: !unsafe "{{ db_user }}"
        db_password: !unsafe "{{ db_password }}"
        db_name: !unsafe "{{ db_name }}"
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
