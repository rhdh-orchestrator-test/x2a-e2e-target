---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credential for the local PostgreSQL database used by the FastAPI application. The password is currently hardcoded in PostgreSQL provisioning 
      commands and the application DATABASE_URL.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      db_user: "{{ db_user }}"
      db_password: "{{ vault_db_password }}"
      db_name: "{{ db_name }}"
      db_host: "{{ db_host }}"
      db_port: "{{ db_port }}"
