---
argument_specs:
  main:
    short_description: Deploy and run the FastAPI tutorial application with PostgreSQL.
    description:
      - Installs the application runtime and PostgreSQL dependencies.
      - Clones the FastAPI tutorial, creates its virtual environment, provisions its database, and manages the systemd service.
    options:
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations that handle the database password.
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_tutorial_database_user:
        type: str
        required: false
        default: "{{ db_user }}"
        description: PostgreSQL application user supplied by the AAP credential configuration.
      fastapi_tutorial_database_name:
        type: str
        required: false
        default: "{{ db_name }}"
        description: PostgreSQL application database supplied by the AAP credential configuration.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: "{{ db_host }}"
        description: PostgreSQL host supplied by the AAP credential configuration.
      fastapi_tutorial_database_port:
        type: str
        required: false
        default: "{{ db_port }}"
        description: PostgreSQL port supplied by the AAP credential configuration.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_service_unit:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Path to the systemd unit file.
      fastapi_tutorial_app_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by Uvicorn.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Application project name written to the environment file.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: Application API version written to the environment file.
