---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Deploy Fail2ban jail configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Set UFW default policy
  ansible.builtin.shell:
    cmd: >-
      ufw status verbose | grep -q 'Default: deny' ||
      (ufw --force default deny && echo changed)
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'changed' in nginx_multisite_ufw_default.stdout"
  register: nginx_multisite_ufw_default
  args:
    executable: /bin/sh

- name: Allow SSH through UFW
  ansible.builtin.shell:
    cmd: >-
      ufw status | grep -q '22/tcp' ||
      (ufw allow ssh && echo changed)
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'changed' in nginx_multisite_ufw_ssh.stdout"
  register: nginx_multisite_ufw_ssh
  args:
    executable: /bin/sh

- name: Allow HTTP through UFW
  ansible.builtin.shell:
    cmd: >-
      ufw status | grep -q '80/tcp' ||
      (ufw allow http && echo changed)
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'changed' in nginx_multisite_ufw_http.stdout"
  register: nginx_multisite_ufw_http
  args:
    executable: /bin/sh

- name: Allow HTTPS through UFW
  ansible.builtin.shell:
    cmd: >-
      ufw status | grep -q '443/tcp' ||
      (ufw allow https && echo changed)
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'changed' in nginx_multisite_ufw_https.stdout"
  register: nginx_multisite_ufw_https
  args:
    executable: /bin/sh

- name: Enable UFW
  ansible.builtin.shell:
    cmd: >-
      ufw status | grep -q 'Status: active' ||
      (ufw --force enable && echo changed)
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'changed' in nginx_multisite_ufw_enable.stdout"
  register: nginx_multisite_ufw_enable
  args:
    executable: /bin/sh

- name: Ensure sysctl configuration directory exists
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    mode: "0755"

- name: Deploy kernel security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx multisite sysctl

- name: Check whether SSH daemon configuration exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable SSH root login  # noqa: L039 - variable is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    mode: "0600"
    create: false
  when:
    - nginx_multisite_ssh_disable_root | bool
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart SSH

- name: Disable SSH password authentication  # noqa: L039 - variable is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    mode: "0600"
    create: false
  when:
    - not nginx_multisite_ssh_password_auth | bool
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart SSH
