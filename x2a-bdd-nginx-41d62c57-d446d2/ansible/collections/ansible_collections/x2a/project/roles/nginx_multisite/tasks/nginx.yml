---
- name: Install Nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Ensure Nginx virtual host directories exist
  ansible.builtin.file:
    path: "{{ item_nginx_directory }}" # noqa: R114 - loop values are fixed role-defined Nginx directories
    state: directory
    mode: "0755"
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
  loop_control:
    loop_var: item_nginx_directory

- name: Deploy Nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Deploy Nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Ensure Nginx is enabled and started
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create site document roots  # noqa: R114 - path comes from role-defined sites dictionary
  ansible.builtin.file:
    path: "{{ item_nginx_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dictionary
    owner: www-data
    group: www-data
    mode: "0755"
    state: directory
    recurse: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site

- name: Deploy site index files
  ansible.builtin.copy:
    src: "{{ item_nginx_site['key'].split('.')[0] }}/index.html"
    dest: "{{ item_nginx_site['value']['document_root'] }}/index.html" # noqa: R114 - destination from role-defined sites dictionary
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site
