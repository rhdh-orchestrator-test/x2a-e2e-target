---
argument_specs:
  main:
    short_description: Install and configure Redis cache server
    description:
      - Installs Redis server package and ensures the service is enabled and started.
      - Uses default Redis configuration with no custom templates or complex setup.
    options:
      cache_package_name:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis package to install.
      cache_service_name:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis service to manage.
      cache_service_state:
        type: str
        required: false
        default: started
        description: Desired state of the Redis service.
      cache_service_enabled:
        type: bool
        required: false
        default: true
        description: Whether the Redis service should be enabled to start at boot.
