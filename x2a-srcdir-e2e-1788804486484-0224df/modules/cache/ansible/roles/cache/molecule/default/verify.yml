---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis directories exist
      ansible.builtin.stat:
        path: "{{ item_dir }}"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir
      register: redis_dir_stat_results

    - name: Assert Redis directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected Redis directory not found"
      loop: "{{ redis_dir_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check Redis configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/redis/redis.conf
      register: redis_config_stat

    - name: Assert Redis configuration file was created
      ansible.builtin.assert:
        that:
          - redis_config_stat['stat']['exists']
          - redis_config_stat['stat']['size'] > 0
        fail_msg: "Redis configuration file not found or empty"

    - name: Read Redis configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/redis/redis.conf
      register: redis_config_content

    - name: Assert Redis configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'port 6379' in redis_config_content['content'] | b64decode"
          - "'bind 127.0.0.1' in redis_config_content['content'] | b64decode"
          - "'dir /var/lib/redis' in redis_config_content['content'] | b64decode"
          - "'logfile /var/log/redis/redis-server.log' in redis_config_content['content'] | b64decode"
        fail_msg: "Redis configuration missing expected settings"

    - name: Check Redis log file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/redis/redis-server.log
      register: redis_log_stat

    - name: Assert Redis log file was created
      ansible.builtin.assert:
        that:
          - redis_log_stat['stat']['exists']
          - redis_log_stat['stat']['size'] > 0
        fail_msg: "Redis log file not found or empty"

    - name: Check Redis PID file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/run/redis/redis-server.pid
      register: redis_pid_stat

    - name: Assert Redis PID file was created
      ansible.builtin.assert:
        that:
          - redis_pid_stat['stat']['exists']
          - redis_pid_stat['stat']['size'] > 0
        fail_msg: "Redis PID file not found or empty"

    - name: Check Redis data files exist
      ansible.builtin.stat:
        path: "{{ item_file }}"
      loop:
        - /tmp/molecule_test/var/lib/redis/dump.rdb
      loop_control:
        loop_var: item_file
      register: redis_data_stat_results

    - name: Assert Redis data files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected Redis data file not found"
      loop: "{{ redis_data_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Service checks that cannot run in container environment
    - name: Check Redis service status (container-skipped)
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Redis service is running (container-skipped)
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
        fail_msg: "Redis service not running"
      tags: molecule-notest

    - name: Check Redis service is enabled (container-skipped)
      ansible.builtin.systemd:
        name: redis-server
      register: redis_service_status
      tags: molecule-notest

    - name: Assert Redis service is enabled (container-skipped)
      ansible.builtin.assert:
        that:
          - redis_service_status['status']['UnitFileState'] == 'enabled'
        fail_msg: "Redis service not enabled"
      tags: molecule-notest

    # Network connectivity checks that cannot run in container
    - name: Check Redis port 6379 is listening (container-skipped)
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 5
      tags: molecule-notest

    # Redis CLI checks that cannot run in container
    - name: Test Redis connectivity with ping (container-skipped)
      ansible.builtin.command:
        cmd: redis-cli ping
      register: redis_ping_result
      changed_when: false
      tags: molecule-notest

    - name: Assert Redis responds to ping (container-skipped)
      ansible.builtin.assert:
        that:
          - redis_ping_result['stdout'] == 'PONG'
        fail_msg: "Redis not responding to ping"
      tags: molecule-notest

    - name: Test Redis basic operations (container-skipped)
      ansible.builtin.shell: |
        redis-cli set test_key "test_value" &&
        redis-cli get test_key &&
        redis-cli del test_key
      register: redis_ops_result
      changed_when: false
      tags: molecule-notest

    - name: Assert Redis basic operations work (container-skipped)
      ansible.builtin.assert:
        that:
          - "'test_value' in redis_ops_result['stdout']"
        fail_msg: "Redis basic operations failed"
      tags: molecule-notest