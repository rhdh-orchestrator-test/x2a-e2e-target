---
- name: Restart Redis
  ansible.builtin.service:
    name: "{{ cache_service_name }}"
    state: restarted
- name: Reload Redis
  ansible.builtin.service:
    name: "{{ cache_service_name }}"
    state: reloaded
- name: Start Redis
  ansible.builtin.service:
    name: "{{ cache_service_name }}"
    state: started
- name: Stop Redis
  ansible.builtin.service:
    name: "{{ cache_service_name }}"
    state: stopped
