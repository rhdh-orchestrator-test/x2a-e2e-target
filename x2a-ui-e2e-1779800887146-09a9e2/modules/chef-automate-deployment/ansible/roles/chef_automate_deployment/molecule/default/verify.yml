---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check system configuration
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set to automate.chef.lab"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Check sysctl configuration
    - name: Check sysctl configuration file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert kernel parameters are set correctly
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
          - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "Kernel parameters not set correctly"
        success_msg: "Kernel parameters set correctly"
      when: sysctl_file.stat.exists

    # Check Chef Automate CLI
    - name: Check Chef Automate CLI
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Check Chef Automate configuration
    - name: Check Chef Automate config file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config

    - name: Assert Chef Automate config file exists
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
          - chef_automate_config.stat.isreg
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    - name: Get Chef Automate config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config_content
      when: chef_automate_config.stat.exists

    - name: Assert Chef Automate config contains expected settings
      ansible.builtin.assert:
        that:
          - (chef_automate_config_content.content | b64decode) is search('automate = true')
          - (chef_automate_config_content.content | b64decode) is search('infra_server = true')
        fail_msg: "Chef Automate config does not contain expected settings"
        success_msg: "Chef Automate config contains expected settings"
      when: chef_automate_config.stat.exists

    # Check PEM files
    - name: Check user PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_pem

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.isreg
        fail_msg: "User PEM file not found"
        success_msg: "User PEM file exists"

    - name: Check organization validator PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_pem

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_pem.stat.exists
          - org_pem.stat.isreg
        fail_msg: "Organization validator PEM file not found"
        success_msg: "Organization validator PEM file exists"

    # Service status checks (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: chef-automate status
      register: automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate services are running
      ansible.builtin.assert:
        that:
          - automate_status.rc == 0
        fail_msg: "Chef Automate services are not running"
        success_msg: "Chef Automate services are running"
      tags: molecule-notest

    - name: Check Chef Infra Server service status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: chef_server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server services are running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server services are not running"
        success_msg: "Chef Infra Server services are running"
      tags: molecule-notest

    # Web UI access checks (tagged for skipping in container)
    - name: Check Chef Automate health endpoint
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
      register: automate_health
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate health endpoint is accessible
      ansible.builtin.assert:
        that:
          - automate_health.status == 200
        fail_msg: "Chef Automate health endpoint is not accessible"
        success_msg: "Chef Automate health endpoint is accessible"
      tags: molecule-notest

    - name: Check Chef Infra Server status endpoint
      ansible.builtin.uri:
        url: https://localhost/_status
        validate_certs: false
      register: chef_server_status_endpoint
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server status endpoint is accessible
      ansible.builtin.assert:
        that:
          - chef_server_status_endpoint.status == 200
        fail_msg: "Chef Infra Server status endpoint is not accessible"
        success_msg: "Chef Infra Server status endpoint is accessible"
      tags: molecule-notest

    # Network listening checks (tagged for skipping in container)
    - name: Check for services listening on port 443
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert services are listening on port 443
      ansible.builtin.assert:
        that:
          - port_check.state == "started"
        fail_msg: "No services listening on port 443"
        success_msg: "Services are listening on port 443"
      tags: molecule-notest