---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - curl
      - tar
      - jq
    state: present
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ 'true' if chef_automate_accept_terms else 'false' }}
  args:
    creates: /etc/chef-automate/config.toml
  become: true
  register: deploy_result
  notify: Display Chef Infra Server deployment result
