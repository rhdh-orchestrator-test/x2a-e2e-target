---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Configure system for Chef Automate
  ansible.builtin.include_tasks: configure_system.yml
- name: Install Chef Automate CLI
  ansible.builtin.include_tasks: install_cli.yml
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.include_tasks: deploy_automate.yml
  when: chef_automate_deploy_automate and chef_automate_deploy_infra_server
- name: Deploy Chef Infra Server only
  ansible.builtin.include_tasks: deploy_chef_server.yml
  when: not chef_automate_deploy_automate and chef_automate_deploy_infra_server
- name: Create user and organization
  ansible.builtin.include_tasks: create_user_org.yml
  when: chef_automate_deploy_infra_server
