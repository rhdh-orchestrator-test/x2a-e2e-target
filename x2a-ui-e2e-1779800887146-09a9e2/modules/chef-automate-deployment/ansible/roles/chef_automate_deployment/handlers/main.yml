---
- name: Apply sysctl settings
  ansible.builtin.command:
    cmd: sysctl -p
  become: true
  changed_when: false
- name: Display Chef Automate deployment result
  ansible.builtin.debug:
    msg: "{{ deploy_result.stdout_lines }}"
- name: Display Chef Infra Server deployment result
  ansible.builtin.debug:
    msg: "{{ deploy_result.stdout_lines }}"
