---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create directory structure for Apache mods-available
      ansible.builtin.file:
        path: "/tmp/molecule_test/etc/apache2/mods-available"
        state: directory
        mode: "0755"

    - name: Create mock SSL configuration file
      ansible.builtin.copy:
        content: |
          # Mock Apache SSL configuration file
          SSLProtocol all -SSLv3
          SSLHonorCipherOrder on
          SSLCipherSuite HIGH:!aNULL:!MD5
        dest: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
        mode: "0644"

    # We can't include the role directly because it would try to modify /etc/apache2/mods-available/ssl.conf
    # Instead, we'll simulate what the role does on our test path
    - name: Fix SSL in Apache (simulating role action)
      ansible.builtin.replace:
        dest: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
        regexp: ^SSLProtocol.*$
        replace: SSLProtocol -all +TLSv1.2
        mode: "0644"