---
- name: Install application systemd unit
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/{{ profile_app_stack_app_name }}.service # noqa: R114 - unit name is from role defaults
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd manager
  vars:
    app_name: "{{ profile_app_stack_app_name }}"
    app_dir: "{{ profile_app_stack_app_dir }}"
    app_user: "{{ profile_app_stack_app_user }}"
    app_group: "{{ profile_app_stack_app_group }}"
    app_port: "{{ profile_app_stack_app_port }}"
    worker_count: "{{ profile_app_stack_worker_count }}"
    worker_class: "{{ profile_app_stack_worker_class }}"
    max_requests: "{{ profile_app_stack_max_requests }}"
    graceful_timeout: "{{ profile_app_stack_graceful_timeout }}"
    log_dir: "{{ profile_app_stack_log_dir }}"
    log_level: "{{ profile_app_stack_log_level }}"

- name: Enable and start application service
  ansible.builtin.systemd:
    name: "{{ profile_app_stack_app_name }}"
    enabled: true
    state: started
    daemon_reload: true
