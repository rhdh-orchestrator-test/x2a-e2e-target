---
controller_credential_types:
  - name: Application Database
    description: Credentials and connection settings for the test-app PostgreSQL database. The password is represented by an effective plaintext value in the 
      plan and an encrypted Hiera-eyaml value in module-local data; it must be stored securely in AAP.
    kind: cloud
    inputs:
      fields:
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname or IP address of the PostgreSQL database server.
        - id: db_port
          type: string
          label: Database Port
          help_text: TCP port used to connect to PostgreSQL.
        - id: db_name
          type: string
          label: Database Name
          help_text: Name of the PostgreSQL database used by the application.
        - id: db_user
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL application user; must not appear in commands, output, diffs, logs, or generated command lines.
      required:
        - db_host
        - db_port
        - db_name
        - db_user
        - db_password
    injectors:
      extra_vars:
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
        db_name: !unsafe "{{ db_name }}"
        db_user: !unsafe "{{ db_user }}"
        db_password: !unsafe "{{ db_password }}"
  - name: Application Secret Key
    description: Sensitive application signing or encryption key rendered into the application environment file.
    kind: cloud
    inputs:
      fields:
        - id: secret_key
          type: string
          label: Application Secret Key
          secret: true
          help_text: Secret key used by the application; store environment-specific values securely and do not use the documented changeme fallback.
      required:
        - secret_key
    injectors:
      extra_vars:
        secret_key: !unsafe "{{ secret_key }}"
