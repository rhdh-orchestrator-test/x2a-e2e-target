---
controller_credentials:
  - name: Application Database - profile_app_stack
    description: Credentials and connection settings for the test-app PostgreSQL database. The password is represented by an effective plaintext value in the 
      plan and an encrypted Hiera-eyaml value in module-local data; it must be stored securely in AAP.
    organization: Default
    credential_type: Application Database
    update_secrets: true
    inputs:
      db_host: "{{ db_host }}"
      db_port: "{{ db_port }}"
      db_name: "{{ db_name }}"
      db_user: "{{ db_user }}"
      db_password: "{{ vault_db_password }}"
  - name: Application Secret Key - profile_app_stack
    description: Sensitive application signing or encryption key rendered into the application environment file.
    organization: Default
    credential_type: Application Secret Key
    update_secrets: true
    inputs:
      secret_key: "{{ vault_secret_key }}"
