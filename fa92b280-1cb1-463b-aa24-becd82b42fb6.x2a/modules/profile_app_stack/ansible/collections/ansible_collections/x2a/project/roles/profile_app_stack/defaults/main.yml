---
# User-facing defaults for the application stack.
profile_app_stack_app_name: myapp-api
profile_app_stack_app_repo: https://github.com/example-org/myapp-api.git
profile_app_stack_app_revision: main
profile_app_stack_app_port: 8000
profile_app_stack_app_dir: /opt/myapp-api
profile_app_stack_app_user: myapp
profile_app_stack_app_group: myapp
profile_app_stack_python_version: python3
profile_app_stack_pip_packages:
  - uvicorn
  - gunicorn
  - psycopg2-binary
profile_app_stack_worker_count: 2
profile_app_stack_worker_class: uvicorn.workers.UvicornWorker
profile_app_stack_max_requests: 1000
profile_app_stack_graceful_timeout: 30
profile_app_stack_log_dir: /var/log/myapp-api
profile_app_stack_log_level: info
profile_app_stack_log_max_size: 100M
profile_app_stack_log_rotate_count: 7
profile_app_stack_environment: staging
profile_app_stack_secure_logging: true
