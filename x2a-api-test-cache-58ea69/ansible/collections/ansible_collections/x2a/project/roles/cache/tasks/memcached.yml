---
- name: Install Memcached package
  ansible.builtin.package:
    name: memcached
    state: present

- name: Ensure Memcached log directory exists
  ansible.builtin.file:
    path: "{{ memcached_logfilepath }}" # noqa: R114 - path is a role-defined default
    state: directory
    mode: "0755"

- name: Configure and start Memcached
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
