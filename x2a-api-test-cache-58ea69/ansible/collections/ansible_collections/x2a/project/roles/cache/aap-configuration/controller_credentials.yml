---
controller_credentials:
  - name: Redis Authentication - cache
    description: Password used to authenticate clients to the Redis instance listening on port 6379.
    organization: Default
    credential_type: Redis Authentication
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
  - name: Encrypted Chef Data Bag Site Token - cache
    description: Encrypted token stored in the nginx_secrets/site Chef data bag item. Its consumer is not shown in the cache execution flow.
    organization: Default
    credential_type: Encrypted Chef Data Bag Site Token
    update_secrets: true
    inputs:
      site_token: "{{ vault_site_token }}"
