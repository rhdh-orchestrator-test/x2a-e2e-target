---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis instance listening on port 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required for authenticated access to Redis on port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
  - name: Encrypted Chef Data Bag Site Token
    description: Encrypted token stored in the nginx_secrets/site Chef data bag item. Its consumer is not shown in the cache execution flow.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Site Token
          secret: true
          help_text: Token decrypted from the nginx_secrets/site encrypted Chef data bag item.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
