---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
    creates: "{{ chef_automate_cli_path }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Check if Chef Infra Server is already deployed
  ansible.builtin.stat:
    path: /var/opt/chef-server
  register: chef_server_deployed
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }} "
    creates: /var/opt/chef-server
  become: true
  register: chef_server_deploy_result
  changed_when: "'Success' in chef_server_deploy_result.stdout"
  failed_when:
    - chef_server_deploy_result.rc != 0
    - "'already deployed' not in chef_server_deploy_result.stderr"
  when: not chef_server_deployed.stat.exists
