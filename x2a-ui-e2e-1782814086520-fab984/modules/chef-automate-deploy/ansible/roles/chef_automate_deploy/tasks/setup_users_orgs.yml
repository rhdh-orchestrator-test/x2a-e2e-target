---
- name: Check if Chef user already exists
  ansible.builtin.command:
    cmd: chef-server-ctl user-list
  become: true
  register: chef_user_list
  changed_when: false
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_user.username }} {{ chef_automate_user.fullname }} {{ chef_automate_user.email }} "{{
      chef_automate_user.password }}" --filename {{ chef_automate_user.filename }}
  become: true
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  failed_when:
    - chef_user_create.rc != 0
    - "'already exists' not in chef_user_create.stderr"
  when: chef_automate_user.username not in chef_user_list.stdout
- name: Check if Chef organization already exists
  ansible.builtin.command:
    cmd: chef-server-ctl org-list
  become: true
  register: chef_org_list
  changed_when: false
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org.name }} "{{ chef_automate_org.fullname }}" --association_user {{ chef_automate_user.username }}
      --filename {{ chef_automate_org.filename }}
  become: true
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
  failed_when:
    - chef_org_create.rc != 0
    - "'already exists' not in chef_org_create.stderr"
  when: chef_automate_org.name not in chef_org_list.stdout
