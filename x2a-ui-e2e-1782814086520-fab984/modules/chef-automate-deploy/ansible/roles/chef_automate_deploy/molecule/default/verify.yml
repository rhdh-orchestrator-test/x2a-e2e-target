---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_user:
      username: jtonello
      filename: jtonello.pem
    chef_automate_org:
      name: lab
      filename: lab-validator.pem
  tasks:
    # System configuration checks
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is correctly set
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == chef_automate_hostname
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_file.stat.exists

    # Sysctl settings check
    - name: Check sysctl settings file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl settings file not found"
        success_msg: "Sysctl settings file exists"

    - name: Get sysctl settings content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl settings are correctly set
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count = 262144' in (sysctl_content.content | b64decode)"
          - "'vm.dirty_expire_centisecs = 20000' in (sysctl_content.content | b64decode)"
        fail_msg: "Sysctl settings are not set correctly"
        success_msg: "Sysctl settings are set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI check
    - name: Check Chef Automate CLI file
      ansible.builtin.stat:
        path: /tmp/molecule_test/usr/local/bin/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Server CLI check
    - name: Check Chef Server CLI file
      ansible.builtin.stat:
        path: /tmp/molecule_test/usr/local/bin/chef-server-ctl
      register: chef_server_cli

    - name: Assert Chef Server CLI exists
      ansible.builtin.assert:
        that:
          - chef_server_cli.stat.exists
          - chef_server_cli.stat.isreg
          - chef_server_cli.stat.executable
        fail_msg: "Chef Server CLI not found or not executable"
        success_msg: "Chef Server CLI exists and is executable"

    # Chef Automate deployment status check
    - name: Check Chef Automate deployment status file
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-automate/deployment-status.json
      register: deployment_status_file

    - name: Assert deployment status file exists
      ansible.builtin.assert:
        that:
          - deployment_status_file.stat.exists
          - deployment_status_file.stat.isreg
        fail_msg: "Deployment status file not found"
        success_msg: "Deployment status file exists"

    # User PEM file check
    - name: Check user PEM file
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_automate_user.filename }}"
      register: user_pem_file

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem_file.stat.exists
          - user_pem_file.stat.isreg
        fail_msg: "User PEM file not found"
        success_msg: "User PEM file exists"

    # Organization validator PEM file check
    - name: Check organization validator PEM file
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_automate_org.filename }}"
      register: org_validator_pem_file

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_validator_pem_file.stat.exists
          - org_validator_pem_file.stat.isreg
        fail_msg: "Organization validator PEM file not found"
        success_msg: "Organization validator PEM file exists"

    # User list check
    - name: Check user list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server/user-list.txt
      register: user_list_file

    - name: Assert user list file exists
      ansible.builtin.assert:
        that:
          - user_list_file.stat.exists
          - user_list_file.stat.isreg
        fail_msg: "User list file not found"
        success_msg: "User list file exists"

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef-server/user-list.txt
      register: user_list_content
      when: user_list_file.stat.exists

    - name: Assert user exists in list
      ansible.builtin.assert:
        that:
          - chef_automate_user.username in (user_list_content.content | b64decode)
        fail_msg: "User not found in user list"
        success_msg: "User exists in user list"
      when: user_list_file.stat.exists

    # Organization list check
    - name: Check organization list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server/org-list.txt
      register: org_list_file

    - name: Assert organization list file exists
      ansible.builtin.assert:
        that:
          - org_list_file.stat.exists
          - org_list_file.stat.isreg
        fail_msg: "Organization list file not found"
        success_msg: "Organization list file exists"

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef-server/org-list.txt
      register: org_list_content
      when: org_list_file.stat.exists

    - name: Assert organization exists in list
      ansible.builtin.assert:
        that:
          - chef_automate_org.name in (org_list_content.content | b64decode)
        fail_msg: "Organization not found in organization list"
        success_msg: "Organization exists in organization list"
      when: org_list_file.stat.exists

    # Service status checks (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: chef-automate status
      register: chef_automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check Chef Infra Server service status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: chef_server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server service is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server service is not running"
        success_msg: "Chef Infra Server service is running"
      tags: molecule-notest

    # Network checks (tagged for skipping in container)
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # API health check (tagged for skipping in container)
    - name: Check Chef Automate API status
      ansible.builtin.uri:
        url: https://localhost/_status
        validate_certs: false
        status_code: 200
      register: api_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Automate API is healthy
      ansible.builtin.assert:
        that:
          - api_check is succeeded
        fail_msg: "Chef Automate API is not healthy"
        success_msg: "Chef Automate API is healthy"
      tags: molecule-notest