---
controller_credential_types:
- name: Chef Server User
  description: Credential type for Chef Server User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef Server user account name
    - id: full_name
      type: string
      label: Full Name
      help_text: User's full name
    - id: email
      type: string
      label: Email
      help_text: User's email address
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Server user account
    - id: pem_file
      type: string
      label: PEM File
      secret: true
      help_text: User's PEM file for authentication with Chef Server
    required:
    - username
    - password
    - pem_file
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
      password: !unsafe '{{ password }}'
      pem_file: !unsafe '{{ pem_file }}'
- name: Chef Organization Validator
  description: Credential type for Chef Organization Validator
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name for Chef organization
    - id: validator_pem
      type: string
      label: Validator PEM
      secret: true
      help_text: Organization validator PEM file used for node bootstrapping
    required:
    - org_name
    - validator_pem
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
      validator_pem: !unsafe '{{ validator_pem }}'
