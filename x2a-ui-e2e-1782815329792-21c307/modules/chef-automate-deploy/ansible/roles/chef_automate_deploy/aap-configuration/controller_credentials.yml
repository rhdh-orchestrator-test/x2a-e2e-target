---
controller_credentials:
- name: Chef Server User - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef Server User
  update_secrets: true
  inputs:
    username: '{{ username }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
    password: '{{ vault_password }}'
    pem_file: '{{ vault_pem_file }}'
- name: Chef Organization Validator - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef Organization Validator
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
    validator_pem: '{{ vault_validator_pem }}'
