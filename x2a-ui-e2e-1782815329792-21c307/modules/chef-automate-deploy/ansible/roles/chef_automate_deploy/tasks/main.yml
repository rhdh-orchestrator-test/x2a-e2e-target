---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Set vm.max_map_count
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ chef_automate_vm_max_map_count }}"
    state: present
    sysctl_set: true
  become: true
  notify: Reload sysctl
- name: Set vm.dirty_expire_centisecs
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ chef_automate_vm_dirty_expire_centisecs }}"
    state: present
    sysctl_set: true
  become: true
  notify: Reload sysctl
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.gz"
    mode: "0644"
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.shell: gunzip -c {{ chef_automate_cli_path }}.gz > {{ chef_automate_cli_path }}
  args:
    creates: "{{ chef_automate_cli_path }}"
  become: true
  changed_when: true
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
  become: true
- name: Check if Chef Server is already deployed
  ansible.builtin.stat:
    path: /hab
  register: hab_dir
  become: true
- name: Deploy Chef Automate with Chef Infra Server
  ansible.builtin.command: "{{ chef_automate_cli_path }} deploy  --product automate  --product infra-server  --accept-terms-and-mlsa=true "
  args:
    creates: /hab
  become: true
  when:
    - not chef_server_only
    - not hab_dir.stat.exists
- name: Deploy Chef Infra Server only
  ansible.builtin.command: "{{ chef_automate_cli_path }} deploy  --product infra-server  --accept-terms-and-mlsa=true "
  args:
    creates: /hab
  become: true
  when:
    - chef_server_only
    - not hab_dir.stat.exists
- name: Ensure directory for PEM files exists
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  become: true
  loop:
    - "{{ chef_automate_user_pem_path }}"
    - "{{ chef_automate_org_pem_path }}"
- name: Check if user already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_user_pem_path }}"
  register: user_pem
  become: true
- name: Create Chef Server user
  ansible.builtin.command: 'chef-server-ctl user-create  {{ username }}  {{ full_name }}  {{ email }}  "{{ password }}"  --filename {{ chef_automate_user_pem_path
    }}

    '
  args:
    creates: "{{ chef_automate_user_pem_path }}"
  become: true
  when: not user_pem.stat.exists
- name: Check if organization already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_org_pem_path }}"
  register: org_pem
  become: true
- name: Create Chef Server organization
  ansible.builtin.command: 'chef-server-ctl org-create  {{ org_name }}  "{{ org_full_name }}"  --association_user {{ username }}  --filename {{ chef_automate_org_pem_path
    }}

    '
  args:
    creates: "{{ chef_automate_org_pem_path }}"
  become: true
  when: not org_pem.stat.exists
