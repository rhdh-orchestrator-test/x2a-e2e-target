---
controller_credential_types:
- name: Chef Admin User
  description: Credential type for Chef Admin User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef admin username
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef admin user
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the admin user
    - id: email
      type: string
      label: Email
      help_text: Email address for the admin user
    - id: organization
      type: string
      label: Organization
      help_text: Short name for the Chef organization
    - id: organization_full_name
      type: string
      label: Organization Full Name
      help_text: Full name of the Chef organization
    required:
    - username
    - password
    - organization
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
      organization: !unsafe '{{ organization }}'
      organization_full_name: !unsafe '{{ organization_full_name }}'
