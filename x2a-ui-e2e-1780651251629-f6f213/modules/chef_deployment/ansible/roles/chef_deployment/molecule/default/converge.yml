- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    full_name: John Tonello
    email: jtonello@example.com
    password: password
    organization: lab
    organization_full_name: Chef Lab Organization
    chef_hostname: automate.chef.lab
    chef_deploy_automate: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/home/{{ ansible_user }}
  - name: Create mock Chef Automate credentials file
    ansible.builtin.copy:
      content: '# Chef Automate credentials file

        [credentials]

        client_id = "automate-client"

        client_secret = "mock-secret-value"

        '
      dest: /tmp/molecule_test/etc/chef/automate-credentials.toml
      mode: '0600'
  - name: Create mock Chef Automate config file
    ansible.builtin.copy:
      content: '# Chef Automate configuration

        [global]

        hostname = "{{ chef_hostname }}"

        '
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create mock user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5Vyl/otfJGdPG5YL3F5bk34CQKaD0+fECRn6H9Gv7qwVXMi

        eXHg+86YqyUbT9SnpuJAzwJ5+OOUmVUEw9Dz3lAUJ7QJnVAQiOxqq4Vl9nYNPJvW

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/{{ ansible_user }}/{{ username }}.pem
      mode: '0600'
  - name: Create mock organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAw5upJ8UOhKC9TufxoaWMqOHAKcjCJSA3Bjn0ZgI7T0nQHY1S

        0jZtHWjJnR+M+yBtBgf0/Md3LaHYAGWP2Z+YY3BcdU5hQ7NIK7Iim1+U/xNSUTQG

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/{{ ansible_user }}/{{ organization }}-validator.pem
      mode: '0600'
  - name: Create mock sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create mock hostname file
    ansible.builtin.copy:
      content: '{{ chef_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create mock Chef Automate service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Automate

        After=network.target


        [Service]

        Type=simple

        ExecStart=/usr/bin/chef-automate start

        ExecStop=/usr/bin/chef-automate stop

        Restart=on-failure


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      mode: '0644'
    when: chef_deploy_automate | bool
  - name: Create mock Chef Server service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Infra Server

        After=network.target


        [Service]

        Type=simple

        ExecStart=/usr/bin/chef-server-ctl start

        ExecStop=/usr/bin/chef-server-ctl stop

        Restart=on-failure


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-server.service
      mode: '0644'
