- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    organization: lab
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl settings file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl settings file not found
      success_msg: Sysctl settings file exists
  - name: Get sysctl file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl settings are correct
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: Sysctl settings not configured correctly
      success_msg: Sysctl settings configured correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate service file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/systemd/system/chef-automate.service
    register: automate_service_file
  - name: Assert Chef Automate service file exists
    ansible.builtin.assert:
      that:
      - automate_service_file.stat.exists
      - automate_service_file.stat.isreg
      fail_msg: Chef Automate service file not found
      success_msg: Chef Automate service file exists
  - name: Check Chef Server service file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/systemd/system/chef-server.service
    register: server_service_file
  - name: Assert Chef Server service file exists
    ansible.builtin.assert:
      that:
      - server_service_file.stat.exists
      - server_service_file.stat.isreg
      fail_msg: Chef Server service file not found
      success_msg: Chef Server service file exists
  - name: Check user PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/{{ ansible_user }}/{{ username }}.pem
    register: user_pem_file
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem_file.stat.exists
      - user_pem_file.stat.isreg
      fail_msg: User PEM file not found
      success_msg: User PEM file exists
  - name: Check organization validator PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/{{ ansible_user }}/{{ organization }}-validator.pem
    register: org_pem_file
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_pem_file.stat.exists
      - org_pem_file.stat.isreg
      fail_msg: Organization validator PEM file not found
      success_msg: Organization validator PEM file exists
  - name: Check Chef Automate credentials file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/automate-credentials.toml
    register: credentials_file
  - name: Assert Chef Automate credentials file exists
    ansible.builtin.assert:
      that:
      - credentials_file.stat.exists
      - credentials_file.stat.isreg
      fail_msg: Chef Automate credentials file not found
      success_msg: Chef Automate credentials file exists
  - name: Check Chef Automate config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: config_file
  - name: Assert Chef Automate config file exists
    ansible.builtin.assert:
      that:
      - config_file.stat.exists
      - config_file.stat.isreg
      fail_msg: Chef Automate config file not found
      success_msg: Chef Automate config file exists
  - name: Check Chef Automate service is running
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is active
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      - ansible_facts.services['chef-automate.service'].state == 'running'
      fail_msg: Chef Automate service not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Assert Chef Server service is active
    ansible.builtin.assert:
      that:
      - '''chef-server.service'' in ansible_facts.services'
      - ansible_facts.services['chef-server.service'].state == 'running'
      fail_msg: Chef Server service not running
      success_msg: Chef Server service is running
    tags: molecule-notest
  - name: Check Chef Automate UI access
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
      status_code: 200
    register: automate_ui_access
    tags: molecule-notest
  - name: Check Chef Server API access
    ansible.builtin.uri:
      url: https://localhost/organizations/lab
      validate_certs: false
      status_code: 200
    register: server_api_access
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
