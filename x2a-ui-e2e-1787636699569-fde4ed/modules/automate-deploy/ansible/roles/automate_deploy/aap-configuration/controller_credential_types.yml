---
controller_credential_types:
- name: Chef User Credentials
  description: Credential type for Chef User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef user account username
    - id: long_username
      type: string
      label: Full Name
      help_text: Chef user's full name
    - id: user_email
      type: string
      label: Email Address
      help_text: Chef user's email address
    - id: user_password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef user account
    - id: user_pem_file
      type: string
      label: User PEM File
      secret: true
      help_text: Path to store the user's PEM certificate file
    required:
    - username
    - user_password
    - user_pem_file
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      long_username: !unsafe '{{ long_username }}'
      user_email: !unsafe '{{ user_email }}'
      user_password: !unsafe '{{ user_password }}'
      user_pem_file: !unsafe '{{ user_pem_file }}'
- name: Chef Organization Credentials
  description: Credential type for Chef Organization Credentials
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for Chef organization
    - id: long_org_name
      type: string
      label: Full Organization Name
      help_text: Full descriptive name for Chef organization
    - id: org_validator_pem
      type: string
      label: Organization Validator PEM
      secret: true
      help_text: Path to store the organization validator PEM certificate file
    required:
    - org_name
    - org_validator_pem
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      long_org_name: !unsafe '{{ long_org_name }}'
      org_validator_pem: !unsafe '{{ org_validator_pem }}'
