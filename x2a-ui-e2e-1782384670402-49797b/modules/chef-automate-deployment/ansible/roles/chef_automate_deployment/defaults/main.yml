---
chef_automate_hostname: automate.chef.lab
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: ./chef-automate
chef_automate_accept_terms: true
chef_automate_username: "{{ username | default('jtonello') }}"
chef_automate_fullname: "{{ full_name | default('John Tonello') }}"
chef_automate_email: "{{ email | default('jtonello@chef.lab') }}"
chef_automate_password: "{{ password | default('password') }}"
chef_automate_org_name: lab
chef_automate_org_fullname: Chef Lab
chef_automate_user_pem: "{{ chef_automate_username }}.pem"
chef_automate_org_pem: "{{ chef_automate_org_name }}-validator.pem"
