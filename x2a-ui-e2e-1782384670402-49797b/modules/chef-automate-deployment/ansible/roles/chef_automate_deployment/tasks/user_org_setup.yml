---
- name: Check if Chef user already exists
  ansible.builtin.command:
    cmd: chef-server-ctl user-list
  register: user_list
  changed_when: false
  become: true
  tags: molecule-notest
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_automate_username }}  {{ chef_automate_fullname }}  {{ chef_automate_email }}  "{{ chef_automate_password }}"  --filename
      {{ chef_automate_user_pem }}

      '
  args:
    creates: "{{ chef_automate_user_pem }}"
  become: true
  no_log: true
  when: chef_automate_username not in user_list.stdout
- name: Check if Chef organization already exists
  ansible.builtin.command:
    cmd: chef-server-ctl org-list
  register: org_list
  changed_when: false
  become: true
  tags: molecule-notest
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_automate_org_name }}  "{{ chef_automate_org_fullname }}"  --association_user {{ chef_automate_username }}  --filename
      {{ chef_automate_org_pem }}

      '
  args:
    creates: "{{ chef_automate_org_pem }}"
  become: true
  when: chef_automate_org_name not in org_list.stdout
- name: Set proper permissions on user PEM file
  ansible.builtin.file:
    path: "{{ chef_automate_user_pem }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true
  when: ansible_user is defined
- name: Set proper permissions on organization validator PEM file
  ansible.builtin.file:
    path: "{{ chef_automate_org_pem }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true
  when: ansible_user is defined
