- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname configuration in /etc/hosts
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hosts
    register: hosts_file
  - name: Assert hosts file exists
    ansible.builtin.assert:
      that:
      - hosts_file.stat.exists
      fail_msg: /etc/hosts file not found
      success_msg: /etc/hosts file exists
  - name: Read hosts file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hosts
    register: hosts_content
    when: hosts_file.stat.exists
  - name: Assert hostname is in hosts file
    ansible.builtin.assert:
      that:
      - hosts_content.content | b64decode is search('automate.chef.lab')
      fail_msg: Hostname automate.chef.lab not found in /etc/hosts
      success_msg: Hostname automate.chef.lab found in /etc/hosts
    when: hosts_file.stat.exists
  - name: Check kernel parameters
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/{{ item.name }}
    register: kernel_param
    loop:
    - name: max_map_count
      expected: '262144'
    - name: dirty_expire_centisecs
      expected: '20000'
    loop_control:
      label: '{{ item.name }}'
  - name: Read kernel parameter values
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/{{ item.item.name }}
    register: kernel_values
    loop: '{{ kernel_param.results }}'
    loop_control:
      label: '{{ item.item.name }}'
    when: item.stat.exists
  - name: Assert kernel parameters are set correctly
    ansible.builtin.assert:
      that:
      - item.content | b64decode | trim == item.item.item.expected
      fail_msg: Kernel parameter {{ item.item.item.name }} not set correctly
      success_msg: Kernel parameter {{ item.item.item.name }} set correctly
    loop: '{{ kernel_values.results }}'
    loop_control:
      label: '{{ item.item.item.name }}'
    when: item is defined
  - name: Check Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate deployment
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/deployed
    register: chef_automate_deployed
  - name: Assert Chef Automate was deployed
    ansible.builtin.assert:
      that:
      - chef_automate_deployed.stat.exists
      fail_msg: Chef Automate deployment not found
      success_msg: Chef Automate deployment verified
  - name: Check user PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_pem
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.mode == "0600"
      fail_msg: User PEM file not found or has incorrect permissions
      success_msg: User PEM file exists with correct permissions
  - name: Check organization validator PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_pem
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_pem.stat.exists
      - org_pem.stat.mode == "0600"
      fail_msg: Organization validator PEM file not found or has incorrect permissions
      success_msg: Organization validator PEM file exists with correct permissions
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: chef-automate status
    register: automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - automate_status.rc == 0
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: chef-server-ctl status
    register: server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - server_status.rc == 0
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Check HTTPS port
    ansible.builtin.wait_for:
      port: 443
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Assert HTTPS port is listening
    ansible.builtin.assert:
      that:
      - port_check is success
      fail_msg: HTTPS port 443 is not listening
      success_msg: HTTPS port 443 is listening
    tags: molecule-notest
  - name: Check Chef Automate API health
    ansible.builtin.uri:
      url: https://localhost/api/v0/health
      validate_certs: false
    register: api_health
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate API is healthy
    ansible.builtin.assert:
      that:
      - api_health is success
      fail_msg: Chef Automate API health check failed
      success_msg: Chef Automate API is healthy
    tags: molecule-notest
