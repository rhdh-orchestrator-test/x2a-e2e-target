- name: Converge
  hosts: all
  gather_facts: true
  vars:
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
    chef_automate_user_pem: /tmp/molecule_test/jtonello.pem
    chef_automate_org_pem: /tmp/molecule_test/lab-validator.pem
  tasks:
  - name: Create directory structure for system configuration
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/usr/bin
  - name: Create mock /etc/hosts file
    ansible.builtin.copy:
      content: '127.0.0.1 localhost

        127.0.0.1 automate.chef.lab

        '
      dest: /tmp/molecule_test/etc/hosts
      mode: '0644'
  - name: Create mock kernel parameter files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/vm/{{ item.name }}
      mode: '0644'
    loop:
    - name: max_map_count
      value: '262144'
    - name: dirty_expire_centisecs
      value: '20000'
  - name: Create mock Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        mkdir -p /tmp/molecule_test/hab

        echo "Automate deployed" > /tmp/molecule_test/hab/deployed

        exit 0

        '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create mock chef-server-ctl script
    ansible.builtin.copy:
      content: "#!/bin/bash\necho \"Chef Server CTL mock\"\nif [[ \"$1\" == \"user-create\" ]]; then\n  echo \"Creating user $2\"\n  touch \"/tmp/molecule_test/$2.pem\"\nelif
        [[ \"$1\" == \"org-create\" ]]; then\n  echo \"Creating organization $2\"\n  touch \"/tmp/molecule_test/$2-validator.pem\"\nelif [[ \"$1\" == \"user-list\"
        ]]; then\n  echo \"jtonello\"\nelif [[ \"$1\" == \"org-list\" ]]; then\n  echo \"lab\"\nfi\nexit 0\n"
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create symlink for chef-server-ctl
    ansible.builtin.file:
      src: /tmp/molecule_test/usr/bin/chef-server-ctl
      dest: /usr/bin/chef-server-ctl
      state: link
  - name: Create mock PEM files
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock PEM content -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/{{ item }}
      mode: '0600'
    loop:
    - jtonello.pem
    - lab-validator.pem
  - name: Create mock service status files
    ansible.builtin.copy:
      content: active
      dest: /tmp/molecule_test/{{ item }}
      mode: '0644'
    loop:
    - chef-automate-status
    - chef-server-status
