---
argument_specs:
  main:
    short_description: Configure Redis cache service
    description:
      - Installs and configures a standalone Redis cache and removes unsupported replication directives.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks that handle the Redis password.
      cache_redis_service_name:
        type: str
        required: false
        default: redis
        description: Name of the Redis service to restart after configuration changes.
      cache_redis_config_path:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to the Redis instance configuration file.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
