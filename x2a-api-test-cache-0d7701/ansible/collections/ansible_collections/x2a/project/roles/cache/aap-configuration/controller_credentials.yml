---
controller_credentials:
  - name: Redis Authentication - cache
    description: Password used to authenticate clients to the Redis instance on port 6379; currently hardcoded in the Chef recipe and must be moved to protected
      AAP or Ansible Vault-backed storage.
    organization: Default
    credential_type: Redis Authentication
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
