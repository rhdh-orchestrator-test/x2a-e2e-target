---
controller_credentials:
- name: Chef User Credentials - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    user_key: '{{ vault_user_key }}'
- name: Chef Organization Credentials - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef Organization Credentials
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_validator_key: '{{ vault_org_validator_key }}'
- name: Chef Automate Admin Credentials - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef Automate Admin Credentials
  update_secrets: true
  inputs:
    admin_username: '{{ admin_username }}'
    admin_password: '{{ vault_admin_password }}'
