---
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Create directory for user and organization keys
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_key_dest }}"
    - "{{ chef_automate_org_validator_dest }}"
  when: chef_server_ctl_check.rc == 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ admin_username | default(username) }}" {{ useremail | default(username + '@example.com') }} "{{ password
      }}" --filename {{ chef_automate_user_key_dest }}
    creates: "{{ chef_automate_user_key_dest }}"
  become: true
  register: create_user_result
  changed_when: create_user_result.rc == 0
  no_log: true
  when: chef_server_ctl_check.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ org_name }} "{{ org_name }}" --association_user {{ username }} --filename {{ chef_automate_org_validator_dest }}
    creates: "{{ chef_automate_org_validator_dest }}"
  become: true
  register: create_org_result
  changed_when: create_org_result.rc == 0
  when: chef_server_ctl_check.rc == 0
