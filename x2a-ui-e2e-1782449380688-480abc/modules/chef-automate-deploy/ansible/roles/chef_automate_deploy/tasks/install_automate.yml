---
- name: Create temporary directory for Chef Automate installation
  ansible.builtin.file:
    path: /tmp/chef-automate-install
    state: directory
    mode: "0755"
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.gz"
    mode: "0644"
  register: download_result
- name: Extract Chef Automate CLI
  ansible.builtin.command:
    cmd: gunzip -f {{ chef_automate_cli_path }}.gz
    creates: "{{ chef_automate_cli_path }}"
  when: download_result.changed
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: "./chef-automate deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{ chef_automate_accept_terms
      | lower }} "
    creates: /hab
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
