---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Set vm.max_map_count kernel parameter
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ chef_automate_vm_max_map_count }}"
    state: present
    reload: true
  become: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ chef_automate_vm_dirty_expire_centisecs }}"
    state: present
    reload: true
  become: true
- name: Install required packages
  ansible.builtin.package:
    name:
      - curl
      - gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
  register: download_result
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c /tmp/chef-automate.zip > {{ chef_automate_cli_binary }} && chmod +x {{ chef_automate_cli_binary }}
    chdir: /tmp
    creates: "{{ chef_automate_cli_binary }}"
  when: download_result is changed
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: ./{{ chef_automate_cli_binary }} deploy --product automate --product infra-server --accept-terms-and-mlsa={{ 'true' if chef_automate_accept_terms else
      'false' }}
    chdir: /tmp
    creates: /etc/chef-server/chef-server.rb
  become: true
  register: deploy_result
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_user_name }} {{ chef_user_fullname }} {{ chef_user_email }} {{ password }} --filename {{ chef_user_key_file }}
    creates: /tmp/{{ chef_user_key_file }}
  become: true
  no_log: true
  when: deploy_result is changed
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} {{ chef_org_fullname | quote }} --association_user {{ chef_user_name }} --filename {{
      chef_org_validator_key_file }}
    creates: /tmp/{{ chef_org_validator_key_file }}
  become: true
  when: deploy_result is changed
