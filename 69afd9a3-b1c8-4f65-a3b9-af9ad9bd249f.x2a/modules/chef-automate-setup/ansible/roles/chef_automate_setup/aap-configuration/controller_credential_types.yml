---
controller_credential_types:
- name: Chef User Password
  description: Admin credentials for Chef Automate and Chef Infra Server
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Automate/Infra Server admin account
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Automate/Infra Server admin account
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
