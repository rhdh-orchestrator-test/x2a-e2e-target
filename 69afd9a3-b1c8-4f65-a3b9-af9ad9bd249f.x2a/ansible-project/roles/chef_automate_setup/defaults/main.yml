---
chef_automate_hostname: automate.chef.lab
chef_automate_vm_max_map_count: 262144
chef_automate_vm_dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_accept_terms: true
chef_user_name: "{{ username | default('admin') }}"
chef_user_fullname: Chef Administrator
chef_user_email: admin@example.com
chef_org_name: lab
chef_org_fullname: Chef Lab
chef_user_key_file: "{{ chef_user_name }}.pem"
chef_org_validator_key_file: "{{ chef_org_name }}-validator.pem"
chef_deploy_automate: true
