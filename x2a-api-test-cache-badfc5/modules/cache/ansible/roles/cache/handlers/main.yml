---
- name: Restart redis
  ansible.builtin.service:
    name: "{{ cache_redis_service_name }}"
    state: restarted
  listen: restart redis
- name: Restart memcached
  ansible.builtin.service:
    name: "{{ cache_memcached_service_name }}"
    state: restarted
  listen: restart memcached
- name: Reload redis
  ansible.builtin.service:
    name: "{{ cache_redis_service_name }}"
    state: reloaded
  listen: reload redis
