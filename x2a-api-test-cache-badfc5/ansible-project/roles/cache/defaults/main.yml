---
cache_redis_port: 6379
cache_redis_config_file: /etc/redis/{{ cache_redis_port }}.conf
cache_redis_log_dir: /var/log/redis
cache_redis_user: redis
cache_redis_group: redis
cache_memcached_port: 11211
cache_redis_service_name: redis_{{ cache_redis_port }}
cache_memcached_service_name: memcached
cache_redis_cleanup_patterns:
  - ^replica-serve-stale-data.*$
  - ^replica-read-only.*$
  - ^repl-ping-replica-period.*$
  - ^client-output-buffer-limit.*$
  - ^replica-priority.*$
