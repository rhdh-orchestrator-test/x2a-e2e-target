---
controller_credential_types:
- name: Redis Cache Authentication
  description: Redis server authentication credential for cache service
  kind: cloud
  inputs:
    fields:
    - id: redis_password
      type: string
      label: Redis Password
      secret: true
      help_text: Authentication password for Redis server on port 6379
    required:
    - redis_password
  injectors:
    extra_vars:
      redis_password: !unsafe '{{ redis_password }}'
