---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}"
  become: true
- name: Set vm.max_map_count kernel parameter
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ chef_automate_vm_max_map_count }}"
    state: present
    sysctl_set: true
    reload: true
  become: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ chef_automate_vm_dirty_expire_centisecs }}"
    state: present
    sysctl_set: true
    reload: true
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: chef_automate_cli_stat
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_path }}
    stdin: "{{ lookup('file', '/tmp/chef-automate_linux_amd64.zip') }}"
  args:
    executable: /bin/bash
    creates: "{{ chef_automate_cli_path }}"
  when: not chef_automate_cli_stat.stat.exists
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }} "
  args:
    creates: /hab
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} "{{ longusername }}" {{ useremail }} "{{ password }}" --filename {{ userfilename }}

      '
  args:
    creates: "{{ userfilename }}"
  become: true
  no_log: true
- name: Set permissions on user key file
  ansible.builtin.file:
    path: "{{ userfilename }}"
    mode: "{{ chef_automate_pem_file_mode }}"
    state: file
  become: false
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ orgname }} "{{ longorgname }}" --association_user {{ username }} --filename {{ orgfilename }}

      '
  args:
    creates: "{{ orgfilename }}"
  become: true
- name: Set permissions on organization validator key file
  ansible.builtin.file:
    path: "{{ orgfilename }}"
    mode: "{{ chef_automate_pem_file_mode }}"
    state: file
  become: false
