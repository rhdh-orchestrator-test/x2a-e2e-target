- name: Converge
  hosts: all
  gather_facts: true
  become: false
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '262144'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '20000'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        EXAMPLE_PEM_CONTENT_FOR_USER

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        EXAMPLE_PEM_CONTENT_FOR_ORG_VALIDATOR

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: "Service: automate-gateway\n  Status: running\nService: automate-postgresql\n  Status: running\nService: automate-elasticsearch\n  Status: running\nService:
        automate-ui\n  Status: running\n"
      dest: /tmp/molecule_test/automate-status.txt
      mode: '0644'
  - name: Create Chef Server status file
    ansible.builtin.copy:
      content: 'run: chef-server-nginx (pid 12345) 100 days

        run: chef-server-postgresql (pid 12346) 100 days

        run: chef-server-bookshelf (pid 12347) 100 days

        run: chef-server-oc_bifrost (pid 12348) 100 days

        run: chef-server-oc_id (pid 12349) 100 days

        '
      dest: /tmp/molecule_test/chef-server-status.txt
      mode: '0644'
  - name: Create user list file
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/user-list.txt
      mode: '0644'
  - name: Create org list file
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/org-list.txt
      mode: '0644'
  - name: Create netstat output file
    ansible.builtin.copy:
      content: tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      12345/nginx
      dest: /tmp/molecule_test/netstat-output.txt
      mode: '0644'
