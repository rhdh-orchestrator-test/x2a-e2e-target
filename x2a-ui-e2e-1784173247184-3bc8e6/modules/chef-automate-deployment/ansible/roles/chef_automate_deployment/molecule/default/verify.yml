- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname configuration
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check vm.max_map_count parameter
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_file
  - name: Assert max_map_count file exists
    ansible.builtin.assert:
      that:
      - max_map_count_file.stat.exists
      - max_map_count_file.stat.isreg
      fail_msg: max_map_count file not found
      success_msg: max_map_count file exists
  - name: Get max_map_count content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_content
    when: max_map_count_file.stat.exists
  - name: Assert max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - (max_map_count_content.content | b64decode | trim) == "262144"
      fail_msg: vm.max_map_count not set correctly
      success_msg: vm.max_map_count set correctly
    when: max_map_count_file.stat.exists
  - name: Check vm.dirty_expire_centisecs parameter
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_file
  - name: Assert dirty_expire_centisecs file exists
    ansible.builtin.assert:
      that:
      - dirty_expire_centisecs_file.stat.exists
      - dirty_expire_centisecs_file.stat.isreg
      fail_msg: dirty_expire_centisecs file not found
      success_msg: dirty_expire_centisecs file exists
  - name: Get dirty_expire_centisecs content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_content
    when: dirty_expire_centisecs_file.stat.exists
  - name: Assert dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
      fail_msg: vm.dirty_expire_centisecs not set correctly
      success_msg: vm.dirty_expire_centisecs set correctly
    when: dirty_expire_centisecs_file.stat.exists
  - name: Check Chef Automate CLI
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.isreg
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate deployment
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert Chef Automate is deployed
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef Automate not deployed
      success_msg: Chef Automate deployed
  - name: Check Chef Automate status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/automate-status.txt
    register: automate_status_file
    tags: molecule-notest
  - name: Get Chef Automate status content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/automate-status.txt
    register: automate_status_content
    when: automate_status_file.stat.exists
    tags: molecule-notest
  - name: Assert Chef Automate services are running
    ansible.builtin.assert:
      that:
      - automate_status_content.content | b64decode | regex_search('Status: running')
      fail_msg: Chef Automate services not running
      success_msg: Chef Automate services running
    when: automate_status_file.stat.exists
    tags: molecule-notest
  - name: Check Chef Server status file
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-server-status.txt
    register: chef_server_status_file
    tags: molecule-notest
  - name: Get Chef Server status content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/chef-server-status.txt
    register: chef_server_status_content
    when: chef_server_status_file.stat.exists
    tags: molecule-notest
  - name: Assert Chef Server services are running
    ansible.builtin.assert:
      that:
      - chef_server_status_content.content | b64decode | regex_search('run:')
      fail_msg: Chef Server services not running
      success_msg: Chef Server services running
    when: chef_server_status_file.stat.exists
    tags: molecule-notest
  - name: Check user PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_pem_file
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem_file.stat.exists
      - user_pem_file.stat.isreg
      - user_pem_file.stat.mode == "0600"
      fail_msg: User PEM file not found or incorrect permissions
      success_msg: User PEM file exists with correct permissions
  - name: Check organization validator PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_pem_file
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_pem_file.stat.exists
      - org_pem_file.stat.isreg
      - org_pem_file.stat.mode == "0600"
      fail_msg: Organization validator PEM file not found or incorrect permissions
      success_msg: Organization validator PEM file exists with correct permissions
  - name: Check user list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/user-list.txt
    register: user_list_file
    tags: molecule-notest
  - name: Get user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/user-list.txt
    register: user_list_content
    when: user_list_file.stat.exists
    tags: molecule-notest
  - name: Assert user exists in user list
    ansible.builtin.assert:
      that:
      - user_list_content.content | b64decode | regex_search('jtonello')
      fail_msg: User not found in user list
      success_msg: User found in user list
    when: user_list_file.stat.exists
    tags: molecule-notest
  - name: Check organization list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/org-list.txt
    register: org_list_file
    tags: molecule-notest
  - name: Get organization list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/org-list.txt
    register: org_list_content
    when: org_list_file.stat.exists
    tags: molecule-notest
  - name: Assert organization exists in organization list
    ansible.builtin.assert:
      that:
      - org_list_content.content | b64decode | regex_search('lab')
      fail_msg: Organization not found in organization list
      success_msg: Organization found in organization list
    when: org_list_file.stat.exists
    tags: molecule-notest
  - name: Check netstat output file
    ansible.builtin.stat:
      path: /tmp/molecule_test/netstat-output.txt
    register: netstat_file
    tags: molecule-notest
  - name: Get netstat output content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/netstat-output.txt
    register: netstat_content
    when: netstat_file.stat.exists
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - netstat_content.content | b64decode | regex_search('0.0.0.0:443')
      fail_msg: Port 443 not listening
      success_msg: Port 443 is listening
    when: netstat_file.stat.exists
    tags: molecule-notest
