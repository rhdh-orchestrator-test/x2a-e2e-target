---
controller_credential_types:
- name: Chef User Authentication
  description: Credential type for Chef User Authentication
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef user account
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef user account
    - id: email
      type: string
      label: Email
      help_text: Email address for Chef user account
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
