---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check if the SSL config file exists
    - name: Check if SSL config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_conf_file

    - name: Assert SSL config file exists
      ansible.builtin.assert:
        that:
          - ssl_conf_file.stat.exists
          - ssl_conf_file.stat.isreg
        fail_msg: "SSL config file does not exist"
        success_msg: "SSL config file exists"

    # Check if the SSL config file has been properly modified
    - name: Get SSL config file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_conf_content

    - name: Assert SSL config has been properly modified
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in ssl_conf_content.content | b64decode"
        fail_msg: "SSL config was not properly modified to disable vulnerable protocols"
        success_msg: "SSL config was properly modified to disable vulnerable protocols"

    # The following checks would be performed in a real environment but can't be tested in a container
    # They are tagged with molecule-notest to be skipped during molecule testing
    
    - name: Check Apache service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Check SSH service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert SSH service is running
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
          - "ansible_facts.services['sshd.service'].state == 'running'"
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"
      tags: molecule-notest

    - name: Validate Apache configuration
      ansible.builtin.command: apache2ctl configtest
      changed_when: false
      tags: molecule-notest

    - name: Check TLS version support
      ansible.builtin.command: nmap --script ssl-enum-ciphers -p 443 localhost
      changed_when: false
      register: nmap_result
      tags: molecule-notest

    - name: Assert only TLSv1.2 is enabled
      ansible.builtin.assert:
        that:
          - "'TLSv1.0' not in nmap_result.stdout"
          - "'TLSv1.1' not in nmap_result.stdout"
          - "'TLSv1.2' in nmap_result.stdout"
        fail_msg: "TLS configuration is not secure"
        success_msg: "TLS configuration is secure"
      tags: molecule-notest