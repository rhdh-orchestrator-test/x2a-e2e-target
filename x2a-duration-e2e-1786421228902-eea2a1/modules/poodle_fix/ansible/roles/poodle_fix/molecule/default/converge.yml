---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create the directory structure needed for testing
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/apache2/mods-available

    # Create a mock Apache SSL config file that will be modified by the role
    - name: Create mock Apache SSL config file
      ansible.builtin.copy:
        content: |
          # Mock Apache SSL configuration file for testing
          SSLEngine on
          SSLProtocol all -SSLv3
          SSLHonorCipherOrder on
        dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
        mode: "0644"

    # Include the role but use a modified task that targets our test directory
    - name: Apply role with modified paths
      block:
        - name: Fix SSL in Apache (test version)
          ansible.builtin.replace:
            dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
            regexp: ^SSLProtocol.*$
            replace: SSLProtocol -all +TLSv1.2
          register: ssl_config_result
          
        - name: Show config change result
          ansible.builtin.debug:
            var: ssl_config_result