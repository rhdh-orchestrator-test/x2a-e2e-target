---
deploy_automate_hostname: automate.chef.lab
deploy_automate_max_map_count: 262144
deploy_automate_dirty_expire_centisecs: 20000
deploy_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
deploy_automate_accept_terms: true
deploy_automate_products:
  - automate
  - infra-server
deploy_automate_username: "{{ username | default('admin') }}"
deploy_automate_longusername: "{{ longusername | default('Administrator') }}"
deploy_automate_useremail: "{{ useremail | default('admin@example.com') }}"
deploy_automate_orgname: "{{ organization_name | default('default') }}"
deploy_automate_longorgname: "{{ organization_full_name | default('Default Organization') }}"
deploy_automate_user_key_path: "{{ user_key_path | default(deploy_automate_username + '.pem') }}"
deploy_automate_validator_key_path: "{{ validator_key_path | default(deploy_automate_orgname + '-validator.pem') }}"
