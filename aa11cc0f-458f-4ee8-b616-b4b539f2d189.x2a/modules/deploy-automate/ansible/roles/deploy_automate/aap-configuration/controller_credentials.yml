---
controller_credentials:
- name: Chef User Credentials - deploy_automate
  description: Credential for deploy_automate
  organization: Default
  credential_type: Chef User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    user_key_path: '{{ user_key_path }}'
- name: Chef Organization Credentials - deploy_automate
  description: Credential for deploy_automate
  organization: Default
  credential_type: Chef Organization Credentials
  update_secrets: true
  inputs:
    organization_name: '{{ organization_name }}'
    organization_full_name: '{{ organization_full_name }}'
    validator_key_path: '{{ validator_key_path }}'
