---
controller_credential_types:
- name: Chef User Credentials
  description: Credential type for Chef User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Chef Username
      help_text: Username for the initial Chef user account
    - id: password
      type: string
      label: Chef User Password
      secret: true
      help_text: Password for the initial Chef user account
    - id: user_key_path
      type: string
      label: User Key Path
      help_text: Path where the user's private key (.pem file) will be saved
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      user_key_path: !unsafe '{{ user_key_path }}'
- name: Chef Organization Credentials
  description: Credential type for Chef Organization Credentials
  kind: cloud
  inputs:
    fields:
    - id: organization_name
      type: string
      label: Organization Name
      help_text: Name of the Chef organization to create
    - id: organization_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name of the Chef organization
    - id: validator_key_path
      type: string
      label: Validator Key Path
      help_text: Path where the organization validator key (.pem file) will be saved
    required:
    - organization_name
    - organization_full_name
  injectors:
    extra_vars:
      organization_name: !unsafe '{{ organization_name }}'
      organization_full_name: !unsafe '{{ organization_full_name }}'
      validator_key_path: !unsafe '{{ validator_key_path }}'
