---
- name: Check if Chef user key file exists
  ansible.builtin.stat:
    path: "{{ chef_user_key_file }}"
  register: user_key_file
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_user_name }} {{ chef_user_fullname }} {{ chef_user_email }} "{{ chef_user_password }}" --filename {{
      chef_user_key_file }}
    creates: "{{ chef_user_key_file }}"
  become: true
  register: create_user_result
  changed_when: create_user_result.rc == 0
  failed_when: create_user_result.rc != 0 and "already exists" not in create_user_result.stderr
  no_log: true
  when: not user_key_file.stat.exists
- name: Check if Chef organization validator key file exists
  ansible.builtin.stat:
    path: "{{ chef_org_validator_key_file }}"
  register: org_key_file
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_fullname }}" --association_user {{ chef_user_name }} --filename {{
      chef_org_validator_key_file }}
    creates: "{{ chef_org_validator_key_file }}"
  become: true
  register: create_org_result
  changed_when: create_org_result.rc == 0
  failed_when: create_org_result.rc != 0 and "already exists" not in create_org_result.stderr
  when: not org_key_file.stat.exists
