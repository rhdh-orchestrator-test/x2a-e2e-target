---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure that mimics what would be created by the role
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef
        - /tmp/molecule_test/etc/systemd/system
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/chef-server

    # Simulate Chef Automate CLI download and extraction
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate Chef user key file
    - name: Create Chef user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          EXAMPLE_KEY_CONTENT_PLACEHOLDER
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/jtonello.pem"
        mode: "0600"

    # Simulate Chef organization validator key file
    - name: Create Chef organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          EXAMPLE_VALIDATOR_KEY_CONTENT_PLACEHOLDER
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/lab-validator.pem"
        mode: "0600"

    # Simulate Chef Automate configuration file
    - name: Create Chef Automate configuration file
      ansible.builtin.copy:
        content: |
          [chef_automate]
          hostname = "automate.chef.lab"
          products = ["automate", "infra-server"]
          accept_terms_and_mlsa = true
        dest: "/tmp/molecule_test/var/opt/chef-automate/config.toml"
        mode: "0644"

    # Simulate Chef Server configuration
    - name: Create Chef Server configuration file
      ansible.builtin.copy:
        content: |
          topology "standalone"
          api_fqdn "automate.chef.lab"
          server "automate.chef.lab",
            api_fqdn "automate.chef.lab",
            chef_server_webui true
        dest: "/tmp/molecule_test/etc/chef/chef-server.rb"
        mode: "0644"

    # Simulate systemd service files
    - name: Create Chef Automate service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Automate
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/chef-automate start
          ExecStop=/usr/bin/chef-automate stop
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: "/tmp/molecule_test/etc/systemd/system/chef-automate.service"
        mode: "0644"

    # Simulate user and organization creation output files
    - name: Create user list output file
      ansible.builtin.copy:
        content: |
          User jtonello
          ============
          username: jtonello
          first name: John
          last name: Tonello
          email: jtonello@chef.lab
        dest: "/tmp/molecule_test/var/opt/chef-server/user-list.txt"
        mode: "0644"

    - name: Create organization list output file
      ansible.builtin.copy:
        content: |
          Organization lab
          ===============
          name: lab
          full name: Chef Lab
          associated users: jtonello
        dest: "/tmp/molecule_test/var/opt/chef-server/org-list.txt"
        mode: "0644"