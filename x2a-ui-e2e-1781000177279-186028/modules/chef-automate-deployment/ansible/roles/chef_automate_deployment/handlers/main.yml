---
- name: Restart Chef Automate
  ansible.builtin.command:
    cmd: chef-automate restart
    creates: /var/run/chef-automate-restart.marker
  become: true
  listen: restart chef-automate
  changed_when: true
- name: Restart Chef Infra Server
  ansible.builtin.command:
    cmd: chef-server-ctl restart
    creates: /var/run/chef-server-restart.marker
  become: true
  listen: restart chef-server
  changed_when: true
