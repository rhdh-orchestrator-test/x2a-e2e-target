---
- name: Create nginx sites-available directory
  ansible.builtin.file:
    path: /etc/nginx/sites-available
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create nginx sites-enabled directory
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render nginx virtual-host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_nginx_multisite_site['key'] }} # noqa: R114 - filename from role-defined sites dictionary
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site
  notify: Reload nginx
  vars:
    site_name: "{{ item_nginx_multisite_site['key'] }}"
    site_root: "{{ item_nginx_multisite_site['value']['root'] }}"
    site_certificate: "{{ item_nginx_multisite_site['value']['certificate'] }}"
    site_key: "{{ item_nginx_multisite_site['value']['key'] }}"

- name: Enable nginx virtual hosts
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_nginx_multisite_site['key'] }}
    dest: /etc/nginx/sites-enabled/{{ item_nginx_multisite_site['key'] }} # noqa: R114 - filename from role-defined sites dictionary
    state: link
    owner: root
    group: root
    mode: "0755"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
