---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application and PostgreSQL database.
    description:
      - Deploys the FastAPI tutorial application from Git and configures its Python environment.
      - Installs and configures PostgreSQL and creates the application database.
    options:
      fastapi_app_directory:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_venv:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment directory.
      fastapi_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by the FastAPI service.
      fastapi_bind_address:
        type: str
        required: false
        default: 0.0.0.0
        description: Address on which the FastAPI service listens.
      fastapi_db_user:
        type: str
        required: false
        default: "{{ db_username }}"
        description: PostgreSQL application user supplied by the AAP credential.
      fastapi_db_name:
        type: str
        required: false
        default: "{{ db_name }}"
        description: PostgreSQL application database supplied by the AAP credential.
      fastapi_db_host:
        type: str
        required: false
        default: "{{ db_host }}"
        description: PostgreSQL host supplied by the AAP credential.
      fastapi_db_password:
        type: str
        required: false
        default: "{{ db_password }}"
        description: PostgreSQL password supplied by the AAP credential.
      fastapi_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the database password.
