---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials and connection settings for the FastAPI application’s PostgreSQL database, currently hardcoded in the Chef recipe and to be 
      migrated to Ansible Vault.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      db_name: "{{ db_name }}"
      db_host: "{{ db_host }}"
