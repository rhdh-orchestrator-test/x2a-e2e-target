---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the FastAPI application’s PostgreSQL database, currently hardcoded in the Chef recipe and to be 
      migrated to Ansible Vault.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; store this value in Ansible Vault.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname or address of the PostgreSQL server.
      required:
        - db_username
        - db_password
        - db_name
        - db_host
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_name: !unsafe "{{ db_name }}"
        db_host: !unsafe "{{ db_host }}"
