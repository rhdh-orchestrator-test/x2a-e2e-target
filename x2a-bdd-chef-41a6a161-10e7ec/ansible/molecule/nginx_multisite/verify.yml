---
# Unsupported pre-flight checks: diagnostic log/journal output, exact certificate lifetime,
# exact kernel sysctl values, and complete expanded configuration details without stated values.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Verify required services are active and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts['services'][item_service['name']]['state'] == 'running'
          - ansible_facts['services'][item_service['name']]['status'] == 'enabled'
        fail_msg: "A required service is not active and enabled."
      loop:
        - name: nginx.service
        - name: fail2ban.service
      loop_control:
        loop_var: item_service

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv: [nginx, -t]
      register: nginx_config_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that: nginx_config_test['rc'] == 0
        fail_msg: "nginx configuration validation failed."

    - name: Inspect expanded nginx configuration
      ansible.builtin.command:
        argv: [nginx, -T]
      register: nginx_expanded_config
      changed_when: false

    - name: Assert configured hostnames are present
      ansible.builtin.assert:
        that: item_hostname in nginx_expanded_config['stdout']
        fail_msg: "A required hostname is missing from nginx configuration."
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_hostname

    - name: Check required files
      ansible.builtin.stat:
        path: "{{ item_file }}"
        follow: false
      register: required_files
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_file

    - name: Assert required files exist
      ansible.builtin.assert:
        that:
          - item_file_result['stat']['exists']
          - item_file_result['stat']['isreg']
        fail_msg: "A required deployment file is missing."
      loop: "{{ required_files['results'] }}"
      loop_control:
        loop_var: item_file_result

    - name: Check site links
      ansible.builtin.stat:
        path: "{{ item_link['path'] }}"
        follow: false
      register: site_links
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_link

    - name: Assert site links have expected targets
      ansible.builtin.assert:
        that:
          - item_link_result['stat']['islnk']
          - item_link_result['stat']['lnk_source'] == item_link_result['item']['target']
        fail_msg: "An nginx site link is missing or points to the wrong target."
      loop: "{{ site_links['results'] }}"
      loop_control:
        loop_var: item_link_result

    - name: Check default site
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert default site is absent
      ansible.builtin.assert:
        that: not default_site['stat']['exists']
        fail_msg: "The default nginx site is still present."

    - name: Check HTTP redirects
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_http['host'] }}"
        follow_redirects: none
        status_code: 301
        return_content: false
      register: http_redirects
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_http

    - name: Assert HTTP redirects target HTTPS
      ansible.builtin.assert:
        that:
          - item_redirect['status'] == 301
          - item_redirect['location'] is match('^https://')
        fail_msg: "An HTTP virtual host did not redirect to HTTPS."
      loop: "{{ http_redirects['results'] }}"
      loop_control:
        loop_var: item_redirect

    - name: Check HTTPS responses
      ansible.builtin.uri:
        url: "https://{{ item_https['host'] }}/"
        validate_certs: false
        status_code: 200
        return_content: true
      register: https_responses
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_https

    - name: Assert HTTPS responses serve content
      ansible.builtin.assert:
        that:
          - item_https_result['status'] == 200
          - item_https_result['content'] | length > 0
        fail_msg: "An HTTPS virtual host did not serve site content."
      loop: "{{ https_responses['results'] }}"
      loop_control:
        loop_var: item_https_result

    - name: Check HTTPS security headers
      ansible.builtin.uri:
        url: "https://{{ item_header['host'] }}/"
        validate_certs: false
        status_code: 200
        return_content: false
      register: header_responses
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_header

    - name: Assert required HTTPS security headers are present
      ansible.builtin.assert:
        that:
          - item_headers['headers']['strict-transport-security'] is defined
          - item_headers['headers']['x-frame-options'] is defined
          - item_headers['headers']['x-content-type-options'] is defined
          - item_headers['headers']['x-xss-protection'] is defined
          - item_headers['headers']['referrer-policy'] is defined
          - item_headers['headers']['content-security-policy'] is defined
        fail_msg: "An HTTPS response is missing a required security header."
      loop: "{{ header_responses['results'] }}"
      loop_control:
        loop_var: item_headers

    - name: Validate TLS certificates
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
          - -issuer
          - -dates
      register: certificate_checks
      changed_when: false
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          hostname: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          hostname: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          hostname: status.cluster.local
      loop_control:
        loop_var: item_certificate

    - name: Assert certificates identify their hosts
      ansible.builtin.assert:
        that:
          - item_certificate_result['rc'] == 0
          - item_certificate_result['stdout'] is search(item_certificate_result['item']['hostname'])
        fail_msg: "A required TLS certificate is invalid or has the wrong subject."
      loop: "{{ certificate_checks['results'] }}"
      loop_control:
        loop_var: item_certificate_result

    - name: Check private-key permissions and ownership
      ansible.builtin.stat:
        path: "{{ item_key }}"
      register: private_keys
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key

    - name: Assert private keys have required permissions and ownership
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['mode'] == '0640'
          - item_key_result['stat']['pw_name'] == 'root'
          - item_key_result['stat']['gr_name'] == 'ssl-cert'
        fail_msg: "A TLS private key has incorrect permissions or ownership."
      loop: "{{ private_keys['results'] }}"
      loop_control:
        loop_var: item_key_result

    - name: Check nginx listening ports
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_port }}"
        state: started
        timeout: 5
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_port

    - name: Check UFW status
      ansible.builtin.command:
        argv: [ufw, status, verbose]
      register: ufw_status
      changed_when: false

    - name: Assert UFW policy and allowances
      ansible.builtin.assert:
        that:
          - ufw_status['stdout'] is search('Status: active')
          - ufw_status['stdout'] is search('Default: deny \\(incoming\\)')
          - ufw_status['stdout'] is search('22')
          - ufw_status['stdout'] is search('80')
          - ufw_status['stdout'] is search('443')
        fail_msg: "UFW is not active with the required policy and allowances."

    - name: Validate SSH daemon configuration
      ansible.builtin.command:
        argv: [sshd, -t]
      register: sshd_config_test
      changed_when: false

    - name: Assert SSH daemon configuration is valid
      ansible.builtin.assert:
        that: sshd_config_test['rc'] == 0
        fail_msg: "The SSH daemon configuration is invalid."

    - name: Read SSH hardening settings
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config

    - name: Assert SSH hardening settings are present
      ansible.builtin.assert:
        that:
          - (sshd_config['content'] | b64decode) is search('(?m)^PermitRootLogin no$')
          - (sshd_config['content'] | b64decode) is search('(?m)^PasswordAuthentication no$')
        fail_msg: "SSH root login or password authentication is not disabled."

    - name: Check fail2ban jails
      ansible.builtin.command:
        argv: [fail2ban-client, status, "{{ item_jail }}"]
      register: fail2ban_jails
      changed_when: false
      loop:
        - sshd
        - nginx-http-auth
        - nginx-limit-req
        - nginx-botsearch
      loop_control:
        loop_var: item_jail

    - name: Assert fail2ban jails are available
      ansible.builtin.assert:
        that: item_jail_result['rc'] == 0
        fail_msg: "A required fail2ban jail is unavailable."
      loop: "{{ fail2ban_jails['results'] }}"
      loop_control:
        loop_var: item_jail_result
