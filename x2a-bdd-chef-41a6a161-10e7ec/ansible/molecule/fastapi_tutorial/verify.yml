---
# Unsupported pre-flight checks: python3/git version output, Git revision/commit output,
# unvalued .env contents, service status/journal/process diagnostics, endpoint response
# bodies/statuses, authenticated PostgreSQL client connection, and command output without
# an explicitly stated expected result.
- name: Verify fastapi-tutorial application and PostgreSQL pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Check application paths from the pre-flight file checks
      ansible.builtin.stat:
        path: "{{ item_fastapi_path['path'] }}"
      loop:
        - name: application directory
          path: /opt/fastapi-tutorial
        - name: requirements file
          path: /opt/fastapi-tutorial/requirements.txt
        - name: virtual environment Python
          path: /opt/fastapi-tutorial/venv/bin/python
        - name: virtual environment Uvicorn
          path: /opt/fastapi-tutorial/venv/bin/uvicorn
        - name: application environment file
          path: /opt/fastapi-tutorial/.env
        - name: systemd unit
          path: /etc/systemd/system/fastapi-tutorial.service
      loop_control:
        loop_var: item_fastapi_path
      register: fastapi_path_checks

    - name: Assert application paths exist
      ansible.builtin.assert:
        that:
          - item_fastapi_path_check['stat']['exists']
        fail_msg: "A required fastapi-tutorial path is missing."
      loop: "{{ fastapi_path_checks['results'] }}"
      loop_control:
        loop_var: item_fastapi_path_check

    - name: Read the application environment file
      ansible.builtin.slurp:
        src: /opt/fastapi-tutorial/.env
      register: fastapi_env_file

    - name: Assert the pre-flight environment entries exist
      ansible.builtin.assert:
        that:
          - (fastapi_env_file['content'] | b64decode) is search('(?m)^PROJECT_NAME=')
          - (fastapi_env_file['content'] | b64decode) is search('(?m)^API_VERSION=')
          - (fastapi_env_file['content'] | b64decode) is search('(?m)^DATABASE_URL=')
        fail_msg: "The expected application environment entries are missing."

    - name: Verify the systemd unit syntax
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/fastapi-tutorial.service
      changed_when: false

    - name: Read the systemd unit file
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_unit_file

    - name: Assert the expected application service configuration
      ansible.builtin.assert:
        that:
          - (fastapi_unit_file['content'] | b64decode) is search('(?m)^User=root$')
          - (fastapi_unit_file['content'] | b64decode) is search('(?m)^WorkingDirectory=/opt/fastapi-tutorial$')
          - (fastapi_unit_file['content'] | b64decode) is search('(?m)^ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000$')
        fail_msg: "The systemd unit does not contain the expected application settings."

    - name: Gather service facts for application and database services
      ansible.builtin.service_facts:

    - name: Assert fastapi-tutorial is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['fastapi-tutorial.service']['status'] == 'enabled'
          - ansible_facts['services']['fastapi-tutorial.service']['state'] == 'running'
        fail_msg: "The fastapi-tutorial service is not enabled and running."

    - name: Assert PostgreSQL is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['postgresql.service']['status'] == 'enabled'
          - ansible_facts['services']['postgresql.service']['state'] == 'running'
        fail_msg: "The PostgreSQL service is not enabled and running."

    - name: Check PostgreSQL role
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT 1 FROM pg_roles WHERE rolname='fastapi';
      changed_when: false
      register: fastapi_role_check

    - name: Assert the fastapi PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - fastapi_role_check['stdout'] | trim == '1'
        fail_msg: "The expected PostgreSQL role is missing."

    - name: Check PostgreSQL database and owner
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT datname, pg_catalog.pg_get_userbyid(datdba) FROM pg_database WHERE datname='fastapi_db';
      changed_when: false
      register: fastapi_database_check

    - name: Assert the fastapi_db database and owner
      ansible.builtin.assert:
        that:
          - fastapi_database_check['stdout'] | trim == 'fastapi_db|fastapi'
        fail_msg: "The expected PostgreSQL database or owner is missing."

    - name: Check PostgreSQL database CONNECT privilege
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT has_database_privilege('fastapi', 'fastapi_db', 'CONNECT');
      changed_when: false
      register: fastapi_connect_check

    - name: Assert the fastapi role can connect to fastapi_db
      ansible.builtin.assert:
        that:
          - fastapi_connect_check['stdout'] | trim == 't'
        fail_msg: "The fastapi role does not have CONNECT privilege on fastapi_db."

    - name: Check Fedora or RHEL PostgreSQL initialization path
      ansible.builtin.stat:
        path: /var/lib/pgsql/data/PG_VERSION
      when: ansible_facts['os_family'] in ['RedHat', 'Fedora']
      register: fastapi_pg_init_check

    - name: Assert Fedora or RHEL PostgreSQL is initialized
      ansible.builtin.assert:
        that:
          - fastapi_pg_init_check['stat']['exists']
        fail_msg: "The Fedora/RHEL PostgreSQL data directory is not initialized."
      when: ansible_facts['os_family'] in ['RedHat', 'Fedora']
