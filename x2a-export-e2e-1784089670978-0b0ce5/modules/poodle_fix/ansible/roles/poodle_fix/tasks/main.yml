---
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: apache2
    state: present
- name: Ensure Apache SSL module is enabled
  ansible.builtin.command: a2enmod ssl
  args:
    creates: /etc/apache2/mods-enabled/ssl.load
  register: ssl_enabled
  changed_when: ssl_enabled.rc == 0
- name: Ensure Apache config directory exists
  ansible.builtin.file:
    path: "{{ poodle_fix_apache_config_path | dirname }}"
    state: directory
    mode: "0755"
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: "{{ poodle_fix_apache_config_path }}"
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol {{ poodle_fix_ssl_protocol }}
    mode: "0644"
  notify:
    - Restart apache
    - Restart sshd
