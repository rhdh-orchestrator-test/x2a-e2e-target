---
argument_specs:
  main:
    short_description: Install and configure caching services (Redis and memcached)
    description:
      - Installs and configures Redis server with authentication
      - Installs and configures memcached service
      - Creates necessary directories and users for Redis
      - Removes problematic replica settings from Redis configuration
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for Redis server to listen on
      cache_redis_password:
        type: str
        required: true
        description: Redis authentication password (injected by AAP credential type)
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory for Redis log files
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to Redis configuration file
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: System user for Redis service
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: System group for Redis service
      cache_memcached_enabled:
        type: bool
        required: false
        default: true
        description: Whether to enable memcached service
      cache_redis_remove_settings:
        type: list
        elements: str
        required: false
        default:
          - replica-serve-stale-data
          - replica-read-only
          - repl-ping-replica-period
          - client-output-buffer-limit
          - replica-priority
        description: List of Redis configuration settings to remove from config file
