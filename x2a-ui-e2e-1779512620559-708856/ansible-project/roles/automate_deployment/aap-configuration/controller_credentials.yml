---
controller_credentials:
- name: Chef Infra Server Admin - automate_deployment
  description: Credential for automate_deployment
  organization: Default
  credential_type: Chef Infra Server Admin
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
- name: SSL Certificate - automate_deployment
  description: Credential for automate_deployment
  organization: Default
  credential_type: SSL Certificate
  update_secrets: true
  inputs:
    private_key: '{{ vault_private_key }}'
