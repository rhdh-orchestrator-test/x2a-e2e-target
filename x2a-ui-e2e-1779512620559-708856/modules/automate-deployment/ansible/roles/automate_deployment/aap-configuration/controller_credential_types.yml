---
controller_credential_types:
- name: Chef Infra Server Admin
  description: Credential type for Chef Infra Server Admin
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Admin Username
      help_text: Username for the initial admin user of Chef Infra Server
    - id: password
      type: string
      label: Admin Password
      secret: true
      help_text: Password for the initial admin user of Chef Infra Server
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name for the admin user
    - id: email
      type: string
      label: Email Address
      help_text: Email address for the admin user
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
- name: SSL Certificate
  description: Credential type for SSL Certificate
  kind: cloud
  inputs:
    fields:
    - id: private_key
      type: string
      label: SSL Private Key
      secret: true
      help_text: Private key for SSL certificate generation
    required:
    - private_key
  injectors:
    extra_vars:
      private_key: !unsafe '{{ private_key }}'
