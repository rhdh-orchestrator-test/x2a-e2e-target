---
argument_specs:
  main:
    short_description: Configures nginx with multiple SSL-enabled subdomains
    description:
      - Installs and hardens nginx, fail2ban, UFW, SSH, and kernel networking settings.
      - Configures data-driven virtual hosts and self-signed TLS assets.
    options:
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for TLS certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for TLS private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW is enabled.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide sensitive task output.
      nginx_sites:
        type: dict
        required: false
        default: {}
        description: Mapping of site names to document roots and SSL settings.
      site_token:
        type: str
        required: true
        description: Site token injected by an AAP credential type.
      tls_private_key:
        type: str
        required: true
        description: TLS private key injected by an AAP credential type.
