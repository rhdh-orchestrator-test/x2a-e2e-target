---
controller_credential_types:
  - name: Nginx Site Token
    description: Secret token loaded from the Chef encrypted data bag nginx_secrets/site and deployed for Nginx use.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Site Token
          secret: true
          help_text: Secret token consumed by the Nginx multisite configuration.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
  - name: Nginx TLS Private Keys
    description: Self-signed TLS private keys generated locally for each SSL-enabled Nginx site.
    kind: cloud
    inputs:
      fields:
        - id: tls_private_key
          type: string
          label: TLS Private Key
          secret: true
          help_text: Private key for an SSL-enabled Nginx site, stored under /etc/ssl/private/<site_name>.key.
      required:
        - tls_private_key
    injectors:
      extra_vars:
        tls_private_key: !unsafe "{{ tls_private_key }}"
