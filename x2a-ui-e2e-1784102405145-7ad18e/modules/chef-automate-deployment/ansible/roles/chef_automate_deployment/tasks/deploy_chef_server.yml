---
- name: Set system hostname
  ansible.builtin.command:
    cmd: hostnamectl set-hostname {{ chef_automate_hostname }}
  become: true
  changed_when: true
- name: Set vm.max_map_count kernel parameter
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ chef_automate_vm_max_map_count }}"
    state: present
    sysctl_set: true
  become: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ chef_automate_vm_dirty_expire_centisecs }}"
    state: present
    sysctl_set: true
  become: true
- name: Ensure required directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  become: true
  loop:
    - "{{ chef_automate_hab_path }}"
    - "{{ chef_automate_config_path }}"
    - "{{ chef_server_etc_path }}"
    - "{{ chef_server_var_path }}"
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_path }} < /tmp/chef-automate_linux_amd64.zip && chmod +x {{ chef_automate_cli_path }}
  args:
    creates: "{{ chef_automate_cli_path }}"
  changed_when: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: ./chef-automate deploy --product infra-server --accept-terms-and-mlsa=true
  args:
    creates: /hab
  become: true
  changed_when: true
- name: Ensure Chef Server CLI is available
  ansible.builtin.wait_for:
    path: /usr/bin/chef-server-ctl
    timeout: 300
    sleep: 10
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_automate_username }}  "{{ full_name }}"  {{ email }}  "{{ password }}"  --filename {{ chef_automate_user_pem_filename
      }}

      '
  args:
    creates: "{{ chef_automate_user_pem_filename }}"
  become: true
  changed_when: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_automate_org_name }}  "{{ chef_automate_org_long_name }}"  --association_user {{ chef_automate_username }}  --filename
      {{ chef_automate_org_pem_filename }}

      '
  args:
    creates: "{{ chef_automate_org_pem_filename }}"
  become: true
  changed_when: true
