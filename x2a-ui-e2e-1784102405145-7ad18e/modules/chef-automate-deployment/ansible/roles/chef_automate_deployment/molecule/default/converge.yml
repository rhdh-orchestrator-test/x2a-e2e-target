- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    password: password
    email: jtonello@chef.lab
    full_name: John Tonello
    chef_automate_deploy_with_infra_server: true
  tasks:
  - name: Create required directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '262144'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '20000'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI v1.0.0'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create hab directory to simulate deployment
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create chef-server-ctl status output
    ansible.builtin.copy:
      content: 'run: service_name: bookshelf

        run: service_name: oc_bifrost

        run: service_name: oc_id

        run: service_name: opscode-erchef

        run: service_name: opscode-expander

        run: service_name: opscode-solr4

        run: service_name: postgresql

        run: service_name: rabbitmq

        run: service_name: redis_lb

        '
      dest: /tmp/molecule_test/chef-server-status.txt
      mode: '0644'
  - name: Create chef-automate status output
    ansible.builtin.copy:
      content: 'Service Name                    Status          PID

        automate-cs-bookshelf           running         12345

        automate-cs-oc-bifrost          running         12346

        automate-cs-oc-erchef           running         12347

        automate-cs-nginx               running         12348

        automate-elasticsearch          running         12349

        automate-postgresql             running         12350

        automate-nginx                  running         12351

        '
      dest: /tmp/molecule_test/chef-automate-status.txt
      mode: '0644'
  - name: Create user list output
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/user-list.txt
      mode: '0644'
  - name: Create org list output
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/org-list.txt
      mode: '0644'
  - name: Create netstat output
    ansible.builtin.copy:
      content: tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      12345/nginx
      dest: /tmp/molecule_test/netstat-output.txt
      mode: '0644'
  - name: Include chef_automate_deployment role
    ansible.builtin.include_role:
      name: chef_automate_deployment
    vars:
      chef_automate_hab_path: /tmp/molecule_test/hab
      chef_automate_config_path: /tmp/molecule_test/etc/chef-automate
      chef_server_etc_path: /tmp/molecule_test/etc/opscode
      chef_server_var_path: /tmp/molecule_test/var/opt/opscode
      chef_automate_cli_path: /tmp/molecule_test/tmp/chef-automate
    tags: molecule-idempotence-notest
