---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache web server
    description:
      - Fixes the POODLE SSL vulnerability by configuring Apache to use only TLSv1.2 protocol.
      - Modifies Apache SSL configuration to disable vulnerable protocols.
      - Restarts Apache service after configuration changes.
    options:
      apache_ssl_config_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file.
      ssl_protocol_config:
        type: str
        required: false
        default: SSLProtocol -all +TLSv1.2
        description: SSL protocol configuration string to fix POODLE vulnerability.
      restart_apache:
        type: bool
        required: false
        default: true
        description: Whether to restart Apache after configuration change.
