---
- name: Ensure Chef Server CLI is installed
  ansible.builtin.package:
    name: chef-server-core
    state: present
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_automate_user.name }} "{{ chef_automate_user.full_name }}" {{ chef_automate_user.email }} "{{ chef_automate_user.password
      }}" --filename {{ chef_automate_user.key_file }}

      '
  args:
    creates: "{{ chef_automate_user.key_file }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_org.name }} "{{ chef_automate_org.full_name }}" --association_user {{ chef_automate_user.name }} --filename
      {{ chef_automate_org.key_file }}

      '
  args:
    creates: "{{ chef_automate_org.key_file }}"
  become: true
