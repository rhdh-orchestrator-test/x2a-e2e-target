---
controller_credential_types:
- name: Chef User Credentials
  description: Credentials used for creating the initial Chef user account
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for the Chef administrator account
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef administrator account
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the Chef administrator
    - id: email
      type: string
      label: Email
      help_text: Email address for the Chef administrator account
    required:
    - username
    - password
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
