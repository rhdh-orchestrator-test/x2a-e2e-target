- name: Verify
  hosts: all
  gather_facts: true
  vars:
    chef_automate_user:
      name: admin
      key_file: admin.pem
    chef_automate_org:
      name: lab
      key_file: lab-validator.pem
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Check sysctl configuration file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl configuration file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Sysctl configuration file not found
      success_msg: Sysctl configuration file exists
  - name: Get sysctl configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl parameters are set correctly
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: Sysctl parameters not set correctly
      success_msg: Sysctl parameters set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-automate
    register: cli_file
  - name: Assert Chef Automate CLI file exists and is executable
    ansible.builtin.assert:
      that:
      - cli_file.stat.exists
      - cli_file.stat.executable
      fail_msg: Chef Automate CLI file not found or not executable
      success_msg: Chef Automate CLI file exists and is executable
  - name: Check Chef Automate config file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: config_file
  - name: Assert Chef Automate config file exists
    ansible.builtin.assert:
      that:
      - config_file.stat.exists
      - config_file.stat.size > 0
      fail_msg: Chef Automate config file not found
      success_msg: Chef Automate config file exists
  - name: Check Chef Automate service file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/systemd/system/chef-automate.service
    register: automate_service_file
  - name: Assert Chef Automate service file exists
    ansible.builtin.assert:
      that:
      - automate_service_file.stat.exists
      - automate_service_file.stat.size > 0
      fail_msg: Chef Automate service file not found
      success_msg: Chef Automate service file exists
  - name: Check Chef Server service file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/systemd/system/chef-server.service
    register: server_service_file
  - name: Assert Chef Server service file exists
    ansible.builtin.assert:
      that:
      - server_service_file.stat.exists
      - server_service_file.stat.size > 0
      fail_msg: Chef Server service file not found
      success_msg: Chef Server service file exists
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ chef_automate_user.key_file }}
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.size > 0
      fail_msg: User key file not found
      success_msg: User key file exists
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ chef_automate_org.key_file }}
    register: org_key_file
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.size > 0
      fail_msg: Organization validator key file not found
      success_msg: Organization validator key file exists
  - name: Check user list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-server-users.txt
    register: user_list_file
  - name: Assert user list file exists
    ansible.builtin.assert:
      that:
      - user_list_file.stat.exists
      - user_list_file.stat.size > 0
      fail_msg: User list file not found
      success_msg: User list file exists
  - name: Get user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/chef-server-users.txt
    register: user_list_content
    when: user_list_file.stat.exists
  - name: Assert user exists in list
    ansible.builtin.assert:
      that:
      - chef_automate_user.name in (user_list_content.content | b64decode)
      fail_msg: User not found in list
      success_msg: User found in list
    when: user_list_file.stat.exists
  - name: Check organization list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-server-orgs.txt
    register: org_list_file
  - name: Assert organization list file exists
    ansible.builtin.assert:
      that:
      - org_list_file.stat.exists
      - org_list_file.stat.size > 0
      fail_msg: Organization list file not found
      success_msg: Organization list file exists
  - name: Get organization list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/chef-server-orgs.txt
    register: org_list_content
    when: org_list_file.stat.exists
  - name: Assert organization exists in list
    ansible.builtin.assert:
      that:
      - chef_automate_org.name in (org_list_content.content | b64decode)
      fail_msg: Organization not found in list
      success_msg: Organization found in list
    when: org_list_file.stat.exists
  - name: Check Chef Automate service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is active
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      - ansible_facts.services['chef-automate.service'].state == 'running'
      fail_msg: Chef Automate service not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Assert Chef Server service is active
    ansible.builtin.assert:
      that:
      - '''chef-server.service'' in ansible_facts.services'
      - ansible_facts.services['chef-server.service'].state == 'running'
      fail_msg: Chef Server service not running
      success_msg: Chef Server service is running
    tags: molecule-notest
  - name: Check Chef Automate UI port
    ansible.builtin.wait_for:
      port: 443
      timeout: 5
    ignore_errors: true
    register: port_check
    tags: molecule-notest
  - name: Assert Chef Automate UI port is accessible
    ansible.builtin.assert:
      that:
      - port_check is success
      fail_msg: Chef Automate UI port not accessible
      success_msg: Chef Automate UI port is accessible
    tags: molecule-notest
  - name: Check Chef Automate API
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
    register: api_check
    ignore_errors: true
    tags: molecule-notest
  - name: Assert Chef Automate API is accessible
    ansible.builtin.assert:
      that:
      - api_check is success
      fail_msg: Chef Automate API not accessible
      success_msg: Chef Automate API is accessible
    tags: molecule-notest
  - name: Check Chef Infra Server API
    ansible.builtin.uri:
      url: https://localhost/organizations
      validate_certs: false
    register: server_api_check
    ignore_errors: true
    tags: molecule-notest
  - name: Assert Chef Infra Server API is accessible
    ansible.builtin.assert:
      that:
      - server_api_check is success
      fail_msg: Chef Infra Server API not accessible
      success_msg: Chef Infra Server API is accessible
    tags: molecule-notest
