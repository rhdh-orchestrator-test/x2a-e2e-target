---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
- name: Install Apache with specific version
  ansible.builtin.apt:
    name: apache2={{ apache_version }}
    state: present
- name: Install curl, openssl, PyOpenSSL
  ansible.builtin.apt:
    pkg:
      - curl
      - openssl
      - python3-openssl
    state: present
- name: Create a directory for certs
  ansible.builtin.file:
    path: "{{ apache_certs_dir }}"
    state: directory
    mode: "0640"
- name: Generate an openssl key
  community.crypto.openssl_privatekey:
    path: "{{ apache_certs_dir }}/apache.key"
- name: Generate an openssl csr
  community.crypto.openssl_csr:
    path: "{{ apache_certs_dir }}/apache.csr"
    privatekey_path: "{{ apache_certs_dir }}/apache.key"
    common_name: "{{ website_domain }}"
- name: Generate a self-signed openssl certificate
  community.crypto.openssl_certificate:
    path: "{{ apache_certs_dir }}/apache.crt"
    privatekey_path: "{{ apache_certs_dir }}/apache.key"
    csr_path: "{{ apache_certs_dir }}/apache.csr"
    provider: selfsigned
- name: Configure Hello World virtual host
  ansible.builtin.template:
    src: helloworld.conf.j2
    dest: "{{ apache_sites_available_dir }}/helloworld.conf"
    mode: "0640"
    force: true
- name: Create the helloworld directory
  ansible.builtin.file:
    path: "{{ website_doc_root }}"
    state: directory
    mode: "0755"
- name: Deploy the Hello World website
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ website_doc_root }}/index.html"
    owner: root
    group: root
    mode: "0644"
    force: true
- name: Check if default site is enabled
  ansible.builtin.stat:
    path: /etc/apache2/sites-enabled/000-default.conf
  register: default_site
- name: Deactivate the default virtualhost
  ansible.builtin.command: a2dissite 000-default
  when: default_site.stat.exists
  changed_when: default_site.stat.exists
- name: Check if helloworld site is enabled
  ansible.builtin.stat:
    path: /etc/apache2/sites-enabled/helloworld.conf
  register: helloworld_site
- name: Activate the virtualhost
  ansible.builtin.command: a2ensite helloworld
  notify:
    - Restart apache
  when: not helloworld_site.stat.exists
  changed_when: not helloworld_site.stat.exists
- name: Check if SSL module is enabled
  ansible.builtin.stat:
    path: /etc/apache2/mods-enabled/ssl.load
  register: ssl_module
- name: Activate SSL on Apache
  ansible.builtin.command: a2enmod ssl
  notify:
    - Restart apache
  when: not ssl_module.stat.exists
  changed_when: not ssl_module.stat.exists
