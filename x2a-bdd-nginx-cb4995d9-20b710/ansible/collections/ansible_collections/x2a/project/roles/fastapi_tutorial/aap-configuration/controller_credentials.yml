---
controller_credentials:
  - name: PostgreSQL Database - fastapi_tutorial
    description: Credentials for the FastAPI application's PostgreSQL database connection.
    organization: Default
    credential_type: PostgreSQL Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      db_host: "{{ db_host }}"
      db_name: "{{ db_name }}"
