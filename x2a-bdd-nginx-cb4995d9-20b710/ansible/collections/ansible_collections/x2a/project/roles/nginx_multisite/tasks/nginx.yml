---
- name: Install Nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Render Nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Render Nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Create site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_multisite_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dictionary
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
    recurse: true
  loop: "{{ nginx['sites'] | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site

- name: Deploy test site index
  ansible.builtin.copy:
    src: test/index.html
    dest: /opt/server/test/index.html
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true

- name: Deploy CI site index
  ansible.builtin.copy:
    src: ci/index.html
    dest: /opt/server/ci/index.html
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true

- name: Deploy status site index
  ansible.builtin.copy:
    src: status/index.html
    dest: /opt/server/status/index.html
    owner: www-data
    group: www-data
    mode: "0644"
    backup: true

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
