---
- name: Install TLS packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx['ssl']['certificate_path'] }}" # noqa: R114 - path from role-defined SSL defaults
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx['ssl']['private_key_path'] }}" # noqa: R114 - path from role-defined SSL defaults
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Generate self-signed site certificates # noqa: R101 - command arguments use role-defined SSL paths and sites dictionary
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx['ssl']['private_key_path'] }}/{{ item_nginx_multisite_ssl['key'] }}.key"
      - -out
      - "{{ nginx['ssl']['certificate_path'] }}/{{ item_nginx_multisite_ssl['key'] }}.crt"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_multisite_ssl['key'] }}/emailAddress=admin@example.com
  when: item_nginx_multisite_ssl['value']['ssl_enabled'] | bool
  loop: "{{ nginx['sites'] | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_ssl
  notify: Reload nginx
  args:
    creates: "{{ nginx['ssl']['certificate_path'] }}/{{ item_nginx_multisite_ssl['key'] }}.crt"

- name: Set private key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx['ssl']['private_key_path'] }}/{{ item_nginx_multisite_key['key'] }}.key" # noqa: R114 - filename from role-defined sites dictionary
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  when: item_nginx_multisite_key['value']['ssl_enabled'] | bool
  loop: "{{ nginx['sites'] | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_key
