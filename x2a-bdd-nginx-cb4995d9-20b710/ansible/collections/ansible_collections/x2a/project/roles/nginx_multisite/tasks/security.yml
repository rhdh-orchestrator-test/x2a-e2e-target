---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Ensure sysctl configuration directory exists
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render Fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  notify: Restart fail2ban

- name: Read UFW status
  ansible.builtin.command:
    cmd: ufw status verbose
  register: nginx_multisite_ufw_status
  changed_when: false

- name: Set UFW default incoming policy # noqa: L039 - variable registered by the preceding UFW status task
  ansible.builtin.command:
    cmd: ufw --force default deny
  when: "'Default: deny (incoming)' not in nginx_multisite_ufw_status.stdout"

- name: Allow SSH through UFW # noqa: L039 - variable registered by the preceding UFW status task
  ansible.builtin.command:
    cmd: ufw allow ssh
  when: "'22/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTP through UFW # noqa: L039 - variable registered by the preceding UFW status task
  ansible.builtin.command:
    cmd: ufw allow http
  when: "'80/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTPS through UFW # noqa: L039 - variable registered by the preceding UFW status task
  ansible.builtin.command:
    cmd: ufw allow https
  when: "'443/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Enable UFW # noqa: L039 - variable registered by the preceding UFW status task
  ansible.builtin.command:
    cmd: ufw --force enable
  when: "'Status: active' not in nginx_multisite_ufw_status.stdout"

- name: Render kernel security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload sysctl

- name: Apply kernel security settings
  ansible.posix.sysctl:
    name: "{{ item_nginx_multisite_sysctl['key'] }}"
    value: "{{ item_nginx_multisite_sysctl['value'] }}"
    sysctl_file: /etc/sysctl.d/99-security.conf
    sysctl_set: true
    reload: false
    state: present
  loop:
    - { key: net.ipv4.conf.default.rp_filter, value: "1" }
    - { key: net.ipv4.conf.all.rp_filter, value: "1" }
    - { key: net.ipv4.conf.all.accept_redirects, value: "0" }
    - { key: net.ipv6.conf.all.accept_redirects, value: "0" }
    - { key: net.ipv4.conf.default.accept_redirects, value: "0" }
    - { key: net.ipv6.conf.default.accept_redirects, value: "0" }
    - { key: net.ipv4.conf.all.send_redirects, value: "0" }
    - { key: net.ipv4.conf.default.send_redirects, value: "0" }
    - { key: net.ipv4.conf.all.accept_source_route, value: "0" }
    - { key: net.ipv6.conf.all.accept_source_route, value: "0" }
    - { key: net.ipv4.conf.default.accept_source_route, value: "0" }
    - { key: net.ipv6.conf.default.accept_source_route, value: "0" }
    - { key: net.ipv4.conf.all.log_martians, value: "1" }
    - { key: net.ipv4.conf.default.log_martians, value: "1" }
    - { key: net.ipv4.icmp_echo_ignore_all, value: "1" }
    - { key: net.ipv4.icmp_echo_ignore_broadcasts, value: "1" }
    - { key: net.ipv6.conf.all.disable_ipv6, value: "1" }
    - { key: net.ipv6.conf.default.disable_ipv6, value: "1" }
    - { key: net.ipv6.conf.lo.disable_ipv6, value: "1" }
    - { key: net.ipv4.tcp_syncookies, value: "1" }
    - { key: net.ipv4.tcp_max_syn_backlog, value: "2048" }
    - { key: net.ipv4.tcp_synack_retries, value: "2" }
    - { key: net.ipv4.tcp_syn_retries, value: "5" }
  loop_control:
    loop_var: item_nginx_multisite_sysctl

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    state: present
    backup: true
  when: security['ssh']['disable_root'] | bool
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    state: present
    backup: true
  when: not security['ssh']['password_auth'] | bool
  notify: Restart SSH

- name: Enable and start Fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
