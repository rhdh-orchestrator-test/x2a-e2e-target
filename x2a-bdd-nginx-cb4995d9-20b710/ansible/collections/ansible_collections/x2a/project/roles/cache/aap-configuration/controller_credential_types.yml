---
controller_credential_types:
  - name: Redis Authentication
    description: Authentication credential for the reported Redis instance on port 6379; the source plan reports a hardcoded password, but requires verification
      before migration.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required to authenticate clients to the Redis instance.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
