---
# Unsupported: version output, journals, socket/lsof diagnostics, and secret-authenticated
# PostgreSQL client checks are omitted because their expected output or secret is unavailable.
- name: Verify fastapi-tutorial deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Check application paths
      ansible.builtin.stat:
        path: "{{ item_application_path }}"
      loop:
        - /opt/fastapi-tutorial
        - /opt/fastapi-tutorial/venv
        - /opt/fastapi-tutorial/requirements.txt
      loop_control:
        loop_var: item_application_path

    - name: Check application directory metadata
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: item_application_directory

    - name: Assert application directory
      ansible.builtin.assert:
        that:
          - item_application_directory.stat.exists
          - item_application_directory.stat.pw_name == 'root'
          - item_application_directory.stat.gr_name == 'root'
          - item_application_directory.stat.mode == '0755'

    - name: Check repository remote
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - remote
          - -v
      register: item_git_remote
      changed_when: false

    - name: Assert repository remote
      ansible.builtin.assert:
        that:
          - "'https://github.com/dibanez/fastapi_tutorial.git' in item_git_remote.stdout"

    - name: Check checked-out branch
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - branch
          - --show-current
      register: item_git_branch
      changed_when: false

    - name: Assert checked-out branch
      ansible.builtin.assert:
        that:
          - item_git_branch.stdout | trim == 'main'

    - name: Check Python dependency consistency
      ansible.builtin.command:
        argv: [/opt/fastapi-tutorial/venv/bin/pip, check]
      changed_when: false

    - name: Check FastAPI and Uvicorn imports
      ansible.builtin.command:
        argv:
          - /opt/fastapi-tutorial/venv/bin/python
          - -c
          - "import {{ item_python_module }}"
      loop:
        - fastapi
        - uvicorn
      loop_control:
        loop_var: item_python_module
      changed_when: false

    - name: Read environment file
      ansible.builtin.slurp:
        src: /opt/fastapi-tutorial/.env
      register: item_environment_file

    - name: Assert environment file contents
      ansible.builtin.assert:
        that:
          - item_environment_file.content | b64decode is search('(?m)^PROJECT_NAME="FastAPI Tutorial"$')
          - item_environment_file.content | b64decode is search('(?m)^API_VERSION=1.0.0$')
          - item_environment_file.content | b64decode is search('(?m)^DATABASE_URL=postgresql://fastapi:.+@localhost/fastapi_db$')

    - name: Check application service state
      ansible.builtin.command:
        argv: [systemctl, is-active, fastapi-tutorial]
      register: item_application_active
      changed_when: false

    - name: Check application service enablement
      ansible.builtin.command:
        argv: [systemctl, is-enabled, fastapi-tutorial]
      register: item_application_enabled
      changed_when: false

    - name: Assert application service is enabled and active
      ansible.builtin.assert:
        that:
          - item_application_active.stdout | trim == 'active'
          - item_application_enabled.stdout | trim == 'enabled'

    - name: Check application service properties
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - fastapi-tutorial
          - "--property=User,WorkingDirectory,ExecStart,Restart"
      register: item_application_properties
      changed_when: false

    - name: Assert application service properties
      ansible.builtin.assert:
        that:
          - "'User=root' in item_application_properties.stdout"
          - "'WorkingDirectory=/opt/fastapi-tutorial' in item_application_properties.stdout"
          - "'/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app' in item_application_properties.stdout"
          - "'Restart=always' in item_application_properties.stdout"

    - name: Verify systemd unit syntax
      ansible.builtin.command:
        argv: [systemd-analyze, verify, /etc/systemd/system/fastapi-tutorial.service]
      changed_when: false

    - name: Check FastAPI endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/
        method: GET
      register: item_fastapi_endpoint

    - name: Assert FastAPI endpoint responds
      ansible.builtin.assert:
        that:
          - item_fastapi_endpoint.status is defined
          - item_fastapi_endpoint.status < 500

    - name: Collect installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_required_package in ansible_facts.packages
      loop:
        - python3
        - python3-pip
        - python3-venv
        - git
        - postgresql
        - postgresql-contrib
        - libpq-dev
      loop_control:
        loop_var: item_required_package

    - name: Check PostgreSQL service state
      ansible.builtin.command:
        argv: [systemctl, is-active, postgresql]
      register: item_postgresql_active
      changed_when: false

    - name: Check PostgreSQL service enablement
      ansible.builtin.command:
        argv: [systemctl, is-enabled, postgresql]
      register: item_postgresql_enabled
      changed_when: false

    - name: Assert PostgreSQL is enabled and active
      ansible.builtin.assert:
        that:
          - item_postgresql_active.stdout | trim == 'active'
          - item_postgresql_enabled.stdout | trim == 'enabled'

    - name: Check PostgreSQL version query
      ansible.builtin.command:
        argv: [sudo, -u, postgres, psql, -c, "SELECT version();"]
      changed_when: false

    - name: Check PostgreSQL role
      ansible.builtin.command:
        argv: [sudo, -u, postgres, psql, -tAc, "SELECT rolname FROM pg_roles WHERE rolname = 'fastapi';"]
      register: item_postgresql_role
      changed_when: false

    - name: Assert PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - item_postgresql_role.stdout | trim == 'fastapi'

    - name: Check PostgreSQL database owner
      ansible.builtin.command:
        argv: [sudo, -u, postgres, psql, -tAc, "SELECT datname || ':' || pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'fastapi_db';"]
      register: item_postgresql_database
      changed_when: false

    - name: Assert PostgreSQL database owner
      ansible.builtin.assert:
        that:
          - item_postgresql_database.stdout | trim == 'fastapi_db:fastapi'

    - name: Check PostgreSQL database privileges
      ansible.builtin.command:
        argv: [sudo, -u, postgres, psql, -tAc, "SELECT has_database_privilege('fastapi', 'fastapi_db', 'ALL');"]
      register: item_postgresql_privileges
      changed_when: false

    - name: Assert PostgreSQL database privileges
      ansible.builtin.assert:
        that:
          - item_postgresql_privileges.stdout | trim == 't'
