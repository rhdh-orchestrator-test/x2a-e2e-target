---
# Unsupported pre-flight checks: cookbook source files are not verification targets in the
# isolated instances; environment-file grep, HTTP response-body inspection, and credential
# authentication require inspecting or supplying secret values; log and follow-up diagnostics
# have no stated expected outcome.
- name: Verify fastapi-tutorial deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Collect installed package facts for the package pre-flight checks
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify Debian package installation
      ansible.builtin.assert:
        that:
          - "item_package in ansible_facts['packages']"
        fail_msg: "A required Debian-family package is missing."
      loop:
        - python3
        - python3-pip
        - python3-venv
        - git
        - postgresql
        - postgresql-contrib
        - libpq-dev
      loop_control:
        loop_var: item_package
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify Red Hat package installation
      ansible.builtin.assert:
        that:
          - "item_package in ansible_facts['packages']"
        fail_msg: "A required Red Hat-family package is missing."
      loop:
        - python3
        - python3-pip
        - git
        - postgresql-server
        - postgresql-contrib
        - libpq-devel
      loop_control:
        loop_var: item_package
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Verify application directory
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: result_application_directory

    - name: Assert application directory exists
      ansible.builtin.assert:
        that:
          - result_application_directory.stat.exists
          - result_application_directory.stat.isdir
        fail_msg: "The application directory is missing or is not a directory."

    - name: Verify application requirements file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/requirements.txt
      register: result_requirements_file

    - name: Assert application requirements file exists
      ansible.builtin.assert:
        that:
          - result_requirements_file.stat.exists
          - result_requirements_file.stat.isreg
        fail_msg: "The application requirements file is missing."

    - name: Verify application entry point
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/app/main.py
      register: result_application_entrypoint

    - name: Assert application entry point exists
      ansible.builtin.assert:
        that:
          - result_application_entrypoint.stat.exists
          - result_application_entrypoint.stat.isreg
        fail_msg: "The FastAPI application entry point is missing."

    - name: Verify virtual environment directory
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/venv
      register: result_virtualenv

    - name: Assert virtual environment directory exists
      ansible.builtin.assert:
        that:
          - result_virtualenv.stat.exists
          - result_virtualenv.stat.isdir
        fail_msg: "The Python virtual environment is missing."

    - name: Verify virtual environment executables
      ansible.builtin.stat:
        path: "{{ item_executable }}"
      loop:
        - /opt/fastapi-tutorial/venv/bin/pip
        - /opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_executable
      register: result_virtualenv_executables

    - name: Assert virtual environment executables are present and executable
      ansible.builtin.assert:
        that:
          - item_executable_result.stat.exists
          - item_executable_result.stat.isreg
          - item_executable_result.stat.executable
        fail_msg: "A required virtual environment executable is missing or not executable."
      loop: "{{ result_virtualenv_executables['results'] }}"
      loop_control:
        loop_var: item_executable_result

    - name: Run pip dependency check
      ansible.builtin.command:
        argv:
          - /opt/fastapi-tutorial/venv/bin/pip
          - check
      changed_when: false
      register: result_pip_check

    - name: Assert pip dependency check succeeds
      ansible.builtin.assert:
        that:
          - result_pip_check.rc == 0
        fail_msg: "The Python virtual environment has unmet dependencies."

    - name: Check Uvicorn version
      ansible.builtin.command:
        argv:
          - /opt/fastapi-tutorial/venv/bin/uvicorn
          - --version
      changed_when: false
      register: result_uvicorn_version

    - name: Assert Uvicorn version check succeeds
      ansible.builtin.assert:
        that:
          - result_uvicorn_version.rc == 0
        fail_msg: "Uvicorn could not report its version."

    - name: Check application import
      ansible.builtin.command:
        argv:
          - /opt/fastapi-tutorial/venv/bin/python
          - -c
          - from app.main import app; print(app)
        chdir: /opt/fastapi-tutorial
      changed_when: false
      register: result_application_import

    - name: Assert application import succeeds
      ansible.builtin.assert:
        that:
          - result_application_import.rc == 0
        fail_msg: "The FastAPI application could not be imported."

    - name: Verify environment file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/.env
      register: result_environment_file

    - name: Assert environment file exists
      ansible.builtin.assert:
        that:
          - result_environment_file.stat.exists
          - result_environment_file.stat.isreg
        fail_msg: "The application environment file is missing."

    - name: Verify systemd unit file
      ansible.builtin.stat:
        path: /etc/systemd/system/fastapi-tutorial.service
      register: result_systemd_unit

    - name: Assert systemd unit file exists
      ansible.builtin.assert:
        that:
          - result_systemd_unit.stat.exists
          - result_systemd_unit.stat.isreg
        fail_msg: "The FastAPI systemd unit file is missing."

    - name: Read systemd unit file
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: result_systemd_unit_content

    - name: Assert expected systemd unit settings
      ansible.builtin.assert:
        that:
          - "'WorkingDirectory=/opt/fastapi-tutorial' in (result_systemd_unit_content.content | b64decode)"
          - "'User=root' in (result_systemd_unit_content.content | b64decode)"
          - "'--host 0.0.0.0 --port 8000' in (result_systemd_unit_content.content | b64decode)"
          - "'Restart=always' in (result_systemd_unit_content.content | b64decode)"
        fail_msg: "The systemd unit does not contain the expected application settings."

    - name: Verify systemd unit syntax
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/fastapi-tutorial.service
      changed_when: false
      register: result_systemd_verify

    - name: Assert systemd unit syntax is valid
      ansible.builtin.assert:
        that:
          - result_systemd_verify.rc == 0
        fail_msg: "The FastAPI systemd unit failed systemd-analyze verification."

    - name: Check PostgreSQL service state
      ansible.builtin.service_facts:

    - name: Assert PostgreSQL service is active
      ansible.builtin.assert:
        that:
          - "'postgresql.service' in ansible_facts['services']"
          - "ansible_facts['services']['postgresql.service']['state'] == 'running'"
        fail_msg: "The PostgreSQL service is not active."

    - name: Check PostgreSQL service is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - postgresql
      changed_when: false
      register: result_postgresql_enabled

    - name: Assert PostgreSQL service is enabled
      ansible.builtin.assert:
        that:
          - result_postgresql_enabled.rc == 0
          - result_postgresql_enabled.stdout | trim == 'enabled'
        fail_msg: "The PostgreSQL service is not enabled."

    - name: Verify Red Hat PostgreSQL initialization
      ansible.builtin.stat:
        path: /var/lib/pgsql/data/PG_VERSION
      register: result_postgresql_initialization
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Assert Red Hat PostgreSQL is initialized
      ansible.builtin.assert:
        that:
          - result_postgresql_initialization.stat.exists
          - result_postgresql_initialization.stat.isreg
        fail_msg: "The Red Hat-family PostgreSQL data directory is not initialized."
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Check PostgreSQL role
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT 1 FROM pg_roles WHERE rolname='fastapi';
      become: true
      become_user: postgres
      changed_when: false
      register: result_postgresql_role

    - name: Assert PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - result_postgresql_role.rc == 0
          - result_postgresql_role.stdout | trim == '1'
        fail_msg: "The PostgreSQL role fastapi is missing."

    - name: Check PostgreSQL database
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT 1 FROM pg_database WHERE datname='fastapi_db';
      become: true
      become_user: postgres
      changed_when: false
      register: result_postgresql_database

    - name: Assert PostgreSQL database exists
      ansible.builtin.assert:
        that:
          - result_postgresql_database.rc == 0
          - result_postgresql_database.stdout | trim == '1'
        fail_msg: "The PostgreSQL database fastapi_db is missing."

    - name: Check PostgreSQL database owner
      ansible.builtin.command:
        argv:
          - psql
          - -tAc
          - SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname='fastapi_db';
      become: true
      become_user: postgres
      changed_when: false
      register: result_postgresql_owner

    - name: Assert PostgreSQL database owner
      ansible.builtin.assert:
        that:
          - result_postgresql_owner.rc == 0
          - result_postgresql_owner.stdout | trim == 'fastapi'
        fail_msg: "The PostgreSQL database owner is not fastapi."

    - name: Verify application service is active
      ansible.builtin.service_facts:

    - name: Assert application service is active
      ansible.builtin.assert:
        that:
          - "'fastapi-tutorial.service' in ansible_facts['services']"
          - "ansible_facts['services']['fastapi-tutorial.service']['state'] == 'running'"
        fail_msg: "The FastAPI application service is not active."

    - name: Check application service is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - fastapi-tutorial.service
      changed_when: false
      register: result_application_enabled

    - name: Assert application service is enabled
      ansible.builtin.assert:
        that:
          - result_application_enabled.rc == 0
          - result_application_enabled.stdout | trim == 'enabled'
        fail_msg: "The FastAPI application service is not enabled."

    - name: Check Uvicorn process
      ansible.builtin.command:
        argv:
          - ps
          - aux
      changed_when: false
      register: result_uvicorn_process

    - name: Assert Uvicorn process is running
      ansible.builtin.assert:
        that:
          - "'uvicorn app.main:app' in result_uvicorn_process.stdout"
        fail_msg: "The Uvicorn application process is not running."

    - name: Check TCP port 8000 listener
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      changed_when: false
      register: result_application_listener

    - name: Assert port 8000 is listening
      ansible.builtin.assert:
        that:
          - "':8000' in result_application_listener.stdout"
        fail_msg: "The FastAPI service is not listening on port 8000."

    - name: Verify FastAPI endpoint responds
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/
        method: GET
        return_content: false
        timeout: 10
      register: result_fastapi_endpoint

    - name: Assert FastAPI endpoint request completed
      ansible.builtin.assert:
        that:
          - result_fastapi_endpoint.status is defined
        fail_msg: "The FastAPI endpoint did not return an HTTP response."
