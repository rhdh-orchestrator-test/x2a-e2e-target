---
controller_credential_types:
  - name: Encrypted Data Bag Site Token
    description: Secret token loaded from the Chef encrypted data bag nginx_secrets/site and written to /etc/nginx/secrets/site_token for external application 
      or site consumption.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Site Token
          secret: true
          help_text: Token stored in the encrypted Chef data bag and deployed to /etc/nginx/secrets/site_token.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
