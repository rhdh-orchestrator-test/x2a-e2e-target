---
- name: Create sites-available directory
  ansible.builtin.file:
    path: /etc/nginx/sites-available
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create sites-enabled directory
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Render nginx site configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_nginx_config['id'] }} # noqa: R114 - path from role-defined site inventory
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_nginx_config
  notify: Validate and reload nginx
  vars:
    server_name: "{{ item_nginx_config['id'] }}"
    document_root: "{{ item_nginx_config['document_root'] }}"
    ssl_enabled: "{{ item_nginx_config['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_config['id'] }}.crt"
    key_file: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_config['id'] }}.key"

- name: Enable nginx sites
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_nginx_link['id'] }}
    dest: /etc/nginx/sites-enabled/{{ item_nginx_link['id'] }} # noqa: R114 - path from role-defined site inventory
    state: link
    owner: root
    group: root
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_nginx_link
  notify: Validate and reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Validate and reload nginx
