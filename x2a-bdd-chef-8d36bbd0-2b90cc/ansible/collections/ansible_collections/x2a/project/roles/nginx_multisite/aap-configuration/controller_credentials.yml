---
controller_credentials:
  - name: Encrypted Data Bag Site Token - nginx_multisite
    description: Secret token loaded from the Chef encrypted data bag nginx_secrets/site and written to /etc/nginx/secrets/site_token for external application 
      or site consumption.
    organization: Default
    credential_type: Encrypted Data Bag Site Token
    update_secrets: true
    inputs:
      site_token: "{{ vault_site_token }}"
