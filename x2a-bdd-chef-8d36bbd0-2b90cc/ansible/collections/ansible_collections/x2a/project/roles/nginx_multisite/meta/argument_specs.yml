---
argument_specs:
  main:
    short_description: Install and configure an nginx multisite server
    description:
      - Installs nginx and security services, configures hardening, and deploys inventory-defined sites.
    options:
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory containing site certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory containing site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW is enabled.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether root SSH login is disabled.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_sites:
        type: list
        elements: dict
        required: false
        default: []
        description: Site definitions with id, document_root, and ssl_enabled fields.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks handling the site token.
      nginx_multisite_certificate_days:
        type: int
        required: false
        default: 365
        description: Validity period for generated self-signed certificates.
