---
controller_credentials:
  - name: PostgreSQL FastAPI Application - fastapi_tutorial
    description: PostgreSQL application credential defined as a hardcoded value in the Chef recipe and used by the FastAPI application.
    organization: Default
    credential_type: PostgreSQL FastAPI Application
    update_secrets: true
    inputs:
      database_username: "{{ database_username }}"
      database_password: "{{ vault_database_password }}"
      database_host: "{{ database_host }}"
      database_name: "{{ database_name }}"
