---
argument_specs:
  main:
    short_description: Configure Apache web server with HTTPS support
    description: This role configures an Apache web server with HTTPS support using a self-signed certificate
    options:
      apache_version:
        type: str
        default: 2.4.41-4ubuntu3.10
        description: Apache version to install
      website_domain:
        type: str
        default: myhost
        description: Domain name for the website
      website_root:
        type: str
        default: /var/www/helloworld
        description: Website document root
      ssl_cert_dir:
        type: str
        default: /etc/apache2/certs
        description: Directory for SSL certificates
      ssl_key_path:
        type: str
        default: /etc/apache2/certs/apache.key
        description: Path to SSL key
      ssl_csr_path:
        type: str
        default: /etc/apache2/certs/apache.csr
        description: Path to SSL CSR
      ssl_cert_path:
        type: str
        default: /etc/apache2/certs/apache.crt
        description: Path to SSL certificate
