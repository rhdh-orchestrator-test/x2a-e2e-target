---
- name: Install Apache and SSL modules
  ansible.builtin.apt:
    name:
      - apache2
      - "{{ apache_version }}"
      - openssl
    state: present
    update_cache: true
  become: true
- name: Create SSL certificate directory
  ansible.builtin.file:
    path: "{{ ssl_cert_dir }}"
    state: directory
    mode: "0755"
  become: true
- name: Generate SSL private key
  community.crypto.openssl_privatekey:
    path: "{{ ssl_key_path }}"
    size: 2048
    mode: "0600"
  become: true
- name: Generate SSL CSR
  community.crypto.openssl_csr:
    path: "{{ ssl_csr_path }}"
    privatekey_path: "{{ ssl_key_path }}"
    common_name: "{{ website_domain }}"
    mode: "0644"
  become: true
- name: Generate self-signed certificate
  community.crypto.x509_certificate:
    path: "{{ ssl_cert_path }}"
    privatekey_path: "{{ ssl_key_path }}"
    csr_path: "{{ ssl_csr_path }}"
    provider: selfsigned
    selfsigned_not_after: +365d
    mode: "0644"
  become: true
- name: Create website directory
  ansible.builtin.file:
    path: "{{ website_root }}"
    state: directory
    mode: "0755"
  become: true
- name: Deploy index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ website_root }}/index.html"
    mode: "0644"
  become: true
- name: Enable Apache SSL module
  ansible.builtin.command: a2enmod ssl
  args:
    creates: /etc/apache2/mods-enabled/ssl.load
  become: true
  notify: Restart Apache
- name: Deploy Apache HTTPS configuration
  ansible.builtin.template:
    src: helloworld.conf.j2
    dest: /etc/apache2/sites-available/helloworld.conf
    mode: "0644"
  become: true
  notify: Restart Apache
- name: Enable Apache site
  ansible.builtin.command: a2ensite helloworld.conf
  args:
    creates: /etc/apache2/sites-enabled/helloworld.conf
  become: true
  notify: Restart Apache
- name: Ensure Apache is running
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
  become: true
