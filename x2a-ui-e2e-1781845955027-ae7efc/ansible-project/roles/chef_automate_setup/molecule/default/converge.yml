---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure that would be created by Chef Automate and Chef Infra Server
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-server
        - /tmp/molecule_test/etc/chef
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/log/chef-automate
        - /tmp/molecule_test/var/opt/chef-server
        - /tmp/molecule_test/var/log/chef-server

    # Create mock configuration files
    - name: Create mock Chef Automate configuration files
      ansible.builtin.copy:
        content: |
          # Mock Chef Automate configuration file
          # This would normally be generated by the Chef Automate CLI
          [automate]
          fqdn = "{{ chef_automate_hostname }}"
          products = {{ chef_automate_products | to_json }}
        dest: "/tmp/molecule_test/etc/chef-automate/config.toml"
        mode: "0644"
      vars:
        chef_automate_hostname: automate.chef.lab
        chef_automate_products:
          - automate
          - infra-server

    # Create mock Chef Server configuration
    - name: Create mock Chef Server configuration
      ansible.builtin.copy:
        content: |
          # Mock Chef Server configuration file
          # This would normally be generated by the Chef Server installation
          topology "standalone"
          api_fqdn "{{ chef_automate_hostname }}"
        dest: "/tmp/molecule_test/etc/chef-server/chef-server.rb"
        mode: "0644"
      vars:
        chef_automate_hostname: automate.chef.lab

    # Create mock PEM files that would be generated
    - name: Create mock user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz1234567890
          ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefghijklmnopqrstuvwxyz
          # This is a mock PEM file for testing purposes
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/jtonello.pem"
        mode: "0600"

    - name: Create mock organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba0987654321
          ZYXWVUTSRQPONMLKJIHGFEDCBA0987654321zyxwvutsrqponmlkjihgfedcba
          # This is a mock PEM file for testing purposes
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/lab-validator.pem"
        mode: "0600"

    # Create mock system configuration files
    - name: Create mock hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    - name: Create mock sysctl configuration
      ansible.builtin.copy:
        content: |
          # Kernel parameters for Chef Automate
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Create mock Chef Automate CLI binary
    - name: Create mock Chef Automate CLI binary
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Mock Chef Automate CLI"
          echo "This is a placeholder for the actual binary"
        dest: "/tmp/molecule_test/usr/local/bin/chef-automate"
        mode: "0755"

    # Create mock Chef Server CTL binary
    - name: Create mock Chef Server CTL binary
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Mock Chef Server CTL"
          echo "This is a placeholder for the actual binary"
        dest: "/tmp/molecule_test/usr/bin/chef-server-ctl"
        mode: "0755"

    # Create mock user and organization list files
    - name: Create mock user list file
      ansible.builtin.copy:
        content: |
          jtonello
        dest: "/tmp/molecule_test/var/opt/chef-server/users.txt"
        mode: "0644"

    - name: Create mock organization list file
      ansible.builtin.copy:
        content: |
          lab
        dest: "/tmp/molecule_test/var/opt/chef-server/orgs.txt"
        mode: "0644"

    # Create mock service status files
    - name: Create mock Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: chef-automate
          Status: running
          Components:
            - automate-gateway: running
            - automate-ui: running
            - postgresql: running
        dest: "/tmp/molecule_test/var/log/chef-automate/status.txt"
        mode: "0644"

    - name: Create mock Chef Server status file
      ansible.builtin.copy:
        content: |
          Service: chef-server
          Status: running
          Components:
            - bookshelf: running
            - erchef: running
            - postgresql: running
        dest: "/tmp/molecule_test/var/log/chef-server/status.txt"
        mode: "0644"