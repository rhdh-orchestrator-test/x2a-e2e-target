---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check sysctl configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl configuration file was created
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are set correctly
      ansible.builtin.assert:
        that:
          - sysctl_content.content | b64decode is search('vm.max_map_count = 262144')
          - sysctl_content.content | b64decode is search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate and Chef Server configuration checks
    - name: Check Chef Automate configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: automate_config_file

    - name: Assert Chef Automate configuration file was created
      ansible.builtin.assert:
        that:
          - automate_config_file.stat.exists
          - automate_config_file.stat.isreg
        fail_msg: "Chef Automate configuration file not found"
        success_msg: "Chef Automate configuration file exists"

    - name: Check Chef Server configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server/chef-server.rb
      register: server_config_file

    - name: Assert Chef Server configuration file was created
      ansible.builtin.assert:
        that:
          - server_config_file.stat.exists
          - server_config_file.stat.isreg
        fail_msg: "Chef Server configuration file not found"
        success_msg: "Chef Server configuration file exists"

    # PEM file checks
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_pem_file

    - name: Assert user PEM file was created
      ansible.builtin.assert:
        that:
          - user_pem_file.stat.exists
          - user_pem_file.stat.isreg
          - user_pem_file.stat.mode == "0600"
        fail_msg: "User PEM file not found or has incorrect permissions"
        success_msg: "User PEM file exists with correct permissions"

    - name: Check organization validator PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_pem_file

    - name: Assert organization validator PEM file was created
      ansible.builtin.assert:
        that:
          - org_pem_file.stat.exists
          - org_pem_file.stat.isreg
          - org_pem_file.stat.mode == "0600"
        fail_msg: "Organization validator PEM file not found or has incorrect permissions"
        success_msg: "Organization validator PEM file exists with correct permissions"

    # User and organization verification
    - name: Check user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server/users.txt
      register: users_file

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef-server/users.txt
      register: users_content
      when: users_file.stat.exists

    - name: Assert user was created
      ansible.builtin.assert:
        that:
          - users_content.content | b64decode is search('jtonello')
        fail_msg: "User jtonello not found in user list"
        success_msg: "User jtonello found in user list"
      when: users_file.stat.exists

    - name: Check organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server/orgs.txt
      register: orgs_file

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef-server/orgs.txt
      register: orgs_content
      when: orgs_file.stat.exists

    - name: Assert organization was created
      ansible.builtin.assert:
        that:
          - orgs_content.content | b64decode is search('lab')
        fail_msg: "Organization lab not found in organization list"
        success_msg: "Organization lab found in organization list"
      when: orgs_file.stat.exists

    # Service status checks (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - automate_status.rc == 0
          - "'running' in automate_status.stdout"
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      when: automate_status is defined
      tags: molecule-notest

    - name: Check Chef Server service status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Server service is running
      ansible.builtin.assert:
        that:
          - server_status.rc == 0
          - "'running' in server_status.stdout"
        fail_msg: "Chef Server service is not running"
        success_msg: "Chef Server service is running"
      when: server_status is defined
      tags: molecule-notest

    # API checks (tagged for skipping in container)
    - name: Check Chef Automate API
      ansible.builtin.uri:
        url: https://localhost/api/v0/auth/version
        validate_certs: false
      register: automate_api
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate API is accessible
      ansible.builtin.assert:
        that:
          - automate_api.status == 200
        fail_msg: "Chef Automate API is not accessible"
        success_msg: "Chef Automate API is accessible"
      when: automate_api is defined
      tags: molecule-notest

    - name: Check Chef Infra Server API
      ansible.builtin.uri:
        url: https://localhost/organizations
        validate_certs: false
      register: server_api
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server API is accessible
      ansible.builtin.assert:
        that:
          - server_api.status == 200
        fail_msg: "Chef Infra Server API is not accessible"
        success_msg: "Chef Infra Server API is accessible"
      when: server_api is defined
      tags: molecule-notest

    # Network port checks (tagged for skipping in container)
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      when: port_check is defined
      tags: molecule-notest