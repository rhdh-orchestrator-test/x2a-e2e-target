- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache SSL config
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create mock Apache SSL config file with default SSLProtocol line
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file for testing

        SSLEngine on

        SSLProtocol all -SSLv3

        SSLHonorCipherOrder on

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Set apache_ssl_config_path variable to test location
    ansible.builtin.set_fact:
      apache_ssl_config_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      ssl_protocol_setting: -all +TLSv1.2
  - name: Mock Apache installation
    ansible.builtin.debug:
      msg: Simulating Apache installation (would use ansible.builtin.package in actual role)
  - name: Fix SSL in Apache
    ansible.builtin.replace:
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol {{ ssl_protocol_setting }}
