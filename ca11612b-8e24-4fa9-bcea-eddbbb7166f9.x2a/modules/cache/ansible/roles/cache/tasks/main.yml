---
- name: Install Redis server package
  ansible.builtin.package:
    name: "{{ cache_redis_package }}"
    state: present
- name: Ensure Redis directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ cache_redis_user | default('redis') }}"
    group: "{{ cache_redis_group | default('redis') }}"
  loop:
    - "{{ cache_redis_conf_dir | default('/etc/redis') }}"
    - "{{ cache_redis_data_dir | default('/var/lib/redis') }}"
    - "{{ cache_redis_log_dir | default('/var/log/redis') }}"
    - "{{ cache_redis_run_dir | default('/var/run/redis') }}"
- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_conf_dir | default('/etc/redis') }}/redis.conf"
    mode: "0644"
    owner: "{{ cache_redis_user | default('redis') }}"
    group: "{{ cache_redis_group | default('redis') }}"
  notify: Restart Redis server
- name: Enable and start Redis server
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    state: "{{ cache_redis_state }}"
    enabled: "{{ cache_redis_enabled }}"
