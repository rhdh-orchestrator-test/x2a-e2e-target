---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check config files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/redis/redis.conf
      loop_control:
        loop_var: item_config
      register: config_stat_results

    - name: Assert config files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected config file not found"
      loop: "{{ config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check data directories exist
      ansible.builtin.stat:
        path: "{{ item_dir }}"
      loop:
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir
      register: dir_stat_results

    - name: Assert directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected directory not found"
      loop: "{{ dir_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check log file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/redis/redis-server.log
      register: log_stat_result

    - name: Assert log file was created
      ansible.builtin.assert:
        that:
          - log_stat_result['stat']['exists']
          - log_stat_result['stat']['size'] > 0
        fail_msg: "Redis log file not found"

    - name: Get Redis config content
      ansible.builtin.slurp:
        path: /tmp/molecule_test/etc/redis/redis.conf
      register: redis_conf_content

    - name: Assert Redis config contains expected settings
      ansible.builtin.assert:
        that:
          - "'port 6379' in (redis_conf_content['content'] | b64decode)"
          - "'bind 127.0.0.1' in (redis_conf_content['content'] | b64decode)"
          - "'daemonize yes' in (redis_conf_content['content'] | b64decode)"
          - "'logfile /var/log/redis/redis-server.log' in (redis_conf_content['content'] | b64decode)"
        fail_msg: "Redis configuration does not contain expected settings"

    # The following checks can't run in a container environment
    # They are tagged with molecule-notest to be skipped during molecule testing

    - name: Check Redis service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Redis service is active
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
          - "ansible_facts.services['redis-server.service']['status'] == 'enabled'"
        fail_msg: "Redis service is not running or not enabled"
      tags: molecule-notest

    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        state: started
        timeout: 5
      tags: molecule-notest

    - name: Check Redis connectivity
      ansible.builtin.command:
        cmd: redis-cli ping
      register: redis_ping_result
      changed_when: false
      failed_when: redis_ping_result.stdout != "PONG"
      tags: molecule-notest