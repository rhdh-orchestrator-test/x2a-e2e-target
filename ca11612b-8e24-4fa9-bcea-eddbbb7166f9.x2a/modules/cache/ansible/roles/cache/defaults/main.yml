---
cache_redis_package: redis-server
cache_redis_service: redis-server
cache_redis_enabled: true
cache_redis_state: started
cache_redis_user: redis
cache_redis_group: redis
cache_redis_conf_dir: /etc/redis
cache_redis_data_dir: /var/lib/redis
cache_redis_log_dir: /var/log/redis
cache_redis_run_dir: /var/run/redis
cache_redis_port: 6379
cache_redis_bind: 127.0.0.1
cache_redis_daemonize: "yes"
