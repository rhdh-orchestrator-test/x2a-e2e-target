---
argument_specs:
  main:
    short_description: Configure Memcached and Redis cache services
    description:
      - Installs and configures Memcached and a standalone Redis cache service.
      - Redis authentication is supplied through an AAP credential variable.
    options:
      cache_memcached_version:
        type: str
        required: false
        default:
        description: Optional Memcached package version.
      cache_memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory allocation in megabytes.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      cache_memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      cache_memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      cache_memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached connections.
      cache_memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      cache_memcached_threads:
        type: int
        required: false
        default:
        description: Optional number of Memcached worker threads.
      cache_memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Memcached experimental command-line options.
      cache_memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional Memcached command-line options.
      cache_memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file descriptor limit.
      cache_memcached_log_path:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log directory.
      cache_memcached_user:
        type: str
        required: false
        default: memcached
        description: Memcached service user.
      cache_memcached_group:
        type: str
        required: false
        default: memcached
        description: Memcached service group.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output for tasks handling Redis credentials.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
