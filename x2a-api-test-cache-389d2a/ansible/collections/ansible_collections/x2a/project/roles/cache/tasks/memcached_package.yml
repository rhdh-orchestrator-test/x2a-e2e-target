---
- name: Install Memcached package
  ansible.builtin.package:
    name: memcached
    state: present

- name: Create Memcached service group
  ansible.builtin.group:
    name: "{{ cache_memcached_group }}"
    system: true
    state: present

- name: Create Memcached service user
  ansible.builtin.user:
    name: "{{ cache_memcached_user }}"
    system: true
    create_home: false
    group: "{{ cache_memcached_group }}"
    home: /nonexistent
    comment: Memcached
    shell: /bin/false
    password_lock: true
    state: present

- name: Create Memcached log directory
  ansible.builtin.file:
    path: "{{ cache_memcached_log_path }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_group }}"
    mode: "0755"

- name: Create Memcached runtime directory
  ansible.builtin.file:
    path: /var/run/memcached
    state: directory
    owner: "{{ cache_memcached_user }}"
    group: "{{ cache_memcached_group }}"
    mode: "0755"
