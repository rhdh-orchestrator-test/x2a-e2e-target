---
argument_specs:
  main:
    short_description: Role for setting up a secure HTTPS website with Apache
    description:
      - This role installs and configures Apache web server with SSL/TLS security
      - Sets up a virtual host for a "Hello World" website
      - Implements SSL/TLS security hardening (POODLE vulnerability fix)
    options:
      conftext:
        type: str
        description: Apache virtual host configuration for HTTPS
      webtext:
        type: str
        description: HTML content for the Hello World website
