---
controller_credential_types:
- name: Chef Automation User
  description: User credentials for Chef Automation and Chef Infra Server setup
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Automation and Chef Infra Server
    - id: long_username
      type: string
      label: Long Username
      help_text: Full username for Chef Automation and Chef Infra Server
    - id: user_email
      type: string
      label: User Email
      help_text: Email address for Chef Automation and Chef Infra Server user
    - id: user_password
      type: string
      label: User Password
      secret: true
      help_text: Password for Chef Automation and Chef Infra Server user
    - id: org_name
      type: string
      label: Organization Name
      help_text: Organization name for Chef Automation and Chef Infra Server
    required:
    - username
    - user_password
    - org_name
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      long_username: !unsafe '{{ long_username }}'
      user_email: !unsafe '{{ user_email }}'
      user_password: !unsafe '{{ user_password }}'
      org_name: !unsafe '{{ org_name }}'
