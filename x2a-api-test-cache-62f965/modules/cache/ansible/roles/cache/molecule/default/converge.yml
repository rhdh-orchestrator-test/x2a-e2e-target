---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          # Generated by Ansible

          # Network
          bind 127.0.0.1
          port 6379

          # General
          daemonize yes
          supervised systemd
          pidfile /var/run/redis/redis-server.pid

          # Logging
          loglevel notice
          logfile /var/log/redis/redis-server.log

          # Snapshotting
          save 900 1
          save 300 10
          save 60 10000

          # Database
          databases 16

          # Security
          requirepass redis_secure_password_123

          # Memory management
          maxmemory-policy allkeys-lru

          # Append only file
          appendonly yes
          appendfilename "appendonly.aof"

          # Slow log
          slowlog-log-slower-than 10000
          slowlog-max-len 128

          # Client output buffer limits
          client-output-buffer-limit normal 0 0 0
          client-output-buffer-limit replica 256mb 64mb 60
          client-output-buffer-limit pubsub 32mb 8mb 60

          # TCP keepalive
          tcp-keepalive 300

          # Disable dangerous commands
          rename-command FLUSHDB ""
          rename-command FLUSHALL ""
          rename-command DEBUG ""
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create memcached configuration directory
      ansible.builtin.file:
        path: /tmp/molecule_test/etc/memcached
        state: directory
        mode: "0755"

    - name: Create memcached configuration file
      ansible.builtin.copy:
        content: |
          # memcached default config file
          # Run memcached as a daemon
          -d
          # Log memcached's output to /var/log/memcached
          logfile /var/log/memcached.log
          # Be verbose
          # -v
          # Be even more verbose (print client commands as well)
          # -vv
          # Start with a cap of 64 megs of memory. It's reasonable, and the daemon default
          # Note that the daemon will grow to this size, but does not start out holding this much
          # memory
          -m 64
          # Default connection port is 11211
          -p 11211
          # Run the daemon as root. The start-memcached will default to running as root if no
          # -u command is present in this config file
          -u memcache
          # Specify which IP address to listen on. The default is to listen on all IP addresses
          # This parameter is one of the only security measures that memcached has, so make sure
          # it's listening on a firewalled interface.
          -l 127.0.0.1
          # Limit the number of simultaneous incoming connections. The daemon default is 1024
          # -c 1024
          # Lock down all paged memory. Consult with the README and homepage before you do this
          # -k
          # Return error when memory is exhausted (rather than removing items)
          # -M
          # Maximize core file limit
          # -r
        dest: /tmp/molecule_test/etc/memcached/memcached.conf
        mode: "0644"
        backup: true

    - name: Create log files
      ansible.builtin.copy:
        content: ""
        dest: "{{ item_log }}"
        mode: "0644"
        backup: true
      loop:
        - /tmp/molecule_test/var/log/redis/redis-server.log
        - /tmp/molecule_test/var/log/memcached.log
      loop_control:
        loop_var: item_log

    - name: Create PID directory
      ansible.builtin.file:
        path: /tmp/molecule_test/var/run/redis
        state: directory
        mode: "0755"