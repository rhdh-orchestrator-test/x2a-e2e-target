---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_hostname }}"
  become: true
- name: Set vm.max_map_count kernel parameter
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ chef_vm_max_map_count }}"
    state: present
    reload: true
  become: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ chef_vm_dirty_expire_centisecs }}"
    state: present
    reload: true
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_binary }} && chmod +x {{ chef_automate_cli_binary }}
    chdir: /tmp
    stdin: "{{ lookup('file', '/tmp/chef-automate.zip') }}"
    creates: "{{ chef_automate_cli_binary }}"
  args:
    executable: /bin/bash
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: ./{{ chef_automate_cli_binary }} deploy --product {{ chef_automate_products.automate }} --product {{ chef_automate_products.infra_server }}
      --accept-terms-and-mlsa=true
    chdir: /tmp
    creates: /hab
  become: true
- name: Ensure home directory exists for PEM files
  ansible.builtin.file:
    path: /home
    state: directory
    mode: "0755"
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_user_name }}  "{{ chef_user_long_name }}"  {{ chef_user_email }}  "{{ password }}"  --filename /home/{{ chef_user_pem_filename
      }}

      '
    creates: /home/{{ chef_user_pem_filename }}
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_org_name }}  "{{ chef_org_long_name }}"  --association_user {{ chef_user_name }}  --filename /home/{{ chef_org_validator_pem_filename
      }}

      '
    creates: /home/{{ chef_org_validator_pem_filename }}
  become: true
