- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directory structure
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/home
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_hostname | default(''automate.chef.lab'') }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = {{ chef_vm_max_map_count | default(262144) }}

        vm.dirty_expire_centisecs = {{ chef_vm_dirty_expire_centisecs | default(20000) }}

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI binary placeholder
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefghijklmnopq

        rstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefg

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/{{ chef_user_name | default('admin') }}.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefghijklmnopq

        rstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefg

        hijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ12345678

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/{{ chef_org_name | default('lab') }}-validator.pem
      mode: '0600'
  - name: Create Chef server status file
    ansible.builtin.copy:
      content: 'run: state up

        postgresql: state up

        nginx: state up

        bookshelf: state up

        oc_bifrost: state up

        oc_id: state up

        opscode-erchef: state up

        opscode-solr4: state up

        '
      dest: /tmp/molecule_test/etc/chef-server-status.txt
      mode: '0644'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: automate-gateway

        Status: running

        Service: automate-postgresql

        Status: running

        Service: automate-elasticsearch

        Status: running

        '
      dest: /tmp/molecule_test/etc/chef-automate-status.txt
      mode: '0644'
