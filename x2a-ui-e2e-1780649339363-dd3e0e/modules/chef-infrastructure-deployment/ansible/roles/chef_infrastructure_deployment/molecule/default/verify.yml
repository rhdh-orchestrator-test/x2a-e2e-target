---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    chef_hostname: automate.chef.lab
    chef_vm_max_map_count: 262144
    chef_vm_dirty_expire_centisecs: 20000
    chef_user_name: admin
    chef_org_name: lab
  tasks:
    # System configuration checks
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists and has content
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found or empty"
        success_msg: "Hostname file exists and has content"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == chef_hostname
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_file.stat.exists

    - name: Check sysctl settings file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Sysctl settings file not found or empty"
        success_msg: "Sysctl settings file exists"

    - name: Get sysctl file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl settings are correct
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('vm.max_map_count = ' ~ chef_vm_max_map_count)
          - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = ' ~ chef_vm_dirty_expire_centisecs)
        fail_msg: "Sysctl settings are not configured correctly"
        success_msg: "Sysctl settings are configured correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI check
    - name: Check Chef Automate CLI binary exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI binary exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI binary not found or not executable"
        success_msg: "Chef Automate CLI binary exists and is executable"

    # Chef deployment check
    - name: Check Chef deployment directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: hab_dir

    - name: Assert Chef deployment directory exists
      ansible.builtin.assert:
        that:
          - hab_dir.stat.exists
          - hab_dir.stat.isdir
        fail_msg: "Chef deployment directory not found"
        success_msg: "Chef deployment directory exists"

    # User and organization PEM files check
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/home/{{ chef_user_name }}.pem"
      register: user_pem

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.size > 0
        fail_msg: "User PEM file not found or empty"
        success_msg: "User PEM file exists"

    - name: Check organization validator PEM file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/home/{{ chef_org_name }}-validator.pem"
      register: org_pem

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_pem.stat.exists
          - org_pem.stat.size > 0
        fail_msg: "Organization validator PEM file not found or empty"
        success_msg: "Organization validator PEM file exists"

    # Chef server status check
    - name: Check Chef server status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server-status.txt
      register: chef_server_status

    - name: Assert Chef server status file exists
      ansible.builtin.assert:
        that:
          - chef_server_status.stat.exists
          - chef_server_status.stat.size > 0
        fail_msg: "Chef server status file not found or empty"
        success_msg: "Chef server status file exists"

    # Chef Automate status check
    - name: Check Chef Automate status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate-status.txt
      register: chef_automate_status

    - name: Assert Chef Automate status file exists
      ansible.builtin.assert:
        that:
          - chef_automate_status.stat.exists
          - chef_automate_status.stat.size > 0
        fail_msg: "Chef Automate status file not found or empty"
        success_msg: "Chef Automate status file exists"

    # The following checks would normally run on a real system but can't run in a container
    # They are tagged with molecule-notest to exclude them from container testing

    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: chef-automate status
      register: automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server is running
      ansible.builtin.assert:
        that:
          - server_status.rc == 0
        fail_msg: "Chef Infra Server is not running"
        success_msg: "Chef Infra Server is running"
      tags: molecule-notest

    - name: Check Chef Automate API
      ansible.builtin.uri:
        url: https://localhost/api/v0/auth/version
        validate_certs: false
      register: api_check
      tags: molecule-notest

    - name: Assert Chef Automate API is accessible
      ansible.builtin.assert:
        that:
          - api_check.status == 200
        fail_msg: "Chef Automate API is not accessible"
        success_msg: "Chef Automate API is accessible"
      tags: molecule-notest

    - name: Check Chef Automate health endpoint
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
      register: health_check
      tags: molecule-notest

    - name: Assert Chef Automate health endpoint is accessible
      ansible.builtin.assert:
        that:
          - health_check.status == 200
        fail_msg: "Chef Automate health endpoint is not accessible"
        success_msg: "Chef Automate health endpoint is accessible"
      tags: molecule-notest

    - name: Check HTTPS port is listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      tags: molecule-notest