---
- name: Install TLS packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}"  # noqa: R114 - path comes from role defaults
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}"  # noqa: R114 - path comes from role defaults
    owner: root
    group: ssl-cert
    mode: "0710"
    state: directory

- name: Check configured TLS certificate
  ansible.builtin.stat:
    path: "{{ item_nginx_ssl['value']['cert_file'] }}"
  register: nginx_multisite_certificate
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_ssl

- name: Check configured TLS private key
  ansible.builtin.stat:
    path: "{{ item_nginx_key['value']['key_file'] }}"
  register: nginx_multisite_private_key
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_key

- name: Generate self-signed certificates
  ansible.builtin.command:  # noqa: R101 - command arguments come from role defaults site configuration
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ item_nginx_ssl['value']['key_file'] }}"
      - -out
      - "{{ item_nginx_ssl['value']['cert_file'] }}"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_ssl['key'] }}/emailAddress=admin@example.com
  when:
    - item_nginx_ssl['value']['ssl_enabled'] | bool
    - not (nginx_multisite_certificate.results[ansible_loop.index0].stat.exists | default(false)) or not (nginx_multisite_private_key.results[ansible_loop.index0].stat.exists | default(false))  # noqa: L039 - registered by the preceding stat tasks
  changed_when: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_ssl
    extended: true
  notify: Reload nginx

- name: Set private key ownership and permissions
  ansible.builtin.file:
    path: "{{ item_nginx_key['value']['key_file'] }}"  # noqa: R114 - path comes from role defaults site configuration
    owner: root
    group: ssl-cert
    mode: "0640"
    state: file
  when: item_nginx_key['value']['ssl_enabled'] | bool
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_key
