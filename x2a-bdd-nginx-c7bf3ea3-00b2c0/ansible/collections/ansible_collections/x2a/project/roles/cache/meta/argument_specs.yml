---
argument_specs:
  main:
    short_description: Install and configure Memcached and Redis cache services
    description:
      - Installs and configures Memcached and Redis with authentication and service management.
    options:
      cache_memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached cache size in megabytes.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      cache_memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      cache_memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      cache_memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached connections.
      cache_memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      cache_memcached_experimental_options:
        type: list
        required: false
        default: []
        description: Experimental Memcached options.
      cache_memcached_extra_cli_options:
        type: list
        required: false
        default: []
        description: Additional Memcached command-line options.
      cache_memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file descriptor limit.
      cache_memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log directory.
      cache_memcached_threads:
        type: int
        required: false
        default: 4
        description: Number of Memcached worker threads.
      cache_memcached_user:
        type: str
        required: false
        default: memcached
        description: Memcached service user.
      cache_memcached_group:
        type: str
        required: false
        default: memcached
        description: Memcached service group.
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: Redis service user.
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: Redis service group.
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Redis service name.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide tasks that handle the Redis password from output.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
