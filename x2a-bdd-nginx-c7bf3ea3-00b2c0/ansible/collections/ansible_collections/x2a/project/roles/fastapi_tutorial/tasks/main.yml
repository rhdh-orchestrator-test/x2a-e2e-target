---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI and PostgreSQL packages on RedHat-family systems
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Install FastAPI and PostgreSQL packages on Debian-family systems
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Initialize PostgreSQL on RedHat-family systems
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Ensure application service group exists
  ansible.builtin.group:
    name: "{{ fastapi_tutorial_service_group }}"
    state: present

- name: Ensure application service user exists
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    state: present
    create_home: false

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    mode: "0755"
    recurse: true

- name: Synchronize FastAPI tutorial repository # noqa: R104 - repository URL comes from a trusted role default and uses HTTPS
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - destination is a role default controlled by the operator
    version: "{{ fastapi_tutorial_revision }}"
    update: true # noqa: R106 - repository source is a trusted role default controlled by the operator

- name: Create Python virtual environment
  ansible.builtin.command: # noqa: R101 - command arguments come from trusted role defaults, not user input
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_path }}"
    creates: "{{ fastapi_tutorial_venv_path }}/bin/python" # noqa: R114 - path is a role default controlled by the operator

- name: Install application dependencies # noqa: R113 - dependency path and virtualenv come from trusted role defaults
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt" # noqa: R114 - requirements path is under the role-defined application path
    virtualenv: "{{ fastapi_tutorial_venv_path }}" # noqa: R114 - virtualenv path is a role default controlled by the operator

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL application role # noqa: L039 - credentials are validated by the preceding validation task
  ansible.builtin.command: # noqa: R101 - command arguments come from validated role credentials
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -c
      - DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '{{ db_username }}') THEN CREATE ROLE {{ db_username }} LOGIN PASSWORD '{{ db_password }}'; ELSE ALTER ROLE {{ db_username }} WITH PASSWORD '{{ db_password }}'; END IF; END $$;
  become: true # noqa: R108 - PostgreSQL role management must run as the postgres system user
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"
  changed_when: false

- name: Create application database # noqa: L039 - credentials are validated by the preceding validation task
  ansible.builtin.command: # noqa: R101 - command arguments come from validated role credentials
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -c
      - SELECT 'CREATE DATABASE {{ db_name }} OWNER {{ db_username }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ db_name }}')\gexec
  become: true # noqa: R108 - PostgreSQL database management must run as the postgres system user
  become_user: postgres
  changed_when: false

- name: Grant application database privileges # noqa: L039 - credentials are validated by the preceding validation task
  ansible.builtin.command: # noqa: R101 - command arguments come from validated role credentials
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_username }};
  become: true # noqa: R108 - PostgreSQL privilege management must run as the postgres system user
  become_user: postgres
  changed_when: false

- name: Write application environment file
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - path is under the role-defined application directory
    content: |
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL={{ fastapi_tutorial_database_url }}
    owner: "{{ fastapi_tutorial_service_user }}"
    group: "{{ fastapi_tutorial_service_group }}"
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/{{ fastapi_tutorial_service_name }}.service # noqa: R114 - service name is a role default controlled by the operator
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User={{ fastapi_tutorial_service_user }}
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_venv_path }}/bin"
      ExecStart={{ fastapi_tutorial_venv_path }}/bin/uvicorn {{ fastapi_tutorial_app_module }} --host {{ fastapi_tutorial_listen_address }} --port {{ fastapi_tutorial_listen_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd manager

- name: Apply pending systemd unit changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
