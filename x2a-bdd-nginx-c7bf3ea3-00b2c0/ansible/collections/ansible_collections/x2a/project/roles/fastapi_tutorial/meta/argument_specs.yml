---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application.
    description:
      - Deploys the FastAPI tutorial repository, its Python virtual environment, PostgreSQL dependency, and systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Filesystem path where the application is deployed.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the FastAPI application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_venv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Path to the Python virtual environment.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Name of the systemd service.
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: User running the application service.
      fastapi_tutorial_service_group:
        type: str
        required: false
        default: root
        description: Group running the application service.
      fastapi_tutorial_listen_address:
        type: str
        required: false
        default: 0.0.0.0
        description: Address on which Uvicorn listens.
      fastapi_tutorial_listen_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which Uvicorn listens.
      fastapi_tutorial_app_module:
        type: str
        required: false
        default: app.main:app
        description: ASGI application import path.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Application project name written to the environment file.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: Application API version written to the environment file.
      fastapi_tutorial_database_url:
        type: str
        required: false
        default: postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/{{ db_name }}
        description: Database connection URL assembled from AAP credential variables.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations that handle the database password.
      db_username:
        type: str
        required: true
        description: Database username injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: Database password injected by an AAP credential type.
      db_host:
        type: str
        required: true
        description: Database host injected by an AAP credential type.
      db_port:
        type: str
        required: true
        description: Database port injected by an AAP credential type.
      db_name:
        type: str
        required: true
        description: Database name injected by an AAP credential type.
