---
# Unsupported pre-flight diagnostics: certificate subjects/validity and key ownership/modes have no
# stated expected output; those certificate/key property checks are omitted.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify required packages are installed
      ansible.builtin.assert:
        that:
          - item_packages in ansible_facts.packages
        fail_msg: "A required package is not installed"
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_packages

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify nginx and fail2ban are enabled and active
      ansible.builtin.assert:
        that:
          - "item_service + '.service' in ansible_facts.services"
          - ansible_facts.services[item_service + '.service']['status'] == 'enabled'
          - ansible_facts.services[item_service + '.service']['state'] == 'running'
        fail_msg: "The required service is not enabled and active"
      loop:
        - nginx
        - fail2ban
      loop_control:
        loop_var: item_service

    - name: Verify an SSH service is active
      ansible.builtin.assert:
        that:
          - >-
            ('sshd.service' in ansible_facts.services and
            ansible_facts.services['sshd.service']['state'] == 'running') or
            ('ssh.service' in ansible_facts.services and
            ansible_facts.services['ssh.service']['state'] == 'running')
        fail_msg: "Neither sshd nor ssh is active"

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - item_nginx_test['rc'] == 0
        fail_msg: "nginx configuration validation failed"

    - name: Inspect the loaded nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      register: item_nginx_dump
      changed_when: false

    - name: Assert all site names are in the loaded nginx configuration
      ansible.builtin.assert:
        that:
          - item_site_name in item_nginx_dump['stdout']
        fail_msg: "A configured site name is missing from nginx configuration"
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site_name

    - name: Read nginx and security configuration
      ansible.builtin.slurp:
        src: "{{ item_config['path'] }}"
      register: item_config_contents
      loop:
        - path: /etc/nginx/nginx.conf
        - path: /etc/nginx/conf.d/security.conf
      loop_control:
        loop_var: item_config

    - name: Verify nginx base and security settings
      ansible.builtin.assert:
        that:
          - >-
            (item_config_contents['results'][0]['content'] | b64decode) is
            search('user\\s+nginx|worker_processes|worker_connections|access_log|error_log|gzip\\s+on|sites-enabled')
          - >-
            (item_config_contents['results'][1]['content'] | b64decode) is
            search('server_tokens|limit_req_zone|client_max_body_size|ssl_protocols|ssl_ciphers')
        fail_msg: "Expected nginx base or security settings are missing"

    - name: Verify required configuration files exist
      ansible.builtin.stat:
        path: "{{ item_required_file }}"
      register: item_required_file_stat
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_required_file

    - name: Assert required configuration files exist
      ansible.builtin.assert:
        that:
          - item_required_file_result['stat']['exists']
        fail_msg: "A required configuration or site file is missing"
      loop: "{{ item_required_file_stat['results'] }}"
      loop_control:
        loop_var: item_required_file_result

    - name: Verify required site directories exist
      ansible.builtin.stat:
        path: "{{ item_site_directory }}"
      register: item_site_directory_stat
      loop:
        - /opt/server/test
        - /opt/server/ci
        - /opt/server/status
        - /etc/nginx/sites-available
        - /etc/nginx/sites-enabled
      loop_control:
        loop_var: item_site_directory

    - name: Assert required site directories exist
      ansible.builtin.assert:
        that:
          - item_site_directory_result['stat']['exists']
          - item_site_directory_result['stat']['isdir']
        fail_msg: "A required site directory is missing"
      loop: "{{ item_site_directory_stat['results'] }}"
      loop_control:
        loop_var: item_site_directory_result

    - name: Verify site symlinks and targets
      ansible.builtin.stat:
        path: "{{ item_site_link['path'] }}"
        follow: false
      register: item_site_link_stat
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site_link

    - name: Assert site symlinks point to their available configurations
      ansible.builtin.assert:
        that:
          - item_site_link_result['stat']['islnk']
          - item_site_link_result['stat']['lnk_source'] == item_site_link_result['item']['target']
        fail_msg: "A site symlink is missing or has the wrong target"
      loop: "{{ item_site_link_stat['results'] }}"
      loop_control:
        loop_var: item_site_link_result

    - name: Verify the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_site['stat']['exists']
        fail_msg: "The default nginx site still exists"

    - name: Read SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_sshd_config

    - name: Assert SSH hardening settings are present
      ansible.builtin.assert:
        that:
          - (item_sshd_config['content'] | b64decode) is search('(?m)^PermitRootLogin no$')
          - (item_sshd_config['content'] | b64decode) is search('(?m)^PasswordAuthentication no$')
        fail_msg: "Required SSH hardening settings are missing"

    - name: Check fail2ban status
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
      register: item_fail2ban_status
      changed_when: false

    - name: Assert fail2ban reports status
      ansible.builtin.assert:
        that:
          - item_fail2ban_status['rc'] == 0
        fail_msg: "fail2ban status check failed"

    - name: Check firewall status and allowed ports
      ansible.builtin.command:
        argv:
          - ufw
          - status
      register: item_ufw_status
      changed_when: false

    - name: Assert SSH HTTP and HTTPS firewall ports are allowed
      ansible.builtin.assert:
        that:
          - item_ufw_status['rc'] == 0
          - item_ufw_status['stdout'] is search('22/tcp')
          - item_ufw_status['stdout'] is search('80/tcp')
          - item_ufw_status['stdout'] is search('443/tcp')
        fail_msg: "Required firewall ports are not reported as allowed"

    - name: Check site HTTP and HTTPS endpoints
      ansible.builtin.uri:
        url: "{{ item_endpoint['scheme'] }}://127.0.0.1:{{ item_endpoint['port'] }}/"
        headers:
          Host: "{{ item_endpoint['host'] }}"
        validate_certs: false
        status_code: "{{ range(200, 400) | list }}"
      loop:
        - host: test.cluster.local
          scheme: http
          port: 80
        - host: test.cluster.local
          scheme: https
          port: 443
        - host: ci.cluster.local
          scheme: http
          port: 80
        - host: ci.cluster.local
          scheme: https
          port: 443
        - host: status.cluster.local
          scheme: http
          port: 80
        - host: status.cluster.local
          scheme: https
          port: 443
      loop_control:
        loop_var: item_endpoint
