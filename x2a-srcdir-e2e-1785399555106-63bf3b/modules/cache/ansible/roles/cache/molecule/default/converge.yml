---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create the directory structure that would be created by Redis installation
    - name: Create expected Redis directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/run/redis

    # Create a mock Redis configuration file
    - name: Create mock Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file example
          
          # Accept connections on the specified port, default is 6379
          port 6379
          
          # If you want you can bind a single interface
          bind 127.0.0.1
          
          # Specify the path for the Unix socket that will be used to listen for
          # incoming connections
          unixsocket /var/run/redis/redis-server.sock
          unixsocketperm 700
          
          # Close the connection after a client is idle for N seconds
          timeout 0
          
          # Set server verbosity
          loglevel notice
          
          # Specify the log file name
          logfile /var/log/redis/redis-server.log
          
          # Set the number of databases
          databases 16
          
          # Save the DB on disk
          save 900 1
          save 300 10
          save 60 10000
          
          # The filename where to dump the DB
          dbfilename dump.rdb
          
          # The working directory
          dir /var/lib/redis
        dest: "/tmp/molecule_test/etc/redis/redis.conf"
        mode: "0644"

    # Create a mock Redis log file
    - name: Create mock Redis log file
      ansible.builtin.copy:
        content: |
          1:M 01 Jan 2023 00:00:00.000 # Server initialized
          1:M 01 Jan 2023 00:00:00.000 * Ready to accept connections
        dest: "/tmp/molecule_test/var/log/redis/redis-server.log"
        mode: "0644"

    # Create a mock Redis socket file
    - name: Create mock Redis socket directory
      ansible.builtin.file:
        path: "/tmp/molecule_test/var/run/redis"
        state: directory
        mode: "0755"

    # Create a mock Redis data file
    - name: Create mock Redis data directory
      ansible.builtin.file:
        path: "/tmp/molecule_test/var/lib/redis"
        state: directory
        mode: "0755"