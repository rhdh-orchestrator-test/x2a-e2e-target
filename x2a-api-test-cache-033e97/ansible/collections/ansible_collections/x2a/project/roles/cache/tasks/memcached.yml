---
- name: Install Memcached package
  ansible.builtin.package:
    name: "{{ cache_memcached_package_name }}"
    state: present

- name: Configure Memcached service
  ansible.builtin.template:
    src: memcached.conf.j2
    dest: "{{ cache_memcached_config_file }}" # noqa: R114 - path is a role-controlled platform configuration path
    mode: "0644"
    backup: true
  notify: Restart Memcached

- name: Start and enable Memcached
  ansible.builtin.service:
    name: "{{ cache_memcached_service_name }}" # noqa: R114 - service name is a role-controlled platform value
    state: started
    enabled: true
