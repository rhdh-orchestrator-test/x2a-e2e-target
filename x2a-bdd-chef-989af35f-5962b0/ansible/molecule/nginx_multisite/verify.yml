---
# Unsupported: detailed certificate subject/SAN and validity-period inspection, SSH endpoint
# status, and the complete UFW numbered-rule display are not asserted here.
- name: Verify nginx-multisite deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that: item_package in ansible_facts.packages
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are active and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services[item_service]['state'] == 'running'
          - ansible_facts.services[item_service]['status'] == 'enabled'
      loop:
        - nginx.service
        - fail2ban.service
      loop_control:
        loop_var: item_service

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that: nginx_test['rc'] == 0

    - name: Read required configuration files
      ansible.builtin.slurp:
        src: "{{ item_config['path'] }}"
      loop:
        - path: /etc/nginx/nginx.conf
        - path: /etc/nginx/conf.d/security.conf
        - path: /etc/ssh/sshd_config
      loop_control:
        loop_var: item_config
      register: config_files

    - name: Assert nginx main configuration values
      ansible.builtin.assert:
        that:
          - "'user www-data' in (config_files['results'][0]['content'] | b64decode)"
          - "'worker_processes auto' in (config_files['results'][0]['content'] | b64decode)"
          - "'worker_connections 768' in (config_files['results'][0]['content'] | b64decode)"
          - "'access_log' in (config_files['results'][0]['content'] | b64decode)"
          - "'error_log' in (config_files['results'][0]['content'] | b64decode)"
          - "'gzip' in (config_files['results'][0]['content'] | b64decode)"

    - name: Assert nginx security configuration values
      ansible.builtin.assert:
        that:
          - "'server_tokens off' in (config_files['results'][1]['content'] | b64decode)"
          - "'limit_req_zone' in (config_files['results'][1]['content'] | b64decode)"
          - "'client_max_body_size' in (config_files['results'][1]['content'] | b64decode)"
          - "'ssl_protocols TLSv1.2 TLSv1.3' in (config_files['results'][1]['content'] | b64decode)"
          - "'ssl_ciphers' in (config_files['results'][1]['content'] | b64decode)"

    - name: Assert SSH hardening values
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (config_files['results'][2]['content'] | b64decode)"
          - "'PasswordAuthentication no' in (config_files['results'][2]['content'] | b64decode)"

    - name: Check required security files
      ansible.builtin.stat:
        path: "{{ item_security['path'] }}"
      loop:
        - path: /etc/fail2ban/jail.local
        - path: /etc/sysctl.d/99-security.conf
      loop_control:
        loop_var: item_security
      register: security_files

    - name: Assert required security files exist
      ansible.builtin.assert:
        that:
          - item_security_result['stat']['exists']
          - item_security_result['stat']['isreg']
      loop: "{{ security_files['results'] }}"
      loop_control:
        loop_var: item_security_result

    - name: Check site paths
      ansible.builtin.stat:
        path: "{{ item_site['path'] }}"
        follow: false
      loop:
        - path: /opt/server/test
        - path: /opt/server/test/index.html
        - path: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/test.cluster.local
        - path: /opt/server/ci
        - path: /opt/server/ci/index.html
        - path: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
        - path: /opt/server/status
        - path: /opt/server/status/index.html
        - path: /etc/nginx/sites-available/status.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_site
      register: site_paths

    - name: Assert site paths exist
      ansible.builtin.assert:
        that: item_site_result['stat']['exists']
      loop: "{{ site_paths['results'] }}"
      loop_control:
        loop_var: item_site_result

    - name: Check default enabled site
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert default enabled site is absent
      ansible.builtin.assert:
        that: not default_site['stat']['exists']

    - name: Read virtual-host configurations
      ansible.builtin.slurp:
        src: "{{ item_vhost['path'] }}"
      loop:
        - path: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_vhost
      register: vhost_files

    - name: Assert virtual-host listeners and TLS settings
      ansible.builtin.assert:
        that:
          - "'listen 80' in (item_vhost_file['content'] | b64decode)"
          - "'listen 443 ssl http2' in (item_vhost_file['content'] | b64decode)"
          - "'ssl_certificate' in (item_vhost_file['content'] | b64decode)"
          - "'ssl_certificate_key' in (item_vhost_file['content'] | b64decode)"
      loop: "{{ vhost_files['results'] }}"
      loop_control:
        loop_var: item_vhost_file

    - name: Check certificates and private keys
      ansible.builtin.stat:
        path: "{{ item_tls['path'] }}"
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/certs/ci.cluster.local.crt
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/certs/status.cluster.local.crt
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_tls
      register: tls_files

    - name: Assert certificates and keys exist
      ansible.builtin.assert:
        that:
          - item_tls_result['stat']['exists']
          - item_tls_result['stat']['isreg']
      loop: "{{ tls_files['results'] }}"
      loop_control:
        loop_var: item_tls_result

    - name: Assert private-key ownership and mode
      ansible.builtin.assert:
        that:
          - item_key['stat']['pw_name'] == 'root'
          - item_key['stat']['gr_name'] == 'ssl-cert'
          - item_key['stat']['mode'] == '0640'
      loop:
        - "{{ tls_files['results'][1] }}"
        - "{{ tls_files['results'][3] }}"
        - "{{ tls_files['results'][5] }}"
      loop_control:
        loop_var: item_key

    - name: Verify HTTP redirects and HTTPS responses
      ansible.builtin.uri:
        url: "{{ item_endpoint['url'] }}"
        headers:
          Host: "{{ item_endpoint['host'] }}"
        validate_certs: false
        follow_redirects: none
        return_content: true
        status_code: "{{ item_endpoint['status'] }}"
      loop:
        - url: http://127.0.0.1/
          host: test.cluster.local
          status: 301
        - url: http://127.0.0.1/
          host: ci.cluster.local
          status: 301
        - url: http://127.0.0.1/
          host: status.cluster.local
          status: 301
        - url: https://127.0.0.1/
          host: test.cluster.local
          status: 200
        - url: https://127.0.0.1/
          host: ci.cluster.local
          status: 200
        - url: https://127.0.0.1/
          host: status.cluster.local
          status: 200
      loop_control:
        loop_var: item_endpoint
      register: endpoint_results

    - name: Assert HTTP responses redirect to HTTPS
      ansible.builtin.assert:
        that: item_redirect['location'] is defined
      loop: "{{ endpoint_results['results'][0:3] }}"
      loop_control:
        loop_var: item_redirect

    - name: Verify security headers for test site
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: test.cluster.local
        validate_certs: false
        return_content: false
        status_code: 200
      register: security_headers

    - name: Assert required security headers are present
      ansible.builtin.assert:
        that:
          - security_headers['x_strict_transport_security'] is defined
          - security_headers['x_frame_options'] is defined
          - security_headers['x_content_type_options'] is defined
          - security_headers['x_xss_protection'] is defined
          - security_headers['referrer_policy'] is defined
          - security_headers['content_security_policy'] is defined

    - name: Read UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: ufw_status
      changed_when: false

    - name: Assert UFW is active with required defaults and rules
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status['stdout']"
          - "'Default: deny (incoming)' in ufw_status['stdout']"
          - "'22/tcp' in ufw_status['stdout']"
          - "'80/tcp' in ufw_status['stdout']"
          - "'443/tcp' in ufw_status['stdout']"
