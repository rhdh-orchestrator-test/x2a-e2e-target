---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Redis through the approved collection role # noqa: L038 - eloy.redis.redis is supplied by the declared eloy.redis collection dependency
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: "{{ cache_redis_cluster_enabled }}"
    redis_sentinel_enabled: "{{ cache_redis_sentinel_enabled }}"
    redis_replication_enabled: "{{ cache_redis_replication_enabled }}"
    redis_rdb_enabled: "{{ cache_redis_rdb_enabled }}"
    redis_aof_enabled: "{{ cache_redis_aof_enabled }}"

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Check whether the Redis configuration exists
  ansible.builtin.stat:
    path: "{{ cache_redis_config_path }}"
  register: cache_redis_config

- name: Remove replication directives from Redis configuration # noqa: L039 - cache_redis_config is registered by the preceding stat task
  ansible.builtin.lineinfile: # noqa: R115 - deletion is restricted to the role-default Redis configuration path
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default controlled by the operator
    regexp: "^{{ item_cache_directive }}.*$"
    state: absent
    create: false
  when: cache_redis_config.stat.exists
  loop:
    - replica-serve-stale-data
    - replica-read-only
    - repl-ping-replica-period
    - client-output-buffer-limit
    - replica-priority
  loop_control:
    loop_var: item_cache_directive
