---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Deploy fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Check UFW status
  ansible.builtin.command: # noqa: R101 - ufw is a fixed system command and its output is registered for subsequent checks
    argv:
      - ufw
      - status
      - verbose
  register: nginx_multisite_ufw_status
  changed_when: false
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default incoming policy # noqa: L039 - status is registered by the preceding UFW status task when UFW is enabled
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Default: deny (incoming)' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Allow required UFW services # noqa: L039 - status is registered by the preceding UFW status task when UFW is enabled
  ansible.builtin.command: # noqa: R101 - ufw is a fixed system command; the service name comes from the role-defined loop
    argv:
      - ufw
      - allow
      - "{{ item_nginx_multisite_ufw_service['name'] }}"
  when:
    - nginx_multisite_ufw_enabled | bool
    - "('ALLOW' not in nginx_multisite_ufw_status.stdout) or (item_nginx_multisite_ufw_service['name'] not in nginx_multisite_ufw_status.stdout)"
  changed_when: true
  loop:
    - name: ssh
    - name: http
    - name: https
  loop_control:
    loop_var: item_nginx_multisite_ufw_service

- name: Enable UFW # noqa: L039 - status is registered by the preceding UFW status task when UFW is enabled
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - enable
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Deploy kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true

- name: Apply kernel security settings
  ansible.posix.sysctl:
    name: "{{ item_nginx_multisite_sysctl['name'] }}"
    value: "{{ item_nginx_multisite_sysctl['value'] }}"
    sysctl_file: /etc/sysctl.d/99-security.conf
    state: present
    reload: true
    sysctl_set: true
  loop:
    - name: net.ipv4.conf.default.rp_filter
      value: "1"
    - name: net.ipv4.conf.all.rp_filter
      value: "1"
    - name: net.ipv4.conf.all.accept_redirects
      value: "0"
    - name: net.ipv6.conf.all.accept_redirects
      value: "0"
    - name: net.ipv4.conf.default.accept_redirects
      value: "0"
    - name: net.ipv6.conf.default.accept_redirects
      value: "0"
    - name: net.ipv4.conf.all.send_redirects
      value: "0"
    - name: net.ipv4.conf.default.send_redirects
      value: "0"
    - name: net.ipv4.conf.all.accept_source_route
      value: "0"
    - name: net.ipv6.conf.all.accept_source_route
      value: "0"
    - name: net.ipv4.conf.default.accept_source_route
      value: "0"
    - name: net.ipv6.conf.default.accept_source_route
      value: "0"
    - name: net.ipv4.conf.all.log_martians
      value: "1"
    - name: net.ipv4.conf.default.log_martians
      value: "1"
    - name: net.ipv4.icmp_echo_ignore_all
      value: "1"
    - name: net.ipv4.icmp_echo_ignore_broadcasts
      value: "1"
    - name: net.ipv6.conf.all.disable_ipv6
      value: "1"
    - name: net.ipv6.conf.default.disable_ipv6
      value: "1"
    - name: net.ipv6.conf.lo.disable_ipv6
      value: "1"
    - name: net.ipv4.tcp_syncookies
      value: "1"
    - name: net.ipv4.tcp_max_syn_backlog
      value: "2048"
    - name: net.ipv4.tcp_synack_retries
      value: "2"
    - name: net.ipv4.tcp_syn_retries
      value: "5"
  loop_control:
    loop_var: item_nginx_multisite_sysctl

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    mode: "0600"
    backup: true
  when: nginx_multisite_disable_root_ssh | bool
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    mode: "0600"
    backup: true
  when: not (nginx_multisite_password_auth | bool)
  notify: Restart SSH
