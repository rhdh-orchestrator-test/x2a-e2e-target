---
argument_specs:
  main:
    short_description: Configure nginx with multiple SSL-enabled subdomains
    description:
      - Installs and hardens nginx, fail2ban, UFW, and SSH settings.
      - Generates self-signed certificates and configures multiple static HTTPS sites.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of site hostnames to document roots and SSL settings.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure UFW and fail2ban security controls.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and enable UFW.
      nginx_multisite_disable_root_ssh:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login.
      nginx_multisite_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is permitted.
