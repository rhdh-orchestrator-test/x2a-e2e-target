---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/etc
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          # Generated by Ansible

          # Network
          bind 127.0.0.1
          port 6379
          timeout 0
          tcp-keepalive 300

          # General
          loglevel notice
          logfile /var/log/redis/redis-server.log
          databases 16

          # Authentication
          requirepass redis_secure_password_123

          # Snapshotting
          save 900 1
          save 300 10
          save 60 10000
          stop-writes-on-bgsave-error yes
          rdbcompression yes
          rdbchecksum yes
          dbfilename dump.rdb
          dir /var/lib/redis

          # Memory management
          maxmemory-policy noeviction

          # Disable dangerous commands
          rename-command FLUSHDB ""
          rename-command FLUSHALL ""
          rename-command DEBUG ""
          rename-command CONFIG ""
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create Memcached configuration file
      ansible.builtin.copy:
        content: |
          # Memcached configuration
          -d
          -m 64
          -p 11211
          -u memcache
          -l 127.0.0.1
          -c 1024
        dest: /tmp/molecule_test/etc/memcached.conf
        mode: "0644"
        backup: true

    - name: Create Redis log file
      ansible.builtin.copy:
        content: |
          [1] 01 Jan 00:00:00.000 # Redis server started
          [1] 01 Jan 00:00:00.000 * Ready to accept connections
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"
        backup: true

    - name: Create Redis data directory structure
      ansible.builtin.file:
        path: /tmp/molecule_test/var/lib/redis
        state: directory
        mode: "0755"

    - name: Create Redis dump file
      ansible.builtin.copy:
        content: "REDIS0009"
        dest: /tmp/molecule_test/var/lib/redis/dump.rdb
        mode: "0644"
        backup: true