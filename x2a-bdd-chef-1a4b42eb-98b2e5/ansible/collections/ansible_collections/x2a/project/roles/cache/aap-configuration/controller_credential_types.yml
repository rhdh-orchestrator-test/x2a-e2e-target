---
controller_credential_types:
  - name: Redis Authentication
    description: Redis authentication credential for the Redis server listening on port 6379; the source value is hardcoded and must be migrated to protected 
      AAP credential storage.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password used by Redis requirepass authentication.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
