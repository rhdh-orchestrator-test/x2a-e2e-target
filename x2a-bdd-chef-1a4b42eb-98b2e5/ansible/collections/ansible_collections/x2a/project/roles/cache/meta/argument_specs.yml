---
argument_specs:
  main:
    short_description: Install and configure Memcached and Redis cache services
    description:
      - Deploys Memcached and a standalone Redis instance on port 6379.
      - Redis authentication is supplied through an AAP credential variable.
    options:
      memcached_version:
        type: str
        required: false
        default:
        description: Optional Memcached package version.
      memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory allocation in megabytes.
      memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached client connections.
      memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Experimental Memcached command-line options.
      memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional Memcached command-line options.
      memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file descriptor limit.
      memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log directory.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide Redis credential handling task output.
      redis_port:
        type: int
        required: false
        default: 6379
        description: Redis TCP port.
      redis_password:
        type: str
        required: false
        description: Redis password injected by an AAP credential type.
      redis_pid_directory:
        type: str
        required: false
        default: /run/redis
        description: Redis PID directory.
      redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
