---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install Fedora and RHEL dependencies
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Install Debian-family dependencies
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Initialize PostgreSQL on Fedora and RHEL
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Create application directory
  ansible.builtin.file:
    path: /opt/fastapi-tutorial
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize FastAPI tutorial repository
  ansible.builtin.git:
    repo: https://github.com/dibanez/fastapi_tutorial.git
    dest: /opt/fastapi-tutorial
    version: main
    update: true

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv /opt/fastapi-tutorial/venv
    creates: /opt/fastapi-tutorial/venv/bin/python

- name: Install application dependencies
  ansible.builtin.pip:
    requirements: /opt/fastapi-tutorial/requirements.txt
    virtualenv: /opt/fastapi-tutorial/venv

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the FastAPI PostgreSQL role exists
  become: true  # noqa: R108 - become_user postgres is required to query PostgreSQL roles
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'fastapi'"
  register: fastapi_role_check
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging | default(true) }}"

- name: Create the FastAPI PostgreSQL role  # noqa: L039 - password comes from the validated role credential input; fastapi_role_check is registered by the prior task # noqa: R101 - command uses the validated role credential input, not untrusted command data
  become: true  # noqa: R108 - become_user postgres is required to create the PostgreSQL role
  become_user: postgres
  ansible.builtin.command:
    cmd: >-
      psql -c "CREATE USER fastapi WITH PASSWORD '{{ fastapi_db_password }}';"
  when: fastapi_role_check.stdout | trim != '1'
  changed_when: true
  no_log: "{{ fastapi_tutorial_secure_logging | default(true) }}"

- name: Check whether the FastAPI database exists
  become: true  # noqa: R108 - become_user postgres is required to query PostgreSQL databases
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'fastapi_db'"
  register: fastapi_database_check
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging | default(true) }}"

- name: Create the FastAPI database  # noqa: L039 - fastapi_database_check is registered by the prior task
  become: true  # noqa: R108 - become_user postgres is required to create the PostgreSQL database
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -c "CREATE DATABASE fastapi_db OWNER fastapi;"
  when: fastapi_database_check.stdout | trim != '1'
  changed_when: true
  no_log: "{{ fastapi_tutorial_secure_logging | default(true) }}"

- name: Write application environment configuration  # noqa: L039 - password comes from the validated role credential input
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://fastapi:{{ fastapi_db_password }}@localhost/fastapi_db
    dest: /opt/fastapi-tutorial/.env
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging | default(true) }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/fastapi-tutorial
      Environment="PATH=/opt/fastapi-tutorial/venv/bin"
      ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Enable and start FastAPI tutorial
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
