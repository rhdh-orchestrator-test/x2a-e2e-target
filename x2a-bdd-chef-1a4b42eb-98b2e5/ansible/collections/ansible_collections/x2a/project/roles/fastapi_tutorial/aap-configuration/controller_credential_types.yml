---
controller_credential_types:
  - name: PostgreSQL Database Password
    description: Password for the FastAPI PostgreSQL role used by the application to connect to the fastapi_db database.
    kind: cloud
    inputs:
      fields:
        - id: fastapi_db_password
          type: string
          label: FastAPI Database Password
          secret: true
          help_text: Password for the PostgreSQL user fastapi; used for role creation and the DATABASE_URL in the application environment file.
      required:
        - fastapi_db_password
    injectors:
      extra_vars:
        fastapi_db_password: !unsafe "{{ fastapi_db_password }}"
