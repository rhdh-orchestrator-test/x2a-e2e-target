<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service Status</title>
  <style>
    body { margin: 0; font: 1rem/1.5 sans-serif; color: #1f2937; background: #f0fdf4; }
    main { max-width: 42rem; margin: 12vh auto; padding: 2rem; background: #fff; border-radius: .5rem; box-shadow: 0 1rem 3rem rgb(22 101 52 / 12%); }
    h1 { margin-top: 0; color: #166534; }
    .status { display: inline-block; padding: .25rem .6rem; color: #166534; background: #dcfce7; border-radius: 999px; }
  </style>
</head>
<body>
  <main>
    <h1>Service status</h1>
    <p class="status">Operational</p>
    <p>The status site is served by the nginx multisite configuration.</p>
    <p>Static content delivery is available for health-check and monitoring validation.</p>
  </main>
</body>
</html>
