---
argument_specs:
  main:
    short_description: Install and configure nginx with secure multisite TLS virtual hosts
    description:
      - Installs nginx, fail2ban, UFW, and TLS tooling.
      - Configures three HTTPS-enabled nginx sites with self-signed development certificates.
      - Applies SSH and kernel network security hardening.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of site names to document roots and TLS settings.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory where site certificates are stored.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory where site private keys are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban protection is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW rules and activation are configured.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_ssh_service:
        type: str
        required: false
        default: ssh
        description: Service name used to restart the SSH daemon after hardening.
