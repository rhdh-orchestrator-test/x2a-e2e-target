---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload security sysctl
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.rp_filter
    value: "1"
    sysctl_file: /etc/sysctl.d/99-security.conf
    reload: true
    sysctl_set: true

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Restart SSH
  ansible.builtin.service:
    name: "{{ nginx_multisite_ssh_service }}"
    state: restarted
  when: ansible_facts.services[nginx_multisite_ssh_service] is defined
