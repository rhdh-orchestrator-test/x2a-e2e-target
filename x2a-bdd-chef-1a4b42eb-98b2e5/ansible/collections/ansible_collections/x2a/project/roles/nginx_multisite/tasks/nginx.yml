---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Create nginx group
  ansible.builtin.group:
    name: nginx
    state: present

- name: Create nginx service user
  ansible.builtin.user:
    name: nginx
    group: nginx
    system: true
    create_home: false
    state: present

- name: Render nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Render nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
