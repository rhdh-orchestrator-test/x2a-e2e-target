---
# Unsupported pre-flight checks: service status/enabled-state output, nginx -T,
# configuration grep contents, UFW output, fail2ban jail status, unvalued sysctl
# and socket diagnostics, log tails, and unspecified security-header contents.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify nginx configuration passes nginx -t
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_test
      changed_when: false
      failed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - item_nginx_test['rc'] == 0
        fail_msg: nginx -t did not succeed

    - name: Verify the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_site['stat']['exists']
        fail_msg: The default nginx site must be absent

    - name: Verify required site files and document roots exist
      ansible.builtin.stat:
        path: "{{ item_site['path'] }}"
      loop:
        - path: /etc/nginx/nginx.conf
        - path: /etc/nginx/conf.d/security.conf
        - path: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-available/status.cluster.local
        - path: /etc/fail2ban/jail.local
        - path: /etc/sysctl.d/99-security.conf
        - path: /etc/ssl/certs/test.cluster.local.crt
        - path: /etc/ssl/certs/ci.cluster.local.crt
        - path: /etc/ssl/certs/status.cluster.local.crt
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
        - path: /opt/server/test/index.html
        - path: /opt/server/ci/index.html
        - path: /opt/server/status/index.html
      loop_control:
        loop_var: item_site
      register: item_required_files

    - name: Assert required site files and document roots exist
      ansible.builtin.assert:
        that:
          - item_required_file['stat']['exists']
        fail_msg: A required nginx multisite file is missing
      loop: "{{ item_required_files['results'] }}"
      loop_control:
        loop_var: item_required_file

    - name: Verify document root and index ownership and modes
      ansible.builtin.stat:
        path: "{{ item_document['path'] }}"
      loop:
        - path: /opt/server/test
          owner: nginx
          group: nginx
          mode: "0755"
        - path: /opt/server/test/index.html
          owner: nginx
          group: nginx
          mode: "0644"
        - path: /opt/server/ci
          owner: nginx
          group: nginx
          mode: "0755"
        - path: /opt/server/ci/index.html
          owner: nginx
          group: nginx
          mode: "0644"
        - path: /opt/server/status
          owner: nginx
          group: nginx
          mode: "0755"
        - path: /opt/server/status/index.html
          owner: nginx
          group: nginx
          mode: "0644"
      loop_control:
        loop_var: item_document
      register: item_document_stats

    - name: Assert document root and index ownership and modes
      ansible.builtin.assert:
        that:
          - item_document_stat['stat']['pw_name'] == item_document_stat['item']['owner']
          - item_document_stat['stat']['gr_name'] == item_document_stat['item']['group']
          - item_document_stat['stat']['mode'] == item_document_stat['item']['mode']
        fail_msg: A document root or index file has unexpected ownership or mode
      loop: "{{ item_document_stats['results'] }}"
      loop_control:
        loop_var: item_document_stat

    - name: Verify enabled site links resolve to their available-site files
      ansible.builtin.stat:
        path: "{{ item_link['link'] }}"
        follow: false
      loop:
        - link: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - link: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - link: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_link
      register: item_enabled_links

    - name: Assert enabled site links resolve correctly
      ansible.builtin.assert:
        that:
          - item_enabled_link['stat']['islnk']
          - item_enabled_link['stat']['lnk_source'] == item_enabled_link['item']['target']
        fail_msg: An enabled nginx site link is missing or points to the wrong file
      loop: "{{ item_enabled_links['results'] }}"
      loop_control:
        loop_var: item_enabled_link

    - name: Verify TLS private-key ownership and modes
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: item_key_stats

    - name: Assert TLS private-key ownership and modes
      ansible.builtin.assert:
        that:
          - item_key_stat['stat']['pw_name'] == 'root'
          - item_key_stat['stat']['gr_name'] == 'ssl-cert'
          - item_key_stat['stat']['mode'] == '0640'
        fail_msg: A TLS private key has unexpected ownership or mode
      loop: "{{ item_key_stats['results'] }}"
      loop_control:
        loop_var: item_key_stat

    - name: Compare each certificate and private-key modulus
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -noout
          - -modulus
          - -in
          - "{{ item_certificate['certificate'] }}"
      register: item_certificate_modulus
      changed_when: false
      loop:
        - certificate: /etc/ssl/certs/test.cluster.local.crt
          key: /etc/ssl/private/test.cluster.local.key
        - certificate: /etc/ssl/certs/ci.cluster.local.crt
          key: /etc/ssl/private/ci.cluster.local.key
        - certificate: /etc/ssl/certs/status.cluster.local.crt
          key: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_certificate

    - name: Read each TLS private-key modulus
      ansible.builtin.command:
        argv:
          - openssl
          - rsa
          - -noout
          - -modulus
          - -in
          - "{{ item_key_modulus['item']['key'] }}"
      register: item_key_modulus_results
      changed_when: false
      loop: "{{ item_certificate_modulus['results'] }}"
      loop_control:
        loop_var: item_key_modulus

    - name: Assert certificate and private-key modulus pairs match
      ansible.builtin.assert:
        that:
          - item_modulus_pair['stdout'] == item_modulus_pair['item']['stdout']
        fail_msg: A TLS certificate and private-key modulus do not match
      loop: "{{ item_key_modulus_results['results'] }}"
      loop_control:
        loop_var: item_modulus_pair

    - name: Read SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_sshd_config

    - name: Assert SSH root login and password authentication are disabled
      ansible.builtin.assert:
        that:
          - (item_sshd_config['content'] | b64decode) is regex('(?m)^PermitRootLogin no$')
          - (item_sshd_config['content'] | b64decode) is regex('(?m)^PasswordAuthentication no$')
        fail_msg: SSH hardening settings are not present as required

    - name: Verify HTTP redirect for each site
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_http['host'] }}"
        follow_redirects: none
        return_content: false
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_http
      register: item_http_responses

    - name: Assert each site redirects HTTP to HTTPS
      ansible.builtin.assert:
        that:
          - item_http_response['status'] == 301
          - item_http_response['location'] == 'https://' ~ item_http_response['item']['host'] ~ '/'
        fail_msg: An HTTP site endpoint did not return the required HTTPS redirect
      loop: "{{ item_http_responses['results'] }}"
      loop_control:
        loop_var: item_http_response

    - name: Verify HTTPS response and HSTS for each site
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_https['host'] }}"
        validate_certs: false
        return_content: false
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_https
      register: item_https_responses

    - name: Assert each site has a successful HTTPS response with HSTS
      ansible.builtin.assert:
        that:
          - item_https_response['status'] >= 200
          - item_https_response['status'] < 300
          - item_https_response['strict_transport_security'] is defined
        fail_msg: An HTTPS site endpoint did not return the required response or HSTS header
      loop: "{{ item_https_responses['results'] }}"
      loop_control:
        loop_var: item_https_response
