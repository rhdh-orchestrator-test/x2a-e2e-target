---
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: apache2
    state: present
  become: true
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: "{{ apache_ssl_conf_path }}"
    regexp: ^SSLProtocol.*$
    replace: "{{ ssl_protocol_setting }}"
  notify:
    - Restart apache
    - Restart sshd
