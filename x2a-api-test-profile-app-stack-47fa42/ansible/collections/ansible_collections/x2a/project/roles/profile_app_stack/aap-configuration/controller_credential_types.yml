---
controller_credential_types:
  - name: HashiCorp Vault Application Database
    description: Database connection values for the profile_app_stack application, with the database password sourced from Vault.
    kind: cloud
    inputs:
      fields:
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname or address of the PostgreSQL database.
        - id: db_port
          type: string
          label: Database Port
          help_text: Port on which the PostgreSQL database accepts connections.
        - id: db_name
          type: string
          label: Database Name
          help_text: Name of the application database.
        - id: db_user
          type: string
          label: Database User
          help_text: Username used by the application to connect to PostgreSQL.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password used by the application and database-management tasks to authenticate to PostgreSQL.
      required:
        - db_host
        - db_port
        - db_name
        - db_user
        - db_password
    injectors:
      extra_vars:
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
        db_name: !unsafe "{{ db_name }}"
        db_user: !unsafe "{{ db_user }}"
        db_password: !unsafe "{{ db_password }}"
  - name: HashiCorp Vault Application Secret Key
    description: Secret key used by the Python application, with separate production and staging values expected.
    kind: cloud
    inputs:
      fields:
        - id: secret_key
          type: string
          label: Application Secret Key
          secret: true
          help_text: Sensitive application key used for application security, signing, or encryption.
      required:
        - secret_key
    injectors:
      extra_vars:
        secret_key: !unsafe "{{ secret_key }}"
