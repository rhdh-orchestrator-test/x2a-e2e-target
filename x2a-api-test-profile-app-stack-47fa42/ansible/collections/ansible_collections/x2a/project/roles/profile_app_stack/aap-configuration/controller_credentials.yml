---
controller_credentials:
  - name: HashiCorp Vault Application Database - profile_app_stack
    description: Database connection values for the profile_app_stack application, with the database password sourced from Vault.
    organization: Default
    credential_type: HashiCorp Vault Application Database
    update_secrets: true
    inputs:
      db_host: "{{ db_host }}"
      db_port: "{{ db_port }}"
      db_name: "{{ db_name }}"
      db_user: "{{ db_user }}"
      db_password: "{{ vault_db_password }}"
  - name: HashiCorp Vault Application Secret Key - profile_app_stack
    description: Secret key used by the Python application, with separate production and staging values expected.
    organization: Default
    credential_type: HashiCorp Vault Application Secret Key
    update_secrets: true
    inputs:
      secret_key: "{{ vault_secret_key }}"
