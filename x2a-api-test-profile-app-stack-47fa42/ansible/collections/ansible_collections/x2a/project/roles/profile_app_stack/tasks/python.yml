---
- name: Install Python and application dependencies
  ansible.builtin.package:
    name: "{{ profile_app_stack_python_packages }}"
    state: present

- name: Create application group
  ansible.builtin.group:
    name: "{{ profile_app_stack_app_group }}"
    state: present

- name: Create application user
  ansible.builtin.user:
    name: "{{ profile_app_stack_app_user }}"
    group: "{{ profile_app_stack_app_group }}"
    home: "{{ profile_app_stack_app_dir }}"
    create_home: true
    state: present

- name: Create application log directory
  ansible.builtin.file:
    path: "{{ profile_app_stack_log_dir }}" # noqa: R114 - path comes from trusted role defaults
    state: directory
    owner: "{{ profile_app_stack_app_user }}"
    group: "{{ profile_app_stack_app_group }}"
    mode: "0755"

- name: Deploy logrotate configuration
  ansible.builtin.template:
    src: logrotate.conf.j2
    dest: /etc/logrotate.d/{{ profile_app_stack_app_name }} # noqa: R114 - filename comes from trusted role defaults
    owner: root
    group: root
    mode: "0644"
    backup: true
