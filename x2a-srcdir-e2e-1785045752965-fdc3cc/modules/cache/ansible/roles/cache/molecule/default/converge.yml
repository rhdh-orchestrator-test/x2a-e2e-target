- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected Redis directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/run/redis
  - name: Create mock Redis configuration file
    ansible.builtin.copy:
      content: '# Redis configuration file example


        # Network configuration

        bind 127.0.0.1

        port 6379


        # General configuration

        daemonize yes

        pidfile /var/run/redis/redis-server.pid

        logfile /var/log/redis/redis-server.log

        dir /var/lib/redis


        # Memory management

        maxmemory-policy allkeys-lru

        '
      dest: /tmp/molecule_test/etc/redis/redis.conf
      mode: '0644'
  - name: Create mock Redis server log file
    ansible.builtin.copy:
      content: '1:M 01 Jan 2023 00:00:00.000 # Server initialized

        1:M 01 Jan 2023 00:00:00.000 * Ready to accept connections

        '
      dest: /tmp/molecule_test/var/log/redis/redis-server.log
      mode: '0644'
  - name: Create mock Redis server socket directory
    ansible.builtin.file:
      path: /tmp/molecule_test/var/run/redis
      state: directory
      mode: '0755'
  - name: Create mock Redis server socket file
    ansible.builtin.file:
      path: /tmp/molecule_test/var/run/redis/redis-server.sock
      state: touch
      mode: '0644'
