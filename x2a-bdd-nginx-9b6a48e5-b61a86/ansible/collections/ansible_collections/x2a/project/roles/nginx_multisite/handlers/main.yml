---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Reload nginx_multisite sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

- name: Restart nginx_multisite ssh
  ansible.builtin.service:
    name: ssh
    state: restarted
