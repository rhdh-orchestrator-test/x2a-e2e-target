---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install cache packages
  ansible.builtin.package:
    name:
      - "{{ cache_redis_package }}"
      - "{{ cache_memcached_package }}"
    state: present

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    recurse: true

- name: Ensure Redis configuration has the listen port
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    regexp: "^port\\s+"
    line: port {{ cache_redis_port }}
    create: true
    mode: "0640"
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    backup: true

- name: Configure Redis authentication # noqa: L039 - redis_password is validated by the prior credential validation task
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    regexp: "^requirepass\\s+"
    line: requirepass {{ redis_password }}
    create: true
    mode: "0640"
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    backup: true
  notify: Restart Redis
  no_log: "{{ cache_secure_logging }}"

- name: Check for the Redis configuration
  ansible.builtin.stat:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
  register: cache_redis_config_stat

- name: Remove obsolete replica directives from Redis configuration # noqa: L039 - cache_redis_config_stat is registered by the prior stat task
  ansible.builtin.replace:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    regexp: "{{ item_cache_directive }}.*$"
    replace: ""
    backup: true
  when: cache_redis_config_stat.stat.exists
  loop:
    - ^replica-serve-stale-data
    - ^replica-read-only
    - ^repl-ping-replica-period
    - ^client-output-buffer-limit
    - ^replica-priority
  loop_control:
    loop_var: item_cache_directive
  notify: Restart Redis

- name: Enable and start Redis
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    state: started
    enabled: true

- name: Enable and start Memcached
  ansible.builtin.service:
    name: "{{ cache_memcached_service }}"
    state: started
    enabled: true
