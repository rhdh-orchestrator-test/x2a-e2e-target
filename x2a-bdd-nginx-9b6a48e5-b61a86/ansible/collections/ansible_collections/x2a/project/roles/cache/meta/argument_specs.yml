---
argument_specs:
  main:
    short_description: Install and configure Redis and Memcached cache services
    description:
      - Installs Redis and Memcached, configures an authenticated Redis instance on port 6379, and manages its service state.
    options:
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Redis package name.
      cache_memcached_package:
        type: str
        required: false
        default: memcached
        description: Memcached package name.
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Redis service name.
      cache_memcached_service:
        type: str
        required: false
        default: memcached
        description: Memcached service name.
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: Redis system user.
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: Redis system group.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: Redis TCP port.
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      cache_redis_config_path:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration file path.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output when handling the Redis password.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
