---
- name: Restart Redis
  ansible.builtin.service:
    name: "{{ cache_redis_service_name }}"
    state: restarted

- name: Restart Memcached
  ansible.builtin.service:
    name: "{{ cache_memcached_service_name }}"
    state: restarted

- name: Reload Redis
  ansible.builtin.service:
    name: "{{ cache_redis_service_name }}"
    state: reloaded
