---
chef_automate_hostname: chef-automate.example.com
chef_automate_fqdn: "{{ chef_automate_hostname }}"
chef_server_fqdn: "{{ chef_automate_hostname }}"
chef_automate_install_dir: /opt/chef-automate
chef_server_install_dir: /opt/chef-server
chef_automate_version: latest
chef_automate_download_url: https://packages.chef.io/files/current/automate/latest/chef-automate_linux_amd64.zip
chef_server_download_url: https://packages.chef.io/files/stable/chef-server/14.0.65/ubuntu/18.04/chef-server-core_14.0.65-1_amd64.deb
chef_server_org_name: example-org
chef_server_org_full_name: Example Organization
chef_server_admin_user: admin
chef_server_admin_first_name: Admin
chef_server_admin_last_name: User
chef_server_admin_email: admin@example.com
chef_server_admin_password: "{{ lookup('env', 'CHEF_ADMIN_PASSWORD') | default('ChefAdminPassword') }}"
chef_server_user_key_path: /etc/chef/admin.pem
chef_server_org_key_path: /etc/chef/organization.pem
chef_automate_config:
  global:
    v1:
      fqdn: "{{ chef_automate_fqdn }}"
  license:
    acceptance: accept-no-persist
deploy_chef_server: true
configure_system: true
setup_users_and_orgs: true
chef_automate_cli_url: "{{ chef_automate_download_url }}"
chef_automate_cli_path: /usr/local/bin/chef-automate
chef_automate_deploy_automate: true
chef_automate_deploy_infra_server: "{{ deploy_chef_server }}"
chef_automate_accept_terms: true
