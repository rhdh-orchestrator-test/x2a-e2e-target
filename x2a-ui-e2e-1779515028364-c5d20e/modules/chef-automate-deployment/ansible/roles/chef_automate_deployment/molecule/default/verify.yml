- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check if required directories exist
    ansible.builtin.stat:
      path: '{{ item }}'
    register: dir_check
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/etc/chef-server
    - /tmp/molecule_test/opt/chef-automate
    - /tmp/molecule_test/opt/chef-server
    - /tmp/molecule_test/var/log/chef-automate
    - /tmp/molecule_test/var/log/chef-server/nginx
  - name: Assert directories exist
    ansible.builtin.assert:
      that:
      - item.stat.exists
      - item.stat.isdir
      fail_msg: Directory {{ item.item }} does not exist
      success_msg: Directory {{ item.item }} exists
    loop: '{{ dir_check.results }}'
  - name: Check if Chef Automate config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: config_file
  - name: Assert config file exists
    ansible.builtin.assert:
      that:
      - config_file.stat.exists
      - config_file.stat.size > 0
      fail_msg: Chef Automate config file not found
      success_msg: Chef Automate config file exists
  - name: Check if user key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/admin.pem
    register: user_key
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key.stat.exists
      - user_key.stat.size > 0
      - user_key.stat.mode == '0600'
      fail_msg: User key file not found or has incorrect permissions
      success_msg: User key file exists with correct permissions
  - name: Check if organization key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/example-org-validator.pem
    register: org_key
  - name: Assert organization key file exists
    ansible.builtin.assert:
      that:
      - org_key.stat.exists
      - org_key.stat.size > 0
      - org_key.stat.mode == '0600'
      fail_msg: Organization key file not found or has incorrect permissions
      success_msg: Organization key file exists with correct permissions
  - name: Check if log files exist
    ansible.builtin.stat:
      path: '{{ item }}'
    register: log_check
    loop:
    - /tmp/molecule_test/var/log/chef-server/nginx/access.log
    - /tmp/molecule_test/var/log/chef-server/nginx/error.log
    - /tmp/molecule_test/var/log/chef-automate/automate-deployment.log
  - name: Assert log files exist
    ansible.builtin.assert:
      that:
      - item.stat.exists
      - item.stat.size > 0
      fail_msg: Log file {{ item.item }} not found
      success_msg: Log file {{ item.item }} exists
    loop: '{{ log_check.results }}'
  - name: Check if Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/local/bin/chef-automate
    register: automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - automate_cli.stat.exists
      - automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check if Chef Server CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/chef-server-ctl
    register: server_cli
  - name: Assert Chef Server CLI exists and is executable
    ansible.builtin.assert:
      that:
      - server_cli.stat.exists
      - server_cli.stat.executable
      fail_msg: Chef Server CLI not found or not executable
      success_msg: Chef Server CLI exists and is executable
  - name: Check if service files exist
    ansible.builtin.stat:
      path: '{{ item }}'
    register: service_check
    loop:
    - /tmp/molecule_test/etc/systemd/system/chef-automate.service
    - /tmp/molecule_test/etc/systemd/system/chef-server.service
  - name: Assert service files exist
    ansible.builtin.assert:
      that:
      - item.stat.exists
      - item.stat.size > 0
      fail_msg: Service file {{ item.item }} not found
      success_msg: Service file {{ item.item }} exists
    loop: '{{ service_check.results }}'
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: /tmp/molecule_test/usr/local/bin/chef-automate status
    register: automate_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - '''running'' in automate_status.stdout'
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Server status
    ansible.builtin.command:
      cmd: /tmp/molecule_test/usr/bin/chef-server-ctl status
    register: server_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Server is running
    ansible.builtin.assert:
      that:
      - '''run'' in server_status.stdout'
      fail_msg: Chef Server is not running
      success_msg: Chef Server is running
    tags: molecule-notest
  - name: Check service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert services are active
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      - '''chef-server.service'' in ansible_facts.services'
      - ansible_facts.services['chef-automate.service'].state == 'running'
      - ansible_facts.services['chef-server.service'].state == 'running'
      fail_msg: Chef services are not running
      success_msg: Chef services are running
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
  - name: Check Chef Automate API access
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
      status_code: 200
    register: api_check
    tags: molecule-notest
  - name: Assert API is accessible
    ansible.builtin.assert:
      that:
      - api_check.status == 200
      fail_msg: Chef Automate API is not accessible
      success_msg: Chef Automate API is accessible
    tags: molecule-notest
