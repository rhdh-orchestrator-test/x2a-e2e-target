- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/etc/chef-server
    - /tmp/molecule_test/opt/chef-automate
    - /tmp/molecule_test/opt/chef-server
    - /tmp/molecule_test/var/log/chef-automate
    - /tmp/molecule_test/var/log/chef-server/nginx
    - /tmp/molecule_test/usr/local/bin
    - /tmp/molecule_test/usr/bin
    - /tmp/molecule_test/etc/systemd/system
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: '[global.v1]

        fqdn = "chef-automate.example.com"


        [license]

        acceptance = "accept-no-persist"

        '
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create mock user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAv8QZxdkGg9DmQ...

        (mock key content)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/etc/chef/admin.pem
      mode: '0600'
  - name: Create mock organization key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0FPPrHRK9DLO8...

        (mock key content)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/etc/chef/example-org-validator.pem
      mode: '0600'
  - name: Create mock access log
    ansible.builtin.copy:
      content: '192.168.1.100 - - [01/Jan/2023:12:00:00 +0000] "GET /api/v0/auth/version HTTP/1.1" 200 123 "-" "curl/7.68.0"

        '
      dest: /tmp/molecule_test/var/log/chef-server/nginx/access.log
      mode: '0644'
  - name: Create mock error log
    ansible.builtin.copy:
      content: '2023/01/01 12:00:00 [info] Server started

        '
      dest: /tmp/molecule_test/var/log/chef-server/nginx/error.log
      mode: '0644'
  - name: Create mock deployment log
    ansible.builtin.copy:
      content: '[2023-01-01T12:00:00Z] Deployment completed successfully

        '
      dest: /tmp/molecule_test/var/log/chef-automate/automate-deployment.log
      mode: '0644'
  - name: Create mock Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        echo "Deployment successful"

        exit 0

        '
      dest: /tmp/molecule_test/usr/local/bin/chef-automate
      mode: '0755'
  - name: Create mock Chef Server CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Server CLI mock"

        echo "Command executed successfully"

        exit 0

        '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create mock Chef Automate service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Automate


        [Service]

        ExecStart=/opt/chef-automate/bin/automate-ctl start


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      mode: '0644'
  - name: Create mock Chef Server service file
    ansible.builtin.copy:
      content: '[Unit]

        Description=Chef Infra Server


        [Service]

        ExecStart=/opt/chef-server/bin/chef-server-ctl start


        [Install]

        WantedBy=multi-user.target

        '
      dest: /tmp/molecule_test/etc/systemd/system/chef-server.service
      mode: '0644'
