---
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - chef_server_admin_user is defined
      - chef_server_admin_password is defined
      - chef_server_admin_first_name is defined
      - chef_server_admin_last_name is defined
      - chef_server_admin_email is defined
    fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template.
    quiet: true
