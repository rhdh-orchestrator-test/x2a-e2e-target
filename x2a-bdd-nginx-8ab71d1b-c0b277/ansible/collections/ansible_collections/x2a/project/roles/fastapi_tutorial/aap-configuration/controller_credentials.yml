---
controller_credentials:
  - name: PostgreSQL Database - fastapi_tutorial
    description: Credentials and connection settings for the FastAPI application's PostgreSQL database. The password is currently hardcoded in the Chef recipe 
      and must be moved to Ansible Vault or an approved external secret manager.
    organization: Default
    credential_type: PostgreSQL Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      database_name: "{{ database_name }}"
      database_host: "{{ database_host }}"
      database_port: "{{ database_port }}"
