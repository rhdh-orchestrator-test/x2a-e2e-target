---
argument_specs:
  main:
    short_description: Deploy and configure the FastAPI Tutorial application.
    description:
      - Installs the application and its PostgreSQL dependency.
      - Creates the database credentials and manages the FastAPI systemd service.
    options:
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks that handle the database password.
      db_username:
        type: str
        required: true
        description: PostgreSQL username injected by the AAP credential type.
      db_password:
        type: str
        required: true
        description: PostgreSQL password injected by the AAP credential type.
      database_name:
        type: str
        required: true
        description: PostgreSQL database name injected by the AAP credential type.
      database_host:
        type: str
        required: true
        description: PostgreSQL host injected by the AAP credential type.
      database_port:
        type: str
        required: true
        description: PostgreSQL port injected by the AAP credential type.
