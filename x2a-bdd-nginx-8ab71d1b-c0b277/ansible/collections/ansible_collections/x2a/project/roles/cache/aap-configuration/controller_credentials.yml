---
controller_credentials:
  - name: Redis Authentication - cache
    description: Password used to authenticate clients to the Redis instance on port 6379. The value is currently hardcoded in the Chef recipe and should be 
      migrated to protected Ansible/AAP secret storage.
    organization: Default
    credential_type: Redis Authentication
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
