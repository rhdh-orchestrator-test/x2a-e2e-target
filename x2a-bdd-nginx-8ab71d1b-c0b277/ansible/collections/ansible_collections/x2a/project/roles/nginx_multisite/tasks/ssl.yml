---
- name: Install TLS packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create SSL certificate group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_certificate_path }}" # noqa: R114 - fixed role default path
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}" # noqa: R114 - fixed role default path
    owner: root
    group: ssl-cert
    mode: "0710"
    state: directory

- name: Generate self-signed TLS certificates # noqa: R101 - command uses trusted role-default paths and site keys
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_multisite_private_key_path }}/{{ item_nginx_cert['key'] }}.key"
      - -out
      - "{{ nginx_multisite_certificate_path }}/{{ item_nginx_cert['key'] }}.crt"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_cert['key'] }}/emailAddress=admin@example.com
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_cert
  notify: Reload nginx
  args:
    creates: "{{ nginx_multisite_certificate_path }}/{{ item_nginx_cert['key'] }}.crt"

- name: Set TLS private key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_key_mode['key'] }}.key" # noqa: R114 - path from role-defined sites dictionary
    owner: root
    group: ssl-cert
    mode: "0640"
    state: file
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_key_mode
