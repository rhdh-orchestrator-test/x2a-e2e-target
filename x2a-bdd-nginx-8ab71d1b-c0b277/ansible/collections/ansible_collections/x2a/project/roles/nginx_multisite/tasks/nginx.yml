---
- name: Install Nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Add Nginx user to the certificate group
  ansible.builtin.user:
    name: "{{ nginx_multisite_web_user }}"
    groups: ssl-cert
    append: true
    state: present
  vars:
    nginx_multisite_web_user: "{{ 'www-data' if ansible_facts.os_family == 'Debian' else 'nginx' }}"

- name: Deploy Nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Deploy Nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dictionary
    owner: "{{ nginx_multisite_web_user }}"
    group: "{{ nginx_multisite_web_group }}"
    mode: "0755"
    state: directory
    recurse: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site
  vars:
    nginx_multisite_web_user: "{{ 'www-data' if ansible_facts.os_family == 'Debian' else 'nginx' }}"
    nginx_multisite_web_group: "{{ 'www-data' if ansible_facts.os_family == 'Debian' else 'nginx' }}"

- name: Deploy static site index files
  ansible.builtin.copy:
    src: "{{ item_nginx_site['key'].split('.')[0] }}/index.html"
    dest: "{{ item_nginx_site['value']['document_root'] }}/index.html" # noqa: R114 - destination from role-defined sites dictionary
    owner: "{{ nginx_multisite_web_user }}"
    group: "{{ nginx_multisite_web_group }}"
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site
  vars:
    nginx_multisite_web_user: "{{ 'www-data' if ansible_facts.os_family == 'Debian' else 'nginx' }}"
    nginx_multisite_web_group: "{{ 'www-data' if ansible_facts.os_family == 'Debian' else 'nginx' }}"
