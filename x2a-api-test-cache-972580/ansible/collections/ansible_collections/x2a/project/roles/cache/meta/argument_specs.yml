---
argument_specs:
  main:
    short_description: Configure a standalone Redis cache service
    description:
      - Installs and configures Redis through the eloy.redis collection.
      - Enables standalone Redis on TCP port 6379 with credential-backed authentication.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks that handle the Redis password.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for the Redis cache service.
      cache_redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis cluster mode is enabled.
      cache_redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis Sentinel mode is enabled.
      cache_redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis replication is enabled.
      cache_redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Whether Redis RDB persistence is enabled.
      cache_redis_aof_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis AOF persistence is enabled.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Directory used for Redis logs.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
