---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the FastAPI application's PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL user used by the FastAPI application; the plan specifies fastapi.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi user; currently hardcoded and should be stored in Ansible Vault.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the application; the plan specifies fastapi_db.
        - id: db_host
          type: string
          label: Database Host
          help_text: PostgreSQL connection host; the plan specifies localhost.
        - id: db_port
          type: string
          label: Database Port
          help_text: PostgreSQL connection port; the plan references the default port, normally 5432.
      required:
        - db_username
        - db_password
        - db_name
        - db_host
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_name: !unsafe "{{ db_name }}"
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
