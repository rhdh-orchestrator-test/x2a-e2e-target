---
# Unsupported: detailed status/journal output, UFW default policy, and standalone diagnostic output
# have no stated expected result; private-key stat output has no stated expected value.
- name: Verify nginx-multisite pre-flight checks
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        loop:
          - nginx
          - fail2ban
          - ufw
          - openssl
          - ca-certificates
        loop_control:
          loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are enabled and active
      ansible.builtin.assert:
        that:
          - item_service in ansible_facts['services']
          - ansible_facts['services'][item_service]['state'] == 'running'
          - ansible_facts['services'][item_service]['status'] == 'enabled'
        loop:
          - nginx.service
          - fail2ban.service
        loop_control:
          loop_var: item_service

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      failed_when: false
      register: nginx_config_test

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_config_test['rc'] == 0

    - name: Check expected files
      ansible.builtin.stat:
        path: "{{ item_path }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
        - /opt/server/test/index.html
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /opt/server/ci/index.html
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
        - /opt/server/status/index.html
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
      loop_control:
        loop_var: item_path
      register: deployment_files

    - name: Assert expected files exist
      ansible.builtin.assert:
        that:
          - item_file['stat']['exists']
        loop: "{{ deployment_files['results'] }}"
        loop_control:
          loop_var: item_file

    - name: Check default site
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert default site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_link['path'] }}"
        follow: false
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_link
      register: enabled_site_links

    - name: Assert enabled site links have expected targets
      ansible.builtin.assert:
        that:
          - item_link_result['stat']['islnk']
          - item_link_result['stat']['lnk_source'] == item_link_result['item']['target']
        loop: "{{ enabled_site_links['results'] }}"
        loop_control:
          loop_var: item_link_result

    - name: Validate certificate subjects and dates
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
          - -issuer
          - -dates
      changed_when: false
      failed_when: false
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          name: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          name: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          name: status.cluster.local
      loop_control:
        loop_var: item_certificate
      register: certificate_details

    - name: Assert certificates are valid and have expected subjects
      ansible.builtin.assert:
        that:
          - item_certificate_result['rc'] == 0
          - item_certificate_result['stdout'] is search('CN = ' ~ item_certificate_result['item']['name'])
        loop: "{{ certificate_details['results'] }}"
        loop_control:
          loop_var: item_certificate_result

    - name: Check HTTP endpoints
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_http['host'] }}"
        status_code: 200
        return_content: false
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_http

    - name: Check HTTPS endpoints
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_https['host'] }}"
        validate_certs: false
        status_code: 200
        return_content: false
      loop:
        - host: test.cluster.local
        - host: ci.cluster.local
        - host: status.cluster.local
      loop_control:
        loop_var: item_https

    - name: Validate fail2ban configuration
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - -t
      changed_when: false
      failed_when: false
      register: fail2ban_config_test

    - name: Assert fail2ban configuration is valid
      ansible.builtin.assert:
        that:
          - fail2ban_config_test['rc'] == 0

    - name: Check UFW rules
      ansible.builtin.command:
        argv:
          - ufw
          - status
      changed_when: false
      failed_when: false
      register: ufw_status

    - name: Assert UFW allows SSH HTTP and HTTPS
      ansible.builtin.assert:
        that:
          - ufw_status['rc'] == 0
          - ufw_status['stdout'] is search('22|ssh')
          - ufw_status['stdout'] is search('80|http')
          - ufw_status['stdout'] is search('443|https')

    - name: Read SSH configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: ssh_config

    - name: Assert SSH hardening settings
      ansible.builtin.assert:
        that:
          - (ssh_config['content'] | b64decode) is search('(?m)^[[:space:]]*PermitRootLogin[[:space:]]+no')
          - (ssh_config['content'] | b64decode) is search('(?m)^[[:space:]]*PasswordAuthentication[[:space:]]+no')

    - name: Validate sysctl security configuration
      ansible.builtin.command:
        argv:
          - sysctl
          - -p
          - /etc/sysctl.d/99-security.conf
      changed_when: false
      failed_when: false
      register: sysctl_validation

    - name: Assert sysctl security configuration is valid
      ansible.builtin.assert:
        that:
          - sysctl_validation['rc'] == 0

    - name: Check listening ports
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      changed_when: false
      failed_when: false
      register: listening_ports

    - name: Assert nginx HTTP and HTTPS ports are listening
      ansible.builtin.assert:
        that:
          - listening_ports['rc'] == 0
          - listening_ports['stdout'] is search(':80')
          - listening_ports['stdout'] is search(':443')

    - name: Check nginx processes
      ansible.builtin.command:
        argv:
          - ps
          - aux
      changed_when: false
      failed_when: false
      register: process_list

    - name: Assert nginx processes are present
      ansible.builtin.assert:
        that:
          - process_list['rc'] == 0
          - process_list['stdout'] is search('[n]ginx')
