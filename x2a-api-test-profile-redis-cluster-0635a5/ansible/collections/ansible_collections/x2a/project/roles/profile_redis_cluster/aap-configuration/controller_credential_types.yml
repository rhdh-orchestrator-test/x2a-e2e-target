---
controller_credential_types:
  - name: Redis Client Authentication
    description: Password used by Redis clients to authenticate to the default Redis instance.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis clients for authentication; migrate the current plain Hiera value to Ansible Vault or an approved external 
            secret provider.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
