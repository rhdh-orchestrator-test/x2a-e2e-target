---
controller_credential_types:
- name: Chef Admin User Credentials
  description: Credential type for Chef Admin User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Admin Username
      help_text: Username for the Chef Automate and Chef Infra Server admin user
    - id: password
      type: string
      label: Admin Password
      secret: true
      help_text: Password for the Chef Automate and Chef Infra Server admin user
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Chef Organization Configuration
  description: Credential type for Chef Organization Configuration
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Name of the Chef organization to create
    - id: org_description
      type: string
      label: Organization Description
      help_text: Description of the Chef organization
    required:
    - org_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_description: !unsafe '{{ org_description }}'
- name: Chef PEM Files
  description: Credential type for Chef PEM Files
  kind: cloud
  inputs:
    fields:
    - id: user_pem
      type: string
      label: Admin User PEM
      secret: true
      help_text: PEM file content for the admin user authentication
    - id: org_validator_pem
      type: string
      label: Organization Validator PEM
      secret: true
      help_text: PEM file content for the organization validator authentication
    required:
    - user_pem
    - org_validator_pem
  injectors:
    extra_vars:
      user_pem: !unsafe '{{ user_pem }}'
      org_validator_pem: !unsafe '{{ org_validator_pem }}'
- name: Chef License Agreement
  description: Credential type for Chef License Agreement
  kind: cloud
  inputs:
    fields:
    - id: accept_license
      type: boolean
      label: Accept License Agreement
      help_text: Acceptance of Chef's license agreement during deployment
    required:
    - accept_license
  injectors:
    extra_vars:
      accept_license: !unsafe '{{ accept_license }}'
