---
controller_credentials:
- name: Chef Admin User Credentials - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Admin User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Chef Organization Configuration - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Organization Configuration
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_description: '{{ org_description }}'
- name: Chef PEM Files - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef PEM Files
  update_secrets: true
  inputs:
    user_pem: '{{ vault_user_pem }}'
    org_validator_pem: '{{ vault_org_validator_pem }}'
- name: Chef License Agreement - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef License Agreement
  update_secrets: true
  inputs:
    accept_license: '{{ accept_license }}'
