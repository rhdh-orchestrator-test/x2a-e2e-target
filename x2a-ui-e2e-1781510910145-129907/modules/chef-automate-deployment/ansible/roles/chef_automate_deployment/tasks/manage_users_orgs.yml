---
- name: Ensure directories for PEM files exist
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_pem_path }}"
    - "{{ chef_automate_org_validator_pem_path }}"
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Fail if chef-server-ctl is not available
  ansible.builtin.fail:
    msg: chef-server-ctl command not found. Ensure Chef Infra Server is installed.
  when: chef_server_ctl_check.rc != 0
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ username }}  "{{ username | title }}"  {{ username }}@chef.lab  "{{ password }}"  --filename {{ chef_automate_user_pem_path
      }}

      '
    creates: "{{ chef_automate_user_pem_path }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ org_name }}  "{{ org_description }}"  --association_user {{ username }}  --filename {{ chef_automate_org_validator_pem_path
      }}

      '
    creates: "{{ chef_automate_org_validator_pem_path }}"
  become: true
- name: Store user PEM file content
  ansible.builtin.copy:
    content: "{{ user_pem }}"
    dest: "{{ chef_automate_user_pem_path }}"
    mode: "0600"
  when: user_pem is defined and user_pem | length > 0
- name: Store organization validator PEM file content
  ansible.builtin.copy:
    content: "{{ org_validator_pem }}"
    dest: "{{ chef_automate_org_validator_pem_path }}"
    mode: "0600"
  when: org_validator_pem is defined and org_validator_pem | length > 0
