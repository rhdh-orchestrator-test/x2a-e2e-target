---
controller_credential_types:
- name: Chef User Authentication
  description: Authentication credentials for Chef user account
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef user account username
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef user account authentication
    - id: email
      type: string
      label: Email
      help_text: Email address associated with Chef user account
    required:
    - username
    - password
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
- name: Chef Organization Configuration
  description: Configuration for Chef organization
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name for the Chef organization
    - id: validator_key
      type: string
      label: Validator Key
      secret: true
      help_text: Organization validator key for node authentication
    required:
    - org_name
    - org_full_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
      validator_key: !unsafe '{{ validator_key }}'
- name: Chef User Key
  description: PEM key file for Chef user authentication
  kind: cloud
  inputs:
    fields:
    - id: user_key
      type: string
      label: User Key
      secret: true
      help_text: PEM format private key for Chef user authentication
    - id: key_path
      type: string
      label: Key File Path
      help_text: Path where the user key file should be stored
    required:
    - user_key
  injectors:
    extra_vars:
      user_key: !unsafe '{{ user_key }}'
      key_path: !unsafe '{{ key_path }}'
