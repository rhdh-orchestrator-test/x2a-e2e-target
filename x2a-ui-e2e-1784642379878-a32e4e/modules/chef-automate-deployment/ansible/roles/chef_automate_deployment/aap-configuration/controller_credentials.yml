---
controller_credentials:
- name: Chef User Authentication - chef_automate_deployment
  description: Authentication credentials for Chef user account
  organization: Default
  credential_type: Chef User Authentication
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    email: '{{ email }}'
- name: Chef Organization Configuration - chef_automate_deployment
  description: Configuration for Chef organization
  organization: Default
  credential_type: Chef Organization Configuration
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
    validator_key: '{{ vault_validator_key }}'
- name: Chef User Key - chef_automate_deployment
  description: PEM key file for Chef user authentication
  organization: Default
  credential_type: Chef User Key
  update_secrets: true
  inputs:
    user_key: '{{ vault_user_key }}'
    key_path: '{{ key_path }}'
