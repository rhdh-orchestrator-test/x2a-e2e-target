- name: Verify
  hosts: all
  gather_facts: true
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file was created
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file was created
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Sysctl config file not found
      success_msg: Sysctl config file exists
  - name: Get sysctl file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      fail_msg: vm.max_map_count not set correctly
      success_msg: vm.max_map_count set correctly
    when: sysctl_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: vm.dirty_expire_centisecs not set correctly
      success_msg: vm.dirty_expire_centisecs set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI was downloaded
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate deployment directory exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert Chef Automate was deployed
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef Automate deployment directory not found
      success_msg: Chef Automate deployment directory exists
  - name: Check user key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/jtonello.pem
    register: user_key_file
  - name: Assert user key file was created
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.size > 0
      - user_key_file.stat.mode == "0600"
      fail_msg: User key file not found or has incorrect permissions
      success_msg: User key file exists with correct permissions
  - name: Check organization validator key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/lab-validator.pem
    register: org_key_file
  - name: Assert organization validator key file was created
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.size > 0
      - org_key_file.stat.mode == "0600"
      fail_msg: Organization validator key file not found or has incorrect permissions
      success_msg: Organization validator key file exists with correct permissions
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: chef_automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - chef_automate_status.rc == 0
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: chef_server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - chef_server_status.rc == 0
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Check Chef user list
    ansible.builtin.command:
      cmd: sudo chef-server-ctl user-list
    register: chef_user_list
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef user was created
    ansible.builtin.assert:
      that:
      - '''jtonello'' in chef_user_list.stdout'
      fail_msg: Chef user not found
      success_msg: Chef user exists
    tags: molecule-notest
  - name: Check Chef organization list
    ansible.builtin.command:
      cmd: sudo chef-server-ctl org-list
    register: chef_org_list
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef organization was created
    ansible.builtin.assert:
      that:
      - '''lab'' in chef_org_list.stdout'
      fail_msg: Chef organization not found
      success_msg: Chef organization exists
    tags: molecule-notest
  - name: Check web UI access
    ansible.builtin.uri:
      url: https://localhost
      validate_certs: false
      status_code: 200
    register: web_ui_access
    failed_when: false
    tags: molecule-notest
  - name: Assert web UI is accessible
    ansible.builtin.assert:
      that:
      - web_ui_access.status == 200
      fail_msg: Chef Automate web UI is not accessible
      success_msg: Chef Automate web UI is accessible
    tags: molecule-notest
  - name: Check API access
    ansible.builtin.uri:
      url: https://localhost/organizations/lab
      validate_certs: false
      status_code: 401
    register: api_access
    failed_when: false
    tags: molecule-notest
  - name: Assert API requires authentication
    ansible.builtin.assert:
      that:
      - api_access.status == 401
      fail_msg: Chef Infra Server API is not accessible
      success_msg: Chef Infra Server API is accessible and requires authentication
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is succeeded
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
