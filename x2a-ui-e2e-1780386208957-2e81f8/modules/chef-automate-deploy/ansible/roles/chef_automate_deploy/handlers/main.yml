---
- name: Restart Chef Automate
  ansible.builtin.command:
    cmd: sudo chef-automate restart
  changed_when: true
  listen: restart chef-automate
  when: ansible_facts.services is not defined or 'chef-automate' in ansible_facts.services
- name: Restart Chef Server
  ansible.builtin.command:
    cmd: sudo chef-server-ctl restart
  changed_when: true
  listen: restart chef-server
  when: ansible_facts.services is not defined or 'chef-server' in ansible_facts.services
