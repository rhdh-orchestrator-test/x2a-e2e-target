- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname configuration
    ansible.builtin.command:
      cmd: hostname
    register: hostname_result
    changed_when: false
    tags: molecule-notest
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - '''automate.chef.lab'' in hostname_result.stdout'
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    tags: molecule-notest
  - name: Check kernel parameters
    ansible.builtin.command:
      cmd: sysctl {{ item }}
    loop:
    - vm.max_map_count
    - vm.dirty_expire_centisecs
    register: sysctl_result
    changed_when: false
    tags: molecule-notest
  - name: Assert kernel parameters are set correctly
    ansible.builtin.assert:
      that:
      - '''262144'' in sysctl_result.results[0].stdout'
      - '''20000'' in sysctl_result.results[1].stdout'
      fail_msg: Kernel parameters not set correctly
      success_msg: Kernel parameters set correctly
    tags: molecule-notest
  - name: Check Chef Automate config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef-automate/config.toml
    register: automate_config
  - name: Assert Chef Automate config file exists
    ansible.builtin.assert:
      that:
      - automate_config.stat.exists
      - automate_config.stat.isreg
      fail_msg: Chef Automate config file not found
      success_msg: Chef Automate config file exists
  - name: Check Chef Server config directory exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/opscode
    register: opscode_dir
  - name: Assert Chef Server config directory exists
    ansible.builtin.assert:
      that:
      - opscode_dir.stat.exists
      - opscode_dir.stat.isdir
      fail_msg: Chef Server config directory not found
      success_msg: Chef Server config directory exists
  - name: Check Chef Server config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/opscode/chef-server.rb
    register: chef_server_config
  - name: Assert Chef Server config file exists
    ansible.builtin.assert:
      that:
      - chef_server_config.stat.exists
      - chef_server_config.stat.isreg
      fail_msg: Chef Server config file not found
      success_msg: Chef Server config file exists
  - name: Check user key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_key
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key.stat.exists
      - user_key.stat.isreg
      - user_key.stat.mode == '0600'
      fail_msg: User key file not found or has incorrect permissions
      success_msg: User key file exists with correct permissions
  - name: Check organization validator key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_key
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key.stat.exists
      - org_key.stat.isreg
      - org_key.stat.mode == '0600'
      fail_msg: Organization validator key file not found or has incorrect permissions
      success_msg: Organization validator key file exists with correct permissions
  - name: Check Chef Automate service status
    ansible.builtin.command:
      cmd: /tmp/molecule_test/tmp/chef-automate-status
    register: automate_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate service is running
    ansible.builtin.assert:
      that:
      - automate_status.rc == 0
      fail_msg: Chef Automate service is not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check Chef Server service status
    ansible.builtin.command:
      cmd: /tmp/molecule_test/tmp/chef-server-ctl status
    register: chef_server_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Server service is running
    ansible.builtin.assert:
      that:
      - chef_server_status.rc == 0
      fail_msg: Chef Server service is not running
      success_msg: Chef Server service is running
    tags: molecule-notest
  - name: Check Chef Automate API health
    ansible.builtin.uri:
      url: https://localhost/api/v0/health
      validate_certs: false
    register: automate_health
    tags: molecule-notest
  - name: Assert Chef Automate API is healthy
    ansible.builtin.assert:
      that:
      - automate_health.status == 200
      fail_msg: Chef Automate API is not healthy
      success_msg: Chef Automate API is healthy
    tags: molecule-notest
  - name: Check Chef Infra Server API health
    ansible.builtin.uri:
      url: https://localhost/organizations/lab/_ping
      validate_certs: false
    register: chef_server_health
    tags: molecule-notest
  - name: Assert Chef Infra Server API is healthy
    ansible.builtin.assert:
      that:
      - chef_server_health.status == 200
      fail_msg: Chef Infra Server API is not healthy
      success_msg: Chef Infra Server API is healthy
    tags: molecule-notest
  - name: Check user exists
    ansible.builtin.command:
      cmd: /tmp/molecule_test/tmp/chef-server-ctl user-list
    register: user_list
    changed_when: false
    tags: molecule-notest
  - name: Assert user exists
    ansible.builtin.assert:
      that:
      - '''jtonello'' in user_list.stdout'
      fail_msg: User not found
      success_msg: User exists
    tags: molecule-notest
  - name: Check organization exists
    ansible.builtin.command:
      cmd: /tmp/molecule_test/tmp/chef-server-ctl org-list
    register: org_list
    changed_when: false
    tags: molecule-notest
  - name: Assert organization exists
    ansible.builtin.assert:
      that:
      - '''lab'' in org_list.stdout'
      fail_msg: Organization not found
      success_msg: Organization exists
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      timeout: 5
    register: port_check
    ignore_errors: true
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is success
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
  - name: Check disk space for Chef Automate
    ansible.builtin.command:
      cmd: df -h /tmp/molecule_test/var/opt/chef-automate
    register: automate_disk
    changed_when: false
    tags: molecule-notest
  - name: Check disk space for Chef Server
    ansible.builtin.command:
      cmd: df -h /tmp/molecule_test/var/opt/opscode
    register: chef_server_disk
    changed_when: false
    tags: molecule-notest
