---
- name: Ensure directory for key files exists
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_key_file }}"
    - "{{ chef_automate_org_key_file }}"
  when: item | dirname != '.'
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl user-create {{ chef_automate_user_name }} {{ chef_automate_user_fullname }} {{ chef_automate_user_email }} "{{ chef_automate_user_password
      }}" --filename {{ chef_automate_user_key_file }}

      '
  args:
    creates: "{{ chef_automate_user_key_file }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'sudo chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_fullname }}" --association_user {{ chef_automate_user_name }} --filename
      {{ chef_automate_org_key_file }}

      '
  args:
    creates: "{{ chef_automate_org_key_file }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
