---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure system parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ chef_automate_sysctl_params | dict2items }}"
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Check if Chef Automate CLI exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: chef_automate_cli_stat
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate_linux_amd64.zip > {{ chef_automate_cli_path }} && chmod +x {{ chef_automate_cli_path }}
    creates: "{{ chef_automate_cli_path }}"
  when: not chef_automate_cli_stat.stat.exists
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: sudo {{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | ternary('true', 'false') }}
    creates: /etc/chef-automate/config.toml
  become: true
- name: Ensure directory exists for PEM files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_pem_path }}"
    - "{{ chef_automate_org_validator_pem_path }}"
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: sudo chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} {{ password }} --filename {{ chef_automate_user_pem_path }}
    creates: "{{ chef_automate_user_pem_path }}"
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: sudo chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_long_name }}" --association_user {{ username }} --filename {{
      chef_automate_org_validator_pem_path }}
    creates: "{{ chef_automate_org_validator_pem_path }}"
  become: true
