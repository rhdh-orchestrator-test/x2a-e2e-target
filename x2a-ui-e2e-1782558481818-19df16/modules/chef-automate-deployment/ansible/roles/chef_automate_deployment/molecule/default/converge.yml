---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    password: molecule_test_password
    email: jtonello@example.com
    full_name: John Tonello
    chef_automate_hostname: automate.chef.lab
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
    chef_automate_user_pem_path: /tmp/molecule_test/home/jtonello.pem
    chef_automate_org_name: lab
    chef_automate_org_validator_pem_path: /tmp/molecule_test/home/lab-validator.pem
    chef_automate_sysctl_params:
      vm.max_map_count: 262144
      vm.dirty_expire_centisecs: 20000

  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/home

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI Mock'"
        dest: "{{ chef_automate_cli_path }}"
        mode: "0755"

    # Simulate Chef Automate config file
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          [global]
            v1 = true
          [deployment]
            automate = true
            infra_server = true
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"

    # Simulate user PEM file
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          EXAMPLE_MOCK_PEM_CONTENT_FOR_USER
          -----END RSA PRIVATE KEY-----
        dest: "{{ chef_automate_user_pem_path }}"
        mode: "0600"

    # Simulate organization validator PEM file
    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          EXAMPLE_MOCK_PEM_CONTENT_FOR_ORG_VALIDATOR
          -----END RSA PRIVATE KEY-----
        dest: "{{ chef_automate_org_validator_pem_path }}"
        mode: "0600"