---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - gzip
      - unzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
  register: download_result
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
  args:
    creates: "{{ chef_automate_cli_path }}"
  when: download_result.changed
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
  when: download_result.changed
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }} "
  args:
    creates: /hab
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
  failed_when: deploy_result.rc != 0 and 'already deployed' not in deploy_result.stderr
