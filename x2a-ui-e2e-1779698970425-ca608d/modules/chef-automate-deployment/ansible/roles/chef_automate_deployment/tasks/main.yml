---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Configure system settings
  ansible.builtin.include_tasks: system_config.yml
  tags:
    - system
    - config
- name: Install and deploy Chef Automate with Chef Infra Server
  ansible.builtin.include_tasks: install_automate.yml
  when: chef_automate_deploy_automate | bool
  tags:
    - install
    - automate
- name: Install and deploy Chef Infra Server only
  ansible.builtin.include_tasks: install_chef_server.yml
  when: not chef_automate_deploy_automate | bool and chef_automate_deploy_infra_server | bool
  tags:
    - install
    - chef-server
- name: Set up Chef users and organizations
  ansible.builtin.include_tasks: setup_users_orgs.yml
  when: chef_automate_deploy_infra_server | bool
  tags:
    - setup
    - users
    - orgs
