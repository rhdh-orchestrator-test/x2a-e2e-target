---
- name: Restart Chef Automate
  ansible.builtin.command:
    cmd: chef-automate restart
  become: true
  listen: restart chef-automate
  register: restart_automate
  changed_when: restart_automate.rc == 0
  failed_when: restart_automate.rc != 0 and restart_automate.rc != 127
  when: ansible_facts.packages is defined and ('chef-automate' in ansible_facts.packages or ansible_facts.services is defined and 'chef-automate.service' in
    ansible_facts.services)
- name: Restart Chef Infra Server
  ansible.builtin.command:
    cmd: chef-server-ctl restart
  become: true
  listen: restart chef-server
  register: restart_server
  changed_when: restart_server.rc == 0
  failed_when: restart_server.rc != 0 and restart_server.rc != 127
  when: ansible_facts.packages is defined and ('chef-server-ctl' in ansible_facts.packages or ansible_facts.services is defined and 'chef-server.service' in
    ansible_facts.services)
