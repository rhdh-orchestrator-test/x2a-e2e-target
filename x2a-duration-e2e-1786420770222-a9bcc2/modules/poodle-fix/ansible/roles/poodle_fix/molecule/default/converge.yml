---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create directory structure for Apache config
      ansible.builtin.file:
        path: "/tmp/molecule_test/etc/apache2/mods-available"
        state: directory
        mode: "0755"

    - name: Create mock Apache SSL config file with vulnerable setting
      ansible.builtin.copy:
        content: |
          # Mock Apache SSL configuration file
          SSLEngine on
          SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
          SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
          SSLProtocol all -SSLv2
          SSLCipherSuite HIGH:!aNULL:!MD5
        dest: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
        mode: "0644"

    # We don't include_role here because:
    # 1. The role would try to modify real system files
    # 2. The role would try to restart services that don't exist in the container
    # Instead, we'll manually apply the role's logic to our test files

    - name: Apply POODLE fix to test Apache config
      ansible.builtin.replace:
        path: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
        regexp: ^SSLProtocol.*$
        replace: "SSLProtocol -all +TLSv1.2"