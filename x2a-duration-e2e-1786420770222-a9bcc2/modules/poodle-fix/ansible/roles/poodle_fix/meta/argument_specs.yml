---
argument_specs:
  main:
    short_description: Role to mitigate POODLE vulnerability in Apache
    description: "This role updates Apache SSL configuration to disable vulnerable SSL protocols and enable only TLSv1.2 to mitigate the POODLE vulnerability.\n"
    author: X2A Migration Tool
    options:
      apache_config_path:
        type: str
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file
      ssl_protocol_setting:
        type: str
        default: -all +TLSv1.2
        description: SSL protocol configuration string
      restart_apache:
        type: bool
        default: true
        description: Whether to restart Apache after configuration change
      restart_ssh:
        type: bool
        default: true
        description: Whether to restart SSH after configuration change
