---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check SSL configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_conf_file

    - name: Assert SSL configuration file exists
      ansible.builtin.assert:
        that:
          - ssl_conf_file.stat.exists
          - ssl_conf_file.stat.isreg
        fail_msg: "SSL configuration file not found"
        success_msg: "SSL configuration file exists"

    - name: Get SSL configuration file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_conf_content
      when: ssl_conf_file.stat.exists

    - name: Assert SSL protocol is properly configured
      ansible.builtin.assert:
        that:
          - ssl_conf_content.content | b64decode | regex_search('SSLProtocol -all \+TLSv1\.2')
        fail_msg: "SSL configuration does not have the correct protocol settings"
        success_msg: "SSL configuration has the correct protocol settings"
      when: ssl_conf_file.stat.exists

    # The following checks would be performed on a real system but can't run in the container
    # They are tagged with molecule-notest so they won't be executed during molecule testing

    - name: Verify Apache is installed
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service exists
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
        fail_msg: "Apache service not found"
        success_msg: "Apache service exists"
      tags: molecule-notest

    - name: Verify SSH is installed
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert SSH service exists
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
        fail_msg: "SSH service not found"
        success_msg: "SSH service exists"
      tags: molecule-notest

    - name: Validate Apache configuration
      ansible.builtin.command: apache2ctl configtest
      register: apache_configtest
      changed_when: false
      failed_when: apache_configtest.rc != 0
      tags: molecule-notest

    - name: Test TLS 1.2 connectivity
      ansible.builtin.command: openssl s_client -connect localhost:443 -tls1_2
      register: tls_test
      changed_when: false
      failed_when: tls_test.rc != 0
      tags: molecule-notest