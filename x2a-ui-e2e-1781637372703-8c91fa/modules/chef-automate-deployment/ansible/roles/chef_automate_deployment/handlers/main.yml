---
- name: Check if chef-server-ctl exists
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl_exists
  become: true
  listen: restart chef services
- name: Restart chef-server
  ansible.builtin.command:
    cmd: chef-server-ctl restart
  become: true
  listen: restart chef services
  changed_when: true
  when: chef_server_ctl_exists.stat.exists
- name: Check if chef-automate exists
  ansible.builtin.stat:
    path: /usr/bin/chef-automate
  register: chef_automate_exists
  become: true
  listen: restart chef services
- name: Restart chef-automate
  ansible.builtin.command:
    cmd: chef-automate restart
  become: true
  listen: restart chef services
  changed_when: true
  when: chef_automate_exists.stat.exists
