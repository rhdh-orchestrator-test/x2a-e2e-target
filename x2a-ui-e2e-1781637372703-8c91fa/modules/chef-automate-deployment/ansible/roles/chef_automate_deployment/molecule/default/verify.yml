---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    organization_name: lab
  tasks:
    # System configuration checks
    - name: Check hostname configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found or empty"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is correctly set
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set to automate.chef.lab"
        success_msg: "Hostname correctly set to automate.chef.lab"
      when: hostname_file.stat.exists

    # Sysctl configuration checks
    - name: Check sysctl configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Sysctl configuration file not found or empty"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are correctly set
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count=262144' in (sysctl_content.content | b64decode)"
          - "'vm.dirty_expire_centisecs=20000' in (sysctl_content.content | b64decode)"
        fail_msg: "Sysctl parameters not correctly set"
        success_msg: "Sysctl parameters correctly set"
      when: sysctl_file.stat.exists

    # Chef Automate CLI checks
    - name: Check Chef Automate CLI
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Server configuration checks
    - name: Check Chef Server configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server/chef-server.rb
      register: chef_server_config

    - name: Assert Chef Server configuration exists
      ansible.builtin.assert:
        that:
          - chef_server_config.stat.exists
          - chef_server_config.stat.size > 0
        fail_msg: "Chef Server configuration not found or empty"
        success_msg: "Chef Server configuration exists"

    # User and organization key checks
    - name: Check user key file
      ansible.builtin.stat:
        path: "/tmp/molecule_test/home/{{ username }}/{{ username }}.pem"
      register: user_key

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key.stat.exists
          - user_key.stat.size > 0
        fail_msg: "User key file not found or empty"
        success_msg: "User key file exists"

    - name: Check organization validator key file
      ansible.builtin.stat:
        path: "/tmp/molecule_test/home/{{ username }}/{{ organization_name }}-validator.pem"
      register: org_key

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_key.stat.exists
          - org_key.stat.size > 0
        fail_msg: "Organization validator key file not found or empty"
        success_msg: "Organization validator key file exists"

    # Log file checks
    - name: Check Chef Server access log
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/chef-server/nginx/access.log
      register: access_log

    - name: Assert access log exists
      ansible.builtin.assert:
        that:
          - access_log.stat.exists
        fail_msg: "Chef Server access log not found"
        success_msg: "Chef Server access log exists"

    # Service status checks (tagged for skipping in container)
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: chef_automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server is not running"
        success_msg: "Chef Infra Server is running"
      tags: molecule-notest

    # User and organization verification (tagged for skipping in container)
    - name: Check Chef user exists
      ansible.builtin.command:
        cmd: sudo chef-server-ctl user-list
      register: chef_user_list
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef user exists
      ansible.builtin.assert:
        that:
          - username in chef_user_list.stdout
        fail_msg: "Chef user not found"
        success_msg: "Chef user exists"
      tags: molecule-notest

    - name: Check Chef organization exists
      ansible.builtin.command:
        cmd: sudo chef-server-ctl org-list
      register: chef_org_list
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef organization exists
      ansible.builtin.assert:
        that:
          - organization_name in chef_org_list.stdout
        fail_msg: "Chef organization not found"
        success_msg: "Chef organization exists"
      tags: molecule-notest

    # Network listening checks (tagged for skipping in container)
    - name: Check HTTPS port is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: https_port
      failed_when: false
      tags: molecule-notest

    - name: Assert HTTPS port is listening
      ansible.builtin.assert:
        that:
          - https_port is succeeded
        fail_msg: "HTTPS port 443 is not listening"
        success_msg: "HTTPS port 443 is listening"
      tags: molecule-notest

    # Web UI access checks (tagged for skipping in container)
    - name: Check Chef Automate API status
      ansible.builtin.uri:
        url: https://localhost/api/_status
        validate_certs: false
        status_code: 200
      register: api_status
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate API is accessible
      ansible.builtin.assert:
        that:
          - api_status is succeeded
        fail_msg: "Chef Automate API is not accessible"
        success_msg: "Chef Automate API is accessible"
      tags: molecule-notest

    - name: Check Chef Server organization API
      ansible.builtin.uri:
        url: "https://localhost/organizations/{{ organization_name }}"
        validate_certs: false
        status_code: 200
      register: org_api
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Server organization API is accessible
      ansible.builtin.assert:
        that:
          - org_api is succeeded
        fail_msg: "Chef Server organization API is not accessible"
        success_msg: "Chef Server organization API is accessible"
      tags: molecule-notest