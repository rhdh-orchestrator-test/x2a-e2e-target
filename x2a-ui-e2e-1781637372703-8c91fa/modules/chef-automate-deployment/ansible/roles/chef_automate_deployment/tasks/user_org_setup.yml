---
- name: Check if Chef Server is installed
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_installed
  become: true
- name: Fail if Chef Server is not installed
  ansible.builtin.fail:
    msg: Chef Server is not installed. Please deploy Chef Server before running user and organization setup.
  when: not chef_server_installed.stat.exists
- name: Ensure key file directory exists
  ansible.builtin.file:
    path: "{{ chef_automate_user_key_path | dirname }}"
    state: directory
    mode: "0755"
  become: true
  when: chef_automate_user_key_path is not match("^/home/.*")
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} "{{ username | capitalize }}" {{ username }}@chef.lab "{{ password }}" --filename {{ chef_automate_user_key_path
      }}

      '
  become: true
  args:
    creates: "{{ chef_automate_user_key_path }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  failed_when: chef_user_create.rc != 0 and 'already exists' not in chef_user_create.stderr
- name: Create Chef organization and associate admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ organization_name }} "Chef {{ organization_name | capitalize }}" --association_user {{ username }} --filename {{ chef_automate_org_key_path
      }}

      '
  become: true
  args:
    creates: "{{ chef_automate_org_key_path }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
  failed_when: chef_org_create.rc != 0 and 'already exists' not in chef_org_create.stderr
