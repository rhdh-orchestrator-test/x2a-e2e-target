---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Set system configuration
  ansible.builtin.include_tasks: system_config.yml
- name: Install Chef Automate CLI
  ansible.builtin.include_tasks: install_cli.yml
- name: Deploy Chef Automate products
  ansible.builtin.include_tasks: deploy_products.yml
  when: "'automate' in chef_automate_products"
- name: Set up Chef users and organizations
  ansible.builtin.include_tasks: setup_users_orgs.yml
