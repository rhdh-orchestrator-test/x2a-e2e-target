---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_os_family == "Debian"
- name: Install required packages
  ansible.builtin.package:
    name: "{{ chef_automate_required_packages }}"
    state: present
  become: true
- name: Configure system settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - key: vm.max_map_count
      value: "262144"
    - key: vm.dirty_expire_centisecs
      value: "20000"
  become: true
- name: Ensure Chef Automate directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  loop:
    - "{{ chef_automate_install_dir }}"
    - "{{ chef_automate_config_dir }}"
  become: true
