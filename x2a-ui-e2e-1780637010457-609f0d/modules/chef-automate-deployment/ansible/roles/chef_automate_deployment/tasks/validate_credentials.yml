---
- name: Ensure required credential variables are defined
  ansible.builtin.assert:
    that:
      - username is defined
      - password is defined
      - email is defined
      - full_name is defined
      - org_name is defined
      - org_full_name is defined
    fail_msg: Missing required credential variables. Please ensure all required variables are defined.
    success_msg: All required credential variables are defined.
- name: Ensure credential paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: root
    group: root
  loop:
    - "{{ chef_automate_user_key_path }}"
    - "{{ chef_automate_org_key_path }}"
  become: true
