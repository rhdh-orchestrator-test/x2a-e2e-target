---
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: /tmp/chef-automate
chef_automate_force_cli_download: false
chef_automate_install_dir: /opt/chef-automate
chef_automate_config_dir: /etc/chef-automate
chef_automate_user_key_path: /etc/chef/users
chef_automate_org_key_path: /etc/chef/organizations
chef_automate_products:
  - automate
  - infra-server
chef_automate_required_packages:
  - curl
  - unzip
  - jq
  - sysstat
  - net-tools
chef_automate_accept_terms_and_mlsa: true
chef_automate_config_options: []
