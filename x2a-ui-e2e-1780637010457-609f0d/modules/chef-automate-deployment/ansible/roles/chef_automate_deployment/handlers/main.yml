---
- name: Restart Chef Automate services
  ansible.builtin.shell:
    cmd: sudo chef-automate status && sudo chef-automate restart-services
  become: true
  listen: restart chef-automate
  changed_when: true
- name: Restart Chef Server services
  ansible.builtin.shell:
    cmd: sudo chef-server-ctl status && sudo chef-server-ctl restart
  become: true
  listen: restart chef-server
  changed_when: true
