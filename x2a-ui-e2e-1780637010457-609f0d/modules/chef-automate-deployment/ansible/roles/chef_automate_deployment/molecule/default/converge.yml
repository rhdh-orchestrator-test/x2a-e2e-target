- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/opt/chef-automate
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/chef/users
    - /tmp/molecule_test/etc/chef/organizations
    - /tmp/molecule_test/tmp
  - name: Create mock Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock version 1.0.0"

        echo "This is a mock file for molecule testing"

        '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create mock Chef Automate config file
    ansible.builtin.copy:
      content: '# Mock Chef Automate config file

        [global]

        fqdn = "automate.chef.lab"


        [deployment]

        products = ["automate", "infra-server"]

        '
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create mock user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAv8MoCXQYJ6AKCBeEcXLJSKJEXcTAB9jIQhkUMCXSCpgKSzQm

        MOCK_KEY_CONTENT_FOR_TESTING_ONLY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/etc/chef/users/jtonello.pem
      mode: '0600'
  - name: Create mock organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAv8MoCXQYJ6AKCBeEcXLJSKJEXcTAB9jIQhkUMCXSCpgKSzQm

        MOCK_ORG_KEY_CONTENT_FOR_TESTING_ONLY

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/etc/chef/organizations/lab-validator.pem
      mode: '0600'
  - name: Create mock hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create mock sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
