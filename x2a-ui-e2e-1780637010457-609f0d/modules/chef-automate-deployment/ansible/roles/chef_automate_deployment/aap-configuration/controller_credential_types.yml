---
controller_credential_types:
- name: Chef User Credentials
  description: Credential type for Chef User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for the initial Chef user account
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the initial Chef user account
    - id: email
      type: string
      label: Email
      help_text: Email address for the Chef user account
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name for the Chef user account
    required:
    - username
    - password
    - email
    - full_name
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
      full_name: !unsafe '{{ full_name }}'
- name: Chef Organization Configuration
  description: Credential type for Chef Organization Configuration
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Short Name
      help_text: Short name identifier for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name for the Chef organization
    required:
    - org_name
    - org_full_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
- name: Chef User Key File
  description: Credential type for Chef User Key File
  kind: cloud
  inputs:
    fields:
    - id: user_key_path
      type: string
      label: User Key File Path
      help_text: Path where the user's private key file will be stored
    - id: user_key_content
      type: string
      label: User Key Content
      secret: true
      help_text: RSA private key content for Chef user authentication
    required:
    - user_key_path
    - user_key_content
  injectors:
    extra_vars:
      user_key_path: !unsafe '{{ user_key_path }}'
      user_key_content: !unsafe '{{ user_key_content }}'
- name: Chef Organization Validator Key
  description: Credential type for Chef Organization Validator Key
  kind: cloud
  inputs:
    fields:
    - id: org_key_path
      type: string
      label: Organization Key File Path
      help_text: Path where the organization validator key file will be stored
    - id: org_key_content
      type: string
      label: Organization Key Content
      secret: true
      help_text: RSA private key content for Chef organization validation
    required:
    - org_key_path
    - org_key_content
  injectors:
    extra_vars:
      org_key_path: !unsafe '{{ org_key_path }}'
      org_key_content: !unsafe '{{ org_key_content }}'
