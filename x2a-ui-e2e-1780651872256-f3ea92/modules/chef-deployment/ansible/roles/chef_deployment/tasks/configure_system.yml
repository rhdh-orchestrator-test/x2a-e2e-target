---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_hostname }}"
  register: hostname_changed
- name: Update /etc/hosts with new hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ^127.0.0.1\s+{{ chef_hostname }}$
    line: 127.0.0.1 {{ chef_hostname }}
    state: present
  when: hostname_changed is changed
- name: Configure kernel parameters for Chef Automate
  community.general.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ chef_sysctl_settings | dict2items }}"
