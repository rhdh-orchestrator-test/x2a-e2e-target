---
- name: Ensure chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  check_mode: false
- name: Fail if chef-server-ctl is not available
  ansible.builtin.fail:
    msg: chef-server-ctl command not found. Ensure Chef Infra Server is properly installed.
  when: chef_server_ctl_check.rc != 0
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item.path | dirname }}"
    state: directory
    mode: "0750"
  loop:
    - path: "{{ chef_user_key_file }}"
    - path: "{{ chef_org_key_file }}"
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create  {{ chef_username }}  {{ chef_user_fullname | quote }}  {{ chef_user_email | quote }}  {{ user_password | quote }}
      --filename {{ chef_user_key_file }}
    creates: "{{ chef_user_key_file }}"
  register: user_create_result
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create  {{ chef_org_name }}  {{ chef_org_fullname | quote }}  --association_user {{ chef_username }}  --filename {{
      chef_org_key_file }}
    creates: "{{ chef_org_key_file }}"
  register: org_create_result
  become: true
- name: Display user creation result
  ansible.builtin.debug:
    msg: Chef user {{ chef_username }} created successfully
  when: user_create_result is changed
- name: Display organization creation result
  ansible.builtin.debug:
    msg: Chef organization {{ chef_org_name }} created successfully
  when: org_create_result is changed
