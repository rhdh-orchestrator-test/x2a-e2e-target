---
- name: Ensure gzip is installed
  ansible.builtin.package:
    name: gzip
    state: present
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
  register: download_result
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: /tmp/chef-automate_linux_amd64.zip
    dest: "{{ chef_automate_cli_path | dirname }}"
    remote_src: true
    extra_opts:
      - --transform
      - s/chef-automate/{{ chef_automate_cli_path | basename }}/
    creates: "{{ chef_automate_cli_path }}"
  when: download_result is changed
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
  when: download_result is changed
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_accept_terms_and_mlsa | lower }}"
    creates: /hab
  register: deploy_result
  become: true
- name: Display Chef Infra Server deployment result
  ansible.builtin.debug:
    var: deploy_result.stdout_lines
  when: deploy_result is changed
