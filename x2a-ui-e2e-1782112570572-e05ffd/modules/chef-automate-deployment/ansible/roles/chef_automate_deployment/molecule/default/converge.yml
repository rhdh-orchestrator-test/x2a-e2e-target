---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure to simulate Chef Automate installation
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/chef-server
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/chef-server
        - /tmp/molecule_test/etc/hostname

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate Chef Automate config file
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          [global]
            v1 = true
          [deployment]
            products = ["automate", "infra-server"]
        dest: "/tmp/molecule_test/etc/chef-automate/config.toml"
        mode: "0644"

    # Simulate Chef Server config file
    - name: Create Chef Server config file
      ansible.builtin.copy:
        content: |
          topology "standalone"
          api_fqdn "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/chef-server/chef-server.rb"
        mode: "0644"

    # Simulate Chef Automate CLI binary
    - name: Create Chef Automate CLI binary
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI'"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/jtonello.pem"
        mode: "0600"

    # Simulate organization validator key file
    - name: Create organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/lab-validator.pem"
        mode: "0600"

    # Simulate sysctl settings
    - name: Create sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"