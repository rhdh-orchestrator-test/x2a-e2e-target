---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - unzip
      - curl
    state: present
  become: true
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}{{ chef_automate_cli_binary }}"
  register: chef_automate_cli_stat
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}{{ chef_automate_cli_binary }}.zip"
    mode: "0644"
  notify: Extract Chef Automate CLI
  when: not chef_automate_cli_stat.stat.exists
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}{{ chef_automate_cli_binary }}"
    mode: "0755"
    state: file
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: ./{{ chef_automate_cli_binary }} deploy --product {{ chef_automate_products | join(' --product ') }} --accept-terms-and-mlsa={{
      chef_automate_accept_terms | lower }}
  become: true
  args:
    chdir: "{{ chef_automate_cli_path }}"
    creates: /etc/chef-automate/config.toml
