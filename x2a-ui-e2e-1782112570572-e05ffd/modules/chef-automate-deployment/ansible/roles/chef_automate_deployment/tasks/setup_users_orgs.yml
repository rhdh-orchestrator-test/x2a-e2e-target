---
- name: Check if chef-server-ctl is available
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl_stat
  become: true
- name: Fail if chef-server-ctl is not available
  ansible.builtin.fail:
    msg: chef-server-ctl command not found. Ensure Chef Infra Server is installed.
  when: not chef_server_ctl_stat.stat.exists
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}"  --filename {{ chef_automate_user_key_filename }}
  become: true
  args:
    creates: "{{ chef_automate_user_key_filename }}"
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_full_name }}"  --association_user {{ username }} --filename {{
      chef_automate_org_validator_filename }}
  become: true
  args:
    creates: "{{ chef_automate_org_validator_filename }}"
