---
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_binary }}
    stdin: "{{ chef_automate_cli_path }}{{ chef_automate_cli_binary }}.zip"
    creates: "{{ chef_automate_cli_path }}{{ chef_automate_cli_binary }}"
  args:
    chdir: "{{ chef_automate_cli_path }}"
