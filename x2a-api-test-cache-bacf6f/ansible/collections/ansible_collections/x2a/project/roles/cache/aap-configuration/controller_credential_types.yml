---
controller_credential_types:
  - name: Redis Authentication
    description: Credential for authenticating clients to the Redis instance configured on port 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis AUTH for clients connecting to the Redis instance on port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
