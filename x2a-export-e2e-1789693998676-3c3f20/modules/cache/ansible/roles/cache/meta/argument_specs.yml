---
argument_specs:
  main:
    short_description: Configure dual caching services - memcached and Redis
    description:
      - Installs and configures Redis server with authentication on port 6379
      - Installs and configures Memcached service on default port 11211
      - Creates Redis log directory with proper ownership
      - Removes replica-related configuration settings from Redis config
      - Starts and enables both caching services
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for Redis server to listen on
      cache_redis_password:
        type: str
        required: true
        description: Redis authentication password (injected by AAP credential type)
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory path for Redis log files
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to Redis configuration file
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: System user for Redis service
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: System group for Redis service
      cache_memcached_enabled:
        type: bool
        required: false
        default: true
        description: Whether to enable Memcached service
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: TCP port for Memcached service to listen on
      cache_redis_replica_settings_to_remove:
        type: list
        elements: str
        required: false
        default:
          - replica-serve-stale-data
          - replica-read-only
          - repl-ping-replica-period
          - client-output-buffer-limit
          - replica-priority
        description: List of Redis replica configuration settings to remove from config file
