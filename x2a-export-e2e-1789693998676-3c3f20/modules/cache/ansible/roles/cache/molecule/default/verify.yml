- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check Redis and Memcached services are running
    ansible.builtin.service_facts: null
  - name: Assert Redis service is active
    ansible.builtin.assert:
      that:
      - '''redis.service'' in ansible_facts.services'
      - ansible_facts.services['redis.service']['state'] == 'running'
      fail_msg: Redis service is not running
  - name: Assert Memcached service is active
    ansible.builtin.assert:
      that:
      - '''memcached.service'' in ansible_facts.services'
      - ansible_facts.services['memcached.service']['state'] == 'running'
      fail_msg: Memcached service is not running
  - name: Check Redis configuration file exists
    ansible.builtin.stat:
      path: /etc/redis/6379.conf
    register: redis_config_stat
  - name: Assert Redis configuration file exists
    ansible.builtin.assert:
      that:
      - redis_config_stat['stat']['exists']
      - redis_config_stat['stat']['size'] > 0
      fail_msg: Redis configuration file not found
  - name: Check Redis log directory exists
    ansible.builtin.stat:
      path: /var/log/redis
    register: redis_log_dir_stat
  - name: Assert Redis log directory exists with correct permissions
    ansible.builtin.assert:
      that:
      - redis_log_dir_stat['stat']['exists']
      - redis_log_dir_stat['stat']['isdir']
      - redis_log_dir_stat['stat']['mode'] == '0755'
      fail_msg: Redis log directory not found or incorrect permissions
  - name: Read Redis configuration file
    ansible.builtin.slurp:
      src: /etc/redis/6379.conf
    register: redis_config_content
  - name: Assert Redis configuration contains required settings
    ansible.builtin.assert:
      that:
      - '''requirepass'' in redis_config_content[''content''] | b64decode'
      - '''port 6379'' in redis_config_content[''content''] | b64decode'
      fail_msg: Redis configuration missing required settings
  - name: Assert Redis replica settings are removed
    ansible.builtin.assert:
      that:
      - '''replica-serve-stale-data'' not in redis_config_content[''content''] | b64decode'
      - '''replica-read-only'' not in redis_config_content[''content''] | b64decode'
      - '''repl-ping-replica-period'' not in redis_config_content[''content''] | b64decode'
      - '''client-output-buffer-limit'' not in redis_config_content[''content''] | b64decode'
      - '''replica-priority'' not in redis_config_content[''content''] | b64decode'
      fail_msg: Redis replica settings not properly removed
  - name: Check Redis port is listening
    ansible.builtin.wait_for:
      port: 6379
      host: localhost
      timeout: 10
  - name: Check Memcached port is listening
    ansible.builtin.wait_for:
      port: 11211
      host: localhost
      timeout: 10
  - name: Test Redis connectivity without authentication
    ansible.builtin.command:
      cmd: redis-cli -p 6379 ping
    register: redis_ping_noauth
    failed_when: false
    changed_when: false
  - name: Assert Redis requires authentication
    ansible.builtin.assert:
      that:
      - redis_ping_noauth['rc'] != 0
      fail_msg: Redis should require authentication but does not
  - name: Test Redis connectivity with authentication
    ansible.builtin.command:
      cmd: redis-cli -p 6379 -a test_password_123 ping
    register: redis_ping_auth
    changed_when: false
    no_log: true
  - name: Assert Redis responds with authentication
    ansible.builtin.assert:
      that:
      - redis_ping_auth['rc'] == 0
      - '''PONG'' in redis_ping_auth[''stdout'']'
      fail_msg: Redis authentication failed
  - name: Test Memcached connectivity
    ansible.builtin.command:
      cmd: echo "stats" | nc localhost 11211
    register: memcached_stats
    changed_when: false
  - name: Assert Memcached is responding
    ansible.builtin.assert:
      that:
      - memcached_stats['rc'] == 0
      - '''STAT'' in memcached_stats[''stdout'']'
      fail_msg: Memcached is not responding properly
