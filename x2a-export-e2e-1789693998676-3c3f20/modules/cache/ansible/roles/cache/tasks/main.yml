---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Install Redis and Memcached packages
  ansible.builtin.package:
    name:
      - redis-server
      - memcached
    state: present
- name: Ensure Redis group exists
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    system: true
    state: present
- name: Ensure Redis user exists
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present
- name: Ensure Redis configuration directory exists
  ansible.builtin.file:
    path: "{{ cache_redis_config_file | dirname }}"
    state: directory
    mode: "0755"
- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}"
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory
    recurse: true
- name: Configure Redis server
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}"
    regexp: ^port
    line: port {{ cache_redis_port }}
    backup: true
    create: true
    mode: "0644"
  notify: Restart Redis
- name: Configure Redis authentication
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}"
    regexp: ^requirepass
    line: requirepass {{ cache_redis_password }}
    backup: true
    create: true
    mode: "0644"
  notify: Restart Redis
- name: Remove Redis replica configuration settings
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}"
    regexp: ^{{ item_replica_setting }}.*$
    state: absent
    backup: true
  loop: "{{ cache_redis_replica_settings_to_remove }}"
  loop_control:
    loop_var: item_replica_setting
  notify: Restart Redis
- name: Start and enable Redis service
  ansible.builtin.service:
    name: redis
    state: started
    enabled: true
- name: Start and enable Memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
