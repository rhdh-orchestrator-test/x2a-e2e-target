- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname | default(''automate.chef.lab'') }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl configuration file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI'''
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "[global]\n  v1 = true\n[deployment]\n  products = [\"automate\", \"infra-server\"]\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA...

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_automate_userfilename | default('admin.pem') }}
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA...

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_automate_orgfilename | default('lab-validator.pem') }}
      mode: '0600'
  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_username: admin
    chef_automate_userfilename: admin.pem
    chef_automate_orgname: lab
    chef_automate_orgfilename: lab-validator.pem
