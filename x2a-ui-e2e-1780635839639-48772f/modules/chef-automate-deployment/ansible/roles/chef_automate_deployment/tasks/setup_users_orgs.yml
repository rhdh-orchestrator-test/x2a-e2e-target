---
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}"  --filename {{ chef_user_pem_path }}

      '
  args:
    creates: "{{ chef_user_pem_path }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}"  --association_user {{ username }} --filename {{ chef_org_validator_pem_path }}

      '
  args:
    creates: "{{ chef_org_validator_pem_path }}"
  become: true
