---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache
    description:
      - Fixes the POODLE SSL vulnerability in Apache web server by updating SSL protocol configuration.
      - Disables vulnerable SSL protocols and enables only TLSv1.2.
      - Restarts Apache and SSH services after configuration changes.
    options:
      apache_ssl_config_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file.
      ssl_protocol_config:
        type: str
        required: false
        default: SSLProtocol -all +TLSv1.2
        description: SSL protocol configuration string to fix POODLE vulnerability.
      apache_service_name:
        type: str
        required: false
        default: apache2
        description: Name of the Apache service for restart operations.
      ssh_service_name:
        type: str
        required: false
        default: sshd
        description: Name of the SSH service for restart operations.
