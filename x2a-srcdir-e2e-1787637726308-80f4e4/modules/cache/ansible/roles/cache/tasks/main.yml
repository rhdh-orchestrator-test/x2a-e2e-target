---
- name: Install redis-server package
  ansible.builtin.package:
    name: "{{ cache_package_name }}"
    state: present
- name: Ensure Redis directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/redis
    - /var/lib/redis
    - /var/log/redis
    - /var/run/redis
- name: Deploy Redis configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    mode: "0644"
  notify: Restart redis-server
- name: Enable and start redis-server service
  ansible.builtin.service:
    name: "{{ cache_service_name }}"
    state: "{{ cache_service_state }}"
    enabled: "{{ cache_service_enabled }}"
