---
controller_credential_types:
- name: Chef Admin User Credentials
  description: Credential type for Chef Admin User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Admin Username
      help_text: Username for the Chef Infra Server admin user
    - id: password
      type: string
      label: Admin Password
      secret: true
      help_text: Password for the Chef Infra Server admin user
    - id: email
      type: string
      label: Admin Email
      help_text: Email address for the Chef Infra Server admin user
    - id: full_name
      type: string
      label: Admin Full Name
      help_text: Full name for the Chef Infra Server admin user
    required:
    - username
    - password
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
      full_name: !unsafe '{{ full_name }}'
