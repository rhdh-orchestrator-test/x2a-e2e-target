---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install memcached package
  ansible.builtin.package:
    name: memcached
    state: present

- name: Install redis server package
  ansible.builtin.package:
    name: redis-server
    state: present

- name: Ensure redis user exists
  ansible.builtin.user:
    name: redis
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present

- name: Ensure redis group exists
  ansible.builtin.group:
    name: redis
    system: true
    state: present

- name: Create redis configuration directory
  ansible.builtin.file:
    path: /etc/redis
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create redis data directory
  ansible.builtin.file:
    path: "{{ cache_redis_dir }}" # noqa: R114 - path from role defaults
    owner: redis
    group: redis
    mode: "0755"
    state: directory

- name: Create redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    owner: redis
    group: redis
    mode: "0755"
    state: directory
    recurse: true

- name: Configure redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/6379.conf
    owner: redis
    group: redis
    mode: "0640"
    backup: true
  notify: Restart redis

- name: Clean up redis configuration file
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: "{{ item_cleanup }}"
    state: absent
  loop:
    - ^replica-serve-stale-data.*$
    - ^replica-read-only.*$
    - ^repl-ping-replica-period.*$
    - ^client-output-buffer-limit.*$
    - ^replica-priority.*$
  loop_control:
    loop_var: item_cleanup
  notify: Restart redis

- name: Start and enable memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true

- name: Start and enable redis service
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
