- name: Verify
  hosts: all
  gather_facts: true
  tasks:
  - name: Check Apache virtual host configuration exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
    register: vhost_config
  - name: Assert virtual host configuration exists
    ansible.builtin.assert:
      that:
      - vhost_config.stat.exists
      - vhost_config.stat.size > 0
      fail_msg: Apache virtual host configuration not found
      success_msg: Apache virtual host configuration exists
  - name: Get virtual host configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
    register: vhost_content
    when: vhost_config.stat.exists
  - name: Assert virtual host configuration is correct
    ansible.builtin.assert:
      that:
      - (vhost_content.content | b64decode) is search('VirtualHost \\*:443')
      - (vhost_content.content | b64decode) is search('SSLEngine on')
      - (vhost_content.content | b64decode) is search('SSLCertificateFile')
      - (vhost_content.content | b64decode) is search('SSLCertificateKeyFile')
      fail_msg: Virtual host configuration is incorrect
      success_msg: Virtual host configuration is correct
    when: vhost_config.stat.exists
  - name: Check website content exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/www/helloworld/index.html
    register: website_content
  - name: Assert website content exists
    ansible.builtin.assert:
      that:
      - website_content.stat.exists
      - website_content.stat.size > 0
      fail_msg: Website content not found
      success_msg: Website content exists
  - name: Get website content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/www/helloworld/index.html
    register: html_content
    when: website_content.stat.exists
  - name: Assert website content is correct
    ansible.builtin.assert:
      that:
      - (html_content.content | b64decode) is search('Hello, world!')
      fail_msg: Website content is incorrect
      success_msg: Website content is correct
    when: website_content.stat.exists
  - name: Check SSL certificate files exist
    ansible.builtin.stat:
      path: '{{ item }}'
    register: ssl_files
    loop:
    - /tmp/molecule_test/etc/apache2/certs/apache.key
    - /tmp/molecule_test/etc/apache2/certs/apache.crt
    - /tmp/molecule_test/etc/apache2/certs/apache.csr
  - name: Assert SSL certificate files exist
    ansible.builtin.assert:
      that:
      - item.stat.exists
      fail_msg: SSL certificate file {{ item.item }} not found
      success_msg: SSL certificate file {{ item.item }} exists
    loop: '{{ ssl_files.results }}'
  - name: Check SSL configuration exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_config
  - name: Assert SSL configuration exists
    ansible.builtin.assert:
      that:
      - ssl_config.stat.exists
      - ssl_config.stat.size > 0
      fail_msg: SSL configuration not found
      success_msg: SSL configuration exists
  - name: Get SSL configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_content
    when: ssl_config.stat.exists
  - name: Assert SSL configuration is correct (POODLE fix)
    ansible.builtin.assert:
      that:
      - (ssl_content.content | b64decode) is search('SSLProtocol -all \\+TLSv1.2')
      fail_msg: SSL configuration does not have POODLE fix
      success_msg: SSL configuration has POODLE fix
    when: ssl_config.stat.exists
  - name: Check site is enabled
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
    register: enabled_site
  - name: Assert site is enabled
    ansible.builtin.assert:
      that:
      - enabled_site.stat.exists
      - enabled_site.stat.islnk
      fail_msg: Site is not enabled
      success_msg: Site is enabled
  - name: Check SSL module is enabled
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.conf
    register: enabled_ssl
  - name: Assert SSL module is enabled
    ansible.builtin.assert:
      that:
      - enabled_ssl.stat.exists
      - enabled_ssl.stat.islnk
      fail_msg: SSL module is not enabled
      success_msg: SSL module is enabled
  - name: Check Apache service is running
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Apache service is active
    ansible.builtin.assert:
      that:
      - '''apache2.service'' in ansible_facts.services'
      - ansible_facts.services['apache2.service'].state == 'running'
      fail_msg: Apache service is not running
      success_msg: Apache service is running
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
  - name: Check HTTPS website is accessible
    ansible.builtin.uri:
      url: https://localhost/
      validate_certs: false
      return_content: true
    register: website_response
    tags: molecule-notest
  - name: Assert website returns correct content
    ansible.builtin.assert:
      that:
      - website_response.status == 200
      - '''Hello, world!'' in website_response.content'
      fail_msg: Website is not accessible or content is incorrect
      success_msg: Website is accessible with correct content
    tags: molecule-notest
