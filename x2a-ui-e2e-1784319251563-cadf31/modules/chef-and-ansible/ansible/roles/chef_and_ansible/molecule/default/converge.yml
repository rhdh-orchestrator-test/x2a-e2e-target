---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create directory structure for Apache
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/apache2/sites-available
        - /tmp/molecule_test/etc/apache2/sites-enabled
        - /tmp/molecule_test/etc/apache2/mods-available
        - /tmp/molecule_test/etc/apache2/mods-enabled
        - /tmp/molecule_test/etc/apache2/certs
        - /tmp/molecule_test/var/www/helloworld

    # Create SSL certificate files
    - name: Create mock SSL key file
      ansible.builtin.copy:
        content: "-----BEGIN PRIVATE KEY-----\nMOCK_PRIVATE_KEY_CONTENT\n-----END PRIVATE KEY-----"
        dest: /tmp/molecule_test/etc/apache2/certs/apache.key
        mode: "0640"

    - name: Create mock SSL CSR file
      ansible.builtin.copy:
        content: "-----BEGIN CERTIFICATE REQUEST-----\nMOCK_CSR_CONTENT\n-----END CERTIFICATE REQUEST-----"
        dest: /tmp/molecule_test/etc/apache2/certs/apache.csr
        mode: "0640"

    - name: Create mock SSL certificate file
      ansible.builtin.copy:
        content: "-----BEGIN CERTIFICATE-----\nMOCK_CERTIFICATE_CONTENT\n-----END CERTIFICATE-----"
        dest: /tmp/molecule_test/etc/apache2/certs/apache.crt
        mode: "0640"

    # Create Apache configuration files
    - name: Create Apache virtual host configuration
      ansible.builtin.copy:
        content: |
          <VirtualHost *:443>
           DocumentRoot "/var/www/helloworld"
           SSLEngine on
           SSLCertificateFile /etc/apache2/certs/apache.crt
           SSLCertificateKeyFile /etc/apache2/certs/apache.key
            <Directory "/var/www/helloworld">
              allow from all
              Options None
              Require all granted
            </Directory>
          </VirtualHost>
        dest: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
        mode: "0640"

    - name: Create symlink for enabled site
      ansible.builtin.file:
        src: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
        dest: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
        state: link

    - name: Create SSL module configuration
      ansible.builtin.copy:
        content: |
          # This file contains the SSL configuration for Apache
          SSLProtocol -all +TLSv1.2
          SSLCipherSuite HIGH:!aNULL:!MD5
        dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
        mode: "0644"

    - name: Create symlink for enabled SSL module
      ansible.builtin.file:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
        dest: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.conf
        state: link

    # Create website content
    - name: Create Hello World website content
      ansible.builtin.copy:
        content: |
          <html>
            <head><title>Test Site</title></head>
            <body>
             <h1>Hello, world!</h1>
             <p>The site is up and running</p>
            </body>
          </html>
        dest: /tmp/molecule_test/var/www/helloworld/index.html
        mode: "0644"