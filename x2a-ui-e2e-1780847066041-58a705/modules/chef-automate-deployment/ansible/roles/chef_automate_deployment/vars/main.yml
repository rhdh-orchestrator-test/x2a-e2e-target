---
# Variables for Chef Automate deployment
# Note: Sensitive variables like username, password, etc. are provided by AAP credentials
# and should not be defined here. See tasks/validate_credentials.yml

# Required credential variables that should be provided by AAP:
# - username: Chef user username
# - full_name: Chef user's full name
# - email: Chef user's email address
# - password: Chef user's password