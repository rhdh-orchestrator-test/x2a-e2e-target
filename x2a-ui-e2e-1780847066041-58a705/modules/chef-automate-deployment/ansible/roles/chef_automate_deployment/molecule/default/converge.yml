- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/etc/sysctl.d
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '# Managed by Ansible

        vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Mock'' '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create Chef user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        (mock key content)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create Chef organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        (mock key content)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create Chef server status files
    ansible.builtin.copy:
      content: running
      dest: /tmp/molecule_test/{{ item }}
      mode: '0644'
    loop:
    - hab/chef-automate-status
    - hab/chef-server-status
  - name: Create Chef user list file
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/etc/chef/user-list
      mode: '0644'
  - name: Create Chef organization list file
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/etc/chef/org-list
      mode: '0644'
