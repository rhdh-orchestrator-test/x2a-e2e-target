- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check sysctl configuration file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl configuration file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Chef Automate sysctl configuration file not found
      success_msg: Chef Automate sysctl configuration file exists
  - name: Get sysctl configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl parameters are correctly set
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: Chef Automate sysctl parameters are not correctly set
      success_msg: Chef Automate sysctl parameters are correctly set
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-automate
    register: automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - automate_cli.stat.exists
      - automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate status file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-automate-status
    register: automate_status_file
  - name: Assert Chef Automate status file exists
    ansible.builtin.assert:
      that:
      - automate_status_file.stat.exists
      fail_msg: Chef Automate status file not found
      success_msg: Chef Automate status file exists
  - name: Check Chef Server status file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/chef-server-status
    register: server_status_file
  - name: Assert Chef Server status file exists
    ansible.builtin.assert:
      that:
      - server_status_file.stat.exists
      fail_msg: Chef Server status file not found
      success_msg: Chef Server status file exists
  - name: Check user PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_pem
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem.stat.exists
      - user_pem.stat.size > 0
      fail_msg: User PEM file not found
      success_msg: User PEM file exists
  - name: Check organization validator PEM file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_validator_pem
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_validator_pem.stat.exists
      - org_validator_pem.stat.size > 0
      fail_msg: Organization validator PEM file not found
      success_msg: Organization validator PEM file exists
  - name: Check user list file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/user-list
    register: user_list_file
  - name: Get user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/chef/user-list
    register: user_list_content
    when: user_list_file.stat.exists
  - name: Assert user exists in user list
    ansible.builtin.assert:
      that:
      - '''jtonello'' in (user_list_content.content | b64decode)'
      fail_msg: User 'jtonello' not found in user list
      success_msg: User 'jtonello' found in user list
    when: user_list_file.stat.exists
  - name: Check organization list file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/chef/org-list
    register: org_list_file
  - name: Get organization list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/chef/org-list
    register: org_list_content
    when: org_list_file.stat.exists
  - name: Assert organization exists in organization list
    ansible.builtin.assert:
      that:
      - '''lab'' in (org_list_content.content | b64decode)'
      fail_msg: Organization 'lab' not found in organization list
      success_msg: Organization 'lab' found in organization list
    when: org_list_file.stat.exists
  - name: Check Chef Automate service status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: automate_service_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Check Chef Server service status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: server_service_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Check Chef Automate port
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Check Chef Automate API
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
    register: api_check
    failed_when: false
    tags: molecule-notest
