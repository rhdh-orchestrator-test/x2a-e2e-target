---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameter vm.max_map_count
  ansible.builtin.sysctl:
    name: vm.max_map_count
    value: "262144"
    state: present
    sysctl_set: true
    reload: false
  become: true
  notify: reload sysctl
- name: Configure kernel parameter vm.dirty_expire_centisecs
  ansible.builtin.sysctl:
    name: vm.dirty_expire_centisecs
    value: "20000"
    state: present
    sysctl_set: true
    reload: false
  become: true
  notify: reload sysctl
