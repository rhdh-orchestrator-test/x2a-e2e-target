- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Chef Automate
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/etc/sysctl.d
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/usr/bin
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/etc/chef-server
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '# Managed by Ansible

        vm.max_map_count = 262144

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create sysctl configuration for dirty_expire_centisecs
    ansible.builtin.copy:
      content: '# Managed by Ansible

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-dirty.conf
      mode: '0644'
  - name: Create Chef Automate CLI binary
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        echo "Version: 1.0.0"

        '
      dest: /tmp/molecule_test/usr/bin/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab/sup
      state: directory
      mode: '0755'
  - name: Create Chef Automate deployment status file
    ansible.builtin.copy:
      content: "{\n  \"status\": \"running\",\n  \"products\": [\"automate\", \"infra-server\"],\n  \"version\": \"1.0.0\"\n}\n"
      dest: /tmp/molecule_test/hab/sup/status.json
      mode: '0644'
  - name: Create Chef Server CLI binary
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Server CLI mock"

        echo "Version: 1.0.0"

        '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5NhYMoj56/TLQCj8jJV7TsQjV9...

        (mock PEM content)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5NhYMoj56/TLQCj8jJV7TsQjV9...

        (mock PEM content)

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create user list file
    ansible.builtin.copy:
      content: 'jtonello

        admin

        '
      dest: /tmp/molecule_test/etc/chef-server/user-list.txt
      mode: '0644'
  - name: Create organization list file
    ansible.builtin.copy:
      content: 'lab

        '
      dest: /tmp/molecule_test/etc/chef-server/org-list.txt
      mode: '0644'
