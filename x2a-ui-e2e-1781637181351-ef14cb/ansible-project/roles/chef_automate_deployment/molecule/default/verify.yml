---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname is not set correctly"
        success_msg: "Hostname is set correctly"
      when: hostname_file.stat.exists

    # Sysctl configuration checks
    - name: Check sysctl configuration files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: sysctl_files
      loop:
        - /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        - /tmp/molecule_test/etc/sysctl.d/99-chef-automate-dirty.conf

    - name: Assert sysctl configuration files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Sysctl configuration file {{ item.item }} not found"
        success_msg: "Sysctl configuration file {{ item.item }} exists"
      loop: "{{ sysctl_files.results }}"

    - name: Get sysctl vm.max_map_count configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: max_map_count_content
      when: sysctl_files.results[0].stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - max_map_count_content.content | b64decode | regex_search('vm.max_map_count = 262144')
        fail_msg: "vm.max_map_count is not set correctly"
        success_msg: "vm.max_map_count is set correctly"
      when: sysctl_files.results[0].stat.exists

    - name: Get sysctl vm.dirty_expire_centisecs configuration
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-dirty.conf
      register: dirty_expire_content
      when: sysctl_files.results[1].stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - dirty_expire_content.content | b64decode | regex_search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "vm.dirty_expire_centisecs is not set correctly"
        success_msg: "vm.dirty_expire_centisecs is set correctly"
      when: sysctl_files.results[1].stat.exists

    # Chef Automate CLI checks
    - name: Check Chef Automate CLI
      ansible.builtin.stat:
        path: /tmp/molecule_test/usr/bin/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate deployment checks
    - name: Check Chef Automate deployment marker
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/sup/status.json
      register: chef_automate_status

    - name: Assert Chef Automate deployment marker exists
      ansible.builtin.assert:
        that:
          - chef_automate_status.stat.exists
          - chef_automate_status.stat.isreg
        fail_msg: "Chef Automate deployment marker not found"
        success_msg: "Chef Automate deployment marker exists"

    # Chef Server CLI checks
    - name: Check Chef Server CLI
      ansible.builtin.stat:
        path: /tmp/molecule_test/usr/bin/chef-server-ctl
      register: chef_server_cli

    - name: Assert Chef Server CLI exists
      ansible.builtin.assert:
        that:
          - chef_server_cli.stat.exists
          - chef_server_cli.stat.isreg
          - chef_server_cli.stat.executable
        fail_msg: "Chef Server CLI not found or not executable"
        success_msg: "Chef Server CLI exists and is executable"

    # User and organization checks
    - name: Check user PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_pem

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.isreg
        fail_msg: "User PEM file not found"
        success_msg: "User PEM file exists"

    - name: Check organization validator PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_pem

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_pem.stat.exists
          - org_pem.stat.isreg
        fail_msg: "Organization validator PEM file not found"
        success_msg: "Organization validator PEM file exists"

    - name: Check user list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server/user-list.txt
      register: user_list

    - name: Assert user list file exists
      ansible.builtin.assert:
        that:
          - user_list.stat.exists
          - user_list.stat.isreg
        fail_msg: "User list file not found"
        success_msg: "User list file exists"

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-server/user-list.txt
      register: user_list_content
      when: user_list.stat.exists

    - name: Assert user exists in user list
      ansible.builtin.assert:
        that:
          - user_list_content.content | b64decode | regex_search('jtonello')
        fail_msg: "User jtonello not found in user list"
        success_msg: "User jtonello exists in user list"
      when: user_list.stat.exists

    - name: Check organization list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server/org-list.txt
      register: org_list

    - name: Assert organization list file exists
      ansible.builtin.assert:
        that:
          - org_list.stat.exists
          - org_list.stat.isreg
        fail_msg: "Organization list file not found"
        success_msg: "Organization list file exists"

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-server/org-list.txt
      register: org_list_content
      when: org_list.stat.exists

    - name: Assert organization exists in organization list
      ansible.builtin.assert:
        that:
          - org_list_content.content | b64decode | regex_search('lab')
        fail_msg: "Organization lab not found in organization list"
        success_msg: "Organization lab exists in organization list"
      when: org_list.stat.exists

    # Service status checks (these can't run in container)
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: chef_automate_service_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - chef_automate_service_status.rc == 0
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check Chef Infra Server service status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_service_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server service is running
      ansible.builtin.assert:
        that:
          - chef_server_service_status.rc == 0
        fail_msg: "Chef Infra Server service is not running"
        success_msg: "Chef Infra Server service is running"
      tags: molecule-notest

    # Network checks (these can't run in container)
    - name: Check HTTPS port
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: https_port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert HTTPS port is listening
      ansible.builtin.assert:
        that:
          - https_port_check is succeeded
        fail_msg: "HTTPS port 443 is not listening"
        success_msg: "HTTPS port 443 is listening"
      tags: molecule-notest

    # Web UI access check (can't run in container)
    - name: Check web UI access
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
        status_code: 200
      register: web_ui_check
      failed_when: false
      tags: molecule-notest

    - name: Assert web UI is accessible
      ansible.builtin.assert:
        that:
          - web_ui_check is succeeded
        fail_msg: "Chef Automate web UI is not accessible"
        success_msg: "Chef Automate web UI is accessible"
      tags: molecule-notest