---
# Unsupported pre-flight checks omitted because no expected outcome was stated:
# package/service status, Fail2ban/UFW details, SSH/sysctl values, listening ports,
# response content, file metadata, certificate details, logs, and shared-config grep output.

- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: false
  vars:
    nginx_multisite_sites:
      - host: test.cluster.local
        available: /etc/nginx/sites-available/test.cluster.local
        enabled: /etc/nginx/sites-enabled/test.cluster.local
      - host: ci.cluster.local
        available: /etc/nginx/sites-available/ci.cluster.local
        enabled: /etc/nginx/sites-enabled/ci.cluster.local
      - host: status.cluster.local
        available: /etc/nginx/sites-available/status.cluster.local
        enabled: /etc/nginx/sites-enabled/status.cluster.local

  tasks:
    - name: Check HTTP redirect for each configured site
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_site['host'] }}"
        follow_redirects: none
        return_content: false
      register: nginx_multisite_http_redirects
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site

    - name: Assert HTTP redirects to the site HTTPS URL
      ansible.builtin.assert:
        that:
          - item_http['status'] == 301
          - item_http['location'] == 'https://' ~ item_http['item']['host'] ~ '/'
        fail_msg: HTTP did not redirect to the expected HTTPS URL.
      loop: "{{ nginx_multisite_http_redirects['results'] }}"
      loop_control:
        loop_var: item_http

    - name: Check HTTPS response for each configured site
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_site_https['host'] }}"
        validate_certs: false
        return_content: false
      register: nginx_multisite_https_responses
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site_https

    - name: Assert HTTPS returns HTTP 200 for each configured site
      ansible.builtin.assert:
        that:
          - item_https['status'] == 200
        fail_msg: HTTPS did not return HTTP 200.
      loop: "{{ nginx_multisite_https_responses['results'] }}"
      loop_control:
        loop_var: item_https

    - name: Check each enabled virtual-host link
      ansible.builtin.stat:
        path: "{{ item_site_link['enabled'] }}"
        follow: false
      register: nginx_multisite_site_links
      loop: "{{ nginx_multisite_sites }}"
      loop_control:
        loop_var: item_site_link

    - name: Assert each virtual-host link targets its available configuration
      ansible.builtin.assert:
        that:
          - item_link['stat']['islnk']
          - item_link['stat']['lnk_source'] == item_link['item']['available']
        fail_msg: The enabled virtual-host link does not target its available configuration.
      loop: "{{ nginx_multisite_site_links['results'] }}"
      loop_control:
        loop_var: item_link

    - name: Check that the default enabled site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: nginx_multisite_default_site

    - name: Assert that the default enabled site is absent
      ansible.builtin.assert:
        that:
          - not nginx_multisite_default_site['stat']['exists']
        fail_msg: The default enabled Nginx site is present.
