- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: '{{ automate_cli_url }}'
    dest: /tmp/chef-automate.zip
    mode: '0644'
  register: download_result
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate.zip > {{ ansible_env.PWD }}/chef-automate
  args:
    creates: '{{ ansible_env.PWD }}/chef-automate'
  when: download_result is changed or not ansible_check_mode
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: '{{ ansible_env.PWD }}/chef-automate'
    mode: '0755'
    state: file
- name: Check if Chef Automate is already deployed
  ansible.builtin.stat:
    path: /hab
  register: hab_dir
  become: true
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: ./chef-automate deploy {% for product in automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{ automate_accept_terms_and_mlsa
      | lower }}
  args:
    creates: /hab
  become: true
  register: automate_deploy_result
  changed_when: automate_deploy_result.rc == 0
  when: not hab_dir.stat.exists
