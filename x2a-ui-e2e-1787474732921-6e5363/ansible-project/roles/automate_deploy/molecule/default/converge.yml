- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ automate_hostname | default(''automate.chef.lab'') }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create mock kernel parameter files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/vm/{{ item.name }}
      mode: '0644'
    loop:
    - name: max_map_count
      value: '262144'
    - name: dirty_expire_centisecs
      value: '20000'
  - name: Create mock Chef Automate CLI binary
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create mock user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        MOCK PEM FILE CONTENT

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create mock organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        MOCK VALIDATOR PEM FILE CONTENT

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create mock chef-server-ctl binary directory
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/bin
      state: directory
      mode: '0755'
  - name: Create mock chef-server-ctl binary
    ansible.builtin.copy:
      content: "#!/bin/bash\necho 'Chef Server Control mock'\nif [ \"$1\" == \"user-list\" ]; then\n  echo \"jtonello\"\nelif [ \"$1\" == \"org-list\" ]; then\n  echo
        \"lab\"\nelif [ \"$1\" == \"status\" ]; then\n  echo \"All services running\"\nelif [ \"$1\" == \"service-list\" ]; then\n  echo \"chef-server-service-1:
        running\"\n  echo \"chef-server-service-2: running\"\nfi\n"
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
