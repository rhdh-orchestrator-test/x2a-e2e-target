---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ automate_hostname }}"
  become: true
- name: Set vm.max_map_count kernel parameter
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ automate_vm_max_map_count }}"
    state: present
    sysctl_set: true
    reload: true
  become: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ automate_vm_dirty_expire_centisecs }}"
    state: present
    sysctl_set: true
    reload: true
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate.zip > {{ ansible_env.PWD }}/chef-automate
  args:
    creates: "{{ ansible_env.PWD }}/chef-automate"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ ansible_env.PWD }}/chef-automate"
    mode: "0755"
    state: file
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "./chef-automate deploy  --product infra-server  --accept-terms-and-mlsa={{ automate_accept_terms_and_mlsa | lower }}\n"
  args:
    creates: /hab
  become: true
  register: chef_server_deploy_result
  changed_when: chef_server_deploy_result.rc == 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ username | default(''jtonello'') }}  "{{ full_name | default(''John Tonello'') }}"  {{ email | default(''jtonello@chef.lab'')
      }}  "{{ password | default(''password'') }}"  --filename {{ automate_user_pem_filename }}

      '
  args:
    creates: "{{ ansible_env.PWD }}/{{ automate_user_pem_filename }}"
  become: true
  register: create_user_result
  changed_when: create_user_result.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ automate_org_name }}  "{{ automate_org_full_name }}"  --association_user {{ username | default(''jtonello'') }}  --filename
      {{ automate_org_validator_pem_filename }}

      '
  args:
    creates: "{{ ansible_env.PWD }}/{{ automate_org_validator_pem_filename }}"
  become: true
  register: create_org_result
  changed_when: create_org_result.rc == 0
