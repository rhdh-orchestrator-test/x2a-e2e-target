---
- name: Restart Chef Automate
  ansible.builtin.command:
    cmd: chef-automate restart
  become: true
  listen: restart chef automate
  register: restart_automate_result
  changed_when: restart_automate_result.rc == 0
- name: Restart Chef Server
  ansible.builtin.command:
    cmd: chef-server-ctl restart
  become: true
  listen: restart chef server
  register: restart_server_result
  changed_when: restart_server_result.rc == 0
