---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Include deploy_automate tasks (Chef Automate + Chef Infra Server)
  ansible.builtin.include_tasks: deploy_automate.yml
  when: chef_automate_deploy_automate | bool
- name: Include deploy_chef_server tasks (Chef Infra Server only)
  ansible.builtin.include_tasks: deploy_chef_server.yml
  when: not chef_automate_deploy_automate | bool
