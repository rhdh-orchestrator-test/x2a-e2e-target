---
controller_credentials:
- name: Chef Server User Credentials - chef_automate_deployment
  description: User credentials for Chef Server authentication
  organization: Default
  credential_type: Chef Server User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
- name: Chef Organization Configuration - chef_automate_deployment
  description: Organization configuration for Chef Server
  organization: Default
  credential_type: Chef Organization Configuration
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
