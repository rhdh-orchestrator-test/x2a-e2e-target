- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/usr/local/bin
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/etc
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname | default(''automate.chef.lab'') }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Mock'' '
      dest: /tmp/molecule_test/usr/local/bin/chef-automate
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5NhSBxgutqfQVuCVXEGZJj+TMnOG9rz/Oi7CZ0FnLwDGQXU

        eGvkJbKBtGXwAGEC1Q==

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ username | default('jtonello') }}.pem
      mode: '0600'
  - name: Create organization key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEAu5NhSBxgutqfQVuCVXEGZJj+TMnOG9rz/Oi7CZ0FnLwDGQXU

        eGvkJbKBtGXwAGEC1Q==

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ org_name | default('lab') }}-validator.pem
      mode: '0600'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = {{ chef_automate_vm_max_map_count | default(262144) }}

        vm.dirty_expire_centisecs = {{ chef_automate_vm_dirty_expire_centisecs | default(20000) }}

        '
      dest: /tmp/molecule_test/etc/sysctl.conf
      mode: '0644'
  - name: Set test variables
    ansible.builtin.set_fact:
      username: jtonello
      full_name: John Tonello
      email: jtonello@chef.lab
      password: password
      org_name: lab
      org_full_name: Chef Lab
      chef_automate_hostname: automate.chef.lab
      chef_automate_vm_max_map_count: 262144
      chef_automate_vm_dirty_expire_centisecs: 20000
      chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
      chef_automate_cli_path: /tmp/molecule_test/tmp/chef-automate
      chef_automate_cli_dest: /tmp/molecule_test/usr/local/bin/chef-automate
      chef_automate_deploy_automate: true
      chef_automate_accept_terms: true
      chef_automate_user_key_path: /tmp/molecule_test/{{ username }}.pem
      chef_automate_org_key_path: /tmp/molecule_test/{{ org_name }}-validator.pem
