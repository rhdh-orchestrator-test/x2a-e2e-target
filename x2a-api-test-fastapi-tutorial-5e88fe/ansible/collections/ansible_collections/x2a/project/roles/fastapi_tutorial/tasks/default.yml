---
- name: Install required system packages  # noqa: R113 - package names come from role defaults
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_package_names }}"
    state: present

- name: Create application directory  # noqa: R114 - path comes from role defaults
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize FastAPI tutorial repository  # noqa: R104 - role default is a trusted HTTPS repository URL
  ansible.builtin.git:  # noqa: R106 - repository source comes from role defaults
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_path }}"
    version: "{{ fastapi_tutorial_repository_version }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - virtualenv path comes from role defaults
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_path }}"
    creates: "{{ fastapi_tutorial_venv_path }}"

- name: Install application dependencies  # noqa: R113 - package and virtualenv paths come from role defaults
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_venv_path }}"
    virtualenv_command: python3 -m venv
    chdir: "{{ fastapi_tutorial_app_path }}"

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the FastAPI PostgreSQL role exists  # noqa: L039 - database credentials are validated by the preceding credential validation task
  ansible.builtin.command:  # noqa: R101 - SQL uses validated credential variables
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}';
  changed_when: false
  register: fastapi_tutorial_role_check
  become: true  # noqa: R108 - psql must run as the postgres system user
  become_user: postgres

- name: Create the FastAPI PostgreSQL role  # noqa: L039 - database credentials are validated by the preceding credential validation task
  ansible.builtin.command:  # noqa: R101, no-changed-when - SQL uses validated credential variables and runs only when the role is absent
    argv:
      - psql
      - -c
      - CREATE USER {{ db_username }} WITH PASSWORD '{{ db_password }}';
  when: fastapi_tutorial_role_check.stdout | trim != '1'
  become: true  # noqa: R108 - psql must run as the postgres system user
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the FastAPI database exists  # noqa: L039 - database credentials are validated by the preceding credential validation task
  ansible.builtin.command:  # noqa: R101 - SQL uses validated credential variables
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ db_name }}';
  changed_when: false
  register: fastapi_tutorial_database_check
  become: true  # noqa: R108 - psql must run as the postgres system user
  become_user: postgres

- name: Create the FastAPI database  # noqa: L039 - database credentials are validated by the preceding credential validation task
  ansible.builtin.command:  # noqa: R101, no-changed-when - SQL uses validated credential variables and runs only when the database is absent
    argv:
      - psql
      - -c
      - CREATE DATABASE {{ db_name }} OWNER {{ db_username }};
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  become: true  # noqa: R108 - psql must run as the postgres system user
  become_user: postgres

- name: Grant database privileges to the FastAPI role  # noqa: L039 - database credentials are validated by the preceding credential validation task
  ansible.builtin.command:  # noqa: R101 - SQL uses validated credential variables
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_username }};
  changed_when: false
  become: true  # noqa: R108 - psql must run as the postgres system user
  become_user: postgres

- name: Deploy application environment configuration  # noqa: L039 - database credentials are validated by the preceding credential validation task
  ansible.builtin.copy:  # noqa: R114 - destination path comes from role defaults
    dest: "{{ fastapi_tutorial_app_path }}/.env"
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}/{{ db_name }}
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy FastAPI systemd unit  # noqa: R114 - destination path comes from role defaults
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_service_unit_path }}"
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_venv_path }}/bin"
      ExecStart={{ fastapi_tutorial_venv_path }}/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before starting FastAPI
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
