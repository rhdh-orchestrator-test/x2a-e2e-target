---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure that would be created by the role
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/etc/chef
        - /tmp/molecule_test/etc/sysctl.d
        - /tmp/molecule_test/var/opt/chef-server
        - /tmp/molecule_test/var/opt/chef-automate

    # Simulate system configuration files
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: |
          # Chef Automate kernel parameters
          vm.max_map_count = {{ chef_automate_vm_max_map_count }}
          vm.dirty_expire_centisecs = {{ chef_automate_vm_dirty_expire_centisecs }}
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate Chef Automate CLI download and extraction
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/sh\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment files
      ansible.builtin.copy:
        content: |
          # Chef Automate deployment configuration
          [automate]
          fqdn = "{{ chef_automate_hostname }}"
          deployed = true
        dest: "/tmp/molecule_test/var/opt/chef-automate/config.toml"
        mode: "0644"

    # Simulate Chef Server deployment
    - name: Create Chef Server deployment files
      ansible.builtin.copy:
        content: |
          # Chef Server configuration
          topology "standalone"
          api_fqdn "{{ chef_automate_hostname }}"
        dest: "/tmp/molecule_test/etc/chef/chef-server.rb"
        mode: "0644"

    # Simulate user and organization creation
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAu1SU1LfVLPHCozMxH2Mo4lgOEePzNm0tRgeLezV6ffAt0Gkw
          E1sdyc6RfEitMocgvfDzzlVwm07/zJYMp7VTEw1lnfznkQHqbQv7YDUHfVCN/n9I
          (mock key content)
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/{{ chef_automate_user_pem_file }}"
        mode: "0600"

    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAu1SU1LfVLPHCozMxH2Mo4lgOEePzNm0tRgeLezV6ffAt0Gkw
          E1sdyc6RfEitMocgvfDzzlVwm07/zJYMp7VTEw1lnfznkQHqbQv7YDUHfVCN/n9I
          (mock key content)
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/{{ chef_automate_org_validator_pem_file }}"
        mode: "0600"

    # Simulate Chef Server user and organization data
    - name: Create user list file
      ansible.builtin.copy:
        content: |
          {{ chef_automate_username }}
        dest: "/tmp/molecule_test/var/opt/chef-server/user-list.txt"
        mode: "0644"

    - name: Create organization list file
      ansible.builtin.copy:
        content: |
          {{ chef_automate_org_name }}
        dest: "/tmp/molecule_test/var/opt/chef-server/org-list.txt"
        mode: "0644"

    # Simulate Chef Server status files
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          run: state: up
          postgresql: state: up
          bookshelf: state: up
          oc_bifrost: state: up
          oc_id: state: up
          opscode-erchef: state: up
          nginx: state: up
        dest: "/tmp/molecule_test/var/opt/chef-server/status.txt"
        mode: "0644"

    # Simulate Chef Automate status files
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          deployment-service: running
          postgresql: running
          elasticsearch: running
          automate-gateway: running
          automate-ui: running
        dest: "/tmp/molecule_test/var/opt/chef-automate/status.txt"
        mode: "0644"

  vars:
    chef_automate_hostname: automate.chef.lab
    chef_automate_vm_max_map_count: 262144
    chef_automate_vm_dirty_expire_centisecs: 20000
    chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
    chef_automate_cli_path: ./chef-automate
    chef_automate_accept_terms: true
    chef_automate_deploy_automate: true
    chef_automate_username: jtonello
    chef_automate_user_full_name: John Tonello
    chef_automate_user_email: jtonello@chef.lab
    chef_automate_user_password: password
    chef_automate_org_name: lab
    chef_automate_org_full_name: Chef Lab
    chef_automate_user_pem_file: "jtonello.pem"
    chef_automate_org_validator_pem_file: "lab-validator.pem"
    # Credential variables required by validate_credentials.yml
    username: jtonello
    password: password
    user_full_name: John Tonello
    user_email: jtonello@chef.lab
    organization_name: lab
    organization_full_name: Chef Lab