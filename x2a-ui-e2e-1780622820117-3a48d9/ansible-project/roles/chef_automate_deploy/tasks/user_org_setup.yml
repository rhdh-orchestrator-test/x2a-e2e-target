---
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username | default(chef_automate_username) }} "{{ user_full_name | default(chef_automate_user_full_name) }}" {{ user_email
      | default(chef_automate_user_email) }} "{{ password | default(chef_automate_user_password) }}" --filename {{ chef_automate_user_pem_file }}

      '
  become: true
  args:
    creates: "{{ chef_automate_user_pem_file }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ organization_name | default(chef_automate_org_name) }} "{{ organization_full_name | default(chef_automate_org_full_name) }}"
      --association_user {{ username | default(chef_automate_username) }} --filename {{ chef_automate_org_validator_pem_file }}

      '
  become: true
  args:
    creates: "{{ chef_automate_org_validator_pem_file }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
