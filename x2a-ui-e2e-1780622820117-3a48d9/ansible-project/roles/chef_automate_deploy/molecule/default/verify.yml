---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found or empty"
        success_msg: "Hostname file exists and has content"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check sysctl configuration file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Sysctl configuration file not found or empty"
        success_msg: "Sysctl configuration file exists and has content"

    - name: Get sysctl file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are set correctly
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
          - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI checks
    - name: Check Chef Automate CLI file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate deployment checks
    - name: Check Chef Automate deployment configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-automate/config.toml
      register: chef_automate_config

    - name: Assert Chef Automate configuration exists
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
          - chef_automate_config.stat.size > 0
        fail_msg: "Chef Automate configuration not found or empty"
        success_msg: "Chef Automate configuration exists"

    # Chef Server deployment checks
    - name: Check Chef Server configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef/chef-server.rb
      register: chef_server_config

    - name: Assert Chef Server configuration exists
      ansible.builtin.assert:
        that:
          - chef_server_config.stat.exists
          - chef_server_config.stat.size > 0
        fail_msg: "Chef Server configuration not found or empty"
        success_msg: "Chef Server configuration exists"

    # User and organization checks
    - name: Check user PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_pem

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.size > 0
        fail_msg: "User PEM file not found or empty"
        success_msg: "User PEM file exists"

    - name: Check organization validator PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_validator_pem

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_validator_pem.stat.exists
          - org_validator_pem.stat.size > 0
        fail_msg: "Organization validator PEM file not found or empty"
        success_msg: "Organization validator PEM file exists"

    - name: Check user list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server/user-list.txt
      register: user_list

    - name: Assert user list file exists
      ansible.builtin.assert:
        that:
          - user_list.stat.exists
          - user_list.stat.size > 0
        fail_msg: "User list file not found or empty"
        success_msg: "User list file exists"

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef-server/user-list.txt
      register: user_list_content
      when: user_list.stat.exists

    - name: Assert user exists in user list
      ansible.builtin.assert:
        that:
          - (user_list_content.content | b64decode | trim) == "jtonello"
        fail_msg: "User jtonello not found in user list"
        success_msg: "User jtonello found in user list"
      when: user_list.stat.exists

    - name: Check organization list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server/org-list.txt
      register: org_list

    - name: Assert organization list file exists
      ansible.builtin.assert:
        that:
          - org_list.stat.exists
          - org_list.stat.size > 0
        fail_msg: "Organization list file not found or empty"
        success_msg: "Organization list file exists"

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef-server/org-list.txt
      register: org_list_content
      when: org_list.stat.exists

    - name: Assert organization exists in organization list
      ansible.builtin.assert:
        that:
          - (org_list_content.content | b64decode | trim) == "lab"
        fail_msg: "Organization lab not found in organization list"
        success_msg: "Organization lab found in organization list"
      when: org_list.stat.exists

    # Service status checks (tagged with molecule-notest as they can't run in container)
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: chef_automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Server is not running"
        success_msg: "Chef Server is running"
      tags: molecule-notest

    # Network checks (tagged with molecule-notest as they can't run in container)
    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # API health checks (tagged with molecule-notest as they can't run in container)
    - name: Check Chef Automate API health
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
        status_code: 200
      register: api_health
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate API is healthy
      ansible.builtin.assert:
        that:
          - api_health is succeeded
        fail_msg: "Chef Automate API is not healthy"
        success_msg: "Chef Automate API is healthy"
      tags: molecule-notest