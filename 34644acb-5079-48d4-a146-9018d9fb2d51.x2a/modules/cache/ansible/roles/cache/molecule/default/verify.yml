---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Set Redis service name based on OS family
      ansible.builtin.set_fact:
        redis_service_name: "{{ 'redis' if ansible_facts['os_family'] == 'RedHat' else 'redis-server' }}"

    - name: Check Redis service status
      ansible.builtin.service_facts:

    - name: Assert Redis service is running  # noqa: L039 - redis_service_name set by prior task
      ansible.builtin.assert:
        that:
          - "'{{ redis_service_name }}.service' in ansible_facts.services"
          - "ansible_facts.services['{{ redis_service_name }}.service']['state'] == 'running'"
          - "ansible_facts.services['{{ redis_service_name }}.service']['status'] == 'enabled'"
        fail_msg: "Redis service is not running or not enabled"

    - name: Check Redis is listening on port 6379
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 10
        msg: "Redis is not listening on port 6379"

    - name: Test Redis connectivity with ping
      ansible.builtin.command:
        cmd: redis-cli ping
      register: redis_ping_result
      changed_when: false

    - name: Assert Redis ping response
      ansible.builtin.assert:
        that:
          - "redis_ping_result['stdout'] == 'PONG'"
        fail_msg: "Redis ping test failed"

    - name: Test Redis basic operations  # noqa: R101 - redis-cli commands are safe, not user-controlled
      ansible.builtin.command:
        cmd: "{{ item_redis_cmd }}"
      loop:
        - redis-cli set molecule_test_key "molecule_test_value"
        - redis-cli get molecule_test_key
        - redis-cli del molecule_test_key
      loop_control:
        loop_var: item_redis_cmd
      register: redis_ops_results
      changed_when: false

    - name: Assert Redis operations work correctly
      ansible.builtin.assert:
        that:
          - "redis_ops_results['results'][0]['stdout'] == 'OK'"
          - "redis_ops_results['results'][1]['stdout'] == 'molecule_test_value'"
          - "redis_ops_results['results'][2]['stdout'] == '1'"
        fail_msg: "Redis basic operations test failed"

    - name: Set Redis config paths based on OS family
      ansible.builtin.set_fact:
        redis_config_files:
          - "{{ '/etc/redis.conf' if ansible_facts['os_family'] == 'RedHat' else '/etc/redis/redis.conf' }}"
          - /var/lib/redis

    - name: Check Redis configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config_file }}"
      loop: "{{ redis_config_files }}"
      loop_control:
        loop_var: item_config_file
      register: redis_config_stat_results

    - name: Assert Redis configuration files exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: "Expected Redis configuration file or directory not found: {{ item_result['item_config_file'] }}"
      loop: "{{ redis_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Get Redis server info  # noqa: R101 - redis-cli command is safe, not user-controlled
      ansible.builtin.command:
        cmd: redis-cli info server
      register: redis_info_result
      changed_when: false

    - name: Assert Redis server info contains expected data
      ansible.builtin.assert:
        that:
          - "'redis_version' in redis_info_result['stdout']"
          - "'tcp_port:6379' in redis_info_result['stdout']"
        fail_msg: "Redis server info does not contain expected data"

    - name: Check Redis process is running  # noqa: R101 - redis_service_name comes from role logic, not user input
      ansible.builtin.command:
        cmd: "pgrep {{ redis_service_name }}"
      register: redis_process_result
      changed_when: false

    - name: Assert Redis process exists
      ansible.builtin.assert:
        that:
          - "redis_process_result['stdout'] | length > 0"
        fail_msg: "Redis server process not found"