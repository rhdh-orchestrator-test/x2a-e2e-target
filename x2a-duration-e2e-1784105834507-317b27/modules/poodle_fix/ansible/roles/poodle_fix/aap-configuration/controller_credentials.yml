---
controller_credentials:
- name: Chef Server Credentials - poodle_fix
  description: Credentials used for Chef Server deployment
  organization: Default
  credential_type: Chef Server Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Chef Automate Credentials - poodle_fix
  description: Credentials used for Chef Automate deployment
  organization: Default
  credential_type: Chef Automate Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
