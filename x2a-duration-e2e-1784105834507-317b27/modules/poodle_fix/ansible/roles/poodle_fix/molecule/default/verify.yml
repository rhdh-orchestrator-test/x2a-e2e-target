---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    ssl_config_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
  tasks:
    - name: Check if Apache SSL config file exists
      ansible.builtin.stat:
        path: "{{ ssl_config_path }}"
      register: ssl_config_file

    - name: Assert SSL config file exists
      ansible.builtin.assert:
        that:
          - ssl_config_file.stat.exists
          - ssl_config_file.stat.isreg
        fail_msg: "SSL config file does not exist"
        success_msg: "SSL config file exists"

    - name: Get SSL config file content
      ansible.builtin.slurp:
        src: "{{ ssl_config_path }}"
      register: ssl_config_content

    - name: Assert SSL protocol is properly configured
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in ssl_config_content.content | b64decode"
        fail_msg: "SSL protocol is not properly configured to mitigate POODLE vulnerability"
        success_msg: "SSL protocol is properly configured to mitigate POODLE vulnerability"

    # The following checks would be performed in a real environment but are skipped in molecule tests
    - name: Check Apache service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Check SSH service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert SSH service is running
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
          - "ansible_facts.services['sshd.service'].state == 'running'"
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"
      tags: molecule-notest

    - name: Validate Apache configuration
      ansible.builtin.command: apache2ctl configtest
      changed_when: false
      tags: molecule-notest