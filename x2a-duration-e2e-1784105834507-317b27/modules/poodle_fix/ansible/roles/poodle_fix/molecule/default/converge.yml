---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: molecule_test_user
    password: molecule_test_password
    ssl_config_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
  tasks:
    - name: Create directory structure for Apache config
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/apache2/mods-available

    - name: Create mock Apache SSL config file with original content
      ansible.builtin.copy:
        content: |
          # Mock Apache SSL configuration file
          SSLEngine on
          SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
          SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
          SSLProtocol all -SSLv3
        dest: "{{ ssl_config_path }}"
        mode: "0644"

    - name: Apply POODLE fix (simulate role execution)
      ansible.builtin.replace:
        dest: "{{ ssl_config_path }}"
        regexp: ^SSLProtocol.*$
        replace: "SSLProtocol -all +TLSv1.2"