---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Include Memcached tasks
  ansible.builtin.include_tasks: memcached.yml

- name: Configure Redis through the approved collection role  # noqa: L038 - approved eloy.redis collection is supplied by the deployment environment
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_version: "7.2"
    redis_install_method: package
    redis_port: 6379
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true

- name: Ensure Redis log directory exists
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Check whether the Redis configuration file exists
  ansible.builtin.stat:
    path: /etc/redis/6379.conf
  register: cache_redis_config

- name: Remove obsolete Redis replication directives
  ansible.builtin.replace:
    path: /etc/redis/6379.conf
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$
    replace: ""
    backup: true
    create: false
  when: cache_redis_config.stat.exists  # noqa: L039 - variable is registered by the preceding stat task
  notify: Restart Redis

- name: Ensure Redis service is enabled and started
  ansible.builtin.service:
    name: redis-server
    enabled: true
    state: started
