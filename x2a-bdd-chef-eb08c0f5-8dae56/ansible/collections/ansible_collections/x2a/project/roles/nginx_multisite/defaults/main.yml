---
nginx_multisite_ssl_certificate_path: /etc/ssl/certs
nginx_multisite_ssl_private_key_path: /etc/ssl/private
nginx_multisite_fail2ban_enabled: true
nginx_multisite_ufw_enabled: true
nginx_multisite_disable_root_login: true
nginx_multisite_password_authentication: false
nginx_multisite_secure_logging: true
nginx_multisite_sites: {}
nginx_multisite_site_token: "{{ site_token }}"
nginx_multisite_sshd_service_name: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
nginx_multisite_worker_user: "{{ 'www-data' if ansible_facts.os_family == 'Debian' else 'nginx' }}"
nginx_multisite_worker_group: "{{ 'www-data' if ansible_facts.os_family == 'Debian' else 'nginx' }}"
