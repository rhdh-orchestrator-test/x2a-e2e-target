---
- name: Create Nginx site directories
  ansible.builtin.file:
    path: "{{ item_nginx_multisite }}" # noqa: R114 - fixed role-defined directory list
    owner: root
    group: root
    mode: "0755"
    state: directory
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
  loop_control:
    loop_var: item_nginx_multisite

- name: Render Nginx site configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_nginx_multisite['key'] }} # noqa: R114 - filename from role-defined sites dictionary
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
  notify: Reload nginx
  vars:
    server_name: "{{ item_nginx_multisite['key'] }}"
    document_root: "{{ item_nginx_multisite['value']['document_root'] }}"
    ssl_enabled: "{{ item_nginx_multisite['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_multisite['key'] }}.crt"
    key_file: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_multisite['key'] }}.key"

- name: Enable Nginx site configurations
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_nginx_multisite['key'] }}
    dest: /etc/nginx/sites-enabled/{{ item_nginx_multisite['key'] }} # noqa: R114 - filename from role-defined sites dictionary
    state: link
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
  notify: Reload nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
