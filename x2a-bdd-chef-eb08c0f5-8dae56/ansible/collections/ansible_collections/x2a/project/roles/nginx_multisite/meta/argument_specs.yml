---
argument_specs:
  main:
    short_description: Configure Nginx with multiple SSL-enabled sites and security hardening
    description:
      - Installs and configures Nginx, site virtual hosts, TLS certificates, Fail2ban, UFW, and SSH hardening.
    options:
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for site certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban protection is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_disable_root_login:
        type: bool
        required: false
        default: true
        description: Whether SSH root login is disabled.
      nginx_multisite_password_authentication:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide sensitive task output.
      nginx_multisite_sites:
        type: dict
        required: false
        default: {}
        description: Mapping of site names to document roots and SSL settings.
      nginx_multisite_site_token:
        type: str
        required: false
        default: "{{ site_token }}"
        description: Site token injected by an AAP credential type.
      nginx_multisite_sshd_service_name:
        type: str
        required: false
        default: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
        description: SSH daemon service name.
      nginx_multisite_worker_user:
        type: str
        required: false
        default: "{{ 'www-data' if ansible_facts.os_family == 'Debian' else 'nginx' }}"
        description: Nginx worker account.
      nginx_multisite_worker_group:
        type: str
        required: false
        default: "{{ 'www-data' if ansible_facts.os_family == 'Debian' else 'nginx' }}"
        description: Nginx worker group.
