---
- name: Configure Nginx multisite handlers
  ansible.builtin.meta: flush_handlers

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Reload kernel security settings
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: Restart sshd
  ansible.builtin.service:
    name: "{{ nginx_multisite_sshd_service_name }}"
    state: restarted
