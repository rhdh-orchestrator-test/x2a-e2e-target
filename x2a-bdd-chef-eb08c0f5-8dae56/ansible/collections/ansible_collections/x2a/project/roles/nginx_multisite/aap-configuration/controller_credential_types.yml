---
controller_credential_types:
  - name: Chef Encrypted Data Bag Nginx Site Token
    description: Nginx site token loaded from the encrypted Chef data bag nginx_secrets/site and written to /etc/nginx/secrets/site_token.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Nginx Site Token
          secret: true
          help_text: Secret token stored in the encrypted Chef data bag and deployed to /etc/nginx/secrets/site_token.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
