---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application with PostgreSQL.
    description:
      - Deploys the FastAPI tutorial repository, Python virtual environment, PostgreSQL database, and systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Filesystem path where the application is deployed.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to check out.
      fastapi_tutorial_service_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by Uvicorn.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide tasks that handle the database password from logs.
      db_username:
        type: str
        required: true
        description: PostgreSQL application username injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: PostgreSQL application password injected by an AAP credential type.
      database_name:
        type: str
        required: true
        description: PostgreSQL database name injected by an AAP credential type.
      database_host:
        type: str
        required: true
        description: PostgreSQL database host injected by an AAP credential type.
