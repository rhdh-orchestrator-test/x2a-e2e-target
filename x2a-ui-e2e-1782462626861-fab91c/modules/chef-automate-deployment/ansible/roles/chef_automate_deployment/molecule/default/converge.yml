- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: admin
    full_name: Chef Admin
    email: admin@example.com
    password: ChefPassword123
  tasks:
  - name: Create required directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
    - '{{ ansible_env.HOME }}'
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '{{ item.key }} = {{ item.value }}'
      dest: /tmp/molecule_test/etc/{{ item.key | replace('.', '_') }}
      mode: '0644'
    loop:
    - key: vm.max_map_count
      value: '{{ chef_automate_vm_max_map_count }}'
    - key: vm.dirty_expire_centisecs
      value: '{{ chef_automate_vm_dirty_expire_centisecs }}'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test{{ chef_automate_cli_path }}
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock Chef User Key -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test{{ chef_automate_user_key_path }}
      mode: '0600'
  - name: Create organization key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock Chef Organization Key -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test{{ chef_automate_org_key_path }}
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: 'Service: chef-automate

        Status: running

        Version: 1.0.0

        '
      dest: /tmp/molecule_test/tmp/chef-automate-status
      mode: '0644'
    when: chef_automate_deploy_automate | bool
  - name: Create Chef Infra Server status file
    ansible.builtin.copy:
      content: 'Service: chef-server

        Status: running

        Version: 1.0.0

        '
      dest: /tmp/molecule_test/tmp/chef-server-status
      mode: '0644'
    when: chef_automate_deploy_infra_server | bool
  - name: Create user list file
    ansible.builtin.copy:
      content: '{{ username }}'
      dest: /tmp/molecule_test/tmp/chef-user-list
      mode: '0644'
  - name: Create organization list file
    ansible.builtin.copy:
      content: '{{ chef_automate_org_name }}'
      dest: /tmp/molecule_test/tmp/chef-org-list
      mode: '0644'
