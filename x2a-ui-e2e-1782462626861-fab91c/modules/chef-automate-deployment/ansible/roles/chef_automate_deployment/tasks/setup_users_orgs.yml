---
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_automate_user_key_path }}
  become: true
  args:
    creates: "{{ chef_automate_user_key_path }}"
  register: create_user_result
  changed_when: create_user_result.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_long_name }}" --association_user {{ username }} --filename {{
      chef_automate_org_key_path }}
  become: true
  args:
    creates: "{{ chef_automate_org_key_path }}"
  register: create_org_result
  changed_when: create_org_result.rc == 0
