- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    full_name: John Tonello
    email: jtonello@chef.lab
    password: password
    chef_automate_hostname: automate.chef.lab
    chef_org_name: lab
    chef_org_long_name: Chef Lab
    chef_user_key_filename: /tmp/molecule_test/jtonello.pem
    chef_org_validator_key_filename: /tmp/molecule_test/lab-validator.pem
    chef_deployment_type: full
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef
    - /tmp/molecule_test/hab/sup/default/data
    - /tmp/molecule_test/var/log/chef-automate
    - /tmp/molecule_test/var/log/chef-server
  - name: Create mock Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Mock Chef Automate CLI'' '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create mock user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK KEY CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/etc/chef/{{ username }}.pem
      mode: '0600'
  - name: Create mock organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK VALIDATOR KEY CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/etc/chef/{{ chef_org_name }}-validator.pem
      mode: '0600'
  - name: Create mock services.dat file
    ansible.builtin.copy:
      content: '# Mock services data file '
      dest: /tmp/molecule_test/hab/sup/default/data/services.dat
      mode: '0644'
  - name: Create mock sysctl settings files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/{{ item.path }}
      mode: '0644'
    loop:
    - path: vm/max_map_count
      value: '262144'
    - path: vm/dirty_expire_centisecs
      value: '20000'
  - name: Create mock hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create mock Chef server user list output
    ansible.builtin.copy:
      content: '{{ username }}'
      dest: /tmp/molecule_test/chef-server-user-list
      mode: '0644'
  - name: Create mock Chef server org list output
    ansible.builtin.copy:
      content: '{{ chef_org_name }}'
      dest: /tmp/molecule_test/chef-server-org-list
      mode: '0644'
  - name: Create mock Chef Automate status output
    ansible.builtin.copy:
      content: 'Service: chef-automate Status: running '
      dest: /tmp/molecule_test/chef-automate-status
      mode: '0644'
  - name: Create mock Chef server status output
    ansible.builtin.copy:
      content: 'Service: chef-server Status: running '
      dest: /tmp/molecule_test/chef-server-status
      mode: '0644'
