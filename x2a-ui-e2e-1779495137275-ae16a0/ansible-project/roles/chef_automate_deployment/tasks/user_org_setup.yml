---
- name: Ensure directory exists for Chef key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_key_filename }}"
    - "{{ chef_org_validator_key_filename }}"
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} {{ password }} --filename {{ chef_user_key_filename }}
  become: true
  args:
    creates: "{{ chef_user_key_filename }}"
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}" --association_user {{ username }} --filename {{
      chef_org_validator_key_filename }}
  become: true
  args:
    creates: "{{ chef_org_validator_key_filename }}"
