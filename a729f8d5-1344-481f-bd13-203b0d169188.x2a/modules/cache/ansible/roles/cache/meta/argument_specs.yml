---
argument_specs:
  main:
    short_description: Simple cache cookbook - local dependency for testing
    description:
      - Installs and configures Redis server as a simple cache solution.
      - Uses default Redis configuration without custom settings.
      - Enables and starts the Redis service on the standard port 6379.
    options:
      cache_redis_service_name:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis service to manage.
      cache_redis_package_name:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis package to install.
