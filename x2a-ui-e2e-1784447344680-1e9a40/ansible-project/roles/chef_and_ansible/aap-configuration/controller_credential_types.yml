---
controller_credential_types:
- name: Chef Automate User Credentials
  description: Hardcoded credentials in setup-automate scripts for Chef Automate deployment
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Automate and Chef Infra Server
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Automate and Chef Infra Server
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Apache SSL Certificate
  description: SSL certificates and keys used in Apache configuration
  kind: cloud
  inputs:
    fields:
    - id: ssl_certificate
      type: string
      label: SSL Certificate
      help_text: SSL certificate for Apache HTTPS
    - id: ssl_key
      type: string
      label: SSL Private Key
      secret: true
      help_text: Private key for SSL certificate
    required:
    - ssl_certificate
    - ssl_key
  injectors:
    extra_vars:
      ssl_certificate: !unsafe '{{ ssl_certificate }}'
      ssl_key: !unsafe '{{ ssl_key }}'
