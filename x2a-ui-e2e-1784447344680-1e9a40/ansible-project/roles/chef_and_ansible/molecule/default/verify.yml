---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check Apache configuration files
    - name: Check Apache certificates directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/certs
      register: certs_dir

    - name: Assert certificates directory was created
      ansible.builtin.assert:
        that:
          - certs_dir.stat.exists
          - certs_dir.stat.isdir
        fail_msg: "Apache certificates directory not found"
        success_msg: "Apache certificates directory exists"

    - name: Check SSL certificates exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: cert_files
      loop:
        - /tmp/molecule_test/etc/apache2/certs/apache.key
        - /tmp/molecule_test/etc/apache2/certs/apache.csr
        - /tmp/molecule_test/etc/apache2/certs/apache.crt

    - name: Assert SSL certificates were created
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "SSL certificate file not found"
        success_msg: "SSL certificate file exists"
      loop: "{{ cert_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check virtualhost configuration exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      register: vhost_conf

    - name: Assert virtualhost configuration was created
      ansible.builtin.assert:
        that:
          - vhost_conf.stat.exists
        fail_msg: "Virtualhost configuration not found"
        success_msg: "Virtualhost configuration exists"

    - name: Get virtualhost configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      register: vhost_content

    - name: Assert virtualhost configuration contains expected content
      ansible.builtin.assert:
        that:
          - "'SSLEngine on' in (vhost_content.content | b64decode)"
          - "'SSLCertificateFile' in (vhost_content.content | b64decode)"
          - "'SSLCertificateKeyFile' in (vhost_content.content | b64decode)"
        fail_msg: "Virtualhost configuration does not contain expected SSL settings"
        success_msg: "Virtualhost configuration contains expected SSL settings"

    # Check website files
    - name: Check website directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/www/helloworld
      register: website_dir

    - name: Assert website directory was created
      ansible.builtin.assert:
        that:
          - website_dir.stat.exists
          - website_dir.stat.isdir
        fail_msg: "Website directory not found"
        success_msg: "Website directory exists"

    - name: Check index.html exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/www/helloworld/index.html
      register: index_file

    - name: Assert index.html was created
      ansible.builtin.assert:
        that:
          - index_file.stat.exists
        fail_msg: "index.html not found"
        success_msg: "index.html exists"

    - name: Get index.html content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/www/helloworld/index.html
      register: index_content

    - name: Assert index.html contains expected content
      ansible.builtin.assert:
        that:
          - "'Hello, world!' in (index_content.content | b64decode)"
        fail_msg: "index.html does not contain expected content"
        success_msg: "index.html contains expected content"

    # Check POODLE fix
    - name: Check SSL configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_conf

    - name: Assert SSL configuration file exists
      ansible.builtin.assert:
        that:
          - ssl_conf.stat.exists
        fail_msg: "SSL configuration file not found"
        success_msg: "SSL configuration file exists"

    - name: Get SSL configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_content

    - name: Assert SSL configuration contains POODLE fix
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in (ssl_content.content | b64decode)"
        fail_msg: "SSL configuration does not contain POODLE fix"
        success_msg: "SSL configuration contains POODLE fix"

    # The following checks would normally be performed but can't run in a container
    # They are tagged with molecule-notest
    
    - name: Check Apache is installed and running
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Check SSL module is enabled
      ansible.builtin.command: apache2ctl -M
      register: apache_modules
      changed_when: false
      tags: molecule-notest

    - name: Assert SSL module is enabled
      ansible.builtin.assert:
        that:
          - "'ssl_module' in apache_modules.stdout"
        fail_msg: "SSL module is not enabled"
        success_msg: "SSL module is enabled"
      tags: molecule-notest

    - name: Check website is accessible via HTTPS
      ansible.builtin.uri:
        url: https://localhost/
        validate_certs: false
        return_content: true
      register: website_response
      tags: molecule-notest

    - name: Assert website returns expected content
      ansible.builtin.assert:
        that:
          - "'Hello, world!' in website_response.content"
        fail_msg: "Website does not return expected content"
        success_msg: "Website returns expected content"
      tags: molecule-notest

    - name: Check TLSv1.2 is supported
      ansible.builtin.command: openssl s_client -connect localhost:443 -tls1_2
      register: tls_check
      changed_when: false
      tags: molecule-notest

    - name: Assert TLSv1.2 is supported
      ansible.builtin.assert:
        that:
          - "'CONNECTED' in tls_check.stdout"
        fail_msg: "TLSv1.2 is not supported"
        success_msg: "TLSv1.2 is supported"
      tags: molecule-notest

    - name: Check SSLv3 is disabled
      ansible.builtin.command: openssl s_client -connect localhost:443 -ssl3
      register: ssl3_check
      failed_when: false
      changed_when: false
      tags: molecule-notest

    - name: Assert SSLv3 is disabled
      ansible.builtin.assert:
        that:
          - "ssl3_check.rc != 0 or 'CONNECTED' not in ssl3_check.stdout"
        fail_msg: "SSLv3 is still enabled"
        success_msg: "SSLv3 is disabled"
      tags: molecule-notest