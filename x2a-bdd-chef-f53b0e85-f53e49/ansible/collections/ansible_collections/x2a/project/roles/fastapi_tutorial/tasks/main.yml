---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Ensure application group exists
  ansible.builtin.group:
    name: "{{ fastapi_tutorial_app_group }}"
    state: present

- name: Ensure application user exists
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_app_user }}"
    group: "{{ fastapi_tutorial_app_group }}"
    system: true
    state: present

- name: Install Fedora and RHEL system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install Debian system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Initialize PostgreSQL on Fedora and RHEL
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] == 'RedHat'

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: "{{ fastapi_tutorial_app_user }}"
    group: "{{ fastapi_tutorial_app_group }}"
    mode: "0755"
    recurse: true

- name: Synchronize application repository # noqa: R104,R106 - repository URL and source are trusted role defaults
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repo_url }}"
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - destination is a role default controlled by the operator
    version: "{{ fastapi_tutorial_repo_version }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command executable and paths come from trusted role defaults
  ansible.builtin.command:
    argv:
      - "{{ fastapi_tutorial_python_executable }}"
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}/bin/python" # noqa: R114 - path is derived from role defaults

- name: Install application dependencies # noqa: R113 - requirements and virtualenv paths come from trusted role defaults
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - path is derived from role defaults
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path is derived from role defaults

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_postgresql_service }}"
    enabled: true
    state: started

- name: Check whether the PostgreSQL application role exists # noqa: L039,R101 - credential variables are validated by the preceding task; command arguments use validated role inputs
  ansible.builtin.shell:
    cmd: >-
      psql -h {{ db_host | quote }} -U postgres -d postgres
      -tAc "SELECT 1 FROM pg_roles WHERE rolname = :'role_name';"
      -v role_name={{ db_username | quote }}
  changed_when: false
  register: fastapi_tutorial_role_exists
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL application role # noqa: L039,R101 - credential variables are validated by the preceding task; command arguments use validated role inputs and the prior existence check
  ansible.builtin.shell:
    cmd: >-
      psql -h {{ db_host | quote }} -U postgres -d postgres
      -c "CREATE ROLE :\"role_name\" LOGIN PASSWORD :'role_password';"
      -v role_name={{ db_username | quote }}
      -v role_password={{ db_password | quote }}
  when: fastapi_tutorial_role_exists.stdout | trim != '1'
  register: fastapi_tutorial_create_role
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the application database exists # noqa: L039,R101 - credential variables are validated by the preceding task; command arguments use validated role inputs
  ansible.builtin.shell:
    cmd: >-
      psql -h {{ db_host | quote }} -U postgres -d postgres
      -tAc "SELECT 1 FROM pg_database WHERE datname = :'database_name';"
      -v database_name={{ db_name | quote }}
  changed_when: false
  register: fastapi_tutorial_database_exists
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create application database # noqa: L039,R101 - credential variables are validated by the preceding task; command arguments use validated role inputs and the prior existence check
  ansible.builtin.shell:
    cmd: >-
      psql -h {{ db_host | quote }} -U postgres -d postgres
      -c "CREATE DATABASE :\"database_name\" OWNER :\"role_name\";"
      -v database_name={{ db_name | quote }}
      -v role_name={{ db_username | quote }}
  when: fastapi_tutorial_database_exists.stdout | trim != '1'
  register: fastapi_tutorial_create_database
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant application database privileges # noqa: L039,R101 - credential variables are validated by the preceding task; command arguments use validated role inputs
  ansible.builtin.shell:
    cmd: >-
      psql -h {{ db_host | quote }} -U postgres -d {{ db_name | quote }}
      -c "GRANT ALL PRIVILEGES ON DATABASE :\"database_name\" TO :\"role_name\";"
      -v database_name={{ db_name | quote }}
      -v role_name={{ db_username | quote }}
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy application environment configuration # noqa: L039 - credential variables are validated by the preceding task
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path is derived from a role default
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}/{{ db_name }}
    owner: "{{ fastapi_tutorial_app_user }}"
    group: "{{ fastapi_tutorial_app_group }}"
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy FastAPI systemd unit
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_service_unit }}" # noqa: R114 - path is a role default controlled by the operator
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User={{ fastapi_tutorial_app_user }}
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: fastapi_tutorial_unit_file

- name: Reload systemd after unit changes # noqa: L039 - variable is registered by the immediately preceding task
  ansible.builtin.systemd:
    daemon_reload: true
  when: fastapi_tutorial_unit_file.changed

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
