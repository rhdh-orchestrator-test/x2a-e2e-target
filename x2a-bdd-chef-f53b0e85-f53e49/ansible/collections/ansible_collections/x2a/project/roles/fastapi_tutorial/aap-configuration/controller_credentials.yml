---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials for the FastAPI application to authenticate to its PostgreSQL database. The database password is currently hardcoded and must be 
      migrated to Ansible Vault.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      db_host: "{{ db_host }}"
      db_name: "{{ db_name }}"
