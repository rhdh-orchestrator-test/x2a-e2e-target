---
- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload sysctl security configuration
  ansible.builtin.command:
    cmd: /sbin/sysctl -p /etc/sysctl.d/99-security.conf
  changed_when: true

- name: Restart SSH # noqa: L039 - variable comes from role defaults or inventory
  ansible.builtin.service:
    name: "{{ nginx_multisite_ssh_service | default('ssh') }}"
    state: restarted
