---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
      - "{{ 'procps' if ansible_facts.os_family == 'Debian' else 'procps-ng' }}"
    state: present

- name: Deploy fail2ban jail configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Set UFW default incoming policy
  ansible.posix.ufw:
    default: deny
    direction: incoming
  when: nginx_multisite_ufw_enabled | bool

- name: Allow SSH through UFW
  ansible.posix.ufw:
    rule: allow
    port: "22"
    proto: tcp
  when: nginx_multisite_ufw_enabled | bool

- name: Allow HTTP through UFW
  ansible.posix.ufw:
    rule: allow
    port: "80"
    proto: tcp
  when: nginx_multisite_ufw_enabled | bool

- name: Allow HTTPS through UFW
  ansible.posix.ufw:
    rule: allow
    port: "443"
    proto: tcp
  when: nginx_multisite_ufw_enabled | bool

- name: Enable UFW
  ansible.posix.ufw:
    state: enabled
  when: nginx_multisite_ufw_enabled | bool

- name: Deploy kernel security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload sysctl security configuration

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin\s+
    line: PermitRootLogin no
    state: present
  when: nginx_multisite_disable_root_login | bool
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication\s+
    line: PasswordAuthentication no
    state: present
  when: not (nginx_multisite_password_auth | bool)
  notify: Restart SSH
