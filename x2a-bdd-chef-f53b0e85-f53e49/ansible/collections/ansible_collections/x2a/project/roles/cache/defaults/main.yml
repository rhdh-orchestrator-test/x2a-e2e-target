---
# Redis cache configuration.
cache_secure_logging: true
cache_redis_port: 6379
cache_redis_pid_directory: /run/redis
cache_redis_log_directory: /var/log/redis
cache_redis_log_owner: redis
cache_redis_log_group: redis
cache_redis_log_mode: "0755"
cache_redis_remove_replication_directives: true
cache_redis_replication_directives:
  - replica-serve-stale-data
  - replica-read-only
  - repl-ping-replica-period
  - client-output-buffer-limit
  - replica-priority
