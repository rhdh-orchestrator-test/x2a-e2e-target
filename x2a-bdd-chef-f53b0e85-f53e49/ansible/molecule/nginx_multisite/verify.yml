---
# Unsupported: nginx -T, diagnostic logs, detailed nginx directives, and individual sysctl values
# have no explicit expected values in the pre-flight checks.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are running
      ansible.builtin.assert:
        that:
          - "ansible_facts['services']['nginx.service']['state'] == 'running'"
          - "ansible_facts['services']['fail2ban.service']['state'] == 'running'"

    - name: Check enabled services
      ansible.builtin.command:
        argv: [systemctl, is-enabled, "{{ item_service }}"]
      changed_when: false
      loop:
        - nginx
        - fail2ban
      loop_control:
        loop_var: item_service
      register: item_enabled_services

    - name: Assert nginx and fail2ban are enabled
      ansible.builtin.assert:
        that:
          - item_enabled_service['rc'] == 0
          - item_enabled_service['stdout'] | trim == 'enabled'
      loop: "{{ item_enabled_services['results'] }}"
      loop_control:
        loop_var: item_enabled_service

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv: [nginx, -t]
      changed_when: false
      register: item_nginx_test

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that: ["item_nginx_test['rc'] == 0"]

    - name: Check nginx PID
      ansible.builtin.stat:
        path: /run/nginx.pid
      register: item_nginx_pid

    - name: Assert nginx PID exists
      ansible.builtin.assert:
        that: ["item_nginx_pid['stat']['exists']"]

    - name: Check firewall status
      ansible.builtin.command:
        argv: [ufw, status, verbose]
      changed_when: false
      register: item_ufw

    - name: Assert firewall is active and allows required ports
      ansible.builtin.assert:
        that:
          - item_ufw['rc'] == 0
          - "'Status: active' in item_ufw['stdout']"
          - "'22/tcp' in item_ufw['stdout']"
          - "'80/tcp' in item_ufw['stdout']"
          - "'443/tcp' in item_ufw['stdout']"

    - name: Check fail2ban status
      ansible.builtin.command:
        argv: [fail2ban-client, status]
      changed_when: false
      register: item_fail2ban

    - name: Assert fail2ban is responding
      ansible.builtin.assert:
        that: ["item_fail2ban['rc'] == 0"]

    - name: Check required fail2ban jails
      ansible.builtin.command:
        argv: [fail2ban-client, status, "{{ item_jail }}"]
      changed_when: false
      loop:
        - sshd
        - nginx-http-auth
        - nginx-limit-req
        - nginx-botsearch
      loop_control:
        loop_var: item_jail
      register: item_jails

    - name: Assert required fail2ban jails are available
      ansible.builtin.assert:
        that: ["item_jail_result['rc'] == 0"]
      loop: "{{ item_jails['results'] }}"
      loop_control:
        loop_var: item_jail_result

    - name: Check SSH hardening settings
      ansible.builtin.command:
        argv: [grep, -E, "^{{ item_ssh_setting }}$", /etc/ssh/sshd_config]
      changed_when: false
      loop:
        - PermitRootLogin no
        - PasswordAuthentication no
      loop_control:
        loop_var: item_ssh_setting
      register: item_ssh_settings

    - name: Assert SSH hardening settings are present
      ansible.builtin.assert:
        that: ["item_ssh_setting_result['rc'] == 0"]
      loop: "{{ item_ssh_settings['results'] }}"
      loop_control:
        loop_var: item_ssh_setting_result

    - name: Validate SSH daemon configuration
      ansible.builtin.command:
        argv: [sshd, -t]
      changed_when: false
      register: item_sshd_test

    - name: Assert SSH daemon configuration is valid
      ansible.builtin.assert:
        that: ["item_sshd_test['rc'] == 0"]

    - name: Check site directories and content files
      ansible.builtin.stat:
        path: "{{ item_site_path['path'] }}"
      loop:
        - {path: /opt/server/test}
        - {path: /opt/server/test/index.html}
        - {path: /opt/server/ci}
        - {path: /opt/server/ci/index.html}
        - {path: /opt/server/status}
        - {path: /opt/server/status/index.html}
      loop_control:
        loop_var: item_site_path
      register: item_site_paths

    - name: Assert site directories and content files exist
      ansible.builtin.assert:
        that: ["item_site_result['stat']['exists']"]
      loop: "{{ item_site_paths['results'] }}"
      loop_control:
        loop_var: item_site_result

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_site_link['path'] }}"
      loop:
        - {path: /etc/nginx/sites-enabled/test.cluster.local}
        - {path: /etc/nginx/sites-enabled/ci.cluster.local}
        - {path: /etc/nginx/sites-enabled/status.cluster.local}
      loop_control:
        loop_var: item_site_link
      register: item_site_links

    - name: Assert enabled site links exist
      ansible.builtin.assert:
        that: ["item_site_link_result['stat']['islnk']"]
      loop: "{{ item_site_links['results'] }}"
      loop_control:
        loop_var: item_site_link_result

    - name: Check default site
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_site

    - name: Assert default site is absent
      ansible.builtin.assert:
        that: ["not item_default_site['stat']['exists']"]

    - name: Check TLS certificates and keys
      ansible.builtin.stat:
        path: "{{ item_tls_file['path'] }}"
      loop:
        - {path: /etc/ssl/certs/test.cluster.local.crt}
        - {path: /etc/ssl/private/test.cluster.local.key}
        - {path: /etc/ssl/certs/ci.cluster.local.crt}
        - {path: /etc/ssl/private/ci.cluster.local.key}
        - {path: /etc/ssl/certs/status.cluster.local.crt}
        - {path: /etc/ssl/private/status.cluster.local.key}
      loop_control:
        loop_var: item_tls_file
      register: item_tls_files

    - name: Assert TLS certificates and keys exist
      ansible.builtin.assert:
        that: ["item_tls_result['stat']['exists']"]
      loop: "{{ item_tls_files['results'] }}"
      loop_control:
        loop_var: item_tls_result

    - name: Check private key metadata
      ansible.builtin.stat:
        path: "{{ item_key_file['path'] }}"
      loop:
        - {path: /etc/ssl/private/test.cluster.local.key}
        - {path: /etc/ssl/private/ci.cluster.local.key}
        - {path: /etc/ssl/private/status.cluster.local.key}
      loop_control:
        loop_var: item_key_file
      register: item_key_files

    - name: Assert private keys have expected metadata
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['pw_name'] == 'root'
          - item_key_result['stat']['gr_name'] == 'ssl-cert'
          - item_key_result['stat']['mode'] == '0640'
      loop: "{{ item_key_files['results'] }}"
      loop_control:
        loop_var: item_key_result

    - name: Check certificate common names
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ item_certificate['path'] }}", -noout, -subject]
      changed_when: false
      loop:
        - {path: /etc/ssl/certs/test.cluster.local.crt, name: test.cluster.local}
        - {path: /etc/ssl/certs/ci.cluster.local.crt, name: ci.cluster.local}
        - {path: /etc/ssl/certs/status.cluster.local.crt, name: status.cluster.local}
      loop_control:
        loop_var: item_certificate
      register: item_certificate_subjects

    - name: Assert certificate common names match site names
      ansible.builtin.assert:
        that:
          - item_certificate_result['rc'] == 0
          - "('CN = ' ~ item_certificate_result['item']['name']) in item_certificate_result['stdout']"
      loop: "{{ item_certificate_subjects['results'] }}"
      loop_control:
        loop_var: item_certificate_result

    - name: Check HTTP and HTTPS endpoints
      ansible.builtin.uri:
        url: "{{ item_endpoint['scheme'] }}://127.0.0.1/"
        headers:
          Host: "{{ item_endpoint['host'] }}"
        validate_certs: false
        follow_redirects: none
        status_code: [200, 301]
      loop:
        - {host: test.cluster.local, scheme: http}
        - {host: test.cluster.local, scheme: https}
        - {host: ci.cluster.local, scheme: http}
        - {host: ci.cluster.local, scheme: https}
        - {host: status.cluster.local, scheme: http}
        - {host: status.cluster.local, scheme: https}
      loop_control:
        loop_var: item_endpoint
      register: item_endpoints

    - name: Assert HTTP redirects and HTTPS responds
      ansible.builtin.assert:
        that:
          - "(item_endpoint_result['item']['scheme'] == 'http' and item_endpoint_result['status'] == 301) or (item_endpoint_result['item']['scheme'] == 'https' and item_endpoint_result['status'] == 200)"
      loop: "{{ item_endpoints['results'] }}"
      loop_control:
        loop_var: item_endpoint_result
