---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create SSL certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}" # noqa: R114 - path from role defaults
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create SSL private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}" # noqa: R114 - path from role defaults
    owner: root
    group: ssl-cert
    mode: "0710"
    state: directory

- name: Generate self-signed site certificates # noqa: L073 - literal shell script indentation is required
  ansible.builtin.shell: # noqa: R101 - certificate paths and site name come from role-defined site data
    cmd: |
      if [ ! -f "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt" ] || \
         [ ! -f "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key" ]; then
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key" \
          -out "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt" \
          -subj "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl_site['key'] }}/emailAddress=admin@example.com"
        chmod 640 "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key"
        chown root:ssl-cert "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key"
        echo created
      fi
    executable: /bin/sh
  when: item_ssl_site['value']['ssl_enabled']
  changed_when: "'created' in nginx_multisite_certificate_result.stdout"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  register: nginx_multisite_certificate_result
  notify: Reload nginx
