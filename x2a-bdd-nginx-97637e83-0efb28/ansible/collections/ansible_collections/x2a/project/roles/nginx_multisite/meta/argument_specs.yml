---
argument_specs:
  main:
    short_description: Configure a secure nginx multisite installation
    description:
      - Installs and configures nginx, fail2ban, UFW, SSH hardening, SSL certificates, and three static virtual hosts.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Site definitions containing document roots and SSL enablement.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory where site certificates are stored.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory where site private keys are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban security controls are enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether root SSH login is disabled.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is permitted.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Toggle for secure logging of sensitive operations.
