---
controller_credential_types:
  - name: PostgreSQL Database Password
    description: Password for the PostgreSQL user and application database connection.
    kind: cloud
    inputs:
      fields:
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL user fastapi; store it in Ansible Vault and use it when creating the database user and rendering DATABASE_URL.
      required:
        - db_password
    injectors:
      extra_vars:
        db_password: !unsafe "{{ db_password }}"
