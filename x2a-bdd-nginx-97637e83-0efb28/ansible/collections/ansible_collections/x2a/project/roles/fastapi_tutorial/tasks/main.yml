---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI and PostgreSQL packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create FastAPI application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize FastAPI tutorial repository
  ansible.builtin.git: # noqa: R104, R106 - repository source is a role-controlled URL
    repo: "{{ fastapi_tutorial_repo }}"
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - destination is a role-defined application path
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment
  ansible.builtin.command: # noqa: R101 - command arguments come from trusted role defaults
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}/bin/python" # noqa: R114 - path is the role-defined virtual environment

- name: Install Python dependencies
  ansible.builtin.pip: # noqa: R113 - requirements target is the role-defined application requirements file
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_venv_dir }}"

- name: Ensure PostgreSQL service is enabled and started
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the FastAPI PostgreSQL user exists
  ansible.builtin.command: # noqa: R101 - SQL uses trusted role variables
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ fastapi_tutorial_db_user }}'
  changed_when: false
  register: fastapi_tutorial_db_user_check
  become: true # noqa: R108 - PostgreSQL inspection must run as the postgres account
  become_user: postgres

- name: Create the FastAPI PostgreSQL user  # noqa: L039 - variable is a role credential default
  ansible.builtin.command: # noqa: R101 - SQL uses trusted role variables
    argv:
      - psql
      - -c
      - CREATE USER {{ fastapi_tutorial_db_user }} WITH PASSWORD '{{ db_password }}'
  when: fastapi_tutorial_db_user_check.stdout | trim != '1'
  changed_when: true
  become: true # noqa: R108 - PostgreSQL user creation must run as the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the FastAPI database exists
  ansible.builtin.command: # noqa: R101 - SQL uses trusted role variables
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ fastapi_tutorial_db_name }}'
  changed_when: false
  register: fastapi_tutorial_db_check
  become: true # noqa: R108 - PostgreSQL inspection must run as the postgres account
  become_user: postgres

- name: Create the FastAPI database  # noqa: L039 - variable is registered by the preceding database check
  ansible.builtin.command: # noqa: R101 - command arguments come from trusted role variables
    argv:
      - createdb
      - -O
      - "{{ fastapi_tutorial_db_user }}"
      - "{{ fastapi_tutorial_db_name }}"
  when: fastapi_tutorial_db_check.stdout | trim != '1'
  changed_when: true
  become: true # noqa: R108 - database creation must run as the postgres account
  become_user: postgres

- name: Grant privileges on the FastAPI database
  ansible.builtin.command: # noqa: R101 - SQL uses trusted role variables
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ fastapi_tutorial_db_name }} TO {{ fastapi_tutorial_db_user }}
  changed_when: false
  become: true # noqa: R108 - PostgreSQL privilege management must run as the postgres account
  become_user: postgres

- name: Write FastAPI environment configuration  # noqa: L039 - credential variable is a role default
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path is the role-defined application directory
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ fastapi_tutorial_db_user }}:{{ db_password }}@{{ fastapi_tutorial_db_host }}:{{ fastapi_tutorial_db_port }}/{{ fastapi_tutorial_db_name }}
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI systemd unit
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_service_unit }}" # noqa: R114 - unit path is a fixed role default
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host {{ fastapi_tutorial_bind_address }} --port {{ fastapi_tutorial_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: fastapi_tutorial_unit

- name: Reload systemd and ensure FastAPI service is enabled and started
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    daemon_reload: "{{ fastapi_tutorial_unit.changed }}" # noqa: M005 - registered result is intentionally used to conditionally reload systemd
    enabled: true
    state: started
