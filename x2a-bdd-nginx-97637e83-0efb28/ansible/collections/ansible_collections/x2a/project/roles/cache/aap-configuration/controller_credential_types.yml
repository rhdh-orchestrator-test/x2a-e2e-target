---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis instance listening on TCP port 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis clients to authenticate to the Redis server; store it in a protected AAP credential or secret manager.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
