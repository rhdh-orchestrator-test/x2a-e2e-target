---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          # Generated by Ansible - do not edit manually

          # Network
          bind 127.0.0.1
          port 6379

          # General
          daemonize yes
          supervised systemd
          pidfile /var/run/redis/redis-server.pid

          # Logging
          loglevel notice
          logfile /tmp/molecule_test/var/log/redis/redis-server.log

          # Snapshotting
          save 900 1
          save 300 10
          save 60 10000

          # Database
          dir /var/lib/redis
          dbfilename dump.rdb

          # Security
          requirepass redis_secure_password_123

          # Memory management
          maxmemory-policy allkeys-lru

          # Append only file
          appendonly yes
          appendfilename "appendonly.aof"
          appendfsync everysec

          # Slow log
          slowlog-log-slower-than 10000
          slowlog-max-len 128

          # Client output buffer limits
          client-output-buffer-limit normal 0 0 0
          client-output-buffer-limit slave 256mb 64mb 60
          client-output-buffer-limit pubsub 32mb 8mb 60

          # TCP keepalive
          tcp-keepalive 300

          # Timeout
          timeout 0
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create Redis log file
      ansible.builtin.copy:
        content: |
          # Redis server log
          1:M 01 Jan 2024 00:00:00.000 # Server initialized
          1:M 01 Jan 2024 00:00:00.001 # Ready to accept connections
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"
        backup: true

    - name: Create Redis PID file
      ansible.builtin.copy:
        content: "12345"
        dest: /tmp/molecule_test/var/run/redis/redis-server.pid
        mode: "0644"
        backup: true

    - name: Create Redis database files
      ansible.builtin.copy:
        content: "REDIS0009"
        dest: "{{ item_db }}"
        mode: "0644"
        backup: true
      loop:
        - /tmp/molecule_test/var/lib/redis/dump.rdb
        - /tmp/molecule_test/var/lib/redis/appendonly.aof
      loop_control:
        loop_var: item_db