---
- name: Restart apache2
  ansible.builtin.service:
    name: apache2
    state: restarted
- name: Restart apache
  ansible.builtin.service:
    name: apache2
    state: restarted
- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
- name: Restart chef-automate
  ansible.builtin.command:
    cmd: chef-automate restart
  changed_when: true
