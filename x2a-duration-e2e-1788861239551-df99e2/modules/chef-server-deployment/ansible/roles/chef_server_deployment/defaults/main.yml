---
chef_hostname: automate.chef.lab
chef_username: admin
chef_user_fullname: Chef Administrator
chef_user_email: admin@chef.lab
chef_user_password: changeme
chef_org_name: lab
chef_org_fullname: Chef Lab Organization
chef_products:
  - automate
  - infra-server
chef_accept_license: false
chef_vm_max_map_count: 262144
chef_vm_dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: /usr/local/bin/chef-automate
apache_ssl_cert_path: /etc/apache2/certs/apache.crt
apache_ssl_key_path: /etc/apache2/certs/apache.key
apache_ssl_csr_path: /etc/apache2/certs/apache.csr
apache_certs_dir: /etc/apache2/certs
apache_vhost_name: helloworld
apache_document_root: /var/www/helloworld
apache_vhost_port: 443
ssl_protocol: -all +TLSv1.2
