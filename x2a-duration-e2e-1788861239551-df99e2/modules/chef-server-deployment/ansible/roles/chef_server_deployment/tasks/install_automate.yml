---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
    timeout: 300
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: /tmp/chef-automate_linux_amd64.zip
    dest: /tmp
    remote_src: true
    creates: /tmp/chef-automate
- name: Install Chef Automate CLI to system path
  ansible.builtin.copy:
    src: /tmp/chef-automate
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
    remote_src: true
    backup: true
- name: Build Chef Automate deploy command
  ansible.builtin.set_fact:
    chef_deploy_cmd: "{{ chef_automate_cli_path }} deploy {% for product in chef_products %}--product {{ product }} {% endfor %} {% if chef_accept_license %}--accept-terms-and-mlsa=true{%
      endif %}"
- name: Deploy Chef Automate with specified products
  ansible.builtin.command:
    cmd: "{{ chef_deploy_cmd }}"
    creates: /hab/svc/deployment-service
  register: chef_automate_deploy
  changed_when: chef_automate_deploy.rc == 0
- name: Clean up temporary files
  ansible.builtin.file:
    path: "{{ item_cleanup }}"
    state: absent
  loop:
    - /tmp/chef-automate_linux_amd64.zip
    - /tmp/chef-automate
  loop_control:
    loop_var: item_cleanup
