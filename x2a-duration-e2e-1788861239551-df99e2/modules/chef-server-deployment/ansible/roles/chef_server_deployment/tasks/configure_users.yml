---
- name: Wait for Chef Server to be ready
  ansible.builtin.wait_for:
    path: /opt/opscode/bin/chef-server-ctl
    timeout: 300
  when: chef_products is defined and 'infra-server' in chef_products
- name: Create Chef Server user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_username }} "{{ chef_user_fullname }}" {{ chef_user_email }} "{{ chef_user_password }}" --filename {{
      chef_user_pem_filename }}
    creates: "{{ chef_user_pem_filename }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  no_log: true
  when: chef_products is defined and 'infra-server' in chef_products
- name: Create Chef Server organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_fullname }}" --association_user {{ chef_username }} --filename {{ chef_org_pem_filename }}
    creates: "{{ chef_org_pem_filename }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
  when: chef_products is defined and 'infra-server' in chef_products
- name: Set proper permissions on user PEM file
  ansible.builtin.file:
    path: "{{ chef_user_pem_filename }}"
    mode: "0600"
    state: file
  when: chef_user_pem_filename is defined and chef_products is defined and 'infra-server' in chef_products
- name: Set proper permissions on organization PEM file
  ansible.builtin.file:
    path: "{{ chef_org_pem_filename }}"
    mode: "0600"
    state: file
  when: chef_org_pem_filename is defined and chef_products is defined and 'infra-server' in chef_products
