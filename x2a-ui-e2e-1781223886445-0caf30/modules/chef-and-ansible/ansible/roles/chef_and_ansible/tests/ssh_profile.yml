- name: Verify SSH security compliance
  hosts: localhost
  gather_facts: false
  tasks:
  - name: Check if SSH server is installed
    ansible.builtin.package_facts:
      manager: auto
    register: pkg_facts
  - name: Set SSH installed fact
    ansible.builtin.set_fact:
      ssh_installed: '{{ ''openssh-server'' in pkg_facts.packages }}'
  - name: Check SSH root login configuration
    ansible.builtin.shell: 'grep "^PermitRootLogin" /etc/ssh/sshd_config | awk ''{print $2}''

      '
    register: ssh_root_login
    changed_when: false
    ignore_errors: true
    when: ssh_installed
  - name: Verify SSH root login is not set to 'yes'
    ansible.builtin.assert:
      that:
      - ssh_root_login.stdout != 'yes'
      fail_msg: 'FAILED: SSH root login is enabled. This violates security control SRG-OS-000112. The PermitRootLogin parameter specifies if the root user can log
        in using ssh. Disallowing root logins over SSH requires system admins to authenticate using their own individual account, then escalating to root via sudo
        or su. This in turn limits opportunity for non-repudiation and provides a clear audit trail in the event of a security incident.

        '
      success_msg: 'PASSED: SSH root login is not enabled. This satisfies security control SRG-OS-000112.

        '
    when: ssh_installed
    tags:
    - SRG-OS-000112
    - V-38607
    - SV-50408r1_rule
    - CAT_I
    - RHEL-08-000227
    - CCI-000774
