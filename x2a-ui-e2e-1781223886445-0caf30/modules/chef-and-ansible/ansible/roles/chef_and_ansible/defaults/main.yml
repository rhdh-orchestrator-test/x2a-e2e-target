---
https_port: 443
https_document_root: /var/www/html
https_cert_path: /etc/ssl/certs/server.crt
https_key_path: /etc/ssl/private/server.key
ssl_protocols:
  - TLSv1.2
  - TLSv1.3
ssl_ciphers: HIGH:!aNULL:!MD5:!3DES
disable_ssl3: true
disable_tls1: true
disable_tls1_1: true
server_name: localhost
index_file: index.html
