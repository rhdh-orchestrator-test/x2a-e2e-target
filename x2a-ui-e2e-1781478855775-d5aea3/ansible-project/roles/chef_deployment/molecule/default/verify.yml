---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    chef_hostname: automate.chef.lab
    chef_username: jtonello
    chef_orgname: lab
    chef_userfilename: "{{ chef_username }}.pem"
    chef_orgfilename: "{{ chef_orgname }}-validator.pem"
  tasks:
    # Hostname verification
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == chef_hostname
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Hosts file verification
    - name: Check hosts file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hosts
      register: hosts_file

    - name: Assert hosts file was created
      ansible.builtin.assert:
        that:
          - hosts_file.stat.exists
          - hosts_file.stat.isreg
        fail_msg: "Hosts file not found"
        success_msg: "Hosts file exists"

    - name: Get hosts file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hosts
      register: hosts_content
      when: hosts_file.stat.exists

    - name: Assert hosts file contains hostname entry
      ansible.builtin.assert:
        that:
          - (hosts_content.content | b64decode) is search('127.0.1.1 ' + chef_hostname)
        fail_msg: "Hosts file doesn't contain hostname entry"
        success_msg: "Hosts file contains hostname entry"
      when: hosts_file.stat.exists

    # System parameters verification
    - name: Check vm.max_map_count parameter file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_file

    - name: Assert vm.max_map_count parameter file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
        fail_msg: "vm.max_map_count parameter file not found"
        success_msg: "vm.max_map_count parameter file exists"

    - name: Get vm.max_map_count parameter content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert vm.max_map_count parameter is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "262144"
        fail_msg: "vm.max_map_count parameter not set correctly"
        success_msg: "vm.max_map_count parameter set correctly"
      when: max_map_count_file.stat.exists

    - name: Check vm.dirty_expire_centisecs parameter file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_file

    - name: Assert vm.dirty_expire_centisecs parameter file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_centisecs_file.stat.exists
        fail_msg: "vm.dirty_expire_centisecs parameter file not found"
        success_msg: "vm.dirty_expire_centisecs parameter file exists"

    - name: Get vm.dirty_expire_centisecs parameter content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_content
      when: dirty_expire_centisecs_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs parameter is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
        fail_msg: "vm.dirty_expire_centisecs parameter not set correctly"
        success_msg: "vm.dirty_expire_centisecs parameter set correctly"
      when: dirty_expire_centisecs_file.stat.exists

    # Chef Automate CLI verification
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef deployment verification
    - name: Check Chef deployment directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: hab_dir

    - name: Assert Chef deployment directory exists
      ansible.builtin.assert:
        that:
          - hab_dir.stat.exists
          - hab_dir.stat.isdir
        fail_msg: "Chef deployment directory not found"
        success_msg: "Chef deployment directory exists"

    # PEM files verification
    - name: Check user PEM file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_userfilename }}"
      register: user_pem_file

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem_file.stat.exists
          - user_pem_file.stat.isreg
        fail_msg: "User PEM file not found"
        success_msg: "User PEM file exists"

    - name: Check organization validator PEM file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_orgfilename }}"
      register: org_pem_file

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_pem_file.stat.exists
          - org_pem_file.stat.isreg
        fail_msg: "Organization validator PEM file not found"
        success_msg: "Organization validator PEM file exists"

    # Chef server status verification (can't run in container)
    - name: Check Chef server status
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-server-status
      register: chef_server_status_file
      tags: molecule-notest

    - name: Assert Chef server status file exists
      ansible.builtin.assert:
        that:
          - chef_server_status_file.stat.exists
        fail_msg: "Chef server status file not found"
        success_msg: "Chef server status file exists"
      tags: molecule-notest

    # Chef Automate status verification (can't run in container)
    - name: Check Chef Automate status
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate-status
      register: chef_automate_status_file
      tags: molecule-notest

    - name: Assert Chef Automate status file exists
      ansible.builtin.assert:
        that:
          - chef_automate_status_file.stat.exists
        fail_msg: "Chef Automate status file not found"
        success_msg: "Chef Automate status file exists"
      tags: molecule-notest

    # User verification (can't run in container)
    - name: Check user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-server-user-list
      register: user_list_file
      tags: molecule-notest

    - name: Assert user list file exists
      ansible.builtin.assert:
        that:
          - user_list_file.stat.exists
        fail_msg: "User list file not found"
        success_msg: "User list file exists"
      tags: molecule-notest

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/chef-server-user-list
      register: user_list_content
      when: user_list_file.stat.exists
      tags: molecule-notest

    - name: Assert user exists in user list
      ansible.builtin.assert:
        that:
          - (user_list_content.content | b64decode) is search(chef_username)
        fail_msg: "User not found in user list"
        success_msg: "User found in user list"
      when: user_list_file.stat.exists
      tags: molecule-notest

    # Organization verification (can't run in container)
    - name: Check organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-server-org-list
      register: org_list_file
      tags: molecule-notest

    - name: Assert organization list file exists
      ansible.builtin.assert:
        that:
          - org_list_file.stat.exists
        fail_msg: "Organization list file not found"
        success_msg: "Organization list file exists"
      tags: molecule-notest

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/chef-server-org-list
      register: org_list_content
      when: org_list_file.stat.exists
      tags: molecule-notest

    - name: Assert organization exists in organization list
      ansible.builtin.assert:
        that:
          - (org_list_content.content | b64decode) is search(chef_orgname)
        fail_msg: "Organization not found in organization list"
        success_msg: "Organization found in organization list"
      when: org_list_file.stat.exists
      tags: molecule-notest

    # Network listening verification (can't run in container)
    - name: Check network ports file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/ss-output
      register: ss_output_file
      tags: molecule-notest

    - name: Assert network ports file exists
      ansible.builtin.assert:
        that:
          - ss_output_file.stat.exists
        fail_msg: "Network ports file not found"
        success_msg: "Network ports file exists"
      tags: molecule-notest

    - name: Get network ports content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/ss-output
      register: ss_output_content
      when: ss_output_file.stat.exists
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - (ss_output_content.content | b64decode) is search('0.0.0.0:443')
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      when: ss_output_file.stat.exists
      tags: molecule-notest

    # Web interface accessibility verification (can't run in container)
    - name: Check web interface response file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/web-response
      register: web_response_file
      tags: molecule-notest

    - name: Assert web interface response file exists
      ansible.builtin.assert:
        that:
          - web_response_file.stat.exists
        fail_msg: "Web interface response file not found"
        success_msg: "Web interface response file exists"
      tags: molecule-notest

    # API accessibility verification (can't run in container)
    - name: Check API response file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/api-response
      register: api_response_file
      tags: molecule-notest

    - name: Assert API response file exists
      ansible.builtin.assert:
        that:
          - api_response_file.stat.exists
        fail_msg: "API response file not found"
        success_msg: "API response file exists"
      tags: molecule-notest