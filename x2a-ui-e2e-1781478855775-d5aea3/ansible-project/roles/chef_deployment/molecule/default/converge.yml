---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    chef_hostname: automate.chef.lab
    chef_username: jtonello
    chef_orgname: lab
    chef_userfilename: "{{ chef_username }}.pem"
    chef_orgfilename: "{{ chef_orgname }}-validator.pem"
    user_password: molecule_test_password
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/proc/sys/vm

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_hostname }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate hosts file
    - name: Create hosts file
      ansible.builtin.copy:
        content: |
          127.0.0.1 localhost
          127.0.1.1 {{ chef_hostname }}
        dest: "/tmp/molecule_test/etc/hosts"
        mode: "0644"

    # Simulate sysctl parameters
    - name: Create sysctl parameter files
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "/tmp/molecule_test/proc/sys/vm/{{ item.name }}"
        mode: "0644"
      loop:
        - { name: "max_map_count", value: "262144" }
        - { name: "dirty_expire_centisecs", value: "20000" }

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.file:
        path: "/tmp/molecule_test/hab"
        state: directory
        mode: "0755"

    # Simulate Chef user PEM file
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAu5Vyl/otfS9clE8V/J4tUcBBm8HpT5IQ/GGwLxf9eQjRzQnk
          MOCK_KEY_CONTENT_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/{{ chef_userfilename }}"
        mode: "0600"

    # Simulate Chef organization validator PEM file
    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAu5Vyl/otfS9clE8V/J4tUcBBm8HpT5IQ/GGwLxf9eQjRzQnk
          MOCK_ORG_KEY_CONTENT_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/{{ chef_orgfilename }}"
        mode: "0600"

    # Simulate Chef server control output
    - name: Create chef-server-ctl user-list output file
      ansible.builtin.copy:
        content: "{{ chef_username }}\nadmin\n"
        dest: "/tmp/molecule_test/chef-server-user-list"
        mode: "0644"

    - name: Create chef-server-ctl org-list output file
      ansible.builtin.copy:
        content: "{{ chef_orgname }}\nchef\n"
        dest: "/tmp/molecule_test/chef-server-org-list"
        mode: "0644"

    # Simulate Chef server status
    - name: Create chef-server-ctl status output file
      ansible.builtin.copy:
        content: |
          run: service_name: running
          log: service_name: running
          postgresql: running
          nginx: running
        dest: "/tmp/molecule_test/chef-server-status"
        mode: "0644"

    # Simulate Chef Automate status
    - name: Create chef-automate status output file
      ansible.builtin.copy:
        content: |
          Service: deployment-service
          Status: running
          Service: automate-postgresql
          Status: running
          Service: automate-elasticsearch
          Status: running
          Service: automate-nginx
          Status: running
        dest: "/tmp/molecule_test/chef-automate-status"
        mode: "0644"

    # Simulate network ports
    - name: Create network ports file
      ansible.builtin.copy:
        content: |
          tcp   LISTEN     0      128    0.0.0.0:443               0.0.0.0:*     users:(("nginx",pid=12345,fd=6))
        dest: "/tmp/molecule_test/ss-output"
        mode: "0644"

    # Simulate web interface response
    - name: Create web interface response file
      ansible.builtin.copy:
        content: "<html><body>Chef Automate Web Interface</body></html>"
        dest: "/tmp/molecule_test/web-response"
        mode: "0644"

    # Simulate API response
    - name: Create API response file
      ansible.builtin.copy:
        content: '{"name":"{{ chef_orgname }}","full_name":"Chef Lab"}'
        dest: "/tmp/molecule_test/api-response"
        mode: "0644"