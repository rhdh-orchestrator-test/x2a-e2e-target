---
- name: Ensure chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
- name: Wait for Chef server to be fully operational
  ansible.builtin.pause:
    seconds: 30
  when: chef_server_ctl_check.rc != 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_username }}  {{ chef_longusername }}  {{ chef_useremail }}  "{{ user_password }}"  --filename {{ chef_userfilename
      }}

      '
  args:
    creates: "{{ chef_userfilename }}"
  register: create_user
  changed_when: create_user.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_orgname }}  "{{ chef_longorgname }}"  --association_user {{ chef_username }}  --filename {{ chef_orgfilename }}

      '
  args:
    creates: "{{ chef_orgfilename }}"
  register: create_org
  changed_when: create_org.rc == 0
