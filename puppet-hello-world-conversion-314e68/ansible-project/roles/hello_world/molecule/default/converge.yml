- name: Converge
  hosts: all
  gather_facts: false
  tasks:
  - name: Create test directory
    ansible.builtin.file:
      path: /tmp/molecule_test
      state: directory
      mode: '0755'
  - name: Create a test file to verify message
    ansible.builtin.copy:
      content: '{{ hello_world_message | default(''Hello, world!'') }}'
      dest: /tmp/molecule_test/hello_message.txt
      mode: '0644'
