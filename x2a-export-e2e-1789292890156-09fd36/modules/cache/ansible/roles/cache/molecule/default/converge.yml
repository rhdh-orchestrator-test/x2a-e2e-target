---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/var/log
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          # Generated by Ansible

          # Network
          bind 127.0.0.1
          port 6379
          timeout 0
          tcp-keepalive 60

          # General
          daemonize yes
          supervised systemd
          pidfile /var/run/redis/redis-server.pid
          loglevel notice
          logfile /var/log/redis/redis-server.log
          databases 16

          # Security
          requirepass redis_secure_password_123

          # Limits
          maxclients 10000

          # Memory management
          maxmemory-policy noeviction

          # Append only file
          appendonly no
          appendfilename "appendonly.aof"
          appendfsync everysec
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create memcached configuration file
      ansible.builtin.copy:
        content: |
          # memcached default config file
          # Generated by Ansible

          # Run memcached as a daemon
          -d

          # Log memcached's output to /var/log/memcached.log
          logfile /var/log/memcached.log

          # Start with a cap of 64 megs of memory
          -m 64

          # Default connection port is 11211
          -p 11211

          # Run the daemon as memcache user
          -u memcache

          # Specify which IP address to listen on
          -l 127.0.0.1
        dest: /tmp/molecule_test/etc/memcached.conf
        mode: "0644"
        backup: true

    - name: Create Redis log file
      ansible.builtin.copy:
        content: |
          # Redis log file placeholder
          [1] 01 Jan 00:00:00.000 # Redis server started
          [1] 01 Jan 00:00:00.000 # Server initialized
          [1] 01 Jan 00:00:00.000 # Ready to accept connections
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"
        backup: true

    - name: Create memcached log file
      ansible.builtin.copy:
        content: |
          # Memcached log file placeholder
          <1 server listening (auto-negotiate)
          <2 send buffer was 212992, now 268435456
          <3 recv buffer was 212992, now 268435456
        dest: /tmp/molecule_test/var/log/memcached.log
        mode: "0644"
        backup: true

    - name: Create Redis data directory structure
      ansible.builtin.file:
        path: /tmp/molecule_test/var/lib/redis
        state: directory
        mode: "0755"

    - name: Create Redis dump file placeholder
      ansible.builtin.copy:
        content: "REDIS0009"
        dest: /tmp/molecule_test/var/lib/redis/dump.rdb
        mode: "0644"
        backup: true