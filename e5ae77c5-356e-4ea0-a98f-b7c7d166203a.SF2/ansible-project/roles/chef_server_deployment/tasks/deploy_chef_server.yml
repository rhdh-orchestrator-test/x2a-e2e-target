---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_server_hostname }}"
- name: Set vm.max_map_count kernel parameter
  ansible.builtin.command:
    cmd: sysctl -w vm.max_map_count=262144
  changed_when: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  ansible.builtin.command:
    cmd: sysctl -w vm.dirty_expire_centisecs=20000
  changed_when: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate_linux_amd64.zip > /tmp/chef-automate
  args:
    creates: /tmp/chef-automate
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: /tmp/chef-automate
    mode: "0755"
    state: file
- name: Deploy Chef Infra Server
  ansible.builtin.command:
    cmd: /tmp/chef-automate deploy --product infra-server --accept-terms-and-mlsa=true
  args:
    creates: /etc/chef-server
  register: chef_server_deploy
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_server_username }}  {{ chef_server_longusername }}  {{ chef_server_useremail }}  "{{ chef_server_userpassword }}"  --filename
      {{ chef_server_userfilename }}

      '
  args:
    creates: "{{ chef_server_userfilename }}"
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_server_orgname }}  "{{ chef_server_longorgname }}"  --association_user {{ chef_server_username }}  --filename {{ chef_server_orgfilename
      }}

      '
  args:
    creates: "{{ chef_server_orgfilename }}"
  become: true
