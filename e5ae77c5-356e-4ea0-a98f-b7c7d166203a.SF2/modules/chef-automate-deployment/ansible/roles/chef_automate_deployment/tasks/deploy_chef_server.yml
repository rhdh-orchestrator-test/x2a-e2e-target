---
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }}\n"
  become: true
  args:
    chdir: "{{ playbook_dir }}"
  register: deploy_result
  changed_when: deploy_result.rc == 0
  failed_when: deploy_result.rc != 0
  async: 3600
  poll: 30
  notify:
    - Wait for Chef Server initialization
- name: Wait for Chef Server initialization
  ansible.builtin.pause:
    seconds: 30
    prompt: Waiting for Chef Infra Server to initialize...
  listen: Wait for Chef Server initialization
