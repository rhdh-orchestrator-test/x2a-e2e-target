---
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }}\n"
  become: true
  args:
    chdir: "{{ playbook_dir }}"
  register: deploy_result
  changed_when: deploy_result.rc == 0
  failed_when: deploy_result.rc != 0
  async: 3600
  poll: 30
  notify:
    - Wait for Chef Automate initialization
