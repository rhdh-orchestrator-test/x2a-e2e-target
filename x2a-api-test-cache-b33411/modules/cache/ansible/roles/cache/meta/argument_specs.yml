---
argument_specs:
  main:
    short_description: Install and configure cache services (Redis and memcached)
    description:
      - Installs and configures Redis server with authentication
      - Installs and configures memcached service
      - Creates Redis log directory with proper permissions
      - Cleans up Redis replica configuration directives
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for Redis server to listen on
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory for Redis log files
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/{{ cache_redis_port }}.conf
        description: Path to Redis configuration file
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: System user for Redis service
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: System group for Redis service
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: TCP port for memcached service to listen on
      cache_redis_cleanup_replica_config:
        type: bool
        required: false
        default: true
        description: Whether to clean up Redis replica configuration directives
      cache_redis_replica_directives:
        type: list
        elements: str
        required: false
        default:
          - replica-serve-stale-data
          - replica-read-only
          - repl-ping-replica-period
          - client-output-buffer-limit
          - replica-priority
        description: List of Redis replica directives to remove from configuration
      redis_password:
        type: str
        required: true
        description: Redis authentication password (injected by AAP credential type)
