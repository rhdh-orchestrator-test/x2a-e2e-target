---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set to automate.chef.lab"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Sysctl settings check
    - name: Check sysctl settings file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
        fail_msg: "Sysctl settings file not found"
        success_msg: "Sysctl settings file exists"

    - name: Get sysctl content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count = 262144' in (sysctl_content.content | b64decode)"
        fail_msg: "vm.max_map_count not set to 262144"
        success_msg: "vm.max_map_count set correctly"
      when: sysctl_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - "'vm.dirty_expire_centisecs = 20000' in (sysctl_content.content | b64decode)"
        fail_msg: "vm.dirty_expire_centisecs not set to 20000"
        success_msg: "vm.dirty_expire_centisecs set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI check
    - name: Check Chef Automate CLI
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate config check
    - name: Check Chef Automate config file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config

    - name: Assert Chef Automate config exists
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    # Chef Server config check
    - name: Check Chef Server config file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server/chef-server.rb
      register: chef_server_config

    - name: Assert Chef Server config exists
      ansible.builtin.assert:
        that:
          - chef_server_config.stat.exists
        fail_msg: "Chef Server config file not found"
        success_msg: "Chef Server config file exists"

    # PEM files check
    - name: Check user PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/jtonello.pem
      register: user_pem

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.size > 0
        fail_msg: "User PEM file not found or empty"
        success_msg: "User PEM file exists"

    - name: Check organization validator PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/lab-validator.pem
      register: org_pem

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_pem.stat.exists
          - org_pem.stat.size > 0
        fail_msg: "Organization validator PEM file not found or empty"
        success_msg: "Organization validator PEM file exists"

    # Service status checks (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is active
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "ansible_facts.services['chef-automate.service'].state == 'running'"
        fail_msg: "Chef Automate service not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Assert Chef Server service is active
      ansible.builtin.assert:
        that:
          - "'chef-server.service' in ansible_facts.services"
          - "ansible_facts.services['chef-server.service'].state == 'running'"
        fail_msg: "Chef Server service not running"
        success_msg: "Chef Server service is running"
      tags: molecule-notest

    # Web UI accessibility checks (tagged for skipping in container)
    - name: Check Chef Automate API health
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
        status_code: 200
      register: automate_health
      tags: molecule-notest

    - name: Assert Chef Automate API is accessible
      ansible.builtin.assert:
        that:
          - automate_health.status == 200
        fail_msg: "Chef Automate API not accessible"
        success_msg: "Chef Automate API is accessible"
      tags: molecule-notest

    - name: Check Chef Infra Server organizations endpoint
      ansible.builtin.uri:
        url: https://localhost/organizations
        validate_certs: false
        status_code: 200
      register: infra_orgs
      tags: molecule-notest

    - name: Assert Chef Infra Server API is accessible
      ansible.builtin.assert:
        that:
          - infra_orgs.status == 200
        fail_msg: "Chef Infra Server API not accessible"
        success_msg: "Chef Infra Server API is accessible"
      tags: molecule-notest

    # Port listening checks (tagged for skipping in container)
    - name: Check for services listening on port 443
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "No service listening on port 443"
        success_msg: "Service is listening on port 443"
      tags: molecule-notest