---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/chef
        - /tmp/molecule_test/opt/chef-automate
        - /tmp/molecule_test/opt/chef-server
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/tmp

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "chef-automate.example.com"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl settings
    - name: Create sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/sh\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/opt/chef-automate/chef-automate"
        mode: "0755"

    # Simulate Chef user key file
    - name: Create Chef user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          EXAMPLE_KEY_CONTENT_PLACEHOLDER
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/etc/chef/admin.pem"
        mode: "0600"

    # Simulate Chef organization validator key file
    - name: Create Chef organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          EXAMPLE_VALIDATOR_KEY_CONTENT_PLACEHOLDER
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/etc/chef/example-validator.pem"
        mode: "0600"

    # Simulate Chef Automate config file
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          [global]
            fqdn = "chef-automate.example.com"
          [deployment]
            products = ["automate", "infra-server"]
        dest: "/tmp/molecule_test/opt/chef-automate/config.toml"
        mode: "0644"

    # Simulate Chef Server status file
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          run: true
          services:
            - name: chef-server
              status: running
            - name: postgresql
              status: running
            - name: nginx
              status: running
        dest: "/tmp/molecule_test/opt/chef-server/status.yml"
        mode: "0644"

    # Simulate Chef Automate status file
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          run: true
          services:
            - name: automate
              status: running
            - name: elasticsearch
              status: running
            - name: postgresql
              status: running
            - name: nginx
              status: running
        dest: "/tmp/molecule_test/opt/chef-automate/status.yml"
        mode: "0644"