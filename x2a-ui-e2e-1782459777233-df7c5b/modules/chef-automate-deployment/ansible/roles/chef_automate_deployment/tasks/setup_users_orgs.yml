---
- name: Ensure /etc/chef directory exists
  ansible.builtin.file:
    path: /etc/chef
    state: directory
    mode: "0755"
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: "chef-server-ctl user-create  {{ chef_user_name }}  {{ chef_user_full_name | quote }}  {{ chef_user_email | quote }}  {{ chef_user_password | quote }}  --filename
      {{ chef_user_key_file }} "
  args:
    creates: "{{ chef_user_key_file }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: "chef-server-ctl org-create  {{ chef_org_name }}  {{ chef_org_full_name | quote }}  --association_user {{ chef_user_name }}  --filename {{ chef_org_validator_key_file
      }} "
  args:
    creates: "{{ chef_org_validator_key_file }}"
  become: true
- name: Set proper permissions on key files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
    state: file
  loop:
    - "{{ chef_user_key_file }}"
    - "{{ chef_org_validator_key_file }}"
  when: ansible_check_mode is not defined or not ansible_check_mode
