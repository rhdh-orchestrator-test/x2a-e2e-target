---
argument_specs:
  main:
    short_description: Role to fix POODLE vulnerability in Apache SSL configuration
    description:
      - This role mitigates the POODLE vulnerability by updating Apache SSL configuration
      - It disables vulnerable SSL protocols and enables only TLSv1.2
    author: x2a
    options:
      apache_ssl_protocol:
        type: str
        default: -all +TLSv1.2
        description: SSL protocol configuration for Apache
      apache_service_name:
        type: str
        default: apache2
        description: Name of the Apache service
      ssh_service_name:
        type: str
        default: sshd
        description: Name of the SSH service
      apache_ssl_conf_path:
        type: str
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file
