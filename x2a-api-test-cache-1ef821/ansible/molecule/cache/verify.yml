---
# Unsupported pre-flight checks: package-specific service status and enablement,
# authenticated PING and INFO (the vault variable is not provided), configured
# port/authentication directive output, Redis journal review, and log-directory
# contents have no safely available service name, secret, or stated expected result.
- name: Verify Redis pre-flight checks
  hosts: all
  gather_facts: false
  tasks:
    - name: Confirm Redis process is running
      ansible.builtin.command:
        argv:
          - ps
          - aux
      register: item_redis_process
      changed_when: false

    - name: Assert that the Redis process is running
      ansible.builtin.assert:
        that:
          - item_redis_process.stdout is search('[r]edis-server')
        fail_msg: Redis server process was not found.

    - name: Confirm Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: item_redis_config

    - name: Assert that the Redis configuration file exists
      ansible.builtin.assert:
        that:
          - item_redis_config.stat.exists
          - item_redis_config.stat.isreg
        fail_msg: Redis configuration file is missing.

    - name: Confirm Redis is listening on TCP port 6379
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 10

    - name: Check Redis log directory metadata
      ansible.builtin.stat:
        path: /var/log/redis
      register: item_redis_log_directory

    - name: Assert Redis log directory ownership and mode
      ansible.builtin.assert:
        that:
          - item_redis_log_directory.stat.exists
          - item_redis_log_directory.stat.isdir
          - item_redis_log_directory.stat.pw_name == 'redis'
          - item_redis_log_directory.stat.gr_name == 'redis'
          - item_redis_log_directory.stat.mode == '0755'
        fail_msg: Redis log directory metadata does not match the pre-flight expectation.

    - name: Check that unauthenticated Redis access is rejected
      ansible.builtin.command:
        argv:
          - redis-cli
          - -h
          - 127.0.0.1
          - -p
          - '6379'
          - PING
      register: item_redis_unauthenticated_ping
      changed_when: false
      failed_when: false

    - name: Assert unauthenticated Redis access requires authentication
      ansible.builtin.assert:
        that:
          - item_redis_unauthenticated_ping.rc != 0
          - >-
            (item_redis_unauthenticated_ping.stdout ~ item_redis_unauthenticated_ping.stderr)
            is search('(?i)noauth|authentication required|auth required')
        fail_msg: Unauthenticated Redis PING was not rejected with an authentication error.

    - name: Read Redis configuration
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: item_redis_config_content

    - name: Assert removed Redis directives are absent
      ansible.builtin.assert:
        that:
          - >-
            (item_redis_config_content.content | b64decode)
            is not search('(?m)^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)([ \t]|$)')
        fail_msg: One or more removed Redis replication directives are present.
