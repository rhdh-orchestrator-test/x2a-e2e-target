---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ chef_automate_sysctl_settings | dict2items }}"
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
- name: Ensure unzip is installed
  ansible.builtin.package:
    name: unzip
    state: present
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: /tmp/chef-automate.zip
    dest: /tmp/
    remote_src: true
    mode: "0755"
    creates: /tmp/chef-automate
- name: Move Chef Automate CLI to working directory
  ansible.builtin.copy:
    src: /tmp/chef-automate
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
    remote_src: true
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ chef_automate_user_key_filename | dirname }}"
    state: directory
    mode: "0755"
  when: chef_automate_user_key_filename | dirname != ''
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }} "
    creates: /hab
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}"  --filename {{ chef_automate_user_key_filename }}

      '
    creates: "{{ chef_automate_user_key_filename }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_long_name }}"  --association_user {{ username }}  --filename {{ chef_automate_org_key_filename
      }}

      '
    creates: "{{ chef_automate_org_key_filename }}"
  become: true
