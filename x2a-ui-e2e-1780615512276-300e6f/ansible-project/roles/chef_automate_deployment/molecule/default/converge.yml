---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    full_name: John Tonello
    email: jtonello@chef.lab
    password: password
    chef_automate_hostname: automate.chef.lab
    chef_automate_user_key_filename: jtonello.pem
    chef_automate_org_name: lab
    chef_automate_org_key_filename: lab-validator.pem
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/tmp

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl settings
    - name: Create sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: /tmp/molecule_test/tmp/chef-automate
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.file:
        path: /tmp/molecule_test/hab
        state: directory
        mode: "0755"

    # Simulate user key file
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/{{ chef_automate_user_key_filename }}"
        mode: "0600"

    # Simulate organization key file
    - name: Create organization key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORG KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/{{ chef_automate_org_key_filename }}"
        mode: "0600"

    # Simulate Chef server user list output
    - name: Create Chef server user list file
      ansible.builtin.copy:
        content: "{{ username }}"
        dest: /tmp/molecule_test/chef-server-user-list
        mode: "0644"

    # Simulate Chef server org list output
    - name: Create Chef server org list file
      ansible.builtin.copy:
        content: "{{ chef_automate_org_name }}"
        dest: /tmp/molecule_test/chef-server-org-list
        mode: "0644"

    # Simulate systemd service file for Chef Automate
    - name: Create Chef Automate service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Automate
          
          [Service]
          ExecStart=/hab/bin/chef-automate
          
          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
        mode: "0644"