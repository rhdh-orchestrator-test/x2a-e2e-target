---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    chef_automate_hostname: automate.chef.lab
    chef_automate_org_name: lab
  tasks:
    # System configuration checks
    - name: Check hostname configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is correctly set
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == chef_automate_hostname
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Sysctl parameter checks
    - name: Check sysctl configuration file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are correctly set
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count = 262144' in (sysctl_content.content | b64decode)"
          - "'vm.dirty_expire_centisecs = 20000' in (sysctl_content.content | b64decode)"
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI check
    - name: Check Chef Automate CLI
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate deployment check
    - name: Check Chef Automate deployment
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: chef_automate_deployment

    - name: Assert Chef Automate is deployed
      ansible.builtin.assert:
        that:
          - chef_automate_deployment.stat.exists
          - chef_automate_deployment.stat.isdir
        fail_msg: "Chef Automate deployment directory not found"
        success_msg: "Chef Automate deployment directory exists"

    # User key file check
    - name: Check user key file
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ username }}.pem"
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.size > 0
        fail_msg: "User key file not found or empty"
        success_msg: "User key file exists"

    # Organization key file check
    - name: Check organization key file
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_automate_org_name }}-validator.pem"
      register: org_key_file

    - name: Assert organization key file exists
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.size > 0
        fail_msg: "Organization key file not found or empty"
        success_msg: "Organization key file exists"

    # User verification check
    - name: Check user list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-server-user-list
      register: user_list_file

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/chef-server-user-list
      register: user_list_content
      when: user_list_file.stat.exists

    - name: Assert user exists in user list
      ansible.builtin.assert:
        that:
          - username in (user_list_content.content | b64decode)
        fail_msg: "User not found in user list"
        success_msg: "User found in user list"
      when: user_list_file.stat.exists

    # Organization verification check
    - name: Check organization list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-server-org-list
      register: org_list_file

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/chef-server-org-list
      register: org_list_content
      when: org_list_file.stat.exists

    - name: Assert organization exists in organization list
      ansible.builtin.assert:
        that:
          - chef_automate_org_name in (org_list_content.content | b64decode)
        fail_msg: "Organization not found in organization list"
        success_msg: "Organization found in organization list"
      when: org_list_file.stat.exists

    # Service status check (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      register: chef_automate_service
      tags: molecule-notest

    - name: Assert Chef Automate service file exists
      ansible.builtin.assert:
        that:
          - chef_automate_service.stat.exists
        fail_msg: "Chef Automate service file not found"
        success_msg: "Chef Automate service file exists"
      tags: molecule-notest

    # Network port check (tagged for skipping in container)
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 1
      register: port_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # Web UI access check (tagged for skipping in container)
    - name: Check web UI access
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
      register: web_ui_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert web UI is accessible
      ansible.builtin.assert:
        that:
          - web_ui_check is succeeded
        fail_msg: "Web UI is not accessible"
        success_msg: "Web UI is accessible"
      tags: molecule-notest