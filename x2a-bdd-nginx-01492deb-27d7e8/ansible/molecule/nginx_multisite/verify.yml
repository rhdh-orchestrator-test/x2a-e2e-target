---
# Unsupported pre-flight checks: certificate validity dates, full nginx -T output,
# service journal output, sysctl application output, and HTTP response-header details
# have no specific expected result that can be asserted safely from the plan.
# The fail2ban stat command has no stated expected permission value and is omitted.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service facts for nginx and fail2ban checks
      ansible.builtin.service_facts:

    - name: Assert nginx is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts['services']['nginx.service']['status'] == 'enabled'"
          - "ansible_facts['services']['nginx.service']['state'] == 'running'"
        fail_msg: Nginx must be enabled and active.

    - name: Assert fail2ban is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts['services']['fail2ban.service']['status'] == 'enabled'"
          - "ansible_facts['services']['fail2ban.service']['state'] == 'running'"
        fail_msg: Fail2ban must be enabled and active.

    - name: Read SSH daemon configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_sshd_config

    - name: Assert SSH root login is disabled
      ansible.builtin.assert:
        that:
          - >-
            (item_sshd_config['content'] | b64decode) is regex(
            '(?m)^[[:space:]]*PermitRootLogin[[:space:]]+no[[:space:]]*$')
        fail_msg: SSH root login must be disabled.

    - name: Assert SSH password authentication is disabled
      ansible.builtin.assert:
        that:
          - >-
            (item_sshd_config['content'] | b64decode) is regex(
            '(?m)^[[:space:]]*PasswordAuthentication[[:space:]]+no[[:space:]]*$')
        fail_msg: SSH password authentication must be disabled.

    - name: Check required deployment paths
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      loop:
        - path: /etc/nginx/nginx.conf
          kind: file
        - path: /etc/nginx/conf.d/security.conf
          kind: file
        - path: /etc/nginx/sites-available/test.cluster.local
          kind: file
        - path: /etc/nginx/sites-available/ci.cluster.local
          kind: file
        - path: /etc/nginx/sites-available/status.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/test.cluster.local
          kind: link
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          kind: link
        - path: /etc/nginx/sites-enabled/status.cluster.local
          kind: link
        - path: /opt/server/test
          kind: directory
        - path: /opt/server/test/index.html
          kind: file
        - path: /opt/server/ci
          kind: directory
        - path: /opt/server/ci/index.html
          kind: file
        - path: /opt/server/status
          kind: directory
        - path: /opt/server/status/index.html
          kind: file
        - path: /etc/ssl/certs/test.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/test.cluster.local.key
          kind: file
        - path: /etc/ssl/certs/ci.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/ci.cluster.local.key
          kind: file
        - path: /etc/ssl/certs/status.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/status.cluster.local.key
          kind: file
        - path: /etc/fail2ban/jail.local
          kind: file
        - path: /etc/sysctl.d/99-security.conf
          kind: file
      loop_control:
        loop_var: item_path
      register: item_deployment_paths

    - name: Assert required deployment paths have the expected type
      ansible.builtin.assert:
        that:
          - item_path_result['stat']['exists']
          - >-
            (item_path_result['item']['kind'] == 'file' and item_path_result['stat']['isreg']) or
            (item_path_result['item']['kind'] == 'directory' and item_path_result['stat']['isdir']) or
            (item_path_result['item']['kind'] == 'link' and item_path_result['stat']['islnk'])
        fail_msg: A required deployment path is missing or has the wrong type.
      loop: "{{ item_deployment_paths['results'] }}"
      loop_control:
        loop_var: item_path_result

    - name: Confirm the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
        follow: false
      register: item_default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_site['stat']['exists']
        fail_msg: The default nginx site must be absent.

    - name: Check private key ownership and permissions
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: item_private_keys

    - name: Assert private keys have expected ownership and mode
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['pw_name'] == 'root'
          - item_key_result['stat']['gr_name'] == 'ssl-cert'
          - item_key_result['stat']['mode'] == '0640'
        fail_msg: A TLS private key does not have the expected ownership or mode.
      loop: "{{ item_private_keys['results'] }}"
      loop_control:
        loop_var: item_key_result

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Read firewall status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: item_ufw_status
      changed_when: false

    - name: Assert firewall denies inbound traffic by default
      ansible.builtin.assert:
        that:
          - item_ufw_status['stdout'] is search('(?im)^Default:.*deny.*incoming')
        fail_msg: UFW must deny incoming traffic by default.

    - name: Assert firewall allows SSH HTTP and HTTPS
      ansible.builtin.assert:
        that:
          - item_ufw_status['stdout'] is search('(?m)^22(?:/tcp)?[[:space:]]+ALLOW')
          - item_ufw_status['stdout'] is search('(?m)^80(?:/tcp)?[[:space:]]+ALLOW')
          - item_ufw_status['stdout'] is search('(?m)^443(?:/tcp)?[[:space:]]+ALLOW')
        fail_msg: UFW must allow SSH, HTTP, and HTTPS.

    - name: Check required listening ports
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_port['port'] }}"
        state: started
        timeout: 5
      loop:
        - port: 22
        - port: 80
        - port: 443
      loop_control:
        loop_var: item_port

    - name: Inspect certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
      register: item_certificate_subjects
      changed_when: false
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          common_name: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          common_name: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          common_name: status.cluster.local
      loop_control:
        loop_var: item_certificate

    - name: Assert certificates contain expected common names
      ansible.builtin.assert:
        that:
          - >-
            item_certificate_result['stdout'] is search(
            'CN[[:space:]]*=[[:space:]]*' ~ item_certificate_result['item']['common_name'])
        fail_msg: A site certificate does not contain its expected common name.
      loop: "{{ item_certificate_subjects['results'] }}"
      loop_control:
        loop_var: item_certificate_result
