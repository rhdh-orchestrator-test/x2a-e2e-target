---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload nginx multisite sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

- name: Restart SSH
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Validate and reload nginx
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  notify: Reload nginx
  listen: Validate and reload nginx
