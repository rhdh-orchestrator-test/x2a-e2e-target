---
argument_specs:
  main:
    short_description: Configure Nginx multisite hosting with TLS and security hardening
    description:
      - Installs and configures Nginx, Fail2ban, UFW, SSH hardening, and self-signed TLS certificates.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Virtual hosts and their document roots.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether Fail2ban is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW is enabled.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether root SSH login is disabled.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
