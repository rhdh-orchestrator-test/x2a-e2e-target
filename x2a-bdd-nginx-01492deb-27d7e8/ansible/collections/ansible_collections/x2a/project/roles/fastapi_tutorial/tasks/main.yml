---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Ensure FastAPI service user exists
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_service_user }}"
    system: true
    create_home: false
    state: present
  when: fastapi_tutorial_service_user != 'root'

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize FastAPI tutorial repository # noqa: R104 - the role default uses an HTTPS trusted source
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R106 - source comes from a trusted role default
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default, not user input
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment
  ansible.builtin.command: # noqa: R101 - command arguments come from trusted role defaults
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}/bin/python" # noqa: R114 - path is a role default, not user input

- name: Install application dependencies # noqa: R113 - requirements target is the role's fixed application dependency file
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - path is a role default, not user input
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path is a role default, not user input

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL application role # noqa: L039 - credentials are validated by the preceding task and supplied by the attached AAP credential
  ansible.builtin.shell: # noqa: R101 - command arguments use validated credential variables
    cmd: |
      psql -v ON_ERROR_STOP=1 -d postgres \
        -c "DO $$ BEGIN CREATE ROLE \"{{ db_username }}\" LOGIN PASSWORD '{{ db_password }}'; EXCEPTION WHEN duplicate_object THEN ALTER ROLE \"{{ db_username }}\" PASSWORD '{{ db_password }}'; END $$;"
    executable: /bin/bash
  become: true # noqa: R108 - PostgreSQL role creation must run as the postgres system user
  become_user: postgres
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL application database # noqa: L039 - credentials are validated by the preceding task and supplied by the attached AAP credential
  ansible.builtin.shell: # noqa: R101 - command arguments use validated credential variables
    cmd: |
      psql -v ON_ERROR_STOP=1 -d postgres \
        -c "SELECT 'CREATE DATABASE \"{{ database_name }}\" OWNER \"{{ db_username }}\"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ database_name }}')\gexec"
    executable: /bin/bash
  become: true # noqa: R108 - database creation must run as the postgres system user
  become_user: postgres
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant PostgreSQL database privileges # noqa: L039 - credentials are validated by the preceding task and supplied by the attached AAP credential
  ansible.builtin.shell: # noqa: R101 - command arguments use validated credential variables
    cmd: >-
      psql -v ON_ERROR_STOP=1 -d postgres -c
      "GRANT ALL PRIVILEGES ON DATABASE \"{{ database_name }}\" TO \"{{ db_username }}\";"
    executable: /bin/bash
  become: true # noqa: R108 - granting database privileges must run as the postgres system user
  become_user: postgres
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy application environment file # noqa: L039 - credentials are validated by the preceding task and supplied by the attached AAP credential
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_env_file }}" # noqa: R114 - path is a role default, not user input
    content: |
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@localhost/{{ database_name }}
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy FastAPI systemd unit
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - path is a role default, not user input
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User={{ fastapi_tutorial_service_user }}
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      EnvironmentFile={{ fastapi_tutorial_env_file }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host {{ fastapi_tutorial_app_host }} --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: fastapi_tutorial service changed

- name: Enable and start FastAPI tutorial service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
