---
controller_credential_types:
  - name: Redis Authentication
    description: Credential for authenticating clients to the Redis instance on TCP port 6379. The source password is hardcoded in a Chef node attribute and 
      must be replaced with an Ansible Vault-backed value.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required to authenticate clients to the Redis server on TCP port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
