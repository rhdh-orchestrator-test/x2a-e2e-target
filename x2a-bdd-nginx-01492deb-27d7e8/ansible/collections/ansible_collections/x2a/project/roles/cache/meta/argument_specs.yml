---
argument_specs:
  main:
    short_description: Install and configure an authenticated Redis cache service
    description:
      - Installs Redis, configures the Redis instance on port 6379, and enables its service.
      - Removes unsupported replication directives from the generated Redis configuration.
    options:
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Redis package name for the target operating system.
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Redis service unit name for the target operating system.
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Absolute path to the Redis instance configuration file.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port on which Redis listens.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Directory used for Redis logs.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide task output for operations that handle the Redis password.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
