- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/redis
    - /tmp/molecule_test/var/lib/redis
    - /tmp/molecule_test/var/log/redis
    - /tmp/molecule_test/var/run/redis
  - name: Create mock Redis configuration file
    ansible.builtin.copy:
      content: '# Redis configuration file example

        port 6379

        bind 127.0.0.1

        daemonize yes

        supervised systemd

        logfile /var/log/redis/redis-server.log

        dir /var/lib/redis

        '
      dest: /tmp/molecule_test/etc/redis/redis.conf
      mode: '0644'
  - name: Create mock Redis log file
    ansible.builtin.copy:
      content: '# Redis server log file '
      dest: /tmp/molecule_test/var/log/redis/redis-server.log
      mode: '0644'
  - name: Create mock Redis socket file
    ansible.builtin.copy:
      content: ''
      dest: /tmp/molecule_test/var/run/redis/redis-server.sock
      mode: '0644'
  - name: Mock package installation
    ansible.builtin.set_fact:
      redis_package_name: redis-server
      redis_service_name: redis-server
  - name: Install redis server package (mocked)
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/bin/redis-server
      state: touch
      mode: '0755'
    changed_when: true
  - name: Enable and start redis server (mocked)
    ansible.builtin.file:
      path: /tmp/molecule_test/var/run/redis/redis-server.pid
      state: touch
      mode: '0644'
    changed_when: true
