---
- name: Check if Chef admin user already exists
  ansible.builtin.command:
    cmd: chef-server-ctl user-list
  become: true
  register: user_list
  changed_when: false
  failed_when: false
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} "{{ password }}" --filename {{ chef_automate_user_key_file }}
  become: true
  register: create_user_result
  changed_when: create_user_result.rc == 0
  failed_when:
    - create_user_result.rc != 0
    - "'already exists' not in create_user_result.stderr"
  when: username not in user_list.stdout
- name: Check if Chef organization already exists
  ansible.builtin.command:
    cmd: chef-server-ctl org-list
  become: true
  register: org_list
  changed_when: false
  failed_when: false
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ org_short_name }} "{{ org_full_name }}" --association_user {{ username }} --filename {{ chef_automate_org_validator_file
      }}
  become: true
  register: create_org_result
  changed_when: create_org_result.rc == 0
  failed_when:
    - create_org_result.rc != 0
    - "'already exists' not in create_org_result.stderr"
  when: org_short_name not in org_list.stdout
