---
- name: Create Chef Automate directory
  ansible.builtin.file:
    path: "{{ chef_automate_install_dir }}"
    state: directory
    mode: "0755"
  become: true
- name: Check if Chef Automate CLI is already installed
  ansible.builtin.stat:
    path: "{{ chef_automate_install_dir }}/chef-automate"
  register: chef_automate_cli_stat
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate
    mode: "0755"
  become: true
  when: not chef_automate_cli_stat.stat.exists
- name: Move Chef Automate CLI to install directory
  ansible.builtin.copy:
    src: /tmp/chef-automate
    dest: "{{ chef_automate_install_dir }}/chef-automate"
    remote_src: true
    mode: "0755"
  become: true
  when: not chef_automate_cli_stat.stat.exists
