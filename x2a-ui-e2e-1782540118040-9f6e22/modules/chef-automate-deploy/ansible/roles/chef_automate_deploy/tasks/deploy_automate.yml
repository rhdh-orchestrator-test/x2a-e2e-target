---
- name: Check if Chef Automate is already deployed
  ansible.builtin.command:
    cmd: "{{ chef_automate_install_dir }}/chef-automate status"
  become: true
  register: automate_status
  changed_when: false
  failed_when: false
- name: Build Chef Automate deploy command
  ansible.builtin.set_fact:
    chef_automate_deploy_cmd: "{{ chef_automate_install_dir }}/chef-automate deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor
      %} --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}"
  when: automate_status.rc != 0
- name: Deploy Chef Automate and Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_deploy_cmd }}"
    chdir: "{{ chef_automate_install_dir }}"
  become: true
  register: deploy_result
  changed_when: "'Success!' in deploy_result.stdout"
  failed_when:
    - deploy_result.rc != 0
    - "'already deployed' not in deploy_result.stderr"
  when: automate_status.rc != 0
