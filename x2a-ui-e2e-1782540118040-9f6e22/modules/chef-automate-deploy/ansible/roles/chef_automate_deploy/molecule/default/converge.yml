- name: Converge
  hosts: all
  gather_facts: true
  vars:
    chef_automate_install_dir: /tmp/molecule_test/chef-automate-install
    username: jtonello
    password: testpassword
    full_name: John Tonello
    email: jtonello@example.com
    org_short_name: lab
    org_full_name: Chef Lab Organization
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/chef-automate-install
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '262144'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '20000'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI binary
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/chef-automate-install/chef-automate
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock Chef user key -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- Mock Chef organization validator key -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: "Service: automate-gateway\n  Status: running\nService: automate-postgresql\n  Status: running\nService: automate-elasticsearch\n  Status: running\nService:
        chef-server\n  Status: running\n"
      dest: /tmp/molecule_test/chef-automate-status
      mode: '0644'
  - name: Create Chef Server status file
    ansible.builtin.copy:
      content: 'run: chef-server-ctl: running

        run: bookshelf: running

        run: oc_bifrost: running

        run: oc_id: running

        run: opscode-erchef: running

        run: opscode-expander: running

        run: opscode-solr4: running

        run: postgresql: running

        run: rabbitmq: running

        run: redis_lb: running

        '
      dest: /tmp/molecule_test/chef-server-status
      mode: '0644'
  - name: Create Chef user list file
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/chef-user-list
      mode: '0644'
  - name: Create Chef org list file
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/chef-org-list
      mode: '0644'
  - name: Create netstat output file
    ansible.builtin.copy:
      content: tcp6       0      0 :::443                  :::*                    LISTEN      1234/nginx
      dest: /tmp/molecule_test/netstat-output
      mode: '0644'
  - name: Create Chef Automate login page
    ansible.builtin.copy:
      content: <html><body>Chef Automate Login</body></html>
      dest: /tmp/molecule_test/chef-automate-login
      mode: '0644'
  - name: Create Chef Automate status API response
    ansible.builtin.copy:
      content: '{"status":"ok"}'
      dest: /tmp/molecule_test/chef-automate-status-api
      mode: '0644'
