---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname is configured correctly
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set to expected value"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Kernel parameter checks
    - name: Check vm.max_map_count
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_file

    - name: Assert vm.max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
        fail_msg: "vm.max_map_count file not found"
        success_msg: "vm.max_map_count file exists"

    - name: Get vm.max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "262144"
        fail_msg: "vm.max_map_count not set to expected value"
        success_msg: "vm.max_map_count set correctly"
      when: max_map_count_file.stat.exists

    - name: Check vm.dirty_expire_centisecs
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_file

    - name: Assert vm.dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_centisecs_file.stat.exists
        fail_msg: "vm.dirty_expire_centisecs file not found"
        success_msg: "vm.dirty_expire_centisecs file exists"

    - name: Get vm.dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_content
      when: dirty_expire_centisecs_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
        fail_msg: "vm.dirty_expire_centisecs not set to expected value"
        success_msg: "vm.dirty_expire_centisecs set correctly"
      when: dirty_expire_centisecs_file.stat.exists

    # Chef Automate binary check
    - name: Check Chef Automate binary
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate-install/chef-automate
      register: chef_automate_binary

    - name: Assert Chef Automate binary exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_binary.stat.exists
          - chef_automate_binary.stat.executable
        fail_msg: "Chef Automate binary not found or not executable"
        success_msg: "Chef Automate binary exists and is executable"

    # User and organization key files check
    - name: Check user key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    - name: Check organization validator key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_validator_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_validator_file.stat.exists
        fail_msg: "Organization validator key file not found"
        success_msg: "Organization validator key file exists"

    # Chef Automate status check
    - name: Check Chef Automate status file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate-status
      register: chef_automate_status_file

    - name: Get Chef Automate status content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/chef-automate-status
      register: chef_automate_status_content
      when: chef_automate_status_file.stat.exists

    - name: Assert Chef Automate services are running
      ansible.builtin.assert:
        that:
          - chef_automate_status_content.content | b64decode | string | search('Status: running')
        fail_msg: "Chef Automate services not running"
        success_msg: "Chef Automate services are running"
      when: chef_automate_status_file.stat.exists
      tags: molecule-notest

    # Chef Server status check
    - name: Check Chef Server status file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-server-status
      register: chef_server_status_file

    - name: Get Chef Server status content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/chef-server-status
      register: chef_server_status_content
      when: chef_server_status_file.stat.exists

    - name: Assert Chef Server services are running
      ansible.builtin.assert:
        that:
          - chef_server_status_content.content | b64decode | string | search('running')
        fail_msg: "Chef Server services not running"
        success_msg: "Chef Server services are running"
      when: chef_server_status_file.stat.exists
      tags: molecule-notest

    # User and organization list checks
    - name: Check user list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-user-list
      register: chef_user_list_file

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/chef-user-list
      register: chef_user_list_content
      when: chef_user_list_file.stat.exists

    - name: Assert user exists
      ansible.builtin.assert:
        that:
          - chef_user_list_content.content | b64decode | string | search('jtonello')
        fail_msg: "User jtonello not found"
        success_msg: "User jtonello exists"
      when: chef_user_list_file.stat.exists
      tags: molecule-notest

    - name: Check organization list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-org-list
      register: chef_org_list_file

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/chef-org-list
      register: chef_org_list_content
      when: chef_org_list_file.stat.exists

    - name: Assert organization exists
      ansible.builtin.assert:
        that:
          - chef_org_list_content.content | b64decode | string | search('lab')
        fail_msg: "Organization lab not found"
        success_msg: "Organization lab exists"
      when: chef_org_list_file.stat.exists
      tags: molecule-notest

    # Network port check
    - name: Check netstat output file
      ansible.builtin.stat:
        path: /tmp/molecule_test/netstat-output
      register: netstat_output_file

    - name: Get netstat output content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/netstat-output
      register: netstat_output_content
      when: netstat_output_file.stat.exists

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - netstat_output_content.content | b64decode | string | search(':::443')
        fail_msg: "Port 443 not listening"
        success_msg: "Port 443 is listening"
      when: netstat_output_file.stat.exists
      tags: molecule-notest

    # Web UI access check
    - name: Check Chef Automate login page
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate-login
      register: chef_automate_login_file

    - name: Get Chef Automate login page content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/chef-automate-login
      register: chef_automate_login_content
      when: chef_automate_login_file.stat.exists

    - name: Assert Chef Automate login page is accessible
      ansible.builtin.assert:
        that:
          - chef_automate_login_content.content | b64decode | string | search('Chef Automate Login')
        fail_msg: "Chef Automate login page not accessible"
        success_msg: "Chef Automate login page is accessible"
      when: chef_automate_login_file.stat.exists
      tags: molecule-notest

    # API status check
    - name: Check Chef Automate status API response
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate-status-api
      register: chef_automate_status_api_file

    - name: Get Chef Automate status API content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/chef-automate-status-api
      register: chef_automate_status_api_content
      when: chef_automate_status_api_file.stat.exists

    - name: Assert Chef Automate API is accessible
      ansible.builtin.assert:
        that:
          - chef_automate_status_api_content.content | b64decode | string | search('status')
        fail_msg: "Chef Automate API not accessible"
        success_msg: "Chef Automate API is accessible"
      when: chef_automate_status_api_file.stat.exists
      tags: molecule-notest