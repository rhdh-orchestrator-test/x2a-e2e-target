---
# Unsupported: the kernel sysctl diagnostic has no stated expected values.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        loop:
          - nginx
          - fail2ban
          - ufw
          - openssl
          - ca-certificates
        loop_control:
          loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Check enabled services
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item_service }}"
      changed_when: false
      register: enabled_services
      loop:
        - nginx
        - fail2ban
      loop_control:
        loop_var: item_service

    - name: Assert nginx and fail2ban are enabled and active
      ansible.builtin.assert:
        that:
          - item_service_check['rc'] == 0
          - ansible_facts['services'][item_service_check['item'] + '.service']['state'] == 'running'
        loop: "{{ enabled_services['results'] }}"
        loop_control:
          loop_var: item_service_check

    - name: Check SSH is active
      ansible.builtin.command:
        argv: [systemctl, is-active, ssh]
      changed_when: false
      register: ssh_active

    - name: Assert SSH is active
      ansible.builtin.assert:
        that: ssh_active['rc'] == 0

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv: [nginx, -t]
      changed_when: false

    - name: Read nginx configuration
      ansible.builtin.command:
        argv: [nginx, -T]
      changed_when: false
      register: nginx_configuration

    - name: Assert nginx virtual hosts and ports are configured
      ansible.builtin.assert:
        that:
          - "'server_name test.cluster.local' in nginx_configuration['stdout']"
          - "'server_name ci.cluster.local' in nginx_configuration['stdout']"
          - "'server_name status.cluster.local' in nginx_configuration['stdout']"
          - "'listen 80' in nginx_configuration['stdout']"
          - "'listen 443' in nginx_configuration['stdout']"

    - name: Validate SSH configuration
      ansible.builtin.command:
        argv: [sshd, -t]
      changed_when: false

    - name: Read effective SSH configuration
      ansible.builtin.command:
        argv: [sshd, -T]
      changed_when: false
      register: effective_sshd

    - name: Assert SSH hardening settings
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in effective_sshd['stdout']"
          - "'passwordauthentication no' in effective_sshd['stdout']"

    - name: Check explicitly listed files, directories, and links
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      register: listed_paths
      loop:
        - {path: /etc/nginx/nginx.conf, type: file}
        - {path: /etc/nginx/conf.d/security.conf, type: file}
        - {path: /etc/nginx/sites-available/test.cluster.local, type: file}
        - {path: /etc/nginx/sites-available/ci.cluster.local, type: file}
        - {path: /etc/nginx/sites-available/status.cluster.local, type: file}
        - {path: /etc/nginx/sites-enabled/test.cluster.local, type: link}
        - {path: /etc/nginx/sites-enabled/ci.cluster.local, type: link}
        - {path: /etc/nginx/sites-enabled/status.cluster.local, type: link}
        - {path: /opt/server/test, type: directory}
        - {path: /opt/server/test/index.html, type: file}
        - {path: /opt/server/ci, type: directory}
        - {path: /opt/server/ci/index.html, type: file}
        - {path: /opt/server/status, type: directory}
        - {path: /opt/server/status/index.html, type: file}
        - {path: /etc/ssl/certs/test.cluster.local.crt, type: file}
        - {path: /etc/ssl/private/test.cluster.local.key, type: file}
        - {path: /etc/ssl/certs/ci.cluster.local.crt, type: file}
        - {path: /etc/ssl/private/ci.cluster.local.key, type: file}
        - {path: /etc/ssl/certs/status.cluster.local.crt, type: file}
        - {path: /etc/ssl/private/status.cluster.local.key, type: file}
        - {path: /etc/fail2ban/jail.local, type: file}
        - {path: /etc/sysctl.d/99-security.conf, type: file}
        - {path: /etc/ssh/sshd_config, type: file}
        - {path: /var/log/nginx/access.log, type: file}
        - {path: /var/log/nginx/error.log, type: file}
        - {path: /var/log/nginx/test.cluster.local_access.log, type: file}
        - {path: /var/log/nginx/test.cluster.local_error.log, type: file}
        - {path: /var/log/nginx/ci.cluster.local_access.log, type: file}
        - {path: /var/log/nginx/ci.cluster.local_error.log, type: file}
        - {path: /var/log/nginx/status.cluster.local_access.log, type: file}
        - {path: /var/log/nginx/status.cluster.local_error.log, type: file}
        - {path: /var/log/auth.log, type: file}
      loop_control:
        loop_var: item_path

    - name: Assert listed paths have the expected type
      ansible.builtin.assert:
        that:
          - item_checked['stat']['exists']
          - (item_checked['item']['type'] == 'file' and item_checked['stat']['isreg']) or
            (item_checked['item']['type'] == 'directory' and item_checked['stat']['isdir']) or
            (item_checked['item']['type'] == 'link' and item_checked['stat']['islnk'])
        loop: "{{ listed_paths['results'] }}"
        loop_control:
          loop_var: item_checked

    - name: Check the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
        follow: false
      register: default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that: not default_site['stat']['exists']

    - name: Check TLS key metadata
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
        follow: false
      register: tls_keys
      loop:
        - {path: /etc/ssl/private/test.cluster.local.key}
        - {path: /etc/ssl/private/ci.cluster.local.key}
        - {path: /etc/ssl/private/status.cluster.local.key}
      loop_control:
        loop_var: item_key

    - name: Assert TLS keys have expected metadata
      ansible.builtin.assert:
        that:
          - item_tls['stat']['pw_name'] == 'root'
          - item_tls['stat']['gr_name'] == 'ssl-cert'
          - item_tls['stat']['mode'] == '0640'
        loop: "{{ tls_keys['results'] }}"
        loop_control:
          loop_var: item_tls

    - name: Check HTTP and HTTPS site responses
      ansible.builtin.command:
        argv:
          - curl
          - -k
          - -I
          - --resolve
          - "{{ item_endpoint['host'] }}:{{ item_endpoint['port'] }}:127.0.0.1"
          - "{{ item_endpoint['scheme'] }}://{{ item_endpoint['host'] }}/"
      changed_when: false
      register: site_responses
      loop:
        - {host: test.cluster.local, port: 80, scheme: http, expected: 'HTTP/1.1 301'}
        - {host: test.cluster.local, port: 443, scheme: https, expected: 'HTTP/1.1 2'}
        - {host: ci.cluster.local, port: 80, scheme: http, expected: 'HTTP/1.1 301'}
        - {host: ci.cluster.local, port: 443, scheme: https, expected: 'HTTP/1.1 2'}
        - {host: status.cluster.local, port: 80, scheme: http, expected: 'HTTP/1.1 301'}
        - {host: status.cluster.local, port: 443, scheme: https, expected: 'HTTP/1.1 2'}
      loop_control:
        loop_var: item_endpoint

    - name: Assert HTTP and HTTPS site responses
      ansible.builtin.assert:
        that:
          - item_response['rc'] == 0
          - item_response['item']['expected'] in item_response['stdout']
        loop: "{{ site_responses['results'] }}"
        loop_control:
          loop_var: item_response

    - name: Read certificate subjects
      ansible.builtin.command:
        argv: [openssl, x509, -in, "{{ item_certificate['path'] }}", -noout, -subject]
      changed_when: false
      register: certificate_subjects
      loop:
        - {path: /etc/ssl/certs/test.cluster.local.crt, name: test.cluster.local}
        - {path: /etc/ssl/certs/ci.cluster.local.crt, name: ci.cluster.local}
        - {path: /etc/ssl/certs/status.cluster.local.crt, name: status.cluster.local}
      loop_control:
        loop_var: item_certificate

    - name: Assert certificate common names
      ansible.builtin.assert:
        that: "('CN=' ~ item_subject['item']['name']) in item_subject['stdout']"
        loop: "{{ certificate_subjects['results'] }}"
        loop_control:
          loop_var: item_subject

    - name: Read UFW status
      ansible.builtin.command:
        argv: [ufw, status, verbose]
      changed_when: false
      register: ufw_status

    - name: Assert UFW expectations
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status['stdout']"
          - "'Default: deny (incoming)' in ufw_status['stdout']"
          - "'22/tcp' in ufw_status['stdout']"
          - "'80/tcp' in ufw_status['stdout']"
          - "'443/tcp' in ufw_status['stdout']"

    - name: Check fail2ban jails
      ansible.builtin.command:
        argv: [fail2ban-client, status, "{{ item_jail }}"]
      changed_when: false
      register: fail2ban_jails
      loop:
        - sshd
        - nginx-http-auth
        - nginx-limit-req
        - nginx-botsearch
      loop_control:
        loop_var: item_jail

    - name: Assert fail2ban jails are available
      ansible.builtin.assert:
        that: item_jail_result['rc'] == 0
        loop: "{{ fail2ban_jails['results'] }}"
        loop_control:
          loop_var: item_jail_result

    - name: Read fail2ban configuration
      ansible.builtin.slurp:
        src: /etc/fail2ban/jail.local
      register: fail2ban_configuration

    - name: Assert fail2ban configuration names required settings and jails
      ansible.builtin.assert:
        that:
          - "'bantime' in (fail2ban_configuration['content'] | b64decode)"
          - "'findtime' in (fail2ban_configuration['content'] | b64decode)"
          - "'maxretry' in (fail2ban_configuration['content'] | b64decode)"
          - "'sshd' in (fail2ban_configuration['content'] | b64decode)"
          - "'nginx-http-auth' in (fail2ban_configuration['content'] | b64decode)"
          - "'nginx-limit-req' in (fail2ban_configuration['content'] | b64decode)"
          - "'nginx-botsearch' in (fail2ban_configuration['content'] | b64decode)"
