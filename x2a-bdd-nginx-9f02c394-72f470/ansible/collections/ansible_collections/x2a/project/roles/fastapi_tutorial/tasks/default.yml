---
- name: Ensure FastAPI tutorial service user exists
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_service_user }}"
    state: present
    system: true
    create_home: false

- name: Install FastAPI tutorial system packages # noqa: R113 - package names are fixed literals in this task
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create FastAPI tutorial application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize FastAPI tutorial repository # noqa: R104,R106 - repository URL is the role's trusted HTTPS default source
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repo_url }}"
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - destination is a role-defined application directory
    version: "{{ fastapi_tutorial_repo_version }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command uses the role-defined virtual environment path
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}/bin/python" # noqa: R114 - path is a role-defined virtual environment

- name: Install FastAPI tutorial Python dependencies # noqa: R113 - requirements installation uses the role-defined application dependency file
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - requirements path is role-defined
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - virtualenv path is role-defined
    state: present

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_postgresql_service }}"
    enabled: true
    state: started

- name: Check whether the FastAPI PostgreSQL role exists # noqa: L039,R101,R108 - credentials are validated by the preceding task; SQL uses those credentials and inspection requires the postgres account
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ database_username }}';
  changed_when: false
  failed_when: false
  register: fastapi_tutorial_role_check
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create the FastAPI PostgreSQL role # noqa: L039,R101,R108 - credentials are validated by the preceding task; SQL uses those credentials and role creation requires the postgres account
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - CREATE USER {{ database_username }} WITH PASSWORD '{{ database_password }}';
  when: fastapi_tutorial_role_check.stdout | trim != '1'
  changed_when: true
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the FastAPI database exists # noqa: L039,R101,R108 - database name is validated by the preceding task; SQL uses it and inspection requires the postgres account
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}';
  changed_when: false
  failed_when: false
  register: fastapi_tutorial_database_check
  become: true
  become_user: postgres

- name: Create the FastAPI database # noqa: L039,R101,R108 - database credentials are validated by the preceding task; createdb uses them and database creation requires the postgres account
  ansible.builtin.command:
    argv:
      - createdb
      - -O
      - "{{ database_username }}"
      - "{{ database_name }}"
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  changed_when: true
  become: true
  become_user: postgres

- name: Grant privileges on the FastAPI database # noqa: L039,R101,R108 - database credentials are validated by the preceding task; SQL uses them and granting privileges requires the postgres account
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - GRANT {{ fastapi_tutorial_database_privileges }} ON DATABASE {{ database_name }} TO {{ database_username }};
  changed_when: false
  become: true
  become_user: postgres

- name: Write FastAPI tutorial environment configuration # noqa: L039 - database_url is validated by the preceding credential validation task
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="{{ fastapi_tutorial_project_name }}"
      API_VERSION={{ fastapi_tutorial_api_version }}
      DATABASE_URL={{ database_url }}
    dest: "{{ fastapi_tutorial_config_file }}" # noqa: R114 - configuration path is a role default
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI tutorial systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target {{ fastapi_tutorial_postgresql_service }}.service
      [Service]
      Type=simple
      User={{ fastapi_tutorial_service_user }}
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      EnvironmentFile=-{{ fastapi_tutorial_config_file }}
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn {{ fastapi_tutorial_app_module }} --host {{ fastapi_tutorial_bind_host }} --port {{ fastapi_tutorial_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: "{{ fastapi_tutorial_unit_file }}" # noqa: R114 - unit path is a role default
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd configuration

- name: Enable and start FastAPI tutorial service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
