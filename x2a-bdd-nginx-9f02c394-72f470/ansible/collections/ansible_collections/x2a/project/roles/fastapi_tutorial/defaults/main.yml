---
# Application deployment settings.
fastapi_tutorial_repo_url: https://github.com/dibanez/fastapi_tutorial.git
fastapi_tutorial_repo_version: main
fastapi_tutorial_app_dir: /opt/fastapi-tutorial
fastapi_tutorial_venv_dir: /opt/fastapi-tutorial/venv
fastapi_tutorial_bind_host: 0.0.0.0
fastapi_tutorial_port: 8000
fastapi_tutorial_app_module: app.main:app
fastapi_tutorial_service_name: fastapi-tutorial
fastapi_tutorial_service_user: root
fastapi_tutorial_config_file: /opt/fastapi-tutorial/.env
fastapi_tutorial_unit_file: /etc/systemd/system/fastapi-tutorial.service
fastapi_tutorial_project_name: FastAPI Tutorial
fastapi_tutorial_api_version: 1.0.0
fastapi_tutorial_postgresql_service: postgresql
fastapi_tutorial_database_privileges: ALL
# Secret-bearing tasks hide output by default; override only for troubleshooting.
fastapi_tutorial_secure_logging: true
