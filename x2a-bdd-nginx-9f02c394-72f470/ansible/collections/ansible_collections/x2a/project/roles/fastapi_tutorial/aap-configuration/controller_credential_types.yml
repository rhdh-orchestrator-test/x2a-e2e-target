---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the FastAPI application's PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL username used by the FastAPI application.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password assigned to the PostgreSQL fastapi user.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server.
        - id: database_url
          type: string
          label: Database Connection URL
          secret: true
          help_text: DATABASE_URL supplied to FastAPI; the configured URL contains the PostgreSQL credentials and connection details.
      required:
        - database_username
        - database_password
        - database_name
        - database_host
        - database_url
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
        database_url: !unsafe "{{ database_url }}"
