---
# Unsupported pre-flight checks: metadata values from stat, package inventory,
# service/status journal output, HTTP response headers, /health (conditional),
# full process/socket diagnostics, and credentialed PostgreSQL connectivity have
# no safe, explicit expected outcome here or would expose secrets.
- name: Verify fastapi-tutorial deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Check fastapi-tutorial directory exists
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: item_fastapi_directory

    - name: Assert fastapi-tutorial directory exists
      ansible.builtin.assert:
        that:
          - item_fastapi_directory.stat.exists
          - item_fastapi_directory.stat.isdir
        fail_msg: "The fastapi-tutorial application directory is missing."

    - name: Check application files and executables
      ansible.builtin.stat:
        path: "{{ item_fastapi_path }}"
      loop:
        - /opt/fastapi-tutorial/requirements.txt
        - /opt/fastapi-tutorial/venv
        - /opt/fastapi-tutorial/venv/bin/python
        - /opt/fastapi-tutorial/venv/bin/pip
        - /opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_fastapi_path
      register: item_fastapi_paths

    - name: Assert application files and executables exist
      ansible.builtin.assert:
        that:
          - item_fastapi_path_result.stat.exists
          - (not item_fastapi_path_result.item.endswith('/venv')) or item_fastapi_path_result.stat.isdir
          - (not item_fastapi_path_result.item.endswith(('/python', '/pip', '/uvicorn'))) or item_fastapi_path_result.stat.executable
        fail_msg: "A required FastAPI application file or executable is missing."
      loop: "{{ item_fastapi_paths.results }}"
      loop_control:
        loop_var: item_fastapi_path_result

    - name: Check application environment file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/.env
      register: item_fastapi_env

    - name: Assert application environment file exists
      ansible.builtin.assert:
        that:
          - item_fastapi_env.stat.exists
          - item_fastapi_env.stat.isreg

    - name: Read application environment variable names
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - '^(PROJECT_NAME|API_VERSION|DATABASE_URL)='
          - /opt/fastapi-tutorial/.env
      register: item_fastapi_env_keys
      changed_when: false
      failed_when: false
      no_log: true

    - name: Assert required application environment variables exist
      ansible.builtin.assert:
        that:
          - item_fastapi_env_keys.rc == 0
          - item_fastapi_env_keys.stdout is search('^PROJECT_NAME=', multiline=True)
          - item_fastapi_env_keys.stdout is search('^API_VERSION=', multiline=True)
          - item_fastapi_env_keys.stdout is search('^DATABASE_URL=', multiline=True)

    - name: Check FastAPI systemd unit file
      ansible.builtin.stat:
        path: /etc/systemd/system/fastapi-tutorial.service
      register: item_fastapi_unit_file

    - name: Assert FastAPI systemd unit file exists
      ansible.builtin.assert:
        that:
          - item_fastapi_unit_file.stat.exists
          - item_fastapi_unit_file.stat.isreg

    - name: Verify FastAPI systemd unit syntax
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/fastapi-tutorial.service
      register: item_fastapi_unit_verify
      changed_when: false

    - name: Assert FastAPI systemd unit syntax is valid
      ansible.builtin.assert:
        that:
          - item_fastapi_unit_verify.rc == 0

    - name: Read FastAPI systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: item_fastapi_unit_content

    - name: Assert required FastAPI systemd properties
      ansible.builtin.assert:
        that:
          - item_fastapi_unit_content.content | b64decode is search('(?m)^User=root$')
          - item_fastapi_unit_content.content | b64decode is search('(?m)^WorkingDirectory=/opt/fastapi-tutorial$')
          - item_fastapi_unit_content.content | b64decode is search('(?m)^ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000$')
          - item_fastapi_unit_content.content | b64decode is search('(?m)^Restart=always$')

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert FastAPI service is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['fastapi-tutorial.service']['status'] == 'running'
          - ansible_facts.services['fastapi-tutorial.service']['enabled'] == 'enabled'

    - name: Wait for FastAPI HTTP listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8000
        state: started
        timeout: 10

    - name: Check PostgreSQL service is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['postgresql.service']['status'] == 'running'
          - ansible_facts.services['postgresql.service']['enabled'] == 'enabled'

    - name: Wait for PostgreSQL listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5432
        state: started
        timeout: 10

    - name: Check PostgreSQL fastapi role
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT 1 FROM pg_roles WHERE rolname='fastapi';
      register: item_fastapi_role
      changed_when: false

    - name: Assert PostgreSQL fastapi role exists
      ansible.builtin.assert:
        that:
          - item_fastapi_role.rc == 0
          - item_fastapi_role.stdout | trim == '1'

    - name: Check PostgreSQL database owner
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT datname, pg_get_userbyid(datdba) FROM pg_database WHERE datname='fastapi_db';
      register: item_fastapi_database
      changed_when: false

    - name: Assert PostgreSQL database and owner
      ansible.builtin.assert:
        that:
          - item_fastapi_database.rc == 0
          - item_fastapi_database.stdout | trim == 'fastapi_db|fastapi'
