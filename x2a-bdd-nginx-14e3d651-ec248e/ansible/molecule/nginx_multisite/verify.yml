---
# Unsupported pre-flight diagnostics: detailed nginx.conf/security.conf output, UFW numbered
# output, journal tails, and the exact sysctl/SSH grep output have no additional stated
# expected value beyond the assertions below.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Gather service status facts
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['nginx.service']['state'] == 'running'
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'
        fail_msg: nginx and fail2ban must be active.

    - name: Check nginx and fail2ban are enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item_service }}"
      changed_when: false
      register: service_enabled_checks
      loop:
        - nginx.service
        - fail2ban.service
      loop_control:
        loop_var: item_service

    - name: Assert nginx and fail2ban are enabled
      ansible.builtin.assert:
        that: item_service_check['rc'] == 0
        fail_msg: A required service is not enabled.
      loop: "{{ service_enabled_checks['results'] }}"
      loop_control:
        loop_var: item_service_check

    - name: Test nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      register: nginx_config_test

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that: nginx_config_test['rc'] == 0
        fail_msg: nginx configuration test failed.

    - name: Check required deployment paths
      ansible.builtin.stat:
        path: "{{ item_path }}"
        follow: false
      register: required_paths
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /opt/server/test
        - /opt/server/test/index.html
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /opt/server/ci
        - /opt/server/ci/index.html
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
        - /opt/server/status
        - /opt/server/status/index.html
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
      loop_control:
        loop_var: item_path

    - name: Assert required files and directories exist
      ansible.builtin.assert:
        that: item_path_check['stat']['exists']
        fail_msg: A required deployment path is missing.
      loop: "{{ required_paths['results'] }}"
      loop_control:
        loop_var: item_path_check

    - name: Assert document roots are directories
      ansible.builtin.assert:
        that: item_root_check['stat']['isdir']
        fail_msg: A document root is not a directory.
      loop: "{{ required_paths['results'] | selectattr('item', 'in', ['/opt/server/test', '/opt/server/ci', '/opt/server/status']) | list }}"
      loop_control:
        loop_var: item_root_check

    - name: Assert enabled sites are symbolic links
      ansible.builtin.assert:
        that: item_link_check['stat']['islnk']
        fail_msg: An enabled site is not a symbolic link.
      loop: "{{ required_paths['results'] | selectattr('item', 'in', ['/etc/nginx/sites-enabled/test.cluster.local', '/etc/nginx/sites-enabled/ci.cluster.local', '/etc/nginx/sites-enabled/status.cluster.local']) | list }}"
      loop_control:
        loop_var: item_link_check

    - name: Check default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
        follow: false
      register: default_site

    - name: Assert default nginx site is absent
      ansible.builtin.assert:
        that: not default_site['stat']['exists']
        fail_msg: The default nginx site must be absent.

    - name: Check private key ownership and permissions
      ansible.builtin.stat:
        path: "{{ item_key_path }}"
      register: private_key_stats
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key_path

    - name: Assert private key ownership and mode
      ansible.builtin.assert:
        that:
          - item_key_stat['stat']['pw_name'] == 'root'
          - item_key_stat['stat']['gr_name'] == 'ssl-cert'
          - item_key_stat['stat']['mode'] == '0640'
        fail_msg: A TLS private key has incorrect ownership or permissions.
      loop: "{{ private_key_stats['results'] }}"
      loop_control:
        loop_var: item_key_stat

    - name: Check HTTP virtual hosts
      ansible.builtin.command:
        argv:
          - curl
          - -I
          - -H
          - "Host: {{ item_http_host }}"
          - http://127.0.0.1/
      changed_when: false
      register: http_checks
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_http_host

    - name: Assert HTTP virtual hosts respond
      ansible.builtin.assert:
        that: item_http_check['rc'] == 0
        fail_msg: An HTTP virtual host did not respond.
      loop: "{{ http_checks['results'] }}"
      loop_control:
        loop_var: item_http_check

    - name: Check HTTPS virtual hosts
      ansible.builtin.command:
        argv:
          - curl
          - -k
          - -I
          - --resolve
          - "{{ item_https_host }}:443:127.0.0.1"
          - "https://{{ item_https_host }}/"
      changed_when: false
      register: https_checks
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_https_host

    - name: Assert HTTPS virtual hosts respond
      ansible.builtin.assert:
        that: item_https_check['rc'] == 0
        fail_msg: An HTTPS virtual host did not respond.
      loop: "{{ https_checks['results'] }}"
      loop_control:
        loop_var: item_https_check

    - name: Inspect TLS certificates
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
          - -issuer
          - -dates
      changed_when: false
      register: certificate_checks
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          hostname: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          hostname: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          hostname: status.cluster.local
      loop_control:
        loop_var: item_certificate

    - name: Assert certificates are self-signed with matching subjects
      ansible.builtin.assert:
        that:
          - item_certificate_check['rc'] == 0
          - "'CN=' ~ item_certificate_check['item']['hostname'] in item_certificate_check['stdout']"
          - "('subject=' in item_certificate_check['stdout'])"
          - "('issuer=' in item_certificate_check['stdout'])"
        fail_msg: A TLS certificate is invalid or has the wrong subject.
      loop: "{{ certificate_checks['results'] }}"
      loop_control:
        loop_var: item_certificate_check

    - name: Check UFW policy and allowed services
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      changed_when: false
      register: ufw_status

    - name: Assert UFW is active with required policy and rules
      ansible.builtin.assert:
        that:
          - ufw_status['rc'] == 0
          - "'Status: active' in ufw_status['stdout']"
          - "'Default: deny (incoming)' in ufw_status['stdout']"
          - "'22/tcp' in ufw_status['stdout'] or 'SSH' in ufw_status['stdout']"
          - "'80/tcp' in ufw_status['stdout'] or 'HTTP' in ufw_status['stdout']"
          - "'443/tcp' in ufw_status['stdout'] or 'HTTPS' in ufw_status['stdout']"
        fail_msg: UFW is not active with the required policy and rules.

    - name: Read SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: ssh_config

    - name: Assert SSH root login and password authentication are disabled
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (ssh_config['content'] | b64decode)"
          - "'PasswordAuthentication no' in (ssh_config['content'] | b64decode)"
        fail_msg: SSH hardening settings are missing.

    - name: Check fail2ban status
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
      changed_when: false
      register: fail2ban_status

    - name: Assert fail2ban is operational
      ansible.builtin.assert:
        that: fail2ban_status['rc'] == 0
        fail_msg: fail2ban status check failed.

    - name: Apply the explicit sysctl diagnostic
      ansible.builtin.command:
        argv:
          - sysctl
          - -p
          - /etc/sysctl.d/99-security.conf
      changed_when: false
      register: sysctl_check

    - name: Assert the security sysctl file loads successfully
      ansible.builtin.assert:
        that: sysctl_check['rc'] == 0
        fail_msg: The security sysctl file did not load successfully.

    - name: Check nginx listeners
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      changed_when: false
      register: listener_check

    - name: Assert nginx listens on HTTP and HTTPS ports
      ansible.builtin.assert:
        that:
          - listener_check['rc'] == 0
          - listener_check['stdout'] is search(':80\\s')
          - listener_check['stdout'] is search(':443\\s')
        fail_msg: Nginx is not listening on both required TCP ports.
