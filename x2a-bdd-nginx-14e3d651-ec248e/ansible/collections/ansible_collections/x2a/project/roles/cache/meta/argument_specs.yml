---
argument_specs:
  main:
    short_description: Install and configure Memcached and Redis cache services
    description:
      - Installs Memcached and configures a standalone authenticated Redis cache on port 6379.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks that handle the Redis password.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
