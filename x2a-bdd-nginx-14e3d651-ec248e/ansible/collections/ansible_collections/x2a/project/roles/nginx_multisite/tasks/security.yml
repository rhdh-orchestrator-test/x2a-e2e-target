---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
      - procps
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Configure fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Check UFW default policy
  ansible.builtin.command:
    cmd: ufw status verbose
  register: nginx_multisite_ufw_status
  changed_when: false
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default incoming policy
  ansible.builtin.command:
    cmd: ufw --force default deny incoming
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Default: deny (incoming)' not in nginx_multisite_ufw_status.stdout" # noqa: L039 - registered by the preceding UFW status check

- name: Check SSH UFW rule
  ansible.builtin.command:
    cmd: ufw status
  register: nginx_multisite_ufw_ssh_status
  changed_when: false
  when: nginx_multisite_ufw_enabled | bool

- name: Allow SSH through UFW
  ansible.builtin.command:
    cmd: ufw allow ssh
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'22/tcp' not in nginx_multisite_ufw_ssh_status.stdout" # noqa: L039 - registered by the preceding SSH UFW status check

- name: Check HTTP UFW rule
  ansible.builtin.command:
    cmd: ufw status
  register: nginx_multisite_ufw_http_status
  changed_when: false
  when: nginx_multisite_ufw_enabled | bool

- name: Allow HTTP through UFW
  ansible.builtin.command:
    cmd: ufw allow http
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'80/tcp' not in nginx_multisite_ufw_http_status.stdout" # noqa: L039 - registered by the preceding HTTP UFW status check

- name: Check HTTPS UFW rule
  ansible.builtin.command:
    cmd: ufw status
  register: nginx_multisite_ufw_https_status
  changed_when: false
  when: nginx_multisite_ufw_enabled | bool

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    cmd: ufw allow https
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'443/tcp' not in nginx_multisite_ufw_https_status.stdout" # noqa: L039 - registered by the preceding HTTPS UFW status check

- name: Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  when:
    - nginx_multisite_ufw_enabled | bool
    - "'Status: active' not in nginx_multisite_ufw_status.stdout" # noqa: L039 - registered by the preceding UFW status check

- name: Create sysctl configuration directory
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload security sysctl

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    create: false
    backup: true
  when: nginx_multisite_ssh_disable_root | bool
  notify: Reload ssh

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    create: false
    backup: true
  when: not nginx_multisite_ssh_password_auth | bool
  notify: Reload ssh
