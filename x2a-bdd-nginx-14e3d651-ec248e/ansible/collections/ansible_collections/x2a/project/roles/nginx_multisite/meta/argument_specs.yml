---
argument_specs:
  main:
    short_description: Configures nginx with multiple SSL-enabled subdomains
    description:
      - Installs and configures nginx, TLS certificates, virtual hosts, and host security settings.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of virtual host names to document roots and SSL settings.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated TLS certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated TLS private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban should be enabled and started.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall rules should be configured.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether SSH root login should be disabled.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
