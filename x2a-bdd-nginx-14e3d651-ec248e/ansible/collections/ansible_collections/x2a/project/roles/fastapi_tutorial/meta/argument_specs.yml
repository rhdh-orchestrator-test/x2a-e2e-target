---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application
    description:
      - Deploys the FastAPI tutorial application, its Python environment, PostgreSQL dependencies, and systemd service.
    options:
      fastapi_tutorial_package_names:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
        description: Operating system packages required by the application.
      fastapi_tutorial_app_directory:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_virtualenv:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment path.
      fastapi_tutorial_requirements_file:
        type: str
        required: false
        default: /opt/fastapi-tutorial/requirements.txt
        description: Python requirements file path.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: "{{ db_host }}"
        description: Database host supplied by the AAP credential.
      fastapi_tutorial_database_port:
        type: str
        required: false
        default: "{{ db_port }}"
        description: Database port supplied by the AAP credential.
      fastapi_tutorial_database_name:
        type: str
        required: false
        default: "{{ database_name }}"
        description: Database name supplied by the AAP credential.
      fastapi_tutorial_database_user:
        type: str
        required: false
        default: "{{ db_username }}"
        description: Database username supplied by the AAP credential.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_service_file:
        type: str
        required: false
        default: /etc/systemd/system/fastapi-tutorial.service
        description: Systemd unit file path.
      fastapi_tutorial_listen_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Address on which Uvicorn listens.
      fastapi_tutorial_listen_port:
        type: int
        required: false
        default: 8000
        description: TCP port on which Uvicorn listens.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Application project name written to the environment file.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version written to the environment file.
      fastapi_tutorial_runtime_user:
        type: str
        required: false
        default: root
        description: User running the application service.
      fastapi_tutorial_runtime_group:
        type: str
        required: false
        default: root
        description: Group owning the application files.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks handling the database password.
