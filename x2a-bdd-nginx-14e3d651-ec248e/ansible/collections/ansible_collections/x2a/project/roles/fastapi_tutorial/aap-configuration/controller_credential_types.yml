---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the FastAPI application to authenticate to its PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server; the migration uses localhost.
        - id: db_port
          type: string
          label: Database Port
          help_text: PostgreSQL listening port; the migration uses the default port 5432.
        - id: database_name
          type: string
          label: Database Name
          help_text: "PostgreSQL database used by the FastAPI application: fastapi_db."
        - id: db_username
          type: string
          label: Database Username
          help_text: "PostgreSQL role used by the FastAPI application: fastapi."
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role, used both to create the role and authenticate the application.
      required:
        - db_host
        - db_port
        - database_name
        - db_username
        - db_password
    injectors:
      extra_vars:
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
        database_name: !unsafe "{{ database_name }}"
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
