---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI tutorial system packages
  ansible.builtin.package: # noqa: R113 - package list is a fixed role default, not user input
    name: "{{ fastapi_tutorial_package_names }}"
    state: present

- name: Ensure FastAPI tutorial runtime group exists
  ansible.builtin.group:
    name: "{{ fastapi_tutorial_runtime_group }}"
    state: present

- name: Ensure FastAPI tutorial runtime user exists
  ansible.builtin.user:
    name: "{{ fastapi_tutorial_runtime_user }}"
    group: "{{ fastapi_tutorial_runtime_group }}"
    state: present
    create_home: false

- name: Create FastAPI tutorial application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_directory }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: "{{ fastapi_tutorial_runtime_user }}"
    group: "{{ fastapi_tutorial_runtime_group }}"
    mode: "0755"

- name: Synchronize FastAPI tutorial repository # noqa: R104 - repository URL is an HTTPS role default
  ansible.builtin.git: # noqa: R106 - repository source is a trusted role default, not external user input
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_directory }}" # noqa: R114 - path is a role default, not user input
    version: "{{ fastapi_tutorial_revision }}"

- name: Create FastAPI tutorial virtual environment # noqa: R101 - command uses a trusted role-default path
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_virtualenv }}"
    creates: "{{ fastapi_tutorial_virtualenv }}" # noqa: R114 - path is a role default, not user input

- name: Install FastAPI tutorial Python dependencies # noqa: R113 - requirements file is a fixed role-default path
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_requirements_file }}" # noqa: R114 - path is a role default, not user input
    virtualenv: "{{ fastapi_tutorial_virtualenv }}" # noqa: R114 - path is a role default, not user input

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create FastAPI PostgreSQL role # noqa: L039 - database credentials are required role inputs
  ansible.builtin.shell: # noqa: R101 - command uses trusted database role inputs
    cmd: |
      if ! psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ db_username }}'" | grep -q 1; then
        psql -d postgres -c "CREATE ROLE {{ db_username }} LOGIN PASSWORD '{{ db_password }}';"
      fi
  changed_when: false
  become: true # noqa: R108 - PostgreSQL role creation must run as the postgres user
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create FastAPI PostgreSQL database # noqa: L039 - database identifiers are required role inputs
  ansible.builtin.shell: # noqa: R101 - command uses trusted database role inputs
    cmd: |
      if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='{{ database_name }}'" | grep -q 1; then
        createdb -O "{{ db_username }}" "{{ database_name }}"
      fi
  changed_when: false
  become: true # noqa: R108 - PostgreSQL database creation must run as the postgres user
  become_user: postgres

- name: Grant FastAPI database privileges # noqa: L039 - database identifiers are required role inputs
  ansible.builtin.shell: # noqa: R101 - command uses trusted database role inputs
    cmd: >-
      psql -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ db_username }};"
  changed_when: false
  become: true # noqa: R108 - PostgreSQL privilege management must run as the postgres user
  become_user: postgres

- name: Render FastAPI tutorial environment configuration
  ansible.builtin.template:
    src: fastapi_tutorial.env.j2
    dest: "{{ fastapi_tutorial_app_directory }}/.env" # noqa: R114 - path is a role default, not user input
    owner: "{{ fastapi_tutorial_runtime_user }}"
    group: "{{ fastapi_tutorial_runtime_group }}"
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI tutorial systemd unit
  ansible.builtin.template:
    src: fastapi_tutorial.service.j2
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - path is a role default, not user input
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before managing the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
