---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis

    # Create Redis configuration file
    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          port 6379
          bind 127.0.0.1
          dir /var/lib/redis
          logfile /var/log/redis/redis.log
          requirepass redis_secure_password_123
          maxmemory 256mb
          # Note: The following replication settings should be removed by the role
          # replica-serve-stale-data yes
          # replica-read-only yes
          # repl-ping-replica-period 10
          # client-output-buffer-limit slave 256mb 64mb 60
          # replica-priority 100
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0644"

    # Create Redis log file
    - name: Create Redis log file
      ansible.builtin.copy:
        content: "Redis server started\n"
        dest: /tmp/molecule_test/var/log/redis/redis.log
        mode: "0644"

    # Create Memcached configuration file
    - name: Create Memcached configuration file
      ansible.builtin.copy:
        content: |
          # memcached default config file
          -d
          logfile /var/log/memcached.log
          -m 64
          -p 11211
          -u memcache
          -g memcache
          -l 127.0.0.1
          -c 1024
          -P /var/run/memcached/memcached.pid
          -U 0
        dest: /tmp/molecule_test/etc/memcached.conf
        mode: "0644"

    # Create a fixed Redis configuration file (after role execution)
    - name: Create fixed Redis configuration file (post-execution)
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          port 6379
          bind 127.0.0.1
          dir /var/lib/redis
          logfile /var/log/redis/redis.log
          requirepass redis_secure_password_123
          maxmemory 256mb
          # Note: The following replication settings have been removed by the role
        dest: /tmp/molecule_test/etc/redis/6379.conf.fixed
        mode: "0644"