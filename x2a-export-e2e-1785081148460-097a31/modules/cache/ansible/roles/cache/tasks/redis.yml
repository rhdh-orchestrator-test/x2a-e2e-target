---
- name: Ensure Redis user and group exist
  ansible.builtin.user:
    name: redis
    group: redis
    system: true
    create_home: false
    shell: /sbin/nologin
    state: present
- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ redis_logdir }}"
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true
- name: Include Redis role from eloy.redis collection
  ansible.builtin.include_role:
    name: eloy.redis.redis
  vars:
    redis_port: "{{ redis_port }}"
    redis_bind: "{{ redis_bind_address }}"
    redis_requirepass: "{{ redis_requirepass }}"
    redis_maxmemory: "{{ redis_maxmemory }}"
    redis_dir: "{{ redis_dir }}"
    redis_logfile: "{{ redis_logfile }}"
    redis_replication_enabled: "{{ redis_replication_enabled }}"
- name: Fix Redis configuration by removing replication settings
  ansible.builtin.lineinfile:
    path: /etc/redis/{{ redis_port }}.conf
    regexp: "{{ item }}"
    state: absent
  loop:
    - ^replica-serve-stale-data.*$
    - ^replica-read-only.*$
    - ^repl-ping-replica-period.*$
    - ^client-output-buffer-limit.*$
    - ^replica-priority.*$
  notify: Restart redis
