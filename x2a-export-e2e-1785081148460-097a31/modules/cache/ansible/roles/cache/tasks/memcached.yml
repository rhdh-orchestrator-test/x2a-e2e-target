---
- name: Ensure Memcached user and group exist
  ansible.builtin.user:
    name: "{{ memcached_user }}"
    group: "{{ memcached_group }}"
    system: true
    create_home: false
    shell: /sbin/nologin
    state: present
- name: Install memcached package
  ansible.builtin.package:
    name: memcached
    state: present
- name: Create memcached configuration
  ansible.builtin.template:
    src: memcached.conf.j2
    dest: /etc/memcached.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart memcached
- name: Ensure memcached service is enabled and running
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
