---
controller_credentials:
- name: Chef Admin User - chef_deployment
  description: Credential for chef_deployment
  organization: Default
  credential_type: Chef Admin User
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    email: '{{ email }}'
    full_name: '{{ full_name }}'
- name: SSL Certificates - chef_deployment
  description: Credential for chef_deployment
  organization: Default
  credential_type: SSL Certificates
  update_secrets: true
  inputs:
    certificate: '{{ vault_certificate }}'
    private_key: '{{ vault_private_key }}'
- name: Chef Organization Validator - chef_deployment
  description: Credential for chef_deployment
  organization: Default
  credential_type: Chef Organization Validator
  update_secrets: true
  inputs:
    organization_name: '{{ organization_name }}'
    organization_full_name: '{{ organization_full_name }}'
    validator_key: '{{ vault_validator_key }}'
