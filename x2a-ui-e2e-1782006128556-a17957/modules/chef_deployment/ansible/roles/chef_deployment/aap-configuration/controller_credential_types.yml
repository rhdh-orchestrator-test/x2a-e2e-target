---
controller_credential_types:
- name: Chef Admin User
  description: Credential type for Chef Admin User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef administrator username
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef administrator user
    - id: email
      type: string
      label: Email
      help_text: Email address for the Chef administrator user
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the Chef administrator user
    required:
    - username
    - password
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
      full_name: !unsafe '{{ full_name }}'
- name: SSL Certificates
  description: Credential type for SSL Certificates
  kind: cloud
  inputs:
    fields:
    - id: certificate
      type: string
      label: SSL Certificate
      secret: true
      help_text: Self-signed SSL certificate for Apache HTTPS
    - id: private_key
      type: string
      label: SSL Private Key
      secret: true
      help_text: Private key for the SSL certificate
    required:
    - certificate
    - private_key
  injectors:
    extra_vars:
      certificate: !unsafe '{{ certificate }}'
      private_key: !unsafe '{{ private_key }}'
- name: Chef Organization Validator
  description: Credential type for Chef Organization Validator
  kind: cloud
  inputs:
    fields:
    - id: organization_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: organization_full_name
      type: string
      label: Organization Full Name
      help_text: Full name of the Chef organization
    - id: validator_key
      type: string
      label: Validator Key
      secret: true
      help_text: Organization validator key for Chef Infra Server
    required:
    - organization_name
    - validator_key
  injectors:
    extra_vars:
      organization_name: !unsafe '{{ organization_name }}'
      organization_full_name: !unsafe '{{ organization_full_name }}'
      validator_key: !unsafe '{{ validator_key }}'
