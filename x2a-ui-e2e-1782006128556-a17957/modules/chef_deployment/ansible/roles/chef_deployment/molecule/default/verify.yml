---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Hostname verification
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Chef Automate CLI
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # User key file
    - name: Check user key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-admin.pem
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.isreg
          - user_key_file.stat.size > 0
        fail_msg: "User key file not found or empty"
        success_msg: "User key file exists"

    # Organization validator key file
    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-org-validator.pem
      register: org_validator_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_validator_file.stat.exists
          - org_validator_file.stat.isreg
          - org_validator_file.stat.size > 0
        fail_msg: "Organization validator key file not found or empty"
        success_msg: "Organization validator key file exists"

    # Chef Automate service file
    - name: Check Chef Automate service file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      register: chef_automate_service

    - name: Assert Chef Automate service file exists
      ansible.builtin.assert:
        that:
          - chef_automate_service.stat.exists
          - chef_automate_service.stat.isreg
        fail_msg: "Chef Automate service file not found"
        success_msg: "Chef Automate service file exists"

    # Chef Server status files
    - name: Check Chef Server status files exist
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/chef-server/{{ item }}_status"
      register: chef_server_status
      loop:
        - nginx
        - postgresql
        - bookshelf
        - oc_bifrost
        - oc_id
        - opscode-erchef
        - opscode-solr4

    - name: Assert Chef Server status files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Chef Server status file for {{ item.item }} not found"
        success_msg: "Chef Server status file for {{ item.item }} exists"
      loop: "{{ chef_server_status.results }}"

    # The following checks would run on a real system but can't run in a container
    # They are tagged with molecule-notest to be skipped during molecule testing

    - name: Check system parameters
      ansible.builtin.command:
        cmd: sysctl vm.max_map_count vm.dirty_expire_centisecs
      register: sysctl_result
      changed_when: false
      tags: molecule-notest

    - name: Assert system parameters are set correctly
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count = 262144' in sysctl_result.stdout"
          - "'vm.dirty_expire_centisecs = 20000' in sysctl_result.stdout"
        fail_msg: "System parameters not set correctly"
        success_msg: "System parameters set correctly"
      tags: molecule-notest

    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: chef_automate_status
      changed_when: false
      tags: molecule-notest

    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status_cmd
      changed_when: false
      tags: molecule-notest

    - name: Check user verification
      ansible.builtin.command:
        cmd: sudo chef-server-ctl user-list
      register: chef_user_list
      changed_when: false
      tags: molecule-notest

    - name: Assert user exists
      ansible.builtin.assert:
        that:
          - "'chef-admin' in chef_user_list.stdout"
        fail_msg: "Chef user not found"
        success_msg: "Chef user exists"
      tags: molecule-notest

    - name: Check organization verification
      ansible.builtin.command:
        cmd: sudo chef-server-ctl org-list
      register: chef_org_list
      changed_when: false
      tags: molecule-notest

    - name: Assert organization exists
      ansible.builtin.assert:
        that:
          - "'chef-org' in chef_org_list.stdout"
        fail_msg: "Chef organization not found"
        success_msg: "Chef organization exists"
      tags: molecule-notest

    - name: Check web UI accessibility
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
      register: web_ui_result
      tags: molecule-notest

    - name: Check status endpoint
      ansible.builtin.uri:
        url: https://localhost/_status
        validate_certs: false
      register: status_endpoint_result
      tags: molecule-notest

    - name: Check network listening
      ansible.builtin.command:
        cmd: ss -tlnp | grep 443
      register: network_listening
      changed_when: false
      tags: molecule-notest

    - name: Check service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "ansible_facts.services['chef-automate.service'].state == 'running'"
        fail_msg: "Chef Automate service not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest