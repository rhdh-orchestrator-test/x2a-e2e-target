---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache
    description:
      - Fixes the POODLE SSL vulnerability in Apache web server by updating SSL protocol configuration.
      - Installs Apache if not present and enables the SSL module.
      - Disables vulnerable SSL protocols and enables only TLSv1.2.
      - Restarts Apache service after configuration changes.
    options:
      ssl_config_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file.
      ssl_protocol_config:
        type: str
        required: false
        default: SSLProtocol -all +TLSv1.2
        description: SSL protocol configuration string to apply.
      apache_service_name:
        type: str
        required: false
        default: apache2
        description: Name of Apache service to restart.
      apache_package_name:
        type: str
        required: false
        default: apache2
        description: Name of Apache package to install.
      restart_sshd:
        type: bool
        required: false
        default: false
        description: Whether to restart SSH daemon after SSL changes.
