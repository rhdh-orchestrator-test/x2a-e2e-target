---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Redis cache with the Private Hub role  # noqa: L038 - eloy.redis.redis is a private dependency unavailable in this collection
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_password }}"
    redis_replication_enabled: "{{ cache_redis_replication_enabled }}"
    redis_cluster_enabled: "{{ cache_redis_cluster_enabled }}"
    redis_sentinel_enabled: "{{ cache_redis_sentinel_enabled }}"
    redis_aof_enabled: "{{ cache_redis_aof_enabled }}"
    redis_rdb_enabled: "{{ cache_redis_rdb_enabled }}"

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Check whether Redis configuration exists
  ansible.builtin.stat:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
  register: cache_redis_config_stat

- name: Remove obsolete replication directives from Redis configuration  # noqa: L039 - cache_redis_config_stat is registered by the preceding stat task
  ansible.builtin.replace:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    regexp: (?m)^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$ ?
    replace: ""
    backup: true
  when: cache_redis_config_stat.stat.exists
  notify: Restart Redis after configuration cleanup
