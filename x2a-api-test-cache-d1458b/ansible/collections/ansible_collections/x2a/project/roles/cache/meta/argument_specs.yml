---
argument_specs:
  main:
    short_description: Configure a standalone Redis cache instance.
    description:
      - Configures Redis on the cache host through the eloy.redis collection.
      - Sets the standalone topology, listener port, persistence options, and log/configuration paths.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to hide output from tasks that handle Redis credentials.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port used by the Redis instance.
      cache_redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis replication is enabled.
      cache_redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis cluster mode is enabled.
      cache_redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis Sentinel mode is enabled.
      cache_redis_aof_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis append-only-file persistence is enabled.
      cache_redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Whether Redis RDB persistence is enabled.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Directory used for Redis logs.
      cache_redis_config_path:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration file path used by the cleanup task.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
