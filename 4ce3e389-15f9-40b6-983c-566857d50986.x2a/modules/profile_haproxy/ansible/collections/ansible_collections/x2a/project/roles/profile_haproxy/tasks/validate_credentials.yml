---
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - not haproxy_stats_enabled or stats_username is defined
      - not haproxy_stats_enabled or stats_password is defined
    fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template when HAProxy statistics are enabled.
    quiet: true
