---
controller_credential_types:
  - name: HAProxy Statistics Authentication
    description: Credentials for authenticating to the HAProxy statistics endpoint. The password is currently a control-repository secret/encrypted Hiera value 
      and is designated for migration to the Ansible Vault variable vault_haproxy_stats_password.
    kind: cloud
    inputs:
      fields:
        - id: stats_username
          type: string
          label: Statistics Username
          help_text: Username used to authenticate to the HAProxy statistics endpoint.
        - id: stats_password
          type: string
          label: Statistics Password
          secret: true
          help_text: Password used to authenticate to the HAProxy statistics endpoint; migrate this value to Ansible Vault as vault_haproxy_stats_password.
      required:
        - stats_username
        - stats_password
    injectors:
      extra_vars:
        stats_username: !unsafe "{{ stats_username }}"
        stats_password: !unsafe "{{ stats_password }}"
