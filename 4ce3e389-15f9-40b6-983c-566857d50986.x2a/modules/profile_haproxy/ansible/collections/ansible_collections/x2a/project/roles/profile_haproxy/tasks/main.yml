---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Load operating system variables
  ansible.builtin.include_vars: os/{{ ansible_facts['os_family'] }}.yml
  when: ansible_facts['os_family'] is defined

- name: Load common role variables
  ansible.builtin.include_vars: common.yml
  when: haproxy_config_dir is defined

- name: Load control repository variables
  ansible.builtin.include_vars: control_repository.yml
  when: haproxy_config_dir is defined

- name: Install HAProxy
  ansible.builtin.include_tasks: install.yml

- name: Configure HAProxy
  ansible.builtin.include_tasks: config.yml

- name: Manage HAProxy service
  ansible.builtin.include_tasks: service.yml

- name: Manage HAProxy firewall
  ansible.builtin.include_tasks: firewall.yml

- name: Discover HAProxy backend members
  ansible.builtin.include_tasks: discover.yml
  when: haproxy_discovery_enabled | bool
