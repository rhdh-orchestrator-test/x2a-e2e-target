---
controller_credentials:
  - name: HAProxy Statistics Authentication - profile_haproxy
    description: Credentials for authenticating to the HAProxy statistics endpoint. The password is currently a control-repository secret/encrypted Hiera value 
      and is designated for migration to the Ansible Vault variable vault_haproxy_stats_password.
    organization: Default
    credential_type: HAProxy Statistics Authentication
    update_secrets: true
    inputs:
      stats_username: "{{ stats_username }}"
      stats_password: "{{ vault_stats_password }}"
