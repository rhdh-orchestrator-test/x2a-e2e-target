---
- name: Install Apache web server
  ansible.builtin.package:
    name: apache2
    state: present
  when: manage_apache_service | bool
- name: Enable Apache SSL module
  ansible.builtin.command:
    cmd: a2enmod ssl
    creates: /etc/apache2/mods-enabled/ssl.conf
  notify:
    - Restart apache2
  when: manage_apache_service | bool
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: "{{ apache_ssl_config_path }}"
    regexp: ^SSLProtocol.*$
    replace: "{{ ssl_protocol_config }}"
    backup: true
  notify:
    - Restart apache2
  when: manage_apache_service | bool
