---
- name: Ensure directory exists for Chef Automate CLI
  ansible.builtin.file:
    path: "{{ chef_automate_binary_path | dirname }}"
    state: directory
    mode: "0755"
  when: chef_automate_binary_path != './chef-automate'
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_binary_path }}
    stdin: "{{ lookup('ansible.builtin.file', '/tmp/chef-automate_linux_amd64.zip') }}"
    creates: "{{ chef_automate_binary_path }}"
  args:
    executable: /bin/bash
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_binary_path }}"
    mode: "0755"
    state: file
- name: Build Chef Automate deployment command
  ansible.builtin.set_fact:
    deploy_command: ./chef-automate deploy
- name: Add Automate product to deployment command
  ansible.builtin.set_fact:
    deploy_command: "{{ deploy_command }} --product automate"
  when: deploy_automate | bool
- name: Add Infra Server product to deployment command
  ansible.builtin.set_fact:
    deploy_command: "{{ deploy_command }} --product infra-server"
  when: deploy_infra_server | bool
- name: Add MLSA acceptance to deployment command
  ansible.builtin.set_fact:
    deploy_command: "{{ deploy_command }} --accept-terms-and-mlsa=true"
  when: accept_terms_and_mlsa | bool
- name: Deploy Chef Automate and/or Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ deploy_command }}"
  become: true
  args:
    creates: /hab
  register: deploy_result
  changed_when: deploy_result.rc == 0
