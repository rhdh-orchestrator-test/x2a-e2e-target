- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    full_name: John Tonello
    email: jtonello@chef.lab
    password: password
    hostname: automate.chef.lab
    orgname: lab
    longorgname: Chef Lab
    userfilename: jtonello.pem
    orgfilename: lab-validator.pem
    vm_max_map_count: 262144
    vm_dirty_expire_centisecs: 20000
    chef_automate_binary_path: /tmp/molecule_test/chef-automate
    deploy_automate: true
    deploy_infra_server: true
    accept_terms_and_mlsa: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/etc/sysctl.d
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = {{ vm_max_map_count }}

        vm.dirty_expire_centisecs = {{ vm_dirty_expire_centisecs }}

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI binary file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Mock'' '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAzMOKchwJ5UsxGXQxXAG2UDgWcrH9mj9JuFHYS1YDwkPg/pOy

        HjIvIGqOLENi4YxGYq4Lz1geFLYJUTU2LGS5wNJcJKJj+ftfzvbFHio9JBkpIz7V

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ userfilename }}
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0FPPBEGHiALG8I8VYZGlQjU+P8UMqGpzk2vUTPnPYeXANqXS

        wNyyfSJVUHfUUf/NLrHloVQctWK0mOrGA7yY5nLyQUTUBJqAQ4CJiBqMhzXKlHcM

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ orgfilename }}
      mode: '0600'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create mock chef-server-ctl user-list output
    ansible.builtin.copy:
      content: '{{ username }}'
      dest: /tmp/molecule_test/chef-server-user-list
      mode: '0644'
  - name: Create mock chef-server-ctl user-show output
    ansible.builtin.copy:
      content: 'username: {{ username }}

        display_name: {{ full_name }}

        email: {{ email }}

        '
      dest: /tmp/molecule_test/chef-server-user-show-{{ username }}
      mode: '0644'
  - name: Create mock chef-server-ctl org-list output
    ansible.builtin.copy:
      content: '{{ orgname }}'
      dest: /tmp/molecule_test/chef-server-org-list
      mode: '0644'
  - name: Create mock chef-server-ctl org-show output
    ansible.builtin.copy:
      content: 'name: {{ orgname }}

        full_name: {{ longorgname }}

        associated_users: {{ username }}

        '
      dest: /tmp/molecule_test/chef-server-org-show-{{ orgname }}
      mode: '0644'
  - name: Create mock chef-automate status output
    ansible.builtin.copy:
      content: 'Service: automate-gateway

        Status: running

        Service: automate-ui

        Status: running

        Service: infra-server

        Status: running

        '
      dest: /tmp/molecule_test/chef-automate-status
      mode: '0644'
  - name: Create mock chef-server-ctl status output
    ansible.builtin.copy:
      content: 'run: chef-server; (pid 12345) 1234s; run: log: (pid 12346) 1234s

        run: nginx; (pid 12347) 1234s; run: log: (pid 12348) 1234s

        '
      dest: /tmp/molecule_test/chef-server-ctl-status
      mode: '0644'
