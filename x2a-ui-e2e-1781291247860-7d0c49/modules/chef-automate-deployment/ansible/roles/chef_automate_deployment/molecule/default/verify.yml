- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    orgname: lab
    userfilename: jtonello.pem
    orgfilename: lab-validator.pem
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl settings file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: Sysctl settings file not found
      success_msg: Sysctl settings file exists
  - name: Get sysctl content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - sysctl_content.content | b64decode | regex_search('vm.max_map_count = 262144')
      fail_msg: vm.max_map_count not set correctly
      success_msg: vm.max_map_count set correctly
    when: sysctl_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - sysctl_content.content | b64decode | regex_search('vm.dirty_expire_centisecs = 20000')
      fail_msg: vm.dirty_expire_centisecs not set correctly
      success_msg: vm.dirty_expire_centisecs set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI binary
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-automate
    register: chef_automate_binary
  - name: Assert Chef Automate CLI binary exists
    ansible.builtin.assert:
      that:
      - chef_automate_binary.stat.exists
      - chef_automate_binary.stat.isreg
      - chef_automate_binary.stat.executable
      fail_msg: Chef Automate CLI binary not found or not executable
      success_msg: Chef Automate CLI binary exists and is executable
  - name: Check Chef Automate deployment marker
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert Chef Automate was deployed
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef Automate deployment marker not found
      success_msg: Chef Automate deployment marker exists
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ userfilename }}
    register: user_key_file
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.isreg
      - user_key_file.stat.mode == "0600"
      fail_msg: User key file not found or has incorrect permissions
      success_msg: User key file exists with correct permissions
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test/{{ orgfilename }}
    register: org_key_file
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.isreg
      - org_key_file.stat.mode == "0600"
      fail_msg: Organization validator key file not found or has incorrect permissions
      success_msg: Organization validator key file exists with correct permissions
  - name: Check user list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-server-user-list
    register: user_list_file
  - name: Assert user list file exists
    ansible.builtin.assert:
      that:
      - user_list_file.stat.exists
      fail_msg: User list file not found
      success_msg: User list file exists
  - name: Get user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/chef-server-user-list
    register: user_list_content
    when: user_list_file.stat.exists
  - name: Assert user exists in user list
    ansible.builtin.assert:
      that:
      - (user_list_content.content | b64decode | trim) == username
      fail_msg: User not found in user list
      success_msg: User found in user list
    when: user_list_file.stat.exists
  - name: Check organization list file
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-server-org-list
    register: org_list_file
  - name: Assert organization list file exists
    ansible.builtin.assert:
      that:
      - org_list_file.stat.exists
      fail_msg: Organization list file not found
      success_msg: Organization list file exists
  - name: Get organization list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/chef-server-org-list
    register: org_list_content
    when: org_list_file.stat.exists
  - name: Assert organization exists in organization list
    ansible.builtin.assert:
      that:
      - (org_list_content.content | b64decode | trim) == orgname
      fail_msg: Organization not found in organization list
      success_msg: Organization found in organization list
    when: org_list_file.stat.exists
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: automate_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - '''running'' in automate_status.stdout'
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: server_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - '''run:'' in server_status.stdout'
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Check network listening on port 443
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    register: port_check
    ignore_errors: true
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is succeeded
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
  - name: Check web UI access
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
    register: web_ui_check
    ignore_errors: true
    tags: molecule-notest
  - name: Assert web UI is accessible
    ansible.builtin.assert:
      that:
      - web_ui_check is succeeded
      fail_msg: Web UI is not accessible
      success_msg: Web UI is accessible
    tags: molecule-notest
