---
- name: Install RedHat-family dependencies
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Install Debian-family dependencies
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] not in ['RedHat', 'Fedora']

- name: Check PostgreSQL initialization marker
  ansible.builtin.stat:
    path: "{{ fastapi_tutorial_postgresql_init_marker }}"
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']
  register: fastapi_tutorial_pg_marker

- name: Initialize PostgreSQL database  # noqa: L039 - registered by the preceding stat task
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
  when:
    - ansible_facts['os_family'] in ['RedHat', 'Fedora']
    - not fastapi_tutorial_pg_marker.stat.exists

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize application repository  # noqa: R104 - role default is a trusted HTTPS repository URL  # noqa: R106 - repository is a trusted role parameter with an HTTPS default
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default, not user input
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Check whether virtual environment exists
  ansible.builtin.stat:
    path: "{{ fastapi_tutorial_venv_dir }}"
  register: fastapi_tutorial_venv

- name: Create Python virtual environment  # noqa: L039 - registered by the preceding stat task  # noqa: R101 - executable path is a trusted role default
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
  when: not fastapi_tutorial_venv.stat.exists

- name: Install application dependencies  # noqa: R113 - requirements target is the deployed application requirements file from the trusted role repository
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_venv_dir }}"
    virtualenv_command: python3 -m venv

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_postgresql_service }}"
    enabled: true
    state: started

- name: Create PostgreSQL application role  # noqa: L039 - credentials are required role parameters validated by the preceding include  # noqa: R101 - SQL command uses required validated credential variables  # noqa: R108 - PostgreSQL role creation must run as the postgres system user
  ansible.builtin.shell:
    cmd: >-
      psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ database_username }}'" |
      grep -q 1 || psql -c "CREATE ROLE {{ database_username }} LOGIN PASSWORD '{{ database_password }}'"
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL application database  # noqa: L039 - credentials are required role parameters validated by the preceding include  # noqa: R101 - SQL command uses required validated credential variables  # noqa: R108 - database creation must run as the postgres system user
  ansible.builtin.shell:
    cmd: >-
      psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'" |
      grep -q 1 || createdb -O "{{ database_username }}" "{{ database_name }}"
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant PostgreSQL database privileges  # noqa: L039 - credentials are required role parameters validated by the preceding include  # noqa: R101 - SQL command uses required validated credential variables  # noqa: R108 - privilege grant must run as the postgres system user
  ansible.builtin.shell:
    cmd: >-
      psql -tAc "SELECT has_database_privilege('{{ database_username }}', '{{ database_name }}', ' CONNECT,CREATE,TEMPORARY')" |
      grep -q t || psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ database_username }}"
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy application environment file
  ansible.builtin.template:
    src: fastapi.env.j2
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path is a role default, not user input
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy FastAPI systemd unit
  ansible.builtin.template:
    src: fastapi-tutorial.service.j2
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Enable and start FastAPI service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    daemon_reload: true
    enabled: true
    state: started
