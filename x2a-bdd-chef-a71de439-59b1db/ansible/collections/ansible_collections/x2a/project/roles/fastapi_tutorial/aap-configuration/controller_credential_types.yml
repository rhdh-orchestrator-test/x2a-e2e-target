---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the local PostgreSQL database used by the FastAPI Tutorial application.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application; the source value is fastapi.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role, used in database creation and the application DATABASE_URL.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname of the PostgreSQL server; the source connects to localhost.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application; the source value is fastapi_db.
      required:
        - database_username
        - database_password
        - database_host
        - database_name
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_host: !unsafe "{{ database_host }}"
        database_name: !unsafe "{{ database_name }}"
