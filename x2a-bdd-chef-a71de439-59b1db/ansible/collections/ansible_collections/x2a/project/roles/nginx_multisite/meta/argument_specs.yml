---
argument_specs:
  main:
    short_description: Configure a secure nginx multi-site HTTPS server
    description:
      - Installs and configures nginx, fail2ban, UFW, TLS certificates, and SSH hardening.
      - Creates HTTPS virtual hosts for the role-defined sites.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: Mapping of site names to document roots and TLS settings.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for TLS certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for TLS private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban is enabled and started.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW rules are configured and enabled.
      nginx_multisite_disable_root_ssh:
        type: bool
        required: false
        default: true
        description: Whether root SSH login is disabled.
      nginx_multisite_disable_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is disabled.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Reserved toggle for secure task logging.
