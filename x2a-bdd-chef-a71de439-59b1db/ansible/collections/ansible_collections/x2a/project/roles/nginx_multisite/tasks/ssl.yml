---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create SSL certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}"  # noqa: R114 - path comes from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create SSL private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}"  # noqa: R114 - path comes from role defaults
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Check SSL certificate files
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl_file['key'] }}.crt"
  register: nginx_multisite_ssl_certificates
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_file

- name: Check SSL private key files
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_file['key'] }}.key"
  register: nginx_multisite_ssl_keys
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_file

- name: Generate self-signed certificates when absent  # noqa: R101 - command uses role-default paths and role-defined site names
  ansible.builtin.shell:
    cmd: |
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        -keyout "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key" \
        -out "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt" \
        -subj "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl_site['key'] }}/emailAddress=admin@example.com"
  when:  # noqa: L039 - certificate and key results are registered by the preceding stat tasks
    - item_ssl_site['value']['ssl_enabled']
    - >-
      not (nginx_multisite_ssl_certificates.results[ansible_loop_index].stat.exists | bool)
      or not (nginx_multisite_ssl_keys.results[ansible_loop_index].stat.exists | bool)
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
    index_var: ansible_loop_index
  notify: Reload nginx

- name: Set private key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_key['key'] }}.key"  # noqa: R114 - path comes from role-default private key path and role-defined site names
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  when: item_ssl_key['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_key
