---
# Unsupported pre-flight checks: exact sysctl values, sshd service status, and the
# certificate validity duration were not given as portable expected outcomes.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service status facts
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are active and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['nginx.service']['state'] == 'running'
          - ansible_facts['services']['nginx.service']['status'] == 'enabled'
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'
          - ansible_facts['services']['fail2ban.service']['status'] == 'enabled'
        fail_msg: nginx and fail2ban must be active and enabled

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      register: nginx_config_test

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_config_test['rc'] == 0
        fail_msg: nginx configuration validation failed

    - name: Inspect complete nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      changed_when: false
      register: nginx_full_config

    - name: Assert configured site names are in nginx configuration
      ansible.builtin.assert:
        that:
          - item_site in nginx_full_config['stdout']
        fail_msg: configured site name is missing from nginx configuration
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site

    - name: Inspect UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      changed_when: false
      register: ufw_status

    - name: Assert UFW policy and rules
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status['stdout']"
          - "'Default: deny (incoming)' in ufw_status['stdout']"
          - "'22/tcp' in ufw_status['stdout']"
          - "'80/tcp' in ufw_status['stdout']"
          - "'443/tcp' in ufw_status['stdout']"
        fail_msg: UFW is not active with the expected policy and rules

    - name: Wait for nginx HTTP and HTTPS listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_port }}"
        state: started
        timeout: 10
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_port

    - name: Check configured fail2ban jails
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
          - "{{ item_jail }}"
      changed_when: false
      register: fail2ban_jail_status
      loop:
        - sshd
        - nginx-http-auth
        - nginx-limit-req
        - nginx-botsearch
      loop_control:
        loop_var: item_jail

    - name: Assert configured fail2ban jails are available
      ansible.builtin.assert:
        that:
          - item_jail_status['rc'] == 0
        fail_msg: configured fail2ban jail is unavailable
      loop: "{{ fail2ban_jail_status['results'] }}"
      loop_control:
        loop_var: item_jail_status

    - name: Read SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config

    - name: Assert SSH root login and password authentication are disabled
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (sshd_config['content'] | b64decode)"
          - "'PasswordAuthentication no' in (sshd_config['content'] | b64decode)"
        fail_msg: SSH hardening directives are missing

    - name: Validate sshd configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      changed_when: false
      register: sshd_config_test

    - name: Assert sshd configuration is valid
      ansible.builtin.assert:
        that:
          - sshd_config_test['rc'] == 0
        fail_msg: sshd configuration validation failed

    - name: Check expected files
      ansible.builtin.stat:
        path: "{{ item_file }}"
      register: expected_files
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
      loop_control:
        loop_var: item_file

    - name: Assert expected files exist
      ansible.builtin.assert:
        that:
          - item_expected_file['stat']['exists']
        fail_msg: expected file is missing
      loop: "{{ expected_files['results'] }}"
      loop_control:
        loop_var: item_expected_file

    - name: Check default nginx site
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert default nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']
        fail_msg: default nginx site must be absent

    - name: Check private key metadata
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
      register: private_key_stats
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key

    - name: Assert private key ownership and mode
      ansible.builtin.assert:
        that:
          - item_private_key['stat']['pw_name'] == 'root'
          - item_private_key['stat']['gr_name'] == 'ssl-cert'
          - item_private_key['stat']['mode'] == '0640'
        fail_msg: private key ownership or mode is incorrect
      loop: "{{ private_key_stats['results'] }}"
      loop_control:
        loop_var: item_private_key

    - name: Check certificate subjects
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
      changed_when: false
      register: certificate_subjects
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          hostname: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          hostname: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          hostname: status.cluster.local
      loop_control:
        loop_var: item_certificate

    - name: Assert certificate subjects identify their sites
      ansible.builtin.assert:
        that:
          - item_certificate_subject['item']['hostname'] in item_certificate_subject['stdout']
        fail_msg: certificate subject does not identify its site
      loop: "{{ certificate_subjects['results'] }}"
      loop_control:
        loop_var: item_certificate_subject

    - name: Verify HTTP redirects to HTTPS
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ item_http_site }}"
        follow_redirects: none
        status_code: 301
        return_content: false
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_http_site

    - name: Verify HTTPS returns success and security headers
      ansible.builtin.uri:
        url: https://127.0.0.1/
        headers:
          Host: "{{ item_https_site }}"
        validate_certs: false
        status_code: 200
        return_content: false
      register: https_responses
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_https_site

    - name: Assert HTTPS security headers
      ansible.builtin.assert:
        that:
          - "'strict-transport-security' in item_https_response['headers']"
          - "'x-frame-options' in item_https_response['headers']"
          - "'x-content-type-options' in item_https_response['headers']"
        fail_msg: HTTPS response is missing a required security header
      loop: "{{ https_responses['results'] }}"
      loop_control:
        loop_var: item_https_response
