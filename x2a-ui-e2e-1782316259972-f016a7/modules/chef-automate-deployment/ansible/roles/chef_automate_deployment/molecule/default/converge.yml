---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create test directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/tmp
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/ansible

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate sysctl parameters
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: "{{ item.key }} = {{ item.value }}"
        dest: "/tmp/molecule_test/etc/{{ item.key | replace('.', '_') }}.conf"
        mode: "0644"
      loop: "{{ chef_automate_sysctl_params | dict2items }}"

    # Simulate Chef Automate CLI download and extraction
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI Mock'\necho 'Version: 1.0.0'\n"
        dest: "/tmp/molecule_test{{ chef_automate_cli_path }}"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.file:
        path: /tmp/molecule_test/hab/sup
        state: directory
        mode: "0755"

    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          {
            "status": "running",
            "services": [
              {"name": "automate", "status": "running"},
              {"name": "infra-server", "status": "running"}
            ]
          }
        dest: /tmp/molecule_test/hab/sup/status.json
        mode: "0644"

    # Simulate user and organization creation
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/home/ansible/{{ chef_automate_user_key_file }}"
        mode: "0600"

    - name: Create organization key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORG KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/home/ansible/{{ chef_automate_org_key_file }}"
        mode: "0600"

    # Simulate Chef server user and org lists
    - name: Create Chef server user list
      ansible.builtin.copy:
        content: "{{ chef_automate_username }}\npivotal\n"
        dest: /tmp/molecule_test/etc/chef-server-users.txt
        mode: "0644"

    - name: Create Chef server org list
      ansible.builtin.copy:
        content: "{{ chef_automate_org_name }}\n"
        dest: /tmp/molecule_test/etc/chef-server-orgs.txt
        mode: "0644"

    # Simulate network services
    - name: Create netstat output file
      ansible.builtin.copy:
        content: "tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/chef-automate\n"
        dest: /tmp/molecule_test/etc/netstat-output.txt
        mode: "0644"