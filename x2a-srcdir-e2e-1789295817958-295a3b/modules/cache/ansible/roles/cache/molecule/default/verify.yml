---
- name: Verify Redis Configuration Files
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /tmp/molecule_test/etc/redis/redis.conf
        - /tmp/molecule_test/var/log/redis/redis-server.log
        - /tmp/molecule_test/var/run/redis/redis-server.pid
      loop_control:
        loop_var: item_config
      register: config_stat_results

    - name: Assert Redis configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected Redis configuration file not found"
      loop: "{{ config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check Redis directories exist
      ansible.builtin.stat:
        path: "{{ item_dir }}"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir
      register: dir_stat_results

    - name: Assert Redis directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected Redis directory not found"
      loop: "{{ dir_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Read Redis configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/redis/redis.conf
      register: redis_config_content

    - name: Assert Redis configuration contains expected settings
      ansible.builtin.assert:
        that:
          - "'port 6379' in redis_config_decoded"
          - "'bind 127.0.0.1' in redis_config_decoded"
          - "'dir /var/lib/redis' in redis_config_decoded"
          - "'logfile /var/log/redis/redis-server.log' in redis_config_decoded"
        fail_msg: "Redis configuration missing expected settings"
      vars:
        redis_config_decoded: "{{ redis_config_content['content'] | b64decode }}"

- name: Verify Redis Service (Container-Incompatible)
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
        fail_msg: "Redis service is not running"
      tags: molecule-notest

    - name: Check Redis process is running
      ansible.builtin.shell: |
        ps aux | grep redis-server | grep -v grep
      register: redis_process_check
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Redis process is active
      ansible.builtin.assert:
        that:
          - redis_process_check['rc'] == 0
          - redis_process_check['stdout'] | length > 0
        fail_msg: "Redis process not found"
      tags: molecule-notest

- name: Verify Redis Connectivity (Container-Incompatible)
  hosts: all
  gather_facts: false
  tasks:
    - name: Test Redis connectivity with ping
      ansible.builtin.shell: redis-cli ping
      register: redis_ping_result
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Redis responds to ping
      ansible.builtin.assert:
        that:
          - redis_ping_result['rc'] == 0
          - "'PONG' in redis_ping_result['stdout']"
        fail_msg: "Redis ping test failed"
      tags: molecule-notest

    - name: Get Redis server info
      ansible.builtin.shell: redis-cli info server
      register: redis_info_result
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Redis server info is available
      ansible.builtin.assert:
        that:
          - redis_info_result['rc'] == 0
          - "'redis_version' in redis_info_result['stdout']"
        fail_msg: "Redis server info not available"
      tags: molecule-notest

    - name: Test basic Redis operations
      ansible.builtin.shell: |
        redis-cli set test_key "test_value" &&
        redis-cli get test_key &&
        redis-cli del test_key
      register: redis_ops_result
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Redis basic operations work
      ansible.builtin.assert:
        that:
          - redis_ops_result['rc'] == 0
        fail_msg: "Redis basic operations failed"
      tags: molecule-notest

- name: Verify Redis Network and Configuration (Container-Incompatible)
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 5
      tags: molecule-notest

    - name: Check Redis configuration values
      ansible.builtin.shell: |
        redis-cli config get port &&
        redis-cli config get bind &&
        redis-cli config get dir
      register: redis_config_check
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Redis configuration is correct
      ansible.builtin.assert:
        that:
          - redis_config_check['rc'] == 0
          - "'6379' in redis_config_check['stdout']"
        fail_msg: "Redis configuration check failed"
      tags: molecule-notest

    - name: Check Redis memory usage
      ansible.builtin.shell: redis-cli info memory | grep used_memory_human
      register: redis_memory_check
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Redis memory info is available
      ansible.builtin.assert:
        that:
          - redis_memory_check['rc'] == 0
          - "'used_memory_human' in redis_memory_check['stdout']"
        fail_msg: "Redis memory info not available"
      tags: molecule-notest