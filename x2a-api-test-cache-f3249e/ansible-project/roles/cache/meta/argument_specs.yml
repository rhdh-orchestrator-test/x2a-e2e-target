---
argument_specs:
  main:
    short_description: Install and configure caching services (memcached and Redis)
    description:
      - Installs and configures memcached and Redis caching services
      - Configures Redis with authentication and removes problematic replica settings
      - Creates necessary directories and users for both services
    options:
      cache_memcached_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and configure memcached service.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: Port for memcached service to listen on.
      cache_memcached_memory:
        type: int
        required: false
        default: 64
        description: Memory allocation for memcached in MB.
      cache_memcached_user:
        type: str
        required: false
        default: memcache
        description: User account for memcached service.
      cache_redis_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and configure Redis service.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: Port for Redis service to listen on.
      cache_redis_bind:
        type: str
        required: false
        default: 127.0.0.1
        description: IP address for Redis to bind to.
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory for Redis log files.
      cache_redis_log_file:
        type: str
        required: false
        default: /var/log/redis/redis-server.log
        description: Path to Redis log file.
      cache_redis_data_dir:
        type: str
        required: false
        default: /var/lib/redis
        description: Directory for Redis data files.
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/{{ cache_redis_port }}.conf
        description: Path to Redis configuration file.
      cache_redis_user:
        type: str
        required: false
        default: redis
        description: User account for Redis service.
      cache_redis_group:
        type: str
        required: false
        default: redis
        description: Group for Redis service.
      cache_redis_replica_settings_to_remove:
        type: list
        elements: str
        required: false
        default:
          - replica-serve-stale-data
          - replica-read-only
          - repl-ping-replica-period
          - client-output-buffer-limit
          - replica-priority
        description: List of Redis replica settings to remove from configuration.
      redis_password:
        type: str
        required: true
        description: Redis authentication password. This variable is injected by AAP credential types at runtime and should not be set manually.
