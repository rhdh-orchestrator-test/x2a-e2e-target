---
cache_memcached_enabled: true
cache_memcached_port: 11211
cache_memcached_memory: 64
cache_memcached_user: memcache
cache_redis_enabled: true
cache_redis_port: 6379
cache_redis_bind: 127.0.0.1
cache_redis_log_dir: /var/log/redis
cache_redis_log_file: /var/log/redis/redis-server.log
cache_redis_data_dir: /var/lib/redis
cache_redis_config_file: /etc/redis/{{ cache_redis_port }}.conf
cache_redis_user: redis
cache_redis_group: redis
cache_redis_replica_settings_to_remove:
  - replica-serve-stale-data
  - replica-read-only
  - repl-ping-replica-period
  - client-output-buffer-limit
  - replica-priority
