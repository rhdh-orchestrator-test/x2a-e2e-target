---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories for Redis
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          # Generated by Ansible for testing

          # Network
          bind 127.0.0.1
          port 6379
          tcp-backlog 511
          timeout 0
          tcp-keepalive 300

          # General
          daemonize yes
          supervised systemd
          pidfile /var/run/redis/redis-server.pid
          loglevel notice
          logfile /var/log/redis/redis-server.log
          databases 16

          # Snapshotting
          save 900 1
          save 300 10
          save 60 10000
          stop-writes-on-bgsave-error yes
          rdbcompression yes
          rdbchecksum yes
          dbfilename dump.rdb
          dir /var/lib/redis

          # Security
          requirepass redis_secure_password_123

          # Limits
          maxclients 10000

          # Memory management
          maxmemory-policy noeviction

          # Append only file
          appendonly no
          appendfilename "appendonly.aof"
          appendfsync everysec
          no-appendfsync-on-rewrite no
          auto-aof-rewrite-percentage 100
          auto-aof-rewrite-min-size 64mb
          aof-load-truncated yes

          # Lua scripting
          lua-time-limit 5000

          # Slow log
          slowlog-log-slower-than 10000
          slowlog-max-len 128

          # Latency monitor
          latency-monitor-threshold 0

          # Event notification
          notify-keyspace-events ""

          # Advanced config
          hash-max-ziplist-entries 512
          hash-max-ziplist-value 64
          list-max-ziplist-size -2
          list-compress-depth 0
          set-max-intset-entries 512
          zset-max-ziplist-entries 128
          zset-max-ziplist-value 64
          hll-sparse-max-bytes 3000
          stream-node-max-bytes 4096
          stream-node-max-entries 100
          activerehashing yes
          client-output-buffer-limit normal 0 0 0
          client-output-buffer-limit slave 256mb 64mb 60
          client-output-buffer-limit pubsub 32mb 8mb 60
          hz 10
          dynamic-hz yes
          aof-rewrite-incremental-fsync yes
          rdb-save-incremental-fsync yes
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create Redis log file
      ansible.builtin.copy:
        content: |
          # Redis log file placeholder
          # This file would contain Redis server logs
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"
        backup: true

    - name: Create Redis data directory placeholder files
      ansible.builtin.copy:
        content: |
          # Redis data directory
          # This directory would contain Redis database files
        dest: /tmp/molecule_test/var/lib/redis/README
        mode: "0644"
        backup: true