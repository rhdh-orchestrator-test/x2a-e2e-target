<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI Environment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f8f0;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #2d5a2d;
            margin-bottom: 20px;
        }
        .status {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            border-radius: 5px;
            padding: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CI Environment</h1>
        <div class="status">
            <h2>Service Status: Active</h2>
            <p>This is the continuous integration environment for the nginx multisite configuration.</p>
            <p>Server: ci.cluster.local</p>
        </div>
    </div>
</body>
</html>
