<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #fff8f0;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #d2691e;
            margin-bottom: 20px;
        }
        .status {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 5px;
            padding: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Status Dashboard</h1>
        <div class="status">
            <h2>Service Status: Active</h2>
            <p>This is the status monitoring dashboard for the nginx multisite configuration.</p>
            <p>Server: status.cluster.local</p>
        </div>
    </div>
</body>
</html>
