---
- name: Verify nginx_multisite role
  hosts: all
  gather_facts: false
  tasks:
    # Service status verification
    - name: Check service status
      ansible.builtin.service_facts:

    - name: Assert nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
        fail_msg: "Nginx service is not running"

    - name: Assert fail2ban service is running
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
        fail_msg: "Fail2ban service is not running"

    # Nginx configuration validation
    - name: Test nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      register: nginx_config_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - "nginx_config_test['rc'] == 0"
        fail_msg: "Nginx configuration test failed"

    # Configuration files verification
    - name: Check main configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
      loop_control:
        loop_var: item_config
      register: main_config_stat_results

    - name: Assert main configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected configuration file not found"
      loop: "{{ main_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Virtual host configuration verification
    - name: Check virtual host configurations exist
      ansible.builtin.stat:
        path: "{{ item_vhost }}"
      loop:
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_vhost
      register: vhost_config_stat_results

    - name: Assert virtual host configurations were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
        fail_msg: "Expected virtual host configuration not found"
      loop: "{{ vhost_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Default site removal verification
    - name: Check default nginx site is removed
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site_stat

    - name: Assert default site was removed
      ansible.builtin.assert:
        that:
          - "not default_site_stat['stat']['exists']"
        fail_msg: "Default nginx site still exists"

    # Document root directories verification
    - name: Check document root directories exist
      ansible.builtin.stat:
        path: "{{ item_docroot }}"
      loop:
        - /opt/server/test
        - /opt/server/ci
        - /opt/server/status
      loop_control:
        loop_var: item_docroot
      register: docroot_stat_results

    - name: Assert document root directories were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected document root directory not found"
      loop: "{{ docroot_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Index files verification
    - name: Check index.html files exist
      ansible.builtin.stat:
        path: "{{ item_index }}"
      loop:
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_index
      register: index_stat_results

    - name: Assert index.html files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected index.html file not found"
      loop: "{{ index_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # SSL certificates verification
    - name: Check SSL certificates exist
      ansible.builtin.stat:
        path: "{{ item_cert }}"
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_cert
      register: cert_stat_results

    - name: Assert SSL certificates were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate not found"
      loop: "{{ cert_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # SSL private keys verification
    - name: Check SSL private keys exist and have correct permissions
      ansible.builtin.stat:
        path: "{{ item_key }}"
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: key_stat_results

    - name: Assert SSL private keys were created with correct permissions
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
          - item_result['stat']['mode'] == '0640'
          - item_result['stat']['pw_name'] == 'root'
          - item_result['stat']['gr_name'] == 'ssl-cert'
        fail_msg: "SSL private key missing or has incorrect permissions"
      loop: "{{ key_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Network ports verification
    - name: Check HTTP port is listening
      ansible.builtin.wait_for:
        port: 80
        host: 0.0.0.0
        timeout: 10

    - name: Check HTTPS port is listening
      ansible.builtin.wait_for:
        port: 443
        host: 0.0.0.0
        timeout: 10

    # SSL certificate content verification
    - name: Verify SSL certificate subjects
      ansible.builtin.command:
        cmd: "openssl x509 -in {{ item_cert_path }} -noout -subject"
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_cert_path
      register: cert_subject_results
      changed_when: false

    - name: Assert SSL certificates have correct subjects
      ansible.builtin.assert:
        that:
          - "'test.cluster.local' in item_result['stdout']"
        fail_msg: "SSL certificate subject verification failed"
      loop: "{{ cert_subject_results['results'] }}"
      loop_control:
        loop_var: item_result
      when: "'test.cluster.local' in item_result['cmd'][-1]"

    - name: Assert SSL certificates have correct subjects for ci
      ansible.builtin.assert:
        that:
          - "'ci.cluster.local' in item_result['stdout']"
        fail_msg: "SSL certificate subject verification failed"
      loop: "{{ cert_subject_results['results'] }}"
      loop_control:
        loop_var: item_result
      when: "'ci.cluster.local' in item_result['cmd'][-1]"

    - name: Assert SSL certificates have correct subjects for status
      ansible.builtin.assert:
        that:
          - "'status.cluster.local' in item_result['stdout']"
        fail_msg: "SSL certificate subject verification failed"
      loop: "{{ cert_subject_results['results'] }}"
      loop_control:
        loop_var: item_result
      when: "'status.cluster.local' in item_result['cmd'][-1]"

- name: Verify security configuration
  hosts: all
  gather_facts: false
  tasks:
    # Fail2ban configuration verification
    - name: Check fail2ban status
      ansible.builtin.command:
        cmd: fail2ban-client status
      register: fail2ban_status
      changed_when: false

    - name: Assert fail2ban is running
      ansible.builtin.assert:
        that:
          - "fail2ban_status['rc'] == 0"
        fail_msg: "Fail2ban status check failed"

    # UFW firewall verification
    - name: Check UFW status
      ansible.builtin.command:
        cmd: ufw status
      register: ufw_status
      changed_when: false

    - name: Assert UFW is active
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status['stdout']"
        fail_msg: "UFW firewall is not active"

    # SSH configuration verification
    - name: Check SSH configuration for root login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present
      check_mode: true
      register: ssh_root_config

    - name: Assert SSH root login is disabled
      ansible.builtin.assert:
        that:
          - "not ssh_root_config['changed']"
        fail_msg: "SSH root login is not properly disabled"

    # Kernel security parameters verification
    - name: Check sysctl security parameters
      ansible.builtin.slurp:
        src: /etc/sysctl.d/99-security.conf
      register: sysctl_config

    - name: Assert sysctl security configuration exists
      ansible.builtin.assert:
        that:
          - "sysctl_config['content'] | length > 0"
        fail_msg: "Sysctl security configuration is empty"