# Unsupported from the pre-flight checks: package-version output, dynamically named site checks,
# SSL/non-SSL site behavior, endpoint responses, nginx/fail2ban/sshd logs, listening-port output,
# nginx PID presence, certificate details, per-site content ownership, and kernel sysctl values.
# These checks require concrete site data or have no stated expected outcome in the plan.
---
- name: Verify nginx-multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify nginx and fail2ban are active
      ansible.builtin.service_facts:

    - name: Assert nginx and fail2ban are active
      ansible.builtin.assert:
        that:
          - >-
            ('nginx.service' in ansible_facts['services'] and
            ansible_facts['services']['nginx.service']['state'] == 'running') or
            ('nginx' in ansible_facts['services'] and
            ansible_facts['services']['nginx']['state'] == 'running')
          - >-
            ('fail2ban.service' in ansible_facts['services'] and
            ansible_facts['services']['fail2ban.service']['state'] == 'running') or
            ('fail2ban' in ansible_facts['services'] and
            ansible_facts['services']['fail2ban']['state'] == 'running')
        fail_msg: nginx and fail2ban must be active.

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: nginx_config_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_config_test['rc'] == 0
        fail_msg: nginx configuration validation failed.

    - name: Read SSH daemon configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config

    - name: Assert SSH hardening settings are present
      ansible.builtin.assert:
        that:
          - >-
            (sshd_config['content'] | b64decode) is regex('(?m)^PermitRootLogin\\s+no\\s*$')
          - >-
            (sshd_config['content'] | b64decode) is regex('(?m)^PasswordAuthentication\\s+no\\s*$')
        fail_msg: SSH configuration must disable root login and password authentication.

    - name: Validate SSH daemon configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      register: sshd_config_test
      changed_when: false

    - name: Assert SSH daemon configuration is valid
      ansible.builtin.assert:
        that:
          - sshd_config_test['rc'] == 0
        fail_msg: SSH daemon configuration validation failed.

    - name: Read site token metadata
      ansible.builtin.stat:
        path: /etc/nginx/secrets/site_token
      register: site_token_metadata

    - name: Assert site token has the expected protection
      ansible.builtin.assert:
        that:
          - site_token_metadata['stat']['exists']
          - site_token_metadata['stat']['pw_name'] == 'root'
          - site_token_metadata['stat']['gr_name'] == 'root'
          - site_token_metadata['stat']['mode'] == '0600'
        fail_msg: The site token must exist and be protected as root:root mode 0600.

    - name: Check UFW status and policy
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: ufw_status
      changed_when: false

    - name: Assert UFW is active with the required policy and ports
      ansible.builtin.assert:
        that:
          - ufw_status['rc'] == 0
          - ufw_status['stdout'] is search('(?im)^Status:\\s+active\\s*$')
          - ufw_status['stdout'] is search('(?i)default:\\s+deny\\s+\(incoming\)')
          - ufw_status['stdout'] is search('(?m)^22/tcp\\s+ALLOW')
          - ufw_status['stdout'] is search('(?m)^80/tcp\\s+ALLOW')
          - ufw_status['stdout'] is search('(?m)^443/tcp\\s+ALLOW')
        fail_msg: UFW must be active, deny incoming traffic by default, and allow TCP ports 22, 80, and 443.
