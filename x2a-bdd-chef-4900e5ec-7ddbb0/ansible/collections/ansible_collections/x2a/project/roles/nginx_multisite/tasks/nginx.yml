---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Ensure nginx service account exists
  ansible.builtin.user:
    name: nginx
    system: true
    create_home: false
    state: present

- name: Ensure nginx service group exists
  ansible.builtin.group:
    name: nginx
    system: true
    state: present

- name: Render nginx global configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Render nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Create nginx secrets directory
  ansible.builtin.file:
    path: /etc/nginx/secrets
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Store nginx site token
  ansible.builtin.copy:
    content: "{{ nginx_multisite_site_token }}"
    dest: /etc/nginx/secrets/site_token
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Create site document roots
  ansible.builtin.file:
    path: "{{ item_site['document_root'] }}" # noqa: R114 - path from role-defined sites dictionary
    state: directory
    owner: nginx
    group: nginx
    mode: "0755"
    recurse: true
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_site

- name: Deploy site index pages
  ansible.builtin.copy:
    src: "{{ item_index['source'] }}" # noqa: R114 - source is from role-defined site content mapping
    dest: "{{ item_index['document_root'] }}/index.html" # noqa: R114 - destination is from role-defined sites dictionary
    owner: nginx
    group: nginx
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_index
