---
controller_credential_types:
  - name: Nginx Site Token
    description: Encrypted Chef data bag token deployed for nginx/site use.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Site Token
          secret: true
          help_text: Secret token loaded from the nginx_secrets/site encrypted data bag item and deployed for nginx site use.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
  - name: Nginx TLS Private Key
    description: Per-site RSA private key used by nginx for self-signed HTTPS certificates; the source plan generates these locally with openssl.
    kind: cloud
    inputs:
      fields:
        - id: private_key
          type: string
          label: TLS Private Key
          secret: true
          help_text: Private RSA key for the nginx TLS certificate, deployed under /etc/ssl/private/<site_name>.key with restrictive permissions.
      required:
        - private_key
    injectors:
      extra_vars:
        private_key: !unsafe "{{ private_key }}"
