---
- name: Create nginx available-sites directory
  ansible.builtin.file:
    path: /etc/nginx/sites-available
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create nginx enabled-sites directory
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Render nginx virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item_site_config['id'] }}" # noqa: R114 - filename from role-defined sites
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_site_config
  notify: Reload nginx
  vars:
    server_name: "{{ item_site_config['id'] }}"
    document_root: "{{ item_site_config['document_root'] }}"
    ssl_enabled: "{{ item_site_config['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_site_config['id'] }}.crt"
    key_file: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_site_config['id'] }}.key"

- name: Enable nginx virtual host configurations
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item_site_link['id'] }}" # noqa: R114 - link source from role-defined sites
    dest: "/etc/nginx/sites-enabled/{{ item_site_link['id'] }}" # noqa: R114 - link destination from role-defined sites
    state: link
    owner: root
    group: root
    mode: "0755"
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_site_link
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
