---
controller_credentials:
  - name: Nginx Site Token - nginx_multisite
    description: Encrypted Chef data bag token deployed for nginx/site use.
    organization: Default
    credential_type: Nginx Site Token
    update_secrets: true
    inputs:
      site_token: "{{ vault_site_token }}"
  - name: Nginx TLS Private Key - nginx_multisite
    description: Per-site RSA private key used by nginx for self-signed HTTPS certificates; the source plan generates these locally with openssl.
    organization: Default
    credential_type: Nginx TLS Private Key
    update_secrets: true
    inputs:
      private_key: "{{ vault_private_key }}"
