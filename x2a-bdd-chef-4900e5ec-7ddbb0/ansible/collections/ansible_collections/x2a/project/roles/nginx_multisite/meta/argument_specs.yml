---
argument_specs:
  main:
    short_description: Install and configure a secure nginx multisite server
    description:
      - Installs nginx and supporting security services.
      - Configures nginx virtual hosts, TLS, static content, firewall rules, SSH hardening, and kernel security settings.
    options:
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory containing site certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory containing site private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and enable Fail2ban.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure and enable UFW.
      nginx_multisite_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login.
      nginx_multisite_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is permitted.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle sensitive credentials.
      nginx_multisite_sites:
        type: list
        elements: dict
        required: false
        default: []
        description: Site definitions containing id, document_root, and ssl_enabled.
      nginx_multisite_site_token:
        type: str
        required: false
        default: "{{ site_token }}"
        description: Site token supplied by the AAP credential variable.
      nginx_multisite_private_key:
        type: str
        required: false
        default: "{{ private_key }}"
        description: Private key supplied by the AAP credential variable.
