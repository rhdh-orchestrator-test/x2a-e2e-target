---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI and PostgreSQL packages  # noqa: R113 - package list is a fixed role-controlled platform package selection
  ansible.builtin.package:  # noqa: R113 - package list is a fixed role-controlled platform package selection
    name: >-
      {{ (['python3', 'python3-pip', 'git', 'postgresql-server', 'postgresql-contrib', 'libpq-devel']
      if ansible_facts['os_family'] in ['RedHat', 'Fedora'] else
      ['python3', 'python3-pip', 'python3-venv', 'git', 'postgresql', 'postgresql-contrib', 'libpq-dev']) }}
    state: present

- name: Initialize PostgreSQL on RedHat-family systems
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository  # noqa: R104, R106 - repository URL comes from role defaults and uses HTTPS
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - destination is from role defaults
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Check for Python virtual environment
  ansible.builtin.stat:
    path: "{{ fastapi_tutorial_app_path }}/venv/bin/python" # noqa: R114 - path is under role-defined application directory
  register: fastapi_tutorial_venv

- name: Create Python virtual environment  # noqa: L039, R101 - registered by prior task; command path is under the role-defined application directory
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_app_path }}/venv"
  when: not fastapi_tutorial_venv.stat.exists

- name: Install application dependencies  # noqa: R113 - requirements and virtualenv are fixed paths under the role-defined application directory
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt" # noqa: R114 - requirements path is under role-defined application directory
    virtualenv: "{{ fastapi_tutorial_app_path }}/venv" # noqa: R114 - virtualenv path is under role-defined application directory

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL role  # noqa: L039, R101, R108 - credentials are validated role inputs; shell runs as the postgres database administrator
  ansible.builtin.shell:
    cmd: |
      psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ database_username }}'" | grep -q 1 || \
        psql -c "CREATE ROLE {{ database_username }} LOGIN PASSWORD '{{ database_password }}'"
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL database  # noqa: L039, R101, R108 - credentials are validated role inputs; shell runs as the postgres database administrator
  ansible.builtin.shell:
    cmd: |
      psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'" | grep -q 1 || \
        createdb -O "{{ database_username }}" "{{ database_name }}"
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant PostgreSQL database privileges  # noqa: L039, R101, R108 - credentials are validated role inputs; shell runs as the postgres database administrator
  ansible.builtin.shell:
    cmd: |
      psql -tAc "SELECT has_database_privilege('{{ database_username }}', '{{ database_name }}', 'ALL')" | grep -q t || \
        psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ database_username }};"
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write application environment file  # noqa: L039 - credentials are validated role inputs
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - path is under role-defined application directory
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ database_username }}:{{ database_password }}@{{ database_host }}:{{ database_port }}/{{ database_name }}
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write FastAPI systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_app_path }}/venv/bin"
      ExecStart={{ fastapi_tutorial_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Apply systemd unit changes before starting FastAPI
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
