---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the FastAPI application's PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: "PostgreSQL role used by the FastAPI application: fastapi."
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the fastapi PostgreSQL role; currently hardcoded as fastapi_password and must be vaulted or rotated.
        - id: database_host
          type: string
          label: Database Host
          help_text: "PostgreSQL host used in the application connection string: localhost."
        - id: database_name
          type: string
          label: Database Name
          help_text: "PostgreSQL database used by the FastAPI application: fastapi_db."
        - id: database_port
          type: string
          label: Database Port
          help_text: PostgreSQL connection port; the distribution-default PostgreSQL port is used.
      required:
        - database_username
        - database_password
        - database_host
        - database_name
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_host: !unsafe "{{ database_host }}"
        database_name: !unsafe "{{ database_name }}"
        database_port: !unsafe "{{ database_port }}"
