---
controller_credential_types:
- name: Chef Server Admin
  description: Admin credentials for Chef Server deployment
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Admin username for Chef Server
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Admin password for Chef Server
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the admin user
    - id: email
      type: string
      label: Email Address
      help_text: Email address for the admin user
    required:
    - username
    - password
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
- name: Chef Organization
  description: Chef organization configuration
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name for the Chef organization
    required:
    - org_name
    - org_full_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
