---
- name: Check system memory
  ansible.builtin.command:
    cmd: free -m
  register: memory_check
  changed_when: false
- name: Display memory information
  ansible.builtin.debug:
    msg: "{{ memory_check.stdout_lines }}"
- name: Check disk space
  ansible.builtin.command:
    cmd: df -h
  register: disk_check
  changed_when: false
- name: Display disk space information
  ansible.builtin.debug:
    msg: "{{ disk_check.stdout_lines }}"
- name: Check network connectivity to Chef packages site
  ansible.builtin.uri:
    url: https://packages.chef.io
    status_code: 200
  register: connectivity_check
  failed_when: connectivity_check.status != 200
- name: Check if Chef Server is already installed
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_installed
- name: Display Chef Server installation status
  ansible.builtin.debug:
    msg: Chef Server is already installed
  when: chef_server_installed.stat.exists
- name: Check if Chef Automate CLI is already installed
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: chef_automate_cli_installed
- name: Display Chef Automate CLI installation status
  ansible.builtin.debug:
    msg: Chef Automate CLI is already installed
  when: chef_automate_cli_installed.stat.exists
