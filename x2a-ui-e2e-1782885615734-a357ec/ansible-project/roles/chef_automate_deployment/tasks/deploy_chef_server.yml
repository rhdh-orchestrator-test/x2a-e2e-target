---
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
  loop: "{{ chef_automate_sysctl_settings | dict2items }}"
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
  become: true
  when: not chef_automate_cli_installed.stat.exists
- name: Extract Chef Automate CLI
  ansible.builtin.unarchive:
    src: /tmp/chef-automate.zip
    dest: "{{ chef_automate_cli_path | dirname }}"
    remote_src: true
    creates: "{{ chef_automate_cli_path }}"
  become: true
  when: not chef_automate_cli_installed.stat.exists
- name: Set executable permissions on Chef Automate CLI
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
  become: true
  when: not chef_automate_cli_installed.stat.exists
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}"
  args:
    creates: /hab
  become: true
  when: not chef_server_installed.stat.exists
- name: Ensure directory for PEM files exists
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_pem_path }}"
    - "{{ chef_automate_org_pem_path }}"
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_automate_user_pem_path }}
  args:
    creates: "{{ chef_automate_user_pem_path }}"
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ org_name }} "{{ org_full_name }}" --association_user {{ username }} --filename {{ chef_automate_org_pem_path }}
  args:
    creates: "{{ chef_automate_org_pem_path }}"
  become: true
