---
controller_credentials:
- name: Chef Server Admin - chef_automate_deployment
  description: Admin credentials for Chef Server deployment
  organization: Default
  credential_type: Chef Server Admin
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
- name: Chef Organization - chef_automate_deployment
  description: Chef organization configuration
  organization: Default
  credential_type: Chef Organization
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
