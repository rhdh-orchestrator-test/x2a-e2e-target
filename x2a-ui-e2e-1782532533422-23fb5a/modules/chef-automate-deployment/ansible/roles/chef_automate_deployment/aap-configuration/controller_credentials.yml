---
controller_credentials:
- name: Chef Admin User Credentials - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Admin User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
- name: Chef Organization Details - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Organization Details
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
- name: Chef User PEM Key - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef User PEM Key
  update_secrets: true
  inputs:
    user_key_path: '{{ user_key_path }}'
    user_key_content: '{{ vault_user_key_content }}'
- name: Chef Organization Validator Key - chef_automate_deployment
  description: Credential for chef_automate_deployment
  organization: Default
  credential_type: Chef Organization Validator Key
  update_secrets: true
  inputs:
    validator_key_path: '{{ validator_key_path }}'
    validator_key_content: '{{ vault_validator_key_content }}'
