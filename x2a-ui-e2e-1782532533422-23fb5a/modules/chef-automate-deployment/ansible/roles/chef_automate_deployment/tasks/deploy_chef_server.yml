---
- name: Set hostname for Chef Infra Server
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameter vm.max_map_count
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "{{ chef_automate_vm_max_map_count }}"
    state: present
    reload: true
    sysctl_set: true
  become: true
- name: Configure kernel parameter vm.dirty_expire_centisecs
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: "{{ chef_automate_vm_dirty_expire_centisecs }}"
    state: present
    reload: true
    sysctl_set: true
  become: true
- name: Ensure required packages are installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
    creates: "{{ chef_automate_cli_path }}"
  become: true
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }} "
    creates: /hab
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
- name: Check if chef-server-ctl is available
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl
  become: true
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ full_name | default('Chef Admin') }}" {{ email | default('admin@example.com') }} "{{ password }}"
      --filename {{ chef_automate_user_key_path }}{{ username }}.pem
  become: true
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
  failed_when: chef_user_create.rc != 0 and "already exists" not in chef_user_create.stderr
  args:
    creates: "{{ chef_automate_user_key_path }}{{ username }}.pem"
  when: chef_server_ctl.stat.exists
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ org_name }} "{{ org_full_name | default('Chef Organization') }}" --association_user {{ username }} --filename {{
      chef_automate_validator_key_path }}{{ org_name }}-validator.pem
  become: true
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
  failed_when: chef_org_create.rc != 0 and "already exists" not in chef_org_create.stderr
  args:
    creates: "{{ chef_automate_validator_key_path }}{{ org_name }}-validator.pem"
  when: chef_server_ctl.stat.exists
