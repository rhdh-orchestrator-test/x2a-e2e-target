---
- name: Restart Chef Automate
  ansible.builtin.command:
    cmd: chef-automate restart
  become: true
  listen: restart chef-automate
  register: chef_automate_restart
  changed_when: chef_automate_restart.rc == 0
  failed_when: chef_automate_restart.rc != 0 and "command not found" not in chef_automate_restart.stderr
- name: Restart Chef Infra Server
  ansible.builtin.command:
    cmd: chef-server-ctl restart
  become: true
  listen: restart chef-server
  register: chef_server_restart
  changed_when: chef_server_restart.rc == 0
  failed_when: chef_server_restart.rc != 0 and "command not found" not in chef_server_restart.stderr
