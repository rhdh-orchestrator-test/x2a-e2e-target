---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection settings for the FastAPI application to connect to its PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; currently hardcoded as fastapi_password.
        - id: database
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server, currently localhost.
      required:
        - username
        - password
        - database
        - host
    injectors:
      extra_vars:
        username: !unsafe "{{ username }}"
        password: !unsafe "{{ password }}"
        database: !unsafe "{{ database }}"
        host: !unsafe "{{ host }}"
