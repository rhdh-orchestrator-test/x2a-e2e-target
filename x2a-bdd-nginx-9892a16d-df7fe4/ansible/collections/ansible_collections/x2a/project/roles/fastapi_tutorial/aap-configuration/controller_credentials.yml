---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: Credentials and connection settings for the FastAPI application to connect to its PostgreSQL database.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      username: "{{ username }}"
      password: "{{ vault_password }}"
      database: "{{ database }}"
      host: "{{ host }}"
