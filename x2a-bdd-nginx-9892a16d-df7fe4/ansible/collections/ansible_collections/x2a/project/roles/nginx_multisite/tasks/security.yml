---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started

- name: Configure fail2ban
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  notify: Restart fail2ban

- name: Check UFW status
  ansible.builtin.command:
    cmd: ufw status
  changed_when: false
  register: nginx_multisite_ufw_status

- name: Set UFW default policy to deny  # noqa: L039 - registered by the preceding Check UFW status task
  ansible.builtin.command:
    cmd: ufw --force default deny
  when: "'Default: deny' not in nginx_multisite_ufw_status['stdout']"

- name: Allow SSH through UFW  # noqa: L039 - registered by the preceding Check UFW status task
  ansible.builtin.command:
    cmd: ufw allow ssh
  when: "'22/tcp' not in nginx_multisite_ufw_status['stdout']"

- name: Allow HTTP through UFW  # noqa: L039 - registered by the preceding Check UFW status task
  ansible.builtin.command:
    cmd: ufw allow http
  when: "'80/tcp' not in nginx_multisite_ufw_status['stdout']"

- name: Allow HTTPS through UFW  # noqa: L039 - registered by the preceding Check UFW status task
  ansible.builtin.command:
    cmd: ufw allow https
  when: "'443/tcp' not in nginx_multisite_ufw_status['stdout']"

- name: Enable UFW  # noqa: L039 - registered by the preceding Check UFW status task
  ansible.builtin.command:
    cmd: ufw --force enable
  when: "'Status: active' not in nginx_multisite_ufw_status['stdout']"

- name: Configure kernel security settings
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx multisite sysctl

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin.*
    line: PermitRootLogin no
    backup: true
  when: nginx_multisite_ssh_disable_root | bool
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication.*
    line: PasswordAuthentication no
    backup: true
  when: not nginx_multisite_ssh_password_auth | bool
  notify: Restart SSH
