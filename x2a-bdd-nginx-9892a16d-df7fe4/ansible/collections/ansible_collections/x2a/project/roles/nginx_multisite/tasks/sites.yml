---
- name: Render nginx site configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_nginx_site['key'] }} # noqa: R114 - filename from role-defined sites dictionary
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site
  notify: Reload nginx
  vars:
    server_name: "{{ item_nginx_site['key'] }}"
    document_root: "{{ item_nginx_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_nginx_site['value']['ssl_enabled'] }}"
    cert_file: "{{ item_nginx_site['value']['certificate_file'] }}"
    key_file: "{{ item_nginx_site['value']['key_file'] }}"

- name: Enable nginx site configurations
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_nginx_site['key'] }} # noqa: R114 - symlink source from role-defined sites dictionary
    dest: /etc/nginx/sites-enabled/{{ item_nginx_site['key'] }} # noqa: R114 - symlink path from role-defined sites dictionary
    state: link
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
