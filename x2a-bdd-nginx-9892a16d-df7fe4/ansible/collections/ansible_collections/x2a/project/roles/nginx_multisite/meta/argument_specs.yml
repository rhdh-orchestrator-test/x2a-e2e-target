---
argument_specs:
  main:
    short_description: Install and configure a hardened nginx multisite web server
    description:
      - Deploys nginx, fail2ban, UFW, SSH hardening, kernel security settings, TLS certificates, and HTTPS sites.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
            certificate_file: /etc/ssl/certs/test.cluster.local.crt
            key_file: /etc/ssl/private/test.cluster.local.key
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
            certificate_file: /etc/ssl/certs/ci.cluster.local.crt
            key_file: /etc/ssl/private/ci.cluster.local.key
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
            certificate_file: /etc/ssl/certs/status.cluster.local.crt
            key_file: /etc/ssl/private/status.cluster.local.key
        description: Map of site names and their document and TLS paths.
      nginx_multisite_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory containing generated certificates.
      nginx_multisite_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory containing generated private keys.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to disable SSH root login.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide certificate-generation task output.
