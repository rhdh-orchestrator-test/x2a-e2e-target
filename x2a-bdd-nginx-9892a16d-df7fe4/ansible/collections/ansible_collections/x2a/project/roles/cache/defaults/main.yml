---
cache_secure_logging: true
# Redis authentication is injected by the AAP credential type at runtime.
redis_password: ""
redis_port: 6379
redis_cluster_enabled: false
redis_sentinel_enabled: false
redis_replication_enabled: false
redis_instances:
  - name: redis-6379
    port: 6379
    mode: standalone
    replication_enabled: false
