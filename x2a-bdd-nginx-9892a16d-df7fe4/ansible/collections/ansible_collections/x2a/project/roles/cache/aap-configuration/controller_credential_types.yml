---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis instance redis-6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required for clients to authenticate to the redis-6379 Redis server.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
