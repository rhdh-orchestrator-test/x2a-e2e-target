---
# Unsupported pre-flight checks: package installation status, HTTP response/body details,
# ownership and modes, certificate subjects/dates, TLS/SNI details, security-setting values,
# fail2ban jail output, and log contents have no stated expected outcome in the pre-flight section.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather service facts for the nginx and fail2ban checks
      ansible.builtin.service_facts:

    - name: Verify nginx and fail2ban are enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['nginx.service']['state'] == 'running'
          - ansible_facts['services']['nginx.service']['status'] == 'enabled'
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'
          - ansible_facts['services']['fail2ban.service']['status'] == 'enabled'
        quiet: true

    - name: Check UFW status and configured allowed ports
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: item_ufw_status
      changed_when: false

    - name: Verify UFW is active with the expected default and ports
      ansible.builtin.assert:
        that:
          - item_ufw_status['rc'] == 0
          - item_ufw_status['stdout'] is regex('(?im)^Status:\s+active\s*$')
          - item_ufw_status['stdout'] is regex('(?im)^Default:\s+deny\s+\(incoming\)')
          - item_ufw_status['stdout'] is regex('(?im)^22/tcp\s+ALLOW')
          - item_ufw_status['stdout'] is regex('(?im)^80/tcp\s+ALLOW')
          - item_ufw_status['stdout'] is regex('(?im)^443/tcp\s+ALLOW')
        quiet: true

    - name: Validate the nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_test
      changed_when: false

    - name: Verify nginx configuration validation succeeds
      ansible.builtin.assert:
        that:
          - item_nginx_test['rc'] == 0
        quiet: true

    - name: Inspect the active nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      register: item_nginx_dump
      changed_when: false

    - name: Verify configured site names and listeners are present
      ansible.builtin.assert:
        that:
          - item_nginx_dump['rc'] == 0
          - item_nginx_dump['stdout'] is regex('test\.cluster\.local')
          - item_nginx_dump['stdout'] is regex('ci\.cluster\.local')
          - item_nginx_dump['stdout'] is regex('status\.cluster\.local')
          - item_nginx_dump['stdout'] is regex('listen 80')
          - item_nginx_dump['stdout'] is regex('listen 443 ssl http2')
        quiet: true

    - name: Check that nginx listens on HTTP and HTTPS
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: item_listening_sockets
      changed_when: false

    - name: Verify HTTP and HTTPS listeners are present
      ansible.builtin.assert:
        that:
          - item_listening_sockets['rc'] == 0
          - item_listening_sockets['stdout'] is regex(':(80|443)\\b')
        quiet: true

    - name: Check files and directories required by the pre-flight checks
      ansible.builtin.stat:
        path: "{{ item_preflight_path['path'] }}"  # noqa: R114 - fixed paths from the migration pre-flight checklist
      loop:
        - path: /etc/nginx/nginx.conf
          kind: file
        - path: /etc/nginx/conf.d/security.conf
          kind: file
        - path: /etc/nginx/sites-available/test.cluster.local
          kind: file
        - path: /etc/nginx/sites-available/ci.cluster.local
          kind: file
        - path: /etc/nginx/sites-available/status.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/test.cluster.local
          kind: link
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          kind: link
        - path: /etc/nginx/sites-enabled/status.cluster.local
          kind: link
        - path: /opt/server/test
          kind: directory
        - path: /opt/server/test/index.html
          kind: file
        - path: /opt/server/ci
          kind: directory
        - path: /opt/server/ci/index.html
          kind: file
        - path: /opt/server/status
          kind: directory
        - path: /opt/server/status/index.html
          kind: file
        - path: /etc/ssl/certs/test.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/test.cluster.local.key
          kind: file
        - path: /etc/ssl/certs/ci.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/ci.cluster.local.key
          kind: file
        - path: /etc/ssl/certs/status.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/status.cluster.local.key
          kind: file
        - path: /etc/fail2ban/jail.local
          kind: file
        - path: /etc/sysctl.d/99-security.conf
          kind: file
        - path: /etc/ssh/sshd_config
          kind: file
      loop_control:
        loop_var: item_preflight_path
      register: item_required_paths

    - name: Verify required files and directories have the expected type
      ansible.builtin.assert:
        that:
          - item_required_path['stat']['exists']
          - (item_required_path['stat']['isdir'] | default(false))
            if item_required_path['item']['kind'] == 'directory'
            else (item_required_path['stat']['islnk'] | default(false))
            if item_required_path['item']['kind'] == 'link'
            else (item_required_path['stat']['isreg'] | default(false))
        quiet: true
      loop: "{{ item_required_paths['results'] }}"
      loop_control:
        loop_var: item_required_path

    - name: Check the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_site

    - name: Verify the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_site['stat']['exists']
        quiet: true

    - name: Check required nginx site links
      ansible.builtin.stat:
        path: "{{ item_site_link }}"  # noqa: R114 - fixed paths from the migration pre-flight checklist
        follow: false
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_site_link
      register: item_site_links

    - name: Verify required nginx site links are symbolic links
      ansible.builtin.assert:
        that:
          - item_site_link_result['stat']['islnk'] | default(false)
        quiet: true
      loop: "{{ item_site_links['results'] }}"
      loop_control:
        loop_var: item_site_link_result
