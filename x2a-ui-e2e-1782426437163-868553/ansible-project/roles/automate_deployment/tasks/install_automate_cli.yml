---
- name: Create temporary directory for Chef Automate CLI
  ansible.builtin.tempfile:
    state: directory
    suffix: automate-cli
  register: automate_temp_dir
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ automate_cli_url }}"
    dest: "{{ automate_temp_dir.path }}/chef-automate.zip"
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < {{ automate_temp_dir.path }}/chef-automate.zip > {{ automate_temp_dir.path }}/chef-automate
  args:
    creates: "{{ automate_temp_dir.path }}/chef-automate"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ automate_temp_dir.path }}/chef-automate"
    mode: "0755"
- name: Copy Chef Automate CLI to /usr/local/bin
  ansible.builtin.copy:
    src: "{{ automate_temp_dir.path }}/chef-automate"
    dest: /usr/local/bin/chef-automate
    mode: "0755"
    remote_src: true
  become: true
