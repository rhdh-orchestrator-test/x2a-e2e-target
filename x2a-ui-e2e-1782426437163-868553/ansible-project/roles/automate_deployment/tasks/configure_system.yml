---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ automate_hostname }}"
  become: true
- name: Configure kernel parameters for Chef Automate
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ kernel_params | dict2items }}"
  become: true
