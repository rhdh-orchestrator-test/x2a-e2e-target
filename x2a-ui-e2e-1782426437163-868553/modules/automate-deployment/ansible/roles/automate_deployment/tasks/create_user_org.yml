---
- name: Create directory for Chef keys
  ansible.builtin.file:
    path: "{{ chef_keys_dir | default('/etc/chef') }}"
    state: directory
    mode: "0755"
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_user.username }} "{{ chef_user.full_name }}" {{ chef_user.email }} "{{ chef_user.password }}" --filename {{
      chef_keys_dir | default('/etc/chef') }}/{{ chef_user.username }}.pem
  args:
    creates: "{{ chef_keys_dir | default('/etc/chef') }}/{{ chef_user.username }}.pem"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org.short_name }} "{{ chef_org.full_name }}" --association_user {{ chef_user.username }} --filename {{ chef_keys_dir
      | default('/etc/chef') }}/{{ chef_org.short_name }}-validator.pem
  args:
    creates: "{{ chef_keys_dir | default('/etc/chef') }}/{{ chef_org.short_name }}-validator.pem"
  become: true
- name: Set proper permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_keys_dir | default('/etc/chef') }}/{{ chef_user.username }}.pem"
    mode: "0600"
    owner: "{{ ansible_user }}"
  become: true
- name: Set proper permissions on organization validator key file
  ansible.builtin.file:
    path: "{{ chef_keys_dir | default('/etc/chef') }}/{{ chef_org.short_name }}-validator.pem"
    mode: "0600"
    owner: "{{ ansible_user }}"
  become: true
