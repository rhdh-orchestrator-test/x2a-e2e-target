- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create Apache mods-available directory
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create mock Apache SSL configuration file
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file for testing

        SSLEngine on

        SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem

        SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

        SSLProtocol all -SSLv3

        SSLHonorCipherOrder on

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Create symlink for Apache SSL config
    ansible.builtin.file:
      src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      dest: /etc/apache2/mods-available/ssl.conf
      state: link
      force: true
  - name: Mock apache2 package installation
    ansible.builtin.set_fact:
      apache2_installed: true
  - name: Fix SSL in Apache
    ansible.builtin.replace:
      dest: /etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
