---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI tutorial dependencies on RedHat family
  ansible.builtin.package:
    name: [python3, python3-pip, git, postgresql-server, postgresql-contrib, libpq-devel]
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install FastAPI tutorial dependencies on Debian family
  ansible.builtin.package:
    name: [python3, python3-pip, python3-venv, git, postgresql, postgresql-contrib, libpq-dev]
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Initialize PostgreSQL on RedHat family
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] == 'RedHat'

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a trusted role default
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize application repository # noqa: R104 - repository default uses a trusted HTTPS source
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R106 - repository source is a trusted role default
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - destination is a trusted role default
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment
  ansible.builtin.command: # noqa: R101 - command argument comes from a trusted role default
    argv: [python3, -m, venv, "{{ fastapi_tutorial_venv_dir }}"]
    creates: "{{ fastapi_tutorial_venv_dir }}/bin/python" # noqa: R114 - path is a trusted role default

- name: Install Python dependencies # noqa: R113 - requirements path comes from a trusted role default
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - path is a trusted role default
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path is a trusted role default

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_postgresql_service_name }}"
    state: started
    enabled: true

- name: Check whether the PostgreSQL application user exists
  ansible.builtin.command: # noqa: R101 - database username is a validated credential parameter
    argv: [psql, -tAc, "SELECT 1 FROM pg_roles WHERE rolname = '{{ database_username }}';"] # noqa: L039 - database username comes from validated role parameters
  register: fastapi_tutorial_role_result
  changed_when: false
  become: true # noqa: R108 - PostgreSQL role inspection requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL application user
  ansible.builtin.command: # noqa: R101 - database credentials are validated role parameters
    argv: [psql, -c, "CREATE ROLE {{ database_username }} LOGIN PASSWORD '{{ database_password }}';"] # noqa: L039 - database credentials come from validated role parameters
  when: fastapi_tutorial_role_result.stdout | trim != '1'
  changed_when: true
  become: true # noqa: R108 - PostgreSQL role creation requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL application database
  ansible.builtin.command: # noqa: R101 - database parameters are validated role parameters
    argv: [createdb, -O, "{{ database_username }}", "{{ database_name }}"] # noqa: L039 - database parameters come from validated role parameters
  changed_when: fastapi_tutorial_createdb_result.rc == 0
  failed_when: fastapi_tutorial_createdb_result.rc != 0 and 'already exists' not in fastapi_tutorial_createdb_result.stderr
  register: fastapi_tutorial_createdb_result
  become: true # noqa: R108 - PostgreSQL database creation requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant PostgreSQL application database privileges
  ansible.builtin.command: # noqa: R101 - database parameters are validated role parameters
    argv: [psql, -c, "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ database_username }};"] # noqa: L039 - database parameters come from validated role parameters
  changed_when: false
  become: true # noqa: R108 - PostgreSQL privilege grant requires the postgres account
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write application environment file # noqa: L039 - database connection parameters come from validated role parameters
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_env_file }}" # noqa: R114 - destination is a trusted role default
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ database_username }}:{{ database_password }}@{{ database_host }}:{{ database_port }}/{{ database_name }}
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write systemd service unit
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_systemd_unit }}" # noqa: R114 - destination is a trusted role default
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd manager configuration

- name: Reload systemd manager configuration before starting FastAPI tutorial
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: "{{ fastapi_tutorial_service_name }}"
    state: started
    enabled: true
