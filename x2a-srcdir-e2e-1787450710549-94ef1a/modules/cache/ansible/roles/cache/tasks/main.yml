---
- name: Install redis-server package
  ansible.builtin.package:
    name: "{{ cache_redis_package }}"
    state: present
- name: Create Redis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: redis
    group: redis
  loop:
    - /etc/redis
    - /var/lib/redis
    - /var/log/redis
    - /var/run/redis
- name: Configure Redis
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    mode: "0644"
    owner: redis
    group: redis
  notify: Restart redis-server
- name: Enable and start redis-server service
  ansible.builtin.service:
    name: "{{ cache_redis_service }}"
    state: "{{ cache_redis_service_state }}"
    enabled: "{{ cache_redis_service_enabled }}"
