---
argument_specs:
  main:
    short_description: Simple cache cookbook - local dependency for testing
    description:
      - Installs and configures Redis server as a caching service.
      - Sets up a single Redis instance with default configuration.
    options:
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Package name for Redis server.
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Service name for Redis server.
      cache_redis_service_state:
        type: str
        required: false
        default: started
        description: Desired state of the Redis service (started, stopped).
      cache_redis_service_enabled:
        type: bool
        required: false
        default: true
        description: Whether the Redis service should be enabled at boot.
