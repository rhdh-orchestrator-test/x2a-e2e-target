- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check if Apache SSL config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_conf_file
  - name: Assert SSL config file exists
    ansible.builtin.assert:
      that:
      - ssl_conf_file.stat.exists
      - ssl_conf_file.stat.isreg
      fail_msg: Apache SSL config file not found
      success_msg: Apache SSL config file exists
  - name: Get SSL config file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_conf_content
    when: ssl_conf_file.stat.exists
  - name: Assert SSL protocol is set correctly
    ansible.builtin.assert:
      that:
      - '''SSLProtocol -all +TLSv1.2'' in (ssl_conf_content.content | b64decode)'
      fail_msg: SSL protocol not set correctly to disable vulnerable protocols
      success_msg: SSL protocol correctly set to disable vulnerable protocols
    when: ssl_conf_file.stat.exists
  - name: Check Apache configuration syntax
    ansible.builtin.command: apache2ctl configtest
    changed_when: false
    tags: molecule-notest
  - name: Check SSL/TLS protocols with nmap
    ansible.builtin.command: nmap --script ssl-enum-ciphers -p 443 localhost
    changed_when: false
    register: nmap_result
    tags: molecule-notest
  - name: Assert only TLSv1.2 is enabled
    ansible.builtin.assert:
      that:
      - '''TLSv1.0'' not in nmap_result.stdout'
      - '''TLSv1.1'' not in nmap_result.stdout'
      - '''SSLv3'' not in nmap_result.stdout'
      - '''TLSv1.2'' in nmap_result.stdout'
      fail_msg: Vulnerable SSL/TLS protocols are still enabled
      success_msg: Only secure TLS protocols are enabled
    tags: molecule-notest
  - name: Verify SSH configuration
    ansible.builtin.command: sshd -t
    changed_when: false
    tags: molecule-notest
  - name: Check SSH protocol versions
    ansible.builtin.command: ssh -vv localhost
    changed_when: false
    register: ssh_result
    tags: molecule-notest
  - name: Assert SSH is using secure protocols
    ansible.builtin.assert:
      that:
      - '''protocol 2.0'' in ssh_result.stdout'
      fail_msg: SSH may be using insecure protocol versions
      success_msg: SSH is using secure protocol versions
    tags: molecule-notest
