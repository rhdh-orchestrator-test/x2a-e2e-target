---
- name: Create admin user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ chef_automate_admin_username }} {{ chef_automate_admin_fullname }} {{ chef_automate_admin_email }} "{{ chef_automate_admin_password
      }}" --filename {{ chef_automate_admin_key_file }}

      '
  become: true
  args:
    creates: "{{ chef_automate_admin_key_file }}"
  no_log: true
- name: Create organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_fullname }}" --association_user {{ chef_automate_admin_username }} --filename
      {{ chef_automate_org_key_file }}

      '
  become: true
  args:
    creates: "{{ chef_automate_org_key_file }}"
- name: Check if admin key file exists
  ansible.builtin.stat:
    path: "{{ chef_automate_admin_key_file }}"
  register: admin_key_stat
- name: Set permissions on admin key file
  ansible.builtin.file:
    path: "{{ chef_automate_admin_key_file }}"
    mode: "0600"
    state: file
  when: admin_key_stat.stat.exists
- name: Check if organization key file exists
  ansible.builtin.stat:
    path: "{{ chef_automate_org_key_file }}"
  register: org_key_stat
- name: Set permissions on organization key file
  ansible.builtin.file:
    path: "{{ chef_automate_org_key_file }}"
    mode: "0600"
    state: file
  when: org_key_stat.stat.exists
