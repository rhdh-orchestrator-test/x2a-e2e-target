- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists and has content
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found or empty
      success_msg: Hostname file exists and has content
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set to expected value
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check vm.max_map_count file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_file
  - name: Assert vm.max_map_count file exists
    ansible.builtin.assert:
      that:
      - max_map_count_file.stat.exists
      fail_msg: vm.max_map_count file not found
      success_msg: vm.max_map_count file exists
  - name: Get vm.max_map_count content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_content
    when: max_map_count_file.stat.exists
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - (max_map_count_content.content | b64decode | trim) == "262144"
      fail_msg: vm.max_map_count not set to expected value
      success_msg: vm.max_map_count set correctly
    when: max_map_count_file.stat.exists
  - name: Check vm.dirty_expire_centisecs file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_file
  - name: Assert vm.dirty_expire_centisecs file exists
    ansible.builtin.assert:
      that:
      - dirty_expire_centisecs_file.stat.exists
      fail_msg: vm.dirty_expire_centisecs file not found
      success_msg: vm.dirty_expire_centisecs file exists
  - name: Get vm.dirty_expire_centisecs content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_content
    when: dirty_expire_centisecs_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
      fail_msg: vm.dirty_expire_centisecs not set to expected value
      success_msg: vm.dirty_expire_centisecs set correctly
    when: dirty_expire_centisecs_file.stat.exists
  - name: Check Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI exists and is executable
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check HAB directory exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert HAB directory exists
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: HAB directory not found
      success_msg: HAB directory exists
  - name: Check admin key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/admin.pem
    register: admin_key_file
  - name: Assert admin key file exists and has correct permissions
    ansible.builtin.assert:
      that:
      - admin_key_file.stat.exists
      - admin_key_file.stat.mode == "0600"
      fail_msg: Admin key file not found or has incorrect permissions
      success_msg: Admin key file exists with correct permissions
  - name: Check organization validator key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_key_file
  - name: Assert organization validator key file exists and has correct permissions
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.mode == "0600"
      fail_msg: Organization validator key file not found or has incorrect permissions
      success_msg: Organization validator key file exists with correct permissions
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: chef-automate status
    register: chef_automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - chef_automate_status.rc == 0
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Server user list
    ansible.builtin.command:
      cmd: chef-server-ctl user-list
    register: chef_server_user_list
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert admin user exists
    ansible.builtin.assert:
      that:
      - '''admin'' in chef_server_user_list.stdout'
      fail_msg: Admin user not found
      success_msg: Admin user exists
    tags: molecule-notest
  - name: Check Chef Server organization list
    ansible.builtin.command:
      cmd: chef-server-ctl org-list
    register: chef_server_org_list
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert organization exists
    ansible.builtin.assert:
      that:
      - '''lab'' in chef_server_org_list.stdout'
      fail_msg: Organization not found
      success_msg: Organization exists
    tags: molecule-notest
  - name: Check if port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Assert port 443 is listening
    ansible.builtin.assert:
      that:
      - port_check is succeeded
      fail_msg: Port 443 is not listening
      success_msg: Port 443 is listening
    tags: molecule-notest
  - name: Test Chef Automate UI access
    ansible.builtin.uri:
      url: https://localhost/api/v0/auth/version
      validate_certs: false
    register: ui_access
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate UI is accessible
    ansible.builtin.assert:
      that:
      - ui_access.status == 200
      fail_msg: Chef Automate UI is not accessible
      success_msg: Chef Automate UI is accessible
    tags: molecule-notest
