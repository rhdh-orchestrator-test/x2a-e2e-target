- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '262144'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '20000'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create admin user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK ADMIN KEY CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/admin.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK ORG VALIDATOR KEY CONTENT -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: "Service: automate-postgresql.default\n  Status: running\nService: automate-elasticsearch.default\n  Status: running\nService: chef-server.default\n
        \ Status: running\n"
      dest: /tmp/molecule_test/chef-automate-status.txt
      mode: '0644'
  - name: Create Chef Server user list file
    ansible.builtin.copy:
      content: 'admin '
      dest: /tmp/molecule_test/chef-server-user-list.txt
      mode: '0644'
  - name: Create Chef Server org list file
    ansible.builtin.copy:
      content: 'lab '
      dest: /tmp/molecule_test/chef-server-org-list.txt
      mode: '0644'
