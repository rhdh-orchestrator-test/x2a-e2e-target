---
chef_automate_hostname: automate.chef.lab
chef_automate_sysctl_settings:
  vm.max_map_count: 262144
  vm.dirty_expire_centisecs: 20000
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: ./chef-automate
chef_automate_accept_terms: true
chef_automate_products:
  - automate
  - infra-server
chef_infra_server_products:
  - infra-server
chef_user_name: "{{ username | default('admin') }}"
chef_user_fullname: "{{ username | default('Admin User') }}"
chef_user_email: "{{ email | default('admin@example.com') }}"
chef_user_password: "{{ password | default('changeme') }}"
chef_user_key_file: "{{ username | default('admin') }}.pem"
chef_org_name: lab
chef_org_fullname: Chef Lab
chef_org_validator_key_file: lab-validator.pem
chef_deployment_type: full
