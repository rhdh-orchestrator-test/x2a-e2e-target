- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/hosts
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/chef-server
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create hosts file
    ansible.builtin.copy:
      content: '127.0.0.1 localhost

        127.0.1.1 automate.chef.lab

        '
      dest: /tmp/molecule_test/etc/hosts
      mode: '0644'
  - name: Create sysctl files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/vm/{{ item.key | regex_replace('^vm\.', '') }}
      mode: '0644'
    loop:
    - key: vm.max_map_count
      value: '262144'
    - key: vm.dirty_expire_centisecs
      value: '20000'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'' '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "[global]\n  v1 = true\n[deployment]\n  products = [\"automate\", \"infra-server\"]\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK USER KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/admin.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK ORG VALIDATOR KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create Chef Server status directory
    ansible.builtin.file:
      path: /tmp/molecule_test/var/opt/chef-server/status
      state: directory
      mode: '0755'
  - name: Create Chef Server status files
    ansible.builtin.copy:
      content: running
      dest: /tmp/molecule_test/var/opt/chef-server/status/{{ item }}
      mode: '0644'
    loop:
    - nginx
    - postgresql
    - bookshelf
    - oc_bifrost
    - oc_id
    - opscode-erchef
    - opscode-solr4
  - name: Create Chef Automate status directory
    ansible.builtin.file:
      path: /tmp/molecule_test/var/opt/chef-automate/status
      state: directory
      mode: '0755'
  - name: Create Chef Automate status files
    ansible.builtin.copy:
      content: running
      dest: /tmp/molecule_test/var/opt/chef-automate/status/{{ item }}
      mode: '0644'
    loop:
    - automate-gateway
    - automate-ui
    - compliance-service
    - elasticsearch
    - postgresql
