---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Update /etc/hosts with hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: ^127.0.1.1\s+{{ chef_automate_hostname }}$
    line: 127.0.1.1 {{ chef_automate_hostname }}
    state: present
  become: true
- name: Configure system parameters for optimal performance
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ chef_automate_sysctl_settings | dict2items }}"
  become: true
