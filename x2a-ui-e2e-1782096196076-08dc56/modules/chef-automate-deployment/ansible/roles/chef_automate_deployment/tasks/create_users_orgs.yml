---
- name: Check if user already exists
  ansible.builtin.command:
    cmd: chef-server-ctl user-list
  register: user_list
  changed_when: false
  become: true
- name: Create initial admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_user_name }} "{{ chef_user_fullname }}" {{ chef_user_email }} "{{ chef_user_password }}" --filename {{
      chef_user_key_file }}
  args:
    creates: "{{ chef_user_key_file }}"
  become: true
  no_log: true
  when: chef_user_name not in user_list.stdout
- name: Check if organization already exists
  ansible.builtin.command:
    cmd: chef-server-ctl org-list
  register: org_list
  changed_when: false
  become: true
- name: Create initial organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_fullname }}" --association_user {{ chef_user_name }} --filename {{
      chef_org_validator_key_file }}
  args:
    creates: "{{ chef_org_validator_key_file }}"
  become: true
  when: chef_org_name not in org_list.stdout
