---
argument_specs:
  main:
    short_description: Role to fix POODLE vulnerability in Apache SSL configuration
    description: "This role applies a security fix for the POODLE (Padding Oracle On Downgraded Legacy Encryption) vulnerability by updating SSL configuration in
      Apache to disable vulnerable protocols and enable only TLSv1.2.\n"
    author: X2A Migration
    options:
      poodle_fix_apache_config_path:
        type: str
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file
      poodle_fix_ssl_protocol:
        type: str
        default: -all +TLSv1.2
        description: SSL protocol configuration string
