---
controller_credential_types:
- name: Chef Deployment Credentials
  description: Credential type for Chef Deployment Credentials
  kind: cloud
  inputs:
    fields:
    - id: user_password
      type: string
      label: User Password
      secret: true
      help_text: Password used in Chef deployment scripts
    required:
    - user_password
  injectors:
    extra_vars:
      user_password: !unsafe '{{ user_password }}'
