---
argument_specs:
  main:
    short_description: Configure a Redis cache service
    description:
      - Installs and configures a standalone Redis cache on TCP port 6379.
      - Uses an AAP-injected password and secure logging by default.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether tasks handling the Redis password suppress output.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port used by the Redis instance.
      cache_redis_install_method:
        type: str
        required: false
        default: package
        description: Redis installation method passed to the Redis collection role.
      cache_redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis cluster mode is enabled.
      cache_redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis Sentinel mode is enabled.
      cache_redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis replication is enabled.
      cache_redis_aof_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis append-only persistence is enabled.
      cache_redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Whether Redis RDB persistence is enabled.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Directory for Redis logs.
      cache_redis_config_path:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration file modified by cleanup tasks.
      cache_redis_service_name:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis service managed by the role.
