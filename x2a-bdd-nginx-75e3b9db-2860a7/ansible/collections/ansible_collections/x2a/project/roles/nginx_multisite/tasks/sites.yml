---
- name: Render Nginx virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item_nginx_multisite['key'] }}"  # noqa: R114 - site names come from role defaults
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
  notify: Reload nginx
  vars:
    server_name: "{{ item_nginx_multisite['key'] }}"
    document_root: "{{ item_nginx_multisite['value']['document_root'] }}"
    ssl_enabled: "{{ item_nginx_multisite['value']['ssl_enabled'] }}"
    cert_file: "/etc/ssl/certs/{{ item_nginx_multisite['key'] }}.crt"
    key_file: "/etc/ssl/private/{{ item_nginx_multisite['key'] }}.key"

- name: Enable Nginx virtual hosts
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item_nginx_multisite['key'] }}"  # noqa: R114 - site names come from role defaults
    dest: "/etc/nginx/sites-enabled/{{ item_nginx_multisite['key'] }}"  # noqa: R114 - site names come from role defaults
    state: link
    force: true
    mode: "0644"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
  notify: Reload nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
