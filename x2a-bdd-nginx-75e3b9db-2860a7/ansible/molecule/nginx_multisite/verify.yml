# Unsupported pre-flight checks: firewall output/policy, raw configuration dumps, SSH service status,
# sysctl reload output, and journal diagnostics not expressible as a reliable expected assertion are omitted.
---
- name: Verify nginx-multisite pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify fail2ban and nginx services are enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ item_service['name'] }}"
      changed_when: false
      register: enabled_services
      loop:
        - name: fail2ban
        - name: nginx
      loop_control:
        loop_var: item_service

    - name: Assert fail2ban and nginx services are enabled
      ansible.builtin.assert:
        that:
          - item_enabled['stdout'] | trim == 'enabled'
      loop: "{{ enabled_services['results'] }}"
      loop_control:
        loop_var: item_enabled

    - name: Verify fail2ban and nginx services are active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ item_service_active['name'] }}"
      changed_when: false
      register: active_services
      loop:
        - name: fail2ban
        - name: nginx
      loop_control:
        loop_var: item_service_active

    - name: Assert fail2ban and nginx services are active
      ansible.builtin.assert:
        that:
          - item_active['stdout'] | trim == 'active'
      loop: "{{ active_services['results'] }}"
      loop_control:
        loop_var: item_active

    - name: Verify SSH hardening directives
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config

    - name: Assert SSH hardening directives are disabled
      ansible.builtin.assert:
        that:
          - sshd_config['content'] | b64decode is search('(?m)^\\s*PermitRootLogin\\s+no\\s*$')
          - sshd_config['content'] | b64decode is search('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')

    - name: Verify nginx configuration syntax
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Verify configured virtual hosts are present in nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      changed_when: false
      register: nginx_configuration

    - name: Assert configured virtual hosts are present
      ansible.builtin.assert:
        that:
          - item_vhost['name'] in nginx_configuration['stdout']
      loop:
        - name: test.cluster.local
        - name: ci.cluster.local
        - name: status.cluster.local
      loop_control:
        loop_var: item_vhost

    - name: Verify HTTP and HTTPS listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listener['port'] }}"
        state: started
        timeout: 10
      loop:
        - port: 80
        - port: 443
      loop_control:
        loop_var: item_listener

    - name: Verify HTTP and HTTPS responses for each site
      ansible.builtin.uri:
        url: "{{ item_endpoint['url'] }}"
        method: HEAD
        headers:
          Host: "{{ item_endpoint['host'] }}"
        validate_certs: false
        status_code: 200
      loop:
        - host: test.cluster.local
          url: http://127.0.0.1/
        - host: test.cluster.local
          url: https://127.0.0.1/
        - host: ci.cluster.local
          url: http://127.0.0.1/
        - host: ci.cluster.local
          url: https://127.0.0.1/
        - host: status.cluster.local
          url: http://127.0.0.1/
        - host: status.cluster.local
          url: https://127.0.0.1/
      loop_control:
        loop_var: item_endpoint

    - name: Verify site directories, files, configurations, certificates, and keys
      ansible.builtin.stat:
        path: "{{ item_site_path['path'] }}"
      register: site_paths
      loop:
        - path: /opt/server/test
        - path: /opt/server/test/index.html
        - path: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/ssl/certs/test.cluster.local.crt
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /opt/server/ci
        - path: /opt/server/ci/index.html
        - path: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /opt/server/status
        - path: /opt/server/status/index.html
        - path: /etc/nginx/sites-available/status.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_site_path

    - name: Assert required site paths exist
      ansible.builtin.assert:
        that:
          - item_required_path['stat']['exists']
      loop: "{{ site_paths['results'] }}"
      loop_control:
        loop_var: item_required_path

    - name: Verify enabled site links
      ansible.builtin.stat:
        path: "{{ item_enabled_path['path'] }}"
      register: enabled_site_paths
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_enabled_path

    - name: Assert enabled site links exist
      ansible.builtin.assert:
        that:
          - item_enabled_site['stat']['islnk']
      loop: "{{ enabled_site_paths['results'] }}"
      loop_control:
        loop_var: item_enabled_site

    - name: Verify the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site['stat']['exists']

    - name: Verify certificate common names
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
      changed_when: false
      register: certificate_subjects
      loop:
        - name: test.cluster.local
          path: /etc/ssl/certs/test.cluster.local.crt
        - name: ci.cluster.local
          path: /etc/ssl/certs/ci.cluster.local.crt
        - name: status.cluster.local
          path: /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_certificate

    - name: Assert certificate common names match site names
      ansible.builtin.assert:
        that:
          - "item_certificate_subject['stdout'] is search('CN=' ~ item_certificate_subject['item']['name'])"
      loop: "{{ certificate_subjects['results'] }}"
      loop_control:
        loop_var: item_certificate_subject

    - name: Verify private key ownership and permissions
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
      register: private_key_stats
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key

    - name: Assert private keys have the expected ownership and mode
      ansible.builtin.assert:
        that:
          - item_private_key['stat']['pw_name'] == 'root'
          - item_private_key['stat']['gr_name'] == 'ssl-cert'
          - item_private_key['stat']['mode'] == '0640'
      loop: "{{ private_key_stats['results'] }}"
      loop_control:
        loop_var: item_private_key

    - name: Check nginx logs for startup or configuration errors
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - nginx
          - --no-pager
          - -n
          - '100'
      changed_when: false
      register: nginx_logs

    - name: Assert nginx logs contain no errors
      ansible.builtin.assert:
        that:
          - nginx_logs['stdout'] is not search('(?i)(error|failed|fatal|permission denied)')

    - name: Check fail2ban logs for startup errors
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - fail2ban
          - --no-pager
          - -n
          - '100'
      changed_when: false
      register: fail2ban_logs

    - name: Assert fail2ban logs contain no startup errors
      ansible.builtin.assert:
        that:
          - fail2ban_logs['stdout'] is not search('(?i)(error|failed|fatal|permission denied)')
