---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true
- name: Install Apache web server
  ansible.builtin.apt:
    name: apache2={{ apache_version }}
    state: present
  become: true
- name: Install required packages
  ansible.builtin.apt:
    name: "{{ required_packages }}"
    state: present
  become: true
- name: Create a directory for SSL certificates
  ansible.builtin.file:
    path: "{{ ssl_cert_dir }}"
    state: directory
    mode: "0755"
  become: true
- name: Generate an OpenSSL private key
  community.crypto.openssl_privatekey:
    path: "{{ ssl_key_file }}"
  become: true
- name: Generate an OpenSSL CSR
  community.crypto.openssl_csr:
    path: "{{ ssl_csr_file }}"
    privatekey_path: "{{ ssl_key_file }}"
    common_name: "{{ ansible_hostname }}"
  become: true
- name: Generate a self-signed OpenSSL certificate
  community.crypto.openssl_certificate:
    path: "{{ ssl_cert_file }}"
    privatekey_path: "{{ ssl_key_file }}"
    csr_path: "{{ ssl_csr_file }}"
    provider: selfsigned
  become: true
- name: Configure Hello World virtual host
  ansible.builtin.copy:
    content: "{{ virtual_host_config }}"
    dest: /etc/apache2/sites-available/{{ virtual_host_name }}.conf
    mode: "0640"
    force: true
  become: true
- name: Create the website document root directory
  ansible.builtin.file:
    path: "{{ document_root }}"
    state: directory
    mode: "0755"
  become: true
- name: Deploy the Hello World website
  ansible.builtin.copy:
    content: "{{ website_content }}"
    dest: "{{ document_root }}/index.html"
    owner: root
    group: root
    mode: "0644"
    force: true
  become: true
- name: Check if default site is enabled
  ansible.builtin.stat:
    path: /etc/apache2/sites-enabled/000-default.conf
  register: default_site
  become: true
- name: Deactivate the default virtualhost
  ansible.builtin.command: a2dissite 000-default
  become: true
  changed_when: true
  when: default_site.stat.exists
- name: Check if virtual host is enabled
  ansible.builtin.stat:
    path: /etc/apache2/sites-enabled/{{ virtual_host_name }}.conf
  register: vhost_enabled
  become: true
- name: Activate the virtualhost
  ansible.builtin.command: a2ensite {{ virtual_host_name }}
  become: true
  changed_when: true
  when: not vhost_enabled.stat.exists
  notify:
    - Restart apache
- name: Check if SSL module is enabled
  ansible.builtin.stat:
    path: /etc/apache2/mods-enabled/ssl.load
  register: ssl_enabled
  become: true
- name: Activate SSL on Apache
  ansible.builtin.command: a2enmod ssl
  become: true
  changed_when: true
  when: not ssl_enabled.stat.exists
  notify:
    - Restart apache
