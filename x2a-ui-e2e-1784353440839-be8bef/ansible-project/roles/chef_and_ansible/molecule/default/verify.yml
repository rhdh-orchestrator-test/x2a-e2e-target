---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check Apache configuration files
    - name: Check if Apache virtual host config exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      register: vhost_config

    - name: Assert virtual host config exists
      ansible.builtin.assert:
        that:
          - vhost_config.stat.exists
          - vhost_config.stat.isreg
        fail_msg: "Virtual host configuration file not found"
        success_msg: "Virtual host configuration file exists"

    - name: Check if virtual host is enabled
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
      register: vhost_enabled

    - name: Assert virtual host is enabled
      ansible.builtin.assert:
        that:
          - vhost_enabled.stat.exists
          - vhost_enabled.stat.islnk
        fail_msg: "Virtual host is not enabled"
        success_msg: "Virtual host is enabled"

    # Check SSL configuration
    - name: Check if SSL module config exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_config

    - name: Assert SSL module config exists
      ansible.builtin.assert:
        that:
          - ssl_config.stat.exists
          - ssl_config.stat.isreg
        fail_msg: "SSL module configuration file not found"
        success_msg: "SSL module configuration file exists"

    - name: Get SSL configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_config_content

    - name: Assert SSL configuration has proper protocol settings
      ansible.builtin.assert:
        that:
          - ssl_config_content.content | b64decode | regex_search('SSLProtocol -all \+TLSv1.2')
        fail_msg: "SSL configuration does not have proper protocol settings"
        success_msg: "SSL configuration has proper protocol settings"

    - name: Check if SSL module is enabled
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.conf
      register: ssl_enabled

    - name: Assert SSL module is enabled
      ansible.builtin.assert:
        that:
          - ssl_enabled.stat.exists
          - ssl_enabled.stat.islnk
        fail_msg: "SSL module is not enabled"
        success_msg: "SSL module is enabled"

    # Check SSL certificates
    - name: Check if SSL certificate files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: ssl_files
      loop:
        - /tmp/molecule_test/etc/apache2/certs/apache.crt
        - /tmp/molecule_test/etc/apache2/certs/apache.key
        - /tmp/molecule_test/etc/apache2/certs/apache.csr

    - name: Assert SSL certificate files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "SSL certificate file {{ item.item }} not found"
        success_msg: "SSL certificate file {{ item.item }} exists"
      loop: "{{ ssl_files.results }}"

    # Check website content
    - name: Check if website content exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/www/helloworld/index.html
      register: website_content

    - name: Assert website content exists
      ansible.builtin.assert:
        that:
          - website_content.stat.exists
          - website_content.stat.isreg
        fail_msg: "Website content file not found"
        success_msg: "Website content file exists"

    - name: Get website content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/www/helloworld/index.html
      register: html_content

    - name: Assert website content has Hello World
      ansible.builtin.assert:
        that:
          - html_content.content | b64decode | regex_search('Hello, world!')
        fail_msg: "Website content does not have 'Hello, world!'"
        success_msg: "Website content has 'Hello, world!'"

    # The following checks cannot run in a container, so they are tagged with molecule-notest
    - name: Check if Apache service is running
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Check HTTPS connectivity
      ansible.builtin.uri:
        url: https://localhost/
        validate_certs: false
        return_content: true
      register: https_response
      tags: molecule-notest

    - name: Assert HTTPS is working
      ansible.builtin.assert:
        that:
          - https_response.status == 200
          - "'Hello, world!' in https_response.content"
        fail_msg: "HTTPS is not working properly"
        success_msg: "HTTPS is working properly"
      tags: molecule-notest