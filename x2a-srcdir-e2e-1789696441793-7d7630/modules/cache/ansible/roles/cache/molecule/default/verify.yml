---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis service facts
      ansible.builtin.service_facts:

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service']['state'] == 'running'"
          - "ansible_facts.services['redis-server.service']['status'] == 'enabled'"
        fail_msg: "Redis service is not running or enabled"

    - name: Check Redis is listening on port 6379
      ansible.builtin.wait_for:
        port: 6379
        host: 127.0.0.1
        timeout: 10
        msg: "Redis is not listening on port 6379"

    - name: Test Redis connectivity with ping
      ansible.builtin.command:
        cmd: redis-cli ping
      register: redis_ping_result
      changed_when: false

    - name: Assert Redis ping returns PONG
      ansible.builtin.assert:
        that:
          - "redis_ping_result['stdout'] == 'PONG'"
        fail_msg: "Redis ping test failed"

    - name: Check Redis configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /etc/redis/redis.conf
      loop_control:
        loop_var: item_config
      register: config_stat_results

    - name: Assert Redis configuration files exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isreg']
        fail_msg: "Redis configuration file not found"
      loop: "{{ config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check Redis data directory exists
      ansible.builtin.stat:
        path: /var/lib/redis
      register: redis_data_dir_stat

    - name: Assert Redis data directory exists
      ansible.builtin.assert:
        that:
          - redis_data_dir_stat['stat']['exists']
          - redis_data_dir_stat['stat']['isdir']
        fail_msg: "Redis data directory not found"

    - name: Test basic Redis operations
      block:
        - name: Set test key in Redis
          ansible.builtin.command:
            cmd: redis-cli set molecule_test_key "molecule_test_value"
          register: redis_set_result
          changed_when: false

        - name: Get test key from Redis
          ansible.builtin.command:
            cmd: redis-cli get molecule_test_key
          register: redis_get_result
          changed_when: false

        - name: Delete test key from Redis
          ansible.builtin.command:
            cmd: redis-cli del molecule_test_key
          register: redis_del_result
          changed_when: false

        - name: Assert Redis operations work correctly
          ansible.builtin.assert:
            that:
              - "redis_set_result['stdout'] == 'OK'"
              - "redis_get_result['stdout'] == 'molecule_test_value'"
              - "redis_del_result['stdout'] == '1'"
            fail_msg: "Redis basic operations test failed"

    - name: Get Redis server info
      ansible.builtin.command:
        cmd: redis-cli info server
      register: redis_info_result
      changed_when: false

    - name: Assert Redis version info is available
      ansible.builtin.assert:
        that:
          - "'redis_version' in redis_info_result['stdout']"
        fail_msg: "Redis server info not available"