---
# Redis cache configuration defaults
# Redis package name (may vary by OS)
cache_redis_package: redis-server
# Redis service name
cache_redis_service: redis-server
# Redis port (default)
cache_redis_port: 6379
# Redis bind address (default to localhost for security)
cache_redis_bind: 127.0.0.1
# Redis data directory
cache_redis_data_dir: /var/lib/redis
# Redis log file
cache_redis_log_file: /var/log/redis/redis-server.log
