---
argument_specs:
  main:
    short_description: Install and configure Redis cache server
    description:
      - Installs Redis server package and ensures the service is running and enabled.
      - Provides a simple Redis cache instance with default configuration.
    options:
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis package to install (may vary by OS distribution).
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis systemd service.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port Redis listens on.
      cache_redis_bind:
        type: str
        required: false
        default: 127.0.0.1
        description: IP address Redis binds to for client connections.
      cache_redis_data_dir:
        type: str
        required: false
        default: /var/lib/redis
        description: Directory where Redis stores its data files.
      cache_redis_log_file:
        type: str
        required: false
        default: /var/log/redis/redis-server.log
        description: Path to the Redis log file.
