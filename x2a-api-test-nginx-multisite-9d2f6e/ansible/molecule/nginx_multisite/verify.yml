---
# Unsupported pre-flight checks: curl response headers, certificate details, key metadata,
# fail2ban client status, sysctl values, verbose UFW status, and diagnostic log output
# have no stated expected outcome in the migration plan.
- name: Verify nginx-multisite pre-flight checks
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts.packages
        fail_msg: "A required package is not installed."
        success_msg: "The required package is installed."
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Check nginx service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - nginx
      changed_when: false
      register: nginx_service_check

    - name: Assert nginx service is active
      ansible.builtin.assert:
        that:
          - nginx_service_check.rc == 0
        fail_msg: "The nginx service is not active."

    - name: Check fail2ban service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - fail2ban
      changed_when: false
      register: fail2ban_service_check

    - name: Assert fail2ban service is active
      ansible.builtin.assert:
        that:
          - fail2ban_service_check.rc == 0
        fail_msg: "The fail2ban service is not active."

    - name: Check SSH service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - ssh
      changed_when: false
      register: ssh_service_check

    - name: Assert SSH service is active
      ansible.builtin.assert:
        that:
          - ssh_service_check.rc == 0
        fail_msg: "The SSH service is not active."

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Check required configuration and content files
      ansible.builtin.stat:
        path: "{{ item_config_path }}"
      loop:
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/certs/status.cluster.local.crt
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_config_path
      register: required_file_checks

    - name: Assert required configuration and content files exist
      ansible.builtin.assert:
        that:
          - item_required_file['stat']['exists']
        fail_msg: "A required configuration or content file is missing."
      loop: "{{ required_file_checks['results'] }}"
      loop_control:
        loop_var: item_required_file

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_site_link }}"
        follow: false
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_site_link
      register: site_link_checks

    - name: Assert enabled site links are symbolic links
      ansible.builtin.assert:
        that:
          - item_site_link_check['stat']['islnk'] | default(false)
        fail_msg: "A required enabled site link is missing."
      loop: "{{ site_link_checks['results'] }}"
      loop_control:
        loop_var: item_site_link_check

    - name: Check SSH hardening configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config_contents

    - name: Assert SSH root login and password authentication are disabled
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (sshd_config_contents['content'] | b64decode | split('\\n'))"
          - "'PasswordAuthentication no' in (sshd_config_contents['content'] | b64decode | split('\\n'))"
        fail_msg: "The required SSH hardening settings are not present."

    - name: Check firewall rules
      ansible.builtin.command:
        argv:
          - ufw
          - status
      changed_when: false
      register: ufw_status_check

    - name: Assert firewall allows required TCP ports
      ansible.builtin.assert:
        that:
          - ufw_status_check['stdout'] is search('22/tcp')
          - ufw_status_check['stdout'] is search('80/tcp')
          - ufw_status_check['stdout'] is search('443/tcp')
        fail_msg: "The required firewall TCP rules are not present."

    - name: Check required listening ports
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listener_port }}"
        state: started
        timeout: 5
      loop:
        - 22
        - 80
        - 443
      loop_control:
        loop_var: item_listener_port

    - name: Inspect nginx configuration dump
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      changed_when: false
      register: nginx_dump

    - name: Assert virtual hosts and listeners are present in nginx configuration
      ansible.builtin.assert:
        that:
          - nginx_dump['stdout'] is search('test\\.cluster\\.local')
          - nginx_dump['stdout'] is search('ci\\.cluster\\.local')
          - nginx_dump['stdout'] is search('status\\.cluster\\.local')
          - nginx_dump['stdout'] is search('listen 80')
          - nginx_dump['stdout'] is search('listen 443')
        fail_msg: "The expected virtual hosts or listeners are not in the nginx configuration."

    - name: Check default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site_check

    - name: Assert default nginx site is absent
      ansible.builtin.assert:
        that:
          - not default_site_check['stat']['exists']
        fail_msg: "The default nginx site is still present."
