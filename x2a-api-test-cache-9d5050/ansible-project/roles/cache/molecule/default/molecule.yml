driver:
  name: default
platforms:
- name: molecule-test-instance
  groups:
  - all
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../
  inventory:
    hosts:
      all:
        hosts:
          molecule-test-instance:
            ansible_connection: local
            redis_password: redis_secure_password_123
verifier:
  name: ansible
