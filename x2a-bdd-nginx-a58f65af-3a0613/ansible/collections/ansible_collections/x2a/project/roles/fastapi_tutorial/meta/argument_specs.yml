---
argument_specs:
  main:
    short_description: Install and configure the FastAPI Tutorial application
    description:
      - Deploys the FastAPI Tutorial application, its Python dependencies, PostgreSQL database, and systemd service.
    options:
      fastapi_tutorial_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application installation directory.
      fastapi_tutorial_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_tutorial_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_tutorial_virtualenv_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial/venv
        description: Python virtual environment path.
      fastapi_tutorial_app_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by the FastAPI service.
      fastapi_tutorial_app_host:
        type: str
        required: false
        default: 0.0.0.0
        description: Bind address used by Uvicorn.
      fastapi_tutorial_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_tutorial_database_user:
        type: str
        required: false
        default: fastapi
        description: Default PostgreSQL application user.
      fastapi_tutorial_database_name:
        type: str
        required: false
        default: fastapi_db
        description: Default PostgreSQL database name.
      fastapi_tutorial_database_host:
        type: str
        required: false
        default: localhost
        description: Default PostgreSQL host.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Application project name written to the environment file.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: Application API version written to the environment file.
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide database credential handling task output.
      database_user:
        type: str
        required: true
        description: PostgreSQL user injected by the AAP credential type.
      database_password:
        type: str
        required: true
        description: PostgreSQL password injected by the AAP credential type.
      database_name:
        type: str
        required: true
        description: PostgreSQL database name injected by the AAP credential type.
      database_host:
        type: str
        required: true
        description: PostgreSQL host injected by the AAP credential type.
