---
controller_credential_types:
  - name: PostgreSQL Database Credentials
    description: Credentials for the FastAPI application's local PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: database_user
          type: string
          label: Database User
          help_text: PostgreSQL role used by the FastAPI application.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; store in Ansible Vault or an external secret manager.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL database connection.
      required:
        - database_user
        - database_password
        - database_name
        - database_host
    injectors:
      extra_vars:
        database_user: !unsafe "{{ database_user }}"
        database_password: !unsafe "{{ database_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
