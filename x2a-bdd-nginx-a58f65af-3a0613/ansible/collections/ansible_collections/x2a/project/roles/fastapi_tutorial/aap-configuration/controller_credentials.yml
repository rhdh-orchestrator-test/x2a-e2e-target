---
controller_credentials:
  - name: PostgreSQL Database Credentials - fastapi_tutorial
    description: Credentials for the FastAPI application's local PostgreSQL database.
    organization: Default
    credential_type: PostgreSQL Database Credentials
    update_secrets: true
    inputs:
      database_user: "{{ database_user }}"
      database_password: "{{ vault_database_password }}"
      database_name: "{{ database_name }}"
      database_host: "{{ database_host }}"
