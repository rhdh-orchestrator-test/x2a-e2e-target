---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Reload nginx multisite sysctl
  ansible.builtin.command:
    cmd: sysctl -p /etc/sysctl.d/99-security.conf
  changed_when: true

- name: Restart SSH
  ansible.builtin.service:
    name: ssh
    state: restarted
