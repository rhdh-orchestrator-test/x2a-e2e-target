---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis instance on port 6379; currently hardcoded in a Chef node attribute and intended for 
      migration to protected Ansible Vault storage.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password configured as Redis requirepass for authenticating clients to the Redis service.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
