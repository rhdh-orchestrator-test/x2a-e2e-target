---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
    state: present

- name: Load OS-specific service names
  ansible.builtin.set_fact:
    nginx_multisite_ssh_service: "{{ 'sshd' if ansible_facts['os_family'] == 'RedHat' else 'ssh' }}"

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: security['fail2ban']['enabled']

- name: Deploy fail2ban jail configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: security['fail2ban']['enabled']
  notify: Restart fail2ban

- name: Set UFW default incoming policy
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  when: security['ufw']['enabled']
  changed_when: "'Default incoming policy changed' in nginx_multisite_ufw_default.stdout"
  register: nginx_multisite_ufw_default

- name: Allow required UFW ports  # noqa: R101 - command uses a fixed role-defined port loop, not untrusted input
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - "{{ item_nginx_multisite_port }}"
  when: security['ufw']['enabled']
  changed_when: "'Rule added' in nginx_multisite_ufw_allow.stdout"
  loop:
    - 22/tcp
    - 80/tcp
    - 443/tcp
  loop_control:
    loop_var: item_nginx_multisite_port
  register: nginx_multisite_ufw_allow

- name: Enable UFW non-interactively
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - enable
  when: security['ufw']['enabled']
  changed_when: "'Firewall is active' in nginx_multisite_ufw_enable.stdout"
  register: nginx_multisite_ufw_enable

- name: Deploy sysctl security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Apply sysctl security settings

- name: Check SSH daemon configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable root SSH login  # noqa: L039 - variable is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin\s+
    line: PermitRootLogin no
    backup: true
    create: false
  when:
    - security['ssh']['disable_root']
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart SSH service

- name: Disable SSH password authentication  # noqa: L039 - variable is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication\s+
    line: PasswordAuthentication no
    backup: true
    create: false
  when:
    - not security['ssh']['password_auth']
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart SSH service
