---
- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Apply sysctl security settings
  ansible.builtin.command:
    cmd: sysctl -p /etc/sysctl.d/99-security.conf
  changed_when: true

- name: Restart SSH service
  ansible.builtin.service:
    name: "{{ nginx_multisite_ssh_service }}"
    state: restarted
