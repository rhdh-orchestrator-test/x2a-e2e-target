---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx['ssl']['certificate_path'] }}" # noqa: R114 - path from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx['ssl']['private_key_path'] }}" # noqa: R114 - path from role defaults
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Check existing site certificates
  ansible.builtin.stat:
    path: "{{ nginx['ssl']['certificate_path'] }}/{{ item_nginx_multisite_ssl['key'] }}.crt" # noqa: R114 - filename from role-defined sites
  loop: "{{ nginx['sites'] | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_ssl
  register: nginx_multisite_certificates

- name: Check existing site private keys
  ansible.builtin.stat:
    path: "{{ nginx['ssl']['private_key_path'] }}/{{ item_nginx_multisite_key['key'] }}.key" # noqa: R114 - filename from role-defined sites
  loop: "{{ nginx['sites'] | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_key
  register: nginx_multisite_keys

- name: Generate self-signed site certificates  # noqa: L039 - variables are registered by the preceding stat tasks
  ansible.builtin.command:  # noqa: R101 - paths and subject use role defaults and role-defined sites
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx['ssl']['private_key_path'] }}/{{ item_nginx_multisite_cert['key'] }}.key"
      - -out
      - "{{ nginx['ssl']['certificate_path'] }}/{{ item_nginx_multisite_cert['key'] }}.crt"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_multisite_cert['key'] }}/emailAddress=admin@example.com
  when:
    - item_nginx_multisite_cert['value']['ssl_enabled']
    - >-
      not nginx_multisite_certificates.results[ansible_loop.index0]['stat']['exists'] or
      not nginx_multisite_keys.results[ansible_loop.index0]['stat']['exists']
  loop: "{{ nginx['sites'] | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_cert
  changed_when: true
  notify: Reload nginx

- name: Set private key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx['ssl']['private_key_path'] }}/{{ item_nginx_multisite_key_mode['key'] }}.key" # noqa: R114 - filename from role-defined sites
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  when: item_nginx_multisite_key_mode['value']['ssl_enabled']
  loop: "{{ nginx['sites'] | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_key_mode
