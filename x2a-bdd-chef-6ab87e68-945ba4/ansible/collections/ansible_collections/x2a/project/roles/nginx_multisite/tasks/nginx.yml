---
- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Determine nginx service user
  ansible.builtin.set_fact:
    nginx_multisite_web_user: "{{ 'nginx' if ansible_facts['os_family'] == 'RedHat' else 'www-data' }}"

- name: Deploy nginx base configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Deploy nginx security configuration
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Create site document roots
  ansible.builtin.file:
    path: "{{ item_nginx_multisite_site['value']['document_root'] }}" # noqa: R114 - path from role-defined sites dictionary
    state: directory
    owner: "{{ nginx_multisite_web_user }}"
    group: "{{ nginx_multisite_web_user }}"
    mode: "0755"
    recurse: true
  loop: "{{ nginx['sites'] | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site

- name: Deploy static site index files
  ansible.builtin.copy:
    src: "{{ item_nginx_multisite_file['key'].split('.')[0] }}/index.html"
    dest: "{{ item_nginx_multisite_file['value']['document_root'] }}/index.html" # noqa: R114 - destination from role-defined sites dictionary
    owner: "{{ nginx_multisite_web_user }}"
    group: "{{ nginx_multisite_web_user }}"
    mode: "0644"
    backup: true
  loop: "{{ nginx['sites'] | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_file
  notify: Reload nginx
