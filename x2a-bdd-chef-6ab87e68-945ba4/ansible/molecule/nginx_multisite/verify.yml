# Unsupported pre-flight checks: curl response-header diagnostics, configuration-content grep output,
# certificate/key permission reporting, and the unfiltered `ufw status verbose` diagnostic have no
# stated expected result beyond the command itself.
---
- name: Verify nginx_multisite pre-flight checks
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        fail_msg: "A required package is not installed."
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify nginx is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services'].get('nginx.service', {}).get('status') == 'enabled'
          - ansible_facts['services'].get('nginx.service', {}).get('state') == 'running'
        fail_msg: "The nginx service is not enabled and running."

    - name: Verify fail2ban is enabled and active
      ansible.builtin.assert:
        that:
          - ansible_facts['services'].get('fail2ban.service', {}).get('status') == 'enabled'
          - ansible_facts['services'].get('fail2ban.service', {}).get('state') == 'running'
        fail_msg: "The fail2ban service is not enabled and running."

    - name: Verify SSH service is active
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts['services'].get('sshd.service', {}).get('state') == 'running'
            or ansible_facts['services'].get('ssh.service', {}).get('state') == 'running'
        fail_msg: "Neither sshd nor ssh is active."

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
        chdir: /
      register: item_nginx_validation
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - item_nginx_validation['rc'] == 0
        fail_msg: "nginx configuration validation failed."

    - name: Validate SSH daemon configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
        chdir: /
      register: item_sshd_validation
      changed_when: false

    - name: Assert SSH daemon configuration is valid
      ansible.builtin.assert:
        that:
          - item_sshd_validation['rc'] == 0
        fail_msg: "SSH daemon configuration validation failed."

    - name: Validate security sysctl configuration
      ansible.builtin.command:
        argv:
          - sysctl
          - -p
          - /etc/sysctl.d/99-security.conf
        chdir: /
      register: item_sysctl_validation
      changed_when: false

    - name: Assert security sysctl configuration is valid
      ansible.builtin.assert:
        that:
          - item_sysctl_validation['rc'] == 0
        fail_msg: "Security sysctl configuration validation failed."

    - name: Check required directories, files, and links
      ansible.builtin.stat:
        path: "{{ item_path['path'] }}"
        follow: false
      register: item_path_checks
      loop:
        - path: /etc/nginx/sites-available
          kind: directory
        - path: /etc/nginx/sites-enabled
          kind: directory
        - path: /etc/fail2ban/jail.local
          kind: file
        - path: /etc/sysctl.d/99-security.conf
          kind: file
        - path: /etc/ssh/sshd_config
          kind: file
        - path: /opt/server/test
          kind: directory
        - path: /opt/server/test/index.html
          kind: file
        - path: /etc/nginx/sites-available/test.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/test.cluster.local
          kind: link
        - path: /etc/ssl/certs/test.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/test.cluster.local.key
          kind: file
        - path: /opt/server/ci
          kind: directory
        - path: /opt/server/ci/index.html
          kind: file
        - path: /etc/nginx/sites-available/ci.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          kind: link
        - path: /etc/ssl/certs/ci.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/ci.cluster.local.key
          kind: file
        - path: /opt/server/status
          kind: directory
        - path: /opt/server/status/index.html
          kind: file
        - path: /etc/nginx/sites-available/status.cluster.local
          kind: file
        - path: /etc/nginx/sites-enabled/status.cluster.local
          kind: link
        - path: /etc/ssl/certs/status.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/status.cluster.local.key
          kind: file
      loop_control:
        loop_var: item_path

    - name: Assert required directories, files, and links exist
      ansible.builtin.assert:
        that:
          - item_path_check['stat']['exists']
          - >-
            (item_path_check['item']['kind'] == 'directory' and item_path_check['stat']['isdir'])
            or (item_path_check['item']['kind'] == 'file' and item_path_check['stat']['isreg'])
            or (item_path_check['item']['kind'] == 'link' and item_path_check['stat']['islnk'])
        fail_msg: "A required path is missing or has the wrong type."
      loop: "{{ item_path_checks['results'] }}"
      loop_control:
        loop_var: item_path_check

    - name: Check that the default nginx site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
        follow: false
      register: item_default_site

    - name: Assert that the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_site['stat']['exists']
        fail_msg: "The default nginx site is present."

    - name: Check firewall status
      ansible.builtin.command:
        argv:
          - ufw
          - status
        chdir: /
      register: item_ufw_status
      changed_when: false

    - name: Assert required firewall ports are listed
      ansible.builtin.assert:
        that:
          - item_ufw_status['stdout'] is regex('(?m)22/tcp')
          - item_ufw_status['stdout'] is regex('(?m)80/tcp')
          - item_ufw_status['stdout'] is regex('(?m)443/tcp')
        fail_msg: "One or more required firewall ports are not listed."
