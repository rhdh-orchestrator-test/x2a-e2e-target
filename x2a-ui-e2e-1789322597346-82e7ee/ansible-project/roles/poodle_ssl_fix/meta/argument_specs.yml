---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache
    description:
      - Configures Apache SSL settings to disable vulnerable SSL protocols
      - Replaces SSLProtocol directive to use only TLSv1.2
      - Addresses POODLE (Padding Oracle On Downgraded Legacy Encryption) vulnerability
    options:
      apache_ssl_config_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file
      ssl_protocol_setting:
        type: str
        required: false
        default: SSLProtocol -all +TLSv1.2
        description: SSL protocol configuration string to fix POODLE vulnerability
