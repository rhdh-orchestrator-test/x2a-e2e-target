- name: Check if chef-server-ctl exists
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl_check
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} {{ full_name }} {{ email }} {{ password }} --filename {{ user_key_filename }}
  become: true
  args:
    creates: '{{ user_key_filename }}'
  register: create_user
  changed_when: create_user.rc == 0
  no_log: true
  when: chef_server_ctl_check.stat.exists
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ orgname }} "{{ longorgname }}" --association_user {{ username }} --filename {{ org_validator_filename }}
  become: true
  args:
    creates: '{{ org_validator_filename }}'
  register: create_org
  changed_when: create_org.rc == 0
  when: chef_server_ctl_check.stat.exists
