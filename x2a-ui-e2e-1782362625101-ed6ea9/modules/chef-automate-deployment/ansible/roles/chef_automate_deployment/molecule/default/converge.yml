---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for system configuration
    - name: Create expected directories for system configuration
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/sysctl.d
        - /tmp/molecule_test/usr/bin

    # Mock hostname file
    - name: Create mock hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Mock sysctl settings
    - name: Create mock sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Mock Chef Automate CLI binary
    - name: Create mock Chef Automate CLI binary
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/usr/bin/chef-automate"
        mode: "0755"

    # Mock Chef Server CLI binary
    - name: Create mock Chef Server CLI binary
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Server CLI mock'\n"
        dest: "/tmp/molecule_test/usr/bin/chef-server-ctl"
        mode: "0755"

    # Mock Chef Automate config file
    - name: Create mock Chef Automate config file
      ansible.builtin.copy:
        content: |
          [global]
          hostname = "automate.chef.lab"
          
          [automate]
          enabled = true
          
          [infra_server]
          enabled = true
        dest: "/tmp/molecule_test/etc/chef-automate/config.toml"
        mode: "0644"

    # Mock user key file
    - name: Create mock user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/jtonello.pem"
        mode: "0600"

    # Mock organization validator key file
    - name: Create mock organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORGANIZATION VALIDATOR KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/lab-validator.pem"
        mode: "0600"