---
controller_credential_types:
  - name: Redis Cache Authentication
    description: Password used to authenticate clients to the Redis cache instance on port 6379. The migration plan reports this credential as a hardcoded value
      that requires recipe-level verification.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password configured for Redis requirepass authentication; store it in Ansible Vault or an approved secret manager and prevent it from 
            appearing in task output.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
