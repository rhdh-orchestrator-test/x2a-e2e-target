---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true
- name: Install Apache
  ansible.builtin.apt:
    name: apache2={{ apache_version }}
    state: present
  become: true
- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl
      - openssl
      - python3-openssl
    state: present
  become: true
