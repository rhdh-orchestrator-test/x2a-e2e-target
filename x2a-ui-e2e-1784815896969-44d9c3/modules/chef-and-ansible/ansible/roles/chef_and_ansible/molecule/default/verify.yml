---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Verify Apache configuration
    - name: Check if Apache virtual host config exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      register: vhost_config

    - name: Assert virtual host config exists
      ansible.builtin.assert:
        that:
          - vhost_config.stat.exists
          - vhost_config.stat.size > 0
        fail_msg: "Apache virtual host config not found"
        success_msg: "Apache virtual host config exists"

    # Verify SSL certificates
    - name: Check if SSL certificates exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: ssl_files
      loop:
        - /tmp/molecule_test/etc/apache2/certs/apache.key
        - /tmp/molecule_test/etc/apache2/certs/apache.csr
        - /tmp/molecule_test/etc/apache2/certs/apache.crt

    - name: Assert SSL certificates exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "SSL certificate file not found"
        success_msg: "SSL certificate file exists"
      loop: "{{ ssl_files.results }}"

    # Verify website content
    - name: Check if index.html exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/www/helloworld/index.html
      register: index_html

    - name: Assert index.html exists
      ansible.builtin.assert:
        that:
          - index_html.stat.exists
          - index_html.stat.size > 0
        fail_msg: "Website index.html not found"
        success_msg: "Website index.html exists"

    # Verify POODLE fix
    - name: Get SSL config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_conf

    - name: Assert POODLE fix is applied
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in ssl_conf.content | b64decode"
        fail_msg: "POODLE vulnerability fix not found in SSL config"
        success_msg: "POODLE vulnerability fix confirmed in SSL config"

    # Verify site is enabled
    - name: Check if site is enabled
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
      register: enabled_site

    - name: Assert site is enabled
      ansible.builtin.assert:
        that:
          - enabled_site.stat.exists
          - enabled_site.stat.islnk
        fail_msg: "Site is not enabled"
        success_msg: "Site is properly enabled"

    # Verify SSL module is enabled
    - name: Check if SSL module is enabled
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.conf
      register: enabled_ssl

    - name: Assert SSL module is enabled
      ansible.builtin.assert:
        that:
          - enabled_ssl.stat.exists
          - enabled_ssl.stat.islnk
        fail_msg: "SSL module is not enabled"
        success_msg: "SSL module is properly enabled"

    # The following tests would run on a real system but can't run in the container
    # They are tagged with molecule-notest so they'll be skipped during molecule testing

    - name: Check Apache service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Check HTTPS connectivity
      ansible.builtin.uri:
        url: https://localhost/
        validate_certs: false
        return_content: true
      register: https_response
      tags: molecule-notest

    - name: Assert HTTPS site is accessible
      ansible.builtin.assert:
        that:
          - https_response.status == 200
          - "'Hello, world!' in https_response.content"
        fail_msg: "HTTPS site is not accessible"
        success_msg: "HTTPS site is accessible"
      tags: molecule-notest

    - name: Check SSL protocols (POODLE fix verification)
      ansible.builtin.command:
        cmd: nmap --script ssl-enum-ciphers -p 443 localhost
      register: nmap_result
      changed_when: false
      tags: molecule-notest

    - name: Assert only TLSv1.2 is enabled
      ansible.builtin.assert:
        that:
          - "'TLSv1.0' not in nmap_result.stdout"
          - "'TLSv1.1' not in nmap_result.stdout"
          - "'SSLv3' not in nmap_result.stdout"
          - "'TLSv1.2' in nmap_result.stdout"
        fail_msg: "SSL protocol configuration is incorrect"
        success_msg: "SSL protocol configuration is correct"
      tags: molecule-notest