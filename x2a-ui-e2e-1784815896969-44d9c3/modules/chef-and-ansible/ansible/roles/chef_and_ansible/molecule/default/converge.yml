---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/apache2/sites-available
        - /tmp/molecule_test/etc/apache2/mods-available
        - /tmp/molecule_test/etc/apache2/certs
        - /tmp/molecule_test/var/www/helloworld

    # Create SSL certificates
    - name: Create mock SSL certificates
      ansible.builtin.copy:
        content: "# Mock SSL certificate content"
        dest: "{{ item }}"
        mode: "0640"
      loop:
        - /tmp/molecule_test/etc/apache2/certs/apache.key
        - /tmp/molecule_test/etc/apache2/certs/apache.csr
        - /tmp/molecule_test/etc/apache2/certs/apache.crt

    # Create virtual host config
    - name: Create virtual host config
      ansible.builtin.copy:
        content: |
          <VirtualHost *:443>
           DocumentRoot "/var/www/helloworld"
           SSLEngine on
           SSLCertificateFile /etc/apache2/certs/apache.crt
           SSLCertificateKeyFile /etc/apache2/certs/apache.key
            <Directory "/var/www/helloworld">
              allow from all
              Options None
              Require all granted
            </Directory>
          </VirtualHost>
        dest: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
        mode: "0640"

    # Create index.html
    - name: Create index.html
      ansible.builtin.copy:
        content: |
          <html>
            <head><title>Test Site</title></head>
            <body>
             <h1>Hello, world!</h1>
             <p>The site is up and running</p>
            </body>
          </html>
        dest: /tmp/molecule_test/var/www/helloworld/index.html
        mode: "0644"

    # Create SSL config with POODLE fix
    - name: Create SSL config with POODLE fix
      ansible.builtin.copy:
        content: |
          # Mock SSL config file
          SSLProtocol -all +TLSv1.2
        dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
        mode: "0644"

    # Create symlinks to simulate a2ensite and a2enmod
    - name: Create sites-enabled directory
      ansible.builtin.file:
        path: /tmp/molecule_test/etc/apache2/sites-enabled
        state: directory
        mode: "0755"

    - name: Create mods-enabled directory
      ansible.builtin.file:
        path: /tmp/molecule_test/etc/apache2/mods-enabled
        state: directory
        mode: "0755"

    - name: Create symlink for enabled site
      ansible.builtin.file:
        src: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
        dest: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
        state: link

    - name: Create symlink for enabled SSL module
      ansible.builtin.file:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
        dest: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.conf
        state: link