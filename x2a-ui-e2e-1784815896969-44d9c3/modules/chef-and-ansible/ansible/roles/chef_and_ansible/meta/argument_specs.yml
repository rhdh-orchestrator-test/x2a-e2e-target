---
argument_specs:
  main:
    short_description: Apache web server with HTTPS support and security hardening
    description:
      - This role installs and configures Apache web server with HTTPS support
      - Sets up a virtual host for a "Hello World" website
      - Implements security hardening (POODLE vulnerability fix)
    options:
      apache_version:
        type: str
        default: 2.4.41-4ubuntu3.10
        description: Apache version to install
      website_root:
        type: str
        default: /var/www/helloworld
        description: Document root for the website
      ssl_cert_path:
        type: str
        default: /etc/apache2/certs
        description: Path for SSL certificates
      ssl_protocols:
        type: str
        default: -all +TLSv1.2
        description: SSL protocols to enable/disable
