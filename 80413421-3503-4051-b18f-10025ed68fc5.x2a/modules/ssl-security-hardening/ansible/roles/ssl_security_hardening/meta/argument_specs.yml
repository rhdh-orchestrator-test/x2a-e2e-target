---
argument_specs:
  main:
    short_description: SSL security hardening role to fix POODLE vulnerability
    description:
      - Configures Apache SSL settings to prevent POODLE vulnerability by enforcing TLSv1.2 only
      - Modifies Apache SSL configuration and restarts necessary services
    options:
      ssl_config_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file to modify
      ssl_protocol_config:
        type: str
        required: false
        default: SSLProtocol -all +TLSv1.2
        description: SSL protocol configuration string to replace existing SSLProtocol directive
      restart_services:
        type: list
        elements: str
        required: false
        default:
          - apache2
          - sshd
        description: List of services to restart after SSL configuration changes
      ssl_security_hardening_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to enable secure logging for sensitive operations
