---
- name: Restart apache2
  ansible.builtin.service:
    name: apache2
    state: restarted
  when: ansible_facts['services']['apache2'] is defined

- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
  when: ansible_facts['services']['sshd'] is defined or ansible_facts['services']['ssh'] is defined
