---
controller_credentials:
- name: Chef Server Credentials - poodle_fix
  description: Credentials used for Chef Server deployment
  organization: Default
  credential_type: Chef Server Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: SSL Certificate - poodle_fix
  description: Self-signed SSL certificates for Apache web server
  organization: Default
  credential_type: SSL Certificate
  update_secrets: true
  inputs:
    certificate: '{{ vault_certificate }}'
    private_key: '{{ vault_private_key }}'
