---
controller_credential_types:
- name: Chef Server Credentials
  description: Credentials used for Chef Server deployment
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Server authentication
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Server authentication
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: SSL Certificate
  description: Self-signed SSL certificates for Apache web server
  kind: cloud
  inputs:
    fields:
    - id: certificate
      type: string
      label: SSL Certificate
      secret: true
      help_text: SSL certificate content for Apache HTTPS
    - id: private_key
      type: string
      label: Private Key
      secret: true
      help_text: Private key for SSL certificate
    required:
    - certificate
    - private_key
  injectors:
    extra_vars:
      certificate: !unsafe '{{ certificate }}'
      private_key: !unsafe '{{ private_key }}'
