---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: apache2
    state: present
- name: Ensure Apache SSL module is enabled
  ansible.builtin.command: a2enmod ssl
  args:
    creates: /etc/apache2/mods-enabled/ssl.load
  notify:
    - Restart apache2
- name: Fix SSL in Apache
  ansible.builtin.replace:
    path: /etc/apache2/mods-available/ssl.conf
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol -all +TLSv1.2
    mode: "0644"
  notify:
    - Restart apache2
