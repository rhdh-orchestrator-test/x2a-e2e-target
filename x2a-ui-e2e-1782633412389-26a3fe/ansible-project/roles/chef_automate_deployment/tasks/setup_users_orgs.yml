---
- name: Check if Chef user already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_actual_user_key_file }}"
  register: user_key_file_stat
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_actual_username }} {{ chef_automate_actual_full_name }} {{ chef_automate_actual_email }} "{{
      chef_automate_actual_password }}" --filename {{ chef_automate_actual_user_key_file }}
  become: true
  register: create_user
  changed_when: create_user.rc == 0
  failed_when: create_user.rc != 0 and "already exists" not in create_user.stderr
  when: not user_key_file_stat.stat.exists
- name: Check if Chef organization already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_actual_org_validator_key_file }}"
  register: org_validator_key_file_stat
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_actual_org_name }} "{{ chef_automate_actual_org_full_name }}" --association_user {{
      chef_automate_actual_username }} --filename {{ chef_automate_actual_org_validator_key_file }}
  become: true
  register: create_org
  changed_when: create_org.rc == 0
  failed_when: create_org.rc != 0 and "already exists" not in create_org.stderr
  when: not org_validator_key_file_stat.stat.exists
