---
controller_credential_types:
- name: Chef User Credentials
  description: Credential type for Chef User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for the initial Chef user account
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the initial Chef user account
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name for the Chef user
    - id: email
      type: string
      label: Email
      help_text: Email address for the Chef user
    required:
    - username
    - password
    - full_name
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
- name: Chef Organization Configuration
  description: Credential type for Chef Organization Configuration
  kind: cloud
  inputs:
    fields:
    - id: org_short_name
      type: string
      label: Organization Short Name
      help_text: Short name identifier for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name for the Chef organization
    required:
    - org_short_name
    - org_full_name
  injectors:
    extra_vars:
      org_short_name: !unsafe '{{ org_short_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
- name: SSL Certificates
  description: Credential type for SSL Certificates
  kind: cloud
  inputs:
    fields:
    - id: user_key_file
      type: string
      label: User Key File
      secret: true
      help_text: PEM file containing the Chef user's private key
    - id: org_validator_key_file
      type: string
      label: Organization Validator Key File
      secret: true
      help_text: PEM file containing the organization validator key
    required:
    - user_key_file
    - org_validator_key_file
  injectors:
    extra_vars:
      user_key_file: !unsafe '{{ user_key_file }}'
      org_validator_key_file: !unsafe '{{ org_validator_key_file }}'
