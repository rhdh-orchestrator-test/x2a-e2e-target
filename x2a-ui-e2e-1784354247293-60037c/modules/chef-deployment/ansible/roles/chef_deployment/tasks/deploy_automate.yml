---
- name: Ensure gzip is installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}"
    mode: "0755"
  register: download_result
- name: Extract Chef Automate CLI if compressed
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_path }} && chmod +x {{ chef_automate_cli_path }}
  args:
    stdin: "{{ download_result.content | default('') }}"
    creates: "{{ chef_automate_cli_path }}"
  when: chef_automate_cli_url is search('\.zip$')
  changed_when: false
- name: Deploy Chef Automate with Chef Infra Server
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_accept_terms_and_mlsa | lower }} "
  args:
    chdir: "{{ chef_automate_cli_path | dirname }}"
    creates: /etc/chef-automate/config.toml
  become: true
  register: deploy_result
  changed_when: deploy_result.rc == 0
- name: Ensure directory exists for PEM files
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path | dirname }}"
    state: directory
    mode: "0755"
  when: chef_automate_cli_path is defined
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_user_pem_filename }}

      '
  args:
    chdir: "{{ chef_automate_cli_path | dirname }}"
    creates: "{{ chef_user_pem_filename }}"
  become: true
  register: user_result
  changed_when: user_result.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}" --association_user {{ username }} --filename {{ chef_org_validator_filename }}

      '
  args:
    chdir: "{{ chef_automate_cli_path | dirname }}"
    creates: "{{ chef_org_validator_filename }}"
  become: true
  register: org_result
  changed_when: org_result.rc == 0
