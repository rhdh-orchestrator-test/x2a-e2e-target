---
- name: Enable the requested Redis DNF module stream
  ansible.builtin.include_tasks: dnfmodule.yml

- name: Install Redis package
  ansible.builtin.include_tasks: package.yml

- name: Configure Redis directories and defaults
  ansible.builtin.include_tasks: config.yml

- name: Configure Redis instance
  ansible.builtin.include_tasks: instance.yml

- name: Remove legacy Redis ulimit drop-ins
  ansible.builtin.include_tasks: ulimit.yml

- name: Manage Redis service
  ansible.builtin.include_tasks: service.yml
