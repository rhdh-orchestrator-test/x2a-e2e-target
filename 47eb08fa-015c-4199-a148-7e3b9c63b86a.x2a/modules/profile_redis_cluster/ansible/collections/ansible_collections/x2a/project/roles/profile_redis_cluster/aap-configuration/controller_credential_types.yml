---
controller_credential_types:
  - name: Redis Database Authentication
    description: Authentication credential for the default Redis instance; the current password is a plaintext Hiera value and must be migrated securely.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis clients to authenticate to the default instance.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
