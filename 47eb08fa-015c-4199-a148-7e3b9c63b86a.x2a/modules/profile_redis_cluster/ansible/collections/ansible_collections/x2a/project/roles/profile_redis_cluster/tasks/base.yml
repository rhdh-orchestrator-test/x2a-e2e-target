---
- name: Install base time synchronization package
  ansible.builtin.package:
    name: chrony
    state: present
  when: ansible_facts['system'] == 'Linux' and (redis_cluster_manage_ntp | default(true)) # noqa: L039 - variable is a documented role argument with a default

- name: Ensure time synchronization service is enabled and running
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true
  when: ansible_facts['system'] == 'Linux' and (redis_cluster_manage_ntp | default(true)) # noqa: L039 - variable is a documented role argument with a default

- name: Install base syslog package
  ansible.builtin.package:
    name: rsyslog
    state: present
  when: ansible_facts['system'] == 'Linux' and (redis_cluster_manage_syslog | default(true)) # noqa: L039 - variable is a documented role argument with a default

- name: Ensure syslog service is enabled and running
  ansible.builtin.service:
    name: rsyslog
    state: started
    enabled: true
  when: ansible_facts['system'] == 'Linux' and (redis_cluster_manage_syslog | default(true)) # noqa: L039 - variable is a documented role argument with a default
