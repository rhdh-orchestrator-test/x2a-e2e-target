---
# Redis cluster profile defaults.
redis_cluster_redis_port: 6379
redis_cluster_redis_password: "{{ redis_password }}"
redis_cluster_maxmemory_mb: 256
redis_cluster_maxmemory_policy: allkeys-lru
redis_cluster_bind: 0.0.0.0
redis_cluster_appendonly: true
redis_cluster_appendfsync: everysec
redis_cluster_manage_package: true
redis_cluster_default_install: true
redis_cluster_instances: []
redis_cluster_manage_repo: false
redis_cluster_config_file_mode: "0640"
redis_cluster_service_manage: true
redis_cluster_service_ensure: running
redis_cluster_service_enable: true
redis_cluster_service_user: redis
redis_cluster_service_group: redis
redis_cluster_notify_service: true
redis_cluster_ulimit_managed: true
redis_cluster_managed_by_cluster_manager: false
redis_cluster_manage_service_file: false
redis_cluster_cluster_enabled: false
redis_cluster_secure_logging: true
