- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check if Apache is simulated as installed
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/sbin/apache2
    register: apache_installed
  - name: Assert Apache is simulated as installed
    ansible.builtin.assert:
      that:
      - apache_installed.stat.exists
      fail_msg: Apache installation simulation not found
      success_msg: Apache installation simulation found
  - name: Check if SSH server is simulated as installed
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/sbin/sshd
    register: sshd_installed
  - name: Assert SSH server is simulated as installed
    ansible.builtin.assert:
      that:
      - sshd_installed.stat.exists
      fail_msg: SSH server installation simulation not found
      success_msg: SSH server installation simulation found
  - name: Check if Apache SSL module is simulated as enabled
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.load
    register: ssl_module_enabled
  - name: Assert Apache SSL module is simulated as enabled
    ansible.builtin.assert:
      that:
      - ssl_module_enabled.stat.exists
      fail_msg: Apache SSL module enabling simulation not found
      success_msg: Apache SSL module enabling simulation found
  - name: Check if Apache SSL config file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_conf
  - name: Assert SSL config file exists
    ansible.builtin.assert:
      that:
      - ssl_conf.stat.exists
      - ssl_conf.stat.isreg
      fail_msg: Apache SSL config file not found
      success_msg: Apache SSL config file exists
  - name: Get SSL config file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_conf_content
    when: ssl_conf.stat.exists
  - name: Assert SSL protocol is properly configured (POODLE fix applied)
    ansible.builtin.assert:
      that:
      - ssl_conf_content['content'] | b64decode is regex('SSLProtocol -all \+TLSv1.2')
      fail_msg: POODLE fix not properly applied - SSLProtocol setting incorrect
      success_msg: POODLE fix correctly applied - SSLProtocol set to '-all +TLSv1.2'
    when: ssl_conf.stat.exists
  - name: Check if Apache service is running
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Apache service is active
    ansible.builtin.assert:
      that:
      - '''apache2.service'' in ansible_facts.services'
      - ansible_facts.services['apache2.service'].state == 'running'
      fail_msg: Apache service is not running
      success_msg: Apache service is running
    tags: molecule-notest
  - name: Check if SSH service is running
    ansible.builtin.assert:
      that:
      - '''sshd.service'' in ansible_facts.services'
      - ansible_facts.services['sshd.service'].state == 'running'
      fail_msg: SSH service is not running
      success_msg: SSH service is running
    tags: molecule-notest
  - name: Test TLS 1.2 connection
    ansible.builtin.command: openssl s_client -connect localhost:443 -tls1_2
    register: tls_test
    failed_when: false
    changed_when: false
    tags: molecule-notest
  - name: Assert TLS 1.2 connection works
    ansible.builtin.assert:
      that:
      - tls_test.rc == 0
      fail_msg: TLS 1.2 connection failed
      success_msg: TLS 1.2 connection successful
    tags: molecule-notest
  - name: Test SSLv3 connection (should fail for POODLE mitigation)
    ansible.builtin.command: openssl s_client -connect localhost:443 -ssl3
    register: ssl3_test
    failed_when: false
    changed_when: false
    tags: molecule-notest
  - name: Assert SSLv3 connection fails (POODLE mitigation)
    ansible.builtin.assert:
      that:
      - ssl3_test.rc != 0
      fail_msg: SSLv3 connection succeeded - POODLE vulnerability may still exist
      success_msg: SSLv3 connection failed - POODLE vulnerability mitigated
    tags: molecule-notest
