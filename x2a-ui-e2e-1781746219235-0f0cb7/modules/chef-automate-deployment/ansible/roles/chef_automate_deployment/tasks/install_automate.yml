---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate.zip
    mode: "0644"
  register: download_result
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip - > {{ chef_automate_cli_path }}
    stdin: "{{ download_result.dest }}"
    creates: "{{ chef_automate_cli_path }}"
  args:
    executable: /bin/bash
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Check if Chef Automate is already deployed
  ansible.builtin.stat:
    path: /etc/chef-automate/config.toml
  register: automate_config
  become: true
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{ chef_automate_accept_terms
      | lower }} "
  become: true
  when: chef_deployment_mode == 'automate_and_server' and not automate_config.stat.exists
  register: automate_deploy
  changed_when: automate_deploy.rc == 0
  failed_when: automate_deploy.rc != 0
- name: Check if Chef Infra Server is already deployed
  ansible.builtin.stat:
    path: /etc/chef-server/chef-server.rb
  register: server_config
  become: true
  when: chef_deployment_mode == 'server_only'
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }} "
  become: true
  when: chef_deployment_mode == 'server_only' and not server_config.stat.exists
  register: server_deploy
  changed_when: server_deploy.rc == 0
  failed_when: server_deploy.rc != 0
