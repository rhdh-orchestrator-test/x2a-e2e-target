---
- name: Ensure directory for key files exists
  ansible.builtin.file:
    path: "{{ item.path | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - path: "{{ chef_user_key_file }}"
    - path: "{{ chef_org_validator_key_file }}"
  become: true
  when: chef_user_key_file is defined and chef_org_validator_key_file is defined
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_user_name }} "{{ chef_user_full_name }}" {{ chef_user_email }} "{{ chef_user_password }}" --filename {{
      chef_user_key_file }}
  become: true
  register: create_user
  changed_when: create_user.rc == 0
  failed_when: create_user.rc != 0 and "already exists" not in create_user.stderr
  args:
    creates: "{{ chef_user_key_file }}"
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_full_name }}" --association_user {{ chef_user_name }} --filename {{
      chef_org_validator_key_file }}
  become: true
  register: create_org
  changed_when: create_org.rc == 0
  failed_when: create_org.rc != 0 and "already exists" not in create_org.stderr
  args:
    creates: "{{ chef_org_validator_key_file }}"
