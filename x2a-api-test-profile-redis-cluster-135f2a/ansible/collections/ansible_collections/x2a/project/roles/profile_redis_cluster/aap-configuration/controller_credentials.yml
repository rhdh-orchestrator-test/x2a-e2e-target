---
controller_credentials:
  - name: Redis Database Password - profile_redis_cluster
    description: Authentication password for the default Redis instance. The source plan reports a plaintext test value that must be moved to Ansible Vault or 
      an approved external secret manager.
    organization: Default
    credential_type: Redis Database Password
    update_secrets: true
    inputs:
      redis_password: "{{ vault_redis_password }}"
