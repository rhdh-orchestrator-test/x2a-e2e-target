---
controller_credential_types:
  - name: Redis Database Password
    description: Authentication password for the default Redis instance. The source plan reports a plaintext test value that must be moved to Ansible Vault or 
      an approved external secret manager.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis clients to authenticate to the default instance.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
