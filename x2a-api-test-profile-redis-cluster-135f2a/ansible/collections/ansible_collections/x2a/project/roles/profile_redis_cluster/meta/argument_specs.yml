---
argument_specs:
  main:
    short_description: Configure a standalone Redis service for the profile Redis cluster.
    description:
      - Installs and configures Redis through the eloy.redis.redis Private Hub role.
      - The Redis password is injected by an AAP credential type.
    options:
      profile_redis_cluster_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide tasks that handle the Redis password from job output.
      redis_cluster_port:
        type: int
        required: false
        default: 6379
        description: TCP port used by Redis.
      redis_cluster_password:
        type: str
        required: false
        default: "{{ redis_password }}"
        description: Redis password sourced from the AAP credential variable.
      redis_cluster_bind:
        type: list
        elements: str
        required: false
        default:
          - 0.0.0.0
        description: Bind addresses for Redis.
      redis_cluster_maxmemory:
        type: str
        required: false
        default: 256mb
        description: Maximum Redis memory limit.
      redis_cluster_maxmemory_policy:
        type: str
        required: false
        default: allkeys-lru
        description: Redis eviction policy.
      redis_cluster_appendonly:
        type: bool
        required: false
        default: true
        description: Enable append-only-file persistence.
      redis_cluster_appendfsync:
        type: str
        required: false
        default: everysec
        description: AOF fsync policy.
      redis_cluster_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Enable RDB persistence.
      redis_cluster_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Enable Redis Cluster mode.
      redis_cluster_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Enable Redis Sentinel mode.
      redis_cluster_replication_enabled:
        type: bool
        required: false
        default: false
        description: Enable Redis replication mode.
      redis_cluster_instances:
        type: dict
        required: false
        default: {}
        description: Optional named Redis instances.
