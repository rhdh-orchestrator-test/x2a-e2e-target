---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create SSL certificate group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create SSL certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}" # noqa: R114 - path is a role default for the system certificate directory
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create SSL private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}" # noqa: R114 - path is a role default for the system private-key directory
    owner: root
    group: ssl-cert
    mode: "0710"
    state: directory

- name: Check site SSL certificates
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
    index_var: ssl_site_index
  register: ssl_certificate_status

- name: Check site SSL private keys
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
    index_var: ssl_site_index
  register: ssl_key_status

- name: Generate self-signed site certificates when missing # noqa: L039,R101 - status variables are registered by the two prior stat tasks and command paths are role-default-controlled certificate paths
  ansible.builtin.shell:
    cmd: |
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        -keyout "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key" \
        -out "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt" \
        -subj "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl_site['key'] }}/emailAddress=admin@example.com"
      chmod 0640 "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key"
      chown root:ssl-cert "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key"
    executable: /bin/bash
  when:
    - item_ssl_site['value']['ssl_enabled']
    - not ssl_certificate_status.results[ssl_site_index].stat.exists or not ssl_key_status.results[ssl_site_index].stat.exists
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
    index_var: ssl_site_index
  notify: Reload nginx
