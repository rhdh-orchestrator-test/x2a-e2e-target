---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install required system packages # noqa: R113 - package list comes from role defaults, not untrusted input
  ansible.builtin.package:
    name: "{{ fastapi_tutorial_packages }}" # noqa: R113 - package list comes from role defaults, not untrusted input
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository # noqa: R104 - repository role default uses HTTPS, not HTTP
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R106 - repository source is a trusted role default
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - destination is a role default, not user input
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command arguments use trusted role-default paths
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_venv_dir }}"
    creates: "{{ fastapi_tutorial_venv_dir }}/bin/python" # noqa: R114 - path is a role default, not user input

- name: Install application dependencies # noqa: R113 - dependency requirements and virtualenv are role-defined paths
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - path is a role-defined application path
    virtualenv: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path is a role default, not user input
    virtualenv_command: python3 -m venv

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Check whether PostgreSQL role exists # noqa: L039 - db_username is supplied through validated role credentials; R108 - querying PostgreSQL as the postgres user requires privilege escalation
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}'; # noqa: R101 - query uses the validated role credential; L039 - db_username is supplied through validated role credentials
  changed_when: false
  register: fastapi_tutorial_role_check
  become: true # noqa: R108 - querying PostgreSQL as the postgres user requires privilege escalation
  become_user: postgres

- name: Create PostgreSQL role # noqa: L039 - credentials are supplied through validated role inputs and the check variable is registered above; R101 - command uses validated role credentials; no-changed-when - command runs only when the role is absent and creates it
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - CREATE USER {{ db_username }} WITH PASSWORD '{{ db_password }}'; # noqa: R101 - command uses validated role credentials; L039 - credentials are supplied through validated role inputs and the check variable is registered above
  when: fastapi_tutorial_role_check.stdout | trim != '1'
  become: true # noqa: R108 - creating a PostgreSQL role requires the postgres user
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether PostgreSQL database exists # noqa: L039 - database_name is supplied through validated role credentials; R108 - querying PostgreSQL as the postgres user requires privilege escalation
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'; # noqa: R101 - query uses the validated database credential; L039 - database_name is supplied through validated role credentials
  changed_when: false
  register: fastapi_tutorial_database_check
  become: true # noqa: R108 - querying PostgreSQL as the postgres user requires privilege escalation
  become_user: postgres

- name: Create PostgreSQL database # noqa: L039 - database credentials and the check variable are validated role inputs or registered above; R101 - command uses validated database credentials; no-changed-when - command runs only when the database is absent and creates it
  ansible.builtin.command:
    argv:
      - createdb
      - -O
      - "{{ db_username }}" # noqa: R101 - command uses validated database credentials; L039 - database credentials are validated role inputs
      - "{{ database_name }}" # noqa: R101 - command uses validated database credentials; L039 - database credentials are validated role inputs
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  become: true # noqa: R108 - creating a PostgreSQL database requires the postgres user
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant PostgreSQL database privileges # noqa: L039 - database credentials are supplied through validated role inputs; R101 - command uses validated database credentials; R108 - granting database privileges requires the postgres user
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ db_username }}; # noqa: R101 - command uses validated database credentials; L039 - database credentials are supplied through validated role inputs
  changed_when: false
  become: true # noqa: R108 - granting database privileges requires the postgres user
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy application environment file # noqa: L039 - database_url is supplied through validated role credentials
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_env_file }}" # noqa: R114 - path is a role default, not user input
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL={{ database_url }}
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy systemd service unit
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_service_file }}" # noqa: R114 - path is a role default, not user input
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      EnvironmentFile=-{{ fastapi_tutorial_env_file }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host {{ fastapi_tutorial_host }} --port {{ fastapi_tutorial_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload systemd
    - Restart FastAPI tutorial service after unit changes

- name: Enable and start FastAPI tutorial service
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
