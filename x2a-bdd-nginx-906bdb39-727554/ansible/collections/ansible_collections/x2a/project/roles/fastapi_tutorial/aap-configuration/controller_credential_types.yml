---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection configuration for the FastAPI application's local PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL role; currently hardcoded as fastapi_password.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL service, currently localhost.
        - id: database_url
          type: string
          label: Database Connection URL
          secret: true
          help_text: Application connection string for PostgreSQL; contains the embedded database password and should be constructed from protected fields.
      required:
        - db_username
        - db_password
        - database_name
        - database_host
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
        database_url: !unsafe "{{ database_url }}"
