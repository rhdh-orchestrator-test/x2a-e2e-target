---
# Unsupported: raw log-tail output, individual sysctl values, and source-file availability
# outside the disposable instances have no stated assertion suitable for this playbook.
- name: Verify nginx multisite deployment
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert required services are active and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['nginx.service']['state'] == 'running'
          - ansible_facts['services']['nginx.service']['status'] == 'enabled'
          - ansible_facts['services']['fail2ban.service']['state'] == 'running'
          - ansible_facts['services']['fail2ban.service']['status'] == 'enabled'
          - ansible_facts['services']['ssh.service']['state'] == 'running'
        fail_msg: A required service is not active and enabled

    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts['packages']
        fail_msg: A required package is not installed
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv: [nginx, -t]
      register: nginx_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that: nginx_test['rc'] == 0
        fail_msg: nginx configuration validation failed

    - name: Inspect nginx configuration
      ansible.builtin.command:
        argv: [nginx, -T]
      register: nginx_dump
      changed_when: false

    - name: Assert configured site names are present
      ansible.builtin.assert:
        that: item_site in nginx_dump['stdout']
        fail_msg: A configured site name is missing from nginx configuration
      loop:
        - test.cluster.local
        - ci.cluster.local
        - status.cluster.local
      loop_control:
        loop_var: item_site

    - name: Check available site files
      ansible.builtin.stat:
        path: "{{ item_site_file }}"
      loop:
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site_file
      register: available_sites

    - name: Assert available site files exist
      ansible.builtin.assert:
        that:
          - item_site_result['stat']['exists']
          - item_site_result['stat']['isreg']
        fail_msg: An expected available-site file is missing
      loop: "{{ available_sites['results'] }}"
      loop_control:
        loop_var: item_site_result

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_link['path'] }}"
        follow: false
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
          target: /etc/nginx/sites-available/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          target: /etc/nginx/sites-available/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
          target: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_link
      register: enabled_sites

    - name: Assert enabled site links point to available sites
      ansible.builtin.assert:
        that:
          - item_enabled['stat']['islnk']
          - item_enabled['stat']['lnk_source'] == item_enabled['item']['target']
        fail_msg: An enabled site link is missing or points to the wrong file
      loop: "{{ enabled_sites['results'] }}"
      loop_control:
        loop_var: item_enabled

    - name: Check default site removal
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: default_site

    - name: Assert default site is absent
      ansible.builtin.assert:
        that: not default_site['stat']['exists']
        fail_msg: The default nginx site must not exist

    - name: Check document roots and index files
      ansible.builtin.stat:
        path: "{{ item_document['path'] }}"
      loop:
        - path: /opt/server/test
          is_directory: true
        - path: /opt/server/test/index.html
          is_directory: false
        - path: /opt/server/ci
          is_directory: true
        - path: /opt/server/ci/index.html
          is_directory: false
        - path: /opt/server/status
          is_directory: true
        - path: /opt/server/status/index.html
          is_directory: false
      loop_control:
        loop_var: item_document
      register: document_paths

    - name: Assert document roots and index files exist
      ansible.builtin.assert:
        that:
          - item_document_result['stat']['exists']
          - item_document_result['stat']['isdir'] == item_document_result['item']['is_directory']
        fail_msg: A site document path is missing or has the wrong type
      loop: "{{ document_paths['results'] }}"
      loop_control:
        loop_var: item_document_result

    - name: Check index file ownership and mode
      ansible.builtin.stat:
        path: "{{ item_index }}"
      loop:
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_index
      register: index_stats

    - name: Assert index files have expected ownership and mode
      ansible.builtin.assert:
        that:
          - item_index_result['stat']['pw_name'] == 'www-data'
          - item_index_result['stat']['gr_name'] == 'www-data'
          - item_index_result['stat']['mode'] == '0644'
        fail_msg: An index file has unexpected ownership or permissions
      loop: "{{ index_stats['results'] }}"
      loop_control:
        loop_var: item_index_result

    - name: Check certificate and private key files
      ansible.builtin.stat:
        path: "{{ item_tls['path'] }}"
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/certs/ci.cluster.local.crt
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/certs/status.cluster.local.crt
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_tls
      register: tls_files

    - name: Assert certificate and private key files exist
      ansible.builtin.assert:
        that:
          - item_tls_result['stat']['exists']
          - item_tls_result['stat']['isreg']
        fail_msg: An expected TLS file is missing
      loop: "{{ tls_files['results'] }}"
      loop_control:
        loop_var: item_tls_result

    - name: Check private key ownership and mode
      ansible.builtin.stat:
        path: "{{ item_key }}"
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: key_stats

    - name: Assert private keys have expected ownership and mode
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['pw_name'] == 'root'
          - item_key_result['stat']['gr_name'] == 'ssl-cert'
          - item_key_result['stat']['mode'] == '0640'
        fail_msg: A private key has unexpected ownership or permissions
      loop: "{{ key_stats['results'] }}"
      loop_control:
        loop_var: item_key_result

    - name: Inspect certificates
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
          - -issuer
          - -dates
          - -text
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
          name: test.cluster.local
        - path: /etc/ssl/certs/ci.cluster.local.crt
          name: ci.cluster.local
        - path: /etc/ssl/certs/status.cluster.local.crt
          name: status.cluster.local
      loop_control:
        loop_var: item_certificate
      register: certificate_details
      changed_when: false

    - name: Assert certificates have expected site names and RSA key size
      ansible.builtin.assert:
        that:
          - item_certificate_result['rc'] == 0
          - "'CN=' ~ item_certificate_result['item']['name'] in item_certificate_result['stdout']"
          - "'subject=' in item_certificate_result['stdout']"
          - "'issuer=' in item_certificate_result['stdout']"
          - "'Public-Key: (2048 bit)' in item_certificate_result['stdout']"
        fail_msg: A site certificate has unexpected metadata
      loop: "{{ certificate_details['results'] }}"
      loop_control:
        loop_var: item_certificate_result

    - name: Verify HTTP and HTTPS endpoints
      ansible.builtin.uri:
        url: "{{ item_endpoint['url'] }}"
        headers:
          Host: "{{ item_endpoint['host'] }}"
        follow_redirects: none
        validate_certs: false
        status_code: "{{ item_endpoint['status'] }}"
      loop:
        - host: test.cluster.local
          url: http://127.0.0.1/
          status: 301
        - host: test.cluster.local
          url: https://127.0.0.1/
          status: 200
        - host: ci.cluster.local
          url: http://127.0.0.1/
          status: 301
        - host: ci.cluster.local
          url: https://127.0.0.1/
          status: 200
        - host: status.cluster.local
          url: http://127.0.0.1/
          status: 301
        - host: status.cluster.local
          url: https://127.0.0.1/
          status: 200
      loop_control:
        loop_var: item_endpoint

    - name: Verify nginx listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item_listener }}"
        state: started
        timeout: 10
      loop:
        - 80
        - 443
      loop_control:
        loop_var: item_listener

    - name: Check UFW status
      ansible.builtin.command:
        argv: [ufw, status, verbose]
      register: ufw_status
      changed_when: false

    - name: Assert UFW is active with default deny incoming
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status['stdout']"
          - "'Default: deny (incoming)' in ufw_status['stdout']"
        fail_msg: UFW must be active with default incoming deny

    - name: Check UFW rules
      ansible.builtin.command:
        argv: [ufw, status, numbered]
      register: ufw_rules
      changed_when: false

    - name: Assert required UFW rules exist
      ansible.builtin.assert:
        that: item_ufw_port in ufw_rules['stdout']
        fail_msg: An expected UFW rule is missing
      loop:
        - 22/tcp
        - 80/tcp
        - 443/tcp
      loop_control:
        loop_var: item_ufw_port

    - name: Check SSH hardening directives
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - "^{{ item_ssh_directive }}$"
          - /etc/ssh/sshd_config
      loop:
        - PermitRootLogin no
        - PasswordAuthentication no
      loop_control:
        loop_var: item_ssh_directive
      register: ssh_directives
      changed_when: false

    - name: Assert SSH hardening directives are present
      ansible.builtin.assert:
        that: item_ssh_result['rc'] == 0
        fail_msg: An expected SSH hardening directive is missing
      loop: "{{ ssh_directives['results'] }}"
      loop_control:
        loop_var: item_ssh_result

    - name: Check expected Fail2ban jails
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
          - "{{ item_jail }}"
      loop:
        - sshd
        - nginx-http-auth
        - nginx-limit-req
        - nginx-botsearch
      loop_control:
        loop_var: item_jail
      register: fail2ban_jails
      changed_when: false

    - name: Assert expected Fail2ban jails are configured
      ansible.builtin.assert:
        that: item_jail_result['rc'] == 0
        fail_msg: An expected Fail2ban jail is not configured
      loop: "{{ fail2ban_jails['results'] }}"
      loop_control:
        loop_var: item_jail_result
