---
# Unsupported pre-flight checks: Redis service-unit status/enabled checks, authenticated Redis
# commands and read/write checks (no protected secret-injection variable is provided), Redis
# password retrieval, Redis log/journal inspection, and all Memcached checks require values or
# outcomes that are unresolved in the migration plan or would expose a secret.
- name: Verify cache pre-flight expectations
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify Redis configuration file exists
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: item_redis_config

    - name: Assert Redis configuration file exists
      ansible.builtin.assert:
        that:
          - item_redis_config['stat']['exists']
          - item_redis_config['stat']['isreg']
        fail_msg: Redis configuration file is missing or is not a regular file.

    - name: Verify Redis listener on TCP port 6379
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 10
      register: item_redis_listener

    - name: Assert Redis listener check completed
      ansible.builtin.assert:
        that:
          - item_redis_listener['state'] == 'started'
        fail_msg: Redis is not listening on TCP port 6379.

    - name: Verify unauthenticated Redis access is rejected
      ansible.builtin.command:
        argv:
          - redis-cli
          - -p
          - '6379'
          - PING
      register: item_redis_unauthenticated
      changed_when: false
      failed_when: false

    - name: Assert unauthenticated Redis access returns an authentication error
      ansible.builtin.assert:
        that:
          - item_redis_unauthenticated['stdout'] is search('(?i)(noauth|authentication required)')
        fail_msg: Unauthenticated Redis access was not rejected with an authentication error.

    - name: Verify selected Redis directives are absent
      ansible.builtin.command:
        argv:
          - grep
          - -E
          - '^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)'
          - /etc/redis/6379.conf
      register: item_redis_directives
      changed_when: false
      failed_when: item_redis_directives['rc'] not in [0, 1]

    - name: Assert selected Redis directives are absent
      ansible.builtin.assert:
        that:
          - item_redis_directives['rc'] == 1
        fail_msg: Selected replication-related directives are present in the Redis configuration.

    - name: Verify Redis log directory
      ansible.builtin.stat:
        path: /var/log/redis
      register: item_redis_log_directory

    - name: Assert Redis log directory metadata
      ansible.builtin.assert:
        that:
          - item_redis_log_directory['stat']['exists']
          - item_redis_log_directory['stat']['isdir']
          - item_redis_log_directory['stat']['pw_name'] == 'redis'
          - item_redis_log_directory['stat']['gr_name'] == 'redis'
          - item_redis_log_directory['stat']['mode'] == '0755'
        fail_msg: Redis log directory does not have the expected path, owner, group, or mode.
