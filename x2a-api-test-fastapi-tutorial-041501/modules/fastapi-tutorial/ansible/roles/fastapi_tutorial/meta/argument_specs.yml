---
argument_specs:
  main:
    short_description: Configures FastAPI tutorial application with PostgreSQL
    description:
      - Deploys a FastAPI tutorial web application with PostgreSQL database backend.
      - Installs Python 3, clones the FastAPI tutorial from GitHub, sets up a virtual environment.
      - Configures PostgreSQL with a dedicated database and user, and runs the application as a systemd service.
    options:
      fastapi_tutorial_app_dir:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Directory where the FastAPI application will be installed.
      fastapi_tutorial_app_port:
        type: int
        required: false
        default: 8000
        description: TCP port the FastAPI application listens on.
      fastapi_tutorial_app_host:
        type: str
        required: false
        default: 0.0.0.0
        description: IP address the FastAPI application binds to.
      fastapi_tutorial_git_repo:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository URL for the FastAPI tutorial application.
      fastapi_tutorial_git_branch:
        type: str
        required: false
        default: main
        description: Git branch to checkout from the repository.
      fastapi_tutorial_project_name:
        type: str
        required: false
        default: FastAPI Tutorial
        description: Project name used in the application configuration.
      fastapi_tutorial_api_version:
        type: str
        required: false
        default: 1.0.0
        description: API version used in the application configuration.
      fastapi_tutorial_packages:
        type: list
        elements: str
        required: false
        default:
          - python3
          - python3-pip
          - python3-venv
          - git
          - postgresql
          - postgresql-contrib
          - libpq-dev
        description: List of system packages required for the FastAPI application.
      fastapi_tutorial_service_user:
        type: str
        required: false
        default: root
        description: System user that runs the FastAPI service.
      fastapi_tutorial_service_restart_policy:
        type: str
        required: false
        default: always
        description: Systemd restart policy for the FastAPI service.
      db_username:
        type: str
        required: true
        description: Database username (injected by AAP credential type).
      db_password:
        type: str
        required: true
        description: Database password (injected by AAP credential type).
      db_host:
        type: str
        required: true
        description: Database host (injected by AAP credential type).
      db_name:
        type: str
        required: true
        description: Database name (injected by AAP credential type).
