- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file was created
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl configuration file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file was created
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Sysctl configuration file not found
      success_msg: Sysctl configuration file exists
  - name: Get sysctl configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl parameters are set correctly
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: Sysctl parameters not set correctly
      success_msg: Sysctl parameters set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: automate_cli
  - name: Assert Chef Automate CLI was downloaded
    ansible.builtin.assert:
      that:
      - automate_cli.stat.exists
      - automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Server control binary exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/bin/chef-server-ctl
    register: chef_server_ctl
  - name: Assert Chef Server control binary exists
    ansible.builtin.assert:
      that:
      - chef_server_ctl.stat.exists
      - chef_server_ctl.stat.executable
      fail_msg: Chef Server control binary not found or not executable
      success_msg: Chef Server control binary exists and is executable
  - name: Check Chef Automate deployment file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/sup/default/data/chef-automate-deployed
    register: automate_deployed
  - name: Assert Chef Automate was deployed
    ansible.builtin.assert:
      that:
      - automate_deployed.stat.exists
      fail_msg: Chef Automate deployment file not found
      success_msg: Chef Automate deployment file exists
  - name: Check user key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/jtonello.pem
    register: user_key
  - name: Assert user key file was created
    ansible.builtin.assert:
      that:
      - user_key.stat.exists
      - user_key.stat.size > 0
      - user_key.stat.mode == '0600'
      fail_msg: User key file not found or has incorrect permissions
      success_msg: User key file exists with correct permissions
  - name: Check organization validator key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/lab-validator.pem
    register: org_key
  - name: Assert organization validator key file was created
    ansible.builtin.assert:
      that:
      - org_key.stat.exists
      - org_key.stat.size > 0
      - org_key.stat.mode == '0600'
      fail_msg: Organization validator key file not found or has incorrect permissions
      success_msg: Organization validator key file exists with correct permissions
  - name: Check Chef Server user list file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-server-users
    register: user_list
  - name: Get Chef Server user list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/chef-server-users
    register: user_list_content
    when: user_list.stat.exists
  - name: Assert user was created
    ansible.builtin.assert:
      that:
      - '''jtonello'' in (user_list_content.content | b64decode)'
      fail_msg: User not found in Chef Server user list
      success_msg: User found in Chef Server user list
    when: user_list.stat.exists
  - name: Check Chef Server org list file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-server-orgs
    register: org_list
  - name: Get Chef Server org list content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/chef-server-orgs
    register: org_list_content
    when: org_list.stat.exists
  - name: Assert organization was created
    ansible.builtin.assert:
      that:
      - '''lab'' in (org_list_content.content | b64decode)'
      fail_msg: Organization not found in Chef Server org list
      success_msg: Organization found in Chef Server org list
    when: org_list.stat.exists
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: automate_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - automate_status.rc == 0
      fail_msg: Chef Automate is not running
      success_msg: Chef Automate is running
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: server_status
    changed_when: false
    failed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - server_status.rc == 0
      fail_msg: Chef Infra Server is not running
      success_msg: Chef Infra Server is running
    tags: molecule-notest
  - name: Check Chef Automate service
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate service is active
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      - ansible_facts.services['chef-automate.service'].state == 'running'
      fail_msg: Chef Automate service not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check if port 443 is open
    ansible.builtin.wait_for:
      port: 443
      timeout: 5
    register: port_check
    failed_when: false
    tags: molecule-notest
  - name: Assert port 443 is open
    ansible.builtin.assert:
      that:
      - port_check is succeeded
      fail_msg: Port 443 is not open
      success_msg: Port 443 is open
    tags: molecule-notest
  - name: Check web UI access
    ansible.builtin.uri:
      url: https://localhost
      validate_certs: false
      status_code: 200
    register: web_ui
    failed_when: false
    tags: molecule-notest
  - name: Assert web UI is accessible
    ansible.builtin.assert:
      that:
      - web_ui is succeeded
      fail_msg: Web UI is not accessible
      success_msg: Web UI is accessible
    tags: molecule-notest
