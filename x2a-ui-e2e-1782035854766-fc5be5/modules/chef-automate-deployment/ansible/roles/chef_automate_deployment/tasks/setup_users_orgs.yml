---
- name: Check if Chef Server is installed
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_installed
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_automate_username }}  {{ full_name | default(chef_automate_full_name) }}  {{ email | default(chef_automate_email) }}  "{{
      password }}"  --filename {{ chef_automate_user_key_path }}

      '
  become: true
  args:
    creates: "{{ chef_automate_user_key_path }}"
  no_log: true
  register: create_user
  changed_when: create_user.rc == 0
  when: chef_server_installed.stat.exists
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_automate_org_name }}  "{{ chef_automate_org_full_name }}"  --association_user {{ chef_automate_username }}  --filename
      {{ chef_automate_org_key_path }}

      '
  become: true
  args:
    creates: "{{ chef_automate_org_key_path }}"
  register: create_org
  changed_when: create_org.rc == 0
  when: chef_server_installed.stat.exists
