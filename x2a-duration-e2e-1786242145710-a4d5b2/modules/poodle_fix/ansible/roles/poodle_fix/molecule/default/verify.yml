---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check if Apache SSL config file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_config_file

    - name: Assert SSL config file exists
      ansible.builtin.assert:
        that:
          - ssl_config_file.stat.exists
          - ssl_config_file.stat.isreg
        fail_msg: "Apache SSL config file not found"
        success_msg: "Apache SSL config file exists"

    - name: Get SSL config file content
      ansible.builtin.slurp:
        src: "/tmp/molecule_test/etc/apache2/mods-available/ssl.conf"
      register: ssl_config_content

    - name: Assert SSLProtocol setting has been updated
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in (ssl_config_content.content | b64decode)"
        fail_msg: "SSLProtocol setting was not updated correctly"
        success_msg: "SSLProtocol setting was updated correctly"

    # Service checks that can't run in container
    - name: Verify Apache is installed
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service exists
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
        fail_msg: "Apache service not found"
        success_msg: "Apache service exists"
      tags: molecule-notest

    - name: Verify SSH is installed
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert SSH service exists
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
        fail_msg: "SSH service not found"
        success_msg: "SSH service exists"
      tags: molecule-notest

    - name: Validate Apache configuration
      ansible.builtin.command: apache2ctl configtest
      changed_when: false
      tags: molecule-notest