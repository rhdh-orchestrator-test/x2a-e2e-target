- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/usr/bin
    - /tmp/molecule_test/bin
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create hosts file
    ansible.builtin.copy:
      content: '127.0.0.1 localhost

        127.0.1.1 {{ chef_automate_hostname }}

        '
      dest: /tmp/molecule_test/etc/hosts
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Mock'' '
      dest: /tmp/molecule_test{{ chef_automate_cli_path }}
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK USER KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test{{ chef_automate_user_key_path }}
      mode: '0600'
  - name: Create organization key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK ORG KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test{{ chef_automate_org_key_path }}
      mode: '0600'
  - name: Create chef-server-ctl mock
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Server Control Mock"

        echo "Command: $@"

        exit 0

        '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create chef-automate command mock
    ansible.builtin.copy:
      content: "#!/bin/bash\necho \"Chef Automate Mock\"\necho \"Command: $@\"\nif [ \"$1\" = \"status\" ]; then\n  echo \"All services running\"\nfi\nexit 0\n"
      dest: /tmp/molecule_test/usr/bin/chef-automate
      mode: '0755'
  - name: Create symlinks to mock binaries
    ansible.builtin.file:
      src: /tmp/molecule_test/usr/bin/{{ item }}
      dest: /tmp/molecule_test/bin/{{ item }}
      state: link
    loop:
    - chef-server-ctl
    - chef-automate
