---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check system configuration
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is correctly set
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == chef_automate_hostname
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly to {{ chef_automate_hostname }}"
      when: hostname_file.stat.exists

    # Check hosts file
    - name: Check hosts file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hosts
      register: hosts_file

    - name: Assert hosts file exists
      ansible.builtin.assert:
        that:
          - hosts_file.stat.exists
          - hosts_file.stat.isreg
        fail_msg: "Hosts file not found"
        success_msg: "Hosts file exists"

    - name: Get hosts file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hosts
      register: hosts_content
      when: hosts_file.stat.exists

    - name: Assert hosts file contains hostname entry
      ansible.builtin.assert:
        that:
          - (hosts_content.content | b64decode) is search('127.0.1.1 ' + chef_automate_hostname)
        fail_msg: "Hosts file does not contain hostname entry"
        success_msg: "Hosts file contains hostname entry"
      when: hosts_file.stat.exists

    # Check kernel parameters
    - name: Check sysctl config file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl config file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl config file not found"
        success_msg: "Sysctl config file exists"

    - name: Get sysctl config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
        fail_msg: "vm.max_map_count not set correctly"
        success_msg: "vm.max_map_count set correctly"
      when: sysctl_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "vm.dirty_expire_centisecs not set correctly"
        success_msg: "vm.dirty_expire_centisecs set correctly"
      when: sysctl_file.stat.exists

    # Check Chef Automate CLI
    - name: Check Chef Automate CLI file
      ansible.builtin.stat:
        path: "/tmp/molecule_test{{ chef_automate_cli_path }}"
      register: cli_file

    - name: Assert Chef Automate CLI file exists
      ansible.builtin.assert:
        that:
          - cli_file.stat.exists
          - cli_file.stat.isreg
          - cli_file.stat.executable
        fail_msg: "Chef Automate CLI file not found or not executable"
        success_msg: "Chef Automate CLI file exists and is executable"

    # Check Chef Automate deployment
    - name: Check Chef Automate deployment directory
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: hab_dir

    - name: Assert Chef Automate deployment directory exists
      ansible.builtin.assert:
        that:
          - hab_dir.stat.exists
          - hab_dir.stat.isdir
        fail_msg: "Chef Automate deployment directory not found"
        success_msg: "Chef Automate deployment directory exists"

    # Check user key file
    - name: Check user key file
      ansible.builtin.stat:
        path: "/tmp/molecule_test{{ chef_automate_user_key_path }}"
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.isreg
          - user_key_file.stat.mode == '0600'
        fail_msg: "User key file not found or has incorrect permissions"
        success_msg: "User key file exists with correct permissions"

    # Check organization key file
    - name: Check organization key file
      ansible.builtin.stat:
        path: "/tmp/molecule_test{{ chef_automate_org_key_path }}"
      register: org_key_file

    - name: Assert organization key file exists
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.isreg
          - org_key_file.stat.mode == '0600'
        fail_msg: "Organization key file not found or has incorrect permissions"
        success_msg: "Organization key file exists with correct permissions"

    # The following checks cannot be run in a container environment
    # They are tagged with molecule-notest to be skipped during molecule testing

    # Check Chef Automate status
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: chef-automate status
      register: automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - "'All services running' in automate_status.stdout"
        fail_msg: "Chef Automate services not running"
        success_msg: "Chef Automate services running"
      tags: molecule-notest

    # Check Chef Infra Server status
    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server is running
      ansible.builtin.assert:
        that:
          - server_status.rc == 0
        fail_msg: "Chef Infra Server services not running"
        success_msg: "Chef Infra Server services running"
      tags: molecule-notest

    # Check user verification
    - name: Check user list
      ansible.builtin.command:
        cmd: chef-server-ctl user-list
      register: user_list
      changed_when: false
      tags: molecule-notest

    - name: Assert user exists
      ansible.builtin.assert:
        that:
          - chef_automate_username in user_list.stdout
        fail_msg: "User {{ chef_automate_username }} not found"
        success_msg: "User {{ chef_automate_username }} exists"
      tags: molecule-notest

    # Check organization verification
    - name: Check organization list
      ansible.builtin.command:
        cmd: chef-server-ctl org-list
      register: org_list
      changed_when: false
      tags: molecule-notest

    - name: Assert organization exists
      ansible.builtin.assert:
        that:
          - chef_automate_org_name in org_list.stdout
        fail_msg: "Organization {{ chef_automate_org_name }} not found"
        success_msg: "Organization {{ chef_automate_org_name }} exists"
      tags: molecule-notest

    # Check web UI access
    - name: Check web UI access
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
        status_code: 200
      register: web_ui
      failed_when: false
      tags: molecule-notest

    - name: Assert web UI is accessible
      ansible.builtin.assert:
        that:
          - web_ui.status == 200
        fail_msg: "Chef Automate web UI not accessible"
        success_msg: "Chef Automate web UI accessible"
      tags: molecule-notest

    # Check network listening
    - name: Check network listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check.state == "started"
        fail_msg: "Port 443 not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest