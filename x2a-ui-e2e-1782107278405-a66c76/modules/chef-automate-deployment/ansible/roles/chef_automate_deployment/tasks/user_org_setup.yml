---
- name: Ensure directories for key files exist
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_key_path }}"
    - "{{ chef_automate_org_key_path }}"
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_username }} "{{ chef_automate_full_name }}" {{ chef_automate_email }} "{{ chef_automate_password }}"
      --filename {{ chef_automate_user_key_path }}
  args:
    creates: "{{ chef_automate_user_key_path }}"
  register: create_user
  changed_when: create_user.rc == 0
  failed_when: create_user.rc != 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_full_name }}" --association_user {{ chef_automate_username }} --filename
      {{ chef_automate_org_key_path }}
  args:
    creates: "{{ chef_automate_org_key_path }}"
  register: create_org
  changed_when: create_org.rc == 0
  failed_when: create_org.rc != 0
- name: Set permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_automate_user_key_path }}"
    mode: "0600"
    owner: "{{ ansible_user_id }}"
  when: create_user.changed
- name: Set permissions on organization key file
  ansible.builtin.file:
    path: "{{ chef_automate_org_key_path }}"
    mode: "0600"
    owner: "{{ ansible_user_id }}"
  when: create_org.changed
