---
argument_specs:
  main:
    short_description: SSL security hardening role that fixes POODLE vulnerability
    description:
      - Performs SSL security hardening by fixing the POODLE vulnerability in Apache SSL configuration.
      - Ensures Apache2 is installed and SSL module is enabled.
      - Disables all SSL protocols and enables only TLSv1.2.
      - Restarts Apache2 service after configuration changes.
    options:
      ssl_config_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file.
      ssl_protocol_setting:
        type: str
        required: false
        default: SSLProtocol -all +TLSv1.2
        description: SSL protocol configuration string to apply.
