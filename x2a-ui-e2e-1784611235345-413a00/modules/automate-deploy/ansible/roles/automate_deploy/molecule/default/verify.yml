---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration verification
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Sysctl configuration verification
    - name: Check sysctl configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file was created
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are set correctly
      ansible.builtin.assert:
        that:
          - (sysctl_content.content | b64decode) is search('vm.max_map_count = 262144')
          - (sysctl_content.content | b64decode) is search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI verification
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI was created
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate status verification
    - name: Check Chef Automate status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-automate/status.txt
      register: chef_automate_status

    - name: Assert Chef Automate status file was created
      ansible.builtin.assert:
        that:
          - chef_automate_status.stat.exists
        fail_msg: "Chef Automate status file not found"
        success_msg: "Chef Automate status file exists"

    # Chef Infra Server status verification
    - name: Check Chef Infra Server status file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server/status.txt
      register: chef_server_status

    - name: Assert Chef Infra Server status file was created
      ansible.builtin.assert:
        that:
          - chef_server_status.stat.exists
        fail_msg: "Chef Infra Server status file not found"
        success_msg: "Chef Infra Server status file exists"

    # User key verification
    - name: Check user key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_key

    - name: Assert user key file was created
      ansible.builtin.assert:
        that:
          - user_key.stat.exists
          - user_key.stat.isreg
          - user_key.stat.mode == "0600"
        fail_msg: "User key file not found or has incorrect permissions"
        success_msg: "User key file exists with correct permissions"

    # Organization validator key verification
    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_key

    - name: Assert organization validator key file was created
      ansible.builtin.assert:
        that:
          - org_key.stat.exists
          - org_key.stat.isreg
          - org_key.stat.mode == "0600"
        fail_msg: "Organization validator key file not found or has incorrect permissions"
        success_msg: "Organization validator key file exists with correct permissions"

    # User list verification
    - name: Check user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server/user-list.txt
      register: user_list

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef-server/user-list.txt
      register: user_list_content
      when: user_list.stat.exists

    - name: Assert user was created
      ansible.builtin.assert:
        that:
          - (user_list_content.content | b64decode) is search('jtonello')
        fail_msg: "User jtonello not found in user list"
        success_msg: "User jtonello found in user list"
      when: user_list.stat.exists

    # Organization list verification
    - name: Check organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server/org-list.txt
      register: org_list

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef-server/org-list.txt
      register: org_list_content
      when: org_list.stat.exists

    - name: Assert organization was created
      ansible.builtin.assert:
        that:
          - (org_list_content.content | b64decode) is search('lab')
        fail_msg: "Organization lab not found in organization list"
        success_msg: "Organization lab found in organization list"
      when: org_list.stat.exists

    # Service status verification (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "ansible_facts.services['chef-automate.service'].state == 'running'"
        fail_msg: "Chef Automate service not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    # Network connectivity verification (tagged for skipping in container)
    - name: Check Chef Automate port is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      tags: molecule-notest

    # API connectivity test (tagged for skipping in container)
    - name: Test Chef Automate API connectivity
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
        status_code: 200
      tags: molecule-notest