---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/sysctl.d
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/chef-server

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration files
      ansible.builtin.copy:
        content: |
          # Managed by Ansible
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate Chef Automate CLI download and extraction
    - name: Create Chef Automate CLI file
      ansible.builtin.file:
        path: "/tmp/molecule_test/chef-automate"
        state: touch
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Chef Automate
          ===============
          Status: running
          Version: 4.2.5
        dest: "/tmp/molecule_test/var/opt/chef-automate/status.txt"
        mode: "0644"

    # Simulate Chef Infra Server deployment
    - name: Create Chef Infra Server status file
      ansible.builtin.copy:
        content: |
          Chef Infra Server
          ===============
          Status: running
          Version: 14.0.65
        dest: "/tmp/molecule_test/var/opt/chef-server/status.txt"
        mode: "0644"

    # Simulate user and organization creation
    - name: Create user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA...
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/jtonello.pem"
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA...
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/lab-validator.pem"
        mode: "0600"

    # Simulate systemd service files
    - name: Create Chef Automate service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Automate
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/chef-automate start
          ExecStop=/usr/bin/chef-automate stop

          [Install]
          WantedBy=multi-user.target
        dest: "/tmp/molecule_test/etc/systemd/system/chef-automate.service"
        mode: "0644"

    # Simulate user and organization lists
    - name: Create user list file
      ansible.builtin.copy:
        content: |
          jtonello
          admin
        dest: "/tmp/molecule_test/var/opt/chef-server/user-list.txt"
        mode: "0644"

    - name: Create organization list file
      ansible.builtin.copy:
        content: |
          lab
        dest: "/tmp/molecule_test/var/opt/chef-server/org-list.txt"
        mode: "0644"