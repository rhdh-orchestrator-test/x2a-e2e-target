---
- name: Check if Chef Server is running
  ansible.builtin.command:
    cmd: chef-server-ctl status
  become: true
  register: chef_server_status
  changed_when: false
  failed_when: false
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create  {{ username }}  {{ longusername }}  {{ useremail }}  "{{ password }}"  --filename {{ userfilename }}
  become: true
  args:
    creates: "{{ userfilename }}"
  register: create_user
  changed_when: create_user.rc == 0
  failed_when: create_user.rc != 0
  when: chef_server_status.rc == 0
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create  {{ orgname }}  "{{ longorgname }}"  --association_user {{ username }}  --filename {{ orgfilename }}
  become: true
  args:
    creates: "{{ orgfilename }}"
  register: create_org
  changed_when: create_org.rc == 0
  failed_when: create_org.rc != 0
  when: chef_server_status.rc == 0
