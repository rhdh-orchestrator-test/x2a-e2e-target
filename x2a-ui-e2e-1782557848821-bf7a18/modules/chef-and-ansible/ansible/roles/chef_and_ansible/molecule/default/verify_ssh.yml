- name: Verify SSH Configuration
  hosts: all
  gather_facts: false
  tasks:
  - name: Check if openssh-server is installed
    ansible.builtin.package_facts:
      manager: auto
    register: package_facts
    tags: molecule-notest
  - name: Check if SSH root login is disabled
    ansible.builtin.command: grep "^PermitRootLogin" /tmp/molecule_test/etc/ssh/sshd_config
    register: ssh_root_login
    changed_when: false
    failed_when: false
    when: '''openssh-server'' in package_facts.ansible_facts.packages'
    tags: molecule-notest
  - name: Verify SSH root login is not permitted
    ansible.builtin.assert:
      that:
      - '''yes'' not in ssh_root_login.stdout'
      fail_msg: SSH root login is enabled, which is a security risk (CAT I, SRG-OS-000112, V-38607)
      success_msg: SSH root login is properly disabled
    when:
    - '''openssh-server'' in package_facts.ansible_facts.packages'
    - ssh_root_login.rc == 0
    tags: molecule-notest
