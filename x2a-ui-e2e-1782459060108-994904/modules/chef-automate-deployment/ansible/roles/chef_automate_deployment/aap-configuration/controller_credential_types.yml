---
controller_credential_types:
- name: Chef User Credentials
  description: Credential type for Chef User Credentials
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Chef Username
      help_text: Username for the initial Chef user account
    - id: user_password
      type: string
      label: Chef User Password
      secret: true
      help_text: Password for the initial Chef user account
    - id: user_full_name
      type: string
      label: User Full Name
      help_text: Full name for the Chef user account
    - id: user_email
      type: string
      label: User Email
      help_text: Email address for the Chef user account
    - id: organization_name
      type: string
      label: Organization Name
      help_text: Name of the Chef organization to create
    - id: organization_full_name
      type: string
      label: Organization Full Name
      help_text: Full name of the Chef organization
    required:
    - username
    - user_password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      user_password: !unsafe '{{ user_password }}'
      user_full_name: !unsafe '{{ user_full_name }}'
      user_email: !unsafe '{{ user_email }}'
      organization_name: !unsafe '{{ organization_name }}'
      organization_full_name: !unsafe '{{ organization_full_name }}'
