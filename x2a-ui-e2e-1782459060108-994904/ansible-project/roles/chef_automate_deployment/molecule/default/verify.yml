- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    organization_name: lab
    chef_automate_user_key_path: ~/{{ username }}.pem
    chef_automate_org_key_path: ~/{{ organization_name }}-validator.pem
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file exists
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.isreg
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Get hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
      fail_msg: Hostname not set correctly
      success_msg: Hostname set correctly
    when: hostname_file.stat.exists
  - name: Check sysctl.conf file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.conf
    register: sysctl_file
  - name: Assert sysctl.conf file exists
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.isreg
      fail_msg: sysctl.conf file not found
      success_msg: sysctl.conf file exists
  - name: Get sysctl.conf content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      fail_msg: vm.max_map_count not set correctly
      success_msg: vm.max_map_count set correctly
    when: sysctl_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: vm.dirty_expire_centisecs not set correctly
      success_msg: vm.dirty_expire_centisecs set correctly
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI file exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.isreg
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI file not found or not executable
      success_msg: Chef Automate CLI file exists and is executable
  - name: Check services.dat file
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/sup/default/data/services.dat
    register: services_dat
  - name: Assert services.dat file exists
    ansible.builtin.assert:
      that:
      - services_dat.stat.exists
      - services_dat.stat.isreg
      fail_msg: services.dat file not found
      success_msg: services.dat file exists
  - name: Check user key file
    ansible.builtin.stat:
      path: /tmp/molecule_test{{ chef_automate_user_key_path | expanduser | regex_replace('^~', '/home/ansible') }}
    register: user_key
  - name: Assert user key file exists
    ansible.builtin.assert:
      that:
      - user_key.stat.exists
      - user_key.stat.isreg
      - user_key.stat.mode == "0600"
      fail_msg: User key file not found or incorrect permissions
      success_msg: User key file exists with correct permissions
  - name: Check organization validator key file
    ansible.builtin.stat:
      path: /tmp/molecule_test{{ chef_automate_org_key_path | expanduser | regex_replace('^~', '/home/ansible') }}
    register: org_key
  - name: Assert organization validator key file exists
    ansible.builtin.assert:
      that:
      - org_key.stat.exists
      - org_key.stat.isreg
      - org_key.stat.mode == "0600"
      fail_msg: Organization validator key file not found or incorrect permissions
      success_msg: Organization validator key file exists with correct permissions
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: sudo chef-automate status
    register: chef_automate_status
    changed_when: false
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: sudo chef-server-ctl status
    register: chef_server_status
    changed_when: false
    tags: molecule-notest
  - name: Check user list
    ansible.builtin.command:
      cmd: sudo chef-server-ctl user-list
    register: chef_user_list
    changed_when: false
    tags: molecule-notest
  - name: Assert user exists
    ansible.builtin.assert:
      that:
      - '''jtonello'' in chef_user_list.stdout'
      fail_msg: User jtonello not found
      success_msg: User jtonello exists
    tags: molecule-notest
  - name: Check organization list
    ansible.builtin.command:
      cmd: sudo chef-server-ctl org-list
    register: chef_org_list
    changed_when: false
    tags: molecule-notest
  - name: Assert organization exists
    ansible.builtin.assert:
      that:
      - '''lab'' in chef_org_list.stdout'
      fail_msg: Organization lab not found
      success_msg: Organization lab exists
    tags: molecule-notest
  - name: Check HTTPS port
    ansible.builtin.wait_for:
      port: 443
      timeout: 5
    ignore_errors: true
    register: https_port
    tags: molecule-notest
  - name: Assert HTTPS port is listening
    ansible.builtin.assert:
      that:
      - https_port is success
      fail_msg: HTTPS port 443 is not listening
      success_msg: HTTPS port 443 is listening
    tags: molecule-notest
  - name: Check Chef Automate API health
    ansible.builtin.uri:
      url: https://localhost/api/_status
      validate_certs: false
    register: api_health
    ignore_errors: true
    tags: molecule-notest
  - name: Assert Chef Automate API is healthy
    ansible.builtin.assert:
      that:
      - api_health is success
      fail_msg: Chef Automate API health check failed
      success_msg: Chef Automate API is healthy
    tags: molecule-notest
