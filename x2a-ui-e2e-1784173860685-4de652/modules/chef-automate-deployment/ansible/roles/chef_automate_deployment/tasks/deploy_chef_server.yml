- name: Ensure gunzip is available
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: '{{ chef_automate_cli_url }}'
    dest: '{{ chef_automate_cli_dest }}'
    mode: '0644'
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.shell: gunzip -c {{ chef_automate_cli_dest }} > {{ chef_automate_cli_extracted }}
  args:
    creates: '{{ chef_automate_cli_extracted }}'
  become: true
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: '{{ chef_automate_cli_extracted }}'
    mode: '0755'
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: '{{ chef_automate_cli_extracted }} deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_license | lower }}'
  args:
    creates: /usr/bin/chef-automate
  become: true
  register: chef_server_deploy
  changed_when: chef_server_deploy.rc == 0
