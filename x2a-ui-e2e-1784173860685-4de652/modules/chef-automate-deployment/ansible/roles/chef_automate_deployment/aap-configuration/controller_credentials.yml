---
controller_credentials:
- name: Chef User Credentials - chef_automate_deployment
  description: User credentials for Chef Automate and Chef Infra Server
  organization: Default
  credential_type: Chef User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
- name: Chef Organization Configuration - chef_automate_deployment
  description: Organization configuration for Chef Infra Server
  organization: Default
  credential_type: Chef Organization Configuration
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
