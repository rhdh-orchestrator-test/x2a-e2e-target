- name: Converge
  hosts: all
  gather_facts: false
  vars:
    chef_hostname: automate.chef.lab
    username: jtonello
    organization_name: lab
    password: securepassword
  tasks:
  - name: Create required directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab/sup/default/data
    - /tmp/molecule_test/home/ansible
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl parameter files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/vm/{{ item.name | regex_replace('^vm\.', '') }}
      mode: '0644'
    loop:
    - name: vm.max_map_count
      value: '262144'
    - name: vm.dirty_expire_centisecs
      value: '20000'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash # Chef Automate CLI mock echo ''Chef Automate CLI mock'''
      dest: /tmp/molecule_test/home/ansible/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.copy:
      content: '# Chef Automate services data mock'
      dest: /tmp/molecule_test/hab/sup/default/data/services.dat
      mode: '0644'
  - name: Create Chef user key
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_USER_KEY_CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/home/ansible/{{ username }}.pem
      mode: '0600'
  - name: Create Chef organization validator key
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK_ORG_VALIDATOR_KEY_CONTENT -----END RSA PRIVATE KEY-----'
      dest: /tmp/molecule_test/home/ansible/{{ organization_name }}-validator.pem
      mode: '0600'
  - name: Create mock chef-server-ctl user-list output
    ansible.builtin.copy:
      content: '{{ username }} admin'
      dest: /tmp/molecule_test/home/ansible/chef-user-list.txt
      mode: '0644'
  - name: Create mock chef-server-ctl org-list output
    ansible.builtin.copy:
      content: '{{ organization_name }} chef'
      dest: /tmp/molecule_test/home/ansible/chef-org-list.txt
      mode: '0644'
  - name: Create mock chef-server-ctl user-show output
    ansible.builtin.copy:
      content: 'username: {{ username }} email: jtonello@chef.lab display_name: John Tonello'
      dest: /tmp/molecule_test/home/ansible/chef-user-show-{{ username }}.txt
      mode: '0644'
  - name: Create mock chef-server-ctl org-show output
    ansible.builtin.copy:
      content: 'name: {{ organization_name }} full_name: Chef Lab org_type: Business'
      dest: /tmp/molecule_test/home/ansible/chef-org-show-{{ organization_name }}.txt
      mode: '0644'
  - name: Create mock chef-automate status output
    ansible.builtin.copy:
      content: 'Service: automate-gateway Status: running

        Service: automate-cs-nginx Status: running

        Service: automate-cs-oc-erchef Status: running'
      dest: /tmp/molecule_test/home/ansible/chef-automate-status.txt
      mode: '0644'
  - name: Create mock chef-server-ctl status output
    ansible.builtin.copy:
      content: 'run: chef-server/oc_erchef: (pid 12345) 60s; run: log: (pid 12346) 60s run: chef-server/oc_bifrost: (pid 12347) 60s; run: log: (pid 12348) 60s'
      dest: /tmp/molecule_test/home/ansible/chef-server-ctl-status.txt
      mode: '0644'
  - name: Create mock netstat output for port 443
    ansible.builtin.copy:
      content: tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/nginx
      dest: /tmp/molecule_test/home/ansible/netstat-output.txt
      mode: '0644'
