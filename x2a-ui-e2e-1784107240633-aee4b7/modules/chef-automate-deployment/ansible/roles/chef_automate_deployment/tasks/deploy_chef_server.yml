---
- name: Check if Chef Infra Server is already deployed
  ansible.builtin.stat:
    path: /hab/sup/default/data/services.dat
  register: chef_server_deployed
  become: true
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy  --product infra-server  --accept-terms-and-mlsa={{ chef_accept_license | lower }}\n"
    creates: /hab/sup/default/data/services.dat
  become: true
  when: not chef_server_deployed.stat.exists
  notify: Wait for Chef services to be ready
