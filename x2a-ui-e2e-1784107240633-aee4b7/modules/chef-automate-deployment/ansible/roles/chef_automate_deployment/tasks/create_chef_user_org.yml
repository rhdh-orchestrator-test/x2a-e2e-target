---
- name: Ensure directory for Chef keys exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}"
    state: directory
    mode: "0755"
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  become: true
  changed_when: false
  failed_when: false
- name: Fail if chef-server-ctl is not available
  ansible.builtin.fail:
    msg: chef-server-ctl command not found. Ensure Chef Infra Server is properly installed.
  when: chef_server_ctl_check.rc != 0
- name: Check if Chef user already exists
  ansible.builtin.command:
    cmd: chef-server-ctl user-list
  register: chef_user_list
  become: true
  changed_when: false
  failed_when: false
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create  {{ username }}  {{ chef_user_fullname }}  {{ chef_user_email }}  "{{ password }}"  --filename {{ chef_user_key_path }}
    creates: "{{ chef_user_key_path }}"
  become: true
  when: username not in chef_user_list.stdout
  register: chef_user_create
  changed_when: chef_user_create.rc == 0 and username not in chef_user_list.stdout
  notify: Set permissions on user key
- name: Check if Chef organization already exists
  ansible.builtin.command:
    cmd: chef-server-ctl org-list
  register: chef_org_list
  become: true
  changed_when: false
  failed_when: false
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create  {{ organization_name }}  "{{ chef_organization_fullname }}"  --association_user {{ username }}  --filename {{
      chef_org_validator_key_path }}
    creates: "{{ chef_org_validator_key_path }}"
  become: true
  when: organization_name not in chef_org_list.stdout
  register: chef_org_create
  changed_when: chef_org_create.rc == 0 and organization_name not in chef_org_list.stdout
  notify: Set permissions on org validator key
