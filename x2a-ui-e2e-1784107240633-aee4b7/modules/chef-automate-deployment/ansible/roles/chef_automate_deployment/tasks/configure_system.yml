---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - procps
      - gzip
    state: present
  become: true
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ chef_hostname }}"
  become: true
- name: Configure sysctl parameters for Chef Automate/Infra Server
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  become: true
  loop:
    - name: vm.max_map_count
      value: "{{ chef_vm_max_map_count }}"
    - name: vm.dirty_expire_centisecs
      value: "{{ chef_vm_dirty_expire_centisecs }}"
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }} && chmod +x {{ chef_automate_cli_path }}
    creates: "{{ chef_automate_cli_path }}"
