---
controller_credentials:
- name: Chef User Authentication - chef_automate_deployment
  description: Authentication credentials for Chef user account
  organization: Default
  credential_type: Chef User Authentication
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Chef Organization Validator - chef_automate_deployment
  description: Validator key for Chef organization
  organization: Default
  credential_type: Chef Organization Validator
  update_secrets: true
  inputs:
    organization_name: '{{ organization_name }}'
    validator_key: '{{ vault_validator_key }}'
