---
controller_credential_types:
- name: Chef User Authentication
  description: Authentication credentials for Chef user account
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef user account name
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef user account
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Chef Organization Validator
  description: Validator key for Chef organization
  kind: cloud
  inputs:
    fields:
    - id: organization_name
      type: string
      label: Organization Name
      help_text: Name of the Chef organization
    - id: validator_key
      type: string
      label: Validator Key
      secret: true
      help_text: PEM file content for organization validator
    required:
    - organization_name
    - validator_key
  injectors:
    extra_vars:
      organization_name: !unsafe '{{ organization_name }}'
      validator_key: !unsafe '{{ validator_key }}'
