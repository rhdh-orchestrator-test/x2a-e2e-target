---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}" # noqa: R114 - path from role default
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}" # noqa: R114 - path from role default
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Generate self-signed site certificates # noqa: R101 - paths and site names come from role-defined sites and role defaults
  ansible.builtin.shell:
    cmd: |
      if [ ! -f "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_multisite_ssl['key'] }}.crt" ] || [ ! -f "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_multisite_ssl['key'] }}.key" ]; then
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_multisite_ssl['key'] }}.key" \
          -out "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_multisite_ssl['key'] }}.crt" \
          -subj "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_multisite_ssl['key'] }}/emailAddress=admin@example.com"
        chmod 640 "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_multisite_ssl['key'] }}.key"
        chown root:ssl-cert "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_multisite_ssl['key'] }}.key"
        echo generated
      fi
    executable: /bin/bash
  when: item_nginx_multisite_ssl['value']['ssl_enabled']
  changed_when: "'generated' in nginx_multisite_ssl_result.stdout"
  register: nginx_multisite_ssl_result
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_ssl
  notify: Reload nginx
