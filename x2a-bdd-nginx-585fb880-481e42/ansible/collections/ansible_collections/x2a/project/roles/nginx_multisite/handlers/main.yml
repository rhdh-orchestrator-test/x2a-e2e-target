---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload security sysctl
  ansible.builtin.command:
    cmd: /sbin/sysctl -p /etc/sysctl.d/99-security.conf
  changed_when: true

- name: Restart SSH
  ansible.builtin.service:
    name: "{{ nginx_multisite_ssh_service }}"
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
