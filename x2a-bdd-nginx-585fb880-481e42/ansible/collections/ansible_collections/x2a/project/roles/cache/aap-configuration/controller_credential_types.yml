---
controller_credential_types:
  - name: Redis Authentication Password
    description: Password used to authenticate clients to the Redis instance listening on port 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Authentication password configured for the Redis requirepass directive. Store it in Ansible Vault or an approved external secret manager.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
