---
argument_specs:
  main:
    short_description: Configure a Redis cache service
    description:
      - Installs and configures standalone Redis through the approved Redis collection.
      - Creates the Redis log directory and validates the generated configuration.
    options:
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port used by the Redis instance.
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory for Redis log files.
      cache_redis_config_path:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to the Redis instance configuration.
      cache_redis_service_name:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis service managed by the approved collection.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the Redis password.
      redis_password:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
