---
- name: Validate required credential variables are defined
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI tutorial system packages
  ansible.builtin.package:  # noqa: R113 - package list comes from role defaults
    name: "{{ fastapi_tutorial_packages }}"
    state: present

- name: Create FastAPI tutorial application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path is a role default
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize FastAPI tutorial repository  # noqa: R104 - repository URL comes from role defaults and uses HTTPS
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repo }}"  # noqa: R106 - repository source comes from role defaults
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - destination is a role default
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment
  ansible.builtin.command:  # noqa: R101 - command path comes from role defaults
    cmd: python3 -m venv {{ fastapi_tutorial_venv_dir }}
    creates: "{{ fastapi_tutorial_venv_dir }}/bin/python" # noqa: R114 - path is a role default

- name: Install Python dependencies
  ansible.builtin.pip:  # noqa: R113 - dependency requirements are fixed by the role repository
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt"
    executable: "{{ fastapi_tutorial_venv_dir }}/bin/pip"

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the FastAPI PostgreSQL role exists  # noqa: L039 - credentials are validated role inputs
  ansible.builtin.shell:  # noqa: R101 - command uses validated role input
    cmd: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}'"
  become: true  # noqa: R108 - PostgreSQL role inspection requires the postgres account
  become_user: postgres
  register: fastapi_tutorial_db_role_check
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create FastAPI PostgreSQL role  # noqa: L039 - credentials are validated role inputs and the check is registered above
  ansible.builtin.shell:  # noqa: R101 - command uses validated role inputs
    cmd: psql -v ON_ERROR_STOP=1 -c "CREATE USER {{ db_username | quote }} WITH PASSWORD '{{ db_password | replace("'", "''") }}';"
  become: true  # noqa: R108 - PostgreSQL role creation requires the postgres account
  become_user: postgres
  when: fastapi_tutorial_db_role_check.stdout | trim != '1'
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the FastAPI PostgreSQL database exists  # noqa: L039 - database name is a validated role input
  ansible.builtin.shell:  # noqa: R101 - command uses validated role input
    cmd: psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'"
  become: true  # noqa: R108 - PostgreSQL database inspection requires the postgres account
  become_user: postgres
  register: fastapi_tutorial_database_check
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create FastAPI PostgreSQL database  # noqa: L039 - credentials are validated role inputs and the check is registered above
  ansible.builtin.shell:  # noqa: R101 - command uses validated role inputs
    cmd: psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE {{ database_name | quote }} OWNER {{ db_username | quote }};"
  become: true  # noqa: R108 - PostgreSQL database creation requires the postgres account
  become_user: postgres
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether the FastAPI database role has all privileges  # noqa: L039 - credentials are validated role inputs
  ansible.builtin.shell:  # noqa: R101 - command uses validated role inputs
    cmd: psql -tAc "SELECT has_database_privilege('{{ db_username }}', '{{ database_name }}', 'ALL')"
  become: true  # noqa: R108 - PostgreSQL privilege inspection requires the postgres account
  become_user: postgres
  register: fastapi_tutorial_privilege_check
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant FastAPI database privileges  # noqa: L039 - credentials are validated role inputs and the check is registered above
  ansible.builtin.shell:  # noqa: R101 - command uses validated role inputs
    cmd: psql -v ON_ERROR_STOP=1 -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name | quote }} TO {{ db_username | quote }};"
  become: true  # noqa: R108 - PostgreSQL privilege changes require the postgres account
  become_user: postgres
  when: fastapi_tutorial_privilege_check.stdout | trim | lower != 't'
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create FastAPI tutorial environment directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_env_file | dirname }}" # noqa: R114 - directory path is derived from a role default
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write FastAPI tutorial environment file
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_env_file }}" # noqa: R114 - path is a role default
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL={{ fastapi_tutorial_db_url }}
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI tutorial systemd unit
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_unit_file }}" # noqa: R114 - path is a role default
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_app_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Enable and start FastAPI tutorial
  ansible.builtin.systemd:
    name: "{{ fastapi_tutorial_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
