---
fastapi_tutorial_secure_logging: true
fastapi_tutorial_app_dir: /opt/fastapi-tutorial
fastapi_tutorial_venv_dir: /opt/fastapi-tutorial/venv
fastapi_tutorial_repo: https://github.com/dibanez/fastapi_tutorial.git
fastapi_tutorial_revision: main
fastapi_tutorial_packages:
  - python3
  - python3-pip
  - python3-venv
  - git
  - postgresql
  - postgresql-contrib
  - libpq-dev
fastapi_tutorial_db_host: localhost
fastapi_tutorial_db_url: postgresql://{{ db_username }}:{{ db_password }}@{{ fastapi_tutorial_db_host }}/{{ database_name }}
fastapi_tutorial_env_file: /opt/fastapi-tutorial/.env
fastapi_tutorial_unit_file: /etc/systemd/system/fastapi-tutorial.service
fastapi_tutorial_service_name: fastapi-tutorial
fastapi_tutorial_app_port: 8000
