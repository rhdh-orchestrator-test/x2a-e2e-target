---
controller_credential_types:
  - name: PostgreSQL Database
    description: Credentials for the FastAPI application's local PostgreSQL database, with the password migrated to Ansible Vault or another protected secret 
      source.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL username used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL user; currently hardcoded as fastapi_password and must be vaulted and rotated.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL connection; the source uses localhost.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application; the source uses fastapi_db.
      required:
        - db_username
        - db_password
        - db_host
        - db_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_host: !unsafe "{{ db_host }}"
        db_name: !unsafe "{{ db_name }}"
