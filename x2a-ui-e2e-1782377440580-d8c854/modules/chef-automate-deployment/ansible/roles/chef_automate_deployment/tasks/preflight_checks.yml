---
- name: Check if hostname is set correctly
  ansible.builtin.command:
    cmd: hostname
  register: current_hostname
  changed_when: false
- name: Verify hostname
  ansible.builtin.assert:
    that:
      - current_hostname.stdout == chef_automate_hostname
    fail_msg: Hostname is not set correctly. Expected {{ chef_automate_hostname }}, got {{ current_hostname.stdout }}
    success_msg: Hostname is set correctly to {{ chef_automate_hostname }}
- name: Check kernel parameter vm.max_map_count
  ansible.builtin.command:
    cmd: sysctl -n vm.max_map_count
  register: max_map_count
  changed_when: false
- name: Verify vm.max_map_count
  ansible.builtin.assert:
    that:
      - max_map_count.stdout | int == chef_automate_vm_max_map_count | int
    fail_msg: vm.max_map_count is not set correctly. Expected {{ chef_automate_vm_max_map_count }}, got {{ max_map_count.stdout }}
    success_msg: vm.max_map_count is set correctly to {{ max_map_count.stdout }}
- name: Check kernel parameter vm.dirty_expire_centisecs
  ansible.builtin.command:
    cmd: sysctl -n vm.dirty_expire_centisecs
  register: dirty_expire_centisecs
  changed_when: false
- name: Verify vm.dirty_expire_centisecs
  ansible.builtin.assert:
    that:
      - dirty_expire_centisecs.stdout | int == chef_automate_vm_dirty_expire_centisecs | int
    fail_msg: vm.dirty_expire_centisecs is not set correctly. Expected {{ chef_automate_vm_dirty_expire_centisecs }}, got {{ dirty_expire_centisecs.stdout }}
    success_msg: vm.dirty_expire_centisecs is set correctly to {{ dirty_expire_centisecs.stdout }}
- name: Check if Chef Automate is installed
  ansible.builtin.stat:
    path: /etc/chef-automate/config.toml
  register: chef_automate_config
- name: Verify Chef Automate installation
  ansible.builtin.assert:
    that:
      - chef_automate_config.stat.exists
    fail_msg: Chef Automate is not installed (config.toml not found)
    success_msg: Chef Automate is installed
- name: Check Chef Automate status
  ansible.builtin.command:
    cmd: chef-automate status
  register: chef_automate_status
  changed_when: false
  ignore_errors: true
- name: Check Chef Infra Server status
  ansible.builtin.command:
    cmd: chef-server-ctl status
  register: chef_server_status
  changed_when: false
  ignore_errors: true
- name: Check if user key file exists
  ansible.builtin.stat:
    path: "{{ chef_automate_userfilename }}"
  register: user_key_file
- name: Verify user key file
  ansible.builtin.assert:
    that:
      - user_key_file.stat.exists
    fail_msg: User key file {{ chef_automate_userfilename }} not found
    success_msg: User key file {{ chef_automate_userfilename }} exists
- name: Check if organization key file exists
  ansible.builtin.stat:
    path: "{{ chef_automate_orgfilename }}"
  register: org_key_file
- name: Verify organization key file
  ansible.builtin.assert:
    that:
      - org_key_file.stat.exists
    fail_msg: Organization key file {{ chef_automate_orgfilename }} not found
    success_msg: Organization key file {{ chef_automate_orgfilename }} exists
