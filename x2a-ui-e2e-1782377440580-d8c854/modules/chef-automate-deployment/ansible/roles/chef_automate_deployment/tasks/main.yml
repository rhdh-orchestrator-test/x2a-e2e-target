---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Deploy Chef Automate
  ansible.builtin.include_tasks: deploy_automate.yml
- name: Run preflight checks
  ansible.builtin.include_tasks: preflight_checks.yml
  when: chef_automate_run_preflight_checks | default(false) | bool
