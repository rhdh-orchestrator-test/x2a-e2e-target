---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure kernel parameters in sysctl.conf
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: ^{{ item.key }}=
    line: "{{ item.key }}={{ item.value }}"
    state: present
  loop:
    - key: vm.max_map_count
      value: "{{ chef_automate_vm_max_map_count }}"
    - key: vm.dirty_expire_centisecs
      value: "{{ chef_automate_vm_dirty_expire_centisecs }}"
  become: true
  notify: Apply sysctl settings
- name: Apply sysctl settings immediately
  ansible.builtin.command:
    cmd: sysctl -p
  become: true
  changed_when: false
