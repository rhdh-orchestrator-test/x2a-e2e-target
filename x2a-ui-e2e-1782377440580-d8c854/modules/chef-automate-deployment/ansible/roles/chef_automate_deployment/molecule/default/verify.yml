---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check system configuration
    - name: Check if hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file
      
    - name: Check sysctl.conf file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.conf
      register: sysctl_file

    - name: Assert sysctl.conf file was created
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
        fail_msg: "sysctl.conf file not found"
        success_msg: "sysctl.conf file exists"

    - name: Get sysctl.conf content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are set correctly
      ansible.builtin.assert:
        that:
          - sysctl_content.content | b64decode is search('vm.max_map_count=262144')
          - sysctl_content.content | b64decode is search('vm.dirty_expire_centisecs=20000')
        fail_msg: "sysctl parameters not set correctly"
        success_msg: "sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Check Chef Automate installation
    - name: Check Chef Automate config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config

    - name: Assert Chef Automate config file was created
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    - name: Get Chef Automate config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config_content
      when: chef_automate_config.stat.exists

    - name: Assert Chef Automate config contains expected content
      ansible.builtin.assert:
        that:
          - chef_automate_config_content.content | b64decode is search('automate = "enabled"')
          - chef_automate_config_content.content | b64decode is search('infra-server = "enabled"')
        fail_msg: "Chef Automate config does not contain expected content"
        success_msg: "Chef Automate config contains expected content"
      when: chef_automate_config.stat.exists

    # Check user and organization setup
    - name: Check user key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_key_file

    - name: Assert user key file was created
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
        fail_msg: "User key file not found"
        success_msg: "User key file exists"

    - name: Check organization key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_key_file

    - name: Assert organization key file was created
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
        fail_msg: "Organization key file not found"
        success_msg: "Organization key file exists"

    # The following checks would normally be performed but can't run in a container
    # They are tagged with molecule-notest
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: chef-automate status
      register: chef_automate_status
      changed_when: false
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: chef_server_status
      changed_when: false
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Infra Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server is not running"
        success_msg: "Chef Infra Server is running"
      tags: molecule-notest

    - name: Check Chef Automate UI
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
        status_code: 200
      register: chef_automate_ui
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Automate UI is accessible
      ansible.builtin.assert:
        that:
          - chef_automate_ui.status == 200
        fail_msg: "Chef Automate UI is not accessible"
        success_msg: "Chef Automate UI is accessible"
      tags: molecule-notest

    - name: Check Chef Infra Server API
      ansible.builtin.uri:
        url: https://localhost/organizations/lab
        validate_certs: false
        status_code: 401
      register: chef_infra_api
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Infra Server API is accessible
      ansible.builtin.assert:
        that:
          - chef_infra_api.status == 401
        fail_msg: "Chef Infra Server API is not accessible"
        success_msg: "Chef Infra Server API is accessible"
      tags: molecule-notest