---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache
    description:
      - Configures Apache SSL settings to disable vulnerable SSL protocols
      - Enforces TLSv1.2 only for SSL connections to address POODLE vulnerability
      - Restarts Apache and SSH services after configuration changes
    options:
      apache_ssl_protocols:
        type: str
        required: false
        default: -all +TLSv1.2
        description: SSL protocols to enable in Apache configuration
      apache_config_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file
      apache_service_name:
        type: str
        required: false
        default: apache2
        description: Name of Apache service to restart
      backup_config:
        type: bool
        required: false
        default: true
        description: Whether to backup configuration files before modification
