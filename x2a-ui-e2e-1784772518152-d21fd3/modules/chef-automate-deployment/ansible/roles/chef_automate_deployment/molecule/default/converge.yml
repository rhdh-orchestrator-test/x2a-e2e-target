- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    chef_automate_org_name: lab
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/usr/bin
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create max_map_count file
    ansible.builtin.copy:
      content: '262144'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '20000'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Mock'' '
      dest: /tmp/molecule_test/usr/bin/chef-automate
      mode: '0755'
  - name: Create Chef Server CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Server CLI Mock'' '
      dest: /tmp/molecule_test/usr/bin/chef-server-ctl
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK USER KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/jtonello.pem
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MOCK ORG VALIDATOR KEY -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/lab-validator.pem
      mode: '0600'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: "Service: automate-gateway\n  Status: running\nService: automate-postgresql\n  Status: running\nService: automate-elasticsearch\n  Status: running\nService:
        automate-ui\n  Status: running\n"
      dest: /tmp/molecule_test/chef-automate-status.txt
      mode: '0644'
  - name: Create Chef Server status file
    ansible.builtin.copy:
      content: 'run: postgresql: (pid 12345) 300s; run: log: (pid 12346) 300s

        run: bookshelf: (pid 12347) 300s; run: log: (pid 12348) 300s

        run: oc_bifrost: (pid 12349) 300s; run: log: (pid 12350) 300s

        run: oc_id: (pid 12351) 300s; run: log: (pid 12352) 300s

        run: opscode-erchef: (pid 12353) 300s; run: log: (pid 12354) 300s

        '
      dest: /tmp/molecule_test/chef-server-status.txt
      mode: '0644'
  - name: Create network listening file
    ansible.builtin.copy:
      content: 'tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/haproxy

        '
      dest: /tmp/molecule_test/network-listening.txt
      mode: '0644'
  - name: Create user list file
    ansible.builtin.copy:
      content: jtonello
      dest: /tmp/molecule_test/chef-user-list.txt
      mode: '0644'
  - name: Create org list file
    ansible.builtin.copy:
      content: lab
      dest: /tmp/molecule_test/chef-org-list.txt
      mode: '0644'
