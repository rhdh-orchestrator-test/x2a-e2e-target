---
- name: Validate required credential variables
  ansible.builtin.assert:
    that:
      - db_user | length > 0
      - db_name | length > 0
      - db_password | length > 0
      - secret_key | length > 0
    fail_msg: Database credentials and secret_key must be set.
    quiet: true
  no_log: "{{ app_stack_secure_logging }}"
