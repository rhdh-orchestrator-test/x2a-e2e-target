---
- name: Install Prometheus monitoring packages
  ansible.builtin.package:
    name:
      - prometheus-node-exporter
      - prometheus-pushgateway
    state: present
  when: app_stack_environment == 'production'

- name: Enable Prometheus node exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    enabled: true
    state: started
  when: app_stack_environment == 'production'

- name: Schedule application health check
  ansible.builtin.cron:
    name: test-app health check
    user: root
    minute: "*/2"
    job: /usr/local/bin/app-healthcheck.sh http://localhost:{{ app_port }}/health

- name: Schedule production metrics push
  ansible.builtin.cron:
    name: test-app push metrics
    user: "{{ app_user }}"
    minute: "*/5"
    job: /usr/local/bin/app-healthcheck.sh --push-metrics
  when: app_stack_environment == 'production'
