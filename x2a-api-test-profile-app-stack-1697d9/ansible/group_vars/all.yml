---
app_name: 'test-app'
app_repo: 'file:///tmp/test-app-repo'
app_revision: 'master'
app_port: 8000
app_dir: '/opt/test-app'
app_user: 'appuser'
app_group: 'appuser'
python_version: 'python3'
pip_packages: []
db_host: 'localhost'
db_port: 5432
db_name: 'testdb'
db_user: 'testuser'
db_password: 'test-db-password'
worker_count: 2
worker_class: 'sync'
max_requests: 1000
graceful_timeout: 30
log_dir: '/var/log/test-app'
log_level: 'info'
secret_key: 'test-secret-key'
log_max_size: '100M'
log_rotate_count: 7
app_stack_environment: 'staging'
