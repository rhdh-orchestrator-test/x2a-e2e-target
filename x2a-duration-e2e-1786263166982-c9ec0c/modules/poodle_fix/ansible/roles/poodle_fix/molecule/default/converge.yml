- name: Converge
  hosts: all
  gather_facts: true
  vars:
    apache_ssl_config_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    ssl_protocol_setting: -all +TLSv1.2
  tasks:
  - name: Create directory structure for Apache config
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create mock Apache SSL config file
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file for testing

        SSLEngine on

        SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem

        SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

        SSLProtocol all -SSLv3

        '
      dest: '{{ apache_ssl_config_path }}'
      mode: '0644'
  - name: Check if Apache SSL config file exists
    ansible.builtin.stat:
      path: '{{ apache_ssl_config_path }}'
    register: ssl_config_file
  - name: Fix SSL in Apache
    ansible.builtin.replace:
      dest: '{{ apache_ssl_config_path }}'
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol {{ ssl_protocol_setting }}
    when: ssl_config_file.stat.exists
