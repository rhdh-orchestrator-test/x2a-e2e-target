---
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: apache2
    state: present
  become: true
- name: Ensure SSH server is installed
  ansible.builtin.package:
    name: openssh-server
    state: present
  become: true
- name: Check if Apache SSL config file exists
  ansible.builtin.stat:
    path: "{{ apache_ssl_config_path }}"
  register: ssl_config_file
- name: Fix SSL in Apache
  ansible.builtin.replace:
    dest: "{{ apache_ssl_config_path }}"
    regexp: ^SSLProtocol.*$
    replace: SSLProtocol {{ ssl_protocol_setting }}
  notify:
    - Restart apache2
    - Restart sshd
  when: ssl_config_file.stat.exists
