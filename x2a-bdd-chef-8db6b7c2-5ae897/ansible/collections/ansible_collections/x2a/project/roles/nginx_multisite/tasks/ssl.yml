---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Generate self-signed certificates  # noqa: R101 - certificate paths and site identifiers come from role defaults and the role-defined sites list, not user input
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_ssl['id'] }}.key"
      - -out
      - "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_ssl['id'] }}.crt"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_ssl['id'] }}/emailAddress=admin@example.com
  when: item_nginx_ssl['ssl_enabled']
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_nginx_ssl
  notify: Reload nginx
  args:
    creates: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_ssl['id'] }}.crt"

- name: Set private key ownership and mode
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_key['id'] }}.key" # noqa: R114 - path from role-defined sites list
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  when: item_nginx_key['ssl_enabled']
  loop: "{{ nginx_multisite_sites }}"
  loop_control:
    loop_var: item_nginx_key
