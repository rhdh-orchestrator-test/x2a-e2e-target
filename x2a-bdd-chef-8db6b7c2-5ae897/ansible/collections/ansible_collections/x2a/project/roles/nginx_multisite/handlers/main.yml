---
- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Reload security sysctl
  ansible.builtin.command:
    argv:
      - sysctl
      - --system

- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
