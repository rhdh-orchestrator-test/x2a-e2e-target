---
- name: Include the external Redis role
  ansible.builtin.include_role:
    name: eloy.redis.redis # noqa: L038 - external Redis role is required, but its collection is not included in this codebase
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_version: "7.2"
    redis_install_method: package
    redis_port: 6379
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true
    redis_base_piddir: "{{ cache_redis_pid_dir }}"

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}" # noqa: R114 - path is a role default, not user input
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Remove migration-excluded Redis directives
  ansible.builtin.replace:
    path: "{{ cache_redis_config_path }}" # noqa: R114 - path is a role default, not user input
    regexp: ^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority).*$
    replace: ""

- name: Ensure Redis service is enabled and started
  ansible.builtin.service:
    name: redis
    enabled: true
    state: started
