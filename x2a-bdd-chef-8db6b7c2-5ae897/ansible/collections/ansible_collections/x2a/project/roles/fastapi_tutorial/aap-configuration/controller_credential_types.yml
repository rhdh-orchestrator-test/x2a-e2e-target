---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: PostgreSQL connection credential for the FastAPI application; the database password is currently hardcoded in the Chef recipe and must be 
      migrated to secured AAP credential storage.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the fastapi PostgreSQL role; source target variable is fastapi_db_password.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server, configured as localhost in the source.
        - id: db_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application, configured as fastapi_db in the source.
      required:
        - db_username
        - db_password
        - db_host
        - db_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_host: !unsafe "{{ db_host }}"
        db_name: !unsafe "{{ db_name }}"
