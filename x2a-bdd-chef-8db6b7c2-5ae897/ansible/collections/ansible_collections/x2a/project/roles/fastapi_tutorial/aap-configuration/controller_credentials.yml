---
controller_credentials:
  - name: PostgreSQL FastAPI Database - fastapi_tutorial
    description: PostgreSQL connection credential for the FastAPI application; the database password is currently hardcoded in the Chef recipe and must be 
      migrated to secured AAP credential storage.
    organization: Default
    credential_type: PostgreSQL FastAPI Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      db_host: "{{ db_host }}"
      db_name: "{{ db_name }}"
