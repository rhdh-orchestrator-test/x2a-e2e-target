---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install Fedora and RHEL packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Install Debian and other platform packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] not in ['RedHat', 'Fedora']

- name: Initialize PostgreSQL on Fedora and RHEL
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path from role defaults, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository # noqa: R104,R106 - repository URL comes from role defaults and uses a fixed HTTPS source
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path from role defaults, not user input
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command uses a path from role defaults
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_app_path }}/venv"
    creates: "{{ fastapi_tutorial_app_path }}/venv" # noqa: R114 - path from role defaults, not user input

- name: Install Python dependencies # noqa: R113 - requirements target is fixed within the role application directory
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_app_path }}/venv"
  notify: Restart fastapi tutorial service

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create PostgreSQL application user and database # noqa: R108 - PostgreSQL user and database management requires the postgres account
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"
  block:
    - name: Check whether the PostgreSQL application user exists # noqa: L039,R101 - credential variables are validated by the preceding included task and command arguments use them intentionally
      ansible.builtin.command:
        cmd: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}'"
      register: fastapi_tutorial_db_user_check
      changed_when: false
      failed_when: false

    - name: Create PostgreSQL application user # noqa: L039,R101 - credential variables are validated by the preceding included task and command arguments use them intentionally
      ansible.builtin.shell:
        cmd: psql -c "CREATE USER {{ db_username }} WITH PASSWORD '{{ db_password }}';"
        executable: /bin/bash
      when: fastapi_tutorial_db_user_check.stdout | trim != '1'

    - name: Check whether the PostgreSQL application database exists # noqa: L039,R101 - credential variables are validated by the preceding included task and command arguments use them intentionally
      ansible.builtin.command:
        cmd: psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ db_name }}'"
      register: fastapi_tutorial_db_check
      changed_when: false
      failed_when: false

    - name: Create PostgreSQL application database # noqa: L039,R101 - credential variables are validated by the preceding included task and command arguments use them intentionally
      ansible.builtin.command:
        cmd: createdb -O "{{ db_username }}" "{{ db_name }}"
      when: fastapi_tutorial_db_check.stdout | trim != '1'

    - name: Grant privileges on the PostgreSQL application database # noqa: L039,R101 - credential variables are validated by the preceding included task and command arguments use them intentionally
      ansible.builtin.command:
        cmd: psql -c "GRANT ALL PRIVILEGES ON DATABASE {{ db_name }} TO {{ db_username }};"
      when: fastapi_tutorial_db_check.stdout | trim == '1'
      changed_when: false

- name: Deploy application environment configuration # noqa: L039 - credential variables are validated by the preceding included task
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - path from role defaults, not user input
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}/{{ db_name }}
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart fastapi tutorial service
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Deploy FastAPI systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_app_path }}/venv/bin"
      ExecStart={{ fastapi_tutorial_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart fastapi tutorial service

- name: Reload systemd after deploying FastAPI unit
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: fastapi-tutorial
    state: started
    enabled: true
