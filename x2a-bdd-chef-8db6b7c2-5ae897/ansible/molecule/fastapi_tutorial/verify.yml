---
# Unsupported pre-flight checks: systemctl status/show diagnostics, journalctl output,
# configuration-value grep output, pip list output, and password-based database login
# have no stated result that can be verified safely here. The systemd-analyze and
# socket diagnostics are represented by supported module/assertion checks below.
- name: Verify FastAPI tutorial deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Collect service facts for application and PostgreSQL services
      ansible.builtin.service_facts:

    - name: Assert the FastAPI service is active and enabled
      ansible.builtin.assert:
        that:
          - "'fastapi-tutorial.service' in ansible_facts['services']"
          - ansible_facts['services']['fastapi-tutorial.service']['state'] == 'running'
          - ansible_facts['services']['fastapi-tutorial.service']['status'] == 'enabled'
        fail_msg: The fastapi-tutorial service is not active and enabled.

    - name: Assert PostgreSQL is active and enabled
      ansible.builtin.assert:
        that:
          - "'postgresql.service' in ansible_facts['services']"
          - ansible_facts['services']['postgresql.service']['state'] == 'running'
          - ansible_facts['services']['postgresql.service']['status'] == 'enabled'
        fail_msg: The PostgreSQL service is not active and enabled.

    - name: Check the application directory
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: item_app_directory

    - name: Assert the application directory exists
      ansible.builtin.assert:
        that:
          - item_app_directory['stat']['isdir']
        fail_msg: The application directory does not exist.

    - name: Check application files and executables
      ansible.builtin.stat:
        path: "{{ item_app_path }}"
      loop:
        - /opt/fastapi-tutorial/requirements.txt
        - /opt/fastapi-tutorial/.env
        - /opt/fastapi-tutorial/venv/bin/python
        - /opt/fastapi-tutorial/venv/bin/pip
        - /opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_app_path
      register: item_app_paths

    - name: Assert required application files and executables exist
      ansible.builtin.assert:
        that:
          - item_app_path_check['stat']['exists']
          - item_app_path_check['stat']['isreg']
          - >-
            (not (item_app_path_check['item'] is search('/venv/bin/')))
            or item_app_path_check['stat']['executable']
        fail_msg: A required application file or executable is missing.
      loop: "{{ item_app_paths['results'] }}"
      loop_control:
        loop_var: item_app_path_check

    - name: Wait for the FastAPI endpoint to accept connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8000
        state: started
        timeout: 30

    - name: Request the FastAPI endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8000
        method: GET
        return_content: false
        status_code: 100-599
      register: item_fastapi_response

    - name: Assert the FastAPI endpoint returned an HTTP response
      ansible.builtin.assert:
        that:
          - item_fastapi_response['status'] | int >= 100
          - item_fastapi_response['status'] | int <= 599
        fail_msg: The FastAPI endpoint did not return an HTTP response.

    - name: Check the systemd unit file
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: item_fastapi_unit

    - name: Assert required FastAPI systemd unit settings
      ansible.builtin.assert:
        that:
          - "'WorkingDirectory=/opt/fastapi-tutorial' in (item_fastapi_unit['content'] | b64decode)"
          - "'Environment=\"PATH=/opt/fastapi-tutorial/venv/bin\"' in (item_fastapi_unit['content'] | b64decode)"
          - >-
            'ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000'
            in (item_fastapi_unit['content'] | b64decode)
          - "'Restart=always' in (item_fastapi_unit['content'] | b64decode)"
        fail_msg: The FastAPI systemd unit is missing a required setting.

    - name: Verify the PostgreSQL role exists
      ansible.builtin.command:
        argv:
          - psql
          - -At
          - -d
          - postgres
          - -c
          - SELECT rolname FROM pg_roles WHERE rolname = 'fastapi';
      become: true
      become_user: postgres
      changed_when: false
      register: item_fastapi_role

    - name: Assert the fastapi PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - item_fastapi_role['stdout'] | trim == 'fastapi'
        fail_msg: The fastapi PostgreSQL role does not exist.

    - name: Verify the PostgreSQL database and owner
      ansible.builtin.command:
        argv:
          - psql
          - -At
          - -d
          - postgres
          - -c
          - >-
            SELECT datname || '|' || pg_catalog.pg_get_userbyid(datdba)
            FROM pg_database WHERE datname = 'fastapi_db';
      become: true
      become_user: postgres
      changed_when: false
      register: item_fastapi_database

    - name: Assert the fastapi_db database is owned by fastapi
      ansible.builtin.assert:
        that:
          - item_fastapi_database['stdout'] | trim == 'fastapi_db|fastapi'
        fail_msg: The fastapi_db database is missing or has the wrong owner.

    - name: Check Fedora/RHEL PostgreSQL initialization
      ansible.builtin.stat:
        path: /var/lib/pgsql/data/PG_VERSION
      register: item_pg_version
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Assert Fedora/RHEL PostgreSQL initialization exists
      ansible.builtin.assert:
        that:
          - item_pg_version['stat']['isreg']
        fail_msg: The Fedora/RHEL PostgreSQL PG_VERSION file is missing.
      when: ansible_facts['os_family'] == 'RedHat'
