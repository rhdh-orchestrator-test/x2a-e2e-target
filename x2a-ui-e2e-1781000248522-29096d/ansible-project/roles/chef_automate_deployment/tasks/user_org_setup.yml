---
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ chef_user_name }}  "{{ chef_user_fullname }}"  {{ chef_user_email }}  "{{ chef_user_password }}"  --filename {{ chef_user_key_file
      }}

      '
  args:
    creates: "{{ chef_user_key_file }}"
  become: true
  register: user_create_result
  changed_when: user_create_result.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_org_name }}  "{{ chef_org_fullname }}"  --association_user {{ chef_user_name }}  --filename {{ chef_org_validator_key_file
      }}

      '
  args:
    creates: "{{ chef_org_validator_key_file }}"
  become: true
  register: org_create_result
  changed_when: org_create_result.rc == 0
