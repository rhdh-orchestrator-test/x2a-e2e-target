---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    chef_user_name: "{{ chef_user_name | default('jtonello') }}"
    chef_org_name: "{{ chef_org_name | default('lab') }}"
  tasks:
    # System configuration checks
    - name: Check hostname configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == chef_automate_hostname | default('automate.chef.lab')
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Kernel parameter checks
    - name: Check vm.max_map_count kernel parameter
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_file

    - name: Assert max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
          - max_map_count_file.stat.isreg
        fail_msg: "max_map_count file not found"
        success_msg: "max_map_count file exists"

    - name: Get max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == chef_automate_vm_max_map_count | default('262144') | string
        fail_msg: "max_map_count not set correctly"
        success_msg: "max_map_count set correctly"
      when: max_map_count_file.stat.exists

    - name: Check vm.dirty_expire_centisecs kernel parameter
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_file

    - name: Assert dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_centisecs_file.stat.exists
          - dirty_expire_centisecs_file.stat.isreg
        fail_msg: "dirty_expire_centisecs file not found"
        success_msg: "dirty_expire_centisecs file exists"

    - name: Get dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_content
      when: dirty_expire_centisecs_file.stat.exists

    - name: Assert dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_centisecs_content.content | b64decode | trim) == chef_automate_vm_dirty_expire_centisecs | default('20000') | string
        fail_msg: "dirty_expire_centisecs not set correctly"
        success_msg: "dirty_expire_centisecs set correctly"
      when: dirty_expire_centisecs_file.stat.exists

    # Chef Automate CLI checks
    - name: Check Chef Automate CLI
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate deployment checks
    - name: Check Chef Automate deployment
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/sup
      register: chef_automate_deployment

    - name: Assert Chef Automate is deployed
      ansible.builtin.assert:
        that:
          - chef_automate_deployment.stat.exists
          - chef_automate_deployment.stat.isdir
        fail_msg: "Chef Automate deployment directory not found"
        success_msg: "Chef Automate deployment directory exists"

    # Service status checks (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.command:
        cmd: chef-automate status
      register: chef_automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    # Chef Infra Server status checks (tagged for skipping in container)
    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: chef_server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server is not running"
        success_msg: "Chef Infra Server is running"
      tags: molecule-notest

    # User and organization key file checks
    - name: Check user key file
      ansible.builtin.stat:
        path: "/tmp/molecule_test/home/ansible/{{ chef_user_name }}.pem"
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.isreg
          - user_key_file.stat.mode == '0600'
        fail_msg: "User key file not found or has incorrect permissions"
        success_msg: "User key file exists with correct permissions"

    - name: Check organization validator key file
      ansible.builtin.stat:
        path: "/tmp/molecule_test/home/ansible/{{ chef_org_name }}-validator.pem"
      register: org_validator_key_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_validator_key_file.stat.exists
          - org_validator_key_file.stat.isreg
          - org_validator_key_file.stat.mode == '0600'
        fail_msg: "Organization validator key file not found or has incorrect permissions"
        success_msg: "Organization validator key file exists with correct permissions"

    # Network checks (tagged for skipping in container)
    - name: Check HTTPS port
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      register: https_port
      failed_when: false
      tags: molecule-notest

    - name: Assert HTTPS port is listening
      ansible.builtin.assert:
        that:
          - https_port is succeeded
        fail_msg: "HTTPS port 443 is not listening"
        success_msg: "HTTPS port 443 is listening"
      tags: molecule-notest

    # API health check (tagged for skipping in container)
    - name: Check Chef Automate API health
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
        status_code: 200
      register: api_health
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate API is healthy
      ansible.builtin.assert:
        that:
          - api_health is succeeded
        fail_msg: "Chef Automate API health check failed"
        success_msg: "Chef Automate API is healthy"
      tags: molecule-notest