---
argument_specs:
  main:
    short_description: Configure an authenticated Redis cache service
    description:
      - Installs and configures a standalone Redis instance on the requested port.
      - Creates the Redis log directory and removes unsupported replication directives.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the Redis password.
      redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port used by Redis.
      redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis cluster mode is enabled.
      redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis Sentinel mode is enabled.
      redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis replication is enabled.
      redis_config_path:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration file to clean up.
      redis_log_path:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
