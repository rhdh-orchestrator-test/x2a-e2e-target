- name: Converge
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    password: password
    full_name: John Tonello
    email: jtonello@chef.lab
    chef_automate_hostname: automate.chef.lab
    chef_org_name: lab
    chef_org_long_name: Chef Lab
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
    chef_user_key_path: /tmp/molecule_test/jtonello.pem
    chef_org_key_path: /tmp/molecule_test/lab-validator.pem
  tasks:
  - name: Create required directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/var/log/chef-automate
    - /tmp/molecule_test/var/opt/chef-server
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl configuration files
    ansible.builtin.copy:
      content: '{{ item.key }} = {{ item.value }}'
      dest: /tmp/molecule_test/etc/{{ item.key | replace('.', '_') }}.conf
      mode: '0644'
    loop:
    - key: vm.max_map_count
      value: 262144
    - key: vm.dirty_expire_centisecs
      value: 20000
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI Simulation'''
      dest: '{{ chef_automate_cli_path }}'
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab/sup
      state: directory
      mode: '0755'
  - name: Create Chef Automate status file
    ansible.builtin.copy:
      content: "Service: chef-automate\nStatus: running\nProducts:\n  - automate\n  - infra-server\n"
      dest: /tmp/molecule_test/var/log/chef-automate/status.log
      mode: '0644'
  - name: Create Chef Server status file
    ansible.builtin.copy:
      content: 'Service: chef-server

        Status: running

        '
      dest: /tmp/molecule_test/var/opt/chef-server/status.log
      mode: '0644'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA...SIMULATED_KEY_CONTENT...

        -----END RSA PRIVATE KEY-----

        '
      dest: '{{ chef_user_key_path }}'
      mode: '0600'
  - name: Create organization key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA...SIMULATED_ORG_KEY_CONTENT...

        -----END RSA PRIVATE KEY-----

        '
      dest: '{{ chef_org_key_path }}'
      mode: '0600'
  - name: Create user list file
    ansible.builtin.copy:
      content: 'jtonello

        admin

        '
      dest: /tmp/molecule_test/var/opt/chef-server/user-list.txt
      mode: '0644'
  - name: Create organization list file
    ansible.builtin.copy:
      content: 'lab

        chef

        '
      dest: /tmp/molecule_test/var/opt/chef-server/org-list.txt
      mode: '0644'
  - name: Create service status files
    ansible.builtin.copy:
      content: "● chef-automate.service - Chef Automate\n   Loaded: loaded (/etc/systemd/system/chef-automate.service; enabled; vendor preset: enabled)\n   Active:
        active (running) since Wed 2023-01-01 00:00:00 UTC; 1h ago\n"
      dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      mode: '0644'
  - name: Create network ports file
    ansible.builtin.copy:
      content: 'tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      1234/chef-automate

        '
      dest: /tmp/molecule_test/var/log/netstat.txt
      mode: '0644'
