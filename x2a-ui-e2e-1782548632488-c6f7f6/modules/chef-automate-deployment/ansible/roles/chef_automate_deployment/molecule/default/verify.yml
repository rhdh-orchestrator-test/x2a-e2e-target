---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    chef_org_name: lab
  tasks:
    # System configuration checks
    - name: Check hostname configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Kernel parameter checks
    - name: Check vm.max_map_count configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/vm_max_map_count.conf
      register: max_map_count_file

    - name: Assert vm.max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
        fail_msg: "vm.max_map_count configuration not found"
        success_msg: "vm.max_map_count configuration exists"

    - name: Get vm.max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/vm_max_map_count.conf
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "vm.max_map_count = 262144"
        fail_msg: "vm.max_map_count not set correctly"
        success_msg: "vm.max_map_count set correctly"
      when: max_map_count_file.stat.exists

    - name: Check vm.dirty_expire_centisecs configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/vm_dirty_expire_centisecs.conf
      register: dirty_expire_file

    - name: Assert vm.dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_file.stat.exists
        fail_msg: "vm.dirty_expire_centisecs configuration not found"
        success_msg: "vm.dirty_expire_centisecs configuration exists"

    - name: Get vm.dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/vm_dirty_expire_centisecs.conf
      register: dirty_expire_content
      when: dirty_expire_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_content.content | b64decode | trim) == "vm.dirty_expire_centisecs = 20000"
        fail_msg: "vm.dirty_expire_centisecs not set correctly"
        success_msg: "vm.dirty_expire_centisecs set correctly"
      when: dirty_expire_file.stat.exists

    # Chef Automate CLI check
    - name: Check Chef Automate CLI
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate deployment check
    - name: Check Chef Automate deployment
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/sup
      register: chef_automate_deploy

    - name: Assert Chef Automate is deployed
      ansible.builtin.assert:
        that:
          - chef_automate_deploy.stat.exists
          - chef_automate_deploy.stat.isdir
        fail_msg: "Chef Automate deployment not found"
        success_msg: "Chef Automate deployment exists"

    # Chef Automate status check
    - name: Check Chef Automate status file
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/chef-automate/status.log
      register: chef_automate_status

    - name: Assert Chef Automate status file exists
      ansible.builtin.assert:
        that:
          - chef_automate_status.stat.exists
        fail_msg: "Chef Automate status file not found"
        success_msg: "Chef Automate status file exists"

    # Chef Server status check
    - name: Check Chef Server status file
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server/status.log
      register: chef_server_status

    - name: Assert Chef Server status file exists
      ansible.builtin.assert:
        that:
          - chef_server_status.stat.exists
        fail_msg: "Chef Server status file not found"
        success_msg: "Chef Server status file exists"

    # User creation check
    - name: Check user key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_key

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key.stat.exists
          - user_key.stat.size > 0
        fail_msg: "User key file not found or empty"
        success_msg: "User key file exists"

    # Organization creation check
    - name: Check organization key file
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_key

    - name: Assert organization key file exists
      ansible.builtin.assert:
        that:
          - org_key.stat.exists
          - org_key.stat.size > 0
        fail_msg: "Organization key file not found or empty"
        success_msg: "Organization key file exists"

    # User list check
    - name: Check user list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server/user-list.txt
      register: user_list

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef-server/user-list.txt
      register: user_list_content
      when: user_list.stat.exists

    - name: Assert user exists in list
      ansible.builtin.assert:
        that:
          - "'jtonello' in (user_list_content.content | b64decode)"
        fail_msg: "User jtonello not found in user list"
        success_msg: "User jtonello found in user list"
      when: user_list.stat.exists

    # Organization list check
    - name: Check organization list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-server/org-list.txt
      register: org_list

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef-server/org-list.txt
      register: org_list_content
      when: org_list.stat.exists

    - name: Assert organization exists in list
      ansible.builtin.assert:
        that:
          - "'lab' in (org_list_content.content | b64decode)"
        fail_msg: "Organization lab not found in organization list"
        success_msg: "Organization lab found in organization list"
      when: org_list.stat.exists

    # Service status check (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "ansible_facts.services['chef-automate.service'].state == 'running'"
        fail_msg: "Chef Automate service not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    # Network port check (tagged for skipping in container)
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      tags: molecule-notest

    # API accessibility check (tagged for skipping in container)
    - name: Check Chef Automate UI accessibility
      ansible.builtin.uri:
        url: https://localhost/api/v0/auth/version
        validate_certs: false
        status_code: 200
      tags: molecule-notest

    - name: Check Chef Infra Server API accessibility
      ansible.builtin.uri:
        url: https://localhost/organizations/lab
        validate_certs: false
        status_code: 200
      tags: molecule-notest