---
- name: Ensure Chef Automate CLI directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}"
    state: directory
    mode: "0755"
  become: false
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "./chef-automate deploy {% for product in chef_automate_products %} --product {{ product }} {% endfor %} --accept-terms-and-mlsa={{ chef_automate_accept_terms
      | lower }} "
    chdir: "{{ ansible_env.HOME }}"
    creates: /hab
  become: true
  register: chef_automate_deploy
  changed_when: chef_automate_deploy.rc == 0
- name: Wait for Chef Automate services to be fully operational
  ansible.builtin.pause:
    seconds: 30
  when: chef_automate_deploy.changed
