---
- name: Ensure directory exists for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_key_path }}"
    - "{{ chef_org_key_path }}"
  when: chef_user_key_path | dirname != '' or chef_org_key_path | dirname != ''
- name: Create Chef Infra Server user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_user_key_path }}
  become: true
  args:
    creates: "{{ chef_user_key_path }}"
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
- name: Create Chef Infra Server organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_long_name }}" --association_user {{ username }} --filename {{ chef_org_key_path }}
  become: true
  args:
    creates: "{{ chef_org_key_path }}"
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
