- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache mods-available
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create mock Apache SSL configuration file
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        # Original line that will be replaced by the role

        SSLProtocol all -SSLv3


        # Other SSL configuration settings

        SSLHonorCipherOrder on

        SSLCipherSuite HIGH:!aNULL:!MD5

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Apply poodle_fix role with modified path
    ansible.builtin.include_tasks: ../../tasks/molecule_tasks.yml
