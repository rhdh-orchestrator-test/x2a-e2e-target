---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Verify Apache configuration files
    - name: Check Apache virtual host config exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
      register: vhost_config

    - name: Assert virtual host config exists
      ansible.builtin.assert:
        that:
          - vhost_config.stat.exists
          - vhost_config.stat.size > 0
        fail_msg: "Virtual host config file not found"
        success_msg: "Virtual host config file exists"

    - name: Check virtual host is enabled
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
      register: enabled_site

    - name: Assert virtual host is enabled
      ansible.builtin.assert:
        that:
          - enabled_site.stat.exists
          - enabled_site.stat.islnk
        fail_msg: "Virtual host is not enabled"
        success_msg: "Virtual host is enabled"

    # Verify SSL configuration
    - name: Check SSL config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_config

    - name: Assert SSL config file exists
      ansible.builtin.assert:
        that:
          - ssl_config.stat.exists
          - ssl_config.stat.size > 0
        fail_msg: "SSL config file not found"
        success_msg: "SSL config file exists"

    - name: Get SSL config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      register: ssl_config_content

    - name: Assert POODLE fix is applied
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in ssl_config_content['content'] | b64decode"
        fail_msg: "POODLE fix not applied in SSL config"
        success_msg: "POODLE fix correctly applied"

    # Verify certificate files
    - name: Check certificate files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: cert_files
      loop:
        - /tmp/molecule_test/etc/apache2/certs/apache.key
        - /tmp/molecule_test/etc/apache2/certs/apache.crt
        - /tmp/molecule_test/etc/apache2/certs/apache.csr

    - name: Assert certificate files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Certificate file {{ item.item }} not found"
        success_msg: "Certificate file {{ item.item }} exists"
      loop: "{{ cert_files.results }}"

    # Verify web content
    - name: Check web content directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/www/helloworld
      register: web_dir

    - name: Assert web content directory exists
      ansible.builtin.assert:
        that:
          - web_dir.stat.exists
          - web_dir.stat.isdir
        fail_msg: "Web content directory not found"
        success_msg: "Web content directory exists"

    - name: Check index.html exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/www/helloworld/index.html
      register: index_file

    - name: Assert index.html exists
      ansible.builtin.assert:
        that:
          - index_file.stat.exists
          - index_file.stat.size > 0
        fail_msg: "index.html not found"
        success_msg: "index.html exists"

    - name: Get index.html content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/www/helloworld/index.html
      register: index_content

    - name: Assert index.html contains expected content
      ansible.builtin.assert:
        that:
          - "'Hello, world!' in index_content['content'] | b64decode"
        fail_msg: "index.html does not contain expected content"
        success_msg: "index.html contains expected content"

    # Verify SSH configuration (for compliance)
    - name: Check SSH config exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_config

    - name: Assert SSH config exists
      ansible.builtin.assert:
        that:
          - ssh_config.stat.exists
          - ssh_config.stat.size > 0
        fail_msg: "SSH config file not found"
        success_msg: "SSH config file exists"

    - name: Get SSH config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_config_content

    - name: Assert root login is disabled
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in ssh_config_content['content'] | b64decode"
        fail_msg: "SSH root login is not properly disabled"
        success_msg: "SSH root login is properly disabled"

    # Service checks (tagged to be skipped in container)
    - name: Check Apache service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Apache service is running
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
          - "ansible_facts.services['apache2.service'].state == 'running'"
        fail_msg: "Apache service is not running"
        success_msg: "Apache service is running"
      tags: molecule-notest

    - name: Check HTTPS port is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      tags: molecule-notest

    - name: Check HTTPS response
      ansible.builtin.uri:
        url: https://localhost/
        validate_certs: false
        return_content: true
      register: https_response
      tags: molecule-notest

    - name: Assert HTTPS response is correct
      ansible.builtin.assert:
        that:
          - https_response.status == 200
          - "'Hello, world!' in https_response.content"
        fail_msg: "HTTPS response is not correct"
        success_msg: "HTTPS response is correct"
      tags: molecule-notest