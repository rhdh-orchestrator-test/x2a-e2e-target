---
apache_version: 2.4.41-4ubuntu3.10
apache_cert_dir: /etc/apache2/certs
apache_cert_file: "{{ apache_cert_dir }}/apache.crt"
apache_key_file: "{{ apache_cert_dir }}/apache.key"
apache_csr_file: "{{ apache_cert_dir }}/apache.csr"
website_name: helloworld
website_document_root: /var/www/{{ website_name }}
website_port: 443
ssl_protocol: -all +TLSv1.2
