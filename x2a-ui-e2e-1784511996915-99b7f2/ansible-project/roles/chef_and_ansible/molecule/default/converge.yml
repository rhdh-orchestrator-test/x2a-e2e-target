---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/apache2/certs
        - /tmp/molecule_test/etc/apache2/sites-available
        - /tmp/molecule_test/etc/apache2/sites-enabled
        - /tmp/molecule_test/etc/apache2/mods-available
        - /tmp/molecule_test/var/www/helloworld
        - /tmp/molecule_test/etc/ssh

    # Create mock certificate files
    - name: Create mock certificate files
      ansible.builtin.copy:
        content: "# Mock certificate content"
        dest: "{{ item }}"
        mode: "0640"
      loop:
        - /tmp/molecule_test/etc/apache2/certs/apache.key
        - /tmp/molecule_test/etc/apache2/certs/apache.crt
        - /tmp/molecule_test/etc/apache2/certs/apache.csr

    # Create Apache virtual host config
    - name: Create Apache virtual host config
      ansible.builtin.copy:
        content: |
          <VirtualHost *:443>
           DocumentRoot "/var/www/helloworld"
           SSLEngine on
           SSLCertificateFile /etc/apache2/certs/apache.crt
           SSLCertificateKeyFile /etc/apache2/certs/apache.key
            <Directory "/var/www/helloworld">
              allow from all
              Options None
              Require all granted
            </Directory>
          </VirtualHost>
        dest: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
        mode: "0640"

    # Create symlink for enabled site
    - name: Create symlink for enabled site
      ansible.builtin.file:
        src: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
        dest: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
        state: link

    # Create index.html
    - name: Create index.html
      ansible.builtin.copy:
        content: |
          <html>
            <head>
              <title>Website Test</title>
            </head>
            <body>
              <p>Hello, world!</p>
          </html>
        dest: /tmp/molecule_test/var/www/helloworld/index.html
        mode: "0644"

    # Create SSL config with POODLE fix
    - name: Create SSL config with POODLE fix
      ansible.builtin.copy:
        content: |
          # Mock SSL config file
          SSLProtocol -all +TLSv1.2
          # Other SSL settings would go here
        dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
        mode: "0644"

    # Create mock SSH config for compliance testing
    - name: Create mock SSH config
      ansible.builtin.copy:
        content: |
          # Mock SSH config file
          PermitRootLogin no
          Protocol 2
          HostbasedAuthentication no
          IgnoreRhosts yes
        dest: /tmp/molecule_test/etc/ssh/sshd_config
        mode: "0644"