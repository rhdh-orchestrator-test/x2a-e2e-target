---
- name: Verify SSH Configuration
  hosts: all
  gather_facts: false
  tasks:
    # Verify SSH configuration for compliance
    - name: Check SSH config exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_config

    - name: Assert SSH config exists
      ansible.builtin.assert:
        that:
          - ssh_config.stat.exists
          - ssh_config.stat.size > 0
        fail_msg: "SSH config file not found"
        success_msg: "SSH config file exists"

    - name: Get SSH config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/ssh/sshd_config
      register: ssh_config_content
      when: ssh_config.stat.exists

    - name: Assert root login is disabled
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in ssh_config_content['content'] | b64decode"
        fail_msg: "SSH root login is not properly disabled"
        success_msg: "SSH root login is properly disabled"
      when: ssh_config.stat.exists

    - name: Assert Protocol 2 is configured
      ansible.builtin.assert:
        that:
          - "'Protocol 2' in ssh_config_content['content'] | b64decode"
        fail_msg: "SSH Protocol 2 is not configured"
        success_msg: "SSH Protocol 2 is properly configured"
      when: ssh_config.stat.exists

    - name: Assert HostbasedAuthentication is disabled
      ansible.builtin.assert:
        that:
          - "'HostbasedAuthentication no' in ssh_config_content['content'] | b64decode"
        fail_msg: "SSH HostbasedAuthentication is not properly disabled"
        success_msg: "SSH HostbasedAuthentication is properly disabled"
      when: ssh_config.stat.exists

    - name: Assert IgnoreRhosts is enabled
      ansible.builtin.assert:
        that:
          - "'IgnoreRhosts yes' in ssh_config_content['content'] | b64decode"
        fail_msg: "SSH IgnoreRhosts is not properly enabled"
        success_msg: "SSH IgnoreRhosts is properly enabled"
      when: ssh_config.stat.exists

    # Service checks (tagged to be skipped in container)
    - name: Check SSH service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert SSH service is running
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services"
          - "ansible_facts.services['sshd.service'].state == 'running'"
        fail_msg: "SSH service is not running"
        success_msg: "SSH service is running"
      tags: molecule-notest