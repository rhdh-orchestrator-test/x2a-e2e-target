# Unsupported pre-flight checks: service names and the Memcached configuration path are
# dependency-specific placeholders; no discovered values were supplied. UDP listening,
# configured Memcached values/process details, authenticated Redis PING (no secret variable
# was supplied), and attribution of failed systemd units are therefore not checked.
---
- name: Verify Memcached instance memcached
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Memcached TCP port 11211
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 11211
        state: started
        timeout: 2

    - name: Request the Memcached version
      ansible.builtin.command:
        argv:
          - nc
          - -w
          - "2"
          - 127.0.0.1
          - "11211"
        stdin: "version\r\n"
        stdin_add_newline: false
      register: memcached_version
      changed_when: false

    - name: Assert that Memcached returns a VERSION response
      ansible.builtin.assert:
        that:
          - memcached_version.stdout is regex('(?m)^VERSION\\s+')
        fail_msg: Memcached did not return a VERSION response.

- name: Verify Redis instance 6379
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Redis TCP port 6379
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6379
        state: started
        timeout: 2

    - name: Check the Redis configuration file
      ansible.builtin.stat:
        path: /etc/redis/6379.conf
      register: redis_config_file

    - name: Assert that the Redis configuration file exists
      ansible.builtin.assert:
        that:
          - redis_config_file.stat.exists
          - redis_config_file.stat.isreg
        fail_msg: The Redis configuration file is missing.

    - name: Read the Redis configuration
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config

    - name: Assert that Redis authentication is configured
      ansible.builtin.assert:
        that:
          - redis_config.content | b64decode is regex('(?m)^requirepass\\s+[^\\s]+')
        fail_msg: Redis does not contain a requirepass directive.

    - name: Assert that replication directives are absent from Redis configuration
      ansible.builtin.assert:
        that:
          - redis_config.content | b64decode is not regex('(?m)^(replica-serve-stale-data|replica-read-only|repl-ping-replica-period|client-output-buffer-limit|replica-priority)')
        fail_msg: A removed replication directive is present in the Redis configuration.

    - name: Check the Redis PID directory
      ansible.builtin.stat:
        path: /run/redis
      register: redis_pid_directory

    - name: Assert that the Redis PID directory exists
      ansible.builtin.assert:
        that:
          - redis_pid_directory.stat.exists
          - redis_pid_directory.stat.isdir
        fail_msg: The Redis PID directory is missing.

    - name: Check unauthenticated Redis access
      ansible.builtin.command:
        argv:
          - redis-cli
          - -p
          - "6379"
          - PING
      register: redis_unauthenticated_ping
      changed_when: false

    - name: Assert that unauthenticated Redis access is rejected
      ansible.builtin.assert:
        that:
          - (redis_unauthenticated_ping.stdout ~ redis_unauthenticated_ping.stderr) is search('(?i)(noauth|authentication required|auth required)')
        fail_msg: Redis accepted an unauthenticated PING.

- name: Verify the Redis log directory
  hosts: all
  gather_facts: false
  tasks:
    - name: Check the Redis log directory
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_directory

    - name: Assert Redis log directory ownership and mode
      ansible.builtin.assert:
        that:
          - redis_log_directory.stat.exists
          - redis_log_directory.stat.isdir
          - redis_log_directory.stat.pw_name == 'redis'
          - redis_log_directory.stat.gr_name == 'redis'
          - redis_log_directory.stat.mode == '0755'
        fail_msg: The Redis log directory does not have the expected attributes.
