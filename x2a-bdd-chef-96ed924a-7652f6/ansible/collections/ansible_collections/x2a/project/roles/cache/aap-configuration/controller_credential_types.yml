---
controller_credential_types:
  - name: Redis Authentication
    description: Hardcoded Redis password from the Chef cache recipe; migrate the value to an AAP credential or approved secret-management system.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required to authenticate to the Redis instance listening on port 6379.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
