---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml

- name: Configure standalone Redis  # noqa: L038 - external eloy.redis role is required but is not available in this collection
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_version: "7.2"
    redis_port: 6379
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_rdb_enabled: true
    redis_aof_enabled: false

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Check whether the Redis configuration exists
  ansible.builtin.stat:
    path: /etc/redis/6379.conf
  register: cache_redis_config

- name: Remove incompatible Redis replication directives  # noqa: L039 - cache_redis_config is registered by the preceding stat task
  ansible.builtin.replace:
    path: /etc/redis/6379.conf
    regexp: "{{ item_cache_directive }}"
    replace: ""
    create: false
  when: cache_redis_config.stat.exists
  loop:
    - ^replica-serve-stale-data.*$
    - ^replica-read-only.*$
    - ^repl-ping-replica-period.*$
    - ^client-output-buffer-limit.*$
    - ^replica-priority.*$
  loop_control:
    loop_var: item_cache_directive
  notify: Restart Redis
