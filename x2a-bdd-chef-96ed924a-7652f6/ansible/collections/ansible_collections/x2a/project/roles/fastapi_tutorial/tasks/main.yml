---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI and PostgreSQL packages on RedHat-family systems
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install FastAPI and PostgreSQL packages on Debian-family systems
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] != 'RedHat'

- name: Initialize PostgreSQL on RedHat-family systems
  ansible.builtin.command:
    argv:
      - postgresql-setup
      - --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] == 'RedHat'

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize FastAPI tutorial repository  # noqa: R104 - repository URL is HTTPS in role defaults
  ansible.builtin.git:  # noqa: R106 - repository source is a trusted role default
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - destination is from role defaults
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - application path comes from trusted role defaults
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_app_path }}/venv"
    creates: "{{ fastapi_tutorial_app_path }}/venv" # noqa: R114 - path is from role defaults

- name: Install application Python dependencies  # noqa: R113 - requirements path comes from trusted role defaults
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt"
    virtualenv: "{{ fastapi_tutorial_app_path }}/venv" # noqa: R114 - path is from role defaults

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Create PostgreSQL application user  # noqa: L039 - database credentials are validated by the preceding task
  ansible.builtin.shell:  # noqa: R101 - command arguments use validated role input
    cmd: |
      psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '{{ db_username }}') THEN
        CREATE ROLE {{ db_username }} LOGIN PASSWORD '{{ db_password }}';
      ELSE
        ALTER ROLE {{ db_username }} WITH PASSWORD '{{ db_password }}';
      END IF;
      END \$\$;"
  become: true # noqa: R108 - PostgreSQL administration requires the postgres account
  become_user: postgres
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL application database  # noqa: L039 - database credentials are validated by the preceding task
  ansible.builtin.shell:  # noqa: R101 - command arguments use validated role input
    cmd: |
      psql -v ON_ERROR_STOP=1 -c "SELECT 'CREATE DATABASE {{ database_name }} OWNER {{ db_username }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ database_name }}')\gexec"
  become: true # noqa: R108 - PostgreSQL administration requires the postgres account
  become_user: postgres
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant PostgreSQL database privileges  # noqa: L039 - database credentials are validated by the preceding task
  ansible.builtin.shell:  # noqa: R101 - command arguments use validated role input
    cmd: >-
      psql -v ON_ERROR_STOP=1 -c
      "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ db_username }};"
  become: true # noqa: R108 - PostgreSQL administration requires the postgres account
  become_user: postgres
  changed_when: false
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write application environment configuration  # noqa: L039 - database credentials are validated by the preceding task
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - path is from role defaults
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ database_host }}:{{ database_port }}/{{ database_name }}
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_app_path }}/venv/bin"
      ExecStart={{ fastapi_tutorial_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Enable and start FastAPI service
  ansible.builtin.systemd:
    name: fastapi-tutorial.service
    enabled: true
    state: started
    daemon_reload: true
