---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials and connection details for the FastAPI application's PostgreSQL database, currently hardcoded in the Chef recipe and application 
      environment file.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL user used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL user; currently hardcoded as fastapi_password.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname used to connect to PostgreSQL.
        - id: database_port
          type: string
          label: Database Port
          help_text: TCP port used to connect to PostgreSQL.
      required:
        - db_username
        - db_password
        - database_name
        - database_host
        - database_port
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
        database_port: !unsafe "{{ database_port }}"
