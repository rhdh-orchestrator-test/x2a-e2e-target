---
controller_credentials:
  - name: Chef Encrypted Data Bag Nginx Site Token - nginx_multisite
    description: Secret token stored in the Chef encrypted data bag item nginx_secrets/site and written to the local Nginx secret file.
    organization: Default
    credential_type: Chef Encrypted Data Bag Nginx Site Token
    update_secrets: true
    inputs:
      site_token: "{{ vault_site_token }}"
  - name: Nginx TLS Private Key - nginx_multisite
    description: TLS private key used by Nginx HTTPS virtual hosts; the source generates it locally with OpenSSL.
    organization: Default
    credential_type: Nginx TLS Private Key
    update_secrets: true
    inputs:
      nginx_tls_private_key: "{{ vault_nginx_tls_private_key }}"
  - name: Nginx TLS Certificate - nginx_multisite
    description: Self-signed TLS certificate used by Nginx HTTPS virtual hosts; the source generates it locally with OpenSSL.
    organization: Default
    credential_type: Nginx TLS Certificate
    update_secrets: true
    inputs:
      nginx_tls_certificate: "{{ nginx_tls_certificate }}"
