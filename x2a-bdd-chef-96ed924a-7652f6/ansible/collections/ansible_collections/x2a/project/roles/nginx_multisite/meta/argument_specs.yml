---
argument_specs:
  main:
    short_description: Configure a secure nginx multi-site web server
    description:
      - Installs and configures nginx, fail2ban, firewall rules, SSH hardening, and virtual hosts.
    options:
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory containing TLS certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory containing TLS private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban protection is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether root SSH login is disabled.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is permitted.
      nginx_multisite_sites:
        type: dict
        required: false
        default: {}
        description: Mapping of virtual host names to site configuration values.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks handling sensitive credentials.
      site_token:
        type: str
        required: true
        description: Token injected by an AAP credential type.
      nginx_tls_private_key:
        type: str
        required: true
        description: TLS private key injected by an AAP credential type.
      nginx_tls_certificate:
        type: str
        required: true
        description: TLS certificate injected by an AAP credential type.
