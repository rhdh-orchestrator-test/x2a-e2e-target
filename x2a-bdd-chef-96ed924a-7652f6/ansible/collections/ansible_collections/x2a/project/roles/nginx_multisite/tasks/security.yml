---
- name: Install security packages
  ansible.builtin.package:
    name: "{{ ['ufw'] + (['fail2ban'] if nginx_multisite_fail2ban_enabled else []) }}"
    state: present

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Deploy fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Check UFW status
  ansible.builtin.command:
    cmd: ufw status verbose
  register: nginx_multisite_ufw_status
  changed_when: false
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default incoming policy # noqa: L039 - nginx_multisite_ufw_status is registered by the preceding status check
  ansible.builtin.command:
    cmd: ufw --force default deny
  changed_when: true
  when:
    - nginx_multisite_ufw_enabled
    - "'Default: deny (incoming)' not in nginx_multisite_ufw_status.stdout"

- name: Allow SSH through UFW # noqa: L039 - nginx_multisite_ufw_status is registered by the preceding status check
  ansible.builtin.command:
    cmd: ufw allow 22/tcp
  changed_when: true
  when:
    - nginx_multisite_ufw_enabled
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTP through UFW # noqa: L039 - nginx_multisite_ufw_status is registered by the preceding status check
  ansible.builtin.command:
    cmd: ufw allow 80/tcp
  changed_when: true
  when:
    - nginx_multisite_ufw_enabled
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Allow HTTPS through UFW # noqa: L039 - nginx_multisite_ufw_status is registered by the preceding status check
  ansible.builtin.command:
    cmd: ufw allow 443/tcp
  changed_when: true
  when:
    - nginx_multisite_ufw_enabled
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"

- name: Enable UFW # noqa: L039 - nginx_multisite_ufw_status is registered by the preceding status check
  ansible.builtin.command:
    cmd: ufw --force enable
  changed_when: true
  when:
    - nginx_multisite_ufw_enabled
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"

- name: Check for sysctl configuration directory
  ansible.builtin.stat:
    path: /etc/sysctl.d
  register: nginx_multisite_sysctl_dir

- name: Deploy kernel security configuration # noqa: L039 - nginx_multisite_sysctl_dir is registered by the preceding stat task
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  when: nginx_multisite_sysctl_dir.stat.isdir | default(false)
  notify: Reload nginx multisite sysctl

- name: Check for SSH daemon configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Configure SSH root login # noqa: L039 - nginx_multisite_sshd_config is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    backup: true
    create: false
  when:
    - nginx_multisite_ssh_disable_root
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd

- name: Configure SSH password authentication # noqa: L039 - nginx_multisite_sshd_config is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    backup: true
    create: false
  when:
    - not nginx_multisite_ssh_password_auth
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart sshd
