---
- name: Create nginx sites-available directory
  ansible.builtin.file:
    path: /etc/nginx/sites-available
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create nginx sites-enabled directory
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Render nginx virtual host configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_nginx_site_config['key'] }} # noqa: R114 - filename from role-defined sites mapping
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site_config
  notify: Reload nginx
  vars:
    server_name: "{{ item_nginx_site_config['value']['id'] | default(item_nginx_site_config['key']) }}"
    document_root: "{{ item_nginx_site_config['value']['document_root'] }}"
    ssl_enabled: "{{ item_nginx_site_config['value']['ssl_enabled'] | default(false) }}"
    cert_file: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_nginx_site_config['key'] }}.crt"
    key_file: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_nginx_site_config['key'] }}.key"

- name: Enable nginx virtual hosts
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_nginx_site_link['key'] }} # noqa: R114 - link target from role-defined sites mapping
    dest: /etc/nginx/sites-enabled/{{ item_nginx_site_link['key'] }} # noqa: R114 - link path from role-defined sites mapping
    state: link
    owner: root
    group: root
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_site_link
  notify: Reload nginx

- name: Remove default nginx virtual host
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
