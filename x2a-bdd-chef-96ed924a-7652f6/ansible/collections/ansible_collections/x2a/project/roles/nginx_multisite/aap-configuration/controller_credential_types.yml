---
controller_credential_types:
  - name: Chef Encrypted Data Bag Nginx Site Token
    description: Secret token stored in the Chef encrypted data bag item nginx_secrets/site and written to the local Nginx secret file.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Nginx Site Token
          secret: true
          help_text: Secret token from the encrypted nginx_secrets/site data bag item.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
  - name: Nginx TLS Private Key
    description: TLS private key used by Nginx HTTPS virtual hosts; the source generates it locally with OpenSSL.
    kind: cloud
    inputs:
      fields:
        - id: nginx_tls_private_key
          type: string
          label: Nginx TLS Private Key
          secret: true
          help_text: Private RSA key for an Nginx HTTPS virtual host; protect it from logs and unauthorized access.
      required:
        - nginx_tls_private_key
    injectors:
      extra_vars:
        nginx_tls_private_key: !unsafe "{{ nginx_tls_private_key }}"
  - name: Nginx TLS Certificate
    description: Self-signed TLS certificate used by Nginx HTTPS virtual hosts; the source generates it locally with OpenSSL.
    kind: cloud
    inputs:
      fields:
        - id: nginx_tls_certificate
          type: string
          label: Nginx TLS Certificate
          help_text: Certificate corresponding to the Nginx TLS private key, used for an HTTPS virtual host.
      required:
        - nginx_tls_certificate
    injectors:
      extra_vars:
        nginx_tls_certificate: !unsafe "{{ nginx_tls_certificate }}"
