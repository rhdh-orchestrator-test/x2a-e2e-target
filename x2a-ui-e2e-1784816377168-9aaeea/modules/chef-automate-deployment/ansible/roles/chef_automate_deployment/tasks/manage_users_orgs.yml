---
- name: Ensure directory for key files exists
  ansible.builtin.file:
    path: "{{ chef_automate_user_key_path | dirname }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true
- name: Check if user key file exists
  ansible.builtin.stat:
    path: "{{ chef_automate_user_key_path }}"
  register: user_key_file
  become: true
- name: Create Chef user
  ansible.builtin.command: 'chef-server-ctl user-create {{ username }} {{ user_full_name }} {{ user_email }} "{{ password }}" --filename {{ chef_automate_user_key_path
    }}

    '
  args:
    creates: "{{ chef_automate_user_key_path }}"
  become: true
  when: not user_key_file.stat.exists
  no_log: true
- name: Check if organization key file exists
  ansible.builtin.stat:
    path: "{{ chef_automate_org_key_path }}"
  register: org_key_file
  become: true
- name: Create Chef organization
  ansible.builtin.command: 'chef-server-ctl org-create {{ org_name }} "{{ org_full_name }}" --association_user {{ username }} --filename {{ chef_automate_org_key_path
    }}

    '
  args:
    creates: "{{ chef_automate_org_key_path }}"
  become: true
  when: not org_key_file.stat.exists
- name: Set permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_automate_user_key_path }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  become: true
  when: user_key_file.stat.exists
- name: Set permissions on organization key file
  ansible.builtin.file:
    path: "{{ chef_automate_org_key_path }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  become: true
  when: org_key_file.stat.exists
