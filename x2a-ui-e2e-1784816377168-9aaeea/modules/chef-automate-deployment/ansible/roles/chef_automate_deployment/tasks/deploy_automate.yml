---
- name: Install required packages for Chef Automate
  ansible.builtin.package:
    name:
      - curl
      - unzip
      - tar
    state: present
  become: true
- name: Check if Chef Automate is already deployed
  ansible.builtin.stat:
    path: /hab
  register: hab_dir
  become: true
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command: "{{ chef_automate_cli_executable }} deploy --product automate --product infra-server --accept-terms-and-mlsa={{ 'true' if chef_automate_accept_terms
    else 'false' }} "
  args:
    creates: /hab
  become: true
  when: not hab_dir.stat.exists
  register: chef_automate_deploy
  changed_when: chef_automate_deploy.rc == 0
  notify: Wait for Chef Automate services
