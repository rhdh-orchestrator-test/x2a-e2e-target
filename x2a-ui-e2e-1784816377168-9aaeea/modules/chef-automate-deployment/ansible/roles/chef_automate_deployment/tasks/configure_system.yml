---
- name: Set hostname for Chef server
  ansible.builtin.hostname:
    name: "{{ chef_automate_hostname }}"
  become: true
- name: Configure system parameters for Chef Automate
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ chef_automate_sysctl_settings }}"
  become: true
- name: Create directory for Chef Automate CLI
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path | dirname }}"
    state: directory
    mode: "0755"
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
  become: true
- name: Check if Chef Automate CLI is already extracted
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_executable }}"
  register: chef_automate_cli_stat
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.shell: gunzip -c "{{ chef_automate_cli_path }}.zip" > "{{ chef_automate_cli_executable }}"
  args:
    creates: "{{ chef_automate_cli_executable }}"
  become: true
  when: not chef_automate_cli_stat.stat.exists
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_executable }}"
    mode: "0755"
  become: true
- name: Install Redis if required
  ansible.builtin.include_role:
    name: eloy.redis.redis
  vars:
    redis_requirepass: "{{ password }}"
    redis_maxmemory: "{{ chef_automate_redis_maxmemory }}"
    redis_maxmemory_policy: "{{ chef_automate_redis_maxmemory_policy }}"
  when: chef_automate_use_redis | bool
