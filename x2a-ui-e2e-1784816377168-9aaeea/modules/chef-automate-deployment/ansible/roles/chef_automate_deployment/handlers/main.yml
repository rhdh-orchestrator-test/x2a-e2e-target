---
- name: Restart Chef Automate
  ansible.builtin.command: "{{ chef_automate_cli_executable }} restart"
  become: true
  listen: restart chef automate
  changed_when: true
- name: Restart Chef Infra Server
  ansible.builtin.command: chef-server-ctl restart
  become: true
  listen: restart chef server
  changed_when: true
- name: Wait for Chef Automate services
  ansible.builtin.pause:
    seconds: 30
- name: Wait for Chef Infra Server services
  ansible.builtin.pause:
    seconds: 30
