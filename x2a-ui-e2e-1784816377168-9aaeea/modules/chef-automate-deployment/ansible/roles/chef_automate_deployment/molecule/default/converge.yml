- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    user_full_name: John Tonello
    user_email: jtonello@chef.lab
    password: password
    org_name: lab
    org_full_name: Chef Lab
  tasks:
  - name: Create base directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/usr/local/bin
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/home/{{ username }}
    - /tmp/molecule_test/etc/sysctl.d
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: automate.chef.lab
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create package installation marker
    ansible.builtin.file:
      path: /tmp/molecule_test/var/lib/dpkg/info/curl.list
      state: touch
      mode: '0644'
  - name: Create package installation marker for unzip
    ansible.builtin.file:
      path: /tmp/molecule_test/var/lib/dpkg/info/unzip.list
      state: touch
      mode: '0644'
  - name: Create package installation marker for tar
    ansible.builtin.file:
      path: /tmp/molecule_test/var/lib/dpkg/info/tar.list
      state: touch
      mode: '0644'
  - name: Create Chef Automate CLI executable
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        exit 0

        '
      dest: /tmp/molecule_test/usr/local/bin/chef-automate
      mode: '0755'
  - name: Create Chef Automate deployment marker
    ansible.builtin.file:
      path: /tmp/molecule_test/hab/sup
      state: directory
      mode: '0755'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEowIBAAKCAQEAwZ5UJULAjWr7p6FVwGRQRjFN2s8tZ/6LC3X82fajpVsYqF1x

        qEuUDndDXVD09E4u83MS6HO6a3bIVQDp6/klnYldiE6Vp8HH5BSKaCWKVg8lGWg1

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/{{ username }}/{{ username }}.pem
      mode: '0600'
  - name: Create organization key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA7NvZlmPZ7USgmLpBr5tZPnlVj9BVXm2ckIIW/xvUUYQpELkj

        KFHgQbOIQoKQcPSNvYd2JnnJlY/lXxPG7SnhDGJOjUKWTC4RQjV5PZQl2kYfGRba

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/home/{{ username }}/{{ org_name }}-validator.pem
      mode: '0600'
  - name: Create chef-server-ctl mock
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Server CTL mock"

        exit 0

        '
      dest: /tmp/molecule_test/usr/local/bin/chef-server-ctl
      mode: '0755'
