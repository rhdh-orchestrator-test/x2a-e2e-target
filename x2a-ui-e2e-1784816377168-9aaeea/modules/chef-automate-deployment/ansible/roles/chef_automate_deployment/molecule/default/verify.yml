- name: Verify
  hosts: all
  gather_facts: false
  vars:
    username: jtonello
    org_name: lab
  tasks:
  - name: Check package installation markers
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/lib/dpkg/info/{{ item }}.list
    register: package_markers
    loop:
    - curl
    - unzip
    - tar
  - name: Assert packages would be installed
    ansible.builtin.assert:
      that:
      - item.stat.exists
      fail_msg: Package installation marker for {{ item.item }} not found
      success_msg: Package installation marker for {{ item.item }} exists
    loop: '{{ package_markers.results }}'
    loop_control:
      label: '{{ item.item }}'
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file was created
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Check sysctl settings file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file was created
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Sysctl settings file not found
      success_msg: Sysctl settings file exists
  - name: Get sysctl file content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_content
    when: sysctl_file.stat.exists
  - name: Assert sysctl settings are correct
    ansible.builtin.assert:
      that:
      - '''vm.max_map_count = 262144'' in (sysctl_content.content | b64decode)'
      - '''vm.dirty_expire_centisecs = 20000'' in (sysctl_content.content | b64decode)'
      fail_msg: Sysctl settings are incorrect
      success_msg: Sysctl settings are correct
    when: sysctl_file.stat.exists
  - name: Check Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/local/bin/chef-automate
    register: chef_automate_cli
  - name: Assert Chef Automate CLI was created
    ansible.builtin.assert:
      that:
      - chef_automate_cli.stat.exists
      - chef_automate_cli.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Check Chef Automate deployment marker
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/sup
    register: hab_dir
  - name: Assert Chef Automate was deployed
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef Automate deployment marker not found
      success_msg: Chef Automate deployment marker exists
  - name: Check user key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/{{ username }}/{{ username }}.pem
    register: user_key_file
  - name: Assert user key file was created
    ansible.builtin.assert:
      that:
      - user_key_file.stat.exists
      - user_key_file.stat.size > 0
      - user_key_file.stat.mode == "0600"
      fail_msg: User key file not found or has incorrect permissions
      success_msg: User key file exists with correct permissions
  - name: Check organization key file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/home/{{ username }}/{{ org_name }}-validator.pem
    register: org_key_file
  - name: Assert organization key file was created
    ansible.builtin.assert:
      that:
      - org_key_file.stat.exists
      - org_key_file.stat.size > 0
      - org_key_file.stat.mode == "0600"
      fail_msg: Organization key file not found or has incorrect permissions
      success_msg: Organization key file exists with correct permissions
  - name: Check chef-server-ctl exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/usr/local/bin/chef-server-ctl
    register: chef_server_ctl
  - name: Assert chef-server-ctl was created
    ansible.builtin.assert:
      that:
      - chef_server_ctl.stat.exists
      - chef_server_ctl.stat.executable
      fail_msg: chef-server-ctl not found or not executable
      success_msg: chef-server-ctl exists and is executable
  - name: Check Chef Automate services
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Automate services are running
    ansible.builtin.assert:
      that:
      - '''chef-automate.service'' in ansible_facts.services'
      - ansible_facts.services['chef-automate.service'].state == 'running'
      fail_msg: Chef Automate service not running
      success_msg: Chef Automate service is running
    tags: molecule-notest
  - name: Check Chef Infra Server services
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Chef Infra Server services are running
    ansible.builtin.assert:
      that:
      - '''chef-server.service'' in ansible_facts.services'
      - ansible_facts.services['chef-server.service'].state == 'running'
      fail_msg: Chef Infra Server service not running
      success_msg: Chef Infra Server service is running
    tags: molecule-notest
  - name: Check Chef Automate API availability
    ansible.builtin.uri:
      url: https://localhost/api/_status
      validate_certs: false
      status_code: 200
    tags: molecule-notest
