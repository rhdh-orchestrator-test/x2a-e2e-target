---
controller_credential_types:
- name: Chef Server User Credentials
  description: Credentials used for creating Chef users and organizations
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef user account name
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef user authentication
    - id: user_email
      type: string
      label: Email Address
      help_text: Email address associated with the Chef user
    - id: user_full_name
      type: string
      label: Full Name
      help_text: Full name of the Chef user
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      user_email: !unsafe '{{ user_email }}'
      user_full_name: !unsafe '{{ user_full_name }}'
- name: Chef Organization Configuration
  description: Configuration for Chef organization setup
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name for the Chef organization
    required:
    - org_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
