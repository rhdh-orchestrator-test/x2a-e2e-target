---
chef_automate_hostname: automate.chef.lab
chef_automate_sysctl_settings:
  - name: vm.max_map_count
    value: "262144"
  - name: vm.dirty_expire_centisecs
    value: "20000"
chef_automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
chef_automate_cli_path: /tmp/chef-automate
chef_automate_cli_executable: /usr/local/bin/chef-automate
chef_automate_deploy_automate: true
chef_automate_accept_terms: true
chef_automate_user_key_path: /home/{{ username }}/{{ username }}.pem
chef_automate_org_key_path: /home/{{ username }}/{{ org_name }}-validator.pem
chef_automate_use_redis: false
chef_automate_redis_maxmemory: 2gb
chef_automate_redis_maxmemory_policy: allkeys-lru
