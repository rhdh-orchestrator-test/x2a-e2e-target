---
- name: Restart Chef Automate
  ansible.builtin.command: chef-automate restart
  register: automate_restart
  changed_when: automate_restart.rc == 0
  failed_when: automate_restart.rc != 0 and automate_restart.rc != 7
- name: Restart Chef Infra Server
  ansible.builtin.command: chef-server-ctl restart
  register: chef_server_restart
  changed_when: chef_server_restart.rc == 0
  failed_when: chef_server_restart.rc != 0 and chef_server_restart.rc != 7
