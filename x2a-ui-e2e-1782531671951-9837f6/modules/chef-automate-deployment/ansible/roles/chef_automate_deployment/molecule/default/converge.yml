---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for Chef Automate and Chef Infra Server
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/opscode
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/opscode

    # Create Chef Automate config file
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          [global]
            v1 = {}
          [global.v1]
            fqdn = "automate.chef.lab"
          [deployment]
            v1 = {}
          [deployment.v1]
            svc = {}
          [deployment.v1.svc]
            products = ["automate", "infra-server"]
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"

    # Create Chef Automate CLI binary placeholder
    - name: Create Chef Automate CLI binary placeholder
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: /tmp/molecule_test/chef-automate
        mode: "0755"

    # Create user PEM file
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          EXAMPLE_PEM_CONTENT_FOR_USER
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/jtonello.pem
        mode: "0600"

    # Create organization validator PEM file
    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          EXAMPLE_PEM_CONTENT_FOR_ORG_VALIDATOR
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/lab-validator.pem
        mode: "0600"

    # Create mock Chef server status file
    - name: Create mock Chef server status file
      ansible.builtin.copy:
        content: |
          run: pid 12345, uptime 0:01:23
          log: /var/log/chef-server/service.log
          down: bookshelf, 1.23s, normally up
          run: oc_bifrost, (pid 12346) 0:01:22
          run: oc_id, (pid 12347) 0:01:21
          run: opscode-erchef, (pid 12348) 0:01:20
          run: opscode-expander, (pid 12349) 0:01:19
          run: opscode-solr4, (pid 12350) 0:01:18
          run: postgresql, (pid 12351) 0:01:17
          run: rabbitmq, (pid 12352) 0:01:16
          run: redis_lb, (pid 12353) 0:01:15
        dest: /tmp/molecule_test/chef-server-status
        mode: "0644"

    # Create mock Chef Automate status file
    - name: Create mock Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service Name                    Status          PID           Uptime
          automate-cs-bookshelf           running         12345         01:23:45
          automate-cs-oc-bifrost          running         12346         01:23:44
          automate-cs-oc-erchef           running         12347         01:23:43
          automate-cs-nginx               running         12348         01:23:42
          automate-elasticsearch          running         12349         01:23:41
          automate-postgresql             running         12350         01:23:40
          automate-ui                     running         12351         01:23:39
        dest: /tmp/molecule_test/chef-automate-status
        mode: "0644"

    # Create mock user list output
    - name: Create mock user list output
      ansible.builtin.copy:
        content: |
          jtonello
          pivotal
        dest: /tmp/molecule_test/chef-user-list
        mode: "0644"

    # Create mock organization list output
    - name: Create mock organization list output
      ansible.builtin.copy:
        content: |
          lab
        dest: /tmp/molecule_test/chef-org-list
        mode: "0644"

    # Create mock systemd service file for Chef Automate
    - name: Create mock systemd service file for Chef Automate
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Automate
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/chef-automate start
          ExecStop=/usr/bin/chef-automate stop
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/chef-automate.service
        mode: "0644"