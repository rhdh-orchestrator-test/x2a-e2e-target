---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Verify system configuration
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Verify sysctl configuration
    - name: Check sysctl configuration files exist
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/sysctl.d/{{ item }}"
      register: sysctl_files
      loop:
        - "99-chef-automate-vm-max-map-count.conf"
        - "99-chef-automate-vm-dirty-expire-centisecs.conf"

    - name: Get vm.max_map_count sysctl file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-max-map-count.conf
      register: max_map_count_content
      when: sysctl_files.results[0].stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "vm.max_map_count = 262144"
        fail_msg: "vm.max_map_count not set correctly"
        success_msg: "vm.max_map_count set correctly"
      when: sysctl_files.results[0].stat.exists

    - name: Get vm.dirty_expire_centisecs sysctl file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate-vm-dirty-expire-centisecs.conf
      register: dirty_expire_content
      when: sysctl_files.results[1].stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_content.content | b64decode | trim) == "vm.dirty_expire_centisecs = 20000"
        fail_msg: "vm.dirty_expire_centisecs not set correctly"
        success_msg: "vm.dirty_expire_centisecs set correctly"
      when: sysctl_files.results[1].stat.exists

    # Verify Chef Automate CLI
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI was created
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Verify Chef Automate and Chef Infra Server deployment
    - name: Check hab directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: hab_dir

    - name: Assert hab directory was created
      ansible.builtin.assert:
        that:
          - hab_dir.stat.exists
          - hab_dir.stat.isdir
        fail_msg: "hab directory not found"
        success_msg: "hab directory exists"

    - name: Check Chef Automate config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/etc/chef-automate-config.toml
      register: chef_automate_config

    - name: Assert Chef Automate config file was created
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    - name: Check Chef Server config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab/etc/chef-server-config.rb
      register: chef_server_config

    - name: Assert Chef Server config file was created
      ansible.builtin.assert:
        that:
          - chef_server_config.stat.exists
        fail_msg: "Chef Server config file not found"
        success_msg: "Chef Server config file exists"

    # Verify Chef user and organization creation
    - name: Check Chef user PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_pem

    - name: Assert Chef user PEM file was created
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.size > 0
        fail_msg: "Chef user PEM file not found"
        success_msg: "Chef user PEM file exists"

    - name: Check Chef organization validator PEM file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_validator_pem

    - name: Assert Chef organization validator PEM file was created
      ansible.builtin.assert:
        that:
          - org_validator_pem.stat.exists
          - org_validator_pem.stat.size > 0
        fail_msg: "Chef organization validator PEM file not found"
        success_msg: "Chef organization validator PEM file exists"

    # The following checks would normally be performed but can't run in a container
    # They are tagged with molecule-notest so they won't run during molecule testing
    
    - name: Check Chef Automate service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "ansible_facts.services['chef-automate.service'].state == 'running'"
        fail_msg: "Chef Automate service not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Check Chef Infra Server service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Infra Server service is running
      ansible.builtin.assert:
        that:
          - "'chef-server.service' in ansible_facts.services"
          - "ansible_facts.services['chef-server.service'].state == 'running'"
        fail_msg: "Chef Infra Server service not running"
        success_msg: "Chef Infra Server service is running"
      tags: molecule-notest

    - name: Check Chef Automate API accessibility
      ansible.builtin.uri:
        url: "https://{{ hostname }}/api/_status"
        validate_certs: no
        status_code: 200
      register: chef_automate_api
      tags: molecule-notest

    - name: Assert Chef Automate API is accessible
      ansible.builtin.assert:
        that:
          - chef_automate_api.status == 200
        fail_msg: "Chef Automate API not accessible"
        success_msg: "Chef Automate API is accessible"
      tags: molecule-notest