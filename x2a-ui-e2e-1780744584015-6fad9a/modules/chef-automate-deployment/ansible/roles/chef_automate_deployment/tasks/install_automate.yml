---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - gzip
      - unzip
      - curl
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
    creates: "{{ chef_automate_cli_path }}"
  become: true
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
  become: true
- name: Check if Chef Automate is already deployed
  ansible.builtin.stat:
    path: /hab/sup/default/data/services.dat
  register: chef_automate_deployed
  become: true
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy {% if chef_automate_deploy_automate %}--product automate{% endif %} {% if chef_automate_deploy_infra_server %}--product
      infra-server{% endif %} --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }}"
    creates: /hab/sup/default/data/services.dat
  become: true
  register: chef_automate_deploy
  changed_when: chef_automate_deploy.rc == 0
  failed_when: chef_automate_deploy.rc != 0
  async: 3600
  poll: 30
  when: not chef_automate_deployed.stat.exists
