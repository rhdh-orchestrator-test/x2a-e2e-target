---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Database credential for the FastAPI application and its PostgreSQL database.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL role; use a protected AAP credential value instead of the hardcoded Chef password.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname or address of the PostgreSQL server.
        - id: db_port
          type: string
          label: Database Port
          help_text: TCP port on which PostgreSQL accepts connections.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
      required:
        - db_username
        - db_password
        - db_host
        - db_port
        - database_name
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
        database_name: !unsafe "{{ database_name }}"
