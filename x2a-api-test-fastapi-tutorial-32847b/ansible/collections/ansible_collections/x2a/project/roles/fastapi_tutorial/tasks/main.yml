---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI and PostgreSQL packages on RedHat
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - python3-psycopg2
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Install FastAPI and PostgreSQL packages on Debian
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] not in ['RedHat', 'Fedora']

- name: Initialize PostgreSQL on RedHat
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_app_path }}" # noqa: R114 - path comes from role defaults and is trusted configuration
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository # noqa: R104 - repository URL comes from trusted role defaults and uses HTTPS
  ansible.builtin.git:
    repo: "{{ fastapi_repository }}" # noqa: R106 - repository source is trusted role configuration
    dest: "{{ fastapi_app_path }}" # noqa: R114 - destination comes from role defaults and is trusted configuration
    version: "{{ fastapi_revision }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command arguments come from trusted role defaults, not user input
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_app_path }}/venv"
    creates: "{{ fastapi_app_path }}/venv" # noqa: R114 - path is derived from trusted role default

- name: Install Python dependencies # noqa: R113 - dependency target is the trusted role application's fixed requirements file
  ansible.builtin.pip:
    requirements: "{{ fastapi_app_path }}/requirements.txt"
    virtualenv: "{{ fastapi_app_path }}/venv"
    state: present

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create PostgreSQL application role # noqa: L039 - variables are validated by the prior credential validation task
  community.postgresql.postgresql_user:
    name: "{{ db_username }}"
    password: "{{ db_password }}"
    role_attr_flags: LOGIN
    state: present
  become: true # noqa: R108 - privilege escalation is required to manage the PostgreSQL role as the postgres user
  become_user: postgres
  no_log: true

- name: Create PostgreSQL database # noqa: L039 - variables are supplied by validated role or inventory configuration
  community.postgresql.postgresql_db:
    name: "{{ database_name }}"
    owner: "{{ db_username }}"
    state: present
  become: true # noqa: R108 - privilege escalation is required to manage the database as the postgres user
  become_user: postgres
  no_log: "{{ fastapi_secure_logging }}"

- name: Grant PostgreSQL database privileges # noqa: L039 - variables are supplied by validated role or inventory configuration
  community.postgresql.postgresql_privs:
    database: "{{ database_name }}"
    roles: "{{ db_username }}"
    type: database
    privs: ALL
    state: present
  become: true # noqa: R108 - privilege escalation is required to manage database privileges as the postgres user
  become_user: postgres

- name: Write application environment file # noqa: L039 - variables are validated by the prior credential validation task and supplied by role or inventory configuration
  ansible.builtin.copy:
    dest: "{{ fastapi_app_path }}/.env" # noqa: R114 - destination is derived from trusted role default
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/{{ database_name }}
    owner: root
    group: root
    mode: "0600"
    backup: true
  no_log: "{{ fastapi_secure_logging }}"

- name: Write systemd service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/{{ fastapi_service_name }}.service # noqa: R114 - service name is a trusted role default
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_app_path }}
      Environment="PATH={{ fastapi_app_path }}/venv/bin"
      ExecStart={{ fastapi_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Enable and start FastAPI service
  ansible.builtin.systemd:
    name: "{{ fastapi_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
