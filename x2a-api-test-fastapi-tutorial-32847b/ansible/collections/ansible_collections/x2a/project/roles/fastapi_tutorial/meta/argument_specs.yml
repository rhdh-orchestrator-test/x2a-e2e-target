---
argument_specs:
  main:
    short_description: Install and configure the FastAPI tutorial application.
    description:
      - Deploys the FastAPI tutorial repository, Python virtual environment, PostgreSQL database, and systemd service.
    options:
      fastapi_app_path:
        type: str
        required: false
        default: /opt/fastapi-tutorial
        description: Application checkout directory.
      fastapi_repository:
        type: str
        required: false
        default: https://github.com/dibanez/fastapi_tutorial.git
        description: Git repository containing the application.
      fastapi_revision:
        type: str
        required: false
        default: main
        description: Git revision to deploy.
      fastapi_service_port:
        type: int
        required: false
        default: 8000
        description: TCP port used by the FastAPI service.
      fastapi_service_name:
        type: str
        required: false
        default: fastapi-tutorial
        description: Systemd service name.
      fastapi_database_name:
        type: str
        required: false
        default: fastapi_db
        description: PostgreSQL database name.
      fastapi_database_user:
        type: str
        required: false
        default: fastapi
        description: PostgreSQL application user.
      fastapi_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the database password.
      db_username:
        type: str
        required: true
        description: Database username injected by an AAP credential type.
      db_password:
        type: str
        required: true
        description: Database password injected by an AAP credential type.
      db_host:
        type: str
        required: true
        description: Database host injected by an AAP credential type.
      db_port:
        type: str
        required: true
        description: Database port injected by an AAP credential type.
      database_name:
        type: str
        required: true
        description: Database name injected by an AAP credential type.
