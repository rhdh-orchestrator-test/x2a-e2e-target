---
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product {{ automate_products | join(' --product ') }} --accept-terms-and-mlsa={{ automate_accept_terms_and_mlsa | lower }} "
  become: true
  register: automate_deploy
  changed_when: automate_deploy.rc == 0
  failed_when: automate_deploy.rc != 0
  args:
    creates: /hab/sup/default/data/services.dat
- name: Wait for Chef Automate to be fully operational
  ansible.builtin.uri:
    url: https://localhost/api/v0/health
    validate_certs: false
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: 30
  delay: 10
  become: true
  ignore_errors: true
  tags:
    - molecule-notest
