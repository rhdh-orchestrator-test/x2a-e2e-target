---
automate_hostname: automate.chef.lab
automate_cli_url: https://packages.chef.io/files/current/latest/chef-automate-cli/chef-automate_linux_amd64.zip
automate_cli_path: ./chef-automate
automate_sysctl_params:
  vm.max_map_count: 262144
  vm.dirty_expire_centisecs: 20000
automate_accept_terms_and_mlsa: true
automate_products:
  - automate
  - infra-server
automate_user:
  name: "{{ username | default('jtonello') }}"
  fullname: "{{ full_name | default('John Tonello') }}"
  email: "{{ email | default('jtonello@chef.lab') }}"
  password: "{{ password | default('password') }}"
  key_file: "{{ username | default('jtonello') }}.pem"
automate_org:
  name: lab
  fullname: Chef Lab
  key_file: lab-validator.pem
