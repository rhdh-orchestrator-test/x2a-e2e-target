- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: jtonello
    password: password
    full_name: John Tonello
    email: jtonello@chef.lab
    automate_hostname: automate.chef.lab
    automate_user:
      name: jtonello
      fullname: John Tonello
      email: jtonello@chef.lab
      password: password
      key_file: jtonello.pem
    automate_org:
      name: lab
      fullname: Chef Lab
      key_file: lab-validator.pem
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/proc/sys/vm
    - /tmp/molecule_test/hab/sup/default/data
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ automate_hostname | default(''automate.chef.lab'') }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create kernel parameter files
    ansible.builtin.copy:
      content: '{{ item.value }}'
      dest: /tmp/molecule_test/proc/sys/vm/{{ item.key | regex_replace('^vm\.', '') }}
      mode: '0644'
    loop:
    - key: vm.max_map_count
      value: '262144'
    - key: vm.dirty_expire_centisecs
      value: '20000'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI v1.0.0'' '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create services.dat file
    ansible.builtin.copy:
      content: '# Chef Automate services data '
      dest: /tmp/molecule_test/hab/sup/default/data/services.dat
      mode: '0644'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/{{ automate_user.key_file | default('jtonello.pem') }}
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/{{ automate_org.key_file | default('lab-validator.pem') }}
      mode: '0600'
