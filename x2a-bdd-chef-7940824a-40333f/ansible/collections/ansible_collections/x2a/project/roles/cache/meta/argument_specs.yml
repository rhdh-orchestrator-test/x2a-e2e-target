---
argument_specs:
  main:
    short_description: Install and configure Memcached and Redis cache services
    description:
      - Deploys Memcached with the migrated cache settings and configures standalone Redis with authentication.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide tasks that handle the Redis authentication password.
      cache_memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory limit in megabytes.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      cache_memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      cache_memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      cache_memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached connections.
      cache_memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      cache_memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file descriptor limit.
      cache_memcached_user:
        type: str
        required: false
        default: memcached
        description: Memcached service account.
      cache_memcached_group:
        type: str
        required: false
        default: memcached
        description: Memcached service group.
      cache_memcached_service_name:
        type: str
        required: false
        default: memcached
        description: Memcached systemd service name.
      cache_memcached_config_file:
        type: str
        required: false
        default: /etc/sysconfig/memcached
        description: Platform-specific Memcached service configuration file.
      cache_redis_pid_directory:
        type: str
        required: false
        default: /run/redis
        description: Redis PID directory.
      cache_redis_log_directory:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      cache_redis_service_name:
        type: str
        required: false
        default: redis
        description: Redis systemd service name.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
