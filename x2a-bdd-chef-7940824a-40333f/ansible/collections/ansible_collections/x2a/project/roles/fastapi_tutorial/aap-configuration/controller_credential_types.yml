---
controller_credential_types:
  - name: PostgreSQL Application Database
    description: Database connection credential currently hardcoded in the Chef recipe and generated .env file; migrate the sensitive value to Ansible Vault.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application and as the owner of the application database.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role; store this value in Ansible Vault.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: db_host
          type: string
          label: Database Host
          help_text: Hostname where PostgreSQL is running.
        - id: db_port
          type: string
          label: Database Port
          help_text: TCP port used for the PostgreSQL connection.
      required:
        - db_username
        - db_password
        - database_name
        - db_host
        - db_port
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        db_host: !unsafe "{{ db_host }}"
        db_port: !unsafe "{{ db_port }}"
