---
controller_credentials:
  - name: PostgreSQL Application Database - fastapi_tutorial
    description: Database connection credential currently hardcoded in the Chef recipe and generated .env file; migrate the sensitive value to Ansible Vault.
    organization: Default
    credential_type: PostgreSQL Application Database
    update_secrets: true
    inputs:
      db_username: "{{ db_username }}"
      db_password: "{{ vault_db_password }}"
      database_name: "{{ database_name }}"
      db_host: "{{ db_host }}"
      db_port: "{{ db_port }}"
