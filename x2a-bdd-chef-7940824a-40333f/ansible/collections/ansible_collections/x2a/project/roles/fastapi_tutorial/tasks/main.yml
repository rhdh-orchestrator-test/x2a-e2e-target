---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install FastAPI and PostgreSQL packages on RedHat-family systems
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install FastAPI and PostgreSQL packages on Debian-family systems
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] != 'RedHat'

- name: Initialize PostgreSQL on RedHat-family systems
  ansible.builtin.command:
    argv:
      - postgresql-setup
      - --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] == 'RedHat'

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - path is from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository # noqa: R104 - repository uses the trusted role's intentional HTTP-capable source override
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}" # noqa: R106 - repository source is intentionally parameterized to preserve the role's trusted repository override
    dest: "{{ fastapi_tutorial_app_path }}" # noqa: R114 - destination is from role defaults
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command path is constructed from a trusted role default
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_tutorial_app_path }}/venv"
    creates: "{{ fastapi_tutorial_app_path }}/venv/bin/python" # noqa: R114 - path is from role defaults

- name: Install application Python dependencies # noqa: R113 - dependency paths are controlled by trusted role defaults
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_path }}/requirements.txt" # noqa: R114 - path is from role defaults
    virtualenv: "{{ fastapi_tutorial_app_path }}/venv" # noqa: R114 - path is from role defaults

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create PostgreSQL application role # noqa: L039,R101,R108 - credential variables are validated by the prior task and supplied by the attached AAP credential; the command uses trusted validated inputs; PostgreSQL role creation must run as the postgres system user
  ansible.builtin.shell:
    cmd: |
      psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}'" | grep -q 1 || \
        psql -d postgres -c "CREATE ROLE {{ db_username }} LOGIN PASSWORD '{{ db_password }}'"
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Create PostgreSQL application database # noqa: L039,R101,R108 - credential variables are validated by the prior task and supplied by the attached AAP credential; the command uses trusted validated inputs; PostgreSQL database creation must run as the postgres system user
  ansible.builtin.shell:
    cmd: |
      psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'" | grep -q 1 || \
        psql -d postgres -c "CREATE DATABASE {{ database_name }} OWNER {{ db_username }}"
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant PostgreSQL database privileges # noqa: L039,R101,R108 - credential variables are validated by the prior task and supplied by the attached AAP credential; the command uses trusted validated inputs; PostgreSQL privilege management must run as the postgres system user
  ansible.builtin.shell:
    cmd: |
      psql -d postgres -tAc "SELECT has_database_privilege('{{ db_username }}', '{{ database_name }}', 'CONNECT')" | grep -q t || \
        psql -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ db_username }}"
  changed_when: false
  become: true
  become_user: postgres

- name: Write application environment file # noqa: L039 - credential variables are validated by the prior task and supplied by the attached AAP credential
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_path }}/.env" # noqa: R114 - destination is from role defaults
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}:{{ db_port }}/{{ database_name }}
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_path }}
      Environment="PATH={{ fastapi_tutorial_app_path }}/venv/bin"
      ExecStart={{ fastapi_tutorial_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_tutorial_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Reload systemd before starting FastAPI service
  ansible.builtin.meta: flush_handlers

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: fastapi-tutorial
    state: started
    enabled: true
