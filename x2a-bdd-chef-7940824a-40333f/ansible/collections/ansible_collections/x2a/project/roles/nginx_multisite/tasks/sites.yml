---
- name: Create nginx sites-available directory
  ansible.builtin.file:
    path: /etc/nginx/sites-available
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create nginx sites-enabled directory
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Render nginx site configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_nginx_multisite_site['key'] }} # noqa: R114 - filename comes from role-defined nginx_sites keys
    mode: "0644"
    backup: true
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_site
  notify: Reload nginx
  vars:
    server_name: "{{ item_nginx_multisite_site['key'] }}"
    document_root: "{{ item_nginx_multisite_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_nginx_multisite_site['value']['ssl_enabled'] | default(false) }}"
    cert_file: "{{ nginx_ssl_certificate_path }}/{{ item_nginx_multisite_site['key'] }}.crt"
    key_file: "{{ nginx_ssl_private_key_path }}/{{ item_nginx_multisite_site['key'] }}.key"

- name: Enable nginx sites
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_nginx_multisite_enabled['key'] }}
    dest: /etc/nginx/sites-enabled/{{ item_nginx_multisite_enabled['key'] }} # noqa: R114 - link name comes from role-defined nginx_sites keys
    state: link
    owner: root
    group: root
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite_enabled
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure nginx is enabled and started
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
