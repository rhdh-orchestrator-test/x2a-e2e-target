---
controller_credential_types:
  - name: Chef Encrypted Data Bag Nginx Site Token
    description: Encrypted site token stored in the Chef nginx_secrets data bag item and written to the nginx secrets directory.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Nginx Site Token
          secret: true
          help_text: Secret token retrieved from the encrypted Chef data bag and written to /etc/nginx/secrets/site_token.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
  - name: Nginx TLS Certificate
    description: TLS certificate and corresponding private key used by SSL-enabled nginx sites. The source currently generates these locally with OpenSSL; 
      production migration should protect or replace them with managed certificate material.
    kind: cloud
    inputs:
      fields:
        - id: certificate
          type: string
          label: TLS Certificate
          help_text: PEM-encoded certificate installed under /etc/ssl/certs/<site_name>.crt for an SSL-enabled nginx site.
        - id: private_key
          type: string
          label: TLS Private Key
          secret: true
          help_text: PEM-encoded RSA private key installed under /etc/ssl/private/<site_name>.key for nginx HTTPS termination.
      required:
        - certificate
        - private_key
    injectors:
      extra_vars:
        certificate: !unsafe "{{ certificate }}"
        private_key: !unsafe "{{ private_key }}"
