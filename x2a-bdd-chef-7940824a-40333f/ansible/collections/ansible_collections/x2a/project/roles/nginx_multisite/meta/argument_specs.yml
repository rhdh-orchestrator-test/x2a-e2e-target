---
argument_specs:
  main:
    short_description: Install and configure a hardened nginx multisite server
    description:
      - Configures nginx virtual hosts, optional self-signed TLS, and host security controls.
    options:
      nginx_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory where site certificates are stored.
      nginx_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory where site private keys are stored.
      security_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban security configuration is enabled.
      security_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      security_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether direct SSH root login is disabled.
      security_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_sites:
        type: dict
        required: false
        default: {}
        description: Site definitions keyed by hostname.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle secret credentials.
      site_token:
        type: str
        required: true
        description: Site token injected by an AAP credential type.
      certificate:
        type: str
        required: true
        description: Certificate credential injected by an AAP credential type.
      private_key:
        type: str
        required: true
        description: Private key credential injected by an AAP credential type.
