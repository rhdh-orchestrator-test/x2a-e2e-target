---
controller_credentials:
  - name: Chef Encrypted Data Bag Nginx Site Token - nginx_multisite
    description: Encrypted site token stored in the Chef nginx_secrets data bag item and written to the nginx secrets directory.
    organization: Default
    credential_type: Chef Encrypted Data Bag Nginx Site Token
    update_secrets: true
    inputs:
      site_token: "{{ vault_site_token }}"
  - name: Nginx TLS Certificate - nginx_multisite
    description: TLS certificate and corresponding private key used by SSL-enabled nginx sites. The source currently generates these locally with OpenSSL; 
      production migration should protect or replace them with managed certificate material.
    organization: Default
    credential_type: Nginx TLS Certificate
    update_secrets: true
    inputs:
      certificate: "{{ certificate }}"
      private_key: "{{ vault_private_key }}"
