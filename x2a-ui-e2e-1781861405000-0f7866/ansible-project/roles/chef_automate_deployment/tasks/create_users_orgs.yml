---
- name: Ensure directories exist for key files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ user_key_path }}"
    - "{{ org_validator_key_path }}"
  when: item | dirname != '.'
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: sudo chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ user_key_path }}
  args:
    creates: "{{ user_key_path }}"
  register: create_user_result
  changed_when: create_user_result.rc == 0
- name: Create Chef organization and associate admin user
  ansible.builtin.command:
    cmd: sudo chef-server-ctl org-create {{ org_name }} "{{ org_full_name }}" --association_user {{ username }} --filename {{ org_validator_key_path }}
  args:
    creates: "{{ org_validator_key_path }}"
  register: create_org_result
  changed_when: create_org_result.rc == 0
- name: Ensure directory exists for user key destination
  ansible.builtin.file:
    path: "{{ user_key | dirname }}"
    state: directory
    mode: "0755"
  when: user_key is defined and user_key != user_key_path and user_key | dirname != '.'
- name: Save user key to specified location
  ansible.builtin.copy:
    src: "{{ user_key_path }}"
    dest: "{{ user_key }}"
    remote_src: true
    mode: "0600"
  when: user_key is defined and user_key != user_key_path
- name: Ensure directory exists for org validator key destination
  ansible.builtin.file:
    path: "{{ org_validator_key | dirname }}"
    state: directory
    mode: "0755"
  when: org_validator_key is defined and org_validator_key != org_validator_key_path and org_validator_key | dirname != '.'
- name: Save organization validator key to specified location
  ansible.builtin.copy:
    src: "{{ org_validator_key_path }}"
    dest: "{{ org_validator_key }}"
    remote_src: true
    mode: "0600"
  when: org_validator_key is defined and org_validator_key != org_validator_key_path
