---
- name: Install Memcached
  ansible.builtin.package:
    name: memcached
    state: present

- name: Configure Memcached service limits and options
  ansible.builtin.template:
    src: memcached.conf.j2
    dest: /etc/memcached.conf
    mode: "0644"
    backup: true
  notify: Restart Memcached

- name: Ensure Memcached service is enabled and started
  ansible.builtin.service:
    name: memcached
    enabled: true
    state: started
