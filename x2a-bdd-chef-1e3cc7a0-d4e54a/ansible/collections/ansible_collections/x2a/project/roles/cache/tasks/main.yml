---
- name: Configure Memcached
  ansible.builtin.include_tasks: memcached.yml

- name: Ensure Redis service user exists
  ansible.builtin.user:
    name: redis
    system: true
    create_home: false
    state: present

- name: Configure Redis server  # noqa: L038 - role is provided by the eloy.redis collection declared in requirements.yml
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_port: 6379
    redis_requirepass: "{{ cache_redis_password }}"
    redis_cluster_enabled: false
    redis_sentinel_enabled: false
    redis_replication_enabled: false
    redis_aof_enabled: false
    redis_rdb_enabled: true
    redis_base_piddir: /run/redis

- name: Create Redis log directory
  ansible.builtin.file:
    path: /var/log/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Check whether the Redis configuration exists
  ansible.builtin.stat:
    path: /etc/redis/6379.conf
  register: cache_redis_config

- name: Remove unsupported replication directives from Redis configuration  # noqa: L039 - variable is registered by the preceding stat task
  ansible.builtin.lineinfile:
    path: /etc/redis/6379.conf
    regexp: ^{{ item_cache_directive }}.*$
    state: absent
    create: false
  when:
    - ansible_facts['os_family'] is defined
    - cache_redis_config.stat.exists
  loop:
    - replica-serve-stale-data
    - replica-read-only
    - repl-ping-replica-period
    - client-output-buffer-limit
    - replica-priority
  loop_control:
    loop_var: item_cache_directive
