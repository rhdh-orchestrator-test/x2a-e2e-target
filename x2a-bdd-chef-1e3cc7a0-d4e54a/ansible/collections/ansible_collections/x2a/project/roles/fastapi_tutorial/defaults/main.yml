---
app_path: /opt/fastapi-tutorial
repository: https://github.com/dibanez/fastapi_tutorial.git
repository_revision: main
service_port: 8000
service_name: fastapi-tutorial
db_user: fastapi
db_password: ""
db_name: fastapi_db
db_host: localhost
# Credential variable names used by the tasks; AAP extra vars override these defaults.
db_username: "{{ db_user }}"
database_name: "{{ db_name }}"
database_host: "{{ db_host }}"
fastapi_tutorial_secure_logging: true
