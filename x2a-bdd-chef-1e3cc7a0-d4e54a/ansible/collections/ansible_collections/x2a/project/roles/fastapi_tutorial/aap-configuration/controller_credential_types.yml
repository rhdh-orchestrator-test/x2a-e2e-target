---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Hardcoded PostgreSQL application credential that must be migrated to an AAP credential or approved external secret provider.
    kind: cloud
    inputs:
      fields:
        - id: db_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application and database provisioning tasks.
        - id: db_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL fastapi role, used in the application DATABASE_URL and role creation.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the FastAPI application.
        - id: database_host
          type: string
          label: Database Host
          help_text: PostgreSQL server hostname or address; currently localhost.
      required:
        - db_username
        - db_password
        - database_name
        - database_host
    injectors:
      extra_vars:
        db_username: !unsafe "{{ db_username }}"
        db_password: !unsafe "{{ db_password }}"
        database_name: !unsafe "{{ database_name }}"
        database_host: !unsafe "{{ database_host }}"
