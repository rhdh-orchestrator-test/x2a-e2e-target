---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install Fedora and RHEL packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Install Debian and other platform packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] not in ['RedHat', 'Fedora']

- name: Initialize PostgreSQL on Fedora and RHEL
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_path }}" # noqa: R114 - path is controlled by role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"
    recurse: true

- name: Synchronize application repository  # noqa: R104 - repository URL is controlled by trusted deployment configuration
  ansible.builtin.git:
    repo: "{{ repository }}" # noqa: R106 - repository source is controlled by trusted deployment configuration
    dest: "{{ app_path }}" # noqa: R114 - destination is controlled by role defaults
    version: "{{ repository_revision }}"
    update: true

- name: Create Python virtual environment  # noqa: R101 - command path is controlled by trusted role defaults
  ansible.builtin.command:
    cmd: python3 -m venv {{ app_path }}/venv
    creates: "{{ app_path }}/venv" # noqa: R114 - path is controlled by role defaults

- name: Install application Python dependencies  # noqa: R113 - dependency path is controlled by trusted role defaults
  ansible.builtin.pip:
    requirements: "{{ app_path }}/requirements.txt"
    virtualenv: "{{ app_path }}/venv"
    state: present

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create PostgreSQL role  # noqa: R101 - SQL command uses deployment-configured database identifiers
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}'" | grep -q 1 || \
        psql -c "CREATE USER {{ db_username }} WITH PASSWORD '{{ db_password }}';"
    executable: /bin/bash
  become: true # noqa: R108 - task must become postgres to manage PostgreSQL roles
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"
  changed_when: false

- name: Create PostgreSQL database  # noqa: R101 - SQL command uses deployment-configured database identifiers
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}'" | grep -q 1 || \
        psql -c "CREATE DATABASE {{ database_name }} OWNER {{ db_username }};"
    executable: /bin/bash
  become: true # noqa: R108 - task must become postgres to manage PostgreSQL databases
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"
  changed_when: false

- name: Grant PostgreSQL database privileges  # noqa: R101 - SQL command uses deployment-configured database identifiers
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ db_username }};
  become: true # noqa: R108 - task must become postgres to grant database privileges
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"
  changed_when: false

- name: Write application environment configuration
  ansible.builtin.copy:
    dest: "{{ app_path }}/.env" # noqa: R114 - path is controlled by role defaults
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ database_host }}/{{ database_name }}
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write systemd service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/{{ service_name }}.service # noqa: R114 - service name is controlled by role defaults
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ app_path }}
      Environment="PATH={{ app_path }}/venv/bin"
      ExecStart={{ app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Reload systemd after writing FastAPI service unit
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start FastAPI service
  ansible.builtin.service:
    name: "{{ service_name }}"
    state: started
    enabled: true
