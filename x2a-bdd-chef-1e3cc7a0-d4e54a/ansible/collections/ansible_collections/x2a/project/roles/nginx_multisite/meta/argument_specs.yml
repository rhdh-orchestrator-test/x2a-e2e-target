---
argument_specs:
  main:
    short_description: Install and configure a secure nginx multisite environment
    description:
      - Installs nginx, fail2ban, UFW, and TLS dependencies.
      - Configures security settings and virtual hosts from a role-defined site dictionary.
    options:
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory for generated TLS certificates.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory for generated TLS private keys.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether fail2ban protection is enabled.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether UFW firewall configuration is enabled.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether root SSH login is disabled.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether SSH password authentication is allowed.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the site token.
      nginx_multisite_sites:
        type: dict
        required: false
        default: {}
        description: Site definitions keyed by hostname, including document_root, index_source, and ssl_enabled.
      site_token:
        type: str
        required: true
        description: Token injected by an AAP credential type and stored for nginx use.
