---
controller_credential_types:
  - name: Chef Encrypted Data Bag Nginx Site Token
    description: Token loaded from the Chef encrypted data bag nginx_secrets/site and written to the protected nginx secret file.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Nginx Site Token
          secret: true
          help_text: Secret token used by nginx and stored in the protected local site_token file.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
