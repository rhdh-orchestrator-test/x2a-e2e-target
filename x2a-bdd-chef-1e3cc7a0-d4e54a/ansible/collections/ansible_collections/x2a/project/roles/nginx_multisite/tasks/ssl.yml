---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_certificate_path }}" # noqa: R114 - path is a role default
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}" # noqa: R114 - path is a role default
    owner: root
    group: ssl-cert
    mode: "0710"
    state: directory

- name: Check site certificate
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt" # noqa: R114 - path from role-defined sites
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  register: nginx_multisite_certificates

- name: Check site private key
  ansible.builtin.stat:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key" # noqa: R114 - path from role-defined sites
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  register: nginx_multisite_private_keys

- name: Generate self-signed site certificates  # noqa: L039,R101 - registered certificate results are from prior tasks; command uses role-defined paths and site data
  ansible.builtin.shell:
    cmd: |
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        -keyout "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key" \
        -out "{{ nginx_multisite_ssl_certificate_path }}/{{ item_ssl_site['key'] }}.crt" \
        -subj "/C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_ssl_site['key'] }}/emailAddress=admin@example.com"
  when:
    - item_ssl_site['value']['ssl_enabled'] | default(false) | bool
    - not (nginx_multisite_certificates.results[ansible_loop.index0]['stat']['exists'] and
      nginx_multisite_private_keys.results[ansible_loop.index0]['stat']['exists'])
  changed_when: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
  notify: Reload nginx

- name: Set private key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_ssl_site['key'] }}.key" # noqa: R114 - path from role-defined sites
    owner: root
    group: ssl-cert
    mode: "0640"
    state: file
  when: item_ssl_site['value']['ssl_enabled'] | default(false) | bool
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_ssl_site
