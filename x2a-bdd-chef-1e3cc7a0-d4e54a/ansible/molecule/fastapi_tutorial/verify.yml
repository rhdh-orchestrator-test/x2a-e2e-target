---
# Unsupported pre-flight checks: version-only diagnostics, repository HEAD hash, service/log
# output without an expected value, filesystem listings/size, and the password-based
# PostgreSQL credential test (the credential must not be exposed by verification).
- name: Verify fastapi-tutorial deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert Fedora or RHEL package set
      ansible.builtin.assert:
        that:
          - "'python3' in ansible_facts['packages']"
          - "'python3-pip' in ansible_facts['packages']"
          - "'git' in ansible_facts['packages']"
          - "'postgresql-server' in ansible_facts['packages']"
          - "'postgresql-contrib' in ansible_facts['packages']"
          - "'libpq-devel' in ansible_facts['packages']"
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Assert Debian or Ubuntu package set
      ansible.builtin.assert:
        that:
          - "'python3' in ansible_facts['packages']"
          - "'python3-pip' in ansible_facts['packages']"
          - "'python3-venv' in ansible_facts['packages']"
          - "'git' in ansible_facts['packages']"
          - "'postgresql' in ansible_facts['packages']"
          - "'postgresql-contrib' in ansible_facts['packages']"
          - "'libpq-dev' in ansible_facts['packages']"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Check Fedora or RHEL PostgreSQL initialization marker
      ansible.builtin.stat:
        path: /var/lib/pgsql/data/PG_VERSION
      register: item_pg_version
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Assert Fedora or RHEL PostgreSQL is initialized
      ansible.builtin.assert:
        that:
          - item_pg_version['stat']['isreg']
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Check application directory
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: item_app_directory

    - name: Assert application directory exists
      ansible.builtin.assert:
        that:
          - item_app_directory['stat']['isdir']

    - name: Check repository remote
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - remote
          - -v
      register: item_git_remote
      changed_when: false

    - name: Assert configured repository remote
      ansible.builtin.assert:
        that:
          - "'https://github.com/dibanez/fastapi_tutorial.git' in item_git_remote['stdout']"

    - name: Check repository branch
      ansible.builtin.command:
        argv:
          - git
          - -C
          - /opt/fastapi-tutorial
          - rev-parse
          - --abbrev-ref
          - HEAD
      register: item_git_branch
      changed_when: false

    - name: Assert repository is on main
      ansible.builtin.assert:
        that:
          - item_git_branch['stdout'] | trim == 'main'

    - name: Check application requirements file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/requirements.txt
      register: item_requirements

    - name: Assert application requirements file exists
      ansible.builtin.assert:
        that:
          - item_requirements['stat']['isreg']

    - name: Check virtual environment executables
      ansible.builtin.stat:
        path: "{{ item_venv_executable }}"
      loop:
        - /opt/fastapi-tutorial/venv/bin/python
        - /opt/fastapi-tutorial/venv/bin/pip
        - /opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_venv_executable
      register: item_venv_stats

    - name: Assert virtual environment executables exist
      ansible.builtin.assert:
        that:
          - item_venv_stat['stat']['isreg']
          - item_venv_stat['stat']['executable']
      loop: "{{ item_venv_stats['results'] }}"
      loop_control:
        loop_var: item_venv_stat

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert PostgreSQL service is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts['services']['postgresql.service']['status'] == 'enabled'"
          - "ansible_facts['services']['postgresql.service']['state'] == 'running'"

    - name: Check PostgreSQL role
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT 1 FROM pg_roles WHERE rolname = 'fastapi';
      register: item_pg_role
      changed_when: false

    - name: Assert PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - item_pg_role['stdout'] | trim == '1'

    - name: Check PostgreSQL database and owner
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT datname || ':' || pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'fastapi_db';
      register: item_pg_database
      changed_when: false

    - name: Assert PostgreSQL database and owner
      ansible.builtin.assert:
        that:
          - item_pg_database['stdout'] | trim == 'fastapi_db:fastapi'

    - name: Check environment file metadata
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/.env
      register: item_env_stat

    - name: Assert environment file ownership and mode
      ansible.builtin.assert:
        that:
          - item_env_stat['stat']['isreg']
          - item_env_stat['stat']['pw_name'] == 'root'
          - item_env_stat['stat']['gr_name'] == 'root'
          - item_env_stat['stat']['mode'] == '0644'

    - name: Read environment file
      ansible.builtin.slurp:
        src: /opt/fastapi-tutorial/.env
      register: item_env_content

    - name: Assert expected environment configuration
      ansible.builtin.assert:
        that:
          - "'PROJECT_NAME=\"FastAPI Tutorial\"' in (item_env_content['content'] | b64decode)"
          - "'API_VERSION=1.0.0' in (item_env_content['content'] | b64decode)"
          - "'DATABASE_URL=postgresql://fastapi:' in (item_env_content['content'] | b64decode)"

    - name: Read systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/fastapi-tutorial.service
      register: item_unit_content

    - name: Assert expected systemd unit configuration
      ansible.builtin.assert:
        that:
          - "'Description=FastAPI Tutorial Service' in (item_unit_content['content'] | b64decode)"
          - "'WorkingDirectory=/opt/fastapi-tutorial' in (item_unit_content['content'] | b64decode)"
          - "'ExecStart=/opt/fastapi-tutorial/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000' in (item_unit_content['content'] | b64decode)"
          - "'Restart=always' in (item_unit_content['content'] | b64decode)"

    - name: Verify systemd unit syntax
      ansible.builtin.command:
        argv:
          - systemd-analyze
          - verify
          - /etc/systemd/system/fastapi-tutorial.service
      changed_when: false

    - name: Assert fastapi-tutorial service is enabled and active
      ansible.builtin.assert:
        that:
          - "ansible_facts['services']['fastapi-tutorial.service']['status'] == 'enabled'"
          - "ansible_facts['services']['fastapi-tutorial.service']['state'] == 'running'"

    - name: Check FastAPI listening port
      ansible.builtin.command:
        argv:
          - ss
          - -tlnp
      register: item_listening_sockets
      changed_when: false

    - name: Assert FastAPI listens on port 8000
      ansible.builtin.assert:
        that:
          - item_listening_sockets['stdout'] is search(':8000')

    - name: Check FastAPI endpoint response
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --output
          - /dev/null
          - --write-out
          - '%{http_code}'
          - http://127.0.0.1:8000/
      register: item_fastapi_endpoint
      changed_when: false

    - name: Assert FastAPI endpoint returns an HTTP response
      ansible.builtin.assert:
        that:
          - item_fastapi_endpoint['rc'] == 0
          - item_fastapi_endpoint['stdout'] is match('^[1-5][0-9][0-9]$')

    - name: Check FastAPI process
      ansible.builtin.command:
        argv:
          - pgrep
          - -af
          - uvicorn app.main:app
      register: item_fastapi_process
      changed_when: false

    - name: Assert FastAPI process is running
      ansible.builtin.assert:
        that:
          - item_fastapi_process['rc'] == 0
