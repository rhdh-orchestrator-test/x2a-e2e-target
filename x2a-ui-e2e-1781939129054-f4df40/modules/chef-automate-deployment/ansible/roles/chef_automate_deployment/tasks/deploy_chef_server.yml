---
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Check if Chef Automate CLI already exists
  ansible.builtin.stat:
    path: "{{ chef_automate_cli_path }}"
  register: chef_automate_cli_stat
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }} && chmod +x {{ chef_automate_cli_path }}
  args:
    executable: /bin/bash
  when: not chef_automate_cli_stat.stat.exists or not chef_automate_cli_stat.stat.executable
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product infra-server --accept-terms-and-mlsa=true"
    creates: /etc/chef-automate/config.toml
  become: true
- name: Create Chef admin user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ username }} "{{ chef_user_longname }}" {{ chef_user_email }} "{{ password }}" --filename {{ chef_user_key_filename }}
    creates: "{{ chef_user_key_filename }}"
  become: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_longname }}" --association_user {{ username }} --filename {{ chef_org_key_filename }}
    creates: "{{ chef_org_key_filename }}"
  become: true
