- name: Converge
  hosts: all
  gather_facts: false
  vars:
    username: chef_admin
    password: chef_password
    chef_hostname: automate.chef.lab
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
    chef_user_key_filename: /tmp/molecule_test/chef_admin.pem
    chef_org_key_filename: /tmp/molecule_test/lab-validator.pem
    chef_deploy_automate: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/hostname
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl files
    ansible.builtin.file:
      path: /tmp/molecule_test/proc/sys/vm
      state: directory
      mode: '0755'
      recurse: true
  - name: Create sysctl vm.max_map_count file
    ansible.builtin.copy:
      content: '262144'
      dest: /tmp/molecule_test/proc/sys/vm/max_map_count
      mode: '0644'
  - name: Create sysctl vm.dirty_expire_centisecs file
    ansible.builtin.copy:
      content: '20000'
      dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI mock'''
      dest: '{{ chef_automate_cli_path }}'
      mode: '0755'
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "# Mock Chef Automate config file\n[global]\n  v1 = true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create user key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz

        -----END RSA PRIVATE KEY-----

        '
      dest: '{{ chef_user_key_filename }}'
      mode: '0600'
  - name: Create organization validator key file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba

        -----END RSA PRIVATE KEY-----

        '
      dest: '{{ chef_org_key_filename }}'
      mode: '0600'
