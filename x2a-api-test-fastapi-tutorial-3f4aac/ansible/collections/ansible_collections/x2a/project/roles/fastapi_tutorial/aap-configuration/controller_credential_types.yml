---
controller_credential_types:
  - name: PostgreSQL FastAPI Database
    description: Credentials for the FastAPI application PostgreSQL role and database. The current password is hardcoded in the Chef recipe and must be rotated 
      and stored in a protected AAP-backed secret.
    kind: cloud
    inputs:
      fields:
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application; currently fastapi.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the FastAPI PostgreSQL role; the current value is fastapi_password and must be rotated.
        - id: database_name
          type: string
          label: Database Name
          help_text: PostgreSQL database used by the application; currently fastapi_db.
      required:
        - database_username
        - database_password
        - database_name
    injectors:
      extra_vars:
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
        database_name: !unsafe "{{ database_name }}"
  - name: Encrypted Chef Data Bag Site Token
    description: Encrypted site secret from the nginx_secrets/site Chef data bag item. It is not consumed by the analyzed FastAPI recipe, but is identified as 
      an encrypted secret reference requiring migration only if another execution path still uses it.
    kind: cloud
    inputs:
      fields:
        - id: item_id
          type: string
          label: Data Bag Item ID
          help_text: Encrypted Chef data bag item identifier; currently site.
        - id: site_token
          type: string
          label: Site Token
          secret: true
          help_text: Encrypted token stored in the nginx_secrets/site data bag item; rotate before migration.
      required:
        - site_token
    injectors:
      extra_vars:
        item_id: !unsafe "{{ item_id }}"
        site_token: !unsafe "{{ site_token }}"
