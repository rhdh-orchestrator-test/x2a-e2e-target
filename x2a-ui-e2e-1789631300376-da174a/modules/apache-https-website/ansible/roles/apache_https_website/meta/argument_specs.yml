---
argument_specs:
  main:
    short_description: Install and configure Apache HTTPS website with self-signed certificates
    description:
      - Installs Apache web server with SSL support
      - Generates self-signed SSL certificates for HTTPS
      - Deploys a simple Hello World website
      - Configures virtual host with SSL encryption
    options:
      apache_version:
        type: str
        required: false
        default: 2.4.41-4ubuntu3.10
        description: Apache package version to install
      site_name:
        type: str
        required: false
        default: helloworld
        description: Virtual host name for the website
      document_root:
        type: str
        required: false
        default: /var/www/helloworld
        description: Web root directory for the website
      site_title:
        type: str
        required: false
        default: Test Site
        description: HTML page title for the website
      site_content:
        type: str
        required: false
        default: Hello, world!
        description: Main content displayed on the website
      ssl_cert_path:
        type: str
        required: false
        default: /etc/apache2/certs
        description: Directory path for SSL certificates
      common_name:
        type: str
        required: false
        default: myhost
        description: Common name for the SSL certificate
      apache_ssl_packages:
        type: list
        elements: str
        required: false
        default:
          - curl
          - openssl
          - python3-openssl
        description: List of SSL-related packages to install
