---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check configuration files exist
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /etc/redis/6379.conf
        - /etc/memcached.conf
      loop_control:
        loop_var: item_config
      register: config_stat_results

    - name: Assert configuration files were created
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected configuration file not found"
      loop: "{{ config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check Redis log directory exists
      ansible.builtin.stat:
        path: /var/log/redis
      register: redis_log_dir_stat

    - name: Assert Redis log directory was created
      ansible.builtin.assert:
        that:
          - redis_log_dir_stat['stat']['exists']
          - redis_log_dir_stat['stat']['isdir']
        fail_msg: "Redis log directory not found"

    - name: Check services are running
      ansible.builtin.service_facts:

    - name: Assert Redis service is active
      ansible.builtin.assert:
        that:
          - "'redis_6379.service' in ansible_facts.services"
          - "ansible_facts.services['redis_6379.service']['state'] == 'running'"
        fail_msg: "Redis service not running"

    - name: Assert memcached service is active
      ansible.builtin.assert:
        that:
          - "'memcached.service' in ansible_facts.services"
          - "ansible_facts.services['memcached.service']['state'] == 'running'"
        fail_msg: "Memcached service not running"

    - name: Check Redis port is listening
      ansible.builtin.wait_for:
        port: 6379
        host: localhost
        timeout: 10

    - name: Check memcached port is listening
      ansible.builtin.wait_for:
        port: 11211
        host: localhost
        timeout: 10

    - name: Check Redis configuration content
      ansible.builtin.slurp:
        src: /etc/redis/6379.conf
      register: redis_config_content

    - name: Assert Redis password authentication is configured
      ansible.builtin.assert:
        that:
          - "'requirepass' in redis_config_content['content'] | b64decode"
        fail_msg: "Redis password authentication not configured"

    - name: Assert Redis cleanup patterns were removed
      ansible.builtin.assert:
        that:
          - "'replica-serve-stale-data' not in redis_config_content['content'] | b64decode"
          - "'replica-read-only' not in redis_config_content['content'] | b64decode"
          - "'repl-ping-replica-period' not in redis_config_content['content'] | b64decode"
          - "'client-output-buffer-limit' not in redis_config_content['content'] | b64decode"
          - "'replica-priority' not in redis_config_content['content'] | b64decode"
        fail_msg: "Redis configuration cleanup patterns not removed"

    - name: Test Redis connectivity with authentication
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a {{ cache_redis_password }} ping
      register: redis_ping_result
      changed_when: false
      vars:
        cache_redis_password: redis_secure_password_123

    - name: Assert Redis authentication works
      ansible.builtin.assert:
        that:
          - redis_ping_result['stdout'] == 'PONG'
        fail_msg: "Redis authentication test failed"

    - name: Test memcached connectivity
      ansible.builtin.command:
        cmd: |
          echo "stats" | nc localhost 11211
      register: memcached_stats_result
      changed_when: false

    - name: Assert memcached is responding
      ansible.builtin.assert:
        that:
          - "'STAT' in memcached_stats_result['stdout']"
        fail_msg: "Memcached connectivity test failed"

    - name: Test Redis data operations
      ansible.builtin.command:
        cmd: redis-cli -p 6379 -a {{ cache_redis_password }} {{ item_redis_cmd }}
      loop:
        - set test_key "test_value"
        - get test_key
        - del test_key
      loop_control:
        loop_var: item_redis_cmd
      register: redis_data_results
      changed_when: false
      vars:
        cache_redis_password: redis_secure_password_123

    - name: Assert Redis data operations work
      ansible.builtin.assert:
        that:
          - redis_data_results['results'][0]['stdout'] == 'OK'
          - redis_data_results['results'][1]['stdout'] == 'test_value'
          - redis_data_results['results'][2]['stdout'] == '1'
        fail_msg: "Redis data operations test failed"