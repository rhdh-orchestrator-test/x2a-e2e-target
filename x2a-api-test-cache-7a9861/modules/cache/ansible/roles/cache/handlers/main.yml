---
- name: Restart redis
  ansible.builtin.service:
    name: redis_{{ cache_redis_port }}
    state: restarted
- name: Restart memcached
  ansible.builtin.service:
    name: memcached
    state: restarted
- name: Reload redis
  ansible.builtin.service:
    name: redis_{{ cache_redis_port }}
    state: reloaded
