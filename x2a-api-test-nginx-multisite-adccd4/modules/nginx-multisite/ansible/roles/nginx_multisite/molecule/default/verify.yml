---
- name: Verify nginx_multisite role
  hosts: all
  gather_facts: false
  tasks:
    # Service status verification
    - name: Check service status
      ansible.builtin.service_facts:

    - name: Assert nginx service is running
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - "ansible_facts.services['nginx.service']['state'] == 'running'"
        fail_msg: "Nginx service is not running"

    - name: Assert fail2ban service is running
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - "ansible_facts.services['fail2ban.service']['state'] == 'running'"
        fail_msg: "Fail2ban service is not running"

    # Nginx configuration validation
    - name: Test nginx configuration syntax
      ansible.builtin.command:
        cmd: nginx -t
      register: nginx_test_result
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - nginx_test_result['rc'] == 0
        fail_msg: "Nginx configuration test failed"

    # Check main configuration files exist
    - name: Check main nginx configuration files
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
      loop_control:
        loop_var: item_config
      register: main_config_stat_results

    - name: Assert main configuration files exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected configuration file not found"
      loop: "{{ main_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Check site-specific nginx configurations
    - name: Check nginx site configurations
      ansible.builtin.stat:
        path: "{{ item_site_config }}"
      loop:
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_site_config
      register: site_config_stat_results

    - name: Assert site configurations exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected site configuration not found"
      loop: "{{ site_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Check document root directories and index files
    - name: Check document root directories
      ansible.builtin.stat:
        path: "{{ item_docroot }}"
      loop:
        - /opt/server/test
        - /opt/server/ci
        - /opt/server/status
      loop_control:
        loop_var: item_docroot
      register: docroot_stat_results

    - name: Assert document root directories exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isdir']
        fail_msg: "Expected document root directory not found"
      loop: "{{ docroot_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Check index.html files
      ansible.builtin.stat:
        path: "{{ item_index }}"
      loop:
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_index
      register: index_stat_results

    - name: Assert index.html files exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected index.html file not found"
      loop: "{{ index_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Check SSL certificates
    - name: Check SSL certificates
      ansible.builtin.stat:
        path: "{{ item_ssl_cert }}"
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_ssl_cert
      register: ssl_cert_stat_results

    - name: Assert SSL certificates exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate not found"
      loop: "{{ ssl_cert_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Check SSL private keys
    - name: Check SSL private keys
      ansible.builtin.stat:
        path: "{{ item_ssl_key }}"
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_ssl_key
      register: ssl_key_stat_results

    - name: Assert SSL private keys exist
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected SSL private key not found"
      loop: "{{ ssl_key_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    # Verify index.html content for each site
    - name: Read test site index.html content
      ansible.builtin.slurp:
        src: /opt/server/test/index.html
      register: test_index_content

    - name: Assert test site content is correct
      ansible.builtin.assert:
        that:
          - "'test.cluster.local' in (test_index_content['content'] | b64decode)"
        fail_msg: "Test site index.html does not contain expected content"

    - name: Read ci site index.html content
      ansible.builtin.slurp:
        src: /opt/server/ci/index.html
      register: ci_index_content

    - name: Assert ci site content is correct
      ansible.builtin.assert:
        that:
          - "'ci.cluster.local' in (ci_index_content['content'] | b64decode)"
        fail_msg: "CI site index.html does not contain expected content"

    - name: Read status site index.html content
      ansible.builtin.slurp:
        src: /opt/server/status/index.html
      register: status_index_content

    - name: Assert status site content is correct
      ansible.builtin.assert:
        that:
          - "'status.cluster.local' in (status_index_content['content'] | b64decode)"
        fail_msg: "Status site index.html does not contain expected content"

    # Check network ports are listening
    - name: Check HTTP port is listening
      ansible.builtin.wait_for:
        port: 80
        host: 0.0.0.0
        timeout: 5

    - name: Check HTTPS port is listening
      ansible.builtin.wait_for:
        port: 443
        host: 0.0.0.0
        timeout: 5

    # Verify SSL certificate validity for each site
    - name: Verify SSL certificate for test.cluster.local
      ansible.builtin.command:
        cmd: |
          openssl x509 -in /etc/ssl/certs/test.cluster.local.crt -noout -text
      register: test_ssl_verify
      changed_when: false

    - name: Assert test SSL certificate contains correct CN
      ansible.builtin.assert:
        that:
          - "'CN=test.cluster.local' in test_ssl_verify['stdout']"
        fail_msg: "Test SSL certificate does not contain correct CN"

    - name: Verify SSL certificate for ci.cluster.local
      ansible.builtin.command:
        cmd: |
          openssl x509 -in /etc/ssl/certs/ci.cluster.local.crt -noout -text
      register: ci_ssl_verify
      changed_when: false

    - name: Assert ci SSL certificate contains correct CN
      ansible.builtin.assert:
        that:
          - "'CN=ci.cluster.local' in ci_ssl_verify['stdout']"
        fail_msg: "CI SSL certificate does not contain correct CN"

    - name: Verify SSL certificate for status.cluster.local
      ansible.builtin.command:
        cmd: |
          openssl x509 -in /etc/ssl/certs/status.cluster.local.crt -noout -text
      register: status_ssl_verify
      changed_when: false

    - name: Assert status SSL certificate contains correct CN
      ansible.builtin.assert:
        that:
          - "'CN=status.cluster.local' in status_ssl_verify['stdout']"
        fail_msg: "Status SSL certificate does not contain correct CN"

    # Check fail2ban status
    - name: Check fail2ban client status
      ansible.builtin.command:
        cmd: fail2ban-client status
      register: fail2ban_status
      changed_when: false

    - name: Assert fail2ban is active
      ansible.builtin.assert:
        that:
          - fail2ban_status['rc'] == 0
          - "'Status' in fail2ban_status['stdout']"
        fail_msg: "Fail2ban is not active"

    # Check UFW firewall status
    - name: Check UFW status
      ansible.builtin.command:
        cmd: ufw status verbose
      register: ufw_status
      changed_when: false

    - name: Assert UFW is active
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status['stdout']"
        fail_msg: "UFW firewall is not active"