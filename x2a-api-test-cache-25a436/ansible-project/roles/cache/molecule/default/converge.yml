---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    # Mock credential for testing
    redis_password: "redis_secure_password_123"
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item_dir }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/redis
        - /tmp/molecule_test/var/log/redis
        - /tmp/molecule_test/var/lib/redis
        - /tmp/molecule_test/var/run/redis
      loop_control:
        loop_var: item_dir

    - name: Create Redis configuration file
      ansible.builtin.copy:
        content: |
          # Redis configuration file
          # Generated by Ansible

          # Network
          bind 127.0.0.1
          port 6379

          # General
          daemonize yes
          pidfile /var/run/redis/redis-server.pid
          timeout 0
          tcp-keepalive 0

          # Logging
          loglevel notice
          logfile /var/log/redis/redis-server.log

          # Snapshotting
          save 900 1
          save 300 10
          save 60 10000
          stop-writes-on-bgsave-error yes
          rdbcompression yes
          rdbchecksum yes
          dbfilename dump.rdb
          dir /var/lib/redis

          # Security
          requirepass redis_secure_password_123

          # Limits
          maxclients 10000

          # Memory management
          maxmemory-policy noeviction

          # Append only file
          appendonly no
          appendfilename "appendonly.aof"
          appendfsync everysec
          no-appendfsync-on-rewrite no
          auto-aof-rewrite-percentage 100
          auto-aof-rewrite-min-size 64mb

          # Slow log
          slowlog-log-slower-than 10000
          slowlog-max-len 128

          # Event notification
          notify-keyspace-events ""

          # Advanced config
          hash-max-ziplist-entries 512
          hash-max-ziplist-value 64
          list-max-ziplist-entries 512
          list-max-ziplist-value 64
          set-max-intset-entries 512
          zset-max-ziplist-entries 128
          zset-max-ziplist-value 64
          hll-sparse-max-bytes 3000
          activerehashing yes
          client-output-buffer-limit normal 0 0 0
          client-output-buffer-limit slave 256mb 64mb 60
          client-output-buffer-limit pubsub 32mb 8mb 60
          hz 10
        dest: /tmp/molecule_test/etc/redis/6379.conf
        mode: "0640"
        backup: true

    - name: Create Redis log file
      ansible.builtin.copy:
        content: |
          # Redis log file placeholder
          # This file would contain Redis server logs
        dest: /tmp/molecule_test/var/log/redis/redis-server.log
        mode: "0644"
        backup: true

    - name: Create memcached configuration placeholder
      ansible.builtin.copy:
        content: |
          # Memcached configuration placeholder
          # Port: 11211
          # Memory: 64MB
          -p 11211
          -m 64
          -u memcache
        dest: /tmp/molecule_test/etc/memcached.conf
        mode: "0644"
        backup: true