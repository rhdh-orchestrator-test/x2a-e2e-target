---
# Cache role main tasks

- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install memcached and redis packages
  ansible.builtin.package:
    name:
      - memcached
      - redis-server
    state: present

- name: Create redis configuration directory
  ansible.builtin.file:
    path: "{{ cache_redis_config_file | dirname }}" # noqa: R114 - path from role defaults
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create redis data directory
  ansible.builtin.file:
    path: /var/lib/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Create redis runtime directory
  ansible.builtin.file:
    path: /var/run/redis
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Create redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}" # noqa: R114 - path from role defaults
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults
    owner: redis
    group: redis
    mode: "0640"
    backup: true
  notify: Restart redis

- name: Remove replica settings from Redis config
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults
    regexp: ^{{ item_setting }}.*$
    state: absent # noqa: R115 - removing config lines, not files; path from role defaults
    backup: true
  loop: "{{ cache_redis_replica_settings_to_remove }}"
  loop_control:
    loop_var: item_setting
  notify: Reload redis config

- name: Start and enable memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true

- name: Start and enable redis service
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
