---
argument_specs:
  main:
    short_description: Configure dual caching services - memcached and Redis with authentication
    description:
      - Installs and configures memcached service on default port 11211
      - Installs and configures Redis server with password authentication on port 6379
      - Creates Redis log directory with proper ownership
      - Removes replica-related settings from Redis configuration
      - Starts and enables both caching services
    options:
      redis_password:
        type: str
        required: true
        description: >-
          Redis authentication password injected by AAP credential type.
          Used for requirepass setting in Redis configuration.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port for Redis server to listen on.
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Directory path for Redis log files.
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Path to Redis configuration file.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: TCP port for memcached service (informational).
      cache_redis_replica_settings_to_remove:
        type: list
        elements: str
        required: false
        default:
          - replica-serve-stale-data
          - replica-read-only
          - repl-ping-replica-period
          - client-output-buffer-limit
          - replica-priority
        description: >-
          List of Redis replica-related configuration settings to remove
          from the Redis configuration file.
