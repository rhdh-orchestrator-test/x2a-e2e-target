---
controller_credential_types:
- name: Chef User Authentication
  description: Credential type for Chef User Authentication
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for the initial Chef user account
    - id: user_password
      type: string
      label: User Password
      secret: true
      help_text: Password for the initial Chef user account
    - id: user_full_name
      type: string
      label: User Full Name
      help_text: Full name for the Chef user
    - id: user_email
      type: string
      label: User Email
      help_text: Email address for the Chef user
    required:
    - username
    - user_password
    - user_full_name
    - user_email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      user_password: !unsafe '{{ user_password }}'
      user_full_name: !unsafe '{{ user_full_name }}'
      user_email: !unsafe '{{ user_email }}'
- name: Chef Organization Configuration
  description: Credential type for Chef Organization Configuration
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Name of the Chef organization to create
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name of the Chef organization
    required:
    - org_name
    - org_full_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
- name: Chef User PEM
  description: Credential type for Chef User PEM
  kind: cloud
  inputs:
    fields:
    - id: user_pem
      type: string
      label: User PEM File
      secret: true
      help_text: Authentication key for the Chef user
    required:
    - user_pem
  injectors:
    extra_vars:
      user_pem: !unsafe '{{ user_pem }}'
- name: Chef Organization Validator PEM
  description: Credential type for Chef Organization Validator PEM
  kind: cloud
  inputs:
    fields:
    - id: org_validator_pem
      type: string
      label: Organization Validator PEM
      secret: true
      help_text: Authentication key for the Chef organization
    required:
    - org_validator_pem
  injectors:
    extra_vars:
      org_validator_pem: !unsafe '{{ org_validator_pem }}'
