---
controller_credentials:
- name: Chef User Authentication - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef User Authentication
  update_secrets: true
  inputs:
    username: '{{ username }}'
    user_password: '{{ vault_user_password }}'
    user_full_name: '{{ user_full_name }}'
    user_email: '{{ user_email }}'
- name: Chef Organization Configuration - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef Organization Configuration
  update_secrets: true
  inputs:
    org_name: '{{ org_name }}'
    org_full_name: '{{ org_full_name }}'
- name: Chef User PEM - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef User PEM
  update_secrets: true
  inputs:
    user_pem: '{{ vault_user_pem }}'
- name: Chef Organization Validator PEM - chef_automate_deploy
  description: Credential for chef_automate_deploy
  organization: Default
  credential_type: Chef Organization Validator PEM
  update_secrets: true
  inputs:
    org_validator_pem: '{{ vault_org_validator_pem }}'
