---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/tmp
        - /tmp/molecule_test/usr/bin

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl settings
    - name: Create sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/usr/bin/chef-automate"
        mode: "0755"

    # Simulate Chef Server CLI
    - name: Create Chef Server CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Server CLI mock'\n"
        dest: "/tmp/molecule_test/usr/bin/chef-server-ctl"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.file:
        path: "/tmp/molecule_test/hab"
        state: directory
        mode: "0755"

    # Simulate user PEM file
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          EXAMPLE_PEM_CONTENT_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/admin.pem"
        mode: "0600"

    # Simulate organization validator PEM file
    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          EXAMPLE_ORG_VALIDATOR_PEM_CONTENT_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/chef-org-validator.pem"
        mode: "0600"

    # Simulate Chef Automate status output
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: chef-automate
          Status: running
        dest: "/tmp/molecule_test/chef-automate-status.txt"
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          Service: chef-server
          Status: running
        dest: "/tmp/molecule_test/chef-server-status.txt"
        mode: "0644"

    # Simulate user list output
    - name: Create user list file
      ansible.builtin.copy:
        content: |
          admin
          pivotal
        dest: "/tmp/molecule_test/chef-user-list.txt"
        mode: "0644"

    # Simulate organization list output
    - name: Create organization list file
      ansible.builtin.copy:
        content: |
          chef-org
          chef
        dest: "/tmp/molecule_test/chef-org-list.txt"
        mode: "0644"