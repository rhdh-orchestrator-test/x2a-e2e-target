---
- name: Validate credential variables
  ansible.builtin.include_tasks:
    file: validate_credentials.yml
- name: Configure system for Chef Automate
  ansible.builtin.include_tasks:
    file: system_config.yml
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.include_tasks:
    file: deploy_automate.yml
  when: chef_automate_products | length > 0 and 'automate' in chef_automate_products
- name: Deploy Chef Infra Server only
  ansible.builtin.include_tasks:
    file: deploy_chef_server.yml
  when: chef_automate_products | length == 0 or 'automate' not in chef_automate_products
- name: Setup Chef user and organization
  ansible.builtin.include_tasks:
    file: user_org_setup.yml
