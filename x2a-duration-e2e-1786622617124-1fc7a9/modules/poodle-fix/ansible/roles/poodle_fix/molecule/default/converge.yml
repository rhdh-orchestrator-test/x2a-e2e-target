- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache SSL config
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create mock Apache SSL configuration file
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        SSLProtocol all -SSLv3

        SSLCipherSuite HIGH:!aNULL:!MD5

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Create directory structure for SSH config
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/ssh
      state: directory
      mode: '0755'
  - name: Create mock SSH configuration file
    ansible.builtin.copy:
      content: '# Mock SSH configuration file

        Protocol 1,2

        '
      dest: /tmp/molecule_test/etc/ssh/sshd_config
      mode: '0644'
  - name: Apply POODLE fix to mock Apache SSL config
    ansible.builtin.replace:
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
  - name: Apply SSH protocol fix to mock SSH config
    ansible.builtin.lineinfile:
      path: /tmp/molecule_test/etc/ssh/sshd_config
      regexp: ^Protocol
      line: Protocol 2
      state: present
