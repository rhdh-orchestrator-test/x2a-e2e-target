---
- name: Create Chef Infra Server user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_user_name }} {{ chef_user_fullname }} {{ chef_user_email }} "{{ chef_user_password }}" --filename {{
      chef_user_pem_filename }}
  become: true
  args:
    creates: /root/{{ chef_user_pem_filename }}
  register: user_create_result
  changed_when: user_create_result.rc == 0
  no_log: true
- name: Create Chef Infra Server organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_org_name }} "{{ chef_org_fullname }}" --association_user {{ chef_user_name }} --filename {{
      chef_org_validator_pem_filename }}
  become: true
  args:
    creates: /root/{{ chef_org_validator_pem_filename }}
  register: org_create_result
  changed_when: org_create_result.rc == 0
- name: Copy user PEM file to home directory
  ansible.builtin.copy:
    src: /root/{{ chef_user_pem_filename }}
    dest: ~/{{ chef_user_pem_filename }}
    remote_src: true
    mode: "0600"
  become: true
  when: user_create_result is changed
- name: Copy organization validator PEM file to home directory
  ansible.builtin.copy:
    src: /root/{{ chef_org_validator_pem_filename }}
    dest: ~/{{ chef_org_validator_pem_filename }}
    remote_src: true
    mode: "0600"
  become: true
  when: org_create_result is changed
