---
- name: Install required packages for Chef Automate
  ansible.builtin.package:
    name:
      - curl
      - tar
      - unzip
      - jq
    state: present
  become: true
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms_and_mlsa | lower }} "
  become: true
  args:
    creates: /hab
  register: deploy_result
  changed_when: deploy_result.rc == 0
  notify: Wait for Chef Automate services
