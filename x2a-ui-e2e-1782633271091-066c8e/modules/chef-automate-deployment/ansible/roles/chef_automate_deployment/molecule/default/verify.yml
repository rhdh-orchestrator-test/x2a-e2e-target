---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname configuration
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found or empty"
        success_msg: "Hostname file exists and has content"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set to automate.chef.lab"
        success_msg: "Hostname set correctly to automate.chef.lab"
      when: hostname_file.stat.exists

    - name: Check hosts file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hosts
      register: hosts_file

    - name: Assert hosts file exists
      ansible.builtin.assert:
        that:
          - hosts_file.stat.exists
          - hosts_file.stat.size > 0
        fail_msg: "Hosts file not found or empty"
        success_msg: "Hosts file exists and has content"

    - name: Get hosts file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hosts
      register: hosts_content
      when: hosts_file.stat.exists

    - name: Assert hosts file contains automate.chef.lab entry
      ansible.builtin.assert:
        that:
          - "'automate.chef.lab' in (hosts_content.content | b64decode)"
        fail_msg: "Hosts file does not contain automate.chef.lab entry"
        success_msg: "Hosts file contains automate.chef.lab entry"
      when: hosts_file.stat.exists

    # Kernel parameter checks
    - name: Check vm.max_map_count file
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_file

    - name: Assert vm.max_map_count file exists
      ansible.builtin.assert:
        that:
          - max_map_count_file.stat.exists
          - max_map_count_file.stat.size > 0
        fail_msg: "vm.max_map_count file not found or empty"
        success_msg: "vm.max_map_count file exists and has content"

    - name: Get vm.max_map_count content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/max_map_count
      register: max_map_count_content
      when: max_map_count_file.stat.exists

    - name: Assert vm.max_map_count is set correctly
      ansible.builtin.assert:
        that:
          - (max_map_count_content.content | b64decode | trim) == "262144"
        fail_msg: "vm.max_map_count not set to 262144"
        success_msg: "vm.max_map_count set correctly to 262144"
      when: max_map_count_file.stat.exists

    - name: Check vm.dirty_expire_centisecs file
      ansible.builtin.stat:
        path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_file

    - name: Assert vm.dirty_expire_centisecs file exists
      ansible.builtin.assert:
        that:
          - dirty_expire_centisecs_file.stat.exists
          - dirty_expire_centisecs_file.stat.size > 0
        fail_msg: "vm.dirty_expire_centisecs file not found or empty"
        success_msg: "vm.dirty_expire_centisecs file exists and has content"

    - name: Get vm.dirty_expire_centisecs content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
      register: dirty_expire_centisecs_content
      when: dirty_expire_centisecs_file.stat.exists

    - name: Assert vm.dirty_expire_centisecs is set correctly
      ansible.builtin.assert:
        that:
          - (dirty_expire_centisecs_content.content | b64decode | trim) == "20000"
        fail_msg: "vm.dirty_expire_centisecs not set to 20000"
        success_msg: "vm.dirty_expire_centisecs set correctly to 20000"
      when: dirty_expire_centisecs_file.stat.exists

    # Chef Automate CLI checks
    - name: Check Chef Automate CLI file
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # User and organization PEM file checks
    - name: Check user PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/jtonello.pem
      register: user_pem_file

    - name: Assert user PEM file exists
      ansible.builtin.assert:
        that:
          - user_pem_file.stat.exists
          - user_pem_file.stat.size > 0
        fail_msg: "User PEM file not found or empty"
        success_msg: "User PEM file exists and has content"

    - name: Check organization validator PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/ansible/lab-validator.pem
      register: org_validator_pem_file

    - name: Assert organization validator PEM file exists
      ansible.builtin.assert:
        that:
          - org_validator_pem_file.stat.exists
          - org_validator_pem_file.stat.size > 0
        fail_msg: "Organization validator PEM file not found or empty"
        success_msg: "Organization validator PEM file exists and has content"

    # Chef Automate deployment checks
    - name: Check Chef Automate deployment directory
      ansible.builtin.stat:
        path: /tmp/molecule_test/hab
      register: hab_dir

    - name: Assert Chef Automate deployment directory exists
      ansible.builtin.assert:
        that:
          - hab_dir.stat.exists
          - hab_dir.stat.isdir
        fail_msg: "Chef Automate deployment directory not found"
        success_msg: "Chef Automate deployment directory exists"

    # The following checks would normally run on the actual system but are tagged with molecule-notest
    # since they can't run in a container environment

    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: chef-automate status
      register: chef_automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate services are running
      ansible.builtin.assert:
        that:
          - "'running' in chef_automate_status.stdout"
        fail_msg: "Chef Automate services not running"
        success_msg: "Chef Automate services are running"
      tags: molecule-notest

    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: chef-server-ctl status
      register: chef_server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server services are running
      ansible.builtin.assert:
        that:
          - "'run:' in chef_server_status.stdout"
        fail_msg: "Chef Infra Server services not running"
        success_msg: "Chef Infra Server services are running"
      tags: molecule-notest

    - name: Check Chef Infra Server user list
      ansible.builtin.command:
        cmd: chef-server-ctl user-list
      register: chef_server_user_list
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server user exists
      ansible.builtin.assert:
        that:
          - "'jtonello' in chef_server_user_list.stdout"
        fail_msg: "Chef Infra Server user not found"
        success_msg: "Chef Infra Server user exists"
      tags: molecule-notest

    - name: Check Chef Infra Server organization list
      ansible.builtin.command:
        cmd: chef-server-ctl org-list
      register: chef_server_org_list
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server organization exists
      ansible.builtin.assert:
        that:
          - "'lab' in chef_server_org_list.stdout"
        fail_msg: "Chef Infra Server organization not found"
        success_msg: "Chef Infra Server organization exists"
      tags: molecule-notest

    - name: Check network ports
      ansible.builtin.command:
        cmd: netstat -tulpn | grep 443
      register: netstat_output
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is listening on port 443
      ansible.builtin.assert:
        that:
          - "'0.0.0.0:443' in netstat_output.stdout"
        fail_msg: "Chef Automate not listening on port 443"
        success_msg: "Chef Automate is listening on port 443"
      tags: molecule-notest

    - name: Check Chef Automate API
      ansible.builtin.uri:
        url: https://localhost/api/v0/status
        validate_certs: false
      register: api_response
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate API is responding
      ansible.builtin.assert:
        that:
          - api_response.status == 200
        fail_msg: "Chef Automate API not responding"
        success_msg: "Chef Automate API is responding"
      tags: molecule-notest