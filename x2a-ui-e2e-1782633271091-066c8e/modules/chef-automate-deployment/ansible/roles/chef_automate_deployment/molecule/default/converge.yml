---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for testing
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/proc/sys/vm
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/ansible

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate hosts file
    - name: Create hosts file
      ansible.builtin.copy:
        content: |
          127.0.0.1 localhost
          127.0.1.1 automate.chef.lab automate
          
          # The following lines are desirable for IPv6 capable hosts
          ::1     localhost ip6-localhost ip6-loopback
          ff02::1 ip6-allnodes
          ff02::2 ip6-allrouters
        dest: /tmp/molecule_test/etc/hosts
        mode: "0644"

    # Simulate kernel parameters
    - name: Create vm.max_map_count file
      ansible.builtin.copy:
        content: "262144"
        dest: /tmp/molecule_test/proc/sys/vm/max_map_count
        mode: "0644"

    - name: Create vm.dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "20000"
        dest: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create chef-automate CLI file
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI v1.0.0"
          echo "This is a simulated CLI for molecule testing"
        dest: /tmp/molecule_test/home/ansible/chef-automate
        mode: "0755"

    # Simulate user and organization PEM files
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz
          ... simulated key content ...
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/home/ansible/jtonello.pem
        mode: "0600"

    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba
          ... simulated key content ...
          -----END RSA PRIVATE KEY-----
        dest: /tmp/molecule_test/home/ansible/lab-validator.pem
        mode: "0600"

    # Simulate Chef Automate status output
    - name: Create chef-automate status file
      ansible.builtin.copy:
        content: |
          Service: automate-postgresql       Status: running
          Service: automate-elasticsearch    Status: running
          Service: automate-es-gateway       Status: running
          Service: automate-ui               Status: running
          Service: automate-load-balancer    Status: running
          Service: automate-cs-nginx         Status: running
          Service: automate-cs-bookshelf     Status: running
          Service: automate-cs-oc-erchef     Status: running
        dest: /tmp/molecule_test/home/ansible/chef-automate-status
        mode: "0644"

    # Simulate Chef Server status output
    - name: Create chef-server-ctl status file
      ansible.builtin.copy:
        content: |
          run: bookshelf: (pid 12345) 1234s; run: log: (pid 12346) 1234s
          run: nginx: (pid 12347) 1234s; run: log: (pid 12348) 1234s
          run: oc_bifrost: (pid 12349) 1234s; run: log: (pid 12350) 1234s
          run: oc_id: (pid 12351) 1234s; run: log: (pid 12352) 1234s
          run: opscode-erchef: (pid 12353) 1234s; run: log: (pid 12354) 1234s
          run: postgresql: (pid 12355) 1234s; run: log: (pid 12356) 1234s
          run: redis_lb: (pid 12357) 1234s; run: log: (pid 12358) 1234s
        dest: /tmp/molecule_test/home/ansible/chef-server-ctl-status
        mode: "0644"

    # Simulate Chef Server user list
    - name: Create chef-server-ctl user-list file
      ansible.builtin.copy:
        content: |
          jtonello
          pivotal
        dest: /tmp/molecule_test/home/ansible/chef-server-ctl-user-list
        mode: "0644"

    # Simulate Chef Server org list
    - name: Create chef-server-ctl org-list file
      ansible.builtin.copy:
        content: |
          lab
        dest: /tmp/molecule_test/home/ansible/chef-server-ctl-org-list
        mode: "0644"

    # Simulate network listening ports
    - name: Create netstat output file
      ansible.builtin.copy:
        content: |
          tcp        0      0 0.0.0.0:443             0.0.0.0:*               LISTEN      12345/nginx
          tcp6       0      0 :::443                  :::*                    LISTEN      12345/nginx
        dest: /tmp/molecule_test/home/ansible/netstat-output
        mode: "0644"

    # Simulate Chef Automate API response
    - name: Create Chef Automate API response file
      ansible.builtin.copy:
        content: |
          {"version":"20220329155151"}
        dest: /tmp/molecule_test/home/ansible/chef-automate-api-response
        mode: "0644"