---
# Unsupported pre-flight diagnostics without a stated expected result: certificate
# details, curl response status, sysctl output, fail2ban-client output, journal logs,
# and package/service diagnostic output beyond the assertions below.
- name: Verify nginx multisite pre-flight expectations
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify required packages are installed
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts.packages
        quiet: true
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify nginx is running and enabled
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - ansible_facts.services['nginx.service']['state'] == 'running'
          - ansible_facts.services['nginx.service']['status'] == 'enabled'
        quiet: true

    - name: Verify fail2ban is running and enabled
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - ansible_facts.services['fail2ban.service']['state'] == 'running'
          - ansible_facts.services['fail2ban.service']['status'] == 'enabled'
        quiet: true

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      failed_when: false
      register: result_nginx_test

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - result_nginx_test['rc'] == 0
        quiet: true

    - name: Check required regular files
      ansible.builtin.stat:
        path: "{{ item_file['path'] }}"
      loop:
        - path: /etc/nginx/nginx.conf
        - path: /etc/nginx/conf.d/security.conf
        - path: /etc/fail2ban/jail.local
        - path: /etc/sysctl.d/99-security.conf
        - path: /opt/server/test/index.html
        - path: /etc/ssl/certs/test.cluster.local.crt
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/nginx/sites-available/test.cluster.local
        - path: /opt/server/ci/index.html
        - path: /etc/ssl/certs/ci.cluster.local.crt
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/nginx/sites-available/ci.cluster.local
        - path: /opt/server/status/index.html
        - path: /etc/ssl/certs/status.cluster.local.crt
        - path: /etc/ssl/private/status.cluster.local.key
        - path: /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_file
      register: result_regular_files

    - name: Assert required regular files exist
      ansible.builtin.assert:
        that:
          - item_file_result['stat']['exists']
          - item_file_result['stat']['isreg']
        quiet: true
      loop: "{{ result_regular_files['results'] }}"
      loop_control:
        loop_var: item_file_result

    - name: Check required document root directories
      ansible.builtin.stat:
        path: "{{ item_directory['path'] }}"
      loop:
        - path: /opt/server/test
        - path: /opt/server/ci
        - path: /opt/server/status
      loop_control:
        loop_var: item_directory
      register: result_document_roots

    - name: Assert required document root directories exist
      ansible.builtin.assert:
        that:
          - item_directory_result['stat']['exists']
          - item_directory_result['stat']['isdir']
        quiet: true
      loop: "{{ result_document_roots['results'] }}"
      loop_control:
        loop_var: item_directory_result

    - name: Check enabled site links
      ansible.builtin.stat:
        path: "{{ item_link['path'] }}"
        follow: false
      loop:
        - path: /etc/nginx/sites-enabled/test.cluster.local
        - path: /etc/nginx/sites-enabled/ci.cluster.local
        - path: /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_link
      register: result_site_links

    - name: Assert enabled site links exist
      ansible.builtin.assert:
        that:
          - item_link_result['stat']['exists']
          - item_link_result['stat']['islnk']
        quiet: true
      loop: "{{ result_site_links['results'] }}"
      loop_control:
        loop_var: item_link_result

    - name: Check SSH configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: result_sshd_config

    - name: Assert SSH root login is disabled
      ansible.builtin.assert:
        that:
          - result_sshd_config['content'] | b64decode is search('(?m)^\\s*PermitRootLogin\\s+no\\s*$')
        quiet: true

    - name: Assert SSH password authentication is disabled
      ansible.builtin.assert:
        that:
          - result_sshd_config['content'] | b64decode is search('(?m)^\\s*PasswordAuthentication\\s+no\\s*$')
        quiet: true

    - name: Check TLS private-key metadata
      ansible.builtin.stat:
        path: "{{ item_key['path'] }}"
      loop:
        - path: /etc/ssl/private/test.cluster.local.key
        - path: /etc/ssl/private/ci.cluster.local.key
        - path: /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: result_private_keys

    - name: Assert TLS private-key mode and ownership
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['mode'] == '0640'
          - item_key_result['stat']['pw_name'] == 'root'
          - item_key_result['stat']['gr_name'] == 'ssl-cert'
        quiet: true
      loop: "{{ result_private_keys['results'] }}"
      loop_control:
        loop_var: item_key_result

    - name: Check that the default site is absent
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: result_default_site

    - name: Assert that the default site is absent
      ansible.builtin.assert:
        that:
          - not result_default_site['stat']['exists']
        quiet: true

    - name: Verify HTTP port is listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 80
        state: started
        timeout: 5

    - name: Verify HTTPS port is listening
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 443
        state: started
        timeout: 5

    - name: Inspect firewall status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      changed_when: false
      failed_when: false
      register: result_ufw_status

    - name: Assert firewall denies incoming traffic by default
      ansible.builtin.assert:
        that:
          - result_ufw_status['stdout'] is search('(?im)^Default:\\s*deny\\s*\\(incoming\\)')
        quiet: true

    - name: Assert firewall allows SSH HTTP and HTTPS
      ansible.builtin.assert:
        that:
          - result_ufw_status['stdout'] is search('(?m)^\\s*22(?:/\\S+)?\\s+ALLOW')
          - result_ufw_status['stdout'] is search('(?m)^\\s*80(?:/\\S+)?\\s+ALLOW')
          - result_ufw_status['stdout'] is search('(?m)^\\s*443(?:/\\S+)?\\s+ALLOW')
        quiet: true
