---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install required system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path from role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize application repository # noqa: R104,R106 - repository URL and source come from a trusted role default
  ansible.builtin.git:
    repo: "{{ fastapi_tutorial_repository }}"
    dest: "{{ fastapi_tutorial_app_dir }}" # noqa: R114 - path from role default, not user input
    version: "{{ fastapi_tutorial_revision }}"
    update: true

- name: Create Python virtual environment # noqa: R101 - command path comes from a trusted role default
  ansible.builtin.command:
    cmd: python3 -m venv {{ fastapi_tutorial_venv_dir }}
    creates: "{{ fastapi_tutorial_venv_dir }}" # noqa: R114 - path from role default, not user input

- name: Install application dependencies # noqa: R113 - executable path comes from a trusted role default
  ansible.builtin.pip:
    requirements: "{{ fastapi_tutorial_app_dir }}/requirements.txt" # noqa: R114 - path from role default, not user input
    executable: "{{ fastapi_tutorial_venv_dir }}/bin/pip" # noqa: R114 - path from role default, not user input

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether PostgreSQL application role exists # noqa: L039,R101,R108 - credentials are validated by the prior validation task; SQL uses validated credentials and psql must run as the postgres system user
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}';
  register: fastapi_tutorial_role_check
  changed_when: false
  become: true
  become_user: postgres

- name: Create PostgreSQL application role # noqa: L039,R101,R108 - credentials and prior check are validated; SQL uses validated credentials and psql must run as the postgres system user
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - CREATE USER {{ db_username }} WITH PASSWORD '{{ db_password }}';
  changed_when: true
  when: fastapi_tutorial_role_check.stdout | trim != '1'
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Check whether application database exists # noqa: L039,R101,R108 - credentials are validated by the prior validation task; SQL uses the validated database name and psql must run as the postgres system user
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}';
  register: fastapi_tutorial_database_check
  changed_when: false
  become: true
  become_user: postgres

- name: Create application database # noqa: L039,R101,R108 - credentials and prior check are validated; SQL uses validated credentials and psql must run as the postgres system user
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - CREATE DATABASE {{ database_name }} OWNER {{ db_username }};
  changed_when: true
  when: fastapi_tutorial_database_check.stdout | trim != '1'
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Grant application database privileges # noqa: L039,R101,R108 - credentials are validated by the prior validation task; SQL uses validated credentials and psql must run as the postgres system user
  ansible.builtin.command:
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ db_username }};
  changed_when: false
  become: true
  become_user: postgres
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Write application environment configuration # noqa: L039 - credentials are validated by the prior validation task
  ansible.builtin.copy:
    dest: "{{ fastapi_tutorial_app_dir }}/.env" # noqa: R114 - path from role default, not user input
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ db_host }}/{{ database_name }}
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify: Restart fastapi tutorial
  no_log: "{{ fastapi_tutorial_secure_logging }}"

- name: Install FastAPI systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/fastapi-tutorial.service
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_tutorial_app_dir }}
      Environment="PATH={{ fastapi_tutorial_venv_dir }}/bin"
      ExecStart={{ fastapi_tutorial_venv_dir }}/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
      Restart=always
      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload systemd
    - Restart fastapi tutorial

- name: Reload systemd before managing FastAPI tutorial service
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start FastAPI tutorial service
  ansible.builtin.service:
    name: fastapi-tutorial
    enabled: true
    state: started
