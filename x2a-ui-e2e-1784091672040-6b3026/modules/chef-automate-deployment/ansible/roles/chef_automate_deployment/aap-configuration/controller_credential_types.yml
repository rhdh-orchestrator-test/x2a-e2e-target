---
controller_credential_types:
- name: Chef Automation User
  description: User credentials for Chef Automation deployment
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Chef Automation user account name
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Automation user account
    - id: email
      type: string
      label: Email
      help_text: Email address for Chef Automation user account
    - id: full_name
      type: string
      label: Full Name
      help_text: Full name of the Chef Automation user
    required:
    - username
    - password
    - email
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      email: !unsafe '{{ email }}'
      full_name: !unsafe '{{ full_name }}'
- name: Chef Organization
  description: Organization configuration for Chef deployment
  kind: cloud
  inputs:
    fields:
    - id: org_name
      type: string
      label: Organization Name
      help_text: Short name for the Chef organization
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: Full descriptive name for the Chef organization
    required:
    - org_name
    - org_full_name
  injectors:
    extra_vars:
      org_name: !unsafe '{{ org_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
