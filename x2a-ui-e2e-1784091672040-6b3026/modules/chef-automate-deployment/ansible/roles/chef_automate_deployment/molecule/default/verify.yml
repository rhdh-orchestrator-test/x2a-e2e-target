---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Check hostname configuration
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    # Check sysctl configuration
    - name: Check sysctl configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl configuration file was created
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl configuration contains required parameters
      ansible.builtin.assert:
        that:
          - sysctl_decoded_content is search('vm.max_map_count = 262144')
          - sysctl_decoded_content is search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "Sysctl configuration does not contain required parameters"
        success_msg: "Sysctl configuration contains required parameters"
      vars:
        sysctl_decoded_content: "{{ sysctl_content.content | b64decode }}"
      when: sysctl_file.stat.exists

    # Check Chef Automate CLI
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI was created
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Check Chef Automate configuration
    - name: Check Chef Automate config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: chef_automate_config

    - name: Assert Chef Automate config file was created
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
          - chef_automate_config.stat.size > 0
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    # Check Chef user key
    - name: Check Chef user key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/root/admin.pem
      register: chef_user_key

    - name: Assert Chef user key file was created
      ansible.builtin.assert:
        that:
          - chef_user_key.stat.exists
          - chef_user_key.stat.size > 0
        fail_msg: "Chef user key file not found"
        success_msg: "Chef user key file exists"

    # Check Chef organization key
    - name: Check Chef organization key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/root/lab-validator.pem
      register: chef_org_key

    - name: Assert Chef organization key file was created
      ansible.builtin.assert:
        that:
          - chef_org_key.stat.exists
          - chef_org_key.stat.size > 0
        fail_msg: "Chef organization key file not found"
        success_msg: "Chef organization key file exists"

    # Check Chef Automate service
    - name: Check Chef Automate service file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/systemd/system/chef-automate.service
      register: chef_automate_service

    - name: Assert Chef Automate service file was created
      ansible.builtin.assert:
        that:
          - chef_automate_service.stat.exists
          - chef_automate_service.stat.size > 0
        fail_msg: "Chef Automate service file not found"
        success_msg: "Chef Automate service file exists"

    # Check Chef Infra Server service
    - name: Check Chef Infra Server service file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/systemd/system/chef-server.service
      register: chef_server_service

    - name: Assert Chef Infra Server service file was created
      ansible.builtin.assert:
        that:
          - chef_server_service.stat.exists
          - chef_server_service.stat.size > 0
        fail_msg: "Chef Infra Server service file not found"
        success_msg: "Chef Infra Server service file exists"

    # System requirements checks - these can't run in container
    - name: Check system CPU requirements
      ansible.builtin.command:
        cmd: grep -c processor /proc/cpuinfo
      register: cpu_count
      changed_when: false
      tags: molecule-notest

    - name: Assert system has enough CPUs
      ansible.builtin.assert:
        that:
          - cpu_count.stdout | int >= 4
        fail_msg: "System does not have enough CPUs (minimum 4)"
        success_msg: "System has enough CPUs"
      tags: molecule-notest

    - name: Check system memory requirements
      ansible.builtin.command:
        cmd: free -g | grep Mem | awk '{print $2}'
      register: memory_size
      changed_when: false
      tags: molecule-notest

    - name: Assert system has enough memory
      ansible.builtin.assert:
        that:
          - memory_size.stdout | int >= 16
        fail_msg: "System does not have enough memory (minimum 16GB)"
        success_msg: "System has enough memory"
      tags: molecule-notest

    - name: Check disk space requirements
      ansible.builtin.command:
        cmd: df -h / | grep -v Filesystem | awk '{print $4}'
      register: disk_space
      changed_when: false
      tags: molecule-notest

    - name: Assert system has enough disk space
      ansible.builtin.assert:
        that:
          - disk_space.stdout is search('G')
          - disk_space.stdout | regex_replace('G', '') | float >= 40
        fail_msg: "System does not have enough disk space (minimum 40GB)"
        success_msg: "System has enough disk space"
      tags: molecule-notest

    # Service checks - these can't run in container
    - name: Check Chef Automate service status
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - ansible_facts.services['chef-automate.service'].state == 'running'
        fail_msg: "Chef Automate service is not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    - name: Assert Chef Infra Server service is running
      ansible.builtin.assert:
        that:
          - "'chef-server.service' in ansible_facts.services"
          - ansible_facts.services['chef-server.service'].state == 'running'
        fail_msg: "Chef Infra Server service is not running"
        success_msg: "Chef Infra Server service is running"
      tags: molecule-notest

    # Network connectivity check - can't run in container
    - name: Check network connectivity to Chef package repository
      ansible.builtin.uri:
        url: https://packages.chef.io
        timeout: 5
      tags: molecule-notest