- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname is configured correctly
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Read hostname content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/hostname
    register: hostname_content
    when: hostname_file.stat.exists
  - name: Assert hostname is set correctly
    ansible.builtin.assert:
      that:
      - (hostname_content.content | b64decode | trim) == chef_automate_hostname
      fail_msg: Hostname not set to {{ chef_automate_hostname }}
      success_msg: Hostname set correctly to {{ chef_automate_hostname }}
    when: hostname_file.stat.exists
  - name: Check vm.max_map_count file
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_file
  - name: Assert vm.max_map_count file exists
    ansible.builtin.assert:
      that:
      - max_map_count_file.stat.exists
      fail_msg: vm.max_map_count file not found
      success_msg: vm.max_map_count file exists
  - name: Read vm.max_map_count content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/max_map_count
    register: max_map_count_content
    when: max_map_count_file.stat.exists
  - name: Assert vm.max_map_count is set correctly
    ansible.builtin.assert:
      that:
      - (max_map_count_content.content | b64decode | trim) == chef_automate_vm_max_map_count | string
      fail_msg: vm.max_map_count not set to {{ chef_automate_vm_max_map_count }}
      success_msg: vm.max_map_count set correctly to {{ chef_automate_vm_max_map_count }}
    when: max_map_count_file.stat.exists
  - name: Check vm.dirty_expire_centisecs file
    ansible.builtin.stat:
      path: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_file
  - name: Assert vm.dirty_expire_centisecs file exists
    ansible.builtin.assert:
      that:
      - dirty_expire_centisecs_file.stat.exists
      fail_msg: vm.dirty_expire_centisecs file not found
      success_msg: vm.dirty_expire_centisecs file exists
  - name: Read vm.dirty_expire_centisecs content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs
    register: dirty_expire_centisecs_content
    when: dirty_expire_centisecs_file.stat.exists
  - name: Assert vm.dirty_expire_centisecs is set correctly
    ansible.builtin.assert:
      that:
      - (dirty_expire_centisecs_content.content | b64decode | trim) == chef_automate_vm_dirty_expire_centisecs | string
      fail_msg: vm.dirty_expire_centisecs not set to {{ chef_automate_vm_dirty_expire_centisecs }}
      success_msg: vm.dirty_expire_centisecs set correctly to {{ chef_automate_vm_dirty_expire_centisecs }}
    when: dirty_expire_centisecs_file.stat.exists
  - name: Check Chef Automate CLI file
    ansible.builtin.stat:
      path: /tmp/molecule_test{{ chef_automate_cli_path }}
    register: chef_automate_cli_file
  - name: Assert Chef Automate CLI file exists
    ansible.builtin.assert:
      that:
      - chef_automate_cli_file.stat.exists
      - chef_automate_cli_file.stat.executable
      fail_msg: Chef Automate CLI file not found or not executable
      success_msg: Chef Automate CLI file exists and is executable
  - name: Check hab directory (indicates successful deployment)
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab
    register: hab_dir
  - name: Assert Chef Automate was deployed
    ansible.builtin.assert:
      that:
      - hab_dir.stat.exists
      - hab_dir.stat.isdir
      fail_msg: Chef Automate deployment directory not found
      success_msg: Chef Automate deployment directory exists
  - name: Check user PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test{{ chef_automate_user_pem_path }}
    register: user_pem_file
  - name: Assert user PEM file exists
    ansible.builtin.assert:
      that:
      - user_pem_file.stat.exists
      - user_pem_file.stat.size > 0
      fail_msg: User PEM file not found or empty
      success_msg: User PEM file exists and has content
  - name: Check organization validator PEM file
    ansible.builtin.stat:
      path: /tmp/molecule_test{{ chef_automate_org_pem_path }}
    register: org_pem_file
  - name: Assert organization validator PEM file exists
    ansible.builtin.assert:
      that:
      - org_pem_file.stat.exists
      - org_pem_file.stat.size > 0
      fail_msg: Organization validator PEM file not found or empty
      success_msg: Organization validator PEM file exists and has content
  - name: Check Chef Automate status
    ansible.builtin.command:
      cmd: chef-automate status
    register: chef_automate_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Automate is running
    ansible.builtin.assert:
      that:
      - '''running'' in chef_automate_status.stdout'
      fail_msg: Chef Automate services not running
      success_msg: Chef Automate services are running
    tags: molecule-notest
  - name: Check Chef Infra Server status
    ansible.builtin.command:
      cmd: chef-server-ctl status
    register: chef_server_status
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is running
    ansible.builtin.assert:
      that:
      - chef_server_status.rc == 0
      fail_msg: Chef Infra Server services not running
      success_msg: Chef Infra Server services are running
    tags: molecule-notest
  - name: Check Chef user list
    ansible.builtin.command:
      cmd: chef-server-ctl user-list
    register: chef_user_list
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef user was created
    ansible.builtin.assert:
      that:
      - chef_automate_username in chef_user_list.stdout
      fail_msg: Chef user {{ chef_automate_username }} not found
      success_msg: Chef user {{ chef_automate_username }} exists
    tags: molecule-notest
  - name: Check Chef organization list
    ansible.builtin.command:
      cmd: chef-server-ctl org-list
    register: chef_org_list
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef organization was created
    ansible.builtin.assert:
      that:
      - chef_automate_org_name in chef_org_list.stdout
      fail_msg: Chef organization {{ chef_automate_org_name }} not found
      success_msg: Chef organization {{ chef_automate_org_name }} exists
    tags: molecule-notest
  - name: Check port 443 is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
  - name: Check Chef Automate API health
    ansible.builtin.uri:
      url: https://localhost/api/v0/health
      validate_certs: false
      status_code: 200
    tags: molecule-notest
