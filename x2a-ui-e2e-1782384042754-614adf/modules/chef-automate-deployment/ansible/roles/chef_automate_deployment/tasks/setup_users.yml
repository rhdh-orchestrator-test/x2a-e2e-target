---
- name: Check if Chef Infra Server is installed
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl_stat
  become: true
- name: Fail if Chef Infra Server is not installed
  ansible.builtin.fail:
    msg: Chef Infra Server is not installed. Please ensure the Chef Automate deployment completed successfully.
  when: not chef_server_ctl_stat.stat.exists
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create  {{ chef_automate_username }}  {{ chef_automate_full_name }}  {{ chef_automate_email }}  "{{ chef_automate_password }}"
      --filename {{ chef_automate_user_pem_path }}
  args:
    creates: "{{ chef_automate_user_pem_path }}"
  become: true
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create  {{ chef_automate_org_name }}  "{{ chef_automate_org_full_name }}"  --association_user {{ chef_automate_username }}
      --filename {{ chef_automate_org_pem_path }}
  args:
    creates: "{{ chef_automate_org_pem_path }}"
  become: true
