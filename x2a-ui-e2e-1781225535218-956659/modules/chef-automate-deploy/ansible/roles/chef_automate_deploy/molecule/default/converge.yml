---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure that would be created by the role
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/home/ansible

    # Simulate hostname file
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname | default('automate.chef.lab') }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl settings
    - name: Create proc sys vm directory
      ansible.builtin.file:
        path: "/tmp/molecule_test/proc/sys/vm"
        state: directory
        mode: "0755"

    - name: Create max_map_count file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_max_map_count | default('262144') }}"
        dest: "/tmp/molecule_test/proc/sys/vm/max_map_count"
        mode: "0644"

    - name: Create dirty_expire_centisecs file
      ansible.builtin.copy:
        content: "{{ chef_automate_vm_dirty_expire_centisecs | default('20000') }}"
        dest: "/tmp/molecule_test/proc/sys/vm/dirty_expire_centisecs"
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate user and organization key files
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK USER KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/home/ansible/jtonello.pem"
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK ORG VALIDATOR KEY\n-----END RSA PRIVATE KEY-----\n"
        dest: "/tmp/molecule_test/home/ansible/lab-validator.pem"
        mode: "0600"

    # Simulate Chef server binaries
    - name: Create chef-server-ctl mock
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Server CTL mock'\n"
        dest: "/tmp/molecule_test/usr/bin/chef-server-ctl"
        mode: "0755"

    # Create directories that would indicate successful installation
    - name: Create Chef Automate installation directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/hab/pkgs/chef
        - /tmp/molecule_test/hab/sup
        - /tmp/molecule_test/hab/svc