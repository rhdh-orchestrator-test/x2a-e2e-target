---
- name: Check if Chef Infra Server is installed
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl
  become: true
- name: Fail if Chef Infra Server is not installed
  ansible.builtin.fail:
    msg: Chef Infra Server is not installed. Please ensure 'infra-server' is included in chef_automate_products.
  when: not chef_server_ctl.stat.exists
- name: Ensure directories for key files exist
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_key_path }}"
    - "{{ chef_automate_org_key_path }}"
  when: chef_automate_user_key_path | dirname != '.' or chef_automate_org_key_path | dirname != '.'
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_automate_user_key_path }}

      '
  become: true
  args:
    creates: "{{ chef_automate_user_key_path }}"
  register: create_user
  changed_when: create_user.rc == 0
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ organization_name }} "{{ organization_full_name }}" --association_user {{ username }} --filename {{ chef_automate_org_key_path
      }}

      '
  become: true
  args:
    creates: "{{ chef_automate_org_key_path }}"
  register: create_org
  changed_when: create_org.rc == 0
