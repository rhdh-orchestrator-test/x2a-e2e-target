---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache
    description:
      - Fixes the POODLE SSL vulnerability in Apache web server by updating SSL protocol configuration.
      - Disables vulnerable SSL protocols and enables only TLSv1.2.
      - Manages Apache2 service restart when configuration changes.
    options:
      apache_ssl_config_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file.
      ssl_protocols:
        type: str
        required: false
        default: -all +TLSv1.2
        description: SSL protocols to enable/disable in Apache configuration.
      manage_apache_service:
        type: bool
        required: false
        default: true
        description: Whether to manage Apache service restart when configuration changes.
