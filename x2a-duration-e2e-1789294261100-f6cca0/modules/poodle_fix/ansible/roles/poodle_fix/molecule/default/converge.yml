- name: Converge
  hosts: all
  gather_facts: true
  vars:
    apache_ssl_config_path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
  tasks:
  - name: Create Apache configuration directory structure
    ansible.builtin.file:
      path: '{{ item_dir }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/apache2/mods-available
    - /tmp/molecule_test/etc/apache2/mods-enabled
    loop_control:
      loop_var: item_dir
  - name: Create initial Apache SSL configuration file
    ansible.builtin.copy:
      content: "<IfModule mod_ssl.c>\n    # SSL Engine Switch:\n    # Enable/Disable SSL for this virtual host.\n    SSLEngine on\n    \n    # SSL Protocol support:\n
        \   # List the enable protocol levels with which clients will be\n    # able to connect.  Disable SSLv2 access by default:\n    SSLProtocol all -SSLv2 -SSLv3\n
        \   \n    # SSL Cipher Suite:\n    # List the ciphers that the client is permitted to negotiate.\n    SSLCipherSuite HIGH:!aNULL:!MD5\n    \n    # Server
        Certificate:\n    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem\n    \n    # Server Private Key:\n    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key\n</IfModule>\n"
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
      backup: true
  - name: Create backup directory for Apache configs
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available/.backup
      state: directory
      mode: '0755'
  - name: Simulate Apache package installation
    ansible.builtin.debug:
      msg: Apache2 package would be installed here
    tags: molecule-notest
  - name: Create SSL module symlink to simulate a2enmod ssl
    ansible.builtin.file:
      src: /tmp/molecule_test/etc/apache2/mods-available/ssl.load
      dest: /tmp/molecule_test/etc/apache2/mods-enabled/ssl.load
      state: link
      force: true
    ignore_errors: true
  - name: Create SSL load file to simulate module availability
    ansible.builtin.copy:
      content: LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.load
      mode: '0644'
  - name: Fix SSL in Apache (simulated for container)
    ansible.builtin.replace:
      path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
      backup: true
