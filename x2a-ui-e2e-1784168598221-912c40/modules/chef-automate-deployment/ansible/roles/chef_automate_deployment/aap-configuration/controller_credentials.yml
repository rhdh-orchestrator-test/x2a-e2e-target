---
controller_credentials:
- name: Chef Admin User - chef_automate_deployment
  description: Admin user credentials for Chef Automate and Chef Infra Server
  organization: Default
  credential_type: Chef Admin User
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
