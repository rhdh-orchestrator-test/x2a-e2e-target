---
- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl -p
  become: true
  changed_when: false
- name: Wait for Chef Automate services
  ansible.builtin.pause:
    seconds: 30
- name: Wait for Chef Infra Server services
  ansible.builtin.pause:
    seconds: 30
- name: Set permissions on user PEM file
  ansible.builtin.file:
    path: "{{ chef_automate_user_pem_path }}"
    mode: "0600"
    state: file
  when: chef_automate_user_pem_path is defined and chef_automate_user_pem_path | length > 0
- name: Set permissions on organization validator PEM file
  ansible.builtin.file:
    path: "{{ chef_automate_org_validator_pem_path }}"
    mode: "0600"
    state: file
  when: chef_automate_org_validator_pem_path is defined and chef_automate_org_validator_pem_path | length > 0
