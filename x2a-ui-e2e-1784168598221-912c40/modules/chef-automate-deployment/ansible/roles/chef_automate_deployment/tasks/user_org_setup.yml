---
- name: Check if user PEM file exists
  ansible.builtin.stat:
    path: "{{ chef_automate_user_pem_path }}"
  register: user_pem_file
- name: Create Chef user
  ansible.builtin.command:
    cmd: chef-server-ctl user-create {{ chef_automate_username }} {{ chef_automate_full_name | quote }} {{ chef_automate_email | quote }} {{
      chef_automate_password | quote }} --filename {{ chef_automate_user_pem_path }}
    creates: "{{ chef_automate_user_pem_path }}"
  become: true
  register: user_create_result
  changed_when: user_create_result.rc == 0
  failed_when: user_create_result.rc != 0
  no_log: true
  notify: Set permissions on user PEM file
  when: not user_pem_file.stat.exists
- name: Check if organization validator PEM file exists
  ansible.builtin.stat:
    path: "{{ chef_automate_org_validator_pem_path }}"
  register: org_validator_pem_file
- name: Create Chef organization
  ansible.builtin.command:
    cmd: chef-server-ctl org-create {{ chef_automate_org_name }} {{ chef_automate_org_full_name | quote }} --association_user {{ chef_automate_username }}
      --filename {{ chef_automate_org_validator_pem_path }}
    creates: "{{ chef_automate_org_validator_pem_path }}"
  become: true
  register: org_create_result
  changed_when: org_create_result.rc == 0
  failed_when: org_create_result.rc != 0
  notify: Set permissions on organization validator PEM file
  when: not org_validator_pem_file.stat.exists
- name: Flush handlers
  ansible.builtin.meta: flush_handlers
