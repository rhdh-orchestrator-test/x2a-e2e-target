---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Configure system settings
  ansible.builtin.include_tasks: system_config.yml
- name: Deploy Chef Automate with Infra Server
  ansible.builtin.include_tasks: deploy_automate.yml
  when: chef_automate_deploy_automate | bool
- name: Deploy Chef Infra Server only
  ansible.builtin.include_tasks: deploy_chef_server.yml
  when: not chef_automate_deploy_automate | bool and chef_automate_deploy_infra_server | bool
- name: Setup Chef user and organization
  ansible.builtin.include_tasks: user_org_setup.yml
