---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    cache_service_name: redis-server
    cache_redis_port: 6379
    cache_redis_bind: 127.0.0.1
    cache_redis_config_path: /etc/redis/redis.conf
    cache_redis_data_dir: /var/lib/redis
  tasks:
    - name: Check Redis service status
      ansible.builtin.service_facts:

    - name: Assert Redis service is running
      ansible.builtin.assert:
        that:
          - "'{{ cache_service_name }}.service' in ansible_facts.services"
          - "ansible_facts.services['{{ cache_service_name }}.service']['state'] == 'running'"
          - "ansible_facts.services['{{ cache_service_name }}.service']['status'] == 'enabled'"
        fail_msg: "Redis service is not running or not enabled"

    - name: Check Redis is listening on configured port
      ansible.builtin.wait_for:
        port: "{{ cache_redis_port }}"
        host: "{{ cache_redis_bind }}"
        timeout: 10
        msg: "Redis is not listening on {{ cache_redis_bind }}:{{ cache_redis_port }}"

    - name: Test Redis connectivity with ping
      ansible.builtin.command:
        cmd: redis-cli ping
      register: redis_ping_result
      changed_when: false

    - name: Assert Redis ping response
      ansible.builtin.assert:
        that:
          - "redis_ping_result['stdout'] == 'PONG'"
        fail_msg: "Redis ping test failed"

    - name: Test Redis basic operations
      ansible.builtin.command:
        cmd: "{{ item_redis_cmd }}" # noqa: R101 - loop over predefined test commands
      loop:
        - redis-cli set molecule_test_key "molecule_test_value"
        - redis-cli get molecule_test_key
        - redis-cli del molecule_test_key
      loop_control:
        loop_var: item_redis_cmd
      register: redis_ops_results
      changed_when: false

    - name: Assert Redis operations work correctly
      ansible.builtin.assert:
        that:
          - "redis_ops_results['results'][0]['stdout'] == 'OK'"
          - "redis_ops_results['results'][1]['stdout'] == 'molecule_test_value'"
          - "redis_ops_results['results'][2]['stdout'] == '1'"
        fail_msg: "Redis basic operations test failed"

    - name: Check Redis configuration file exists
      ansible.builtin.stat:
        path: "{{ cache_redis_config_path }}"
      register: redis_config_stat

    - name: Assert Redis configuration file exists
      ansible.builtin.assert:
        that:
          - "redis_config_stat['stat']['exists']"
          - "redis_config_stat['stat']['size'] > 0"
        fail_msg: "Redis configuration file not found or empty"

    - name: Check Redis data directory exists
      ansible.builtin.stat:
        path: "{{ cache_redis_data_dir }}"
      register: redis_data_dir_stat

    - name: Assert Redis data directory exists
      ansible.builtin.assert:
        that:
          - "redis_data_dir_stat['stat']['exists']"
          - "redis_data_dir_stat['stat']['isdir']"
        fail_msg: "Redis data directory not found"

    - name: Get Redis server info
      ansible.builtin.command:
        cmd: redis-cli info server
      register: redis_info_result
      changed_when: false

    - name: Assert Redis server info contains expected fields
      ansible.builtin.assert:
        that:
          - "'redis_version' in redis_info_result['stdout']"
          - "'tcp_port:{{ cache_redis_port }}' in redis_info_result['stdout']"
        fail_msg: "Redis server info missing expected fields"
