---
- name: Install Redis server package
  ansible.builtin.package:
    name: "{{ cache_package_name }}"
    state: present

- name: Ensure Redis data directory exists
  ansible.builtin.file:
    path: "{{ cache_redis_data_dir }}" # noqa: R114 - path from role defaults
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Ensure Redis log directory exists
  ansible.builtin.file:
    path: "{{ cache_redis_log_file | dirname }}" # noqa: R114 - path from role defaults
    state: directory
    owner: redis
    group: redis
    mode: "0755"

- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_path }}" # noqa: R114 - path from role defaults
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart Redis

- name: Enable and start Redis server service
  ansible.builtin.service:
    name: "{{ cache_service_name }}"
    state: started
    enabled: true
