---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis server on port 6379; migrate the value to Ansible Vault.
    kind: cloud
    inputs:
      fields:
        - id: redis_requirepass
          type: string
          label: Redis Password
          secret: true
          help_text: Password required to authenticate to the Redis server.
      required:
        - redis_requirepass
    injectors:
      extra_vars:
        redis_requirepass: !unsafe "{{ redis_requirepass }}"
