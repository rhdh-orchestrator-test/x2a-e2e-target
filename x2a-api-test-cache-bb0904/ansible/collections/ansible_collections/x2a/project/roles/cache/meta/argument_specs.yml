---
argument_specs:
  main:
    short_description: Configure Memcached and a standalone Redis cache service
    description:
      - Installs and starts Memcached with the observed cache service settings.
      - Configures standalone Redis authentication and service paths.
    options:
      cache_memcached_version:
        type: str
        required: false
        default:
        description: Optional Memcached package version.
      cache_memcached_memory:
        type: int
        required: false
        default: 64
        description: Memcached memory allocation in megabytes.
      cache_memcached_port:
        type: int
        required: false
        default: 11211
        description: Memcached TCP port.
      cache_memcached_udp_port:
        type: int
        required: false
        default: 11211
        description: Memcached UDP port.
      cache_memcached_listen:
        type: str
        required: false
        default: 0.0.0.0
        description: Memcached listen address.
      cache_memcached_maxconn:
        type: int
        required: false
        default: 1024
        description: Maximum Memcached connections.
      cache_memcached_max_object_size:
        type: str
        required: false
        default: 1m
        description: Maximum Memcached object size.
      cache_memcached_experimental_options:
        type: list
        elements: str
        required: false
        default: []
        description: Memcached experimental command-line options.
      cache_memcached_extra_cli_options:
        type: list
        elements: str
        required: false
        default: []
        description: Additional Memcached command-line options.
      cache_memcached_ulimit:
        type: int
        required: false
        default: 1024
        description: Memcached file descriptor limit.
      cache_memcached_logfilepath:
        type: str
        required: false
        default: /var/log/memcached
        description: Memcached log path retained from source attributes.
      cache_redis_pid_dir:
        type: str
        required: false
        default: /run/redis
        description: Redis PID directory.
      cache_redis_config_file:
        type: str
        required: false
        default: /etc/redis/6379.conf
        description: Redis configuration file to clean up.
      cache_redis_log_dir:
        type: str
        required: false
        default: /var/log/redis
        description: Redis log directory.
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks handling the Redis password.
      redis_requirepass:
        type: str
        required: true
        description: Redis password injected by an AAP credential type.
