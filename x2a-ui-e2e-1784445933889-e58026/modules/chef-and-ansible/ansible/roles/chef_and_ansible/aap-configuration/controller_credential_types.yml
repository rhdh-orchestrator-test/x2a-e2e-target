---
controller_credential_types:
- name: Chef Automate User Credentials
  description: User credentials for Chef Automate deployment
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Automate administrator account
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Automate administrator account
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Chef Infra Server Credentials
  description: User credentials for Chef Infra Server deployment
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for Chef Infra Server administrator account
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for Chef Infra Server administrator account
    - id: organization
      type: string
      label: Organization
      help_text: Chef organization name
    required:
    - username
    - password
    - organization
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      organization: !unsafe '{{ organization }}'
