---
- name: Configure Hello World virtual host
  ansible.builtin.template:
    src: virtualhost.conf.j2
    dest: /etc/apache2/sites-available/helloworld.conf
    mode: "0640"
    force: true
- name: Create the helloworld directory
  ansible.builtin.file:
    path: /var/www/helloworld
    state: directory
    mode: "0755"
- name: Deploy the Hello World website
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/helloworld/index.html
    owner: root
    group: root
    mode: "0644"
    force: true
- name: Deactivate the default virtualhost
  ansible.builtin.command:
    cmd: a2dissite 000-default
  register: a2dissite_result
  changed_when: "'Site 000-default disabled' in a2dissite_result.stdout"
- name: Activate the virtualhost
  ansible.builtin.command:
    cmd: a2ensite helloworld
  register: a2ensite_result
  changed_when: "'Site helloworld already enabled' not in a2ensite_result.stdout"
  notify:
    - Restart apache
- name: Activate SSL on Apache
  ansible.builtin.command:
    cmd: a2enmod ssl
  register: a2enmod_result
  changed_when: "'Module ssl already enabled' not in a2enmod_result.stdout"
  notify:
    - Restart apache
