---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for Chef Automate and Chef Infra Server
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-server
        - /tmp/molecule_test/etc/chef
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/var/log/chef-automate
        - /tmp/molecule_test/var/log/chef-server

    # Simulate system configuration files
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    # Simulate sysctl configuration
    - name: Create sysctl configuration file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: "/tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf"
        mode: "0644"

    # Simulate Chef Automate CLI
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/sh\necho 'Chef Automate CLI Simulation'\n"
        dest: "/tmp/molecule_test/chef-automate"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: chef-automate
          Status: running
          Products: automate, infra-server
        dest: "/tmp/molecule_test/var/log/chef-automate/status"
        mode: "0644"

    # Simulate Chef Server status
    - name: Create Chef Server status file
      ansible.builtin.copy:
        content: |
          Service: chef-server
          Status: running
        dest: "/tmp/molecule_test/var/log/chef-server/status"
        mode: "0644"

    # Simulate user and organization creation
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA...SIMULATED_KEY_CONTENT...
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/jtonello.pem"
        mode: "0600"

    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEA...SIMULATED_VALIDATOR_KEY_CONTENT...
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/lab-validator.pem"
        mode: "0600"

    # Simulate user list output
    - name: Create user list file
      ansible.builtin.copy:
        content: |
          User: jtonello
          Name: John Tonello
          Email: jtonello@chef.lab
        dest: "/tmp/molecule_test/etc/chef-server/user-list"
        mode: "0644"

    # Simulate organization list output
    - name: Create organization list file
      ansible.builtin.copy:
        content: |
          Organization: lab
          Full Name: Chef Lab
        dest: "/tmp/molecule_test/etc/chef-server/org-list"
        mode: "0644"

    # Simulate systemd service file
    - name: Create Chef Automate service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Automate
          After=network.target

          [Service]
          Type=simple
          ExecStart=/hab/bin/chef-automate-ctl start
          ExecStop=/hab/bin/chef-automate-ctl stop
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: "/tmp/molecule_test/etc/systemd/system/chef-automate.service"
        mode: "0644"

    # Simulate API endpoints
    - name: Create API version response file
      ansible.builtin.copy:
        content: |
          {
            "version": "1.0.0",
            "build": "20220101000000",
            "name": "chef-automate"
          }
        dest: "/tmp/molecule_test/var/log/chef-automate/api-version"
        mode: "0644"

    - name: Create organizations API response file
      ansible.builtin.copy:
        content: |
          {
            "organizations": ["lab"]
          }
        dest: "/tmp/molecule_test/var/log/chef-server/api-organizations"
        mode: "0644"

  vars:
    chef_automate_hostname: automate.chef.lab
    username: jtonello