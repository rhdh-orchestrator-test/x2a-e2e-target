---
- name: Restart Chef Automate
  ansible.builtin.shell:
    cmd: "if chef-automate status | grep -q \"not running\"; then\n  chef-automate restart\nfi\n"
  become: true
  listen: restart chef-automate
  changed_when: true
  register: restart_result
  failed_when: restart_result.rc != 0 and "not running" in restart_result.stdout
- name: Restart Chef Infra Server
  ansible.builtin.shell:
    cmd: "if chef-server-ctl status | grep -q \"not running\"; then\n  chef-server-ctl restart\nfi\n"
  become: true
  listen: restart chef-server
  changed_when: true
  register: restart_result
  failed_when: restart_result.rc != 0 and "not running" in restart_result.stdout
