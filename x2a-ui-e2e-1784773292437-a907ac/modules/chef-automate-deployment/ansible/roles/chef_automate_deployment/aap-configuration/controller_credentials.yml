---
controller_credentials:
- name: Chef Admin User - chef_automate_deployment
  description: Used to create the initial admin user for Chef Infra Server
  organization: Default
  credential_type: Chef Admin User
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
    full_name: '{{ full_name }}'
    email: '{{ email }}'
