---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file exists
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found or empty"
        success_msg: "Hostname file exists and has content"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == 'automate.chef.lab'
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check sysctl configuration file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl file exists
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Sysctl configuration file not found or empty"
        success_msg: "Sysctl configuration file exists and has content"

    - name: Get sysctl file content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are set correctly
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count = 262144' in (sysctl_content.content | b64decode)"
          - "'vm.dirty_expire_centisecs = 20000' in (sysctl_content.content | b64decode)"
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI checks
    - name: Check Chef Automate CLI file
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI exists and is executable
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate status checks
    - name: Check Chef Automate status file
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/chef-automate/status
      register: chef_automate_status

    - name: Assert Chef Automate status file exists
      ansible.builtin.assert:
        that:
          - chef_automate_status.stat.exists
          - chef_automate_status.stat.size > 0
        fail_msg: "Chef Automate status file not found or empty"
        success_msg: "Chef Automate status file exists and has content"

    # Chef Server status checks
    - name: Check Chef Server status file
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/log/chef-server/status
      register: chef_server_status

    - name: Assert Chef Server status file exists
      ansible.builtin.assert:
        that:
          - chef_server_status.stat.exists
          - chef_server_status.stat.size > 0
        fail_msg: "Chef Server status file not found or empty"
        success_msg: "Chef Server status file exists and has content"

    # User and organization checks
    - name: Check user PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/jtonello.pem
      register: user_pem

    - name: Assert user PEM file exists with correct permissions
      ansible.builtin.assert:
        that:
          - user_pem.stat.exists
          - user_pem.stat.size > 0
          - user_pem.stat.mode == '0600'
        fail_msg: "User PEM file not found, empty, or has incorrect permissions"
        success_msg: "User PEM file exists with correct content and permissions"

    - name: Check organization validator PEM file
      ansible.builtin.stat:
        path: /tmp/molecule_test/lab-validator.pem
      register: org_validator_pem

    - name: Assert organization validator PEM file exists with correct permissions
      ansible.builtin.assert:
        that:
          - org_validator_pem.stat.exists
          - org_validator_pem.stat.size > 0
          - org_validator_pem.stat.mode == '0600'
        fail_msg: "Organization validator PEM file not found, empty, or has incorrect permissions"
        success_msg: "Organization validator PEM file exists with correct content and permissions"

    - name: Check user list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server/user-list
      register: user_list

    - name: Assert user list file exists
      ansible.builtin.assert:
        that:
          - user_list.stat.exists
          - user_list.stat.size > 0
        fail_msg: "User list file not found or empty"
        success_msg: "User list file exists and has content"

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-server/user-list
      register: user_list_content
      when: user_list.stat.exists

    - name: Assert user exists in user list
      ansible.builtin.assert:
        that:
          - "'jtonello' in (user_list_content.content | b64decode)"
        fail_msg: "User 'jtonello' not found in user list"
        success_msg: "User 'jtonello' found in user list"
      when: user_list.stat.exists

    - name: Check organization list file
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-server/org-list
      register: org_list

    - name: Assert organization list file exists
      ansible.builtin.assert:
        that:
          - org_list.stat.exists
          - org_list.stat.size > 0
        fail_msg: "Organization list file not found or empty"
        success_msg: "Organization list file exists and has content"

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-server/org-list
      register: org_list_content
      when: org_list.stat.exists

    - name: Assert organization exists in organization list
      ansible.builtin.assert:
        that:
          - "'lab' in (org_list_content.content | b64decode)"
        fail_msg: "Organization 'lab' not found in organization list"
        success_msg: "Organization 'lab' found in organization list"
      when: org_list.stat.exists

    # Service checks (tagged for skipping in container)
    - name: Check Chef Automate service
      ansible.builtin.service_facts:
      tags: molecule-notest

    - name: Assert Chef Automate service is active
      ansible.builtin.assert:
        that:
          - "'chef-automate.service' in ansible_facts.services"
          - "ansible_facts.services['chef-automate.service'].state == 'running'"
        fail_msg: "Chef Automate service not running"
        success_msg: "Chef Automate service is running"
      tags: molecule-notest

    # Network checks (tagged for skipping in container)
    - name: Check Chef Automate port
      ansible.builtin.wait_for:
        port: 443
        timeout: 5
      ignore_errors: true
      register: port_check
      tags: molecule-notest

    - name: Assert Chef Automate port is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Chef Automate port 443 is not listening"
        success_msg: "Chef Automate port 443 is listening"
      tags: molecule-notest

    # API checks (tagged for skipping in container)
    - name: Check Chef Automate API
      ansible.builtin.uri:
        url: https://localhost/api/v0/auth/version
        validate_certs: false
      register: api_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Automate API is accessible
      ansible.builtin.assert:
        that:
          - api_check is succeeded
          - api_check.status == 200
        fail_msg: "Chef Automate API is not accessible"
        success_msg: "Chef Automate API is accessible"
      tags: molecule-notest

    - name: Check Chef Infra Server API
      ansible.builtin.uri:
        url: https://localhost/organizations
        validate_certs: false
      register: infra_api_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Infra Server API is accessible
      ansible.builtin.assert:
        that:
          - infra_api_check is succeeded
          - infra_api_check.status == 200
        fail_msg: "Chef Infra Server API is not accessible"
        success_msg: "Chef Infra Server API is accessible"
      tags: molecule-notest