---
# Debian/Ubuntu specific variables for cache role
cache_package_name: redis-server
cache_service_name: redis-server
cache_config_file: /etc/redis/redis.conf
cache_data_dir: /var/lib/redis
cache_log_dir: /var/log/redis
cache_log_file: /var/log/redis/redis-server.log
cache_pid_file: /var/run/redis/redis-server.pid
