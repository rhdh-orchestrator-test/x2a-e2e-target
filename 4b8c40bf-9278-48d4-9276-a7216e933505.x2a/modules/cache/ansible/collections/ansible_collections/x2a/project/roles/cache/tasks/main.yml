---
# Main tasks file for cache role

- name: Check if OS family is supported
  ansible.builtin.fail:
    msg: "OS family '{{ ansible_facts['os_family'] }}' is not supported by this role. Supported: Debian, RedHat"
  when: ansible_facts['os_family'] not in ['Debian', 'RedHat']

- name: Load operating system specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Include default recipe tasks
  ansible.builtin.include_tasks: default.yml
