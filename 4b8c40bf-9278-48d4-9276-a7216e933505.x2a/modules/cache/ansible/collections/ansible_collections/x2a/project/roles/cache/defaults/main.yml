---
# defaults file for cache role
# Package name for Redis (OS-specific, loaded from vars/)
# cache_package_name: defined in vars/{{ ansible_facts['os_family'] }}.yml
# Service name for Redis (OS-specific, loaded from vars/)
# cache_service_name: defined in vars/{{ ansible_facts['os_family'] }}.yml
# Service state
cache_service_state: started
cache_service_enabled: true
# Secure logging toggle for credential handling (if credentials added in future)
cache_secure_logging: true
