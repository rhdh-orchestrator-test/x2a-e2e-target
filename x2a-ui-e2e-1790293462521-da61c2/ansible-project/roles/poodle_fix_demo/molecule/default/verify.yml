---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Apache SSL configuration file exists
      ansible.builtin.stat:
        path: /etc/apache2/mods-available/ssl.conf
      register: ssl_config_stat

    - name: Assert SSL configuration file exists
      ansible.builtin.assert:
        that:
          - ssl_config_stat['stat']['exists']
          - ssl_config_stat['stat']['size'] > 0
        fail_msg: "Apache SSL configuration file not found"

    - name: Read SSL configuration content
      ansible.builtin.slurp:
        src: /etc/apache2/mods-available/ssl.conf
      register: ssl_config_content

    - name: Assert SSL protocol configuration is correct
      ansible.builtin.assert:
        that:
          - "'SSLProtocol -all +TLSv1.2' in (ssl_config_content['content'] | b64decode)"
        fail_msg: "SSL protocol not properly configured for POODLE fix"

    - name: Check if Apache configuration is valid
      ansible.builtin.command:
        cmd: apache2ctl configtest
      register: apache_configtest
      changed_when: false
      failed_when: apache_configtest['rc'] != 0

    - name: Assert Apache configuration test passes
      ansible.builtin.assert:
        that:
          - apache_configtest['rc'] == 0
        fail_msg: "Apache configuration test failed"

    - name: Get service facts
      ansible.builtin.service_facts:

    - name: Assert Apache2 service is available
      ansible.builtin.assert:
        that:
          - "'apache2.service' in ansible_facts.services"
        fail_msg: "Apache2 service not found"

    - name: Assert SSH service is available
      ansible.builtin.assert:
        that:
          - "'sshd.service' in ansible_facts.services or 'ssh.service' in ansible_facts.services"
        fail_msg: "SSH service not found"

    - name: Check if backup file was created
      ansible.builtin.find:
        paths: /etc/apache2/mods-available/
        patterns: "ssl.conf.*"
        file_type: file
      register: backup_files

    - name: Assert backup file was created
      ansible.builtin.assert:
        that:
          - backup_files['files'] | length > 0
        fail_msg: "No backup file created during SSL configuration update"
