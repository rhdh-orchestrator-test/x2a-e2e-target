---
argument_specs:
  main:
    short_description: Fix POODLE SSL vulnerability in Apache
    description:
      - Installs Apache2 if not present
      - Enables the Apache SSL module
      - Fixes the POODLE SSL vulnerability by updating Apache SSL protocol configuration
      - Disables vulnerable SSL protocols and enables only TLSv1.2
      - Optionally restarts Apache service after configuration changes
    options:
      apache_ssl_config_path:
        type: str
        required: false
        default: /etc/apache2/mods-available/ssl.conf
        description: Path to Apache SSL configuration file
      ssl_protocols:
        type: str
        required: false
        default: -all +TLSv1.2
        description: SSL protocols to enable/disable for POODLE fix
      restart_services:
        type: bool
        required: false
        default: true
        description: Whether to restart Apache service after configuration changes
