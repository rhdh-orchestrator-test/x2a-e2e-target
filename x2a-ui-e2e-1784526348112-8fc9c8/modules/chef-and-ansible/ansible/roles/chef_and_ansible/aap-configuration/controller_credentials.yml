---
controller_credentials:
- name: Chef Automate User Credentials - chef_and_ansible
  description: Username and password for Chef Automate deployment
  organization: Default
  credential_type: Chef Automate User Credentials
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Apache SSL Certificate - chef_and_ansible
  description: Self-signed SSL certificate for HTTPS website
  organization: Default
  credential_type: Apache SSL Certificate
  update_secrets: true
  inputs:
    ssl_certificate: '{{ vault_ssl_certificate }}'
    ssl_key: '{{ vault_ssl_key }}'
    cert_path: '{{ cert_path }}'
