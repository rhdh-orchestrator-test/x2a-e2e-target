---
controller_credential_types:
- name: Chef Automate User Credentials
  description: Username and password for Chef Automate deployment
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Admin username for Chef Automate
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Admin password for Chef Automate
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Apache SSL Certificate
  description: Self-signed SSL certificate for HTTPS website
  kind: cloud
  inputs:
    fields:
    - id: ssl_certificate
      type: string
      label: SSL Certificate
      secret: true
      help_text: SSL certificate content for Apache HTTPS
    - id: ssl_key
      type: string
      label: SSL Private Key
      secret: true
      help_text: SSL private key for Apache HTTPS
    - id: cert_path
      type: string
      label: Certificate Path
      help_text: Path where the certificate is stored
    required:
    - ssl_certificate
    - ssl_key
  injectors:
    extra_vars:
      ssl_certificate: !unsafe '{{ ssl_certificate }}'
      ssl_key: !unsafe '{{ ssl_key }}'
      cert_path: !unsafe '{{ cert_path }}'
