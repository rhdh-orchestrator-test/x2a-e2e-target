---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    chef_hostname: automate.chef.lab
    chef_vm_max_map_count: 262144
    chef_vm_dirty_expire_centisecs: 20000
    chef_automate_cli_path: /tmp/molecule_test/chef-automate
    username: chef_user
    user_email: chef@example.com
    user_password: chef_password
    organization_name: chef_org
    chef_user_key_path: /tmp/molecule_test/chef_user.pem
    chef_org_key_path: /tmp/molecule_test/chef_org-validator.pem
  tasks:
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/chef-server

    # Simulate hostname configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Simulate hosts file entry
    - name: Create hosts file
      ansible.builtin.copy:
        content: |
          127.0.0.1 localhost
          127.0.0.1 {{ chef_hostname }}
        dest: /tmp/molecule_test/etc/hosts
        mode: "0644"

    # Simulate sysctl settings
    - name: Create sysctl settings file
      ansible.builtin.copy:
        content: |
          vm.max_map_count = {{ chef_vm_max_map_count }}
          vm.dirty_expire_centisecs = {{ chef_vm_dirty_expire_centisecs }}
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef.conf
        mode: "0644"

    # Simulate Chef Automate CLI download
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'"
        dest: "{{ chef_automate_cli_path }}"
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate deployment marker
      ansible.builtin.copy:
        content: "Chef Automate deployed"
        dest: /tmp/molecule_test/var/opt/chef-automate/deployed
        mode: "0644"

    # Simulate Chef Server deployment
    - name: Create Chef Server deployment marker
      ansible.builtin.copy:
        content: "Chef Server deployed"
        dest: /tmp/molecule_test/var/opt/chef-server/deployed
        mode: "0644"

    # Simulate user and organization key files
    - name: Create user key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK_KEY_CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: "{{ chef_user_key_path }}"
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: "-----BEGIN RSA PRIVATE KEY-----\nMOCK_ORG_KEY_CONTENT\n-----END RSA PRIVATE KEY-----"
        dest: "{{ chef_org_key_path }}"
        mode: "0600"

    # Simulate user and organization lists
    - name: Create user list file
      ansible.builtin.copy:
        content: "{{ username }}"
        dest: /tmp/molecule_test/var/opt/chef-server/user-list
        mode: "0644"

    - name: Create organization list file
      ansible.builtin.copy:
        content: "{{ organization_name }}"
        dest: /tmp/molecule_test/var/opt/chef-server/org-list
        mode: "0644"