---
- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - unzip
      - curl
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: /tmp/chef-automate_linux_amd64.zip
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.shell:
    cmd: gunzip < /tmp/chef-automate_linux_amd64.zip > {{ chef_automate_cli_path }} && chmod +x {{ chef_automate_cli_path }}
    creates: "{{ chef_automate_cli_path }}"
  args:
    executable: /bin/bash
- name: Deploy Chef Automate with Chef Infra Server
  ansible.builtin.command:
    cmd: "{{ chef_automate_cli_path }} deploy --product automate --product infra-server --accept-terms-and-mlsa={{ chef_accept_terms_and_mlsa | lower }}"
    creates: /var/opt/chef-automate
  become: true
  register: chef_automate_deploy
  changed_when: chef_automate_deploy.rc == 0
