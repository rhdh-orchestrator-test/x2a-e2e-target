---
controller_credentials:
- name: Chef User Password - chef_deployment
  description: Credential for chef_deployment
  organization: Default
  credential_type: Chef User Password
  update_secrets: true
  inputs:
    username: '{{ username }}'
    user_password: '{{ vault_user_password }}'
    user_email: '{{ user_email }}'
    organization_name: '{{ organization_name }}'
