---
controller_credential_types:
- name: Chef User Password
  description: Credential type for Chef User Password
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for the initial Chef user
    - id: user_password
      type: string
      label: User Password
      secret: true
      help_text: Password for the initial Chef user
    - id: user_email
      type: string
      label: User Email
      help_text: Email address for the initial Chef user
    - id: organization_name
      type: string
      label: Organization Name
      help_text: Name of the Chef organization to create
    required:
    - username
    - user_password
    - user_email
    - organization_name
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      user_password: !unsafe '{{ user_password }}'
      user_email: !unsafe '{{ user_email }}'
      organization_name: !unsafe '{{ organization_name }}'
