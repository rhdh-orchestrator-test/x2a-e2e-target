---
controller_credential_types:
  - name: Redis Authentication
    description: Password used to authenticate clients to the Redis instance on TCP port 6379.
    kind: cloud
    inputs:
      fields:
        - id: redis_password
          type: string
          label: Redis Password
          secret: true
          help_text: Password required by Redis clients to authenticate to the redis-6379 instance; store it in Ansible Vault or an approved secret manager.
      required:
        - redis_password
    injectors:
      extra_vars:
        redis_password: !unsafe "{{ redis_password }}"
