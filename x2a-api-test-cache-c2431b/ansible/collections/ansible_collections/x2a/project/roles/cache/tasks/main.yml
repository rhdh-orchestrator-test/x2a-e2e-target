---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Configure Redis through the approved collection role # noqa: L038 - role is provided by the eloy.redis collection declared in requirements.yml
  ansible.builtin.include_role:
    name: eloy.redis.redis
  no_log: "{{ cache_secure_logging }}"
  vars:
    redis_version: "{{ cache_redis_version }}"
    redis_install_method: "{{ cache_redis_install_method }}"
    redis_port: "{{ cache_redis_port }}"
    redis_requirepass: "{{ redis_password }}"
    redis_cluster_enabled: "{{ cache_redis_cluster_enabled }}"
    redis_sentinel_enabled: "{{ cache_redis_sentinel_enabled }}"
    redis_replication_enabled: "{{ cache_redis_replication_enabled }}"
    redis_aof_enabled: "{{ cache_redis_aof_enabled }}"
    redis_rdb_enabled: "{{ cache_redis_rdb_enabled }}"

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_directory }}" # noqa: R114 - path is a role default controlled by the operator
    state: directory
    owner: redis
    group: redis
    mode: "0755"
    recurse: true

- name: Check whether the Redis configuration exists
  ansible.builtin.stat:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role default controlled by the operator
  register: cache_redis_config_stat

- name: Remove obsolete Redis directives # noqa: R115 - cleanup intentionally targets the role-configured Redis file
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path is a role default controlled by the operator
    regexp: ^{{ item_cache_directive }}.*$
    state: absent
    create: false
  when: cache_redis_config_stat.stat.exists # noqa: L039 - cache_redis_config_stat is registered by the prior stat task
  loop: "{{ cache_redis_cleanup_directives }}"
  loop_control:
    loop_var: item_cache_directive
  notify: Restart Redis
