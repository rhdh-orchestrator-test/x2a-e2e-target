---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml
- name: Configure system parameters
  ansible.builtin.include_tasks: system_config.yml
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: "{{ chef_automate_cli_url }}"
    dest: "{{ chef_automate_cli_path }}.zip"
    mode: "0644"
- name: Extract Chef Automate CLI
  ansible.builtin.command:
    cmd: gunzip -c {{ chef_automate_cli_path }}.zip > {{ chef_automate_cli_path }}
  args:
    creates: "{{ chef_automate_cli_path }}"
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: "{{ chef_automate_cli_path }}"
    mode: "0755"
    state: file
- name: Deploy Chef Infra Server only
  ansible.builtin.command:
    cmd: "./chef-automate deploy --product infra-server --accept-terms-and-mlsa={{ chef_automate_accept_terms | lower }} "
  become: true
  args:
    creates: /etc/chef-automate/config.toml
- name: Ensure directory exists for PEM files
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_user_pem_filename }}"
    - "{{ chef_org_pem_filename }}"
  when: item | dirname != '.'
- name: Check if chef-server-ctl is available
  ansible.builtin.command:
    cmd: which chef-server-ctl
  register: chef_server_ctl_check
  changed_when: false
  failed_when: false
  become: true
- name: Wait for chef-server-ctl to become available
  ansible.builtin.wait_for:
    path: /usr/bin/chef-server-ctl
    timeout: 300
  become: true
  when: chef_server_ctl_check.rc != 0
- name: Create Chef user
  ansible.builtin.command:
    cmd: "chef-server-ctl user-create {{ chef_user_name }} {{ chef_user_fullname | quote }} {{ chef_user_email }} {{ chef_user_password | quote }} --filename {{ chef_user_pem_filename
      }} "
  become: true
  args:
    creates: "{{ chef_user_pem_filename }}"
- name: Create Chef organization
  ansible.builtin.command:
    cmd: "chef-server-ctl org-create {{ chef_org_name }} {{ chef_org_fullname | quote }} --association_user {{ chef_user_name }} --filename {{ chef_org_pem_filename
      }} "
  become: true
  args:
    creates: "{{ chef_org_pem_filename }}"
