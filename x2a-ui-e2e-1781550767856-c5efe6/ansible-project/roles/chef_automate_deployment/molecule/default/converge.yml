---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/systemd/system
        - /tmp/molecule_test/var/log/chef-automate
        - /tmp/molecule_test/var/opt/chef-server

    # Create mock config files
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          [global]
            v1 = true
          [deployment]
            automate = "enabled"
            infra-server = "enabled"
          [mlsa]
            accept = true
        dest: /tmp/molecule_test/etc/chef-automate/config.toml
        mode: "0644"

    # Create mock PEM files
    - name: Create user PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAu5Ovq4Y/g9jtLYLmUOaLrh0IZBx1k5cAGXTDyqmNYUYXMzpk
          MOCK_USER_PEM_CONTENT
          -----END RSA PRIVATE KEY-----
          -----BEGIN CERTIFICATE-----
          MIIDjDCCAnQCCQDlYpT0322+cjANBgkqhkiG9w0BAQsFADCBhzELMAkGA1UEBhMC
          MOCK_USER_CERTIFICATE_CONTENT
          -----END CERTIFICATE-----
        dest: /tmp/molecule_test/jtonello.pem
        mode: "0600"

    - name: Create organization validator PEM file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAu5Ovq4Y/g9jtLYLmUOaLrh0IZBx1k5cAGXTDyqmNYUYXMzpk
          MOCK_ORG_VALIDATOR_PEM_CONTENT
          -----END RSA PRIVATE KEY-----
          -----BEGIN CERTIFICATE-----
          MIIDjDCCAnQCCQDlYpT0322+cjANBgkqhkiG9w0BAQsFADCBhzELMAkGA1UEBhMC
          MOCK_ORG_VALIDATOR_CERTIFICATE_CONTENT
          -----END CERTIFICATE-----
        dest: /tmp/molecule_test/lab-validator.pem
        mode: "0600"

    # Create mock systemd service files
    - name: Create Chef Automate service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Automate
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/chef-automate start
          ExecStop=/usr/bin/chef-automate stop
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/etc/systemd/system/chef-automate.service
        mode: "0644"

    - name: Create Chef Server service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Chef Infra Server
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/chef-server-ctl start
          ExecStop=/usr/bin/chef-server-ctl stop
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: /tmp/molecule_test/etc/systemd/system/chef-server.service
        mode: "0644"

    # Create mock sysctl settings
    - name: Create mock sysctl settings
      ansible.builtin.copy:
        content: |
          vm.max_map_count = 262144
          vm.dirty_expire_centisecs = 20000
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Create mock hostname file
    - name: Create mock hostname file
      ansible.builtin.copy:
        content: "automate.chef.lab"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    # Create mock user and org list outputs
    - name: Create mock chef-server-ctl user-list output
      ansible.builtin.copy:
        content: |
          jtonello
          pivotal
        dest: /tmp/molecule_test/user-list.txt
        mode: "0644"

    - name: Create mock chef-server-ctl org-list output
      ansible.builtin.copy:
        content: |
          lab
        dest: /tmp/molecule_test/org-list.txt
        mode: "0644"

    # Create mock Chef Automate CLI
    - name: Create mock Chef Automate CLI
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Automate CLI mock"
          echo "Version: 2.0.0"
          if [ "$1" == "status" ]; then
            echo "All services are running"
          elif [ "$1" == "system-logs" ]; then
            echo "Log entries would appear here"
          fi
        dest: /tmp/molecule_test/chef-automate
        mode: "0755"

    # Create mock Chef Server CLI
    - name: Create mock Chef Server CLI
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          echo "Chef Server CLI mock"
          if [ "$1" == "status" ]; then
            echo "All services are running"
          fi
        dest: /tmp/molecule_test/chef-server-ctl
        mode: "0755"