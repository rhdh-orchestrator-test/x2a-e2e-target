---
argument_specs:
  main:
    short_description: Simple cache cookbook - local dependency for testing
    description:
      - Installs and configures Redis server as a simple caching solution.
      - Sets up a single Redis instance with default configuration.
    options:
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Package name for Redis server.
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Service name for Redis server.
      cache_redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port Redis server listens on.
      cache_redis_bind:
        type: str
        required: false
        default: 127.0.0.1
        description: IP address Redis server binds to.
