---
argument_specs:
  main:
    short_description: Install and configure Redis cache server
    description:
      - Installs Redis server package and ensures the service is running
      - Provides a simple Redis cache instance with default configuration
      - Uses default Redis port 6379 and standard system paths
    options:
      cache_redis_package:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis package to install (distribution-specific)
      cache_redis_service:
        type: str
        required: false
        default: redis-server
        description: Name of the Redis service to manage (distribution-specific)
