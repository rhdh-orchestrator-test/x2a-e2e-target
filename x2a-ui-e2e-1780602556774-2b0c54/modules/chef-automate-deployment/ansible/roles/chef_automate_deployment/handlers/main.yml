---
- name: Restart Chef Automate
  ansible.builtin.command:
    cmd: chef-automate restart
  become: true
  listen: restart chef automate
  changed_when: true
- name: Restart Chef Infra Server
  ansible.builtin.command:
    cmd: chef-server-ctl restart
  become: true
  listen: restart chef server
  changed_when: true
- name: Wait for Chef Automate services
  ansible.builtin.pause:
    seconds: 30
  listen: wait for chef automate services
