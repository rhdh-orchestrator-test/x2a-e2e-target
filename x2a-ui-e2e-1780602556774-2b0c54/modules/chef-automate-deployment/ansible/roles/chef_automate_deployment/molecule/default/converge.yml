---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    # Create directory structure for Chef Automate and Chef Infra Server
    - name: Create expected directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/opscode
        - /tmp/molecule_test/hab
        - /tmp/molecule_test/tmp

    # Simulate system configuration
    - name: Create hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname }}"
        dest: /tmp/molecule_test/etc/hostname
        mode: "0644"

    - name: Create sysctl configuration file
      ansible.builtin.copy:
        content: |
          vm.max_map_count={{ chef_automate_vm_max_map_count }}
          vm.dirty_expire_centisecs={{ chef_automate_vm_dirty_expire_centisecs }}
        dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
        mode: "0644"

    # Simulate Chef Automate CLI download and installation
    - name: Create Chef Automate CLI file
      ansible.builtin.copy:
        content: "#!/bin/bash\necho 'Chef Automate CLI mock'\n"
        dest: /tmp/molecule_test/tmp/chef-automate
        mode: "0755"

    # Simulate Chef Automate deployment
    - name: Create Chef Automate config file
      ansible.builtin.copy:
        content: |
          {
            "products": [
              "automate",
              "infra-server"
            ],
            "accepted_terms": true
          }
        dest: /tmp/molecule_test/etc/chef-automate/config.json
        mode: "0644"

    # Simulate Chef Infra Server configuration
    - name: Create Chef Infra Server config file
      ansible.builtin.copy:
        content: |
          {
            "chef_server": {
              "api_fqdn": "{{ chef_automate_hostname }}",
              "configuration": {}
            }
          }
        dest: /tmp/molecule_test/etc/opscode/chef-server.rb
        mode: "0644"

    # Simulate user and organization creation
    - name: Create user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAzMock_user_key_content_here
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/{{ chef_infra_admin_username }}.pem"
        mode: "0600"

    - name: Create organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEowIBAAKCAQEAzMock_org_validator_key_content_here
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/{{ chef_infra_org_name }}-validator.pem"
        mode: "0600"

    # Create mock Chef server user and org list files
    - name: Create Chef server user list file
      ansible.builtin.copy:
        content: "{{ chef_infra_admin_username }}"
        dest: /tmp/molecule_test/etc/opscode/user-list.txt
        mode: "0644"

    - name: Create Chef server organization list file
      ansible.builtin.copy:
        content: "{{ chef_infra_org_name }}"
        dest: /tmp/molecule_test/etc/opscode/org-list.txt
        mode: "0644"

    # Create mock service status files
    - name: Create Chef Automate status file
      ansible.builtin.copy:
        content: |
          Service: chef-automate
          Status: running
          Components:
            - automate-gateway: running
            - automate-ui: running
            - infra-server: running
        dest: /tmp/molecule_test/etc/chef-automate/status.txt
        mode: "0644"

    - name: Create Chef Infra Server status file
      ansible.builtin.copy:
        content: |
          Service: chef-server
          Status: running
          Components:
            - bookshelf: running
            - erchef: running
            - nginx: running
        dest: /tmp/molecule_test/etc/opscode/status.txt
        mode: "0644"