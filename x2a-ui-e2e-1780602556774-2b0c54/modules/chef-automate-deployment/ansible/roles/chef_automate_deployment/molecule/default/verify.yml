---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    chef_infra_admin_username: admin
    chef_infra_org_name: example-org
  tasks:
    # System configuration verification
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.size > 0
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Check sysctl configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl configuration file was created
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.size > 0
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are set correctly
      ansible.builtin.assert:
        that:
          - "'vm.max_map_count=262144' in (sysctl_content.content | b64decode)"
          - "'vm.dirty_expire_centisecs=20000' in (sysctl_content.content | b64decode)"
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI verification
    - name: Check Chef Automate CLI file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/tmp/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI file was created
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI file not found or not executable"
        success_msg: "Chef Automate CLI file exists and is executable"

    # Chef Automate configuration verification
    - name: Check Chef Automate config directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate
      register: chef_automate_config_dir

    - name: Assert Chef Automate config directory was created
      ansible.builtin.assert:
        that:
          - chef_automate_config_dir.stat.exists
          - chef_automate_config_dir.stat.isdir
        fail_msg: "Chef Automate config directory not found"
        success_msg: "Chef Automate config directory exists"

    - name: Check Chef Automate config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.json
      register: chef_automate_config

    - name: Assert Chef Automate config file was created
      ansible.builtin.assert:
        that:
          - chef_automate_config.stat.exists
          - chef_automate_config.stat.size > 0
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    # Chef Infra Server configuration verification
    - name: Check Chef Infra Server config directory exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/opscode
      register: chef_infra_config_dir

    - name: Assert Chef Infra Server config directory was created
      ansible.builtin.assert:
        that:
          - chef_infra_config_dir.stat.exists
          - chef_infra_config_dir.stat.isdir
        fail_msg: "Chef Infra Server config directory not found"
        success_msg: "Chef Infra Server config directory exists"

    - name: Check Chef Infra Server config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/opscode/chef-server.rb
      register: chef_infra_config

    - name: Assert Chef Infra Server config file was created
      ansible.builtin.assert:
        that:
          - chef_infra_config.stat.exists
          - chef_infra_config.stat.size > 0
        fail_msg: "Chef Infra Server config file not found"
        success_msg: "Chef Infra Server config file exists"

    # User and organization verification
    - name: Check user key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_infra_admin_username }}.pem"
      register: user_key_file

    - name: Assert user key file was created
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.size > 0
          - user_key_file.stat.mode == "0600"
        fail_msg: "User key file not found or has incorrect permissions"
        success_msg: "User key file exists with correct permissions"

    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_infra_org_name }}-validator.pem"
      register: org_key_file

    - name: Assert organization validator key file was created
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.size > 0
          - org_key_file.stat.mode == "0600"
        fail_msg: "Organization validator key file not found or has incorrect permissions"
        success_msg: "Organization validator key file exists with correct permissions"

    - name: Check user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/opscode/user-list.txt
      register: user_list_file

    - name: Assert user list file contains the created user
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/opscode/user-list.txt
      register: user_list_content
      when: user_list_file.stat.exists

    - name: Assert user was created
      ansible.builtin.assert:
        that:
          - chef_infra_admin_username in (user_list_content.content | b64decode)
        fail_msg: "User not found in user list"
        success_msg: "User found in user list"
      when: user_list_file.stat.exists

    - name: Check organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/opscode/org-list.txt
      register: org_list_file

    - name: Assert organization list file contains the created organization
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/opscode/org-list.txt
      register: org_list_content
      when: org_list_file.stat.exists

    - name: Assert organization was created
      ansible.builtin.assert:
        that:
          - chef_infra_org_name in (org_list_content.content | b64decode)
        fail_msg: "Organization not found in organization list"
        success_msg: "Organization found in organization list"
      when: org_list_file.stat.exists

    # Service status verification (tagged for skipping in container)
    - name: Check Chef Automate service status
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/status.txt
      register: chef_automate_status_file
      tags: molecule-notest

    - name: Get Chef Automate service status
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/chef-automate/status.txt
      register: chef_automate_status_content
      when: chef_automate_status_file.stat.exists
      tags: molecule-notest

    - name: Assert Chef Automate service is running
      ansible.builtin.assert:
        that:
          - "'Status: running' in (chef_automate_status_content.content | b64decode)"
        fail_msg: "Chef Automate service not running"
        success_msg: "Chef Automate service is running"
      when: chef_automate_status_file.stat.exists
      tags: molecule-notest

    - name: Check Chef Infra Server service status
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/opscode/status.txt
      register: chef_infra_status_file
      tags: molecule-notest

    - name: Get Chef Infra Server service status
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/opscode/status.txt
      register: chef_infra_status_content
      when: chef_infra_status_file.stat.exists
      tags: molecule-notest

    - name: Assert Chef Infra Server service is running
      ansible.builtin.assert:
        that:
          - "'Status: running' in (chef_infra_status_content.content | b64decode)"
        fail_msg: "Chef Infra Server service not running"
        success_msg: "Chef Infra Server service is running"
      when: chef_infra_status_file.stat.exists
      tags: molecule-notest

    # Network checks (tagged for skipping in container)
    - name: Check for port 443 listening
      ansible.builtin.wait_for:
        port: 443
        timeout: 1
      register: port_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is success
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    # Web UI access check (tagged for skipping in container)
    - name: Check Chef Automate API status
      ansible.builtin.uri:
        url: https://localhost/api/_status
        validate_certs: false
        status_code: 200
      register: api_check
      ignore_errors: true
      tags: molecule-notest

    - name: Assert Chef Automate API is accessible
      ansible.builtin.assert:
        that:
          - api_check is success
        fail_msg: "Chef Automate API is not accessible"
        success_msg: "Chef Automate API is accessible"
      tags: molecule-notest