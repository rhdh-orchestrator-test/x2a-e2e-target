---
# Cache role defaults
# Redis configuration
cache_redis_port: 6379
cache_redis_log_dir: /var/log/redis
cache_redis_config_file: /etc/redis/6379.conf
cache_redis_user: redis
cache_redis_group: redis
cache_redis_service_name: redis-server
# Memcached configuration
cache_memcached_port: 11211
# Redis configuration settings to remove (replica-related)
cache_redis_config_lines_to_remove:
  - ^replica-serve-stale-data.*$
  - ^replica-read-only.*$
  - ^repl-ping-replica-period.*$
  - ^client-output-buffer-limit.*$
  - ^replica-priority.*$
