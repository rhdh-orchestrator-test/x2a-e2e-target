---
# Cache role handlers

- name: Restart Redis
  ansible.builtin.service:
    name: "{{ cache_redis_service_name | default('redis-server') }}"
    state: restarted

- name: Restart Memcached
  ansible.builtin.service:
    name: memcached
    state: restarted

- name: Reload Redis config
  ansible.builtin.service:
    name: "{{ cache_redis_service_name | default('redis-server') }}"
    state: reloaded
