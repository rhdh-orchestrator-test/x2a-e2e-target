---
# Cache role main tasks

- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install memcached
  ansible.builtin.package:
    name: memcached
    state: present

- name: Install Redis server
  ansible.builtin.package:
    name: redis-server
    state: present

- name: Create Redis group
  ansible.builtin.group:
    name: "{{ cache_redis_group }}"
    state: present

- name: Create Redis user
  ansible.builtin.user:
    name: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    system: true
    shell: /bin/false
    home: /var/lib/redis
    create_home: false
    state: present

- name: Create Redis configuration directory
  ansible.builtin.file:
    path: /etc/redis
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Create Redis log directory
  ansible.builtin.file:
    path: "{{ cache_redis_log_dir }}" # noqa: R114 - path from role defaults, not user input
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory
    recurse: true

- name: Create Redis PID directory
  ansible.builtin.file:
    path: /var/run/redis
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0755"
    state: directory

- name: Configure Redis server
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults, not user input
    owner: "{{ cache_redis_user }}"
    group: "{{ cache_redis_group }}"
    mode: "0640"
    backup: true
  notify: Restart Redis

- name: Remove unwanted Redis configuration lines
  ansible.builtin.lineinfile:
    path: "{{ cache_redis_config_file }}" # noqa: R114 - path from role defaults, not user input
    regexp: "{{ item_config }}"
    state: absent # noqa: R115 - path from role defaults, not user input
  loop: "{{ cache_redis_config_lines_to_remove }}"
  loop_control:
    loop_var: item_config
  notify: Restart Redis

- name: Start and enable memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true

- name: Start and enable Redis service
  ansible.builtin.service:
    name: "{{ cache_redis_service_name | default('redis-server') }}"
    state: started
    enabled: true
