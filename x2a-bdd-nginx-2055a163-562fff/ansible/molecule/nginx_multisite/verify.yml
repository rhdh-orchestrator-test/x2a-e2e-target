---
# Unsupported pre-flight checks: HTTP response/header/body details, TLS protocol handshakes,
# UFW rule output, and sysctl values do not state an expected result in the plan.
- name: Verify nginx multisite pre-flight checks
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are present
      ansible.builtin.assert:
        that:
          - item_package in ansible_facts.packages
        fail_msg: "A required package is not installed."
      loop:
        - nginx
        - fail2ban
        - ufw
        - openssl
        - ca-certificates
      loop_control:
        loop_var: item_package

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert nginx is enabled and active
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts.services"
          - ansible_facts.services['nginx.service']['status'] == 'enabled'
          - ansible_facts.services['nginx.service']['state'] == 'running'
        fail_msg: nginx is not enabled and active.

    - name: Assert fail2ban is enabled and active
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts.services"
          - ansible_facts.services['fail2ban.service']['status'] == 'enabled'
          - ansible_facts.services['fail2ban.service']['state'] == 'running'
        fail_msg: fail2ban is not enabled and active.

    - name: Assert SSH service is active
      ansible.builtin.assert:
        that:
          - "('ssh.service' in ansible_facts.services) or ('sshd.service' in ansible_facts.services)"
          - >-
            (('ssh.service' in ansible_facts.services) and
            (ansible_facts.services['ssh.service']['state'] == 'running')) or
            (('sshd.service' in ansible_facts.services) and
            (ansible_facts.services['sshd.service']['state'] == 'running'))
        fail_msg: SSH is not active.

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      register: item_nginx_test
      changed_when: false

    - name: Assert nginx configuration is valid
      ansible.builtin.assert:
        that:
          - item_nginx_test.rc == 0
        fail_msg: nginx configuration validation failed.

    - name: Inspect rendered nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -T
      register: item_nginx_dump
      changed_when: false

    - name: Assert virtual hosts and listeners are present in nginx configuration
      ansible.builtin.assert:
        that:
          - "'test.cluster.local' in item_nginx_dump.stdout"
          - "'ci.cluster.local' in item_nginx_dump.stdout"
          - "'status.cluster.local' in item_nginx_dump.stdout"
          - "'listen 80' in item_nginx_dump.stdout"
          - "'listen 443' in item_nginx_dump.stdout"
        fail_msg: Expected virtual hosts or listeners are missing from nginx configuration.

    - name: Read nginx main configuration
      ansible.builtin.slurp:
        src: /etc/nginx/nginx.conf
      register: item_nginx_config

    - name: Assert required nginx main configuration directives are present
      ansible.builtin.assert:
        that:
          - "'worker_processes' in (item_nginx_config.content | b64decode)"
          - "'worker_connections' in (item_nginx_config.content | b64decode)"
          - "'access_log' in (item_nginx_config.content | b64decode)"
          - "'error_log' in (item_nginx_config.content | b64decode)"
          - "'gzip on' in (item_nginx_config.content | b64decode)"
        fail_msg: Expected directives are missing from nginx.conf.

    - name: Read nginx security configuration
      ansible.builtin.slurp:
        src: /etc/nginx/conf.d/security.conf
      register: item_nginx_security

    - name: Assert required nginx security directives are present
      ansible.builtin.assert:
        that:
          - "'server_tokens' in (item_nginx_security.content | b64decode)"
          - "'limit_req_zone' in (item_nginx_security.content | b64decode)"
          - "'ssl_protocols' in (item_nginx_security.content | b64decode)"
          - "'client_max_body_size' in (item_nginx_security.content | b64decode)"
        fail_msg: Expected directives are missing from security.conf.

    - name: Verify required site files, certificates, keys, and links
      ansible.builtin.stat:
        path: "{{ item_site['path'] }}"
      register: item_site_stats
      loop:
        - path: /opt/server/test
          kind: directory
        - path: /opt/server/test/index.html
          kind: file
        - path: /etc/ssl/certs/test.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/test.cluster.local.key
          kind: file
        - path: /etc/nginx/sites-enabled/test.cluster.local
          kind: link
        - path: /opt/server/ci
          kind: directory
        - path: /opt/server/ci/index.html
          kind: file
        - path: /etc/ssl/certs/ci.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/ci.cluster.local.key
          kind: file
        - path: /etc/nginx/sites-enabled/ci.cluster.local
          kind: link
        - path: /opt/server/status
          kind: directory
        - path: /opt/server/status/index.html
          kind: file
        - path: /etc/ssl/certs/status.cluster.local.crt
          kind: file
        - path: /etc/ssl/private/status.cluster.local.key
          kind: file
        - path: /etc/nginx/sites-enabled/status.cluster.local
          kind: link
      loop_control:
        loop_var: item_site

    - name: Assert required site files, certificates, keys, and links exist
      ansible.builtin.assert:
        that:
          - item_site_result.stat.exists
          - >-
            (item_site_result.item['kind'] == 'directory' and
            item_site_result.stat.isdir) or
            (item_site_result.item['kind'] == 'file' and item_site_result.stat.isfile) or
            (item_site_result.item['kind'] == 'link' and item_site_result.stat.islnk)
        fail_msg: A required site artifact is missing or has the wrong type.
      loop: "{{ item_site_stats.results }}"
      loop_control:
        loop_var: item_site_result

    - name: Validate generated certificates
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item_certificate['path'] }}"
          - -noout
          - -subject
          - -dates
      register: item_certificate_result
      changed_when: false
      loop:
        - path: /etc/ssl/certs/test.cluster.local.crt
        - path: /etc/ssl/certs/ci.cluster.local.crt
        - path: /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_certificate

    - name: Assert generated certificates can be inspected
      ansible.builtin.assert:
        that:
          - item_certificate_result.rc == 0
        fail_msg: A generated certificate could not be inspected.
      loop: "{{ item_certificate_result.results }}"
      loop_control:
        loop_var: item_certificate_result_item

    - name: Verify fail2ban responds to its pre-flight diagnostics
      ansible.builtin.command:
        argv: [fail2ban-client, "{{ item_fail2ban['command'] }}"]
      register: item_fail2ban_result
      changed_when: false
      loop:
        - command: ping
        - command: status
        - command: status
          jail: sshd
        - command: status
          jail: nginx-http-auth
        - command: status
          jail: nginx-limit-req
        - command: status
          jail: nginx-botsearch
      loop_control:
        loop_var: item_fail2ban
      when: item_fail2ban['jail'] is not defined

    - name: Verify fail2ban jail diagnostics
      ansible.builtin.command:
        argv:
          - fail2ban-client
          - status
          - "{{ item_fail2ban_jail['jail'] }}"
      register: item_fail2ban_jail_result
      changed_when: false
      loop:
        - jail: sshd
        - jail: nginx-http-auth
        - jail: nginx-limit-req
        - jail: nginx-botsearch
      loop_control:
        loop_var: item_fail2ban_jail

    - name: Assert fail2ban diagnostics succeeded
      ansible.builtin.assert:
        that:
          - item_fail2ban_check.rc == 0
        fail_msg: A fail2ban pre-flight diagnostic failed.
      loop: "{{ item_fail2ban_result.results + item_fail2ban_jail_result.results }}"
      loop_control:
        loop_var: item_fail2ban_check

    - name: Read SSH daemon configuration
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: item_sshd_config

    - name: Assert SSH hardening directives are present
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (item_sshd_config.content | b64decode)"
          - "'PasswordAuthentication no' in (item_sshd_config.content | b64decode)"
        fail_msg: Expected SSH hardening directives are missing.

    - name: Validate SSH daemon configuration
      ansible.builtin.command:
        argv:
          - sshd
          - -t
      register: item_sshd_test
      changed_when: false

    - name: Assert SSH daemon configuration is valid
      ansible.builtin.assert:
        that:
          - item_sshd_test.rc == 0
        fail_msg: SSH daemon configuration validation failed.

    - name: Verify the default nginx site was removed
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: item_default_site

    - name: Assert the default nginx site is absent
      ansible.builtin.assert:
        that:
          - not item_default_site.stat.exists
        fail_msg: The default nginx site is still present.
