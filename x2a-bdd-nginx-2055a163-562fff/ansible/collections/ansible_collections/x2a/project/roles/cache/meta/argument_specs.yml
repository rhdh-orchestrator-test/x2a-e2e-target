---
argument_specs:
  main:
    short_description: Install and configure the cache services.
    description:
      - Configures a standalone Redis cache instance on port 6379.
      - Redis authentication is supplied by the AAP credential variable redis_password.
    options:
      cache_secure_logging:
        type: bool
        required: false
        default: true
        description: Whether to suppress output from tasks that handle Redis credentials.
      redis_port:
        type: int
        required: false
        default: 6379
        description: TCP port on which Redis listens.
      redis_cluster_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis cluster mode is enabled.
      redis_sentinel_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis Sentinel mode is enabled.
      redis_replication_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis replication is enabled.
      redis_aof_enabled:
        type: bool
        required: false
        default: false
        description: Whether Redis append-only persistence is enabled.
      redis_rdb_enabled:
        type: bool
        required: false
        default: true
        description: Whether Redis RDB persistence is enabled.
      redis_password:
        type: str
        required: true
        description: Redis authentication password injected by an AAP credential type.
