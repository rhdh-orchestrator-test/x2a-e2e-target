---
argument_specs:
  main:
    short_description: Deploy the FastAPI tutorial application with PostgreSQL
    description:
      - Installs the FastAPI tutorial application and its PostgreSQL dependency.
      - Configures the application service and database connection using AAP credentials.
    options:
      fastapi_tutorial_secure_logging:
        type: bool
        required: false
        default: true
        description: Hide output from tasks that handle the database password.
