---
controller_credential_types:
  - name: PostgreSQL Application Database
    description: Credentials and connection settings for the local PostgreSQL database used by the FastAPI application. The password is currently hardcoded in 
      the Chef recipe and embedded in the application DATABASE_URL.
    kind: cloud
    inputs:
      fields:
        - id: database_host
          type: string
          label: Database Host
          help_text: Hostname for the PostgreSQL server.
        - id: database_name
          type: string
          label: Database Name
          help_text: Name of the PostgreSQL database used by the application.
        - id: database_username
          type: string
          label: Database Username
          help_text: PostgreSQL role used by the FastAPI application.
        - id: database_password
          type: string
          label: Database Password
          secret: true
          help_text: Password for the PostgreSQL application user; used both when creating the role and in DATABASE_URL.
      required:
        - database_host
        - database_name
        - database_username
        - database_password
    injectors:
      extra_vars:
        database_host: !unsafe "{{ database_host }}"
        database_name: !unsafe "{{ database_name }}"
        database_username: !unsafe "{{ database_username }}"
        database_password: !unsafe "{{ database_password }}"
