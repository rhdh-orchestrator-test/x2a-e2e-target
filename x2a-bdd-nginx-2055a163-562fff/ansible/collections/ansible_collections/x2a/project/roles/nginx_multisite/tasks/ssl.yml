---
- name: Install SSL packages
  ansible.builtin.package:
    name:
      - openssl
      - ca-certificates
    state: present

- name: Create ssl-cert group
  ansible.builtin.group:
    name: ssl-cert
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_certificate_path }}" # noqa: R114 - path from role default, not user input
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create private key directory
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}" # noqa: R114 - path from role default, not user input
    state: directory
    owner: root
    group: ssl-cert
    mode: "0710"

- name: Check site certificate
  ansible.builtin.stat:
    path: "{{ nginx_multisite_certificate_path }}/{{ item_nginx_multisite['key'] }}.crt" # noqa: R114 - path from role-defined sites dictionary
  when: item_nginx_multisite['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
  register: nginx_multisite_certificate_stat

- name: Check site private key
  ansible.builtin.stat:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite['key'] }}.key" # noqa: R114 - path from role-defined sites dictionary
  when: item_nginx_multisite['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
  register: nginx_multisite_key_stat

- name: Reject incomplete site TLS material # noqa: L039 - registered statistics are produced by the preceding loop tasks
  ansible.builtin.fail:
    msg: >-
      TLS certificate and private key must either both exist or both be absent
      for {{ item_nginx_multisite['key'] }}.
  when:
    - item_nginx_multisite['value']['ssl_enabled']
    - >-
      ((nginx_multisite_certificate_stat.results | selectattr("item['key']", 'equalto', item_nginx_multisite['key']) |
      map(attribute='stat.exists') | first | default(false)) !=
      (nginx_multisite_key_stat.results | selectattr("item['key']", 'equalto', item_nginx_multisite['key']) |
      map(attribute='stat.exists') | first | default(false)))
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite

- name: Generate self-signed site certificates # noqa: L039 - registered statistics are produced by the preceding loop tasks
  ansible.builtin.command: # noqa: R101 - command arguments come from role defaults and role-defined site data; no-changed-when - execution is guarded by absence of both output files
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -days
      - "365"
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite['key'] }}.key"
      - -out
      - "{{ nginx_multisite_certificate_path }}/{{ item_nginx_multisite['key'] }}.crt"
      - -subj
      - /C=US/ST=Example/L=Example/O=Example Org/OU=IT/CN={{ item_nginx_multisite['key'] }}/emailAddress=admin@example.com
  when:
    - item_nginx_multisite['value']['ssl_enabled']
    - not (nginx_multisite_certificate_stat.results | selectattr("item['key']", 'equalto', item_nginx_multisite['key']) | map(attribute='stat.exists') | first | default(false))
    - not (nginx_multisite_key_stat.results | selectattr("item['key']", 'equalto', item_nginx_multisite['key']) | map(attribute='stat.exists') | first | default(false))
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
  notify: Reload nginx

- name: Set private key ownership and permissions
  ansible.builtin.file:
    path: "{{ nginx_multisite_private_key_path }}/{{ item_nginx_multisite['key'] }}.key" # noqa: R114 - path from role-defined sites dictionary
    state: file
    owner: root
    group: ssl-cert
    mode: "0640"
  when: item_nginx_multisite['value']['ssl_enabled']
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_nginx_multisite
