---
- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
      - openssh-server
      - procps
    state: present

- name: Deploy fail2ban configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  when: nginx_multisite_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: nginx_multisite_fail2ban_enabled | bool

- name: Check UFW status
  ansible.builtin.command:
    argv:
      - ufw
      - status
      - verbose
  register: nginx_multisite_ufw_status
  changed_when: false
  check_mode: false
  when: nginx_multisite_ufw_enabled | bool

- name: Set UFW default incoming policy # noqa: L039 - status is registered by the prior UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - default
      - deny
  when:
    - nginx_multisite_ufw_enabled
    - "'Default: deny (incoming)' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Allow SSH through UFW # noqa: L039 - status is registered by the prior UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - ssh
  when:
    - nginx_multisite_ufw_enabled
    - "'22/tcp' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Allow HTTP through UFW # noqa: L039 - status is registered by the prior UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - 80/tcp
  when:
    - nginx_multisite_ufw_enabled
    - "'80/tcp' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Allow HTTPS through UFW # noqa: L039 - status is registered by the prior UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - 443/tcp
  when:
    - nginx_multisite_ufw_enabled
    - "'443/tcp' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Enable UFW # noqa: L039 - status is registered by the prior UFW status task
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - enable
  when:
    - nginx_multisite_ufw_enabled
    - "'Status: active' not in nginx_multisite_ufw_status.stdout"
  changed_when: true

- name: Deploy sysctl security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload nginx_multisite sysctl

- name: Apply sysctl security settings
  ansible.posix.sysctl:
    name: "{{ item_nginx_multisite['key'] }}"
    value: "{{ item_nginx_multisite['value'] }}"
    sysctl_file: /etc/sysctl.d/99-security.conf
    state: present
    reload: false
    sysctl_set: true
  loop:
    - key: net.ipv4.conf.default.rp_filter
      value: "1"
    - key: net.ipv4.conf.all.rp_filter
      value: "1"
    - key: net.ipv4.conf.all.accept_redirects
      value: "0"
    - key: net.ipv6.conf.all.accept_redirects
      value: "0"
    - key: net.ipv4.conf.default.accept_redirects
      value: "0"
    - key: net.ipv6.conf.default.accept_redirects
      value: "0"
    - key: net.ipv4.conf.all.send_redirects
      value: "0"
    - key: net.ipv4.conf.default.send_redirects
      value: "0"
    - key: net.ipv4.conf.all.accept_source_route
      value: "0"
    - key: net.ipv6.conf.all.accept_source_route
      value: "0"
    - key: net.ipv4.conf.default.accept_source_route
      value: "0"
    - key: net.ipv6.conf.default.accept_source_route
      value: "0"
    - key: net.ipv4.conf.all.log_martians
      value: "1"
    - key: net.ipv4.conf.default.log_martians
      value: "1"
    - key: net.ipv4.icmp_echo_ignore_all
      value: "1"
    - key: net.ipv4.icmp_echo_ignore_broadcasts
      value: "1"
    - key: net.ipv6.conf.all.disable_ipv6
      value: "1"
    - key: net.ipv6.conf.default.disable_ipv6
      value: "1"
    - key: net.ipv6.conf.lo.disable_ipv6
      value: "1"
    - key: net.ipv4.tcp_syncookies
      value: "1"
    - key: net.ipv4.tcp_max_syn_backlog
      value: "2048"
    - key: net.ipv4.tcp_synack_retries
      value: "2"
    - key: net.ipv4.tcp_syn_retries
      value: "5"
  loop_control:
    loop_var: item_nginx_multisite

- name: Check SSH daemon configuration
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config

- name: Disable SSH root login # noqa: L039 - configuration status is registered by the prior stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    create: false
    validate: /usr/sbin/sshd -t -f %s
  when:
    - nginx_multisite_disable_root_login
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart SSH

- name: Disable SSH password authentication # noqa: L039 - configuration status is registered by the prior stat task
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    create: false
    validate: /usr/sbin/sshd -t -f %s
  when:
    - not nginx_multisite_password_authentication
    - nginx_multisite_sshd_config.stat.exists
  notify: Restart SSH
