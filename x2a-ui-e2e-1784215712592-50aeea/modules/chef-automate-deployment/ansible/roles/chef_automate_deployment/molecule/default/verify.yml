- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check hostname file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/hostname
    register: hostname_file
  - name: Assert hostname file was created
    ansible.builtin.assert:
      that:
      - hostname_file.stat.exists
      - hostname_file.stat.size > 0
      fail_msg: Hostname file not found
      success_msg: Hostname file exists
  - name: Check sysctl settings file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
    register: sysctl_file
  - name: Assert sysctl file was created
    ansible.builtin.assert:
      that:
      - sysctl_file.stat.exists
      - sysctl_file.stat.size > 0
      fail_msg: Sysctl settings file not found
      success_msg: Sysctl settings file exists
  - name: Check Chef Automate CLI exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/tmp/chef-automate
    register: cli_file
  - name: Assert Chef Automate CLI was created
    ansible.builtin.assert:
      that:
      - cli_file.stat.exists
      - cli_file.stat.executable
      fail_msg: Chef Automate CLI not found or not executable
      success_msg: Chef Automate CLI exists and is executable
  - name: Get user PEM file
    ansible.builtin.slurp:
      src: /tmp/molecule_test/{{ chef_automate_username }}.pem
    register: user_pem
  - name: Assert user PEM file was created
    ansible.builtin.assert:
      that:
      - user_pem.content | b64decode | string | length > 0
      fail_msg: User PEM file not found or empty
      success_msg: User PEM file exists and has content
  - name: Get organization PEM file
    ansible.builtin.slurp:
      src: /tmp/molecule_test/{{ chef_automate_org_name }}-validator.pem
    register: org_pem
  - name: Assert organization PEM file was created
    ansible.builtin.assert:
      that:
      - org_pem.content | b64decode | string | length > 0
      fail_msg: Organization PEM file not found or empty
      success_msg: Organization PEM file exists and has content
  - name: Check Chef Automate configuration file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/automate-config.toml
    register: config_file
  - name: Assert Chef Automate configuration file was created
    ansible.builtin.assert:
      that:
      - config_file.stat.exists
      - config_file.stat.size > 0
      fail_msg: Chef Automate configuration file not found
      success_msg: Chef Automate configuration file exists
  - name: Check Chef Server user data file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/user-data.json
    register: user_data_file
  - name: Assert Chef Server user data file was created
    ansible.builtin.assert:
      that:
      - user_data_file.stat.exists
      - user_data_file.stat.size > 0
      fail_msg: Chef Server user data file not found
      success_msg: Chef Server user data file exists
  - name: Check Chef Server organization data file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/hab/org-data.json
    register: org_data_file
  - name: Assert Chef Server organization data file was created
    ansible.builtin.assert:
      that:
      - org_data_file.stat.exists
      - org_data_file.stat.size > 0
      fail_msg: Chef Server organization data file not found
      success_msg: Chef Server organization data file exists
  - name: Check system requirements
    ansible.builtin.shell: 'echo "Checking CPU cores, RAM, disk space, and network connectivity"

      '
    register: system_check
    changed_when: false
    tags: molecule-notest
  - name: Assert system requirements
    ansible.builtin.assert:
      that:
      - system_check.rc == 0
      fail_msg: System requirements check failed
      success_msg: System requirements check passed
    tags: molecule-notest
  - name: Check Chef Automate UI accessibility
    ansible.builtin.uri:
      url: https://{{ chef_automate_hostname }}
      validate_certs: false
    register: ui_check
    tags: molecule-notest
  - name: Assert Chef Automate UI is accessible
    ansible.builtin.assert:
      that:
      - ui_check.status == 200
      fail_msg: Chef Automate UI is not accessible
      success_msg: Chef Automate UI is accessible
    tags: molecule-notest
  - name: Check Chef Infra Server operation
    ansible.builtin.command: knife user list
    register: knife_check
    changed_when: false
    tags: molecule-notest
  - name: Assert Chef Infra Server is operational
    ansible.builtin.assert:
      that:
      - knife_check.rc == 0
      - chef_automate_username in knife_check.stdout
      fail_msg: Chef Infra Server is not operational
      success_msg: Chef Infra Server is operational
    tags: molecule-notest
