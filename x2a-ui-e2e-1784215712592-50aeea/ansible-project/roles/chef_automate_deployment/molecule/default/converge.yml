- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc
    - /tmp/molecule_test/hab
    - /tmp/molecule_test/tmp
  - name: Create hostname file
    ansible.builtin.copy:
      content: '{{ chef_automate_hostname }}'
      dest: /tmp/molecule_test/etc/hostname
      mode: '0644'
  - name: Create sysctl settings file
    ansible.builtin.copy:
      content: 'vm.max_map_count = {{ chef_automate_vm_max_map_count }}

        vm.dirty_expire_centisecs = {{ chef_automate_vm_dirty_expire_centisecs }}

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create Chef Automate CLI file
    ansible.builtin.copy:
      content: '#!/bin/bash echo ''Chef Automate CLI'''
      dest: /tmp/molecule_test/tmp/chef-automate
      mode: '0755'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/{{ chef_automate_user_pem_file }}
      mode: '0600'
  - name: Create organization PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY----- MIIEpAIBAAKCAQEA... -----END RSA PRIVATE KEY----- '
      dest: /tmp/molecule_test/{{ chef_automate_org_pem_file }}
      mode: '0600'
  - name: Create Chef Automate configuration file
    ansible.builtin.copy:
      content: '[automate]

        fqdn = "{{ chef_automate_hostname }}"

        products = ["automate", "infra-server"]

        '
      dest: /tmp/molecule_test/hab/automate-config.toml
      mode: '0644'
  - name: Create Chef Server user data
    ansible.builtin.copy:
      content: "{\n  \"username\": \"{{ chef_automate_username }}\",\n  \"display_name\": \"{{ chef_automate_full_name }}\",\n  \"email\": \"{{ chef_automate_email
        }}\"\n}\n"
      dest: /tmp/molecule_test/hab/user-data.json
      mode: '0644'
  - name: Create Chef Server organization data
    ansible.builtin.copy:
      content: "{\n  \"name\": \"{{ chef_automate_org_name }}\",\n  \"full_name\": \"{{ chef_automate_org_full_name }}\"\n}\n"
      dest: /tmp/molecule_test/hab/org-data.json
      mode: '0644'
