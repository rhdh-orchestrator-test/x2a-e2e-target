- name: Set system hostname
  ansible.builtin.hostname:
    name: '{{ chef_automate_hostname }}'
  become: true
- name: Set vm.max_map_count kernel parameter
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: '{{ chef_automate_vm_max_map_count }}'
    state: present
    sysctl_set: true
  become: true
- name: Set vm.dirty_expire_centisecs kernel parameter
  ansible.posix.sysctl:
    name: vm.dirty_expire_centisecs
    value: '{{ chef_automate_vm_dirty_expire_centisecs }}'
    state: present
    sysctl_set: true
  become: true
- name: Ensure gzip package is installed
  ansible.builtin.package:
    name: gzip
    state: present
  become: true
- name: Download Chef Automate CLI
  ansible.builtin.get_url:
    url: '{{ chef_automate_cli_url }}'
    dest: '{{ chef_automate_cli_path }}.gz'
    mode: '0644'
  become: true
- name: Extract Chef Automate CLI
  ansible.builtin.shell: gunzip -c {{ chef_automate_cli_path }}.gz > {{ chef_automate_cli_path }}
  args:
    creates: '{{ chef_automate_cli_path }}'
  become: true
- name: Make Chef Automate CLI executable
  ansible.builtin.file:
    path: '{{ chef_automate_cli_path }}'
    mode: '0755'
  become: true
- name: Deploy Chef Automate and Chef Infra Server
  ansible.builtin.command: '{{ chef_automate_cli_path }} deploy  --product automate  --product infra-server  --accept-terms-and-mlsa={{ chef_automate_accept_terms
    | lower }} '
  args:
    creates: /hab
  become: true
  register: chef_automate_deploy
  changed_when: chef_automate_deploy.rc == 0
- name: Create Chef user
  ansible.builtin.command: 'chef-server-ctl user-create  {{ chef_automate_username }}  {{ chef_automate_full_name }}  {{ chef_automate_email }}  "{{ chef_automate_password
    }}"  --filename {{ chef_automate_user_pem_file }}

    '
  args:
    creates: '{{ chef_automate_user_pem_file }}'
  become: true
  register: chef_user_create
  changed_when: chef_user_create.rc == 0
- name: Create Chef organization
  ansible.builtin.command: 'chef-server-ctl org-create  {{ chef_automate_org_name }}  "{{ chef_automate_org_full_name }}"  --association_user {{ chef_automate_username
    }}  --filename {{ chef_automate_org_pem_file }}

    '
  args:
    creates: '{{ chef_automate_org_pem_file }}'
  become: true
  register: chef_org_create
  changed_when: chef_org_create.rc == 0
