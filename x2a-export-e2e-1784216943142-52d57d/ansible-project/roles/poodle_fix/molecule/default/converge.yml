- name: Converge
  hosts: all
  gather_facts: true
  tasks:
  - name: Create directory structure for Apache config
    ansible.builtin.file:
      path: /tmp/molecule_test/etc/apache2/mods-available
      state: directory
      mode: '0755'
  - name: Create mock Apache SSL config file with old SSLProtocol setting
    ansible.builtin.copy:
      content: '# Mock Apache SSL configuration file

        SSLEngine on

        SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem

        SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

        SSLProtocol all -SSLv3

        SSLCipherSuite HIGH:!aNULL:!MD5

        '
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      mode: '0644'
  - name: Mock Apache installation (simulating package task)
    ansible.builtin.file:
      path: /tmp/molecule_test/usr/sbin/apache2
      state: directory
      mode: '0755'
  - name: Fix SSL in Apache (simulating role task)
    ansible.builtin.replace:
      dest: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
      regexp: ^SSLProtocol.*$
      replace: SSLProtocol -all +TLSv1.2
