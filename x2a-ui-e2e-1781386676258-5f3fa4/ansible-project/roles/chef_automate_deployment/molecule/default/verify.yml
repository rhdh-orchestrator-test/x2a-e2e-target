---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == "automate.chef.lab"
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    - name: Check sysctl configuration file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_file

    - name: Assert sysctl configuration file was created
      ansible.builtin.assert:
        that:
          - sysctl_file.stat.exists
          - sysctl_file.stat.isreg
        fail_msg: "Sysctl configuration file not found"
        success_msg: "Sysctl configuration file exists"

    - name: Get sysctl configuration content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      register: sysctl_content
      when: sysctl_file.stat.exists

    - name: Assert sysctl parameters are set correctly
      ansible.builtin.assert:
        that:
          - sysctl_content.content | b64decode is search('vm.max_map_count = 262144')
          - sysctl_content.content | b64decode is search('vm.dirty_expire_centisecs = 20000')
        fail_msg: "Sysctl parameters not set correctly"
        success_msg: "Sysctl parameters set correctly"
      when: sysctl_file.stat.exists

    # Chef Automate CLI checks
    - name: Check Chef Automate CLI exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/chef-automate
      register: chef_automate_cli

    - name: Assert Chef Automate CLI was created
      ansible.builtin.assert:
        that:
          - chef_automate_cli.stat.exists
          - chef_automate_cli.stat.isreg
          - chef_automate_cli.stat.executable
        fail_msg: "Chef Automate CLI not found or not executable"
        success_msg: "Chef Automate CLI exists and is executable"

    # Chef Automate deployment checks
    - name: Check Chef Automate deployment marker exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef-automate/deployment-info.txt
      register: deployment_marker

    - name: Assert Chef Automate deployment marker was created
      ansible.builtin.assert:
        that:
          - deployment_marker.stat.exists
          - deployment_marker.stat.isreg
        fail_msg: "Chef Automate deployment marker not found"
        success_msg: "Chef Automate deployment marker exists"

    # User key file checks
    - name: Check user key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/user/jtonello.pem
      register: user_key_file

    - name: Assert user key file was created
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.isreg
          - user_key_file.stat.mode == "0600"
        fail_msg: "User key file not found or incorrect permissions"
        success_msg: "User key file exists with correct permissions"

    # Organization validator key file checks
    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/home/user/lab-validator.pem
      register: org_key_file

    - name: Assert organization validator key file was created
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.isreg
          - org_key_file.stat.mode == "0600"
        fail_msg: "Organization validator key file not found or incorrect permissions"
        success_msg: "Organization validator key file exists with correct permissions"

    # Chef user verification
    - name: Check Chef user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/opscode/user-list.txt
      register: user_list_file

    - name: Get Chef user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/opscode/user-list.txt
      register: user_list_content
      when: user_list_file.stat.exists

    - name: Assert user exists in user list
      ansible.builtin.assert:
        that:
          - user_list_content.content | b64decode is search('jtonello')
        fail_msg: "User 'jtonello' not found in user list"
        success_msg: "User 'jtonello' found in user list"
      when: user_list_file.stat.exists

    # Chef organization verification
    - name: Check Chef organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/opscode/org-list.txt
      register: org_list_file

    - name: Get Chef organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/opscode/org-list.txt
      register: org_list_content
      when: org_list_file.stat.exists

    - name: Assert organization exists in organization list
      ansible.builtin.assert:
        that:
          - org_list_content.content | b64decode is search('lab')
        fail_msg: "Organization 'lab' not found in organization list"
        success_msg: "Organization 'lab' found in organization list"
      when: org_list_file.stat.exists

    # The following checks would normally run on a real system but can't run in a container
    # They are tagged with molecule-notest so they'll be skipped during molecule testing

    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: chef_automate_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - chef_automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server is not running"
        success_msg: "Chef Infra Server is running"
      tags: molecule-notest

    - name: Check port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      tags: molecule-notest

    - name: Check web UI access
      ansible.builtin.uri:
        url: https://localhost/api/v0/health
        validate_certs: false
      register: health_check
      tags: molecule-notest

    - name: Assert web UI is accessible
      ansible.builtin.assert:
        that:
          - health_check.status == 200
        fail_msg: "Chef Automate web UI is not accessible"
        success_msg: "Chef Automate web UI is accessible"
      tags: molecule-notest