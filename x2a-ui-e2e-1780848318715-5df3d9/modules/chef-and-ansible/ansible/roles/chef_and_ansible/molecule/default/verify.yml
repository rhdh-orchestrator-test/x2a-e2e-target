- name: Verify
  hosts: all
  gather_facts: false
  tasks:
  - name: Check Apache virtual host configuration exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/sites-available/helloworld.conf
    register: vhost_config
  - name: Assert virtual host configuration exists
    ansible.builtin.assert:
      that:
      - vhost_config.stat.exists
      - vhost_config.stat.size > 0
      fail_msg: Virtual host configuration not found
      success_msg: Virtual host configuration exists
  - name: Check virtual host is enabled
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/sites-enabled/helloworld.conf
    register: vhost_enabled
  - name: Assert virtual host is enabled
    ansible.builtin.assert:
      that:
      - vhost_enabled.stat.exists
      - vhost_enabled.stat.islnk
      fail_msg: Virtual host not enabled
      success_msg: Virtual host is enabled
  - name: Check SSL certificate files exist
    ansible.builtin.stat:
      path: '{{ item }}'
    register: ssl_files
    loop:
    - /tmp/molecule_test/etc/apache2/certs/apache.key
    - /tmp/molecule_test/etc/apache2/certs/apache.csr
    - /tmp/molecule_test/etc/apache2/certs/apache.crt
  - name: Assert SSL certificate files exist
    ansible.builtin.assert:
      that:
      - item.stat.exists
      fail_msg: SSL certificate file {{ item.item }} not found
      success_msg: SSL certificate file {{ item.item }} exists
    loop: '{{ ssl_files.results }}'
  - name: Check website index.html exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/var/www/helloworld/index.html
    register: index_html
  - name: Assert index.html exists
    ansible.builtin.assert:
      that:
      - index_html.stat.exists
      - index_html.stat.size > 0
      fail_msg: Website index.html not found
      success_msg: Website index.html exists
  - name: Get index.html content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/var/www/helloworld/index.html
    register: index_content
  - name: Assert index.html contains expected content
    ansible.builtin.assert:
      that:
      - '''Hello, world!'' in (index_content.content | b64decode)'
      fail_msg: Website content does not contain 'Hello, world!'
      success_msg: Website content contains 'Hello, world!'
  - name: Check SSL configuration file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_conf
  - name: Assert SSL configuration file exists
    ansible.builtin.assert:
      that:
      - ssl_conf.stat.exists
      - ssl_conf.stat.size > 0
      fail_msg: SSL configuration file not found
      success_msg: SSL configuration file exists
  - name: Get SSL configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/apache2/mods-available/ssl.conf
    register: ssl_conf_content
  - name: Assert SSL configuration contains POODLE fix
    ansible.builtin.assert:
      that:
      - '''SSLProtocol -all +TLSv1.2'' in (ssl_conf_content.content | b64decode)'
      fail_msg: SSL configuration does not contain POODLE fix
      success_msg: SSL configuration contains POODLE fix
  - name: Check SSH configuration file exists
    ansible.builtin.stat:
      path: /tmp/molecule_test/etc/ssh/sshd_config
    register: ssh_conf
  - name: Assert SSH configuration file exists
    ansible.builtin.assert:
      that:
      - ssh_conf.stat.exists
      - ssh_conf.stat.size > 0
      fail_msg: SSH configuration file not found
      success_msg: SSH configuration file exists
  - name: Get SSH configuration content
    ansible.builtin.slurp:
      src: /tmp/molecule_test/etc/ssh/sshd_config
    register: ssh_conf_content
  - name: Assert SSH root login is disabled
    ansible.builtin.assert:
      that:
      - '''PermitRootLogin no'' in (ssh_conf_content.content | b64decode)'
      fail_msg: SSH configuration does not disable root login
      success_msg: SSH configuration disables root login
  - name: Check Apache service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert Apache service is running
    ansible.builtin.assert:
      that:
      - '''apache2.service'' in ansible_facts.services'
      - ansible_facts.services['apache2.service'].state == 'running'
      fail_msg: Apache service is not running
      success_msg: Apache service is running
    tags: molecule-notest
  - name: Check SSH service status
    ansible.builtin.service_facts: null
    tags: molecule-notest
  - name: Assert SSH service is running
    ansible.builtin.assert:
      that:
      - '''sshd.service'' in ansible_facts.services'
      - ansible_facts.services['sshd.service'].state == 'running'
      fail_msg: SSH service is not running
      success_msg: SSH service is running
    tags: molecule-notest
  - name: Check HTTPS port is listening
    ansible.builtin.wait_for:
      port: 443
      state: started
      timeout: 5
    tags: molecule-notest
  - name: Check HTTPS website accessibility
    ansible.builtin.uri:
      url: https://localhost/
      validate_certs: false
      return_content: true
    register: website_response
    tags: molecule-notest
  - name: Assert website returns correct content
    ansible.builtin.assert:
      that:
      - website_response.status == 200
      - '''Hello, world!'' in website_response.content'
      fail_msg: Website is not accessible or does not contain expected content
      success_msg: Website is accessible and contains expected content
    tags: molecule-notest
