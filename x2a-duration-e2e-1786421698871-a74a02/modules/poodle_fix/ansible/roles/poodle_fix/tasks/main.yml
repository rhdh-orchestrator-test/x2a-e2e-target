---
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: apache2
    state: present
- name: Ensure SSH server is installed
  ansible.builtin.package:
    name: openssh-server
    state: present
- name: Fix SSL in Apache
  ansible.builtin.replace:
    path: "{{ apache_config_path }}"
    regexp: ^SSLProtocol.*$
    replace: "{{ ssl_protocol_setting }}"
    mode: "0644"
  notify:
    - Restart Apache
    - Restart SSH
