---
# Unsupported pre-flight checks: Git remote/branch/commit output, pip list, service/status
# diagnostics, systemd unit content/properties, ownership listings, endpoint response,
# listening socket/process/journal output, and distribution-specific non-RHEL data paths
# have no stated expected outcome or require deployment-specific interpretation.
- name: Verify FastAPI tutorial deployment
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify required packages on Fedora or RHEL
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required Fedora or RHEL packages are installed
      ansible.builtin.assert:
        that:
          - "'python3' in ansible_facts['packages']"
          - "'python3-pip' in ansible_facts['packages']"
          - "'git' in ansible_facts['packages']"
          - "'postgresql-server' in ansible_facts['packages']"
          - "'postgresql-contrib' in ansible_facts['packages']"
          - "'libpq-devel' in ansible_facts['packages']"
        fail_msg: Fedora or RHEL package pre-flight checks failed.
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Assert required non-Fedora and non-RHEL packages are installed
      ansible.builtin.assert:
        that:
          - "'python3' in ansible_facts['packages']"
          - "'python3-pip' in ansible_facts['packages']"
          - "'python3-venv' in ansible_facts['packages']"
          - "'git' in ansible_facts['packages']"
          - "'postgresql' in ansible_facts['packages']"
          - "'postgresql-contrib' in ansible_facts['packages']"
          - "'libpq-dev' in ansible_facts['packages']"
        fail_msg: Non-Fedora and non-RHEL package pre-flight checks failed.
      when: ansible_facts['os_family'] != 'RedHat'

    - name: Check Git availability
      ansible.builtin.command:
        argv:
          - git
          - --version
      changed_when: false
      register: fastapi_git_version

    - name: Assert Git is available
      ansible.builtin.assert:
        that:
          - fastapi_git_version['rc'] == 0
        fail_msg: Git availability pre-flight check failed.

    - name: Check the FastAPI application directory
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial
      register: fastapi_app_directory

    - name: Assert the FastAPI application directory exists
      ansible.builtin.assert:
        that:
          - fastapi_app_directory['stat']['exists']
          - fastapi_app_directory['stat']['isdir']
        fail_msg: FastAPI application directory pre-flight check failed.

    - name: Check the application requirements file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/requirements.txt
      register: fastapi_requirements_file

    - name: Assert the application requirements file exists
      ansible.builtin.assert:
        that:
          - fastapi_requirements_file['stat']['exists']
          - fastapi_requirements_file['stat']['isreg']
        fail_msg: Application requirements file pre-flight check failed.

    - name: Check the Python virtual environment
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/venv
      register: fastapi_virtualenv

    - name: Assert the Python virtual environment exists
      ansible.builtin.assert:
        that:
          - fastapi_virtualenv['stat']['exists']
          - fastapi_virtualenv['stat']['isdir']
        fail_msg: Python virtual environment pre-flight check failed.

    - name: Check the virtual environment executables
      ansible.builtin.stat:
        path: "{{ item_fastapi_executable['path'] }}"
      loop:
        - path: /opt/fastapi-tutorial/venv/bin/python
        - path: /opt/fastapi-tutorial/venv/bin/pip
        - path: /opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_fastapi_executable

    - name: Assert the virtual environment executables are executable
      ansible.builtin.stat:
        path: "{{ item_fastapi_executable_check['path'] }}"
      loop:
        - path: /opt/fastapi-tutorial/venv/bin/python
        - path: /opt/fastapi-tutorial/venv/bin/pip
        - path: /opt/fastapi-tutorial/venv/bin/uvicorn
      loop_control:
        loop_var: item_fastapi_executable_check
      register: fastapi_executable_checks

    - name: Assert each virtual environment executable passed its check
      ansible.builtin.assert:
        that:
          - item_fastapi_executable_result['stat']['exists']
          - item_fastapi_executable_result['stat']['executable']
        fail_msg: A FastAPI virtual environment executable pre-flight check failed.
      loop: "{{ fastapi_executable_checks['results'] }}"
      loop_control:
        loop_var: item_fastapi_executable_result

    - name: Run the virtual environment dependency check
      ansible.builtin.command:
        argv:
          - /opt/fastapi-tutorial/venv/bin/pip
          - check
      args:
        chdir: /opt/fastapi-tutorial
      changed_when: false
      register: fastapi_pip_check

    - name: Assert Python dependencies pass pip check
      ansible.builtin.assert:
        that:
          - fastapi_pip_check['rc'] == 0
        fail_msg: Python dependency pre-flight check failed.

    - name: Check PostgreSQL service is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - postgresql
      changed_when: false
      register: fastapi_postgresql_enabled

    - name: Check PostgreSQL service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - postgresql
      changed_when: false
      register: fastapi_postgresql_active

    - name: Assert PostgreSQL service state
      ansible.builtin.assert:
        that:
          - fastapi_postgresql_enabled['rc'] == 0
          - fastapi_postgresql_active['rc'] == 0
        fail_msg: PostgreSQL service state pre-flight check failed.

    - name: Check the PostgreSQL role exists
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT 1 FROM pg_roles WHERE rolname='fastapi';
      changed_when: false
      register: fastapi_postgresql_role

    - name: Assert the PostgreSQL role exists
      ansible.builtin.assert:
        that:
          - fastapi_postgresql_role['rc'] == 0
          - "'1' in fastapi_postgresql_role['stdout']"
        fail_msg: PostgreSQL role pre-flight check failed.

    - name: Check the PostgreSQL database exists
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - postgres
          - psql
          - -tAc
          - SELECT 1 FROM pg_database WHERE datname='fastapi_db';
      changed_when: false
      register: fastapi_postgresql_database

    - name: Assert the PostgreSQL database exists
      ansible.builtin.assert:
        that:
          - fastapi_postgresql_database['rc'] == 0
          - "'1' in fastapi_postgresql_database['stdout']"
        fail_msg: PostgreSQL database pre-flight check failed.

    - name: Check the application environment file
      ansible.builtin.stat:
        path: /opt/fastapi-tutorial/.env
      register: fastapi_environment_file

    - name: Assert the application environment file has mode 0644
      ansible.builtin.assert:
        that:
          - fastapi_environment_file['stat']['exists']
          - fastapi_environment_file['stat']['mode'] == '0644'
        fail_msg: Application environment file mode pre-flight check failed.

    - name: Read the application environment file
      ansible.builtin.slurp:
        src: /opt/fastapi-tutorial/.env
      register: fastapi_environment_content

    - name: Assert required application environment settings are present
      ansible.builtin.assert:
        that:
          - "'PROJECT_NAME=\"FastAPI Tutorial\"' in (fastapi_environment_content['content'] | b64decode)"
          - "'API_VERSION=1.0.0' in (fastapi_environment_content['content'] | b64decode)"
          - "'DATABASE_URL=postgresql://fastapi:' in (fastapi_environment_content['content'] | b64decode)"
        fail_msg: Application environment configuration pre-flight check failed.

    - name: Check the FastAPI systemd unit file
      ansible.builtin.stat:
        path: /etc/systemd/system/fastapi-tutorial.service
      register: fastapi_systemd_unit

    - name: Assert the FastAPI systemd unit file has mode 0644
      ansible.builtin.assert:
        that:
          - fastapi_systemd_unit['stat']['exists']
          - fastapi_systemd_unit['stat']['mode'] == '0644'
        fail_msg: FastAPI systemd unit file pre-flight check failed.

    - name: Check FastAPI service is enabled
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - fastapi-tutorial
      changed_when: false
      register: fastapi_service_enabled

    - name: Check FastAPI service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - fastapi-tutorial
      changed_when: false
      register: fastapi_service_active

    - name: Assert FastAPI service state
      ansible.builtin.assert:
        that:
          - fastapi_service_enabled['rc'] == 0
          - fastapi_service_active['rc'] == 0
        fail_msg: FastAPI service state pre-flight check failed.
