---
- name: Create nginx site directories # noqa: R114 - loop contains fixed role-defined nginx site directories
  ansible.builtin.file:
    path: "{{ item_site_dir }}"
    owner: root
    group: root
    mode: "0755"
    state: directory
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
  loop_control:
    loop_var: item_site_dir

- name: Render nginx site configurations # noqa: R114 - site name comes from role-defined nginx_sites configuration
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_site['value']['id'] }} # noqa: R114 - site name comes from role-defined nginx_sites configuration
    mode: "0644"
    backup: true
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Reload nginx
  vars:
    server_name: "{{ item_site['value']['id'] }}"
    document_root: "{{ item_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_site['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_certificate_path }}/{{ item_site['value']['id'] }}.crt"
    key_file: "{{ nginx_multisite_private_key_path }}/{{ item_site['value']['id'] }}.key"

- name: Enable nginx sites
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_site['value']['id'] }}
    dest: /etc/nginx/sites-enabled/{{ item_site['value']['id'] }} # noqa: R114 - site name comes from role-defined nginx_sites configuration
    state: link
    owner: root
    group: root
  loop: "{{ nginx_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Reload nginx

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
