---
controller_credential_types:
  - name: Chef Encrypted Data Bag Site Token
    description: Secret token retrieved from the Chef encrypted data bag nginx_secrets/site and written to /etc/nginx/secrets/site_token.
    kind: cloud
    inputs:
      fields:
        - id: site_token
          type: string
          label: Site Token
          secret: true
          help_text: Sensitive token stored in the nginx_secrets/site encrypted data-bag item and deployed to /etc/nginx/secrets/site_token.
      required:
        - site_token
    injectors:
      extra_vars:
        site_token: !unsafe "{{ site_token }}"
