---
controller_credentials:
  - name: Chef Encrypted Data Bag Site Token - nginx_multisite
    description: Secret token retrieved from the Chef encrypted data bag nginx_secrets/site and written to /etc/nginx/secrets/site_token.
    organization: Default
    credential_type: Chef Encrypted Data Bag Site Token
    update_secrets: true
    inputs:
      site_token: "{{ vault_site_token }}"
