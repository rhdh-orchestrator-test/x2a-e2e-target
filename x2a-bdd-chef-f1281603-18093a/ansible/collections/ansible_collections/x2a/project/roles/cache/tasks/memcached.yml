---
- name: Install Memcached package
  ansible.builtin.package:
    name: memcached
    state: present

- name: Configure Memcached runtime options  # noqa: R101 - command arguments come from trusted role defaults, not user input
  ansible.builtin.command:
    argv:
      - /usr/bin/memcached
      - -d
      - -m
      - "{{ cache_memcached_memory }}"
      - -p
      - "{{ cache_memcached_port }}"
      - -U
      - "{{ cache_memcached_udp_port }}"
      - -l
      - "{{ cache_memcached_listen }}"
      - -c
      - "{{ cache_memcached_maxconn }}"
      - -u
      - "{{ cache_memcached_user }}"
      - -I
      - "{{ cache_memcached_max_object_size }}"
      - -t
      - "{{ cache_memcached_threads }}"
      - -R
      - "{{ cache_memcached_ulimit }}"
    creates: /run/memcached.pid

- name: Configure and start Memcached service
  ansible.builtin.service:
    name: memcached
    state: started
    enabled: true
