---
- name: Validate credential variables
  ansible.builtin.include_tasks: validate_credentials.yml

- name: Install Fedora and RHEL system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - git
      - postgresql-server
      - postgresql-contrib
      - libpq-devel
    state: present
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']

- name: Install Debian-family system packages
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
  when: ansible_facts['os_family'] not in ['RedHat', 'Fedora']

- name: Check whether PostgreSQL is initialized on Fedora and RHEL
  ansible.builtin.stat:
    path: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] in ['RedHat', 'Fedora']
  register: fastapi_postgresql_version

- name: Initialize PostgreSQL on Fedora and RHEL  # noqa: L039 - registered by the preceding stat task
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
  when:
    - ansible_facts['os_family'] in ['RedHat', 'Fedora']
    - not fastapi_postgresql_version.stat.exists

- name: Create the application directory
  ansible.builtin.file:
    path: "{{ fastapi_app_path }}" # noqa: R114 - path is a trusted role default
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize the FastAPI repository  # noqa: R104 - repository URL uses HTTPS from a trusted role default
  ansible.builtin.git:
    repo: "{{ fastapi_repository }}" # noqa: R106 - repository URL comes from a trusted role default
    dest: "{{ fastapi_app_path }}" # noqa: R114 - destination is a trusted role default
    version: "{{ fastapi_revision }}"
    force: false

- name: Create the Python virtual environment  # noqa: R101 - command path comes from a trusted role default
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ fastapi_app_path }}/venv"
    creates: "{{ fastapi_app_path }}/venv" # noqa: R114 - path is derived from a trusted role default

- name: Install Python dependencies  # noqa: R113 - dependency paths come from a trusted role default
  ansible.builtin.pip:
    requirements: "{{ fastapi_app_path }}/requirements.txt" # noqa: R114 - requirements path is derived from a trusted role default
    virtualenv: "{{ fastapi_app_path }}/venv" # noqa: R114 - virtualenv path is derived from a trusted role default
    virtualenv_command: python3 -m venv

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Check whether the PostgreSQL application user exists  # noqa: L039 - credentials are validated role inputs
  ansible.builtin.command:  # noqa: R101 - command is intentionally parameterized with validated credentials
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = '{{ db_username }}';
  become: true  # noqa: R108 - PostgreSQL inspection requires the postgres account
  become_user: postgres
  register: fastapi_postgresql_user
  changed_when: false
  no_log: "{{ fastapi_secure_logging }}"

- name: Create the PostgreSQL application user  # noqa: L039 - validated credentials are required for the database role
  ansible.builtin.command:  # noqa: R101 - command is intentionally parameterized with validated credentials
    argv:
      - psql
      - -c
      - CREATE ROLE {{ db_username }} LOGIN PASSWORD '{{ db_password }}';
  become: true  # noqa: R108 - PostgreSQL administration requires postgres privileges
  become_user: postgres
  when: fastapi_postgresql_user.stdout | trim != '1'
  no_log: "{{ fastapi_secure_logging }}"

- name: Check whether the PostgreSQL application database exists  # noqa: L039 - validated database name is required
  ansible.builtin.command:  # noqa: R101 - command is intentionally parameterized with validated credentials
    argv:
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = '{{ database_name }}';
  become: true  # noqa: R108 - PostgreSQL inspection requires the postgres account
  become_user: postgres
  register: fastapi_postgresql_database
  changed_when: false
  no_log: "{{ fastapi_secure_logging }}"

- name: Create the PostgreSQL application database  # noqa: L039 - validated database credentials are required
  ansible.builtin.command:  # noqa: R101 - command is intentionally parameterized with validated credentials
    argv:
      - psql
      - -c
      - CREATE DATABASE {{ database_name }} OWNER {{ db_username }};
  become: true  # noqa: R108 - PostgreSQL administration requires postgres privileges
  become_user: postgres
  when: fastapi_postgresql_database.stdout | trim != '1'
  no_log: "{{ fastapi_secure_logging }}"

- name: Grant PostgreSQL database privileges  # noqa: L039 - validated database credentials are required
  ansible.builtin.command:  # noqa: R101 - command is intentionally parameterized with validated credentials
    argv:
      - psql
      - -c
      - GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ db_username }};
  become: true  # noqa: R108 - PostgreSQL administration requires postgres privileges
  become_user: postgres
  changed_when: false
  no_log: "{{ fastapi_secure_logging }}"

- name: Deploy the application environment file  # noqa: L039 - database connection values are validated role inputs
  ansible.builtin.copy:
    content: |
      PROJECT_NAME="FastAPI Tutorial"
      API_VERSION=1.0.0
      DATABASE_URL=postgresql://{{ db_username }}:{{ db_password }}@{{ database_host }}/{{ database_name }}
    dest: "{{ fastapi_app_path }}/.env" # noqa: R114 - destination is a trusted role default
    owner: root
    group: root
    mode: "0644"
    backup: true
  no_log: "{{ fastapi_secure_logging }}"

- name: Deploy the FastAPI systemd unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=FastAPI Tutorial Service
      After=network.target postgresql.service
      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ fastapi_app_path }}
      Environment="PATH={{ fastapi_app_path }}/venv/bin"
      ExecStart={{ fastapi_app_path }}/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ fastapi_service_port }}
      Restart=always
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/fastapi-tutorial.service
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload systemd

- name: Enable and start the FastAPI service
  ansible.builtin.systemd:
    name: fastapi-tutorial
    daemon_reload: true
    enabled: true
    state: started
