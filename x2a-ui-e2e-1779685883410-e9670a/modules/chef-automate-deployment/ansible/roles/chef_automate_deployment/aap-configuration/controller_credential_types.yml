---
controller_credential_types:
- name: Chef Admin User
  description: Credential type for Chef Admin User
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: 'Chef admin username (default: jtonello)'
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for the Chef admin user
    - id: full_name
      type: string
      label: Full Name
      help_text: 'Full name for the Chef admin user (default: John Tonello)'
    - id: email
      type: string
      label: Email
      help_text: 'Email address for the Chef admin user (default: jtonello@chef.lab)'
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
      full_name: !unsafe '{{ full_name }}'
      email: !unsafe '{{ email }}'
- name: Chef User Key File
  description: Credential type for Chef User Key File
  kind: cloud
  inputs:
    fields:
    - id: user_key_path
      type: string
      label: User Key Path
      help_text: 'Path where the user key file will be stored (default: jtonello.pem)'
    - id: user_key_content
      type: string
      label: User Key Content
      secret: true
      help_text: Content of the Chef user authentication key file
    required:
    - user_key_path
  injectors:
    extra_vars:
      user_key_path: !unsafe '{{ user_key_path }}'
      user_key_content: !unsafe '{{ user_key_content }}'
- name: Chef Organization Validator
  description: Credential type for Chef Organization Validator
  kind: cloud
  inputs:
    fields:
    - id: org_short_name
      type: string
      label: Organization Short Name
      help_text: 'Short name for the Chef organization (default: lab)'
    - id: org_full_name
      type: string
      label: Organization Full Name
      help_text: 'Full name for the Chef organization (default: Chef Lab)'
    - id: org_validator_path
      type: string
      label: Organization Validator Path
      help_text: 'Path where the organization validator key will be stored (default:
        lab-validator.pem)'
    - id: org_validator_content
      type: string
      label: Organization Validator Content
      secret: true
      help_text: Content of the Chef organization validator key file
    required:
    - org_short_name
    - org_validator_path
  injectors:
    extra_vars:
      org_short_name: !unsafe '{{ org_short_name }}'
      org_full_name: !unsafe '{{ org_full_name }}'
      org_validator_path: !unsafe '{{ org_validator_path }}'
      org_validator_content: !unsafe '{{ org_validator_content }}'
