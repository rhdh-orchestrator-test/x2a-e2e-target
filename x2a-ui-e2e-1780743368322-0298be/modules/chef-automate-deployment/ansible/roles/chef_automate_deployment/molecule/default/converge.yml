- name: Converge
  hosts: all
  gather_facts: true
  vars:
    username: chef-admin
    password: chef-password
    full_name: Chef Administrator
    email: chef-admin@example.com
    chef_automate_hostname: automate.chef.lab
    chef_automate_org_name: lab
    chef_automate_org_full_name: Chef Lab
    chef_automate_user_pem_filename: chef-admin.pem
    chef_automate_org_validator_pem_filename: lab-validator.pem
  tasks:
  - name: Create expected directories
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - /tmp/molecule_test/etc/chef-automate
    - /tmp/molecule_test/etc/opscode
    - /tmp/molecule_test/var/opt/chef-automate
    - /tmp/molecule_test/var/opt/opscode
    - /tmp/molecule_test/tmp
    - /tmp/molecule_test/etc/sysctl.d
  - name: Create Chef Automate config file
    ansible.builtin.copy:
      content: "# Mock Chef Automate config.toml\n[global]\n  v1 = true\n[deployment]\n  automate = true\n  infra_server = true\n[load_balancer]\n  v1 = true\n"
      dest: /tmp/molecule_test/etc/chef-automate/config.toml
      mode: '0644'
  - name: Create Chef Server config files
    ansible.builtin.copy:
      content: '# Mock Chef Server configuration

        chef_server[''api_version''] = "12.0.0"

        server_name = "{{ chef_automate_hostname }}"

        api_fqdn server_name

        '
      dest: /tmp/molecule_test/etc/opscode/chef-server.rb
      mode: '0644'
  - name: Create user PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA1234567890abcdefghijklmnopqrstuvwxyz1234567890

        abcdefghijklmnopqrstuvwxyz1234567890abcdefghijklmnopqrstuvwxyz

        abcdefghijklmnopqrstuvwxyz1234567890abcdefghijklmnopqrstuvwxyz

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_automate_user_pem_filename }}
      mode: '0600'
  - name: Create organization validator PEM file
    ansible.builtin.copy:
      content: '-----BEGIN RSA PRIVATE KEY-----

        MIIEpAIBAAKCAQEA0987654321zyxwvutsrqponmlkjihgfedcba0987654321

        zyxwvutsrqponmlkjihgfedcba0987654321zyxwvutsrqponmlkjihgfedcba

        zyxwvutsrqponmlkjihgfedcba0987654321zyxwvutsrqponmlkjihgfedcba

        -----END RSA PRIVATE KEY-----

        '
      dest: /tmp/molecule_test/{{ chef_automate_org_validator_pem_filename }}
      mode: '0600'
  - name: Create mock Chef Automate CLI
    ansible.builtin.copy:
      content: '#!/bin/bash

        echo "Chef Automate CLI mock"

        echo "This is a mock of the chef-automate command for testing"

        exit 0

        '
      dest: /tmp/molecule_test/chef-automate
      mode: '0755'
  - name: Create mock sysctl configuration
    ansible.builtin.copy:
      content: '# Mock sysctl configuration

        vm.max_map_count = 262144

        vm.dirty_expire_centisecs = 20000

        '
      dest: /tmp/molecule_test/etc/sysctl.d/99-chef-automate.conf
      mode: '0644'
  - name: Create mock user list file
    ansible.builtin.copy:
      content: 'chef-admin

        '
      dest: /tmp/molecule_test/etc/opscode/users.txt
      mode: '0644'
  - name: Create mock organization list file
    ansible.builtin.copy:
      content: 'lab

        '
      dest: /tmp/molecule_test/etc/opscode/orgs.txt
      mode: '0644'
