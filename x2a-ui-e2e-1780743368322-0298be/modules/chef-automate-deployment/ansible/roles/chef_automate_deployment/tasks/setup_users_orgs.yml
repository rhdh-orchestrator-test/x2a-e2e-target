---
- name: Ensure directory for PEM files exists
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ chef_automate_user_pem_filename }}"
    - "{{ chef_automate_org_validator_pem_filename }}"
  when: item | dirname != "."
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create {{ username }} "{{ full_name }}" {{ email }} "{{ password }}" --filename {{ chef_automate_user_pem_filename }}

      '
  become: true
  args:
    creates: "{{ chef_automate_user_pem_filename }}"
  register: user_create_result
  no_log: true
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create {{ chef_automate_org_name }} "{{ chef_automate_org_full_name }}" --association_user {{ username }} --filename {{ chef_automate_org_validator_pem_filename
      }}

      '
  become: true
  args:
    creates: "{{ chef_automate_org_validator_pem_filename }}"
  register: org_create_result
- name: Set permissions on user PEM file
  ansible.builtin.file:
    path: "{{ chef_automate_user_pem_filename }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  when: user_create_result.changed
- name: Set permissions on organization validator PEM file
  ansible.builtin.file:
    path: "{{ chef_automate_org_validator_pem_filename }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  when: org_create_result.changed
