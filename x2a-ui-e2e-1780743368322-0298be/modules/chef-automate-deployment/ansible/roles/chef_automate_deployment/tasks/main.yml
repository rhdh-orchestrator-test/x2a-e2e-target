---
- name: Validate credential variables
  ansible.builtin.include_tasks:
    file: validate_credentials.yml
- name: Configure system for Chef Automate
  ansible.builtin.include_tasks:
    file: system_config.yml
- name: Install Chef Automate with Infra Server
  ansible.builtin.include_tasks:
    file: install_automate.yml
  when: chef_automate_deploy_automate and chef_automate_deploy_infra_server
- name: Install Chef Infra Server only
  ansible.builtin.include_tasks:
    file: install_chef_server.yml
  when: chef_automate_deploy_infra_server and not chef_automate_deploy_automate
- name: Set up Chef users and organizations
  ansible.builtin.include_tasks:
    file: setup_users_orgs.yml
