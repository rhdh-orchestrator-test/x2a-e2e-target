---
- name: Ensure chef-server-ctl is available
  ansible.builtin.stat:
    path: /usr/bin/chef-server-ctl
  register: chef_server_ctl
  become: true
- name: Create Chef user
  ansible.builtin.command:
    cmd: 'chef-server-ctl user-create  {{ username | default(chef_automate_username) }}  {{ full_name | default(chef_automate_longusername) }}  {{ email | default(chef_automate_useremail)
      }}  "{{ password | default(chef_automate_userpassword) }}"  --filename {{ chef_automate_userfilename }}

      '
  args:
    creates: "{{ chef_automate_userfilename }}"
  become: true
  no_log: true
  when: chef_server_ctl.stat.exists
- name: Set proper permissions on user key file
  ansible.builtin.file:
    path: "{{ chef_automate_userfilename }}"
    mode: "0600"
    state: file
  when: chef_server_ctl.stat.exists
- name: Create Chef organization
  ansible.builtin.command:
    cmd: 'chef-server-ctl org-create  {{ chef_automate_orgname }}  "{{ chef_automate_longorgname }}"  --association_user {{ username | default(chef_automate_username)
      }}  --filename {{ chef_automate_orgfilename }}

      '
  args:
    creates: "{{ chef_automate_orgfilename }}"
  become: true
  when: chef_server_ctl.stat.exists
- name: Set proper permissions on organization key file
  ansible.builtin.file:
    path: "{{ chef_automate_orgfilename }}"
    mode: "0600"
    state: file
  when: chef_server_ctl.stat.exists
