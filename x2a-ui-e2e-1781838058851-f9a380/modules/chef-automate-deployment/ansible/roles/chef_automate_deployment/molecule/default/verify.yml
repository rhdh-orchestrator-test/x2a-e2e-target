---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # System configuration checks
    - name: Check hostname file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/hostname
      register: hostname_file

    - name: Assert hostname file was created
      ansible.builtin.assert:
        that:
          - hostname_file.stat.exists
          - hostname_file.stat.isreg
        fail_msg: "Hostname file not found"
        success_msg: "Hostname file exists"

    - name: Get hostname content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/hostname
      register: hostname_content
      when: hostname_file.stat.exists

    - name: Assert hostname is set correctly
      ansible.builtin.assert:
        that:
          - (hostname_content.content | b64decode | trim) == (chef_automate_hostname | default('automate.chef.lab'))
        fail_msg: "Hostname not set correctly"
        success_msg: "Hostname set correctly"
      when: hostname_file.stat.exists

    # Sysctl configuration checks
    - name: Check sysctl configuration files exist
      ansible.builtin.stat:
        path: "/tmp/molecule_test/etc/sysctl.d/{{ item.file }}"
      register: sysctl_files
      loop:
        - file: vm-max-map-count.conf
          param: vm.max_map_count
          value: "{{ chef_automate_vm_max_map_count | default(262144) }}"
        - file: vm-dirty-expire-centisecs.conf
          param: vm.dirty_expire_centisecs
          value: "{{ chef_automate_vm_dirty_expire_centisecs | default(20000) }}"
      loop_control:
        label: "{{ item.file }}"

    - name: Assert sysctl files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Sysctl file {{ item.item.file }} not found"
        success_msg: "Sysctl file {{ item.item.file }} exists"
      loop: "{{ sysctl_files.results }}"
      loop_control:
        label: "{{ item.item.file }}"

    # Chef Automate configuration checks
    - name: Check Chef Automate config file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/chef-automate/config.toml
      register: automate_config

    - name: Assert Chef Automate config file exists
      ansible.builtin.assert:
        that:
          - automate_config.stat.exists
          - automate_config.stat.isreg
        fail_msg: "Chef Automate config file not found"
        success_msg: "Chef Automate config file exists"

    # User and organization key checks
    - name: Check user key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_automate_userfilename | default('jtonello.pem') }}"
      register: user_key_file

    - name: Assert user key file exists
      ansible.builtin.assert:
        that:
          - user_key_file.stat.exists
          - user_key_file.stat.isreg
          - user_key_file.stat.mode == '0600'
        fail_msg: "User key file not found or has incorrect permissions"
        success_msg: "User key file exists with correct permissions"

    - name: Check organization validator key file exists
      ansible.builtin.stat:
        path: "/tmp/molecule_test/{{ chef_automate_orgfilename | default('lab-validator.pem') }}"
      register: org_key_file

    - name: Assert organization validator key file exists
      ansible.builtin.assert:
        that:
          - org_key_file.stat.exists
          - org_key_file.stat.isreg
          - org_key_file.stat.mode == '0600'
        fail_msg: "Organization validator key file not found or has incorrect permissions"
        success_msg: "Organization validator key file exists with correct permissions"

    # Chef server user and organization list checks
    - name: Check Chef server user list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef/user-list.txt
      register: user_list_file

    - name: Assert Chef server user list file exists
      ansible.builtin.assert:
        that:
          - user_list_file.stat.exists
          - user_list_file.stat.isreg
        fail_msg: "Chef server user list file not found"
        success_msg: "Chef server user list file exists"

    - name: Get user list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef/user-list.txt
      register: user_list_content
      when: user_list_file.stat.exists

    - name: Assert user list contains expected user
      ansible.builtin.assert:
        that:
          - (user_list_content.content | b64decode) is search(chef_automate_username | default('jtonello'))
        fail_msg: "User list does not contain expected user"
        success_msg: "User list contains expected user"
      when: user_list_file.stat.exists

    - name: Check Chef server organization list file exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/var/opt/chef/org-list.txt
      register: org_list_file

    - name: Assert Chef server organization list file exists
      ansible.builtin.assert:
        that:
          - org_list_file.stat.exists
          - org_list_file.stat.isreg
        fail_msg: "Chef server organization list file not found"
        success_msg: "Chef server organization list file exists"

    - name: Get organization list content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/var/opt/chef/org-list.txt
      register: org_list_content
      when: org_list_file.stat.exists

    - name: Assert organization list contains expected organization
      ansible.builtin.assert:
        that:
          - (org_list_content.content | b64decode) is search(chef_automate_orgname | default('lab'))
        fail_msg: "Organization list does not contain expected organization"
        success_msg: "Organization list contains expected organization"
      when: org_list_file.stat.exists

    # Service status checks (tagged to skip in container)
    - name: Check Chef Automate status
      ansible.builtin.command:
        cmd: sudo chef-automate status
      register: automate_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate is running
      ansible.builtin.assert:
        that:
          - automate_status.rc == 0
        fail_msg: "Chef Automate is not running"
        success_msg: "Chef Automate is running"
      tags: molecule-notest

    - name: Check Chef Infra Server status
      ansible.builtin.command:
        cmd: sudo chef-server-ctl status
      register: chef_server_status
      changed_when: false
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Infra Server is running
      ansible.builtin.assert:
        that:
          - chef_server_status.rc == 0
        fail_msg: "Chef Infra Server is not running"
        success_msg: "Chef Infra Server is running"
      tags: molecule-notest

    # Network checks (tagged to skip in container)
    - name: Check if port 443 is listening
      ansible.builtin.wait_for:
        port: 443
        state: started
        timeout: 5
      register: port_check
      failed_when: false
      tags: molecule-notest

    - name: Assert port 443 is listening
      ansible.builtin.assert:
        that:
          - port_check is succeeded
        fail_msg: "Port 443 is not listening"
        success_msg: "Port 443 is listening"
      tags: molecule-notest

    - name: Check Chef Automate web UI
      ansible.builtin.uri:
        url: https://localhost
        validate_certs: false
        status_code: 200
      register: web_check
      failed_when: false
      tags: molecule-notest

    - name: Assert Chef Automate web UI is accessible
      ansible.builtin.assert:
        that:
          - web_check is succeeded
        fail_msg: "Chef Automate web UI is not accessible"
        success_msg: "Chef Automate web UI is accessible"
      tags: molecule-notest