---
- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Create expected directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/molecule_test/etc
        - /tmp/molecule_test/etc/chef-automate
        - /tmp/molecule_test/etc/sysctl.d
        - /tmp/molecule_test/var/opt/chef-automate
        - /tmp/molecule_test/var/opt/chef

    - name: Create mock hostname file
      ansible.builtin.copy:
        content: "{{ chef_automate_hostname | default('automate.chef.lab') }}"
        dest: "/tmp/molecule_test/etc/hostname"
        mode: "0644"

    - name: Create mock sysctl configuration files
      ansible.builtin.copy:
        content: "{{ item.name }} = {{ item.value }}"
        dest: "/tmp/molecule_test/etc/sysctl.d/{{ item.name | replace('.', '-') }}.conf"
        mode: "0644"
      loop:
        - name: vm.max_map_count
          value: "{{ chef_automate_vm_max_map_count | default(262144) }}"
        - name: vm.dirty_expire_centisecs
          value: "{{ chef_automate_vm_dirty_expire_centisecs | default(20000) }}"

    - name: Create mock Chef Automate config file
      ansible.builtin.copy:
        content: |
          # Mock Chef Automate config file
          [global]
            v1 = true
          [deployment]
            hostname = "{{ chef_automate_hostname | default('automate.chef.lab') }}"
          [products]
            automate = true
            infra-server = true
        dest: "/tmp/molecule_test/etc/chef-automate/config.toml"
        mode: "0644"

    - name: Create mock Chef Automate CLI binary
      ansible.builtin.copy:
        content: "#!/bin/sh\necho 'Mock Chef Automate CLI'\n"
        dest: "/tmp/molecule_test/var/opt/chef-automate/chef-automate"
        mode: "0755"

    - name: Create mock user key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAv8MoCXIYiZ0Sx5A9LC5m5M7zt5gQxPft1Mr5meGX33fT5XF/
          MOCK_KEY_CONTENT_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/{{ chef_automate_userfilename | default('jtonello.pem') }}"
        mode: "0600"

    - name: Create mock organization validator key file
      ansible.builtin.copy:
        content: |
          -----BEGIN RSA PRIVATE KEY-----
          MIIEpAIBAAKCAQEAv8MoCXIYiZ0Sx5A9LC5m5M7zt5gQxPft1Mr5meGX33fT5XF/
          MOCK_ORG_VALIDATOR_KEY_CONTENT_FOR_TESTING_ONLY
          -----END RSA PRIVATE KEY-----
        dest: "/tmp/molecule_test/{{ chef_automate_orgfilename | default('lab-validator.pem') }}"
        mode: "0600"

    - name: Create mock Chef server user list output
      ansible.builtin.copy:
        content: |
          User name: {{ chef_automate_username | default('jtonello') }}
          Display name: {{ chef_automate_longusername | default('John Tonello') }}
          Email: {{ chef_automate_useremail | default('jtonello@chef.lab') }}
        dest: "/tmp/molecule_test/var/opt/chef/user-list.txt"
        mode: "0644"

    - name: Create mock Chef server organization list output
      ansible.builtin.copy:
        content: |
          Organization name: {{ chef_automate_orgname | default('lab') }}
          Full name: {{ chef_automate_longorgname | default('Chef Lab') }}
        dest: "/tmp/molecule_test/var/opt/chef/org-list.txt"
        mode: "0644"