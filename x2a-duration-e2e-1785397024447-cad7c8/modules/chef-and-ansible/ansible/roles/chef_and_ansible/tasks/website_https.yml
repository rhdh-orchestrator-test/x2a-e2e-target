---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true
- name: Install necessary packages
  ansible.builtin.apt:
    name: apache2={{ apache_version }}
  become: true
- name: Install curl, openssl, PyOpenSSL
  ansible.builtin.apt:
    pkg:
      - curl
      - openssl
      - python3-openssl
  become: true
- name: Create a directory for certs
  ansible.builtin.file:
    path: "{{ ssl_cert_dir }}"
    state: directory
    mode: "0640"
  become: true
- name: Generate an openssl key
  community.crypto.openssl_privatekey:
    path: "{{ ssl_key_path }}"
  become: true
- name: Generate an openssl csr
  community.crypto.openssl_csr:
    path: "{{ ssl_csr_path }}"
    privatekey_path: "{{ ssl_key_path }}"
    common_name: myhost
  become: true
- name: Generate a self-signed openssl certificate
  community.crypto.x509_certificate:
    path: "{{ ssl_cert_path }}"
    privatekey_path: "{{ ssl_key_path }}"
    csr_path: "{{ ssl_csr_path }}"
    provider: selfsigned
  become: true
- name: Configure Hello World virtual host
  ansible.builtin.copy:
    content: "{{ vhost_config }}"
    dest: "{{ vhost_conf_path }}"
    mode: "0640"
    force: true
  become: true
- name: Create the helloworld directory
  ansible.builtin.file:
    path: "{{ website_root }}"
    state: directory
    mode: "0755"
  become: true
- name: Deploy the Hello World website
  ansible.builtin.copy:
    content: "{{ website_html }}"
    dest: "{{ website_root }}/index.html"
    owner: "{{ website_owner }}"
    group: "{{ website_group }}"
    mode: "{{ website_mode }}"
    force: true
  become: true
- name: Check if default site is enabled
  ansible.builtin.stat:
    path: /etc/apache2/sites-enabled/000-default.conf
  register: default_site
  become: true
- name: Deactivate the default virtualhost
  ansible.builtin.command:
    cmd: a2dissite 000-default
  when: default_site.stat.exists
  notify:
    - Restart apache2
  become: true
- name: Check if virtualhost is enabled
  ansible.builtin.stat:
    path: /etc/apache2/sites-enabled/{{ vhost_name }}.conf
  register: vhost_enabled
  become: true
- name: Activate the virtualhost
  ansible.builtin.command:
    cmd: a2ensite {{ vhost_name }}
  when: not vhost_enabled.stat.exists
  notify:
    - Restart apache2
  become: true
- name: Check if SSL module is enabled
  ansible.builtin.stat:
    path: /etc/apache2/mods-enabled/ssl.load
  register: ssl_enabled
  become: true
- name: Activate SSL on Apache
  ansible.builtin.command:
    cmd: a2enmod ssl
  when: not ssl_enabled.stat.exists
  notify:
    - Restart apache2
  become: true
